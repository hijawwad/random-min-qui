<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NABARD Grade A — Agronomy & Field Crops Practice Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0e1117; --panel:#161b24; --panel2:#1c2230; --border:#2a3346;
    --text:#e6e9ef; --muted:#8b93a7; --accent:#4f8cff; --accent2:#7c5cff;
    --green:#22c55e; --red:#ef4444; --amber:#f5b942; --easy:#22c55e; --mod:#f5b942; --hard:#ef4444;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% -10%,#1a2136,var(--bg) 60%);color:var(--text);min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px;}
  h1{font-size:1.35rem;margin:0 0 4px;letter-spacing:.3px;}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:22px;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.35);}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:white;padding:12px 18px;border-radius:10px;font-size:.95rem;cursor:pointer;font-weight:600;transition:transform .1s, opacity .15s;}
  .btn:hover{opacity:.92;}
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px;}
  .topic{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;}
  .topic:hover{border-color:var(--accent);transform:translateY(-2px);}
  .topic h3{margin:0 0 6px;font-size:.92rem;}
  .topic span{color:var(--muted);font-size:.78rem;}
  .toggle-group{display:flex;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;}
  .toggle-group button{flex:1;background:transparent;border:none;color:var(--muted);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;}
  .toggle-group button.active{background:var(--accent);color:white;}
  .progress-wrap{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:10px 0 16px;border:1px solid var(--border);}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s;}
  .meta-row{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:6px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.3px;}
  .badge.Easy{background:rgba(34,197,94,.15);color:var(--easy);}
  .badge.Moderate{background:rgba(245,185,66,.15);color:var(--mod);}
  .badge.Hard{background:rgba(239,68,68,.15);color:var(--hard);}
  .qtext{font-size:1.03rem;line-height:1.5;margin:10px 0 16px;white-space:pre-line;}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;margin-bottom:9px;cursor:pointer;font-size:.92rem;transition:.12s;line-height:1.4;}
  .opt:hover{border-color:var(--accent);}
  .opt.correct{background:rgba(34,197,94,.18);border-color:var(--green);}
  .opt.wrong{background:rgba(239,68,68,.18);border-color:var(--red);}
  .opt.disabled{cursor:default;}
  .opt b{color:var(--accent);margin-right:8px;}
  .explain{background:var(--panel2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;font-size:.87rem;color:var(--muted);margin-top:6px;display:none;}
  .footer-nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
  .score-pill{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.82rem;font-weight:700;color:var(--accent);}
  .center{text-align:center;}
  .hidden{display:none !important;}
  .statlist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
  .stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .stat .num{font-size:1.4rem;font-weight:800;}
  .review-item{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:.87rem;}
  .review-item.skipped{border-left-color:var(--amber);}
  .review-item .q{font-weight:600;margin-bottom:6px;}
  .review-item .ans{color:var(--green);}
  .review-item .yours{color:var(--red);}
  a.link, .backlink{color:var(--accent);cursor:pointer;text-decoration:none;font-size:.85rem;}
  .flexbetween{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  ::selection{background:var(--accent2);}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;}
  label.cb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ QUESTION BANK ============
   Each question: correct answer authored at options[0].
   Renderer rotates options deterministically per-question so the
   correct letter cycles evenly across A-E over the whole bank. */
const RAW = [];
function Q(section, diff, text, opts, exp, type){
  RAW.push({section, diff, text, opts, exp, type: type||"single"});
}
const MS = "Consider the following statements:\n";
const MSQ = "\nHow many of the above statements are correct?";
const MSOPT = ["Only one","Only two","Only three","All four","None of the above are correct"];

/* ---------------- SECTION 1: Agronomy Basics ---------------- */
Q("Agronomy Basics","Easy","The word 'Agronomy' is derived from the Greek words 'agros' and 'nomos', which respectively mean:",
["Field and Management","Soil and Water","Crop and Harvest","Land and Law","Farm and Machine"],
"'Agros' = field, 'nomos' = management.");
Q("Agronomy Basics","Moderate","Who defined Agronomy as 'the science of manipulating the crop environment complex with dual aims of improving agricultural productivity and gaining a degree of understanding of the process involved'?",
["Norman Borlaug (1980)","Jethro Tull","Pietro de'Crescenzi","M.S. Swaminathan","Blackman"],
"This definition of Agronomy was given by Norman Borlaug in 1980.");
Q("Agronomy Basics","Easy","Which of the following is NOT one of the three branches of Agronomy?",
["Genetics","Crop Science","Soil Science","Environmental Science","(All are branches)"],
"The three branches are Crop Science, Soil Science, and Environmental Science.");
Q("Agronomy Basics","Moderate",MS+"I. Agronomy has four major dimensions.\nII. The Physical dimension includes soil, water, nutrients, and solar radiation.\nIII. The Economic dimension includes food, nutrition and health.\nIV. The Social dimension includes farm structure and land ownership."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statement III and IV are swapped — Economic dimension covers farm structure/ownership/markets; Social dimension covers food/nutrition/health. Only I and II are correct.",
"multi");
Q("Agronomy Basics","Hard","Who is regarded as the 'Father of Agronomy'?",
["Pietro de'Crescenzi","Jethro Tull","Norman Borlaug","Justus von Liebig","Charles Darwin"],
"Pietro de'Crescenzi is the father of Agronomy.");
Q("Agronomy Basics","Moderate","The central theme of Agronomy is best described as:",
["Soil-Crop-Environment relationship","Seed-Water-Fertilizer relationship","Farmer-Market-Policy relationship","Plant-Pest-Pesticide relationship","Climate-Yield-Price relationship"],
"The central theme of agronomy is the Soil-Crop-Environment relationship.");
Q("Agronomy Basics","Easy","Which of the following is NOT listed as part of the Scope of Agronomy in the text?",
["Genetic engineering of crop DNA","Identification of proper season for cultivation","Availability of herbicides for weed control","Water management practices","Intensive cropping"],
"Scope of Agronomy covers season identification, cultivation methods, fertilizers, herbicides, water management and intensive cropping — not DNA engineering.");
Q("Agronomy Basics","Easy","A 'crop' is best defined as:",
["A plant that can be grown and harvested for profit or subsistence","Any wild plant growing in a forest","A plant that only grows in irrigated land","A genetically modified plant species","A plant used exclusively for ornamental purposes"],
"Crop = plant grown and harvested for profit or subsistence.");
Q("Agronomy Basics","Moderate","A Field crop is defined as a crop, other than fruits or vegetables, that is:",
["Grown for agricultural purposes on a large scale","Grown only in glasshouses","Grown exclusively for export","Grown only using organic methods","Grown only in hilly terrain"],
"Field crop = crop (other than fruits/vegetables) grown for agricultural purposes on a large scale.");
Q("Agronomy Basics","Moderate",MS+"I. Agronomy is a synthesis of disciplines such as soil science, agricultural chemistry, crop physiology, plant ecology, biochemistry and economics.\nII. Crop Science as a branch of Agronomy deals only with field crops.\nIII. The Biological dimension of Agronomy includes crops, forests and vegetation.\nIV. Cotton, Cereal and Pulses are examples of field crops."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"All four statements are directly supported by the text.",
"multi");

/* ---------------- SECTION 2: Field Crops Classification ---------------- */
Q("Field Crops Classification","Easy","A cereal is generally defined as a cultivated grass grown for:",
["Their edible starchy grains","Their fibrous stems","Their oil-rich seeds","Their nitrogen-fixing roots","Their aromatic leaves"],
"Cereal = cultivated grass grown for edible starchy grains.");
Q("Field Crops Classification","Moderate","Cereal crops are divided into two types:",
["Major Cereal Crops and Millets","Kharif Cereals and Rabi Cereals","Tropical Cereals and Temperate Cereals","Wet Cereals and Dry Cereals","Hybrid Cereals and Native Cereals"],
"Cereals are divided into Major Cereal Crops and Millets.");
Q("Field Crops Classification","Hard","Which of the following is classified as a Minor Millet in the document?",
["Kodo millet (Paspalum scrobiculatum)","Sorghum/Jowar (Sorghum bicolor)","Bajra/Pearl millet (Pennisetum typhoides)","Ragi/Finger millet (Eleusine corcana)","Wheat (Triticum aestivum)"],
"Kodo millet is a Minor Millet; Jowar, Bajra and Ragi are Major Millets.");
Q("Field Crops Classification","Easy","Which of the following is NOT correct regarding Major Millets?",
["They are grown mostly for fodder use on residual moisture","They are found in abundance and grown in large quantities","They are easy to grow","Proper irrigation is essential for growing them","Examples include Jowar, Bajra and Ragi"],
"Growing mostly for fodder on residual moisture describes Minor Millets, not Major Millets.");
Q("Field Crops Classification","Moderate","The word 'legume' is derived from the Latin word 'legere', meaning:",
["To gather","To grow","To flower","To fix nitrogen","To sow"],
"'Legere' in Latin means 'to gather'.");
Q("Field Crops Classification","Moderate","Pulses help maintain soil fertility mainly because of their unique built-in ability to:",
["Fix atmospheric nitrogen in their root system","Absorb excess soil salinity","Retain soil moisture for longer periods","Produce natural herbicides","Increase soil pH rapidly"],
"Pulses fix atmospheric nitrogen through their root system.");
Q("Field Crops Classification","Hard","Pulse crops are classified into three types based on the document. Which of the following is one of them?",
["Beans","Cereals","Fibres","Millets","Spices"],
"Pulses are classified as Grams, Beans, and Peas.");
Q("Field Crops Classification","Hard","The scientific name Macrotyloma uniflorum corresponds to which pulse crop?",
["Horse gram","Black gram/Urad","Green gram/Mung","Bengal gram/Chickpea","Red gram/Pigeon pea"],
"Macrotyloma uniflorum = Horse gram.");
Q("Field Crops Classification","Moderate","Which of the following pulse crops falls under the 'Peas' category rather than 'Grams' or 'Beans'?",
["Cowpea (Vigna unguiculata)","Soybean (Glycine max)","Black gram (Phaseolus mungo)","Red gram (Cajanus cajan)","Horse gram (Macrotyloma uniflorum)"],
"Pea (Pisum sativum) and Cowpea fall under the 'Peas' category.");
Q("Field Crops Classification","Easy","Oil seed crops are broadly divided into:",
["Edible and Non-edible oil seed crops","Major and Minor oil seed crops","Annual and Perennial oil seed crops","Tropical and Temperate oil seed crops","Kharif and Rabi oil seed crops"],
"Oil seed crops are of 2 types: Edible and Non-edible.");
Q("Field Crops Classification","Moderate","Which of the following is a Non-Edible Oil Seed Crop as per the document?",
["Karanja (Pongamia pinnata)","Groundnut (Arachis hypogaea)","Soybean (Glysine max)","Sunflower (Helianthus annus)","Safflower (Carthamus tinctorius)"],
"Karanja, Mahua, and Castor are non-edible oil seed crops.");
Q("Field Crops Classification","Hard","Which of the following statements about Fibre Crops is NOT correct?",
["Fibre crops are classified into 2 types based on the part of plant used","Cotton and Silk cotton are examples of Fruit Fibres","Jute, Mesta and Linseed are examples of Stem/Stalk/Bast Fibres","Sisal and Manila hemp are examples of Leaf/Hard Fibres","Fibres are mainly used for clothing, rope making and carpet making"],
"Fibre crops are classified into 3 types (Fruit, Stem/Stalk/Bast, Leaf/Hard fibres), not 2.");
Q("Field Crops Classification","Moderate","In commercial crops, what minimum percentage of the product must be intended for trade (not home consumption)?",
["More than 75 per cent","More than 50 per cent","More than 90 per cent","More than 60 per cent","More than 40 per cent"],
"In commercial crops, more than 75% of the product is for trade.");
Q("Field Crops Classification","Easy","Forage crops refer to vegetative matter used as feed for animals, and include:",
["Fodder, hay, silage and pastures","Only grains stored for cattle","Only green manure crops","Only leguminous trees","Only aromatic plants"],
"Forage crops include fodder, hay, silage, and pastures.");
Q("Field Crops Classification","Hard","Silage crops such as corn, legumes and grasses are harvested at early maturity, finely chopped, and stored to exclude air in:",
["Tower silos, pits or trenches","Open fields under sunlight","Cold storage warehouses","Underground wells","Ventilated barns"],
"Silage crops are packed tightly to exclude air and stored in tower silos, pits, or trenches.");
Q("Field Crops Classification","Moderate","Green manure crops such as Sunnhemp (Crotalaria juncea) are grown mainly to:",
["Incorporate plant tissue into the soil to improve soil productivity","Provide fibre for clothing","Provide oil for cooking","Serve as a staple food grain","Act as a border/guard crop only"],
"Green manure crops are used for incorporating plant tissue into the soil to improve productivity.");
Q("Field Crops Classification","Easy","Ginger (Zingiber officinale) and Garlic (Allium sativum) are examples of which category of field crops?",
["Spices and Condiment Crops","Green Manure Crops","Fibre Crops","Forage Crops","Oil Seed Crops"],
"Ginger and Garlic are Spices and Condiment crops.");
Q("Field Crops Classification","Hard",MS+"I. Sugarcane (Saccharum officinarum) is classified as both a Sugar crop and a Commercial crop.\nII. Cotton (Gossypium hirsutum) is classified as a Fibre crop and a Commercial crop.\nIII. All minor millets require proper irrigation and are grown in large quantities.\nIV. Karanja, Mahua and Castor seeds are examples of non-edible oil seed crops."+MSQ,
["Only three","Only one","Only two","All four","None of the above are correct"],
"Statement III is incorrect (that describes Major Millets, and minor millets grow on residual moisture). I, II and IV are correct.",
"multi");
Q("Field Crops Classification","Moderate","Which of the following is the correct scientific name for Cotton as given in the document?",
["Gossypium hirsutum","Corchorus capsularis","Hibiscus cannabinus","Linum usitatisamum","Agave sisalana"],
"Cotton = Gossypium hirsutum.");
Q("Field Crops Classification","Hard","Which of these is NOT correct about the classification of Field Crops based on use of plants and products?",
["Spices and Condiment crops are considered a type of Cereal crop","Cereal crops are grown for edible starchy grains","Fibre crops are grown for extraction of fibres","Sugar crops are grown to produce sugars and starch","Forage crops refer to vegetative matter used as animal feed"],
"Spices/Condiment crops are a separate category, not a subtype of Cereal crops.");

/* ---------------- SECTION 3: Ontogeny & Season ---------------- */
Q("Ontogeny & Season","Easy","Based on lifecycle (Ontogeny), field crops are classified into how many types?",
["Three","Two","Four","Five","Six"],
"Three types: Annual, Biennial, and Perennial crops.");
Q("Ontogeny & Season","Moderate","Which of the following best describes a Biennial crop?",
["A plant with a life span of two consecutive seasons or years","A plant that completes its life cycle within one season","A plant that lives for three or more years","A plant that never produces seeds","A plant grown only in the Rabi season"],
"Biennial crops have a life span of two consecutive seasons/years.");
Q("Ontogeny & Season","Hard","In Biennial crops, during the first year/season the plant typically shows:",
["Purely vegetative growth confined to a rosette of leaves","Full flowering and seed setting","Complete death after harvest","Only root decay","Rapid stem elongation and flowering"],
"First year: purely vegetative growth, rosette of leaves, fleshy taproot storing food.");
Q("Ontogeny & Season","Easy","Sugar beet (Beta vulgaris) is given as an example of which ontogeny-based crop class?",
["Biennial crop","Annual crop","Perennial crop","Ephemeral crop","Semi-perennial crop"],
"Sugar beet is the example given for biennial crops.");
Q("Ontogeny & Season","Moderate","Napier fodder grass (Pennisetum purpureum) and Coconut (Cocos nucifera) are examples of:",
["Perennial crops","Annual crops","Biennial crops","Kharif crops","Rabi crops"],
"Both are examples of perennial crops (live 3+ years).");
Q("Ontogeny & Season","Moderate","According to the season-based classification, Kharif crop sowing generally happens in:",
["June - July","October - November","February - March","December - January","April - May"],
"Kharif sowing season: June-July.");
Q("Ontogeny & Season","Moderate","Rabi crops require which type of weather during their major period of growth?",
["Cold and dry weather","Warm and wet weather","Hot and humid weather","Cold and wet weather","Warm and dry weather with shorter days"],
"Rabi crops require cold dry weather and longer day length for flowering.");
Q("Ontogeny & Season","Hard","Which of the following is NOT correct about Kharif crops?",
["They require longer day length for flowering","Sowing season is June-July","Harvesting season is September-October","They require warm wet weather during major growth period","Rice, maize, castor and groundnut are examples"],
"Kharif crops require SHORTER day length for flowering, not longer.");
Q("Ontogeny & Season","Easy","Which of the following crops is listed as a Summer/Zaid crop?",
["Watermelon","Wheat","Barley","Rice","Bengal gram"],
"Zaid crop examples include watermelon, musk melon, cucumber, and seasonal vegetables.");
Q("Ontogeny & Season","Hard",MS+"I. Classification of field crops based on season is considered a universal classification.\nII. Kharif crops require shorter day length for flowering.\nIII. Rabi harvesting season is March-April.\nIV. Summer/Zaid sowing season is February-March."+MSQ,
["Only three","Only one","Only two","All four","None of the above are correct"],
"Statement I is false — the text explicitly says the seasonal classification is NOT a universal one. II, III, IV are correct.",
"multi");

/* ---------------- SECTION 4: Pollination & Root Systems ---------------- */
Q("Pollination & Root Systems","Easy","Pollination by wind is scientifically termed as:",
["Anemophily","Hydrophily","Zoophily","Entomophily","Autogamy"],
"Wind pollination = Anemophily.");
Q("Pollination & Root Systems","Easy","Pollination by water is scientifically termed as:",
["Hydrophily","Anemophily","Zoophily","Entomophily","Xenogamy"],
"Water pollination = Hydrophily.");
Q("Pollination & Root Systems","Moderate","Pollination carried out by insects is termed:",
["Entomophily","Zoophily","Hydrophily","Anemophily","Ornithophily"],
"Insect pollination = Entomophily.");
Q("Pollination & Root Systems","Moderate","Which crops are classified as Naturally/Normally self-pollinated (with cross-pollination less than 5%)?",
["Barley, Wheat, Groundnut, Tobacco","Maize, Rye, Sugarcane, Sunflower","Sorghum, Cotton, Safflower","Alfalfa, Castor, Mustard","Beans, Hemp, Cucurbits"],
"Self-pollinated (>95%) crops include barley, ragi, wheat, beans, grams, groundnut, sesamum, tobacco.");
Q("Pollination & Root Systems","Hard","Which of the following field crops is described as 'Often Cross-Pollinated' (normally self-pollinated, but cross-pollination usually exceeds 5% due to various agencies)?",
["Sorghum","Wheat","Barley","Groundnut","Tobacco"],
"Often cross-pollinated: Sorghum, Cotton, Safflower.");
Q("Pollination & Root Systems","Hard","Which of the following is a Naturally/Normally cross-pollinated field crop (>95% cross-pollination)?",
["Maize","Wheat","Barley","Groundnut","Sesamum"],
"Field crops with >95% cross-pollination include Alfalfa, Castor, Beans, Hemp, Maize, Rye, Mustard, Sugarcane, Sunflower.");
Q("Pollination & Root Systems","Moderate","Based on depth of root system, crops whose roots extend to more than 1.5 metres are classified as:",
["Deep root crops","Shallow root crops","Intermediate crops","Fibrous root crops","Tap root crops"],
"Deep root crops extend beyond 1.5 metres (e.g., Alfalfa).");
Q("Pollination & Root Systems","Moderate","Wheat, barley and rye are given as examples of which root-depth category?",
["Shallow root crops","Intermediate crops","Deep root crops","Tap root crops only","Adventitious root crops only"],
"Wheat, barley and rye are shallow root crops (up to 1 metre).");
Q("Pollination & Root Systems","Hard","Faba bean and sugar beet are cited as examples of which root system depth category?",
["Intermediate crops (1-1.5 m)","Shallow root crops (up to 1 m)","Deep root crops (>1.5 m)","Fibrous root crops only","Adventitious crops only"],
"Faba bean and sugar beet: root depth ranges 1-1.5 metres (Intermediate).");
Q("Pollination & Root Systems","Easy","Based on the root system type, cereal crops like wheat and rice have which kind of root system?",
["Adventitious/Fibrous rooted","Tap root system","Aerial root system","Prop root system","Storage root system"],
"Cereal crops (wheat, rice) have adventitious/fibrous roots; Red gram and grape have tap roots.");
Q("Pollination & Root Systems","Hard",MS+"I. Unisexual flowers possess only one kind of sex organ.\nII. A bisexual flower has both male and female reproductive parts.\nIII. Pollination by animals is termed Entomophily.\nIV. Sorghum, Cotton and Safflower fall under 'Often Cross-Pollinated' crops."+MSQ,
["Only three","Only one","Only two","All four","None of the above are correct"],
"Statement III is wrong — pollination by animals is Zoophily, not Entomophily (that's insects). I, II, IV are correct.",
"multi");

/* ---------------- SECTION 5: Photosynthesis & CO2 Fixation ---------------- */
Q("Photosynthesis & CO2 Fixation","Easy","Photosynthetically Active Radiation (PAR) refers to the solar radiation wave band of:",
["400 to 700 nanometers","100 to 300 nanometers","700 to 1000 nanometers","0 to 200 nanometers","300 to 500 nanometers only"],
"PAR spans 400-700 nm.");
Q("Photosynthesis & CO2 Fixation","Moderate","The Light reaction of photosynthesis, in which ATP and NADPH2 are produced, is also known as:",
["Hill's reaction","Blackman's reaction","Calvin cycle","Krebs cycle","Arnon's dark reaction"],
"Light reaction = Hill's reaction (also called Arnon's cycle).");
Q("Photosynthesis & CO2 Fixation","Moderate","The Dark reaction of photosynthesis, where CO2 is reduced using ATP and NADPH2 to form glucose, was initially explained by:",
["Blackman","Hill","Arnon","Calvin","Borlaug"],
"Dark reaction is also known as Blackman's reaction.");
Q("Photosynthesis & CO2 Fixation","Easy","The two types of cyclic reactions occurring in the dark reaction of photosynthesis are:",
["Calvin cycle (C3) and Hatch-Slack cycle (C4)","Krebs cycle and Calvin cycle","Light cycle and Dark cycle","Nitrogen cycle and Carbon cycle","Hill cycle and Blackman cycle"],
"The two cyclic reactions are the Calvin cycle (C3 cycle) and Hatch-Slack cycle (C4 cycle).");
Q("Photosynthesis & CO2 Fixation","Hard","Approximately what percentage of plant species in the plant kingdom follow the C3 pathway of photosynthesis?",
["85%","3%","8%","50%","95%"],
"C3 plants make up about 85% of plant species.");
Q("Photosynthesis & CO2 Fixation","Hard","What percentage of plant species follow the C4 photosynthetic pathway?",
["3%","85%","8%","15%","25%"],
"C4 plants constitute about 3% of plant species.");
Q("Photosynthesis & CO2 Fixation","Moderate","In C3 plants, the primary CO2 acceptor is:",
["Ribulose bisphosphate (RuBP), a 5-carbon compound","Phosphoenol pyruvic acid (PEP), a 3-carbon compound","Oxaloacetic acid (OAA), a 4-carbon compound","Glucose, a 6-carbon compound","Pyruvate, a 3-carbon compound"],
"C3 plants: primary CO2 acceptor is RuBP (5-carbon compound).");
Q("Photosynthesis & CO2 Fixation","Hard","In C4 plants, the first stable product of CO2 fixation is:",
["Oxaloacetic acid (OAA), a 4-carbon compound","Phosphoglyceric acid (PGA), a 3-carbon compound","Glucose","RuBP","Pyruvate"],
"C4 plants: first stable product is OAA (4-carbon compound); C3 plants form PGA (3-carbon).");
Q("Photosynthesis & CO2 Fixation","Moderate","Which enzyme acts as the carboxylase in C3 plants?",
["Rubisco","PEP carboxylase","ATP synthase","NADP reductase","Amylase"],
"C3 plants use Rubisco as the carboxylase enzyme; C4 plants use both PEP carboxylase and Rubisco.");
Q("Photosynthesis & CO2 Fixation","Hard","Which of the following crops is classified as a C4 plant?",
["Sugarcane","Rice","Wheat","Soybean","Barley"],
"C4 examples: sugarcane, maize, sorghum, millet. Rice, wheat, soybean, barley are C3 plants.");
Q("Photosynthesis & CO2 Fixation","Hard","CAM plants exhibit an inverted stomatal cycle where stomata:",
["Open at night and close during the day","Open during the day and close at night","Remain permanently open","Remain permanently closed","Open only at dawn and dusk"],
"CAM plants have an inverted stomatal cycle: open at night, closed in the day.");

Q("Weed Biology & Control","Hard","Weed dormancy caused by deep placement of seeds in soil during ploughing, where germination resumes only upon return to the top 3-5 cm, is termed:",

Q("Weed Biology & Control","Hard","Dormancy that is genetically controlled, where seeds fail to germinate even under adequate moisture/temperature/light due to hard seed coats or immature embryos, is called:",

Q("Weed Biology & Control","Hard","Induced Dormancy in weed seeds typically results from:",

Q("Weed Biology & Control","Hard","Prickly pear (Opuntia sp.) is controlled biologically in India mainly by cochineal insects, namely:",

Q("Weed Biology & Control","Moderate","Bio-herbicides (Mycoherbicides) primarily use:",

Q("Weed Biology & Control","Hard","Fungal pathogens have been more extensively used as bio-herbicides than bacterial/viral/nematode pathogens mainly because:",

Q("Climate & Nutrient Uptake","Moderate", MS+"I. Rice, sugarcane, mango and pineapple are temperate zone crop examples.\nII. Temperate zone crops grow between latitude 30°N and 50°S.\nIII. Exhaustive crops include Berseem, alfalfa, soybean and legumes.\nIV. Exhaustive crops feed heavily on the soil and deplete its nutrients."+MSQ,

Q("Special Purpose Crops","Hard", MS+"I. Avenue crops are grown exclusively inside greenhouses, e.g., Pigeon pea, Glyricidia.\nII. Augment crops supplement the yield of main crops, e.g., Japanese mustard with berseem.\nIII. Cash crops are grown primarily for the farmer's personal consumption.\nIV. Contour crops are grown along the contour line to protect land from soil erosion."+MSQ,

Q("Special Purpose Crops","Moderate", MS+"I. Ley crops are grown exclusively for fibre extraction, e.g., Berseem + Mustard.\nII. Medicinal crops contain alkaloids, glycosides or steroids of medicinal value.\nIII. Stimulate crops are grown only for their fibre content, e.g., tobacco and opium.\nIV. Trap crops protect the main cash crop from a pest, e.g., cotton red bug trapped by ladyfinger."+MSQ,

Q("Special Purpose Crops","Hard", MS+"I. Catch/Contingent crops are cultivated only after the main crop succeeds, as a bonus crop.\nII. Competitive crops compete with each other and are unsuitable for intercropping.\nIII. Border/guard crops are grown solely to increase soil pH near field borders.\nIV. Cover crops protect soil from erosion between periods of regular crop production."+MSQ,

Q("Soil Preparation & Tillage","Hard", MS+"I. The Country plough is made entirely of iron and produces complete furrow inversion.\nII. The MB plough leaves no unploughed land as furrow slices are cut clean and inverted.\nIII. The Disc plough works well only in heavily stone-laden soils.\nIV. Jethro Tull is considered the father of tillage."+MSQ,

Q("Soil Preparation & Tillage","Moderate", MS+"I. Primary tillage is done only during the standing crop stage, never after harvest.\nII. Secondary tillage includes harrowing and planking.\nIII. Layout of seed bed operations are identical and universal for every crop.\nIV. Broadbed and furrows (BBF) are formed before the onset of monsoon."+MSQ,
["Only two","Only one","Only three","All four","None of the above are correct"],
"Statements I and III are incorrect — primary tillage is done AFTER harvest (not during the standing crop), and seed bed layout operations ARE crop specific (not universal). II and IV are correct.",

Q("Soil Preparation & Tillage","Hard", MS+"I. Topping is practiced in wheat and rice to stimulate root growth.\nII. De-trashing refers to removing older leaves from sugarcane.\nIII. De-suckering is practiced in sugarcane to remove older leaves.\nIV. Propping is practiced in sugarcane and banana."+MSQ,
["Only two","Only one","Only three","All four","None of the above are correct"],
"Statements I and III are incorrect — Topping is practiced in cotton and tobacco (not wheat/rice), and De-suckering (removing suckers) is practiced in tobacco, not sugarcane (that's De-trashing). II and IV are correct.",

Q("Soil Preparation & Tillage","Moderate", MS+"I. Ploughing never disturbs deep soil layers and only affects the surface crust.\nII. Levelling is done only to prepare land for building construction, unrelated to irrigation.\nIII. Manuring is always done before ploughing in the standard sequence.\nIV. Ploughs of wood or iron, pulled by bullocks or tractors, are used for ploughing."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — ploughing DOES loosen/dig soil bringing nutrients up; levelling helps water distribution during irrigation (not construction); and the standard sequence is Ploughing → Levelling → Manuring. Only IV is correct.",

Q("Modern Tillage Systems","Hard", MS+"I. Minimum tillage requires adding extra tillage operations regardless of cost-benefit.\nII. In Row zone tillage, secondary tillage is increased across the entire field area.\nIII. In Wheel Track tillage, no machinery is used at any stage.\nIV. Primary tillage is done as usual in all Minimum Tillage systems."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — minimum tillage reduces operations (doesn't add them); Row zone tillage reduces secondary tillage to the row zone only (not the whole field); and Wheel Track tillage DOES use tractor wheels to pulverize the row zone. Only IV is correct.",
"multi");
Q("Modern Tillage Systems","Moderate", MS+"I. Conventional tillage involves only secondary tillage, skipping primary tillage entirely.\nII. Continuous use of heavy ploughs in conventional tillage always improves subsoil infiltration.\nIII. Conservation tillage aims to maximize the frequency of ploughing operations.\nIV. Strip tillage tills only isolated bands/strips of soil."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — conventional tillage involves BOTH primary and secondary tillage; heavy ploughs create a hard pan causing POOR infiltration; and conservation tillage aims to MINIMIZE (not maximize) tillage frequency. Only IV is correct.",
"multi");
Q("Modern Tillage Systems","Hard", MS+"I. Dry tillage is suitable only for crops grown in permanently flooded fields.\nII. Wet tillage/puddling is done only in completely dry, sandy land.\nIII. Puddling increases percolation losses by making the soil highly porous.\nIV. Blind tillage is done at the pre-emergence stage or early growth stages of the crop."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — dry tillage suits broadcasted rice/jute/wheat (not flooded fields); puddling is done in standing water (not dry sandy land); and puddling REDUCES percolation losses via an impervious layer. Only IV is correct.",
"multi");
Q("Modern Tillage Systems","Hard", MS+"I. Reduced-Till is generally categorized under Wet tillage/Puddling.\nII. Combined tillage refers to combining fertilizer application with harvesting only.\nIII. Rotary tillage can only be performed manually without any machinery.\nIV. Clean tillage ensures no living plant is left undisturbed in the field."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — Reduced-Till falls under Conventional tillage (not Puddling); Combined tillage uses multiple tillage TOOLS together; and Rotary tillage uses a special rotary TOOL, not manual labour only. Only IV is correct.",
"multi");

Q("Factors Affecting Crop Production","Moderate", MS+"I. Factors affecting crop production are classified into only External factors.\nII. High yielding ability and early maturity are External (environmental) factors.\nIII. External factors include only Climatic and Edaphic factors.\nIV. Pokkali variety of paddy is a traditional salt-tolerant variety grown in Kerala."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — factors are classified into BOTH Internal and External; high yielding ability/early maturity are INTERNAL (genetic) factors; and External factors include five categories (Climatic, Edaphic, Biotic, Physiographic, Socio-economic), not just two. Only IV is correct.",
"multi");
Q("Factors Affecting Crop Production","Hard", MS+"I. Nearly 90% of crop yield is attributed to climatic factors.\nII. Socio-economic factors are unrelated to the economic condition of farmers.\nIII. Physiographic factors include only soil pH and soil temperature.\nIV. Biotic factors include both beneficial and harmful effects of other organisms on crops."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — climatic factors account for nearly 50% (not 90%) of yield; socio-economic factors DO include farmers' economic condition; and physiographic factors are Topography, Altitude, Steepness of slope, and Exposure to light/wind (not soil pH/temperature, which are edaphic). Only IV is correct.",
"multi");
Q("Factors Affecting Crop Production","Moderate", MS+"I. Internal factors of crop production relate to the genetic makeup of plants.\nII. Chemical composition of grains, such as oil and protein content, is an internal factor.\nIII. Quality of straw (sweetness, juiciness) is considered an internal factor.\nIV. Socio-economic factors are classified under Internal factors, not External factors."+MSQ,
["Only three","Only one","Only two","All four","None of the above are correct"],
"Statement IV is wrong — Socio-economic factors are classified under EXTERNAL (environmental) factors, not internal. I, II, III are correct.",
"multi");

Q("Climatic Factors","Hard", MS+"I. The temperature range for maximum growth of most agricultural plants is between 60°C and 80°C.\nII. Germination, growth and development of crops are completely unaffected by temperature.\nIII. The temperature of a place is determined solely by its distance from the nearest ocean.\nIV. Sorghum has a higher optimum temperature requirement than Wheat."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — the range for maximum growth is 15-40°C (not 60-80°C); germination/growth ARE highly influenced by temperature; and temperature is determined by latitude AND altitude (not distance from ocean alone). Only IV is correct.",
"multi");
Q("Climatic Factors","Moderate", MS+"I. Most crops perform best when relative humidity is 80% and above.\nII. When relative humidity is high, there is a lower chance of pest and disease outbreaks.\nIII. Relative humidity has no bearing on the water requirement of crops.\nIV. Relative humidity is the ratio between moisture present in the air and the saturation capacity of air at a given temperature."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — very FEW crops perform well at 80%+ RH; high RH INCREASES pest/disease outbreak chances; and RH DOES influence water requirements. Only IV is correct.",
"multi");
Q("Climatic Factors","Hard", MS+"I. Solar radiation has no relationship with the distribution of crops in a region.\nII. Photosynthetically Active Radiation spans 1000-1400 nanometers.\nIII. As wind velocity increases, damage to plants generally decreases.\nIV. Wind dispersal of pollen and seeds is natural and necessary for certain crops."+MSQ,
["Only one","Only two","Only three","All four","None of the above are correct"],
"Statements I, II and III are incorrect — solar radiation DOES control crop distribution via temperature; PAR spans 400-700nm (not 1000-1400nm); and wind damage INCREASES with velocity, not decreases. Only IV is correct.",
"multi");
Q("Climatic Factors","Hard", MS+"I. Low and uneven distribution of rainfall is common in heavy irrigated wetland farming.\nII. In desert areas, dense tropical rainforest vegetation is common.\nIII. Atmospheric humidity is normally known as visible water vapour.\nIV. Oxygen is unimportant for respiration and is absorbed, not released, by plants during photosynthesis."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements are incorrect — low/uneven rainfall is typical of DRYLAND (not wetland) farming; deserts have grasses/shrubs (not rainforest); humidity is INVISIBLE water vapour; and oxygen IS important for respiration and IS released during photosynthesis.",
"multi");

Q("Edaphic Factors","Hard", MS+"I. Soil moisture is also called xylem water.\nII. Available moisture is always equal in clay soil and sandy soil.\nIII. Soil water plays no role in the chemical or biological activities of soil.\nIV. Soil water has no effect on soil temperature."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements are incorrect — soil moisture is called RHIZIC water (not xylem water); available moisture IS more in clay than sandy soil (not equal); soil water DOES help chemical/biological activity including mineralization; and it DOES moderate soil temperature from extremes.",
"multi");
Q("Edaphic Factors","Hard", MS+"I. Soil air has no influence on plant growth or soil organism activity.\nII. Germination is enhanced in the complete absence of oxygen.\nIII. O2 is not required for respiration of roots or micro-organisms.\nIV. In clay soils, field air capacity is always above 40 percent of total soil volume."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements are incorrect — soil air DOES play an important role; germination is INHIBITED (not enhanced) without oxygen; O2 IS required for root/microbial respiration; and clay soils' field air capacity falls BELOW 10%, not above 40%.",
"multi");
Q("Edaphic Factors","Moderate", MS+"I. Soil organic matter supplies no nutrients to crops and has no effect on soil texture.\nII. Organic acids released during decomposition permanently lock away plant nutrients.\nIII. Soil organic matter decreases the water holding capacity of soil.\nIV. Soil organic matter constitutes about 60% of total soil composition."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements are incorrect — SOM DOES supply nutrients and improve texture; decomposition acids RELEASE (not lock away) nutrients; SOM INCREASES water holding capacity; and SOM is about 5% (not 60%) of soil composition.",
"multi");
Q("Edaphic Factors","Hard", MS+"I. Soil organisms are always visible to the naked eye and never microscopic.\nII. Mesofauna are the largest soil organisms, larger than megafauna.\nIII. Macrofauna include only bacteria and algae.\nIV. No soil organism is ever considered a pest."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements are incorrect — soil organisms range from microscopic to small mammals (not always visible); Mesofauna are mid-sized (Protists are smallest, Megafauna largest, not Mesofauna); Macrofauna include slugs/snails/millipedes/centipedes (not just bacteria/algae, which are Protists); and SOME soil organisms ARE pests.",
"multi");

Q("Numerical Concepts","Hard", MS+"I. Theoretical field capacity is the rate of field coverage at only 50% rated width.\nII. Effective field capacity refers only to the machine's fuel consumption rate.\nIII. Field efficiency is expressed as the ratio of theoretical field capacity to effective field capacity.\nIV. Soil inversion is calculated using the machine's forward travel speed alone."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements are incorrect — theoretical field capacity assumes 100% (not 50%) rated width; effective field capacity is actual field coverage (not fuel consumption); field efficiency is EFFECTIVE/THEORETICAL (reversed in the statement); and soil inversion uses weed counts before/after ploughing, not travel speed.",
"multi");
Q("Numerical Concepts","Moderate", MS+"I. A 5x20cm double action disc harrow operated at 5 km/h with 80% field efficiency gives an actual field capacity of 4.0 ha/h.\nII. A 4-bottom 40cm mould board plough at 5.5 km/h with 75% efficiency gives a rate of 6.6 ha/h.\nIII. Soil pulverization is determined through soil pH testing.\nIV. An indigenous plough with a 20cm wide, 10cm deep furrow at 2.5 km/h for 8 hours handles 2000 m³ of soil."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements have incorrect figures (each off by a factor of 10 or wrong method) — the correct values are 0.4 ha/h, 0.66 ha/h, sieve analysis for pulverization, and 200 m³ respectively, as worked out in the document's solved problems.",
"multi");
Q("Numerical Concepts","Moderate", MS+"I. Theoretical time per hectare is the time required at the effective field capacity.\nII. Effective operating time is the total idle/downtime of a machine.\nIII. Field efficiency is expressed only in hectares.\nIV. Soil inversion is calculated using the depth of ploughing alone."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements are incorrect — theoretical time per hectare uses THEORETICAL (not effective) field capacity; effective operating time is time actually performing the function (not idle time); field efficiency is a PERCENTAGE (not hectares); and soil inversion uses weed counts, not ploughing depth.",
"multi");

Q("Weed Classification","Hard", MS+"I. Perennial weeds are always more common than annual weeds in field crops.\nII. Biennials complete their entire life cycle, including flowering, within a single season.\nIII. Perennials propagate only through seeds and never through vegetative structures.\nIV. Simple perennials, e.g., Sonchus arvensis, are propagated only by rhizomes."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements are incorrect — annual weeds ARE the most common field weeds; biennials take TWO seasons (vegetative growth first, flowering second); perennials propagate via seeds AND underground structures; and Simple perennials like Sonchus arvensis propagate only by SEEDS, not rhizomes.",
"multi");
Q("Weed Classification","Moderate", MS+"I. Wetland weeds are hardy perennials with fully terrestrial habits, propagated chiefly by rhizomes.\nII. Garden land weeds require exactly the same amount of water as wetland weeds.\nIII. Dryland weeds are usually delicate plants with shallow, weak root systems.\nIV. Trianthema portulacastrum is an example of a submersed aquatic weed."+MSQ,
["None of the above are correct","Only one","Only two","Only three","All four"],
"All four statements are incorrect — wetland weeds are tender ANNUALS with semi-aquatic habits (not hardy perennials); Garden land weeds need moderate water (not the same as wetland weeds); Dryland weeds are hardy with DEEP roots (not delicate/shallow); and Trianthema portulacastrum is a Garden land weed, not a submersed aquatic weed.",
"multi");
Q("Weed Classification","Hard", MS+"I. Based on cotyledon number, weeds are classified as monocots and dicots.\nII. Panicum flavidum is an example of a monocot weed.\nIII. Based on soil pH, weeds are classified as Acidophile, Basophile and Neutrophile.\nIV. Sedges (family Cyperaceae) have leaves arising mostly from the base with modified stems, with or without tubers."+MSQ,
["All four","Only one","Only two","Only three","None of the above are correct"],
"All four statements are correct as per the document.",
"multi");
Q("Weed Classification","Moderate", MS+"I. Weeds of croplands hinder successful crop production, e.g., Phalaris minor in wheat.\nII. Weeds of waste places grow in corners of fields and margins of channels.\nIII. Weeds of playgrounds and roadsides are usually hardy, prostrate perennials capable of withstanding trampling.\nIV. Indigofera enneaphylla is an example of a weed of pasture lands."+MSQ,
["All four","Only one","Only two","Only three","None of the above are correct"],
"All four statements are correct as per the document.",
"multi");

Q("Weed Biology & Control","Hard", MS+"I. Enforced dormancy occurs due to deep placement of weed seeds during ploughing.\nII. High soil temperature and NO3 content of surface soil may help break seed dormancy.\nIII. Innate dormancy can be overcome with time or under the influence of climatic pressure.\nIV. Innate dormancy is a genetically controlled character of specific weed seeds."+MSQ,
["All four","Only one","Only two","Only three","None of the above are correct"],
"All four statements are correct as per the document.",
"multi");
Q("Weed Biology & Control","Moderate", MS+"I. Weeds usually absorb mineral nutrients faster than many crop plants.\nII. Nutrient removal by weeds is often twice that of crop plants in a season.\nIII. Once weeds shade a crop plant, increased light intensity cannot benefit it.\nIV. For producing equal dry matter, weeds generally transpire MORE water than most crop plants."+MSQ,
["All four","Only one","Only two","Only three","None of the above are correct"],
"All four statements are correct as per the document.",
"multi");
Q("Weed Biology & Control","Hard", MS+"I. Biological control uses living organisms such as insects, disease organisms or herbivorous fish to control weeds.\nII. Ludwigia parviflora is completely denuded by Altica cynanea (steel blue beetle).\nIII. Mycoherbicides use fungal pathogens more extensively than bacterial or viral pathogens.\nIV. Integrated Weed Management relies on a planned combination of mechanical, chemical and cultural practices."+MSQ,
["All four","Only one","Only two","Only three","None of the above are correct"],
"All four statements are correct as per the document.",
"multi");
Q("Weed Biology & Control","Hard", MS+"I. Weed seeds move with surface water runoff into irrigation water and ponds.\nII. Terrestrial weed seeds can also disperse through irrigation and drainage water.\nIII. Weed seeds are commonly dispersed by tillage and harvesting equipment.\nIV. Disc-type cultivation equipment is less likely to drag vegetative plant parts than shovels or sweeps."+MSQ,
["All four","Only one","Only two","Only three","None of the above are correct"],
"All four statements are correct as per the document.",
"multi");
</script>
<script>
/* Build final rotated question bank so that correct answers cycle evenly across the 5 option positions. */
const LETTERS = ["A","B","C","D","E"];
function rotateArray(arr, k){
  const n = arr.length;
  const shift = ((k % n) + n) % n;
  return arr.slice(shift).concat(arr.slice(0, shift));
}
const QUESTIONS = RAW.map((raw, idx) => {
  const shift = idx % 5; // deterministic rotation offset -> even distribution of correct letter
  // original correct is at index 0. We want the correct item to move to position `shift`.
  // rotateArray moves element at position p to (p - shift) mod n. We want p=0 to land at `shift`.
  // So we rotate LEFT by (n - shift) i.e. rotateArray(arr, -shift) equivalently rotate by (5-shift)%5 using our function's convention.
  const opts = raw.opts.slice();
  const rotated = rotateArray(opts, (opts.length - shift) % opts.length);
  return {
    id: idx,
    section: raw.section,
    diff: raw.diff,
    text: raw.text,
    options: rotated,
    correct: shift,
    exp: raw.exp,
    type: raw.type
  };
});
</script>
<script>
/* ============ APP LOGIC ============ */
const app = document.getElementById('app');
let state = {
  mode: null,          // 'full' | 'section'
  order: 'pdf',         // 'pdf' | 'shuffled'
  pool: [],             // active question set
  idx: 0,
  score: 0,
  answers: [],          // per question: {status:'correct'|'wrong'|'skipped', chosen, correctIdx}
  sectionName: null
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function sectionsList(){
  const map = {};
  QUESTIONS.forEach(q=>{
    map[q.section] = (map[q.section]||0)+1;
  });
  return Object.keys(map).map(k=>({name:k, count:map[k]}));
}

function renderHome(){
  state = {mode:null, order:'pdf', pool:[], idx:0, score:0, answers:[], sectionName:null};
  app.innerHTML = `
    <h1>📘 NABARD Grade A — Agronomy &amp; Field Crops</h1>
    <div class="sub">Practice Test built from the Agronomy &amp; Field Crops summary sheet · ${QUESTIONS.length} questions</div>
    <div class="card">
      <h3 style="margin-top:0;">Choose a mode</h3>
      <div class="row">
        <button class="btn" id="fullBtn" style="flex:1;min-width:220px;">🎯 Full Practice Test</button>
        <button class="btn secondary" id="sectionBtn" style="flex:1;min-width:220px;">📚 Section-wise Revision</button>
      </div>
    </div>
    <div class="card" style="font-size:.82rem;color:var(--muted);">
      Tip: Use Full Practice Test for a timed, exam-like run through all ${QUESTIONS.length} questions.
      Use Section-wise Revision to drill a specific topic until you're confident.
    </div>
  `;
  document.getElementById('fullBtn').onclick = renderFullSetup;
  document.getElementById('sectionBtn').onclick = renderSectionMenu;
}

function renderFullSetup(){
  app.innerHTML = `
    <h1>🎯 Full Practice Test</h1>
    <div class="sub">${QUESTIONS.length} questions covering the entire document</div>
    <div class="card">
      <div style="margin-bottom:10px;font-weight:600;font-size:.9rem;">Question order</div>
      <div class="toggle-group" id="orderToggle">
        <button class="active" data-v="pdf">PDF Order</button>
        <button data-v="shuffled">Shuffled</button>
      </div>
      <div class="row" style="margin-top:18px;">
        <button class="btn" id="startFull" style="flex:1;">Start Test</button>
        <button class="btn ghost" id="backHome1">Back to Menu</button>
      </div>
    </div>
  `;
  let order = 'pdf';
  document.querySelectorAll('#orderToggle button').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('#orderToggle button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      order = b.dataset.v;
    };
  });
  document.getElementById('startFull').onclick = ()=>{
    state.mode='full';
    state.order = order;
    state.pool = order==='shuffled' ? shuffle(QUESTIONS) : QUESTIONS.slice();
    state.idx=0; state.score=0; state.answers=[];
    state.sectionName = 'Full Practice Test';
    renderQuestion();
  };
  document.getElementById('backHome1').onclick = renderHome;
}

function renderSectionMenu(){
  const secs = sectionsList();
  app.innerHTML = `
    <h1>📚 Section-wise Revision</h1>
    <div class="sub">Tap a topic to drill just that section</div>
    <div class="grid" id="secGrid"></div>
    <div class="row" style="margin-top:18px;">
      <button class="btn ghost" id="backHome2">Back to Menu</button>
    </div>
  `;
  const grid = document.getElementById('secGrid');
  secs.forEach(s=>{
    const div = document.createElement('div');
    div.className='topic';
    div.innerHTML = `<h3>${s.name}</h3><span>${s.count} questions</span>`;
    div.onclick = ()=>{
      state.mode='section';
      state.order='pdf';
      state.pool = QUESTIONS.filter(q=>q.section===s.name);
      state.idx=0; state.score=0; state.answers=[];
      state.sectionName = s.name;
      renderQuestion();
    };
    grid.appendChild(div);
  });
  document.getElementById('backHome2').onclick = renderHome;
}

function renderQuestion(){
  if(state.idx >= state.pool.length){
    renderResults();
    return;
  }
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/state.pool.length)*100);
  app.innerHTML = `
    <div class="flexbetween">
      <h1 style="font-size:1.1rem;">${state.sectionName}</h1>
      <span class="score-pill">Score: ${state.score}/${state.idx}</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="meta-row">
        <span>Question ${state.idx+1} of ${state.pool.length} &nbsp;·&nbsp; ${q.section}</span>
        <span class="badge ${q.diff}">${q.diff}</span>
      </div>
      <div class="qtext">${q.text}</div>
      <div id="optsWrap"></div>
      <div class="explain" id="explainBox"></div>
      <div class="footer-nav">
        <button class="btn ghost" id="skipBtn">Skip ⏭</button>
        <button class="btn secondary hidden" id="nextBtn">Next →</button>
      </div>
    </div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  q.options.forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.className='opt';
    btn.innerHTML = `<b>${LETTERS[i]}.</b> ${opt}`;
    btn.onclick = ()=> selectAnswer(i);
    optsWrap.appendChild(btn);
  });
  document.getElementById('skipBtn').onclick = ()=> handleSkip();
  document.getElementById('nextBtn').onclick = ()=>{
    state.idx++;
    renderQuestion();
  };
}

function lockOptions(){
  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('disabled');
    o.onclick = null;
  });
}

function selectAnswer(i){
  const q = state.pool[state.idx];
  const opts = document.querySelectorAll('.opt');
  lockOptions();
  const correct = i === q.correct;
  opts[q.correct].classList.add('correct');
  if(!correct) opts[i].classList.add('wrong');
  if(correct) state.score++;
  state.answers.push({q, status: correct?'correct':'wrong', chosen: i});
  document.getElementById('explainBox').style.display='block';
  document.getElementById('explainBox').textContent = (correct?'✅ Correct. ':'❌ Not quite. ') + q.exp;
  document.getElementById('skipBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.querySelector('.score-pill').textContent = `Score: ${state.score}/${state.idx+1}`;
}

function handleSkip(){
  const q = state.pool[state.idx];
  lockOptions();
  const opts = document.querySelectorAll('.opt');
  opts[q.correct].classList.add('correct');
  state.answers.push({q, status:'skipped', chosen:null});
  document.getElementById('explainBox').style.display='block';
  document.getElementById('explainBox').textContent = '⏭ Skipped. Correct answer: ' + LETTERS[q.correct] + '. ' + q.exp;
  document.getElementById('skipBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
}

function renderResults(){
  const total = state.pool.length;
  const correctCount = state.answers.filter(a=>a.status==='correct').length;
  const wrongCount = state.answers.filter(a=>a.status==='wrong').length;
  const skippedCount = state.answers.filter(a=>a.status==='skipped').length;
  const acc = total? Math.round((correctCount/total)*100) : 0;

  const diffStats = {Easy:{c:0,t:0}, Moderate:{c:0,t:0}, Hard:{c:0,t:0}};
  state.answers.forEach(a=>{
    const d = a.q.diff;
    diffStats[d].t++;
    if(a.status==='correct') diffStats[d].c++;
  });

  const missed = state.answers.filter(a=>a.status!=='correct');

  app.innerHTML = `
    <h1>📊 Results — ${state.sectionName}</h1>
    <div class="card center">
      <div style="font-size:2.4rem;font-weight:800;">${correctCount} / ${total}</div>
      <div style="color:var(--muted);margin-bottom:14px;">Overall Accuracy: ${acc}%</div>
      <div class="statlist">
        <div class="stat"><div class="num" style="color:var(--green);">${correctCount}</div><div>Correct</div></div>
        <div class="stat"><div class="num" style="color:var(--red);">${wrongCount}</div><div>Wrong</div></div>
        <div class="stat"><div class="num" style="color:var(--amber);">${skippedCount}</div><div>Skipped</div></div>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Accuracy by Difficulty</h3>
      ${["Easy","Moderate","Hard"].map(d=>{
        const s = diffStats[d];
        const p = s.t? Math.round((s.c/s.t)*100) : 0;
        return `<div class="meta-row"><span class="badge ${d}">${d}</span><span>${s.c}/${s.t} correct (${s.t?p:0}%)</span></div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${s.t?p:0}%"></div></div>`;
      }).join('')}
    </div>
    ${missed.length ? `
    <div class="card">
      <h3 style="margin-top:0;">Review — Missed &amp; Skipped (${missed.length})</h3>
      ${missed.map(a=>{
        const q=a.q;
        const yourAns = a.status==='skipped' ? 'Skipped' : (LETTERS[a.chosen]+'. '+q.options[a.chosen]);
        return `<div class="review-item ${a.status==='skipped'?'skipped':''}">
          <div class="q">${q.text.replace(/\\n/g,'<br>')}</div>
          <div class="yours">Your answer: ${yourAns}</div>
          <div class="ans">Correct answer: ${LETTERS[q.correct]}. ${q.options[q.correct]}</div>
          <div style="color:var(--muted);margin-top:4px;">${q.exp}</div>
        </div>`;
      }).join('')}
    </div>` : `<div class="card center" style="color:var(--green);font-weight:700;">🎉 Perfect run — nothing missed or skipped!</div>`}
    <div class="row" style="margin-top:10px;">
      <button class="btn" id="retryBtn" style="flex:1;">🔁 Retry Same Set</button>
      <button class="btn secondary" id="menuBtn" style="flex:1;">🏠 Back to Menu</button>
    </div>
  `;
  document.getElementById('retryBtn').onclick = ()=>{
    state.pool = state.order==='shuffled' ? shuffle(state.pool) : state.pool;
    state.idx=0; state.score=0; state.answers=[];
    renderQuestion();
  };
  document.getElementById('menuBtn').onclick = renderHome;
}

renderHome();
</script>
