<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABARD Grade A — Soil &amp; Water Conservation Practice Quiz</title>
<style>
  :root{
    --navy:#12233f;
    --navy-2:#1a3363;
    --gold:#b8862e;
    --gold-light:#e4b869;
    --paper:#f6f4ee;
    --ink:#1c1c1c;
    --muted:#6b7280;
    --correct:#1c7a4d;
    --correct-bg:#e5f6ed;
    --wrong:#a3242f;
    --wrong-bg:#fbe9ea;
    --line:#d9d3c4;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(180deg, rgba(18,35,63,0.03), rgba(18,35,63,0) 220px);
    color:var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', ui-serif, serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px 60px;
  }
  .app{
    width:100%;
    max-width:760px;
  }
  .masthead{
    border-bottom:3px solid var(--navy);
    padding-bottom:14px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:8px;
  }
  .masthead .title{
    font-family: 'Trebuchet MS', ui-sans-serif, system-ui, sans-serif;
    font-weight:800;
    letter-spacing:0.5px;
    color:var(--navy);
    font-size:22px;
    text-transform:uppercase;
  }
  .masthead .subtitle{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }
  .masthead .tag{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    border:1px solid var(--gold);
    border-radius:3px;
    padding:4px 8px;
  }

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:#e5e1d4;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--navy), var(--navy-2));
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    min-width:64px;
    text-align:right;
  }
  .score-pill{
    font-size:12.5px;
    font-weight:700;
    color:var(--navy);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 12px;
    white-space:nowrap;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:26px 24px 22px;
    box-shadow:0 1px 3px rgba(18,35,63,0.06), 0 8px 24px rgba(18,35,63,0.05);
  }
  .qmeta{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:11.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:10px;
  }
  .qtext{
    font-size:19px;
    line-height:1.5;
    color:var(--ink);
    margin-bottom:20px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    width:100%;
    background:#fdfcf9;
    border:1.5px solid var(--line);
    border-radius:7px;
    padding:12px 14px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:15px;
    line-height:1.45;
    color:var(--ink);
    cursor:pointer;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .opt:hover:not(:disabled){
    border-color:var(--navy-2);
    background:#f1f0ea;
  }
  .opt:active:not(:disabled){ transform:scale(0.997); }
  .opt .letter{
    flex:0 0 auto;
    width:26px;
    height:26px;
    border-radius:50%;
    border:1.5px solid var(--navy);
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
  }
  .opt.correct{
    background:var(--correct-bg);
    border-color:var(--correct);
  }
  .opt.correct .letter{
    background:var(--correct);
    border-color:var(--correct);
    color:#fff;
  }
  .opt.wrong{
    background:var(--wrong-bg);
    border-color:var(--wrong);
  }
  .opt.wrong .letter{
    background:var(--wrong);
    border-color:var(--wrong);
    color:#fff;
  }
  .opt:disabled{ cursor:default; }
  .opt:disabled:not(.correct):not(.wrong){ opacity:0.55; }

  .feedback{
    margin-top:16px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:13.5px;
    font-weight:700;
    display:none;
    align-items:center;
    gap:8px;
  }
  .feedback.show{ display:flex; }
  .feedback.correct-txt{ color:var(--correct); }
  .feedback.wrong-txt{ color:var(--wrong); }

  .nav-row{
    display:flex;
    justify-content:flex-end;
    margin-top:18px;
  }
  .btn{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 22px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    background:var(--navy);
    color:#fff;
    letter-spacing:0.3px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, background .15s;
  }
  .btn.show{ opacity:1; pointer-events:auto; }
  .btn:hover{ background:var(--navy-2); }
  .btn.gold{ background:var(--gold); }
  .btn.gold:hover{ background:#a17423; }

  /* Results screen */
  .results{ display:none; }
  .results.show{ display:block; }
  .quizview.hide{ display:none; }
  .score-hero{
    text-align:center;
    padding:30px 20px 26px;
    background:var(--navy);
    border-radius:8px;
    color:#fff;
    margin-bottom:22px;
  }
  .score-hero .big{
    font-size:46px;
    font-weight:800;
    font-family: ui-sans-serif, system-ui, sans-serif;
    color:var(--gold-light);
  }
  .score-hero .lbl{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#cfd6e4;
    margin-top:4px;
  }
  .score-hero .breakdown{
    margin-top:14px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:13px;
    color:#dfe4ee;
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
  }
  .score-hero .breakdown b{ color:#fff; }

  .review-title{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-weight:800;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--navy);
    margin:24px 0 12px;
    border-bottom:2px solid var(--line);
    padding-bottom:8px;
  }
  .review-item{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--wrong);
    border-radius:6px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .review-item .rq{
    font-size:15px;
    margin-bottom:8px;
    line-height:1.45;
  }
  .review-item .ryour, .review-item .rcorrect{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:13px;
    margin-top:3px;
  }
  .review-item .ryour{ color:var(--wrong); }
  .review-item .rcorrect{ color:var(--correct); font-weight:700; }
  .all-correct{
    text-align:center;
    font-family: ui-sans-serif, system-ui, sans-serif;
    color:var(--correct);
    font-weight:700;
    padding:20px;
  }
  .restart-row{
    display:flex;
    justify-content:center;
    margin-top:24px;
  }
  .footer-note{
    text-align:center;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:11.5px;
    color:var(--muted);
    margin-top:26px;
  }
  @media (max-width:480px){
    .qtext{ font-size:17px; }
    .score-hero .big{ font-size:38px; }
    .card{ padding:20px 16px 18px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="masthead">
    <div>
      <div class="title">NABARD Grade A — Practice Quiz</div>
      <div class="subtitle">Soil &amp; Water Conservation · Objective Type · 5 Options (A–E)</div>
    </div>
    <div class="tag" id="qcount"></div>
  </div>

  <div class="quizview" id="quizview">
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">Q1 / 178</div>
      <div class="score-pill" id="scorePill">Score: 0</div>
    </div>

    <div class="card">
      <div class="qmeta" id="qmeta">QUESTION 1</div>
      <div class="qtext" id="qtext"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="nav-row">
      <button class="btn gold" id="nextBtn">Next Question →</button>
    </div>
  </div>

  <div class="results" id="results">
    <div class="score-hero">
      <div class="big" id="finalScoreBig">0 / 178</div>
      <div class="lbl">Final Score</div>
      <div class="breakdown">
        <div>Correct: <b id="statCorrect">0</b></div>
        <div>Incorrect: <b id="statWrong">0</b></div>
        <div>Accuracy: <b id="statPct">0%</b></div>
      </div>
    </div>

    <div id="reviewSection"></div>

    <div class="restart-row">
      <button class="btn" id="restartBtn" style="opacity:1;pointer-events:auto;">Restart Quiz</button>
    </div>
  </div>

  <div class="footer-note">Based on the EduTap "Soil and Water Conservation" Summary Sheet · For NABARD Grade A exam practice</div>
</div>

rooftop area is:", "o": ["5,500 litres", "100,000 litres", "55,000 litres", "550 litres", "15,000 litres"], "a": 2}]</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const LETTERS = ['A','B','C','D','E'];
  let current = 0;
  let score = 0;
  let answered = false;
  let userAnswers = new Array(DATA.length).fill(null);

  const qcountEl = document.getElementById('qcount');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const scorePill = document.getElementById('scorePill');
  const qmeta = document.getElementById('qmeta');
  const qtext = document.getElementById('qtext');
  const optionsEl = document.getElementById('options');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  const quizview = document.getElementById('quizview');
  const results = document.getElementById('results');

  qcountEl.textContent = DATA.length + ' QUESTIONS';

  function renderQuestion(){
    answered = false;
    const q = DATA[current];
    qmeta.textContent = 'QUESTION ' + (current+1) + ' OF ' + DATA.length;
    qtext.textContent = q.q;
    optionsEl.innerHTML = '';
    feedback.classList.remove('show','correct-txt','wrong-txt');
    feedback.innerHTML = '';
    nextBtn.classList.remove('show');

    q.o.forEach((optText, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="letter">' + LETTERS[idx] + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => selectOption(idx, btn));
      optionsEl.appendChild(btn);
    });

    progressFill.style.width = ((current)/DATA.length*100) + '%';
    progressLabel.textContent = 'Q' + (current+1) + ' / ' + DATA.length;
    scorePill.textContent = 'Score: ' + score;
  }

  function selectOption(idx, btnEl){
    if(answered) return;
    answered = true;
    const q = DATA[current];
    userAnswers[current] = idx;
    const allOpts = optionsEl.querySelectorAll('.opt');
    allOpts.forEach(o => o.disabled = true);

    if(idx === q.a){
      score++;
      btnEl.classList.add('correct');
      feedback.classList.add('show','correct-txt');
      feedback.innerHTML = '✓ Correct — well done.';
    } else {
      btnEl.classList.add('wrong');
      allOpts[q.a].classList.add('correct');
      feedback.classList.add('show','wrong-txt');
      feedback.innerHTML = '✗ Incorrect — correct answer is ' + LETTERS[q.a] + '.';
    }
    scorePill.textContent = 'Score: ' + score;
    progressFill.style.width = ((current+1)/DATA.length*100) + '%';
    nextBtn.textContent = (current === DATA.length-1) ? 'See Results →' : 'Next Question →';
    nextBtn.classList.add('show');
  }

  nextBtn.addEventListener('click', () => {
    if(current < DATA.length - 1){
      current++;
      renderQuestion();
      window.scrollTo({top:0, behavior:'smooth'});
    } else {
      showResults();
    }
  });

  function showResults(){
    quizview.classList.add('hide');
    results.classList.add('show');
    const total = DATA.length;
    const wrong = total - score;
    const pct = Math.round(score/total*100);
    document.getElementById('finalScoreBig').textContent = score + ' / ' + total;
    document.getElementById('statCorrect').textContent = score;
    document.getElementById('statWrong').textContent = wrong;
    document.getElementById('statPct').textContent = pct + '%';

    const reviewSection = document.getElementById('reviewSection');
    reviewSection.innerHTML = '';
    const missed = [];
    DATA.forEach((q, i) => {
      if(userAnswers[i] !== q.a){
        missed.push({q, i, your: userAnswers[i]});
      }
    });

    if(missed.length === 0){
      reviewSection.innerHTML = '<div class="all-correct">Perfect score — no questions missed. Outstanding work.</div>';
    } else {
      const title = document.createElement('div');
      title.className = 'review-title';
      title.textContent = 'Review — ' + missed.length + ' Question' + (missed.length>1?'s':'') + ' Missed';
      reviewSection.appendChild(title);

      missed.forEach(m => {
        const item = document.createElement('div');
        item.className = 'review-item';
        const yourText = (m.your === null) ? 'Not answered' : LETTERS[m.your] + ') ' + m.q.o[m.your];
        item.innerHTML =
          '<div class="rq">Q' + (m.i+1) + '. ' + m.q.q + '</div>' +
          '<div class="ryour">Your answer: ' + yourText + '</div>' +
          '<div class="rcorrect">Correct answer: ' + LETTERS[m.q.a] + ') ' + m.q.o[m.q.a] + '</div>';
        reviewSection.appendChild(item);
      });
    }
    window.scrollTo({top:0, behavior:'smooth'});
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    current = 0; score = 0; userAnswers = new Array(DATA.length).fill(null);
    results.classList.remove('show');
    quizview.classList.remove('hide');
    renderQuestion();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  renderQuestion();
})();
</script>
</body>
</html>
