<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NABARD Grade A — Forestry Practice Quiz</title>
<style>
  :root{
    --green:#1b6e3c;
    --green-dark:#12492a;
    --orange:#e8862a;
    --bg:#f6f7f4;
    --card:#ffffff;
    --text:#1f2a24;
    --muted:#6b7a71;
    --correct:#1b6e3c;
    --incorrect:#c0392b;
    --border:#e1e6df;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px;}
  .top{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 4px 10px;
  }
  .brand{font-weight:800;font-size:18px;color:var(--green-dark);}
  .score{font-weight:700;color:var(--orange);font-size:14px;background:#fff3e6;border:1px solid #f3d9b8;padding:6px 10px;border-radius:20px;}
  .progressbar{height:8px;background:#e4e9e1;border-radius:6px;overflow:hidden;margin:6px 0 18px;}
  .progressfill{height:100%;background:linear-gradient(90deg,var(--green),#3ea162);border-radius:6px;transition:width .3s ease;}
  .labels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .tag{
    font-size:12px;font-weight:700;padding:4px 10px;border-radius:14px;
    letter-spacing:.2px;
  }
  .tag.part{background:var(--green-dark);color:#fff;}
  .tag.topic{background:#fff;color:var(--green-dark);border:1px solid var(--green);}
  .qnum{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:20px;box-shadow:0 2px 10px rgba(20,40,25,0.04);
  }
  .qtext{font-size:16.5px;font-weight:600;line-height:1.5;margin:2px 0 16px;}
  .opt{
    display:flex;align-items:flex-start;gap:10px;
    width:100%;text-align:left;
    background:#fbfcfa;border:1.5px solid var(--border);
    border-radius:10px;padding:11px 13px;margin-bottom:9px;
    font-size:14.5px;cursor:pointer;transition:all .15s ease;
    color:var(--text);
  }
  .opt:hover:not(.disabled){border-color:var(--green);background:#f1f8f3;}
  .opt .letter{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;
    background:#e7ece5;color:var(--green-dark);font-weight:800;font-size:12.5px;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{background:#e8f6ec;border-color:var(--correct);}
  .opt.correct .letter{background:var(--correct);color:#fff;}
  .opt.incorrect{background:#fdecea;border-color:var(--incorrect);}
  .opt.incorrect .letter{background:var(--incorrect);color:#fff;}
  .opt.disabled{cursor:default;}
  .feedback{
    margin-top:14px;padding:13px 14px;border-radius:10px;font-size:14px;line-height:1.55;
    display:none;
  }
  .feedback.show{display:block;animation:fadein .25s ease;}
  .feedback.right{background:#e8f6ec;border:1px solid #b9e2c4;}
  .feedback.wrong{background:#fdecea;border:1px solid #f2c1bb;}
  .feedback b{display:block;margin-bottom:4px;}
  @keyframes fadein{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .nextbar{display:flex;justify-content:flex-end;margin-top:16px;}
  .btn{
    background:var(--green);color:#fff;border:none;border-radius:10px;
    padding:11px 22px;font-size:14.5px;font-weight:700;cursor:pointer;
  }
  .btn:hover{background:var(--green-dark);}
  .btn.secondary{background:#fff;color:var(--green-dark);border:1.5px solid var(--green);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .startcard,.endcard{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:28px 22px;text-align:center;
  }
  .startcard h1{font-size:22px;color:var(--green-dark);margin:6px 0 8px;}
  .startcard p{color:var(--muted);font-size:14.5px;line-height:1.6;}
  .stat-row{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap;}
  .stat{background:#f1f8f3;border:1px solid #cfe8d6;border-radius:12px;padding:14px 18px;min-width:100px;}
  .stat .num{font-size:24px;font-weight:800;color:var(--green-dark);}
  .stat .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .reviewitem{
    text-align:left;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:#fffaf5;
  }
  .reviewitem .rtag{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .reviewitem .rq{font-weight:600;margin-bottom:8px;font-size:14px;}
  .reviewitem .rline{font-size:13.5px;margin:3px 0;}
  .reviewitem .rline.correctline{color:var(--correct);}
  .reviewitem .rline.wrongline{color:var(--incorrect);}
  .reviewitem .rexp{font-size:13px;color:#555;margin-top:6px;line-height:1.5;}
  .hidden{display:none !important;}
  .footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:28px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">🌲 NABARD Grade A — Forestry Quiz</div>
    <div class="score" id="scoreBadge">Score: 0 / 0</div>
  </div>

  <div id="startScreen" class="startcard">
    <h1>Forestry — Full Practice Quiz</h1>
    <p id="introText"></p>
    <div class="stat-row">
      <div class="stat"><div class="num" id="totalQCount">0</div><div class="lbl">Questions</div></div>
      <div class="stat"><div class="num" id="totalPartsCount">0</div><div class="lbl">Parts</div></div>
    </div>
    <button class="btn" id="startBtn">Start Quiz</button>
  </div>

  <div id="quizScreen" class="hidden">
    <div class="progressbar"><div class="progressfill" id="progressFill" style="width:0%"></div></div>
    <div class="labels">
      <span class="tag part" id="partTag"></span>
      <span class="tag topic" id="topicTag"></span>
    </div>
    <div class="qnum" id="qNumLabel"></div>
    <div class="card">
      <div class="qtext" id="qText"></div>
      <div id="optsWrap"></div>
      <div class="feedback" id="feedbackBox">
        <b id="fbTitle"></b>
        <span id="fbExp"></span>
      </div>
    </div>
    <div class="nextbar">
      <button class="btn" id="nextBtn" disabled>Next Question →</button>
    </div>
  </div>

  <div id="endScreen" class="hidden">
    <div class="endcard">
      <h1 style="color:var(--green-dark);margin-top:0;">Quiz Complete 🎉</h1>
      <div class="stat-row">
        <div class="stat"><div class="num" id="finalScore">0</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="num" id="finalTotal">0</div><div class="lbl">Total</div></div>
        <div class="stat"><div class="num" id="finalPct">0%</div><div class="lbl">Accuracy</div></div>
      </div>
      <button class="btn secondary" id="restartBtn">Restart Quiz</button>
    </div>
    <div id="reviewSection" style="margin-top:22px;"></div>
  </div>

  <div class="footer-note">EduTap Forestry Summary Sheet — NABARD Grade A style practice questions.</div>
</div>

<script>
const QUIZ_DATA = [{"part": "Part I: Forest", "topic": "Definition & Origin", "q": "The word 'Forest' is derived from which Latin word meaning 'outside the village boundary'?", "opts": {"A": "Sylva", "B": "Foris", "C": "Nemus", "D": "Arbor", "E": "Terra"}, "ans": "B", "exp": "The notes state the word 'Forest' is derived from the Latin word 'foris', meaning outside the village boundary or away from inhabited land."}, {"part": "Part I: Forest", "topic": "Definition & Origin", "q": "The 'ecological' definition of a forest emphasizes it as:", "opts": {"A": "An area used only for timber production", "B": "Land owned exclusively by the government", "C": "None of the above", "D": "A plant community predominantly of trees/woody vegetation, usually with a closed canopy", "E": "An area proclaimed under forest law"}, "ans": "D", "exp": "Ecologically, a forest is defined as a plant community, predominantly of trees and other woody vegetation, usually with a closed canopy."}, {"part": "Part I: Forest", "topic": "Definition & Origin", "q": "Which of the following is NOT one of the five components of a forest as per the definition given in the notes?", "opts": {"A": "Managed for forest produce and/or benefits", "B": "Provides shelter to wildlife, birds and other fauna", "C": "Closed or partially closed canopy of trees", "D": "An uncultivated land area", "E": "Must be irrigated agricultural land under cultivation"}, "ans": "E", "exp": "The five components listed are: uncultivated land, natural vegetation/trees, closed or partially closed canopy, management for produce/benefits, and shelter to wildlife -- not irrigated cultivated land."}, {"part": "Part I: Forest", "topic": "Functions of Forests", "q": "Which function of forests relates to protection of watersheds and catchments of rivers/streams against erosion?", "opts": {"A": "Ameliorative", "B": "Protective", "C": "Productive", "D": "Recreational", "E": "Aesthetic"}, "ans": "B", "exp": "Protective function: forests protect watersheds and catchments of rivers and streams against erosion."}, {"part": "Part I: Forest", "topic": "Functions of Forests", "q": "Which function of forests is described by picnic resorts and opportunities for hiking, trekking, wildlife/bird watching?", "opts": {"A": "Scientific", "B": "Recreational", "C": "Industrial development", "D": "Ameliorative", "E": "Hygienic"}, "ans": "B", "exp": "Recreational function: forests provide picnic resorts and opportunities for hiking, trekking, wildlife and bird watching."}, {"part": "Part I: Forest", "topic": "Functions of Forests", "q": "'Forests improve climate and reduce pollution' corresponds to which listed function?", "opts": {"A": "Ameliorative", "B": "Scientific", "C": "Aesthetic", "D": "Hygienic", "E": "Productive"}, "ans": "A", "exp": "The Ameliorative function states forests improve climate and reduce pollution."}, {"part": "Part I: Forest", "topic": "Functions of Forests", "q": "Which function is described as: forests purify air, reduce noise, and give out oxygen to the atmosphere?", "opts": {"A": "Aesthetic", "B": "Industrial", "C": "Ameliorative", "D": "Scientific", "E": "Hygienic"}, "ans": "E", "exp": "Hygienic function: forests improve the environment, reduce noise, purify air, and release oxygen."}, {"part": "Part I: Forest", "topic": "Functions of Forests", "q": "Which of the following function-description pairs is NOT correctly matched?", "opts": {"A": "Aesthetic - reduction of noise and purification of air", "B": "Productive - timber, fuel, charcoal, resins", "C": "Protective - watershed protection", "D": "Scientific - study of ecological processes", "E": "Industrial development - raw material for paper pulp, rayon grade pulp"}, "ans": "A", "exp": "Reduction of noise and air purification is the Hygienic function, not the Aesthetic function (which is about appearance and landscaping)."}, {"part": "Part I: Forest", "topic": "Functions of Forests", "q": "Forest produce such as beedi leaves, resins, tanning materials, gums and lac are associated with which function?", "opts": {"A": "Scientific", "B": "Protective", "C": "Productive", "D": "Hygienic", "E": "Ameliorative"}, "ans": "C", "exp": "The Productive function lists timber, fuel, charcoal, beedi leaves and resins, fruits, tanning materials, gums, lac etc."}, {"part": "Part I: Forest", "topic": "Structure of a Forest", "q": "How many basic layers does the structure of an evergreen/tropical forest have, as per the notes?", "opts": {"A": "Six", "B": "Five", "C": "Three", "D": "Four", "E": "Two"}, "ans": "D", "exp": "The notes list four basic layers: Emergent, Canopy, Understory, and Forest floor."}, {"part": "Part I: Forest", "topic": "Structure of a Forest", "q": "Which layer is made up of the tallest trees (about 100-200 ft tall), spaced out with buttress roots spreading up to 20-30 ft?", "opts": {"A": "Emergent layer", "B": "Understory", "C": "Forest floor", "D": "Canopy", "E": "Sub-canopy"}, "ans": "A", "exp": "The Emergent layer consists of the tallest trees (100-200 ft) with buttress roots spreading 20-30 ft."}, {"part": "Part I: Forest", "topic": "Structure of a Forest", "q": "The Brazil Nut tree and Kapok Tree are described as common trees of which forest layer?", "opts": {"A": "Emergent layer", "B": "Sub-canopy", "C": "Understory", "D": "Forest floor", "E": "Canopy"}, "ans": "A", "exp": "The notes mention Brazil Nut tree and Kapok Tree as common trees in the Emergent layer."}, {"part": "Part I: Forest", "topic": "Structure of a Forest", "q": "Which layer stops sunlight and rainwater from reaching the layers below, with trees growing up to about 130 ft with broad leaves and drip spouts?", "opts": {"A": "Emergent layer", "B": "None of the above", "C": "Understory", "D": "Forest floor", "E": "Canopy"}, "ans": "E", "exp": "The Canopy layer stops sunlight/rainwater from reaching lower layers and has trees up to ~130 ft with broad leaves and drip spouts."}, {"part": "Part I: Forest", "topic": "Structure of a Forest", "q": "Why are animal sounds loudest in the Canopy layer as per the notes?", "opts": {"A": "Because of extreme temperatures", "B": "Because of very high wind speed", "C": "Because visibility is low due to thick leaves/branches, so animals communicate by sound", "D": "Because of the presence of large predators", "E": "None of the above"}, "ans": "C", "exp": "Visibility is low from the thickness of leaves and branches, so animal sounds are loudest here as animals communicate through sound."}, {"part": "Part I: Forest", "topic": "Structure of a Forest", "q": "Trees in the Understory layer grow up to approximately what height?", "opts": {"A": "50 ft", "B": "130 ft", "C": "12 ft", "D": "300 ft", "E": "200 ft"}, "ans": "C", "exp": "The Understory has fewer trees, with shrubs and small trees growing up to about 12 ft high."}, {"part": "Part I: Forest", "topic": "Structure of a Forest", "q": "The wet, humid and dark nature of which layer makes it ideal for mosquitoes and bugs, along with frogs, snakes and termites?", "opts": {"A": "Understory", "B": "Emergent layer", "C": "None of the above", "D": "Canopy", "E": "Forest floor"}, "ans": "A", "exp": "The Understory's wet, humid, dark conditions make it an ideal home for insects, frogs, snakes, and mosquitoes."}, {"part": "Part I: Forest", "topic": "Structure of a Forest", "q": "Which animals are characteristic of the Forest floor as per the notes?", "opts": {"A": "Frogs and termites", "B": "None of the above", "C": "Hummingbirds and parrots", "D": "Squirrels, monkeys and reptiles", "E": "Scorpions, armadillos, wild cats and mongoose"}, "ans": "E", "exp": "The Forest floor is home to larger, heavier animals including scorpions, armadillos, wild cats, mongoose, lizards and snakes."}, {"part": "Part I: Forest", "topic": "Structure of a Forest", "q": "The Forest floor is characterized by:", "opts": {"A": "Sandy soil rich in nutrients", "B": "Rich, fertile, deep soils", "C": "None of the above", "D": "Complete absence of soil", "E": "Shallow soils of poor quality with micro-organisms feeding on decaying matter"}, "ans": "E", "exp": "The forest floor has shallow soils of poor quality, with micro-organisms and life-forms feeding on decaying matter."}, {"part": "Part I: Forest", "topic": "Definition & Origin", "q": "Legally, a forest is defined as:", "opts": {"A": "An area of land proclaimed to be a forest under a forest law", "B": "None of the above", "C": "A plant community with a closed canopy", "D": "An area used only for timber production", "E": "An area with woody vegetation providing climatic benefits"}, "ans": "A", "exp": "Legally, a forest is an area of land proclaimed to be a forest under a forest law."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Age", "q": "True even-aged forests, in the strictest sense, can only be:", "opts": {"A": "Coppice forests", "B": "Protection forests", "C": "Mixed forests", "D": "Man-made forests", "E": "Natural forests"}, "ans": "D", "exp": "The notes state true even-aged forests can be only man-made forests."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Age", "q": "In naturally regenerating forests not harvested for 100 years or more, what age difference is usually allowed for a forest to still be called 'even-aged'?", "opts": {"A": "15% of the rotation", "B": "No difference is allowed", "C": "25% of the rotation", "D": "50% of the rotation", "E": "10% of the rotation"}, "ans": "C", "exp": "Differences of up to 25% of the rotation are usually allowed in cases where the forest is not harvested for 100 years or more."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Age", "q": "A forest in which trees vary widely in age is called:", "opts": {"A": "Pure forest", "B": "Normal forest", "C": "Abnormal forest", "D": "Uneven aged / irregular forest", "E": "Even aged forest"}, "ans": "D", "exp": "A forest is called uneven-aged or irregular when trees vary widely in age."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Regeneration", "q": "When forest regeneration is obtained from seed, the forest is called:", "opts": {"A": "Coppice forest", "B": "High forest", "C": "Man-made forest", "D": "Natural forest", "E": "Mixed forest"}, "ans": "B", "exp": "When regeneration is obtained from seed, it is called a High Forest."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Regeneration", "q": "When regeneration is through coppice or some vegetative part of the tree, the forest is called:", "opts": {"A": "Normal forest", "B": "High forest", "C": "Coppice forest", "D": "Abnormal forest", "E": "Pure forest"}, "ans": "C", "exp": "When regeneration is through coppice or a vegetative part of the tree, it is called a Coppice Forest."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Regeneration", "q": "Forests obtained artificially (not naturally) are also called:", "opts": {"A": "Plantations", "B": "Protected forests", "C": "Coppice forests", "D": "Unclassed forests", "E": "Reserved forests"}, "ans": "A", "exp": "When obtained artificially, forests are called Man-made forests or Plantations."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Composition", "q": "Pure forests are composed almost entirely of one species, usually to the extent of not less than what percentage?", "opts": {"A": "25%", "B": "75%", "C": "50%", "D": "40%", "E": "90%"}, "ans": "C", "exp": "Pure forests are composed almost entirely of one species, usually to the extent of not less than 50 per cent."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Composition", "q": "A forest composed of trees of two or more species intermingled in the same canopy is defined as:", "opts": {"A": "Pure forest", "B": "High forest", "C": "Normal forest", "D": "Mixed forest", "E": "Abnormal forest"}, "ans": "D", "exp": "Mixed forests are defined as forests composed of trees of two or more species intermingled in the same canopy."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Management", "q": "Forests managed primarily for ameliorating climate, checking soil erosion/floods, and conserving soil and water are called:", "opts": {"A": "Pure forests", "B": "Government forests", "C": "Production forests", "D": "Social forests", "E": "Protection forests"}, "ans": "E", "exp": "Protection forests are managed primarily for ameliorating climate, checking soil erosion and floods, and conserving soil/water."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Management", "q": "Forests managed primarily for their produce are called:", "opts": {"A": "Village forests", "B": "Private forests", "C": "Production forests", "D": "Protection forests", "E": "Social forests"}, "ans": "C", "exp": "Production forests are those managed primarily for their produce."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Management", "q": "Forests where the produce is utilized by the neighbouring society are called:", "opts": {"A": "Production forests", "B": "Reserved forests", "C": "Protection forests", "D": "Government forests", "E": "Social forests"}, "ans": "E", "exp": "Social forests are where the produce is utilized by the neighbouring society."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Ownership", "q": "A Reserved Forest, having complete protection, is constituted under which chapter of the Indian Forest Act, 1927?", "opts": {"A": "Chapter III", "B": "Chapter I", "C": "Chapter IV", "D": "Chapter II", "E": "Chapter V"}, "ans": "D", "exp": "A Reserved Forest is an area with complete protection, constituted according to Chapter II of the Indian Forest Act, 1927."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Ownership", "q": "A Protected Forest, subject to a limited degree of protection, is constituted under which chapter of the Indian Forest Act, 1927?", "opts": {"A": "Chapter III", "B": "Chapter I", "C": "Chapter V", "D": "Chapter II", "E": "Chapter IV"}, "ans": "E", "exp": "A Protected Forest is constituted under the provisions of Chapter IV of the Indian Forest Act, 1927."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Ownership", "q": "A Village Forest, being a state forest assigned to a village community, is constituted under which chapter of the Indian Forest Act?", "opts": {"A": "Chapter V", "B": "Chapter I", "C": "Chapter III", "D": "Chapter II", "E": "Chapter IV"}, "ans": "C", "exp": "A Village Forest is a state forest assigned to a village community under the provisions of Chapter III of the Indian Forest Act."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Ownership", "q": "Which of the following statements regarding ownership-based classification of forests is INCORRECT?", "opts": {"A": "Village Forest - assigned under Chapter III", "B": "Reserved Forest - complete protection under Chapter II", "C": "Government forests - owned by the government", "D": "Private Forest - owned by the state or municipal authorities", "E": "Protected Forest - limited protection under Chapter IV"}, "ans": "D", "exp": "A private forest is specifically defined as one that is NOT owned by municipal authorities, church authorities, or the state; it is owned by a natural/juridical person or partnership."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Growing Stock", "q": "An ideal forest regarding growing stock and age class distribution, where periodic removal of produce equals the increment and can continue indefinitely, is called:", "opts": {"A": "Coppice forest", "B": "Abnormal forest", "C": "Normal forest", "D": "High forest", "E": "Pure forest"}, "ans": "C", "exp": "A Normal Forest is ideal regarding growing stock and age class distribution, where annual/periodic removal equals increment and can continue indefinitely."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Growing Stock", "q": "A forest whose growing stock, age class distribution, or increment is either in excess or (more usually) in deficit compared to the normal forest is called:", "opts": {"A": "Abnormal forest", "B": "Production forest", "C": "Mixed forest", "D": "Pure forest", "E": "Normal forest"}, "ans": "A", "exp": "Abnormal forest is one which is not normal -- growing stock, age class distribution, increment etc. are in excess or, more usually, in deficit."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Age", "q": "Even-aged and Uneven-aged are classifications of forest based on which criterion?", "opts": {"A": "Ownership", "B": "Composition", "C": "Regeneration", "D": "Age", "E": "Management"}, "ans": "D", "exp": "Even-aged and Uneven-aged forests are classified on the basis of age."}, {"part": "Part II: Classification of Forests", "topic": "Overview", "q": "Which of the following is NOT explicitly listed in the notes as a basis for classifying forests?", "opts": {"A": "Age", "B": "Climate zone", "C": "Composition", "D": "Growing stock", "E": "Regeneration"}, "ans": "B", "exp": "The notes list classification bases as Age, Regeneration, Composition, Management, Ownership, and Growing Stock -- not 'climate zone'."}, {"part": "Part II: Classification of Forests", "topic": "Classification by Ownership", "q": "Besides Government and Private forests, which category of ownership is also mentioned in the notes?", "opts": {"A": "Forests owned by Corporations, Panchayats, Societies and other agencies", "B": "Reserved forests", "C": "None of the above", "D": "Community forests", "E": "Protection forests"}, "ans": "A", "exp": "The notes mention a category of forests owned by Corporations, Panchayats, Societies and other Agencies."}, {"part": "Part III: Forestry (Definition & Forest Crops)", "topic": "Definition", "q": "Forestry is defined in the notes as:", "opts": {"A": "The study of tree diseases", "B": "The science of growing agricultural crops only", "C": "The art of afforestation alone", "D": "None of the above", "E": "The theory and practice of all that constitutes creation, conservation and scientific management of forests and utilization of their resources"}, "ans": "E", "exp": "Forestry is defined as the theory and practice of all that constitutes the creation, conservation and scientific management of forests and the utilization of their resources."}, {"part": "Part III: Forestry (Definition & Forest Crops)", "topic": "Forest Crops", "q": "Chir pine (Pinus roxburghii) belongs to which plant family?", "opts": {"A": "Santalaceae", "B": "Poaceae", "C": "Pinaceae", "D": "Fabaceae", "E": "Verbenaceae"}, "ans": "C", "exp": "Chir pine (Pinus roxburghii) belongs to family Pinaceae as listed among the important forest crops."}, {"part": "Part III: Forestry (Definition & Forest Crops)", "topic": "Forest Crops", "q": "Teak (Tectona grandis) belongs to which family?", "opts": {"A": "Fabaceae", "B": "Poaceae", "C": "Santalaceae", "D": "Verbenaceae", "E": "Pinaceae"}, "ans": "D", "exp": "Teak (Tectona grandis) belongs to family Verbenaceae."}, {"part": "Part III: Forestry (Definition & Forest Crops)", "topic": "Forest Crops", "q": "Sandal (Santalum album Linn.) belongs to which family?", "opts": {"A": "Verbenaceae", "B": "Poaceae", "C": "Santalaceae", "D": "Fabaceae", "E": "Pinaceae"}, "ans": "C", "exp": "Sandal (Santalum album Linn.) belongs to family Santalaceae."}, {"part": "Part III: Forestry (Definition & Forest Crops)", "topic": "Forest Crops", "q": "Shisham (Dalbergia sissoo) and Babul (Acacia catechu) both belong to which family?", "opts": {"A": "Fabaceae / Leguminosae", "B": "Verbenaceae", "C": "Santalaceae", "D": "Poaceae", "E": "Pinaceae"}, "ans": "A", "exp": "Both Shisham (Dalbergia sissoo) and Babul (Acacia catechu) belong to family Fabaceae or Leguminosae."}, {"part": "Part III: Forestry (Definition & Forest Crops)", "topic": "Forest Crops", "q": "Which species-family pairing is INCORRECT among the important forest crops listed?", "opts": {"A": "Babul - Fabaceae", "B": "Teak - Verbenaceae", "C": "Bamboo (Bambusa vulgaris) - Poaceae/Gramineae", "D": "Sandal - Santalaceae", "E": "Chir pine - Fabaceae"}, "ans": "E", "exp": "Chir pine (Pinus roxburghii) belongs to family Pinaceae, not Fabaceae."}, {"part": "Part III: Forestry (Definition & Forest Crops)", "topic": "Definition", "q": "In simpler terms, Forestry as per the notes is the application of:", "opts": {"A": "Scientific, economic and social principles to attain specific objectives in the care of a forest", "B": "Only legal principles to forest ownership", "C": "Political principles to timber pricing", "D": "None of the above", "E": "Only recreational planning to city parks"}, "ans": "A", "exp": "In simpler terms, Forestry is the application of scientific, economic, and social principles to attain specific objectives in the care of a forest."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "NCA Classification", "q": "The classification of forests into Protection, Production and Social forests was proposed by the National Commission of Agriculture in which year?", "opts": {"A": "1988", "B": "1976", "C": "1968", "D": "1990", "E": "1927"}, "ans": "B", "exp": "The National Commission of Agriculture (1976) proposed this classification of forests."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Protection Forests", "q": "The practice of managing forests to protect a site due to instability of terrain, nature of soil, or geological formations is called:", "opts": {"A": "Commercial forestry", "B": "Production forestry", "C": "Protection forestry", "D": "Industrial forestry", "E": "Social forestry"}, "ans": "C", "exp": "In protection forestry, the object is to protect the site due to instability of terrain, nature of soil, geological formations, etc."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Protection Forests", "q": "Which of the following areas may be included under Protection Forests as per the notes?", "opts": {"A": "Village common lands only", "B": "None of the above", "C": "Higher hill slopes, national parks and sanctuaries, biosphere reserves", "D": "Urban parks only", "E": "Farmlands only"}, "ans": "C", "exp": "Forests on higher hill slopes, national parks and sanctuaries, preservation plots, biosphere/nature reserves and wilderness areas may be included under protection forests."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Production Forests", "q": "The practice of forestry aiming at maximum production of timber, fuel wood and other forest products as a business enterprise is called:", "opts": {"A": "Extension forestry", "B": "Industrial forestry", "C": "Protection forestry", "D": "Social forestry", "E": "Commercial forestry"}, "ans": "E", "exp": "Commercial forestry aims at maximum production of timber, fuel wood and other forest products as a business enterprise."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Production Forests", "q": "Forestry that aims at producing raw material required for industry is called:", "opts": {"A": "Farm forestry", "B": "Industrial forestry", "C": "Protection forestry", "D": "Commercial forestry", "E": "Community forestry"}, "ans": "B", "exp": "Industrial forestry aims at producing raw material required for industry."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry", "q": "The term 'Social Forestry' was coined by whom, and where?", "opts": {"A": "FAO in 1972", "B": "Westoby at the 9th Commonwealth Forestry Congress, 1968", "C": "NCA in its 1976 report", "D": "Government of India in the 1988 policy", "E": "Ministry of Environment in 1990"}, "ans": "B", "exp": "The word social forestry was coined by Westoby and used at the Ninth Commonwealth Forestry Congress in 1968."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry", "q": "Which of the following is NOT one of the objectives of social forestry adopted by the NCA (1976)?", "opts": {"A": "Protection of agricultural fields against wind and recreational needs", "B": "Maximizing export of timber to earn foreign exchange", "C": "Small timber supply", "D": "Fodder supply", "E": "Fuel wood supply to rural areas and replacement of cowdung"}, "ans": "B", "exp": "The NCA (1976) objectives were: fuel wood supply/cowdung replacement, small timber supply, fodder supply, and wind protection/recreational needs -- not timber export."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "The practice of forestry on farmlands is called:", "opts": {"A": "Farm forestry", "B": "Community forestry", "C": "Aesthetic forestry", "D": "Extension forestry", "E": "Recreational forestry"}, "ans": "A", "exp": "Practice of forestry on farmlands is farm forestry."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "The practice of forestry outside farmlands and outside reserve forests is called:", "opts": {"A": "Extension forestry", "B": "Commercial forestry", "C": "Community forestry", "D": "Farm forestry", "E": "Industrial forestry"}, "ans": "A", "exp": "Practice of forestry outside the farmlands and outside the reserve forests is extension forestry."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "Forestry practiced on lands outside the conventional forest area for the benefit of the local population is called:", "opts": {"A": "Farm forestry", "B": "Community forestry", "C": "Protection forestry", "D": "Recreational forestry", "E": "Extension forestry"}, "ans": "B", "exp": "The practice of forestry on lands outside the conventional forest area for the benefit of local population is called Community forestry."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "As defined by NCA (1976), Farm Forestry is the practice of forestry:", "opts": {"A": "In all its aspects on farms or village lands, generally integrated with other farm operations", "B": "Only along canal banks", "C": "Only within reserve forests", "D": "Only by government agencies", "E": "None of the above"}, "ans": "A", "exp": "Farm Forestry is defined by NCA (1976) as the practice of forestry in all its aspects on farms or village lands, generally integrated with other farm operations."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "Which of the following is NOT included under Extension Forestry activities as per the notes?", "opts": {"A": "Plantations along road sides and canal banks", "B": "Plantations along railway lines", "C": "Raising trees in community forest areas", "D": "Regeneration of core reserved forest areas", "E": "Raising trees on farmlands and village wastelands"}, "ans": "D", "exp": "Extension forestry includes raising trees on farmlands, village wastelands, community forest areas, and along roads/canal banks/railway lines -- not core reserved forest regeneration."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "A 'Shelterbelt' is defined in the notes as:", "opts": {"A": "A belt of trees and/or shrubs maintained for shelter from wind, sun, snow drift etc.", "B": "A zone reserved exclusively for wildlife protection", "C": "None of the above", "D": "A coppice forest planted along rivers", "E": "A plantation created only for timber production"}, "ans": "A", "exp": "Shelterbelt is defined as a belt of trees and/or shrubs maintained for the purpose of shelter from wind, sun, snow drift etc."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "Linear Strip plantations, as described under Extension Forestry, involve:", "opts": {"A": "Mixed species in dense stands", "B": "Only coppice species", "C": "Fast-growing species planted on linear strips of land", "D": "Slow-growing species planted in circular plots", "E": "None of the above"}, "ans": "C", "exp": "Linear Strip plantations are plantations of fast-growing species on linear strips of land."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "The practice of forestry aimed at developing/maintaining forests of high scenic value, often near towns and cities, is called:", "opts": {"A": "Protection forestry", "B": "Recreational (also known as Aesthetic) forestry", "C": "Farm forestry", "D": "Extension forestry", "E": "Industrial forestry"}, "ans": "B", "exp": "Recreational forestry -- also known as Aesthetic forestry -- is the practice of developing/maintaining forests of high scenic value."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "Rehabilitation of Degraded Forests, as per the notes, primarily aims to:", "opts": {"A": "Discourage local employment", "B": "Grow short rotation fuel and timber species to meet requirements", "C": "None of the above", "D": "Increase pilferage from neighbouring commercial forests", "E": "Reduce dependency on nearby rural centres"}, "ans": "B", "exp": "Rehabilitation of degraded forests aims to grow short rotation fuel and timber species, organize fuelwood supplies, provide employment, and rehabilitate degraded forests."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Benefits of Social Forestry", "q": "Which of the following is NOT listed as a benefit of Social Forestry?", "opts": {"A": "Recreation", "B": "Increase in urban real estate prices", "C": "Employment opportunities in rural and urban areas", "D": "Reduction of pressure on national forests", "E": "Prevention of soil erosion"}, "ans": "B", "exp": "Increase in urban real estate prices is not listed among the benefits of social forestry in the notes."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Agro-Forestry (under Social Forestry)", "q": "Agro-forestry has been defined as a sustainable land management system that:", "opts": {"A": "Combines production of crops and forest plants and/or animals on the same unit of land, simultaneously or sequentially", "B": "None of the above", "C": "Focuses solely on livestock rearing", "D": "Grows trees for timber only", "E": "Excludes local cultural practices from management"}, "ans": "A", "exp": "Agro-forestry increases yield by combining crops with forest plants and/or animals on the same land, applying management compatible with local cultural practices."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry vs Agroforestry", "q": "As per the notes' distinction, Social Forestry primarily aims at:", "opts": {"A": "Legal protection of reserved forests", "B": "Combining food crops with tree crops only", "C": "None of the above", "D": "Livestock rearing exclusively", "E": "Providing a continuous flow of goods and services for the benefit of people, outside conventional forests"}, "ans": "E", "exp": "Social forestry is defined as 'Forestry outside the conventional forests which primarily aims at providing continuous flow of goods and services for the benefit of people.'"}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry vs Agroforestry", "q": "Unlike social forestry, Agroforestry specifically combines:", "opts": {"A": "Only timber species", "B": "None of the above", "C": "Food crops (annuals) with tree crops (perennials) and/or livestock on the same land", "D": "Wildlife conservation with tourism", "E": "Only fuelwood species"}, "ans": "C", "exp": "Agroforestry combines food crops (annuals) with tree crops (perennials) and/or livestock on the same unit of land, alternately or simultaneously."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Overview", "q": "Which of the following forestry type-description pairs is INCORRECT?", "opts": {"A": "Industrial forestry - producing raw material for industry", "B": "Commercial forestry - business enterprise for maximum production", "C": "Farm forestry - practiced only inside reserved forests", "D": "Community forestry - involves local community outside conventional forest area", "E": "Recreational forestry - also known as Aesthetic forestry"}, "ans": "C", "exp": "Farm forestry is practiced on farms/village lands, not inside reserved forests."}, {"part": "Part IV: NCA (1976) Classification & Social Forestry", "topic": "Social Forestry Practices", "q": "Social forestry may be sub-divided into which practices as per the notes?", "opts": {"A": "Protection forestry and Production forestry", "B": "None of the above", "C": "Farm forestry, Extension forestry, and Urban forestry", "D": "Commercial forestry and Industrial forestry only", "E": "High forest and Coppice systems"}, "ans": "C", "exp": "Social forestry may be sub-divided into farm forestry, extension forestry and urban forestry."}, {"part": "Part V: Branches of Forestry", "topic": "Overview", "q": "How many branches does Forestry have, as per the notes?", "opts": {"A": "Five", "B": "Six", "C": "Four", "D": "Three", "E": "Seven"}, "ans": "A", "exp": "Forestry has five branches: Silviculture, Mensuration, Silviculture system, Management, and Utilization."}, {"part": "Part V: Branches of Forestry", "topic": "Overview", "q": "Which of the following is NOT one of the five branches of forestry listed in the notes?", "opts": {"A": "Management", "B": "Utilization", "C": "Silviculture", "D": "Mensuration", "E": "Dendrology"}, "ans": "E", "exp": "Dendrology is a defined term (identification/classification of trees), not one of the five listed branches of forestry."}, {"part": "Part V: Branches of Forestry", "topic": "Silviculture", "q": "The branch of forestry dealing with the establishment, development, care and reproduction of stands of timber is:", "opts": {"A": "Silvicultural system", "B": "Silviculture", "C": "Mensuration", "D": "Utilization", "E": "Management"}, "ans": "B", "exp": "Silviculture is that branch of forestry which deals with the establishment, development, care and reproduction of stands of timber."}, {"part": "Part V: Branches of Forestry", "topic": "Silviculture", "q": "As per the objectives of silviculture, the labour component accounts for what percentage of total financial input in a plantation operation?", "opts": {"A": "10-20%", "B": "80-90%", "C": "20-30%", "D": "40-50%", "E": "60-70%"}, "ans": "E", "exp": "In any plantation operation, the labour component accounts for 60 to 70% of the total financial input."}, {"part": "Part V: Branches of Forestry", "topic": "Silviculture", "q": "Which of the following is NOT listed as an objective of silviculture?", "opts": {"A": "Maximizing agricultural crop yield", "B": "Reduction of rotation period", "C": "Afforestation of blank areas", "D": "Introduction of exotics", "E": "Production of high-quality timber"}, "ans": "A", "exp": "Silviculture's objectives relate to forest crops (environmental benefits, quality timber, afforestation, exotics, employment, forest industries) -- not maximizing agricultural crop yield."}, {"part": "Part V: Branches of Forestry", "topic": "Mensuration", "q": "Forest mensuration primarily involves measuring:", "opts": {"A": "None of the above", "B": "Dimensions, age, and increment of individual trees and forest crops", "C": "Only soil fertility", "D": "Only market prices of timber", "E": "Only tree height"}, "ans": "B", "exp": "Forest mensuration involves measuring forest produce, such as dimensions, age, and increment of individual trees and forest crops."}, {"part": "Part V: Branches of Forestry", "topic": "Mensuration", "q": "Which technology is specifically mentioned as being tested for modeling crown structure and inventory purposes?", "opts": {"A": "GPS", "B": "MODIS", "C": "Tree-ring analysis", "D": "Aerial photographs only", "E": "LiDAR (Light Detection and Ranging)"}, "ans": "E", "exp": "LiDAR is tested for modeling crown structure and inventory purposes."}, {"part": "Part V: Branches of Forestry", "topic": "Mensuration", "q": "Which type of imagery is mentioned as being used to estimate net primary productivity and leaf area index?", "opts": {"A": "Ultrasound devices", "B": "GPS", "C": "None of the above", "D": "LiDAR", "E": "MODIS"}, "ans": "E", "exp": "MODIS imagery has been used to estimate forest productivity measures like net primary productivity and leaf area index."}, {"part": "Part V: Branches of Forestry", "topic": "Mensuration", "q": "Global Positioning Systems (GPS) are primarily used in forestry for:", "opts": {"A": "Measuring tree age directly", "B": "None of the above", "C": "Determining ground positions", "D": "Testing wood quality", "E": "Estimating leaf area index"}, "ans": "C", "exp": "GPS is widely used for determining ground positions in forestry."}, {"part": "Part V: Branches of Forestry", "topic": "Silvicultural System", "q": "Which of the following is NOT one of the essential characteristics of a silvicultural system as per the notes?", "opts": {"A": "Tending of new crops", "B": "Method of regeneration", "C": "All except D are correct essential characteristics", "D": "Pattern of felling for harvesting a mature crop", "E": "Pricing of timber in international markets"}, "ans": "E", "exp": "The essential characteristics are: pattern of felling, method of regeneration, and tending of new crops -- not international timber pricing."}, {"part": "Part V: Branches of Forestry", "topic": "Silvicultural System", "q": "According to the mode of regeneration, silvicultural systems are classified into which two types?", "opts": {"A": "Pure and Mixed systems", "B": "Even-aged and Uneven-aged systems", "C": "None of the above", "D": "High Forest and Coppice silvicultural systems", "E": "Protection and Production systems"}, "ans": "D", "exp": "According to the method of regeneration, silvicultural systems are High Forest Silvicultural Systems and Coppice Silvicultural Systems."}, {"part": "Part V: Branches of Forestry", "topic": "Silvicultural System", "q": "High Forest Silvicultural Systems are characterized by:", "opts": {"A": "Regeneration of seedling origin (natural or artificial), generally with a long rotation", "B": "No regeneration mechanism", "C": "Regeneration mainly from coppice, with short rotation", "D": "Only vegetative propagation", "E": "None of the above"}, "ans": "A", "exp": "High Forest systems have regeneration normally of seedling origin (natural, artificial, or combination), with generally long rotation."}, {"part": "Part V: Branches of Forestry", "topic": "Silvicultural System", "q": "Which of the following is a 'System of concentrated regeneration' under High Forest systems?", "opts": {"A": "Accessory system", "B": "Clear Felling system", "C": "Selection system", "D": "Two storied high forest", "E": "High forest with reserve"}, "ans": "B", "exp": "Clear Felling System is listed under systems of concentrated regeneration, along with Shelterwood and Seed Tree systems."}, {"part": "Part V: Branches of Forestry", "topic": "Silvicultural System", "q": "Which of the following is a 'System of diffused regeneration'?", "opts": {"A": "None of the above", "B": "Shelterwood system", "C": "Selection system", "D": "Clear felling system", "E": "Seed tree system"}, "ans": "C", "exp": "Selection System (Single/Group Selection) is a system of diffused regeneration, along with the Accessory System."}, {"part": "Part V: Branches of Forestry", "topic": "Silvicultural System", "q": "Which of the following is NOT listed as a sub-type of the Shelterwood system?", "opts": {"A": "Group system", "B": "Clear strip system", "C": "Indian Irregular System", "D": "Strip system", "E": "Uniform system"}, "ans": "B", "exp": "Clear strip belongs to the Clear Felling System, not the Shelterwood system."}, {"part": "Part V: Branches of Forestry", "topic": "Silvicultural System", "q": "Coppice Silvicultural Systems are characterized by:", "opts": {"A": "None of the above", "B": "Crop originating mainly from coppice, with short rotation", "C": "Crop originating from seed, with long rotation", "D": "No harvesting of the crop", "E": "Use only in protection forests"}, "ans": "B", "exp": "The Coppice system is one in which the crop originates mainly from coppice and the rotation is short."}, {"part": "Part V: Branches of Forestry", "topic": "Silvicultural System", "q": "Which of the following is NOT a type of Coppice (Low Forest) Silvicultural System listed in the notes?", "opts": {"A": "Uniform Seed Tree System", "B": "Simple Coppice System", "C": "Coppice with standards system", "D": "Coppice Selection System", "E": "The Pollard System"}, "ans": "A", "exp": "Uniform Seed Tree System belongs under the High Forest Seed Tree System, not the Coppice systems."}, {"part": "Part V: Branches of Forestry", "topic": "Management", "q": "Forest management, as defined, is concerned with:", "opts": {"A": "None of the above", "B": "Only timber extraction", "C": "Only wildlife conservation", "D": "Only silviculture", "E": "Overall administrative, economic, legal, social, scientific and technical aspects of forest estate"}, "ans": "E", "exp": "Forest management is a branch of forestry concerned with overall administrative, economic, legal and social aspects, as well as scientific and technical aspects such as silviculture and protection."}, {"part": "Part V: Branches of Forestry", "topic": "Management", "q": "Forest inventory primarily provides information on:", "opts": {"A": "Only market demand for timber", "B": "Weather patterns only", "C": "The quality and quantity of forest resources, forming the basis for planning and policy", "D": "None of the above", "E": "Wildlife census only"}, "ans": "C", "exp": "Forest inventory provides information on the quality and quantity of forest resources, forming the basis for forest planning and policy."}, {"part": "Part V: Branches of Forestry", "topic": "Forest Economics", "q": "As per forest economics, the shortest crop cycle mentioned (hybrid poplar for pulpwood) is approximately:", "opts": {"A": "5 years", "B": "25 years", "C": "15 years", "D": "10 years", "E": "20 years"}, "ans": "D", "exp": "The notes state the shortest crop cycle, that of hybrid poplar for pulpwood, is approximately 10 years."}, {"part": "Part V: Branches of Forestry", "topic": "Forest Economics", "q": "The concept whereby the ideal harvest date is set by its calculated maximum value to the owner is called:", "opts": {"A": "Financial rotation", "B": "Ecological rotation", "C": "None of the above", "D": "Biological rotation", "E": "Silvicultural rotation"}, "ans": "A", "exp": "Support has grown for the concept of financial rotation, whereby the ideal harvest date is set by its calculated maximum value to the owner."}, {"part": "Part V: Branches of Forestry", "topic": "Forest Economics", "q": "The traditional approach in professional forestry emphasized which criterion for determining forest maturity?", "opts": {"A": "Political considerations", "B": "Financial value to the owner", "C": "Tourism potential", "D": "None of the above", "E": "Biological growth (maturity when saw log size timber is available)"}, "ans": "E", "exp": "The traditional approach in professional forestry was to emphasize biological growth -- a forest was mature when timber of saw log size was available."}, {"part": "Part V: Branches of Forestry", "topic": "Utilization", "q": "Which branch of forestry deals with harvesting, marketing, conservation and applying forest produce to a variety of uses?", "opts": {"A": "Silvicultural system", "B": "Silviculture", "C": "Mensuration", "D": "Utilization", "E": "Management"}, "ans": "D", "exp": "Utilization is the branch of forestry which deals with harvesting, marketing, conservation and applying the forest produce to a variety of uses."}, {"part": "Part V: Branches of Forestry", "topic": "Forest Economics", "q": "Which of the following is NOT mentioned in the notes as a fiscal factor affecting a forestry operation's viability?", "opts": {"A": "International currency exchange rate policy", "B": "Marketing constraints", "C": "Taxation", "D": "Industrial legislation and regulation", "E": "Labor markets"}, "ans": "A", "exp": "The notes list taxation, industrial legislation/regulation, labor markets, and marketing constraints, among others -- not currency exchange rate policy."}, {"part": "Part V: Branches of Forestry", "topic": "Mensuration", "q": "Which of the following is NOT correctly listed among recent developments in forest mensuration?", "opts": {"A": "Laser and ultrasound-based measuring devices", "B": "Drones", "C": "Terrestrial and airborne laser scanning", "D": "Manual chain surveying as the primary modern method", "E": "Advanced remote sensing techniques"}, "ans": "D", "exp": "Recent developments include laser/ultrasound devices, drones, laser scanning, and remote sensing -- manual chain surveying is not described as the primary modern method."}, {"part": "Part V: Branches of Forestry", "topic": "Overview", "q": "Which of the following branch-focus pairs is INCORRECT?", "opts": {"A": "Silviculture - raising and reproduction of forest crops", "B": "Management - administrative/economic/legal aspects of forest estate", "C": "Mensuration - measurement of trees/forest produce", "D": "Utilization - harvesting, marketing and use of forest produce", "E": "Silvicultural system - the study of wildlife behaviour"}, "ans": "E", "exp": "Silvicultural system deals with felling, regeneration, and tending of forest crops, not the study of wildlife behaviour."}, {"part": "Part V: Branches of Forestry", "topic": "Management", "q": "Forest management techniques mentioned in the notes include timber extraction, planting/replanting, cutting roads/pathways and:", "opts": {"A": "Building urban housing colonies", "B": "Preventing fire", "C": "None of the above", "D": "Establishing stock exchanges", "E": "Mining mineral resources"}, "ans": "B", "exp": "Techniques include timber extraction, planting and replanting, cutting roads and pathways through forests, and preventing fire."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Tree Operations", "q": "Cutting off the branch of a plant, above the reach of browsing animals, to produce a flush of new shoots is called:", "opts": {"A": "Tending", "B": "Lopping", "C": "Pollarding", "D": "Coppicing", "E": "Pruning"}, "ans": "C", "exp": "Pollarding is the process in which the branch of a plant is cut off above browsing-animal reach to produce a flush of new shoots."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Tree Operations", "q": "Pollarding is widely adopted on Salix trees (Willow) in which region as per the notes?", "opts": {"A": "Kashmir Valley", "B": "Andhra Pradesh", "C": "U.P. Hills", "D": "Punjab", "E": "Kerala"}, "ans": "A", "exp": "Pollarding has been widely adopted on Salix trees (Willow) in the Kashmir Valley."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Tree Operations", "q": "Pollarding of Hardwickia binata (Anjan) is practiced in:", "opts": {"A": "Tamil Nadu", "B": "U.P. Hills", "C": "Punjab", "D": "Andhra Pradesh", "E": "Kashmir Valley"}, "ans": "D", "exp": "Hardwickia binata (Anjan) pollarding is practiced in Andhra Pradesh as per the notes."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Tree Operations", "q": "The cutting of branches or young stems (leading to new shoot development), used on Diospyros (Temburni) for the bidi industry, is called:", "opts": {"A": "Felling", "B": "Coppicing", "C": "Pollarding", "D": "Lopping", "E": "Pruning"}, "ans": "D", "exp": "Lopping pertains to cutting of branches or young stems; it is carried out on Diospyros (Temburni) for the bidi industry."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Tree Operations", "q": "The cutting of branches from the bole in order to maintain the quality of timber is called:", "opts": {"A": "Pruning", "B": "Lopping", "C": "Tending", "D": "Felling", "E": "Pollarding"}, "ans": "A", "exp": "Pruning means the cutting of branches from the bole in order to maintain the quality of timber."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Silvicultural Systems (Terms)", "q": "The Taungya system originated in which country, and in which year?", "opts": {"A": "Burma, 1850", "B": "Myanmar, 1927", "C": "India, 1900", "D": "Thailand, 1876", "E": "Indonesia, 1850"}, "ans": "A", "exp": "The Taungya system was first evolved in Burma in 1850 as a mode of replanting vast teak areas."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Silvicultural Systems (Terms)", "q": "In the Burmese term 'Taungya', 'Toung' means hill; what does 'ya' mean?", "opts": {"A": "Cultivation", "B": "Tree", "C": "Forest", "D": "River", "E": "Village"}, "ans": "A", "exp": "Taungya is a Burmese word: 'Toung' = hill, 'ya' = cultivation."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Silvicultural Systems (Terms)", "q": "Under the Taungya system, labourers permitted to raise crops on the land are also responsible for:", "opts": {"A": "Only harvesting the crop", "B": "Wildlife management", "C": "Planting the forest species, and protection and well-being of the plantation", "D": "Selling timber directly in the market", "E": "None of the above"}, "ans": "C", "exp": "Under Taungya, labourers get permission to raise crops but are responsible for planting forest species and protecting/maintaining the plantation."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Silvicultural Systems (Terms)", "q": "Under the Taungya system, after approximately how many years are labourers typically required to move to another patch of land?", "opts": {"A": "15 years", "B": "10 years", "C": "5 years", "D": "2 years", "E": "3 years"}, "ans": "C", "exp": "After about five years or so, labourers are required to move to another patch of land under Taungya."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Tree Operations", "q": "When plants or seedlings are cut from near ground level and produce a flush of fresh shoots, this is known as:", "opts": {"A": "Pruning", "B": "Tending", "C": "Lopping", "D": "Pollarding", "E": "Coppicing"}, "ans": "E", "exp": "When certain plants or seedlings are cut from near ground level and produce a flush of fresh shoots, this is known as coppicing."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Nursery & Seed Terms", "q": "Plantations raised exclusively with the aim of producing seed are called:", "opts": {"A": "Seed production areas", "B": "Multipurpose wood lots", "C": "Protein banks", "D": "Seed orchards", "E": "Nursery beds"}, "ans": "D", "exp": "Seed orchards are plantations raised exclusively with the aim of producing seed."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Nursery & Seed Terms", "q": "Clonal seed orchards are raised by:", "opts": {"A": "Direct sowing of unselected seeds", "B": "Grafting clones of superior trees on 2-3 year old seedlings", "C": "None of the above", "D": "Tissue culture exclusively", "E": "Growing seedlings from superior seed only"}, "ans": "B", "exp": "Clonal seed orchards are raised by grafting clones of superior trees on 2-3-year-old seedlings."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Nursery & Seed Terms", "q": "Seed Production Areas (Seed Stands) are established by:", "opts": {"A": "Import of exotic species", "B": "Removal of inferior trees from the stand", "C": "None of the above", "D": "Planting fresh seed orchards", "E": "Grafting clones of superior trees"}, "ans": "B", "exp": "Seed stands are established by removal of inferior trees, unlike seed orchards which are plantations of genetically superior trees."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Nursery & Seed Terms", "q": "The transfer of seedlings kept in a nursery for more than a year to other beds is called:", "opts": {"A": "Coppicing", "B": "Grafting", "C": "Layering", "D": "Pricking out", "E": "Thinning"}, "ans": "D", "exp": "Pricking out refers to transplanting small seedlings individually into nursery beds or boxes when they need to be kept beyond a year."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Protective Plantations", "q": "A windbreak, as a protective plantation, is usually comprised of a few rows of trees/shrubs spaced how far apart?", "opts": {"A": "5 to 10 m", "B": "10 to 20 m", "C": "1 to 5 cm", "D": "No fixed spacing mentioned", "E": "0.5 to 2.5 m"}, "ans": "E", "exp": "A wind break is usually comprised of a few rows of trees (or shrubs) spaced at 0.5 to 2.5 m apart."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Protective Plantations", "q": "Shelter belts are planted in rows usually at what angle to the direction of the prevailing winds?", "opts": {"A": "Right angles", "B": "Any random angle", "C": "45 degrees", "D": "Parallel", "E": "None of the above"}, "ans": "A", "exp": "Shelter belts are planted in rows usually at right angles to the direction of the prevailing winds."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Protective Plantations", "q": "Which of the following is NOT listed as an aim of shelter belts?", "opts": {"A": "Provide general protection", "B": "Deflect the air current", "C": "Reduce the velocity of prevailing winds", "D": "Protect the leeward area from desiccating effects of hot winds", "E": "Increase soil salinity in the leeward area"}, "ans": "E", "exp": "Shelter belt aims are: deflecting air current, reducing wind velocity, general protection, and protecting the leeward area from hot winds -- not increasing salinity."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Silviculture Operations", "q": "'Tending' includes weeding, cleaning, thinning and improvement felling, but specifically EXCLUDES:", "opts": {"A": "Improvement felling", "B": "Cleaning", "C": "Regeneration felling and soil working", "D": "Thinning", "E": "Weeding"}, "ans": "C", "exp": "Tending does not include operations concerning regeneration, such as regeneration felling, soil working, and controlled burning."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Silviculture Operations", "q": "Removal of trees either singly or in small groups scattered all over the forest is called:", "opts": {"A": "Logging", "B": "Pruning", "C": "Thinning", "D": "Coppicing", "E": "Felling"}, "ans": "E", "exp": "Felling comprises removal of trees either singly or in small groups scattered all over the forest."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Afforestation Terms", "q": "Establishing a forest by artificial means on an area where no forest vegetation has existed for a long time in the past is called:", "opts": {"A": "None of the above", "B": "Succession", "C": "Regeneration", "D": "Afforestation", "E": "Reforestation"}, "ans": "D", "exp": "Afforestation is establishing a forest by artificial means on an area on which no forest vegetation has existed for a long time in the past."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Afforestation Terms", "q": "Re-establishing a forest by artificial means on an area which previously bore forest vegetation is called:", "opts": {"A": "Afforestation", "B": "Tending", "C": "Reforestation", "D": "None of the above", "E": "Succession"}, "ans": "C", "exp": "Reforestation is re-establishing a forest, by artificial means, on an area which previously bore forest vegetation and may have been felled or cleared recently."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "The age of a regular crop corresponding to its crop diameter is called:", "opts": {"A": "Rotation age", "B": "Age classification", "C": "None of the above", "D": "Coupe age", "E": "Age crop"}, "ans": "E", "exp": "'Age crop' is the age of a regular crop corresponding to its crop diameters."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "The standard height for measuring girth, diameter and basal area of standing trees in India is:", "opts": {"A": "4'3\" (1.30 m)", "B": "3'6\" (1.07 m)", "C": "4'0\" (1.22 m)", "D": "5'0\" (1.52 m)", "E": "4'6\" (1.37 m)"}, "ans": "E", "exp": "In India, the standard breast height for measurement is 4'6\" (1.37 m)."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "The standard breast height in the U.K. and most Commonwealth countries is:", "opts": {"A": "5'0\" (1.52 m)", "B": "4'6\" (1.37 m)", "C": "4'0\" (1.22 m)", "D": "3'6\" (1.07 m)", "E": "4'3\" (1.30 m)"}, "ans": "E", "exp": "In the U.K. and most Commonwealth countries, the standard breast height is 4'3\" (1.30 m), compared to India's 4'6\" (1.37 m)."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "A felling area, usually one of an annual series, preferably numbered with Roman numerals, is called a:", "opts": {"A": "Crown", "B": "Scrub", "C": "Stand", "D": "Coupe", "E": "Bole"}, "ans": "D", "exp": "A Coupe is a felling area, usually one of an annual series, preferably numbered with Roman numbers."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "The sum of the basal areas of all stems per unit area (for a crop) is called the:", "opts": {"A": "Bole area", "B": "Crown cover", "C": "Canopy density", "D": "None of the above", "E": "Basal area (of the crop)"}, "ans": "E", "exp": "Basal area, when applied to a crop, is the sum of basal areas of all the stems or the total basal area per unit area."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "The main stem of a tree is called the:", "opts": {"A": "Canopy", "B": "Bole", "C": "Pole", "D": "Crown", "E": "Log"}, "ans": "B", "exp": "The Bole is the main stem of a tree."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "Forest Canopy Density (FCD) refers to:", "opts": {"A": "The volume of timber per hectare", "B": "The number of tree species per hectare", "C": "The height of the tallest trees", "D": "The proportion of an area covered by tree crowns, expressed as a percentage of total area", "E": "None of the above"}, "ans": "D", "exp": "FCD refers to the proportion of a field/ground area covered by the crown of trees, expressed as a percentage of the total area."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "The identification and systematic classification of trees is called:", "opts": {"A": "Taxonomy of crops", "B": "Silviculture", "C": "Mensuration", "D": "None of the above", "E": "Dendrology"}, "ans": "E", "exp": "Dendrology is the identification and systematic classification of trees."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Legal Terms", "q": "An area with complete protection, constituted under Chapter II of the Indian Forest Act, is called a:", "opts": {"A": "Protected forest", "B": "None of the above", "C": "Village forest", "D": "Reserved forest", "E": "Unclassed forest"}, "ans": "D", "exp": "A Reserved forest is an area so constituted under the Indian Forest Act, with complete protection under Chapter II."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Legal Terms", "q": "Forest land owned by government but NOT constituted as reserved, village, or protected forest is called:", "opts": {"A": "Unclassed forest", "B": "Community forest", "C": "Private forest", "D": "Social forest", "E": "None of the above"}, "ans": "A", "exp": "Unclassed forest is forest land owned by government but not constituted into a reserved, village or protected forest."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Harvesting & Transport Terms", "q": "The stem of a tree, or a length of stem/branch after felling and trimming, is called a:", "opts": {"A": "Raft", "B": "Bole", "C": "Pole", "D": "Coupe", "E": "Log"}, "ans": "E", "exp": "A Log is the stem of a tree or a length of stem or branch after felling and trimming."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Harvesting & Transport Terms", "q": "The operation comprising felling of trees, limbing, bucking, and transportation of the resulting product out of the forest is called:", "opts": {"A": "Logging", "B": "Utilization", "C": "Felling", "D": "Tending", "E": "Pruning"}, "ans": "A", "exp": "Logging comprises felling of trees, limbing, bucking and transportation of the resulting product out of the forest (timber harvesting)."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Harvesting & Transport Terms", "q": "'Bucking', as referred to in the notes, means:", "opts": {"A": "Transporting logs by river", "B": "Removing tree bark", "C": "Measuring tree girth", "D": "Cutting a felled and delimbed tree into logs", "E": "None of the above"}, "ans": "D", "exp": "Bucking is the process of cutting a felled and delimbed tree into logs."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Harvesting & Transport Terms", "q": "A young tree from the time its lower branches begin to fall off to when height growth slows and crown expansion becomes marked is called a:", "opts": {"A": "Coupe", "B": "Bole", "C": "Crown", "D": "Pole", "E": "Log"}, "ans": "D", "exp": "A Pole is a young tree from when lower branches begin to fall off to when the rate of height growth slows and crown expansion becomes marked."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Harvesting & Transport Terms", "q": "An assemblage of logs, timbers or bamboos tied together (or enclosed within a boom) for transport by floating is called a:", "opts": {"A": "Stand", "B": "Scrub", "C": "Bole", "D": "Raft", "E": "Coupe"}, "ans": "D", "exp": "A Raft is an assemblage of logs, timbers or bamboos tied together or enclosed within a boom for transport by floating."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "Inferior growth consisting chiefly of small or stunted trees and shrubs is called:", "opts": {"A": "Succession", "B": "Pole", "C": "Crown", "D": "Scrub", "E": "Stand"}, "ans": "D", "exp": "Scrub is inferior growth consisting chiefly of small or stunted trees and shrubs."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "An aggregation of trees possessing sufficient uniformity to be distinguished from adjacent crops, forming a silvicultural unit, is called a:", "opts": {"A": "Stand", "B": "Bole", "C": "Scrub", "D": "Canopy", "E": "Coupe"}, "ans": "A", "exp": "A Stand is an aggregation of trees or other growth with sufficient uniformity to be distinguished from adjacent crops, forming a silvicultural unit."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Crop & Measurement Terms", "q": "The gradual replacement of one plant community by another in the development of vegetation towards a climax is called:", "opts": {"A": "None of the above", "B": "Tending", "C": "Rotation", "D": "Regeneration", "E": "Succession"}, "ans": "E", "exp": "Succession is the gradual replacement of one community by another in the development of vegetation towards a climax."}, {"part": "Part VI: Definitions and Terms Used in Forestry", "topic": "Overview", "q": "Which of the following term-definition pairs is INCORRECT?", "opts": {"A": "Coppicing - production of fresh shoots from plants cut near ground level", "B": "Taungya - a system of clonal seed orchard grafting", "C": "Lopping - cutting branches/young stems leading to new shoot development", "D": "Pollarding - cutting a branch above browsing height to produce new shoots", "E": "Pruning - cutting branches from the bole to maintain timber quality"}, "ans": "B", "exp": "Taungya is a modified shifting-cultivation replanting system (Burma, 1850), not a seed orchard grafting method."}, {"part": "Part VII: Agroforestry", "topic": "Classification of Systems", "q": "The classification of agroforestry systems based on four criteria -- structural, functional, socio-economic, and ecological -- was proposed by:", "opts": {"A": "Westoby (1968)", "B": "None of the above", "C": "NCA (1976)", "D": "Nair (1987)", "E": "FAO (1990)"}, "ans": "D", "exp": "Nair (1987) classified agroforestry systems based on Structural, Functional, Socio-economic, and Ecological criteria."}, {"part": "Part VII: Agroforestry", "topic": "Classification of Systems", "q": "Which of the following is NOT one of Nair's (1987) four criteria for classifying agroforestry systems?", "opts": {"A": "Structural basis", "B": "Political basis", "C": "Ecological basis", "D": "Functional basis", "E": "Socio-economic basis"}, "ans": "B", "exp": "Nair's four criteria are Structural, Functional, Socio-economic, and Ecological basis -- not political basis."}, {"part": "Part VII: Agroforestry", "topic": "Structural Classification", "q": "The Agrisilvicultural system is a combination of:", "opts": {"A": "Agriculture + Silviculture + Pastures", "B": "None of the above", "C": "Agriculture + Pastures", "D": "Agriculture + Silviculture", "E": "Silviculture + Pastures"}, "ans": "D", "exp": "Agrisilvicultural System involves the deliberate use of land for concurrent production of agricultural and tree crops (e.g., coffee, tea)."}, {"part": "Part VII: Agroforestry", "topic": "Structural Classification", "q": "The Silvopastoral system is defined as the intensive management and growing of:", "opts": {"A": "Only fruit orchards", "B": "None of the above", "C": "Perennial grasses or grass-legume mixes in a forest stand for livestock pasture", "D": "Only bees for honey", "E": "Only fish in ponds"}, "ans": "C", "exp": "Silvopastoral system is defined as the intensive management and growing of perennial grasses or grass-legume mixes in a forest stand for livestock pasture."}, {"part": "Part VII: Agroforestry", "topic": "Structural Classification", "q": "As per the notes, what percentage of the world's grazing land is estimated to use silvopasture techniques?", "opts": {"A": "15%", "B": "10%", "C": "40%", "D": "25%", "E": "5%"}, "ans": "A", "exp": "It is estimated that 15 percent of the world's grazing land uses silvopasture techniques."}, {"part": "Part VII: Agroforestry", "topic": "Silvopastoral Sub-systems", "q": "The 'Protein bank' system involves planting multipurpose (protein-rich) trees mainly for:", "opts": {"A": "Cut-and-carry fodder production to meet livestock needs during the winter deficit period", "B": "Fruit production only", "C": "Medicinal plant cultivation only", "D": "None of the above", "E": "Timber production only"}, "ans": "A", "exp": "In the protein bank system, protein-rich trees are planted for cut-and-carry fodder production to meet the fodder requirement during winter deficit."}, {"part": "Part VII: Agroforestry", "topic": "Silvopastoral Sub-systems", "q": "Which of the following trees is NOT mentioned in the notes as used in the Protein bank system?", "opts": {"A": "Bauhinia variegata", "B": "Tectona grandis", "C": "Dalbergia sissoo", "D": "Morus alba", "E": "Grewia optiva"}, "ans": "B", "exp": "Tectona grandis (Teak) is not listed among protein bank trees; Grewia optiva, Bauhinia variegata, Morus alba, and Dalbergia sissoo are."}, {"part": "Part VII: Agroforestry", "topic": "Silvopastoral Sub-systems", "q": "Live fences of fodder trees and hedges are planted mainly to:", "opts": {"A": "Increase soil fertility only", "B": "None of the above", "C": "Provide shade to crops", "D": "Produce honey", "E": "Protect farm property from stray animals/biotic influences"}, "ans": "E", "exp": "Live fences of fodder trees and shrubs are planted to protect the property from stray animals and other biotic influences."}, {"part": "Part VII: Agroforestry", "topic": "Silvopastoral Sub-systems", "q": "Which species is specifically mentioned as used for live fences in the notes?", "opts": {"A": "Tectona grandis", "B": "Bambusa vulgaris", "C": "Pinus roxburghii", "D": "Gliricidia sepium", "E": "Santalum album"}, "ans": "D", "exp": "Gliricidia sepium is among the species listed for live fences, along with Sesbania grandiflora and Erythrina abyssinica."}, {"part": "Part VII: Agroforestry", "topic": "Structural Classification", "q": "The Agrisilvopastoral system combines:", "opts": {"A": "Agriculture + Silviculture", "B": "Agriculture + Silviculture + Pastures", "C": "Silviculture + Pastures", "D": "Only Pastures", "E": "None of the above"}, "ans": "B", "exp": "Agrisilvopastoral (Agriculture + Silviculture + Pastures) combines a woody component with cattle and agriculture on the same site."}, {"part": "Part VII: Agroforestry", "topic": "Structural Classification", "q": "Home gardens are classified under which category of 'nature of components'?", "opts": {"A": "Silvopastoral systems", "B": "None of the above", "C": "Agrosilvopastoral systems", "D": "Agricultural systems", "E": "Other systems"}, "ans": "C", "exp": "Home gardens fall under Agrosilvopastoral systems, along with woody perennials for browse/mulch/green manure/soil conservation."}, {"part": "Part VII: Agroforestry", "topic": "Other Systems", "q": "Apiculture with trees, involving planting of nectar and pollen rich species, is primarily aimed at production of:", "opts": {"A": "Fruits", "B": "Timber", "C": "Fuelwood", "D": "Fodder", "E": "Honey"}, "ans": "E", "exp": "The main purpose of the apiculture-with-trees system is honey production."}, {"part": "Part VII: Agroforestry", "topic": "Other Systems", "q": "Aqua-forestry, involving cultivation of fish/prawn along with coconut and other trees on pond bunds, is most evident along which Indian coast as per the notes?", "opts": {"A": "Tamil Nadu coast", "B": "Odisha coast", "C": "Andhra coast", "D": "Gujarat coast", "E": "Kerala coast"}, "ans": "C", "exp": "Aqua-forestry is described as very common in coastal regions, more evident along the Andhra coast."}, {"part": "Part VII: Agroforestry", "topic": "Other Systems", "q": "In Aquaforestry, fish culture in mangroves serves as:", "opts": {"A": "A source of fuel", "B": "A source of timber", "C": "A rich source of nutrition and breeding ground for aquatic life", "D": "A source of medicine", "E": "None of the above"}, "ans": "C", "exp": "Fish culture in mangroves forms a rich source of nutrition to aquatic life and a breeding ground for juvenile fish, prawn and mussels."}, {"part": "Part VII: Agroforestry", "topic": "Arrangement of Components", "q": "Dense mixed stands are an example of which spatial arrangement pattern in agroforestry?", "opts": {"A": "Home gardens", "B": "Shelterbelts", "C": "None of the above", "D": "Hedge intercropping (zonal)", "E": "Sparse mixed stands with pastures"}, "ans": "A", "exp": "Home gardens are given as an example of dense mixed stands under spatial arrangement."}, {"part": "Part VII: Agroforestry", "topic": "Arrangement of Components", "q": "When woody and non-woody components (e.g., coffee under shade trees) occupy the land together throughout, this temporal arrangement is called:", "opts": {"A": "Separate", "B": "Coincident", "C": "Intermittent", "D": "Interpolated", "E": "Concomitant"}, "ans": "B", "exp": "'Coincident'
