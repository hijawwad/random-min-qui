is when two components (woody and non-woody) occupy the land together, as in coffee under shade trees."}, {"part": "Part VII: Agroforestry", "topic": "Arrangement of Components", "q": "When two components stay together for only part of their life, as in the Taungya system, the temporal arrangement is called:", "opts": {"A": "Concomitant", "B": "Intermittent", "C": "Interpolated", "D": "Separate", "E": "Coincident"}, "ans": "A", "exp": "'Concomitant' is when two components stay together for some part of life, as in taungya."}, {"part": "Part VII: Agroforestry", "topic": "Arrangement of Components", "q": "When annual crops are grown with perennial crops, such as paddy with coconut, this arrangement is called:", "opts": {"A": "Coincident", "B": "Intermittent (space dominated)", "C": "Concomitant", "D": "Separate", "E": "Interpolated"}, "ans": "B", "exp": "'Intermittent (space dominated)' arrangement is when annual crops are grown with perennial crops, such as paddy with coconut."}, {"part": "Part VII: Agroforestry", "topic": "Arrangement of Components", "q": "The overlapping cultivation of black pepper and rubber is given as an example of which temporal arrangement?", "opts": {"A": "Separate", "B": "Interpolated (space and time dominant)", "C": "Concomitant", "D": "Coincident", "E": "Intermittent"}, "ans": "B", "exp": "Interpolated (space and time dominant) is exemplified by overlapping black pepper and rubber."}, {"part": "Part VII: Agroforestry", "topic": "Arrangement of Components", "q": "When components occupy space during entirely separate time periods, as in improved fallow species in shifting cultivation, this is called:", "opts": {"A": "Interpolated", "B": "Intermittent", "C": "Separate (time-dominant)", "D": "Concomitant", "E": "Coincident"}, "ans": "C", "exp": "'Separate (time-dominant)' is when components occupy space during separate time, such as improved fallow species in shifting cultivation."}, {"part": "Part VII: Agroforestry", "topic": "Functional Classification", "q": "The functional classification of agroforestry systems includes Productive functions and:", "opts": {"A": "None of the above", "B": "Legal functions", "C": "Protective functions", "D": "Recreational functions only", "E": "Political functions"}, "ans": "C", "exp": "Functional classification includes Productive functions (food, fodder, fuel etc.) and Protective functions (windbreaks, soil conservation, shade etc.)."}, {"part": "Part VII: Agroforestry", "topic": "Socio-Economic Classification", "q": "Which socio-economic category of agroforestry systems is directed toward satisfying basic needs and is managed mostly by the owner/occupant and family?", "opts": {"A": "Intermediate systems", "B": "Subsistence systems", "C": "Commercial systems", "D": "Industrial systems", "E": "None of the above"}, "ans": "B", "exp": "Subsistence systems are directed toward satisfying basic needs, managed mostly by the owner/occupant and family, with cash crops only supplementary."}, {"part": "Part VII: Agroforestry", "topic": "Choice of Species", "q": "Which of the following is NOT listed as a consideration for the choice of species in agro/farm forestry?", "opts": {"A": "Fast growth and easy establishment", "B": "Fixation of nitrogen", "C": "High market export value in foreign currency", "D": "Ability to regenerate", "E": "No competition with field crops"}, "ans": "C", "exp": "Species-choice considerations include regeneration ability, nitrogen fixation, fast growth, and no competition with crops -- not export value in foreign currency."}, {"part": "Part VII: Agroforestry", "topic": "Limitations", "q": "Which of the following is NOT listed as a limitation/negative aspect of agroforestry?", "opts": {"A": "Competition of trees with crops for space, sunlight, moisture and nutrients", "B": "Trees serving as hosts to insects and birds", "C": "Damage to food crops during harvesting of trees", "D": "Reduces overall land productivity permanently in all cases", "E": "Rapid regeneration of prolific trees may displace crops"}, "ans": "D", "exp": "The notes list competition for resources, crop damage during harvesting, and trees hosting pests as limitations -- not a permanent reduction of land productivity in all cases."}, {"part": "Part VII: Agroforestry", "topic": "Benefits", "q": "Which of the following is classified as an Economical (rather than Social) benefit of Agro-forestry?", "opts": {"A": "Ecological balance", "B": "Improvement in rural living standards", "C": "Improvement in nutrition and health", "D": "Increment in outputs of food, fodder, fuel wood, timber and organic matter", "E": "Stability to rural people"}, "ans": "D", "exp": "Increment in outputs of food, fodder, fuel wood, timber and organic matter is listed as an Economical Benefit of agro-forestry."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Origins & Policy", "q": "Involvement of rural communities living close to forests in the protection and management of forest resources is enshrined in which policy?", "opts": {"A": "NCA, 1976", "B": "National Forest Policy, 1988", "C": "Forest-PLUS Program", "D": "Wildlife Protection Act, 1972", "E": "Indian Forest Act, 1927"}, "ans": "B", "exp": "This principle is enshrined in the National Forest Policy 1988."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Origins & Policy", "q": "The Government of India resolution that translated the JFM policy into action was issued by the Ministry of Environment and Forests in which month/year?", "opts": {"A": "June 1988", "B": "September 2006", "C": "July 2012", "D": "April 2003", "E": "June 1990"}, "ans": "E", "exp": "Translation of policy found expression in the resolution of the Government of India, Ministry of Environment and Forests, issued in June 1990."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "JFM Network", "q": "The JFM Network constituted by the Government of India is chaired by:", "opts": {"A": "None of the above", "B": "The State Chief Minister", "C": "The Inspector General of Forests, Government of India", "D": "The Union Minister of Environment", "E": "The Director, Forest Research Institute"}, "ans": "C", "exp": "The Government of India has constituted a 'JFM Network' with the Inspector General of Forests, GoI, as the Chairman."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Committees", "q": "Which type of committee under JFM is meant for the protection of well-stocked forests?", "opts": {"A": "None of the above", "B": "Eco-development Committee (EDC)", "C": "Forest Protection Committee (FPC)", "D": "Village Forest Committee (VFC)", "E": "Gram Sabha Committee"}, "ans": "C", "exp": "Forest Protection Committees (FPC) are for protection of well-stocked forests."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Committees", "q": "Which type of committee under JFM is meant for rehabilitating degraded forest areas?", "opts": {"A": "Forest Protection Committee (FPC)", "B": "Village Forest Committee (VFC)", "C": "JFM Network", "D": "None of the above", "E": "Eco-development Committee (EDC)"}, "ans": "B", "exp": "Village Forest Committees (VFC) are for rehabilitating degraded forest areas."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Committees", "q": "Eco-development Committees (EDC) are constituted primarily around:", "opts": {"A": "Reserved forests only", "B": "Protected Areas (National Parks and Sanctuaries)", "C": "None of the above", "D": "Village common lands", "E": "Urban forest patches"}, "ans": "B", "exp": "EDCs are constituted in and around Protected Areas with a view to ensure biodiversity conservation in National Parks and Sanctuaries."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Committees", "q": "JFM Committees are to be constituted within what radius from the periphery of the forest?", "opts": {"A": "3 km", "B": "5 km", "C": "1 km", "D": "10 km", "E": "2 km"}, "ans": "B", "exp": "The Committees are to be constituted within a radius of 5 km from the periphery of forest."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Management of JFM Areas", "q": "The plans prepared for the management of JFM areas, incorporating villagers' views, are called:", "opts": {"A": "Annual plans", "B": "Master plans", "C": "None of the above", "D": "Working plans", "E": "Micro-plans"}, "ans": "E", "exp": "Micro-plans are prepared for management of JFM areas, incorporating the views and aspirations of villagers."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Training", "q": "How many modules of training exist for members of JFM Committees, as per the notes?", "opts": {"A": "Three", "B": "Four", "C": "Two", "D": "Five", "E": "One"}, "ans": "A", "exp": "There are three modules of training: Orientation module, Micro-planning module, and Accounts module."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Training", "q": "Which of the following is NOT one of the three JFM training modules?", "opts": {"A": "Orientation module", "B": "Micro-planning module", "C": "Legal module", "D": "Accounts module", "E": "All of A, B, C are correct modules"}, "ans": "C", "exp": "The three modules are Orientation, Micro-planning, and Accounts -- there is no separate 'Legal module' mentioned."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Monitoring & Evaluation", "q": "Monitoring and evaluation of the JFM programme is conducted:", "opts": {"A": "Quarterly", "B": "Annually", "C": "Once in 5 years", "D": "Monthly", "E": "Weekly"}, "ans": "A", "exp": "Monitoring and evaluation of the programme is done quarterly."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Monitoring & Evaluation", "q": "To ensure transparency, monthly accounts of JFM committees are displayed at:", "opts": {"A": "Public places like Panchayat Bhawan/community hall", "B": "None of the above", "C": "The State capital only", "D": "The District Collector's office only", "E": "The Forest Department headquarters only"}, "ans": "A", "exp": "To ensure transparency, monthly accounts are to be displayed at public places, e.g., Panchayat Bhawan/community hall."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Constitution of Committee", "q": "As per the salient features of JFM, what is the minimum percentage of Executive Committee members required to be women?", "opts": {"A": "20%", "B": "33%", "C": "50%", "D": "40%", "E": "25%"}, "ans": "B", "exp": "A minimum of 33% of members of the Executive Committee will be women."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Constitution of Committee", "q": "Either the Chairperson or the Vice-Chairperson of the JFM committee will necessarily be:", "opts": {"A": "A government official", "B": "A woman", "C": "A Forest Guard", "D": "A landless person", "E": "None of the above"}, "ans": "B", "exp": "Either the Chairperson or the Vice-Chairperson of the committee will necessarily be a woman."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Constitution of Committee", "q": "The in-charge Forest Guard/Forester of the area serves in the committee as the:", "opts": {"A": "Ex-officio Secretary", "B": "Chairperson", "C": "Vice-Chairperson", "D": "Treasurer", "E": "None of the above"}, "ans": "A", "exp": "The in-charge Forest Guard/Forester of the area will be the ex-officio Secretary of the Committee."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Rights of Committee", "q": "The Forest Protection Committee (FPC) is entitled to what percentage of the value of forest produce from final felling of timber coupes, after deduction of harvesting cost?", "opts": {"A": "5%", "B": "20%", "C": "100%", "D": "50%", "E": "10%"}, "ans": "E", "exp": "The Forest Protection Committee is entitled to 10% of the value of forest produce from final felling of timber coupes, after deducting harvesting cost."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Rights of Committee", "q": "The Forest Protection Committee's entitlement from the final felling of bamboo coupes (after deducting harvesting cost) is:", "opts": {"A": "10%", "B": "20%", "C": "50%", "D": "15%", "E": "30%"}, "ans": "B", "exp": "The Forest Protection Committee is entitled to 20% of the value of forest produce from final felling of bamboo coupes."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Rights of Committee", "q": "The Village Forest Committee is entitled to what percentage of the value of forest produce from final felling of the planted/rehabilitated area, after deduction of harvesting cost?", "opts": {"A": "10%", "B": "80%", "C": "100%", "D": "20%", "E": "50%"}, "ans": "C", "exp": "The Village Forest Committee is entitled to 100% of the value of forest produce from the final felling of the planted area / forest produce from rehabilitation."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Rights of Committee", "q": "From the year 2003-04, what percentage of the net profit from the sale of timber and bamboo is distributed among all committees of the district?", "opts": {"A": "80%", "B": "20%", "C": "50%", "D": "100%", "E": "90%"}, "ans": "D", "exp": "From 2003-04, 100% of the net profit accruing from the sale of timber and bamboo would be distributed among all committees of the district."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Rights of Committee", "q": "Of the remaining 80% net profit (after the 20% share to the FPCs whose areas were harvested), what fraction is provided for awareness, extension, training, and housing facility for forest personnel?", "opts": {"A": "1/2", "B": "1/5", "C": "1/10", "D": "1/4", "E": "1/3"}, "ans": "B", "exp": "Of the remaining 80%, 1/5th amount would be provided for awareness, extension, training, housing facility to forest personnel of the committee."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Rights of Committee", "q": "During patrolling of forests, members of the JFM committee are treated as:", "opts": {"A": "Public Servants under different Acts, similar to Foresters", "B": "Ordinary citizens", "C": "Forest Officers with full statutory powers", "D": "None of the above", "E": "Police personnel"}, "ans": "A", "exp": "During patrolling of forests, committee members would be treated as Public Servant under different Acts, similar to Foresters."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Duties of Committee", "q": "Which of the following is NOT listed as a duty of the JFM Committee?", "opts": {"A": "Ensure safety of wild animals wandering out of the forests", "B": "Report offenders to the Forest Department", "C": "Assist in investigation of forest offences", "D": "Independently impose fines on offenders without department involvement", "E": "Protect forests from fire, illegal grazing, tree cutting"}, "ans": "D", "exp": "The committee reports offences and assists the Forest Department/investigation; it does not independently impose fines on offenders."}, {"part": "Part VIII: Joint Forest Management (JFM)", "topic": "Duties of Committee", "q": "If a Committee becomes aware of and helps apprehend an offender for a forest offence, what percentage of the compounded amount/fine recovered is deposited into the Committee's account?", "opts": {"A": "100%", "B": "25%", "C": "10%", "D": "50%", "E": "75%"}, "ans": "D", "exp": "50% of the compounded amount or the fine/compensation recovered from the offender will be deposited into the Committee's account."}, {"part": "Part IX: Forest Policy and Legislation in India", "topic": "Indian Forest Act, 1927", "q": "The Indian Forest Act, which provides the legal framework for management of forests in India, was enacted in:", "opts": {"A": "1952", "B": "1988", "C": "1894", "D": "1972", "E": "1927"}, "ans": "E", "exp": "The Indian Forest Act, 1927 provides the legal framework for management of forests in the country."}, {"part": "Part IX: Forest Policy and Legislation in India", "topic": "Indian Forest Act, 1927", "q": "The implementation of the Indian Forest Act is primarily the responsibility of:", "opts": {"A": "The Ministry of Environment alone", "B": "None of the above", "C": "The Central Government alone", "D": "The Judiciary", "E": "The concerned State/UT Governments"}, "ans": "E", "exp": "The implementation of the Forest Act is primarily the responsibility of the concerned State/UT Governments."}, {"part": "Part IX: Forest Policy and Legislation in India", "topic": "Indian Forest Act, 1927", "q": "After the amendment of Section 2(7) of the Indian Forest Act, 1927 in 2017-18, the status of bamboo changed such that:", "opts": {"A": "It was banned from private cultivation", "B": "It is still classified as timber requiring a felling permit", "C": "None of the above", "D": "It was classified as an endangered species", "E": "Bamboo is no longer a 'tree', and felled bamboo is not 'timber'"}, "ans": "E", "exp": "After the 2017-18 amendment, bamboo is no longer a tree, and felled bamboo too is not timber -- so bamboo grown on private/homestead land needs no felling or transit permission."}, {"part": "Part IX: Forest Policy and Legislation in India", "topic": "National Forest Policy, 1988", "q": "The National Forest Policy referenced as the base policy (before the 2019 draft) was adopted in which year?", "opts": {"A": "1988", "B": "1976", "C": "1972", "D": "1952", "E": "1990"}, "ans": "A", "exp": "The National Forest Policy of 1988 is the base policy discussed in the notes."}, {"part": "Part IX: Forest Policy and Legislation in India", "topic": "National Forest Policy, 1988", "q": "The National Forest Policy, 1988 sets a national goal of having at least what fraction of the total land area of the country under forest or tree cover?", "opts": {"A": "One-fourth", "B": "One-fifth", "C": "Half", "D": "One-third", "E": "Two-thirds"}, "ans": "D", "exp": "The policy sets a national goal of at least one-third of the total land area of the country under forest or tree cover."}, {"part": "Part IX: Forest Policy and Legislation in India", "topic": "National Forest Policy, 1988", "q": "In hilly and mountainous regions, the National Forest Policy, 1988 sets a higher target of what fraction under forest/tree cover?", "opts": {"A": "Three-fourths", "B": "One-third", "C": "Two-thirds", "D": "Half", "E": "Full coverage"}, "ans": "C", "exp": "A higher target of two-thirds in hilly and mountainous regions is set to prevent erosion and land degradation."}, {"part": "Part IX: Forest Policy and Legislation in India", "topic": "National Forest Policy, 1988", "q": "The National Forest Policy, 1988 prioritizes which of the following over direct economic benefits?", "opts": {"A": "None of the above", "B": "Urban housing development", "C": "Export revenue generation", "D": "Environmental stability and ecological balance", "E": "Maximizing industrial timber production"}, "ans": "D", "exp": "The policy aims to ensure environmental stability and ecological balance, prioritizing them over direct economic benefits."}, {"part": "Part IX: Forest Policy and Legislation in India", "topic": "National Forest Policy, 1988", "q": "Which of the following is NOT listed as an objective of the National Forest Policy, 1988?", "opts": {"A": "Meeting fuelwood/fodder needs of rural and tribal populations", "B": "Preventing soil erosion and desertification", "C": "Promoting efficient utilization of forest produce", "D": "Maximizing revenue from timber export", "E": "Preserving ecological balance"}, "ans": "D", "exp": "The listed objectives focus on ecological balance, erosion prevention, meeting rural/tribal needs, and efficient utilization -- not maximizing timber export revenue."}, {"part": "Part IX: Forest Policy and Legislation in India", "topic": "Draft National Forest Policy, 2019", "q": "A draft National Forest Policy, intended to replace the 1988 policy, was released in which year?", " (function(){
  const total = QUIZ_DATA.length;
  const parts = [...new Set(QUIZ_DATA.map(q=>q.part))];
  document.getElementById('totalQCount').textContent = total;
  document.getElementById('totalPartsCount').textContent = parts.length;
  document.getElementById('introText').textContent =
    "This quiz covers the entire Forestry summary sheet, organized Part-wise and Topic-wise in the original document order. " +
    "Answer each question to see instant feedback and an explanation, then move to the next. " +
    "At the end you'll get a full review of anything you missed.";

  let idx = 0;
  let score = 0;
  let answered = false;
  const missed = [];
  const scoreBadge = document.getElementById('scoreBadge');

  function updateScoreBadge(){
    scoreBadge.textContent = "Score: " + score + " / " + (idx + (answered?1:0));
  }

  function renderQuestion(){
    answered = false;
    const item = QUIZ_DATA[idx];
    document.getElementById('progressFill').style.width = ((idx)/total*100) + "%";
    document.getElementById('partTag').textContent = item.part;
    document.getElementById('topicTag').textContent = item.topic;
    document.getElementById('qNumLabel').textContent = "Question " + (idx+1) + " of " + total;
    document.getElementById('qText').textContent = item.q;
    const wrap = document.getElementById('optsWrap');
    wrap.innerHTML = "";
    const letters = ["A","B","C","D","E"];
    letters.forEach(l=>{
      const div = document.createElement('div');
      div.className = 'opt';
      div.dataset.letter = l;
      div.innerHTML = '<span class="letter">'+l+'</span><span>'+item.opts[l]+'</span>';
      div.addEventListener('click', ()=> selectAnswer(l));
      wrap.appendChild(div);
    });
    const fb = document.getElementById('feedbackBox');
    fb.classList.remove('show','right','wrong');
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('nextBtn').textContent = (idx === total-1) ? "See Results →" : "Next Question →";
    updateScoreBadge();
  }

  function selectAnswer(letter){
    if(answered) return;
    answered = true;
    const item = QUIZ_DATA[idx];
    const opts = document.querySelectorAll('.opt');
    opts.forEach(o=>{
      o.classList.add('disabled');
      if(o.dataset.letter === item.ans){ o.classList.add('correct'); }
      if(o.dataset.letter === letter && letter !== item.ans){ o.classList.add('incorrect'); }
    });
    const fb = document.getElementById('feedbackBox');
    const fbTitle = document.getElementById('fbTitle');
    const fbExp = document.getElementById('fbExp');
    fb.classList.add('show');
    if(letter === item.ans){
      score++;
      fb.classList.add('right');
      fbTitle.textContent = "✔ Correct!";
    } else {
      fb.classList.add('wrong');
      fbTitle.textContent = "✘ Incorrect — Correct answer: " + item.ans + ") " + item.opts[item.ans];
      missed.push({item: item, chosen: letter});
    }
    fbExp.textContent = item.exp;
    document.getElementById('nextBtn').disabled = false;
    updateScoreBadge();
  }

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(idx < total-1){
      idx++;
      renderQuestion();
    } else {
      showEnd();
    }
  });

  function showEnd(){
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.remove('hidden');
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalTotal').textContent = total;
    document.getElementById('finalPct').textContent = Math.round(score/total*100) + "%";

    const reviewSection = document.getElementById('reviewSection');
    if(missed.length === 0){
      reviewSection.innerHTML = '<div class="endcard"><b>Perfect score! No questions missed. 🏆</b></div>';
    } else {
      let html = '<h3 style="color:var(--green-dark);">Review — Questions Missed ('+missed.length+')</h3>';
      missed.forEach(m=>{
        html += '<div class="reviewitem">';
        html += '<div class="rtag">'+m.item.part+' &middot; '+m.item.topic+'</div>';
        html += '<div class="rq">'+m.item.q+'</div>';
        html += '<div class="rline wrongline">Your answer: '+m.chosen+') '+m.item.opts[m.chosen]+'</div>';
        html += '<div class="rline correctline">Correct answer: '+m.item.ans+') '+m.item.opts[m.item.ans]+'</div>';
        html += '<div class="rexp">'+m.item.exp+'</div>';
        html += '</div>';
      });
      reviewSection.innerHTML = html;
    }
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');
    renderQuestion();
  });

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    idx = 0; score = 0; answered = false; missed.length = 0;
    document.getElementById('endScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');
    renderQuestion();
  });
})();
</script>
</body>
</html>
