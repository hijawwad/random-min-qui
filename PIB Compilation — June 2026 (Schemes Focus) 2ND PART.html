<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NABARD Grade A — PIB June 2026 Scheme Quiz</title>
<style>
  :root{
    --navy:#0b2447;
    --navy2:#12376b;
    --gold:#c99a2e;
    --gold-light:#e8c873;
    --cream:#f7f4ec;
    --ink:#1c2430;
    --green:#1f7a4d;
    --green-bg:#e5f5ec;
    --red:#b3372c;
    --red-bg:#fbe9e7;
    --grey:#6b7280;
    --line:#dfe3ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia','Times New Roman',serif;
    background:var(--cream);
    color:var(--ink);
  }
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--navy);
    color:var(--cream);
    padding:14px 20px;
    border-radius:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:8px;
  }
  .brand{display:flex;flex-direction:column;}
  .brand .eyebrow{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-light);
  }
  .brand .title{font-size:17px;font-weight:700;margin-top:2px;}
  .stats{
    font-family:'Helvetica Neue',Arial,sans-serif;
    display:flex;gap:14px;font-size:13px;
  }
  .stat{
    background:rgba(255,255,255,.08);
    padding:6px 12px;border-radius:7px;
    border:1px solid rgba(255,255,255,.15);
    text-align:center;min-width:58px;
  }
  .stat b{display:block;font-size:15px;color:var(--gold-light);}
  .progress-outer{
    height:6px;background:#e4e0d2;border-radius:4px;overflow:hidden;margin-bottom:18px;
  }
  .progress-inner{height:100%;background:linear-gradient(90deg,var(--gold),var(--navy2));width:0%;transition:width .3s;}

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px 24px 18px;
    box-shadow:0 3px 14px rgba(11,36,71,.06);
  }
  .catrow{
    font-family:'Helvetica Neue',Arial,sans-serif;
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  }
  .cat-tag{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--navy2);background:#eef2fa;border:1px solid #d7e0f2;
    padding:3px 9px;border-radius:20px;font-weight:600;
  }
  .qnum{font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;color:var(--grey);}
  .qtext{
    font-size:17px;line-height:1.55;white-space:pre-line;margin:6px 0 18px;color:var(--ink);
  }
  .qtext b{color:var(--navy);}
  .opt{
    display:flex;align-items:flex-start;gap:10px;
    width:100%;text-align:left;
    background:#fbfaf7;
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:11px 14px;margin-bottom:9px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14.5px; line-height:1.4;
    cursor:pointer;
    transition:.15s border-color,.15s background;
  }
  .opt:hover:not(.locked){border-color:var(--navy2);background:#f1f4fb;}
  .opt .letter{
    flex:0 0 auto;
    width:24px;height:24px;border-radius:50%;
    background:var(--navy);color:#fff;
    font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{background:var(--green-bg);border-color:var(--green);}
  .opt.correct .letter{background:var(--green);}
  .opt.incorrect{background:var(--red-bg);border-color:var(--red);}
  .opt.incorrect .letter{background:var(--red);}
  .opt.locked{cursor:default;}
  .opt.dim{opacity:.55;}

  .feedback{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13.5px;margin:10px 0 4px;padding:9px 12px;border-radius:8px;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-bg);color:var(--green);border:1px solid #bfe3cc;}
  .feedback.bad{background:var(--red-bg);color:var(--red);border:1px solid #f0c6c0;}

  .controls{
    display:flex;justify-content:space-between;align-items:center;margin-top:18px;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  button.next{
    background:var(--navy);color:#fff;border:none;
    padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;
    cursor:pointer;
  }
  button.next:disabled{background:#c9cdd6;cursor:not-allowed;}
  button.next:hover:not(:disabled){background:var(--navy2);}
  button.skip{
    background:none;border:1px solid var(--line);color:var(--grey);
    padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;
  }

  /* results screen */
  .results{display:none;}
  .results.show{display:block;}
  .quizarea.hide{display:none;}
  .score-hero{
    text-align:center;background:var(--navy);color:#fff;border-radius:12px;
    padding:30px 20px;margin-bottom:20px;
  }
  .score-hero .big{font-size:48px;font-weight:700;color:var(--gold-light);font-family:'Helvetica Neue',Arial,sans-serif;}
  .score-hero .sub{font-family:'Helvetica Neue',Arial,sans-serif;font-size:14px;opacity:.85;margin-top:4px;}
  .breakdown{
    display:flex;gap:10px;justify-content:center;margin-top:16px;font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .bd{background:rgba(255,255,255,.1);padding:8px 16px;border-radius:8px;font-size:13px;}
  .bd b{display:block;font-size:18px;}
  .review-item{
    border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;
  }
  .review-item .rq{font-size:14.5px;white-space:pre-line;margin-bottom:8px;}
  .review-item .ra{font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;}
  .review-item .ra .wrong{color:var(--red);}
  .review-item .ra .right{color:var(--green);font-weight:600;}
  .restart-row{text-align:center;margin-top:20px;}
  button.restart{
    background:var(--gold);color:var(--navy);border:none;font-weight:700;
    padding:12px 26px;border-radius:8px;font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:14px;cursor:pointer;
  }
  .empty-note{
    text-align:center;font-family:'Helvetica Neue',Arial,sans-serif;color:var(--grey);
    padding:20px;font-size:13.5px;
  }
  @media (max-width:520px){
    .score-hero .big{font-size:38px;}
    .card{padding:18px 16px 14px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="eyebrow">NABARD Grade A · Practice Series</div>
      <div class="title">PIB Compilation — June 2026 (Schemes Focus)</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="statNum">1</b>/<span id="statTotal">389</span></div>
      <div class="stat"><b id="statScore">0</b>Score</div>
      <div class="stat"><b id="statAcc">0%</b>Acc.</div>
    </div>
  </div>

  <div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>

  <div class="quizarea" id="quizArea">
    <div class="card">
      <div class="catrow">
        <span class="cat-tag" id="catTag">General</span>
        <span class="qnum" id="qNumLabel">Question 1</span>
      </div>
      <div class="qtext" id="qText"></div>
      <div id="optsBox"></div>
      <div class="feedback" id="feedback"></div>
      <div class="controls">
        <button class="skip" id="skipBtn">Skip question</button>
        <button class="next" id="nextBtn" disabled>Next Question →</button>
      </div>
    </div>
  </div>

  <div class="results" id="resultsArea">
    <div class="score-hero">
      <div class="big" id="finalScore">0 / 389</div>
      <div class="sub">Final Score</div>
      <div class="breakdown">
        <div class="bd"><b id="bdCorrect">0</b>Correct</div>
        <div class="bd"><b id="bdWrong">0</b>Incorrect</div>
        <div class="bd"><b id="bdSkip">0</b>Skipped</div>
        <div class="bd"><b id="bdPct">0%</b>Accuracy</div>
      </div>
    </div>
    <h3 style="font-family:'Helvetica Neue',Arial,sans-serif;">Review — Questions you missed</h3>
    <div id="reviewList"></div>
    <div class="restart-row">
      <button class="restart" id="restartBtn">Restart Quiz</button>
    </div>
  </div>

</div>

nder the Anemia Mukt Bharat Abhiyaan's 7x7x7 framework, which approach has been introduced as the seventh intervention?", "options": ["Deworming approach", "The 'Eating Right' approach", "Iron folic acid supplementation only", "Bi-annual screening approach", "Community kitchen approach"], "answer": 1, "cat": "Health Schemes"}, {"q": "For management of severe anemia among pregnant and lactating women, Intravenous Iron Therapy using which two agents was announced?", "options": ["Iron Dextran and Ferric Gluconate", "Folic Acid and B12 injections", "Ferric Carboxymaltose (FCM) and Iron Sucrose", "Ferrous Sulphate and Vitamin C", "Erythropoietin and Iron Sucrose"], "answer": 2, "cat": "Health Schemes"}, {"q": "The Anemia Mukt Bharat Abhiyaan Operational Guidelines were released at which meeting?", "options": ["15th CCHFW Meeting", "Governing Council of NITI Aayog", "National Health Assembly", "16th Meeting of the Central Council of Health and Family Welfare (CCHFW)", "World Health Assembly"], "answer": 3, "cat": "Health Schemes"}, {"q": "Under the proposed amendment to Medical Devices Rules 2017, the manufacturing licence timeline for Class B devices is proposed to be reduced from 140 days to:", "options": ["120 days", "90 days", "105 days", "100 days", "115 days"], "answer": 4, "cat": "Health Regulation"}, {"q": "Under the proposed amendment to Medical Devices Rules 2017, the manufacturing licence timeline for Class C and D devices is proposed to be reduced from 105 days to:", "options": ["90 days", "95 days", "85 days", "75 days", "100 days"], "answer": 0, "cat": "Health Regulation"}, {"q": "The 'PM Family Care Tracker' pilot project, inaugurated by Amit Shah, was launched in which state?", "options": ["Uttar Pradesh", "Gujarat (Gandhinagar)", "Rajasthan", "Madhya Pradesh", "Maharashtra"], "answer": 1, "cat": "MHA"}, {"q": "The PM Family Care Tracker platform will primarily be linked with which type of records?", "options": ["Land ownership records", "Voter ID records" 24"], "answer": 3, "cat": "MoSPI"}, {"q": "The trial monthly ISP indices for 2025-26 and April 2026 are slated for release on:", "options": ["15th June 2026", "1st August 2026", "29th July 2026", "31st July 2026", "14th July 2026"], "answer": 4, "cat": "MoSPI"}, {"q": "Regular release of monthly trial ISP indices will be made with a lag of about how many days?", "options": ["60 days", "30 days", "45 days", "90 days", "15 days"], "answer": 0, "cat": "MoSPI"}, {"q": "Consider the following statements regarding the Index of Services Production (ISP):\n1. ISP will cover the informal services sector as it uses administrative data.\n2. Health and Education services (excluding Government) will use ASISSE data.\n3. Public administration and Defence are excluded from ISP coverage.\n4. The Service Accounting Code (SAC) is a modified version of the UN Central Product Classification (CPC).\nWhich of the above statements is/are correct?", "options": ["1, 2 and 3 only", "2, 3 and 4 only", "1, 2 and 4 only", "1, 3 and 4 only", "1, 2, 3 and 4"], "answer": 1, "cat": "Multi-Statement"}, {"q": "Which agency's data is proposed as the source for the ISP sub-indices of Health and Education (excluding Government)?", "options": ["GST returns", "NSSO Periodic Labour Force Survey", "Annual Survey of Incorporated Services Sector Enterprises (ASISSE)", "Income Tax returns", "Ministry of Education data"], "answer": 2, "cat": "MoSPI"}, {"q": "The Youth Co:Lab National Innovation Challenge 2026, whose winners received seed grants, was which edition?", "options": ["5th edition", "6th edition", "7th edition", "8th edition", "10th edition"], "answer": 3, "cat": "NITI Aayog"}, {"q": "Each of the three winning startups of the Youth Co:Lab National Innovation Challenge 2026 received a seed grant of:", "options": ["₹5,00,000", "₹2,50,000", "₹1,00,000", "₹7,50,000", "₹3,50,000"], "answer": 4, "cat": "NITI Aayog"}, {"q": "Youth Co:Lab was co-created in 2017 by UNDP and which corporate partner?", "options" </script>
<script>
(function(){
  const total = QUESTIONS.length;
  let idx = 0;
  let score = 0;
  let answeredCount = 0;
  let skippedCount = 0;
  let wrongLog = []; // {q, chosen, correctText}
  let locked = false;

  const letters = ['A','B','C','D','E'];

  const qText = document.getElementById('qText');
  const optsBox = document.getElementById('optsBox');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  const skipBtn = document.getElementById('skipBtn');
  const catTag = document.getElementById('catTag');
  const qNumLabel = document.getElementById('qNumLabel');
  const progressBar = document.getElementById('progressBar');
  const statNum = document.getElementById('statNum');
  const statTotal = document.getElementById('statTotal');
  const statScore = document.getElementById('statScore');
  const statAcc = document.getElementById('statAcc');
  const quizArea = document.getElementById('quizArea');
  const resultsArea = document.getElementById('resultsArea');

  statTotal.textContent = total;

  function renderQuestion(){
    locked = false;
    const q = QUESTIONS[idx];
    catTag.textContent = q.cat || 'General';
    qNumLabel.textContent = 'Question ' + (idx+1) + ' of ' + total;
    qText.textContent = q.q;
    optsBox.innerHTML = '';
    feedback.className = 'feedback';
    feedback.textContent = '';
    nextBtn.disabled = true;
    nextBtn.textContent = (idx === total-1) ? 'Finish Quiz →' : 'Next Question →';

    q.options.forEach((opt, i) => {
      const btn = document.createElement('div');
      btn.className = 'opt';
      btn.innerHTML = '<span class="letter">'+letters[i]+'</span><span>'+opt+'</span>';
      btn.addEventListener('click', () => selectOption(i, btn));
      optsBox.appendChild(btn);
    });

    progressBar.style.width = ((idx)/total*100) + '%';
    statNum.textContent = idx+1;
  }

  function selectOption(i, btnEl){
    if(locked) return;
    locked = true;
    const q = QUESTIONS[idx];
    const allOpts = optsBox.querySelectorAll('.opt');
    allOpts.forEach(el => el.classList.add('locked'));

    if(i === q.answer){
      btnEl.classList.add('correct');
      score++;
      feedback.className = 'feedback show ok';
      feedback.textContent = '✓ Correct — ' + letters[q.answer] + '. ' + q.options[q.answer];
    } else {
      btnEl.classList.add('incorrect');
      allOpts[q.answer].classList.add('correct');
      feedback.className = 'feedback show bad';
      feedback.textContent = '✗ Incorrect. Correct answer: ' + letters[q.answer] + '. ' + q.options[q.answer];
      wrongLog.push({q: q.q, chosen: letters[i]+'. '+q.options[i], correct: letters[q.answer]+'. '+q.options[q.answer]});
    }
    allOpts.forEach((el, j) => { if(j!==i && j!==q.answer) el.classList.add('dim'); });

    answeredCount++;
    updateStats();
    nextBtn.disabled = false;
  }

  function updateStats(){
    statScore.textContent = score;
    const acc = answeredCount ? Math.round(score/answeredCount*100) : 0;
    statAcc.textContent = acc + '%';
  }

  skipBtn.addEventListener('click', () => {
    if(locked) return; // already answered, just move to next via nextBtn
    skippedCount++;
    const q = QUESTIONS[idx];
    wrongLog.push({q: q.q, chosen: '(Skipped)', correct: letters[q.answer]+'. '+q.options[q.answer]});
    goNext();
  });

  nextBtn.addEventListener('click', goNext);

  function goNext(){
    if(idx < total-1){
      idx++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz(){
    quizArea.classList.add('hide');
    resultsArea.classList.add('show');
    progressBar.style.width = '100%';
    document.getElementById('finalScore').textContent = score + ' / ' + total;
    document.getElementById('bdCorrect').textContent = score;
    document.getElementById('bdWrong').textContent = (answeredCount - score);
    document.getElementById('bdSkip').textContent = skippedCount;
    const pct = Math.round(score/total*100);
    document.getElementById('bdPct').textContent = pct + '%';

    const reviewList = document.getElementById('reviewList');
    reviewList.innerHTML = '';
    if(wrongLog.length === 0){
      reviewList.innerHTML = '<div class="empty-note">Perfect score — no missed questions. Excellent work!</div>';
    } else {
      wrongLog.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = '<div class="rq">'+item.q+'</div>'+
          '<div class="ra">Your answer: <span class="wrong">'+item.chosen+'</span></div>'+
          '<div class="ra">Correct answer: <span class="right">'+item.correct+'</span></div>';
        reviewList.appendChild(div);
      });
    }
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    idx = 0; score = 0; answeredCount = 0; skippedCount = 0; wrongLog = [];
    quizArea.classList.remove('hide');
    resultsArea.classList.remove('show');
    updateStats();
    renderQuestion();
  });

  renderQuestion();
})();
</script>
</body>
</html>
