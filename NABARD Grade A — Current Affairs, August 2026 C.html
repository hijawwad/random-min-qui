<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NABARD Grade A — ESI/GA Practice Ledger</title>
<style>
  :root{
    --bg: #101317;
    --bg-panel: #171b22;
    --bg-elevated: #1e232c;
    --bg-elevated-2: #242a34;
    --ink: #e9e6dc;
    --ink-dim: #9aa1ac;
    --ink-faint: #6b7280;
    --accent: #c9a227;
    --accent-soft: rgba(201,162,39,0.14);
    --accent-line: rgba(201,162,39,0.35);
    --correct: #5ea67a;
    --correct-soft: rgba(94,166,122,0.15);
    --incorrect: #c1584a;
    --incorrect-soft: rgba(193,88,74,0.15);
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.05);
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(1200px 800px at 15% -10%, #171c24 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height:1.5;
    -webkit-font-smoothing: antialiased;
  }
  #app{max-width: 900px; margin: 0 auto; padding: 20px 18px 60px;}
  a{color:inherit;}

  /* ---------- Masthead ---------- */
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px; margin-bottom: 22px;
    gap: 10px; flex-wrap: wrap;
  }
  .masthead .brand{
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: 0.2px;
  }
  .masthead .brand .accent-word{ color: var(--accent); }
  .masthead .sub{
    font-size: 12px; color: var(--ink-dim);
  }
  .masthead .date-line{
    font-size: 12px; color: var(--ink-faint); text-align:right;
  }

  /* ---------- Home screen ---------- */
  .intro{
    font-size: 13.5px; color: var(--ink-dim); max-width: 62ch; margin: 0 0 26px;
  }
  .mode-stack{ display:flex; flex-direction:column; gap:14px; }
  .mode-card{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    cursor:pointer;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
    position:relative;
    overflow:hidden;
  }
  .mode-card:hover{ border-color: var(--accent-line); background: var(--bg-elevated); }
  .mode-card:focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; }
  .mode-card .mode-index{
    font-family: var(--serif); font-size: 12px; color: var(--ink-faint);
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom:6px; display:block;
  }
  .mode-card h2{
    font-family: var(--serif); font-weight: 400; font-size: 21px; margin: 0 0 6px;
  }
  .mode-card p{ margin:0; color: var(--ink-dim); font-size: 13.5px; max-width: 58ch; }
  .mode-card .count-pill{
    position:absolute; top:20px; right:22px;
    font-size: 11px; color: var(--ink-faint); border:1px solid var(--border);
    border-radius: 20px; padding: 3px 10px;
  }

  .toggle-row{ display:flex; gap:8px; margin-top:14px; }
  .toggle-btn{
    flex:1; background: var(--bg-elevated); border:1px solid var(--border);
    color: var(--ink-dim); border-radius: 7px; padding: 9px 10px; font-size: 12.5px;
    cursor:pointer; font-family: var(--sans); transition: all .12s ease;
    text-align:center;
  }
  .toggle-btn.active{ background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  .toggle-btn:hover{ border-color: var(--accent-line); }

  .start-btn{
    margin-top:14px;
    display:inline-block;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    color: var(--accent);
    font-family: var(--sans);
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 7px;
    cursor:pointer;
  }
  .start-btn:hover{ background: rgba(201,162,39,0.22); }

  /* ---------- Topic grid ---------- */
  .back-link{
    display:inline-flex; align-items:center; gap:6px; color: var(--ink-dim);
    font-size: 13px; cursor:pointer; margin-bottom: 18px; border:none; background:none;
    font-family: var(--sans); padding:0;
  }
  .back-link:hover{ color: var(--accent); }
  .topic-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr));
    gap: 12px;
  }
  .topic-card{
    background: var(--bg-panel); border:1px solid var(--border); border-radius: var(--radius);
    padding: 15px 16px; cursor:pointer; transition: all .12s ease;
  }
  .topic-card:hover{ border-color: var(--accent-line); background: var(--bg-elevated); }
  .topic-card .t-name{ font-size: 13.5px; margin-bottom: 8px; }
  .topic-card .t-count{ font-size: 11.5px; color: var(--ink-faint); }
  .topic-card .t-count b{ color: var(--accent); font-weight:600; }

  /* ---------- Quiz screen ---------- */
  .quiz-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; gap: 12px; flex-wrap:wrap;
  }
  .quiz-meta{ font-size: 12px; color: var(--ink-faint); }
  .score-box{ font-size: 13px; color: var(--ink-dim); white-space:nowrap; }
  .score-box b{ color: var(--accent); }
  .progress-track{
    height: 4px; background: var(--border-soft); border-radius: 3px; overflow:hidden; margin-bottom: 22px;
  }
  .progress-fill{ height:100%; background: var(--accent); transition: width .25s ease; }

  .context-box{
    background: var(--bg-panel);
    border-left: 3px solid var(--accent-line);
    border-radius: 0 8px 8px 0;
    padding: 14px 18px;
    margin-bottom: 16px;
    font-size: 13.5px;
    color: var(--ink-dim);
    white-space: pre-line;
  }
  .context-box .ctx-label{
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint);
    margin-bottom: 8px; display:block;
  }

  .q-difficulty{
    display:inline-block; font-size: 10.5px; text-transform:uppercase; letter-spacing:0.06em;
    padding: 2px 9px; border-radius: 20px; margin-bottom: 10px; border:1px solid var(--border);
    color: var(--ink-faint);
  }
  .q-difficulty.Easy{ color:#7fb896; border-color: rgba(127,184,150,0.35); }
  .q-difficulty.Moderate{ color:#c9a227; border-color: var(--accent-line); }
  .q-difficulty.Hard{ color:#c1584a; border-color: rgba(193,88,74,0.35); }

  .q-stem{
    font-family: var(--serif); font-size: 18px; line-height: 1.45; margin: 0 0 18px; font-weight:400;
  }

  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom: 18px; }
  .option{
    display:flex; gap:12px; align-items:flex-start;
    background: var(--bg-panel); border:1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; cursor:pointer; font-size: 14px; text-align:left;
    font-family: var(--sans); color: var(--ink); transition: all .12s ease;
  }
  .option:hover:not(.locked){ border-color: var(--accent-line); background: var(--bg-elevated); }
  .option .opt-letter{
    font-family: var(--serif); color: var(--ink-faint); flex-shrink:0; width:18px;
  }
  .option.correct-answer{ border-color: var(--correct); background: var(--correct-soft); }
  .option.correct-answer .opt-letter{ color: var(--correct); }
  .option.wrong-answer{ border-color: var(--incorrect); background: var(--incorrect-soft); }
  .option.wrong-answer .opt-letter{ color: var(--incorrect); }
  .option.locked{ cursor:default; }
  .option.dim{ opacity: 0.5; }

  .feedback-box{
    border-radius: 8px; padding: 13px 16px; margin-bottom: 16px; font-size: 13.5px;
    border: 1px solid; line-height:1.55;
  }
  .feedback-box.correct{ background: var(--correct-soft); border-color: rgba(94,166,122,0.4); color:#c9e5d3; }
  .feedback-box.wrong{ background: var(--incorrect-soft); border-color: rgba(193,88,74,0.4); color:#f0d3ce; }
  .feedback-box.skipped{ background: var(--bg-elevated); border-color: var(--border); color: var(--ink-dim); }
  .feedback-box .fb-verdict{ font-weight:700; display:block; margin-bottom:4px; }

  .quiz-actions{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .btn{
    font-family: var(--sans); font-size: 13.5px; padding: 10px 18px; border-radius: 7px;
    cursor:pointer; border:1px solid var(--border); background: var(--bg-panel); color: var(--ink);
  }
  .btn:hover{ border-color: var(--accent-line); }
  .btn-skip{ color: var(--ink-dim); }
  .btn-primary{
    background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent);
    font-weight:600;
  }
  .btn-primary:hover{ background: rgba(201,162,39,0.22); }
  .btn[disabled]{ opacity:0.35; cursor:not-allowed; }

  /* ---------- End screen ---------- */
  .end-hero{
    text-align:center; padding: 28px 10px 8px;
  }
  .end-hero .score-num{
    font-family: var(--serif); font-size: 52px; color: var(--accent); line-height:1;
  }
  .end-hero .score-label{ color: var(--ink-dim); font-size: 13.5px; margin-top: 6px; }

  .stat-row{ display:flex; gap:12px; justify-content:center; margin: 22px 0 30px; flex-wrap:wrap; }
  .stat-card{
    background: var(--bg-panel); border:1px solid var(--border); border-radius: var(--radius);
    padding: 14px 20px; text-align:center; min-width: 110px;
  }
  .stat-card .stat-num{ font-family: var(--serif); font-size: 22px; }
  .stat-card .stat-lbl{ font-size: 11px; color: var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; margin-top:4px; }
  .stat-card.Easy .stat-num{ color:#7fb896; }
  .stat-card.Moderate .stat-num{ color:#c9a227; }
  .stat-card.Hard .stat-num{ color:#c1584a; }

  .review-section h3{
    font-family: var(--serif); font-weight:400; font-size: 16px; color: var(--ink);
    border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 14px;
  }
  .review-item{
    background: var(--bg-panel); border:1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
  }
  .review-item .r-topic{ font-size: 10.5px; text-transform:uppercase; letter-spacing:0.05em; color: var(--ink-faint); margin-bottom:6px; }
  .review-item .r-stem{ font-size: 14px; margin-bottom: 8px; }
  .review-item .r-answer{ font-size: 13px; margin-bottom: 6px; }
  .review-item .r-answer.wrong-line{ color: var(--incorrect); }
  .review-item .r-answer.correct-line{ color: var(--correct); }
  .review-item .r-explain{ font-size: 12.5px; color: var(--ink-dim); }
  .review-item .r-tag{
    display:inline-block; font-size: 10px; text-transform:uppercase; padding: 2px 7px;
    border-radius: 12px; margin-left: 8px; vertical-align:middle;
  }
  .review-item .r-tag.wrong{ background: var(--incorrect-soft); color: var(--incorrect); }
  .review-item .r-tag.skipped{ background: var(--bg-elevated); color: var(--ink-faint); }

  .end-actions{ display:flex; gap:10px; justify-content:center; margin: 26px 0 10px; flex-wrap:wrap; }

  .empty-note{ color: var(--ink-dim); font-size: 13.5px; text-align:center; padding: 40px 0; }

  @media (max-width: 560px){
    .q-stem{ font-size: 16.5px; }
    .end-hero .score-num{ font-size: 42px; }
    .masthead{ flex-direction:column; align-items:flex-start; }
    .masthead .date-line{ text-align:left; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>

var TYPE_LABELS = {

};

/* =========================================================
   HELPERS
   ========================================================= */
function shuffleArr(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function getTopics(){
  var map = {};
  QUESTIONS.forEach(function(q){
    map[q.topic] = (map[q.topic] || 0) + 1;
  });
  return Object.keys(map).map(function(t){ return {name: t, count: map[t]}; });
}

function schemesOnlySet(){
  // Types 2 (numbered scheme statements), 3 (not-one-of lists), 5 (acronyms)
  return QUESTIONS.filter(function(q){ return q.type === 2 || q.type === 3 || q.type === 5; });
}

function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'disabled'){ if (attrs[k]) e.setAttribute('disabled', 'disabled'); }
    else e.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function(c){
    if (c === null || c === undefined) return;
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function todayStr(){
  var d = new Date();
  return d.toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'});
}

/* =========================================================
   QUIZ FLOW
   ========================================================= */
function startQuiz(mode, topic){
  STATE.quizMode = mode;
  STATE.activeTopic = topic;
  var pool;
  if (mode === 'full'){
    pool = STATE.fullOrderMode === 'shuffled' ? shuffleArr(QUESTIONS) : QUESTIONS.slice();
  } else if (mode === 'section'){
    pool = QUESTIONS.filter(function(q){ return q.topic === topic; });
  } else if (mode === 'schemes'){
    pool = shuffleArr(schemesOnlySet());
  }
  STATE.set = pool;
  STATE.index = 0;
  STATE.answers = {};
  STATE.score = 0;
  STATE.screen = 'quiz';
  render();
}

function currentQuestion(){
  return STATE.set[STATE.index];
}

function submitAnswer(letter){
  var q = currentQuestion();
  if (STATE.answers[q.id]) return; // already answered
  var isCorrect = letter === q.answer;
  STATE.answers[q.id] = { status: isCorrect ? 'correct' : 'wrong', selected: letter };
  if (isCorrect) STATE.score++;
  render();
}

function skipQuestion(){
  var q = currentQuestion();
  if (STATE.answers[q.id]) return;
  STATE.answers[q.id] = { status: 'skipped', selected: null };
  render();
}

function nextQuestion(){
  if (STATE.index < STATE.set.length - 1){
    STATE.index++;
    render();
  } else {
    STATE.screen = 'end';
    render();
  }
}

function renderQuiz(){
  var app = document.getElementById('app');
  app.innerHTML = '';

  if (STATE.set.length === 0){
    renderMasthead(app);
    app.appendChild(el('div', {class:'empty-note'}, ['No questions available for this selection.']));
    app.appendChild(el('button', {class:'btn btn-primary', onclick: function(){ STATE.screen='home'; render(); }}, ['Back to menu']));
    return;
  }

  var q = currentQuestion();
  var answered = STATE.answers[q.id];

  var headerLabel = STATE.quizMode === 'full' ? 'Full Practice Test' :
                     STATE.quizMode === 'section' ? STATE.activeTopic :
                     'Schemes-Only Sprint';
  renderMasthead(app, headerLabel);

  var qh = el('div', {class:'quiz-header'});
  qh.appendChild(el('div', {class:'quiz-meta'}, ['Question ' + (STATE.index+1) + ' of ' + STATE.set.length + ' · ' + (TYPE_LABELS[q.type] || '')]));
  qh.appendChild(el('div', {class:'score-box'}, ['Score: ', el('b', {}, [String(STATE.score)]), ' / ' + Object.keys(STATE.answers).length]));
  app.appendChild(qh);

  var pctDone = (STATE.index) / STATE.set.length * 100;
  var track = el('div', {class:'progress-track'});
  track.appendChild(el('div', {class:'progress-fill', style: 'width:' + pctDone + '%'}));
  app.appendChild(track);

  if (q.context){
    var ctxBox = el('div', {class:'context-box'});
    ctxBox.appendChild(el('span', {class:'ctx-label'}, ['Instruction / Passage']));
    ctxBox.appendChild(document.createTextNode(q.context));
    app.appendChild(ctxBox);
  }

  app.appendChild(el('span', {class:'q-difficulty ' + q.difficulty}, [q.difficulty]));
  app.appendChild(el('p', {class:'q-stem'}, [q.stem]));

  var optsWrap = el('div', {class:'options'});
  ['A','B','C','D','E'].forEach(function(letter){
    var optClass = 'option';
    if (answered){
      optClass += ' locked';
      if (letter === q.answer) optClass += ' correct-answer';
      else if (letter === answered.selected) optClass += ' wrong-answer';
      else optClass += ' dim';
    }
    var opt = el('button', {class: optClass, onclick: function(){
      if (!answered) submitAnswer(letter);
    }}, [
      el('span', {class:'opt-letter'}, [letter]),
      el('span', {}, [q.options[letter]])
    ]);
    optsWrap.appendChild(opt);
  });
  app.appendChild(optsWrap);

  if (answered){
    var fbClass = answered.status === 'correct' ? 'correct' : (answered.status === 'wrong' ? 'wrong' : 'skipped');
    var verdict = answered.status === 'correct' ? 'Correct.' : (answered.status === 'wrong' ? 'Not quite.' : "Skipped \u2014 here's the correct answer.");
    var fb = el('div', {class:'feedback-box ' + fbClass});
    fb.appendChild(el('span', {class:'fb-verdict'}, [verdict]));
    fb.appendChild(document.createTextNode(q.explanation));
    app.appendChild(fb);
  }

  var actions = el('div', {class:'quiz-actions'});
  var skipBtn = el('button', {class:'btn btn-skip', onclick: skipQuestion, disabled: !!answered}, ['Skip']);
  var nextBtn = el('button', {class:'btn btn-primary', onclick: nextQuestion, disabled: !answered}, [STATE.index === STATE.set.length - 1 ? 'Finish' : 'Next →']);
  actions.appendChild(skipBtn);
  actions.appendChild(nextBtn);
  app.appendChild(actions);
}

/* =========================================================
   SCREEN: END
   ========================================================= */
function renderEnd(){
  var app = document.getElementById('app');
  app.innerHTML = '';
  renderMasthead(app, 'Result');

  var total = STATE.set.length;
  var answeredCount = Object.keys(STATE.answers).length;
  var correctCount = STATE.set.filter(function(q){ return STATE.answers[q.id] && STATE.answers[q.id].status === 'correct'; }).length;
  var wrongCount = STATE.set.filter(function(q){ return STATE.answers[q.id] && STATE.answers[q.id].status === 'wrong'; }).length;
  var skippedCount = STATE.set.filter(function(q){ return STATE.answers[q.id] && STATE.answers[q.id].status === 'skipped'; }).length;
  var pct = total ? Math.round((correctCount/total)*100) : 0;

  var hero = el('div', {class:'end-hero'});
  hero.appendChild(el('div', {class:'score-num'}, [correctCount + ' / ' + total]));
  hero.appendChild(el('div', {class:'score-label'}, [pct + '% correct · ' + wrongCount + ' wrong · ' + skippedCount + ' skipped']));
  app.appendChild(hero);

  // Accuracy by difficulty
  var diffs = ['Easy','Moderate','Hard'];
  var statRow = el('div', {class:'stat-row'});
  diffs.forEach(function(d){
    var qsOfDiff = STATE.set.filter(function(q){ return q.difficulty === d; });
    var correctOfDiff = qsOfDiff.filter(function(q){ return STATE.answers[q.id] && STATE.answers[q.id].status === 'correct'; }).length;
    var label = qsOfDiff.length ? (correctOfDiff + '/' + qsOfDiff.length) : '—';
    statRow.appendChild(el('div', {class:'stat-card ' + d}, [
      el('div', {class:'stat-num'}, [label]),
      el('div', {class:'stat-lbl'}, [d])
    ]));
  });
  app.appendChild(statRow);

  // Review section
  var missedOrSkipped = STATE.set.filter(function(q){
    var a = STATE.answers[q.id];
    return a && a.status !== 'correct';
  });

  if (missedOrSkipped.length > 0){
    var reviewSec = el('div', {class:'review-section'});
    reviewSec.appendChild(el('h3', {}, ['Review — missed & skipped (' + missedOrSkipped.length + ')']));
    missedOrSkipped.forEach(function(q){
      var a = STATE.answers[q.id];
      var item = el('div', {class:'review-item'});
      var topicLine = el('div', {class:'r-topic'}, [q.topic]);
      topicLine.appendChild(el('span', {class:'r-tag ' + (a.status === 'wrong' ? 'wrong' : 'skipped')}, [a.status === 'wrong' ? 'Wrong' : 'Skipped']));
      item.appendChild(topicLine);
      item.appendChild(el('div', {class:'r-stem'}, [q.stem]));
      if (a.status === 'wrong'){
        item.appendChild(el('div', {class:'r-answer wrong-line'}, ['Your answer: ' + a.selected + '. ' + q.options[a.selected]]));
      }
      item.appendChild(el('div', {class:'r-answer correct-line'}, ['Correct answer: ' + q.answer + '. ' + q.options[q.answer]]));
      item.appendChild(el('div', {class:'r-explain'}, [q.explanation]));
      reviewSec.appendChild(item);
    });
    app.appendChild(reviewSec);
  }

  var endActions = el('div', {class:'end-actions'});
  endActions.appendChild(el('button', {class:'btn btn-primary', onclick: function(){
    startQuiz(STATE.quizMode, STATE.activeTopic);
  }}, ['Retry same set']));
  endActions.appendChild(el('button', {class:'btn', onclick: function(){ STATE.screen='home'; render(); }}, ['Back to menu']));
  app.appendChild(endActions);
}

/* =========================================================
   MAIN RENDER DISPATCH
   ========================================================= */
function render(){
  window.scrollTo(0,0);
  if (STATE.screen === 'home') renderHome();
  else if (STATE.screen === 'topics') renderTopics();
  else if (STATE.screen === 'quiz') renderQuiz();
  else if (STATE.screen === 'end') renderEnd();
}

render();
</script>
</body>
</html>
