ned with Pahle India Foundation."}],"draftId":89,"source":"Merged PDF p. 36"},{"id":"Q088","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Rural-road study","pages":[36],"difficulty":"Hard","type":"Direct","scheme":true,"question":"The NRIDA–IIM Kolkata study of PMGSY-IV and PM-JANMAN roads runs for how long and covers how many roads?","options":["4 years; 500 roads","5 years; 250 roads","4 years; 150 roads","4 years; 250 roads","3 years; 250 roads"],"answer":3,"explanation":"The four-year study covers 250 roads in 50 districts and 150 blocks across 10 States/UTs.","draftId":90,"source":"Merged PDF p. 36"},{"id":"Q089","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"PM E-DRIVE","pages":[37,38],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about PM E-DRIVE. How many are correct?\n1. PM E-DRIVE is under the Ministry of Road Transport and Highways.\n2. PM E-DRIVE has an outlay of ₹11,440 crore.\n3. It is extended till 31 March 2028.\n4. The e-two-wheeler incentive is ₹5,000 per kWh capped at ₹2,500.","options":["Only one","Only two","None","Only three","All four"],"answer":0,"explanation":"1: Incorrect. It is under the Ministry of Heavy Industries. 2: Incorrect. Its outlay is ₹11,900 crore; ₹11,440 crore is for the pulses mission. 3: Correct. This is the stated extension date. 4: Incorrect. It is ₹2,500 per kWh capped at ₹5,000.","statements":[{"text":"PM E-DRIVE is under the Ministry of Road Transport and Highways.","correct":false,"evidence":"It is under the Ministry of Heavy Industries."},{"text":"PM E-DRIVE has an outlay of ₹11,440 crore.","correct":false,"evidence":"Its outlay is ₹11,900 crore; ₹11,440 crore is for the pulses mission."},{"text":"It is extended till 31 March 2028.","correct":true,"evidence":"This is the stated extension date."},{"text":"The e-two-wheeler incentive is ₹5,000 per kWh capped at ₹2,500.","correct":false,"evidence":"It is ₹2,500 per kWh capped at ₹5,000."}],"draftId":91,"source":"Merged PDF p. 37, 38"},{"id":"Q090","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"PM-SETU finance","pages":[37],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which Centre–State–industry funding split applies to PM-SETU’s ₹60,000 crore?","options":["₹30,000; ₹20,000; ₹10,000 crore","₹20,000; ₹20,000; ₹20,000 crore","₹40,000; ₹10,000; ₹10,000 crore","₹20,000; ₹30,000; ₹10,000 crore","₹30,000; ₹15,000; ₹15,000 crore"],"answer":0,"explanation":"PM-SETU allocates ₹30,000 crore from Centre, ₹20,000 crore from States and ₹10,000 crore from industry.","draftId":92,"source":"Merged PDF p. 37"},{"id":"Q091","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"PM-SETU structure","pages":[37],"difficulty":"Hard","type":"NOT correct","scheme":true,"question":"Which statement about PM-SETU structure is NOT correct?","options":["Cluster SPVs give the anchor industry partner a 49% stake.","The programme upgrades 1,000 government ITIs.","There are 200 hubs and 800 spokes.","Five National Skill Training Institutes are covered.","Investment plans for 14 clusters worth ₹3,446 crore were approved."],"answer":0,"explanation":"The industry partner holds 51%; Centre and State hold 24.5% each.","draftId":93,"source":"Merged PDF p. 37"},{"id":"Q092","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"Pulses mission","pages":[38],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which pulses and agencies are linked to assured procurement under the Mission for Aatmanirbharta in Pulses?","options":["Tur, urad, masoor — NAFED and NCCF","Tur, moong, gram — NAFED and NCCF","Gram, urad, masoor — JCI and NCCF","Tur, urad, masoor — FCI and CCI","Tur, moong, masoor — FCI and NAFED"],"answer":0,"explanation":"The focus pulses are tur, urad and masoor, with procurement by NAFED and NCCF.","draftId":94,"source":"Merged PDF p. 38"},{"id":"Q093","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"VB–G RAM G","pages":[38],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about VB–G RAM G. How many are correct?\n1. The VB–G RAM G notification retains 266 permissible works.\n2. Disaster preparedness is a new pillar with 38 works.\n3. The Act guarantees 100 days of work per rural household.\n4. The Act came into force on 1 July 2026.","options":["None","Only two","Only three","All four","Only one"],"answer":1,"explanation":"1: Incorrect. It increases the number to 375. 2: Correct. It is one of four pillars. 3: Incorrect. The source gives 125 days. 4: Correct. It replaced MGNREGA according to the capsule.","statements":[{"text":"The VB–G RAM G notification retains 266 permissible works.","correct":false,"evidence":"It increases the number to 375."},{"text":"Disaster preparedness is a new pillar with 38 works.","correct":true,"evidence":"It is one of four pillars."},{"text":"The Act guarantees 100 days of work per rural household.","correct":false,"evidence":"The source gives 125 days."},{"text":"The Act came into force on 1 July 2026.","correct":true,"evidence":"It replaced MGNREGA according to the capsule."}],"draftId":95,"source":"Merged PDF p. 38"},{"id":"Q094","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"Export support RELIEF","pages":[38],"difficulty":"Hard","type":"Direct","scheme":true,"question":"Which shipment deadline and ECGC risk cover are given under RELIEF?","options":["31 December 2026; 95%","31 March 2027; 90%","31 December 2026; 90%","31 March 2027; 95%","31 March 2028; 95%"],"answer":3,"explanation":"The deadline is 31 March 2027 and the ECGC risk cover is 95%.","draftId":96,"source":"Merged PDF p. 38"},{"id":"Q095","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"PRIP Discovery Track","pages":[39],"difficulty":"Hard","type":"Direct","scheme":true,"question":"Which maximum per-project assistance and minimum co-funding pair describes PRIP’s New Discovery Track?","options":["₹100 crore; 25%","₹25 crore; 25%","₹50 crore; 50%","₹50 crore; 25%","₹50 crore; 10%"],"answer":3,"explanation":"The track gives up to ₹50 crore per early drug-discovery project and requires at least 25% co-funding.","draftId":97,"source":"Merged PDF p. 39"},{"id":"Q096","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"DRISHTI","pages":[39],"difficulty":"Hard","type":"Direct","scheme":true,"question":"What is the DRISHTI project’s total cost and central contribution?","options":["₹52 crore; ₹41.6 crore","₹65 crore; ₹50 crore","₹65 crore; ₹52 crore","₹65 crore; ₹39 crore","₹75 crore; ₹60 crore"],"answer":2,"explanation":"DRISHTI costs ₹65 crore; the Centre contributes ₹52 crore (80%) from MoHUA’s Urban Development Fund.","draftId":98,"source":"Merged PDF p. 39"},{"id":"Q097","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Aadhaar initiatives","pages":[39,40],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Aadhaar initiatives. How many are correct?\n1. SWIK 2.0 manages online appointments at Aadhaar centres.\n2. Sub-AUA/Sub-KUA LITE lets smaller entities use existing setups.\n3. The revamped UIDAI website supports 22 languages.\n4. The Token Management System approves Aadhaar authentication proposals.","options":["Only one","Only three","Only two","None","All four"],"answer":0,"explanation":"1: Incorrect. It handles authentication proposals; Token Management System handles appointments. 2: Correct. This is the framework’s stated purpose. 3: Incorrect. It supports 13 languages. 4: Incorrect. It manages appointments and tokens; SWIK 2.0 handles proposals.","statements":[{"text":"SWIK 2.0 manages online appointments at Aadhaar centres.","correct":false,"evidence":"It handles authentication proposals; Token Management System handles appointments."},{"text":"Sub-AUA/Sub-KUA LITE lets smaller entities use existing setups.","correct":true,"evidence":"This is the framework’s stated purpose."},{"text":"The revamped UIDAI website supports 22 languages.","correct":false,"evidence":"It supports 13 languages."},{"text":"The Token Management System approves Aadhaar authentication proposals.","correct":false,"evidence":"It manages appointments and tokens; SWIK 2.0 handles proposals."}],"draftId":99,"source":"Merged PDF p. 39, 40"},{"id":"Q098","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Public institutions and clearances","pages":[40,41,42,43],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Public institutions and clearances. How many are correct?\n1. The Tribal Affairs–IGNCA collaboration works through Tribal Research Institutes.\n2. Survey of India is headquartered in New Delhi.\n3. The Press Council has a chairperson and 28 members.\n4. Shree Jagannath International Airport is being built at Sipasarubali, Odisha.","options":["Only three","None","Only one","Only two","All four"],"answer":0,"explanation":"1: Correct. It documents and digitises tribal heritage (p.40). 2: Incorrect. Its headquarters is Dehradun (p.41). 3: Correct. The composition is stated on p.43. 4: Correct. The Puri project received environmental and CRZ clearance (p.43).","statements":[{"text":"The Tribal Affairs–IGNCA collaboration works through Tribal Research Institutes.","correct":true,"evidence":"It documents and digitises tribal heritage (p.40)."},{"text":"Survey of India is headquartered in New Delhi.","correct":false,"evidence":"Its headquarters is Dehradun (p.41)."},{"text":"The Press Council has a chairperson and 28 members.","correct":true,"evidence":"The composition is stated on p.43."},{"text":"Shree Jagannath International Airport is being built at Sipasarubali, Odisha.","correct":true,"evidence":"The Puri project received environmental and CRZ clearance (p.43)."}],"draftId":55,"source":"Merged PDF p. 40, 41, 42, 43"},{"id":"Q099","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Safer grain storage","pages":[41],"difficulty":"Easy","type":"Direct","scheme":false,"question":"Which institute implements the ICAR–FCI research on alternatives to chemical fumigation?","options":["IIFM, Bhopal","IISc, Bengaluru","CSIR-CMERI, Durgapur","ICAR headquarters, New Delhi","ICAR-CIPHET, Ludhiana"],"answer":4,"explanation":"ICAR-Central Institute of Post-Harvest Engineering and Technology, Ludhiana, implements the two-year ₹3.28 crore Phase I.","draftId":100,"source":"Merged PDF p. 41"},{"id":"Q100","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Classical-language centres","pages":[41],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Which language–Centre of Excellence pairing is correct?","options":["Assamese — Visva-Bharati University","Bengali — Tezpur University","Marathi — Deccan College, Pune","Pali — Central University of Gujarat","Prakrit — Central University of Odisha"],"answer":2,"explanation":"Marathi is paired with Deccan College; Pali with CU Odisha, Prakrit with CU Gujarat, Assamese with Tezpur and Bengali with Visva-Bharati.","draftId":101,"source":"Merged PDF p. 41"},{"id":"Q101","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"CAPF IPS deputation","pages":[42],"difficulty":"Hard","type":"NOT correct","scheme":false,"question":"Which statement about CAPF IPS deputation is NOT correct?","options":["All Additional Director General posts are reserved for IPS deputation.","100% of Special Director General posts are covered.","50% of Inspector General posts are covered.","The Act came into force on 8 October 2026.","100% of Director General posts are covered."],"answer":0,"explanation":"The source specifies at least 67% of ADG posts, not 100%.","draftId":102,"source":"Merged PDF p. 42"},{"id":"Q102","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"IndiaAI Centre","pages":[42],"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which implementing agency runs the Centre for AI in Keralam?","options":["IISc Bengaluru","National Informatics Centre","Digital University Kerala","C-DAC Pune","IIT Madras"],"answer":2,"explanation":"Digital University Kerala implements the Thiruvananthapuram centre, initially supporting 15 AI start-ups.","draftId":103,"source":"Merged PDF p. 42"},{"id":"Q103","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Government agentic AI","pages":[43],"difficulty":"Easy","type":"Direct","scheme":false,"question":"Which firm and first use case are paired in the government agentic-AI contract?","options":["CoRover.ai — DigiLocker","CoRover.ai — MyPNG","QNu Labs — DigiLocker","Kyzer Software — ePDS","Montran India — SWIK"],"answer":0,"explanation":"CoRover.ai, maker of BharatGPT, was chosen; the first use is DigiLocker.","draftId":104,"source":"Merged PDF p. 43"},{"id":"Q104","section":"04 · Banking, finance \u0026 investment","topic":"Banking institutions and capital","subtopic":"IDBI strategic sale","pages":[43],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which Government–LIC stake sale combination adds to the approved 60.72% IDBI divestment?","options":["30.72% and 30.00%","30.48% and 30.24%","29.72% and 31.00%","30.24% and 30.48%","31.48% and 29.24%"],"answer":1,"explanation":"The sellers are Government of India (30.48%) and LIC (30.24%); the buyer is Fairfax.","draftId":106,"source":"Merged PDF p. 43"},{"id":"Q105","section":"04 · Banking, finance \u0026 investment","topic":"Banking institutions and capital","subtopic":"SME Growth Fund and ITLA","pages":[44,45],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about SME Growth Fund and ITLA. How many are correct?\n1. The SME Growth Fund commitment is ₹1,000 crore.\n2. The fund provides long-term equity as an AIF.\n3. ITLA will appraise Central projects costing ₹100 crore or more.\n4. ITLA will create a repository using e-way bill, FASTag and Vahan data.","options":["All four","Only three","Only one","None","Only two"],"answer":4,"explanation":"1: Incorrect. The Cabinet commitment is ₹10,000 crore. 2: Correct. It addresses SME growth-capital needs. 3: Incorrect. The threshold is ₹500 crore. 4: Correct. These three data sources are named.","statements":[{"text":"The SME Growth Fund commitment is ₹1,000 crore.","correct":false,"evidence":"The Cabinet commitment is ₹10,000 crore."},{"text":"The fund provides long-term equity as an AIF.","correct":true,"evidence":"It addresses SME growth-capital needs."},{"text":"ITLA will appraise Central projects costing ₹100 crore or more.","correct":false,"evidence":"The threshold is ₹500 crore."},{"text":"ITLA will create a repository using e-way bill, FASTag and Vahan data.","correct":true,"evidence":"These three data sources are named."}],"draftId":107,"source":"Merged PDF p. 44, 45"},{"id":"Q106","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"CAFE-III","pages":[45],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about CAFE-III. How many are correct?\n1. The norms cover 1 April 2027 to 31 March 2032.\n2. BEVs receive 3x super credits.\n3. Manufacturers below 1,000 annual units must still report.\n4. The reference vehicle weight is reduced to 1,082 kg.","options":["All four","None","Only two","Only three","Only one"],"answer":3,"explanation":"1: Correct. This is the notified period. 2: Correct. Plug-in hybrids receive 2.5x and strong hybrids 1.6x. 3: Correct. They are exempt from targets but not reporting. 4: Incorrect. It rises from 1,082 kg to 1,229 kg.","statements":[{"text":"The norms cover 1 April 2027 to 31 March 2032.","correct":true,"evidence":"This is the notified period."},{"text":"BEVs receive 3x super credits.","correct":true,"evidence":"Plug-in hybrids receive 2.5x and strong hybrids 1.6x."},{"text":"Manufacturers below 1,000 annual units must still report.","correct":true,"evidence":"They are exempt from targets but not reporting."},{"text":"The reference vehicle weight is reduced to 1,082 kg.","correct":false,"evidence":"It rises from 1,082 kg to 1,229 kg."}],"draftId":105,"source":"Merged PDF p. 45"},{"id":"Q107","section":"04 · Banking, finance \u0026 investment","topic":"Banking institutions and capital","subtopic":"AIF categories","pages":[45],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Which grouping matches Category II AIFs?","options":["SME and hedge funds","Hedge funds and complex trading funds","Social venture and infrastructure funds","Venture capital and SME funds","Private equity and real estate funds"],"answer":4,"explanation":"The capsule places private equity and real estate in Category II; venture/SME/social/infrastructure in I and hedge/complex strategies in III.","draftId":108,"source":"Merged PDF p. 45"},{"id":"Q108","section":"04 · Banking, finance \u0026 investment","topic":"Banking institutions and capital","subtopic":"Blue financing","pages":[45,46],"difficulty":"Hard","type":"Direct","scheme":false,"question":"JNPA’s shore-power loan from IFC has which amount, tenure and guarantee status?","options":["US$70 million; 10 years; no sovereign guarantee","US$70 million; 5 years; sovereign guarantee","US$70 million; 10 years; sovereign guarantee","US$60 million; 10 years; no sovereign guarantee","US$70 million; 15 years; no sovereign guarantee"],"answer":0,"explanation":"The first blue-financing deal is a US$70 million, 10-year ECB without sovereign guarantee.","draftId":109,"source":"Merged PDF p. 45, 46"},{"id":"Q109","section":"04 · Banking, finance \u0026 investment","topic":"Banking institutions and capital","subtopic":"Shore power","pages":[46],"difficulty":"Easy","type":"Direct","scheme":false,"question":"What does cold ironing allow ships at berth to do?","options":["Generate electricity from offshore wind on board","Use grid electricity instead of diesel engines","Use only liquefied natural gas engines","Feed diesel-generated electricity back to the grid","Transfer fuel to shore through electric pumps"],"answer":1,"explanation":"Shore power, or cold ironing, connects berthed ships to grid electricity.","draftId":110,"source":"Merged PDF p. 46"},{"id":"Q110","section":"04 · Banking, finance \u0026 investment","topic":"Digital payments and securities","subtopic":"Apple Pay’s initial India offering","pages":[46],"difficulty":"Hard","type":"NOT correct","scheme":false,"question":"Which statement about Apple Pay’s initial India offering is NOT correct?","options":["Tokenisation replaces the real card number with a device account number.","Authentication can use Face ID, Touch ID or passcode.","It starts with Axis Bank credit cards.","It supports RuPay cards from launch.","Visa and Mastercard cards are supported."],"answer":3,"explanation":"The initial offering does not support RuPay or UPI; it starts with Axis Visa/Mastercard credit cards.","draftId":111,"source":"Merged PDF p. 46"},{"id":"Q111","section":"04 · Banking, finance \u0026 investment","topic":"Digital payments and securities","subtopic":"Programmable CBDC","pages":[46],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Which bank–technology partner pair launched user-level programmable CBDC with auto-issuance?","options":["Axis Bank — CoRover.ai","Karnataka Bank — Montran India","Bank of Baroda — Montran India","Bank of India — Montran India","Bank of India — Kyzer Software"],"answer":3,"explanation":"Bank of India launched the product, developed by Montran India, at GFF 2026.","draftId":112,"source":"Merged PDF p. 46"},{"id":"Q112","section":"04 · Banking, finance \u0026 investment","topic":"Digital payments and securities","subtopic":"Digital rupee","pages":[46],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Digital rupee. How many are correct?\n1. India’s CBDC is issued by NPCI.\n2. The wholesale pilot began on 1 December 2022.\n3. The retail pilot began on 1 November 2022.\n4. Programmable CBDC prevents users from limiting the recipient’s spending purpose.","options":["All four","Only three","Only one","None","Only two"],"answer":3,"explanation":"1: Incorrect. It is issued by RBI. 2: Incorrect. It began on 1 November 2022. 3: Incorrect. It began on 1 December 2022. 4: Incorrect. Purpose-bound spending is a stated feature.","statements":[{"text":"India’s CBDC is issued by NPCI.","correct":false,"evidence":"It is issued by RBI."},{"text":"The wholesale pilot began on 1 December 2022.","correct":false,"evidence":"It began on 1 November 2022."},{"text":"The retail pilot began on 1 November 2022.","correct":false,"evidence":"It began on 1 December 2022."},{"text":"Programmable CBDC prevents users from limiting the recipient’s spending purpose.","correct":false,"evidence":"Purpose-bound spending is a stated feature."}],"draftId":113,"source":"Merged PDF p. 46"},{"id":"Q113","sect anz General Insurance?","options":["₹640.50 crore; 50:50","₹640.10 crore; 70:30","₹640 crore; 51:49","₹640.10 crore; 50:50","₹320.05 crore; 50:50"],"answer":3,"explanation":"Each partner invested ₹320.05 crore, totalling ₹640.10 crore, in the 50:50 JV.","draftId":117,"source":"Merged PDF p. 47"},{"id":"Q117","section":"04 · Banking, finance \u0026 investment","topic":"Leadership, insurance and pensions","subtopic":"VIBE health insurance","pages":[47],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about VIBE health insurance. How many are correct?\n1. VIBE was launched by ICICI Prudential Life.\n2. It targets adults aged 18–35.\n3. Cover begins at ₹5 lakh.\n4. Fitness-linked rewards are called Aura Points.","options":["Only three","Only one","Only two","All four","None"],"answer":2,"explanation":"1: Incorrect. It was launched by ICICI Lombard General Insurance. 2: Correct. This is the specified age band. 3: Incorrect. Cover starts at ₹7 lakh and goes to ₹1 crore. 4: Correct. The plan also includes outpatient and mental-health support.","statements":[{"text":"VIBE was launched by ICICI Prudential Life.","correct":false,"evidence":"It was launched by ICICI Lombard General Insurance."},{"text":"It targets adults aged 18–35.","correct":true,"evidence":"This is the specified age band."},{"text":"Cover begins at ₹5 lakh.","correct":false,"evidence":"Cover starts at ₹7 lakh and goes to ₹1 crore."},{"text":"Fitness-linked rewards are called Aura Points.","correct":true,"evidence":"The plan also includes outpatient and mental-health support."}],"draftId":118,"source":"Merged PDF p. 47"},{"id":"Q118","section":"04 · Banking, finance \u0026 investment","topic":"Leadership, insurance and pensions","subtopic":"BoB pension business","pages":[47,48],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about BoB pension business. How many are correct?\n1. BoB is the first public-sector bank in pension fund business.\n2. The sponsor appointment is under Section 27 of the PFRDA Act, 2013.\n3. BoB owns 19.90% of the pension company.\n4. Tatkal NPS was linked with the BHIM app.","options":["None","Only two","Only three","Only one","All four"],"answer":1,"explanation":"1: Incorrect. It is the second after SBI. 2: Correct. The appointment section is explicitly stated. 3: Incorrect. BoB owns 80.10%; Baroda BNP Paribas Asset Management owns 19.90%. 4: Correct. This enables paperless account opening.","statements":[{"text":"BoB is the first public-sector bank in pension fund business.","correct":false,"evidence":"It is the second after SBI."},{"text":"The sponsor appointment is under Section 27 of the PFRDA Act, 2013.","correct":true,"evidence":"The appointment section is explicitly stated."},{"text":"BoB owns 19.90% of the pension company.","correct":false,"evidence":"BoB owns 80.10%; Baroda BNP Paribas Asset Management owns 19.90%."},{"text":"Tatkal NPS was linked with the BHIM app.","correct":true,"evidence":"This enables paperless account opening."}],"draftId":119,"source":"Merged PDF p. 47, 48"},{"id":"Q119","section":"04 · Banking, finance \u0026 investment","topic":"Banking institutions and capital","subtopic":"Financial-sector developments","pages":[48,50,51,53],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Financial-sector developments. How many are correct?\n1. Marcellus received final SEBI approval for mutual funds.\n2. Poorna Rakshak is a linked, participating plan.\n3. The first RDI fund-manager cohort received a ₹7,131 crore commitment.\n4. RBI Executive Director Sudhakar Malli will oversee the Department of Supervision.","options":["None","Only one","All four","Only three","Only two"],"answer":3,"explanation":"1: Correct. Its in-principle approval was in May 2025 (p.50). 2: Incorrect. Pramerica’s plan is non-linked and non-participating (p.51). 3: Correct. The cohort has nineteen managers (p.53). 4: Correct. His appointment is effective 1 October 2026 (p.48).","statements":[{"text":"Marcellus received final SEBI approval for mutual funds.","correct":true,"evidence":"Its in-principle approval was in May 2025 (p.50)."},{"text":"Poorna Rakshak is a linked, participating plan.","correct":false,"evidence":"Pramerica’s plan is non-linked and non-participating (p.51)."},{"text":"The first RDI fund-manager cohort received a ₹7,131 crore commitment.","correct":true,"evidence":"The cohort has nineteen managers (p.53)."},{"text":"RBI Executive Director Sudhakar Malli will oversee the Department of Supervision.","correct":true,"evidence":"His appointment is effective 1 October 2026 (p.48)."}],"draftId":56,"source":"Merged PDF p. 48, 50, 51, 53"},{"id":"Q120","section":"04 · Banking, finance \u0026 investment","topic":"Leadership, insurance and pensions","subtopic":"HDFC appointment","pages":[48],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Which incoming HDFC chief–previous employer pair is recorded?","options":["Siddhartha Mishra — ICICI Prudential Life Insurance","Sudhakar Malli — RBI","Anup Kumar Saha — Bajaj Finance","Mahesh Muralidhar Pai — Canara Bank","Anup Bagchi — ICICI Prudential Life Insurance"],"answer":4,"explanation":"Anup Bagchi, previously ICICI Prudential Life MD/CEO, takes charge of HDFC Bank on 27 October 2026.","draftId":120,"source":"Merged PDF p. 48"},{"id":"Q121","section":"04 · Banking, finance \u0026 investment","topic":"Banking institutions and capital","subtopic":"NABKISAN WASH bond","pages":[48],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which amount–coupon–tenure combination describes NABKISAN’s WASH social bond?","options":["₹150 crore; 8.10%; 5 years","₹180 crore; 8.10%; 5 years","₹180 crore; 8.10%; 10 years","₹180 crore; 7.90%; 5 years","₹180 crore; 8.20%; 5 years"],"answer":1,"explanation":"NABKISAN raised ₹180 crore at 8.10% for five years, maturing September 2031.","draftId":121,"source":"Merged PDF p. 48"},{"id":"Q122","section":"04 · Banking, finance \u0026 investment","topic":"Banking institutions and capital","subtopic":"NABKISAN’s social bond","pages":[48],"difficulty":"Hard","type":"NOT correct","scheme":false,"question":"Which statement about NABKISAN’s social bond is NOT correct?","options":["The bond was listed on BSE.","NABKISAN is a NABARD subsidiary.","CRISIL and CARE rated it AAA (Stable).","The bond is dedicated to water, sanitation and hygiene.","It was oversubscribed 1.8 times."],"answer":0,"explanation":"The bond was listed on NSE, not BSE. The proceeds are dedicated to WASH social projects.","draftId":122,"source":"Merged PDF p. 48"},{"id":"Q123","section":"04 · Banking, finance \u0026 investment","topic":"Banking institutions and capital","subtopic":"Core Investment Companies","pages":[49],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which asset-size, group-investment and group-equity thresholds are given for CICs?","options":["₹100 crore; 60%; 90%","₹100 crore; 75%; 60%","₹100 crore; 90%; 50%","₹500 crore; 90%; 60%","₹100 crore; 90%; 60%"],"answer":4,"explanation":"The capsule specifies ₹100 crore or more, at least 90% of net assets in group companies and at least 60% in their equity.","draftId":123,"source":"Merged PDF p. 49"},{"id":"Q124","section":"04 · Banking, finance \u0026 investment","topic":"Digital payments and securities","subtopic":"Investor awareness","pages":[49],"difficulty":"Easy","type":"Direct","scheme":false,"question":"“Samajh Se Investing Simple” was launched under which project and during which observance?","options":["Project MUST; NPS Divas","Project Unmesha; World Investor Week","Project Jagrook; World Savings Day","Project Jagrook; NPS Divas","Project Jagrook; World Investor Week"],"answer":4,"explanation":"SEBI launched it under Project Jagrook during World Investor Week, 5–11 October 2026.","draftId":124,"source":"Merged PDF p. 49"},{"id":"Q125","section":"04 · Banking, finance \u0026 investment","topic":"Leadership, insurance and pensions","subtopic":"LIC plans","pages":[49],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about LIC plans. How many are correct?\n1. New Jeevan Dhara-II is an immediate annuity plan.\n2. Health Shield is a unit-linked family health plan.\n3. New Cancer Cover pays 100% for early-stage cancer.\n4. All three plans are linked, participating products.","options":["None","Only two","Only three","Only one","All four"],"answer":0,"explanation":"1: Incorrect. The source specifies a deferred annuity plan. 2: Incorrect. It is fixed-benefit, non-linked health cover. 3: Incorrect. Early-stage payout is 25%; major-stage is 100%. 4: Incorrect. They are non-linked and non-participating.","statements":[{"text":"New Jeevan Dhara-II is an immediate annuity plan.","correct":false,"evidence":"The source specifies a deferred annuity plan."},{"text":"Health Shield is a unit-linked family health plan.","correct":false,"evidence":"It is fixed-benefit, non-linked health cover."},{"text":"New Cancer Cover pays 100% for early-stage cancer.","correct":false,"evidence":"Early-stage payout is 25%; major-stage is 100%."},{"text":"All three plans are linked, participating products.","correct":false,"evidence":"They are non-linked and non-participating."}],"draftId":125,"source":"Merged PDF p. 49"},{"id":"Q126","section":"04 · Banking, finance \u0026 investment","topic":"Digital payments and securities","subtopic":"Demat 2.0","pages":[49,50],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Demat 2.0. How many are correct?\n1. It pilots corporate bonds as DLT-based digital tokens.\n2. REC is the first issuer with ₹500 crore.\n3. Investors must open a new demat account and repeat KYC.\n4. The Unified Market Interface links it to the wholesale digital rupee.","options":["Only one","Only three","None","Only two","All four"],"answer":1,"explanation":"1: Correct. The instrument remains a corporate bond. 2: Correct. L\u0026T also issued ₹500 crore; IIFL ₹25 crore. 3: Incorrect. Existing demat accounts are used; no new KYC is needed. 4: Correct. This allows atomic settlement.","statements":[{"text":"It pilots corporate bonds as DLT-based digital tokens.","correct":true,"evidence":"The instrument remains a corporate bond."},{"text":"REC is the first issuer with ₹500 crore.","correct":true,"evidence":"L\u0026T also issued ₹500 crore; IIFL ₹25 crore."},{"text":"Investors must open a new demat account and repeat KYC.","correct":false,"evidence":"Existing demat accounts are used; no new KYC is needed."},{"text":"The Unified Market Interface links it to the wholesale digital rupee.","correct":true,"evidence":"This allows atomic settlement."}],"draftId":126,"source":"Merged PDF p. 49, 50"},{"id":"Q127","section":"04 · Banking, finance \u0026 investment","topic":"Digital payments and securities","subtopic":"Central counterparties","pages":[50],"difficulty":"Easy","type":"Direct","scheme":false,"question":"SEBI signed the CCP information-sharing MoU with which body?","options":["International Organization of Securities Commissions","Financial Stability Board","European Free Trade Association","European Securities and Markets Authority","International Finance Corporation"],"answer":3,"explanation":"The agreement is with ESMA and concerns India-based CCPs supervised by SEBI.","draftId":127,"source":"Merged PDF p. 50"},{"id":"Q128","section":"04 · Banking, finance \u0026 investment","topic":"Digital payments and securities","subtopic":"UPI MDR proposal","pages":[50],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about UPI MDR proposal. How many are correct?\n1. The proposed MDR applies to person-to-person UPI transfers.\n2. Merchant payments up to ₹3,000 remain free under the proposal.\n3. The general rate above ₹2,000 is 0.4%.\n4. MDR is paid by the customer.","options":["Only three","Only two","Only one","All four","None"],"answer":2,"explanation":"1: Incorrect. P2P transfers remain free. 2: Incorrect. The free threshold is ₹2,000. 3: Correct. It is capped at ₹300 for ₹75,000 and above. 4: Incorrect. The merchant pays MDR.","statements":[{"text":"The proposed MDR applies to person-to-person UPI transfers.","correct":false,"evidence":"P2P transfers remain free."},{"text":"Merchant payments up to ₹3,000 remain free under the proposal.","correct":false,"evidence":"The free threshold is ₹2,000."},{"text":"The general rate above ₹2,000 is 0.4%.","correct":true,"evidence":"It is capped at ₹300 for ₹75,000 and above."},{"text":"MDR is paid by the customer.","correct":false,"evidence":"The merchant pays MDR."}],"draftId":128,"source":"Merged PDF p. 50"},{"id":"Q129","section":"04 · Banking, finance \u0026 investment","topic":"Digital payments and securities","subtopic":"MDR allocation","pages":[50],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which split is specified for customer bank, gateway, UPI app and sponsor bank respectively?","options":["25:25:25:25","40:30:10:20","40:30:20:10","30:40:20:10","40:20:30:10"],"answer":2,"explanation":"The proposed split is 40%, 30%, 20% and 10%, respectively.","draftId":129,"source":"Merged PDF p. 50"},{"id":"Q130","section":"04 · Banking, finance \u0026 investment","topic":"Digital payments and securities","subtopic":"Reliance bond issue","pages":[50],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which size–coupon–tenure combination describes Reliance Industries’ issue?","options":["₹13,000 crore; 7.90%; 10 years","₹13,000 crore; 8.10%; 10 years","₹13,000 crore; 7.90%; 5 years","₹10,000 crore; 7.90%; 10 years","₹13,000 crore; 7.50%; 10 years"],"answer":0,"explanation":"Reliance raised ₹13,000 crore through 10-year bonds at 7.90%; SBI was the largest investor.","draftId":130,"source":"Merged PDF p. 50"},{"id":"Q131","section":"04 · Banking, finance \u0026 investment","topic":"Leadership, insurance and pensions","subtopic":"MSME insurance challenge","pages":[51],"difficulty":"Hard","type":"Direct","scheme":false,"question":"The UNDP–Generali Central challenge offers what maximum grant per winner, for up to how many winners?","options":["US$50,000; three","US$40,000; three","US$40,000; five","US$30,000; three","US$40,000; two"],"answer":1,"explanation":"Up to three winners can receive grants of up to US$40,000 each.","draftId":131,"source":"Merged PDF p. 51"},{"id":"Q132","section":"04 · Banking, finance \u0026 investment","topic":"Leadership, insurance and pensions","subtopic":"Trade Konnect","pages":[51],"difficulty":"Easy","type":"Direct","scheme":false,"question":"Which bank and technology partner are associated with Trade Konnect?","options":["Karur Vysya Bank; CoRover.ai","Karnataka Bank; Montran India","Karur Vysya Bank; Kyzer Software","Bank of India; Kyzer Software","Karnataka Bank; Kyzer Software"],"answer":4,"explanation":"Karnataka Bank launched the forex/remittance platform with Kyzer Software.","draftId":132,"source":"Merged PDF p. 51"},{"id":"Q133","section":"04 · Banking, finance \u0026 investment","topic":"Leadership, insurance and pensions","subtopic":"Bancassurance","pages":[51],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which ownership ratio describes Zurich Kotak General Insurance?","options":["Zurich 74%; Kotak 26%","Zurich 30%; Kotak 70%","Zurich 50%; Kotak 50%","Zurich 70%; Kotak 30%","Zurich 51%; Kotak 49%"],"answer":3,"explanation":"The source describes a 70:30 Zurich–Kotak joint venture; Karur Vysya Bank signed a bancassurance agreement with it.","draftId":133,"source":"Merged PDF p. 51"},{"id":"Q134","section":"04 · Banking, finance \u0026 investment","topic":"Leadership, insurance and pensions","subtopic":"RBI enforcement","pages":[51],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Hero FinCorp’s ₹10 lakh penalty concerned which breach?","opt text":"Tata Projects’ aero-engine testing partner MDS Aero is based in Norway.","correct":false,"evidence":"MDS Aero Support Corporation is Canadian."}],"draftId":168,"source":"Merged PDF p. 62, 63"},{"id":"Q169","section":"05 · National affairs, environment \u0026 rural development","topic":"Infrastructure, technology and partnerships","subtopic":"Industry collaborations","pages":[62,63],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Industry collaborations. How many are correct?\n1. The ePlane Company’s eVTOL partnership is with Noida International Airport.\n2. Hical’s Rafale systems partner is Canada’s MDS Aero.\n3. Tata Power’s floating-solar partner is Norway’s Ocean Sun.\n4. Adani and Jabil propose a 70:30 data-centre hardware JV.","options":["None","All four","Only two","Only three","Only one"],"answer":2,"explanation":"1: Correct. It covers vertiports, charging and procedures. 2: Incorrect. It is France’s Safran Aerosystems; MDS Aero partners with Tata Projects. 3: Correct. The pilot is at Mulshi reservoir. 4: Incorrect. The proposed JV is 50:50.","statements":[{"text":"The ePlane Company’s eVTOL partnership is with Noida International Airport.","correct":true,"evidence":"It covers vertiports, charging and procedures."},{"text":"Hical’s Rafale systems partner is Canada’s MDS Aero.","correct":false,"evidence":"It is France’s Safran Aerosystems; MDS Aero partners with Tata Projects."},{"text":"Tata Power’s floating-solar partner is Norway’s Ocean Sun.","correct":true,"evidence":"The pilot is at Mulshi reservoir."},{"text":"Adani and Jabil propose a 70:30 data-centre hardware JV.","correct":false,"evidence":"The proposed JV is 50:50."}],"draftId":169,"source":"Merged PDF p. 62, 63"},{"id":"Q170","section":"05 · National affairs, environment \u0026 rural development","topic":"Infrastructure, technology and partnerships","subtopic":"Investment and energy projects","pages":[62,63],"difficulty":"Hard","typ ce places India ninth in forest area and third in net annual forest-area gain.","draftId":173,"source":"Merged PDF p. 64"},{"id":"Q174","section":"06 · International affairs \u0026 reports","topic":"Diplomacy, trade and global institutions","subtopic":"Forest and tree cover","pages":[64],"difficulty":"Hard","type":"Direct","scheme":false,"question":"What Indian forest/tree-cover area and share were presented at COFO 28?","options":["82.74 million hectares; 24.17%","82.47 million hectares; 25.71%","72.74 million hectares; 25.17%","82.74 lakh hectares; 25.17%","82.74 million hectares; 25.17%"],"answer":4,"explanation":"India reported 82.74 million hectares, or 25.17% of its area.","draftId":174,"source":"Merged PDF p. 64"},{"id":"Q175","section":"06 · International affairs \u0026 reports","topic":"Diplomacy, trade and global institutions","subtopic":"Bhutan hydropower","pages":[65],"difficulty":"Hard","type":"Direct","scheme":false,"question":"For Chamkharchhu-I, which capacity and DGPC–Adani equity ratio are stated?","options":["770 MW; 49:51","770 MW; 50:50","700 MW; 51:49","750 MW; 51:49","770 MW; 51:49"],"answer":4,"explanation":"The Zhemgang project is 770 MW, with DGPC holding 51% and Adani 49%, under a 30-year BOOT concession.","draftId":175,"source":"Merged PDF p. 65"},{"id":"Q176","section":"06 · International affairs \u0026 reports","topic":"Diplomacy, trade and global institutions","subtopic":"UN General Assembly","pages":[65],"difficulty":"Easy","type":"Direct","scheme":false,"question":"Who is named president of the 81st UN General Assembly session?","options":["Urbain Brito of Benin","Khalilur Rehman of Bangladesh","Indra Mani Pandey of India","Pierre Taty of the Republic of the Congo","Milton Dick of Australia"],"answer":1,"explanation":"The capsule names Bangladesh Foreign Minister Khalilur Rehman.","draftId":176,"source":"Merged PDF p. 65"},{"id":"Q177","section":"06 · International affairs \u0026 reports","topic":"Diplomacy, trade and global institut ars"],"answer":3,"explanation":"The agreement targets US$100 billion investment and one million direct jobs over fifteen years.","draftId":178,"source":"Merged PDF p. 65, 66"},{"id":"Q179","section":"06 · International affairs \u0026 reports","topic":"Diplomacy, trade and global institutions","subtopic":"Africa visit","pages":[66],"difficulty":"Easy","type":"Direct","scheme":false,"question":"Which country formally joined the International Big Cat Alliance during Jaishankar’s visit?","options":["Côte d’Ivoire","Ghana","Ethiopia","Benin","Tanzania"],"answer":1,"explanation":"Ghana formally joined the India-led alliance, which covers seven big cats.","draftId":179,"source":"Merged PDF p. 66"},{"id":"Q180","section":"06 · International affairs \u0026 reports","topic":"Diplomacy, trade and global institutions","subtopic":"BIMSTEC","pages":[66],"difficulty":"Hard","type":"NOT correct","scheme":false,"question":"Which statement about BIMSTEC is NOT correct?","options":["It has seven members.","India hosted the first Home Ministers’ Meeting in New Delhi.","Its headquarters is in Bangkok.","It was formed on 6 June 1997.","The meeting adopted the Delhi Declaration."],"answer":2,"explanation":"BIMSTEC headquarters is Dhaka; Bangkok is associated with its founding declaration.","draftId":180,"source":"Merged PDF p. 66"},{"id":"Q181","section":"06 · International affairs \u0026 reports","topic":"Diplomacy, trade and global institutions","subtopic":"Regional power connectivity","pages":[66,67],"difficulty":"Hard","type":"Direct","scheme":false,"question":"What capacity and approximate length describe the proposed India–Singapore link?","options":["2,000 MW; 2,000 km","2,000 MW; 4,000 km","3,000 MW; 2,000 km","2,000 MW; 3,000 km","2,500 MW; 3,000 km"],"answer":3,"explanation":"The explored route is about 3,000 km and 2,000 MW, via Myanmar, Thailand and Malaysia.","draftId":181,"source":"Merged PDF p. 66, 67"},{"id":"Q182","section":"06 · International affairs \u0026 reports","top ports","topic":"Social, education and environment reports","subtopic":"Living Planet Report","pages":[68,69],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Living Planet Report. How many are correct?\n1. The report is by WWF with the Zoological Society of London.\n2. Monitored populations fell on average 73% over 1970–2022.\n3. Marine ecosystems recorded the steepest decline at 85%.\n4. Habitat loss and degradation are the biggest threat.","options":["Only one","Only three","None","Only two","All four"],"answer":1,"explanation":"1: Correct. The title is The Science of Hope. 2: Correct. This is an average population decline, not a species-extinction percentage. 3: Incorrect. Freshwater declined 85%; marine 59%. 4: Correct. This is the stated leading threat.","statements":[{"text":"The report is by WWF with the Zoological Society of London.","correct":true,"evidence":"The title is The Science of Hope."},{"text":"Monitored populations fell on average 73% over 1970–2022.","correct":true,"evidence":"This is an average population decline, not a species-extinction percentage."},{"text":"Marine ecosystems recorded the steepest decline at 85%.","correct":false,"evidence":"Freshwater declined 85%; marine 59%."},{"text":"Habitat loss and degradation are the biggest threat.","correct":true,"evidence":"This is the stated leading threat."}],"draftId":189,"source":"Merged PDF p. 68, 69"},{"id":"Q190","section":"06 · International affairs \u0026 reports","topic":"Social, education and environment reports","subtopic":"India wildlife estimates","pages":[69],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which lion–snow leopard–Ganges river dolphin set is reported?","options":["891; 718; 3,682","891; 718; 6,234","891; 817; 6,324","674; 718; 6,324","891; 718; 6,324"],"answer":4,"explanation":"The source gives 891 Asiatic lions in 2025, 718 snow leopards and 6,324 Ganges river dolphins.","draftId":190,"source":" 9","section":"07 · Science, technology \u0026 defence","topic":"Defence systems and industry","subtopic":"Kaveri Dry Engine","pages":[72],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which measured thrust and intended aircraft are specified for the Kaveri Derivative engine?","options":["46 kN; Agnibaan","48.5 kN; Rafale Marine","46 kN; Ghatak UCAV","48.5 kN; ALH Mk-III","48.5 kN; Ghatak UCAV"],"answer":4,"explanation":"The engine reached 48.5 kN dry thrust, exceeding its 46 kN target, for the Ghatak stealth UCAV.","draftId":199,"source":"Merged PDF p. 72"},{"id":"Q200","section":"07 · Science, technology \u0026 defence","topic":"Defence systems and industry","subtopic":"HATSOFF acquisition","pages":[72],"difficulty":"Hard","type":"Direct","scheme":false,"question":"HAL’s purchase of CAE’s HATSOFF stake is described by which pair?","options":["51% stake; ₹50 crore","50% stake; ₹50 crore","50% stake; nil cost","50% stake; ₹200 crore","49% stake; nil cost"],"answer":2,"explanation":"HAL buys CAE’s 50% at nil cost, making HATSOFF wholly owned.","draftId":200,"source":"Merged PDF p. 72"},{"id":"Q201","section":"07 · Science, technology \u0026 defence","topic":"Exercises, ships and military institutions","subtopic":"Mountain Guardian","pages":[72],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Mountain Guardian 2026 links which partner country and training location?","options":["Kazakhstan; Chaubatia, Uttarakhand","UAE; Oskemen","UK; Plymouth","Russia; Chaubatia, Uttarakhand","UAE; Chaubatia, Uttarakhand"],"answer":4,"explanation":"The India–UAE exercise was held at Chaubatia from 5–18 October 2026.","draftId":201,"source":"Merged PDF p. 72"},{"id":"Q202","section":"07 · Science, technology \u0026 defence","topic":"Exercises, ships and military institutions","subtopic":"Fleet Support Ship","pages":[72],"difficulty":"Easy","type":"Direct","scheme":false,"question":"Which shipyard launched the first Fleet Support Ship, Surya?","options" ry institutions","subtopic":"Army rice supply","pages":[74],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Army rice supply. How many are correct?\n1. FCI will procure and supply the Army’s Bharat Rice in 2026–27.\n2. The Army’s FCI infrastructure MoU lasts three years.\n3. NCCF is the named agency for the Army’s Bharat Rice procurement.\n4. The FCI MoU is limited to one year.","options":["Only three","Only one","Only two","None","All four"],"answer":3,"explanation":"1: Incorrect. NAFED is the procuring/supplying agency; FCI provides infrastructure under the MoU. 2: Incorrect. It lasts five years. 3: Incorrect. The named procurement and supply agency is NAFED. 4: Incorrect. It runs for five years.","statements":[{"text":"FCI will procure and supply the Army’s Bharat Rice in 2026–27.","correct":false,"evidence":"NAFED is the procuring/supplying agency; FCI provides infrastructure under the MoU."},{"text":"The Army’s FCI infrastructure MoU lasts three years.","correct":false,"evidence":"It lasts five years."},{"text":"NCCF is the named agency for the Army’s Bharat Rice procurement.","correct":false,"evidence":"The named procurement and supply agency is NAFED."},{"text":"The FCI MoU is limited to one year.","correct":false,"evidence":"It runs for five years."}],"draftId":208,"source":"Merged PDF p. 74"},{"id":"Q209","section":"07 · Science, technology \u0026 defence","topic":"Exercises, ships and military institutions","subtopic":"Coast Guard aviation","pages":[74],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Where was ALH Mk-III CG 875 inducted and which squadron did it join?","options":["Mumbai; 813 Squadron","Kochi; 831 Squadron","Ratnagiri; 831 Squadron","Paradip; 831 Squadron","Ratnagiri; 813 Squadron"],"answer":2,"explanation":"The HAL-built helicopter joins 831 Squadron at Ratnagiri, first of five for the station.","draftId":209,"source":"Merged PDF p. 74"},{"id":"Q210","section":"07 ·  app.innerHTML=`<section class="hero"><div><div class="eyebrow">Your source. Your practice.</div><h1>Know the detail.<br><span style="color:var(--teal)">Own the question.</span></h1><p class="muted">A complete revision desk built from your two-part PDF. Follow the source order, mix the bank, or focus on one section.</p></div><div class="metrics"><div class="metric"><strong>${BANK.length}</strong><span>QUESTIONS</span></div><div class="metric"><strong>${sections.length}</strong><span>SECTIONS</span></div><div class="metric"><strong>${BANK.filter(q=>q.type==='Statements').length}</strong><span>STATEMENT SETS</span></div></div></section>
 <div class="grid"><section class="card accent"><div class="eyebrow">01 / Full practice</div><h2 style="margin-top:10px">The complete question bank</h2><p class="muted">Immediate feedback and source-based explanations after every answer.</p><div class="mode"><label><input type="radio" name="order" value="pdf" checked>PDF order</label><label><input type="radio" name="order" value="shuffle">Shuffled</label></div><button class="primary" id="start-full">Start full practice · ${BANK.length}</button></section><section class="card goldtop"><div class="eyebrow gold">02 / Priority revision</div><h2 style="margin-top:10px">Schemes & policies only</h2><p class="muted">Funding, eligibility, agencies, targets and implementation. Includes source-supported policy frameworks.</p><p class="fine">${BANK.filter(q=>q.scheme).length} questions · PDF order</p><button id="start-schemes">Start schemes & policies</button></section></div>
 <div class="row space sectionheading"><h2 style="margin:0">Section-wise revision</h2><span class="fine">Each set starts within your selection</span></div><div class="grid">${sections.map((s,i)=>{let a=selected(s);return `<section class="card sectioncard"><div class="row space"><h3>${esc(s)}</h3><span class="count">${a.length} questions</span></div><button data-section="${i}" class="section-start">Practice this section</button><div class="topics">${unique(a.map(q=>q.topic)).map(t=>`<button class="topicbtn" data-section="${i}" data-topic="${esc(t)}">${esc(t)} <span class="count">${selected(s,t).length}</span></button>`).join('')}</div></section>`}).join('')}</div>
 <section class="card" style="margin-top:20px"><h3>Choose a specific scheme or topic</h3><p class="fine">For a short, targeted check. Broader revision topics are grouped in the section cards above.</p><div class="filters"><label>Section<select id="focus-section">${sections.map((s,i)=>`<option value="${i}">${esc(s)}</option>`).join('')}</select></label><label>Scheme / specific topic<select id="focus-subtopic"></select></label><button id="start-focus">Start selected topic</button></div></section>
 <div class="sourceNote">Source: your uploaded merged PDF only. This quiz tests the capsule as written; it does not independently verify its current-affairs claims. Conflicting GatiShakti data-layer totals and unclear cost subtotals are not tested. Page references use the merged PDF’s physical pages and appear after answering.<br>Difficulty: ${BANK.filter(q=>q.difficulty==='Easy').length} easy · ${BANK.filter(q=>q.difficulty==='Moderate').length} moderate · ${BANK.filter(q=>q.difficulty==='Hard').length} hard. Statement answers and option positions vary.</div>`;
 document.getElementById('start-full').onclick=()=>start(BANK,'Full practice',document.querySelector('input[name=order]:checked').value==='shuffle');
 document.getElementById('start-schemes').onclick=()=>start(selected('','','',true),'Schemes & policies');
 app.querySelectorAll('.section-start').forEach(b=>b.onclick=()=>start(selected(sections[+b.dataset.section]),sections[+b.dataset.section]));
 app.querySelectorAll('.topicbtn').forEach(b=>b.onclick=()=>start(selected(sections[+b.dataset.section],b.dataset.topic),b.dataset.topic));
 document.getElementById('focus-section').onchange=fillFocus;fillFocus();
 document.getElementById('start-focus').onclick=()=>{let s=sections[+document.getElementById('focus-section').value],t=document.getElementById('focus-subtopic').value;start(selected(s,'',t),t);};
}
function fillFocus(){let s=sections[+document.getElementById('focus-section').value];document.getElementById('focus-subtopic').innerHTML=unique(selected(s).map(q=>q.subtopic)).map(t=>`<option value="${esc(t)}">${esc(t)} (${selected(s,'',t).length})</option>`).join('');}
function start(items,label,mix=false){if(!items.length){app.innerHTML='<section class="card empty"><h2>No questions in this selection</h2><button id="empty-home">Back to menu</button></section>';document.getElementById('empty-home').onclick=home;return;}
 state={ids:(mix?shuffle(items):items).map(q=>q.id),answers:{},index:0,label,shuffled:mix};renderQuestion();window.scrollTo(0,0);}
function renderQuestion(){let q=BANK.find(x=>x.id===state.ids[state.index]),a=state.answers[q.id],locked=a!==undefined,st=stats();
 app.innerHTML=`<section class="quizhead"><div class="row space"><span class="eyebrow">${state.shuffled?'Shuffled':'PDF order'} practice</span><button class="quiet" id="menu">Back to menu</button></div><h2 class="quiztitle">${esc(state.label)}</h2><div class="row space"><b id="position">Question ${state.index+1} of ${state.ids.length}</b><span class="fine" id="completed">${st.done} answered or skipped</span></div><div class="progress" role="progressbar" aria-label="Completed questions" aria-valuenow="${st.done}" aria-valuemin="0" aria-valuemax="${state.ids.length}"><div class="fill" style="width:${100*st.done/state.ids.length}%"></div></div><div class="stats"><div class="stat"><b id="score">${st.correct}</b>Score</div><div class="stat"><b id="correct">${st.correct}</b>Correct</div><div class="stat"><b id="incorrect">${st.incorrect}</b>Incorrect</div><div class="stat"><b id="skipped">${st.skipped}</b>Skipped</div></div></section>
 <section class="card qcard" data-question-id="${q.id}"><div class="row space"><span class="fine">${esc(q.topic)} / ${esc(q.subtopic)}</span><div class="row"><span class="pill ${q.difficulty}">${q.difficulty}</span><span class="pill">${esc(q.type)}</span></div></div><div class="question" id="question">${esc(q.question)}</div><div class="options">${q.options.map((o,i)=>`<button class="option ${locked&&i===q.answer?'correct':''} ${locked&&a===i&&i!==q.answer?'wrong':''}" data-option="${i}" ${locked?'disabled':''}><span class="letter">${letter(i)}</span><span>${esc(o)}${locked&&i===q.answer?' <strong>✓ Correct answer</strong>':''}${locked&&a===i&&i!==q.answer?' <strong>✕ Your answer</strong>':''}</span></button>`).join('')}</div>
 ${locked?`<section class="feedback ${a===null?'skip':a===q.answer?'':'wrong'}" aria-live="polite"><h3>${a===null?'Skipped · no marks':a===q.answer?'Correct · +1':'Incorrect · 0 marks'}</h3><p><b>Correct answer: ${letter(q.answer)}. ${esc(q.options[q.answer])}</b></p><div class="explanation">${esc(q.explanation)}</div><p class="fine" style="margin:12px 0 0">${esc(q.source)}</p></section>`:''}
 <div class="row space nav"><button id="previous" ${state.index===0?'disabled':''}>← Previous</button><div class="row"><button id="skip" ${locked?'disabled':''}>Skip & reveal</button><button class="primary" id="next" ${!locked?'disabled':''}>${state.index===state.ids.length-1?'View results':'Next question →'}</button></div></div></section>`;
 document.getElementById('menu').onclick=()=>{home();window.scrollTo(0,0);};app.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.option));
 document.getElementById('skip').onclick=()=>answer(null);document.getElementById('previous').onclick=()=>{if(state.index>0){state.index--;renderQuestion();}};
 document.getElementById('next').onclick=()=>{if(state.answers[q.id]===undefined)return;if(state.index+1===state.ids.length)results();else{state.index++;renderQuestion();window.scrollTo(0,0);}};
}
function answer(a){let id=state.ids[state.index];if(state.answers[id]!==undefined)return;let q=BANK.find(x=>x.id===id);if(a!==null&&(!Number.isInteger(a)||a<0||a>4))return;state.answers[id]=a;renderQuestion();}
function performance(items,key){let names=key==='difficulty'?['Easy','Moderate','Hard']:unique(items.map(q=>q[key]));return `<div class="tablewrap"><table><thead><tr><th>${key==='difficulty'?'Difficulty':key==='section'?'Section':'Topic'}</th><th>Correct / attempted</th><th>Skipped</th><th>Accuracy</th></tr></thead><tbody>${names.map(n=>{let s=stats(items.filter(q=>q[key]===n));return `<tr><td>${esc(n)} <small>(${s.total})</small></td><td>${s.correct} / ${s.attempted}</td><td>${s.skipped}</td><td>${s.attempted?(100*s.correct/s.attempted).toFixed(1)+'%':'—'}</td></tr>`;}).join('')}</tbody></table></div>`;}
function results(){let items=state.ids.map(id=>BANK.find(q=>q.id===id)),s=stats(),review=items.filter(q=>state.answers[q.id]!==q.answer);if(s.done!==s.total){state.index=state.ids.findIndex(id=>state.answers[id]===undefined);renderQuestion();return;}
 app.innerHTML=`<div class="eyebrow">Practice complete</div><h1>Your revision, in focus.</h1><p class="muted">${esc(state.label)} · ${s.total} questions</p><section class="card resulttop"><div><div class="resultscore" id="result-score">${s.correct}<small> / ${s.total}</small></div><p id="result-percent">${(100*s.correct/s.total).toFixed(1)}% overall score</p></div><div><div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><b id="result-correct">${s.correct}</b>Correct</div><div class="stat"><b id="result-incorrect">${s.incorrect}</b>Incorrect</div><div class="stat"><b id="result-skipped">${s.skipped}</b>Skipped</div></div><div class="row"><button class="primary" id="retry">Retry same set</button><button id="result-menu">Back to menu</button></div></div></section><p class="fine">Accuracy below = correct ÷ attempted (skips excluded). Overall score = correct ÷ all questions.</p><div class="grid"><section class="card" id="difficulty-analysis"><h3>Difficulty performance</h3>${performance(items,'difficulty')}</section><section class="card" id="section-analysis"><h3>Section performance</h3>${performance(items,'section')}</section></div><section class="card" id="topic-analysis" style="margin-top:16px"><h3>Topic performance</h3>${performance(items,'topic')}</section><div class="row space sectionheading"><h2>Review & revise</h2><span class="count">${review.length} incorrect or skipped</span></div><div id="review">${review.length?review.map(q=>{let a=state.answers[q.id];return `<article class="review" data-review-id="${q.id}"><div class="row space"><span class="fine">${esc(q.topic)} / ${esc(q.subtopic)}</span><span class="pill ${q.difficulty}">${q.difficulty}</span></div><div class="question">${esc(q.question)}</div><p style="color:${a===null?'var(--gold)':'var(--red)'}">Your answer: ${a===null?'Skipped':letter(a)+'. '+esc(q.options[a])}</p><p style="color:var(--green)">Correct answer: ${letter(q.answer)}. ${esc(q.options[q.answer])}</p><p class="explanation">${esc(q.explanation)}</p><div class="fine">${esc(q.source)}</div></article>`;}).join(''):'<section class="card">All answers correct. No missed questions to review.</section>'}</div>`;
 document.getElementById('retry').onclick=()=>{let same=state.ids.map(id=>BANK.find(q=>q.id===id));start(same,state.label,state.shuffled);};document.getElementById('result-menu').onclick=()=>{home();window.scrollTo(0,0);};window.scrollTo(0,0);
}
home();
window.QUIZ={bank:BANK,sections,selected,stats,getState:()=>JSON.parse(JSON.stringify(state))};
</script></body></html>
