ine-height:1.2;color:var(--gold)}.metric span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:24px}.accent{border-top:3px solid var(--teal)}.card.goldtop{border-top:3px solid var(--gold)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.mode{display:flex;gap:8px;margin:17px 0}.mode label{background:#0c1727;border:1px solid var(--line);padding:8px 11px;border-radius:8px;font-size:13px;cursor:pointer}.mode input{accent-color:var(--teal);margin-right:7px}.sectionheading{margin:36px 0 16px}.sectioncard{padding:20px}.count{color:var(--teal);font-size:12px;font-weight:700;white-space:nowrap}.sectioncard h3{font-size:16px;max-width:360px}.topics{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.topicbtn{font-size:12px;padding:7px 10px;border-radius:7px;text-align:left}.fine{font-size:12px;color:var(--muted)}select{background:#0c1727;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;max-width:100%;width:100%}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-top:20px}.filters label{font-size:12px;color:var(--muted);display:block}.filters select{margin-top:5px}.sourceNote{margin-top:25px;font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:15px}.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:#223349;color:#c0d4e9;font-size:11px;font-weight:700}.pill.Hard{color:#f4cc9c;background:#513d2b}.pill.Moderate{color:#bfcaff;background:#303655}.pill.Easy{color:#92dfc3;background:#203e39}.quizhead{margin-bottom:20px}.quiztitle{font-size:18px;line-height:1.4;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat{background:#101b2b;border:1px solid var(--line);border-radius:10px;padding:11px 15px;color:var(--muted);font-size:12px}.stat b{font-size:19px;margin-right:5px;color:var(--text)}.progress{width:100%;height:7px;background:#24334a;border-radius:10px;overflow:hidden;margin:10px 0}.fill{height:100%;background:var(--teal);transition:width .15s}.qcard{padding:28px}.question{white-space:pre-line;font-size:19px;line-height:1.75;font-weight:600;margin:18px 0 22px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:13px;text-align:left;width:100%;padding:14px 16px;background:#101b2b;font-size:15px;line-height:1.5}.letter{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:7px;background:#26354b;font-size:13px;font-weight:750}.option:disabled{opacity:1}.option.correct{background:#123c30;border:1px solid #59bd8d;color:#ccf9df}.option.wrong{background:#45232f;border:1px solid #e17e91;color:#ffccd6}.option.correct .letter{background:#236343}.option.wrong .letter{background:#753c4d}.feedback{border:1px solid var(--line);border-radius:12px;background:#0b1727;padding:19px;margin-top:22px}.feedback h3{color:var(--teal);margin-bottom:8px}.feedback.wrong h3{color:var(--red)}.feedback.skip h3{color:var(--gold)}.explanation{white-space:pre-line;font-size:14px}.nav{margin-top:23px}.review{border:1px solid var(--line);border-radius:12px;padding:20px;margin:14px 0;background:#101b2b}.review .question{font-size:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:500}td:last-child,th:last-child{text-align:right}.resultscore{font-size:50px;color:var(--teal);font-weight:800;letter-spacing:-.06em;line-height:1.2}.resultscore small{font-size:22px}.resulttop{display:grid;grid-template-columns:1fr 2fr;gap:25px;align-items:center;margin:24px 0}.empty{padding:35px;text-align:center}.footer{margin-top:30px;text-align:center;color:var(--muted);font-size:11px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

</style></head><body><div class="wrap"><header class="brand"><b>NABARD<span style="color:var(--teal)"> / </span>STUDY DESK</b><span>GA • OCTOBER 01–15, 2026</span></header><main id="app"></main><footer class="footer">Offline practice • +1 correct · 0 incorrect · 0 skipped • No progress is stored after closing this file</footer></div><script id="question-data" type="application/json">[{"id":"Q001","section":"01 · Agriculture \u0026 core schemes","topic":"MSP and farm support","subtopic":"MSP approval","pages":[2],"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which combination correctly identifies the recommending and approving bodies for rabi MSP?","options":["FCI → CACP","NAFED → FCI","CACP → CCEA","CACP → NITI Aayog","CCEA → CACP"],"answer":2,"explanation":"CACP recommends MSP; the CCEA chaired by the Prime Minister approves it.","draftId":1,"source":"Merged PDF p. 2"},{"id":"Q002","section":"01 · Agriculture \u0026 core schemes","topic":"MSP and farm support","subtopic":"MSP framework","pages":[2,3],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about MSP framework. How many are correct?\n1. The minimum MSP formula is 1.5 times A2+FL.\n2. The formula dates to Union Budget 2018–19.\n3. Wheat has the lowest margin over cost at 50%.\n4. MSP is a statutory price binding on private buyers.","options":["Only two","None","Only three","Only one","All four"],"answer":0,"explanation":"1: Correct. The formula uses all-India weighted average A2+FL. 2: Correct. That Budget is explicitly identified. 3: Incorrect. Wheat has the highest margin, 106%; safflower has 50%. 4: Incorrect. The source describes MSP as non-statutory.","statements":[{"text":"The minimum MSP formula is 1.5 times A2+FL.","correct":true,"evidence":"The formula uses all-India weighted average A2+FL."},{"text":"The formula dates to Union Budget 2018–19.","correct":true,"evidence":"That Budget is explicitly identified."},{"text":"Wheat has the lowest margin over cost at 50%.","correct":false,"evidence":"Wheat has the highest margin, 106%; safflower has 50%."},{"text":"MSP is a statutory price binding on private buyers.","correct":false,"evidence":"The source describes MSP as non-statutory."}],"draftId":8,"source":"Merged PDF p. 2, 3"},{"id":"Q003","section":"01 · Agriculture \u0026 core schemes","topic":"MSP and farm support","subtopic":"Wheat MSP","pages":[3],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"For RMS 2027–28, which wheat MSP–increase pair is given?","options":["₹2,610; ₹25","₹2,610; ₹136","₹2,585; ₹25","₹2,675; ₹90","₹2,585; ₹136"],"answer":0,"explanation":"Wheat MSP is ₹2,610 per quintal, up ₹25 from ₹2,585.","draftId":2,"source":"Merged PDF p. 3"},{"id":"Q004","section":"01 · Agriculture \u0026 core schemes","topic":"MSP and farm support","subtopic":"Safflower MSP","pages":[3],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which crop–MSP pair corresponds to the largest absolute rabi MSP increase?","options":["Safflower — ₹7,215","Rapeseed and mustard — ₹7,215","Gram — ₹6,540","Safflower — ₹6,540","Lentil — ₹7,215"],"answer":0,"explanation":"Safflower rises by ₹675 to ₹7,215 per quintal.","draftId":3,"source":"Merged PDF p. 3"},{"id":"Q005","section":"01 · Agriculture \u0026 core schemes","topic":"MSP and farm support","subtopic":"Cost concepts","pages":[3],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about Cost concepts. How many are correct?\n1. A2 includes imputed unpaid family labour.\n2. A2+FL includes imputed unpaid family labour.\n3. C2 excludes rent on owned land.\n4. The Swaminathan Commission recommended A2 plus 50%.","options":["All four","Only one","None","Only two","Only three"],"answer":1,"explanation":"1: Incorrect. A2 is paid cost only; A2+FL adds unpaid family labour. 2: Correct. FL adds unpaid family labour to A2. 3: Incorrect. C2 adds rent on owned land, interest on owned capital and depreciation. 4: Incorrect. The source gives C2 + 50%.","statements":[{"text":"A2 includes imputed unpaid family labour.","correct":false,"evidence":"A2 is paid cost only; A2+FL adds unpaid family labour."},{"text":"A2+FL includes imputed unpaid family labour.","correct":true,"evidence":"FL adds unpaid family labour to A2."},{"text":"C2 excludes rent on owned land.","correct":false,"evidence":"C2 adds rent on owned land, interest on owned capital and depreciation."},{"text":"The Swaminathan Commission recommended A2 plus 50%.","correct":false,"evidence":"The source gives C2 + 50%."}],"draftId":4,"source":"Merged PDF p. 3"},{"id":"Q006","section":"01 · Agriculture \u0026 core schemes","topic":"MSP and farm support","subtopic":"rabi MSP and crop coverage","pages":[3],"difficulty":"Hard","type":"NOT correct","scheme":true,"question":"Which statement about rabi MSP and crop coverage is NOT correct?","options":["There are six rabi crops in the mandated MSP list.","Sugarcane receives MSP under the 22-crop framework.","CACP was established as the Agricultural Prices Commission in 1965.","Sugarcane FRP is notified under the Sugarcane (Control) Order, 1966.","CACP was renamed in 1985."],"answer":1,"explanation":"Sugarcane has FRP, not MSP. The other statements match the capsule.","draftId":5,"source":"Merged PDF p. 3"},{"id":"Q007","section":"01 · Agriculture \u0026 core schemes","topic":"MSP and farm support","subtopic":"Procurement","pages":[3],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which procurement-agency pairing is correct?","options":["JCI — cotton","NAFED — pulses and oilseeds","CCI — coarse grains","FCI — raw jute","NAFED — sugarcane FRP"],"answer":1,"explanation":"The procurement list assigns pulses and oilseeds to NAFED, cotton to CCI and jute to JCI.","draftId":6,"source":"Merged PDF p. 3"},{"id":"Q008","section":"01 · Agriculture \u0026 core schemes","topic":"MSP and farm support","subtopic":"Rabi increases","pages":[3],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which sequence gives the increases for barley, gram, lentil, and rapeseed–mustard respectively?","options":["₹136, ₹83, ₹390, ₹413","₹83, ₹136, ₹413, ₹390","₹136, ₹390, ₹83, ₹413","₹413, ₹83, ₹390, ₹136","₹136, ₹83, ₹413, ₹390"],"answer":0,"explanation":"The source lists barley +₹136, gram +₹83, lentil +₹390 and rapeseed–mustard +₹413.","draftId":7,"source":"Merged PDF p. 3"},{"id":"Q009","section":"01 · Agriculture \u0026 core schemes","topic":"MSP and farm support","subtopic":"PM-AASHA and procurement reach","pages":[3],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about PM-AASHA and procurement reach. How many are correct?\n1. PM-AASHA was introduced in 2018.\n2. PSS is one of its support mechanisms.\n3. PDPS is also one of its mechanisms.\n4. The Shanta Kumar Committee estimated government MSP sales reach at about 16% of farmers.","options":["None","Only two","Only three","All four","Only one"],"answer":2,"explanation":"1: Correct. The source dates it to 2018. 2: Correct. Price Support Scheme is listed. 3: Correct. Price Deficiency Payment Scheme is listed. 4: Incorrect. The cited estimate is about 6%.","statements":[{"text":"PM-AASHA was introduced in 2018.","correct":true,"evidence":"The source dates it to 2018."},{"text":"PSS is one of its support mechanisms.","correct":true,"evidence":"Price Support Scheme is listed."},{"text":"PDPS is also one of its mechanisms.","correct":true,"evidence":"Price Deficiency Payment Scheme is listed."},{"text":"The Shanta Kumar Committee estimated government MSP sales reach at about 16% of farmers.","correct":false,"evidence":"The cited estimate is about 6%."}],"draftId":57,"source":"Merged PDF p. 3"},{"id":"Q010","section":"01 · Agriculture \u0026 core schemes","topic":"Energy and export schemes","subtopic":"GEC-III finance","pages":[4],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which outlay–central assistance pair belongs to GEC-III?","options":["₹1,86,405 crore — ₹3,970 crore","₹1,86,405 crore — ₹50,000 crore","₹1,86,405 crore — ₹54,082 crore","₹1,39,579 crore — ₹54,082 crore","₹1,36,378 crore — ₹54,082 crore"],"answer":2,"explanation":"GEC-III has total outlay ₹1,86,405 crore and CFA ₹54,082 crore.","draftId":9,"source":"Merged PDF p. 4"},{"id":"Q011","section":"01 · Agriculture \u0026 core schemes","topic":"Energy and export schemes","subtopic":"GEC-III targets","pages":[4],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which renewable evacuation–storage–completion combination is correct?","options":["135 GW; 50 GWh; FY 2030–31","135 GWh; 50 GW; FY 2032–33","135 GW; 40 GWh; FY 2031–32","135 GW; 50 GWh; FY 2032–33","150 GW; 50 GWh; FY 2032–33"],"answer":3,"explanation":"The scheme targets up to 135 GW evacuation and 50 GWh storage by FY 2032–33.","draftId":10,"source":"Merged PDF p. 4"},{"id":"Q012","section":"01 · Agriculture \u0026 core schemes","topic":"Energy and export schemes","subtopic":"GEC-III","pages":[4,5],"difficulty":"Hard","type":"NOT correct","scheme":true,"question":"Which statement about GEC-III is NOT correct?","options":["Its nodal ministry is the Ministry of Power.","It expands intra-State transmission.","The linked non-fossil target is 900 GW by 2035.","Battery storage supports supply after sunset.","Curtailment occurs when grids cannot take renewable power."],"answer":0,"explanation":"The nodal ministry specified for GEC-III is MNRE, not the Ministry of Power.","draftId":12,"source":"Merged PDF p. 4, 5"},{"id":"Q013","section":"01 · Agriculture \u0026 core schemes","topic":"Energy and export schemes","subtopic":"GEC phases","pages":[5],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about GEC phases. How many are correct?\n1. GEC-II was approved on 6 January 2022.\n2. GEC-II provides 50% CFA.\n3. GEC-II covers seven States.\n4. GEC-II targets 27,500 circuit km of lines.","options":["None","Only three","Only two","Only one","All four"],"answer":2,"explanation":"1: Correct. The phase table gives this approval date. 2: Incorrect. Its CFA is 33%. 3: Correct. The table lists seven States. 4: Incorrect. It targets 10,750 circuit km and 27,500 MVA substations.","statements":[{"text":"GEC-II was approved on 6 January 2022.","correct":true,"evidence":"The phase table gives this approval date."},{"text":"GEC-II provides 50% CFA.","correct":false,"evidence":"Its CFA is 33%."},{"text":"GEC-II covers seven States.","correct":true,"evidence":"The table lists seven States."},{"text":"GEC-II targets 27,500 circuit km of lines.","correct":false,"evidence":"It targets 10,750 circuit km and 27,500 MVA substations."}],"draftId":11,"source":"Merged PDF p. 5"},{"id":"Q014","section":"01 · Agriculture \u0026 core schemes","topic":"Energy and export schemes","subtopic":"RoDTEP scope","pages":[5,6,7],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about RoDTEP scope. How many are correct?\n1. The extension runs up to 31 December 2026.\n2. Rates and value caps were changed for the extended period.\n3. Taxes already credited through GST are refunded again under RoDTEP.\n4. Duty Drawback and RoDTEP refund exactly the same taxes.","options":["Only two","None","Only one","Only three","All four"],"answer":2,"explanation":"1: Correct. The extension date is given explicitly. 2: Incorrect. The rates and value caps remain unchanged. 3: Incorrect. Already exempted, remitted or credited duties are excluded. 4: Incorrect. Drawback covers customs duty on imported inputs; RoDTEP covers other embedded taxes.","statements":[{"text":"The extension runs up to 31 December 2026.","correct":true,"evidence":"The extension date is given explicitly."},{"text":"Rates and value caps were changed for the extended period.","correct":false,"evidence":"The rates and value caps remain unchanged."},{"text":"Taxes already credited through GST are refunded again under RoDTEP.","correct":false,"evidence":"Already exempted, remitted or credited duties are excluded."},{"text":"Duty Drawback and RoDTEP refund exactly the same taxes.","correct":false,"evidence":"Drawback covers customs duty on imported inputs; RoDTEP covers other embedded taxes."}],"draftId":15,"source":"Merged PDF p. 5, 6, 7"},{"id":"Q015","section":"01 · Agriculture \u0026 core schemes","topic":"Energy and export schemes","subtopic":"RoDTEP mechanism","pages":[6],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"RoDTEP refunds are provided through which mechanism?","options":["Direct interest subsidies through EXIM Bank","Transferable e-scrips in a CBIC electronic ledger","Non-transferable cash vouchers in a DGFT ledger","Income-tax rebates through an exporter bank account","GST input credits maintained by RBI"],"answer":1,"explanation":"The source specifies transferable duty credits/e-scrips maintained by CBIC, usable for customs duty.","draftId":13,"source":"Merged PDF p. 6"},{"id":"Q016","section":"01 · Agriculture \u0026 core schemes","topic":"Energy and export schemes","subtopic":"RoDTEP launch","pages":[6],"difficulty":"Easy","type":"Direct","scheme":true,"question":"RoDTEP replaced which scheme, from which date?","options":["MEIS; 1 April 2021","RoSCTL; 1 January 2021","Duty Drawback; 1 January 2020","MEIS; 1 January 2022","MEIS; 1 January 2021"],"answer":4,"explanation":"RoDTEP began on 1 January 2021, replacing MEIS.","draftId":14,"source":"Merged PDF p. 6"},{"id":"Q017","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"BharatNet","subtopic":"ABP institutions","pages":[7],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which institution implements Maharashtra ABP, and which is the national Project Management Agency?","options":["BSNL; MDIL","BBNL; DBN","DBN; MahaIT","MahaIT; BBNL","MDIL; BSNL"],"answer":4,"explanation":"MDIL implements the programme in Maharashtra; BSNL is the Project Management Agency.","draftId":16,"source":"Merged PDF p. 7"},{"id":"Q018","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"BharatNet","subtopic":"ABP funding","pages":[7],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which pair correctly gives the national ABP outlay and Maharashtra approval?","options":["₹42,068 crore; ₹10,520 crore","₹1,39,579 crore; ₹10,520 crore","₹1,40,881 crore; ₹10,520 crore","₹1,39,579 crore; ₹12,031 crore","₹1,39,579 crore; ₹10,142 crore"],"answer":1,"explanation":"ABP outlay is ₹1,39,579 crore; Maharashtra approval is ₹10,520 crore.","draftId":17,"source":"Merged PDF p. 7"},{"id":"Q019","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"BharatNet","subtopic":"ABP design","pages":[7,8],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about ABP design. How many are correct?\n1. ABP received Union Cabinet approval on 4 August 2022.\n2. ABP targets about 2.18 lakh Gram Panchayats.\n3. It targets 1.5 crore rural fibre home connections over five years.\n4. Ring-based IP-MPLS improves resilience to a fibre cut.","options":["Only one","All four","Only three","None","Only two"],"answer":4,"explanation":"1: Incorrect. The approval date is 4 August 2023. 2: Incorrect. The target is about 2.64 lakh; 2.18 lakh is the March 2025 service-ready count. 3: Correct. These connections use the BharatNet Udyami Model. 4: Correct. The objective is continued service despite one cut.","statements":[{"text":"ABP received Union Cabinet approval on 4 August 2022.","correct":false,"evidence":"The approval date is 4 August 2023."},{"text":"ABP targets about 2.18 lakh Gram Panchayats.","correct":false,"evidence":"The target is about 2.64 lakh; 2.18 lakh is the March 2025 service-ready count."},{"text":"It targets 1.5 crore rural fibre home connections over five years.","correct":true,"evidence":"These connections use the BharatNet Udyami Model."},{"text":"Ring-based IP-MPLS improves resilience to a fibre cut.","correct":true,"evidence":"The objective is continued service despite one cut."}],"draftId":18,"source":"Merged PDF p. 7, 8"},{"id":"Q020","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"BharatNet","subtopic":"BharatNet background","pages":[8],"difficulty":"Hard","type":"NOT correct","scheme":true,"question":"Which statement about BharatNet background is NOT correct?","options":["Phase I was completed in December 2017.","NOFN began in 2012.","BBNL was set up in 2012.","About 2.18 lakh GPs were service-ready in March 2025.","Phases I and II had an approved cost of ₹42,068 crore."],"answer":1,"explanation":"NOFN began in 2011; 2012 is the year BBNL was set up.","draftId":19,"source":"Merged PDF p. 8"},{"id":"Q021","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Swachh Bharat and PRAGATI-50","subtopic":"Swachhata campaign","pages":[8],"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which theme belongs to Swachhata Hi Seva 2026?","options":["Connecting Habitats, Thriving Wildlife","Swachhata Mein Sahbhag; Swachh Bharat, Viksit Bharat","Resilience Starts at Home","Adequate Housing for All","Risk Reduction in Action"],"answer":1,"explanation":"The campaign, 17 September–2 October 2026, uses “Swachhata Mein Sahbhag; Swachh Bharat, Viksit Bharat”.","draftId":24,"source":"Merged PDF p. 8"},{"id":"Q022","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"BharatNet","subtopic":"BharatNet service snapshot","pages":[8],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about BharatNet service snapshot. How many are correct?\n1. The March 2025 BharatNet FTTH count was about 2.18 lakh.\n2. The March 2025 Wi-Fi hotspot count was about 1.50 lakh.\n3. Non-GP villages receive connectivity only through mandatory universal household connections.\n4. The Udyami Model excludes local entrepreneurs.","options":["Only two","Only three","Only one","None","All four"],"answer":3,"explanation":"1: Incorrect. The FTTH count was 12.2 lakh; 2.18 lakh refers to service-ready GPs. 2: Incorrect. The source gives 1.05 lakh hotspots. 3: Incorrect. Non-GP village connectivity is on demand. 4: Incorrect. Local entrepreneurs sell and maintain connections.","statements":[{"text":"The March 2025 BharatNet FTTH count was about 2.18 lakh.","correct":false,"evidence":"The FTTH count was 12.2 lakh; 2.18 lakh refers to service-ready GPs."},{"text":"The March 2025 Wi-Fi hotspot count was about 1.50 lakh.","correct":false,"evidence":"The source gives 1.05 lakh hotspots."},{"text":"Non-GP villages receive connectivity only through mandatory universal household connections.","correct":false,"evidence":"Non-GP village connectivity is on demand."},{"text":"The Udyami Model excludes local entrepreneurs.","correct":false,"evidence":"Local entrepreneurs sell and maintain connections."}],"draftId":58,"source":"Merged PDF p. 8"},{"id":"Q023","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Swachh Bharat and PRAGATI-50","subtopic":"SBM funding","pages":[9],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which pair correctly matches SBM-G Phase II and SBM-U 2.0 outlays?","options":["₹1,41,600 crore; ₹1,40,881 crore","₹1,40,881 crore; ₹36,465 crore","₹70,051 crore; ₹62,009 crore","₹62,009 crore; ₹1,41,600 crore","₹1,40,881 crore; ₹1,41,600 crore"],"answer":4,"explanation":"SBM-G Phase II is ₹1,40,881 crore; SBM-U 2.0 is ₹1,41,600 crore.","draftId":20,"source":"Merged PDF p. 9"},{"id":"Q024","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Swachh Bharat and PRAGATI-50","subtopic":"Urban cost sharing","pages":[9],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"For SBM-U 2.0, what is the Centre:State ratio for million-plus cities?","options":["60:40","50:50","33:67","25:75","80:20"],"answer":3,"explanation":"Million-plus cities use 25:75; cities of 1–10 lakh use 33:67 and below 1 lakh use 50:50.","draftId":21,"source":"Merged PDF p. 9"},{"id":"Q025","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Swachh Bharat and PRAGATI-50","subtopic":"Rural toilet support","pages":[9],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about Rural toilet support. How many are correct?\n1. The rural IHHL incentive is ₹12,000.\n2. The usual Centre:State ratio is 90:10.\n3. North-Eastern, hilly and Himalayan States use 60:40.\n4. SBM-G is administered by MoHUA.","options":["All four","Only three","None","Only one","Only two"],"answer":3,"explanation":"1: Correct. The incentive is ₹12,000 per household toilet. 2: Incorrect. The usual ratio is 60:40. 3: Incorrect. They use 90:10. 4: Incorrect. SBM-G is under Jal Shakti; MoHUA administers SBM-U.","statements":[{"text":"The rural IHHL incentive is ₹12,000.","correct":true,"evidence":"The incentive is ₹12,000 per household toilet."},{"text":"The usual Centre:State ratio is 90:10.","correct":false,"evidence":"The usual ratio is 60:40."},{"text":"North-Eastern, hilly and Himalayan States use 60:40.","correct":false,"evidence":"They use 90:10."},{"text":"SBM-G is administered by MoHUA.","correct":false,"evidence":"SBM-G is under Jal Shakti; MoHUA administers SBM-U."}],"draftId":22,"source":"Merged PDF p. 9"},{"id":"Q026","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Swachh Bharat and PRAGATI-50","subtopic":"sanitation classifications","pages":[10],"difficulty":"Hard","type":"NOT correct","scheme":true,"question":"Which statement about sanitation classifications is NOT correct?","options":["Water+ involves treatment and reuse of all used water.","ODF+ requires functional, well-maintained community and public toilets.","ODF Plus Rising villages manage both solid and liquid waste.","SBM-U 2.0 seeks at least 3-star Garbage Free cities.","ODF++ means only that public toilets are functional."],"answer":4,"explanation":"Functional public toilets define ODF+. ODF++ additionally requires safe faecal sludge/septage management and no untreated sewage entering water bodies.","draftId":23,"source":"Merged PDF p. 10"},{"id":"Q027","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Swachh Bharat and PRAGATI-50","subtopic":"GOBARdhan","pages":[10],"difficulty":"Easy","type":"Direct","scheme":true,"question":"GOBARdhan supports community biogas and compressed biogas plants under which programme component?","options":["PMAY-G 2.0","PM GatiShakti","SBM-G Phase II","National Coastal Mission 2.0","SBM-U 1.0"],"answer":2,"explanation":"The capsule places GOBARdhan, launched in 2018, within SBM-G Phase II.","draftId":25,"source":"Merged PDF p. 10"},{"id":"Q028","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Swachh Bharat and PRAGATI-50","subtopic":"PRAGATI-50","pages":[11],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about PRAGATI-50. How many are correct?\n1. PRAGATI-50 covers 50 cities in 25 States.\n2. It has a separately reported outlay outside SBM-U 2.0.\n3. The Durgapur test bed involves CSIR-CMERI.\n4. The sanitation start-up cohort is linked to IIT Gandhinagar.","options":["None","Only one","All four","Only three","Only two"],"answer":1,"explanation":"1: Incorrect. The source specifies 24 States. 2: Incorrect. No separate outlay was reported; it sits under SBM-U 2.0. 3: Correct. MoHUA and CSIR-CMERI are partners. 4: Incorrect. The stated partner is IIT Kanpur.","statements":[{"text":"PRAGATI-50 covers 50 cities in 25 States.","correct":false,"evidence":"The source specifies 24 States."},{"text":"It has a separately reported outlay outside SBM-U 2.0.","correct":false,"evidence":"No separate outlay was reported; it sits under SBM-U 2.0."},{"text":"The Durgapur test bed involves CSIR-CMERI.","correct":true,"evidence":"MoHUA and CSIR-CMERI are partners."},{"text":"The sanitation start-up cohort is linked to IIT Gandhinagar.","correct":false,"evidence":"The stated partner is IIT Kanpur."}],"draftId":26,"source":"Merged PDF p. 11"},{"id":"Q029","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Swachh Bharat and PRAGATI-50","subtopic":"PRAGATI facilities","pages":[11],"difficulty":"Easy","type":"Direct","scheme":true,"question":"Where was the RRR Centre for a Union Ministry office inaugurated?","options":["Sanchar Bhawan, New Delhi","Yashobhoomi, New Delhi","Sankalp Bhawan, New Delhi","NASC, Pusa, New Delhi","Bharat Mandapam, New Delhi"],"answer":2,"explanation":"The RRR (Reduce, Reuse, Recycle) Centre is at Sankalp Bhawan.","draftId":27,"source":"Merged PDF p. 11"},{"id":"Q030","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Coasts and rural housing","subtopic":"NCM 2.0","pages":[12],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which classification–outlay–coverage combination describes NCM 2.0?","options":["Centrally Sponsored; ₹767 crore; 9 States and 4 UTs","Centrally Sponsored; ₹676 crore; 8 States and 4 UTs","Central Sector; ₹767 crore; 8 States and 5 UTs","Central Sector; ₹676 crore; 9 States and 4 UTs","Central Sector; ₹767 crore; 9 States and 4 UTs"],"answer":4,"explanation":"NCM 2.0 is fully Union-funded, with ₹767 crore for nine coastal States and four UTs.","draftId":28,"source":"Merged PDF p. 12"},{"id":"Q031","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Coasts and rural housing","subtopic":"Coastal management","pages":[12,13],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about Coastal management. How many are correct?\n1. NCM 2.0 runs during 2025–26 to 2029–30.\n2. NCM 2.0 operates separately from, without subsuming, NCM 1.0.\n3. CRZ-I covers developed urban coasts.\n4. CRZ-IV covers rural and undeveloped coasts.","options":["None", useholds receive priority.\n4. Earlier-phase houses incomplete on 31 March 2024 are to be completed at revised rates.","options":["Only one","None","All four","Only three","Only two"],"answer":0,"explanation":"1: Incorrect. The launch was on 20 November 2016. 2: Incorrect. Cabinet approval came on 9 August 2024. 3: Correct. They and zero-room households come first. 4: Incorrect. About 35 lakh such houses are to be completed at the old rates.","statements":[{"text":"PMAY-G was launched on 20 November 2015.","correct":false,"evidence":"The launch was on 20 November 2016."},{"text":"PMAY-G 2.0 was approved on 9 August 2023.","correct":false,"evidence":"Cabinet approval came on 9 August 2024."},{"text":"Houseless households receive priority.","correct":true,"evidence":"They and zero-room households come first."},{"text":"Earlier-phase houses incomplete on 31 March 2024 are to be completed at revised rates.","correct":false,"evidence":"About 35 lakh such houses are to be completed at the old rates."}],"draftId":34,"source":"Merged PDF p. 13, 14"},{"id":"Q034","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Coasts and rural housing","subtopic":"PMAY-G unit assistance","pages":[14],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which plains–hill assistance and minimum house-size combination is correct?","options":["₹1.50 lakh; ₹1.60 lakh; 25 sq m","₹1.30 lakh; ₹1.20 lakh; 25 sq m","₹1.20 lakh; ₹1.30 lakh; 20 sq m","₹1.20 lakh; ₹1.50 lakh; 30 sq m","₹1.20 lakh; ₹1.30 lakh; 25 sq m"],"answer":4,"explanation":"Assistance is ₹1.20 lakh in plains and ₹1.30 lakh in specified hill/NE areas; minimum area is 25 sq m including cooking space.","draftId":31,"source":"Merged PDF p. 14"},{"id":"Q035","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"Coasts and rural housing","subtopic":"PMAY-G beneficiary verification","pages":[14],"difficulty":"Hard","type":"NOT correct","scheme":true,"question":"Which statement about PMA  is above ₹15,000.","correct":true,"evidence":"This is the source’s stated threshold."},{"text":"The number of exclusion criteria was raised from 10 to 13.","correct":false,"evidence":"It was reduced from 13 to 10."},{"text":"The motorised two-wheeler condition was removed.","correct":true,"evidence":"It is named among the removed conditions."},{"text":"The fishing-boat condition was retained.","correct":false,"evidence":"The source says this condition was removed."}],"draftId":59,"source":"Merged PDF p. 14"},{"id":"Q038","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"TB programmes and social assistance","subtopic":"JOSH coverage","pages":[15],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"What is the JOSH Phase-I coverage and planned expansion?","options":["55 districts in 11 States/UTs; 804 districts","50 districts in 10 States/UTs; 804 districts","55 districts in 12 States/UTs; 804 districts","100 districts in 11 States/UTs; 750 districts","55 districts in 11 States/UTs; 704 districts"],"answer":0,"explanation":"Phase I covers 55 districts in 11 States/UTs, with expansion planned to 804 districts.","draftId":35,"source":"Merged PDF p. 15"},{"id":"Q039","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"TB programmes and social assistance","subtopic":"JOSH tools and support","pages":[15,16],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about JOSH tools and support. How many are correct?\n1. JOSH stands for Joint Squad for Health.\n2. Khushi Avatar is an AI assistant in 12 Indian languages.\n3. Ni-kshay Mitras provide additional patient support.\n4. TB services run through NTEP under NHM.","options":["Only two","None","Only one","All four","Only three"],"answer":3,"explanation":"1: Correct. The full form is stated. 2: Correct. It answers queries and provides medicine reminders. 3: Correct. Citizens, organisations and volunteers can adopt patients. topic":"PMDDKY convergence","pages":[17],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which combination describes PMDDKY’s annual funds and convergence?","options":["₹24,000 crore over six years; 36 schemes; 11 ministries/departments","₹24,000 crore; 36 schemes; 12 ministries/departments","₹24,000 crore; 36 schemes; 11 ministries/departments","₹20,000 crore annually; 36 schemes; 11 ministries/departments","₹24,000 crore; 35 schemes; 11 ministries/departments"],"answer":2,"explanation":"PMDDKY converges ₹24,000 crore annually for six years, drawing on 36 schemes of 11 ministries/departments.","draftId":44,"source":"Merged PDF p. 17"},{"id":"Q043","section":"01 · Agriculture \u0026 core schemes","topic":"PMDDKY and integrated planning","subtopic":"PMDDKY district selection","pages":[17,18],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about PMDDKY district selection. How many are correct?\n1. Districts are selected for low productivity, low cropping intensity and weak credit access.\n2. Every State/UT gets at least one district.\n3. District allocation depends on net cropped area and operational holdings.\n4. The programme creates an entirely separate pool of money for new projects.","options":["Only two","Only one","All four","Only three","None"],"answer":3,"explanation":"1: Correct. All three selection criteria are listed. 2: Correct. The scheme covers 100 districts. 3: Correct. These are the stated allocation factors. 4: Incorrect. It converges existing scheme funds, State schemes and private partnerships.","statements":[{"text":"Districts are selected for low productivity, low cropping intensity and weak credit access.","correct":true,"evidence":"All three selection criteria are listed."},{"text":"Every State/UT gets at least one district.","correct":true,"evidence":"The scheme covers 100 districts."},{"text":"District allocation depends on net cropped area and operational holdings.","correct":true,"evidence":"These are the stated allocation factors."},{"text":"The programme creates an entirely separate pool of money for new projects.","correct":false,"evidence":"It converges existing scheme funds, State schemes and private partnerships."}],"draftId":45,"source":"Merged PDF p. 17, 18"},{"id":"Q044","section":"01 · Agriculture \u0026 core schemes","topic":"PMDDKY and integrated planning","subtopic":"PMDDKY monitoring","pages":[17],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"How many KPIs are tracked, at what frequency, and with which guiding institution?","options":["117; monthly; CACP","117; quarterly; NITI Aayog","100; monthly; NABARD","111; quarterly; NITI Aayog","117; monthly; NITI Aayog"],"answer":4,"explanation":"The dashboard tracks 117 KPIs monthly; NITI Aayog guides and evaluates.","draftId":46,"source":"Merged PDF p. 17"},{"id":"Q045","section":"01 · Agriculture \u0026 core schemes","topic":"PMDDKY and integrated planning","subtopic":"PMDDKY performance","pages":[17],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which sequence lists the top three overall districts at the first anniversary?","options":["Gaya, Nagaur, Umaria","Nagaur, Kutch, Dahod","Kishtwar, Nagaur, Umaria","Gaya, Umaria, Kishtwar","Umaria, Chhota Udepur, Gaya"],"answer":0,"explanation":"Gaya (Bihar), Nagaur (Rajasthan) and Umaria (Madhya Pradesh) are named as the top overall districts.","draftId":47,"source":"Merged PDF p. 17"},{"id":"Q046","section":"01 · Agriculture \u0026 core schemes","topic":"PMDDKY and integrated planning","subtopic":"PMDDKY irrigation","pages":[18],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which district ranked first for improvement in irrigation under PMDDKY?","options":["Kishtwar","Gaya","Kutch","Umaria","Nagaur"],"answer":0,"explanation":"Kishtwar is singled out for improvement in irrigation, distinct from the overall top districts.","draftId":53,"source":"Merged PDF p. 18"},{"id":"Q047","section":"01 · Agriculture \u0026 core schemes","topic":"PMDDKY and integrated planning","subtopic":"GatiShakti platform","pages":[19],"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which organisation built the PM GatiShakti geospatial platform?","options":["Survey of India","ISRO’s NRSC","NIC","C-DAC","BISAG-N"],"answer":4,"explanation":"The platform was built by BISAG-N.","draftId":48,"source":"Merged PDF p. 19"},{"id":"Q048","section":"01 · Agriculture \u0026 core schemes","topic":"PMDDKY and integrated planning","subtopic":"GatiShakti engines","pages":[19],"difficulty":"Hard","type":"NOT correct","scheme":true,"question":"Which statement about GatiShakti engines is NOT correct?","options":["Logistics infrastructure is one of the seven engines.","Waterways is one of the seven engines.","Mass transport is one of the seven engines.","Energy generation is one of the seven engines.","Railways is one of the seven engines."],"answer":3,"explanation":"The seven engines are roads, railways, airports, ports, mass transport, waterways and logistics infrastructure; energy generation is not listed.","draftId":49,"source":"Merged PDF p. 19"},{"id":"Q049","section":"01 · Agriculture \u0026 core schemes","topic":"PMDDKY and integrated planning","subtopic":"GatiShakti institutional roles","pages":[20],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about GatiShakti institutional roles. How many are correct?\n1. The NPG primarily tracks export/import container movement.\n2. The Technical Support Unit provides technical expertise.\n3. ULIP connected 46 systems of 12 ministries through 124 APIs in July 2026.\n4. The Logistics Data Bank tracks export/import container movement.","options":["None","All four","Only two","Only three","Only one"],"answer":2,"explanation":"1: Incorrect. NPG evaluates integrated infrastructure proposals; LDB tracks containers. 2: Correct. TSU supports technical/project evaluation work. 3: Incorrect. The source gives 142 APIs. 4: Correct. This is the stated LDB role.","statements":[{"text":"The NPG primarily tracks export/import container movement.","correct":false,"evidence":"NPG evaluates integrated infrastructure proposals; LDB tracks containers."},{"text":"The Technical Support Unit provides technical expertise.","correct":true,"evidence":"TSU supports technical/project evaluation work."},{"text":"ULIP connected 46 systems of 12 ministries through 124 APIs in July 2026.","correct":false,"evidence":"The source gives 142 APIs."},{"text":"The Logistics Data Bank tracks export/import container movement.","correct":true,"evidence":"This is the stated LDB role."}],"draftId":50,"source":"Merged PDF p. 20"},{"id":"Q050","section":"01 · Agriculture \u0026 core schemes","topic":"PMDDKY and integrated planning","subtopic":"GatiShakti appraisal","pages":[20],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"What is the five-year NPG project count and value used in the source?","options":["421 projects; ₹20.23 lakh crore","396 projects; ₹20.23 lakh crore","421 projects; ₹18.66 lakh crore","396 projects; ₹18.23 lakh crore","461 projects; ₹20.23 lakh crore"],"answer":0,"explanation":"The five-year figures are 421 projects worth ₹20.23 lakh crore; the note distinguishes an earlier 396-project count.","draftId":51,"source":"Merged PDF p. 20"},{"id":"Q051","section":"01 · Agriculture \u0026 core schemes","topic":"PMDDKY and integrated planning","subtopic":"Logistics policy","pages":[20],"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which policy, dated September 2022, complements GatiShakti in reducing logistics costs?","options":["National Logistics Policy","National Trade Facilitation Action Plan","National Manufacturing Policy","National Infrastructure Policy","National IPR Policy"],"answer":0,"explanation":"The background explicitly identifies the National Logistics Policy (September 2022).","draftId":52,"source":"Merged PDF p. 20"},{"id":"Q052","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"TB programmes and social assistance","subtopic":"NSAP continuation","pages":[21],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which period and outlay were approved for the renamed NSAP?","options":["2026–27 to 2030–31; ₹54,328 crore","2026–27 to 2031–32; ₹53,428 crore","2025–26 to 2030–31; ₹43,528 crore","2026–27 to 2030–31; ₹53,428 crore","2025–26 to 2029–30; ₹53,428 crore"],"answer":3,"explanation":"The Cabinet approved ₹53,428 crore for five years, 2026–27 to 2030–31.","draftId":39,"source":"Merged PDF p. 21"},{"id":"Q053","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"TB programmes and social assistance","subtopic":"NSAP constitutional basis","pages":[21],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"NSAP’s original launch and constitutional basis are correctly paired in which option?","options":["2 October 1995 — Article 41","15 August 1995 — Article 40","26 January 1995 — Article 43","15 August 1995 — Article 41","15 August 1996 — Article 42"],"answer":3,"explanation":"NSAP was launched on 15 August 1995 to implement Article 41’s public-assistance principle.","draftId":40,"source":"Merged PDF p. 21"},{"id":"Q054","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"TB programmes and social assistance","subtopic":"Renamed sub-schemes","pages":[21],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"The diagram renames the National Family Benefit Scheme as which scheme?","options":["PM Vidhwa Pension Yojana","PM Vridhavastha Pension Yojana","PM Parivar Labh Yojana","PM Samajik Sahayata Yojana","PM Divyangjan Pension Yojana"],"answer":2,"explanation":"The source diagram maps NFBS to PM Parivar Labh Yojana; the umbrella NSAP becomes PM Samajik Sahayata Yojana.","draftId":43,"source":"Merged PDF p. 21"},{"id":"Q055","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"TB programmes and social assistance","subtopic":"Revised disability pension","pages":[22],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about Revised disability pension. How many are correct?\n1. The revised disability benchmark is 50%.\n2. Eligibility starts only at age 18.\n3. The revised monthly pension for ages 0–79 is ₹350.\n4. The monthly rate at age 80+ is ₹625.","options":["Only one","Only three","None","All four","Only two"],"answer":0,"explanation":"1: Incorrect. The benchmark is reduced from 80% to 40%. 2: Incorrect. Eligibility is extended from birth. 3: Incorrect. The source specifies ₹375. 4: Correct. The older-age rate is ₹625.","statements":[{"text":"The revised disability benchmark is 50%.","correct":false,"evidence":"The benchmark is reduced from 80% to 40%."},{"text":"Eligibility starts only at age 18.","correct":false,"evidence":"Eligibility is extended from birth."},{"text":"The revised monthly pension for ages 0–79 is ₹350.","correct":false,"evidence":"The source specifies ₹375."},{"text":"The monthly rate at age 80+ is ₹625.","correct":true,"evidence":"The older-age rate is ₹625."}],"draftId":41,"source":"Merged PDF p. 22"},{"id":"Q056","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"TB programmes and social assistance","subtopic":"earlier NSAP benefits","pages":[22,23],"difficulty":"Hard","type":"NOT correct","scheme":true,"question":"Which statement about earlier NSAP benefits is NOT correct?","options":["NFBS pays ₹20,000 every year to eligible families.","IGNOAPS provides ₹200 monthly at ages 60–79.","IGNWPS provides ₹300 monthly at ages 40–79.","Annapurna provides 10 kg free grains monthly.","The earlier disability rates were ₹300 and ₹500."],"answer":0,"explanation":"NFBS is a one-time ₹20,000 benefit, not an annual payment. These are the earlier benefits as presented in the source.","draftId":42,"source":"Merged PDF p. 22, 23"},{"id":"Q057","section":"02 · Rural connectivity, sanitation \u0026 welfare","topic":"TB programmes and social assistance","subtopic":"Earlier pension age bands","pages":[22],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about Earlier pension age bands. How many are correct?\n1. Earlier old-age pension eligibility began at 60 years.\n2. Earlier widow pension eligibility began at 40 years.\n3. Earlier disability pension eligibility began at birth.\n4. NFBS covered the death of a main earner aged 18–59.","options":["Only two","Only one","All four","None","Only three"],"answer":4,"explanation":"1: Correct. IGNOAPS lists ages 60–79 and 80+. 2: Correct. IGNWPS lists ages 40–79 and 80+. 3: Incorrect. IGNDPS earlier began at 18. 4: Correct. This is the table’s age range.","statements":[{"text":"Earlier old-age pension eligibility began at 60 years.","correct":true,"evidence":"IGNOAPS lists ages 60–79 and 80+."},{"text":"Earlier widow pension eligibility began at 40 years.","correct":true,"evidence":"IGNWPS lists ages 40–79 and 80+."},{"text":"Earlier disability pension eligibility began at birth.","correct":false,"evidence":"IGNDPS earlier began at 18."},{"text":"NFBS covered the death of a main earner aged 18–59.","correct":true,"evidence":"This is the table’s age range."}],"draftId":60,"source":"Merged PDF p. 22"},{"id":"Q058","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"GST reforms","pages":[25],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"The 57th GST Council recommendations change the prosecution threshold and general penalty to which pair?","options":["₹5 crore and ₹10,000","₹3 crore and ₹10,000","₹5 crore and ₹15,000","₹5 crore and ₹25,000","₹1 crore and ₹10,000"],"answer":0,"explanation":"The prosecution threshold rises from ₹1 crore to ₹5 crore; the general penalty falls from ₹25,000 to ₹10,000.","draftId":61,"source":"Merged PDF p. 25"},{"id":"Q059","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"GST refunds","pages":[25],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about GST refunds. How many are correct?\n1. GST refund claims would be acknowledged within 15 days under the new recommendation.\n2. Only 75% of provisional refunds would be automatically released.\n3. Capital-goods credit refunds would be spread over 60 months from April 2027.\n4. Employee health and life insurance credit would be prohibited.","options":["Only two","Only three","Only one","None","All four"],"answer":2,"explanation":"1: Incorrect. The recommendation reduces the earlier 15 days to 10 days. 2: Incorrect. The recommendation is 90%. 3: Correct. This applies to exports and inverted duty. 4: Incorrect. The Council recommended allowing the credit.","statements":[{"text":"GST refund claims would be acknowledged within 15 days under the new recommendation.","correct":false,"evidence":"The recommendation reduces the earlier 15 days to 10 days."},{"text":"Only 75% of provisional refunds would be automatically released.","correct":false,"evidence":"The recommendation is 90%."},{"text":"Capital-goods credit refunds would be spread over 60 months from April 2027.","correct":true,"evidence":"This applies to exports and inverted duty."},{"text":"Employee health and life insurance credit would be prohibited.","correct":false,"evidence":"The Council recommended allowing the credit."}],"draftId":62,"source":"Merged PDF p. 25"},{"id":"Q060","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"GST Council voting","pages":[25],"difficulty":"Hard","type":"NOT correct","scheme":false,"question":"Which statement about GST Council voting is NOT correct?","options":["Quorum is 50% of members.","The Council is constituted under Article 279A.","The Centre holds two-thirds of the weighted vote.","The Union Finance Minister chairs it.","Decisions require three-fourths of weighted votes."],"answer":2,"explanation":"The Centre has one-third of the weighted vote; States together have two-thirds.","draftId":63,"source":"Merged PDF p. 25"},{"id":"Q061","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"Inflation releases","pages":[25,26],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Which September 2026 CPI–WPI inflation pair is reported?","options":["5.20% — 9.92%","5.45% — 11.39%","5.54% — 9.92%","5.00% — 11.93%","5.54% — 11.39%"],"answer":4,"explanation":"The capsule reports CPI inflation of 5.54% and WPI inflation of 11.39%.","draftId":64,"source":"Merged PDF p. 25, 26"},{"id":"Q062","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"Price-index institutions","pages":[26],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Price-index institutions. How many are correct?\n1. DPIIT’s Office of the Economic Adviser releases retail CPI inflation.\n2. WPI is compiled by the Office of the Economic Adviser under DPIIT.\n3. The new WPI base year is 2024–25.\n4. The revised WPI series was introduced in April 2026.","options":["All four","Only three","None","Only one","Only two"],"answer":3,"explanation":"1: Incorrect. NSO releases retail CPI; the named office compiles WPI. 2: Correct. The WPI paragraph names this office. 3: Incorrect. The source gives 2022–23. 4: Incorrect. It was introduced in June 2026.","statements":[{"text":"DPIIT’s Office of the Economic Adviser releases retail CPI inflation.","correct":false,"evidence":"NSO releases retail CPI; the named office compiles WPI."},{"text":"WPI is compiled by the Office of the Economic Adviser under DPIIT.","correct":true,"evidence":"The WPI paragraph names this office."},{"text":"The new WPI base year is 2024–25.","corre adu leads both factory numbers and employment.","draftId":68,"source":"Merged PDF p. 27"},{"id":"Q066","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"Services production index","pages":[27],"difficulty":"Hard","type":"Statements","scheme":false,"question":"Consider the following statements about Services production index. How many are correct?\n1. The trial ISP uses base year 2024–25.\n2. It covers 19 sub-sectors representing about 60% of services.\n3. Air Transport and Repair Services recorded declines.\n4. The first trial index was for April 2026.","options":["Only three","Only one","None","All four","Only two"],"answer":3,"explanation":"1: Correct. It aligns with the new CPI series. 2: Correct. Both coverage figures are stated. 3: Correct. They fell 8.4% and 5% respectively. 4: Correct. Monthly releases have about a 60-day lag.","statements":[{"text":"The trial ISP uses base year 2024–25.","correct":true,"evidence":"It aligns with the new CPI series."},{"text":"It covers 19 sub-sectors representing about 60% of services.","correct":true,"evidence":"Both coverage figures are stated."},{"text":"Air Transport and Repair Services recorded declines.","correct":true,"evidence":"They fell 8.4% and 5% respectively."},{"text":"The first trial index was for April 2026.","correct":true,"evidence":"Monthly releases have about a 60-day lag."}],"draftId":69,"source":"Merged PDF p. 27"},{"id":"Q067","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"Household travel","pages":[27,28],"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which pair correctly matches the leading student and fixed-workplace worker travel modes?","options":["Buses — 37%; two-wheelers — 42.6%","Bicycles — 37%; two-wheelers — 29.5%","Walking — 37%; two-wheelers — 42.6%","Walking — 29.5%; buses — 42.6%","Walking — 37%; railways — 42.6%"],"answer":2,"explanation":"Students mainly walk (37%); workers travelling to a fixed workplace mainly use two-wheelers (42.6%).","draftId":70,"source":"Merged PDF p. 27, 28"},{"id":"Q068","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"Windfall tax","pages":[28],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Effective 1 October 2026, the diesel and ATF export duties are which amounts per litre?","options":["₹16 and ₹15","₹16 and ₹10.5","₹15 and ₹10.5","₹20 and ₹15","₹16 and ₹0.5"],"answer":1,"explanation":"Diesel duty falls to ₹16 per litre and ATF to ₹10.5; petrol stays ₹0.5.","draftId":71,"source":"Merged PDF p. 28"},{"id":"Q069","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"FTA utilisation","pages":[29],"difficulty":"Easy","type":"Direct","scheme":false,"question":"The FTA Utilisation Cell was established by which department?","options":["Department of Economic Affairs","DPIIT","Department of Commerce","Department of Revenue","Department of Financial Services"],"answer":2,"explanation":"The Department of Commerce established the cell to help businesses use FTA tariff benefits.","draftId":72,"source":"Merged PDF p. 29"},{"id":"Q070","section":"03 · Economy, governance \u0026 new programmes","topic":"GST and economic statistics","subtopic":"Environmental accounts","pages":[29],"difficulty":"Easy","type":"Direct","scheme":false,"question":"The 2026–2030 environmental-economic accounts strategy follows which international framework?","options":["IMF Special Data Dissemination Standard","UN System of National Accounts only","World Bank Logistics Performance Index","FAO Global Forest Resources Assessment","UN System of Environmental-Economic Accounting"],"answer":4,"explanation":"MoSPI’s strategy follows the UN System of Environmental-Economic Accounting.","draftId":73,"source":"Merged PDF p. 29"},{"id":"Q071","section":"03 · Economy, governance \u0026 new programme ":"Merged PDF p. 30"},{"id":"Q073","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"Women and enterprise","pages":[30],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which change in women’s LFPR (age 15+) is reported from 2017–18 to 2025?","options":["23.3% to 40.0%","33.3% to 40.0%","23.3% to 48.0%","23.3% to 38.0%","26.3% to 40.0%"],"answer":0,"explanation":"The source gives 23.3% in 2017–18 and 40.0% in 2025.","draftId":76,"source":"Merged PDF p. 30"},{"id":"Q074","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"Women enterprise support","pages":[31],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Under PMEGP, which urban–rural subsidy rates are specified for women?","options":["30% and 35%","15% and 25%","25% and 35%","35% and 25%","25% and 30%"],"answer":2,"explanation":"The source lists 25% urban and 35% rural subsidy for women.","draftId":77,"source":"Merged PDF p. 31"},{"id":"Q075","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"Supercomputing mission","pages":[31],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about Supercomputing mission. How many are correct?\n1. NSM was launched in April 2015.\n2. The supercomputing mission is jointly run by MoSPI and MeitY.\n3. The mission is implemented by C-DAC and IIT Madras.\n4. By September 2026 all 50 targeted systems were deployed.","options":["None","Only one","Only three","Only two","All four"],"answer":1,"explanation":"1: Correct. The launch month/year is stated. 2: Incorrect. It is jointly run by DST and MeitY. 3: Incorrect. The implementing institutions are C-DAC Pune and IISc Bengaluru. 4: Incorrect. 40 systems were deployed; 50 is the target.","statements":[{"text":"NSM was launched in April 2015.","correct":true,"evidence":"The launch month/year is stated."},{"text":"The supercomputing mission is jointly run by MoSPI and MeitY.","correct":false,"evidence":"It is jointly run by DST and MeitY."},{"text":"The mission is implemented by C-DAC and IIT Madras.","correct":false,"evidence":"The implementing institutions are C-DAC Pune and IISc Bengaluru."},{"text":"By September 2026 all 50 targeted systems were deployed.","correct":false,"evidence":"40 systems were deployed; 50 is the target."}],"draftId":78,"source":"Merged PDF p. 31"},{"id":"Q076","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"Additive manufacturing","pages":[32],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which combination is a National Strategy for Additive Manufacturing target?","options":["50 technologies, 500 start-ups, 100 products","50 technologies, 100 start-ups, 500 products","50 technologies, 100 start-ups, 1,000 products","100 technologies, 50 start-ups, 500 products","65 technologies, 56 start-ups, 500 products"],"answer":1,"explanation":"The strategy targets 50 India-specific technologies, 100 start-ups and 500 products; achievements are listed separately.","draftId":79,"source":"Merged PDF p. 32"},{"id":"Q077","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"PRAHAAR and extradition","pages":[32,33],"difficulty":"Easy","type":"Direct","scheme":false,"question":"Which system brings MHA, MEA, CBI and State agencies onto one platform for return of fugitives?","options":["Swachhatam Portal","MyPNG Portal","SWIK Portal 2.0","Extradition Portal","Pashudhan Bima Portal"],"answer":3,"explanation":"The Extradition Portal coordinates those agencies to accelerate the return of fugitives.","draftId":80,"source":"Merged PDF p. 32, 33"},{"id":"Q078","section":"03 · Economy, governance \u0026 new programmes","topic":"Industrial, employment and research schemes","subtopic":"Rural programme implementation","pages":[33,35,39,44],"difficulty":"Hard","type":"Statements","scheme":true,"question":"Consider the following statements about Rural programme implementation. How many are correct?\n1. Vanitham She-Mart is run by NCCF.\n2. Each JOSH team has five MY Bharat volunteers and five NCC cadets.\n3. The rural 3D-printed housing pilot in Andhra Pradesh comprises 177 houses costing ₹14 crore.\n4. Kharif PSS procurement worth ₹5,547.99 crore gives Karnataka the largest State share.","options":["None","Only three","All four","Only one","Only two"],"answer":1,"explanation":"1: Correct. NCCF runs the cooperative retail platform linking women SHGs to markets (p.33). 2: Correct. A Class-I officer leads the team at block/ward level (p.35). 3: Correct. These are the pilot figures (p.39). 4: Incorrect. Uttar Pradesh has the largest share; Karnataka and Telangana are also covered (p.44).","statements":[{"text":"Vanitham She-Mart is run by NCCF.","correct":true,"evidence":"NCCF runs the cooperative retail platform linking women SHGs to markets (p.33)."},{"text":"Each JOSH team has five MY Bharat volunteers and five NCC cadets.","correct":true,"evidence":"A Class-I officer leads the team at block/ward level (p.35)."},{"text":"The rural 3D-printed housing pilot in Andhra Pradesh comprises 177 houses costing ₹14 crore.","correct":true,"evidence":"These are the pilot figures (p.39)."},{"text":"Kharif PSS procurement worth ₹5,547.99 crore gives Karnataka the largest State share.","correct":false,"evidence":"Uttar Pradesh has the largest share; Karnataka and Telangana are also covered (p.44)."}],"draftId":54,"source":"Merged PDF p. 33, 35, 39, 44"},{"id":"Q079","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"PRAMAAN","pages":[33],"difficulty":"Easy","type":"Direct","scheme":false,"question":"Which institution implements Indian Forest and Wood Certification through PRAMAAN?","options":["BISAG-N, Gandhinagar","ICAR-CIPHET, Ludhiana","Wildlife Institute of India, Dehradun","Forest Survey of India, Dehradun","Indian Institute of Forest Management, Bhopal"],"answer":4,"explanation":"PRAMAAN is implemented by IIFM, Bhopal. Its scope includes forest management, trees outside forests and chain of custody.","draftId":81,"source":"Merged PDF p. 33"},{"id":"Q080","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Delhi traffic project","pages":[33],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Which cost–consultant pair is correct for Delhi’s Intelligent Traffic Management System?","options":["₹1,789.25 crore — NIC","₹1,879.52 crore — C-DAC Pune","₹1,789.52 crore — C-DAC Pune","₹1,879.25 crore — IIT Kanpur","₹1,789.52 crore — BISAG-N"],"answer":2,"explanation":"The CCEA-approved cost is ₹1,789.52 crore; C-DAC Pune is project management consultant.","draftId":82,"source":"Merged PDF p. 33"},{"id":"Q081","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Pashudhan Bima","pages":[34],"difficulty":"Easy","type":"Direct","scheme":true,"question":"The Pashudhan Bima Portal covers livestock insurance under which mission?","options":["PM Dhan-Dhaanya Krishi Yojana","PM Matsya Sampada Yojana","National Livestock Mission","National Coastal Mission","National Health Mission"],"answer":2,"explanation":"The DAHD portal covers livestock insurance under the National Livestock Mission.","draftId":83,"source":"Merged PDF p. 34"},{"id":"Q082","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"FASTag exemption","pages":[34],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"Which validity pair applies to disability levels 70–100% and 40% to below 70%, respectively?","options":["5 years; 3 years","4 years; 2 years","3 years; 1 year","5 years; 1 year","3 years; 5 years"],"answer":0,"explanation":"From 2 October 2026, validity is five years for 70–100% disability and three years for 40% to below 70%.","draftId":84,"source":"Merged PDF p. 34"},{"id":"Q083","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"PNG Drive 3.0","pages":[34],"difficulty":"Moderate","type":"Direct","scheme":true,"question":"What new domestic PNG connection target and deadline are stated?","options":["40 lakh by 31 March 2027","40 lakh by 31 December 2026","50 lakh by 31 December 2026","50 lakh by 31 March 2028","50 lakh by 31 March 2027"],"answer":4,"explanation":"The drive targets 50 lakh new connections by 31 March 2027; activating 40 lakh unused connections is a separate aim.","draftId":85,"source":"Merged PDF p. 34"},{"id":"Q084","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Sugarcane panel","pages":[35],"difficulty":"Easy","type":"Direct","scheme":false,"question":"Who chairs the high-powered panel examining sugarcane farmers’ demands?","options":["Ramesh Chand","Ashok Kumar Lahiri","Saurabh Garg","Rajesh Agarwal","Anurag Jain"],"answer":0,"explanation":"The source names Ramesh Chand, former NITI Aayog Member.","draftId":86,"source":"Merged PDF p. 35"},{"id":"Q085","section":"03 · Economy, governance \u0026 new programmes","topic":"Governance, institutions and digital services","subtopic":"Business register","pages":[35],"difficulty":"Moderate","type":"Direct","scheme":false,"question":"Which data source will MSME share with MoSPI through APIs to strengthen the Statistical Business Register?","options":["SWIK Portal 2.0","Udyam Registration portal","ePDS database","Awaas+ 2024 app","GeM procurement portal"],"answer":1,"explanation":"Unit-level Udyam Registration data will be shared with MoSPI
