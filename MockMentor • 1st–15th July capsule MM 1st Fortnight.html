<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NABARD_Grade_A_GA_Interactive_Quiz_v2</title>
<style>
:root{
  --bg:#090b10; --panel:#11151d; --panel2:#171c26; --line:#2a3140;
  --text:#f4f7fb; --muted:#9ba6b6; --accent:#8ab4ff; --accent2:#b98cff;
  --good:#35d07f; --bad:#ff5d6c; --warn:#f6c85f; --shadow:0 18px 55px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 0%,#171b2c 0,#090b10 42%,#07080c 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
button,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;background:rgba(9,11,16,.92);backdrop-filter:blur(14px)}
.brand{font-weight:800;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}
.top-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;transition:.18s}
.btn:hover{transform:translateY(-1px);border-color:#485266;background:var(--panel2)}
.btn.primary{background:linear-gradient(135deg,#477eea,#7857c9);border:0}
.btn.ghost{background:transparent}
.btn.small{padding:7px 10px;font-size:13px}
.main{max-width:1180px;margin:0 auto;padding:38px 22px 60px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:stretch}
.hero-card,.panel,.stat,.question-card{background:linear-gradient(145deg,rgba(20,25,35,.96),rgba(13,16,23,.96));border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}
.hero-card{padding:34px}
.kicker{color:var(--accent);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:1.2px}
h1{font-size:clamp(31px,5vw,54px);line-height:1.02;margin:12px 0 14px}
.lead{color:#c6cfdb;max-width:700px;font-size:16px;line-height:1.65}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:26px}
.mode{padding:18px;border:1px solid var(--line);background:#121722;border-radius:14px;text-align:left}
.mode strong{display:block;font-size:15px;margin-bottom:6px}.mode span{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.mode:hover{border-color:#56647c;background:#171e2a}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{padding:22px;display:flex;flex-direction:column;justify-content:center}
.stat b{font-size:30px}.stat span{color:var(--muted);font-size:12px;margin-top:5px}
.section-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.section-card{border:1px solid var(--line);background:var(--panel);padding:15px;border-radius:14px;min-height:76px}
.section-card b{font-size:13px}.section-card span{float:right;color:var(--accent);font-weight:800}
.section-card small{display:block;color:var(--muted);margin-top:8px}
.panel{padding:24px;margin-top:22px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
select{width:100%;background:#0e1219;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}
.quiz-wrap{max-width:900px;margin:0 auto}
.quiz-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:16px}
.qmeta{color:var(--muted);font-size:12px}.qnum{font-size:24px;font-weight:800;margin-bottom:5px}
.progress{height:7px;background:#1c2330;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.live-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#0e1219;color:#cbd4df;font-size:12px}
.question-card{padding:28px}.badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.badge{font-size:11px;border-radius:999px;padding:5px 8px;background:#1a2230;color:#b9c8df;border:1px solid #2a3548}
.badge.scheme{color:#e2c6ff;background:#21182e;border-color:#46315c}
.qtext{font-size:21px;line-height:1.5;font-weight:700;white-space:pre-line;margin-bottom:22px}
.options{display:grid;gap:10px}
.opt{width:100%;text-align:left;border:1px solid #303849;background:#10151e;color:#eef2f7;padding:14px 15px;border-radius:12px;display:flex;gap:12px;line-height:1.45}
.opt:hover:not(.locked){border-color:#52617a;background:#171e2a}
.opt .letter{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:#202837;color:#bfc9d8;font-weight:800;flex:none}
.opt.correct{border-color:#267d4f;background:rgba(53,208,127,.11)}.opt.correct .letter{background:rgba(53,208,127,.25);color:#8ff0b8}
.opt.wrong{border-color:#8e3440;background:rgba(255,93,108,.1)}.opt.wrong .letter{background:rgba(255,93,108,.2);color:#ffabb3}
.opt.locked{cursor:default}
.explain{margin-top:18px;padding:15px;border-left:3px solid var(--accent);background:#0d131c;color:#cdd6e3;border-radius:8px;line-height:1.55;font-size:14px}
.feedback{margin-top:14px;font-weight:800}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.feedback.skip{color:var(--warn)}
.quiz-footer{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.result-card{border:1px solid var(--line);background:var(--panel);padding:17px;border-radius:14px}.result-card b{font-size:25px}.result-card small{display:block;color:var(--muted);margin-top:4px}
.bar-row{display:grid;grid-template-columns:120px 1fr 55px;gap:10px;align-items:center;margin:9px 0;font-size:12px}
.bar{height:8px;background:#1d2430;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.review{border-top:1px solid var(--line);padding:18px 0}.review h4{margin:0 0 9px}.review .small{font-size:12px;color:var(--muted);line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:30px}
.hidden{display:none!important}
.footer-note{color:#6f7b8e;font-size:11px;line-height:1.5;margin-top:22px}
@media(max-width:850px){.hero{grid-template-columns:1fr}.section-grid{grid-template-columns:repeat(2,1fr)}.result-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.topbar{padding:0 15px}.main{padding:24px 13px 45px}.hero-card{padding:24px}.section-grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.quiz-head{grid-template-columns:1fr}.live-stats{justify-content:flex-start}.qtext{font-size:18px}.question-card{padding:20px}}
</style>
</head>

const QUESTIONS = [{"id":1,"section":"Phase 1+2","topic":"eSARAS","subtopic":"Platform architecture","page":2,"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which organisation is identified as the implementation partner for eSARAS?","options":["Digital India Corporation","Small Industries Development Bank of India","National e-Governance Division","India Digital Mission","National Payments Corporation of India"],"answer":"A","explanation":"The PDF identifies Digital India Corporation, under MeitY, as eSARAS's implementation partner."},{"id":2,"section":"Phase 1+2","topic":"eSARAS","subtopic":"Objective","page":2,"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which combination best captures the core objective of eSARAS?","options":["Finance urban startups, increase GST compliance and support tourism","Create rural roads, provide pensions and expand warehousing","Provide crop insurance, expand exports and digitise land records","Promote industrial exports, issue credit cards and regulate SHGs","Eliminate middlemen, promote financial inclusion and preserve traditional crafts"],"answer":"E","explanation":"The PDF lists eliminating middlemen, promoting financial inclusion and preserving traditional Indian crafts."},{"id":3,"section":"Phase 1+2","topic":"eSARAS","subtopic":"Integrations","page":2,"difficulty":"Easy","type":"NOT","scheme":true,"question":"Which of the following is NOT identified in the PDF as an eSARAS digital or marketing integration?","options":["ONDC","GSTN","eSARAS Fulfillment Centres","UMANG","A dedicated mobile application for onboarding and inventory management"],"answer":"B","explanation":"The PDF names ONDC, UMANG, Fulfillment Centres and the dedicated mobile application; GSTN is not listed."},{"id":5,"section":"Phase 1+2","topic":"PMGKAY","subtopic":"Rice standards","page":3,"difficulty":"Hard","type":"Direct","scheme":true,"question":"Under the approved quality overhaul, what is the new permissible broken limit for raw rice?","options":["12%","16%","10%","20%","5%"],"answer":"C","explanation":"The new approved broken limit for raw rice is up to 10%."},{"id":6,"section":"Phase 1+2","topic":"PMGKAY","subtopic":"Rice standards","page":3,"difficulty":"Hard","type":"Direct","scheme":true,"question":"By how many percentage points is the permissible broken limit for parboiled rice reduced under the revised specification?","options":["9 percentage points","15 percentage points","7 percentage points","11 percentage points","5 percentage points"],"answer":"D","explanation":"Parboiled rice moves from up to 16% to up to 5%, a reduction of 11 percentage points."},{"id":7,"section":"Phase 1+2","topic":"PMGKAY","subtopic":"Implementation","page":3,"difficulty":"Easy","type":"Direct","scheme":true,"question":"By which Kharif Marketing Season is full, phased implementation of the improved rice specifications targeted?","options":["KMS 2025–26","KMS 2029–30","KMS 2026–27","KMS 2028–29","KMS 2027–28"],"answer":"E","explanation":"The PDF gives KMS 2027–28 as the target for full, phased implementation."},{"id":8,"section":"Phase 1+2","topic":"PMGKAY","subtopic":"Pilot states","page":3,"difficulty":"Hard","type":"Statement","scheme":true,"question":"Consider the following statements about the revised PDS rice specifications:\n1. Pilots were conducted in six states.\n2. Haryana was among the pilot states.\n3. The revised specifications reduce existing beneficiary entitlements.\n4. Telangana was among the pilot states.\nHow many statements are correct?","options":["All four","Only one","Only three","Only two","None"],"answer":"C","explanation":"Statements 1, 2 and 4 are supported; the PDF says there is no reduction in existing entitlements."},{"id":9,"section":"Phase 1+2","topic":"SHE-LEAPS","subtopic":"Development","page":3,"difficulty":"Easy","type":"Direct","scheme":true,"question":"The SHE-LEAPS mobile application was developed by:","options":["NABARD","National e-Governance Division","National Informatics Centre","Digital India Corporation","NITI Aayog"],"answer":"D","explanation":"The PDF states that Digital India Corporation developed the SHE-LEAPS mobile application."},{"id":10,"section":"Phase 1+2","topic":"SHE-LEAPS","subtopic":"Implementation","page":3,"difficulty":"Hard","type":"Direct","scheme":true,"question":"Under which platform is SHE-LEAPS implemented?","options":["Poshan Tracker","ONDC","LokOS","SWAYAM Plus","UMANG"],"answer":"C","explanation":"SHE-LEAPS is implemented under the LokOS platform."},{"id":11,"section":"Phase 1+2","topic":"SHE-LEAPS","subtopic":"Coverage","page":3,"difficulty":"Easy","type":"Direct","scheme":true,"question":"Across how many States and Union Territories is SHE-LEAPS to be implemented?","options":["38","28","34","31","36"],"answer":"C","explanation":"The PDF specifies implementation across 34 States and Union Territories."},{"id":12,"section":"Phase 1+2","topic":"Lakhpati Didi","subtopic":"Target revision","page":3,"difficulty":"Hard","type":"Direct","scheme":true,"question":"The government recently revised the Lakhpati Didi target from 3 crore to how many women by 2029?","options":["7 crore","4 crore","5 crore","6 crore","8 crore"],"answer":"D","explanation":"The target was increased from 3 crore to 6 crore women by 2029."},{"id":14,"section":"Phase 1+2","topic":"LokOS","subtopic":"Purpose","page":4,"difficulty":"Easy","type":"Direct","scheme":true,"question":"What is the stated purpose of LokOS?","options":["Tracking public-sector procurement","Digitising land registration","End-to-end digitization of SHGs and their federations","Managing international remittances","Monitoring GST collections"],"answer":"C","explanation":"The PDF defines LokOS as an end-to-end digitisation platform for SHGs and their federations."},{"id":15,"section":"Phase 1+2","topic":"LokOS","subtopic":"Features","page":4,"difficulty":"Easy","type":"NOT","scheme":true,"question":"Which of the following is NOT listed among the areas digitised through LokOS?","options":["Savings","Lending","Repayments","Passport issuance","Financial transactions"],"answer":"D","explanation":"Passport issuance is not listed among LokOS's digitised SHG/CBO functions."},{"id":17,"section":"Phase 1+2","topic":"POSHAN Abhiyaan","subtopic":"Ministry","page":4,"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which ministry is the nodal ministry for POSHAN Abhiyaan according to the PDF?","options":["Ministry of Rural Development","Ministry of Education","Ministry of Women and Child Development","Ministry of AYUSH","Ministry of Health and Family Welfare"],"answer":"C","explanation":"The nodal ministry is the Ministry of Women and Child Development."},{"id":18,"section":"Phase 1+2","topic":"Mission Poshan 2.0","subtopic":"Merger","page":4,"difficulty":"Hard","type":"Direct","scheme":true,"question":"Which of the following was NOT one of the three schemes merged into Mission Poshan 2.0 in Budget 2021–22?","options":["DAY-NRLM","Scheme for Adolescent Girls","Anganwadi Services","All of the above","POSHAN Abhiyaan"],"answer":"A","explanation":"The PDF lists the first three; DAY-NRLM is not among those three."},{"id":19,"section":"Phase 1+2","topic":"Poshan Tracker","subtopic":"Launch","page":5,"difficulty":"Easy","type":"Direct","scheme":true,"question":"Poshan Tracker was launched in:","options":["March 2020","January 2022","March 2021","August 2021","March 2022"],"answer":"C","explanation":"The PDF states that Poshan Tracker was launched in March 2021."},{"id":20,"section":"Phase 1+2","topic":"Poshan Tracker","subtopic":"Development","page":5,"difficulty":"Hard","type":"Direct","scheme":true,"question":"Which combination correctly identifies the bodies credited with developing Poshan Tracker?","options":["NITI Aayog and NIC","MoRD and Digital India Corporation","MoHFW and UIDAI","MeitY and NPCI","MoWCD and NeGD"],"answer":"E","explanation":"The PDF names MoWCD and the National e-Governance Division (NeGD)."},{"id":21,"section":"Phase 1+2","topic":"Poshan Tracker","subtopic":"Coverage","page":5,"difficulty":"Easy","type":"Direct","scheme":true,"question":"As on 31 May 2026, Poshan Tracker coverage had been achieved across:","options":["29 States and 7 Union Territories","28 States and 9 Union Territories","28 States and 8 Union Territories","30 States and 8 Union Territories","27 States and 8 Union Territories"],"answer":"C","explanation":"The PDF reports coverage across all 28 States and 8 Union Territories."},{"id":22,"section":"Phase 1+2","topic":"Poshan Tracker","subtopic":"Technology","page":5,"difficulty":"Hard","type":"Direct","scheme":true,"question":"How many manual registers maintained by Anganwadi Workers did Poshan Tracker replace, according to the PDF?","options":["15","11","9","13","7"],"answer":"B","explanation":"The PDF states that Poshan Tracker replaced 11 manual registers."},{"id":23,"section":"Phase 1+2","topic":"Poshan Tracker","subtopic":"Beneficiaries","page":5,"difficulty":"Easy","type":"Statement","scheme":true,"question":"Consider the following Poshan Tracker statements:\n1. It includes six beneficiary categories.\n2. One category is children aged 3–6 years.\n3. It uses Aadhaar-based verification.\n4. It replaced 15 manual registers.\nHow many are correct?","options":["All four","Only three","Only two","None","Only one"],"answer":"B","explanation":"Statements 1, 2 and 3 are correct; the PDF specifies 11, not 15, manual registers."},{"id":24,"section":"Phase 1+2","topic":"Saksham Anganwadi and Poshan 2.0","subtopic":"Coverage","page":5,"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which age group is specifically covered by Early Childhood Care and Education under Saksham Anganwadi and Poshan 2.0?","options":["0–3 years","10–14 years","3–6 years","6–10 years","14–18 years"],"answer":"C","explanation":"The PDF specifies ECCE for children aged 3–6 years."},{"id":25,"section":"Phase 1+2","topic":"Aadharshila","subtopic":"Launch","page":6,"difficulty":"Easy","type":"Direct","scheme":true,"question":"Aadharshila was launched in:","options":["January 2025","April 2024","March 2024","March 2022","March 2023"],"answer":"C","explanation":"The PDF gives March 2024."},{"id":26,"section":"Phase 1+2","topic":"Aadharshila","subtopic":"Pedagogy","page":6,"difficulty":"Easy","type":"Direct","scheme":true,"question":"Which approach is central to Aadharshila's ECCE curriculum?","options":["Purely textbook-based learning","Online-only instruction","Vocational apprenticeship from age three","Play-based learning using toys, art, music and storytelling","Competitive examination-based learning"],"answer":"D","explanation":"The PDF describes a play-based approach using toys, art, music and storytelling."},{"id":27,"section":"Phase 1+2","topic":"SNP","subtopic":"Beneficiaries","page":6,"difficulty":"Hard","type":"Direct","scheme":true,"question":"Under the ICDS Supplementary Nutrition Programme, adolescent girls are covered specifically in:","options":["Only tribal districts in central India","NE States and Aspirational Districts","All States and Union Territories","Only coastal districts","Only Union Territories"],"answer":"B","explanation":"The PDF specifies adolescent girls aged 14–18 years in NE States and Aspirational Districts."},{"id":28,"section":"Phase 1+2","topic":"US Fed task forces","subtopic":"Appointments","page":6,"difficulty":"Hard","type":"Direct","scheme":false,"question":"Who was identified as co-lead of the Balance Sheet Policy Taskforce?","options":["Dr. Raghuram Rajan","Dr. Raj Chetty","Asha Sharma","Nidhi Chhibbera","Kevin Warsh"],"answer":"A","explanation":"The PDF identifies Dr. Raghuram Rajan as co-lead."},{"id":29,"section":"Phase 1+2","topic":"US Fed task forces","subtopic":"Appointments","page":6,"difficulty":"Hard","type":"Direct","scheme":false,"question":"Dr. Raj Chetty was identified as a member of which panel?","options":["Panel on Liquidity Dependence","Global Passport Panel","Balance Sheet Policy Taskforce","AI Access Panel","PPI Advisory Panel"],"answer":"A","explanation":"The PDF places Dr. Raj Chetty on the panel on Liquidity Dependence."},{"id":30,"section":"Phase 1+2","topic":"PPI","subtopic":"Purpose","page":7,"difficulty":"Easy","type":"Direct","scheme":false,"question":"The Producer Price Index introduced in the PDF is designed primarily to measure:","options":["Wholesale prices of agricultural commodities only","Prices of imported goods at ports","Prices paid by consumers","Retail prices of services","Prices received by producers at the factory gate"],"answer":"E","explanation":"PPI measures prices received by producers at the factory gate."},{"id":31,"section":"Phase 1+2","topic":"PPI","subtopic":"Comparison","page":7,"difficulty":"Easy","type":"Direct","scheme":false,"question":"Which index is described as capturing prices paid by consumers?","options":["GDP deflator","WPI","PPI","CPI","IIP"],"answer":"D","explanation":"The PDF contrasts CPI as measuring prices paid by consumers."},{"id":32,"section":"Phase 1+2","topic":"PPI","subtopic":"Framework","page":7,"difficulty":"Hard","type":"Direct","scheme":false,"question":"Which of the following is part of the producer-price framework described in the PDF?","options":["Monthly Input CPI covering seven sectors","Quarterly Services PPI covering seven sectors in its first phase","Quarterly WPI covering five sectors","Annual Output CPI for all industries","Annual Services CPI covering ten sectors"],"answer":"B","explanation":"The framework includes a Quarterly Services PPI covering seven sectors in its first phase."},{"id":33,"section":"Phase 1+2","topic":"PPI","subtopic":"Publication horizon","page":7,"difficulty":"Hard","type":"Direct","scheme":false,"question":"For how long does the PDF say WPI will continue to be published alongside PPI?","options":["Seven years","Two years","Three years","Ten years","Five years"],"answer":"E","explanation":"The PDF says WPI will continue alongside PPI for the next five years."},{"id":34,"section":"Phase 1+2","topic":"TReDS","subtopic":"Mandate","page":8,"difficulty":"Hard","type":"Direct","scheme":true,"question":"From which date is mandatory settlement through TReDS stated to apply?","options":["31 March 2027","30 June 2025","1 July 2026","1 January 2026","30 June 2026"],"answer":"E","explanation":"The timeline gives 30 June 2026 as the mandatory settlement date."},{"id":35,"section":"Phase 1+2","topic":"TReDS","subtopic":"Threshold","page":8,"difficulty":"Hard","type":"Direct","scheme":true,"question":"In 2024, the turnover threshold mentioned for mandatory onboarding was lowered to:","options":["₹250 crore","₹300 crore","₹150 crore","₹200 crore","₹100 crore"],"answer":"A","explanation":"The threshold was lowered to ₹250 crore in 2024."},{"id":36,"section":"Phase 1+2","topic":"TReDS","subtopic":"Platforms","page":8,"difficulty":"Hard","type":"Direct","scheme":true,"question":"Which of the following is NOT listed among the five operational TReDS platforms?","options":["Invoicemart","GeM","RXIL","M1xchange","C2treds"],"answer":"B","explanation":"The PDF lists RXIL, M1xchange, Invoicemart, C2treds and DTX."},{"id":37,"section":"Phase 1+2","topic":"TReDS","subtopic":"Function","page":8,"difficulty":"Easy","type":"Statement","scheme":true,"question":"Consider the following statements about TReDS:\n1. It is RBI-authorised.\n2. It facilitates discounting of MSME trade receivables.\n3. It uses competitive bidding.\n4. It was launched in 2024.\nHow many are correct?","options":["Only one","None","All four","Only three","Only two"],"answer":"D","explanation":"Statements 1, 2 and 3 are correct; the PDF says TReDS was launched in 2017."},{"id":38,"section":"Phase 1+2","topic":"NAS 2026","subtopic":"Standards","page":8,"difficulty":"Moderate","type":"Direct","scheme":false,"question":"National Ambulance Services (NAS) 2026 proposes mandatory compliance with which standard?","options":["AIS 140","BIS 2020","AIS 125","ISO 27001","WHO 11 function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function pct(a,b){return b?Math.round(a*100/b):0;}
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function answerIndex(q){return q.answer.charCodeAt(0)-65;}
function setTop(title){$("#brandTitle").textContent=title;$("#backBtn").classList.toggle("hidden",state.mode==="menu");}
function showMenu(){
  state.mode="menu"; setTop("NABARD Grade A GA • Interactive Quiz");

}

    if(m==="shuffle") startFull(true);
    if(m==="scheme") startScheme();
    if(m==="revision") $("#secSelect").focus();
  });
  document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{
    $("#secSelect").value=b.dataset.sec; populateTopics(); $("#topicSelect").focus();
  });
  $("#secSelect").onchange=populateTopics;
  $("#topicSelect").onchange=()=>{
    $("#startRevision").disabled=!$("#topicSelect").value;
  };
  $("#startRevision").onclick=()=>{
    const s=$("#secSelect").value,t=$("#topicSelect").value;
    startRevision(s,t);
  };
}
function populateTopics(){
  const s=$("#secSelect").value, sel=$("#topicSelect");
  if(!s){sel.disabled=true;sel.innerHTML='<option>Choose a section first</option>';$("#startRevision").disabled=true;return;}
  const topics=[...new Set(QUESTIONS.filter(q=>q.section===s).map(q=>q.topic))];
  sel.disabled=false;
  sel.innerHTML='<option value="">All topics in this section</option>'+topics.map(t=>`<option value="${esc(t)}">${esc(t)} (${QUESTIONS.filter(q=>q.section===s&&q.topic===t).length})</option>`).join("");
  $("#startRevision").disabled=false;
}
function startFull(shuf){
  let pool=[...QUESTIONS];
  if(shuf) pool=shuffle(pool);
  launch(pool,shuf?"Full Practice Test • Shuffled":"Full Practice Test • PDF Order");
}
function startScheme(){launch(QUESTIONS.filter(q=>q.scheme),"Schemes / Policies Only");}
function startRevision(s,t){
  let pool=QUESTIONS.filter(q=>q.section===s&&(t?q.topic===t:true));
  launch(pool, false, `${s}${t?" • "+t:""}`);
}
function launch(pool,randomized,label){
  if(!pool.length)return;
  state.mode="quiz";state.pool=pool;state.index=0;state.score=0;state.correct=0;state.incorrect=0;state.skipped=0;state.answers=[];state.answered=false;state.order=randomized?"shuffle":"pdf";state.currentSetLabel=label||"Practice Set";
  setTop("Quiz in progress"); renderQuiz();
}
function renderQuiz(){
  const q=state.pool[state.index];
  const total=state.pool.length, n=state.index+1;
  $("#app").innerHTML=`<main class="main quiz-wrap">
    <div class="quiz-head">
      <div><div class="qmeta">${esc(state.currentSetLabel)}</div><div class="qnum">Question ${n} <span style="color:var(--muted);font-weight:500">/ ${total}</span></div><div class="progress"><i style="width:${pct(n,total)}%"></i></div></div>
      <div class="live-stats"><span class="pill">Score ${state.score}</span><span class="pill">✓ ${state.correct}</span><span class="pill">✕ ${state.incorrect}</span><span class="pill">Skip ${state.skipped}</span></div>
    </div>
    <section class="question-card">
      <div class="badge-row"><span class="badge">${esc(q.section)}</span><span class="badge">${esc(q.topic)}</span><span class="badge">${esc(q.difficulty)}</span>${q.scheme?'<span class="badge scheme">Scheme / Policy</span>':''}</div>
      <div class="qtext">${esc(q.question)}</div>
      <div class="options">${q.options.map((o,i)=>`<button class="opt" data-opt="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="feedback"></div>
    </section>
    <div class="quiz-footer">
      <button class="btn ghost" id="skipBtn">Skip</button>
      <button class="btn primary" id="nextBtn" disabled>${n===total?"Finish Test":"Next Question →"}</button>
    </div>
    <div class="footer-note">Source location: PDF page ${q.page}. ${esc("Primary source: GA Capsule \u2013 1st\u201315th July, MockMentor (47-page PDF). All question facts, figures, dates, names, organisations, scheme details and explanations are derived from the attached PDF. No external web source or outside current-affairs fact is used in the question bank. ")}</div>
  </main>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerQuestion(+b.dataset.opt));
  $("#skipBtn").onclick=skipQuestion;
  $("#nextBtn").onclick=nextQuestion;
}
function answerQuestion(i){
  if(state.answered)return;
  state.answered=true;
  const q=state.pool[state.index], ai=answerIndex(q);
  document.querySelectorAll(".opt").forEach((b,idx)=>{
    b.classList.add("locked");
    if(idx===ai)b.classList.add("correct");
    if(idx===i && idx!==ai)b.classList.add("wrong");
  });
  if(i===ai){state.score++;state.correct++;$("#feedback").innerHTML=`<div class="feedback good">Correct ✓</div><div class="explain">${esc(q.explanation)}</div>`;}
  else {state.incorrect++;$("#feedback").innerHTML=`<div class="feedback bad">Incorrect ✕ · Correct answer: ${q.answer}</div><div class="explain">${esc(q.explanation)}</div>`;}
  state.answers.push({id:q.id,status:i===ai?"correct":"incorrect",user:i});
  $("#nextBtn").disabled=false;$("#skipBtn").disabled=true;
  refreshLive();
}
function skipQuestion(){
  if(state.answered)return;
  state.answered=true;state.skipped++;
  const q=state.pool[state.index], ai=answerIndex(q);
  document.querySelectorAll(".opt").forEach((b,idx)=>{b.classList.add("locked");if(idx===ai)b.classList.add("correct");});
  $("#feedback").innerHTML=`<div class="feedback skip">Skipped · Correct answer: ${q.answer}</div><div class="explain">${esc(q.explanation)}</div>`;
  state.answers.push({id:q.id,status:"skipped",user:null});
  $("#nextBtn").disabled=false;$("#skipBtn").disabled=true;refreshLive();
}
function refreshLive(){
  const pills=document.querySelectorAll(".live-stats .pill");
  if(pills.length>=4){pills[0].textContent="Score "+state.score;pills[1].textContent="✓ "+state.correct;pills[2].textContent="✕ "+state.incorrect;pills[3].textContent="Skip "+state.skipped;}
}
function nextQuestion(){
  if(!state.answered)return;
  if(state.index>=state.pool.length-1){showResults();return;}
  state.index++;state.answered=false;renderQuiz();
}
function showResults(){
  state.mode="results";setTop("Results & Review");
  const total=state.pool.length, pctScore=pct(state.score,total);
  const byDiff={};["Easy","Moderate","Hard"].forEach(d=>{const a=state.pool.filter(q=>q.difficulty===d), ids=new Set(a.map(q=>q.id));const correct=state.answers.filter(x=>ids.has(x.id)&&x.status==="correct").length;byDiff[d]={n:a.length,correct};});
  const topicMap={};
  state.pool.forEach(q=>{const k=q.topic;if(!topicMap[k])topicMap[k]={n:0,c:0};topicMap[k].n++;const a=state.answers.find(x=>x.id===q.id);if(a&&a.status==="correct")topicMap[k].c++;});
  const reviews=state.answers.filter(a=>a.status!=="correct").map(a=>state.pool.find(q=>q.id===a.id)).filter(Boolean);
  $("#app").innerHTML=`<main class="main">
    <section class="hero-card">
      <div class="kicker">Test complete</div><h1 style="font-size:38px">Performance Analysis</h1>
      <p class="lead">${esc(state.currentSetLabel)} • ${total} questions</p>
      <div class="result-grid">
        <div class="result-card"><b>${state.score}/${total}</b><small>Score</small></div>
        <div class="result-card"><b>${pctScore}%</b><small>Percentage</small></div>
        <div class="result-card"><b>${state.correct}</b><small>Correct</small></div>
        <div class="result-card"><b>${state.incorrect}</b><small>Incorrect · ${state.skipped} skipped</small></div>
      </div>
      <div class="quiz-footer"><button class="btn primary" id="retry">Retry Same Set</button><button class="btn" id="menu">Back to Menu</button></div>
    </section>
    <section class="panel"><h2 style="margin-top:0">Difficulty Performance</h2>
      ${["Easy","Moderate","Hard"].map(d=>`<div class="bar-row"><span>${d}</span><div class="bar"><i style="width:${pct(byDiff[d].correct,byDiff[d].n)}%"></i></div><b>${pct(byDiff[d].correct,byDiff[d].n)}%</b></div>`).join("")}
    </section>
    <section class="panel"><h2 style="margin-top:0">Topic Performance</h2>
      ${Object.entries(topicMap).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar"><i style="width:${pct(v.c,v.n)}%"></i></div><b>${pct(v.c,v.n)}%</b></div>`).join("")}
    </section>
    <section class="panel"><h2 style="margin-top:0">Review Incorrect & Skipped</h2>
      ${reviews.length?reviews.map(q=>{const a=state.answers.find(x=>x.id===q.id);const ua=a.user==null?"Skipped":q.options[a.user];return `<div class="review"><h4>Q${q.id}. ${esc(q.question)}</h4><div class="small"><b>User:</b> ${esc(ua)}<br><b>Correct:</b> ${esc(q.answer)} — ${esc(q.options[answerIndex(q)])}<br><b>Topic:</b> ${esc(q.topic)} • <b>Difficulty:</b> ${q.difficulty} • <b>PDF p.</b> ${q.page}<br><b>Explanation:</b> ${esc(q.explanation)}</div></div>`}).join(""):'<div class="empty">No incorrect or skipped questions. Excellent work.</div>'}
    </section>
    <div class="footer-note">${esc("Primary source: GA Capsule \u2013 1st\u201315th July, MockMentor (47-page PDF). All question facts, figures, dates, names, organisations, scheme details and explanations are derived from the attached PDF. No external web source or outside current-affairs fact is used in the question bank. ")}</div>
  </main>`;
  $("#retry").onclick=()=>{let p=[...state.pool];if(state.order==="shuffle")p=shuffle(p);launch(p,state.order==="shuffle",state.currentSetLabel);};
  $("#menu").onclick=showMenu;
}

$("#backBtn").onclick=()=>{if(state.mode==="quiz"||state.mode==="results")showMenu();};
showMenu();
</script>
</body>
</html>
