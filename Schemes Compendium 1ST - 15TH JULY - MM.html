<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABARD Grade A — Scheme Compendium Practice Test</title>
<style>
  :root{
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --surface-2: #F7F8FA;
    --ink: #17233A;
    --ink-soft: #52607A;
    --ink-faint: #8993A6;
    --line: #DDE2E9;
    --accent: #A9791F;
    --accent-deep: #83600F;
    --accent-tint: #F4ECDA;
    --teal: #2A6B63;
    --teal-tint: #E4F0EE;
    --good: #24793F;
    --good-tint: #E4F5E9;
    --bad: #B03A2E;
    --bad-tint: #FBEAE8;
    --radius: 10px;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --shadow: 0 1px 2px rgba(23,35,58,0.06), 0 6px 20px rgba(23,35,58,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:900px; margin:0 auto; padding:28px 20px 80px; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:26px;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; cursor:pointer; }
  .brand .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent-deep); font-weight:700;
  }
  .brand h1{
    font-family:var(--serif); font-size:22px; margin:0; font-weight:700; color:var(--ink);
    letter-spacing:-0.01em;
  }
  .topbar-meta{ font-size:12px; color:var(--ink-faint); text-align:right; line-height:1.5; }

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .pad{ padding:26px; }

  /* ---------- Home ---------- */
  .hero{
    padding:34px 30px;
    margin-bottom:22px;
    background:linear-gradient(155deg,#17233A 0%, #223252 68%, #2b3d63 100%);
    color:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .hero::after{
    content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px;
    border-radius:50%; background:radial-gradient(circle, rgba(169,121,31,0.35), transparent 70%);
  }
  .hero .eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#D9C48E; font-weight:700; }
  .hero h2{ font-family:var(--serif); font-size:28px; margin:8px 0 10px; line-height:1.25; max-width:520px; }
  .hero p{ margin:0; color:#C6CEDE; font-size:14.5px; max-width:480px; line-height:1.6; }
  .hero-stats{ display:flex; gap:26px; margin-top:22px; flex-wrap:wrap; }
  .hero-stat b{ font-family:var(--serif); font-size:22px; display:block; color:#fff; }
  .hero-stat span{ font-size:11.5px; color:#AEB9CC; text-transform:uppercase; letter-spacing:.06em; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media (max-width:640px){ .mode-grid{ grid-template-columns:1fr; } }
  .mode-card{
    padding:24px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .mode-card:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .mode-card .icon-badge{
    width:42px; height:42px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    background:var(--accent-tint); color:var(--accent-deep); font-size:20px; margin-bottom:14px; font-weight:700;
    font-family:var(--serif);
  }
  .mode-card h3{ font-family:var(--serif); font-size:19px; margin:0 0 6px; }
  .mode-card p{ font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin:0; }
  .mode-card .go{ margin-top:14px; font-size:12.5px; font-weight:700; color:var(--accent-deep); letter-spacing:.02em; }

  /* ---------- Setup screens ---------- */
  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft);
    cursor:pointer; margin-bottom:18px; font-weight:600; user-select:none;
  }
  .back-link:hover{ color:var(--accent-deep); }

  .toggle-row{
    display:flex; gap:10px; margin:18px 0 24px;
  }
  .toggle-btn{
    flex:1; padding:14px 16px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--surface-2); cursor:pointer; text-align:left; transition:all .15s ease;
  }
  .toggle-btn b{ display:block; font-size:14.5px; margin-bottom:3px; color:var(--ink); }
  .toggle-btn span{ font-size:12px; color:var(--ink-soft); }
  .toggle-btn.active{ border-color:var(--accent); background:var(--accent-tint); }
  .toggle-btn.active b{ color:var(--accent-deep); }

  .primary-btn{
    background:var(--ink); color:#fff; border:none; padding:14px 22px; border-radius:9px;
    font-size:14.5px; font-weight:700; cursor:pointer; letter-spacing:.01em;
    transition:background .15s ease, transform .1s ease;
  }
  .primary-btn:hover{ background:#243453; }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn.gold{ background:var(--accent-deep); }
  .primary-btn.gold:hover{ background:#6f5209; }
  .secondary-btn{
    background:transparent; color:var(--ink); border:1.5px solid var(--line); padding:13px 20px;
    border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .secondary-btn:hover{ border-color:var(--ink-soft); }
  .btn-row{ display:flex; gap:12px; flex-wrap:wrap; }

  /* ---------- Section grid ---------- */
  .sec-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .sec-grid{ grid-template-columns:1fr; } }
  .sec-card{
    padding:18px 20px; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    gap:12px; transition:all .15s ease;
  }
  .sec-card:hover{ border-color:var(--teal); transform:translateY(-1px); }
  .sec-card .name{ font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.35; }
  .sec-count{
    flex-shrink:0; background:var(--teal-tint); color:var(--teal); font-weight:800; font-size:13px;
    padding:6px 11px; border-radius:20px; white-space:nowrap;
  }

  /* ---------- Quiz screen ---------- */
  .quiz-head{ margin-bottom:18px; }
  .quiz-top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .quiz-tag{ font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--teal); }
  .quiz-score{ font-size:13px; font-weight:700; color:var(--ink); background:var(--surface-2); padding:6px 12px; border-radius:20px; border:1px solid var(--line); }
  .progress-track{ height:7px; background:var(--line); border-radius:6px; overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--teal)); transition:width .3s ease; }
  .progress-caption{ font-size:12px; color:var(--ink-faint); margin-top:6px; display:flex; justify-content:space-between; }

  .q-card{ padding:26px 26px 22px; }
  .q-meta-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .pill{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:4px 10px; border-radius:20px; }
  .pill.diff-Easy{ background:#E4F5E9; color:var(--good); }
  .pill.diff-Moderate{ background:#FDF3DE; color:#8A6212; }
  .pill.diff-Hard{ background:var(--bad-tint); color:var(--bad); }
  .pill.section{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }
  .pill.qtype{ background:#EAE7F7; color:#4B3F91; }

  .q-text{ font-family:var(--serif); font-size:18px; line-height:1.55; margin:0 0 20px; color:var(--ink); white-space:pre-line; }

  .opt-list{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    display:flex; align-items:flex-start; gap:12px; padding:13px 15px; border-radius:9px;
    border:1.5px solid var(--line); cursor:pointer; background:var(--surface); transition:all .12s ease;
    font-size:14px; line-height:1.5;
  }
  .opt:hover:not(.locked){ border-color:var(--accent); background:var(--accent-tint); }
  .opt .letter{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px;
    color:var(--ink-soft); border:1.5px solid var(--line);
  }
  .opt.correct{ border-color:var(--good); background:var(--good-tint); }
  .opt.correct .letter{ background:var(--good); border-color:var(--good); color:#fff; }
  .opt.wrong{ border-color:var(--bad); background:var(--bad-tint); }
  .opt.wrong .letter{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .opt.locked{ cursor:default; }
  .opt.dim{ opacity:.55; }

  .feedback-box{
    margin-top:18px; padding:14px 16px; border-radius:9px; font-size:13.5px; line-height:1.6;
    border-left:4px solid var(--teal); background:var(--teal-tint); color:#1D4A44;
  }
  .feedback-box.wrongfb{ border-left-color:var(--bad); background:var(--bad-tint); color:#7A2A21; }
  .feedback-box.skipfb{ border-left-color:var(--ink-faint); background:var(--surface-2); color:var(--ink-soft); }
  .feedback-box b{ display:block; margin-bottom:3px; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; }

  .q-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; }
  .skip-btn{
    background:transparent; border:1.5px dashed var(--ink-faint); color:var(--ink-soft);
    padding:11px 18px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .skip-btn:hover{ border-color:var(--ink-soft); color:var(--ink); }

  /* ---------- Results ---------- */
  .result-hero{
    text-align:center; padding:36px 24px;
    background:linear-gradient(155deg,#17233A 0%, #223252 100%); color:#fff; border-radius:var(--radius);
    margin-bottom:20px;
  }
  .result-hero .eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#D9C48E; font-weight:700; }
  .result-score{ font-family:var(--serif); font-size:52px; margin:10px 0 4px; }
  .result-sub{ color:#C6CEDE; font-size:14px; }

  .diff-breakdown{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px; }
  @media (max-width:560px){ .diff-breakdown{ grid-template-columns:1fr; } }
  .diff-box{ padding:16px 18px; text-align:center; }
  .diff-box .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700; margin-bottom:6px; }
  .diff-box .val{ font-family:var(--serif); font-size:24px; color:var(--ink); }
  .diff-box .sub{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  .review-section h3{ font-family:var(--serif); font-size:17px; margin:26px 0 12px; }
  .review-item{ padding:16px 18px; margin-bottom:10px; }
  .review-item .rq{ font-size:14px; font-weight:700; margin-bottom:8px; line-height:1.5; white-space:pre-line;}
  .review-item .ra-row{ font-size:13px; margin-bottom:3px; line-height:1.55; }
  .review-item .ra-row.your{ color:var(--bad); }
  .review-item .ra-row.correctans{ color:var(--good); font-weight:700; }
  .review-item .rexp{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; padding-top:8px; border-top:1px dashed var(--line); line-height:1.6; }
  .review-item .rtag{ display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; padding:2px 8px; border-radius:12px; margin-bottom:8px; }
  .review-item .rtag.skip{ background:var(--surface-2); color:var(--ink-faint); }
  .review-item .rtag.wrongtag{ background:var(--bad-tint); color:var(--bad); }

  .empty-note{ font-size:13.5px; color:var(--ink-faint); padding:20px; text-align:center; }

  footer.note{ text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:36px; }

  @media (max-width:480px){
    .hero h2{ font-size:22px; }
    .q-text{ font-size:16.5px; }
    #app{ padding:18px 14px 60px; }
  }
</style>
</head>

lerated Irrigation Benefit Programme, focused on fast-tracking major/medium irrigation projects."}, {"id": 63, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Hard", "type": "mcq", "question": "What has been the central assistance provided under AIBP since 2016-17?", "options": ["₹12,432.09 crore", "₹1,600 crore", "₹6,587 crore", "₹21,023 crore", "₹93,068.56 crore"], "correct": 3, "explanation": "Central assistance under AIBP since 2016-17 stands at ₹21,023 crore."}, {"id": 64, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Hard", "type": "mcq", "question": "What is M-CADWM, launched in 2025-26 as a sub-scheme of AIBP, and what is its initial outlay?", "options": ["Micro-Canal and Drip Water Management; ₹2,000 crore", "Modern Aquifer Development and Water Mapping; ₹1,200 crore", "Modernization of Command Area Development and Water Management; ₹2,500 crore", "Minor Command Area Water Distribution Mission; ₹1,600 crore", "Modernization of Command Area Development and Water Management; ₹1,600 crore"], "correct": 4, "explanation": "M-CADWM (Modernization of Command Area Development and Water Management) was launched in 2025-26 with an initial outlay of ₹1,600 crore."}, {"id": 65, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Moderate", "type": "mcq", "question": "What does HKKP, a component of PMKSY, stand for?", "options": ["Har Khet Ko Pani", "Har Ghar Ko Pani", "Har Kisan Ko Pani", "Har Khet Ko Poshan", "Har Khet Ki Nigrani"], "correct": 0, "explanation": "HKKP stands for Har Khet Ko Pani, aimed at creating new water sources through minor irrigation."}, {"id": 66, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Hard", "type": "mcq", "question": "How many Surface Minor Irrigation (SMI) and Repair, Renovation & Restoration (RRR) schemes has HKKP completed?", "options": ["2,462", "3,462", "4,462", "3,000", "5,000"], "correct": 1, "explanation": "HKKP has completed 3,462 SMI and RRR schemes."}, {"id": 67, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Hard", "type": "mcq", "question": "What has been the central assistance provided for Watershed Development under PMKSY since 2016-17?", "options": ["₹21,023 crore", "₹1,600 crore", "₹12,432.09 crore", "₹6,587 crore", "₹9,432.09 crore"], "correct": 2, "explanation": "Central assistance for Watershed Development since 2016-17 is ₹12,432.09 crore."}, {"id": 68, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Moderate", "type": "mcq", "question": "What does PDMC, a component of PMKSY, stand for?", "options": ["Precision Drainage and Micro-Canal", "Pressurized Drip Micro-irrigation Chain", "Public Distribution of Micro-irrigation Components", "Per Drop More Crop", "Per District Micro-irrigation Coverage"], "correct": 3, "explanation": "PDMC stands for Per Drop More Crop, promoting micro-irrigation technologies like drip and sprinkler systems."}, {"id": 69, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Hard", "type": "mcq", "question": "Since 2022-23, PDMC has been merged under which scheme?", "options": ["Rashtriya Krishi Vikas Yojana (RKVY-RAFTAR)", "Sub-Mission on Agricultural Mechanization (SMAM)", "National Mission on Sustainable Agriculture", "Pradhan Mantri Fasal Bima Yojana", "Pradhan Mantri Krishi Vikas Yojana (PM-RKVY)"], "correct": 4, "explanation": "From 2022-23 onwards, PDMC has been merged under Pradhan Mantri Krishi Vikas Yojana (PM-RKVY)."}, {"id": 70, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Hard", "type": "mcq", "question": "Under PDMC, what is the financial assistance percentage for small and marginal farmers versus other farmers?", "options": ["55% for small/marginal farmers, 45% for other farmers", "50% for small/marginal, 50% for others", "60% for small/marginal, 40% for others", "40% for small/marginal, 50% for others", "45% for small/marginal, 55% for others"], "correct": 0, "explanation": "Financial assistance under PDMC is 55% for small and marginal farmers and 45% for other farmers."}, {"id": 71, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Moderate", "type": "mcq", "question": "PDMC's micro-irrigation initiatives are supported by the Micro Irrigation Fund maintained under which institution?", "options": ["Small Industries Development Bank of India (SIDBI)", "National Bank for Agriculture and Rural Development (NABARD)", "National Minorities Development & Finance Corporation (NMDFC)", "National Small Industries Corporation (NSIC)", "Reserve Bank of India (RBI)"], "correct": 1, "explanation": "The Micro Irrigation Fund supporting PDMC is maintained under NABARD."}, {"id": 72, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Moderate", "type": "mcq", "question": "PMKSY is covered under which ministry as per the document?", "options": ["Ministry of Jal Shakti", "Ministry of Rural Development", "Ministry of Agriculture & Farmers Welfare", "Ministry of Environment, Forest and Climate Change", "Ministry of Water Resources"], "correct": 2, "explanation": "The document notes PMKSY is also covered under the Ministry of Agriculture & Farmers Welfare."}, {"id": 73, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about PMKSY is NOT correct?", "options": ["PMKSY was launched on 1 July 2015 with the vision of 'Per Drop More Crop'", "The scheme's continuation for 2021-26 was approved with an outlay of ₹93,068.56 crore", "AIBP has provided central assistance of ₹21,023 crore since 2016-17", "PDMC provides 45% financial assistance to small/marginal farmers and 55% to other farmers", "PDMC has been merged under PM-RKVY from 2022-23 onwards"], "correct": 3, "explanation": "The assistance split is reversed in this trap — it is actually 55% for small/marginal farmers and 45% for other farmers, not the other way round."}, {"id": 74, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about PMKSY:\n\nI. PMKSY was launched on 1 July 2016.\nII. More than 27 million farmers have benefited from PMKSY as of August 2025.\nIII. PMKSY's Union Budget 2026-27 allocation is ₹21,023 crore.\nIV. Under PDMC, small and marginal farmers receive 45% financial assistance.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 0, "explanation": "Only statement II is correct. PMKSY was actually launched on 1 July 2015 (not 2016); its Budget 2026-27 allocation is ₹6,587 crore (₹21,023 crore is AIBP's cumulative central assistance since 2016-17); and PDMC gives 55% assistance to small/marginal farmers, not 45%."}, {"id": 75, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Easy", "type": "mcq", "question": "When did the Employees' Provident Funds Scheme, 2026 come into force?", "options": ["1 July 2026", "4 July 2026", "18 October 2026", "1 April 2026", "29 June 2026"], "correct": 4, "explanation": "The EPF Scheme, 2026 came into force on 29 June 2026, replacing the scheme in operation since 1952."}, {"id": 76, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "The Employees' Provident Funds Scheme, 2026 replaced the earlier scheme that had been in operation since:", "options": ["1952", "1961", "1948", "1972", "1955"], "correct": 0, "explanation": "The new scheme replaces the earlier EPF scheme operational since 1952."}, {"id": 77, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "Under the EPF Scheme, 2026, what remains the statutory contribution rate for both employer and employee?", "options": ["10% of wages (8% in specified establishments)", "12% of wages (10% in specified establishments)", "15% of wages (12% in specified establishments)", "12% of wages only for employer", "12% of wages (12% in specified establishments)"], "correct": 1, "explanation": "The statutory contribution rate remains unchanged at 12% (10% in specified establishments)."}, {"id": 78, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "What is the statutory wage ceiling that remains unchanged under the EPF Scheme, 2026?", "options": ["₹18,000 per month", "₹21,000 per month", "₹15,000 per month", "₹12,000 per month", "₹25,000 per month"], "correct": 2, "explanation": "The statutory wage ceiling remains ₹15,000 per month."}, {"id": 79, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "What is the minimum monthly contribution required each from employee and employer, based on the statutory wage ceiling?", "options": ["₹1,500 each", "₹2,000 each", "₹1,200 each", "₹1,800 each", "₹2,500 each"], "correct": 3, "explanation": "The minimum monthly contribution is ₹1,800 each from employee and employer, based on the ₹15,000 statutory ceiling at 12%."}, {"id": 80, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "The EPF Scheme, 2026 expressly allows contributions above the statutory rate and on wages exceeding ₹15,000. However, contributions beyond the wage ceiling require:", "options": ["Prior approval of the EPFO Commissioner", "A minimum of 5 years of service", "Written consent of the trade union", "Approval of the Ministry of Labour", "Mutual agreement between employer and employee"], "correct": 4, "explanation": "Contributions beyond the statutory wage ceiling require mutual agreement between employer and employee; employees cannot insist on higher contributions unilaterally."}, {"id": 81, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "Employer contributions to EPF, NPS and superannuation funds remain tax-exempt up to an aggregate limit of:", "options": ["₹7.5 lakh per year", "₹5 lakh per year", "₹10 lakh per year", "₹2.5 lakh per year", "₹1 lakh per year"], "correct": 0, "explanation": "Employer contributions to EPF, NPS and superannuation funds remain tax-exempt up to an aggregate limit of ₹7.5 lakh per year."}, {"id": 82, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "The earlier EPF scheme had how many separate provisions for partial withdrawals, which the 2026 scheme has consolidated?", "options": ["10", "13", "15", "8", "12"], "correct": 1, "explanation": "The earlier scheme had 13 separate provisions for partial withdrawals; the new scheme consolidates them into 3 broad categories."}, {"id": 83, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "The EPF Scheme, 2026 consolidates partial withdrawal provisions into how many broad categories?", "options": ["Two: Essential needs and Housing needs", "Four: Essential, Housing, Education, and Marriage needs", "Three: Essential needs, Housing needs, Special circumstances", "Five categories", "Three: Medical, Housing, and Education needs"], "correct": 2, "explanation": "The new scheme consolidates 13 provisions into three broad categories: Essential needs, Housing needs, and Special circumstances."}, {"id": 84, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "What is the uniform service-eligibility period for partial withdrawals under the EPF Scheme, 2026?", "options": ["6 months", "24 months", "18 months", "12 months", "36 months"], "correct": 3, "explanation": "The new scheme reduces the uniform service-eligibility period for partial withdrawals to 12 months."}, {"id": 85, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "Under the EPF Scheme, 2026, how many partial withdrawals are permitted for education purposes (over and above previous advances)?", "options": ["Up to 5", "Up to 8", "Up to 13", "Up to 3", "Up to 10"], "correct": 4, "explanation": "Up to 10 withdrawals are permitted for education."}, {"id": 86, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "Under the EPF Scheme, 2026, how many withdrawals each are permitted for marriage and housing purposes?", "options": ["Five each", "Ten each", "Three each", "Two each", "Seven each"], "correct": 0, "explanation": "Five withdrawals each are permitted for marriage and housing."}, {"id": 87, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "Under the EPF Scheme, 2026, how many withdrawals per financial year are permitted under Special Circumstances?", "options": ["Five", "Two", "One", "Three", "Ten"], "correct": 1, "explanation": "Two withdrawals per financial year are permitted under Special Circumstances."}, {"id": 88, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "What is the Minimum Balance Retention Rule introduced under the EPF Scheme, 2026?", "options": ["Members must retain at least 50% of the aggregate PF balance after any partial withdrawal", "Members must retain at least 10% of the aggregate PF balance after any partial withdrawal", "Members must retain at least 25% of the aggregate PF balance after any partial withdrawal", "Members must retain at least 30% of the last drawn wages as balance", "There is no minimum balance retention requirement"], "correct": 2, "explanation": "Members must retain at least 25% of the aggregate PF balance after any partial withdrawal — a universal rule unlike the earlier purpose-based limits."}, {"id": 89, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "Under the earlier EPF scheme, full withdrawal was possible after how many months of continuous unemployment?", "options": ["6 months", "12 months", "3 months", "2 months", "1 month"], "correct": 3, "explanation": "Earlier, full withdrawal was possible after 2 months of continuous unemployment."}, {"id": 90, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "Under the EPF Scheme, 2026, what percentage of PF balance can be withdrawn during unemployment, with the remainder withdrawable only after 12 months?", "options": ["Up to 50%", "Up to 100%", "Up to 60%", "Up to 90%", "Up to 75%"], "correct": 4, "explanation": "Under the new scheme, up to 75% can be withdrawn during unemployment, with the remaining balance withdrawable only after 12 months of continuous unemployment."}, {"id": 91, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "Under the EPF Scheme, 2026, within how many days must EPFO process claims or communicate deficiencies (as per the two prescribed timelines)?", "options": ["3 days or 20 days, depending on the case", "5 days or 30 days, depending on the case", "7 days or 15 days, depending on the case", "10 days uniformly", "2 days or 25 days, depending on the case"], "correct": 0, "explanation": "EPFO must process claims or communicate deficiencies within 3 days or 20 days depending on the case, with interest liability for delays."}, {"id": 92, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Easy", "type": "mcq", "question": "Which of the following remains UNCHANGED under the EPF Scheme, 2026?", "options": ["The withdrawal provision categories (13 to 3)", "Portability through Universal Account Number (UAN)", "The minimum balance retention rule after withdrawal", "The waiting period for full withdrawal after job loss", "The number of permissible education withdrawals"], "correct": 1, "explanation": "Portability through UAN, nomination facility, EPF interest rate, and retirement age remain unchanged under the new scheme."}, {"id": 93, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "Under the EPF Scheme, 2026, why might earlier nominations lapse?", "options": ["If the member changes jobs", "If the member's wage exceeds ₹15,000", "If they conflict with the provisions of the new scheme", "If the employer changes ownership", "If the member does not withdraw funds for 5 years"], "correct": 2, "explanation": "Earlier nominations may lapse if they conflict with the new scheme, requiring members to file fresh nominations where required."}, {"id": 94, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about the Employees' Provident Funds Scheme, 2026 is NOT correct?", "options": ["The scheme came into force on 29 June 2026, replacing the scheme in force since 1952", "The statutory contribution rate of 12% (10% in specified establishments) remains unchanged", "Partial withdrawal provisions have been consolidated from 13 into three broad categories", "Under the new scheme, full withdrawal after job loss is now permitted after just 1 month of unemployment", "Members must retain at least 25% of their aggregate PF balance after a partial withdrawal"], "correct": 3, "explanation": "The waiting period for full withdrawal has actually been extended, not shortened — up to 75% can be withdrawn during unemployment, with the remainder available only after 12 months, compared to full withdrawal after 2 months earlier."}, {"id": 95, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about the EPF Scheme, 2026:\n\nI. The statutory wage ceiling remains unchanged at ₹15,000 per month.\nII. The scheme consolidates 13 partial withdrawal provisions into three broad categories.\nIII. Up to 10 withdrawals are permitted for education, and five each for marriage and housing.\nIV. Employer contributions to EPF, NPS and superannuation funds are tax-exempt up to ₹10 lakh per year.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 2, "explanation": "Statement IV is incorrect — the tax-exempt aggregate limit is ₹7.5 lakh per year, not ₹10 lakh. I, II and III are correct."}, {"id": 96, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about the EPF Scheme, 2026:\n\nI. The scheme came into force on 29 June 2026.\nII. The statutory contribution rate has been increased to 15% of wages.\nIII. Members must retain at least 50% of their aggregate PF balance after a partial withdrawal.\nIV. Portability through the Universal Account Number (UAN) remains unchanged.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 1, "explanation": "Statements I and IV are correct. Statement II is wrong as the contribution rate remains 12% (10% for specified establishments); Statement III is wrong as the minimum balance retention is 25%, not 50%."}, {"id": 97, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Easy", "type": "stmt", "question": "Consider the following statements about what remains UNCHANGED under the EPF Scheme, 2026:\n\nI. The statutory contribution rate of 12% (10% for specified establishments).\nII. The statutory wage ceiling of ₹15,000 per month.\nIII. Portability through UAN and the nomination facility.\nIV. The withdrawal category structure of 13 separate provisions.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 2, "explanation": "Statement IV is incorrect — the 13 withdrawal provisions have been consolidated into 3 categories under the new scheme, so this has changed. I, II and III correctly remain unchanged."}, {"id": 98, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "The EPFO Amnesty Scheme, 2026 is introduced under which ministry?", "options": ["Ministry of Finance", "Ministry of Corporate Affairs", "Ministry of Skill Development and Entrepreneurship", "Ministry of MSME", "Ministry of Labour and Employment"], "correct": 4, "explanation": "The EPFO Amnesty Scheme, 2026 has been introduced under the Ministry of Labour and Employment."}, {"id": 99, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "The EPFO Amnesty Scheme, 2026 provides a one-time opportunity for establishments operating exempted PF Trusts recognised under which Act?", "options": ["Income Tax Act, 1961", "EPF and Miscellaneous Provisions Act, 1952", "Code on Social Security, 2020", "Companies Act, 2013", "Finance Act, 2026"], "correct": 0, "explanation": "The scheme provides a one-time opportunity for establishments with PF Trusts recognised under the Income Tax Act, 1961 to regularise their status."}, {"id": 100, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "Which legislative Act aligned the Income Tax framework governing recognised provident funds with the EPF & MP Act, 1952?", "options": ["The Code on Social Security, 2020", "The Finance Act, 2026", "The Income Tax Act, 1961", "The Companies (Amendment) Act, 2026", "The Labour Codes Act, 2025"], "correct": 1, "explanation": "The Finance Act, 2026 aligned the Income Tax framework for recognised provident funds with the EPF & MP Act, 1952."}, {"id": 101, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "Under the new alignment, recognition under the Income Tax Act is now available only to provident funds that have obtained exemption under which section of the EPF & MP Act, 1952?", "options": ["Section 143", "Section 7A", "Section 17", "Section 6", "Section 36"], "correct": 2, "explanation": "Recognition under the Income Tax Act is now available only to funds exempted under Section 17 of the EPF & MP Act, 1952."}, {"id": 102, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Hard", "type": "mcq", "question": "The EPFO Amnesty Scheme grants retrospective exemption under Section 17 of the EPF & MP Act, 1952 and which section of the Code on Social Security, 2020?", "options": ["Section 17", "Section 7A", "Section 36", "Section 143", "Section 45"], "correct": 3, "explanation": "The Amnesty Scheme grants retrospective exemption under Section 17 of the EPF&MP Act, 1952 and Section 143 of the Code on Social Security, 2020."}, {"id": 103, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "For how long is the EPFO Amnesty Scheme, 2026 open from the date of notification?", "options": ["Three months", "One year", "Twelve months", "Nine months", "Six months"], "correct": 4, "explanation": "The scheme is open for six months from the date of notification."}, {"id": 104, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "The EPFO Amnesty Scheme applies to establishments that have been operating a Provident Fund Trust recognised under the Income Tax Act but:", "options": ["Do not possess a formal exemption notification from the appropriate Government", "Have not filed income tax returns for 3 years", "Have not registered on the Udyam portal", "Have defaulted on statutory PF contributions", "Have more than 500 employees"], "correct": 0, "explanation": "The scheme applies to establishments lacking a formal exemption notification from the Central or State Government."}, {"id": 105, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "Under the EPFO Amnesty Scheme, Category-I establishments are those seeking retrospective trust regularisation that:", "options": ["Choose to continue operating as exempted establishments under the Code on Social Security, 2020", "Have already started compliance as un-exempted, or are opting for prospective compliance as un-exempted", "Have more than ₹3 crore turnover in the last 3 years", "Are registered as Section 8 companies", "Have obtained BIS certification"], "correct": 1, "explanation": "Category-I covers establishments seeking retrospective regularisation that have started or are opting for un-exempted compliance."}, {"id": 106, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "Under the EPFO Amnesty Scheme, Category-II establishments are those that choose to:", "options": ["Convert entirely into un-exempted establishments", "Shut down their PF Trusts permanently", "Continue operating as exempted establishments under the Code on Social Security, 2020", "Merge with another exempted trust", "Transfer employees to the EPFO's own scheme"], "correct": 2, "explanation": "Category-II covers establishments seeking retrospective regularisation while continuing as exempted establishments under the Code on Social Security, 2020."}, {"id": 107, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about the EPFO Amnesty Scheme, 2026 is NOT correct?", "options": ["The scheme was introduced under the Ministry of Labour and Employment", "The Finance Act, 2026 aligned the Income Tax framework with the EPF & MP Act, 1952", "The scheme grants retrospective exemption under Section 17 of the EPF & MP Act and Section 143 of the Code on Social Security, 2020", "The scheme is open indefinitely with no fixed time limit for establishments to regularise", "There are two eligible categories of establishments under the scheme"], "correct": 3, "explanation": "The scheme is explicitly time-bound — it is open for only six months from the date of notification, not indefinitely."}, {"id": 108, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about the EPFO Amnesty Scheme, 2026:\n\nI. The scheme is administered under the Ministry of Finance.\nII. It grants retrospective exemption under Section 7A of the EPF & MP Act, 1952.\nIII. The scheme is open for twelve months from the date of notification.\nIV. Category-I establishments under the scheme must continue operating as exempted establishments under the Code on Social Security, 2020.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 4, "explanation": "None of the statements are correct. The scheme is administered under the Ministry of Labour and Employment (not Finance); the retrospective exemption is granted under Section 17 (not Section 7A); the scheme is open for six months (not twelve); and it is Category-II (not Category-I) establishments that continue as exempted establishments."}, {"id": 109, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Moderate", "type": "mcq", "question": "When was the Sub-Mission on Agricultural Mechanization (SMAM) launched, and under which scheme?", "options": ["2016-17, under PMKSY", "2007, as a standalone scheme", "2017-18, under RKVY-RAFTAR", "2020-21, under PM-KISAN", "2014-15, as a Centrally Sponsored Scheme under RKVY"], "correct": 4, "explanation": "SMAM was launched in 2014-15 as a Centrally Sponsored Scheme under the Rashtriya Krishi Vikas Yojana (RKVY)."}, {"id": 110, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Easy", "type": "mcq", "question": "SMAM aims to \"reach the unreached\" by extending mechanization benefits to which groups (among others)?", "options": ["Small and marginal farmers, women, SC, ST, FPOs, SHGs, and rural entrepreneurs", "Only large commercial farmers", "Only agri-business corporations", "Only state government cooperatives", "Only urban entrepreneurs"], "correct": 0, "explanation": "SMAM extends mechanization benefits to small/marginal farmers, women, SC, ST, FPOs, SHGs, and rural entrepreneurs."}, {"id": 111, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Moderate", "type": "mcq", "question": "When was the Rashtriya Krishi Vikas Yojana (RKVY), under which SMAM operates, originally launched?", "options": ["2014", "2007", "2016", "2017", "2020"], "correct": 1, "explanation": "RKVY was launched in 2007 to incentivize States to increase public investment in agriculture."}, {"id": 112, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Moderate", "type": "mcq", "question": "RKVY was restructured in 2017-18 as which programme?", "options": ["RKVY-SMAM", "PM-RKVY", "RKVY-RAFTAR (Remunerative Approaches for Agriculture and Allied Sector Rejuvenation)", "RKVY-PDMC", "National Agriculture Mechanization Mission"], "correct": 2, "explanation": "RKVY was restructured in 2017-18 as RKVY-RAFTAR with a greater focus on pre- and post-harvest infrastructure."}, {"id": 113, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Hard", "type": "mcq", "question": "Under SMAM, what is the subsidy percentage of machine cost provided for general beneficiaries via DBT?", "options": ["50%", ": "mcq", "question": "Under SMAM's drone support, what financial assistance is provided to Agriculture Graduates establishing Rental Custom Hiring Centres?", "options": ["40% assistance, up to ₹4 lakh", "50% assistance, up to ₹5 lakh", "100% assistance, up to ₹10 lakh", "75% grant", "60% assistance, up to ₹6 lakh"], "correct": 1, "explanation": "Agriculture Graduates establishing Rental CHCs receive 50% assistance up to ₹5 lakh for drones."}, {"id": 122, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Hard", "type": "mcq", "question": "Under SMAM's drone support for individual ownership, what is the assistance for small/marginal farmers, SC/ST, women farmers, and farmers from NE States?", "options": ["40% assistance, up to ₹4 lakh", "60% assistance, up to ₹6 lakh", "50% assistance, up to ₹5 lakh", "100% assistance, up to ₹10 lakh", "45% assistance, up to ₹4.5 lakh"], "correct": 2, "explanation": "These categories receive 50% assistance up to ₹5 lakh for individual drone ownership."}, {"id": 123, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Hard", "type": "mcq", "question": "Under SMAM's drone support, ICAR institutes, KVKs, and State Agricultural Universities receive what level of support per drone?", "options": ["75% grant", "50% assistance up to ₹5 lakh", "90% support up to ₹8 lakh per drone", "100% support up to ₹10 lakh per drone", "40% assistance up to ₹4 lakh"], "correct": 3, "explanation": "ICAR institutes, KVKs, and SAUs receive 100% support up to ₹10 lakh per drone."}, {"id": 124, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Hard", "type": "mcq", "question": "Under SMAM's drone support, what is the grant percentage available to Farmer-Producer Organizations (FPOs)?", "options": ["Up to 50%", "Up to 100%", "Up to 40%", "Up to 90%", "Up to 75%"], "correct": 4, "explanation": "FPOs are eligible for a grant of up to 75% under SMAM's drone support provisions."}, {"id 's inclusivity focus."}, {"id": 130, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about SMAM's financial assistance provisions is NOT correct?", "options": ["Farm Machinery Banks (FMBs) receive only 40% financial support, capped at ₹250 lakh", "General beneficiaries receive 40% subsidy on machine cost through DBT", "SC/ST, small/marginal, and women farmers receive an enhanced 50% subsidy", "Custom Hiring Centres receive 40% financial assistance of project cost, up to ₹250 lakh", "Small and marginal farmers receive ₹2,000 per hectare for mechanized services through CHCs, SHGs, and FPOs"], "correct": 0, "explanation": "This is reversed — FMBs actually receive 80% support for projects up to ₹30 lakh, not 40% up to ₹250 lakh (that figure applies to CHCs)."}, {"id": 131, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about SMAM's drone support component is NOT correct?", "options": ["Agriculture Graduates establishing rental CHCs receive 50% assistance up to ₹5 lakh", "ICAR institutes, KVKs, and State Agricultural Universities receive only 50% support up to ₹5 lakh per drone", "FPOs are eligible for a grant of up to 75% for drones", "A contingency expenditure of ₹6,000 per hectare is permitted for agencies using drones through service models", "CHCs, FPOs, Cooperatives and Rural Entrepreneurs receive 40% assistance up to ₹4 lakh"], "correct": 1, "explanation": "ICAR institutes, KVKs and SAUs actually receive 100% support up to ₹10 lakh per drone, the highest support tier — not 50% up to ₹5 lakh."}, {"id": 132, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Moderate", "type": "stmt", "question": "Consider the following statements about SMAM:\n\nI. SMAM was launched in 2014-15 as a Centrally Sponsored Scheme under RKVY.\nII. General beneficiaries receive a 40% subsidy on machine cost through DBT.\nIII. SC/ST, small/marginal, and women farmers receive an enhanced 50% subsidy.\nIV. In the North-Eastern Region, small machinery can receive up to 100% subsidy.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 3, "explanation": "All four statements are correct as per the document."}, {"id": 133, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Moderate", "type": "stmt", "question": "Consider the following statements about SMAM's subsidy structure for machinery procurement:\n\nI. General beneficiaries receive a 40% subsidy on machine cost.\nII. SC/ST farmers, small/marginal farmers, women farmers, and NE State beneficiaries receive 50% subsidy.\nIII. Small and marginal farmers receive ₹2,000 per hectare for mechanized services including drones.\nIV. In the North-Eastern Region, small machinery subsidy can go up to 100% with 95% support for FMBs.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 3, "explanation": "All four statements are correct as per the document."}, {"id": 134, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about SMAM's financial support provisions:\n\nI. The support cap for Custom Hiring Centres (CHCs) is ₹500 lakh.\nII. Farm Machinery Banks (FMBs) receive 40% support, capped at ₹250 lakh.\nIII. ICAR institutes, KVKs, and State Agricultural Universities receive 100% drone support up to ₹10 lakh per drone.\nIV. The contingency expenditure for agencies using drones through service models is ₹2,000 per hectare.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 0, "explanation": "Only statement III is correct. CHCs are actually capped at ₹250 lakh (not ₹500 lakh); FMBs receive 80% support up to ₹30 lakh (the 40%/₹250 lakh figures belong to CHCs); and the contingency expenditure is ₹6,000 per hectare, not ₹2,000."}, {"id": 135, "section": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "difficulty": "Easy", "type": "mcq", "question": "Who launched the Samagra Shishu Bal Swasthya Karyakram (SSBSK)?", "options": ["Union Minister for Women and Child Development", "Union Minister for Skill Development and Entrepreneurship", "Union Minister for Health and Family Welfare Shri Jagat Prakash Nadda", "Prime Minister Narendra Modi", "Union Minister for Minority Affairs"], "correct": 2, "explanation": "SSBSK was launched by Union Minister for Health and Family Welfare Shri Jagat Prakash Nadda."}, {"id": 136, "section": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "difficulty": "Moderate", "type": "mcq", "question": "SSBSK aims to provide a seamless continuum of home and community-based care from birth up to what age?", "options": ["24 months", "18 months", "48 months", "36 months", "12 months"], "correct": 3, "explanation": "SSBSK provides continuum of care from birth to 36 months of age."}, {"id": 137, "section": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "difficulty": "Moderate", "type": "mcq", "question": "What is the tagline/vision associated with SSBSK?", "options": ["\"Per Drop More Crop\"", "\"Reach the Unreached\"", "\"Swasth Shishu, Swasth Bharat\"", "\"Har Ghar Swasthya\"", "\"Pehle Teen Saal Sampoorna Dekhbhaal\" (First Three Years – Complete Care)"], "correct": 4, "explanation": "SSBSK carries forward
