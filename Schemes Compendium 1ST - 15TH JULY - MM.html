p to 9 home visits in the first 42 days.\nIII. 'At-risk' children can receive up to 8 home visits up to 36 months of age.\nIV. The approach applies uniformly to all newborns regardless of risk status.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 2, "explanation": "Statement IV is incorrect — the Risk-Stratified Approach specifically targets 'at-risk' newborns and children for intensified follow-up, not all newborns uniformly. I, II and III are correct."}, {"id": 148, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "PM VIKAS is a Central Sector Scheme of which ministry?", "options": ["Ministry of Skill Development and Entrepreneurship", "Ministry of Micro, Small and Medium Enterprises", "Ministry of Social Justice and Empowerment", "Ministry of Minority Affairs (MoMA)", "Ministry of Rural Development"], "correct": 3, "explanation": "PM VIKAS is a Central Sector Scheme of the Ministry of Minority Affairs (MoMA)."}, {"id": 149, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "PM VIKAS converges how many erstwhile schemes?", "options": ["Four", "Six", "Three", "Seven", "Five"], "correct": 4, "explanation": "PM VIKAS converges five erstwhile schemes: Seekho Aur Kamao, Nai Manzil, Nai Roshni, USTTAD, and Hamari Dharohar."}, {"id": 150, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "Which of the following is NOT one of the five schemes converged under PM VIKAS?", "options": ["PM-RKVY", "Seekho Aur Kamao", "Nai Manzil", "USTTAD", "Hamari Dharohar"], "correct": 0, "explanation": "PM-RKVY is unrelated to PM VIKAS; it is linked to PDMC under PMKSY. The five converged schemes are Seekho Aur Kamao, Nai Manzil, Nai Roshni, USTTAD, and Hamari Dharohar."}, {"id": 151, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "PM VIKAS focuses on the upliftment of how many notified minority communities?", "options": ["Five communities excluding Jains", "Six — Buddhists, Christians, Muslims, Jains, Parsis, and Sikhs", "Four communities only", "Seven communities including Hindus", "Six communities excluding Sikhs"], "correct": 1, "explanation": "PM VIKAS focuses on six notified minority communities: Buddhists, Christians, Muslims, Jains, Parsis, and Sikhs."}, {"id": 152, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "The Traditional Training Sub-Component under PM VIKAS's Skilling and Training component was earlier known as which two schemes?", "options": ["Seekho Aur Kamao and Nai Roshni", "Nai Manzil and Nai Roshni", "USTTAD and Hamari Dharohar", "Seekho Aur Kamao only", "Nai Manzil and USTTAD"], "correct": 2, "explanation": "The Traditional Training Sub-Component was earlier USTTAD and Hamari Dharohar."}, {"id": 153, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "The Traditional Training Sub-Component of PM VIKAS is delivered primarily through which training model?", "options": ["Classroom-based NSQF training only", "Online e-learning modules", "Apprenticeship under corporate partners", "Guru-Shishya Parampara model", "District Skill Centres"], "correct": 3, "explanation": "Traditional training is delivered through the Guru-Shishya Parampara model along with entrepreneurship training."}, {"id": 154, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "The Non-Traditional Skilling Sub-Component under PM VIKAS was earlier known as which scheme?", "options": ["Nai Manzil", "Nai Roshni", "USTTAD", "Hamari Dharohar", "Seekho Aur Kamao"], "correct": 4, "explanation": "The Non-Traditional Skilling Sub-Component was earlier the Seekho Aur Kamao scheme."}, {"id": 155, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "mcq", "question": "Under PM VIKAS's Non-Traditional Skilling Sub-Component, what is the placement target, and what minimum share must be wage employment?", "options": ["At least 75% placement, of which minimum 50% wage employment", "At least 60% placement, minimum 40% wage employment", "At least 90% placement, minimum 60% wage employment", "At least 75% placement, minimum 75% wage employment", "At least 50% placement, minimum 25% wage employment"], "correct": 0, "explanation": "The target is at least 75% placement, of which a minimum of 50% must be wage employment."}, {"id": 156, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "The Leadership and Entrepreneurship component of PM VIKAS was earlier known as which scheme?", "options": ["Nai Manzil", "Nai Roshni", "Seekho Aur Kamao", "USTTAD", "Hamari Dharohar"], "correct": 1, "explanation": "The Leadership and Entrepreneurship component was earlier Nai Roshni."}, {"id": 157, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "Under PM VIKAS's Entrepreneurship Sub-Component (exclusively for women), what are the trained business mentors called?", "options": ["Udyam Sakhis", "Vikas Sakhis", "Biz Sakhis", "Arth Sakhis", "Nari Sakhis"], "correct": 2, "explanation": "The Entrepreneurship Sub-Component develops 'Biz Sakhis' (Business Mentors) exclusively for women."}, {"id": 158, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "Under PM VIKAS's Entrepreneurship Sub-Component, credit and market linkages for enterprise setup are supported through which institutions?", "options": ["NABARD, SIDBI, and RBI", "NSIC and DICCI only", "MUDRA and SIDBI", "NMDFC, Banks, and NBFCs", "State Minority Finance Corporations only"], "correct": 3, "explanation": "Enterprise setup is supported through credit and market linkages via NMDFC, Banks, and NBFCs."}, {"id": 159, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "The Education Component of PM VIKAS was earlier known as which scheme?", "options": ["Nai Roshni", "Seekho Aur Kamao", "USTTAD", "Hamari Dharohar", "Nai Manzil"], "correct": 4, "explanation": "The Education Component was earlier the Nai Manzil scheme."}, {"id": 160, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "The Education Component of PM VIKAS is a bridge programme for school dropouts, enabling enrolment in which classes through NIOS?", "options": ["Class 8th, 10th, and 12th", "Class 5th, 8th, and 10th", "Class 6th and 9th only", "Class 10th and 12th only", "Class 1st to 5th only"], "correct": 0, "explanation": "The Education Component enables enrolment in Class 8th, 10th, and 12th through NIOS or other approved institutions."}, {"id": 161, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "mcq", "question": "Under PM VIKAS's Education Component, what is the minimum share of women beneficiaries required?", "options": ["33%", "50%", "66%", "40%", "25%"], "correct": 1, "explanation": "The Education Component requires a minimum of 50% women beneficiaries."}, {"id": 162, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "The Infrastructure Development Component of PM VIKAS is implemented through which programme?", "options": ["Pradhan Mantri Awas Yojana", "Pradhan Mantri Gram Sadak Yojana", "Pradhan Mantri Jan Vikas Karyakram (PMJVK)", "National Rural Livelihood Mission", "Deendayal Antyodaya Yojana"], "correct": 2, "explanation": "The Infrastructure Development Component is implemented through PMJVK."}, {"id": 163, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "Under PM VIKAS's Infrastructure Development Component, what are the developed art and craft villages called, and what model do they follow?", "options": ["Karigar Villages, on a cluster model", "Hunar Villages, on a linear model", "Shilp Gram, on a radial model", "Vishwakarma Villages, on a Hub and Spoke Model", "Kaushal Villages, on a network model"], "correct": 3, "explanation": "Vishwakarma Villages (Art and Craft Villages) are developed on a Hub and Spoke Model."}, {"id": 164, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "What does the '3Ts Strategy' under PM VIKAS's scheme approach refer to?", "options": ["Training, Testing, and Technology", "Trade, Training, and Toolkits", "Tourism, Transport, and Trade", "Technology, Transparency, and Trust", "Trade, Tourism, and Technology"], "correct": 4, "explanation": "The 3Ts Strategy integrates Trade, Tourism, and Technology."}, {"id": 165, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "mcq", "question": "Under PM VIKAS's eligibility criteria, what is the general age range for beneficiaries, and what is the different range for the Leadership component?", "options": ["14-45 years generally; 18-45 years for the Leadership component", "18-40 years generally; 21-45 years for Leadership", "14-40 years generally; 18-50 years for Leadership", "16-45 years generally; 18-40 years for Leadership", "14-50 years generally; 18-45 years for Leadership"], "correct": 0, "explanation": "The general eligible age range is 14-45 years, while it is 18-45 years for the Leadership component."}, {"id": 166, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "mcq", "question": "Under PM VIKAS, what is the women's reservation percentage in the Skilling component?", "options": ["50%", "33%", "66%", "25%", "40%"], "correct": 1, "explanation": "Women reservation is 33% in skilling, 66% in leadership, and 50% in education under PM VIKAS."}, {"id": 167, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "mcq", "question": "Under PM VIKAS, what is the women's reservation percentage in the Leadership component?", "options": ["33%", "50%", "66%", "75%", "60%"], "correct": 2, "explanation": "Women reservation is 66% in the Leadership component."}, {"id": 168, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "mcq", "question": "Under PM VIKAS, what is the reservation percentage for Persons with Disabilities (PwDs)?", "options": ["5%", "2%", "4%", "3%", "1%"], "correct": 3, "explanation": "PM VIKAS provides a 3% reservation for Persons with Disabilities."}, {"id": 169, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "mcq", "question": "Under PM VIKAS, non-minorities (EWS) can be included up to what percentage in the Traditional Training component, versus other components?", "options": ["Up to 15% in Traditional Training, 25% in others", "Up to 30% in Traditional Training, 20% in others", "Up to 20% in both", "Up to 10% in Traditional Training, 5% in others", "Up to 25% in Traditional Training, 15% in others"], "correct": 4, "explanation": "Non-minorities (EWS) can be included up to 25% in Traditional Training and 15% in other components."}, {"id": 170, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "Under PM VIKAS, additional State-notified minorities can be included up to what percentage of beneficiaries?", "options": ["5%", "10%", "15%", "3%", "20%"], "correct": 0, "explanation": "Additional State-notified minorities can be included up to 5% of beneficiaries."}, {"id": 171, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "mcq", "question": "What are the minimum eligibility criteria for Project Implementing Agencies under PM VIKAS regarding existence and turnover?", "options": ["Minimum 5 years of existence and turnover of ₹5 crore", "Minimum 3 years of existence and minimum turnover of ₹3 crore in the last 3 years", "Minimum 2 years of existence and turnover of ₹1 crore", "Minimum 3 years of existence with no turnover requirement", "Minimum 10 years of existence and turnover of ₹10 crore"], "correct": 1, "explanation": "Implementing agencies must have a minimum of 3 years of existence and minimum turnover of ₹3 crore in the last 3 years (relaxed for micro-organizations up to 10% of targets)."}, {"id": 172, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "Credit linkages under PM VIKAS are facilitated through which corporation?", "options": ["National Small Industries Corporation (NSIC)", "Small Industries Development Bank of India (SIDBI)", "National Minorities Development & Finance Corporation (NMDFC)", "National Bank for Agriculture and Rural Development (NABARD)", "Khadi and Village Industries Commission (KVIC)"], "correct": 2, "explanation": "Credit linkages under PM VIKAS are provided through NMDFC."}, {"id": 173, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "PM VIKAS converges funding/implementation with which of the following ministries/sectors?", "options": ["Only MSDE and MSME", "Home Affairs and Defence", "Only Ministry of Culture", "MSDE, Panchayati Raj, Rural Development, Tourism, and Culture", "Health and Family Welfare, and Education"], "correct": 3, "explanation": "PM VIKAS converges with MSDE (skilling), Panchayati Raj, Rural Development, Tourism, and Culture."}, {"id": 174, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Easy", "type": "mcq", "question": "What does the 'Family-Centric Approach' under PM VIKAS focus on?", "options": ["Only male heads of households", "Only urban migrant families", "Only families below poverty line with more than 5 members", "Only joint families in rural areas", "Artisan families, women, youth, and differently-abled persons"], "correct": 4, "explanation": "The Family-Centric Approach focuses on artisan families, women, youth, and differently-abled persons."}, {"id": 175, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about PM VIKAS is NOT correct?", "options": ["Women reservation is 66% in skilling and 33% in leadership components", "PM VIKAS is a Central Sector Scheme of the Ministry of Minority Affairs converging five erstwhile schemes", "The scheme targets six notified minority communities: Buddhists, Christians, Muslims, Jains, Parsis, and Sikhs", "The Infrastructure Development Component is implemented through PMJVK using a Hub and Spoke model", "Persons with Disabilities receive a 3% reservation under the scheme"], "correct": 0, "explanation": "This reverses the actual figures — women reservation is 33% in skilling and 66% in leadership, not the other way around."}, {"id": 176, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about the components of PM VIKAS is NOT correct?", "options": ["The Non-Traditional Skilling Sub-Component targets at least 75% placement, with minimum 50% wage employment", "The Education Component (earlier Nai Manzil) requires a minimum of 33% women beneficiaries", "The Entrepreneurship Sub-Component is exclusively for women and develops Biz Sakhis", "The Traditional Training Sub-Component uses the Guru-Shishya Parampara model", "Vishwakarma Villages under the Infrastructure Development Component follow a Hub and Spoke Model"], "correct": 1, "explanation": "The Education Component actually requires a minimum of 50% women beneficiaries, not 33% — 33% is the skilling reservation figure."}, {"id": 177, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about PM VIKAS:\n\nI. PM VIKAS is a scheme of the Ministry of Skill Development and Entrepreneurship.\nII. The scheme converges four erstwhile minority welfare schemes.\nIII. Women reservation under the Leadership component is 20%.\nIV. Persons with Disabilities receive a 5% reservation under the scheme.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 4, "explanation": "None of the statements are correct. PM VIKAS is a Central Sector Scheme of the Ministry of Minority Affairs (not MSDE); it converges five schemes (not four); women reservation in Leadership is 66% (not 20%); and PwD reservation is 3% (not 5%)."}, {"id": 178, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "stmt", "question": "Consider the following statements about eligibility criteria under PM VIKAS:\n\nI. The general beneficiary age range is 14-45 years.\nII. The age range for the Leadership component is 18-45 years.\nIII. Non-minorities (EWS) can be included up to 25% in Traditional Training.\nIV. Persons with Disabilities receive a 5% reservation.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 2, "explanation": "Statement IV is incorrect — the PwD reservation is 3%, not 5%. I, II and III are correct."}, {"id": 179, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about PM VIKAS's converged schemes and their current components:\n\nI. USTTAD and Hamari Dharohar together now form the Traditional Training Sub-Component.\nII. Seekho Aur Kamao now forms the Non-Traditional Skilling Sub-Component.\nIII. Nai Roshni now forms the Education Component.\nIV. Nai Manzil now forms the Leadership and Entrepreneurship Component.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 1, "explanation": "Statements III and IV are swapped and hence incorrect — Nai Roshni actually forms the Leadership and Entrepreneurship Component, while Nai Manzil forms the Education Component. Only I and II are correct, i.e., only two statements are correct."}, {"id": 180, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "The National SC-ST Hub (NSSH) is designed to promote an inclusive ecosystem for MSEs led by which entrepreneurs?", "options": ["Women entrepreneurs", "Minority community entrepreneurs", "Scheduled Caste and Scheduled Tribe entrepreneurs", "Rural youth entrepreneurs", "Ex-servicemen entrepreneurs"], "correct": 2, "explanation": "NSSH promotes an inclusive ecosystem for MSEs led by SC/ST entrepreneurs."}, {"id": 181, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "What is the nodal ministry for the National SC-ST Hub (NSSH)?", "options": ["Ministry of Social Justice and Empowerment", "Ministry of Minority Affairs", "Ministry of Tribal Affairs", "Union Ministry of Micro, Small and Medium Enterprises (MoMSME)", "Ministry of Commerce and Industry"], "correct": 3, "explanation": "The nodal ministry for NSSH is MoMSME."}, {"id": 182, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Who is the implementing agency for NSSH?", "options": ["National Minorities Development & Finance Corporation (NMDFC)", "Dalit Indian Chamber of Commerce and Industry (DICCI)", "Small Industries Development Bank of India (SIDBI)", "Khadi and Village Industries Commission (KVIC)", "National Small Industries Corporation (NSIC)"], "correct": 4, "explanation": "NSIC is the implementing agency for NSSH."}, {"id": 183, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "When and where was NSSH launched, and by whom?", "options": ["18 October 2016, in Ludhiana, Punjab, by PM Narendra Modi", "4 October 2025, in Kanpur, by the MSDE Minister", "1 July 2015, in Delhi, by the Agriculture Minister", "29 June 2026, in Mumbai, by the Labour Minister", "4 July 2026, in Jodhpur, by PM Narendra Modi"], "correct": 0, "explanation": "NSSH was launched on 18 October 2016 in Ludhiana, Punjab, by PM Narendra Modi."}, {"id": 184, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "NSSH is currently valid up to which date, with what total outlay?", "options": ["31 March 2030, with a total outlay of ₹1,000 crore", "31 March 2026, with a total outlay of ₹438 crore (FY 2021-22 to FY 2025-26)", "31 March 2025, with a total outlay of ₹500 crore", "31 March 2027, with a total outlay of ₹600 crore", "31 March 2026, with a total outlay of ₹938 crore"], "correct": 1, "explanation": "NSSH's current extension is valid up to 31 March 2026, with a total outlay of ₹438 crore for FY 2021-22 to 2025-26."}, {"id": 185, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "What is the mandatory target that NSSH is designed to help fulfil?", "options": ["3% public procurement target from women-owned MSEs", "25% public procurement target from all MSEs", "4% public procurement target from SC/ST-owned MSEs under the Public Procurement Policy Order, 2012", "10% public procurement target from SC/ST-owned MSEs", "4% public procurement target from women-owned MSEs"], "correct": 2, "explanation": "NSSH helps fulfil the mandatory 4% public procurement target for SC/ST-owned MSEs under the PPP Order, 2012."}, {"id": 186, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "As per the Public Procurement Policy for MSEs Order 2012, what percentage of annual total procurement by Central Ministries/CPSEs must be from MSEs?", "options": ["20%", "30%", "15%", "25%", "35%"], "correct": 3, "explanation": "The PPP Order 2012 mandates that 25% of annual total procurement by Central Ministries, Departments, and CPSEs must be from MSEs."}, {"id": 187, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Within the 25% MSE procurement mandate, what percentage is specifically reserved for MSEs owned by SC/ST entrepreneurs?", "options": ["3%", "5%", "10%", "2%", "4%"], "correct": 4, "explanation": "4% is specifically reserved for MSEs owned by SC/ST entrepreneurs, within the overall 25% MSE procurement mandate."}, {"id": 188, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Within the 25% MSE procurement mandate, what percentage is reserved for women-owned MSEs?", "options": ["3%", "4%", "5%", "2%", "10%"], "correct": 0, "explanation": "3% is reserved for women-owned MSEs within the 25% MSE procurement mandate."}, {"id": 189, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Under NSSH's eligibility criteria, what is the minimum share that SC/ST partners must hold in a partnership firm?", "options": ["At least 26%", "At least 51%", "At least 33%", "100%", "At least 40%"], "correct": 1, "explanation": "In a partnership, SC/ST partners must hold at least 51% share to be eligible under NSSH."}, {"id": 190, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Under NSSH's eligibility criteria, what is the minimum share SC/ST promoter(s) must hold in a Private Limited Company?", "options": ["At least 26%", "100%", "At least 51%", "At least 33%", "At least 74%"], "correct": 2, "explanation": "SC/ST promoter(s) must hold at least 51% share in a Private Limited Company under NSSH eligibility."}, {"id": 191, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Registration on which portal is mandatory for NSSH eligibility?", "options": ["GeM Portal", "MSME Sambandh Portal", "Startup India Portal", "Udyam Registration Portal", "Udyog Aadhaar Portal"], "correct": 3, "explanation": "Mandatory registration on the Udyam Registration Portal is required for NSSH eligibility."}, {"id": 192, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "NSSH's support is delivered across how many operational pillars, and what are they?", "options": ["Three: Finance, Training, and Marketing", "Five: Finance, Technology, Capacity Building, Market Linkage, and Housing", "Two: Finance and Market Linkage", "Four: Credit, Skilling, Testing, and Export Promotion", "Four: Finance, Technology Upgradation, Capacity Building, and Market Linkage"], "correct": 4, "explanation": "NSSH delivers support across four pillars: Finance, Technology Upgradation, Capacity Building, and Market Linkage."}, {"id": 193, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Under NSSH's Special Credit Linked Capital Subsidy Scheme (SCLCSS), what is the capital subsidy percentage and cap?", "options": ["25% capital subsidy, up to ₹25 lakh per unit", "20% capital subsidy, up to ₹20 lakh per unit", "30% capital subsidy, up to ₹30 lakh per unit", "25% capital subsidy, up to ₹50 lakh per unit", "15% capital subsidy, up to ₹25 lakh per unit"], "correct": 0, "explanation": "SCLCSS provides a 25% capital subsidy (without sector-specific restrictions) capped at ₹25 lakh per unit."}, {"id": 194, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Under NSSH's Special Marketing Assistance Scheme (SMAS), what is reimbursed for domestic trade fair events, and for how many events per year?", "options": ["50% stall rent and airfare, for up to 2 domestic events per year", "100% stall rent (up to 12 sq. m) and economy airfare, for up to 4 domestic events per year", "100% stall rent only, for up to 6 domestic events per year", "80% stall rent and airfare, for up to 4 domestic events per year", "100% stall rent (up to 20 sq. m), for up to 4 domestic events per year"], "correct": 1, "explanation": "SMAS reimburses 100% stall rent (up to 12 sq. m) and economy airfare for up to 4 domestic events per year."}, {"id": 195, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Under NSSH's Special Marketing Assistance Scheme (SMAS), what is reimbursed for international trade fair events, and for how many events per year?", "options": ["50% space rent and airfare, for up to 4 international events per year", "100% space rent only, for up to 1 international event per year", "100% space rent and 100% airfare, for up to 2 international events per year", "80% space rent and airfare, for up to 2 international events per year", "100% space rent and airfare, for up to 3 international events per year"], "correct": 2, "explanation": "SMAS reimburses 100% space rent and 100% airfare for up to 2 international events per year."}, {"id": 196, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "What are Vendor Development Programmes (VDPs) under NSSH's SMAS component designed to do?", "options": ["Provide loans to SC/ST vendors for expansion", "Train vendors in digital marketing only", "Certify vendors for ISO standards", "Fully funded buyer-seller meets connecting SC/ST vendors with CPSE procurement officers", "Provide legal aid to vendors in disputes"], "correct": 3, "explanation": "VDPs are fully funded buyer-seller meets connecting SC/ST vendors directly with procurement officers of CPSEs."}, {"id": 197, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Under NSSH's Capacity Building component, what reimbursement is available for management training at Top 50 NIRF-ranked institutions like IIMs?", "options": ["80% reimbursement, up to ₹1,00,000", "100% reimbursement, up to ₹50,000", "90% reimbursement, up to ₹2,00,000", "75% reimbursement, up to ₹75,000", "90% reimbursement, up to ₹1,00,000"], "correct": 4, "explanation": "Management training at Top 50 NIRF-ranked institutions is reimbursed at 90%, up to ₹1,00,000."}, {"id": 198, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Under NSSH, what type of training is fully sponsored through government tool rooms, MSME-DIs, and autonomous institutes?", "options": ["Technical Training", "Management Training", "Export Documentation Training", "Legal Compliance Training", "Digital Marketing Training"], "correct": 0, "explanation": "Technical Training is fully sponsored through government tool rooms, MSME-DIs, and autonomous institutes."}, {"id": 199, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "What is the general cap for most administrative/compliance fee reimbursements under NSSH?", "options": ["90% or ₹1,00,000, whichever is lower", "80% or ₹1,00,000, whichever is lower", "100% or ₹50,000, whichever is lower", "80% or ₹2,00,000, whichever is lower", "70% or ₹75,000, whichever is lower"], "correct": 1, "explanation": "Most administrative/compliance fee reimbursements under NSSH are capped at 80% or ₹1,00,000, whichever is lower."}, {"id": 200, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Under NSSH, what percentage and cap applies to reimbursement of Bank Loan Processing Fees?", "options": ["90% reimbursement, up to ₹1,00,000", "100% reimbursement, up to ₹50,000", "80% reimbursement, up to ₹1,00,000", "70% reimbursement, up to ₹75,000", "80% reimbursement, up to ₹2,00,000"], "correct": 2, "explanation": "Bank Loan Processing Fees are reimbursed at 80%, up to ₹1,00,000."}, {"id": 201, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Under NSSH, what percentage and cap applies to reimbursement of Performance Bank Guarantee (PBG) Charges for government tenders?", "options": ["90% reimbursement, up to ₹1,00,000", "100% reimbursement, up to ₹1,00,000", "80% reimbursement, up to ₹50,000", "80% reimbursement, up to ₹1,00,000", "70% reimbursement, up to ₹1,00,000"], "correct": 3, "explanation": "PBG Charges for government tender participation are reimbursed at 80%, up to ₹1,00,000."}, {"id": 202, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Under NSSH, what is reimbursed for Testing & Quality Certification Fees at government/NABL/BIS-accredited labs?", "options": ["90% reimbursement, up to ₹1,00,000", "100% reimbursement, up to ₹50,000", "80% reimbursement, up to ₹2,00,000", "60% reimbursement, up to ₹1,00,000", "80% reimbursement, up to ₹1,00,000"], "correct": 4, "explanation": "Testing & Quality Certification Fees are reimbursed at 80%, up to ₹1,00,000."}, {"id": 203, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Under NSSH, what is the reimbursement for Export Promotion Council (EPC) Membership annual fees?", "options": ["80% reimbursement, up to ₹20,000", "80% reimbursement, up to ₹25,000", "90% reimbursement, up to ₹20,000", "100% reimbursement, up to ₹10,000", "80% reimbursement, up to ₹50,000"], "correct": 0, "explanation": "EPC Membership annual fees are reimbursed at 80%, up to ₹20,000."}, {"id": 204, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "mcq", "question": "Under NSSH, what is the reimbursement for E-Commerce Portal Subscriptions (e.g., GeM, e-Khadi, Tribes India)?", "options": ["80% reimbursement, up to ₹20,000", "80% reimbursement, up to ₹25,000", "90% reimbursement, up to ₹25,000", "100% reimbursement, up to ₹15,000", "70% reimbursement, up to ₹30,000"], "correct": 1, "explanation": "E-Commerce Portal listing fee subscriptions are reimbursed at 80%, up to ₹25,000."}, {"id": 205, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Under NSSH's governance structure, who chairs the High-Level Advisory Committee (HLAC)?", "options": ["Secretary, Ministry of MSME", "Chairman, NSIC", "Union Minister of MSME", "President, DICCI", "Cabinet Secretary"], "correct": 2, "explanation": "The HLAC is chaired by the Union Minister of MSME, providing strategic guidance and policy direction."}, {"id": 206, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Under NSSH's governance structure, who chairs the Empowered Programme Monitoring Committee (EPMC)?", "options": ["Union Minister of MSME", "Chairman, NSIC", "President, DICCI", "Secretary, Ministry of MSME", "Joint Secretary, Ministry of Commerce"], "correct": 3, "explanation": "The EPMC is chaired by the Secretary, Ministry of MSME, and monitors funds, performance, and inter-departmental synergies."}, {"id": 207, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "NSSH executes the scheme on the ground through dedicated offices known as:", "options": ["District Industries Centres (DICs) only", "State SC-ST Corporations", "NABARD Regional Offices", "Khadi Gramodyog Boards", "NSSH Offices (NSSHOs) and MSME-Development Institutes"], "correct": 4, "explanation": "NSIC executes the scheme ground-up via dedicated NSSH Offices (NSSHOs) and MSME-Development Institutes."}, {"id": 208, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Which organization is described as the 'primary industry partner for mobilising entrepreneurs' under NSSH?", "options": ["DICCI (Dalit Indian Chamber of Commerce and Industry)", "FICCI", "CII", "ASSOCHAM", "NSIC itself"], "correct": 0, "explanation": "DICCI is the primary industry partner for mobilising SC/ST entrepreneurs under NSSH."}, {"id": 209, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Which digital platform serves as the interface for procurement bids under NSSH, and which portal provides real-time tracking of CPSE procurement compliance?", "options": ["Udyam Portal for bids; GeM for tracking", "GeM (Government e-Marketplace) for bids; MSME Sambandh Portal for tracking", "MSME Sambandh Portal for bids; GeM for tracking", "e-Khadi for bids; Tribes India for tracking", "DICCI Portal for bids; NSIC Portal for tracking"], "correct": 1, "explanation": "GeM is the digital interface for procurement bids, while the MSME Sambandh Portal provides real-time tracking of CPSE compliance."}, {"id": 210, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Under NSSH eligibility, what enterprise types (sectors) are covered?", "options": ["Only manufacturing MSEs", "Only service sector MSEs", "Micro and Small Enterprises (MSEs) in manufacturing or service sectors", "Medium and Large Enterprises only", "Only agro-based MSEs"], "correct": 2, "explanation": "NSSH covers Micro and Small Enterprises (MSEs) engaged in manufacturing or service sectors."}, {"id": 211, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about NSSH is NOT correct?", "options": ["NSSH's nodal ministry is MoMSME and its implementing agency is NSIC", "The scheme helps fulfil the mandatory 4% public procurement target for SC/ST-owned MSEs", "SCLCSS provides a 25% capital subsidy capped at ₹25 lakh per unit", "NSSH was launched on 4 October 2025 by the Union Minister of MSME in Delhi", "The HLAC is chaired by the Union Minister of MSME while EPMC is chaired by the Secretary, MSME"], "correct": 3, "explanation": "NSSH was actually launched on 18 October 2016 in Ludhiana, Punjab, by PM Narendra Modi — not on 4 October 2025 in Delhi by the MSME Minister."}, {"id": 212, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about NSSH's reimbursement provisions is NOT correct?", "options": ["Bank Loan Processing Fees are reimbursed at 80%, up to ₹1,00,000", "Testing & Quality Certification Fees are reimbursed at 80%, up to ₹1,00,000", "E-Commerce Portal Subscriptions are reimbursed at 80%, up to ₹25,000", "EPC Membership fees are reimbursed at 80%, up to ₹20,000", "Management training reimbursement at Top 50 NIRF institutions is capped at 100%, up to ₹2,00,000"], "correct": 4, "explanation": "Management training reimbursement is actually 90%, up to ₹1,00,000, not 100% up to ₹2,00,000."}, {"id": 213, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about NSSH:\n\nI. NSSH's nodal ministry is the Ministry of Commerce and Industry.\nII. NSSH was launched in Mumbai in 2016.\nIII. NSIC is the implementing agency for NSSH.\nIV. NSSH's total outlay under its current extension is ₹1,000 crore.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 0, "explanation": "Only statement III is correct. NSSH's nodal ministry is MoMSME (not Commerce and Industry); it was launched in Ludhiana, Punjab (not Mumbai); and its total outlay is ₹438 crore (not ₹1,000 crore)."}, {"id": 214, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "stmt", "question": "Consider the following statements about NSSH:\n\nI. NSSH's mandatory target is fulfilling the 4% public procurement quota for SC/ST-owned MSEs.\nII. Under the PPP Order 2012, 25% of total MSE procurement is mandated, with 4% for SC/ST-owned and 3% for women-owned MSEs.\nIII. SCLCSS offers a 25% capital subsidy for SC/ST-owned MSEs, capped at ₹25 lakh per unit.\nIV. DICCI is the primary industry partner for mobilising SC/ST entrepreneurs under NSSH.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 3, "explanation": "All four statements are correct as per the document."}, {"id": 215, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "stmt", "question": "Consider the following statements about NSSH's eligibility criteria:\n\nI. In a partnership, SC/ST partners must hold at least 51% share.\nII. In a Private Limited Company, SC/ST promoters must hold at least 51% share.\nIII. Registration on the Udyam Registration Portal is mandatory.\nIV. NSSH covers only manufacturing sector MSEs, excluding services.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 2, "explanation": "Statement IV is incorrect — NSSH covers MSEs in both manufacturing and service sectors, not manufacturing alone. I, II and III are correct."}, {"id": 216, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about NSSH's reimbursement provisions:\n\nI. Management training reimbursement at Top 50 NIRF-ranked institutions is 90%, up to ₹1,00,000.\nII. EPC Membership fee reimbursement is 90%, up to ₹20,000.\nIII. Testing & Quality Certification Fee reimbursement is 80%, up to ₹1,00,000.\nIV. E-Commerce Portal Subscription reimbursement is 100%, up to ₹25,000.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 1, "explanation": "Statements I and III are correct. Statement II is wrong as EPC Membership reimbursement is 80% (not 90%), and Statement IV is wrong as E-Commerce Portal Subscription reimbursement is 80% (not 100%)."}, {"id": 217, "section": "PM-SETU Scheme Advances", "difficulty": "Easy", "type": "mcq", "question": "Which of the following is an Anchor Industry Partner (AIP) under PM-SETU?", "options": ["ArcelorMittal Nippon Steel India", "Reliance Foundation", "Adani Skill Development Centre", "Tata Technologies", "Infosys Foundation"], "correct": 0, "explanation": "ArcelorMittal Nippon Steel India is one of the listed AIPs, anchoring the Gujarat ITI cluster."}, {"id": 218, "section": "Modified Regional Connectivity Scheme (UDAN)", "difficulty": "Easy", "type": "mcq", "question": "The original RCS-UDAN scheme primarily aimed to strengthen air connectivity to which category of cities?", "options": ["Only metro cities", "Tier-2 and Tier-3 cities", "Only state capitals", "International hub cities", "Only coastal cities"], "correct": 1, "explanation": "UDAN was launched to make air travel affordable and strengthen connectivity to Tier-2 and Tier-3 cities."}, {"id": 219, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Easy", "type": "mcq", "question": "PMKSY's four components include AIBP, HKKP, Watershed Development, and which other component?", "options": ["Jal Jeevan Mission", "Namami Gange", "Per Drop More Crop (PDMC)", "Neeranchal Watershed Project", "Command Area Development Programme (standalone)"], "correct": 2, "explanation": "The fourth component of PMKSY is Per Drop More Crop (PDMC)."}, {"id": 220, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Easy", "type": "mcq", "question": "Under the EPF Scheme 2026, existing members will continue under the new scheme in what manner?", "options": ["Only after re-enrolling via the EPF portal", "Only after linking Aadhaar afresh", "Through a mandatory physical verification process", "Without any fresh enrolment or migration", "By submitting a fresh KYC form within 30 days"], "correct": 3, "explanation": "Existing members continue under the EPF Scheme, 2026 without any fresh enrolment or migration process."}, {"id": 221, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Easy", "type": "mcq", "question": "SMAM was launched as a Centrally Sponsored Scheme under which broader scheme?", "options": ["Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "PM Kisan Samman Nidhi", "National Food Security Mission", "PM Fasal Bima Yojana", "Rashtriya Krishi Vikas Yojana (RKVY)"], "correct": 4, "explanation": "SMAM operates as a Centrally Sponsored Scheme under RKVY."}, {"id": 222, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Easy", "type": "mcq", "question": "Under PM VIKAS, GI tags, Hunar Haat, and credit linkages are promoted under which sub-component?", "options": ["Traditional Training Sub-Component", "Non-Traditional Skilling Sub-Component", "Entrepreneurship Sub-Component", "Education Component", "Infrastructure Development Component"], "correct": 0, "explanation": "The Traditional Training Sub-Component promotes cultural heritage preservation, GI tags, Hunar Haat, and credit linkages."}, {"id": 223, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Easy", "type": "mcq", "question": "NSSH aims to bridge the supply-demand gap for SC/ST entrepreneurs mainly through which means?", "options": ["Direct cash transfers only", "Capacity building, financial facilitation, and market linkages", "Land allotment schemes only", "Tax holidays only", "Reservation in government jobs"], "correct": 1, "explanation": "NSSH was established to bridge the supply-demand gap through capacity building, financial facilitation, and market linkages."}, {"id": 224, "section": "PM-SETU Scheme Advances", "difficulty": "Moderate", "type": "mcq", "question": "PM-SETU's Budget 2026-27 allocation of ₹6,140.50 crore compares to its total 5-year outlay of how much?", "options": ["₹1,237.58 crore", "₹28,840 crore", "₹60,000 crore", "₹93,068.56 crore", "₹438 crore"], "correct": 2, "explanation": "PM-SETU has a total outlay of ₹60,000 crore over 5 years (2025-2030), against which ₹6,140.50 crore was allocated in Budget 2026-27."}, {"id": 225, "section": "Modified Regional Connectivity Scheme (UDAN)", "difficulty": "Moderate", "type": "mcq", "question": "Which of the following best describes the funding structure change for Modified UDAN VGF support?", "options": ["It moved from a 5-year flat support to a 3-year tapered structure", "VGF support was scrapped entirely under the new scheme", "VGF support was made a one-time lump sum grant", "It moved from a flat 3-year support period to a 5-year tapered structure (100%-100%-75%-50%-25%)", "VGF support was extended to 10 years at a flat 100% rate"], "correct": 3, "explanation": "VGF support was extended from 3 years to 5 years, with a tapering structure of 100%, 100%, 75%, 50%, and 25% respectively."}, {"id": 226, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Moderate", "type": "mcq", "question": "Which PMKSY component specifically focuses on integrated management to enhance productivity of rainfed and degraded lands?", "options": ["AIBP", "HKKP", "PDMC", "M-CADWM", "Watershed Development"], "correct": 4, "explanation": "Watershed Development focuses on integrated watershed management for rainfed and degraded lands."}, {"id": 227, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Moderate", "type": "mcq", "question": "Under the EPF Scheme, 2026, which of the following elements remains explicitly UNCHANGED alongside UAN portability?", "options": ["EPF interest rate and retirement age", "The withdrawal category structure", "The minimum balance retention requirement", "The unemployment waiting period for full withdrawal", "The number of permitted marriage/housing withdrawals"], "correct": 0, "explanation": "UAN portability, nomination facility, EPF interest rate, and retirement age all remain unchanged under the new scheme."}, {"id": 228, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Moderate", "type": "mcq", "question": "SMAM's focus areas include Farm Machinery Banks, Custom Hiring Centres, and which type of specialized centres for high-capacity machinery?", "options": ["Rural Innovation Labs", "Hi-Tech Equipment Hubs", "Precision Farming Institutes", "State Seed Testing Centres", "Agri-Export Zones"], "correct": 1, "explanation": "SMAM promotes the development of Hi-Tech and High-Productivity Equipment Hubs equipped with advanced machinery."}, {"id": 229, "section": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "difficulty": "Moderate", "type": "mcq", "question": "SSBSK's Risk-Stratified Approach and Joint Home Visits are both examples of what kind of innovation under the scheme?", "options": ["Continuation of pre-existing HBNC practices unchanged", "State-specific pilot measures not part of the national programme", "Major innovations introduced under SSBSK for the first time", "Temporary COVID-era measures", "Private sector-led initiatives outside government funding"], "correct": 2, "explanation": "The Risk-Stratified Approach (introduced for the first time) and Joint Home Visits are listed as major innovations under SSBSK."}, {"id": 230, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Moderate", "type": "mcq", "question": "Under PM VIKAS, which component specifically targets bridging education gaps for school dropouts from minority and artisan communities?", "options": ["Skilling and Training Component", "Leadership and Entrepreneurship Component", "Infrastructure Development Component", "Education Component (earlier Nai Manzil)", "Non-Traditional Skilling Sub-Component"], "correct": 3, "explanation": "The Education Component (earlier Nai Manzil) is a bridge programme for school dropouts."}, {"id": 231, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "mcq", "question": "Under NSSH, which portal specifically provides real-time tracking of CPSE public procurement compliance from SC/ST units?", "options": ["GeM Portal", "Udyam Registration Portal", "DICCI Portal", "NSIC e-Governance Portal", "MSME Sambandh Portal"], "correct": 4, "explanation": "The MSME Sambandh Portal provides real-time tracking of CPSE public procurement compliance from SC/ST units."}, {"id": 232, "section": "Employees' Provident Funds Scheme, 2026", "difficulty": "Hard", "type": "trap", "question": "Which of the following statements about what changed under the EPF Scheme, 2026 is NOT correct?", "options": ["The statutory wage ceiling was raised from ₹15,000 to ₹21,000 per month", "Partial withdrawal provisions were consolidated from 13 into 3 broad categories", "The uniform service-eligibility period for partial withdrawals was reduced to 12 months", "A minimum 25% balance retention rule was introduced after partial withdrawals", "The full withdrawal waiting period after job loss was effectively lengthened"], "correct": 0, "explanation": "The statutory wage ceiling of ₹15,000 per month remains unchanged under the new scheme — it was not raised to ₹21,000."}, {"id": 233, "section": "Modified Regional Connectivity Scheme (UDAN)", "difficulty": "Moderate", "type": "trap", "question": "Which of the following statements about UDAN's background (pre-Modified Scheme) is NOT correct?", "options": ["UDAN has operationalised 663 routes across 95 airports, heliports, and water aerodromes over nine years", "The original RCS-UDAN was launched in October 2016 exclusively to serve international routes", "India added 90 airports in the last 12 years compared to only 9 between 2001-2014", "55 unserved and underutilised airstrips have been revived into operational airports", "India stands as the world's third-largest domestic civil aviation market"], "correct": 1, "explanation": "UDAN's original objective was to serve domestic Tier-2/3 city connectivity, not international routes exclusively."}, {"id": 234, "section": "PM-SETU Scheme Advances", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about PM-SETU:\n\nI. PM-SETU's total outlay over 5 years is ₹28,840 crore.\nII. The implementing agency at the ITI cluster level is NSIC.\nIII. Under the SPV equity structure, the Anchor Industry Partner holds 33% with management control.\nIV. PM-SETU's nodal ministry is the Ministry of MSME.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 4, "explanation": "None of the statements are correct. PM-SETU's total outlay is ₹60,000 crore (₹28,840 crore is the Modified UDAN outlay); the implementing agency is an industry-led SPV, not NSIC; the AIP holds 51%, not 33%; and the nodal ministry is MSDE, not MSME."}, {"id": 235, "section": "Modified Regional Connectivity Scheme (UDAN)", "difficulty": "Moderate", "type": "stmt", "question": "Consider the following statements about the Modified UDAN scheme's route eligibility reforms:\n\nI. The underserved threshold was widened from fewer than 7 to 14 or fewer weekly flights.\nII. For NE and hilly states, the threshold was further raised to 21 weekly flights.\nIII. VGF support duration was extended from 3 years to 7 years.\nIV. The tapered VGF structure provides 100% support in the first two years.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 2, "explanation": "Statement III is incorrect — VGF support was extended from 3 years to 5 years, not 7 years. I, II and IV are correct."}, {"id": 236, "section": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "difficulty": "Moderate", "type": "stmt", "question": "Consider the following statements about PMKSY:\n\nI. PMKSY's vision is \"Per Drop More Crop\".\nII. PMKSY was launched in the year 2016.\nIII. AIBP has received central assistance of ₹21,023 crore since 2016-17.\nIV. PDMC has been merged under SMAM since 2022-23.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 1, "explanation": "Statements I and III are correct. PMKSY was actually launched in 2015, not 2016; and PDMC has been merged under PM-RKVY (not SMAM) from 2022-23 onwards."}, {"id": 237, "section": "EPFO Amnesty Scheme, 2026", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about the background of the EPFO Amnesty Scheme, 2026:\n\nI. The Finance Act, 2026 aligned the Income Tax framework with the EPF & MP Act, 1952.\nII. Recognition under the Income Tax Act is now available only to funds exempted under Section 17 of the EPF & MP Act.\nIII. The Amnesty Scheme grants retrospective exemption under Section 17 of the Act and Section 143 of the Code on Social Security, 2020.\nIV. The scheme is open for three months from the date of notification.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 2, "explanation": "Statement IV is incorrect — the scheme is open for six months, not three months, from the date of notification. I, II and III are correct."}, {"id": 238, "section": "Sub-Mission on Agricultural Mechanization (SMAM)", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about SMAM's funding pattern:\n\nI. SMAM's funding pattern for most states is 90:10 (Centre:State).\nII. 50% of total SMAM funds are earmarked for women farmers.\nIII. RKVY, under which SMAM operates, was restructured in 2017-18 as RKVY-RAFTAR.\nIV. Farm Machinery Bank support in the North-Eastern Region is capped at 50%.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 0, "explanation": "Only statement III is correct. The funding pattern for most states is actually 60:40, not 90:10 (90:10 applies to NE/Himalayan states); only 30% of funds are earmarked for women farmers, not 50%; and NER FMB support is 95%, not capped at 50%."}, {"id": 239, "section": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "difficulty": "Moderate", "type": "stmt", "question": "Consider the following statements about SSBSK:\n\nI. SSBSK consolidates HBNC and HBYC into a single unified framework.\nII. The scheme's continuum of care runs from birth to 36 months of age.\nIII. Joint home visits are conducted by ASHAs, ANMs, CHOs, and AWWs together.\nIV. Well-Baby Sessions are held at every Village Health, Sanitation and Nutrition Day.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 3, "explanation": "All four statements are correct as per the document."}, {"id": 240, "section": "National SC-ST Hub (NSSH) Scheme", "difficulty": "Moderate", "type": "stmt", "question": "Consider the following statements about NSSH's governance and stakeholders:\n\nI. HLAC is chaired by the Union Minister of MSME.\nII. EPMC is chaired by the Secretary, Ministry of MSME.\nIII. DICCI is the primary industry partner for mobilising entrepreneurs.\nIV. NSIC implements the scheme through State SC-ST Corporations exclusively.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 2, "explanation": "Statement IV is incorrect — NSIC implements NSSH through dedicated NSSH Offices (NSSHOs) and MSME-Development Institutes, not exclusively through State SC-ST Corporations (which are not mentioned in the document). I, II and III are correct."}, {"id": 241, "section": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "difficulty": "Hard", "type": "stmt", "question": "Consider the following statements about PM VIKAS:\n\nI. PM VIKAS targets the upliftment of eight notified minority communities.\nII. PM VIKAS is a Centrally Sponsored Scheme, not a Central Sector Scheme.\nIII. The Infrastructure Development Component of PM VIKAS is implemented through NSSH.\nIV. Credit linkages under PM VIKAS are provided through NABARD.\n\nHow many of the above statements are correct?", "options": ["Only one statement is correct", "Only two statements are correct", "Only three statements are correct", "All four statements are correct", "None of the above statements are correct"], "correct": 4, "explanation": "None of the statements are correct. PM VIKAS targets six (not eight) minority communities; it is a Central Sector Scheme, not Centrally Sponsored; its Infrastructure Development Component is implemented through PMJVK, not NSSH; and credit linkages are via NMDFC, not NABARD."}]</script>
<script>
(function(){
  "use strict";

  var ALL_QUESTIONS = JSON.parse(document.getElementById('quizdata').textContent);
  var LETTERS = ['A','B','C','D','E'];

  // Build section list with counts, preserving PDF order of first appearance
  var sectionOrder = [];
  var sectionCounts = {};
  ALL_QUESTIONS.forEach(function(q){
    if(!(q.section in sectionCounts)){
      sectionOrder.push(q.section);
      sectionCounts[q.section] = 0;
    }
    sectionCounts[q.section]++;
  });

  var TOTAL_Q = ALL_QUESTIONS.length;

  // ---------------- App State ----------------
  var state = {
    screen: 'home',           // home | fullSetup | sectionGrid | quiz | results
    setSource: null,          // 'full' | 'section'
    setLabel: '',
    orderMode: 'pdf',         // 'pdf' | 'shuffled' (full mode only)
    activeQuestions: [],      // current run's question array
    idx: 0,
    answers: [],              // per question: {status:'correct'|'wrong'|'skipped', selectedIdx: n|null}
    score: 0
  };

  var app = document.getElementById('app');

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function esc(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------------- Renderers ----------------
  function render(){
    window.scrollTo(0,0);
    if(state.screen==='home') return renderHome();
    if(state.screen==='fullSetup') return renderFullSetup();
    if(state.screen==='sectionGrid') return renderSectionGrid();
    if(state.screen==='quiz') return renderQuiz();
    if(state.screen==='results') return renderResults();
  }

  function renderHome(){
    var html = '';
    html += '<div class="topbar">'
      + '<div class="brand"><div class="eyebrow">NABARD Grade A &middot; Practice Series</div>'
      + '<h1>Scheme Compendium Test</h1></div>'
      + '<div class="topbar-meta">Source: Schemes Compendium<br>1st&ndash;15th May &middot; '+TOTAL_Q+' Questions</div>'
      + '</div>';

    html += '<div class="hero">'
      + '<div class="eyebrow">Full-Length Coverage</div>'
      + '<h2>Every scheme, every figure &mdash; drilled the way the exam asks it.</h2>'
      + '<p>Nine schemes from PM-SETU to the National SC-ST Hub, converted into '+TOTAL_Q+' NABARD-style questions: direct recall, "NOT correct" traps, and statement-based sets.</p>'
      + '<div class="hero-stats">'
      + '<div class="hero-stat"><b>'+TOTAL_Q+'</b><span>Total Questions</span></div>'
      + '<div class="hero-stat"><b>'+sectionOrder.length+'</b><span>Schemes Covered</span></div>'
      + '<div class="hero-stat"><b>5</b><span>Options Per Item (A&ndash;E)</span></div>'
      + '</div>'
      + '</div>';

    html += '<div class="mode-grid">';
    html += '<div class="card mode-card" data-action="goFullSetup">'
      + '<div class="icon-badge">FT</div>'
      + '<h3>Full Practice Test</h3>'
      + '<p>Attempt all '+TOTAL_Q+' questions in one sitting, in document order or shuffled. Best for a realistic timed run.</p>'
      + '<div class="go">Start full test &rarr;</div></div>';
    html += '<div class="card mode-card" data-action="goSectionGrid">'
      + '<div class="icon-badge">SR</div>'
      + '<h3>Section-wise Revision</h3>'
      + '<p>Pick one scheme &mdash; PM-SETU, UDAN, PMKSY, EPF, and more &mdash; and drill just that topic.</p>'
      + '<div class="go">Choose a section &rarr;</div></div>';
    html += '</div>';

    html += '<footer class="note">Works fully offline. Your progress in this run is not saved between page reloads.</footer>';

    app.innerHTML = html;
    app.querySelector('[data-action="goFullSetup"]').onclick = function(){ state.screen='fullSetup'; render(); };
    app.querySelector('[data-action="goSectionGrid"]').onclick = function(){ state.screen='sectionGrid'; render(); };
  }

  function renderFullSetup(){
    var html = '';
    html += backLink('Back to menu', 'home');
    html += '<div class="card pad">';
    html += '<div class="eyebrow" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);font-weight:700;margin-bottom:6px;">Full Practice Test</div>';
    html += '<h2 style="font-family:var(--serif);font-size:24px;margin:0 0 8px;">All '+TOTAL_Q+' questions</h2>';
    html += '<p style="color:var(--ink-soft);font-size:14px;line-height:1.6;margin:0;">Choose how questions are ordered, then begin. You can skip any question without penalty.</p>';

    html += '<div class="toggle-row">';
    html += '<div class="toggle-btn '+(state.orderMode==='pdf'?'active':'')+'" data-order="pdf">'
      + '<b>PDF Order</b><span>Follows the document\'s section sequence (default)</span></div>';
    html += '<div class="toggle-btn '+(state.orderMode==='shuffled'?'active':'')+'" data-order="shuffled">'
      + '<b>Shuffled</b><span>Random order, re-shuffled each attempt</span></div>';
    html += '</div>';

    html += '<div class="btn-row">';
    html += '<button class="primary-btn gold" data-action="startFull">Start Full Practice Test</button>';
    html += '</div>';
    html += '</div>';

    app.innerHTML = html;
    bindBackLink();
    var toggles = app.querySelectorAll('.toggle-btn');
    toggles.forEach(function(t){
      t.onclick = function(){
        state.orderMode = t.getAttribute('data-order');
        renderFullSetup();
      };
    });
    app.querySelector('[data-action="startFull"]').onclick = function(){
      var qs = state.orderMode==='shuffled' ? shuffle(ALL_QUESTIONS) : ALL_QUESTIONS.slice();
      startRun(qs, 'full', 'Full Practice Test ('+(state.orderMode==='shuffled'?'Shuffled':'PDF Order')+')');
    };
  }

  function renderSectionGrid(){
    var html = '';
    html += backLink('Back to menu', 'home');
    html += '<div style="margin-bottom:18px;">';
    html += '<div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:6px;">Section-wise Revision</div>';
    html += '<h2 style="font-family:var(--serif);font-size:24px;margin:0;">Pick a scheme to drill</h2>';
    html += '</div>';

    html += '<div class="sec-grid">';
    sectionOrder.forEach(function(sec){
      html += '<div class="card sec-card" data-section="'+esc(sec)+'">'
        + '<div class="name">'+esc(sec)+'</div>'
        + '<div class="sec-count">'+sectionCounts[sec]+' Qs</div>'
        + '</div>';
    });
    html += '</div>';

    app.innerHTML = html;
    bindBackLink();
    app.querySelectorAll('.sec-card').forEach(function(el){
      el.onclick = function(){
        var sec = el.getAttribute('data-section');
        var qs = ALL_QUESTIONS.filter(function(q){ return q.section===sec; });
        startRun(qs, 'section', sec);
      };
    });
  }

  function backLink(label, target){
    return '<div class="back-link" data-target="'+target+'">&larr; '+label+'</div>';
  }
  function bindBackLink(){
    var el = app.querySelector('.back-link');
    if(el){
      el.onclick = function(){ state.screen = el.getAttribute('data-target'); render(); };
    }
  }

  function startRun(questions, source, label){
    state.setSource = source;
    state.setLabel = label;
    state.activeQuestions = questions;
    state.idx = 0;
    state.score = 0;
    state.answers = questions.map(function(){ return {status:null, selectedIdx:null}; });
    state.screen = 'quiz';
    state.locked = false;
    render();
  }

  function renderQuiz(){
    var qs = state.activeQuestions;
    var i = state.idx;
    var q = qs[i];
    var ans = state.answers[i];
    var locked = ans.status !== null;

    var answeredCount = state.answers.filter(function(a){ return a.status!==null; }).length;
    var pct = Math.round((answeredCount/qs.length)*100);

    var html = '';
    html += '<div class="quiz-head">';
    html += '<div class="quiz-top-row">';
    html += '<div class="quiz-tag">'+esc(state.setLabel)+'</div>';
    html += '<div class="quiz-score">Score: '+state.score+' / '+answeredCountScored()+'</div>';
    html += '</div>';
    html += '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div>';
    html += '<div class="progress-caption"><span>Question '+(i+1)+' of '+qs.length+'</span><span>'+pct+'% complete</span></div>';
    html += '</div>';

    html += '<div class="card q-card">';
    html += '<div class="q-meta-row">';
    html += '<span class="pill diff-'+q.difficulty+'">'+q.difficulty+'</span>';
    html += '<span class="pill section">'+esc(q.section)+'</span>';
    if(q.type==='stmt') html += '<span class="pill qtype">Statement-Based</span>';
    if(q.type==='trap') html += '<span class="pill qtype">Which is NOT correct</span>';
    html += '</div>';

    html += '<p class="q-text">'+esc(q.question)+'</p>';

    html += '<div class="opt-list">';
    q.options.forEach(function(opt, oi){
      var cls = 'opt';
      if(locked){
        cls += ' locked';
        if(oi===q.correct) cls += ' correct';
        else if(oi===ans.selectedIdx) cls += ' wrong';
        else cls += ' dim';
      }
      html += '<div class="'+cls+'" data-oi="'+oi+'">'
        + '<div class="letter">'+LETTERS[oi]+'</div>'
        + '<div>'+esc(opt)+'</div>'
        + '</div>';
    });
    html += '</div>';

    if(locked){
      var fbClass = 'feedback-box';
      var label = '';
      if(ans.status==='correct'){ label='Correct'; }
      else if(ans.status==='wrong'){ fbClass+=' wrongfb'; label='Incorrect'; }
      else { fbClass+=' skipfb'; label='Skipped'; }
      html += '<div class="'+fbClass+'"><b>'+label+' &mdash; Explanation</b>'+esc(q.explanation)+'</div>';
    }

    html += '<div class="q-actions">';
    if(!locked){
      html += '<button class="skip-btn" data-action="skip">Skip Question</button>';
      html += '<div></div>';
    } else {
      html += '<div></div>';
      html += '<button class="primary-btn" data-action="next">'+(i===qs.length-1?'See Results':'Next Question')+' &rarr;</button>';
    }
    html += '</div>';
    html += '</div>';

    app.innerHTML = html;

    if(!locked){
      app.querySelectorAll('.opt').forEach(function(el){
        el.onclick = function(){
          var oi = parseInt(el.getAttribute('data-oi'),10);
          selectAnswer(oi);
        };
      });
      var skipBtn = app.querySelector('[data-action="skip"]');
      if(skipBtn) skipBtn.onclick = function(){ skipQuestion(); };
    } else {
      var nextBtn = app.querySelector('[data-action="next"]');
      if(nextBtn) nextBtn.onclick = function(){ goNext(); };
    }
  }

  function answeredCountScored(){
    // denominator = questions actually answered (correct+wrong), not counting skips, for a running "attempted" score display
    return state.answers.filter(function(a){ return a.status==='correct' || a.status==='wrong'; }).length;
  }

  function selectAnswer(oi){
    var i = state.idx;
    var q = state.activeQuestions[i];
    var ans = state.answers[i];
    if(ans.status !== null) return;
    ans.selectedIdx = oi;
    if(oi === q.correct){
      ans.status = 'correct';
      state.score++;
    } else {
      ans.status = 'wrong';
    }
    renderQuiz();
  }

  function skipQuestion(){
    var i = state.idx;
    var ans = state.answers[i];
    if(ans.status !== null) return;
    ans.status = 'skipped';
    ans.selectedIdx = null;
    renderQuiz();
  }

  function goNext(){
    if(state.idx < state.activeQuestions.length - 1){
      state.idx++;
      render();
    } else {
      state.screen = 'results';
      render();
    }
  }

  function renderResults(){
    var qs = state.activeQuestions;
    var answers = state.answers;
    var total = qs.length;
    var correctCount = answers.filter(function(a){ return a.status==='correct'; }).length;
    var wrongCount = answers.filter(function(a){ return a.status==='wrong'; }).length;
    var skipCount = answers.filter(function(a){ return a.status==='skipped'; }).length;
    var pct = total>0 ? Math.round((correctCount/total)*100) : 0;

    var diffs = ['Easy','Moderate','Hard'];
    var diffStats = {};
    diffs.forEach(function(d){ diffStats[d] = {correct:0,total:0}; });
    qs.forEach(function(q, idx){
      var d = q.difficulty;
      if(!diffStats[d]) diffStats[d] = {correct:0,total:0};
      diffStats[d].total++;
      if(answers[idx].status==='correct') diffStats[d].correct++;
    });

    var html = '';
    html += '<div class="result-hero">';
    html += '<div class="eyebrow">'+esc(state.setLabel)+' &middot; Results</div>';
    html += '<div class="result-score">'+correctCount+' / '+total+'</div>';
    html += '<div class="result-sub">'+pct+'% accuracy &middot; '+wrongCount+' incorrect &middot; '+skipCount+' skipped</div>';
    html += '</div>';

    html += '<div class="diff-breakdown">';
    diffs.forEach(function(d){
      var s = diffStats[d];
      var p = s.total>0 ? Math.round((s.correct/s.total)*100) : 0;
      html += '<div class="card diff-box"><div class="label">'+d+'</div>'
        + '<div class="val">'+p+'%</div>'
        + '<div class="sub">'+s.correct+' / '+s.total+' correct</div></div>';
    });
    html += '</div>';

    html += '<div class="btn-row" style="margin-bottom:8px;">';
    html += '<button class="primary-btn gold" data-action="retry">Retry Same Set</button>';
    html += '<button class="secondary-btn" data-action="menu">Back to Menu</button>';
    html += '</div>';

    // Review section: missed + skipped
    var reviewItems = [];
    qs.forEach(function(q, idx){
      var a = answers[idx];
      if(a.status==='wrong' || a.status==='skipped'){
        reviewItems.push({q:q, a:a});
      }
    });

    html += '<div class="review-section">';
    html += '<h3>Review &mdash; Missed &amp; Skipped ('+reviewItems.length+')</h3>';
    if(reviewItems.length===0){
      html += '<div class="card empty-note">Nothing to review &mdash; every question was answered correctly.</div>';
    } else {
      reviewItems.forEach(function(item){
        var q = item.q, a = item.a;
        html += '<div class="card review-item">';
        if(a.status==='skipped'){
          html += '<span class="rtag skip">Skipped</span>';
        } else {
          html += '<span class="rtag wrongtag">Incorrect</span>';
        }
        html += '<div class="rq">'+esc(q.question)+'</div>';
        if(a.status==='wrong'){
          html += '<div class="ra-row your">Your answer: '+LETTERS[a.selectedIdx]+'. '+esc(q.options[a.selectedIdx])+'</div>';
        }
        html += '<div class="ra-row correctans">Correct answer: '+LETTERS[q.correct]+'. '+esc(q.options[q.correct])+'</div>';
        html += '<div class="rexp">'+esc(q.explanation)+'</div>';
        html += '</div>';
      });
    }
    html += '</div>';

    app.innerHTML = html;
    app.querySelector('[data-action="retry"]').onclick = function(){
      var qs2 = state.setSource==='full' && state.orderMode==='shuffled' ? shuffle(state.activeQuestions) : state.activeQuestions;
      startRun(qs2, state.setSource, state.setLabel);
    };
    app.querySelector('[data-action="menu"]').onclick = function(){
      state.screen='home'; render();
    };
  }

  render();
})();

</script>
</body>
</html>
