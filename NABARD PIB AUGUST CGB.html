{id:85,topic:"NIPU-2026",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the National Investment Policy for Urea-2026 (NIPU-2026):<br>1. NIPU-2026 approved by the CCEA separates fixed and variable costs, unlike NIP-2012.<br>2. It sets a Return on Equity (RoE) band of 12%-16%.<br>3. Under NIPU-2026, fixed cost is converted into INR after 4 years based on the prevailing exchange rate.<br>4. NIP-2012 remained active till 2024 before being replaced by NIPU-2026.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"4 only"},{k:"B",t:"1 and 4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"NIP-2012 expired in October 2019, not 2024, making statement 4 incorrect. Statements 1, 2 and 3 correctly reflect NIPU-2026's features."},
{id:86,topic:"NIPU-2026",type:"figure",difficulty:"Hard",question:"As per the chapter, how many new urea units were established under NIP-2012, and through what mechanisms?",options:[{k:"A",t:"4 units — all through Joint Venture Companies of nominated PSUs"},{k:"B",t:"6 units — 4 through Joint Venture Companies of nominated PSUs and 2 by private companies"},{k:"C",t:"6 units — 2 through JVCs and 4 by private companies"},{k:"D",t:"8 units — 6 through JVCs and 2 by private companies"},{k:"E",t:"6 units — 3 through JVCs and 3 by private companies"}],correct:"B",explanation:"Under NIP-2012, 6 new urea units were established — 4 through Joint Venture Companies of nominated PSUs and 2 by private companies."},
{id:87,topic:"Manual Scavengers Survey",type:"figure",difficulty:"Moderate",question:"As per the chapter, how many manual scavengers were identified through the nationwide surveys of 2013 & 2018, and what compensation did each receive?",options:[{k:"A",t:"48,098 identified; OTCA of ₹40,000 each"},{k:"B",t:"58,098 identified; OTCA of ₹50,000 each"},{k:"C",t:"58,098 identified; One-Time Cash Assistance (OTCA) of ₹40,000 each"},{k:"D",t:"58,098 identified; OTCA of ₹30,000 each"},{k:"E",t:"68,098 identified; OTCA of ₹40,000 each"}],correct:"C",explanation:"58,098 manual scavengers were identified through the 2013 and 2018 surveys, and all received One-Time Cash Assistance (OTCA) of ₹40,000 each."},
{id:88,topic:"MSME ZED Certification",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about MSME Sustainable (ZED) Certification is correct?",options:[{k:"A",t:"ZED certification is fully free for all MSMEs regardless of ownership, effective since 2020."},{k:"B",t:"Women-owned MSMEs receive a 50% subsidy on ZED certification cost, effective from 2023."},{k:"C",t:"Maximum assistance for Zero Effect solutions/Cleaner technologies is capped at ₹1 lakh."},{k:"D",t:"ZED stands for Zero Defect, Zero Effect, with certification levels of Bronze, Silver and Gold."},{k:"E",t:"ZED certification levels are Silver, Gold and Platinum."}],correct:"D",explanation:"ZED = Zero Defect, Zero Effect, with Bronze → Silver → Gold levels. Women-owned MSMEs get a 100% subsidy (not 50%) effective from 11 November 2023, and Zero Effect solutions assistance is capped at ₹3 lakh, not ₹1 lakh."},
{id:89,topic:"Samudra Manthan",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the Samudra Manthan scheme:<br>1. The scheme has a total outlay of ₹84,084 crore, implemented up to FY 2030-31.<br>2. Deepwater exploration (60 wells) has an allocation of ₹43,200 crore.<br>3. Government support for deepwater drilling is up to 50% of eligible drilling cost or ₹675 crore per well, whichever is lower.<br>4. The scheme is implemented by the Ministry of Earth Sciences.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"Samudra Manthan is implemented by the Ministry of Petroleum & Natural Gas, not the Ministry of Earth Sciences, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:90,topic:"Samudra Manthan",type:"figure",difficulty:"Hard",question:"As per Samudra Manthan's component-wise allocation, how much has been earmarked for offshore seismic data acquisition & processing?",options:[{k:"A",t:"₹28,534 crore"},{k:"B",t:"₹43,200 crore"},{k:"C",t:"₹10,000 crore"},{k:"D",t:"₹2,000 crore"},{k:"E",t:"₹35,000 crore"}],correct:"A",explanation:"₹28,534 crore is allocated for offshore seismic data acquisition & processing, out of the scheme's total ₹84,084 crore outlay."},
{id:91,topic:"KCC-MISS",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the Kisan Credit Card–Modified Interest Subvention Scheme (KCC-MISS) is correct?",options:[{k:"A",t:"The assessment found every ₹1 invested generates ₹5 net value addition."},{k:"B",t:"A third-party assessment by ISEC, Bengaluru found that every ₹1 invested under KCC-MISS generates ₹2.30 net value addition in agriculture & allied sector."},{k:"C",t:"The collateral-free KCC loan limit was reduced from ₹2 lakh to ₹1.6 lakh effective 1 January 2025."},{k:"D",t:"MISS outlay since inception till 2024-25 stands at ₹87,000 crore."},{k:"E",t:"The assessment was conducted by NITI Aayog."}],correct:"B",explanation:"The ISEC Bengaluru assessment found ₹1 invested under KCC-MISS generates ₹2.30 net value addition. The collateral-free KCC loan limit was increased (not reduced) from ₹1.6 lakh to ₹2 lakh, and MISS outlay since inception is ₹1.87 lakh crore, not ₹87,000 crore."},
{id:92,topic:"PM-SYM",type:"numbered",difficulty:"Hard",context:"Consider the following statements about Pradhan Mantri Shram Yogi Maandhan (PM-SYM):<br>1. Launched in February 2019, it offers an assured pension of ₹3,000/month after 60 years.<br>2. Eligibility requires age 18-40 years and monthly income of ₹15,000 or less.<br>3. Monthly contribution ranges ₹55-₹200, with 50% matching contribution by the Central Government.<br>4. Pension disbursement is expected to begin before February 2029.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"4 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"C",explanation:"Pension disbursement will begin not before February 2039 (60 years after the scheme's 2019 launch for an 18-year-old entrant), not February 2029, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:93,topic:"Mobile Phone Manufacturing Scheme (MPMS)",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the Mobile Phone Manufacturing Scheme (MPMS):<br>1. MPMS was approved with an outlay of ₹62,500 crore for FY 2026-27 to FY 2030-31.<br>2. TS1 (Mobile Phone Manufacturing) offers a manufacturing incentive of 2.25%-5% on eligible sales.<br>3. TS2 (Indian Mobile Phone Brands) requires a minimum turnover of ₹10,000 crore in FY 2025-26.<br>4. Additional incentive of up to 1.5% is available for domestic sourcing of key components, requiring at least 25% localisation.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 3 only"},{k:"B",t:"2 only"},{k:"C",t:"4 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"D",explanation:"TS2 (Indian Mobile Phone Brands) requires a minimum turnover of ₹1,000 crore (not ₹10,000 crore, which is the TS1 threshold) in FY 2025-26, making statement 3 incorrect. Statements 1, 2 and 4 are correct."},
{id:94,topic:"Mobile Phone Manufacturing Scheme (MPMS)",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about MPMS's expected outcomes is correct?",options:[{k:"A",t:"MPMS is expected to generate 2 lakh direct jobs and ₹10 lakh crore in production."},{k:"B",t:"MPMS follows the PLI-LSEM scheme, which is still ongoing alongside it."},{k:"C",t:"MPMS aims to reduce India's mobile phone manufacturing to 50% domestic value addition."},{k:"D",t:"MPMS was approved on 15 July 2025."},{k:"E",t:"MPMS is expected to enable cumulative mobile phone production of ~₹39 lakh crore and generate ~60,000 direct jobs."}],correct:"E",explanation:"MPMS is expected to enable ~₹39 lakh crore cumulative production and ~60,000 direct jobs. It follows PLI-LSEM, whose tenure ended 31 March 2026 (so it is not ongoing alongside MPMS); the scheme was approved on 15 July 2026, not 2025; and it targets 99.2% domestic manufacturing, not merely 50% DVA."},
{id:95,topic:"Semicon 2.0",type:"notamong",difficulty:"Moderate",context:"Consider the following pillars listed under Semicon 2.0:<br>1. Design<br>2. Machines & Materials<br>3. Fabs<br>4. ATMP/OSAT<br>5. R&D<br>6. Talent<br>7. Export Promotion",question:"Which one of the above is NOT one of the six genuine pillars of Semicon 2.0?",options:[{k:"A",t:"7"},{k:"B",t:"2"},{k:"C",t:"4"},{k:"D",t:"5"},{k:"E",t:"6"}],correct:"A",explanation:"'Export Promotion' is not one of the six pillars. The genuine six pillars are Design, Machines & Materials, Fabs, ATMP/OSAT, R&D, and Talent."},
{id:96,topic:"Semicon 2.0",type:"figure",difficulty:"Hard",question:"What is the total outlay of Semicon 2.0 approved by the Union Cabinet in July 2026, and how many categories does it comprise alongside its 6 pillars?",options:[{k:"A",t:"₹1,27,500 crore; 6 categories"},{k:"B",t:"₹1,27,500 crore; 10 categories"},{k:"C",t:"₹76,000 crore; 10 categories"},{k:"D",t:"₹1,00,000 crore; 10 categories"},{k:"E",t:"₹1,27,500 crore; 8 categories"}],correct:"B",explanation:"Semicon 2.0 has an outlay of ₹1,27,500 crore, structured across 6 pillars and 10 categories."},
{id:97,topic:"PMAY-Gramin",type:"numbered",difficulty:"Moderate",context:"As on 3 August 2026, consider the following statements about PMAY-G:<br>1. Against a target of 4.18 crore houses, 3.91 crore have been sanctioned and 3.12 crore completed.<br>2. SC/ST earmarking is a minimum of 60% of the national target.<br>3. Special projects for disaster-affected families can utilise up to 5% of the target.<br>4. Maharashtra recorded the highest completions in FY2025-26.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"4 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"C",explanation:"Chhattisgarh recorded the highest completions (5,92,508 houses) in FY2025-26; Maharashtra had the highest sanctions (9,40,849 houses), making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:98,topic:"MSME Amendment Bill 2026",type:"statement",difficulty:"Hard",question:"Which one of the following statements about the MSME Development (Amendment) Bill, 2026 is correct?",options:[{k:"A",t:"The Bill makes the Udyam Portal a temporary registration platform valid for 5 years."},{k:"B",t:"Mediation under the Act must be completed within 30 days of first appearance."},{k:"C",t:"The Bill retains criminal penalties for MSME-related violations without any change."},{k:"D",t:"The Bill mandates courts to order payment of at least 50% of the awarded amount to micro/small enterprise suppliers if a set-aside application is pending for more than six months."},{k:"E",t:"Arbitration reference must occur within 90 days after mediation terminates."}],correct:"D",explanation:"The Bill mandates courts to order payment of at least 50% of the awarded amount pending a set-aside application beyond six months. The Udyam Portal is made permanent (not temporary); mediation must complete within 90 days (not 30); arbitration reference is within 30 days after mediation terminates (not 90); and penalties are decriminalised with graded civil penalties replacing conviction-based fines."},
{id:99,topic:"PNG Connections Incentive Scheme",type:"figure",difficulty:"Hard",question:"Effective from 1 September 2026, what incentive is given to CGD companies for incremental billed Domestic PNG connections, and what payback period reduction is expected?",options:[{k:"A",t:"Additional 100 SCM of APM gas; payback period reduced from ~10 years to ~5 years"},{k:"B",t:"Additional 200 SCM of APM gas; payback period reduced from ~15 years to ~5 years"},{k:"C",t:"Additional 300 SCM of APM gas; payback period reduced from ~10 years to ~3 years"},{k:"D",t:"Additional 200 SCM of APM gas; payback period reduced from ~8 years to ~3 years"},{k:"E",t:"Additional 200 SCM of APM gas per incremental connection; payback period reduced from ~10 years to ~3 years"}],correct:"E",explanation:"The scheme provides an additional 200 SCM of APM gas per incremental billed Domestic PNG connection, expected to reduce the payback period from ~10 years to ~3 years."},
{id:100,topic:"RRBs Credit Delivery FY2025-26",type:"numbered",difficulty:"Hard",context:"Consider the following statements about Regional Rural Banks' (RRBs) credit delivery in FY 2025-26:<br>1. Gross Loans Outstanding rose to ₹5.78 lakh crore, up 10.3% from ₹5.24 lakh crore in FY 2024-25.<br>2. Average PSL achievement was 91.7% of ANBC against a prescribed target of 75%.<br>3. Agriculture & Allied Activities accounted for ₹3.78 lakh crore, or 77% of total PSL.<br>4. MSME credit accounted for ₹66,978 crore, representing 25% of PSL.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"4 only"},{k:"B",t:"1 and 4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"MSME credit of ₹66,978 crore represented 13.6% of PSL, not 25%, making statement 4 incorrect. Statements 1, 2 and 3 correctly state the RRB figures."},
{id:101,topic:"UNCCD Grasslands Guide",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about India's Guide to Grasslands and Other Open Natural Ecosystems (ONEs) is correct?",options:[{k:"A",t:"It was launched at COP28 to the UNFCCC in Dubai."},{k:"B",t:"It was launched at the 17th Session of COP17 to the UNCCD in Ulaanbaatar, Mongolia, under MoEF&CC's aegis."},{k:"C",t:"The Guide was prepared solely by ISRO's Space Applications Centre without any other partner organisation."},{k:"D",t:"It focuses exclusively on India's coastal wetlands rather than grasslands."},{k:"E",t:"It was released by the Ministry of Agriculture & Farmers Welfare."}],correct:"B",explanation:"The Guide was launched at UNCCD COP17 in Ulaanbaatar, Mongolia, under the aegis of MoEF&CC, and organised by ATREE in collaboration with IUCN, CoE-SLM, ICFRE and SAC-ISRO — multiple partners, not ISRO alone."},
{id:102,topic:"Logistics Data Bank",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the Logistics Data Bank (LDB):<br>1. LDB was launched in 2016, expanded pan-India in 2017, and achieved 100% coverage of manufacturing SEZs and CFSs in 2024.<br>2. LDB 2.0 was launched in September 2025, enabling high-seas tracking of export containers.<br>3. LDB receives over 1.5 crore container searches per month on average.<br>4. LDB tracks approximately 50% of India's EXIM containers.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"4 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"C",explanation:"LDB tracks 100% of India's EXIM containers, not approximately 50%, making statement 4 incorrect. Statements 1, 2 and 3 correctly reflect the chapter."},
{id:103,topic:"WPI, OPPI & IPPI",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the revised WPI series:<br>1. The new base year is 2022-23, with the number of items increased to 957 from 697.<br>2. Solar, Wind & Nuclear Electricity have been included as new energy sources.<br>3. Weight calculation now uses Gross Value of Output (GVO), replacing Net Traded Value.<br>4. WPI will be discontinued immediately, being replaced overnight by PPI.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"D",explanation:"WPI will continue for 5 years alongside PPI before being discontinued — not replaced overnight — making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:104,topic:"WPI, OPPI & IPPI",type:"figure",difficulty:"Hard",question:"Under the new WPI series weights, what is the weight assigned to 'Manufactured Products'?",options:[{k:"A",t:"69.94%"},{k:"B",t:"22.75%"},{k:"C",t:"14.11%"},{k:"D",t:"55.12%"},{k:"E",t:"63.12%"}],correct:"E",explanation:"Manufactured Products carry a weight of 63.12% in the new WPI series (Primary Articles: 22.75%, Fuel & Power: 14.11%). Note: 69.94% is the OPPI weight for Manufactured Products, a different index."},
{id:105,topic:"Index of Core Industries",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the revised Index of Core Industries (ICI):<br>1. The new base year is 2022-23, replacing 2011-12.<br>2. The number of core industries increased from 8 to 9 with the addition of Iron Ore.<br>3. Electricity has the highest weight among core industries at 30.932%.<br>4. The overall linking factor between the old and new ICI series is 1.75.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"4 only"},{k:"B",t:"1 and 4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"The overall linking factor between old and new ICI series is 1.47, not 1.75, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:106,topic:"Index of Core Industries",type:"figure",difficulty:"Moderate",question:"As per the revised ICI weights, which industry ranks 2nd by weight, and what is its weight?",options:[{k:"A",t:"Steel – 17.584%"},{k:"B",t:"Refinery Products – 22.572%"},{k:"C",t:"Crude Oil – 7.430%"},{k:"D",t:"Coal – 5.596%"},{k:"E",t:"Cement – 4.410%"}],correct:"B",explanation:"Refinery Products rank 2nd with a weight of 22.572%, after Electricity at 30.932%."},
{id:107,topic:"PMIS Industry Awards",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the PMIS Industry Awards (August 2026) is correct?",options:[{k:"A",t:"Reliance Industries Limited won the 'Overall Industry Champion' award."},{k:"B",t:"ONGC won the 'Top Private Partners' category."},{k:"C",t:"Mahindra & Mahindra Limited won the 'Overall Industry Champion' award."},{k:"D",t:"IBM India won the 'Pre-Internship Excellence Award'."},{k:"E",t:"HDFC Bank won the 'Innovation in Exit Pathways Award'."}],correct:"C",explanation:"Mahindra & Mahindra Limited won the 'Overall Industry Champion' award. ONGC was a Top PSU Partner (not Top Private Partner); IBM India won 'Innovation in Program Implementation Award' (not Pre-Internship Excellence); and HDFC Bank won the Pre-Internship Excellence Award (not Exit Pathways)."},
{id:108,topic:"Bima Bharosa",type:"figure",difficulty:"Moderate",question:"Under Bima Bharosa, the insurance grievance redressal mechanism regulated by IRDAI, within how many days must a complaint be resolved, and how many languages does the call centre support?",options:[{k:"A",t:"21 days; 12 languages"},{k:"B",t:"14 days; 22 languages"},{k:"C",t:"30 days; 12 languages"},{k:"D",t:"14 days; 12 languages"},{k:"E",t:"14 days; 10 languages"}],correct:"D",explanation:"Bima Bharosa complaints must be resolved within 14 days, and the IRDAI call centre provides multilingual support in 12 languages."},
{id:109,topic:"NITI Aayog Reports & Studies",type:"numbered",difficulty:"Hard",context:"Consider the following statements about NITI Aayog's report 'Key Sectors to Position India as a Global Manufacturing Hub':<br>1. The current report analyses four sectors: Chemicals, Telecom & Networking Equipment, Textiles and Solar PV Manufacturing.<br>2. Reports on 8 more sectors are planned to follow.<br>3. Textiles contribute ~2% of GDP and 11% of manufacturing GVA.<br>4. India is the largest telecom market globally with over 2 billion subscribers.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"India is the 2nd-largest telecom market with 1.2 billion+ subscribers, not the largest with over 2 billion, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:110,topic:"SAMRIDH Programme",type:"acronym",difficulty:"Easy",question:"What does SAMRIDH, MeitY's startup accelerator programme, stand for?",options:[{k:"A",t:"Startup Accelerator of MeitY for Product Innovation, Development and Growth"},{k:"B",t:"Startup Assistance for Manufacturing, Research, Innovation and Digital Hub"},{k:"C",t:"Support and Acceleration for MSME Research, Innovation and Development Hub"},{k:"D",t:"Scheme for Accelerating MeitY's Research in Innovation and Digital Hub"},{k:"E",t:"Startup Accelerator for Modern Research, Innovation and Digital Hub"}],correct:"A",explanation:"SAMRIDH stands for Startup Accelerator of MeitY for Product Innovation, Development and Growth, implemented by MeitY Startup Hub under Digital India Corporation."},
{id:111,topic:"Skills Outcomes Fund",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the Skills Outcomes Fund (SOF):<br>1. It has a proposed corpus of ₹530 crore, with ₹225 crore from Government/MSDE and ₹305 crore from private funders.<br>2. Payment to training providers is linked to verified employment outcomes, not enrolment.<br>3. Under the outcome-based payment model, Certification carries 30% weight, Job Placement 40%, and 3-month Retention 30%.<br>4. SOF was launched independently of NSDC.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"B",explanation:"SOF was launched by MSDE in collaboration with NSDC, not independently, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:112,topic:"CPI Base 2024",type:"figure",difficulty:"Moderate",question:"As per the revised CPI 2024 series for July 2026, what is the year-on-year inflation rate, and which division carries the highest weight?",options:[{k:"A",t:"4.45%; Housing, water, electricity, gas and other fuels (36.75% weight)"},{k:"B",t:"3.96%; Food and beverages (36.75% weight)"},{k:"C",t:"4.45%; Food and beverages (36.75% weight)"},{k:"D",t:"4.45%; Food and beverages (17.67% weight)"},{k:"E",t:"4.84%; Food and beverages (36.75% weight)"}],correct:"C",explanation:"The all-India CPI inflation for July 2026 was 4.45% (provisional), with Food and beverages carrying the highest weight at 36.75%."},
{id:113,topic:"Manufacturing GVA CAGR",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the revised National Accounts Series is correct?",options:[{k:"A",t:"The new base year is 2022-23 (old base year: 2004-05)."},{k:"B",t:"Manufacturing's share in total GVA declined to 14.8% in 2025-26."},{k:"C",t:"The revised series was released in August 2026."},{k:"D",t:"The new base year is 2022-23 (old base year: 2011-12), and CAGR of Manufacturing GVA at constant prices during 2022-23 to 2025-26 is 10.88%."},{k:"E",t:"CAGR of Manufacturing GVA is 8.88%."}],correct:"D",explanation:"The new base year is 2022-23 (old: 2011-12); CAGR of Manufacturing GVA at constant prices for 2022-23 to 2025-26 is 10.88%; manufacturing's GVA share increased (not declined) to 14.8%; and the series was released in February 2026, not August 2026."},
{id:114,topic:"RSVC-AMRIT Platform (NABARD)",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the RSVC-AMRIT platform:<br>1. It was developed by NABARD in collaboration with the Office of the Principal Scientific Adviser (OPSA).<br>2. NABARD support for each RuTAGe Smart Village Centre (RSVC) is up to ₹30 lakh, for a 3-year duration, covering 10-20 villages.<br>3. 8 RSVCs are currently being supported by NABARD.<br>4. The Centre of Excellence on RSVCs has been established at NABARD's Regional Office, Delhi.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"The Centre of Excellence on RSVCs was established at NABARD Head Office, Mumbai, not at a Regional Office in Delhi, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:115,topic:"RSVC-AMRIT Platform (NABARD)",type:"acronym",difficulty:"Moderate",question:"Under the RSVC-AMRIT institutional framework, what is NABFOUNDATION's role?",options:[{k:"A",t:"A subsidiary of NABARD and implementation partner under the tripartite MoU"},{k:"B",t:"An independent regulatory body overseeing NABARD"},{k:"C",t:"A joint venture between NABARD and OPSA with no implementation role"},{k:"D",t:"A subsidiary of the Ministry of Science & Technology"},{k:"E",t:"The nodal agency for RSVC funding disbursement to state governments only"}],correct:"A",explanation:"NABFOUNDATION is a subsidiary of NABARD and serves as the implementation partner under the tripartite MoU between NABARD, OPSA and NABFOUNDATION."},
{id:116,topic:"Jan Aushadhi Kendras",type:"figure",difficulty:"Easy",question:"As of 30 June 2026, which state has the highest number of Jan Aushadhi Kendras (JAKs)?",options:[{k:"A",t:"Kerala"},{k:"B",t:"Uttar Pradesh"},{k:"C",t:"Karnataka"},{k:"D",t:"Maharashtra"},{k:"E",t:"Bihar"}],correct:"B",explanation:"Uttar Pradesh has the highest number of Jan Aushadhi Kendras (4,226) as of 30 June 2026, followed by Kerala and Karnataka."},
{id:117,topic:"Handloom Producer Companies / Weaver MUDRA",type:"figure",difficulty:"Hard",question:"Under the Concessional Credit/Weaver MUDRA Scheme, what is the Margin Money Assistance cap for individual weavers versus handloom organisations?",options:[{k:"A",t:"20% of loan amount, max ₹50,000 for individuals and ₹10 lakh for organisations"},{k:"B",t:"10% of loan amount, max ₹25,000 for individuals and ₹20 lakh for organisations"},{k:"C",t:"20% of loan amount, max ₹25,000 for individual weavers and ₹20 lakh for handloom organisations"},{k:"D",t:"20% of loan amount, max ₹25,000 for individuals and ₹30 lakh for organisations"},{k:"E",t:"25% of loan amount, max ₹20,000 for individuals and ₹20 lakh for organisations"}],correct:"C",explanation:"Margin Money Assistance is 20% of the loan amount, subject to a maximum of ₹25,000 for individual weavers and ₹20 lakh for handloom organisations."},
{id:118,topic:"SMILE-Beggary Scheme",type:"numbered",difficulty:"Moderate",context:"As of 31 July 2026, consider the following statements about the SMILE-Beggary Scheme:<br>1. Since inception, ₹45.59 crore has been released.<br>2. 10,446 persons, including 2,824 children, have been rehabilitated.<br>3. Tamil Nadu has rehabilitated the highest number of adult beneficiaries at 1,557.<br>4. Every Beggar/Shelter Home must undergo a third-party audit every five years.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"D",explanation:"The audit requirement is at least once every two years, not five years, making statement 4 incorrect. Statements 1, 2 and 3 correctly match the chapter."},
{id:119,topic:"Women SHGs by State",type:"figure",difficulty:"Easy",question:"As per the chapter, which state has the highest number of Women SHGs?",options:[{k:"A",t:"West Bengal"},{k:"B",t:"Uttar Pradesh"},{k:"C",t:"Tamil Nadu"},{k:"D",t:"Andhra Pradesh"},{k:"E",t:"Bihar"}],correct:"E",explanation:"Bihar has the highest number of Women SHGs (13,53,025), followed by West Bengal and Uttar Pradesh."},
{id:120,topic:"Anemia Mukt Bharat 7X7X7",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the Anemia Mukt Bharat Abhiyaan's 7X7X7 Framework, released 29 June 2026:<br>1. The framework shifts from a 6X6X6 to a 7X7X7 strategy.<br>2. The 7 beneficiary groups include Children 6-59 months and Women of reproductive age 20-49 years.<br>3. The earlier T3 approach (Test, Treat, Talk) has been expanded to T4 (Test, Treat, Talk, Track).<br>4. The framework was released during the 12th Central Council of Health and Family Welfare meeting.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"4 only"},{k:"B",t:"1 and 4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"The framework was released during the 16th Central Council of Health and Family Welfare (CCHFW) meeting, not the 12th, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:121,topic:"Anemia Mukt Bharat 7X7X7",type:"notamong",difficulty:"Hard",context:"Consider the following listed among the '7 Institutional Mechanisms' under the 7X7X7 framework:<br>1. Intra-ministerial coordination<br>2. National Centre of Excellence & Advanced Research on Anemia<br>3. National AMB Abhiyaan Unit<br>4. State Nutrition Mission Cell<br>5. Convergence with other Ministries<br>6. Anemia Mukt Bharat Abhiyaan Portal<br>7. Digital monitoring through T4 approach",question:"Which one of the above is NOT one of the 7 genuine Institutional Mechanisms listed in the chapter?",options:[{k:"A",t:"1"},{k:"B",t:"4"},{k:"C",t:"3"},{k:"D",t:"6"},{k:"E",t:"5"}],correct:"B",explanation:"'State Nutrition Mission Cell' is a fabricated item, replacing 'Strengthening supply chain & logistics' which is the genuine 4th institutional mechanism listed in the chapter."},
{id:122,topic:"DGCES",type:"figure",difficulty:"Moderate",question:"The Digital General Crop Estimation Survey (DGCES) was initially piloted in which season, and how many States/UTs is it currently implemented across?",options:[{k:"A",t:"Piloted Rabi 2022-23 in 15 States; currently implemented across 20 States/UTs"},{k:"B",t:"Piloted Kharif 2023-24 in 22 States; currently implemented across 23 States/UTs"},{k:"C",t:"Piloted Kharif 2023-24 in 10 States; currently implemented across 23 States/UTs"},{k:"D",t:"Piloted Kharif 2024-25 in 10 States; currently implemented across 23 States/UTs"},{k:"E",t:"Piloted Kharif 2023-24 in 10 States; currently implemented across 28 States/UTs"}],correct:"C",explanation:"DGCES was piloted in Kharif 2023-24 in selected districts of 10 States, expanded in Rabi 2023-24 to 22 States/UTs, and is currently implemented across 23 States/UTs."},
{id:123,topic:"PARIVARTAN Scheme",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the PARIVARTAN Scheme:<br>1. It was approved on 3 June 2026 by the Union Cabinet and launched on 14 July 2026.<br>2. It is being funded through the NCRPB under MoHUA and implemented by MoRTH.<br>3. The total outlay is ₹9,585 crore, including ₹5,041 crore Central budgetary support.<br>4. It provides a 100% road-tax waiver for 5 years and a registration-fee waiver.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"D",explanation:"The road-tax waiver under PARIVARTAN is for 10 years, not 5 years, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:124,topic:"PARIVARTAN Scheme",type:"acronym",difficulty:"Moderate",question:"What does PARIVARTAN stand for in the context of the vehicle-replacement scheme for Delhi-NCR?",options:[{k:"A",t:"Programme for Advanced Regulation of Interstate Vehicles for Reduction of Toxic Air and Noise"},{k:"B",t:"Plan for Accelerated Retrofitting of Interstate Vehicles for Air quality and Traffic Network"},{k:"C",t:"Programme for Accelerated Replacement of Interstate Vehicles for Air pollution and Traffic"},{k:"D",t:"Programme for Accelerated Renewal of Interstate Vehicles for Regulation of Air and Noise"},{k:"E",t:"Programme for Accelerated Renewal and Incentivization of Vehicle Assets for Reducing Transport Air pollution and Network emissions"}],correct:"E",explanation:"PARIVARTAN stands for Programme for Accelerated Renewal and Incentivization of Vehicle Assets for Reducing Transport Air Pollution and Network Emissions."},
{id:125,topic:"IIP Growth",type:"figure",difficulty:"Moderate",question:"As per the revised Index of Industrial Production (base year 2022-23), what is the weightage of the Manufacturing group?",options:[{k:"A",t:"76.062%"},{k:"B",t:"63.12%"},{k:"C",t:"11.053%"},{k:"D",t:"69.94%"},{k:"E",t:"80.5%"}],correct:"A",explanation:"Manufacturing carries a weightage of 76.062% under the revised IIP (base year 2022-23), followed by Mining & Quarrying (11.053%) and Electricity & Gas Supply (10.865%)."},
{id:126,topic:"IIP Growth",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the revised Index of Industrial Production is correct?",options:[{k:"A",t:"IIP for July 2026 grew at 7.3%, higher than June 2026's 6.7%."},{k:"B",t:"The revised basket consists of 1,042 products mapped to 463 item groups, compared to 839 items mapped to 407 item groups in the 2011-12 series."},{k:"C",t:"The IIP Quick Estimate is released on the 20th of every month."},{k:"D",t:"IIP is released by the Office of Economic Adviser (OEA)."},{k:"E",t:"The base year for the revised IIP series is 2011-12."}],correct:"B",explanation:"The revised basket has 1,042 products/463 item groups vs. 839/407 earlier. July 2026 IIP growth was 6.7% (lower than June's 7.3%, not higher); the Quick Estimate is released on the 28th, not 20th; IIP is released by NSO, not OEA (OEA releases WPI/ICI); and the base year is 2022-23, not 2011-12."},
{id:127,topic:"Marine Fish Resources Accounts",type:"statement",difficulty:"Hard",question:"Which one of the following statements about MoSPI's concept paper on Experimental Monetary Asset Accounts of Marine Fish Resources is correct?",options:[{k:"A",t:"It is based exclusively on India's own indigenous accounting framework with no international linkage."},{k:"B",t:"MoSPI has followed SEEA since 2010."},{k:"C",t:"It is based on the UN System of Environmental-Economic Accounting (SEEA) Central Framework, which MoSPI has followed since 2018 through the EnviStats India series."},{k:"D",t:"The methodology draws on an OECD (2015) compilation guide."},{k:"E",t:"The concept paper focuses solely on freshwater fish resources."}],correct:"C",explanation:"The framework is based on the UN SEEA Central Framework, followed by MoSPI since 2018 via EnviStats India; the methodology draws on OECD (2025), not 2015; and it focuses on marine fish resources, not freshwater."},
{id:128,topic:"JJM 2.0 / SBM-G 2.0 Convergence",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the convergence of JJM 2.0 and SBM-G 2.0 under the VB-G RAM G Act, 2025:<br>1. Water security is one of the Act's 4 thematic focus areas.<br>2. Convergent activities are to be incorporated through Viksit Gram Panchayat Plans (VGPPs).<br>3. Works are to be registered and geo-tagged on the Viksit Bharat National Rural Infrastructure Stack.<br>4. States are to use the 'Bhuvan' Geospatial Planning tool for water budgeting.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"D",explanation:"The geospatial planning tool named in the chapter is 'Yuktdhara', not 'Bhuvan', making statement 4 incorrect. Statements 1, 2 and 3 correctly reflect the chapter."},
{id:129,topic:"GENESIS EIR Programme",type:"acronym",difficulty:"Easy",question:"What does GENESIS, the MeitY startup programme, stand for?",options:[{k:"A",t:"Generating Entrepreneurship for New Emerging Startups in India"},{k:"B",t:"Global Entrepreneurship Network for Startups and Innovation Support"},{k:"C",t:"Gen-Next Ecosystem for Startups and Innovation Support"},{k:"D",t:"Government Enterprise Network for Startups and Innovative Support"},{k:"E",t:"Gen-Next Support for Innovative Startups"}],correct:"E",explanation:"GENESIS stands for Gen-Next Support for Innovative Startups, implemented by MeitY Startup Hub (MSH)."},
{id:130,topic:"GENESIS EIR Programme",type:"figure",difficulty:"Moderate",question:"What is the financial assistance available under GENESIS EIR Cohort-3, and its total budget outlay?",options:[{k:"A",t:"Up to ₹10 lakh through participating incubators; total budget outlay ₹490 crore"},{k:"B",t:"Up to ₹25 lakh through participating incubators; total budget outlay ₹490 crore"},{k:"C",t:"Up to ₹10 lakh; total budget outlay ₹250 crore"},{k:"D",t:"Up to ₹15 lakh; total budget outlay ₹490 crore"},{k:"E",t:"Up to ₹10 lakh; total budget outlay ₹590 crore"}],correct:"A",explanation:"GENESIS EIR Cohort-3 offers financial assistance of up to ₹10 lakh through participating GENESIS incubators, with a total budget outlay of ₹490 crore, targeting Tier-II and Tier-III cities."},
{id:131,topic:"SSBSK",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about Samagra Shishu Bal Swasthya Karyakram (SSBSK) is correct?",options:[{k:"A",t:"SSBSK is implemented by the Ministry of Women & Child Development."},{k:"B",t:"The Shaishav App supports SSBSK implementation by identifying at-risk newborns/children and tracking home visits, referrals and follow-up."},{k:"C",t:"The national workshop on SSBSK was held in New Delhi."},{k:"D",t:"SSBSK focuses exclusively on adolescent health, excluding newborns."},{k:"E",t:"The Shaishav App has no role in referral tracking."}],correct:"B",explanation:"The Shaishav App supports SSBSK by identifying at-risk newborns/children and tracking home visits, referrals, follow-up and supervision. SSBSK is under the Ministry of Health & Family Welfare, and the workshop was held in Chhatrapati Sambhajinagar, Maharashtra, not New Delhi."},
{id:132,topic:"Reimagining Skilling Report / ISSA",type:"numbered",difficulty:"Hard",context:"Consider the following statements about NITI Aayog's 'Reimagining Skilling for Viksit Bharat@2047' report:<br>1. It identifies 5 key learner/workforce segments, including NEET youth (15-29 years).<br>2. NEET stands for Not in Education, Employment or Training.<br>3. 8.7 crore NEET youth should be equated with unemployed youth.<br>4. ISSA, a ₹600 crore scheme, was introduced in Union Budget 2026-27.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 3 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"C",explanation:"The chapter explicitly clarifies that 8.7 crore NEET youth should NOT be equated with unemployed youth, making statement 3 incorrect. Statements 1, 2 and 4 are correct."},
{id:133,topic:"Sujalam Bharat DPI",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the Sujalam Bharat Digital Public Infrastructure (DPI) policy is correct?",options:[{k:"A",t:"It was issued by the Ministry of Rural Development, not the Ministry of Jal Shakti."},{k:"B",t:"It focuses exclusively on urban water utility governance."},{k:"C",t:"It was released as a component of the Atal Bhujal Yojana."},{k:"D",t:"It establishes a secure, federated, interoperable and accountable framework for sharing and governing rural drinking water data."},{k:"E",t:"It replaces the Jal Jeevan Mission entirely."}],correct:"D",explanation:"The policy establishes a secure, federated, interoperable and accountable data-sharing framework, issued by DDWS under the Ministry of Jal Shakti — positioning Sujalam Bharat as long-term DPI for rural (not urban) water utility governance."},
{id:134,topic:"CMLRE Deep-Sea Fishery Report",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the CMLRE's National Report on Deep-Sea and Distant-Water Fishery Resources:<br>1. India's EEZ covers 2.37 million sq. km, and the report compiles nearly 4 decades of oceanographic research.<br>2. The FORV Sagar Sampada is India's flagship Fishery and Oceanographic Research Vessel.<br>3. The mesopelagic 'Twilight Zone' extends from 200-1,000 metres deep.<br>4. Kollam Bank and Angria Bank were identified as biodiversity hotspots by NIOT, not CMLRE.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"The report itself (released by MoES through CMLRE) identified Kollam Bank and Angria Bank as biodiversity hotspots — NIOT is not mentioned in this context, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:135,topic:"AISHE 2022-23 & 2023-24",type:"numbered",difficulty:"Hard",context:"Consider the following statements from the AISHE reports for 2022-23 and 2023-24:<br>1. The Gross Enrolment Ratio (GER) rose from 23.7 in 2014-15 to 30 in 2023-24.<br>2. The Gender Parity Index (GPI) for 2023-24 stands at 1.08, remaining above 1.0 for seven consecutive years.<br>3. Total higher education enrolment reached 4.50 crore in 2023-24, a 31.5% increase since 2014-15.<br>4. The number of universities increased to 1,289 in 2023-24, a growth of 45%.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"4 only"},{k:"B",t:"1 and 4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"The number of universities grew by 69.6% (not 45%) to reach 1,289 in 2023-24, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:136,topic:"AISHE 2022-23 & 2023-24",type:"figure",difficulty:"Hard",question:"What was the participation rate of Higher Education Institutions (HEIs) in the AISHE survey for 2023-24?",options:[{k:"A",t:"56,180 out of 60,380 registered HEIs participated"},{k:"B",t:"59,533 out of 64,756 registered HEIs participated (more than 90%)"},{k:"C",t:"59,533 out of 70,000 registered HEIs participated"},{k:"D",t:"64,756 out of 64,756 registered HEIs participated (100%)"},{k:"E",t:"50,000 out of 64,756 registered HEIs participated"}],correct:"B",explanation:"In 2023-24, 59,533 out of 64,756 registered HEIs participated in AISHE — more than 90%. (56,180 out of 60,380 was the corresponding figure for 2022-23.)"},
{id:137,topic:"Semicon 2.0",type:"figure",difficulty:"Hard",question:"Under Semicon 2.0's Deployment-Linked Incentive (DLI) for newly launched semiconductor IPs/Chips/SoCs, what is the reimbursement rate and the maximum ceiling per application?",options:[{k:"A",t:"9% reimbursement on net sales for 3 years, maximum ₹50 crore/application"},{k:"B",t:"15% reimbursement on net sales for 5 years, maximum ₹30 crore/application"},{k:"C",t:"9% reimbursement on net sales for 5 years, maximum ₹30 crore/application and ₹120 crore/company"},{k:"D",t:"9% reimbursement on net sales for 5 years, maximum ₹120 crore/application"},{k:"E",t:"9% reimbursement on gross sales for 5 years, maximum ₹30 crore/application"}],correct:"C",explanation:"The DLI offers 9% reimbursement on net sales for 5 years, capped at ₹30 crore per application and ₹120 crore per company (including group companies)."},
{id:138,topic:"Yuva Sangam Phase VII",type:"acronym",difficulty:"Easy",question:"Under Yuva Sangam's '5 Ps' framework, which of the following is one of the five Ps?",options:[{k:"A",t:"Pariksha (Examination)"},{k:"B",t:"Poshan (Nutrition)"},{k:"C",t:"Panchayat (Local Governance)"},{k:"D",t:"Paraspar Sampark (People-to-People Connect)"},{k:"E",t:"Prashasan (Administration)"}],correct:"D",explanation:"The 5 Ps of Yuva Sangam are: Paryatan, Parampara, Pragati, Paraspar Sampark, and Prodyogiki. 'Paraspar Sampark' (People-to-People Connect) is one of them; the other options are not part of this framework."},
{id:139,topic:"Yuva Sangam Phase VII",type:"figure",difficulty:"Moderate",question:"Yuva Sangam Phase VII's registration deadline was extended till which date, and what is the age eligibility for participants?",options:[{k:"A",t:"15 September 2026; age 18-25 years"},{k:"B",t:"31 August 2026; age 15-29 years"},{k:"C",t:"30 September 2026; age 18-30 years"},{k:"D",t:"31 August 2026; age 21-35 years"},{k:"E",t:"31 August 2026; age 18-30 years"}],correct:"E",explanation:"The registration deadline for Phase VII was extended to 31 August 2026, with eligibility for youth aged 18-30 years."},
{id:140,topic:"GDCBA",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the Global Digital Capacity Building Alliance (GDCBA):<br>1. It was launched on 20 February 2026 at the India AI Impact Summit, New Delhi.<br>2. It is an initiative of the Capacity Building Commission (CBC), Government of India.<br>3. It builds on Mission Karmayogi.<br>4. It has three stated goals, focused solely on domestic Indian civil service reform.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"4 only"},{k:"B",t:"1 and 4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"GDCBA has four stated goals (not three) and is aimed at creating a global platform for public-sector capacity building, not limited to domestic Indian civil service reform, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:141,topic:"BRICS Tourism Ministers - Jaipur Declaration",type:"notamong",difficulty:"Moderate",context:"Consider the following listed as the four thematic priorities of the Jaipur Declaration:<br>1. Artificial Intelligence and Tourism<br>2. Sustainability and Responsible Tourism<br>3. Tourism Skilling and Capacity Building<br>4. Tourism Exchanges and Seamless Travel Facilitation<br>5. Tourism Investment and Infrastructure Financing",question:"Which one of the above is NOT among the four genuine thematic priorities of the Jaipur Declaration?",options:[{k:"A",t:"1"},{k:"B",t:"5"},{k:"C",t:"3"},{k:"D",t:"4"},{k:"E",t:"2"}],correct:"B",explanation:"'Tourism Investment and Infrastructure Financing' is a fabricated priority. The genuine four are AI & Tourism, Sustainability & Responsible Tourism, Tourism Skilling & Capacity Building, and Tourism Exchanges & Seamless Travel Facilitation."},
{id:142,topic:"PM Rahat Scheme",type:"figure",difficulty:"Moderate",question:"Under the PM Rahat Scheme (Golden Hour cashless treatment), what is the maximum treatment coverage and time-window for claiming it?",options:[{k:"A",t:"Cashless treatment up to ₹2.5 lakh, up to 7 days from the date of accident"},{k:"B",t:"Cashless treatment up to ₹1.5 lakh, up to 15 days from the date of accident"},{k:"C",t:"Cashless treatment up to ₹1.5 lakh, up to 7 days from the date of accident"},{k:"D",t:"Cashless treatment up to ₹1 lakh, up to 7 days from the date of accident"},{k:"E",t:"Cashless treatment up to ₹1.5 lakh, up to 3 days from the date of accident"}],correct:"C",explanation:"The scheme provides cashless treatment up to ₹1.5 lakh, up to 7 days from the date of the accident, to all road accident victims irrespective of insurance status."},
{id:143,topic:"RRB Net Profit FY2025-26",type:"numbered",difficulty:"Moderate",context:"Consider the following statements about Regional Rural Banks' performance in FY 2025-26:<br>1. RRBs recorded a record net profit of ₹10,176 crore, with total business crossing ₹13.5 lakh crore.<br>2. GNPA stood at 5.3% and NNPA at 2.1%, both at all-time lows.<br>3. The Credit-Deposit Ratio reached an all-time high of 75.2%.<br>4. 28 RRBs operate through 22,273 branches across 26 States and 3 UTs.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2 and 3 only"},{k:"B",t:"2, 3 and 4 only"},{k:"C",t:"1 and 4 only"},{k:"D",t:"1, 2, 3 and 4"},{k:"E",t:"1, 3 and 4 only"}],correct:"D",explanation:"All four statements accurately reflect the RRB performance figures given in the chapter for FY 2025-26."},
{id:144,topic:"India's Steel Sector",type:"figure",difficulty:"Moderate",question:"During April-July 2026, which state was the largest crude steel-producing state, and what was its share?",options:[{k:"A",t:"Chhattisgarh, with 19.6% share"},{k:"B",t:"Odisha, with 25% share"},{k:"C",t:"Jharkhand, with 19.6% share"},{k:"D",t:"Karnataka, with 19.6% share"},{k:"E",t:"Odisha, with 19.6% share"}],correct:"E",explanation:"Odisha was the largest crude steel-producing state during April-July 2026, with a 19.6% share. Vietnam was India's top finished-steel export destination during the same period."},
{id:145,topic:"Gnani Artha (Sovereign AI Stack)",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about 'Gnani Artha' is correct?",options:[{k:"A",t:"It is a sovereign AI stack developed by GNANI AI, comprising the LLM Evon 3.3 and the connector Plexus."},{k:"B",t:"It was launched by the Prime Minister at Rashtrapati Bhavan."},{k:"C",t:"Evon 3.3 is the connector module, while Plexus is the LLM."},{k:"D",t:"Gnani Artha is a joint venture between India and France."},{k:"E",t:"It was developed by NASSCOM."}],correct:"A",explanation:"Gnani Artha, developed by GNANI AI, was launched by Vice President C.P. Radhakrishnan at Uprashtrapati Bhavan. It comprises Evon 3.3 (the LLM) and Plexus (which connects AI intelligence with real-world work) — option C reverses these roles."},
{id:146,topic:"NM-ICPS",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the National Mission on Interdisciplinary Cyber-Physical Systems (NM-ICPS):<br>1. It was approved by the Union Cabinet in 2018 with an outlay of ₹3,660 crore for 9 years.<br>2. It is implemented by the Department of Science & Technology (DST).<br>3. 25 Technology Innovation Hubs (TIHs) have been established as Section 8 companies under NM-ICPS.<br>4. The CHANAKYA Fellowship Programme under NM-ICPS supports only PhD researchers.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"B",explanation:"CHANAKYA supports undergraduate, postgraduate, PhD and postdoctoral researchers — not PhD researchers only — making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:147,topic:"CIC AppCoMS 2.0",type:"figure",difficulty:"Moderate",question:"When was the Appeal and Complaint Management System (AppCoMS) originally introduced, and when was version 2.0 launched?",options:[{k:"A",t:"Originally introduced September 2018; AppCoMS 2.0 launched 17 August 2026"},{k:"B",t:"Originally introduced September 2016; AppCoMS 2.0 launched 15 August 2026"},{k:"C",t:"Originally introduced September 2016; AppCoMS 2.0 launched 17 August 2026"},{k:"D",t:"Originally introduced 2020; AppCoMS 2.0 launched 17 August 2026"},{k:"E",t:"Originally introduced September 2016; AppCoMS 2.0 launched 26 August 2026"}],correct:"C",explanation:"AppCoMS was originally introduced in September 2016; AppCoMS 2.0 was launched by the Central Information Commission on 17 August 2026."},
{id:148,topic:"Operation GLOBAL-HUNT",type:"statement",difficulty:"Easy",question:"Which agency conducted Operation GLOBAL-HUNT to bring back international drug trafficker Virender Singh Basoya to India?",options:[{k:"A",t:"Central Bureau of Investigation (CBI)"},{k:"B",t:"Enforcement Directorate (ED)"},{k:"C",t:"National Investigation Agency (NIA)"},{k:"D",t:"Narcotics Control Bureau (NCB)"},{k:"E",t:"Interpol India"}],correct:"D",explanation:"Operation GLOBAL-HUNT was conducted by the Narcotics Control Bureau (NCB) to identify, locate and pursue major narcotics traffickers operating from overseas jurisdictions."},
{id:149,topic:"BRICS Environment Working Group",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the 12th BRICS Environment Ministers Meeting:<br>1. It was hosted in New Delhi on 18 August 2026 at Bharat Mandapam.<br>2. The BRICS Environment Working Group (EWG) was established in 2015 during the first BRICS Environment Ministers' Meeting in Moscow.<br>3. The Contact Group on Climate Change and Sustainable Development was established in 2024.<br>4. The theme of India's BRICS Chairship 2026 is 'Building for Resilience, Innovation, Cooperation and Sustainability'.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2 and 3 only"},{k:"B",t:"2, 3 and 4 only"},{k:"C",t:"1 and 4 only"},{k:"D",t:"1, 3 and 4 only"},{k:"E",t:"1, 2, 3 and 4"}],correct:"E",explanation:"All four statements correctly reflect the chapter's description of the BRICS Environment Working Group meeting and India's 2026 Chairship theme."},
{id:150,topic:"India's Trade Data April-July 2026-27",type:"figure",difficulty:"Hard",question:"For April-July 2026-27, what was India's total exports (merchandise + services) and the overall trade balance?",options:[{k:"A",t:"Total exports US$316.42 billion; overall trade balance –US$49.43 billion"},{k:"B",t:"Total exports US$365.85 billion; overall trade balance –US$49.43 billion"},{k:"C",t:"Total exports US$316.42 billion; overall trade balance +US$49.43 billion"},{k:"D",t:"Total exports US$279.63 billion; overall trade balance –US$49.43 billion"},{k:"E",t:"Total exports US$316.42 billion; overall trade balance –US$36.42 billion"}],correct:"A",explanation:"Total exports (merchandise + services) were US$316.42 billion, against imports of US$365.85 billion, giving an overall trade balance of –US$49.43 billion."},
{id:151,topic:"India's Trade Data April-July 2026-27",type:"notamong",difficulty:"Hard",context:"Consider the following listed among the top 5 export destinations showing the highest positive growth in export value during April-July 2026-27:<br>1. Tanzania<br>2. Sri Lanka<br>3. Singapore<br>4. South Africa<br>5. Bangladesh",question:"Which one of the above is NOT among the genuine top 5 export destinations by growth rate listed in the chapter?",options:[{k:"A",t:"1"},{k:"B",t:"5"},{k:"C",t:"3"},{k:"D",t:"4"},{k:"E",t:"2"}],correct:"B",explanation:"'Bangladesh' is not in the chapter's list. The genuine top 5 by export growth are Tanzania, Sri Lanka, Singapore, South Africa, and China."},
{id:152,topic:"NCLT e-Services",type:"statement",difficulty:"Easy",question:"Which one of the following statements about NCLT's newly launched services is correct?",options:[{k:"A",t:"NCLT launched only a mobile app for case status tracking."},{k:"B",t:"e-Inspection Service is meant only for government departments, not advocates or litigants."},{k:"C",t:"NCLT launched e-Inspection Service and e-Certified Copy Service to improve access to judicial records."},{k:"D",t:"The two services were launched by NCLAT, not NCLT."},{k:"E",t:"NCLT's new services replace all physical hearings with virtual hearings."}],correct:"C",explanation:"NCLT launched e-Inspection Service (online access to judicial records) and e-Certified Copy Service (faster access to certified copies), benefiting advocates, litigants and other stakeholders."},
{id:153,topic:"E-Samudra",type:"numbered",difficulty:"Hard",context:"Consider the following statements about E-Samudra:<br>1. It was launched on 8 August 2026 by the Union Minister for Ports, Shipping & Waterways in Mumbai.<br>2. It is a single-window digital platform integrating maritime services for seafarers, shipping companies and ports.<br>3. It includes the e-NAVIK 24x7 grievance redressal system and the Digital Seafarers Employment Agreement (d-SEA).<br>4. E-Samudra shifts maritime administration towards a physical office-based model.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"D",explanation:"E-Samudra aims to shift maritime administration from a physical office-based model to Digital First and Faceless Governance — the opposite of statement 4, which is therefore incorrect. Statements 1, 2 and 3 are correct."},
{id:154,topic:"DigiLocker-AAERI Partnership",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the DigiLocker-AAERI partnership ('AAERI Verify') is correct?",options:[{k:"A",t:"AAERI stands for the Association of American Education Representatives in India."},{k:"B",t:"'AAERI Verify' is designed for UK higher education institutions."},{k:"C",t:"DigiLocker is a flagship initiative under the Ministry of Education, not MeitY."},{k:"D",t:"The partnership focuses on employment verification, not education credentials."},{k:"E",t:"NeGD under MeitY partnered with AAERI to launch a source-verified authentication platform streamlining student credential checks for Australian higher education institutions."}],correct:"E",explanation:"NeGD under MeitY partnered with AAERI (Association of Australian Education Representatives in India) to launch 'AAERI Verify', streamlining student credential checks for Australian institutions using DigiLocker, a flagship DPI initiative under MeitY's NeGD."},
{id:155,topic:"Viksit Bharat Yuva Connect",type:"figure",difficulty:"Moderate",question:"What was the duration and theme of the 2026 'Viksit Bharat Yuva Connect Programme'?",options:[{k:"A",t:"16 July-15 August 2026; theme 'Nasha Mukt Yuva for Viksit Bharat'"},{k:"B",t:"1 August-31 August 2026; theme 'Swasth Yuva for Viksit Bharat'"},{k:"C",t:"16 July-15 August 2026; theme 'Digital Yuva for Viksit Bharat'"},{k:"D",t:"1 July-31 July 2026; theme 'Nasha Mukt Yuva for Viksit Bharat'"},{k:"E",t:"16 July-15 September 2026; theme 'Nasha Mukt Yuva for Viksit Bharat'"}],correct:"A",explanation:"The programme ran from 16 July to 15 August 2026 across universities and colleges under the theme 'Nasha Mukt Yuva for Viksit Bharat', organised by MY Bharat under the Ministry of Youth Affairs & Sports."},
{id:156,topic:"Rainbow Trout RAS Facility",type:"statement",difficulty:"Easy",question:"Which one of the following statements about India's first advanced Rainbow Trout RAS facility is correct?",options:[{k:"A",t:"It was established in Himachal Pradesh with support from NABARD."},{k:"B",t:"It was established by Smartgreen Aquaculture Pvt. Ltd. in Telangana with ₹15 crore support under the Venture Capital Fund for Scheduled Castes (VCF-SC)."},{k:"C",t:"RAS stands for Rural Aquaculture Scheme."},{k:"D",t:"The facility received ₹25 crore support under VCF-SC."},{k:"E",t:"It is India's second such facility, after one in Uttarakhand."}],correct:"B",explanation:"The facility was established by Smartgreen Aquaculture Pvt. Ltd. (founded by SC entrepreneur Aditya Rithvik Narra) in Telangana, with ₹15 crore support under the Venture Capital Fund for Scheduled Castes (VCF-SC). RAS stands for Recirculatory Aquaculture System."},
{id:157,topic:"Organ Donation Day",type:"numbered",difficulty:"Moderate",context:"On the occasion of the 16th Indian Organ Donation Day 2026, consider the following statements:<br>1. 'Jug Jug Jiyo Abhiyaan' is a year-long nationwide awareness campaign to promote organ donation.<br>2. e-अंगदान (e-Angdaan) is a unified national digital platform integrating hospitals, doctors, donors and recipients.<br>3. The initiatives were launched by the Union Minister of Health and Family Welfare.<br>4. The platform covers registration, wait-list management, organ allocation and monitoring.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2, 3 and 4"},{k:"B",t:"2, 3 and 4 only"},{k:"C",t:"1, 2 and 4 only"},{k:"D",t:"1 and 4 only"},{k:"E",t:"1, 3 and 4 only"}],correct:"C",explanation:"The chapter attributes the call for strengthening the organ donation movement to Union Minister of State for Health, Smt. Anupriya Patel — not the Union Minister (Cabinet rank) — making statement 3 imprecise/incorrect as framed. Statements 1, 2 and 4 correctly describe the new initiatives."},
{id:158,topic:"Clouded Leopard Conservation Action Plan",type:"figure",difficulty:"Moderate",question:"The Clouded Leopard Conservation Action Plan (CAP) was released at which meeting, and how many Priority Conservation Landscapes does it identify?",options:[{k:"A",t:"90th meeting of SCNBWL, Guwahati; 14 Priority Conservation Landscapes"},{k:"B",t:"91st meeting of SCNBWL, Coimbatore; 20 Priority Conservation Landscapes"},{k:"C",t:"91st meeting of SCNBWL, New Delhi; 14 Priority Conservation Landscapes"},{k:"D",t:"91st meeting of the Standing Committee of the National Board of Wildlife (SCNBWL), Coimbatore; 14 Priority Conservation Landscapes"},{k:"E",t:"91st meeting of SCNBWL, Coimbatore; 10 Priority Conservation Landscapes"}],correct:"D",explanation:"The CAP was released at the 91st meeting of the Standing Committee of the National Board of Wildlife (SCNBWL) in Coimbatore, identifying 14 Priority Conservation Landscapes focused on Northeast India."},
{id:159,topic:"Clouded Leopard Conservation Action Plan",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the Clouded Leopard Conservation Action Plan is correct?",options:[{k:"A",t:"International Clouded Leopard Day is observed on 4th September."},{k:"B",t:"The plan uses only camera traps for monitoring, without genetics or eDNA methods."},{k:"C",t:"IDWH stands for Integrated Development of Wetland Habitats."},{k:"D",t:"The plan's focus region is primarily Western India."},{k:"E",t:"It was prepared under a Government of India-GEF-UNDP initiative, and the Clouded Leopard is included under the Species Recovery Programme of the IDWH Scheme."}],correct:"E",explanation:"The CAP was prepared under a GoI-GEF-UNDP initiative; the Clouded Leopard is included under the Species Recovery Programme of the Integrated Development of Wildlife Habitats (IDWH) Scheme — not Wetland Habitats. International Clouded Leopard Day is 4th August (not September), and the focus region is Northeast India, not Western India."},
{id:160,topic:"Telecom Manufacturing Zone (Gwalior)",type:"figure",difficulty:"Moderate",question:"India's first Telecom Manufacturing Zone (TMZ) is being set up in Gwalior through an SPV with what equity structure, and what cumulative investment commitment has been secured?",options:[{k:"A",t:"51% equity from Government of Madhya Pradesh, 49% from Department of Telecommunications; ₹5,500 crore cumulative investment"},{k:"B",t:"49% equity from Government of Madhya Pradesh, 51% from DoT; ₹5,500 crore investment"},{k:"C",t:"51% equity from DoT, 49% from Government of Madhya Pradesh; ₹5,500 crore investment"},{k:"D",t:"50:50 equity split; ₹5,500 crore investment"},{k:"E",t:"51% equity from Government of Madhya Pradesh, 49% from DoT; ₹4,500 crore investment"}],correct:"A",explanation:"The TMZ SPV has 51% equity from the Government of Madhya Pradesh and 49% from the Department of Telecommunications, with cumulative investment commitments of ₹5,500 crore secured."},
{id:161,topic:"IPC Recognition by WHO-SEARN",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the Indian Pharmacopoeia Commission's (IPC) recognition by WHO-SEARN:<br>1. IPC was recognised as a Regional Centre of Excellence in Pharmacovigilance and a Technical Centre in Quality of Medicines.<br>2. WHO-SEARN was established in 2016 by the WHO South-East Asia Regional Office.<br>3. The recognition was announced at the 10th Anniversary Meeting of SEARN held in Kathmandu, Nepal.<br>4. SEARN stands for South-East Asia Regional Nutrition network.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"B",explanation:"SEARN stands for WHO South-East Asia Regulatory Network (not Nutrition network), making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:162,topic:"National Gopal Ratna Award",type:"figure",difficulty:"Moderate",question:"Under which mission is the National Gopal Ratna Award (NGRA) 2026 given, and what is the 1st prize amount for 'Best Dairy Farmer'?",options:[{k:"A",t:"National Livestock Mission; 1st prize ₹5 lakh"},{k:"B",t:"Rashtriya Gokul Mission; 1st prize ₹10 lakh"},{k:"C",t:"Rashtriya Gokul Mission (RGM); 1st prize ₹5 lakh"},{k:"D",t:"Rashtriya Gokul Mission; 1st prize ₹3 lakh"},{k:"E",t:"National Dairy Plan; 1st prize ₹5 lakh"}],correct:"C",explanation:"NGRA is given under the Rashtriya Gokul Mission (launched December 2014); the Best Dairy Farmer category carries 1st prize ₹5 lakh, 2nd ₹3 lakh, and 3rd ₹2 lakh."},
{id:163,topic:"NABL Mobile Food Testing Labs",type:"statement",difficulty:"Easy",question:"Which one of the following statements about NABL's new accreditation scheme is correct?",options:[{k:"A",t:"The scheme was launched by FSSAI, not NABL."},{k:"B",t:"The scheme applies only to laboratories in metro cities."},{k:"C",t:"NABL stands for National Agency for Building and Land testing."},{k:"D",t:"NABL launched India's first-of-its-kind Accreditation Scheme for Mobile Food Testing Laboratories under the Integrated Assessment Programme (IAP)."},{k:"E",t:"The scheme replaces all conventional (fixed) food testing laboratories."}],correct:"D",explanation:"NABL (National Accreditation Board for Testing and Calibration Laboratories) launched the scheme under the Integrated Assessment Programme (IAP), extending accredited food testing beyond conventional laboratories to mobile units."},
{id:164,topic:"Schemes in News (Misc.)",type:"numbered",difficulty:"Hard",context:"Consider the following statements about One Stop Centres (OSCs):<br>1. OSCs are funded under the Nirbhaya Fund and implemented since 1st April 2015.<br>2. 1,033 OSCs have been approved, of which 991 are functional, assisting over 15.20 lakh women.<br>3. Counselling and temporary shelter is provided for up to five days, extendable up to 20 days.<br>4. OSCs are located far from government hospitals to maintain privacy for victims.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"OSCs are located within or near government hospitals (not far from them) for ease of access to medical assistance, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:165,topic:"Schemes in News (Misc.)",type:"figure",difficulty:"Hard",question:"SANKALP: Hub for Empowerment of Women was launched under which sub-scheme, and how many District HEWs are currently functional?",options:[{k:"A",t:"Samarthya sub-scheme; 765 District HEWs functional"},{k:"B",t:"Sambal sub-scheme; 765 District HEWs functional"},{k:"C",t:"Samarthya sub-scheme; 500 District HEWs functional"},{k:"D",t:"Mission Shakti umbrella scheme directly; 765 District HEWs functional"},{k:"E",t:"Samarthya sub-scheme; 36 District HEWs functional"}],correct:"A",explanation:"SANKALP: HEW was launched on 1st April 2022 under the Samarthya sub-scheme, and 765 District HEWs (along with 36 State HEWs) are currently functional across the country."},
{id:166,topic:"Schemes in News (Misc.)",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the NAVYA scheme:<br>1. NAVYA was launched in June 2025 by MSDE in partnership with the Ministry of Women & Child Development.<br>2. It targets adolescent girls aged 16-18 years in aspirational districts.<br>3. It originally covered 27 districts across 19 States, targeting training of 3,850 girls under PMKVY 4.0.<br>4. The Government expanded NAVYA to 100 aspirational districts effective 27 May 2026.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2 and 3 only"},{k:"B",t:"1, 2, 3 and 4"},{k:"C",t:"2, 3 and 4 only"},{k:"D",t:"1 and 4 only"},{k:"E",t:"1, 3 and 4 only"}],correct:"B",explanation:"All four statements correctly reflect the chapter's description of the NAVYA programme's launch, target group, initial coverage and expansion."},
{id:167,topic:"Schemes in News (Misc.)",type:"figure",difficulty:"Moderate",question:"What is the total corpus of the Maritime Development Fund, and how is it split between the Maritime Investment Fund and Interest Incentivization Fund?",options:[{k:"A",t:"₹30,000 crore total; ₹25,000 crore + ₹5,000 crore"},{k:"B",t:"₹25,000 crore total; ₹15,000 crore + ₹10,000 crore"},{k:"C",t:"₹25,000 crore total; ₹20,000 crore Maritime Investment Fund + ₹5,000 crore Interest Incentivization Fund"},{k:"D",t:"₹20,000 crore total; ₹15,000 crore + ₹5,000 crore"},{k:"E",t:"₹25,000 crore total; ₹20,000 crore + ₹5,000 crore, with 100% Government equity in the Investment Fund"}],correct:"C",explanation:"The Maritime Development Fund has a total corpus of ₹25,000 crore — a ₹20,000 crore Maritime Investment Fund (with 49% Government equity participation) and a ₹5,000 crore Interest Incentivization Fund."},
{id:168,topic:"Schemes in News (Misc.)",type:"statement",difficulty:"Hard",question:"Which one of the following statements about the restructured phase of PM SVANidhi is correct?",options:[{k:"A",t:"The restructured phase was approved in 2020 alongside the scheme's original launch."},{k:"B",t:"It aims to benefit only 50 lakh street vendors in total."},{k:"C",t:"Street Food Hubs under the restructured scheme receive up to ₹10 crore per hub."},{k:"D",t:"Approved by the Union Cabinet on 27 August 2025, lending under the restructured scheme has been extended up to 31 March 2030, aiming to benefit 1.15 crore street vendors including 50 lakh new beneficiaries."},{k:"E",t:"The scheme was extended only up to 31 March 2027."}],correct:"D",explanation:"The restructured phase, approved 27 August 2025, extends lending till 31 March 2030, aiming to benefit 1.15 crore street vendors including 50 lakh new beneficiaries; 50 Street Food Hubs are planned with financial assistance of up to ₹4 crore per hub (not ₹10 crore)."},
{id:169,topic:"PM-AASHA",type:"intersection",difficulty:"Hard",context:"Consider the following features associated with PM-AASHA's Price Support Scheme (PSS) and Price Deficiency Payment Scheme (PDPS):<br>1. Mainly covers oilseeds among other crops<br>2. Involves physical procurement of the commodity<br>3. Procurement/compensation is routed through agencies like NAFED and NCCF<br>4. Farmers are compensated directly in their bank accounts, without any physical procurement<br>5. Permits procurement up to 100% of State production for Tur, Urad and Masur",question:"Which of the above features are common to BOTH the Price Support Scheme (PSS) and the Price Deficiency Payment Scheme (PDPS)?",options:[{k:"A",t:"1 and 3 only"},{k:"B",t:"2 and 4 only"},{k:"C",t:"1, 2 and 5 only"},{k:"D",t:"None of the above"},{k:"E",t:"1 only"}],correct:"E",explanation:"Both PSS and PDPS mainly cover oilseeds (statement 1). Physical procurement (2), NAFED/NCCF routing (3), and the 100% procurement limit for Tur/Urad/Masur (5) apply specifically to PSS, while direct bank compensation without procurement (4) is unique to PDPS. Hence only statement 1 is common to both."},
{id:170,topic:"National Handloom Day 2026",type:"intersection",difficulty:"Hard",context:"Consider the following components associated with the Sant Kabir Handloom Award and the National Handloom Award:<br>1. Cash prize of ₹3.5 lakh<br>2. A mounted gold coin<br>3. A tamrapatra (copper plate)<br>4. A shawl<br>5. A certificate<br>6. Cash prize of ₹2 lakh",question:"Which of the above are common to BOTH the Sant Kabir Handloom Award and the National Handloom Award?",options:[{k:"A",t:"3, 4 and 5 only"},{k:"B",t:"1, 3, 4 and 5"},{k:"C",t:"2, 3 and 4 only"},{k:"D",t:"1 and 6 only"},{k:"E",t:"All of the above"}],correct:"A",explanation:"Both awards include a tamrapatra, a shawl and a certificate (statements 3, 4, 5). The ₹3.5 lakh cash prize and mounted gold coin (1, 2) are unique to the Sant Kabir Award, while the ₹2 lakh cash prize (6) is unique to the National Handloom Award."},
{id:171,topic:"Schemes in News (Misc.)",type:"figure",difficulty:"Easy",question:"As per the chapter, how much has been disbursed under PM-Matru Vandana Yojana, and to how many beneficiaries?",options:[{k:"A",t:"More than ₹15,000 crore disbursed to more than 4.60 crore beneficiaries"},{k:"B",t:"More than ₹21,343 crore disbursed to more than 4.60 crore beneficiaries"},{k:"C",t:"More than ₹21,343 crore disbursed to more than 3 crore beneficiaries"},{k:"D",t:"More than ₹31,343 crore disbursed to more than 4.60 crore beneficiaries"},{k:"E",t:"More than ₹21,343 crore disbursed to more than 5.60 crore beneficiaries"}],correct:"B",explanation:"Under PM-Matru Vandana Yojana, more than ₹21,343 crore has been disbursed to more than 4.60 crore beneficiaries, as stated in the chapter."},
{id:172,topic:"Schemes in News (Misc.)",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the Swavalambini programme:<br>1. It was launched in February 2025 by MSDE in collaboration with NITI Aayog's Women Entrepreneurship Platform.<br>2. It is being implemented across Assam, Meghalaya, Mizoram, Uttar Pradesh and Telangana.<br>3. It fosters an entrepreneurial mindset among women through Entrepreneurship Awareness and Development Programmes.<br>4. It exclusively targets women in Union Territories only.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"4 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"C",explanation:"Swavalambini is implemented across five named States (Assam, Meghalaya, Mizoram, Uttar Pradesh, Telangana), not restricted to Union Territories, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:173,topic:"Schemes in News (Misc.)",type:"figure",difficulty:"Easy",question:"As per the chapter's 'Schemes in News' section, by which year does India target malaria elimination?",options:[{k:"A",t:"2025"},{k:"B",t:"2035"},{k:"C",t:"2047"},{k:"D",t:"2030"},{k:"E",t:"2027"}],correct:"D",explanation:"The chapter notes India's Malaria Elimination Target as 2030."},
{id:174,topic:"National Handloom Day 2026",type:"acronym",difficulty:"Moderate",question:"What does SCDP, a component of the National Handloom Development Programme (NHDP), stand for?",options:[{k:"A",t:"State Cooperative Development Plan"},{k:"B",t:"Special Craft Development Programme"},{k:"C",t:"Sustainable Cluster Development Project"},{k:"D",t:"Small Cottage Development Programme"},{k:"E",t:"Small Cluster Development Programme"}],correct:"E",explanation:"SCDP stands for Small Cluster Development Programme, which sanctions up to ₹2 crore/cluster, with 357 clusters sanctioned under NHDP."},
{id:175,topic:"NADCP",type:"statement",difficulty:"Easy",question:"Which one of the following statements about the Bharat Pashudhan Portal is correct?",options:[{k:"A",t:"It is a digital platform integrating livestock registration and FMD/Brucellosis vaccination data, with each animal receiving a unique 12-digit Tag ID."},{k:"B",t:"It assigns each animal a unique 10-digit Tag ID."},{k:"C",t:"By July 2026, more than 50 crore livestock had been registered on the portal."},{k:"D",t:"The portal is managed by the Ministry of Rural Development."},{k:"E",t:"The portal covers only bovine species and excludes sheep and goats."}],correct:"A",explanation:"The Bharat Pashudhan Portal assigns each animal a unique 12-digit Tag ID, and by July 2026, more than 39 crore livestock (not 50 crore) had been registered."},
