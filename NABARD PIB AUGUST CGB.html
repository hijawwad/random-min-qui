<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABARD Grade A — PIB August 2026 Practice Quiz</title>
<style>
:root{
  --bg:#12141c; --bg2:#181b26; --card:#1e2230; --card2:#252a3b;
  --border:#33394d; --text:#e9ebf3; --muted:#a6acc2; --muted2:#7d84a0;
  --accent:#d9a441; --accent2:#f0c674; --serif:'Georgia','Cambria','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --green:#3fb27f; --green-bg:#173628; --red:#e0616b; --red-bg:#3a1f24;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{min-height:100vh;}
#app{max-width:820px;margin:0 auto;padding:20px 16px 60px;}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:0.2px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
.brand{display:flex;flex-direction:column;}
.brand .kicker{color:var(--accent2);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;}
.brand h1{font-size:22px;margin:2px 0 0;color:var(--text);}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:99px;font-size:12px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
.mode-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:10px;}
@media(min-width:640px){.mode-grid{grid-template-columns:1fr 1fr 1fr;}}
.mode-card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:transform .15s ease,border-color .15s ease;text-align:left;}
.mode-card:hover{transform:translateY(-3px);border-color:var(--accent);}
.mode-card .icon{font-size:26px;margin-bottom:8px;display:block;}
.mode-card h3{margin:0 0 6px;font-size:17px;color:var(--accent2);}
.mode-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;}
.btn{background:var(--accent);color:#241a05;border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--sans);transition:filter .15s;}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.toggle-group{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.toggle-group button{background:var(--card2);color:var(--muted);border:none;padding:8px 16px;cursor:pointer;font-size:13px;font-family:var(--sans);}
.toggle-group button.active{background:var(--accent);color:#241a05;font-weight:700;}
.section-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px;max-height:60vh;overflow-y:auto;padding-right:4px;}
@media(min-width:640px){.section-grid{grid-template-columns:1fr 1fr;}}
.section-tile{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.section-tile:hover{border-color:var(--accent);}
.section-tile .name{font-size:13.5px;color:var(--text);line-height:1.35;}
.section-tile .count{font-size:12px;color:var(--muted2);background:var(--bg2);border-radius:99px;padding:3px 9px;white-space:nowrap;}
.progress-wrap{background:var(--card2);border-radius:99px;height:8px;overflow:hidden;margin:12px 0;}
.progress-bar{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;transition:width .25s ease;}
.quiz-topbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap;gap:6px;}
.score-badge{color:var(--accent2);font-weight:700;}
.context-box{background:var(--bg2);border-left:3px solid var(--accent);padding:12px 14px;border-radius:6px;font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:14px;}
.qtext{font-size:16px;line-height:1.6;margin-bottom:16px;color:var(--text);}
.qmeta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted2);text-transform:uppercase;letter-spacing:0.5px;}
.tag.diff-Easy{color:#8fd0a8;border-color:#2f5c43;}
.tag.diff-Moderate{color:#e8c877;border-color:#5c4f2f;}
.tag.diff-Hard{color:#e79a9a;border-color:#5c2f2f;}
.option{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s, background .15s;font-size:14.5px;line-height:1.5;}
.option:hover:not(.locked){border-color:var(--accent);}
.option .k{font-weight:700;color:var(--accent2);min-width:20px;}
.option.correct{background:var(--green-bg);border-color:var(--green);}
.option.wrong{background:var(--red-bg);border-color:var(--red);}
.option.locked{cursor:default;}
.option.dim{opacity:.55;}
.feedback{margin-top:6px;padding:14px;border-radius:10px;font-size:14px;line-height:1.6;}
.feedback.correct{background:var(--green-bg);border:1px solid var(--green);color:#c9ecd9;}
.feedback.wrong{background:var(--red-bg);border:1px solid var(--red);color:#f3cfd2;}
.feedback.skipped{background:var(--card2);border:1px solid var(--border);color:var(--muted);}
.feedback b{color:var(--accent2);}
.footer-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px;flex-wrap:wrap;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
.stat-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.stat-box .num{font-size:22px;font-weight:700;color:var(--accent2);font-family:var(--serif);}
.stat-box .label{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.review-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.review-item .rq{font-size:13.5px;color:var(--text);margin-bottom:6px;line-height:1.5;}
.review-item .status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:6px;}
.status.wrong{color:#f3cfd2;background:var(--red-bg);}
.status.skipped{color:var(--muted);background:var(--bg2);}
.review-item .exp{font-size:13px;color:var(--muted);line-height:1.55;margin-top:6px;}
.back-link{color:var(--muted2);font-size:13px;cursor:pointer;text-decoration:none;}
.back-link:hover{color:var(--accent2);}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.empty-note{color:var(--muted2);font-size:13px;padding:20px;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const QUIZ_DATA = [
{id:1,topic:"India's Makhana Sector",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about India's Makhana sector is correct?",options:[{k:"A",t:"The National Makhana Board was announced in Union Budget 2024-25 and launched in Patna."},{k:"B",t:"Bihar accounts for nearly three-fourths of India's makhana production and around 80-85% of global supply."},{k:"C",t:"The Central Sector Scheme for Development of Makhana has an outlay of ₹576.03 crore for 2025-26 to 2030-31."},{k:"D",t:"Mithila Makhana received its GI Tag in 2015-26 covering only the Mithila region."},{k:"E",t:"Sabour Makhana-1 and Bihar Sona are the two improved varieties promoted under the scheme."}],correct:"B",explanation:"Bihar accounts for nearly three-fourths of India's production and 80-85% of global supply. The National Makhana Board was announced in Budget 2025-26 and launched in Bihar (not Patna specifically stated, but not 2024-25); the Central Sector Scheme outlay is ₹476.03 crore, not ₹576.03 crore; improved varieties are Swarna Vaidehi and Sabour Makhana-1."},
{id:2,topic:"India's Makhana Sector",type:"numbered",difficulty:"Moderate",context:"Consider the following statements regarding India's makhana exports and market:<br>1. In 2025-26, India exported 7,264.89 MT of makhana products.<br>2. The USA, Canada and UAE together account for 77% of India's total makhana exports.<br>3. Average makhana prices rose from around ₹500/kg during 2020-22 to nearly ₹1,250/kg in 2025.<br>4. Germany is among the premium export markets with the highest average unit price of $26.0/kg.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1 and 2 only"},{k:"B",t:"1, 2 and 3 only"},{k:"C",t:"1, 2, 3 and 4"},{k:"D",t:"2, 3 and 4 only"},{k:"E",t:"1 and 4 only"}],correct:"C",explanation:"All four statements are correct as per the chapter: exports of 7,264.89 MT in 2025-26; USA, Canada and UAE together account for 77% of exports; prices rose from ~₹500/kg to ~₹1,250/kg; and Germany tops premium markets at $26.0/kg."},
{id:3,topic:"India's Makhana Sector",type:"figure",difficulty:"Easy",question:"As per the 2nd Advance Estimate for 2025-26, what were India's makhana production and productivity figures respectively?",options:[{k:"A",t:"Production 60,000 MT; Productivity 2.00 MT/ha"},{k:"B",t:"Production 90,590 MT; Productivity 2.34 MT/ha"},{k:"C",t:"Production 80,590 MT; Productivity 2.00 MT/ha"},{k:"D",t:"Production 80,590 MT; Productivity 2.34 MT/ha"},{k:"E",t:"Production 70,590 MT; Productivity 2.50 MT/ha"}],correct:"D",explanation:"National 2025-26 (2nd AE) figures: Production 80,590 MT, productivity 2.34 MT/ha. (Option B is actually Bihar's own figures, not the national figure.)"},
{id:4,topic:"PMJVM (Van Dhan Yojana)",type:"numbered",difficulty:"Hard",context:"Recently, as of 31 July 2026, the following statements were reported about Van Dhan Vikas Kendras (VDVKs) under PMJVM:<br>1. 4,172 VDVKs have been sanctioned and 2,911 are functional.<br>2. Around 12.48 lakh tribal members have been linked to VDVKs.<br>3. At least 75% of VDVK members must be Scheduled Tribes.<br>4. About 15 SHGs, comprising around 300 tribals, form one VDVK.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 only"},{k:"B",t:"2 and 4 only"},{k:"C",t:"1 and 3 only"},{k:"D",t:"None of the above"},{k:"E",t:"3 only"}],correct:"E",explanation:"The minimum ST membership requirement is 60%, not 75%, making statement 3 incorrect. Statements 1, 2 and 4 correctly match the chapter's figures."},
{id:5,topic:"PMJVM (Van Dhan Yojana)",type:"acronym",difficulty:"Easy",question:"What does TRIFED, the body that markets tribal products and procures MFP at MSP, stand for?",options:[{k:"A",t:"Tribal Cooperative Marketing Development Federation of India"},{k:"B",t:"Tribal Rural Infrastructure and Federation Development of India"},{k:"C",t:"Tribal Cooperative Marketing and Development Foundation of India"},{k:"D",t:"Tribal Commodity Marketing and Export Federation of India"},{k:"E",t:"Tribal Cooperative Manufacturing and Development Federation of India"}],correct:"A",explanation:"TRIFED stands for Tribal Cooperative Marketing Development Federation of India."},
{id:6,topic:"PM-AASHA",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the components of PM-AASHA is correct?",options:[{k:"A",t:"Under the Price Deficiency Payment Scheme (PDPS), the government undertakes physical procurement of oilseeds at MSP."},{k:"B",t:"The Market Intervention Scheme (MIS) is activated when prices of TOP crops fall by at least 10% over the previous normal season's rate."},{k:"C",t:"From 2024-25, the Price Support Scheme allows procurement of up to 50% of a State/UT's production initially."},{k:"D",t:"The Price Stabilization Fund is now merged with PM-AASHA and is managed by the Ministry of Agriculture."},{k:"E",t:"PM-AASHA was launched in September 2016 with three components."}],correct:"B",explanation:"MIS is activated when market prices fall by at least 10% over the previous normal season's rate. PDPS involves no physical procurement (only compensates the price difference); PSS initial procurement limit is up to 25%, not 50%; PSF is managed by the Department of Consumer Affairs, not the Ministry of Agriculture; PM-AASHA was launched in September 2018 with four components."},
{id:7,topic:"PM-AASHA",type:"numbered",difficulty:"Moderate",context:"Consider the following statements about PM-AASHA's Price Support Scheme (PSS):<br>1. Procurement under PSS is carried out mainly through agencies such as NAFED and NCCF.<br>2. For Tur, Urad and Masur, procurement is permitted up to 100% of State production.<br>3. Additional procurement beyond the initial limit can be approved up to 25% of national production.<br>4. PSS primarily covers foodgrains such as wheat and rice.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2, 3 and 4 only"},{k:"C",t:"1, 2 and 3 only"},{k:"D",t:"1, 2, 3 and 4"},{k:"E",t:"1 and 3 only"}],correct:"C",explanation:"PSS mainly covers pulses, oilseeds and copra — not foodgrains like wheat and rice — making statement 4 incorrect. Statements 1, 2 and 3 are correct as per the chapter."},
{id:8,topic:"NADCP",type:"statement",difficulty:"Moderate",question:"Which one of the following statements regarding the National Animal Disease Control Programme (NADCP) is NOT correct?",options:[{k:"A",t:"NADCP was launched in September 2019 to control Foot and Mouth Disease and Brucellosis."},{k:"B",t:"NADCP is a part of the Livestock Health and Disease Control Programme (LHDCP), whose 2026-27 budget is ₹2,010 crore."},{k:"C",t:"Brucellosis vaccination is a one-time lifetime vaccination for female bovine calves aged 4-8 months."},{k:"D",t:"FMD vaccination targets 100% coverage of eligible livestock once every year."},{k:"E",t:"By July 2026, more than 39 crore livestock had been registered on the Bharat Pashudhan Portal."}],correct:"D",explanation:"FMD vaccination targets 100% coverage twice a year (every 6 months), not once a year. All other statements correctly match the chapter."},
{id:9,topic:"NADCP",type:"figure",difficulty:"Hard",question:"As per the chapter, the NSP antibody prevalence for FMD in India declined from which value in 2019 to which value in 2025?",options:[{k:"A",t:"25.8% in 2019 to 8.1% in 2025"},{k:"B",t:"20.8% in 2019 to 10.1% in 2025"},{k:"C",t:"18.8% in 2019 to 8.1% in 2025"},{k:"D",t:"20.8% in 2019 to 5.1% in 2025"},{k:"E",t:"20.8% in 2019 to 8.1% in 2025"}],correct:"E",explanation:"NSP antibody prevalence declined from 20.8% (2019) to 8.1% (2025), as stated in the chapter."},
{id:10,topic:"NADCP",type:"numbered",difficulty:"Hard",context:"Regarding the Pandemic Fund Project under NADCP's One Health approach, consider the following statements:<br>1. It was launched in 2024 titled 'Animal Health Security Strengthening in India for Pandemic Preparedness and Response'.<br>2. It is a US$25 million project supported by the G20 Pandemic Fund.<br>3. It is implemented solely by India's Ministry of Fisheries, Animal Husbandry & Dairying without international partners.<br>4. The National One Health Mission was approved by PM-STIAC in its 21st meeting on 7 July 2022.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"3 only"},{k:"B",t:"1 and 3 only"},{k:"C",t:"2 only"},{k:"D",t:"1, 2 and 4 only"},{k:"E",t:"3 and 4 only"}],correct:"A",explanation:"The project is implemented in partnership with the Asian Development Bank, FAO and World Bank — not solely by the Ministry — so statement 3 is incorrect. Statements 1, 2 and 4 are correct."},
{id:11,topic:"Regenerative Agriculture Schemes",type:"notamong",difficulty:"Moderate",context:"Consider the following major government initiatives listed under Regenerative Agriculture in the chapter:<br>1. National Mission on Natural Farming (NMNF)<br>2. Paramparagat Krishi Vikas Yojana (PKVY)<br>3. Per Drop More Crop (PDMC)<br>4. Rainfed Area Development (RAD)<br>5. National Agroforestry Productivity Mission (NAPM)<br>6. Soil Health Card Scheme",question:"Which one of the above is NOT an actual initiative mentioned in the chapter under this theme?",options:[{k:"A",t:"1"},{k:"B",t:"5"},{k:"C",t:"3"},{k:"D",t:"4"},{k:"E",t:"6"}],correct:"B",explanation:"The chapter lists the Sub-Mission on Agroforestry (SMAF), not a 'National Agroforestry Productivity Mission (NAPM)' — this is a fabricated name. All the others are genuine initiatives named in the chapter."},
{id:12,topic:"Regenerative Agriculture Schemes",type:"numbered",difficulty:"Moderate",context:"Consider the following statements about the National Mission on Natural Farming (NMNF):<br>1. It was launched in 2024.<br>2. It provides an output-based incentive of ₹4,000 per acre per year for two years, covering up to one acre per farmer.<br>3. The mission envisages 10,000 need-based Bio-input Resource Centres.<br>4. Each natural farming cluster is supported by three Community Resource Persons (CRPs).",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2, 3 and 4"},{k:"B",t:"2, 3 and 4 only"},{k:"C",t:"1, 2 and 3 only"},{k:"D",t:"1 and 4 only"},{k:"E",t:"1, 3 and 4 only"}],correct:"C",explanation:"Each cluster is supported by two CRPs, not three, making statement 4 incorrect. Statements 1, 2 and 3 are correct as per the chapter."},
{id:13,topic:"Regenerative Agriculture Schemes",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about Per Drop More Crop (PDMC) financial assistance is correct?",options:[{k:"A",t:"All farmers, irrespective of category, receive a uniform 50% assistance for micro-irrigation."},{k:"B",t:"Small and marginal farmers receive 45% financial assistance and other farmers receive 55%."},{k:"C",t:"PDMC provides 100% assistance to all farmer categories for drip and sprinkler systems."},{k:"D",t:"Small and marginal farmers receive 55% financial assistance and other farmers receive 45%."},{k:"E",t:"Only small and marginal farmers are eligible for any assistance under PDMC."}],correct:"D",explanation:"Under PDMC, small and marginal farmers receive 55% financial assistance while other farmers receive 45%, as stated in the chapter."},
{id:14,topic:"Regenerative Agriculture Schemes",type:"figure",difficulty:"Moderate",question:"Under the Paramparagat Krishi Vikas Yojana (PKVY), farmers adopting organic farming are supported with how much financial assistance, and what total area had been covered under PKVY as of 31 October 2025?",options:[{k:"A",t:"₹30,000/hectare over three years; 16.90 lakh ha covered"},{k:"B",t:"₹31,500/hectare over three years; 18.90 lakh ha covered"},{k:"C",t:"₹25,000/hectare over two years; 16.90 lakh ha covered"},{k:"D",t:"₹31,500/hectare over three years; 12.90 lakh ha covered"},{k:"E",t:"₹31,500/hectare over three years; 16.90 lakh ha covered"}],correct:"E",explanation:"Farmers under PKVY are supported with ₹31,500/hectare over three years, and 16.90 lakh ha had been covered as of 31 October 2025."},
{id:15,topic:"UPI",type:"numbered",difficulty:"Moderate",context:"Consider the following statements on the evolution of UPI:<br>1. UPI was piloted in April 2016 with 21 member banks, with public rollout in August 2016.<br>2. UPI crossed 1 billion transactions/month in 2019, the same year it expanded internationally to Bhutan.<br>3. UPI Circle was introduced in 2024, enabling primary users to authorise secondary users.<br>4. In 2024, RBI reduced the UPI transaction limit for tax payments from ₹5 lakh to ₹1 lakh per transaction.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"4 only"},{k:"B",t:"1 and 4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 and 4 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"RBI actually enhanced (increased) the UPI transaction limit for tax payments from ₹1 lakh to ₹5 lakh, not reduced it — so statement 4 is incorrect (inverted direction). Statements 1, 2 and 3 are correct."},
{id:16,topic:"UPI",type:"statement",difficulty:"Hard",question:"Which one of the following statements about UPI's global footprint is correct?",options:[{k:"A",t:"In 2024, UPI accounted for approximately 49% of global real-time payment transaction value, as highlighted by the World Bank."},{k:"B",t:"In 2024, UPI accounted for approximately 49% of global real-time payment transaction volume, as highlighted by the IMF."},{k:"C",t:"UPI's global share was highlighted in an IMF report published in December 2025."},{k:"D",t:"UPI is currently operational in over 20 countries including the USA and UK."},{k:"E",t:"BHIM was launched before the public rollout of UPI in 2016."}],correct:"B",explanation:"UPI accounted for ~49% of global real-time payment transaction volume in 2024, per the IMF report 'Growing Retail Digital Payments: The Value of Interoperability' (June 2025). It is operational in 11 named countries (not USA/UK), and BHIM was launched in December 2016, after the August 2016 public rollout."},
{id:17,topic:"5 Years of e-Shram Portal",type:"numbered",difficulty:"Moderate",context:"As of 18 August 2026, consider the following statements about the e-Shram Portal:<br>1. Total registrations stood at 31.89 crore, with women constituting 54.28%.<br>2. 55.21% of registered workers are aged 18-40 years.<br>3. The One-Stop Solution platform, launched on 21 October 2024, integrates 15 Social Security & Welfare Schemes.<br>4. Bhashini enabled multilingual functionality in 22 languages in 2024.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2, 3 and 4"},{k:"B",t:"2, 3 and 4 only"},{k:"C",t:"1, 2 and 3 only"},{k:"D",t:"1 and 4 only"},{k:"E",t:"1, 3 and 4 only"}],correct:"C",explanation:"Bhashini enabled multilingual functionality in 22 languages in 2025, not 2024, making statement 4 incorrect. Statements 1, 2 and 3 correctly match the chapter."},
{id:18,topic:"5 Years of e-Shram Portal",type:"acronym",difficulty:"Easy",question:"What does NDUW, the database created via the e-Shram Portal, stand for?",options:[{k:"A",t:"National Directory of Unemployed Workers"},{k:"B",t:"National Database of Union Workers"},{k:"C",t:"National Data Utility for Workers"},{k:"D",t:"National Database of Unorganised Workers"},{k:"E",t:"National Database of Unregistered Workforce"}],correct:"D",explanation:"NDUW stands for National Database of Unorganised Workers, India's first Aadhaar-authenticated database of its kind, developed by NIC."},
{id:19,topic:"5 Years of e-Shram Portal",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about e-Shram Portal eligibility and registration is correct?",options:[{k:"A",t:"Registration requires a person to be 18+ years and pay a nominal one-time fee of ₹50."},{k:"B",t:"Registered workers get a unique 10-digit Universal Account Number (UAN)."},{k:"C",t:"e-Shram registration is compulsory only for construction workers and excludes gig/platform workers."},{k:"D",t:"Registration requires an Aadhaar number but does not require any mobile number."},{k:"E",t:"Registration requires a person to be 16+ years, an unorganised-sector worker, and not an income-tax payer, EPFO or ESIC member."}],correct:"E",explanation:"Eligibility requires the person to be 16+ years, an unorganised-sector worker, and not an income-tax payer, EPFO member or ESIC member. Registration is free (not fee-based), the UAN is 12-digit, gig/platform workers are covered, and both Aadhaar and mobile number are required."},
{id:20,topic:"India's Sugar Industry",type:"numbered",difficulty:"Moderate",context:"As per the Third Advance Estimate of the Ministry of Agriculture & Farmers Welfare, consider the following statements about India's sugar industry:<br>1. Sugarcane production for 2025-26 is estimated at 500 MMT, up by about 43.5%.<br>2. Cultivated area under sugarcane increased to 58.87 lakh ha.<br>3. India is the world's largest sugarcane producer.<br>4. The FRP for sugar season 2026-27 is ₹365/quintal, based on a 10.25% recovery rate.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"3 only"},{k:"B",t:"1 and 3 only"},{k:"C",t:"4 only"},{k:"D",t:"2 and 4 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"India is the 2nd-largest sugarcane producer globally, not the largest — making statement 3 incorrect. Statements 1, 2 and 4 correctly reflect the chapter's figures."},
{id:21,topic:"India's Sugar Industry",type:"figure",difficulty:"Hard",question:"As per the chapter, what stock limit has been imposed on sugar dealers, and what restriction applies to bulk consumers from 1 September 2026?",options:[{k:"A",t:"500-tonne stock limit for dealers; bulk consumers restricted to 30 days of consumption"},{k:"B",t:"400-tonne stock limit for dealers (1 Aug-30 Nov 2026); bulk consumers restricted to holding stock for not more than 15 days of consumption"},{k:"C",t:"400-tonne stock limit for dealers; bulk consumers restricted to 10 days of consumption"},{k:"D",t:"300-tonne stock limit for dealers; bulk consumers restricted to 15 days of consumption"},{k:"E",t:"400-tonne stock limit for dealers; bulk consumers restricted to 20 days of consumption"}],correct:"B",explanation:"The chapter specifies a 400-tonne stock limit for sugar dealers (1 Aug-30 Nov 2026), and from 1 September 2026 bulk consumers cannot hold stocks exceeding 15 days of consumption."},
{id:22,topic:"12 Years of PM Jan Dhan Yojana",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about PM Jan Dhan Yojana (PMJDY) is correct?",options:[{k:"A",t:"PMJDY was launched on 15th August 2014, initially targeting 'every unbanked adult' before shifting focus to 'every household' in 2018."},{k:"B",t:"PMJDY accounts require a minimum balance of ₹500 to remain active."},{k:"C",t:"PMJDY was launched on 28th August 2014, and its accident insurance cover was enhanced to ₹2 lakh for accounts opened after August 2018."},{k:"D",t:"The overdraft facility under PMJDY is available up to ₹10,000 immediately upon account opening."},{k:"E",t:"PMJDY set a Guinness World Record for the highest number of accounts opened in a single month in January 2015."}],correct:"C",explanation:"PMJDY launched 28 August 2014; accident cover was enhanced to ₹2 lakh for accounts opened after August 2018. The focus shift was the reverse (from 'every household' to 'every unbanked adult' since 2018), there is no minimum balance requirement, overdraft requires 6 months of satisfactory operation, and the Guinness record was for accounts opened in a single week, not month."},
{id:23,topic:"12 Years of PM Jan Dhan Yojana",type:"figure",difficulty:"Moderate",question:"As per data of 19 August 2026, which of the following correctly pairs the total number of PMJDY accounts with the average deposit per account?",options:[{k:"A",t:"54.09 crore accounts; average deposit ₹5,356"},{k:"B",t:"59.09 crore accounts; average deposit ₹4,356"},{k:"C",t:"49.09 crore accounts; average deposit ₹5,356"},{k:"D",t:"59.09 crore accounts; average deposit ₹5,356"},{k:"E",t:"59.09 crore accounts; average deposit ₹6,356"}],correct:"D",explanation:"As on 19.08.2026: 59.09 crore accounts with an average deposit per account of ₹5,356, as stated in the chapter."},
{id:24,topic:"PM Fasal Bima Yojana",type:"numbered",difficulty:"Hard",context:"Consider the following statements about PMFBY's premium-sharing structure:<br>1. Farmer's maximum premium is 2% for Kharif crops.<br>2. Farmer's maximum premium is 1.5% for Rabi foodgrain & oilseed crops.<br>3. Farmer's maximum premium is 5% for commercial/horticultural crops.<br>4. The Centre-State premium subsidy sharing is 60:40 generally and 90:10 for North-Eastern & Himalayan States/UTs.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2, 3 and 4"},{k:"B",t:"2, 3 and 4 only"},{k:"C",t:"1 and 4 only"},{k:"D",t:"1, 3 and 4 only"},{k:"E",t:"1, 2 and 3 only"}],correct:"E",explanation:"The general Centre-State sharing is 50:50 (not 60:40), while it is 90:10 for North-Eastern & Himalayan States/UTs — making statement 4 incorrect. Statements 1, 2 and 3 correctly state the premium caps."},
{id:25,topic:"PM Fasal Bima Yojana",type:"notamong",difficulty:"Moderate",context:"Consider the following technology platforms mentioned in the chapter as being used under PMFBY:<br>1. National Crop Insurance Portal (NCIP)<br>2. YES-TECH<br>3. WINDS<br>4. CROPIC<br>5. AgriSetu<br>6. CLAP",question:"Which one of the above is NOT a genuine PMFBY-linked technology platform mentioned in the chapter?",options:[{k:"A",t:"5"},{k:"B",t:"2"},{k:"C",t:"3"},{k:"D",t:"4"},{k:"E",t:"6"}],correct:"A",explanation:"'AgriSetu' is a fabricated name not mentioned in the chapter. The genuine PMFBY technology platforms named are NCIP, DigiClaim, CCE-Agri App, YES-TECH, WINDS, CROPIC and CLAP."},
{id:26,topic:"PM Fasal Bima Yojana",type:"figure",difficulty:"Moderate",question:"As per the chapter, how much has been allocated to PMFBY in the Union Budget 2026-27, and how many farmer applications had been insured since inception?",options:[{k:"A",t:"₹15,000 crore allocated; 92.46 crore+ applications insured since inception"},{k:"B",t:"₹12,200 crore allocated; 92.46 crore+ applications insured since inception"},{k:"C",t:"₹12,200 crore allocated; 82.46 crore+ applications insured since inception"},{k:"D",t:"₹10,200 crore allocated; 92.46 crore+ applications insured since inception"},{k:"E",t:"₹12,200 crore allocated; 26.33 crore+ applications insured since inception"}],correct:"B",explanation:"₹12,200 crore was allocated in the Union Budget 2026-27, and since inception, 92.46 crore+ farmer applications have been insured (26.33 crore+ have received claims)."},
{id:27,topic:"Water-Smart Farming (PDMC/PM-RKVY)",type:"numbered",difficulty:"Hard",context:"Consider the following statements on the evolution of Per Drop More Crop (PDMC):<br>1. It originally began in January 2006 as the Centrally Sponsored Scheme for Micro Irrigation.<br>2. It was upgraded to the National Mission on Micro Irrigation (NMMI) in 2010-11.<br>3. From FY 2015-16 to FY 2021-22, it was officially named PDMC and implemented under PM-RKVY.<br>4. Since 2022-23, PDMC has been implemented under the Pradhan Mantri Krishi Sinchayee Yojana (PMKSY).",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 only"},{k:"B",t:"2 only"},{k:"C",t:"3 and 4 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"C",explanation:"From FY 2015-16 to FY 2021-22, PDMC was implemented under PMKSY (not PM-RKVY), and since 2022-23 it has been implemented under PM-RKVY (not PMKSY) — the two schemes are swapped in statements 3 and 4, making both incorrect. Statements 1 and 2 are correct."},
{id:28,topic:"Water-Smart Farming (PDMC/PM-RKVY)",type:"statement",difficulty:"Hard",question:"Which one of the following statements about PM-RKVY is correct?",options:[{k:"A",t:"PM-RKVY was launched in 2014-15 and restructured in 2022 as an umbrella scheme merging 6 schemes."},{k:"B",t:"PM-RKVY does not allow States to re-allocate funds between its component schemes."},{k:"C",t:"In 2025-26, ₹3,226.36 crore was released/sanctioned for PM-RKVY as a whole, including ₹8,957.72 crore for PDMC."},{k:"D",t:"PM-RKVY was launched in 2007-08 and restructured in October 2024 as an umbrella scheme merging 9 schemes."},{k:"E",t:"PM-RKVY funding for 'Other Interventions' remains strictly capped at 20% for all States without exception."}],correct:"D",explanation:"PM-RKVY was launched in 2007-08 and restructured in October 2024, merging 9 schemes. It does allow fund re-allocation across components; the 2025-26 figures are ₹8,957.72 crore released for PM-RKVY overall including ₹3,226.36 crore for PDMC (option D reverses these); and States/UTs now have flexibility to exceed the earlier 20%/40% caps based on local requirements."},
{id:29,topic:"Ship Recycling in India",type:"figure",difficulty:"Moderate",question:"By what percentage did India's global ship recycling share and recycling volume increase between 2024 and 2025 respectively?",options:[{k:"A",t:"Global share: 35.1% to 40.4%; Volume: 1.86 million GT to 2.99 million GT"},{k:"B",t:"Global share: 30.1% to 35.4%; Volume: 2.86 million GT to 2.99 million GT"},{k:"C",t:"Global share: 30.1% to 45.4%; Volume: 1.86 million GT to 2.99 million GT"},{k:"D",t:"Global share: 30.1% to 35.4%; Volume: 1.86 million GT to 3.99 million GT"},{k:"E",t:"Global share: 30.1% to 35.4%; Volume: 1.86 million GT to 2.99 million GT (~60% growth)"}],correct:"E",explanation:"India's global ship recycling share increased from 30.1% (2024) to 35.4% (2025), and recycling volume rose from 1.86 million GT to 2.99 million GT, nearly 60% growth."},
{id:30,topic:"Ship Recycling in India",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about India's ship recycling sector is correct?",options:[{k:"A",t:"The Hong Kong International Convention for safe ship recycling came into force on 26 June 2025."},{k:"B",t:"The Alang-Sosiya cluster in Maharashtra accounts for approximately 98% of India's ship recycling activity."},{k:"C",t:"India achieved the Maritime India Vision 2030 ship-recycling target 5 years late."},{k:"D",t:"The Ship-breaking Credit Note offers a credit worth 60% of the recycled ship's scrap value."},{k:"E",t:"India aims to nearly triple its ship recycling capacity to around 9 million LDT."}],correct:"A",explanation:"The Hong Kong International Convention came into force on 26 June 2025. Alang-Sosiya is located in Gujarat (not Maharashtra); India achieved the MIV 2030 target 5 years ahead of schedule (not late); the Credit Note equals 40% of scrap value; and India aims to nearly double (not triple) capacity to ~9 million LDT."},
{id:31,topic:"Container Manufacturing Assistance Scheme (CMAS)",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the Container Manufacturing Assistance Scheme (CMAS):<br>1. CMAS was announced in the Union Budget 2026-27 with a proposed outlay of ₹10,000 crore over 5 years.<br>2. It targets domestic manufacturing capacity of up to 7.5 lakh TEUs annually.<br>3. India imports nearly 2 million empty containers annually.<br>4. The scheme is expected to generate around 30,000 direct and 5,000 indirect jobs.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"B",explanation:"CMAS is expected to generate about ~3,000 direct jobs and 50,000+ indirect jobs — statement 4 reverses and misstates these figures, making it incorrect. Statements 1, 2 and 3 are correct."},
{id:32,topic:"Container Manufacturing Assistance Scheme (CMAS)",type:"statement",difficulty:"Hard",question:"Which one of the following statements about the Bharat Container Shipping Line (BCSL) is correct?",options:[{k:"A",t:"BCSL was established through an MoU signed in February 2025 with an investment of ₹50,000 crore."},{k:"B",t:"Participating entities in BCSL exclude the Shipping Corporation of India."},{k:"C",t:"An MoU for establishing BCSL was signed in February 2026, with a proposed investment of around ₹99,149 crore and fleet development of 51 container vessels."},{k:"D",t:"BCSL's proposed fleet development involves 100 container vessels."},{k:"E",t:"BCSL was announced as part of the Sagarmala Programme rather than a separate MoU."}],correct:"C",explanation:"The MoU for BCSL was signed in February 2026, involving a proposed investment of around ₹99,149 crore and fleet development of 51 container vessels, with SCI as one of the participating entities."},
{id:33,topic:"New Era of Indian Agriculture (Figures)",type:"figure",difficulty:"Easy",question:"As per the chapter, agriculture provides livelihoods to approximately what share of India's workforce, and what was the GVA of the Agriculture and Allied Sector in 2025-26?",options:[{k:"A",t:"50.1% of workforce; GVA of ₹52.08 lakh crore"},{k:"B",t:"46.1% of workforce; GVA of ₹42.08 lakh crore"},{k:"C",t:"40.1% of workforce; GVA of ₹52.08 lakh crore"},{k:"D",t:"46.1% of workforce; GVA of ₹52.08 lakh crore"},{k:"E",t:"46.1% of workforce; GVA of ₹62.08 lakh crore"}],correct:"D",explanation:"Agriculture provides livelihoods to approximately 46.1% of the workforce, and the GVA of the Agriculture and Allied Sector was estimated at ₹52.08 lakh crore in 2025-26."},
{id:34,topic:"New Era of Indian Agriculture (Figures)",type:"numbered",difficulty:"Moderate",context:"Consider the following latest key figures given for schemes in Indian agriculture:<br>1. Kisan Credit Card (KCC): 7.28 crore accounts operational (2025-26)<br>2. Soil Health Card (SHC): 26.09 crore cards issued (July 2026)<br>3. e-NAM: 1,656 mandis integrated (June 2026)<br>4. Digital Agriculture Mission: 10.31 crore+ Farmer IDs created (Aug 2026)",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2 and 3 only"},{k:"B",t:"2, 3 and 4 only"},{k:"C",t:"1 and 4 only"},{k:"D",t:"1, 3 and 4 only"},{k:"E",t:"1, 2, 3 and 4"}],correct:"E",explanation:"All four figures are correctly reproduced from the chapter's table on Indian agriculture and allied sectors."},
{id:35,topic:"Affordable Healthcare (AB-PMJAY etc.)",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about Ayushman Bharat schemes is correct as per the chapter?",options:[{k:"A",t:"AB-PMJAY provides a health cover of ₹5 lakh per family per year, with 45.5 crore+ Ayushman Cards issued."},{k:"B",t:"AB-PMJAY provides a health cover of ₹10 lakh per family per year."},{k:"C",t:"Ayushman Bharat Vay Vandana has enrolled 2.20 crore senior citizens."},{k:"D",t:"Ayushman Bharat Digital Mission has created fewer than 50 crore health records/accounts."},{k:"E",t:"AB-PMJAY has fewer than 20,000 empanelled hospitals."}],correct:"A",explanation:"AB-PMJAY provides ₹5 lakh cover/family/year with 45.5 crore+ Ayushman Cards issued and 38,466+ empanelled hospitals. Vay Vandana has enrolled 1.20 crore senior citizens (not 2.20 crore), and ABDM has 96.43 crore+ accounts (not fewer than 50 crore)."},
{id:36,topic:"Financial Inclusion in India",type:"numbered",difficulty:"Hard",context:"Consider the following statements about financial inclusion indicators in India:<br>1. The RBI Financial Inclusion Index rose to 70.0 in March 2026 from 43.4 in March 2017.<br>2. As per the World Bank Global Findex 2025, 89% of adults in India have an account.<br>3. 99.92% of villages have a banking outlet within a 5-km radius.<br>4. As of 10 August 2026, cumulative DBT stood at ₹52.89 lakh crore across 320 schemes and 56 ministries.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2 and 3 only"},{k:"B",t:"1, 2, 3 and 4"},{k:"C",t:"2, 3 and 4 only"},{k:"D",t:"1 and 4 only"},{k:"E",t:"1, 3 and 4 only"}],correct:"B",explanation:"All four statements correctly reflect the chapter's figures on financial inclusion indicators."},
{id:37,topic:"Financial Inclusion in India",type:"statement",difficulty:"Hard",question:"Which one of the following statements about social security schemes under India's financial inclusion architecture is correct?",options:[{k:"A",t:"PMJJBY offers ₹2 lakh life cover for an annual premium of ₹20, available to persons aged 18-70 years."},{k:"B",t:"Atal Pension Yojana offers a fixed pension of ₹5,000/month to all subscribers after age 60."},{k:"C",t:"PMSBY offers ₹2 lakh cover for accidental death/full disability and ₹1 lakh for partial disability, for an annual premium of ₹20, with 58.66 crore enrolments."},{k:"D",t:"PM MUDRA loans are collateral-free loans up to ₹50 lakh under four categories."},{k:"E",t:"PMSBY enrolments stood at 27.78 crore as of the latest data cited."}],correct:"C",explanation:"PMSBY: ₹2 lakh (death/full disability), ₹1 lakh (partial disability), ₹20/year premium, 58.66 crore enrolments. PMJJBY's premium is ₹436/year for ages 18-50 (not ₹20/18-70); APY pension ranges ₹1,000-₹5,000/month depending on contribution; PM MUDRA loans go up to ₹20 lakh, not ₹50 lakh; and the 27.78 crore figure belongs to PMJJBY, not PMSBY."},
{id:38,topic:"Tribunal Reforms Bill 2026",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the National Tribunals Commission (NTC) under the Tribunal Reforms Bill, 2026:<br>1. The NTC comprises a Chairperson and four Members, including 2 Judicial and 2 Technical Members.<br>2. The tenure of the NTC Chairperson/Members is 5 years or age 70, whichever is earlier.<br>3. The tenure of Tribunal Members is 5 years or age 67, whichever is earlier.<br>4. The Act repeals the Tribunal Reforms Act, 2021, and is based on Supreme Court directions in Madras Bar Association v. Union of India.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2 and 3 only"},{k:"B",t:"2, 3 and 4 only"},{k:"C",t:"1 and 4 only"},{k:"D",t:"1, 2, 3 and 4"},{k:"E",t:"1, 3 and 4 only"}],correct:"D",explanation:"All four statements accurately reflect the chapter's description of the NTC's composition, tenure and legislative background."},
{id:39,topic:"Tribunal Reforms Bill 2026",type:"statement",difficulty:"Hard",question:"Which one of the following statements about the Search-cum-Selection Committee for NTC Chairperson selection is correct?",options:[{k:"A",t:"For Chairperson selection, the Committee Chair is the NTC Judicial Member."},{k:"B",t:"The Member Secretary of the committee has full voting rights in selection decisions."},{k:"C",t:"Recommendations must be processed and appointments made by the Government within one month."},{k:"D",t:"For Member selection, the retired judge on the committee must be a retired Supreme Court Judge."},{k:"E",t:"For Chairperson selection, the Committee Chair is the NTC Chairperson, and the committee includes a retired High Court Chief Justice and 2 empanelled experts."}],correct:"E",explanation:"For Chairperson selection, the Committee Chair is the NTC Chairperson, with a retired HC Chief Justice and 2 empanelled experts among the members. The Member Secretary and 2 expert members have no voting rights; the government must act within three months (not one month); and for Member selection, the retired judge is a retired HC Judge, not a Supreme Court Judge."},
{id:40,topic:"World Elephant Day",type:"figure",difficulty:"Moderate",question:"As per the Synchronous All India Population Estimation of Elephants (SAIEE) 2021-25, what is India's wild elephant population, and how many Elephant Reserves exist across how many states?",options:[{k:"A",t:"22,446 elephants; 33 Elephant Reserves across 14 states"},{k:"B",t:"27,000+ elephants; 33 Elephant Reserves across 14 states"},{k:"C",t:"22,446 elephants; 30 Elephant Reserves across 12 states"},{k:"D",t:"22,446 elephants; 33 Elephant Reserves across 18 states"},{k:"E",t:"25,446 elephants; 33 Elephant Reserves across 14 states"}],correct:"A",explanation:"SAIEE 2021-25 recorded India's wild elephant population at 22,446, with 33 Elephant Reserves covering 80,777 km² across 14 elephant-range states."},
{id:41,topic:"World Elephant Day",type:"notamong",difficulty:"Moderate",context:"Consider the following institutional measures for elephant conservation mentioned in the chapter:<br>1. Management Effectiveness Evaluation (MEE), launched 2023<br>2. Regional Action Plans for elephant-bearing regions<br>3. Captive Elephant (Transfer or Transport) Rules, 2024<br>4. Gajah Suchana Mobile Application<br>5. National Elephant Corridor Protection Act, 2023",question:"Which one of the above is NOT a genuine measure mentioned in the chapter?",options:[{k:"A",t:"1"},{k:"B",t:"5"},{k:"C",t:"3"},{k:"D",t:"4"},{k:"E",t:"2"}],correct:"B",explanation:"A 'National Elephant Corridor Protection Act, 2023' is a fabricated name not mentioned in the chapter. All the others (MEE, Regional Action Plans, Captive Elephant Rules 2024, and the Gajah Suchana app) are genuine measures cited."},
{id:42,topic:"India's Defence Strength",type:"numbered",difficulty:"Hard",context:"Consider the following statements about India's defence indigenisation initiatives:<br>1. The iDEX scheme has an outlay of ₹498.78 crore to promote innovation and indigenous defence solutions.<br>2. The ADITI Scheme was approved with an outlay of ₹750 crore for 2023-24 to 2025-26.<br>3. The Technology Development Fund (TDF) provides grants of up to ₹100 crore for critical defence technologies.<br>4. FDI in defence is capped at 49% under the Automatic Route and 74% under the Government Route.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 only"},{k:"B",t:"2 only"},{k:"C",t:"3 and 4 only"},{k:"D",t:"4 only"},{k:"E",t:"3 only"}],correct:"C",explanation:"TDF grants are up to ₹50 crore (not ₹100 crore), and FDI limits are actually 74% under Automatic Route and up to 100% under Government Route — statement 4 has the percentages and routes reversed/altered. Statements 1 and 2 are correct."},
{id:43,topic:"Strengthening India's Space Sovereignty",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about India's Chandrayaan programme is correct?",options:[{k:"A",t:"Chandrayaan-1 (2008) was the mission that soft-landed near the Moon's south pole."},{k:"B",t:"Chandrayaan-2 (2019) operated at 500 km altitude and detected water molecules on the lunar surface."},{k:"C",t:"Chandrayaan-3 made India the 2nd nation to soft-land on the Moon."},{k:"D",t:"Chandrayaan-3 (2023) made India the first country to soft-land near the Moon's south pole and the 4th nation to soft-land on the Moon overall."},{k:"E",t:"Chandrayaan-1 captured lunar images at up to 30 cm resolution from 100 km altitude."}],correct:"D",explanation:"Chandrayaan-3 (2023) achieved the south-pole soft landing, making India the 4th nation overall to soft-land on the Moon. Chandrayaan-1 detected water molecules (it did not land); Chandrayaan-2 operated at 100 km altitude with 30 cm resolution imagery (those facts belong to Chandrayaan-2, not 1)."},
{id:44,topic:"Strengthening India's Space Sovereignty",type:"acronym",difficulty:"Easy",question:"What does NavIC stand for?",options:[{k:"A",t:"National Navigation and Information Constellation"},{k:"B",t:"Navigation Indian Communication"},{k:"C",t:"National Indian Constellation for Navigation"},{k:"D",t:"Navigation via Indigenous Communication"},{k:"E",t:"Navigation with Indian Constellation"}],correct:"E",explanation:"NavIC stands for Navigation with Indian Constellation, providing positioning, navigation and timing services across India and up to 1,500 km beyond its boundary."},
{id:45,topic:"Revitalising India's Cultural Heritage",type:"numbered",difficulty:"Moderate",context:"Consider the following statements on cultural heritage initiatives:<br>1. Swadesh Darshan covers 15 thematic tourist circuits, including Buddhist, Coastal, Desert and Ramayana circuits.<br>2. HRIDAY integrates urban development with heritage conservation across 12 heritage cities.<br>3. The Archaeological Experiential Museum at Vadnagar spans 12,500 sq. m. with a project cost of ₹298 crore.<br>4. Adopt a Heritage 2.0 was launched in September 2021.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"4 only"},{k:"B",t:"1 and 4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"Adopt a Heritage 2.0 was launched in September 2023, not September 2021, making statement 4 incorrect. Statements 1, 2 and 3 correctly match the chapter."},
{id:46,topic:"India's Coconut Sector",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the Coconut Development Board (CDB) is correct?",options:[{k:"A",t:"CDB was established in 1991 under the Ministry of Commerce & Industry, with its HQ at Thiruvananthapuram."},{k:"B",t:"CDB was established on 12 January 1981 under the Ministry of Agriculture & Farmers Welfare, with its HQ at Kochi."},{k:"C",t:"CDB works across only 10 States/UTs."},{k:"D",t:"CDB's HQ is located in Chennai."},{k:"E",t:"CDB was established under the Ministry of Food Processing Industries."}],correct:"B",explanation:"CDB was established on 12 January 1981 under the Ministry of Agriculture & Farmers Welfare, headquartered in Kochi, and works across 22 States/UTs."},
{id:47,topic:"India's Coconut Sector",type:"numbered",difficulty:"Hard",context:"Consider the following statements about India's coconut sector export performance in 2025-26:<br>1. Exports were valued at ₹7,038.35 crore (US$794.70 mn), a rise of +62% over 2024-25.<br>2. The top three export markets were USA, UAE and Sri Lanka.<br>3. Activated carbon dominates export volumes among coconut products.<br>4. India accounts for 31.24% of global coconut cultivation area.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"4 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"C",explanation:"India accounts for 31.24% of global coconut production and 17.90% of global area — statement 4 swaps production and area figures, making it incorrect. Statements 1, 2 and 3 are correct."},
{id:48,topic:"India's Coconut Sector",type:"notamong",difficulty:"Hard",context:"Consider the following coconut sector support schemes mentioned in the chapter:<br>1. Demonstration-cum-Seed Production Farms (DSPFs)<br>2. Expansion of Coconut Area<br>3. PICCS (Productivity Improvement through Coconut-Based Cropping)<br>4. Replanting & Rejuvenation<br>5. Coconut Vikas Nidhi Yojana",question:"Which one of the above is NOT a genuine coconut sector scheme mentioned in the chapter?",options:[{k:"A",t:"1"},{k:"B",t:"3"},{k:"C",t:"4"},{k:"D",t:"5"},{k:"E",t:"2"}],correct:"D",explanation:"'Coconut Vikas Nidhi Yojana' is a fabricated name. The chapter mentions DSPFs, Expansion of Coconut Area, PICCS, Replanting & Rejuvenation, Cocomitra and Kera Kaushal Kendra as genuine schemes."},
{id:49,topic:"Building a Business-Ready India",type:"numbered",difficulty:"Moderate",context:"Consider the following statements about ease-of-doing-business initiatives:<br>1. The National Single Window System (NSWS), launched in 2021, integrates 32 Central Ministries and 34 States/UTs.<br>2. Startup India, launched in 2016, is nodally administered by DPIIT.<br>3. The SPICe+ form, introduced in 2020, integrates 11 services from 3 Central Government Ministries/Departments.<br>4. Udyam Registration, launched in 2018, is a paid registration system for MSMEs.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"Udyam Registration was launched in 2020 (not 2018) and is free, paperless and self-declaration-based (not paid), making statement 4 incorrect. Statements 1, 2 and 3 correctly match the chapter."},
{id:50,topic:"Building a Business-Ready India",type:"acronym",difficulty:"Easy",question:"What does BRAP, the initiative promoting Ease of Doing Business, stand for?",options:[{k:"A",t:"Business Reform Action Plan"},{k:"B",t:"Business Regulatory Approval Process"},{k:"C",t:"Business Reform Assessment Programme"},{k:"D",t:"Bureau for Reform in Administrative Procedures"},{k:"E",t:"Business Rating and Assessment Plan"}],correct:"A",explanation:"BRAP stands for Business Reform Action Plan, launched in 2015 to promote Ease of Doing Business (EoDB)."},
{id:51,topic:"Expanding the Development Horizon",type:"numbered",difficulty:"Moderate",context:"Consider the following statements on flagship scheme achievements cited in the chapter:<br>1. Jal Jeevan Mission has provided tap water to 15.91 crore+ rural households.<br>2. PM Ujjwala Yojana has provided 10.57 crore+ free LPG connections.<br>3. Swachh Bharat Mission-Grameen built 12.19 crore+ individual household toilets, and India was declared ODF in 2019.<br>4. PMAY-Grameen sanctioned 3.91 crore+ houses, of which 3.13 crore have been completed.",question:"Which of the statements given above are correct?",options:[{k:"A",t:"1, 2 and 3 only"},{k:"B",t:"1, 2, 3 and 4"},{k:"C",t:"2, 3 and 4 only"},{k:"D",t:"1 and 4 only"},{k:"E",t:"1, 3 and 4 only"}],correct:"B",explanation:"All four statements accurately reflect the figures given in the chapter's development-horizon table."},
{id:52,topic:"Expanding the Development Horizon",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the Lakhpati Didi initiative is correct?",options:[{k:"A",t:"The Lakhpati Didi target has already been achieved at 6 crore beneficiaries."},{k:"B",t:"Lakhpati Didi is implemented exclusively through the SHE-Mart programme."},{k:"C",t:"As of the latest data, 3.46 crore women have become Lakhpati Didis, with a target to reach 6 crore by 2029."},{k:"D",t:"The scheme targets 3 crore Lakhpati Didis by 2030."},{k:"E",t:"Lakhpati Didi refers exclusively to women dairy farmers."}],correct:"C",explanation:"3.46 crore Lakhpati Didis have been achieved so far, with a target of 6 crore by 2029, as stated in the chapter."},
{id:53,topic:"Bharat Taxi",type:"notamong",difficulty:"Hard",context:"Consider the following institutions listed in the chapter as founding cooperative institutions of Bharat Taxi:<br>1. National Cooperative Development Corporation (NCDC)<br>2. IFFCO<br>3. NABARD<br>4. KRIBHCO<br>5. Indian Farmers Cooperative Insurance Federation (IFCIF)<br>6. Amul (GCMMF)<br>7. NAFED<br>8. NDDB<br>9. NCEL",question:"Which one of the above is NOT among the 8 genuine founding cooperative institutions of Bharat Taxi listed in the chapter?",options:[{k:"A",t:"3"},{k:"B",t:"7"},{k:"C",t:"9"},{k:"D",t:"5"},{k:"E",t:"4"}],correct:"D",explanation:"'Indian Farmers Cooperative Insurance Federation (IFCIF)' is a fabricated name. The genuine 8 founding institutions are NCDC, IFFCO, NABARD, KRIBHCO, Amul (GCMMF), NAFED, NDDB and NCEL."},
{id:54,topic:"Bharat Taxi",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about Bharat Taxi's cooperative and financial model is correct?",options:[{k:"A",t:"Bharat Taxi charges a standard 15% commission on every ride like conventional aggregators."},{k:"B",t:"Sarathis can become partners by purchasing shares worth ₹1,000 each valued at ₹100 per share."},{k:"C",t:"Bharat Taxi's personal accident insurance cover is ₹10 lakh, provided through LIC."},{k:"D",t:"Bharat Taxi was established under the Companies Act, 2013."},{k:"E",t:"Bharat Taxi follows a zero-commission and surge-free pricing model, with 80% of cooperative earnings distributed among Sarathis based on kilometres travelled."}],correct:"E",explanation:"Bharat Taxi follows zero-commission, surge-free pricing, with 20% of earnings credited as Sarathis' capital and 80% distributed based on kilometres travelled. It is registered under the Multi-State Cooperative Societies Act, 2002 (not Companies Act); a Sarathi becomes a partner by purchasing shares worth ₹500 (at ₹100/share); and accident insurance of ₹5 lakh is via IFFCO Tokio, not LIC."},
{id:55,topic:"UDISE+ 2025-26 Report",type:"numbered",difficulty:"Hard",context:"As per the UDISE+ 2025-26 Report, consider the following statements:<br>1. The overall Pupil Teacher Ratio (PTR) is 24:1, better than the NEP 2020 recommendation of 30:1.<br>2. Dropout rate at the Secondary level declined to 7.0%.<br>3. Retention rate at the Secondary level stands at 83.7%.<br>4. Women teachers constitute 54.9% of the total teaching workforce.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"3 only"},{k:"B",t:"1 and 3 only"},{k:"C",t:"2 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"The Secondary-level retention rate is 51.9%, not 83.7% — 83.7% is actually the Middle-level retention rate — making statement 3 incorrect. Statements 1, 2 and 4 correctly match the chapter's data."},
{id:56,topic:"UDISE+ 2025-26 Report",type:"figure",difficulty:"Moderate",question:"As per UDISE+ 2025-26, what were the total number of schools, enrolments, and teachers in India?",options:[{k:"A",t:"15.67 lakh schools, 24.72 crore enrolments, 1.03 crore teachers"},{k:"B",t:"14.67 lakh schools, 24.72 crore enrolments, 1.03 crore teachers"},{k:"C",t:"14.67 lakh schools, 20.72 crore enrolments, 1.03 crore teachers"},{k:"D",t:"14.67 lakh schools, 24.72 crore enrolments, 0.93 crore teachers"},{k:"E",t:"14.67 lakh schools, 26.72 crore enrolments, 1.03 crore teachers"}],correct:"B",explanation:"UDISE+ 2025-26 recorded 14.67 lakh schools, 24.72 crore enrolments, and 1.03 crore teachers, with an average of 7 teachers and 169 enrolments per school."},
{id:57,topic:"PAIMANA",type:"acronym",difficulty:"Easy",question:"What does PAIMANA stand for?",options:[{k:"A",t:"Programme for Assessment of Infrastructure Milestones and National Achievement"},{k:"B",t:"Project Analysis, Infrastructure Management and National Assessment"},{k:"C",t:"Project Assessment, Infrastructure Monitoring and Analytics for Nation-Building"},{k:"D",t:"Public Assessment of Infrastructure Monitoring and Analytics for Nation-Building"},{k:"E",t:"Project Assessment, Infrastructure Modernisation and Analytics for National Advancement"}],correct:"C",explanation:"PAIMANA stands for Project Assessment, Infrastructure Monitoring and Analytics for Nation-Building, launched by MoSPI on 25 September 2025."},
{id:58,topic:"PAIMANA",type:"numbered",difficulty:"Hard",context:"Consider the following statements about PAIMANA and its components:<br>1. PAIMANA-CRIP was launched on 8 July 2026, replacing DPIIT's Integrated Project Monitoring Portal (IPMP).<br>2. The Performance Monitoring Dashboard, launched 16 April 2026, covers 6 infrastructure sub-sectors and 165 indicators.<br>3. The dashboard was developed with consultation from the National Institute of Public Finance and Policy (NIPFP).<br>4. PAIMANA monitors Central Sector Infrastructure Projects costing ₹500 crore or more.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"D",explanation:"PAIMANA monitors projects costing ₹150 crore or more, not ₹500 crore, making statement 4 incorrect. Statements 1, 2 and 3 correctly match the chapter."},
{id:59,topic:"PM SVANidhi",type:"numbered",difficulty:"Moderate",context:"Consider the following statements about PM SVANidhi's loan structure:<br>1. The 1st tranche loan is ₹15,000, repayable in 12 months.<br>2. The 2nd tranche loan is ₹25,000, repayable in 18 months.<br>3. The 3rd tranche loan is ₹50,000, repayable in 36 months.<br>4. An interest subsidy of 10% p.a. is offered for timely/early repayment.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"The interest subsidy for timely/early repayment is 7% p.a., not 10% p.a., making statement 4 incorrect. Statements 1, 2 and 3 correctly state the loan tranches."},
{id:60,topic:"PM SVANidhi",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about PM SVANidhi is correct?",options:[{k:"A",t:"PM SVANidhi is jointly implemented by the Ministry of Housing & Urban Affairs and the Department of Financial Services, and has been extended till March 2030."},{k:"B",t:"PM SVANidhi is implemented solely by the Ministry of Rural Development."},{k:"C",t:"The scheme's motto is 'Sahkar se Samriddhi'."},{k:"D",t:"SVANidhi se Samriddhi was launched on 4 January 2020."},{k:"E",t:"The top-performing state under PM SVANidhi is Maharashtra."}],correct:"A",explanation:"PM SVANidhi is jointly implemented by MoHUA and DFS, extended till March 2030. Its motto is 'Swarozgar, Svavlamban & Swabhimaan' (not 'Sahkar se Samriddhi', which is Bharat Taxi's motto); SVANidhi se Samriddhi was launched on 4 January 2021; and the top-performing state is Uttar Pradesh, not Maharashtra."},
{id:61,topic:"GOBARdhan",type:"numbered",difficulty:"Hard",context:"Consider the following statements about the National Circular Bioenergy Scheme: GOBARdhan, approved on 6 August 2026:<br>1. The scheme has an outlay of ₹23,731 crore for implementation from FY 2026-27 to FY 2035-36.<br>2. It is nodally administered by the Ministry of Petroleum & Natural Gas.<br>3. The CBG Obligation trajectory targets 3% in FY 2026-27, rising to 5% from FY 2028-29 onwards.<br>4. Greenfield CBG projects receive capital assistance of up to ₹5 crore per TPD of installed capacity.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"B",explanation:"Capital assistance for Greenfield CBG projects is up to ₹2 crore per TPD, not ₹5 crore, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:62,topic:"GOBARdhan",type:"acronym",difficulty:"Easy",question:"What does GOBARdhan stand for?",options:[{k:"A",t:"Government Organic Biomass and Agricultural Resources Development"},{k:"B",t:"Galvanizing Organic Biogas and Renewable Dhan"},{k:"C",t:"Galvanizing Organic Bio-Agro Resources Dhan"},{k:"D",t:"Green Organic Bioenergy and Agri Resource Development for Homes"},{k:"E",t:"Galvanizing Organic Bio-Agro Rural Development"}],correct:"C",explanation:"GOBARdhan stands for Galvanizing Organic Bio-Agro Resources Dhan, originally launched in 2018 under Swachh Bharat Mission (Grameen)."},
{id:63,topic:"GOBARdhan",type:"notamong",difficulty:"Hard",context:"Consider the following that are listed among the 'Six Growth Engines' of GOBARdhan:<br>1. Assured CBG Offtake<br>2. Stable Pricing<br>3. Capital Assistance<br>4. Pipeline Infrastructure<br>5. Farmer Direct Cash Transfer<br>6. Credit Guarantee<br>7. CBG Ecosystem Challenge Fund",question:"Which one of the above is NOT one of the Six Growth Engines of GOBARdhan mentioned in the chapter?",options:[{k:"A",t:"1"},{k:"B",t:"3"},{k:"C",t:"6"},{k:"D",t:"5"},{k:"E",t:"7"}],correct:"D",explanation:"'Farmer Direct Cash Transfer' is not among the Six Growth Engines. The genuine six are: Assured CBG Offtake, Stable Pricing, Capital Assistance, Pipeline Infrastructure, Credit Guarantee, and CBG Ecosystem Challenge Fund."},
{id:64,topic:"National Handloom Day 2026",type:"numbered",difficulty:"Hard",context:"As per the Fourth All India Handloom Census (2019-20), consider the following statements:<br>1. India has conducted four handloom censuses so far: 1987-88, 1995-96, 2009-10 and 2019-20.<br>2. There are 31.45 lakh handloom households and 35.22 lakh weavers & allied workers.<br>3. Women constitute more than 72% of handloom workers.<br>4. Rural handlooms account for around 75% of total handlooms.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"Rural handlooms account for ~90% of total handlooms (25.30 lakh out of 28.20 lakh), not ~75%, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:65,topic:"National Handloom Day 2026",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about National Handloom Day is correct?",options:[{k:"A",t:"National Handloom Day is observed on 7 August, instituted in 2015, commemorating the Swadeshi Movement (1905)."},{k:"B",t:"National Handloom Day is observed on 15 August, instituted in 2018."},{k:"C",t:"National Handloom Day commemorates the passing of the Handlooms (Reservation of Articles for Production) Act, 1985."},{k:"D",t:"National Handloom Day was instituted in 2005 to mark 100 years of the Swadeshi Movement."},{k:"E",t:"National Handloom Day is observed on 7 August, instituted in 2005."}],correct:"A",explanation:"National Handloom Day is observed on 7 August, instituted in 2015, commemorating the launch of the Swadeshi Movement in 1905."},
{id:66,topic:"National Handloom Day 2026",type:"numbered",difficulty:"Moderate",context:"Regarding recognition and market access for the handloom sector, consider:<br>1. The Handloom Mark, launched in 2006, had 815 retail outlets as of June 2026.<br>2. As of August 2026, 106 handloom products and 227 handicraft products are GI-registered.<br>3. The Handlooms Act, 1985 reserves 15 textile articles exclusively for handloom production.<br>4. The Sant Kabir Handloom Award carries ₹3.5 lakh along with a mounted gold coin.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 3 only"},{k:"B",t:"3 only"},{k:"C",t:"2 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"B",explanation:"The Handlooms Act, 1985 reserves 11 textile articles for handloom production, not 15, making statement 3 incorrect. Statements 1, 2 and 4 correctly match the chapter."},
{id:67,topic:"PM-VBRY",type:"figure",difficulty:"Moderate",question:"What is the implementation period and outlay of Pradhan Mantri Viksit Bharat Rojgar Yojana (PM-VBRY)?",options:[{k:"A",t:"1 August 2025 to 31 July 2028 (3 years); outlay ₹99,446 crore"},{k:"B",t:"1 August 2025 to 31 July 2027; outlay ₹89,446 crore"},{k:"C",t:"1 August 2025 to 31 July 2027 (2 years); outlay ₹99,446 crore"},{k:"D",t:"1 April 2025 to 31 March 2027; outlay ₹99,446 crore"},{k:"E",t:"1 August 2025 to 31 July 2027; outlay ₹1,00,446 crore"}],correct:"C",explanation:"PM-VBRY runs from 1 August 2025 to 31 July 2027 (2 years) with an outlay of ₹99,446 crore, targeting over 3.5 crore employment opportunities."},
{id:68,topic:"PM-VBRY",type:"numbered",difficulty:"Hard",context:"Consider the following statements about PM-VBRY's two-part incentive framework:<br>1. Under Part A, first-time employees earning up to ₹1 lakh/month get a one-time incentive of one month's EPF wage, capped at ₹15,000.<br>2. The Part A incentive is paid in 2 instalments — after 6 months and after 12 months of continuous service.<br>3. Under Part B, employers receive up to ₹3,000/month per eligible additional employee for 2 years, extended to the 3rd and 4th years for manufacturing.<br>4. As of August 2026, over 72 lakh first-time employees have joined the formal workforce, with nearly 50% being women.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"4 only"},{k:"E",t:"None of the above"}],correct:"D",explanation:"Nearly 30% of the 72+ lakh first-time employees were women, not nearly 50%, making statement 4 incorrect. Statements 1, 2 and 3 correctly reflect the scheme's design."},
{id:69,topic:"India's Solar Growth",type:"numbered",difficulty:"Hard",context:"Consider the following statements on India's solar policy pillars:<br>1. Under the Panchamrit commitments, India aims for 500 GW non-fossil capacity by 2030 and net-zero by 2070.<br>2. The Solar Parks Scheme was initially launched with a target of 20 GW, later expanded to 40 GW in 2017.<br>3. PM Surya Ghar: Muft Bijli Yojana was launched on 13 February 2024 with an outlay of ₹75,021 crore.<br>4. The RPO trajectory has been notified through 2029-30, with the target for 2026-27 set at 45.95%.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"The RPO target for 2026-27 is 35.95%, not 45.95%, making statement 4 incorrect. Statements 1, 2 and 3 correctly reflect the chapter's figures."},
{id:70,topic:"India's Solar Growth",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about the International Solar Alliance (ISA) is correct?",options:[{k:"A",t:"ISA was co-founded by India and France and launched at COP21, Paris, in 2015."},{k:"B",t:"ISA was co-founded by India and the UK and launched at COP26 in 2021."},{k:"C",t:"ISA is exclusively focused on India's domestic solar rooftop programme."},{k:"D",t:"ISA was launched in 2018 as a proposal by India alone."},{k:"E",t:"ISA membership is restricted to South Asian countries only."}],correct:"A",explanation:"ISA was co-founded by India and France and launched at COP21, Paris, in 2015 to promote global solar deployment. (OSOWOG, launched with the UK, is a separate initiative proposed by India in 2018 and formalised at COP26, 2021.)"},
{id:71,topic:"India's Solar Growth",type:"figure",difficulty:"Moderate",question:"As of February 2026, how many solar parks exist in India, and which state has the highest sanctioned capacity?",options:[{k:"A",t:"54 solar parks; Rajasthan has the highest sanctioned capacity"},{k:"B",t:"54 solar parks; Gujarat has the highest sanctioned capacity at 12,150 MW"},{k:"C",t:"40 solar parks; Gujarat has the highest sanctioned capacity"},{k:"D",t:"54 solar parks; Karnataka has the highest sanctioned capacity"},{k:"E",t:"60 solar parks; Gujarat has the highest sanctioned capacity"}],correct:"B",explanation:"As of February 2026 there were 54 solar parks; Gujarat has the highest sanctioned capacity at 12,150 MW, while Rajasthan has the highest number of parks (11)."},
{id:72,topic:"GI Tags",type:"numbered",difficulty:"Hard",context:"Consider the following statements about India's GI Tag framework:<br>1. The legal framework is the Geographical Indications of Goods (Registration and Protection) Act, 1999.<br>2. GI registration is valid for 10 years and can be renewed.<br>3. The first Indian GI was Darjeeling Tea, West Bengal.<br>4. The 2025 GI Reforms reduced the renewal fee from ₹5,000 to ₹1,000.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"4 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"C",explanation:"The 2025 GI Reforms reduced the renewal fee from ₹3,000 to ₹500, not from ₹5,000 to ₹1,000, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:73,topic:"GI Tags",type:"figure",difficulty:"Moderate",question:"As per the chapter, which category has the highest number of registered GI products, and how many are registered in it?",options:[{k:"A",t:"Agricultural – 445 registered products"},{k:"B",t:"Handicrafts – 251 registered products"},{k:"C",t:"Food – 445 registered products"},{k:"D",t:"Handicrafts – 445 registered products"},{k:"E",t:"Manufactured – 445 registered products"}],correct:"D",explanation:"Handicrafts is the largest GI category with 445 registered products, ahead of Agricultural (251), Food (66) and Manufactured (64)."},
{id:74,topic:"GI Tags",type:"notamong",difficulty:"Hard",context:"Consider the following major government initiatives supporting GI-tagged products mentioned in the chapter:<br>1. PM Ekta Mall (Unity Mall)<br>2. One Station One Product (OSOP)<br>3. GI Trails<br>4. MSME Innovative Scheme – IPR Component<br>5. National GI Export Promotion Council",question:"Which one of the above is NOT a genuine initiative mentioned in the chapter?",options:[{k:"A",t:"1"},{k:"B",t:"3"},{k:"C",t:"4"},{k:"D",t:"2"},{k:"E",t:"5"}],correct:"E",explanation:"'National GI Export Promotion Council' is a fabricated name. The genuine initiatives are PM Ekta Mall, OSOP, GI Trails, MSME Innovative Scheme's IPR Component, and Handicrafts Development support."},
{id:75,topic:"EV Ecosystem",type:"numbered",difficulty:"Hard",context:"Consider the following statements on India's EV ecosystem:<br>1. EV sales reached 2.3 million in 2025, roughly a 46-times growth.<br>2. FAME-II was implemented for 5 years, till April 2024.<br>3. The India Electric Mobility Index (IEMI), launched by NITI Aayog in August 2025, tracks EV progress using 16 indicators under 3 pillars.<br>4. Delhi, Maharashtra and Chandigarh are categorised as 'Aspirants' under IEMI.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"4 only"},{k:"B",t:"1 and 4 only"},{k:"C",t:"2 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"A",explanation:"Delhi, Maharashtra and Chandigarh are categorised as 'Frontrunners' (not 'Aspirants') under IEMI, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:76,topic:"EV Ecosystem",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about PM E-DRIVE is correct?",options:[{k:"A",t:"PM E-DRIVE is administered by the Ministry of Road Transport & Highways with an outlay of ₹18,100 crore."},{k:"B",t:"PM E-DRIVE (2024) is administered by the Ministry of Heavy Industries with an outlay of ₹10,900 crore, targeting over 28 lakh EVs."},{k:"C",t:"PM E-DRIVE provides ₹2,000 crore for e-bus procurement and ₹4,391 crore for EV charging stations."},{k:"D",t:"PM E-DRIVE targets fewer than 10 lakh EVs."},{k:"E",t:"PM E-DRIVE was launched in 2021 alongside PLI-Auto."}],correct:"B",explanation:"PM E-DRIVE (2024) is under the Ministry of Heavy Industries with a ₹10,900 crore outlay targeting >28 lakh EVs. Within this, ₹4,391 crore is for 14,028 e-buses and ₹2,000 crore for EV public charging stations (option C reverses the figures)."},
{id:77,topic:"EV Ecosystem",type:"acronym",difficulty:"Easy",question:"What does FAME, the scheme supporting India's EV ecosystem since 2015, stand for?",options:[{k:"A",t:"Fund for Advancement of Motor Electrification"},{k:"B",t:"Faster Adoption of Modern Electric-vehicles"},{k:"C",t:"Faster Adoption and Manufacturing of (Hybrid &) Electric Vehicles"},{k:"D",t:"Framework for Accelerated Mobility and Electrification"},{k:"E",t:"Fast-track Adoption of Manufacturing Electric Vehicles"}],correct:"C",explanation:"FAME stands for Faster Adoption and Manufacturing of (Hybrid &) Electric Vehicles, launched in 2015 under NEMMP."},
{id:78,topic:"EV Ecosystem",type:"figure",difficulty:"Hard",question:"As per the chapter, what are the proposed CAFE III and CAFE IV CO₂ emission norms respectively?",options:[{k:"A",t:"CAFE III (2027-32): 70 g CO₂/km; CAFE IV (2033-37): 91.7 g CO₂/km"},{k:"B",t:"CAFE III (2025-30): 91.7 g CO₂/km; CAFE IV (2031-35): 70 g CO₂/km"},{k:"C",t:"CAFE III (2027-32): 100 g CO₂/km; CAFE IV (2033-37): 70 g CO₂/km"},{k:"D",t:"CAFE III (2027-32): 91.7 g CO₂/km; CAFE IV (2033-37): 70 g CO₂/km"},{k:"E",t:"CAFE III (2027-32): 91.7 g CO₂/km; CAFE IV (2033-37): 60 g CO₂/km"}],correct:"D",explanation:"Proposed norms: CAFE III (2027-32) at 91.7 g CO₂/km and CAFE IV (2033-37) at 70 g CO₂/km, based on the WLTP testing procedure."},
{id:79,topic:"GeM (Government e-Marketplace)",type:"numbered",difficulty:"Moderate",context:"Consider the following statements about GeM's scale as described in the chapter:<br>1. GeM was launched on 9 August 2016.<br>2. GeM has connected 1.37 lakh+ government buyers with nearly 25 lakh sellers, facilitating ₹20 lakh crore+ cumulative procurement.<br>3. The platform offers 10,660+ product categories and 350 service categories.<br>4. Defence procurement accounts for more than 25% of GeM's cumulative GMV.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"3 only"},{k:"D",t:"None of the above"},{k:"E",t:"4 only"}],correct:"E",explanation:"Defence procurement accounts for 14.93% of GeM's cumulative GMV, not more than 25%, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:80,topic:"GeM (Government e-Marketplace)",type:"notamong",difficulty:"Hard",context:"Consider the following inclusion initiatives on GeM mentioned in the chapter:<br>1. SWAYATT<br>2. Womaniya<br>3. SARAS Collection<br>4. Startup Runway 2.0<br>5. Vocal Bazaar Mission",question:"Which one of the above is NOT a genuine GeM inclusion initiative mentioned in the chapter?",options:[{k:"A",t:"5"},{k:"B",t:"1"},{k:"C",t:"3"},{k:"D",t:"4"},{k:"E",t:"2"}],correct:"A",explanation:"'Vocal Bazaar Mission' is a fabricated name. The genuine initiatives listed are SWAYATT, Womaniya, SARAS Collection and Startup Runway 2.0."},
{id:81,topic:"GeM 10th Anniversary",type:"figure",difficulty:"Moderate",question:"As celebrated at GeM's 10th Foundation Day (August 2026), what dedicated short code was launched for its Helpdesk?",options:[{k:"A",t:"18001800"},{k:"B",t:"14550"},{k:"C",t:"1930"},{k:"D",t:"14545"},{k:"E",t:"1800111950"}],correct:"B",explanation:"A dedicated nationwide five-digit short code '14550' was launched for GeM's Helpdesk to mark its 10th Foundation Day."},
{id:82,topic:"CPGRAMS",type:"numbered",difficulty:"Moderate",context:"Consider the following statements about CPGRAMS:<br>1. Under the 2024 guidelines, grievances are targeted for resolution within 21 days.<br>2. The Nodal Appellate Authority has 30 days to resolve an appeal after a dissatisfied citizen approaches it.<br>3. Annual grievances handled increased nearly 9 times to ~27 lakh (2024).<br>4. CPGRAMS entertains RTI matters and court-related/subjudice matters.",question:"Which of the statements given above is/are incorrect?",options:[{k:"A",t:"1 and 4 only"},{k:"B",t:"2 only"},{k:"C",t:"4 only"},{k:"D",t:"3 only"},{k:"E",t:"None of the above"}],correct:"C",explanation:"CPGRAMS explicitly does NOT entertain RTI matters, court-related/subjudice matters, religious matters or government employees' service matters, making statement 4 incorrect. Statements 1, 2 and 3 are correct."},
{id:83,topic:"CPGRAMS",type:"statement",difficulty:"Moderate",question:"Which one of the following statements about Samadhan Didi, the AI-enabled CPGRAMS chatbot, is correct?",options:[{k:"A",t:"Samadhan Didi was launched in 2022 as part of the 10-Step Reform Programme."},{k:"B",t:"Samadhan Didi only supports grievance registration in English and Hindi."},{k:"C",t:"Samadhan Didi is a physical helpdesk kiosk network, not a voice chatbot."},{k:"D",t:"Samadhan Didi was launched on 30 May 2026 and uses AI with BHASHINI for speech-to-text, text-to-speech, translation and transliteration."},{k:"E",t:"Samadhan Didi replaced the Sevottam framework entirely."}],correct:"D",explanation:"Samadhan Didi was launched on 30 May 2026 as an AI-enabled CPGRAMS voice chatbot using AI+BHASHINI for multiple language processing functions, not limited to English and Hindi."},
{id:84,topic:"PLFS Quarterly Bulletin",type:"figure",difficulty:"Moderate",question:"As per the PLFS Quarterly Bulletin for April-June 2026, what was the overall Labour Force Participation Rate (LFPR, 15+), and how did it change from the previous period?",options:[{k:"A",t:"55.5%, up from 54.6%"},{k:"B",t:"54.6%, up from 50.2%"},{k:"C",t:"50.2%, unchanged"},{k:"D",t:"54.6%, unchanged"},{k:"E",t:"54.6%, down from 55.5%"}],correct:"E",explanation:"The overall LFPR (15+) for Apr-Jun 2026 was 54.6%, down from 55.5% previously."},
