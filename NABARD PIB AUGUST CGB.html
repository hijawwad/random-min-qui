// ===================== APP LOGIC =====================
let STATE = {
  screen: 'home', // home | quiz | end
  order: 'pdf', // pdf | shuffled
  setQuestions: [],
  setLabel: '',
  setKind: '', // 'full' | 'section' | 'schemes'
  index: 0,
  answers: {}, // qid -> {status:'correct'|'wrong'|'skipped', selected}
  locked: false,
  selectedKey: null,
  lastSectionName: null,
};

const SCHEME_TYPES = ['numbered','notamong','acronym'];

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getSections(){
  const map = {};
  QUIZ_DATA.forEach(q=>{ map[q.topic] = (map[q.topic]||0)+1; });
  return Object.keys(map).map(name=>({name,count:map[name]}))
    .sort((a,b)=> QUIZ_DATA.findIndex(q=>q.topic===a.name) - QUIZ_DATA.findIndex(q=>q.topic===b.name));
}

function startQuiz(questions, label, kind){
  STATE.setQuestions = questions;
  STATE.setLabel = label;
  STATE.setKind = kind;
  STATE.index = 0;
  STATE.answers = {};
  STATE.locked = false;
  STATE.selectedKey = null;
  STATE.screen = 'quiz';
  render();
}

function currentQuestion(){
  return STATE.setQuestions[STATE.index];
}

function selectOption(key){
  if(STATE.locked) return;
  const q = currentQuestion();
  STATE.locked = true;
  STATE.selectedKey = key;
  const status = (key === q.correct) ? 'correct' : 'wrong';
  STATE.answers[q.id] = {status, selected:key};
  render();
}

function skipQuestion(){
  if(STATE.locked) return;
  const q = currentQuestion();
  STATE.locked = true;
  STATE.selectedKey = null;
  STATE.answers[q.id] = {status:'skipped', selected:null};
  render();
}

function nextQuestion(){
  if(STATE.index < STATE.setQuestions.length - 1){
    STATE.index++;
    STATE.locked = false;
    STATE.selectedKey = null;
    render();
  } else {
    STATE.screen = 'end';
    render();
  }
}

function backToMenu(){
  STATE.screen = 'home';
  render();
}

function retrySameSet(){
  startQuiz(STATE.setQuestions, STATE.setLabel, STATE.setKind);
}

function computeStats(){
  let correct=0, wrong=0, skipped=0;
  let byDiff = {Easy:{c:0,t:0}, Moderate:{c:0,t:0}, Hard:{c:0,t:0}};
  STATE.setQuestions.forEach(q=>{
    const a = STATE.answers[q.id];
    byDiff[q.difficulty].t++;
    if(a){
      if(a.status==='correct'){ correct++; byDiff[q.difficulty].c++; }
      else if(a.status==='wrong') wrong++;
      else skipped++;
    } else {
      skipped++;
    }
  });
  return {correct, wrong, skipped, total: STATE.setQuestions.length, byDiff};
}

// ===================== RENDERERS =====================
function render(){
  const app = document.getElementById('app');
  if(STATE.screen==='home') app.innerHTML = renderHome();
  else if(STATE.screen==='quiz') app.innerHTML = renderQuiz();
  else if(STATE.screen==='end') app.innerHTML = renderEnd();
  window.scrollTo({top:0, behavior:'instant'});
}

function renderHome(){
  const sections = getSections();
  const sectionsHTML = sections.map(s=>`
    <div class="section-tile" onclick="openSection(${JSON.stringify(s.name).replace(/"/g,'&quot;')})">
      <span class="name">${escapeHtml(s.name)}</span>
      <span class="count">${s.count} Q${s.count>1?'s':''}</span>
    </div>`).join('');

  return `
  <div class="header">
    <div class="brand">
      <span class="kicker">NABARD Grade A · ESI/GA</span>
      <h1>PIB August 2026 Practice Quiz</h1>
    </div>
    <span class="pill">${QUIZ_DATA.length} Questions</span>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Choose a mode</h3>
    <div class="mode-grid">
      <div class="mode-card" onclick="showFullTestOptions()">
        <span class="icon">📘</span>
        <h3>Full Practice Test</h3>
        <p>All ${QUIZ_DATA.length} questions from the chapter, PDF order or shuffled.</p>
      </div>
      <div class="mode-card" onclick="showSectionGrid()">
        <span class="icon">🗂️</span>
        <h3>Section-wise Revision</h3>
        <p>Drill one topic/entity at a time — ${sections.length} sections available.</p>
      </div>
      <div class="mode-card" onclick="startSchemesSprint()">
        <span class="icon">⚡</span>
        <h3>Schemes-Only Sprint</h3>
        <p>Just the scheme/organisation-specific questions — numbered, "not-among" &amp; acronym types.</p>
      </div>
    </div>
  </div>

  <div class="card" id="fullTestPanel" style="display:none;">
    <h3 style="margin-top:0;">Full Practice Test</h3>
    <p style="color:var(--muted);font-size:13.5px;margin-top:-4px;">Choose the question order, then start.</p>
    <div class="row">
      <div class="toggle-group">
        <button id="ord-pdf" class="${STATE.order==='pdf'?'active':''}" onclick="setOrder('pdf')">PDF Order</button>
        <button id="ord-shuf" class="${STATE.order==='shuffled'?'active':''}" onclick="setOrder('shuffled')">Shuffled</button>
      </div>
      <button class="btn" onclick="startFullTest()">Start Test →</button>
    </div>
  </div>

  <div class="card" id="sectionPanel" style="display:none;">
    <div class="row" style="justify-content:space-between;">
      <h3 style="margin:0;">Section-wise Revision</h3>
      <a class="back-link" onclick="hideSectionGrid()">close ✕</a>
    </div>
    <div class="section-grid">${sectionsHTML}</div>
  </div>

  <div class="card" style="border-color:var(--border);">
    <p style="margin:0;color:var(--muted2);font-size:12.5px;line-height:1.6;">
      Covers the full PIB August 2026 compilation — schemes, reports, committees, GI tags, RBI/MoSPI data releases and current-affairs items.
      Click any option to get instant feedback; use Skip if unsure. Your progress resets each time you start a new set.
    </p>
  </div>
  `;
}

function showFullTestOptions(){
  document.getElementById('fullTestPanel').style.display='block';
  document.getElementById('sectionPanel').style.display='none';
  document.getElementById('fullTestPanel').scrollIntoView({behavior:'smooth', block:'center'});
}
function showSectionGrid(){
  document.getElementById('sectionPanel').style.display='block';
  document.getElementById('fullTestPanel').style.display='none';
  document.getElementById('sectionPanel').scrollIntoView({behavior:'smooth', block:'center'});
}
function hideSectionGrid(){ document.getElementById('sectionPanel').style.display='none'; }
function setOrder(o){ STATE.order = o; render_orderButtonsOnly(); }
function render_orderButtonsOnly(){
  // lightweight re-render without losing scroll for full-test panel toggle
  const wasFullOpen = document.getElementById('fullTestPanel') && document.getElementById('fullTestPanel').style.display==='block';
  const wasSectionOpen = document.getElementById('sectionPanel') && document.getElementById('sectionPanel').style.display==='block';
  render();
  if(wasFullOpen) showFullTestOptions();
  if(wasSectionOpen) showSectionGrid();
}

function startFullTest(){
  let qs = QUIZ_DATA.slice();
  if(STATE.order==='shuffled') qs = shuffleArr(qs);
  startQuiz(qs, 'Full Practice Test ('+(STATE.order==='pdf'?'PDF Order':'Shuffled')+')', 'full');
}

function openSection(name){
  const qs = QUIZ_DATA.filter(q=>q.topic===name);
  startQuiz(qs, name, 'section');
}

function startSchemesSprint(){
  const qs = shuffleArr(QUIZ_DATA.filter(q=>SCHEME_TYPES.includes(q.type)));
  startQuiz(qs, 'Schemes-Only Sprint', 'schemes');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderQuiz(){
  const q = currentQuestion();
  const total = STATE.setQuestions.length;
  const answeredCount = Object.keys(STATE.answers).length;
  const correctSoFar = Object.values(STATE.answers).filter(a=>a.status==='correct').length;
  const pct = Math.round((STATE.index)/total*100);

  const optionsHTML = q.options.map(opt=>{
    let cls = 'option';
    if(STATE.locked){
      cls += ' locked';
      if(opt.k === q.correct) cls += ' correct';
      else if(opt.k === STATE.selectedKey) cls += ' wrong';
      else cls += ' dim';
    }
    return `<div class="${cls}" onclick="selectOption('${opt.k}')">
      <span class="k">${opt.k}.</span>
      <span>${escapeHtml(opt.t)}</span>
    </div>`;
  }).join('');

  let feedbackHTML = '';
  if(STATE.locked){
    const a = STATE.answers[q.id];
    let cls = a.status==='correct' ? 'correct' : (a.status==='wrong' ? 'wrong' : 'skipped');
    let head = a.status==='correct' ? '✅ Correct!' : (a.status==='wrong' ? '❌ Not quite.' : '⏭️ Skipped.');
    feedbackHTML = `<div class="feedback ${cls}">
      <b>${head}</b> ${a.status!=='skipped' ? '' : `The correct answer is <b>${q.correct}</b>.`}
      <div style="margin-top:8px;">${escapeHtml(q.explanation)}</div>
    </div>`;
  }

  return `
  <div class="quiz-topbar">
    <span>${escapeHtml(STATE.setLabel)}</span>
    <span>Question ${STATE.index+1} / ${total} &nbsp;·&nbsp; <span class="score-badge">${correctSoFar} correct</span></span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;"></div></div>

  <div class="card">
    <div class="qmeta">
      <span class="tag diff-${q.difficulty}">${q.difficulty}</span>
      <span class="tag">${escapeHtml(q.topic)}</span>
    </div>
    ${q.context ? `<div class="context-box">${q.context}</div>` : ''}
    <div class="qtext">${escapeHtml(q.question)}</div>
    ${optionsHTML}
    ${feedbackHTML}
    <div class="footer-actions">
      <button class="btn ghost" onclick="skipQuestion()" ${STATE.locked?'disabled':''}>Skip</button>
      <div class="row">
        <button class="btn secondary" onclick="backToMenu()">Menu</button>
        ${STATE.locked ? `<button class="btn" onclick="nextQuestion()">${STATE.index<total-1?'Next →':'Finish →'}</button>` : ''}
      </div>
    </div>
  </div>
  `;
}

function renderEnd(){
  const stats = computeStats();
  const pctScore = stats.total ? Math.round(stats.correct/stats.total*100) : 0;

  const diffRows = ['Easy','Moderate','Hard'].map(d=>{
    const b = stats.byDiff[d];
    const p = b.t ? Math.round(b.c/b.t*100) : 0;
    return `<div class="stat-box"><div class="num">${b.c}/${b.t}</div><div class="label">${d} · ${p}%</div></div>`;
  }).join('');

  const missed = STATE.setQuestions.filter(q=>{
    const a = STATE.answers[q.id];
    return a && (a.status==='wrong' || a.status==='skipped');
  });

  const reviewHTML = missed.length ? missed.map(q=>{
    const a = STATE.answers[q.id];
    const statusLabel = a.status==='wrong' ? 'Incorrect' : 'Skipped';
    const yourAns = a.status==='wrong' ? ` Your answer: <b>${a.selected}</b>.` : '';
    return `<div class="review-item">
      <span class="status ${a.status}">${statusLabel}</span>
      <div class="rq">${escapeHtml(q.question)}</div>
      <div class="exp">Correct answer: <b>${q.correct}</b>.${yourAns}<br>${escapeHtml(q.explanation)}</div>
    </div>`;
  }).join('') : `<div class="empty-note">🎉 No missed or skipped questions — clean sweep!</div>`;

  return `
  <div class="header">
    <div class="brand">
      <span class="kicker">Result</span>
      <h1>${escapeHtml(STATE.setLabel)}</h1>
    </div>
  </div>

  <div class="card" style="text-align:center;">
    <div style="font-family:var(--serif);font-size:44px;color:var(--accent2);font-weight:700;">${stats.correct} / ${stats.total}</div>
    <div style="color:var(--muted);font-size:14px;margin-top:2px;">Score: ${pctScore}% &nbsp;·&nbsp; ${stats.wrong} incorrect &nbsp;·&nbsp; ${stats.skipped} skipped</div>
    <div class="stat-grid">${diffRows}</div>
    <div class="row" style="justify-content:center;margin-top:8px;">
      <button class="btn" onclick="retrySameSet()">↻ Retry Same Set</button>
      <button class="btn secondary" onclick="backToMenu()">Back to Menu</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Review — Missed &amp; Skipped</h3>
    ${reviewHTML}
  </div>
  `;
}

render();
</script></body></html>
