<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABARD Grade A — ESI/GA Practice Quiz</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1d212b;
    --border:#2a2f3a;
    --text:#e8e9ec;
    --muted:#9aa1af;
    --accent:#c9a26a;
    --accent-2:#7fb3d5;
    --correct:#2e7d5b;
    --correct-bg:#12291f;
    --wrong:#a83e3e;
    --wrong-bg:#2b1414;
    --skip:#5a5f6b;
    serif-font: "Georgia","Iowan Old Style", serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  h1,h2,h3,.serif{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:600;
  }
  #app{
    max-width:760px;
    margin:0 auto;
    padding:20px 16px 60px;
    min-height:100vh;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{
    font-family:Georgia,serif;
    font-size:1.05rem;
    letter-spacing:.3px;
    color:var(--accent);
  }
  .brand small{
    display:block;
    font-family:-apple-system,sans-serif;
    color:var(--muted);
    font-size:.68rem;
    letter-spacing:.5px;
    margin-top:2px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 18px;
    font-size:.95rem;
    cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s;
    text-align:left;
  }
  .btn:hover{background:#232833;border-color:#3a4150;}
  .btn:active{transform:scale(.98);}
  .btn.primary{
    background:linear-gradient(180deg,#c9a26a,#b5895a);
    color:#20160a;
    border:none;
    font-weight:600;
  }
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;}
  .btn.small{padding:8px 12px;font-size:.82rem;border-radius:8px;}
  .btn.full{width:100%;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin-bottom:14px;
  }
  .hero{
    text-align:center;
    padding:30px 16px 10px;
  }
  .hero h1{font-size:1.5rem;margin:6px 0 4px;color:var(--text);}
  .hero p{color:var(--muted);font-size:.9rem;margin:0 0 22px;}
  .hero .badge{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--accent);
    font-size:.72rem;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .mode-grid{display:flex;flex-direction:column;gap:12px;}
  .mode-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .mode-card:hover{border-color:var(--accent);background:#1b1f28;}
  .mode-icon{
    font-size:1.6rem;
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);
    border-radius:12px;
    flex-shrink:0;
  }
  .mode-title{font-weight:600;font-size:1rem;margin-bottom:2px;}
  .mode-sub{color:var(--muted);font-size:.82rem;}

  .toggle-row{
    display:flex;
    gap:8px;
    background:var(--panel-2);
    border-radius:10px;
    padding:4px;
    margin:14px 0;
  }
  .toggle-btn{
    flex:1;
    text-align:center;
    padding:9px 6px;
    border-radius:8px;
    cursor:pointer;
    font-size:.85rem;
    color:var(--muted);
    transition:background .15s,color .15s;
  }
  .toggle-btn.active{background:var(--accent);color:#20160a;font-weight:600;}

  .section-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .section-tile{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .section-tile:hover{border-color:var(--accent-2);background:#1b1f28;}
  .section-tile .stname{font-size:.88rem;font-weight:600;margin-bottom:6px;line-height:1.25;}
  .section-tile .stcount{font-size:.72rem;color:var(--muted);}

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .progress-bar-bg{
    flex:1;
    height:8px;
    background:var(--panel-2);
    border-radius:6px;
    overflow:hidden;
  }
  .progress-bar-fg{
    height:100%;
    background:linear-gradient(90deg,var(--accent-2),var(--accent));
    transition:width .25s ease;
  }
  .score-pill{
    font-size:.8rem;
    background:var(--panel-2);
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:20px;
    color:var(--accent);
    white-space:nowrap;
    font-weight:600;
  }
  .qmeta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:.72rem;
    color:var(--muted);
    letter-spacing:.4px;
    text-transform:uppercase;
  }
  .diff-tag{
    padding:2px 8px;
    border-radius:20px;
    font-size:.68rem;
    letter-spacing:.3px;
  }
  .diff-Easy{background:#173225;color:#7bd6a2;}
  .diff-Moderate{background:#33291a;color:#e0b877;}
  .diff-Hard{background:#331a1a;color:#e08787;}

  .context-box{
    background:var(--panel-2);
    border-left:3px solid var(--accent-2);
    padding:12px 14px;
    border-radius:8px;
    font-size:.88rem;
    color:#c7cbd4;
    margin-bottom:12px;
    font-style:italic;
  }
  .stmt-list{
    background:var(--panel-2);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:12px;
    font-size:.88rem;
  }
  .stmt-list ol{margin:0;padding-left:18px;}
  .stmt-list li{margin-bottom:6px;color:#d5d8de;}

  .question-text{
    font-family:Georgia,serif;
    font-size:1.08rem;
    line-height:1.45;
    margin-bottom:16px;
    color:var(--text);
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:9px;
    cursor:pointer;
    transition:border-color .15s,background .15s;
    font-size:.92rem;
  }
  .option:hover:not(.locked){border-color:var(--accent-2);}
  .option .optkey{
    flex-shrink:0;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--panel);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;color:var(--muted);
  }
  .option.correct{border-color:var(--correct);background:var(--correct-bg);}
  .option.correct .optkey{background:var(--correct);color:#fff;border-color:var(--correct);}
  .option.wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .option.wrong .optkey{background:var(--wrong);color:#fff;border-color:var(--wrong);}
  .option.locked{cursor:default;}
  .option.dim{opacity:.5;}

  .feedback-box{
    margin-top:14px;
    padding:14px 16px;
    border-radius:10px;
    font-size:.88rem;
    line-height:1.5;
  }
  .feedback-box.correct{background:var(--correct-bg);border:1px solid var(--correct);color:#bfe8d3;}
  .feedback-box.wrong{background:var(--wrong-bg);border:1px solid var(--wrong);color:#f0c6c6;}
  .feedback-box.skipped{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);}
  .feedback-box b{color:var(--text);}

  .action-row{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .action-row .btn{flex:1;}

  .end-hero{text-align:center;padding:10px 0 18px;}
  .end-score{
    font-family:Georgia,serif;
    font-size:2.6rem;
    color:var(--accent);
    margin:6px 0;
  }
  .end-sub{color:var(--muted);font-size:.9rem;}
  .diff-breakdown{
    display:flex;
    gap:10px;
    margin:18px 0;
  }
  .diff-block{
    flex:1;
    background:var(--panel-2);
    border-radius:12px;
    padding:12px 8px;
    text-align:center;
    border:1px solid var(--border);
  }
  .diff-block .dbnum{font-size:1.2rem;font-weight:700;font-family:Georgia,serif;}
  .diff-block .dblabel{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}

  .review-item{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .review-item .rq{font-size:.88rem;margin-bottom:8px;color:var(--text);}
  .review-item .rtag{
    display:inline-block;
    font-size:.65rem;
    padding:2px 8px;
    border-radius:20px;
    margin-bottom:8px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .rtag.missed{background:var(--wrong-bg);color:#f0c6c6;}
  .rtag.skipped-tag{background:var(--panel-2);color:var(--muted);}
  .review-item .rans{font-size:.82rem;color:#bfe8d3;margin-bottom:6px;}
  .review-item .rexp{font-size:.82rem;color:var(--muted);}

  .empty-note{
    text-align:center;
    color:var(--muted);
    padding:30px 10px;
    font-size:.9rem;
  }
  .link-btn{
    background:none;border:none;color:var(--accent-2);cursor:pointer;font-size:.85rem;padding:4px 0;text-decoration:underline;
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

  @media (max-width:420px){
    .section-grid{grid-template-columns:1fr;}
    .end-score{font-size:2.1rem;}
  }

<script>
// ============ NABARD GA Practice Quiz — App Logic ============
(function(){
  const app = document.getElementById('app');

  const TOPIC_ORDER = [
    "Phase1+2 Schemes","Cabinet Affairs","Banking & Finance","National Affairs",
    "International Affairs","Reports & Indices","Science & Tech","Defence",
    "Appointments","Sports","Books & Authors","Awards","Important Days","Obituary"
  ];

  const SCHEME_TYPES = ["combo","notamong","acronym"];

  let state = {
    screen: 'home',
    order: 'pdf', // pdf | shuffled
    activeSet: [],       // array of question objects currently being played
    activeMode: '',      // label for display / retry
    activeTopic: null,
    idx: 0,
    score: 0,
    results: {}          // qid -> {status:'correct'|'wrong'|'skipped', chosen}
  };

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function topicCounts(){
    const c = {};
    QUESTIONS.forEach(q=>{ c[q.t] = (c[q.t]||0)+1; });
    return c;
  }

  function schemeQuestions(){
    return QUESTIONS.filter(q => SCHEME_TYPES.includes(q.ty));
  }

  // ---------------- Navigation ----------------
  function goHome(){
    state.screen = 'home';
    render();
  }

  function goFullSetup(){
    state.screen = 'fullSetup';
    render();
  }

  function goSectionGrid(){
    state.screen = 'sectionGrid';
    render();
  }

  function startFullTest(){
    let set = QUESTIONS.slice();
    if(state.order === 'shuffled'){ set = shuffle(set); }
    beginQuiz(set, 'Full Practice Test ('+(state.order==='pdf'?'PDF Order':'Shuffled')+')', null);
  }

  function startSection(topic){
    const set = QUESTIONS.filter(q=>q.t===topic);
    beginQuiz(set, 'Section: '+topic, topic);
  }

  function startSchemesSprint(){
    const set = shuffle(schemeQuestions());
    beginQuiz(set, 'Schemes-Only Sprint', null);
  }

  function beginQuiz(set, label, topic){
    state.activeSet = set;
    state.activeMode = label;
    state.activeTopic = topic;
    state.idx = 0;
    state.score = 0;
    state.results = {};
    state.screen = 'quiz';
    state.answeredCurrent = false;
    render();
  }

  function retrySameSet(){
    state.idx = 0;
    state.score = 0;
    state.results = {};
    state.screen = 'quiz';
    state.answeredCurrent = false;
    render();
  }

  // ---------------- Quiz interaction ----------------
  function selectOption(qid, letter){
    if(state.results[qid]) return; // already answered/skipped
    const q = state.activeSet.find(x=>x.id===qid);
    const correct = (letter === q.a);
    state.results[qid] = {status: correct?'correct':'wrong', chosen: letter};
    if(correct) state.score++;
    state.answeredCurrent = true;
    render();
  }

  function skipCurrent(){
    const q = state.activeSet[state.idx];
    if(state.results[q.id]) return;
    state.results[q.id] = {status:'skipped', chosen:null};
    state.answeredCurrent = true;
    render();
  }

  function nextQuestion(){
    if(state.idx < state.activeSet.length - 1){
      state.idx++;
      state.answeredCurrent = false;
      render();
    } else {
      state.screen = 'end';
      render();
    }
  }

  // ---------------- Rendering ----------------
  function render(){
    app.innerHTML = '';
    if(state.screen === 'home') return renderHome();
    if(state.screen === 'fullSetup') return renderFullSetup();
    if(state.screen === 'sectionGrid') return renderSectionGrid();
    if(state.screen === 'quiz') return renderQuiz();
    if(state.screen === 'end') return renderEnd();
  }

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function renderTopbar(showBack, backFn, title){
    const bar = el('div','topbar');
    const left = el('div');
    if(showBack){
      const b = el('button','btn small ghost','&larr; Menu');
      b.onclick = backFn || goHome;
      left.appendChild(b);
    } else {
      const brand = el('div','brand','NABARD Grade A<small>ESI/GA PRACTICE ENGINE</small>');
      left.appendChild(brand);
    }
    bar.appendChild(left);
    if(title){
      const t = el('div','score-pill', title);
      bar.appendChild(t);
    }
    app.appendChild(bar);
  }

  function renderHome(){
    renderTopbar(false);
    const hero = el('div','hero');
    hero.innerHTML = `
      <div class="badge">GA Capsule &middot; 16&ndash;31 August</div>
      <h1>ESI / GA Practice Quiz</h1>
      <p>${QUESTIONS.length} questions &middot; modelled on NABARD Grade A mock-test style</p>
    `;
    app.appendChild(hero);

    const grid = el('div','mode-grid');

    const modes = [
      {icon:'&#128214;', title:'Full Practice Test', sub:'All '+QUESTIONS.length+' questions &middot; choose PDF or shuffled order', fn: goFullSetup},
      {icon:'&#128209;', title:'Section-wise Revision', sub:'Drill one topic at a time', fn: goSectionGrid},
      {icon:'&#9889;', title:'Schemes-Only Sprint', sub: schemeQuestions().length+' questions &middot; schemes, orgs & acronyms only', fn: startSchemesSprint}
    ];
    modes.forEach(m=>{
      const c = el('div','mode-card');
      c.innerHTML = `<div class="mode-icon">${m.icon}</div><div><div class="mode-title">${m.title}</div><div class="mode-sub">${m.sub}</div></div>`;
      c.onclick = m.fn;
      grid.appendChild(c);
    });
    app.appendChild(grid);
  }

  function renderFullSetup(){
    renderTopbar(true);
    const card = el('div','card');
    card.innerHTML = `<h2 style="margin-top:0;font-size:1.1rem;">Full Practice Test</h2>
      <p style="color:var(--muted);font-size:.85rem;">All ${QUESTIONS.length} questions across every topic.</p>`;
    const toggle = el('div','toggle-row');
    const pdfBtn = el('div','toggle-btn'+(state.order==='pdf'?' active':''),'PDF Order');
    const shufBtn = el('div','toggle-btn'+(state.order==='shuffled'?' active':''),'Shuffled');
    pdfBtn.onclick = ()=>{ state.order='pdf'; render(); };
    shufBtn.onclick = ()=>{ state.order='shuffled'; render(); };
    toggle.appendChild(pdfBtn); toggle.appendChild(shufBtn);
    card.appendChild(toggle);
    const startBtn = el('button','btn primary full','Start Test');
    startBtn.style.marginTop='10px';
    startBtn.onclick = startFullTest;
    card.appendChild(startBtn);
    app.appendChild(card);
  }

  function renderSectionGrid(){
    renderTopbar(true);
    const title = el('h2','serif','Section-wise Revision');
    title.style.fontSize='1.15rem';
    app.appendChild(title);
    const counts = topicCounts();
    const grid = el('div','section-grid');
    TOPIC_ORDER.forEach(topic=>{
      const n = counts[topic] || 0;
      if(n === 0) return;
      const tile = el('div','section-tile');
      tile.innerHTML = `<div class="stname">${topic}</div><div class="stcount">${n} question${n>1?'s':''}</div>`;
      tile.onclick = ()=> startSection(topic);
      grid.appendChild(tile);
    });
    app.appendChild(grid);
  }

  function renderQuiz(){
    const q = state.activeSet[state.idx];
    const total = state.activeSet.length;
    renderTopbar(true, ()=>{ if(confirm('Leave this test and return to the menu? Your progress in this set will be lost.')) goHome(); }, (state.idx+1)+' / '+total);

    // progress + score
    const pw = el('div','progress-wrap');
    const bg = el('div','progress-bar-bg');
    const fg = el('div','progress-bar-fg');
    fg.style.width = Math.round(((state.idx)/total)*100)+'%';
    bg.appendChild(fg);
    pw.appendChild(bg);
    const scorePill = el('div','score-pill','Score: '+state.score);
    pw.appendChild(scorePill);
    app.appendChild(pw);

    const card = el('div','card');

    // meta row
    const meta = el('div','qmeta');
    meta.innerHTML = `<span>${q.t}</span><span class="diff-tag diff-${q.d}">${q.d}</span>`;
    card.appendChild(meta);

    if(q.c){
      const ctx = el('div','context-box', q.c);
      card.appendChild(ctx);
    }
    if(q.s && q.s.length){
      const sl = el('div','stmt-list');
      const ol = document.createElement('ol');
      q.s.forEach(st=>{
        const li = document.createElement('li');
        li.textContent = st;
        ol.appendChild(li);
      });
      sl.appendChild(ol);
      card.appendChild(sl);
    }

    const qt = el('div','question-text', q.q);
    card.appendChild(qt);

    const answered = !!state.results[q.id];
    const chosenLetter = answered ? state.results[q.id].chosen : null;

    q.o.forEach(([letter, text])=>{
      const opt = el('div','option'+(answered?' locked':''));
      if(answered){
        if(letter === q.a) opt.classList.add('correct');
        else if(letter === chosenLetter) opt.classList.add('wrong');
        else opt.classList.add('dim');
      }
      opt.innerHTML = `<div class="optkey">${letter}</div><div>${text}</div>`;
      if(!answered){
        opt.onclick = ()=> selectOption(q.id, letter);
      }
      card.appendChild(opt);
    });

    if(answered){
      const res = state.results[q.id];
      const fb = el('div','feedback-box '+(res.status==='correct'?'correct':(res.status==='wrong'?'wrong':'skipped')));
      let head = res.status==='correct' ? '&#10003; Correct.' : (res.status==='wrong' ? '&#10007; Not quite.' : 'Skipped.');
      fb.innerHTML = `<b>${head}</b> ${q.e}`;
      card.appendChild(fb);

      const actionRow = el('div','action-row');
      const nextBtn = el('button','btn primary', state.idx < total-1 ? 'Next Question &rarr;' : 'Finish & See Results');
      nextBtn.onclick = nextQuestion;
      actionRow.appendChild(nextBtn);
      card.appendChild(actionRow);
    } else {
      const actionRow = el('div','action-row');
      const skipBtn = el('button','btn ghost full','Skip Question');
      skipBtn.onclick = skipCurrent;
      actionRow.appendChild(skipBtn);
      card.appendChild(actionRow);
    }

    app.appendChild(card);
  }

  function renderEnd(){
    renderTopbar(false);
    const set = state.activeSet;
    const total = set.length;
    let correct=0, wrong=0, skipped=0;
    const byDiff = {Easy:{c:0,t:0}, Moderate:{c:0,t:0}, Hard:{c:0,t:0}};
    const missedList = [];

    set.forEach(q=>{
      const r = state.results[q.id];
      byDiff[q.d].t++;
      if(!r){ skipped++; missedList.push({q, status:'skipped'}); return; }
      if(r.status==='correct'){ correct++; byDiff[q.d].c++; }
      else if(r.status==='wrong'){ wrong++; missedList.push({q, status:'wrong', chosen:r.chosen}); }
      else if(r.status==='skipped'){ skipped++; missedList.push({q, status:'skipped'}); }
    });

    const pct = total ? Math.round((correct/total)*100) : 0;

    const hero = el('div','end-hero');
    hero.innerHTML = `
      <div class="badge">${state.activeMode}</div>
      <div class="end-score">${correct} / ${total}</div>
      <div class="end-sub">${pct}% accuracy &middot; ${wrong} missed &middot; ${skipped} skipped</div>
    `;
    app.appendChild(hero);

    const diffCard = el('div','card');
    diffCard.innerHTML = `<h3 style="margin-top:0;font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Accuracy by Difficulty</h3>`;
    const dbRow = el('div','diff-breakdown');
    ['Easy','Moderate','Hard'].forEach(d=>{
      const b = byDiff[d];
      const p = b.t ? Math.round((b.c/b.t)*100) : 0;
      const block = el('div','diff-block');
      block.innerHTML = `<div class="dbnum">${b.t? p+'%':'&mdash;'}</div><div class="dblabel">${d} (${b.c}/${b.t})</div>`;
      dbRow.appendChild(block);
    });
    diffCard.appendChild(dbRow);
    app.appendChild(diffCard);

    const actionRow = el('div','action-row');
    const retryBtn = el('button','btn primary','Retry Same Set');
    retryBtn.onclick = retrySameSet;
    const menuBtn = el('button','btn ghost','Back to Menu');
    menuBtn.onclick = goHome;
    actionRow.appendChild(retryBtn);
    actionRow.appendChild(menuBtn);
    app.appendChild(actionRow);

    // Review section
    if(missedList.length){
      const revTitle = el('h2','serif','Review: Missed & Skipped');
      revTitle.style.fontSize='1.05rem';
      revTitle.style.margin='22px 0 10px';
      app.appendChild(revTitle);

      missedList.forEach(item=>{
        const q = item.q;
        const ri = el('div','review-item');
        const tag = el('div','rtag '+(item.status==='wrong'?'missed':'skipped-tag'), item.status==='wrong'?'Missed':'Skipped');
        ri.appendChild(tag);
        const qDiv = el('div','rq', q.q);
        ri.appendChild(qDiv);
        const correctText = q.o.find(o=>o[0]===q.a)[1];
        const ansDiv = el('div','rans', `<b>Correct answer (${q.a}):</b> ${correctText}`);
        ri.appendChild(ansDiv);
        const expDiv = el('div','rexp', q.e);
        ri.appendChild(expDiv);
        app.appendChild(ri);
      });
    } else {
      const note = el('div','empty-note','Perfect run — nothing missed or skipped! &#127881;');
      app.appendChild(note);
    }
  }

  render();
})();

</script>
