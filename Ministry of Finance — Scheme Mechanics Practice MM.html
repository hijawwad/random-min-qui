": "D", "explanation": "The tiered LTV ratios are 85% for loans up to ₹2.5 Lakh, 80% for ₹2.5-5 Lakh, and 75% for loans above ₹5 Lakh."}, {"id": "q81", "scheme": "gms", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements correctly describes India's gold policy framework?", "options": [{"id": "A", "text": "SGB involves the physical deposit and melting of gold for purity testing."}, {"id": "B", "text": "The India Gold Coin (IGC) is sold exclusively through RBI branches."}, {"id": "C", "text": "GMS mobilises idle physical gold, while SGB offers a paper/digital gold investment issued by RBI on behalf of the government."}, {"id": "D", "text": "GMS offers a fixed 2.5% per annum interest rate, same as SGB."}, {"id": "E", "text": "SGB deposits are eligible for a Gold Metal Loan (GML) to jewelers."}], "correct": "C", "explanation": "Physical deposit and melting for purity testing is a GMS feature, not SGB; IGC is sold through MMTC and designated banks, not RBI branches; GMS interest is 0.5-1% (bank's discretion) unlike SGB's fixed 2.5%; and the Gold Metal Loan mechanism belongs to GMS, not SGB."}, {"id": "q82", "scheme": "gms", "type": "figure", "difficulty": "Easy", "context": "", "question": "What is the minimum quantity of gold required to make a deposit under the Gold Monetisation Scheme?", "options": [{"id": "A", "text": "10 grams"}, {"id": "B", "text": "5 grams"}, {"id": "C", "text": "20 grams"}, {"id": "D", "text": "1 gram"}, {"id": "E", "text": "50 grams"}], "correct": "A", "explanation": "The minimum deposit under GMS is 10 grams of raw gold, with no upper limit on deposits."}, {"id": "q83", "scheme": "sgb", "type": "numbered", "difficulty": "Hard", "context": "The Sovereign Gold Bond (SGB) Scheme was launched in November 2015. The Government of India confirmed in Budget 2025 that no new SGB tranches will be issued.\n1. SGBs are denominated in multiples of grams of gold, with a basic unit of 1 gram.\n2. The tenure of an SGB is 8 years, with an exit option available after the 5th year.\n3. SGBs offer a fixed interest of 2.5% per annum, paid monthly on the nominal value.\n4. SGBs are classified as Government Securities under the Government Securities Act, 2006.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 2 and 4"}, {"id": "B", "text": "1, 3 and 4"}, {"id": "C", "text": "2 and 3"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 2 only"}], "correct": "A", "explanation": "SGB interest of 2.5% per annum is paid half-yearly, not monthly. Statements 1, 2 and 4 are correct."}, {"id": "q84", "scheme": "sgb", "type": "numbered", "difficulty": "Hard", "context": "Regarding the capital gains taxation on SGBs (as of June 2026):\n1. If held till the 8-year maturity by the original subscriber, capital gains are completely exempt from tax.\n2. Premature redemption after the 5th year via the RBI window is taxable as Long-Term Capital Gains at 12.5% (without indexation).\n3. If sold on the stock exchange before 12 months of holding, it is taxed as Short-Term Capital Gains at the slab rate.\n4. TDS (Tax Deducted at Source) is applicable on the interest income from SGBs.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "3 and 4"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "Only 4"}, {"id": "E", "text": "Only 3"}], "correct": "D", "explanation": "No TDS (Tax Deducted at Source) is applicable on the interest income earned from SGBs."}, {"id": "q85", "scheme": "sgb", "type": "scenario", "difficulty": "Hard", "context": "Consider the following individuals regarding SGB investment eligibility during the period when SGBs were still being issued:\n1. Ritu, a resident individual wishing to invest 3 kg of gold value in SGBs in one financial year.\n2. Ashok Trust, a charitable trust wishing to invest 25 kg of gold value in SGBs.\n3. Farhan, an NRI who never held SGBs before, wishing to purchase fresh SGBs.\n4. Meena, a resident who purchased SGBs and later became an NRI, wishing to hold her existing SGBs to maturity.", "question": "Who among the following are/were eligible, per the applicable limits and rules?", "options": [{"id": "A", "text": "1, 2 and 4"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1 and 4"}, {"id": "E", "text": "1, 3 and 4"}], "correct": "D", "explanation": "Ritu's 3kg investment is within the individual annual limit of 4kg. Meena, a resident who later became an NRI, may hold her existing SGBs to maturity under the stated exception. Ashok Trust's 25kg exceeds the 20kg limit for Trusts. Farhan, an NRI, cannot purchase fresh SGBs."}, {"id": "q86", "scheme": "sgb", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following was NOT a sales channel through which SGBs were sold?", "options": [{"id": "A", "text": "Scheduled Commercial Banks"}, {"id": "B", "text": "Stock Holding Corporation of India (SHCIL)"}, {"id": "C", "text": "Regional Rural Cooperative Societies"}, {"id": "D", "text": "Designated Post Offices"}, {"id": "E", "text": "NSE/BSE (online)"}], "correct": "C", "explanation": "SGBs were sold through Scheduled Commercial Banks, SHCIL, designated Post Offices, and directly on NSE/BSE — there was no 'Regional Rural Cooperative Societies' channel."}, {"id": "q87", "scheme": "sgb", "type": "figure", "difficulty": "Moderate", "context": "", "question": "What is the maximum annual SGB investment limit (per fiscal year) for individuals, and for Trusts and similar entities, respectively?", "options": [{"id": "A", "text": "4 kg; 4 kg"}, {"id": "B", "text": "4 kg; 20 kg"}, {"id": "C", "text": "20 kg; 4 kg"}, {"id": "D", "text": "2 kg; 10 kg"}, {"id": "E", "text": "4 kg; 10 kg"}], "correct": "B", "explanation": "The maximum annual investment limit is 4 kg for both Individuals and HUFs, and 20 kg for Trusts and similar entities."}, {"id": "q88", "scheme": "sgb", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about the Sovereign Gold Bond scheme is correct?", "options": [{"id": "A", "text": "NRIs are freely eligible to purchase fresh SGB tranches."}, {"id": "B", "text": "SGBs carry no sovereign guarantee, unlike other Government Securities."}, {"id": "C", "text": "A discount of ₹100 per gram is offered for online subscription and digital payment."}, {"id": "D", "text": "The issue price of SGBs is based on the simple average closing price of 999-purity gold published by IBJA for the last 3 working days preceding the subscription period."}, {"id": "E", "text": "TDS is deducted on SGB interest at the rate applicable to the investor's income slab."}], "correct": "D", "explanation": "NRIs are NOT eligible to purchase fresh SGBs; SGBs DO carry a sovereign guarantee; the online discount is ₹50 per gram, not ₹100; and no TDS applies on SGB interest."}, {"id": "q89", "scheme": "sgb", "type": "figure", "difficulty": "Easy", "context": "", "question": "What is the fixed annual interest rate offered on Sovereign Gold Bonds?", "options": [{"id": "A", "text": "2.50%"}, {"id": "B", "text": "3.00%"}, {"id": "C", "text": "8.00%"}, {"id": "D", "text": "1.50%"}, {"id": "E", "text": "4.00%"}], "correct": "A", "explanation": "SGBs offer a fixed interest of 2.50% per annum, paid half-yearly, independent of gold price movement."}, {"id": "q90", "scheme": "ssa", "type": "numbered", "difficulty": "Hard", "context": "Sukanya Samriddhi Account (SSA), launched under the Beti Bachao Beti Padhao campaign on January 22, 2015, offers higher interest rates than most other debt instruments.\n1. An SSA account can be opened for a girl child from birth until she attains the age of 10 years.\n2. A maximum of two accounts per family are permitted, one for each girl child.\n3. A third account can be opened if twin girls are born in the second birth, or if triplets are born in the first birth.\n4. Contributions must be made for a period of 21 years from the date of account opening.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 2 and 4"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1 and 4 only"}, {"id": "E", "text": "1, 2 and 3"}], "correct": "E", "explanation": "Contributions under SSA must be made for 15 years from the date of account opening, though the account matures after 21 years. Statements 1, 2 and 3 are correct."}, {"id": "q91", "scheme": "ssa", "type": "numbered", "difficulty": "Hard", "context": "Regarding withdrawal rules under SSA:\n1. Partial withdrawal of up to 50% of the balance (as of the end of the preceding financial year) is permitted for higher education.\n2. Partial withdrawal is permitted once the girl turns 18 years or passes Class 10, whichever is earlier.\n3. Premature closure due to marriage is allowed only after the girl turns 21 years.\n4. On full maturity (21 years from account opening), the full accumulated amount is payable.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "3 and 4"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "Only 3"}, {"id": "E", "text": "Only 4"}], "correct": "D", "explanation": "Premature closure of an SSA account due to marriage is allowed only after the girl turns 18 years, not 21."}, {"id": "q92", "scheme": "ssa", "type": "scenario", "difficulty": "Hard", "context": "Consider the following families regarding eligibility to open Sukanya Samriddhi Accounts:\n1. The Roy family, wishing to open a third account after having twin girls in their second childbirth (their first child was also a girl).\n2. The Nair family, wishing to open a fourth account for a fourth girl child born to them naturally (no twins/triplets involved).\n3. Mr. Iyer, wishing to open an account for his 11-year-old daughter.\n4. Ms. Kapoor, a resident Indian, wishing to open an account for her newborn daughter.", "question": "Who among the following are eligible to open the SSA account(s) described?", "options": [{"id": "A", "text": "1, 2 and 4"}, {"id": "B", "text": "1 and 4"}, {"id": "C", "text": "2 and 3"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1, 3 and 4"}], "correct": "B", "explanation": "The Roy family's third account is permitted under the twin-in-second-birth exception. Ms. Kapoor can open an account for her newborn resident daughter. The Nair family's fourth account (with no twins/triplets involved) exceeds the maximum of two accounts per family. Mr. Iyer's 11-year-old daughter exceeds the maximum account-opening age of 10."}, {"id": "q93", "scheme": "ssa", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT a valid ground for premature closure of an SSA account?", "options": [{"id": "A", "text": "The girl child's marriage before completing 15 years of contribution"}, {"id": "B", "text": "Death of the account holder (girl child)"}, {"id": "C", "text": "Life-threatening disease of the account holder or guardian"}, {"id": "D", "text": "Change in residency status (girl child becoming an NRI/foreign citizen)"}, {"id": "E", "text": "Extreme compassionate grounds after 5 years of account opening"}], "correct": "A", "explanation": "Premature closure due to marriage is tied to the girl attaining 18 years of age, not to completing any specific number of years of contribution."}, {"id": "q94", "scheme": "ssa", "type": "figure", "difficulty": "Moderate", "context": "", "question": "What is the minimum and maximum deposit permitted per financial year under Sukanya Samriddhi Account, respectively?", "options": [{"id": "A", "text": "₹500; ₹1,50,000"}, {"id": "B", "text": "₹250; ₹1,50,000"}, {"id": "C", "text": "₹250; ₹1,00,000"}, {"id": "D", "text": "₹1,000; ₹1,50,000"}, {"id": "E", "text": "₹250; ₹2,00,000"}], "correct": "B", "explanation": "The minimum deposit is ₹250 per financial year, and the maximum is ₹1,50,000 per financial year."}, {"id": "q95", "scheme": "ssa", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements correctly compares SSA with PPF (Public Provident Fund)?", "options": [{"id": "A", "text": "SSA currently offers a higher interest rate (8.2%) than PPF (7.1%)."}, {"id": "B", "text": "PPF has a longer tenure (21 years) than SSA (15 years)."}, {"id": "C", "text": "SSA allows only 1 account per individual, same as PPF."}, {"id": "D", "text": "PPF offers EEE tax status while SSA does not."}, {"id": "E", "text": "SSA has no maximum deposit limit, unlike PPF."}], "correct": "A", "explanation": "PPF's tenure (15 years, extendable) is shorter than SSA's (21 years) — reversed in option B; SSA allows 2 accounts per family vs PPF's 1 per individual; both SSA and PPF enjoy EEE status; and SSA's maximum deposit limit is ₹1.5 Lakh, same as PPF."}, {"id": "q96", "scheme": "ssa", "type": "figure", "difficulty": "Easy", "context": "", "question": "What is the current interest rate applicable to Sukanya Samriddhi Account (for Q1 FY27)?", "options": [{"id": "A", "text": "7.1% per annum"}, {"id": "B", "text": "8.5% per annum"}, {"id": "C", "text": "8.2% per annum"}, {"id": "D", "text": "7.5% per annum"}, {"id": "E", "text": "9.0% per annum"}], "correct": "C", "explanation": "The current interest rate on SSA is 8.2% per annum (for Q1 FY27), compounded annually."}, {"id": "q97", "scheme": "mssc", "type": "numbered", "difficulty": "Hard", "context": "Mahila Samman Savings Certificate (MSSC), launched April 1, 2023, was available for new accounts only until March 31, 2025, and has since been discontinued for new investments.\n1. MSSC accounts can be opened by any woman of any age, or a girl child through a guardian.\n2. The maximum investment under MSSC is ₹2,00,000 aggregate across all accounts held by an individual.\n3. MSSC allows joint accounts to be opened between two women.\n4. Contributions can be made either as a lump sum or through monthly installments (SIP).", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "Only 3"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "Only 4"}, {"id": "E", "text": "3 and 4"}], "correct": "E", "explanation": "MSSC allows only individual accounts — joint accounts are explicitly NOT permitted. Also, investment must be made only as a lump sum; monthly installments/SIP are not allowed."}, {"id": "q98", "scheme": "mssc", "type": "numbered", "difficulty": "Hard", "context": "Regarding the tax treatment of MSSC:\n1. MSSC has 'EEE' (Exempt-Exempt-Exempt) tax status, similar to the Sukanya Samriddhi Account.\n2. Investment in MSSC qualifies for deduction under Section 80C.\n3. Interest earned on MSSC is taxable as per the individual's income tax slab.\n4. No TDS is deducted on MSSC interest, though it remains taxable and must be declared in the ITR.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "3 and 4"}, {"id": "B", "text": "Only 1"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "Only 4"}, {"id": "E", "text": "1 and 2"}], "correct": "E", "explanation": "MSSC does NOT have EEE status — unlike SSA, investment does not qualify for a Section 80C deduction."}, {"id": "q99", "scheme": "mssc", "type": "scenario", "difficulty": "Hard", "context": "Consider the following individuals regarding eligibility to open an MSSC account (during the window it was available):\n1. Mrs. Sharma, aged 68, wishing to open an account.\n2. Baby Riya, a 4-year-old girl, whose account is to be opened and operated by her guardian.\n3. Mr. Bose, wishing to open a joint MSSC account with his wife.\n4. Ms. Fernandes, wishing to open a second MSSC certificate two months after opening her first one.", "question": "Who among the following were eligible, per the applicable rules?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "2, 3 and 4"}, {"id": "C", "text": "1 and 2"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 4 only"}], "correct": "C", "explanation": "Mrs. Sharma (no upper age limit for MSSC) and Baby Riya (a minor girl, via guardian) are eligible. Mr. Bose cannot open a joint account since MSSC only permits individual accounts, and is for women/girls. Ms. Fernandes must wait for the mandatory 3-month gap between accounts, which has not yet elapsed at 2 months."}, {"id": "q100", "scheme": "mssc", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT recognized as a 'compassionate ground' for premature closure of an MSSC account with full 7.5% interest?", "options": [{"id": "A", "text": "Death of the account holder"}, {"id": "B", "text": "Life-threatening illness of the account holder"}, {"id": "C", "text": "Death of the guardian (for minor accounts)"}, {"id": "D", "text": "All of the above are recognized compassionate grounds"}, {"id": "E", "text": "Relocation of the account holder to a different city within India"}], "correct": "E", "explanation": "Compassionate grounds under MSSC are limited to death of the account holder, life-threatening illness, and death of the guardian (for minor accounts). Mere relocation is not a recognized compassionate ground."}, {"id": "q101", "scheme": "mssc", "type": "figure", "difficulty": "Moderate", "context": "", "question": "What percentage of the MSSC balance can be withdrawn as a partial withdrawal, and after how many years from opening, respectively?", "options": [{"id": "A", "text": "40%; 1 year"}, {"id": "B", "text": "50%; 1 year"}, {"id": "C", "text": "40%; 6 months"}, {"id": "D", "text": "25%; 1 year"}, {"id": "E", "text": "50%; 2 years"}], "correct": "A", "explanation": "Under MSSC, up to 40% of the balance can be withdrawn once, after one year from the opening date."}, {"id": "q102", "scheme": "mssc", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about MSSC is correct?", "options": [{"id": "A", "text": "MSSC offers a floating interest rate that is revised every quarter, like SSA."}, {"id": "B", "text": "The minimum investment under MSSC is ₹500, in multiples of ₹50."}, {"id": "C", "text": "MSSC accounts can be opened at Post Offices only, not at banks."}, {"id": "D", "text": "The maturity period of MSSC is 5 years."}, {"id": "E", "text": "If closed after 6 months without a compassionate reason, the interest rate is reduced by 2%, i.e., the depositor receives 5.5% instead of 7.5%."}], "correct": "E", "explanation": "MSSC's 7.5% rate is fixed for the entire tenure (unlike SSA's quarterly-revised rate); the minimum investment is ₹1,000 in multiples of ₹100; MSSC is available at both Post Offices and Scheduled Commercial Banks; and the maturity period is 2 years, not 5."}, {"id": "q103", "scheme": "rbird", "type": "numbered", "difficulty": "Hard", "context": "The RBI Retail Direct Scheme was launched on November 12, 2021, allowing retail investors to invest directly in Government Securities without intermediaries.\n1. An individual can open only one RDG (Retail Direct Gilt) account, with an exception for the second holder in a joint account.\n2. There are no fees for opening or maintaining an RDG account.\n3. Non-Resident Indians (NRIs) are not eligible to invest under this scheme.\n4. Nomination is mandatory at the time of account opening, with up to two nominees permitted.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 3 and 4"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1 and 2 only"}, {"id": "E", "text": "1, 2 and 4"}], "correct": "E", "explanation": "NRIs ARE eligible to invest in G-Secs under the RBI Retail Direct Scheme, under the Foreign Exchange Management Act (FEMA). Statements 1, 2 and 4 are correct."}, {"id": "q104", "scheme": "rbird", "type": "numbered", "difficulty": "Hard", "context": "Regarding primary market participation under the RBI Retail Direct Scheme:\n1. Retail investors participate through the Non-Competitive Bidding (NCB) window.\n2. Investors are guaranteed allocation at the weighted average price of successful competitive bids.\n3. The platform allows both competitive and non-competitive bidding for retail investors.\n4. Payment for the bid can be made through Net Banking or UPI.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "Only 3"}, {"id": "B", "text": "1 and 2"}, {"id": "C", "text": "3 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "A", "explanation": "The platform supports ONLY non-competitive participation for retail investors (amount only, no price); those wanting competitive bids must approach a Bank or Primary Dealer separately."}, {"id": "q105", "scheme": "rbird", "type": "scenario", "difficulty": "Hard", "context": "Consider the following individuals regarding eligibility to open an RDG account:\n1. Prakash, a resident individual with a PAN, Aadhaar, and Indian savings account.\n2. Latika, an NRI investing in G-Secs under FEMA regulations, with an Indian savings account and PAN.\n3. Rohan, who already holds an individual RDG account and wants to open a second individual RDG account in his name alone.\n4. Meena, the second holder in a joint RDG account with her husband, wishing to also open a separate individual RDG account.", "question": "Who among the following can validly hold/open an RDG account as described?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "1, 2 and 4"}, {"id": "C", "text": "2, 3 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 3 only"}], "correct": "B", "explanation": "Prakash (resident individual) and Latika (an NRI, eligible under FEMA) can open RDG accounts. Meena, as the second holder in a joint account, is permitted an additional individual account as an exception. Rohan cannot open a second individual RDG account — only one is allowed per individual."}, {"id": "q106", "scheme": "rbird", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT among the five instruments retail investors can bid for/trade under the RBI Retail Direct Scheme?", "options": [{"id": "A", "text": "Government of India Treasury Bills (T-Bills)"}, {"id": "B", "text": "Government of India Dated Securities (G-Secs)"}, {"id": "C", "text": "State Development Loans (SDLs)"}, {"id": "D", "text": "Sovereign Gold Bonds (SGBs)"}, {"id": "E", "text": "Corporate Bonds"}], "correct": "E", "explanation": "The five permitted instruments are T-Bills, dated G-Secs, SDLs, SGBs, and Floating Rate Savings Bonds (FRSBs). Corporate Bonds are not covered under this scheme."}, {"id": "q107", "scheme": "rbird", "type": "acronym", "difficulty": "Easy", "context": "", "question": "In the context of the RBI Retail Direct Scheme, what does 'NDS-OM' (the secondary market platform accessible via the RDG account) stand for?", "options": [{"id": "A", "text": "National Debt Securities – Order Management"}, {"id": "B", "text": "Negotiated Dealing System – Online Market"}, {"id": "C", "text": "National Dealing System – Order Matching"}, {"id": "D", "text": "Negotiated Debt Securities – Order Matching"}, {"id": "E", "text": "Negotiated Dealing System – Order Matching"}], "correct": "E", "explanation": "NDS-OM (Negotiated Dealing System – Order Matching) is the secondary market platform accessible through the RDG account, including the retail-friendly 'Odd Lot' segment."}, {"id": "q108", "scheme": "rbird", "type": "figure", "difficulty": "Moderate", "context": "", "question": "Under the Non-Competitive Bidding (NCB) window of the RBI Retail Direct Scheme, what is the NCB limit for Treasury Bills, and for Dated G-Secs, respectively?", "options": [{"id": "A", "text": "10% of notified amount; ₹5 crore per security"}, {"id": "B", "text": "5% of notified amount; ₹2 crore (face value) per security"}, {"id": "C", "text": "5% of notified amount; ₹5 crore per security"}, {"id": "D", "text": "1% of notified amount; ₹2 crore per security"}, {"id": "E", "text": "2% of notified amount; ₹1 crore per security"}], "correct": "B", "explanation": "The NCB limit is 5% of the notified amount for T-Bills, and ₹2 crore (face value) per security for Dated G-Secs."}, {"id": "q109", "scheme": "rbird", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about the RBI Retail Direct Scheme is correct?", "options": [{"id": "A", "text": "The scheme charges an expense ratio similar to Gilt Mutual Funds."}, {"id": "B", "text": "Securities held under the RDG account cannot be used as collateral for loans."}, {"id": "C", "text": "G-Secs purchased via Retail Direct carry no interest rate risk even if sold before maturity."}, {"id": "D", "text": "The minimum lot size for retail investors trading in the 'Odd Lot' segment of NDS-OM is ₹10,000, compared to the standard ₹5 Crore in the institutional segment."}, {"id": "E", "text": "The RBI Retail Direct Mobile App was launched in May 2021, alongside the scheme itself."}], "correct": "D", "explanation": "The scheme charges zero fees, unlike Gilt Mutual Funds' expense ratio; securities CAN be used as collateral for bank loans; G-Secs DO carry interest rate/market risk if sold in the secondary market before maturity; and the Mobile App was launched in May 2024, three years after the scheme's November 2021 launch."}, {"id": "q110", "scheme": "rbird", "type": "figure", "difficulty": "Easy", "context": "", "question": "What is the current (January–June 2026) interest rate on Floating Rate Savings Bonds (FRSBs), available via the RBI Retail Direct platform?", "options": [{"id": "A", "text": "7.50%"}, {"id": "B", "text": "8.20%"}, {"id": "C", "text": "7.05%"}, {"id": "D", "text": "9.00%"}, {"id": "E", "text": "8.05%"}], "correct": "E", "explanation": "The current FRSB rate for Jan-June 2026 is 8.05%, linked to the NSC rate + 0.35%."}, {"id": "q111", "scheme": "sgrb", "type": "numbered", "difficulty": "Hard", "context": "The Sovereign Green Bond (SGrB) Scheme was announced in the Union Budget 2022-23, with its framework released on November 9, 2022, and first issuance in January 2023.\n1. SGrBs are a sub-category of Government Securities (G-Secs) with a 'use of proceeds' restriction for eligible green projects.\n2. SGrBs carry a higher sovereign credit risk than regular G-Secs, since they finance riskier green projects.\n3. The debut issuance in FY2022-23 covered 5-year and 10-year tenors.\n4. SGrBs are considered a completely new asset class, distinct from regular Government Securities.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 3"}, {"id": "B", "text": "Only 2"}, {"id": "C", "text": "2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "C", "explanation": "SGrBs carry the SAME sovereign credit risk as regular G-Secs, not a higher risk. Also, SGrBs are explicitly stated to NOT be a new asset class, but a sub-category of G-Secs."}, {"id": "q112", "scheme": "sgrb", "type": "numbered", "difficulty": "Hard", "context": "Regarding the eligible categories and key exclusions under the Sovereign Green Bond framework:\n1. Large hydropower projects exceeding 25 MW capacity are explicitly excluded from eligible green expenditures.\n2. Small hydropower projects up to 25 MW, with storage integration, fall under the 'Renewable Energy' eligible category.\n3. CNG (Compressed Natural Gas) is fully allowed for both public transportation and private vehicle use subsidies.\n4. Nuclear power generation is excluded from SGrB-eligible green categories.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "3 and 4"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "Only 3"}, {"id": "E", "text": "Only 4"}], "correct": "D", "explanation": "CNG is allowed only for public transportation projects (e.g., CNG buses) as a transitional cleaner fuel; private use subsidies are explicitly excluded from SGrB financing."}, {"id": "q113", "scheme": "sgrb", "type": "scenario", "difficulty": "Hard", "context": "Consider the following public sector projects seeking financing from Sovereign Green Bond proceeds:\n1. A 20 MW small hydropower project with storage integration.\n2. A large hydropower project of 40 MW capacity.\n3. A metro rail project seeking equity investment through a dedicated SPV under Clean Transportation.\n4. A landfill-based waste disposal project.", "question": "Which of the following projects are eligible for SGrB financing (debt or equity, as applicable)?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "1 and 3"}, {"id": "C", "text": "2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1, 3 and 4"}], "correct": "B", "explanation": "The 20 MW small hydropower project (within the 25 MW limit) qualifies under Renewable Energy. Metro rail projects are the ONLY category where equity investment is permitted, via dedicated SPVs. The 40 MW large hydropower project exceeds the 25 MW cap and is explicitly excluded, as are landfill-based waste disposal projects."}, {"id": "q114", "scheme": "sgrb", "type": "list", "difficulty": "Moderate", "context": "", "question": "The SGrB framework identifies 9 eligible green categories for use of proceeds. Which of the following is NOT one of these 9 eligible categories?", "options": [{"id": "A", "text": "Fossil Fuel Transition & Carbon Capture"}, {"id": "B", "text": "Renewable Energy"}, {"id": "C", "text": "Clean Transportation"}, {"id": "D", "text": "Sustainable Water & Waste Management"}, {"id": "E", "text": "Terrestrial & Aquatic Biodiversity Conservation"}], "correct": "A", "explanation": "Fossil fuel projects are explicitly EXCLUDED from SGrB eligibility, not an eligible category. The genuine 9 categories cover renewable energy, energy efficiency, clean transportation, climate change adaptation, sustainable water & waste management, pollution prevention & control, green buildings, sustainable management of living natural resources & land use, and biodiversity conservation."}, {"id": "q115", "scheme": "sgrb", "type": "acronym", "difficulty": "Easy", "context": "", "question": "In the context of Sovereign Green Bonds, what does 'ICMA', whose Green Bond Principles the SGrB framework aligns with, stand for?", "options": [{"id": "A", "text": "Indian Capital Market Authority"}, {"id": "B", "text": "International Climate and Markets Association"}, {"id": "C", "text": "Investment and Capital Market Authority"}, {"id": "D", "text": "International Currency and Monetary Association"}, {"id": "E", "text": "International Capital Market Association"}], "correct": "E", "explanation": "ICMA stands for the International Capital Market Association, whose Green Bond Principles (GBP) 2021 the SGrB framework aligns with."}, {"id": "q116", "scheme": "sgrb", "type": "figure", "difficulty": "Moderate", "context": "", "question": "Within how many months of issuance must SGrB proceeds be fully allocated, and within how many months prior to issuance must eligible green expenditures have been incurred, respectively?", "options": [{"id": "A", "text": "12 months; 24 months"}, {"id": "B", "text": "18 months; 6 months"}, {"id": "C", "text": "24 months; 6 months"}, {"id": "D", "text": "24 months; 12 months"}, {"id": "E", "text": "36 months; 12 months"}], "correct": "D", "explanation": "All SGrB proceeds must be allocated within 24 months of issuance, while eligible expenditures are limited to those incurred within a maximum of 12 months prior to issuance."}, {"id": "q117", "scheme": "sgrb", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about the Sovereign Green Bond scheme is correct?", "options": [{"id": "A", "text": "Equity investment through SGrB proceeds is permitted for all 9 eligible green categories."}, {"id": "B", "text": "SGrB proceeds are managed independently of the Consolidated Fund of India."}, {"id": "C", "text": "From April 1, 2026, domestic investors' interest income from SGrBs is fully tax-exempt."}, {"id": "D", "text": "The CAG has no oversight role over the allocation and utilization of SGrB proceeds."}, {"id": "E", "text": "Under the Fully Accessible Route (FAR), there is no investment ceiling for Foreign Portfolio Investors (FPIs) in SGrBs."}], "correct": "E", "explanation": "Equity investment is permitted ONLY for metro projects under Clean Transportation (via SPVs), not all categories; SGrB proceeds ARE deposited into the Consolidated Fund of India; the full tax exemption from April 1, 2026 applies to FPIs, not domestic investors who remain taxable at slab rates; and the CAG DOES audit allocation and utilization of proceeds, with reports placed before Parliament."}, {"id": "q118", "scheme": "sgrb", "type": "figure", "difficulty": "Easy", "context": "", "question": "What is the 'Greenium' in the context of Sovereign Green Bonds?", "options": [{"id": "A", "text": "A green tax levied on carbon-intensive industries"}, {"id": "B", "text": "The difference between the interest rate (yield) on a normal G-Sec and an SGrB"}, {"id": "C", "text": "The premium paid by FPIs to invest in SGrBs"}, {"id": "D", "text": "An additional 2.5% coupon paid on SGrBs over regular G-Secs"}, {"id": "E", "text": "The discount offered to retail investors purchasing SGrBs online"}], "correct": "B", "explanation": "'Greenium' refers to the difference between the interest rate (yield) on a normal Government Security and a Sovereign Green Bond, attracting dedicated ESG investors."}];
const SCHEMES = [["guide", "MoF – Institutional & Functional Guide"], ["nps", "National Pension System (NPS)"], ["ups", "Unified Pension Scheme (UPS)"], ["apy", "Atal Pension Yojana (APY)"], ["pmvvy", "Pradhan Mantri Vaya Vandana Yojana (PMVVY)"], ["pmjjby", "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)"], ["pmsby", "Pradhan Mantri Suraksha Bima Yojana (PMSBY)"], ["pmjdy", "Pradhan Mantri Jan Dhan Yojana (PMJDY)"], ["pmmy", "Pradhan Mantri Mudra Yojana (PMMY)"], ["sui", "Stand-Up India Scheme (SUI)"], ["psb59", "PSB Loans in 59 Minutes"], ["gms", "Gold Monetisation Scheme (GMS)"], ["sgb", "Sovereign Gold Bond (SGB) Scheme"], ["ssa", "Sukanya Samriddhi Account (SSA)"], ["mssc", "Mahila Samman Savings Certificate (MSSC)"], ["rbird", "RBI Retail Direct Scheme"], ["sgrb", "Sovereign Green Bond (SGrB) Scheme"]];

let state = {
  screen: 'home',
  mode: null,
  order: 'pdf',
  activeQuestions: [],
  activeScheme: null,
  idx: 0,
  answers: {}, // qid -> {status:'correct'|'wrong'|'skip', selected}
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function schemeCount(key){ return QUESTIONS.filter(q=>q.scheme===key).length; }

function isSprintQ(q){
  return (q.type==='numbered' || q.type==='scenario') || (q.type==='figure' && q.difficulty==='Moderate');
}

const app = document.getElementById('app');
function render(){ app.innerHTML=''; 
  if(state.screen==='home') renderHome();
  else if(state.screen==='fullSetup') renderFullSetup();
  else if(state.screen==='sectionGrid') renderSectionGrid();
  else if(state.screen==='quiz') renderQuiz();
  else if(state.screen==='end') renderEnd();
  window.scrollTo({top:0,behavior:'instant'});
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

/* ---------------- HOME ---------------- */
function renderHome(){
  const hero = el('div','hero');
  hero.appendChild(el('div','eyebrow','NABARD GRADE A · ARD / ESI MOCK TEST'));
  hero.appendChild(el('h1','','Ministry of Finance — Scheme Mechanics Practice'));
  hero.appendChild(el('p','','A full-length practice test built entirely from the Ministry of Finance scheme compilation — launch years, nodal ministries, funding patterns, eligibility, targets and named components across '+SCHEMES.length+' schemes/sections.'));
  const stats = el('div','stat-row');
  stats.appendChild(statBlock(QUESTIONS.length,'Total Questions'));
  stats.appendChild(statBlock(SCHEMES.length,'Schemes Covered'));
  stats.appendChild(statBlock(QUESTIONS.filter(isSprintQ).length,'Sprint Questions'));
  hero.appendChild(stats);
  app.appendChild(hero);

  const grid = el('div','mode-grid');

  const c1 = el('button','mode-card');
  c1.appendChild(el('div','tag','Mode 1'));
  c1.appendChild(el('h3','','Full Practice Test'));
  c1.appendChild(el('p','','All '+QUESTIONS.length+' questions across every scheme, choose PDF order or shuffled.'));
  c1.appendChild(el('div','cta','Configure →'));
  c1.onclick = ()=>{ state.screen='fullSetup'; render(); };
  grid.appendChild(c1);

  const c2 = el('button','mode-card');
  c2.appendChild(el('div','tag','Mode 2'));
  c2.appendChild(el('h3','','Section-wise Revision'));
  c2.appendChild(el('p','','Drill one scheme at a time — pick a topic and work through just its question cluster.'));
  c2.appendChild(el('div','cta','Choose a section →'));
  c2.onclick = ()=>{ state.screen='sectionGrid'; render(); };
  grid.appendChild(c2);

  const c3 = el('button','mode-card');
  c3.appendChild(el('div','tag','Mode 3'));
  c3.appendChild(el('h3','','Schemes-Only Sprint'));
  c3.appendChild(el('p','','Just the deeper scheme-mechanics questions — numbered-statement, scenario and figure-pair types. '+QUESTIONS.filter(isSprintQ).length+' questions, no bare-recall filler.'));
  c3.appendChild(el('div','cta','Start sprint →'));
  c3.onclick = ()=>{
    startQuiz(QUESTIONS.filter(isSprintQ), 'sprint', null);
  };
  grid.appendChild(c3);

  app.appendChild(grid);
}
function statBlock(n,label){
  const d = el('div','stat');
  d.appendChild(el('b','',n));
  d.appendChild(el('span','',label));
  return d;
}

/* ---------------- FULL TEST SETUP ---------------- */
function renderFullSetup(){
  app.appendChild(backLink());
  app.appendChild(el('h1','','Full Practice Test'));
  app.appendChild(el('p','muted','All '+QUESTIONS.length+' questions, one scheme after another. Choose the order below.'));

  const box = el('div','setup-box');
  const row = el('div','setup-row');
  const left = el('div','');
  left.appendChild(el('div','label','Question order'));
  left.appendChild(el('div','desc','PDF Order follows the document&#39;s scheme sequence. Shuffled randomizes every question.'));
  row.appendChild(left);
  const tg = el('div','toggle-group');
  const b1 = el('button','', 'PDF Order');
  const b2 = el('button','', 'Shuffled');
  b1.className = state.order==='pdf' ? 'active' : '';
  b2.className = state.order==='shuffled' ? 'active' : '';
  b1.onclick = ()=>{ state.order='pdf'; render(); };
  b2.onclick = ()=>{ state.order='shuffled'; render(); };
  tg.appendChild(b1); tg.appendChild(b2);
  row.appendChild(tg);
  box.appendChild(row);
  app.appendChild(box);

  const btnRow = el('div','btn-row');
  const start = el('button','btn btn-primary','Start Full Test');
  start.onclick = ()=>{
    let qs = QUESTIONS.slice();
    if(state.order==='shuffled') qs = shuffle(qs);
    startQuiz(qs, 'full', null);
  };
  btnRow.appendChild(start);
  app.appendChild(btnRow);
}

/* ---------------- SECTION GRID ---------------- */
function renderSectionGrid(){
  app.appendChild(backLink());
  app.appendChild(el('h1','','Section-wise Revision'));
  app.appendChild(el('p','muted','Tap a scheme to drill just its question cluster, in document order.'));
  const grid = el('div','section-grid');
  SCHEMES.forEach(([key,name])=>{
    const n = schemeCount(key);
    const tile = el('button','section-tile');
    tile.appendChild(el('div','name',name));
    tile.appendChild(el('div','count',n+' Q'));
    tile.onclick = ()=>{
      startQuiz(QUESTIONS.filter(q=>q.scheme===key), 'section', key);
    };
    grid.appendChild(tile);
  });
  app.appendChild(grid);
}

function backLink(){
  const b = el('button','back-link','&larr; Back to menu');
  b.onclick = ()=>{ state.screen='home'; render(); };
  return b;
}

/* ---------------- QUIZ ---------------- */
function startQuiz(qs, mode, schemeKey){
  state.activeQuestions = qs;
  state.mode = mode;
  state.activeScheme = schemeKey;
  state.idx = 0;
  state.answers = {};
  state.screen = 'quiz';
  render();
}

function currentScore(){
  return Object.values(state.answers).filter(a=>a.status==='correct').length;
}

function renderQuiz(){
  const total = state.activeQuestions.length;
  const q = state.activeQuestions[state.idx];
  const answered = Object.keys(state.answers).length;

  const top = el('div','quiz-top');
  const pw = el('div','progress-wrap');
  const bar = el('div','progress-bar');
  const fill = el('div','progress-fill');
  fill.style.width = ((state.idx)/total*100)+'%';
  bar.appendChild(fill);
  pw.appendChild(bar);
  pw.appendChild(el('div','progress-label','Question '+(state.idx+1)+' of '+total));
  top.appendChild(pw);
  top.appendChild(el('div','score-pill','Score: '+currentScore()+' / '+answered));
  app.appendChild(top);

  const tagrow = el('div','q-tagrow');
  const diffTag = el('span','q-tag diff-'+q.difficulty, q.difficulty);
  tagrow.appendChild(diffTag);
  tagrow.appendChild(el('span','q-tag',schemeName(q.scheme)));
  app.appendChild(tagrow);

  if(q.context){
    app.appendChild(el('div','context-box', escapeHtml(q.context)));
  }
  app.appendChild(el('div','q-text', escapeHtml(q.question)));

  const opts = el('div','options');
  const existing = state.answers[q.id];
  q.options.forEach(o=>{
    const b = el('button','option');
    const idSpan = el('span','opt-id', o.id+'.');
    const txt = el('span','', escapeHtml(o.text));
    b.appendChild(idSpan);
    b.appendChild(txt);
    if(existing){
      b.disabled = true;
      if(o.id === q.correct) b.classList.add('correct');
      else if(existing.selected===o.id) b.classList.add('wrong');
      else b.classList.add('dim');
    }
    b.onclick = ()=> selectOption(q, o.id);
    opts.appendChild(b);
  });
  app.appendChild(opts);

  if(existing){
    const fb = el('div','feedback ' + (existing.status==='skip'?'skip':(existing.status==='correct'?'correct':'wrong')));
    let head = existing.status==='skip' ? 'Skipped.' : (existing.status==='correct' ? 'Correct.' : 'Not quite.');
    fb.innerHTML = '<b>'+head+'</b> The correct answer is <b>'+q.correct+'</b>. '+escapeHtml(q.explanation);
    app.appendChild(fb);
  }

  const actions = el('div','quiz-actions');
  const leftActions = el('div','btn-row');
  if(!existing){
    const skip = el('button','btn btn-ghost','Skip');
    skip.onclick = ()=> skipQuestion(q);
    leftActions.appendChild(skip);
  }
  actions.appendChild(leftActions);

  const rightActions = el('div','btn-row');
  const quit = el('button','btn btn-ghost','End & Review');
  quit.onclick = ()=>{ state.screen='end'; render(); };
  rightActions.appendChild(quit);

  if(existing){
    const next = el('button','btn btn-primary', state.idx===total-1 ? 'Finish' : 'Next Question →');
    next.onclick = ()=>{
      if(state.idx===total-1){ state.screen='end'; render(); }
      else { state.idx++; render(); }
    };
    rightActions.appendChild(next);
  }
  actions.appendChild(rightActions);
  app.appendChild(actions);
}

function schemeName(key){
  const found = SCHEMES.find(s=>s[0]===key);
  return found ? found[1] : key;
}

function selectOption(q, optId){
  if(state.answers[q.id]) return;
  const status = optId===q.correct ? 'correct' : 'wrong';
  state.answers[q.id] = {status, selected: optId};
  render();
}
function skipQuestion(q){
  if(state.answers[q.id]) return;
  state.answers[q.id] = {status:'skip', selected:null};
  render();
}

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------------- END SCREEN ---------------- */
function renderEnd(){
  const total = state.activeQuestions.length;
  const answeredList = state.activeQuestions.map(q=>({q, a: state.answers[q.id]}));
  const correctN = answeredList.filter(x=>x.a && x.a.status==='correct').length;
  const wrongN = answeredList.filter(x=>x.a && x.a.status==='wrong').length;
  const skipN = answeredList.filter(x=>!x.a || x.a.status==='skip').length;

  app.appendChild(el('div','eyebrow','RESULTS'));
  const heroWrap = el('div','end-hero');
  const scoreDiv = el('div','end-score', correctN+' <span>/ '+total+'</span>');
  heroWrap.appendChild(scoreDiv);
  heroWrap.appendChild(el('p','muted', wrongN+' incorrect &middot; '+skipN+' skipped'));
  app.appendChild(heroWrap);

  const diffs = ['Easy','Moderate','Hard'];
  const chipRow = el('div','diff-breakdown');
  diffs.forEach(d=>{
    const subset = answeredList.filter(x=>x.q.difficulty===d);
    const c = subset.filter(x=>x.a && x.a.status==='correct').length;
    const chip = el('div','diff-chip');
    chip.appendChild(el('div','n', c+'/'+subset.length));
    chip.appendChild(el('div','l', d));
    chipRow.appendChild(chip);
  });
  app.appendChild(chipRow);

  const btnRow = el('div','btn-row');
  btnRow.style.justifyContent='center';
  const retry = el('button','btn btn-primary','Retry Same Set');
  retry.onclick = ()=>{
    state.idx=0; state.answers={}; state.screen='quiz'; render();
  };
  const menu = el('button','btn btn-ghost','Back to Menu');
  menu.onclick = ()=>{ state.screen='home'; render(); };
  btnRow.appendChild(retry); btnRow.appendChild(menu);
  app.appendChild(btnRow);

  const missed = answeredList.filter(x=>!x.a || x.a.status!=='correct');
  if(missed.length){
    app.appendChild(el('h2','','Review — Missed & Skipped ('+missed.length+')'));
    const list = el('div','review-list');
    missed.forEach(({q,a})=>{
      const item = el('div','review-item');
      item.appendChild(el('div','rmeta', schemeName(q.scheme)+' · '+q.difficulty+' · '+(!a||a.status==='skip'?'Skipped':'Incorrect')));
      if(q.context) item.appendChild(el('div','rline', '<i>'+escapeHtml(q.context).replace(/\n/g,'<br>')+'</i>'));
      item.appendChild(el('div','rq', escapeHtml(q.question)));
      if(a && a.status==='wrong'){
        item.appendChild(el('div','rline','Your answer: <b>'+a.selected+'. '+escapeHtml(optText(q,a.selected))+'</b>'));
      }
      item.appendChild(el('div','rline','Correct answer: <b>'+q.correct+'. '+escapeHtml(optText(q,q.correct))+'</b>'));
      item.appendChild(el('div','rexp', escapeHtml(q.explanation)));
      list.appendChild(item);
    });
    app.appendChild(list);
  }
}
function optText(q, id){
  const o = q.options.find(o=>o.id===id);
  return o ? o.text : '';
}

render();
</script>
</body>
</html>
