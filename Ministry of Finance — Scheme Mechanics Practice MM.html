<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NABARD Grade A — Scheme Mock Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10131a;
  --bg-elev:#181c26;
  --bg-elev2:#1f2430;
  --border:#2b3140;
  --text:#e9e7df;
  --text-dim:#9aa2b1;
  --text-faint:#6b7383;
  --accent:#cda238;
  --accent-soft:#3a3421;
  --accent2:#6f97e0;
  --correct:#3fcf8e;
  --correct-soft:#123125;
  --wrong:#ea6a63;
  --wrong-soft:#361c1b;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#10131a; --bg-elev:#181c26; --bg-elev2:#1f2430; --border:#2b3140; --text:#e9e7df; --text-dim:#9aa2b1;
  }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
#app{max-width:900px;margin:0 auto;padding:28px 20px 60px;min-height:100%;}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0 0 8px;color:var(--text);}
.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.02em;margin-bottom:6px;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}
a{color:var(--accent2);}
button{font-family:var(--sans);cursor:pointer;}

/* ---------- Home ---------- */
.hero{padding:18px 0 30px;border-bottom:1px solid var(--border);margin-bottom:28px;}
.hero h1{font-size:30px;line-height:1.15;}
.hero p{color:var(--text-dim);max-width:56ch;font-size:15px;}
.stat-row{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap;}
.stat{font-family:var(--serif);}
.stat b{display:block;font-size:22px;color:var(--accent);}
.stat span{font-size:12px;color:var(--text-faint);}

.mode-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:640px){.mode-grid{grid-template-columns:1fr 1fr 1fr;}}
.mode-card{
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px;
  text-align:left;
  display:flex;flex-direction:column;gap:8px;
  transition:border-color .15s ease, transform .1s ease;
}
.mode-card:hover{border-color:var(--accent);}
.mode-card:active{transform:scale(.99);}
.mode-card .tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);}
.mode-card h3{font-size:18px;}
.mode-card p{font-size:13.5px;color:var(--text-dim);margin:0;flex:1;}
.mode-card .cta{font-size:13px;color:var(--accent2);margin-top:6px;}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--border);
  background:var(--bg-elev2);
  color:var(--text);
  padding:10px 18px;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#1a1408;}
.btn-primary:hover{opacity:.92;border-color:var(--accent);}
.btn-ghost{background:transparent;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:18px;background:none;border:none;padding:0;}
.back-link:hover{color:var(--accent2);}

/* ---------- Toggle ---------- */
.toggle-group{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.toggle-group button{
  border:none;background:var(--bg-elev);color:var(--text-dim);padding:9px 18px;font-size:13.5px;font-weight:600;
}
.toggle-group button.active{background:var(--accent);color:#1a1408;}

.setup-box{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:22px;margin-top:18px;}
.setup-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.setup-row:last-child{border-bottom:none;}
.setup-row .label{font-weight:600;}
.setup-row .desc{font-size:12.5px;color:var(--text-faint);margin-top:2px;}

/* ---------- Section grid ---------- */
.section-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px;}
@media(min-width:560px){.section-grid{grid-template-columns:1fr 1fr;}}
.section-tile{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px;
}
.section-tile:hover{border-color:var(--accent);}
.section-tile .name{font-size:14.5px;font-weight:600;line-height:1.3;}
.section-tile .count{font-size:12px;color:var(--accent);white-space:nowrap;font-family:var(--serif);}

/* ---------- Quiz ---------- */
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
.progress-wrap{flex:1;min-width:160px;}
.progress-bar{height:6px;background:var(--bg-elev2);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);transition:width .25s ease;}
.progress-label{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
.score-pill{background:var(--bg-elev);border:1px solid var(--border);padding:6px 12px;border-radius:99px;font-size:13px;font-family:var(--serif);color:var(--accent);white-space:nowrap;}

.q-tagrow{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap;}
.q-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);border:1px solid var(--border);padding:3px 9px;border-radius:99px;}
.q-tag.diff-Easy{color:#8fd6a8;border-color:#2c4a37;}
.q-tag.diff-Moderate{color:#d9c273;border-color:#4a4326;}
.q-tag.diff-Hard{color:#e39b93;border-color:#4a2f2c;}

.context-box{
  background:var(--bg-elev);border-left:3px solid var(--accent);border-radius:6px;
  padding:16px 18px;margin:14px 0;font-size:14.5px;color:var(--text-dim);white-space:pre-line;
}
.q-text{font-family:var(--serif);font-size:19px;line-height:1.4;margin:14px 0 18px;color:var(--text);}

.options{display:flex;flex-direction:column;gap:9px;}
.option{
  display:flex;gap:12px;align-items:flex-start;text-align:left;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;
  padding:13px 15px;font-size:14.5px;color:var(--text);width:100%;
}
.option:hover:not(:disabled){border-color:var(--accent2);}
.option .opt-id{font-family:var(--serif);font-weight:700;color:var(--accent);min-width:20px;}
.option:disabled{cursor:default;}
.option.correct{background:var(--correct-soft);border-color:var(--correct);}
.option.correct .opt-id{color:var(--correct);}
.option.wrong{background:var(--wrong-soft);border-color:var(--wrong);}
.option.wrong .opt-id{color:var(--wrong);}
.option.dim{opacity:.5;}

.feedback{margin-top:16px;padding:14px 16px;border-radius:8px;font-size:13.5px;line-height:1.5;}
.feedback.correct{background:var(--correct-soft);border:1px solid var(--correct);color:#c9f2dc;}
.feedback.wrong{background:var(--wrong-soft);border:1px solid var(--wrong);color:#f8d4d1;}
.feedback.skip{background:var(--bg-elev2);border:1px solid var(--border);color:var(--text-dim);}
.feedback b{color:var(--text);}

.quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap;}

/* ---------- End screen ---------- */
.end-hero{text-align:center;padding:24px 0 8px;}
.end-score{font-family:var(--serif);font-size:52px;color:var(--accent);}
.end-score span{font-size:22px;color:var(--text-dim);}
.diff-breakdown{display:flex;gap:12px;justify-content:center;margin:20px 0;flex-wrap:wrap;}
.diff-chip{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:12px 18px;text-align:center;min-width:110px;}
.diff-chip .n{font-family:var(--serif);font-size:20px;}
.diff-chip .l{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}

.review-list{margin-top:26px;display:flex;flex-direction:column;gap:14px;}
.review-item{background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;padding:16px 18px;}
.review-item .rmeta{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.review-item .rq{font-family:var(--serif);font-size:15.5px;margin-bottom:8px;}
.review-item .rline{font-size:13px;margin:3px 0;}
.review-item .rline b{color:var(--text);}
.review-item .rexp{font-size:13px;color:var(--text-dim);margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}

::selection{background:var(--accent-soft);}
</style>
</head>
<body>
<div id="app"></div>
<script>
const QUESTIONS = [{"id": "q1", "scheme": "guide", "type": "numbered", "difficulty": "Moderate", "context": "The Ministry of Finance (MoF) is the apex body managing India's economy through six departments.\n1. The Department of Economic Affairs (DEA) prepares the Union Budget and Economic Survey.\n2. The Department of Revenue administers direct taxes through the Central Board of Indirect Taxes and Customs.\n3. DIPAM is responsible for disinvestment and strategic sale of CPSEs.\n4. The Department of Public Enterprises (DPE) sets Maharatna, Navratna and Miniratna criteria.", "question": "Which of the statements given above is/are correct?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1, 3 and 4"}, {"id": "E", "text": "None of the above"}], "correct": "D", "explanation": "Direct taxes are administered via CBDT; the Central Board of Indirect Taxes and Customs (CBIC) handles indirect taxes (GST, Customs, Central Excise), not direct taxes. Statements 1, 3 and 4 are accurate."}, {"id": "q2", "scheme": "guide", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT one of the six departments under the Ministry of Finance?", "options": [{"id": "A", "text": "Department of Economic Affairs"}, {"id": "B", "text": "Department of Expenditure"}, {"id": "C", "text": "Department of Public Debt Management"}, {"id": "D", "text": "Department of Investment and Public Asset Management (DIPAM)"}, {"id": "E", "text": "Department of Public Enterprises"}], "correct": "C", "explanation": "The six departments are DEA, Department of Expenditure, Department of Revenue, Department of Financial Services (DFS), DIPAM, and DPE. There is no separate 'Department of Public Debt Management'; debt-related functions fall under DEA."}, {"id": "q3", "scheme": "guide", "type": "acronym", "difficulty": "Easy", "context": "", "question": "What does 'DIPAM', a department under the Ministry of Finance, stand for?", "options": [{"id": "A", "text": "Department of Industrial Policy and Asset Management"}, {"id": "B", "text": "Department of Investment and Public Administration Management"}, {"id": "C", "text": "Department of Investment and Public Asset Management"}, {"id": "D", "text": "Directorate of Investment and Public Asset Monetisation"}, {"id": "E", "text": "Department of Investment Promotion and Asset Management"}], "correct": "C", "explanation": "DIPAM stands for Department of Investment and Public Asset Management, responsible for disinvestment, strategic sale of CPSEs, and asset monetisation (National Monetisation Pipeline)."}, {"id": "q4", "scheme": "guide", "type": "figure", "difficulty": "Moderate", "context": "", "question": "Under which Article of the Constitution is the Finance Commission appointed every five years, and which Article mandates the presentation of the Annual Financial Statement (Union Budget) before Parliament, respectively?", "options": [{"id": "A", "text": "Article 280; Article 112"}, {"id": "B", "text": "Article 112; Article 280"}, {"id": "C", "text": "Article 266; Article 267"}, {"id": "D", "text": "Article 280; Article 266"}, {"id": "E", "text": "Article 267; Article 112"}], "correct": "A", "explanation": "Article 280 provides for the appointment of the Finance Commission every five years, while Article 112 mandates presentation of the Annual Financial Statement (Union Budget) before Parliament."}, {"id": "q5", "scheme": "guide", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements regarding the Ministry of Finance is correct?", "options": [{"id": "A", "text": "The Chief Economic Adviser (CEA) is the primary author of the Union Budget."}, {"id": "B", "text": "The Department of Revenue administers direct taxes via the CBDT and indirect taxes via the CBIC."}, {"id": "C", "text": "SEBI regulates India's insurance sector."}, {"id": "D", "text": "NABARD is a subsidiary of SIDBI."}, {"id": "E", "text": "Article 267 governs the Consolidated Fund of India."}], "correct": "B", "explanation": "The CEA is the primary author of the Economic Survey, not the Budget; SEBI regulates capital markets (IRDAI regulates insurance); NABARD is fully government-owned and is not a SIDBI subsidiary (MUDRA is); Article 266 (not 267) governs the Consolidated Fund of India, while Article 267 governs the Contingency Fund."}, {"id": "q6", "scheme": "guide", "type": "numbered", "difficulty": "Easy", "context": "Regarding the key officials and regulatory bodies of the Ministry of Finance:\n1. PFRDA regulates the pension sector.\n2. IBBI is the regulator for capital markets.\n3. The Finance Secretary is traditionally the Expenditure Secretary.\n4. IFSCA regulates International Financial Services Centres such as GIFT City.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "1, 3 and 4"}, {"id": "C", "text": "2, 3 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 4 only"}], "correct": "B", "explanation": "IBBI is the regulator for insolvency and bankruptcy matters, not capital markets — that is SEBI's mandate. Statements 1, 3 and 4 are correct."}, {"id": "q7", "scheme": "nps", "type": "numbered", "difficulty": "Hard", "context": "The National Pension System (NPS) has undergone major reforms through PFRDA amendments in 2025.\n1. NPS was launched on January 1, 2004 for Central Government employees, excluding the Armed Forces.\n2. NPS was extended to all citizens, including NRIs, with effect from May 1, 2009.\n3. As per the 2025 amendment, the mandatory vesting period of 3 years for Normal Exit has been increased to 5 years.\n4. Subscribers can now pledge their NPS account as collateral for a loan up to 25% of the subscriber's own contributions.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1 and 3"}, {"id": "B", "text": "2, 3 and 4"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1 and 2 only"}, {"id": "E", "text": "1, 2 and 4"}], "correct": "E", "explanation": "The 2025 PFRDA amendment REMOVED the 3-year vesting period for Normal Exit entirely; it was not increased to 5 years. Statements 1, 2 and 4 are accurate."}, {"id": "q8", "scheme": "nps", "type": "numbered", "difficulty": "Hard", "context": "Recently, in December 2025, PFRDA revised the partial withdrawal rules under NPS.\n1. Before age 60, the number of permitted partial withdrawals has been increased from 3 to 4 times.\n2. A mandatory 4-year gap is now required between two partial withdrawals before age 60.\n3. After age 60, partial withdrawals are allowed with a mandatory 5-year gap.\n4. Skill development and re-skilling have been added as a new eligible purpose for partial withdrawal.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "Only 3"}, {"id": "C", "text": "Only 4"}, {"id": "D", "text": "3 and 4"}, {"id": "E", "text": "All of the above"}], "correct": "D", "explanation": "After age 60, the mandatory gap between partial withdrawals is 3 years, not 5. Also, skill development/re-skilling and establishing a startup were REMOVED as eligible purposes for partial withdrawal in the 2025 revision, not added."}, {"id": "q9", "scheme": "nps", "type": "scenario", "difficulty": "Hard", "context": "Consider the following individuals seeking to open an NPS account under the All Citizen Model:\n1. Meena, a Hindu Undivided Family (HUF), wishing to open an account in the HUF's name.\n2. Rakesh, a 70-year-old self-employed Indian citizen.\n3. Vikram, a Person of Indian Origin (PIO) residing abroad.\n4. Sunita, an Overseas Citizen of India (OCI) card holder.", "question": "Who among the following are eligible to open an NPS account?", "options": [{"id": "A", "text": "2 and 4"}, {"id": "B", "text": "1 and 2"}, {"id": "C", "text": "1, 3 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "2, 3 and 4"}], "correct": "A", "explanation": "HUFs and PIOs (Persons of Indian Origin) are explicitly excluded from NPS. Rakesh (self-employed, well under the 85-year maximum entry age) and Sunita (an OCI card holder, eligible since NPS was extended to NRIs and OCIs) can open accounts."}, {"id": "q10", "scheme": "nps", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT an asset class available under NPS's Active Choice investment option?", "options": [{"id": "A", "text": "E – Equity"}, {"id": "B", "text": "C – Corporate Debt"}, {"id": "C", "text": "D – Derivatives Fund"}, {"id": "D", "text": "G – Government Securities"}, {"id": "E", "text": "A – Alternative Assets"}], "correct": "C", "explanation": "NPS's Active Choice offers E (Equity), C (Corporate Debt), G (Government Securities), and A (Alternative Assets, now discontinued and merged with E and C). There is no 'Derivatives Fund' asset class."}, {"id": "q11", "scheme": "nps", "type": "acronym", "difficulty": "Easy", "context": "", "question": "In the context of NPS, what does 'PRAN' stand for?", "options": [{"id": "A", "text": "Permanent Retirement Account Number"}, {"id": "B", "text": "Personal Retirement Allocation Number"}, {"id": "C", "text": "Permanent Retirement Allotment Number"}, {"id": "D", "text": "Pension Regulatory Account Number"}, {"id": "E", "text": "Permanent Retirement Assurance Number"}], "correct": "A", "explanation": "PRAN (Permanent Retirement Account Number) is a unique 12-digit number allotted to every NPS subscriber for lifetime identification and account tracking."}, {"id": "q12", "scheme": "nps", "type": "acronym", "difficulty": "Easy", "context": "", "question": "What does 'CRA', the entity type that includes Protean, KFintech and CAMS under NPS, stand for?", "options": [{"id": "A", "text": "Central Registration Authority"}, {"id": "B", "text": "Corporate Recordkeeping Agency"}, {"id": "C", "text": "Central Retirement Account Agency"}, {"id": "D", "text": "Central Recordkeeping Agency"}, {"id": "E", "text": "Central Regulatory Authority"}], "correct": "D", "explanation": "CRA (Central Recordkeeping Agency) entities maintain records, process transactions, and provide account-related services for NPS subscribers."}, {"id": "q13", "scheme": "nps", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about NPS Vatsalya is correct?", "options": [{"id": "A", "text": "NPS Vatsalya was launched in 2022 for minors below 18 years."}, {"id": "B", "text": "The minimum annual contribution under NPS Vatsalya is ₹500."}, {"id": "C", "text": "Post-conversion, up to 50% of own contributions can be withdrawn for specified purposes."}, {"id": "D", "text": "NPS Vatsalya accounts are managed independently by the minor beneficiary."}, {"id": "E", "text": "On turning 18, the account is mandatorily converted to NPS Tier I under the All Citizen Model."}], "correct": "E", "explanation": "NPS Vatsalya was launched in 2024 (not 2022); the minimum annual contribution is ₹250 (not ₹500); post-conversion partial withdrawal is capped at 25% (not 50%) of own contributions; and accounts are managed by parents/guardians until the child turns 18."}, {"id": "q14", "scheme": "nps", "type": "figure", "difficulty": "Moderate", "context": "", "question": "Under the Corpus Withdrawal Options for Normal Exit, what are the applicable rules for a corpus of ₹8 Lakh–₹12 Lakh under the Government Sector, respectively for the lump sum and annuity components?", "options": [{"id": "A", "text": "Up to ₹6L lumpsum + SUR, OR up to 80% lumpsum + 20% annuity"}, {"id": "B", "text": "Up to ₹6L lumpsum + SUR (min 6 yrs) or annuity, OR up to 60% lumpsum + 40% annuity"}, {"id": "C", "text": "100% lumpsum only"}, {"id": "D", "text": "Up to 50% lumpsum + 50% annuity"}, {"id": "E", "text": "Up to 40% lumpsum + 60% annuity"}], "correct": "B", "explanation": "For the Government Sector Normal Exit with corpus ₹8L–₹12L, subscribers can opt for up to ₹6L lumpsum + SUR (min 6 years) or annuity, OR up to 60% lumpsum + 40% annuity — a higher annuity share than the Non-Govt sector's 20%."}, {"id": "q15", "scheme": "nps", "type": "figure", "difficulty": "Easy", "context": "", "question": "What is the minimum initial contribution required to open an NPS Tier I account?", "options": [{"id": "A", "text": "₹250"}, {"id": "B", "text": "₹1,000"}, {"id": "C", "text": "₹500"}, {"id": "D", "text": "₹2,000"}, {"id": "E", "text": "₹100"}], "correct": "C", "explanation": "The minimum initial contribution for NPS Tier I is ₹500, with a minimum of ₹1,000 required per year thereafter."}, {"id": "q16", "scheme": "nps", "type": "numbered", "difficulty": "Hard", "context": "Regarding tax benefits available under NPS Tier I:\n1. Section 80CCD(1) provides deduction up to 10% of Salary (Basic+DA) within the overall ₹1.5 Lakh limit of 80C.\n2. Section 80CCD(1B) provides an additional deduction of ₹50,000, available only under the New Tax Regime.\n3. Section 80CCD(2), covering employer's contribution, is available under both the Old and New Tax Regimes.\n4. Even after the 2025 amendment, only 60% of the corpus remains tax-free under Section 10(12A) on exit.", "question": "Which of the statements given above is/are correct?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "1, 3 and 4"}, {"id": "C", "text": "2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "B", "explanation": "Section 80CCD(1B), offering an additional deduction of ₹50,000 for NPS Tier I, is available only under the Old Tax Regime, not the New Tax Regime. Statements 1, 3 and 4 are correct."}, {"id": "q17", "scheme": "nps", "type": "scenario", "difficulty": "Hard", "context": "Consider the following Central/State Government employees regarding eligibility for the Unified Pension Scheme (UPS):\n1. Anil, who joined Central Government service in 2010 and is an existing NPS subscriber.\n2. Priya, who is joining Central Government service for the first time in June 2025.\n3. Rajesh, a State Government employee whose state has not adopted the UPS architecture.\n4. Kavita, who retired under NPS in 2015 with 12 years of qualifying service.", "question": "Who among the following are eligible for UPS benefits/options?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "2, 3 and 4"}, {"id": "C", "text": "1, 2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 2 only"}], "correct": "C", "explanation": "Anil (an existing Central Govt NPS subscriber) has a one-time option to switch to UPS. Priya (a new recruit after April 1, 2025) can choose between NPS and UPS. Kavita, having retired with more than the minimum 10 years of qualifying service, is retrospectively eligible for UPS benefits. Rajesh is not eligible since his state has not adopted the UPS architecture."}, {"id": "q18", "scheme": "nps", "type": "figure", "difficulty": "Moderate", "context": "", "question": "Under the Unified Pension Scheme (UPS), what are the employee and total government contribution rates (as % of Basic Pay + DA), respectively?", "options": [{"id": "A", "text": "10%; 14%"}, {"id": "B", "text": "14%; 18.5%"}, {"id": "C", "text": "10%; 18.5%"}, {"id": "D", "text": "10%; 10%"}, {"id": "E", "text": "8.5%; 18.5%"}], "correct": "C", "explanation": "Under UPS, employees contribute 10% of Basic Pay + DA, while the government contributes a total of 18.5% (10% matching contribution + 8.5% to the Pooled Corpus Fund)."}, {"id": "q19", "scheme": "nps", "type": "numbered", "difficulty": "Hard", "context": "The Unified Pension Scheme (UPS), effective April 1, 2025, rests on 'Five Pillars' of guarantees.\n1. Guaranteed Pension of 50% of average basic pay of the last 12 months requires a minimum of 25 years of service.\n2. Guaranteed Family Pension is 60% of the employee's last drawn pension, payable to the legally wedded spouse only.\n3. The Guaranteed Minimum Pension is ₹15,000 per month after a minimum of 10 years of qualifying service.\n4. Dearness Relief (DR) under UPS is linked to the AICPI-IW index.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 3 and 4"}, {"id": "B", "text": "1, 2 and 4"}, {"id": "C", "text": "2 and 3"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 4 only"}], "correct": "B", "explanation": "The Guaranteed Minimum Pension under UPS is ₹10,000 per month (not ₹15,000) after a minimum of 10 years of qualifying service. Statements 1, 2 and 4 are correct."}, {"id": "q20", "scheme": "ups", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements correctly distinguishes the Unified Pension Scheme (UPS) from the New Pension Scheme (NPS)?", "options": [{"id": "A", "text": "Under UPS, the government's total contribution is 14% of Basic Pay+DA, same as NPS."}, {"id": "B", "text": "UPS is a Defined Contribution scheme, whereas NPS is a Defined Benefit scheme."}, {"id": "C", "text": "UPS offers inflation protection through Dearness Relief (DR), while NPS offers no inflation protection."}, {"id": "D", "text": "The employee contribution under UPS is 14%, higher than the 10% under NPS."}, {"id": "E", "text": "UPS has a low fiscal impact compared to NPS's moderate impact."}], "correct": "C", "explanation": "Government contribution under UPS is 18.5% (not 14%, same as NPS); UPS is a 'Guaranteed (Funded)' scheme while NPS is Defined Contribution (the labels are reversed in the distractor); employee contribution under both is 10%; and UPS actually has a MODERATE fiscal impact compared to NPS's LOW impact."}, {"id": "q21", "scheme": "ups", "type": "figure", "difficulty": "Moderate", "context": "", "question": "As per the OPS vs NPS vs UPS comparison, what is the guaranteed pension amount under UPS, and how does it compare with OPS?", "options": [{"id": "A", "text": "60% under UPS vs 50% under OPS"}, {"id": "B", "text": "50% of last 12-month average pay under UPS, same as 50% of last pay under OPS"}, {"id": "C", "text": "40% under UPS vs 50% under OPS"}, {"id": "D", "text": "Market-linked under both"}, {"id": "E", "text": "50% under UPS vs 60% under OPS"}], "correct": "B", "explanation": "Both OPS and UPS guarantee a pension of 50% — OPS based on last pay, UPS based on the last 12-month average pay."}, {"id": "q22", "scheme": "ups", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT one of the 'Five Pillars' of guarantee under the Unified Pension Scheme (UPS)?", "options": [{"id": "A", "text": "Guaranteed Pension"}, {"id": "B", "text": "Guaranteed Family Pension"}, {"id": "C", "text": "Guaranteed Employer Matching Bonus"}, {"id": "D", "text": "Guaranteed Minimum Pension"}, {"id": "E", "text": "Inflation Indexation (DR)"}], "correct": "C", "explanation": "The Five Pillars of UPS are: Guaranteed Pension, Guaranteed Family Pension, Guaranteed Minimum Pension, Inflation Indexation (DR), and Lump Sum Payment (Gratuity Alternative). There is no 'Guaranteed Employer Matching Bonus' pillar."}, {"id": "q23", "scheme": "ups", "type": "numbered", "difficulty": "Moderate", "context": "Regarding eligibility and portability of UPS:\n1. Existing NPS subscribers among Central Government employees have a one-time option to switch to UPS.\n2. New recruits joining after April 1, 2025 can choose between NPS and UPS at the time of joining.\n3. State Governments are mandatorily required to adopt the UPS architecture for their employees.\n4. Employees who retired under NPS since 2004 with minimum 10 years of qualifying service are also eligible for UPS benefits.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1 and 3"}, {"id": "B", "text": "1, 2 and 4"}, {"id": "C", "text": "2, 3 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "3 and 4 only"}], "correct": "B", "explanation": "States have only the OPTION to adopt the UPS architecture for their employees — it is not mandatory. Statements 1, 2 and 4 are correct."}, {"id": "q24", "scheme": "apy", "type": "numbered", "difficulty": "Hard", "context": "Atal Pension Yojana (APY) was launched on May 9, 2015. Recently, in January 2026, the Union Cabinet approved continuation of APY support till 2030-31.\n1. The minimum age of joining APY is 18 years and the maximum is 40 years.\n2. From October 1, 2022, any citizen who is or has been an income tax payer is not eligible to join APY.\n3. Existing subscribers who joined on or before September 30, 2022 must exit the scheme regardless of their tax status.\n4. APY is administered through the NPS architecture and regulated by PFRDA.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 3 and 4"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "1, 2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 2 only"}], "correct": "C", "explanation": "Subscribers who joined APY on or before September 30, 2022 MAY CONTINUE regardless of their tax status — they are not required to exit. Statements 1, 2 and 4 are correct."}, {"id": "q25", "scheme": "apy", "type": "numbered", "difficulty": "Hard", "context": "Regarding the funding and government co-contribution under APY:\n1. The Government co-contribution was 50% of the subscriber's annual contribution or ₹1,000 per annum, whichever is lower.\n2. This co-contribution was available for a period of 5 years.\n3. It was applicable only to subscribers who joined between June 1, 2015 and March 31, 2016.\n4. New subscribers joining APY today continue to receive the central government co-contribution.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "3 and 4"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "Only 3"}, {"id": "E", "text": "Only 4"}], "correct": "E", "explanation": "The current status of APY is that new subscribers do NOT receive the central government co-contribution; this benefit was only available for subscribers who joined between June 1, 2015 and March 31, 2016."}, {"id": "q26", "scheme": "apy", "type": "scenario", "difficulty": "Hard", "context": "Consider the following individuals seeking to join Atal Pension Yojana:\n1. Suresh, aged 35, an unorganized sector worker who has never paid income tax.\n2. Anita, aged 45, wishing to join for the first time.\n3. Farhan, aged 22, who paid income tax three years ago but has a valid Aadhaar-linked bank account.\n4. Geeta, aged 19, a first-time bank account holder with no income tax history.", "question": "Who among the following are eligible to join APY (as a new subscriber today)?", "options": [{"id": "A", "text": "1 and 4"}, {"id": "B", "text": "1, 2 and 4"}, {"id": "C", "text": "2 and 3"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1, 3 and 4"}], "correct": "A", "explanation": "Suresh (35, no tax history) and Geeta (19, no tax history) meet the 18-40 age and non-taxpayer criteria. Anita (45) exceeds the maximum entry age of 40. Farhan, having been an income tax payer even in the past, is excluded under the 'is or has been' restriction from October 1, 2022."}, {"id": "q27", "scheme": "apy", "type": "list", "difficulty": "Moderate", "context": "", "question": "APY offers three layers of guarantee/protection to its subscribers. Which of the following is NOT one of these three guarantees?", "options": [{"id": "A", "text": "Guaranteed Minimum Pension (fixed monthly pension based on contribution)"}, {"id": "B", "text": "Spouse Pension (same amount continues to spouse after subscriber's death)"}, {"id": "C", "text": "Guaranteed Employer Matching Contribution for Life"}, {"id": "D", "text": "Return of Corpus to Nominee (after death of both subscriber and spouse)"}, {"id": "E", "text": "None of the above; all three are genuine guarantees"}], "correct": "C", "explanation": "APY's 'three guarantees' are the Guaranteed Minimum Pension, Spouse Pension, and Return of Corpus. There is no employer involved in APY at all — it targets unorganized sector workers — so 'Guaranteed Employer Matching Contribution' is fabricated."}, {"id": "q28", "scheme": "apy", "type": "figure", "difficulty": "Moderate", "context": "", "question": "As per the APY contribution chart, what is the monthly contribution required for an 18-year-old to receive a pension of ₹5,000, and for a 40-year-old to receive the same ₹5,000 pension, respectively?", "options": [{"id": "A", "text": "₹210; ₹1,000"}, {"id": "B", "text": "₹376; ₹1,454"}, {"id": "C", "text": "₹210; ₹577"}, {"id": "D", "text": "₹210; ₹1,454"}, {"id": "E", "text": "₹42; ₹291"}], "correct": "D", "explanation": "For a ₹5,000 pension, an 18-year-old contributes ₹210/month while a 40-year-old (joining at the maximum age) must contribute ₹1,454/month due to the shorter accumulation period."}, {"id": "q29", "scheme": "apy", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about APY is correct?", "options": [{"id": "A", "text": "The minimum contribution period under APY is 20 years, based on entry at 18 years and exit at 40 is not applicable — entry at 18 gives a 42-year period, but the minimum period arises from entry at the maximum age of 40 till 60."}, {"id": "B", "text": "APY subscribers can voluntarily exit at any time before 60 without any restriction."}, {"id": "C", "text": "The government co-contribution under APY continues for all subscribers indefinitely."}, {"id": "D", "text": "APY guarantees a fixed monthly pension of ₹1,000 to ₹10,000, depending on contribution."}, {"id": "E", "text": "Any income tax payer, past or present, is fully eligible to join APY."}], "correct": "A", "explanation": "Since the maximum entry age is 40 and pension begins at 60, the minimum contribution period is 20 years. Voluntary exit before 60 is allowed only in exceptional circumstances; co-contribution was time-bound and has ended for new subscribers; the guaranteed pension range is ₹1,000–₹5,000, not up to ₹10,000; and income tax payers (past or present) are excluded since October 2022."}, {"id": "q30", "scheme": "apy", "type": "figure", "difficulty": "Easy", "context": "", "question": "What is the minimum age for exit and 100% annuitization of the monthly pension under APY?", "options": [{"id": "A", "text": "58 years"}, {"id": "B", "text": "65 years"}, {"id": "C", "text": "60 years"}, {"id": "D", "text": "50 years"}, {"id": "E", "text": "70 years"}], "correct": "C", "explanation": "On attaining 60 years, the subscriber's contributions are 100% annuitized to provide the guaranteed monthly pension."}, {"id": "q31", "scheme": "pmvvy", "type": "numbered", "difficulty": "Moderate", "context": "Pradhan Mantri Vaya Vandana Yojana (PMVVY) was closed for new subscriptions from April 1, 2023, though existing accounts continue for their full tenure.\n1. PMVVY is implemented exclusively through the Life Insurance Corporation (LIC) of India.\n2. The minimum entry age is 55 years, with no maximum age limit.\n3. The policy tenure is 10 years.\n4. The maximum investment permitted is ₹15 Lakh per senior citizen.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "1, 3 and 4"}, {"id": "C", "text": "2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 3 only"}], "correct": "B", "explanation": "The minimum entry age for PMVVY is 60 years (completed), not 55. Statements 1, 3 and 4 are correct."}, {"id": "q32", "scheme": "pmvvy", "type": "numbered", "difficulty": "Moderate", "context": "Regarding the interest rate mechanism and surrender rules of PMVVY:\n1. PMVVY was initially launched with a fixed 8% guaranteed return.\n2. From 2020 onwards, the interest rate is reset annually in line with the Senior Citizens Savings Scheme.\n3. If LIC generates a lower return than the guaranteed rate, LIC alone absorbs the entire loss.\n4. Surrender before maturity is allowed only under exceptional circumstances such as critical illness of self or spouse.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "Only 3"}, {"id": "B", "text": "1 and 2"}, {"id": "C", "text": "3 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "A", "explanation": "If LIC generates a lower return than the guaranteed rate, the Government of India compensates LIC via a subsidy — LIC does not alone absorb the shortfall."}, {"id": "q33", "scheme": "pmvvy", "type": "scenario", "difficulty": "Hard", "context": "Consider the following individuals applying for PMVVY before the scheme's subscription closure:\n1. Mr. Verma, aged 62, an Indian citizen.\n2. Mrs. Rao, aged 58, an Indian citizen.\n3. Mr. Lee, aged 65, a Non-Resident Indian (NRI) settled abroad.\n4. Mrs. D'Souza, aged 70, an Indian citizen.", "question": "Who among the following were eligible to subscribe to PMVVY (before subscription closure)?", "options": [{"id": "A", "text": "1, 2 and 4"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1 and 4"}, {"id": "E", "text": "3 and 4"}], "correct": "D", "explanation": "Mr. Verma (62) and Mrs. D'Souza (70) meet the minimum age of 60 with no upper limit, and PMVVY is available only to resident Indian citizens. Mrs. Rao (58) is below the minimum entry age. Mr. Lee, being an NRI, is not eligible."}, {"id": "q34", "scheme": "pmvvy", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT a correct feature of PMVVY?", "options": [{"id": "A", "text": "Tenure of 10 years"}, {"id": "B", "text": "Eligible for tax deduction under Section 80C"}, {"id": "C", "text": "Maximum investment limit of ₹15 Lakh"}, {"id": "D", "text": "Loan facility available after 3 policy years"}, {"id": "E", "text": "Implemented exclusively by LIC"}], "correct": "B", "explanation": "Unlike NPS or SCSS, investment in PMVVY does NOT qualify for a Section 80C deduction."}, {"id": "q35", "scheme": "pmvvy", "type": "figure", "difficulty": "Moderate", "context": "", "question": "What is the minimum investment required under PMVVY for a pension of ₹12,000 per annum (annual mode), and for a pension of ₹1,000 per month (monthly mode), respectively?", "options": [{"id": "A", "text": "₹1,62,162; ₹1,56,658"}, {"id": "B", "text": "₹1,50,000; ₹1,60,000"}, {"id": "C", "text": "₹1,56,658; ₹1,50,000"}, {"id": "D", "text": "₹1,45,000; ₹1,62,162"}, {"id": "E", "text": "₹1,56,658; ₹1,62,162"}], "correct": "E", "explanation": "The minimum investment is ₹1,56,658 for an annual pension of ₹12,000, and ₹1,62,162 for a monthly pension of ₹1,000 — the monthly mode requires a higher investment due to more frequent payouts."}, {"id": "q36", "scheme": "pmvvy", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements correctly compares PMVVY with the Senior Citizens Savings Scheme (SCSS)?", "options": [{"id": "A", "text": "SCSS is implemented exclusively by LIC, while PMVVY is offered by banks and post offices."}, {"id": "B", "text": "The maximum investment limit under PMVVY (₹30 Lakh) exceeds that of SCSS (₹15 Lakh)."}, {"id": "C", "text": "PMVVY offers a Section 80C tax deduction, unlike SCSS."}, {"id": "D", "text": "SCSS does not offer a loan facility, and neither does PMVVY."}, {"id": "E", "text": "PMVVY has a longer tenure (10 years) than SCSS (5 years, extendable by 3)."}], "correct": "E", "explanation": "PMVVY (LIC only) has a 10-year tenure vs SCSS's 5 years (extendable by 3); the agencies are reversed in option B; PMVVY's max limit is ₹15 Lakh vs SCSS's ₹30 Lakh (reversed in option C); PMVVY does NOT get 80C benefit (SCSS does); and PMVVY DOES offer a loan facility after 3 policy years."}, {"id": "q37", "scheme": "pmjjby", "type": "numbered", "difficulty": "Hard", "context": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY) is a one-year life insurance scheme renewable annually, administered by LIC and other insurers.\n1. The eligible age bracket for joining PMJJBY is 18 to 50 years.\n2. The annual premium was revised from ₹330 to ₹436, effective June 1, 2022.\n3. The life cover amount is ₹1 Lakh, payable only in case of accidental death.\n4. The policy/coverage period runs from June 1 to May 31 every year.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 3 and 4"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "1, 2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 2 only"}], "correct": "C", "explanation": "The life cover under PMJJBY is ₹2 Lakh (not ₹1 Lakh), payable for death due to ANY cause (natural, accidental, suicide, etc.), not just accidental death. Statements 1, 2 and 4 are correct."}, {"id": "q38", "scheme": "pmjjby", "type": "numbered", "difficulty": "Hard", "context": "Regarding the 'Lien Period' rule under PMJJBY:\n1. The lien period is a 30-day waiting period from the date of enrollment during which the insurer is not liable for claims arising from natural causes.\n2. If the subscriber dies within the first 30 days due to an accident, the claim is NOT payable.\n3. The 30-day lien clause also applies to subscribers who exit and re-join the scheme.\n4. If death occurs due to natural causes after the 30-day lien period, the claim is payable.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 3"}, {"id": "B", "text": "Only 2"}, {"id": "C", "text": "2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "B", "explanation": "If death occurs due to an ACCIDENT within the first 30 days (the lien period), the claim IS paid in full. It is only natural-cause deaths within the lien period that are excluded."}, {"id": "q39", "scheme": "pmjjby", "type": "scenario", "difficulty": "Hard", "context": "Consider the following individuals seeking to enroll in PMJJBY:\n1. Ramesh, aged 48, with a savings account and auto-debit consent.\n2. Kavya, aged 55, wanting to join for the first time.\n3. Zoya, an NRI aged 40 with an Indian savings account.\n4. Tarun, aged 17, with a guardian-operated savings account.", "question": "Who among the following are eligible to newly enroll in PMJJBY?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "2 and 4"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1 and 3"}, {"id": "E", "text": "1, 3 and 4"}], "correct": "D", "explanation": "Ramesh (48) and Zoya (an NRI with an Indian savings account, eligible per the scheme rules) fall within the 18-50 entry bracket. Kavya (55) exceeds the maximum entry age of 50. Tarun (17) is below the minimum entry age of 18."}, {"id": "q40", "scheme": "pmjjby", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT a correct statement about termination of cover under PMJJBY?", "options": [{"id": "A", "text": "Cover automatically terminates at age 60 regardless of continued premium payment"}, {"id": "B", "text": "Entry is not allowed beyond 50 years (age nearer birthday)"}, {"id": "C", "text": "Coverage can be renewed annually up to age 55"}, {"id": "D", "text": "Closure of the bank account terminates the cover"}, {"id": "E", "text": "If covered through multiple accounts, total cover is restricted to ₹2 Lakh"}], "correct": "A", "explanation": "Coverage under PMJJBY can be renewed annually only up to age 55 (nearest birthday), not 60 — beyond entry cut-off, renewal itself is capped at 55, making the 'age 60' termination claim fabricated."}, {"id": "q41", "scheme": "pmjjby", "type": "figure", "difficulty": "Moderate", "context": "", "question": "Under the pro-rata premium structure for late joiners of PMJJBY, what is the premium payable for a subscriber joining in the September–November window, and for one joining in December–February, respectively?", "options": [{"id": "A", "text": "₹436; ₹342"}, {"id": "B", "text": "₹228; ₹114"}, {"id": "C", "text": "₹342; ₹114"}, {"id": "D", "text": "₹436; ₹228"}, {"id": "E", "text": "₹342; ₹228"}], "correct": "E", "explanation": "The pro-rata premium is ₹342 for September–November joiners and ₹228 for December–February joiners, reducing further each quarter of the policy year."}, {"id": "q42", "scheme": "pmjjby", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about PMJJBY is correct?", "options": [{"id": "A", "text": "The scheme has no lien period, unlike PMSBY."}, {"id": "B", "text": "Coverage under PMJJBY can be renewed annually up to age 65."}, {"id": "C", "text": "PMJJBY covers death due to any cause, including suicide."}, {"id": "D", "text": "NRIs are not eligible to enroll in PMJJBY."}, {"id": "E", "text": "The annual premium is deducted from the bank account between April 25 and April 30."}], "correct": "C", "explanation": "PMJJBY covers death due to any cause. The lien-period comparison is reversed (PMJJBY has a 30-day lien, PMSBY has none); renewal is capped at age 55, not 65; NRIs with Indian savings accounts ARE eligible; and the auto-debit window is May 25–31, not April."}, {"id": "q43", "scheme": "pmjjby", "type": "figure", "difficulty": "Easy", "context": "", "question": "What was the annual premium for PMJJBY before it was revised effective June 1, 2022?", "options": [{"id": "A", "text": "₹330"}, {"id": "B", "text": "₹300"}, {"id": "C", "text": "₹350"}, {"id": "D", "text": "₹436"}, {"id": "E", "text": "₹250"}], "correct": "A", "explanation": "The PMJJBY annual premium was ₹330 before being revised to ₹436, effective June 1, 2022."}, {"id": "q44", "scheme": "pmsby", "type": "numbered", "difficulty": "Hard", "context": "Pradhan Mantri Suraksha Bima Yojana (PMSBY) is a one-year accidental insurance scheme.\n1. The eligible age bracket for PMSBY is 18 to 70 years.\n2. The annual premium was revised from ₹12 to ₹20, effective June 1, 2022.\n3. PMSBY has a lien period of 30 days, similar to PMJJBY.\n4. There is no reimbursement for hospitalization expenses under PMSBY.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 3 and 4"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1 and 2 only"}, {"id": "E", "text": "1, 2 and 4"}], "correct": "E", "explanation": "PMSBY has NO lien period at all — risk cover begins immediately from the date of auto-debit of the premium, unlike PMJJBY's 30-day lien. Statements 1, 2 and 4 are correct."}, {"id": "q45", "scheme": "pmsby", "type": "numbered", "difficulty": "Hard", "context": "Regarding the benefit structure of PMSBY:\n1. Accidental death is covered with a payout of ₹2 Lakh.\n2. Total and irrecoverable loss of sight of one eye alone is covered with a payout of ₹2 Lakh.\n3. Loss of use of one hand or one foot alone is covered with a payout of ₹1 Lakh.\n4. Death due to natural causes is covered under the scheme.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 3"}, {"id": "B", "text": "2 and 4"}, {"id": "C", "text": "Only 2"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "B", "explanation": "Total and irrecoverable loss of sight of one eye ALONE is covered at ₹1 Lakh, not ₹2 Lakh (the ₹2 Lakh payout applies to loss of both eyes, or combined loss). Death due to natural causes is explicitly excluded from PMSBY."}, {"id": "q46", "scheme": "pmsby", "type": "scenario", "difficulty": "Hard", "context": "Consider the following individuals applying for PMSBY:\n1. Deepak, aged 72, with a valid savings account.\n2. Farah, aged 68, applying for the first time.\n3. Imran, an NRI aged 35 with an Indian savings account.\n4. Sana, aged 18, a first-time account holder.", "question": "Who among the following are eligible to enroll in PMSBY?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "2, 3 and 4"}, {"id": "C", "text": "1, 3 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "2 and 4 only"}], "correct": "B", "explanation": "Farah (68), Imran (an NRI, eligible with an Indian savings account), and Sana (18) fall within the 18-70 age bracket. Deepak (72) exceeds the maximum entry age of 70."}, {"id": "q47", "scheme": "pmsby", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT a covered incident/benefit under PMSBY?", "options": [{"id": "A", "text": "Accidental Death – ₹2 Lakh"}, {"id": "B", "text": "Total loss of both eyes – ₹2 Lakh"}, {"id": "C", "text": "Hospitalization expenses due to accident – reimbursed up to ₹50,000"}, {"id": "D", "text": "Loss of sight of one eye – ₹1 Lakh"}, {"id": "E", "text": "Loss of use of one hand or foot – ₹1 Lakh"}], "correct": "C", "explanation": "PMSBY explicitly provides NO reimbursement for hospitalization expenses; it only covers accidental death and disability payouts."}, {"id": "q48", "scheme": "pmsby", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements correctly distinguishes PMSBY from PMJJBY?", "options": [{"id": "A", "text": "PMSBY's age eligibility (18-50) is narrower than PMJJBY's (18-70)."}, {"id": "B", "text": "PMSBY covers accidental death and disability, while PMJJBY covers death due to any cause."}, {"id": "C", "text": "PMSBY has a 30-day lien period, while PMJJBY has none."}, {"id": "D", "text": "The annual premium for PMSBY (₹436) is higher than for PMJJBY (₹20)."}, {"id": "E", "text": "PMSBY is administered by LIC, while PMJJBY is administered by general insurers."}], "correct": "B", "explanation": "The age ranges are reversed in option B (PMSBY is 18-70, PMJJBY is 18-50); the lien-period comparison is reversed in option C; the premiums are swapped in option D (PMSBY is ₹20, PMJJBY is ₹436); and the administering agencies are reversed in option E."}, {"id": "q49", "scheme": "pmsby", "type": "figure", "difficulty": "Easy", "context": "", "question": "What is the maximum age up to which accident cover under PMSBY continues?", "options": [{"id": "A", "text": "65 years"}, {"id": "B", "text": "70 years"}, {"id": "C", "text": "60 years"}, {"id": "D", "text": "55 years"}, {"id": "E", "text": "75 years"}], "correct": "B", "explanation": "PMSBY accident cover terminates on the subscriber attaining the age of 70 years."}, {"id": "q50", "scheme": "pmjdy", "type": "numbered", "difficulty": "Hard", "context": "Pradhan Mantri Jan Dhan Yojana (PMJDY) was formally launched on August 28, 2014, under the slogan 'Mera Khata – Bhagya Vidhata'.\n1. PMJDY accounts are essentially Basic Savings Bank Deposit Accounts (BSBDA) with zero minimum balance requirement.\n2. PMJDY Phase I (2014-2018) focused on 'Every Unbanked Adult', while Phase II (2018 onwards) focused on 'Every Household'.\n3. A free RuPay Debit Card is issued to account holders.\n4. A minimum of 4 free withdrawals per month (including ATM withdrawals) are permitted.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "2 and 4"}, {"id": "C", "text": "1, 3 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 3 only"}], "correct": "C", "explanation": "PMJDY's phases are reversed in statement 2 — Phase I (2014-2018) focused on 'Every Household', and Phase II (2018 onwards) shifted focus to 'Every Unbanked Adult'. Statements 1, 3 and 4 are correct."}, {"id": "q51", "scheme": "pmjdy", "type": "numbered", "difficulty": "Hard", "context": "Regarding the Overdraft (OD) facility under PMJDY:\n1. The maximum OD limit is ₹10,000.\n2. The first ₹2,000 is available without any underlying conditions.\n3. The OD facility is available immediately upon account opening.\n4. Only one person per household, preferably the woman of the house, can avail the OD facility.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "3 and 4"}, {"id": "C", "text": "Only 3"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "C", "explanation": "The OD facility is available only after 6 months of satisfactory account operation, not immediately upon account opening."}, {"id": "q52", "scheme": "pmjdy", "type": "scenario", "difficulty": "Hard", "context": "Consider the following PMJDY account holders regarding accidental insurance cover eligibility:\n1. Meera, whose account was opened on September 10, 2018, and who used her RuPay card 60 days before an accident, claiming ₹2 Lakh.\n2. Vikas, whose account was opened in July 2018, seeking the ₹2 Lakh accidental cover.\n3. Sanjay, a Central Government employee whose account was opened in December 2014, seeking the ₹30,000 life cover.\n4. Rita, whose account was opened in October 2018, but who had not used her RuPay card in the 90 days prior to her accident, seeking the ₹2 Lakh cover.", "question": "Who among the following are eligible for the respective insurance benefit claimed?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "Only 1"}, {"id": "C", "text": "1, 2 and 3"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 4"}], "correct": "B", "explanation": "Only Meera qualifies — her account was opened after August 28, 2018 and she used her RuPay card within the required 90-day window. Vikas's account (July 2018) predates the cutoff, so he gets only ₹1 Lakh, not ₹2 Lakh. Sanjay, a Central Government employee, is excluded from the ₹30,000 life cover. Rita failed to use her RuPay card within 90 days prior to the accident, so the claim condition is not met."}, {"id": "q53", "scheme": "pmjdy", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT one of the '6 Pillars' of PMJDY?", "options": [{"id": "A", "text": "National Rural Livelihood Mission Integration"}, {"id": "B", "text": "Universal Access"}, {"id": "C", "text": "Basic Savings Accounts"}, {"id": "D", "text": "Financial Literacy Programme"}, {"id": "E", "text": "Creation of Credit Guarantee Fund"}], "correct": "A", "explanation": "The 6 Pillars of PMJDY are: Universal Access, Basic Savings Accounts, Financial Literacy Programme, Creation of Credit Guarantee Fund, Pension Micro Insurance, and Pension Scheme for Unorganized Sector. There is no 'National Rural Livelihood Mission Integration' pillar."}, {"id": "q54", "scheme": "pmjdy", "type": "acronym", "difficulty": "Easy", "context": "", "question": "In the context of PMJDY's mission, what does 'NMFI' stand for?", "options": [{"id": "A", "text": "National Mission for Financial Investment"}, {"id": "B", "text": "National Monetary and Financial Institution"}, {"id": "C", "text": "National Mission on Financial Infrastructure"}, {"id": "D", "text": "National Mission on Financial Inclusion"}, {"id": "E", "text": "National Mission for Fiscal Inclusion"}], "correct": "D", "explanation": "NMFI (National Mission on Financial Inclusion) aims to ensure access to financial services, banking/savings, remittance, credit, insurance, and pension."}, {"id": "q55", "scheme": "pmjdy", "type": "figure", "difficulty": "Moderate", "context": "", "question": "What is the accidental insurance cover amount for PMJDY accounts opened after August 28, 2018, and for those opened on or before that date, respectively?", "options": [{"id": "A", "text": "₹1 Lakh; ₹2 Lakh"}, {"id": "B", "text": "₹2 Lakh; ₹1 Lakh"}, {"id": "C", "text": "₹2 Lakh; ₹30,000"}, {"id": "D", "text": "₹1 Lakh; ₹30,000"}, {"id": "E", "text": "₹2 Lakh; ₹2 Lakh"}], "correct": "B", "explanation": "Accounts opened after August 28, 2018 carry ₹2 Lakh accidental insurance cover, while those opened on or before that date carry ₹1 Lakh cover."}, {"id": "q56", "scheme": "pmjdy", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about PMJDY's role in the JAM Trinity is correct?", "options": [{"id": "A", "text": "PMJDY stands for the 'A' in the JAM Trinity, representing Aadhaar."}, {"id": "B", "text": "The JAM Trinity excludes PMJDY and only includes Aadhaar and Mobile."}, {"id": "C", "text": "PMJDY accounts cannot be used as entry points for schemes like PMJJBY or PMSBY."}, {"id": "D", "text": "PMJDY is the primary vehicle for Direct Benefit Transfer (DBT) and helps prevent leakages in subsidies like PM-KISAN and MGNREGA."}, {"id": "E", "text": "JAM Trinity refers to Jan Dhan, Aadhaar, and MGNREGA."}], "correct": "D", "explanation": "PMJDY is the 'J' (Jan Dhan) in the JAM Trinity (Jan Dhan-Aadhaar-Mobile), serving as the primary DBT vehicle, preventing subsidy leakages, and acting as the entry point for Jan Suraksha schemes (PMJJBY, PMSBY, APY)."}, {"id": "q57", "scheme": "pmmy", "type": "numbered", "difficulty": "Hard", "context": "Pradhan Mantri Mudra Yojana (PMMY) was launched on April 8, 2015, with MUDRA Ltd. as the implementing agency.\n1. MUDRA Ltd. is a wholly-owned subsidiary of SIDBI.\n2. MUDRA lends directly to individual micro-enterprise beneficiaries.\n3. MUDRA is registered as a Non-Banking Financial Company (NBFC) with the RBI.\n4. The three loan categories at launch were Shishu, Kishor, and Tarun.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 3 and 4"}, {"id": "B", "text": "1, 2 and 3"}, {"id": "C", "text": "2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 4 only"}], "correct": "A", "explanation": "MUDRA is a refinance institution and does NOT lend directly to individuals; it refinances Banks/RRBs/SFBs/NBFCs/MFIs who then lend to 'Last Mile Financiers'. Statements 1, 3 and 4 are correct."}, {"id": "q58", "scheme": "pmmy", "type": "numbered", "difficulty": "Hard", "context": "Regarding the loan categories under PMMY:\n1. Shishu loans cover amounts up to ₹50,000.\n2. Kishor loans range from ₹50,001 to ₹5,00,000.\n3. Tarun loans range from ₹5,00,001 to ₹15,00,000.\n4. Tarun Plus, announced in Budget 2024, offers loans up to ₹20,00,000 for entrepreneurs who have successfully repaid previous Tarun loans.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "Only 3"}, {"id": "C", "text": "3 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "B", "explanation": "Tarun loans range from ₹5,00,001 to ₹10,00,000, not ₹15,00,000."}, {"id": "q59", "scheme": "pmmy", "type": "scenario", "difficulty": "Hard", "context": "Consider the following micro-enterprises seeking MUDRA loans:\n1. Livelife, a poultry farming unit seeking ₹40,000 for startup expenses.\n2. Sunrise Traders, a shopkeeping unit seeking ₹6,00,000 for expansion, having never taken a Mudra loan before.\n3. Anjali's Bakery, seeking ₹18,00,000 under Tarun Plus without having previously availed and repaid a Tarun loan.\n4. GreenFish Farms, a pisciculture unit seeking ₹3,00,000 for growth.", "question": "Which of the following are eligible for the specific MUDRA loan category/amount sought?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "2, 3 and 4"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1 and 4 only"}, {"id": "E", "text": "1, 2 and 4"}], "correct": "E", "explanation": "Livelife (poultry farming, an agri-allied eligible activity) seeking ₹40,000 qualifies for a Shishu loan. Sunrise Traders' ₹6,00,000 request falls within the Tarun range and is eligible. GreenFish Farms (pisciculture, eligible activity) seeking ₹3,00,000 falls within the Kishor range. Anjali's Bakery is NOT eligible for Tarun Plus since she has not previously availed and repaid a Tarun loan, a mandatory precondition."}, {"id": "q60", "scheme": "pmmy", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT among the activities eligible for financing under PMMY?", "options": [{"id": "A", "text": "Large-scale Corporate Manufacturing Units (Companies)"}, {"id": "B", "text": "Poultry and Dairy Farming"}, {"id": "C", "text": "Beekeeping and Pisciculture"}, {"id": "D", "text": "Purchase of Commercial Vehicles and Tractors"}, {"id": "E", "text": "Food and Agro-processing"}], "correct": "A", "explanation": "PMMY specifically targets the Non-Corporate Small Business Sector (NCSBS); large corporate manufacturing companies are outside its scope."}, {"id": "q61", "scheme": "pmmy", "type": "acronym", "difficulty": "Easy", "context": "", "question": "What does 'MUDRA' stand for in Pradhan Mantri Mudra Yojana?", "options": [{"id": "A", "text": "Micro Units Development & Refinance Association"}, {"id": "B", "text": "Mudra Units Development & Rural Agency Ltd."}, {"id": "C", "text": "Micro Units Development & Refinance Agency Ltd."}, {"id": "D", "text": "Micro Units Deposit & Refinance Agency Ltd."}, {"id": "E", "text": "Micro Undertaking Development & Refinance Agency"}], "correct": "C", "explanation": "MUDRA stands for Micro Units Development & Refinance Agency Ltd., a wholly-owned subsidiary of SIDBI."}, {"id": "q62", "scheme": "pmmy", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about the MUDRA Card is correct?", "options": [{"id": "A", "text": "Interest under the MUDRA Card is charged on the entire sanctioned loan amount irrespective of utilization."}, {"id": "B", "text": "The MUDRA Card is only issued for Tarun category loans."}, {"id": "C", "text": "The MUDRA Card is issued by NCGTC, not by lending banks."}, {"id": "D", "text": "It is a RuPay Debit Card issued against the MUDRA loan account, allowing withdrawal of working capital in installments."}, {"id": "E", "text": "The Credit Guarantee Fund for Micro Units (CGFMU) is managed by SIDBI directly."}], "correct": "D", "explanation": "Interest is charged only on the amount actually utilized, not the full sanctioned amount; the card is not restricted to Tarun loans; it is issued against the loan account by the lending institution; and CGFMU is managed by NCGTC, not SIDBI."}, {"id": "q63", "scheme": "pmmy", "type": "figure", "difficulty": "Moderate", "context": "", "question": "The JanSamarth Portal, which integrates MUDRA loans digitally, covers how many credit-linked government schemes and how many loan categories, respectively?", "options": [{"id": "A", "text": "8; 16"}, {"id": "B", "text": "12; 6"}, {"id": "C", "text": "16; 6"}, {"id": "D", "text": "16; 8"}, {"id": "E", "text": "20; 8"}], "correct": "D", "explanation": "The JanSamarth Portal covers 16 credit-linked government schemes and 8 loan categories (including PMMY), with 200+ lenders integrated."}, {"id": "q64", "scheme": "sui", "type": "numbered", "difficulty": "Hard", "context": "Stand-Up India Scheme (SUI) was launched on April 5, 2016. Recently, on March 16, 2026, FM Nirmala Sitharaman announced that a revamping of the scheme is under process.\n1. Every scheduled commercial bank branch must facilitate at least one SC/ST borrower and at least one woman borrower for setting up a greenfield enterprise.\n2. The composite loan amount under SUI ranges between ₹10 Lakh and ₹1 Crore.\n3. The margin money requirement has been increased from 15% to 25% of the project cost.\n4. The loan is repayable in 7 years with a maximum moratorium period of 18 months.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 2 and 4"}, {"id": "B", "text": "1, 3 and 4"}, {"id": "C", "text": "2 and 3"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1 and 2 only"}], "correct": "A", "explanation": "The margin money requirement under Stand-Up India was REDUCED from 25% to 15% of project cost, not increased. Statements 1, 2 and 4 are correct."}, {"id": "q65", "scheme": "sui", "type": "numbered", "difficulty": "Hard", "context": "Regarding eligibility criteria under Stand-Up India:\n1. The enterprise being financed must be a Greenfield project, i.e., the beneficiary's first-time venture.\n2. For non-individual enterprises, at least 51% of shareholding must be held by an SC/ST or Woman entrepreneur.\n3. Only 'ready borrowers' who are fully business-ready are eligible; 'trainee borrowers' are excluded.\n4. The minimum age for eligibility is 18 years.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 2"}, {"id": "B", "text": "3 and 4"}, {"id": "C", "text": "Only 3"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "C", "explanation": "Both 'ready borrowers' (business-ready) and 'trainee borrowers' (requiring skilling/training support) are eligible under Stand-Up India, not just ready borrowers."}, {"id": "q66", "scheme": "sui", "type": "scenario", "difficulty": "Hard", "context": "Consider the following applicants for a Stand-Up India loan:\n1. Kiran, a woman entrepreneur setting up a new (greenfield) manufacturing unit.\n2. Deepa, an SC entrepreneur seeking a loan to expand her already-running trading business.\n3. Livelife Pvt Ltd, a company in which SC/ST and women entrepreneurs together hold 60% shareholding and control, setting up a new venture.\n4. Manoj, a general category male entrepreneur setting up a new venture.", "question": "Who among the following are eligible for a Stand-Up India loan?", "options": [{"id": "A", "text": "1 and 3"}, {"id": "B", "text": "1, 2 and 3"}, {"id": "C", "text": "2 and 4"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "1, 3 and 4"}], "correct": "A", "explanation": "Kiran (woman entrepreneur, greenfield venture) and Livelife Pvt Ltd (60% SC/ST/women shareholding, exceeding the 51% requirement, and a greenfield venture) qualify. Deepa is not eligible since she is expanding an existing business rather than starting a greenfield one. Manoj, being neither SC/ST nor a woman, does not meet the category criterion."}, {"id": "q67", "scheme": "sui", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT an eligible purpose/sector for a Stand-Up India loan?", "options": [{"id": "A", "text": "Manufacturing"}, {"id": "B", "text": "Trading"}, {"id": "C", "text": "Services"}, {"id": "D", "text": "Crop Loans and Land Improvement"}, {"id": "E", "text": "Activities allied to Agriculture (excluding crop loans and land improvement)"}], "correct": "D", "explanation": "Activities allied to agriculture were added as an eligible sector pursuant to Budget 2021-22, but this explicitly EXCLUDES crop loans and land improvement."}, {"id": "q68", "scheme": "sui", "type": "figure", "difficulty": "Moderate", "context": "", "question": "What was the margin money requirement under Stand-Up India previously, and what is the current requirement, respectively?", "options": [{"id": "A", "text": "25%; 15%"}, {"id": "B", "text": "15%; 25%"}, {"id": "C", "text": "20%; 10%"}, {"id": "D", "text": "25%; 10%"}, {"id": "E", "text": "30%; 15%"}], "correct": "A", "explanation": "The margin money requirement was reduced from 25% to 15% of the project cost, with the borrower required to contribute at least 10% as mandatory own contribution."}, {"id": "q69", "scheme": "sui", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements correctly compares Stand-Up India with MUDRA (PMMY)?", "options": [{"id": "A", "text": "Stand-Up India funds both new and existing enterprises, while MUDRA funds only Greenfield projects."}, {"id": "B", "text": "The MUDRA loan range (₹10 Lakh–₹1 Crore) is wider than Stand-Up India's (up to ₹20 Lakh)."}, {"id": "C", "text": "Stand-Up India loans are repayable in up to 5 years, shorter than MUDRA's 7 years."}, {"id": "D", "text": "Stand-Up India targets only SC/ST and Women entrepreneurs, whereas MUDRA covers all categories including General."}, {"id": "E", "text": "There is a per-branch mandate under MUDRA but not under Stand-Up India."}], "correct": "D", "explanation": "Stand-Up India funds only Greenfield projects (option B reverses this), the loan ranges are swapped in option C (Stand-Up India is ₹10L-1Cr, MUDRA is up to ₹20L), repayment periods are swapped in option D (Stand-Up India is 7 years, MUDRA up to 5 years), and the per-branch mandate belongs to Stand-Up India, not MUDRA."}, {"id": "q70", "scheme": "sui", "type": "figure", "difficulty": "Easy", "context": "", "question": "As per Stand-Up India, what is the composite loan amount range (inclusive of term loan and working capital)?", "options": [{"id": "A", "text": "₹5 Lakh to ₹50 Lakh"}, {"id": "B", "text": "₹1 Lakh to ₹10 Lakh"}, {"id": "C", "text": "₹10 Lakh to ₹2 Crore"}, {"id": "D", "text": "₹50,000 to ₹1 Crore"}, {"id": "E", "text": "₹10 Lakh to ₹1 Crore"}], "correct": "E", "explanation": "Stand-Up India offers a composite loan (inclusive of term loan and working capital) between ₹10 Lakh and ₹1 Crore."}, {"id": "q71", "scheme": "psb59", "type": "numbered", "difficulty": "Hard", "context": "The 'PSB Loans in 59 Minutes' platform, launched in September 2018 with SIDBI as strategic partner, is often misunderstood.\n1. The platform reduces the loan turnaround time to just 59 minutes for full loan disbursement.\n2. It uses algorithms to analyze data such as GST returns, Income Tax returns, and Bank Statements.\n3. A convenience fee of ₹1,000 plus GST is charged once the in-principle approval is generated.\n4. The platform is exclusively restricted to Public Sector Banks, despite involving private lenders.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "1 and 4"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "Only 1"}, {"id": "D", "text": "All of the above"}, {"id": "E", "text": "Only 4"}], "correct": "A", "explanation": "The platform reduces the turnaround time to 59 minutes for 'In-principle' approval only — actual disbursement takes 7-8 days after bank verification. Also, despite the name, several private sector banks and NBFCs are part of the ecosystem, not just PSBs."}, {"id": "q72", "scheme": "psb59", "type": "figure", "difficulty": "Moderate", "context": "", "question": "Under the 'PSB Loans in 59 Minutes' platform, what is the loan amount range for MSME Business Loans, and for Mudra Loans, respectively?", "options": [{"id": "A", "text": "₹10 Lakh to ₹1 Crore; up to ₹10 Lakh"}, {"id": "B", "text": "₹5 Lakh to ₹5 Crore; up to ₹50 Lakh"}, {"id": "C", "text": "₹10 Lakh to ₹5 Crore; up to ₹20 Lakh"}, {"id": "D", "text": "₹10 Lakh to ₹5 Crore; up to ₹10 Lakh"}, {"id": "E", "text": "₹1 Lakh to ₹5 Crore; up to ₹20 Lakh"}], "correct": "C", "explanation": "MSME Business Loans range from ₹10 Lakh to ₹5 Crore, while Mudra Loans go up to ₹20 Lakh, aligned with the latest PMMY limits."}, {"id": "q73", "scheme": "psb59", "type": "correct-stmt", "difficulty": "Moderate", "context": "", "question": "Which one of the following statements about the 'PSB Loans in 59 Minutes' platform is correct?", "options": [{"id": "A", "text": "Loan disbursement under the scheme is completed within 59 minutes of application."}, {"id": "B", "text": "Only Public Sector Banks participate in the scheme; private banks are excluded."}, {"id": "C", "text": "The convenience fee is waived for all MSME loan categories."}, {"id": "D", "text": "The platform issues an 'In-principle' sanction letter within 59 minutes, after which the borrower selects a bank from the portal's list."}, {"id": "E", "text": "Collateral is mandatorily required for all loans sanctioned through the platform."}], "correct": "D", "explanation": "This is FALSE, as the document itself clarifies disbursement takes 7-8 days; several private banks like ICICI, Axis and Kotak are part of the ecosystem; a convenience fee of ₹1,000 + GST applies; and loans can be collateral-free if covered under CGTMSE."}, {"id": "q74", "scheme": "psb59", "type": "acronym", "difficulty": "Easy", "context": "", "question": "In the context of the 'PSB Loans in 59 Minutes' platform, what does 'CGTMSE' stand for?", "options": [{"id": "A", "text": "Credit Guarantee Trust for Medium and Small Enterprises"}, {"id": "B", "text": "Central Guarantee Trust for Micro and Small Enterprises"}, {"id": "C", "text": "Credit Guarantee Fund Trust for Micro and Small Entrepreneurs"}, {"id": "D", "text": "Credit Growth Trust for Micro and Small Enterprises"}, {"id": "E", "text": "Credit Guarantee Fund Trust for Micro and Small Enterprises"}], "correct": "E", "explanation": "CGTMSE (Credit Guarantee Fund Trust for Micro and Small Enterprises) allows collateral-free lending under the '59 Minutes' platform."}, {"id": "q75", "scheme": "psb59", "type": "figure", "difficulty": "Easy", "context": "", "question": "The 'PSB Loans in 59 Minutes' portal reduces the process to just 59 minutes for in-principle approval, compared to the earlier turnaround time of how many days?", "options": [{"id": "A", "text": "10-15 days"}, {"id": "B", "text": "5-10 days"}, {"id": "C", "text": "30-35 days"}, {"id": "D", "text": "20-25 days"}, {"id": "E", "text": "2-5 days"}], "correct": "D", "explanation": "The platform reduces the loan turnaround time (TAT) from 20-25 days to just 59 minutes for 'In-principle' approval."}, {"id": "q76", "scheme": "gms", "type": "numbered", "difficulty": "Hard", "context": "The Gold Monetisation Scheme (GMS), launched in November 2015 and revamped in 2021 as R-GMS, mobilises idle gold held by households and institutions.\n1. Non-Resident Indians (NRIs) are eligible to deposit gold under GMS.\n2. The minimum deposit under GMS is 10 grams of raw gold, with no upper limit.\n3. GMS can be operated by any scheduled commercial bank in India.\n4. Deposited jewelry is melted to check purity, with credit given for 995 fineness gold equivalent.", "question": "Which of the statements given above is/are INCORRECT?", "options": [{"id": "A", "text": "2 and 4"}, {"id": "B", "text": "Only 1"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "Only 3"}, {"id": "E", "text": "1 and 3"}], "correct": "E", "explanation": "NRIs are explicitly NOT eligible to deposit gold under GMS — only residents can. Also, GMS can be operated only by banks specifically notified/designated by RBI/GoI, not by all scheduled commercial banks."}, {"id": "q77", "scheme": "gms", "type": "numbered", "difficulty": "Hard", "context": "Regarding the types of deposits under the Revamped-GMS (R-GMS):\n1. Short-Term Bank Deposit (STBD) has a tenure of 1 to 3 years and is held on the bank's balance sheet.\n2. Medium & Long-Term Government Deposit (MLTGD) has been discontinued for new enrollments since March 2025.\n3. The interest rate for STBD is fixed by the RBI at exactly 2.5% per annum.\n4. STBD redemption can be made in cash or physical gold, based on the depositor's initial choice.", "question": "Which of the statements given above are correct?", "options": [{"id": "A", "text": "1, 3 and 4"}, {"id": "B", "text": "2 and 3"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1, 2 and 4"}, {"id": "E", "text": "1 and 2 only"}], "correct": "D", "explanation": "The interest rate for STBD is 0.50% to 1% p.a. at the bank's discretion, not a fixed 2.5% (that figure applies to SGB, a different scheme). Statements 1, 2 and 4 are correct."}, {"id": "q78", "scheme": "gms", "type": "scenario", "difficulty": "Hard", "context": "Consider the following entities wishing to deposit gold under GMS:\n1. Ramesh, a resident individual, depositing 12 grams of gold jewelry.\n2. Golden Trust, a SEBI-registered mutual fund trust, depositing 500 grams of gold.\n3. Rohan, an NRI residing in Dubai, depositing 50 grams of gold coins.\n4. Sunrise HUF, a resident Hindu Undivided Family, depositing 8 grams of gold.", "question": "Who among the following are eligible to deposit gold under GMS?", "options": [{"id": "A", "text": "1, 2 and 3"}, {"id": "B", "text": "2, 3 and 4"}, {"id": "C", "text": "All of the above"}, {"id": "D", "text": "1 and 4 only"}, {"id": "E", "text": "1 and 2"}], "correct": "E", "explanation": "Ramesh (resident individual, 12g above the 10g minimum) and Golden Trust (a SEBI-registered mutual fund trust, an eligible entity type) can deposit. Rohan, being an NRI, is not eligible. Sunrise HUF's 8g deposit falls below the mandatory 10g minimum deposit requirement."}, {"id": "q79", "scheme": "gms", "type": "list", "difficulty": "Moderate", "context": "", "question": "Which of the following is NOT eligible to deposit gold under the Gold Monetisation Scheme (GMS)?", "options": [{"id": "A", "text": "Non-Resident Indians (NRIs)"}, {"id": "B", "text": "Resident Individuals and HUFs"}, {"id": "C", "text": "Charitable Institutions"}, {"id": "D", "text": "SEBI-registered Mutual Funds/ETFs"}, {"id": "E", "text": "Companies and Government entities"}], "correct": "A", "explanation": "NRIs are explicitly excluded from depositing gold under GMS; only residents can participate."}, {"id": "q80", "scheme": "gms", "type": "figure", "difficulty": "Moderate", "context": "", "question": "As per the RBI's recent directive (effective April 1, 2026) on tiered Loan-to-Value (LTV) ratios for loans against gold, what is the applicable LTV for loans up to ₹2.5 Lakh, and for loans above ₹5 Lakh, respectively?", "options": [{"id": "A", "text": "75%; 85%"}, {"id": "B", "text": "80%; 75%"}, {"id": "C", "text": "85%; 80%"}, {"id": "D", "text": "85%; 75%"}, {"id": "E", "text": "90%; 70%"}], "correct
