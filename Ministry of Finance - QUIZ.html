<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NABARD Grade A Practice Quiz — Ministry of Finance</title>
<style>
  :root{
    --bg:#0f1620; --card:#161f2b; --card2:#1c2733; --accent:#2f8f6e; --accent2:#e0a72e;
    --text:#e8edf2; --muted:#93a2b3; --correct:#1f7a4d; --wrong:#8a2b2b; --skip:#4a5568;
    --border:#2a3644;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  h1{font-size:18px;margin:0;font-weight:700;}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .scorebar{
    display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;
  }
  .scorebar div{display:flex;flex-direction:column;min-width:64px;}
  .scorebar b{font-size:16px;}
  .progress-outer{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-bottom:18px;}
  .progress-inner{height:100%;background:var(--accent);transition:width .25s;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;
  }
  .qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px;}
  .qmeta .diff{padding:2px 8px;border-radius:20px;background:var(--card2);}
  .diff.Easy{color:#7fd19a;}
  .diff.Moderate{color:#e0c060;}
  .diff.Hard{color:#e08a6a;}
  .qtext{white-space:pre-line;font-size:15.5px;line-height:1.55;margin-bottom:16px;}
  .opt{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    background:var(--card2); border:1px solid var(--border); color:var(--text);
    border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-size:14.5px;
    line-height:1.4; transition:background .15s, border-color .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt .lab{
    flex:0 0 24px;height:24px;border-radius:50%;background:#26313f;display:flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);
  }
  .opt.correct{background:rgba(31,122,77,.28);border-color:var(--correct);}
  .opt.correct .lab{background:var(--correct);color:#fff;}
  .opt.wrong{background:rgba(138,43,43,.28);border-color:var(--wrong);}
  .opt.wrong .lab{background:var(--wrong);color:#fff;}
  .opt:disabled{cursor:default;}
  .opt.dim{opacity:.55;}
  .actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
  button.ctrl{
    padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:var(--card2);
    color:var(--text);cursor:pointer;font-size:14px;font-weight:600;
  }
  button.ctrl:hover{border-color:var(--accent);}
  button.skip{background:transparent;color:var(--muted);}
  button.next{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.next:disabled{opacity:.4;cursor:not-allowed;}
  .explain{
    margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--card2);
    border-left:4px solid var(--accent2);font-size:13.5px;line-height:1.55;
  }
  .explain b{color:var(--accent2);}
  .feedback-tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:8px;}
  .feedback-tag.correct{background:var(--correct);color:#fff;}
  .feedback-tag.wrong{background:var(--wrong);color:#fff;}
  .feedback-tag.skipped{background:var(--skip);color:#fff;}
  /* Final scorecard */
  .final{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;}
  .final h2{margin-top:0;}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0;}
  @media(min-width:520px){.grid4{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--card2);border-radius:10px;padding:14px;text-align:center;}
  .stat .n{font-size:22px;font-weight:800;}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .bigscore{text-align:center;margin:10px 0 20px;}
  .bigscore .n{font-size:40px;font-weight:800;color:var(--accent);}
  .bigscore .l{color:var(--muted);font-size:13px;}
  .reviewitem{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--card2);}
  .reviewitem .rtag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:6px;}
  .rtag.wrong{background:var(--wrong);color:#fff;}
  .rtag.skipped{background:var(--skip);color:#fff;}
  .startbtn{
    display:inline-block;margin-top:16px;background:var(--accent);color:#fff;border:none;
    padding:12px 22px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .filterbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filterbar button{padding:6px 12px;font-size:12.5px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer;}
  .filterbar button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .qnum{color:var(--muted);}
</style>
</head>

<div class="wrap" id="app"></div>

<script>
let DATA = [];

const EMBEDDED_DATA = [{"id": 1, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "Consider the following statements regarding the Ministry of Finance (MoF):\n1. The Ministry of Finance currently consists of six departments.\n2. DIPAM handles disinvestment, strategic sale and asset monetisation of CPSEs.\n3. The Department of Public Enterprises sets Maharatna, Navratna and Miniratna criteria.\n4. The Department of Revenue administers only direct taxes.\nWhich of the above statements are correct?", "options": ["1, 2 and 3 only", "1 and 3 only", "2, 3 and 4 only", "None of the above", "1, 2, 3 and 4"], "answer": 0, "explanation": "Statement 4 is incorrect — the Department of Revenue administers BOTH direct taxes (via CBDT) and indirect taxes (via CBIC, i.e. GST, Customs, Central Excise). Statements 1, 2 and 3 are accurate as per the document.", "difficulty": "Moderate"}, {"id": 2, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "Which Article of the Constitution mandates the presentation of the Annual Financial Statement (Union Budget) before Parliament?", "options": ["Article 300", "Article 112", "Article 280", "Article 110", "Article 265"], "answer": 1, "explanation": "Article 112 mandates the presentation of the Annual Financial Statement (Union Budget) before Parliament.", "difficulty": "Easy"}, {"id": 3, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "Consider the following statements about constitutional mandates relevant to MoF:\n1. Article 150 deals with the form of accounts of the Union and the States.\n2. Article 280 provides for appointment of the Finance Commission every five years.\n3. Article 266 manages the Contingency Fund of India.\n4. Article 267 deals with management of the Consolidated Fund of India.\nWhich of the above statements are correct?", "options": ["2, 3 and 4 only", "3 and 4 only", "1 and 2 only", "1, 2, 3 and 4", "1, 2 and 3 only"], "answer": 2, "explanation": "Statement 3 is wrong — Article 266 manages the Consolidated Fund of India and the Public Account of India, not the Contingency Fund. Statement 4 is wrong — Article 267 deals with the Contingency Fund (held by the Finance Secretary on behalf of the President), not the Consolidated Fund. Only statements 1 and 2 are correct.", "difficulty": "Hard"}, {"id": 4, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "Which secretary is traditionally designated as the Finance Secretary, being the most senior among the six departmental secretaries of MoF?", "options": ["Secretary, Department of Financial Services", "Secretary, Department of Revenue", "Secretary, Department of Economic Affairs", "Secretary, Department of Expenditure", "Secretary, DIPAM"], "answer": 3, "explanation": "Traditionally, the Expenditure Secretary is designated as the Finance Secretary, being the most senior among the six secretaries.", "difficulty": "Moderate"}, {"id": 5, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "As per the document, who is the Chief Economic Adviser (CEA) of India (current as of April 2026)?", "options": ["Arvind Subramanian", "Sanjeev Sanyal", "Ajay Seth", "Krishnamurthy Subramanian", "Dr. V. Anantha Nageswaran"], "answer": 4, "explanation": "Dr. V. Anantha Nageswaran is currently (as of April 2026) the Chief Economic Adviser, heading the Economic Division of DEA and the primary author of the Economic Survey.", "difficulty": "Easy"}, {"id": 6, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "Consider the following statements about statutory/regulatory bodies under MoF:\n1. SEBI regulates capital markets.\n2. IRDAI regulates the insurance sector.\n3. PFRDA regulates pensions.\n4. IBBI regulates International Financial Services Centres.\nWhich of the above statements are correct?", "options": ["1, 2 and 3 only", "2 and 3 only", "None of the above", "1 and 4 only", "1, 2, 3 and 4"], "answer": 0, "explanation": "Statement 4 is incorrect — IBBI is the Insolvency and Bankruptcy Board of India; it is IFSCA that regulates International Financial Services Centres (GIFT City). Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 7, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "Which of the following financial institutions is described in the document as 'the newest DFI' (Development Finance Institution)?", "options": ["NHB", "NaBFID", "SIDBI", "NABARD", "EXIM Bank"], "answer": 1, "explanation": "NaBFID (National Bank for Financing Infrastructure and Development) is described as the newest DFI.", "difficulty": "Easy"}, {"id": 8, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "Consider the following statements:\n1. NABARD is fully owned by the Government of India.\n2. NHB (National Housing Bank) is fully owned by the Government of India.\n3. SIDBI's ownership is not explicitly described as 'fully-owned' in the document, unlike NABARD and NHB.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "None of the above", "1, 2 and 3", "1 only", "2 and 3 only"], "answer": 2, "explanation": "The document explicitly states NABARD and NHB are 'fully owned by the Government', while SIDBI is listed without that qualifier — all three statements are consistent with the document.", "difficulty": "Hard"}, {"id": 9, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "The Economic Survey is typically tabled in Parliament:", "options": ["A week after the Budget", "A month before the Budget", "On the same day as the Budget", "A day before the Union Budget", "It is not tabled every year"], "answer": 3, "explanation": "The Economic Survey is tabled usually a day before the Budget and highlights the state of the economy for the previous year.", "difficulty": "Easy"}, {"id": 10, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "Which of the following Bills authorizes the government to withdraw funds from the Consolidated Fund of India?", "options": ["Insurance Bill", "None of the above", "Finance Bill", "Money Bill", "Appropriation Bill"], "answer": 4, "explanation": "The Appropriation Bill authorizes the government to withdraw funds from the Consolidated Fund of India. The Finance Bill contains taxation proposals.", "difficulty": "Easy"}, {"id": 11, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "Which of the following statements is NOT correct regarding the six departments of MoF?", "options": ["DIPAM sets the Maharatna, Navratna and Miniratna criteria for CPSEs", "DFS supervises Public Sector Banks, LIC, GIC and PFRDA", "Department of Expenditure implements Central Pay Commissions and administers PFMS/GFR", "Department of Revenue administers direct taxes via CBDT and indirect taxes via CBIC", "DEA prepares the Union Budget and Economic Survey and manages debt and forex reserves"], "answer": 0, "explanation": "This is incorrect (and hence the answer to a 'NOT correct' question) — setting Maharatna/Navratna/Miniratna criteria and CPSE policy is the mandate of the Department of Public Enterprises (DPE), not DIPAM. DIPAM handles disinvestment and asset monetisation.", "difficulty": "Hard"}, {"id": 12, "section": "Ministry of Finance — Institutional & Functional Guide", "question": "The Union Budget is presented in Parliament on:", "options": ["July 1", "February 1", "January 1", "March 31", "April 1"], "answer": 1, "explanation": "The Union Budget is presented on February 1 and outlines estimates for the upcoming financial year.", "difficulty": "Easy"}, {"id": 13, "section": "National Pension System (NPS)", "question": "The National Pension System (NPS) was originally launched (for Central Government employees) on:", "options": ["December 2011", "April 8, 2015", "January 1, 2004", "May 1, 2009", "November 12, 2021"], "answer": 2, "explanation": "NPS was launched on January 1, 2004 for Central Government employees (except Armed Forces). It was universally extended to all citizens on May 1, 2009.", "difficulty": "Easy"}, {"id": 14, "section": "National Pension System (NPS)", "question": "Consider the following statements about NPS:\n1. NPS was universally extended to all citizens, including NRIs and OCIs, on May 1, 2009.\n2. NPS was extended to corporates, including Central Public Sector Enterprises, in December 2011.\n3. The regulatory body for NPS is IRDAI.\n4. The nodal ministry for NPS is the Ministry of Finance (Department of Financial Services).\nWhich of the above statements are correct?", "options": ["1 and 3 only", "1, 2 and 3 only", "2, 3 and 4 only", "1, 2 and 4 only", "1, 2, 3 and 4"], "answer": 3, "explanation": "Statement 3 is incorrect — the regulatory body for NPS is PFRDA, not IRDAI (which regulates insurance). Statements 1, 2 and 4 are correct.", "difficulty": "Moderate"}, {"id": 15, "section": "National Pension System (NPS)", "question": "The maximum age for opening a new NPS account (All Citizen Model, Corporate Model, etc.) has been increased to:", "options": ["60 years", "65 years", "80 years", "70 years", "85 years"], "answer": 4, "explanation": "The maximum age for opening a new NPS account, and the maximum entry/exit age for most categories, has been increased to 85 years.", "difficulty": "Easy"}, {"id": 16, "section": "National Pension System (NPS)", "question": "Consider the following statements about NPS Vatsalya:\n1. It was launched in 2024 for minors below 18 years.\n2. It is managed by parents/guardians until the child turns 18.\n3. The minimum annual contribution is ₹500.\n4. Post-conversion, partial withdrawal up to 25% of own contributions is allowed for specified purposes.\nWhich of the above statements are correct?", "options": ["1, 2 and 4 only", "1 and 2 only", "1, 2, 3 and 4", "2 and 3 only", "1, 3 and 4 only"], "answer": 0, "explanation": "Statement 3 is incorrect — the minimum annual contribution for NPS Vatsalya is ₹250, not ₹500. Statements 1, 2 and 4 are correct.", "difficulty": "Moderate"}, {"id": 17, "section": "National Pension System (NPS)", "question": "Which of the following entities are NOT eligible to join NPS as per the document?", "options": ["Overseas Citizens of India (OCIs)", "Hindu Undivided Families (HUFs) and PIOs", "Corporate sector employees", "Government employees", "NRIs"], "answer": 1, "explanation": "HUFs (Hindu Undivided Families) and PIOs (Persons of Indian Origin) are explicitly excluded from NPS eligibility. NRIs and OCIs are eligible.", "difficulty": "Moderate"}, {"id": 18, "section": "National Pension System (NPS)", "question": "Consider the following statements about NPS Tier I and Tier II accounts:\n1. Tier I is mandatory for joining NPS.\n2. Tier II withdrawal is fully flexible — funds can be withdrawn anytime.\n3. Tier I minimum contribution is ₹500 (initial) and ₹1,000/year.\n4. Tier II offers the same tax benefits as Tier I to all subscribers.\nWhich of the above statements are correct?", "options": ["2, 3 and 4 only", "None of the above", "1, 2 and 3 only", "1, 2, 3 and 4", "1 and 4 only"], "answer": 2, "explanation": "Statement 4 is incorrect — Tier II offers no tax benefits except for government employees with a 3-year lock-in. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 19, "section": "National Pension System (NPS)", "question": "Under NPS 'Active Choice' investment, the Equity (E) asset class allocation is capped at:", "options": ["There is no cap", "100%", "60%", "75%", "50%"], "answer": 3, "explanation": "Under Active Choice, Equity (E) is high risk/high return and is capped at 75%.", "difficulty": "Easy"}, {"id": 20, "section": "National Pension System (NPS)", "question": "Which of the following statements is NOT correct about NPS asset classes?", "options": ["E stands for Equity, which is high risk, high return", "C stands for Corporate Debt, which is medium risk", "G stands for Government Securities, which is low risk", "The A (Alternative Assets) class has been discontinued and merged with E and C", "A (Alternative Assets) continues to be an active, independent asset class"], "answer": 4, "explanation": "This is incorrect — the document states 'A' (Alternative Assets) has been DISCONTINUED and merged with 'E' and 'C'. It is no longer an independent active asset class.", "difficulty": "Moderate"}, {"id": 21, "section": "National Pension System (NPS)", "question": "As per the December 2025 PFRDA amendment, the frequency of partial withdrawals before age 60/superannuation has been increased from 3 to how many times, with what mandatory gap between withdrawals?", "options": ["4 times, with a 4-year gap", "4 times, with a 3-year gap", "3 times, with a 5-year gap", "4 times, with a 2-year gap", "5 times, with a 3-year gap"], "answer": 0, "explanation": "Before age 60, the frequency has been increased from 3 to 4 times during the entire subscription period, with a mandatory 4-year gap between two withdrawals.", "difficulty": "Hard"}, {"id": 22, "section": "National Pension System (NPS)", "question": "Consider the following statements about the 2025 NPS reforms:\n1. The earlier 3-year vesting period requirement has been completely removed.\n2. Subscribers can pledge their NPS account as collateral for loans, with a lien up to 25% of the subscriber's own contributions.\n3. Skill development/re-skilling was newly added as an eligible purpose for partial withdrawal.\n4. Settlement of financial obligations (loan/credit) against a lien on the NPS account was newly added as a purpose.\nWhich of the above statements are correct?", "options": ["1, 2, 3 and 4", "1, 2 and 4 only", "3 and 4 only", "1 and 3 only", "2, 3 and 4 only"], "answer": 1, "explanation": "Statement 3 is incorrect — skill development/re-skilling and establishing a startup were REMOVED as eligible purposes in the 2025 amendment, not added. Statements 1, 2 and 4 are correct.", "difficulty": "Hard"}, {"id": 23, "section": "National Pension System (NPS)", "question": "For premature exit from NPS where the accumulated pension wealth is ≤ ₹5 lakh, the rule is:", "options": ["60% must be used to purchase an annuity", "None of the above", "100% lump sum withdrawal is permitted; no annuity purchase required", "Annuity purchase is compulsory regardless of corpus size", "80% must be used to purchase an annuity"], "answer": 2, "explanation": "If accumulated pension wealth is ≤ ₹5 Lakh, 100% lump sum withdrawal is permitted and no annuity purchase is required. Above ₹5 Lakh, minimum 80% must go into an annuity.", "difficulty": "Moderate"}, {"id": 24, "section": "National Pension System (NPS)", "question": "Under the All Citizen Model of NPS, a subscriber can undertake Normal Exit:", "options": ["Only at 65 years of age", "None of the above", "After 10 years or 55 years of age, whichever is earlier", "After completing 15 years of subscription OR on attaining 60 years, whichever is earlier", "Only after completing 20 years of subscription"], "answer": 3, "explanation": "Under the All Citizen Model, a subscriber can exit after completing 15 years of subscription OR on attaining 60 years of age, whichever is earlier.", "difficulty": "Moderate"}, {"id": 25, "section": "National Pension System (NPS)", "question": "What is the 'Systematic Lump Sum Withdrawal (SLW)' facility introduced in NPS in 2025?", "options": ["A new type of Sovereign Gold Bond", "A new category of Pension Fund Manager", "A tax exemption scheme for NPS subscribers", "None of the above", "A facility allowing phased/instalment withdrawal of the lump sum instead of taking it all at once"], "answer": 4, "explanation": "SLW allows subscribers to withdraw the lump-sum amount in phased/regular instalments (monthly, quarterly, half-yearly or yearly) instead of taking it all at once, with the remaining amount continuing to earn market-linked returns.", "difficulty": "Easy"}, {"id": 26, "section": "National Pension System (NPS)", "question": "Under the All Citizen Model, for corpus exceeding ₹12 Lakh at Normal Exit, the withdrawal rule is:", "options": ["Up to 80% lump sum + at least 20% annuity", "Equal 50-50 split mandatory", "No lump sum allowed at all", "100% lump sum permitted", "Up to 60% lump sum + 40% annuity"], "answer": 0, "explanation": "For corpus > ₹12 Lakh under the All Citizen Model, up to 80% can be taken as lump sum with at least 20% mandatorily annuitized.", "difficulty": "Moderate"}, {"id": 27, "section": "National Pension System (NPS)", "question": "For the Government Sector at Normal Exit, with corpus ≤ ₹8 Lakh, the applicable rule is:", "options": ["None of the above", "100% lumpsum or SLW/SUR, OR up to 60% lump sum + 40% annuity", "No withdrawal option is available", "Up to 80% lump sum + 20% annuity only, no other option", "Only annuity is permitted, no lump sum"], "answer": 1, "explanation": "For Government Sector employees with corpus ≤ ₹8 Lakh, the options are 100% lumpsum or SLW/SUR, OR up to 60% Lump Sum + 40% annuity.", "difficulty": "Hard"}, {"id": 28, "section": "National Pension System (NPS)", "question": "Consider the following statements on NPS tax benefits:\n1. Section 80CCD(1B) offers an additional deduction of ₹50,000 specifically for NPS Tier I.\n2. Section 80CCD(2) — employer's contribution — is available under both the Old and New tax regimes.\n3. Even after the 2025 amendment allowing up to 80% lump sum withdrawal, only 60% of the corpus remains tax-free under Section 10(12A).\n4. Sections 80CCD(1) and 80CCD(1B) are available under both the Old and New tax regimes.\nWhich of the above statements are correct?", "options": ["2, 3 and 4 only", "None of the above", "1, 2 and 3 only", "1, 2, 3 and 4", "1 and 4 only"], "answer": 2, "explanation": "Statement 4 is incorrect — Sections 80CCD(1) and 80CCD(1B) are available under the OLD tax regime only. Statements 1–3 are correct.", "difficulty": "Hard"}, {"id": 29, "section": "National Pension System (NPS)", "question": "PRAN, allotted to every NPS subscriber for lifetime identification, stands for:", "options": ["None of the above", "Provident Retirement Allotment Number", "Personal Retirement Account Number", "Permanent Retirement Account Number", "Pension Registered Account Number"], "answer": 3, "explanation": "PRAN stands for Permanent Retirement Account Number — a unique 12-digit number allotted to every NPS subscriber.", "difficulty": "Easy"}, {"id": 30, "section": "National Pension System (NPS)", "question": "Consider the following statements about Central Recordkeeping Agencies (CRAs) under NPS:\n1. Protean is a CRA.\n2. KFintech is a CRA.\n3. CAMS is a CRA.\n4. NSDL is explicitly named as a CRA in the document.\nWhich of the above statements are correct?", "options": ["1, 2, 3 and 4", "1 and 2 only", "2, 3 and 4 only", "None of the above", "1, 2 and 3 only"], "answer": 4, "explanation": "The document names Protean, KFintech, and CAMS as CRA entities. NSDL is not mentioned as a CRA in this context, so statement 4 is incorrect.", "difficulty": "Hard"}, {"id": 31, "section": "Unified Pension Scheme (UPS)", "question": "The Unified Pension Scheme (UPS) became effective from:", "options": ["April 1, 2025", "January 1, 2025", "January 1, 2024", "None of the above", "April 1, 2024"], "answer": 0, "explanation": "UPS was announced in 2024 and became effective from April 1, 2025.", "difficulty": "Easy"}, {"id": 32, "section": "Unified Pension Scheme (UPS)", "question": "Consider the following statements about the 'Five Pillars' of UPS:\n1. Guaranteed Pension is 50% of average basic pay of the last 12 months, for 25+ years of service.\n2. Guaranteed Family Pension is 60% of the employee's last drawn pension.\n3. Guaranteed Minimum Pension is ₹10,000/month after 10 years of qualifying service.\n4. Family pension under UPS can be claimed by children as well as the spouse.\nWhich of the above statements are correct?", "options": ["1, 2, 3 and 4", "1, 2 and 3 only", "None of the above", "1 and 3 only", "2, 3 and 4 only"], "answer": 1, "explanation": "Statement 4 is incorrect — the Guaranteed Family Pension is paid exclusively to the legally wedded spouse; children and other dependents are NOT eligible for family pension under UPS. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 33, "section": "Unified Pension Scheme (UPS)", "question": "Under UPS, while the employee contribution remains at 10% of Basic+DA, the TOTAL government contribution is:", "options": ["14%", "18%", "18.5%", "20%", "10%"], "answer": 2, "explanation": "Under UPS, total government contribution is 18.5% of Basic+DA (10% matching contribution + 8.5% to the Pooled Corpus Fund), up from 14% under NPS.", "difficulty": "Moderate"}, {"id": 34, "section": "Unified Pension Scheme (UPS)", "question": "Which of the following statements is NOT correct regarding the UPS contribution structure?", "options": ["Government's matching contribution to the individual NPS account is 10% (reduced from 14% under NPS)", "The total government contribution under UPS is 18.5%", "Employee contributes 10% of Basic Pay + DA", "The total government contribution under UPS equals 14%, the same as under NPS", "The additional government contribution goes into a Pool Account (Assured Payout Fund)"], "answer": 3, "explanation": "This is incorrect (and hence the answer) — total government contribution under UPS is 18.5% (10% matching + 8.5% pooled), which is HIGHER than the 14% under plain NPS.", "difficulty": "Hard"}, {"id": 35, "section": "Unified Pension Scheme (UPS)", "question": "UPS is best described, per the document, as:", "options": ["A mandatory replacement for the Old Pension Scheme (OPS) only", "A scheme applicable only to State Government employees", "A completely separate scheme that has replaced NPS entirely", "None of the above", "An option introduced under NPS — employees can choose UPS or continue in NPS"], "answer": 4, "explanation": "UPS is introduced as an option under NPS (not a completely separate scheme); employees can choose UPS or continue in NPS.", "difficulty": "Easy"}, {"id": 36, "section": "Unified Pension Scheme (UPS)", "question": "Retired Central Government NPS subscribers with a minimum of how many years of qualifying service can also claim UPS arrears/benefits retroactively?", "options": ["10 years", "15 years", "20 years", "25 years", "5 years"], "answer": 0, "explanation": "Retired Central Govt NPS subscribers with a minimum of 10 years of qualifying service can also claim UPS arrears/benefits (adjusted against previous NPS withdrawals at PPF rates).", "difficulty": "Moderate"}, {"id": 37, "section": "Unified Pension Scheme (UPS)", "question": "Consider the following statements comparing OPS, NPS and UPS:\n1. OPS is a Defined Benefit, unfunded scheme with nil employee contribution.\n2. NPS pension amount is market-linked/variable.\n3. UPS pension amount equals 50% of the last 12-month average pay.\n4. UPS offers no inflation protection (Dearness Relief).\nWhich of the above statements are correct?", "options": ["2, 3 and 4 only", "1, 2 and 3 only", "1, 2, 3 and 4", "1 and 4 only", "None of the above"], "answer": 1, "explanation": "Statement 4 is incorrect — UPS DOES offer inflation protection through Dearness Relief (DR), linked to AICPI-IW, applicable to both pension and family pension. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 38, "section": "Unified Pension Scheme (UPS)", "question": "The lump sum payment (gratuity alternative) under UPS is calculated as:", "options": ["1/4th of the last drawn pay", "2 months' salary for every year of service", "1/10th of (Pay + DA) for every completed 6 months of service", "A fixed amount of ₹5 lakh", "None of the above"], "answer": 2, "explanation": "The lump sum payment under UPS equals 1/10th of (pay + DA) for every completed 6 months of service, paid at retirement without reducing the pension amount.", "difficulty": "Moderate"}, {"id": 39, "section": "Atal Pension Yojana (APY)", "question": "Atal Pension Yojana was launched by PM Narendra Modi in Kolkata on:", "options": ["August 28, 2014", "January 1, 2004", "November 12, 2021", "May 9, 2015", "April 8, 2015"], "answer": 3, "explanation": "APY was launched on May 9, 2015, and operationalized from June 1, 2015.", "difficulty": "Easy"}, {"id": 40, "section": "Atal Pension Yojana (APY)", "question": "Consider the following statements about APY eligibility:\n1. Minimum age of joining is 18 years and maximum is 40 years.\n2. From October 1, 2022, any citizen who is or has been an income tax payer is not eligible to join APY.\n3. If a subscriber joins and is later found to be a taxpayer, the account continues without any consequence.\n4. Existing subscribers who joined on or before September 30, 2022 may continue in APY regardless of their tax status.\nWhich of the above statements are correct?", "options": ["None of the above", "1 and 3 only", "2, 3 and 4 only", "1, 2, 3 and 4", "1, 2 and 4 only"], "answer": 4, "explanation": "Statement 3 is incorrect — if a subscriber joins and is later found to be an income tax payer, the account is CLOSED and the accumulated corpus is returned. Statements 1, 2 and 4 are correct.", "difficulty": "Moderate"}, {"id": 41, "section": "Atal Pension Yojana (APY)", "question": "Which of the following is NOT one of the 'three guarantees' offered under APY?", "options": ["Guaranteed employer matching contribution for all subscribers", "None — all three listed guarantees are genuine features of APY", "Spouse pension for lifetime after the subscriber's death", "Guaranteed minimum monthly pension after age 60", "Return of accumulated corpus to the nominee after both subscriber and spouse die"], "answer": 0, "explanation": "There is no 'guaranteed employer matching contribution' feature under APY. The three real guarantees are: guaranteed minimum pension, spouse pension, and return of corpus to nominee.", "difficulty": "Moderate"}, {"id": 42, "section": "Atal Pension Yojana (APY)", "question": "The fixed monthly pension slabs available under APY are:", "options": ["Flexible with no fixed slabs", "₹1,000, ₹2,000, ₹3,000, ₹4,000, ₹5,000", "₹2,000 to ₹10,000 in any amount", "₹500, ₹1,500, ₹2,500", "None of the above"], "answer": 1, "explanation": "APY offers fixed monthly pension slabs of ₹1,000, ₹2,000, ₹3,000, ₹4,000, or ₹5,000 depending on the subscriber's contribution.", "difficulty": "Easy"}, {"id": 43, "section": "Atal Pension Yojana (APY)", "question": "Government co-contribution under APY (50% of subscriber's contribution or ₹1,000/year, whichever is lower, for 5 years) was applicable only to subscribers who joined between:", "options": ["It was never applicable", "2018 and 2020", "June 1, 2015 and March 31, 2016", "It is applicable to every subscriber even today", "2015 and 2020 for all subscribers"], "answer": 2, "explanation": "Government co-contribution applied only to those who joined between June 1, 2015 and March 31, 2016, and were not covered under any statutory social security scheme or income taxpayers. New subscribers today do NOT get this co-contribution.", "difficulty": "Hard"}, {"id": 44, "section": "Atal Pension Yojana (APY)", "question": "Consider the following statements based on the APY contribution chart:\n1. At entry age 18, the monthly contribution for a ₹1,000 pension is ₹42.\n2. At entry age 18, the monthly contribution for a ₹5,000 pension is ₹210.\n3. At entry age 40, the monthly contribution for a ₹1,000 pension is ₹291.\n4. At entry age 40, the monthly contribution for a ₹5,000 pension is ₹1,454.\nWhich of the above statements are correct?", "options": ["None of the above", "1, 2 and 3 only", "1 and 4 only", "1, 2, 3 and 4", "2, 3 and 4 only"], "answer": 3, "explanation": "All four figures are accurately drawn from the APY contribution chart in the document: ₹42/₹210 at age 18 and ₹291/₹1,454 at age 40 for ₹1,000/₹5,000 pensions respectively.", "difficulty": "Hard"}, {"id": 45, "section": "Atal Pension Yojana (APY)", "question": "On attaining 60 years under APY, what percentage annuitization applies for the monthly pension?", "options": ["80%", "50%", "None of the above", "0%", "100%"], "answer": 4, "explanation": "On attaining 60 years, 100% annuitization applies for the monthly pension under APY.", "difficulty": "Easy"}, {"id": 46, "section": "Atal Pension Yojana (APY)", "question": "Consider the following statements about APY exit rules:\n1. Voluntary exit before age 60 is allowed only in exceptional circumstances such as terminal illness.\n2. On normal voluntary exit, the subscriber receives own contribution plus interest, while government co-contribution (if any) is forfeited.\n3. On death before age 60, the spouse can continue the account until the original subscriber would have turned 60.\n4. APY allows voluntary exit anytime, freely, for any reason, without any restriction.\nWhich of the above statements are correct?", "options": ["1, 2 and 3 only", "1 and 4 only", "1, 2, 3 and 4", "None of the above", "2, 3 and 4 only"], "answer": 0, "explanation": "Statement 4 is incorrect — voluntary exit is 'generally not encouraged' and is allowed mainly in exceptional circumstances, not freely for any reason. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 47, "section": "Atal Pension Yojana (APY)", "question": "Which of the following statements is NOT correct about recent APY developments?", "options": ["e-APY allows online onboarding via net banking, mobile app, and bank web portals", "New subscribers currently continue to receive central government co-contribution", "Women constitute 48% of active subscribers", "Over 55% of new enrolments in FY 2024-25 were women", "Cabinet approved continuation of APY support and gap funding till 2030-31"], "answer": 1, "explanation": "This is incorrect — while the scheme continues, NEW subscribers do NOT receive the central government co-contribution; only those who joined between June 2015 and March 2016 received it.", "difficulty": "Hard"}, {"id": 48, "section": "Atal Pension Yojana (APY)", "question": "Consider the following statements comparing NPS and APY:\n1. NPS age range is 18–70 (up to 85 for exit); APY's age range is 18–40.\n2. NPS pension amount is market-linked/variable; APY's pension is fixed and guaranteed.\n3. Both NPS and APY are regulated by PFRDA.\n4. Income tax payers are allowed to join NPS but NOT allowed to join APY.\nWhich of the above statements are correct?", "options": ["2 and 4 only", "1 and 3 only", "1, 2, 3 and 4", "1, 2 and 3 only", "None of the above"], "answer": 2, "explanation": "All four statements are consistent with the document's comparison table: NPS (18-70/85) vs APY (18-40); NPS is market-linked, APY is fixed & guaranteed; both are PFRDA-regulated; and tax payers are barred from APY only.", "difficulty": "Moderate"}, {"id": 49, "section": "Atal Pension Yojana (APY)", "question": "Partial/premature withdrawal from APY before age 60 (unlike NPS's 25% partial withdrawal facility) is:", "options": ["None of the above", "Allowed up to 25%, same as NPS", "Allowed freely at any time", "Not allowed before 60, except in exceptional cases", "Allowed after 5 years without restriction"], "answer": 3, "explanation": "Unlike NPS, which allows partial withdrawal up to 25% under specific conditions, APY withdrawal is NOT allowed before age 60 (except exceptional voluntary exit cases).", "difficulty": "Moderate"}, {"id": 50, "section": "Atal Pension Yojana (APY)", "question": "The Union Cabinet approved continuation of APY support and gap funding till 2030-31 on:", "options": ["October 1, 2022", "March 31, 2025", "None of the above", "April 1, 2025", "January 21, 2026"], "answer": 4, "explanation": "The Cabinet approved continuation of APY with funding support till 2030-31 on January 21, 2026.", "difficulty": "Hard"}, {"id": 51, "section": "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", "question": "Pradhan Mantri Vaya Vandana Yojana (PMVVY) was launched on:", "options": ["May 4, 2017", "April 1, 2023", "August 28, 2014", "November 12, 2021", "May 9, 2015"], "answer": 0, "explanation": "PMVVY was launched on May 4, 2017 by LIC, exclusively for senior citizens.", "difficulty": "Easy"}, {"id": 52, "section": "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", "question": "PMVVY is implemented exclusively by:", "options": ["PFRDA", "Life Insurance Corporation (LIC) of India", "NABARD", "All Public Sector Banks collectively", "State Bank of India"], "answer": 1, "explanation": "PMVVY is implemented exclusively by LIC of India.", "difficulty": "Easy"}, {"id": 53, "section": "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", "question": "Consider the following statements about PMVVY:\n1. The scheme was available for subscription until March 31, 2023.\n2. Minimum entry age is 60 years completed, with no maximum age limit.\n3. Policy tenure is 10 years.\n4. Investment in PMVVY qualifies for tax deduction under Section 80C.\nWhich of the above statements are correct?", "options": ["1, 2, 3 and 4", "None of the above", "1, 2 and 3 only", "1 and 4 only", "2, 3 and 4 only"], "answer": 2, "explanation": "Statement 4 is incorrect — unlike NPS or SCSS, PMVVY does NOT qualify for a Section 80C deduction. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 54, "section": "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", "question": "The maximum investment allowed per senior citizen under PMVVY is:", "options": ["₹10 Lakh", "₹30 Lakh", "No upper limit", "₹15 Lakh", "₹20 Lakh"], "answer": 3, "explanation": "Maximum investment under PMVVY is ₹15 Lakh per senior citizen (₹30 Lakh for a couple, both above 60).", "difficulty": "Moderate"}, {"id": 55, "section": "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", "question": "From 2020 onwards, the PMVVY interest rate is reset annually (on April 1) in line with which scheme?", "options": ["None of the above", "Public Provident Fund (PPF)", "National Savings Certificate (NSC)", "Sukanya Samriddhi Account", "Senior Citizens Savings Scheme (SCSS)"], "answer": 4, "explanation": "From 2020 onwards, the PMVVY interest rate is reset annually on April 1st in line with the Senior Citizens Savings Scheme (SCSS).", "difficulty": "Moderate"}, {"id": 56, "section": "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", "question": "Under PMVVY, the loan facility is available after completion of how many policy years, up to what percentage of the Purchase Price?", "options": ["3 years, up to 75%", "2 years, up to 50%", "No loan facility is available", "5 years, up to 90%", "1 year, up to 60%"], "answer": 0, "explanation": "PMVVY loan facility is available after completion of 3 policy years, for up to 75% of the Purchase Price.", "difficulty": "Moderate"}, {"id": 57, "section": "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", "question": "Which of the following statements is NOT correct about the PMVVY vs. SCSS comparison?", "options": ["PMVVY tenure is 10 years vs. SCSS's 5 years (extendable by 3)", "PMVVY offers Section 80C tax benefit while SCSS does not", "PMVVY's max limit is ₹15 lakh vs. SCSS's ₹30 lakh", "PMVVY offers a loan facility after 3 years while SCSS has no loan facility", "PMVVY is offered only through LIC while SCSS is available via banks and post offices"], "answer": 1, "explanation": "This is incorrect (and hence the answer) — it is the reverse: SCSS offers Section 80C tax benefit, while PMVVY does NOT.", "difficulty": "Hard"}, {"id": 58, "section": "Pradhan Mantri Vaya Vandana Yojana (PMVVY)", "question": "Under PMVVY, the Surrender Value for premature exit (allowed only for critical illness of self or spouse) refunds what percentage of the Purchase Price?", "options": ["90%", "95%", "98%", "80%", "100%"], "answer": 2, "explanation": "98% of the Purchase Price is refunded on premature surrender (a 2% penalty applies), permitted only in exceptional circumstances like critical illness.", "difficulty": "Moderate"}, {"id": 59, "section": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)", "question": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY) was launched on:", "options": ["April 8, 2015", "January 22, 2015", "May 4, 2017", "May 9, 2015", "August 28, 2014"], "answer": 3, "explanation": "PMJJBY was launched on May 9, 2015 as a one-year pure term life insurance scheme, renewable annually.", "difficulty": "Easy"}, {"id": 60, "section": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)", "question": "Consider the following statements about PMJJBY:\n1. Age bracket for entry is 18 to 50 years.\n2. Coverage continues up to age 55, subject to annual premium payment.\n3. Life cover is ₹2 Lakh, payable on death due to any cause.\n4. The current annual premium is ₹330.\nWhich of the above statements are correct?", "options": ["None of the above", "1, 2, 3 and 4", "1 and 4 only", "2, 3 and 4 only", "1, 2 and 3 only"], "answer": 4, "explanation": "Statement 4 is incorrect — the annual premium was revised from ₹330 to ₹436, effective June 1, 2022. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 61, "section": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)", "question": "The 'lien period' under PMJJBY (waiting period during which the insurer is not liable for claims) is:", "options": ["30 days", "45 days", "60 days", "There is no lien period", "15 days"], "answer": 0, "explanation": "PMJJBY has a 30-day lien period from the date of enrollment, which also applies to subscribers who exit and re-join.", "difficulty": "Moderate"}, {"id": 62, "section": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)", "question": "Under PMJJBY's lien period rule, if death occurs due to an ACCIDENT within the first 30 days of enrollment:", "options": ["None of the above", "The claim is paid in full", "Payment is delayed by 90 days", "The claim is not payable at all", "Only 50% of the claim is paid"], "answer": 1, "explanation": "If death occurs due to an accident within the first 30 days, the claim IS paid in full — the lien period exclusion applies only to natural-cause deaths.", "difficulty": "Hard"}, {"id": 63, "section": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)", "question": "The PMJJBY policy/coverage period runs from:", "options": ["January 1 to December 31", "None of the above", "June 1 to May 31", "April 1 to March 31", "July 1 to June 30"], "answer": 2, "explanation": "The PMJJBY coverage period runs from 1 June to 31 May every year (not the calendar year), standard across all Jan Suraksha schemes.", "difficulty": "Moderate"}, {"id": 64, "section": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)", "question": "For a subscriber joining PMJJBY mid-year in the December–February window, the pro-rata premium payable is:", "options": ["₹436", "₹342", "₹500", "₹228", "₹114"], "answer": 3, "explanation": "Per the pro-rata structure, the December–February joining window carries a premium of ₹228 for the first year.", "difficulty": "Hard"}, {"id": 65, "section": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)", "question": "Which of the following statements is NOT correct about PMJJBY termination of cover?", "options": ["Entry into the scheme is allowed only up to age 50", "Coverage can be renewed annually up to age 55", "Lapsed cover, if reinstated, is treated as fresh cover with a fresh 30-day lien period", "Closure of the bank account terminates the cover", "If a member is covered through more than one account, total insurance cover can exceed ₹2 lakh proportionately"], "answer": 4, "explanation": "This is incorrect — if covered through more than one account, insurance cover is RESTRICTED to ₹2 lakh total, and premium paid for duplicate enrolments is liable to be forfeited; it does not increase the cover.", "difficulty": "Hard"}, {"id": 66, "section": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)", "question": "PMJJBY is administered by:", "options": ["LIC and other life insurance companies in tie-up with banks", "SEBI", "PFRDA directly", "Public Sector General Insurance Companies only", "NABARD"], "answer": 0, "explanation": "PMJJBY is administered by LIC and other life insurance companies in tie-up with banks (unlike PMSBY, which is administered by general insurance companies).", "difficulty": "Easy"}, {"id": 67, "section": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)", "question": "Consider the following statements about PMJJBY:\n1. NRIs with an Indian savings account are eligible.\n2. Claims for NRIs are paid in Indian Rupees only.\n3. Aadhaar is the primary KYC document for the linked bank account.\n4. The premium is auto-debited between May 25 and May 31 every year.\nWhich of the above statements are correct?", "options": ["2, 3 and 4 only", "1, 2, 3 and 4", "1 and 4 only", "1, 2 and 3 only", "None of the above"], "answer": 1, "explanation": "All four statements are accurate as per the document regarding PMJJBY's NRI eligibility, KYC, and premium collection window.", "difficulty": "Moderate"}, {"id": 68, "section": "Pradhan Mantri Suraksha Bima Yojana (PMSBY)", "question": "The age bracket for PMSBY eligibility is:", "options": ["18 to 80 years", "18 to 60 years", "18 to 70 years", "21 to 65 years", "18 to 50 years"], "answer": 2, "explanation": "PMSBY's age bracket is 18 to 70 years — notably higher than PMJJBY's 50-year limit.", "difficulty": "Easy"}, {"id": 69, "section": "Pradhan Mantri Suraksha Bima Yojana (PMSBY)", "question": "The current annual premium of PMSBY (revised effective June 1, 2022) is:", "options": ["₹12", "₹100", "₹330", "₹20", "₹436"], "answer": 3, "explanation": "The PMSBY annual premium was revised from ₹12 to ₹20, effective June 1, 2022.", "difficulty": "Easy"}, {"id": 70, "section": "Pradhan Mantri Suraksha Bima Yojana (PMSBY)", "question": "Consider the following statements from the PMSBY table of benefits:\n1. Accidental death payout is ₹2 Lakh.\n2. Total and irrecoverable loss of both eyes/hands/feet payout is ₹2 Lakh.\n3. Total loss of sight of one eye or use of one hand/foot payout is ₹1 Lakh.\n4. Hospitalization expenses are reimbursed under PMSBY.\nWhich of the above statements are correct?", "options": ["2, 3 and 4 only", "1, 2, 3 and 4", "1 and 4 only", "None of the above", "1, 2 and 3 only"], "answer": 4, "explanation": "Statement 4 is incorrect — the document explicitly states there is NO reimbursement for hospitalization expenses under PMSBY. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 71, "section": "Pradhan Mantri Suraksha Bima Yojana (PMSBY)", "question": "Unlike PMJJBY, the lien period under PMSBY is:", "options": ["None — cover begins immediately on auto-debit of premium", "45 days", "30 days", "60 days", "15 days"], "answer": 0, "explanation": "PMSBY has NO lien period; risk cover begins immediately from the date of auto-debit of the premium, unlike PMJJBY's 30-day lien.", "difficulty": "Moderate"}, {"id": 72, "section": "Pradhan Mantri Suraksha Bima Yojana (PMSBY)", "question": "Which of the following statements is NOT correct about PMSBY exclusions?", "options": ["Intentional self-injury is excluded from coverage", "Accidental death is excluded from coverage", "None — all listed items except accidental death are correctly excluded", "Suicide is excluded from coverage", "Death due to natural causes is excluded from coverage"], "answer": 1, "explanation": "This is incorrect (and hence the answer) — accidental death is exactly what PMSBY covers, with a ₹2 Lakh payout; it is not excluded.", "difficulty": "Moderate"}, {"id": 73, "section": "Pradhan Mantri Suraksha Bima Yojana (PMSBY)", "question": "Unlike PMJJBY's pro-rata premium structure for late joiners, PMSBY's premium structure is:", "options": ["Doubled for mid-year joiners", "None of the above", "Full annual premium of ₹20 payable even for mid-year enrolment, with no pro-rata structure", "Also pro-rata, mirroring PMJJBY", "Waived entirely for mid-year joiners"], "answer": 2, "explanation": "Unlike PMJJBY, PMSBY has NO pro-rata premium structure — the full annual premium of ₹20 is payable even for mid-year enrolment.", "difficulty": "Moderate"}, {"id": 74, "section": "Pradhan Mantri Suraksha Bima Yojana (PMSBY)", "question": "The PMSBY accident cover terminates on attaining what age?", "options": ["65 years", "55 years", "75 years", "70 years", "60 years"], "answer": 3, "explanation": "PMSBY accident cover terminates on attaining the age of 70 years.", "difficulty": "Easy"}, {"id": 75, "section": "Pradhan Mantri Suraksha Bima Yojana (PMSBY)", "question": "Consider the following statements comparing PMJJBY and PMSBY:\n1. PMJJBY is a life insurance scheme (age 18–50, premium ₹436/year); PMSBY is an accidental insurance scheme (age 18–70, premium ₹20/year).\n2. PMJJBY has a 30-day lien period; PMSBY has none.\n3. PMSBY is administered exclusively by LIC, same as PMJJBY.\nWhich of the above statements are correct?", "options": ["None of the above", "1, 2 and 3", "2 and 3 only", "1 only", "1 and 2 only"], "answer": 4, "explanation": "Statement 3 is incorrect — PMSBY is administered by General Insurance companies (public sector general insurers), NOT LIC, which administers PMJJBY.", "difficulty": "Moderate"}, {"id": 76, "section": "Pradhan Mantri Jan Dhan Yojana (PMJDY)", "question": "PMJDY was formally launched on:", "options": ["August 28, 2014", "April 8, 2015", "January 22, 2015", "May 9, 2015", "August 15, 2014"], "answer": 0, "explanation": "PMJDY was announced on August 15, 2014 (Independence Day address) and formally launched on August 28, 2014.", "difficulty": "Moderate"}, {"id": 77, "section": "Pradhan Mantri Jan Dhan Yojana (PMJDY)", "question": "The slogan of PMJDY is:", "options": ["Beti Bachao Beti Padhao", "Mera Khata – Bhagya Vidhata", "None of the above", "Jan Dhan Se Jan Suraksha", "Sabka Saath Sabka Vikas"], "answer": 1, "explanation": "The slogan of PMJDY is 'Mera Khata – Bhagya Vidhata' (My Account – Maker of my Fortune).", "difficulty": "Easy"}, {"id": 78, "section": "Pradhan Mantri Jan Dhan Yojana (PMJDY)", "question": "Consider the following statements about PMJDY:\n1. Phase I (2014–2018) focused on 'Every Household.'\n2. Phase II (2018 onwards) shifted focus to 'Every Unbanked Adult.'\n3. PMJDY accounts require a minimum balance of ₹500.\n4. PMJDY provides a free RuPay debit card.\nWhich of the above statements are correct?", "options": ["1 and 3 only", "2, 3 and 4 only", "1, 2 and 4 only", "None of the above", "1, 2, 3 and 4"], "answer": 2, "explanation": "Statement 3 is incorrect — PMJDY (BSBDA) accounts have a ZERO minimum balance requirement with no penalty for low balance. Statements 1, 2 and 4 are correct.", "difficulty": "Moderate"}, {"id": 79, "section": "Pradhan Mantri Jan Dhan Yojana (PMJDY)", "question": "The minimum number of free cash withdrawals per month (including ATM withdrawals) under BSBDA/PMJDY accounts is:", "options": ["2", "6", "3", "4", "Unlimited"], "answer": 3, "explanation": "A minimum of 4 free withdrawals per month is guaranteed under BSBDA/PMJDY accounts.", "difficulty": "Moderate"}, {"id": 80, "section": "Pradhan Mantri Jan Dhan Yojana (PMJDY)", "question": "Under the PMJDY Overdraft (OD) facility, the amount available WITHOUT any underlying conditions is:", "options": ["₹10,000", "₹1,000", "₹500", "₹5,000", "₹2,000"], "answer": 4, "explanation": "The first ₹2,000 is available as condition-free OD; the total OD limit is up to ₹10,000.", "difficulty": "Moderate"}, {"id": 81, "section": "Pradhan Mantri Jan Dhan Yojana (PMJDY)", "question": "OD eligibility under PMJDY requires how many months of satisfactory account operation?", "options": ["6 months", "No such requirement", "3 months", "24 months", "12 months"], "answer": 0, "explanation": "The OD facility is available after 6 months of satisfactory account operation.", "difficulty": "Moderate"}, {"id": 82, "section": "Pradhan Mantri Jan Dhan Yojana (PMJDY)", "question": "The accidental insurance cover under PMJDY for accounts opened AFTER August 28, 2018 is:", "options": ["₹1 Lakh", "₹2 Lakh", "₹5 Lakh", "₹30,000", "₹50,000"], "answer": 1, "explanation": "Accounts opened after August 28, 2018 carry a ₹2 Lakh accidental insurance cover (vs. ₹1 Lakh for those opened on or before that date), conditional on RuPay card usage in the preceding 90 days.", "difficulty": "Moderate"}, {"id": 83, "section": "Pradhan Mantri Jan Dhan Yojana (PMJDY)", "question": "The one-time life cover of ₹30,000 under PMJDY was applicable to accounts opened between:", "options": ["2015 and 2018", "None — this cover was never offered", "August 15, 2014 and January 26, 2015", "2018 and 2020", "Every year continuously since inception"], "answer": 2, "explanation": "The ₹30,000 life cover (administered by LIC) applied to accounts opened between August 15, 2014 and January 26, 2015, for one person per family aged 18–59, with several exclusions.", "difficulty": "Hard"}, {"id": 84, "section": "Pradhan Mantri Jan Dhan Yojana (PMJDY)", "question": "Which of the following statements is NOT correct about PMJDY's role in the JAM Trinity?", "options": ["It helps prevent leakages in subsidies like PM-KISAN, PAHAL and MGNREGA", "'M' stands for Mobile in the JAM Trinity", "'J' stands for Jan Dhan in the JAM Trinity", "It is unrelated to the Jan Suraksha schemes such as PMJJBY, PMSBY and APY", "It serves as the primary vehicle for Direct Benefit Transfer (DBT)"], "answer": 3, "explanation": "This is incorrect (and hence the answer) — PMJDY actually acts as the ENTRY POINT for the Jan Suraksha schemes (PMJJBY, PMSBY, APY), not something unrelated to them.", "difficulty": "Moderate"}, {"id": 85, "section": "Pradhan Mantri Mudra Yojana (PMMY)", "question": "Pradhan Mantri Mudra Yojana (PMMY) was launched on:", "options": ["April 1, 2023", "November 12, 2021", "May 9, 2015", "January 1, 2004", "April 8, 2015"], "answer": 4, "explanation": "PMMY was launched on April 8, 2015, implemented via MUDRA Ltd.", "difficulty": "Easy"}, {"id": 86, "section": "Pradhan Mantri Mudra Yojana (PMMY)", "question": "MUDRA is a wholly-owned subsidiary of:", "options": ["SIDBI", "RBI", "IFSCA", "NABARD", "SEBI"], "answer": 0, "explanation": "MUDRA (Micro Units Development & Refinance Agency Ltd.) is a wholly-owned subsidiary of SIDBI and is registered as an NBFC with the RBI.", "difficulty": "Easy"}, {"id": 87, "section": "Pradhan Mantri Mudra Yojana (PMMY)", "question": "Consider the following statements about MUDRA loan categories:\n1. Shishu: up to ₹50,000.\n2. Kishor: ₹50,001 to ₹5,00,000.\n3. Tarun: ₹5,00,001 to ₹10,00,000.\n4. Tarun Plus (new): up to ₹15,00,000.\nWhich of the above statements are correct?", "options": ["2, 3 and 4 only", "1, 2 and 3 only", "1, 2, 3 and 4", "1 and 4 only", "None of the above"], "answer": 1, "explanation": "Statement 4 is incorrect — Tarun Plus (announced in Budget 2024) offers loans up to ₹20,00,000, not ₹15,00,000. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 88, "section": "Pradhan Mantri Mudra Yojana (PMMY)", "question": "The 'Tarun Plus' MUDRA loan category, offering loans up to ₹20,00,000, was announced in:", "options": ["Budget 2023-24", "None of the above", "Budget 2024", "Budget 2025-26", "Budget 2021-22"], "answer": 2, "explanation": "Tarun Plus was announced in Budget 2024, for entrepreneurs who have successfully repaid previous Tarun loans.", "difficulty": "Moderate"}, {"id": 89, "section": "Pradhan Mantri Mudra Yojana (PMMY)", "question": "MUDRA loans, under PMMY, are characterized as:", "options": ["Available only to registered companies", "Available only to male entrepreneurs", "Fully collateralized loans requiring security", "Collateral-free up to specified limits", "Available only for the manufacturing sector"], "answer": 3, "explanation": "Mudra loans are collateral-free; banks are mandated not to ask for collateral up to the specified limits.", "difficulty": "Easy"}, {"id": 90, "section": "Pradhan Mantri Mudra Yojana (PMMY)", "question": "Which of the following statements is NOT correct about MUDRA's institutional role?", "options": ["MUDRA is registered as an NBFC with the RBI", "MUDRA is a refinance institution", "The institutional structure is three-tier: MUDRA (refinancer) → MLIs (direct lenders) → Beneficiaries", "MUDRA provides refinance to SCBs, RRBs, SFBs, NBFCs and MFIs", "MUDRA lends directly to individual borrowers at the retail level"], "answer": 4, "explanation": "This is incorrect (and hence the answer) — MUDRA does NOT lend directly to individuals; it refinances Member Lending Institutions (MLIs) who then lend to the 'last mile financiers'.", "difficulty": "Moderate"}, {"id": 91, "section": "Pradhan Mantri Mudra Yojana (PMMY)", "question": "The Credit Guarantee Fund for Micro Units (CGFMU), which provides a guarantee to lenders under PMMY, is managed by:", "options": ["NCGTC", "NABARD", "SIDBI directly", "PFRDA", "CGTMSE"], "answer": 0, "explanation": "CGFMU is managed by the National Credit Guarantee Trustee Company (NCGTC), established in 2016.", "difficulty": "Moderate"}, {"id": 92, "section": "Pradhan Mantri Mudra Yojana (PMMY)", "question": "The MUDRA Card, issued against a MUDRA loan account, is a:", "options": ["None of the above", "RuPay Debit Card allowing withdrawal of working capital in installments", "Cheque book facility", "Prepaid gift card", "Credit card with rewards points"], "answer": 1, "explanation": "The MUDRA Card is a RuPay Debit Card issued against the loan account, allowing withdrawal in multiple installments to reduce interest burden (interest charged only on utilized amount).", "difficulty": "Easy"}, {"id": 93, "section": "Pradhan Mantri Mudra Yojana (PMMY)", "question": "The JanSamarth Portal, integrating MUDRA loans digitally, covers how many credit-linked government schemes?", "options": ["25", "12", "16", "8", "20"], "answer": 2, "explanation": "The JanSamarth Portal covers 16 credit-linked government schemes, 8 loan categories (including PMMY), and 200+ lenders.", "difficulty": "Hard"}, {"id": 94, "section": "Stand-Up India Scheme (SUI)", "question": "The Stand-Up India Scheme was launched on:", "options": ["April 8, 2015", "November 2015", "January 22, 2015", "April 5, 2016", "September 2018"], "answer": 3, "explanation": "Stand-Up India was launched on April 5, 2016, implemented via SIDBI, and has since been extended.", "difficulty": "Easy"}, {"id": 95, "section": "Stand-Up India Scheme (SUI)", "question": "Consider the following statements about Stand-Up India eligibility:\n1. Every scheduled commercial bank branch must facilitate at least one SC/ST borrower and one woman borrower.\n2. The enterprise must be a Greenfield project.\n3. For non-individual enterprises, at least 51% shareholding/controlling stake must be held by an SC/ST or woman entrepreneur.\n4. General category entrepreneurs are also eligible for loans under Stand-Up India.\nWhich of the above statements are correct?", "options": ["1, 2, 3 and 4", "None of the above", "1 and 4 only", "2, 3 and 4 only", "1, 2 and 3 only"], "answer": 4, "explanation": "Statement 4 is incorrect — Stand-Up India targets ONLY SC/ST and Women entrepreneurs, unlike MUDRA which covers all categories. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 96, "section": "Stand-Up India Scheme (SUI)", "question": "The composite loan amount (term loan + working capital) under Stand-Up India ranges between:", "options": ["₹10 Lakh to ₹1 Crore", "₹5 Lakh to ₹50 Lakh", "₹1 Lakh to ₹10 Lakh", "₹50 Lakh to ₹2 Crore", "No specified range"], "answer": 0, "explanation": "The composite loan under Stand-Up India ranges between ₹10 Lakh and ₹1 Crore (reportedly likely to increase to ₹2 Crore).", "difficulty": "Moderate"}, {"id": 97, "section": "Stand-Up India Scheme (SUI)", "question": "The loan under Stand-Up India is repayable within how many years, with what maximum moratorium period?", "options": ["3 years, 6-month moratorium", "7 years, 18-month moratorium", "15 years, 36-month moratorium", "10 years, 24-month moratorium", "5 years, 12-month moratorium"], "answer": 1, "explanation": "The loan is repayable in 7 years with a maximum moratorium period of 18 months.", "difficulty": "Moderate"}, {"id": 98, "section": "Stand-Up India Scheme (SUI)", "question": "The current margin money requirement under Stand-Up India (reduced from the earlier 25%) is:", "options": ["20%", "It remains unchanged at 25%", "15%", "5%", "10%"], "answer": 2, "explanation": "The margin money requirement has been reduced to 15% of project cost, with the borrower mandatorily contributing at least 10% own contribution.", "difficulty": "Moderate"}, {"id": 99, "section": "Stand-Up India Scheme (SUI)", "question": "Which of the following statements is NOT correct when comparing Stand-Up India and MUDRA (PMMY)?", "options": ["Stand-Up India mandates 2 loans per bank branch; MUDRA has no per-branch mandate", "Stand-Up India's loan range is ₹10 Lakh–₹1 Crore; MUDRA's new limit is up to ₹20 Lakh", "Stand-Up India targets only SC/ST and Women; MUDRA covers all categories including General", "Stand-Up India's repayment period is 5 years while MUDRA's is 7 years", "Stand-Up India is for Greenfield projects only; MUDRA covers both new and existing units"], "answer": 3, "explanation": "This is incorrect (and hence the answer) — it is the reverse: Stand-Up India's repayment period is 7 years, while MUDRA's is up to 5 years.", "difficulty": "Hard"}, {"id": 100, "section": "Stand-Up India Scheme (SUI)", "question": "The Stand-Up India Portal (www.standupmitra.in), which connects borrowers with banks and Handholding Agencies, was developed by:", "options": ["MUDRA Ltd.", "RBI", "NCGTC", "NABARD", "SIDBI"], "answer": 4, "explanation": "The Stand-Up India Portal was developed by SIDBI.", "difficulty": "Easy"}, {"id": 101, "section": "Stand-Up India Scheme (SUI)", "question": "Activities allied to agriculture (excluding crop loans and land improvement) were added as an eligible purpose for Stand-Up India loans pursuant to:", "options": ["Budget 2021-22 announcement", "Budget 2018-19", "Budget 2024-25", "Launch in 2016 itself", "They were never added as eligible"], "answer": 0, "explanation": "Manufacturing, Trading and Services were eligible at launch (2016); agri-allied activities (pisciculture, beekeeping, poultry, dairy, etc.) were added pursuant to the Budget 2021-22 announcement.", "difficulty": "Hard"}, {"id": 102, "section": "PSB Loans in 59 Minutes", "question": "The 'PSB Loans in 59 Minutes' initiative was launched in:", "options": ["November 2015", "September 2018", "April 2016", "2021", "January 2015"], "answer": 1, "explanation": "This initiative, a joint effort of SIDBI and a consortium of Public Sector Banks, was launched in September 2018.", "difficulty": "Easy"}, {"id": 103, "section": "PSB Loans in 59 Minutes", "question": "Consider the following statements about 'PSB Loans in 59 Minutes':\n1. It reduces loan turnaround time from 20–25 days to 59 minutes for 'in-principle' approval.\n2. Actual disbursement of funds also happens within 59 minutes.\n3. A convenience fee of ₹1,000 + GST is charged once in-principle approval is generated.\n4. Only Public Sector Banks are part of this lending ecosystem, with no private participation.\nWhich of the above statements are correct?", "options": ["2 and 4 only", "1, 2, 3 and 4", "1 and 3 only", "None of the above", "1, 2 and 3 only"], "answer": 2, "explanation": "Statement 2 is incorrect — '59 Minutes to Money' is FALSE; disbursement takes 7–8 days after bank verification, following in-principle approval. Statement 4 is incorrect — several private banks (ICICI, Axis, Kotak) and NBFCs are also part of the ecosystem. Only statements 1 and 3 are correct.", "difficulty": "Moderate"}, {"id": 104, "section": "PSB Loans in 59 Minutes", "question": "The MSME Business Loan range available via the 'PSB Loans in 59 Minutes' portal is:", "options": ["₹50 Lakh to ₹10 Crore", "₹1 Lakh to ₹50 Lakh", "No specified range", "₹10 Lakh to ₹5 Crore", "₹5 Lakh to ₹1 Crore"], "answer": 3, "explanation": "MSME Business Loans on the portal range from ₹10 Lakh to ₹5 Crore.", "difficulty": "Moderate"}, {"id": 105, "section": "PSB Loans in 59 Minutes", "question": "The Mudra Loan limit aligned with the latest PMMY limits, as offered on the 'PSB Loans in 59 Minutes' portal, is up to:", "options": ["₹15 Lakh", "₹1 Crore", "₹5 Lakh", "₹10 Lakh", "₹20 Lakh"], "answer": 4, "explanation": "Mudra Loans on the portal are aligned with the latest PMMY limit of up to ₹20 Lakh.", "difficulty": "Moderate"}, {"id": 106, "section": "PSB Loans in 59 Minutes", "question": "Which of the following statements is NOT correct about 'PSB Loans in 59 Minutes'?", "options": ["The name '59 Minutes to Money' is literally accurate — funds are disbursed within 59 minutes", "Several private sector banks like ICICI, Axis and Kotak are part of the ecosystem", "It is a strategic initiative of SIDBI and a consortium of PSBs", "It uses algorithms analyzing GST, Income Tax returns and Bank Statements for real-time creditworthiness assessment", "Loans can be collateral-free if covered under CGTMSE"], "answer": 0, "explanation": "This is incorrect (and hence the answer) — '59 Minutes to Money' is explicitly flagged as FALSE in the document; it refers only to in-principle approval, not disbursement.", "difficulty": "Moderate"}, {"id": 107, "section": "PSB Loans in 59 Minutes", "question": "Which agency provides a refinance window of ₹10,000 Crore for the Stand-Up India scheme?", "options": ["MUDRA Ltd.", "SIDBI", "RBI", "NABARD", "NCGTC"], "answer": 1, "explanation": "SIDBI provides a refinance window of ₹10,000 Crore for the Stand-Up India scheme; credit guarantee is managed by NCGTC.", "difficulty": "Moderate"}, {"id": 108, "section": "Gold Monetisation Scheme (GMS)", "question": "The Gold Monetisation Scheme (GMS) was revamped in 2021 and is now referred to as:", "options": ["Super GMS", "New GMS", "R-GMS", "GMS-2", "None of the above"], "answer": 2, "explanation": "GMS was launched in November 2015 and revamped in 2021 as R-GMS.", "difficulty": "Easy"}, {"id": 109, "section": "Gold Monetisation Scheme (GMS)", "question": "The minimum deposit of gold required under GMS is:", "options": ["1 gram", "20 grams", "50 grams", "10 grams", "5 grams"], "answer": 3, "explanation": "The minimum deposit under GMS is 10 grams of raw gold, with no upper limit.", "difficulty": "Easy"}, {"id": 110, "section": "Gold Monetisation Scheme (GMS)", "question": "Consider the following statements about GMS eligibility:\n1. Only residents (individuals, HUFs, trusts, companies) can deposit gold.\n2. Non-Resident Indians (NRIs) are eligible to deposit gold under GMS.\n3. GMS can be operated by any scheduled commercial bank.\n4. Joint deposits are allowed for two or more eligible depositors.\nWhich of the above statements are correct?", "options": ["2 and 3 only", "None of the above", "1, 2, 3 and 4", "1, 2 and 4 only", "1 and 4 only"], "answer": 4, "explanation": "Statement 2 is incorrect — NRIs are explicitly NOT eligible to deposit under GMS; only residents can. Statement 3 is incorrect — GMS can be operated ONLY by banks specifically notified by RBI/Government, not any scheduled bank. Only statements 1 and 4 are correct.", "difficulty": "Hard"}, {"id": 111, "section": "Gold Monetisation Scheme (GMS)", "question": "Under GMS, banks lend the mobilised gold to jewellers via a Gold Metal Loan (GML) at an interest rate of:", "options": ["SOFR + spread (3–4% p.a.)", "Interest-free", "The prevailing repo rate", "A fixed 8% rate", "MCLR + 5%"], "answer": 0, "explanation": "Banks lend mobilised gold to jewellers via GML at SOFR + spread (3–4% p.a.); jewellers return equivalent gold plus interest.", "difficulty": "Moderate"}, {"id": 112, "section": "Gold Monetisation Scheme (GMS)", "question": "The tenure of the Short-Term Bank Deposit (STBD) under R-GMS is:", "options": ["5 to 7 years", "1 to 3 years", "20 years", "10 years", "12 to 15 years"], "answer": 1, "explanation": "STBD tenure under R-GMS is 1 to 3 years and remains active for new deposits.", "difficulty": "Moderate"}, {"id": 113, "section": "Gold Monetisation Scheme (GMS)", "question": "Which of the following statements is NOT correct about GMS as per recent updates?", "options": ["Short-Term Bank Deposits (STBD) remain active for new deposits", "Medium & Long-Term (MLTGD) deposits are discontinued for new enrollments from March 2025", "MLTGD is also held on the bank's balance sheet", "STBD is held on the bank's balance sheet", "GMS deposits are exempt from Capital Gains Tax"], "answer": 2, "explanation": "This is incorrect (and hence the answer) — MLTGD is held on the GOVERNMENT OF INDIA's balance sheet, not the bank's; only STBD is on the bank's balance sheet.", "difficulty": "Hard"}, {"id": 114, "section": "Gold Monetisation Scheme (GMS)", "question": "As per RBI directives effective April 1, 2026, the tiered Loan-to-Value (LTV) ratio for gold loans up to ₹2.5 Lakh is:", "options": ["80%", "75%", "70%", "85%", "90%"], "answer": 3, "explanation": "For loans up to ₹2.5 Lakh, the LTV ratio is 85%; for ₹2.5–5 Lakh it is 80%; and above ₹5 Lakh it is 75%.", "difficulty": "Hard"}, {"id": 115, "section": "Gold Monetisation Scheme (GMS)", "question": "Consider the following statements about India's gold policy pillars:\n1. Gold Monetisation Scheme mobilises idle physical gold.\n2. Sovereign Gold Bond is a paper/digital gold investment issued by RBI.\n3. India Gold Coin uses refined gold from GMS.\n4. A dedicated Gold ETF Scheme is the fourth pillar of India's gold policy as per the document.\nWhich of the above statements are correct?", "options": ["1 and 4 only", "None of the above", "2, 3 and 4 only", "1, 2, 3 and 4", "1, 2 and 3 only"], "answer": 4, "explanation": "Statement 4 is incorrect — the document describes only THREE complementary pillars: GMS, SGB, and India Gold Coin; a Gold ETF Scheme is not listed as one of them.", "difficulty": "Moderate"}, {"id": 116, "section": "Gold Monetisation Scheme (GMS)", "question": "Income earned via GMS deposits is treated, for tax purposes, as:", "options": ["Not taxable (Income Tax exempt) and exempt from Capital Gains Tax", "Taxable only above ₹50,000", "Taxed at a flat 30%", "Fully taxable at the individual's slab rate", "None of the above"], "answer": 0, "explanation": "GMS deposits are exempt from both Income Tax and Capital Gains Tax arising from the deposits.", "difficulty": "Moderate"}, {"id": 117, "section": "Sovereign Gold Bond (SGB) Scheme", "question": "The Sovereign Gold Bond (SGB) Scheme was launched in:", "options": ["2018", "November 2015", "2017", "2021", "2023"], "answer": 1, "explanation": "SGB was launched in November 2015, issued by RBI on behalf of the Government of India.", "difficulty": "Easy"}, {"id": 118, "section": "Sovereign Gold Bond (SGB) Scheme", "question": "Consider the following statements about SGB:\n1. Government of India confirmed in Budget 2025 that no new SGB tranches will be issued.\n2. SGB tenure is 8 years, with an exit option after the 5th year.\n3. SGB carries a fixed interest rate of 2.50% per annum, paid half-yearly.\n4. SGBs are classified as corporate bonds regulated by SEBI.\nWhich of the above statements are correct?", "options": ["2, 3 and 4 only", "None of the above", "1, 2 and 3 only", "1, 2, 3 and 4", "1 and 4 only"], "answer": 2, "explanation": "Statement 4 is incorrect — SGBs are classified as GOVERNMENT SECURITIES under the Government Securities Act, 2006, not corporate bonds under SEBI. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 119, "section": "Sovereign Gold Bond (SGB) Scheme", "question": "The maximum annual investment limit for individuals in SGB is:", "options": ["20 kg", "10 kg", "2 kg", "4 kg", "1 kg"], "answer": 3, "explanation": "The annual maximum investment limit is 4 kg for individuals and HUFs, and 20 kg for Trusts and similar entities.", "difficulty": "Moderate"}, {"id": 120, "section": "Sovereign Gold Bond (SGB) Scheme", "question": "The SGB issue price is based on the simple average closing price of gold (999 purity) published by which body for the last 3 working days?", "options": ["World Gold Council", "SEBI", "MMTC", "RBI directly", "India Bullion and Jewellers Association Limited (IBJA)"], "answer": 4, "explanation": "SGB issue price is based on the simple average closing price published by IBJA for the last 3 working days preceding the subscription period.", "difficulty": "Moderate"}, {"id": 121, "section": "Sovereign Gold Bond (SGB) Scheme", "question": "Investors who subscribe to SGB online and pay via digital mode are offered a discount of:", "options": ["₹50 per gram", "₹10 per gram", "₹25 per gram", "No discount is offered", "₹100 per gram"], "answer": 0, "explanation": "An online discount of ₹50 per gram is provided for digital subscription and payment.", "difficulty": "Easy"}, {"id": 122, "section": "Sovereign Gold Bond (SGB) Scheme", "question": "Which of the following statements is NOT correct about SGB capital gains taxation (as of June 2026)?", "options": ["Held till 8-year maturity by the original subscriber: completely exempt from Capital Gains Tax", "TDS is applicable on SGB interest income", "Sold on stock exchange, holding period ≤ 12 months: STCG at slab rate", "Sold on stock exchange, holding period > 12 months: LTCG @ 12.5% without indexation", "Premature redemption after the 5th year via the RBI window: taxed as LTCG @ 12.5% without indexation"], "answer": 1, "explanation": "This is incorrect (and hence the answer) — the document explicitly states NO TDS is applicable on SGB interest income.", "difficulty": "Hard"}, {"id": 123, "section": "Sovereign Gold Bond (SGB) Scheme", "question": "The eligibility of NRIs to invest in SGB is:", "options": ["NRIs are eligible with special RBI permission only", "NRIs are fully eligible to invest", "NRIs are NOT eligible to purchase fresh SGBs, but residents who later became NRIs may hold existing bonds to maturity", "NRIs can only invest via the secondary market", "None of the above"], "answer": 2, "explanation": "NRIs are NOT eligible to invest in SGBs; however, residents who purchased SGBs and subsequently became NRIs may hold them to maturity but cannot purchase fresh bonds.", "difficulty": "Hard"}, {"id": 124, "section": "Sovereign Gold Bond (SGB) Scheme", "question": "The cash payment cap for SGB purchase (an AML/KYC requirement) is:", "options": ["₹50,000", "There is no cap", "₹10,000", "₹20,000", "₹1,00,000"], "answer": 3, "explanation": "Cash payment for SGB is capped at ₹20,000, as an AML/KYC requirement; higher amounts require DD, cheque or online banking.", "difficulty": "Moderate"}, {"id": 125, "section": "Sovereign Gold Bond (SGB) Scheme", "question": "Consider the following statements comparing SGB, GMS and Physical Gold:\n1. SGB offers 2.50% fixed interest; GMS (STBD) offers 0.50–1% p.a.; Physical Gold offers nil interest.\n2. Capital gains tax on SGB is exempt on maturity; on GMS it is exempt; on physical gold it is taxable.\n3. Storage cost for both SGB and GMS is nil.\n4. SGB carries a higher theft risk than physical gold, as per the document.\nWhich of the above statements are correct?", "options": ["1 and 4 only", "2, 3 and 4 only", "1, 2, 3 and 4", "None of the above", "1, 2 and 3 only"], "answer": 4, "explanation": "Statement 4 is incorrect — the document notes SGB carries 'Sovereign Guarantee' safety, while physical gold carries the theft risk; SGB does not carry higher theft risk. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 126, "section": "Sukanya Samriddhi Account (SSA)", "question": "The Sukanya Samriddhi Account (SSA), part of the Beti Bachao Beti Padhao campaign, was launched on:", "options": ["January 22, 2015", "April 1, 2023", "November 2015", "August 28, 2014", "May 9, 2015"], "answer": 0, "explanation": "SSA was launched on January 22, 2015, as part of the Beti Bachao Beti Padhao campaign.", "difficulty": "Easy"}, {"id": 127, "section": "Sukanya Samriddhi Account (SSA)", "question": "Consider the following statements about SSA eligibility:\n1. An account can be opened for a girl child from birth until she attains 10 years of age.\n2. Only one account per girl child is allowed, with a maximum of two accounts per family.\n3. A third account can be opened if twin girls are born in the second birth, or triplets in the first birth.\n4. From age 15, the account can be operated solely by the girl child herself, without a guardian.\nWhich of the above statements are correct?", "options": ["None of the above", "1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only"], "answer": 1, "explanation": "Statement 4 is incorrect — the account must be operated by the natural/legal guardian until the girl reaches 18 years, not 15. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 128, "section": "Sukanya Samriddhi Account (SSA)", "question": "The minimum and maximum annual deposit limits for SSA are:", "options": ["No limits are specified", "₹1,000 – ₹1 Lakh", "₹250 – ₹1.5 Lakh", "₹100 – ₹1 Lakh", "₹500 – ₹2 Lakh"], "answer": 2, "explanation": "SSA requires a minimum deposit of ₹250 per financial year, with a maximum of ₹1,50,000 (₹1.5 Lakh).", "difficulty": "Easy"}, {"id": 129, "section": "Sukanya Samriddhi Account (SSA)", "question": "The current SSA interest rate (for Q1 FY27) as per the document is:", "options": ["7.1%", "9.0%", "7.5%", "8.2%", "6.5%"], "answer": 3, "explanation": "SSA currently offers 8.2% per annum, compounded annually, and is reviewed quarterly.", "difficulty": "Easy"}, {"id": 130, "section": "Sukanya Samriddhi Account (SSA)", "question": "The maturity period of an SSA account from the date of opening is:", "options": ["Until marriage only, with no fixed period", "25 years", "18 years", "15 years", "21 years"], "answer": 4, "explanation": "SSA has a ma
