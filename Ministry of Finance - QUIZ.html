turity period of 21 years from the date of account opening.", "difficulty": "Moderate"}, {"id": 131, "section": "Sukanya Samriddhi Account (SSA)", "question": "Consider the following statements about SSA withdrawal rules:\n1. Partial withdrawal up to 50% of the balance is allowed for higher education.\n2. Eligibility for partial withdrawal arises when the girl turns 18 or passes Class 10, whichever is earlier.\n3. Premature closure for marriage is allowed after the girl turns 18, with application 1 month before or up to 3 months after the marriage date.\n4. Full maturity is reached 25 years after account opening.\nWhich of the above statements are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "None of the above"], "answer": 0, "explanation": "Statement 4 is incorrect — full maturity is 21 years after account opening, not 25. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 132, "section": "Sukanya Samriddhi Account (SSA)", "question": "SSA enjoys which special tax status?", "options": ["TEE (Taxed-Exempt-Exempt)", "EEE (Exempt-Exempt-Exempt)", "ETE (Exempt-Taxed-Exempt)", "TTE (Taxed-Taxed-Exempt)", "EET (Exempt-Exempt-Taxed)"], "answer": 1, "explanation": "SSA is one of the few Indian schemes with full EEE status — contributions, interest earned, and maturity amount are all tax-exempt.", "difficulty": "Easy"}, {"id": 133, "section": "Sukanya Samriddhi Account (SSA)", "question": "Which of the following statements is NOT correct when comparing SSA and PPF?", "options": ["SSA targets a girl child under 10 years; PPF is for all citizens", "SSA's tenure is 21 years while PPF's is 15 years (extendable)", "SSA allows unlimited accounts per family while PPF allows only one per individual", "SSA's maximum annual limit is ₹1.5 lakh, the same as PPF", "SSA's current interest rate (8.2%) is higher than PPF's (7.1%)"], "answer": 2, "explanation": "This is incorrect (and hence the answer) — SSA allows a MAXIMUM of two accounts per family (with narrow exceptions for twins/triplets), not unlimited accounts.", "difficulty": "Moderate"}, {"id": 134, "section": "Sukanya Samriddhi Account (SSA)", "question": "If the minimum ₹250 deposit is not made in a financial year, the SSA account is defaulted; it can be regularized by paying a penalty of:", "options": ["The account is permanently closed with no regularization possible", "₹100 flat, account remains active regardless", "No penalty is charged", "₹50 plus the minimum deposit for each year of default", "₹25 flat"], "answer": 3, "explanation": "A defaulted SSA account can be regularized by paying a penalty of ₹50 plus the minimum deposit (₹250) for each year of default.", "difficulty": "Moderate"}, {"id": 135, "section": "Mahila Samman Savings Certificate (MSSC)", "question": "The Mahila Samman Savings Certificate (MSSC) was available for new accounts/deposits from:", "options": ["January 2015 to 2020", "2021 to 2023", "2016 to 2018", "It remains open-ended with no end date", "April 1, 2023 to March 31, 2025"], "answer": 4, "explanation": "MSSC, announced in Budget 2023-24, was available for new investments from April 1, 2023 to March 31, 2025, and has since been discontinued for new accounts.", "difficulty": "Easy"}, {"id": 136, "section": "Mahila Samman Savings Certificate (MSSC)", "question": "Consider the following statements about MSSC features:\n1. Maximum investment aggregate across accounts is ₹2 Lakh.\n2. Minimum investment is ₹1,000, in multiples of ₹100.\n3. MSSC enjoys EEE tax status, similar to SSA.\n4. Tenure is 2 years with a fixed interest rate of 7.5% p.a.\nWhich of the above statements are correct?", "options": ["1, 2 and 4 only", "1, 3 and 4 only", "1, 2, 3 and 4", "2 and 3 only", "None of the above"], "answer": 0, "explanation": "Statement 3 is incorrect — MSSC does NOT have EEE status; the interest is taxable and there is no Section 80C deduction, unlike SSA. Statements 1, 2 and 4 are correct.", "difficulty": "Moderate"}, {"id": 137, "section": "Mahila Samman Savings Certificate (MSSC)", "question": "MSSC allows partial withdrawal of up to what percentage of the balance after one year from the opening date?", "options": ["50%", "40%", "25%", "60%", "No partial withdrawal is allowed"], "answer": 1, "explanation": "MSSC allows partial withdrawal of up to 40% of the balance, once, after one year from the opening date.", "difficulty": "Moderate"}, {"id": 138, "section": "Mahila Samman Savings Certificate (MSSC)", "question": "Premature closure of MSSC after 6 months (for a non-compassionate reason) results in the interest rate being reduced to:", "options": ["The full 7.5% is retained regardless", "7.0%", "5.5% (a 2% penalty)", "6.5%", "0%"], "answer": 2, "explanation": "If closed after 6 months without a compassionate reason, the interest rate is reduced by 2 percentage points, from 7.5% to 5.5%.", "difficulty": "Moderate"}, {"id": 139, "section": "Mahila Samman Savings Certificate (MSSC)", "question": "Which of the following statements is NOT correct about MSSC compassionate closure grounds?", "options": ["Life-threatening illness of the account holder qualifies as a compassionate ground", "Full interest (7.5%) is paid if the account is closed early on compassionate grounds", "Death of the guardian (for minor accounts) qualifies as a compassionate ground", "Compassionate closure requires the same minimum 6-month holding period as general premature closure", "Death of the account holder allows a full-interest payout on early closure"], "answer": 3, "explanation": "This is incorrect (and hence the answer) — compassionate closure is allowed at ANY time, with NO 6-month floor requirement, unlike general premature closure.", "difficulty": "Hard"}, {"id": 140, "section": "Mahila Samman Savings Certificate (MSSC)", "question": "Under MSSC, the tax treatment of TDS on interest is:", "options": ["None of the above", "TDS is deducted at 10%", "TDS is deducted at 20%", "TDS applies only above ₹1 lakh", "TDS does not apply per CBDT's May 2023 notification, though interest remains taxable and must be declared"], "answer": 4, "explanation": "CBDT explicitly notified in May 2023 that TDS does not apply to MSSC; however, the interest remains taxable and must be declared under 'Income from Other Sources.'", "difficulty": "Hard"}, {"id": 141, "section": "Mahila Samman Savings Certificate (MSSC)", "question": "MSSC accounts can be opened as:", "options": ["Individual accounts only — no joint accounts are permitted", "Joint accounts between two women", "Family accounts covering all members", "None of the above", "Corporate accounts for women-led enterprises"], "answer": 0, "explanation": "MSSC allows individual accounts only; joint accounts are not permitted.", "difficulty": "Easy"}, {"id": 142, "section": "Mahila Samman Savings Certificate (MSSC)", "question": "Consider the following statements comparing MSSC and SSA:\n1. MSSC's tenure is 2 years vs. SSA's up to 21 years.\n2. MSSC's interest is taxable with no Section 80C benefit; SSA is fully tax-free (EEE).\n3. MSSC's maximum investment is ₹2 lakh as a lump sum; SSA allows ₹1.5 lakh per financial year on a recurring basis.\n4. MSSC's purpose is long-term savings for a girl child's education/marriage, while SSA is a short-term general savings scheme for women.\nWhich of the above statements are correct?", "options": ["None of the above", "1, 2 and 3 only", "2, 3 and 4 only", "1 and 4 only", "1, 2, 3 and 4"], "answer": 1, "explanation": "Statement 4 is incorrect — it reverses the actual purposes: MSSC is the SHORT-TERM general savings scheme for women, while SSA is the LONG-TERM scheme for the girl child's education/marriage. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 143, "section": "RBI Retail Direct Scheme", "question": "The RBI Retail Direct Scheme was launched by PM Narendra Modi on:", "options": ["April 1, 2023", "January 22, 2015", "November 12, 2021", "2016", "September 2018"], "answer": 2, "explanation": "The RBI Retail Direct Scheme was launched on November 12, 2021, providing retail investors direct access to G-Secs.", "difficulty": "Easy"}, {"id": 144, "section": "RBI Retail Direct Scheme", "question": "To participate in the RBI Retail Direct Scheme, an individual must open a:", "options": ["Demat account with NSDL", "None of the above", "PPF account", "Retail Direct Gilt (RDG) Account with the RBI", "Sukanya Samriddhi account"], "answer": 3, "explanation": "Participation requires opening a Retail Direct Gilt (RDG) Account with the RBI.", "difficulty": "Easy"}, {"id": 145, "section": "RBI Retail Direct Scheme", "question": "Consider the following statements about the RDG account:\n1. There are no fees for opening or maintaining the RDG account.\n2. An individual can open only one RDG account (with an exception for the second holder in a joint account).\n3. Nomination is optional and not mandatory at account opening.\n4. Up to two nominees can be registered and can be changed later via the portal.\nWhich of the above statements are correct?", "options": ["1 and 3 only", "None of the above", "1, 2, 3 and 4", "2, 3 and 4 only", "1, 2 and 4 only"], "answer": 4, "explanation": "Statement 3 is incorrect — nomination is MANDATORY at the time of account opening, not optional. Statements 1, 2 and 4 are correct.", "difficulty": "Moderate"}, {"id": 146, "section": "RBI Retail Direct Scheme", "question": "Securities purchased through the RDG account are held in a:", "options": ["CSGL (Constituents' Subsidiary General Ledger) account with the RBI", "Physical certificate only, with no electronic record", "Demat account with CDSL", "The subscriber's savings bank account", "None of the above"], "answer": 0, "explanation": "Securities are held in a CSGL account with RBI; the RDG account is the retail interface over this CSGL, separate from NSDL/CDSL demat holdings but transferable via Value Free Transfer (VFT).", "difficulty": "Moderate"}, {"id": 147, "section": "RBI Retail Direct Scheme", "question": "The minimum investment for most G-Secs/T-Bills/SDLs on the RBI Retail Direct platform is:", "options": ["₹1 Lakh", "₹10,000", "₹1,000", "₹5,000", "₹50,000"], "answer": 1, "explanation": "The minimum investment is generally ₹10,000 (and multiples thereof) for most G-Secs/T-Bills/SDLs; for SGBs it is 1 gram.", "difficulty": "Moderate"}, {"id": 148, "section": "RBI Retail Direct Scheme", "question": "Consider the following statements about instruments permitted on the RBI Retail Direct platform:\n1. Treasury Bills (91, 182, 364 days).\n2. Government of India Dated Securities.\n3. State Development Loans.\n4. Listed Corporate Bonds.\nWhich of the above statements are correct?", "options": ["None of the above", "1, 2, 3 and 4", "1, 2 and 3 only", "2, 3 and 4 only", "1 and 4 only"], "answer": 2, "explanation": "Statement 4 is incorrect — Corporate Bonds are NOT among the five permitted instruments; the platform covers T-Bills, G-Secs, SDLs, SGBs and FRSBs. Statements 1–3 are correct.", "difficulty": "Moderate"}, {"id": 149, "section": "RBI Retail Direct Scheme", "question": "The Non-Competitive Bidding (NCB) limit per auction for Dated G-Secs under RBI Retail Direct is:", "options": ["5% of the notified amount", "1% of the notified amount", "₹5 crore (face value) per security", "₹2 crore (face value) per security", "10% of the notified amount"], "answer": 3, "explanation": "The NCB limit for Dated G-Secs is ₹2 crore (face value) per security per auction; T-Bills are 5% of notified amount, SDLs 1%, SGBs 4 kg per fiscal year.", "difficulty": "Hard"}, {"id": 150, "section": "RBI Retail Direct Scheme", "question": "Which of the following statements is NOT correct about the secondary market (NDS-OM) access under RBI Retail Direct?", "options": ["The RDG account gives access to the NDS-OM", "The standard institutional lot size on NDS-OM is ₹5 Crore", "Retail investors trade in the 'Odd Lot' segment with a minimum lot size of ₹10,000", "Investors wanting to place competitive bids must approach a Bank or Primary Dealer separately", "Competitive bidding is directly available for retail investors on the Retail Direct platform"], "answer": 4, "explanation": "This is incorrect (and hence the answer) — the platform supports ONLY non-competitive participation; investors wanting competitive bids must go through a Bank or Primary Dealer.", "difficulty": "Hard"}, {"id": 151, "section": "RBI Retail Direct Scheme", "question": "The RBI Retail Direct Mobile App, for easier access to the scheme, was launched in:", "options": ["May 2024", "November 2021", "2020", "2026", "2023"], "answer": 0, "explanation": "The RBI launched the RBI Retail Direct Mobile App in May 2024.", "difficulty": "Moderate"}, {"id": 152, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "The Sovereign Green Bond (SGrB) Scheme was announced in:", "options": ["Union Budget 2020-21", "Union Budget 2022-23", "Union Budget 2021-22", "Union Budget 2024-25", "Union Budget 2023-24"], "answer": 1, "explanation": "SGrB was announced in Union Budget 2022-23 (presented Feb 1, 2022); the framework was released on November 9, 2022, and first issuance occurred in January 2023.", "difficulty": "Easy"}, {"id": 153, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "Consider the following statements about SGrB's nature:\n1. SGrBs are a sub-category of Government Securities with a 'use of proceeds' restriction.\n2. SGrBs carry the same sovereign credit risk as regular G-Secs.\n3. SGrBs are considered a completely new asset class, distinct from G-Secs.\n4. The tenors issued at debut (FY2022-23) were 5-year and 10-year.\nWhich of the above statements are correct?", "options": ["1, 2, 3 and 4", "2, 3 and 4 only", "1, 2 and 4 only", "None of the above", "1 and 3 only"], "answer": 2, "explanation": "Statement 3 is incorrect — the document explicitly states SGrBs 'are NOT a new asset class'; they are a sub-category of G-Secs. Statements 1, 2 and 4 are correct.", "difficulty": "Moderate"}, {"id": 154, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "Which of the following is explicitly EXCLUDED (not eligible) under the SGrB 'use of proceeds' framework?", "options": ["Green Buildings", "Clean Transportation projects", "Sustainable Water Management projects", "Large Hydropower (>25 MW)", "Renewable Energy projects"], "answer": 3, "explanation": "Large Hydropower (>25 MW) is explicitly excluded to prevent greenwashing, along with fossil fuel projects, nuclear power, and several others.", "difficulty": "Moderate"}, {"id": 155, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "Consider the following statements about SGrB eligible green categories:\n1. Renewable Energy.\n2. Nuclear power generation.\n3. Climate Change Adaptation.\n4. Terrestrial & Aquatic Biodiversity Conservation.\nWhich of the above statements represent eligible SGrB categories?", "options": ["None of the above", "1 and 2 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1, 3 and 4 only"], "answer": 4, "explanation": "Statement 2 is incorrect — nuclear power generation is explicitly EXCLUDED from SGrB eligibility, not an eligible category. Statements 1, 3 and 4 are genuine eligible categories.", "difficulty": "Moderate"}, {"id": 156, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "Equity investment in green projects under the SGrB framework is permitted only for:", "options": ["Metro projects under the Clean Transportation category, through dedicated SPVs", "Any eligible green category", "Equity investment is not permitted at all", "Only biodiversity conservation projects", "Renewable energy SPVs"], "answer": 0, "explanation": "Equity investment is permitted only for metro projects under Clean Transportation (via dedicated SPVs); no equity investment is permissible for any other eligible category.", "difficulty": "Hard"}, {"id": 157, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "CNG (Compressed Natural Gas), despite being a fossil-based fuel, is allowed under the SGrB framework only for:", "options": ["Industrial power generation", "Public transportation projects (e.g., CNG buses) as a transitional cleaner fuel", "Private vehicle subsidies", "It is not allowed under any circumstances", "Household cooking gas subsidies"], "answer": 1, "explanation": "CNG is allowed only for public transportation projects (e.g., CNG buses) as a transitional cleaner fuel; private use subsidies are excluded.", "difficulty": "Hard"}, {"id": 158, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "Which of the following statements is NOT correct about SGrB reporting and oversight?", "options": ["All proceeds must be allocated within 24 months of issuance", "MoF publishes an Annual Allocation & Impact Report under the Green Finance Working Committee (GFWC)", "SGrB reports are kept strictly confidential and are not published publicly", "The Comptroller and Auditor General (CAG) audits the allocation and utilization of SGrB proceeds", "Eligible expenditures are limited to those incurred within 12 months prior to issuance"], "answer": 2, "explanation": "This is incorrect (and hence the answer) — reports are made PUBLICLY AVAILABLE on the DEA/MoF website specifically to ensure no greenwashing, not kept confidential.", "difficulty": "Moderate"}, {"id": 159, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "'Greenium', in the context of Sovereign Green Bonds, refers to:", "options": ["A green subsidy given directly to farmers", "The premium paid for gold bonds", "A carbon tax levied on polluting industries", "The difference between the yield on a normal G-Sec and a Sovereign Green Bond", "None of the above"], "answer": 3, "explanation": "Greenium is the difference between the interest rate (yield) on a normal G-Sec and an SGrB; it attracts dedicated ESG investors and diversifies the investor base.", "difficulty": "Moderate"}, {"id": 160, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "Under the Fully Accessible Route (FAR), Foreign Portfolio Investor (FPI) investment in SGrBs is subject to:", "options": ["None of the above", "A 50% ceiling", "A 10% investment ceiling", "Complete prohibition on FPI investment", "No investment ceiling; short-term, concentration and security-wise limits under the General Route are removed"], "answer": 4, "explanation": "Under FAR, there is no investment ceiling for FPIs/non-residents, and the three General Route restrictions (short-term limit, concentration limit, security-wise limit) have been removed for FAR securities.", "difficulty": "Hard"}, {"id": 161, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "As per the June 2026 tax reforms, interest income and capital gains for FPIs investing in SGrBs (from April 1, 2026) are:", "options": ["Fully exempt", "Taxable only on capital gains, not interest", "None of the above", "Taxable at applicable slab rates", "Taxable at 20%"], "answer": 0, "explanation": "As per the updated (June 2026) tax treatment, both interest income and capital gains for FPIs (from April 1, 2026) are fully exempt, while domestic investors remain taxable at slab rates with standard STCG/LTCG rules.", "difficulty": "Hard"}, {"id": 162, "section": "Sovereign Green Bond (SGrB) Scheme", "question": "Consider the following statements comparing SGrB, regular G-Sec, and SGB:\n1. All three are issued by RBI on behalf of the Government of India.\n2. SGrB use of proceeds is restricted to financing green projects, unlike a regular G-Sec.\n3. New issuances of SGB have been discontinued from Budget 2025, while SGrB and regular G-Sec issuances continue.\n4. Only SGB offers FAR eligibility; SGrB and regular G-Secs are not FAR eligible.\nWhich of the above statements are correct?", "options": ["1, 2, 3 and 4", "1, 2 and 3 only", "None of the above", "1 and 4 only", "2, 3 and 4 only"], "answer": 1, "explanation": "Statement 4 is incorrect — it is the reverse: SGrB and regular G-Secs (specified securities) ARE FAR eligible, while SGB's FAR eligibility is 'Not applicable' since SGB is only tradable in the secondary market. Statements 1–3 are correct.", "difficulty": "Hard"}];
async function loadData(){
  DATA = EMBEDDED_DATA;
  answers = DATA.map(()=>({chosen:null, correct:null, skipped:false}));
  renderStart();
}

function renderStart(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <div>
        <h1>NABARD Grade A Practice Quiz</h1>
        <div class="sub">Ministry of Finance — Institutional Guide, Pension &amp; Insurance Schemes, Financial Inclusion, Gold &amp; Bond Schemes</div>
      </div>
    </header>
    <div class="card">
      <p style="font-size:14.5px;line-height:1.6;">This quiz contains <b>${DATA.length} questions</b> in NABARD Grade A style — multi-statement "which of the above are correct" questions, direct fact questions, and "NOT correct" trap questions.</p>
      <p style="font-size:14.5px;line-height:1.6;">
        <b>Marking scheme:</b> +1 for correct, −0.25 for wrong, 0 for skipped.<br>
        You'll get instant feedback and an explanation after every answer.
      </p>
      <button class="startbtn" onclick="startQuiz()">Start Quiz →</button>
    </div>
  `;
}

function startQuiz(){
  idx = 0;
  renderQuestion();
}

function computeScore(){
  let sc = 0, correct=0, wrong=0, skipped=0, attempted=0;
  answers.forEach(a=>{
    if(a.skipped){ skipped++; }
    else if(a.chosen !== null){
      attempted++;
      if(a.correct){ sc += 1; correct++; }
      else { sc -= 0.25; wrong++; }
    } else {
      skipped++;
    }
  });
  return {sc, correct, wrong, skipped, attempted};
}

function renderScorebar(){
  const {sc, correct, wrong, skipped} = computeScore();
  const maxPossible = DATA.length;
  return `
    <div class="scorebar">
      <div><span>Question</span><b>${idx+1} / ${DATA.length}</b></div>
      <div><span>Score</span><b>${sc.toFixed(2)} / ${maxPossible}</b></div>
      <div><span>Correct</span><b style="color:#7fd19a">${correct}</b></div>
      <div><span>Wrong</span><b style="color:#e08a6a">${wrong}</b></div>
      <div><span>Skipped</span><b style="color:#93a2b3">${skipped}</b></div>
    </div>
    <div class="progress-outer"><div class="progress-inner" style="width:${((idx)/DATA.length*100).toFixed(1)}%"></div></div>
  `;
}

const LETTERS = ['A','B','C','D','E'];

function renderQuestion(){
  const app = document.getElementById('app');
  const q = DATA[idx];
  const a = answers[idx];
  const answered = a.chosen !== null || a.skipped;

  let optsHtml = q.options.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = answered ? 'disabled' : '';
    if(answered){
      if(i === q.answer) cls += ' correct';
      else if(i === a.chosen) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" ${disabledAttr} onclick="selectOption(${i})">
      <span class="lab">${LETTERS[i]}</span>
      <span>${escapeHtml(opt)}</span>
    </button>`;
  }).join('');

  let explainHtml = '';
  if(answered){
    let tag = a.skipped ? `<span class="feedback-tag skipped">SKIPPED</span>` :
              a.correct ? `<span class="feedback-tag correct">CORRECT</span>` :
              `<span class="feedback-tag wrong">INCORRECT</span>`;
    explainHtml = `
      <div class="explain">
        ${tag}
        <div><b>Correct answer: ${LETTERS[q.answer]}) ${escapeHtml(q.options[q.answer])}</b></div>
        <div style="margin-top:8px;">${escapeHtml(q.explanation)}</div>
      </div>
    `;
  }

  app.innerHTML = `
    <header>
      <div>
        <h1>NABARD Grade A Practice Quiz</h1>
        <div class="sub">${escapeHtml(q.section)}</div>
      </div>
    </header>
    ${renderScorebar()}
    <div class="card">
      <div class="qmeta">
        <span class="qnum">Question ${idx+1}</span>
        <span class="diff ${q.difficulty}">${q.difficulty}</span>
      </div>
      <div class="qtext">${escapeHtml(q.question)}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="actions">
        ${!answered ? `<button class="ctrl skip" onclick="skipQuestion()">Skip →</button>` : ''}
        ${answered ? `<button class="ctrl next" onclick="nextQuestion()">${idx===DATA.length-1 ? 'Finish Quiz →' : 'Next Question →'}</button>` : ''}
      </div>
    </div>
  `;
}

function selectOption(i){
  const q = DATA[idx];
  const a = answers[idx];
  if(a.chosen !== null || a.skipped) return;
  a.chosen = i;
  a.correct = (i === q.answer);
  a.skipped = false;
  renderQuestion();
}

function skipQuestion(){
  const a = answers[idx];
  if(a.chosen !== null || a.skipped) return;
  a.skipped = true;
  renderQuestion();
}

function nextQuestion(){
  if(idx < DATA.length - 1){
    idx++;
    renderQuestion();
  } else {
    renderFinal();
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

let reviewFilter = 'all';

function renderFinal(){
  const {sc, correct, wrong, skipped, attempted} = computeScore();
  const accuracy = attempted > 0 ? ((correct/attempted)*100).toFixed(1) : '0.0';
  const app = document.getElementById('app');

  const missed = DATA.map((q,i)=>({q, a:answers[i], i})).filter(x => x.a.skipped || (x.a.chosen!==null && !x.a.correct));

  app.innerHTML = `
    <header><h1>Final Scorecard</h1></header>
    <div class="final">
      <div class="bigscore">
        <div class="n">${sc.toFixed(2)} / ${DATA.length}</div>
        <div class="l">Total Score (NABARD marking: +1 correct, −0.25 wrong, 0 skipped)</div>
      </div>
      <div class="grid4">
        <div class="stat"><div class="n" style="color:#7fd19a">${correct}</div><div class="l">Correct</div></div>
        <div class="stat"><div class="n" style="color:#e08a6a">${wrong}</div><div class="l">Wrong</div></div>
        <div class="stat"><div class="n" style="color:#93a2b3">${skipped}</div><div class="l">Skipped</div></div>
        <div class="stat"><div class="n" style="color:#e0c060">${accuracy}%</div><div class="l">Accuracy (attempted)</div></div>
      </div>
      <p style="font-size:13px;color:var(--muted);text-align:center;">Attempted: ${attempted} / ${DATA.length} questions</p>
      <div style="text-align:center;margin:14px 0 24px;">
        <button class="ctrl next" onclick="restartQuiz()">Restart Quiz ↺</button>
      </div>
    </div>

    <h2 style="margin-top:28px;">Review — Missed &amp; Skipped (${missed.length})</h2>
    <div id="reviewlist">
      ${missed.length === 0 ? '<p style="color:var(--muted)">Great job — nothing missed or skipped!</p>' : missed.map(x => `
        <div class="reviewitem">
          <div style="margin-bottom:8px;">
            <span class="rtag ${x.a.skipped ? 'skipped' : 'wrong'}">${x.a.skipped ? 'SKIPPED' : 'WRONG'}</span>
            <span class="qnum">Q${x.i+1} · ${escapeHtml(x.q.section)}</span>
          </div>
          <div class="qtext" style="margin-bottom:10px;">${escapeHtml(x.q.question)}</div>
          ${!x.a.skipped ? `<div style="margin-bottom:6px;color:#e08a6a;">Your answer: ${LETTERS[x.a.chosen]}) ${escapeHtml(x.q.options[x.a.chosen])}</div>` : ''}
          <div style="margin-bottom:6px;color:#7fd19a;">Correct answer: ${LETTERS[x.q.answer]}) ${escapeHtml(x.q.options[x.q.answer])}</div>
          <div style="font-size:13px;color:var(--muted);margin-top:8px;">${escapeHtml(x.q.explanation)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function restartQuiz(){
  answers = DATA.map(()=>({chosen:null, correct:null, skipped:false}));
  idx = 0;
  renderQuestion();
}

loadData();
</script>
</body>
</html>
