s the excessive PTH secretion due to hypocalcemia, seen in livestock on high-bran diets or pets on all-meat diets lacking supplements.", "sprint": false, "id": 106}, {"topic": "Nutrient Deficiencies in Livestock", "type": "statement", "difficulty": "Hard", "passage": "1. Phosphorus deficiency is a possibility when pasture contains less than 0.25% phosphorus.\n2. Cobalt deficiency shows symptoms including anemia, loss of appetite and progressive emaciation.\n3. Selenium deficiency is noticed in animals grazed on fodders in acidic soils with excess nitrate fertilizers.\n4. Zinc deficiency in sheep causes loss of wool and thick wrinkled skin.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "Only 3", "B": "2 and 3", "C": "None of the above", "D": "Only 1", "E": "1 and 4"}, "correct": "A", "explanation": "Statement 3 is incorrect — Selenium deficiency is noticed in animals grazed on fodders in alkaline soils (not acidic) and areas using excess sulphate fertilizers (not nitrate). Statements 1, 2 and 4 are correctly stated.", "sprint": true, "id": 107}, {"topic": "Vaccination Programmes (Sheep, Goat & Dairy Cattle)", "type": "statement", "difficulty": "Hard", "passage": "1. In the goat/sheep vaccination programme, Anthrax primary vaccination is given at 6 months of age for kid/lamb, with regular vaccination once annually in affected areas only.\n2. Enterotoxaemia primary vaccination is given at 4 months of age for kid/lamb if the dam is vaccinated, or at 1st week of age if the dam is not vaccinated.\n3. Foot & Mouth Disease (F.M.D.) regular vaccination is given once annually before monsoon.\n4. P.P.R. regular vaccination is given once in three years.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "1 and 2", "B": "Only 1", "C": "Only 3", "D": "3 and 4", "E": "None of the above"}, "correct": "C", "explanation": "Statement 3 is incorrect — F.M.D. regular vaccination for goats/sheep is given TWICE a year (September & March), not once annually. Statements 1, 2 and 4 are correctly stated as per the vaccination programme for goats.", "sprint": true, "id": 108}, {"topic": "Vaccination Programmes (Sheep, Goat & Dairy Cattle)", "type": "statement", "difficulty": "Hard", "passage": "1. In the dairy cattle vaccination programme, Foot and Mouth Disease (FMD) first dose is given at 4 months and above, with a booster 1 month later, and subsequent doses six-monthly.\n2. Brucellosis vaccination (for female calves only) is given at 4-8 months of age, once in a lifetime.\n3. Theileriosis vaccination at 3 months and above is required for all cattle including indigenous breeds, given six-monthly.\n4. Haemorrhagic Septicaemia (HS) is given from 6 months and above, annually in endemic areas.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "1 and 2", "B": "Only 3", "C": "Only 1", "D": "3 and 4", "E": "None of the above"}, "correct": "B", "explanation": "Statement 3 is incorrect on two counts — Theileriosis vaccination is required ONLY for crossbred and exotic cattle (not all cattle), and it is given once in a lifetime (not six-monthly). Statements 1, 2 and 4 are correctly stated.", "sprint": true, "id": 109}, {"topic": "Vaccination Programmes (Sheep, Goat & Dairy Cattle)", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "In the dairy cattle vaccination programme, how frequently should the IBR vaccine's subsequent dose be given (noting the vaccine is presently not produced in India)?", "options": {"A": "Quarterly", "B": "Once in a lifetime", "C": "Annually", "D": "Once in three years", "E": "Six monthly"}, "correct": "E", "explanation": "IBR vaccination in dairy cattle requires a first dose (3 months+), a booster 1 month later, and subsequent doses six-monthly; the chapter notes the vaccine is presently not produced in India.", "sprint": false, "id": 110}, {"topic": "Vaccination Programmes (Sheep, Goat & Dairy Cattle)", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "For post-bite Rabies therapy in dairy cattle, after the first dose administered immediately following a suspected bite and a 4th-day booster, subsequent doses are given on which days?", "options": {"A": "1, 2, 3 days only", "B": "3, 6, 9 and 12 days", "C": "7, 14, 28 and 90 (optional) days", "D": "15, 30, 45, 60 days", "E": "10, 20, 30 days only"}, "correct": "C", "explanation": "Post-bite rabies therapy doses (after the immediate first dose and 4th-day booster) are given on the 7th, 14th, 28th, and 90th (optional) days.", "sprint": false, "id": 111}, {"topic": "Vaccination Programmes (Sheep, Goat & Dairy Cattle)", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "In the goat/sheep vaccination programme, when is the Goat Pox vaccine given as regular annual vaccination?", "options": {"A": "March month", "B": "September month", "C": "May month", "D": "December month", "E": "January month"}, "correct": "D", "explanation": "Goat Pox regular vaccination is given once annually in December month, for kids aged 3 months and above.", "sprint": false, "id": 112}, {"topic": "Floor Space Norms & Milk Composition", "type": "figure", "difficulty": "Moderate", "passage": null, "stem": "As per the floor space requirement norms for cattle and buffaloes, what is the covered floor space (m²) required per adult cow?", "options": {"A": "1.0", "B": "7.0", "C": "12.0", "D": "3.5", "E": "4.0"}, "correct": "D", "explanation": "The covered floor space requirement for cows is 3.5 m² (with 7.0 m² open area), housing a maximum of 50 animals per pen.", "sprint": false, "id": 113}, {"topic": "Floor Space Norms & Milk Composition", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "What is the covered floor space (m²) required per bull, as per the norms table?", "options": {"A": "12.0", "B": "4.0", "C": "1.0", "D": "7.0", "E": "3.5"}, "correct": "A", "explanation": "Bulls require 12.0 m² covered area and 24.0 m² open area, housed one per pen — the largest individual space requirement among cattle categories listed.", "sprint": false, "id": 114}, {"topic": "Floor Space Norms & Milk Composition", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "As per the floor space norms, what is the recommended shed height for cattle and buffaloes in medium/heavy rainfall areas versus dry areas?", "options": {"A": "150 cm in rainfall areas, 300 cm in dry areas", "B": "200 cm in both cases", "C": "175 cm in medium/heavy rainfall areas, 220 cm in dry areas", "D": "175 cm in dry areas, 220 cm in rainfall areas", "E": "220 cm in both cases"}, "correct": "C", "explanation": "The shed height for cattle/buffaloes is 175 cm in medium and heavy rainfall areas, and 220 cm in dry areas.", "sprint": false, "id": 115}, {"topic": "Floor Space Norms & Milk Composition", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "As per the composition of milk from important milch breeds, which breed has the highest Total Solids and Fat percentage among Red Sindhi, Jersey, Friesian, and Crossbred?", "options": {"A": "Friesian", "B": "Jersey", "C": "Crossbred", "D": "Red Sindhi", "E": "All are equal"}, "correct": "B", "explanation": "Jersey has the highest Total Solids (14.91%) and Fat (5.37%) among the four breeds compared, consistent with Jersey being noted as the highest-fat exotic breed.", "sprint": false, "id": 116}, {"topic": "Floor Space Norms & Milk Composition", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "What does 'SNF' stand for in the context of milk composition?", "options": {"A": "Standard Nutrient Factor", "B": "Solid Neutral Fat", "C": "Solid Not Fat", "D": "Simple Non-Fat", "E": "Skimmed Natural Fat"}, "correct": "C", "explanation": "SNF stands for Solid Not Fat — it contains everything in milk except fat and water, i.e., minerals, proteins, etc.", "sprint": false, "id": 117}, {"topic": "Floor Space Norms & Milk Composition", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Under the influence of which hormone is milk released by alveoli, a process called 'milk ejection' or the 'let-down reflex'?", "options": {"A": "Cortisol", "B": "Prolactin", "C": "Progesterone", "D": "Oxytocin", "E": "Estrogen"}, "correct": "D", "explanation": "Milk release by alveoli under the influence of oxytocin hormone is called 'milk ejection' or the 'let-down reflex'.", "sprint": false, "id": 118}, {"topic": "Floor Space Norms & Milk Composition", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "What is the average lactation period duration, defined as the period of milk production between birth and the next pregnancy?", "options": {"A": "365 days", "B": "210 days", "C": "180 days", "D": "300 days", "E": "120 days"}, "correct": "D", "explanation": "Lactation period usually lasts about 300 days — the period of milk production between the birth of a young one and the next pregnancy.", "sprint": false, "id": 119}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "passage", "difficulty": "Moderate", "passage": "Breeds of this class belong to the Asian continent and are characterised by a large body with heavy bones, feathered shanks, red ear lobes, and yellow skin. They are used for both egg and meat purposes, and their egg shells are light to dark brown in colour. Important breeds include one from the Brahmaputra valley in India, and two others originating from China.", "stem": "________ describes which classification of poultry breeds based on origin?", "options": {"A": "None of the above", "B": "Mediterranean class", "C": "Asiatic class", "D": "American class", "E": "English class"}, "correct": "C", "explanation": "The Asiatic class includes breeds from the Asian continent — large body, heavy bones, feathered shanks, red ear lobes, yellow skin; e.g., Brahma (Brahmaputra valley, India), Cochin and Langshan (China).", "sprint": false, "id": 120}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "passage", "difficulty": "Moderate", "passage": "Breeds of this class belong to the Asian continent and are characterised by a large body with heavy bones, feathered shanks, red ear lobes, and yellow skin. They are used for both egg and meat purposes, and their egg shells are light to dark brown in colour. Important breeds include one from the Brahmaputra valley in India, and two others originating from China.", "stem": "Which of the following is an important breed belonging to this class, originating from the Brahmaputra valley in India?", "options": {"A": "Rhode Island Red", "B": "Minorca", "C": "Cochin", "D": "Leghorn", "E": "Brahma"}, "correct": "E", "explanation": "Brahma is the important Asiatic-class breed originating from the Brahmaputra valley in India, known for its massive body, heavy bones, and pea comb.", "sprint": false, "id": 121}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which poultry breed of the Asiatic class, abundant in Madhya Pradesh and bred by tribals, has black flesh due to melanin and lays light brown eggs?", "options": {"A": "Asil", "B": "Brahma", "C": "Cochin", "D": "Longson", "E": "Kadaknath"}, "correct": "E", "explanation": "Kadaknath is a fowl with black flesh (due to melanin), abundant in Madhya Pradesh, bred by tribals, and lays light brown eggs.", "sprint": false, "id": 122}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which Asiatic-class poultry breed originated in the Chittagong and Comilla districts of Bangladesh and is very skilled in fighting?", "options": {"A": "Cochin", "B": "Kadaknath", "C": "Longson", "D": "Asil", "E": "Brahma"}, "correct": "D", "explanation": "Asil originated from Chittagong and Comilla districts of Bangladesh, is very skilled in fighting, big-sized, and famous for meat production.", "sprint": false, "id": 123}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "Rhode Island Red, known for its hardy nature and large brown-shelled eggs, belongs to which class of poultry breeds based on origin?", "options": {"A": "None of the above", "B": "American class", "C": "English class", "D": "Mediterranean class", "E": "Asiatic class"}, "correct": "B", "explanation": "Rhode Island Red belongs to the American class, developed in the United States generally by crossing Mediterranean and Asian types.", "sprint": false, "id": 124}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which American-class poultry breed was developed by crossing barred Plymouth Rock males with New Hampshire females, making it the newest of the American breeds?", "options": {"A": "Rhode Island White", "B": "New Hampshire", "C": "Delawares", "D": "Plymouth Rock", "E": "Wyandotte"}, "correct": "C", "explanation": "Delawares were developed by crossing barred Plymouth Rock males with New Hampshire females, the newest of the American breeds.", "sprint": false, "id": 125}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which poultry breed of the English class is also known as 'Indian Game' and is considered the source of most modern broiler breeds?", "options": {"A": "Orpington", "B": "Cornish", "C": "Sussex", "D": "Wyandotte", "E": "Australorp"}, "correct": "B", "explanation": "Cornish (Cornwall, UK), also known as Indian Game, is a perfect dual-purpose chicken and the source breed for most modern broiler chicken breeds.", "sprint": false, "id": 126}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which Mediterranean-class poultry breed is known as the world's No. 1 egg-producing breed?", "options": {"A": "Fayoumi", "B": "Leghorn", "C": "Cornish", "D": "Ancona", "E": "Minorca"}, "correct": "B", "explanation": "Leghorn, from Italy, is known for its stylish carriage and is the world's No. 1 egg-producing breed.", "sprint": false, "id": 127}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Minorca, also known as 'Red faced black Spanish', originating from Spain, is notable for being:", "options": {"A": "An Asiatic-class breed", "B": "A pure broiler-only breed", "C": "The smallest Mediterranean breed", "D": "A dual-purpose American breed", "E": "The largest and heaviest of all Mediterranean breeds of poultry"}, "correct": "E", "explanation": "Minorca is the largest and heaviest of all Mediterranean breeds of poultry, also known as Red faced black Spanish.", "sprint": false, "id": 128}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "statement", "difficulty": "Hard", "passage": "1. Broilers are reared for meat production only, examples being Cornish, Plymouth Rock, Cochin, Brahma and Asil.\n2. Layers are used for egg production, examples being Leghorn, Minorca, Ancona, Fayoumi, Isa Brown.\n3. Broilers attain a body weight of around 2.2-2.4 kg within 6 weeks.\n4. Layers attain a body weight of 2.2-2.4 kg at sexual maturity (20-22 weeks), same as broilers.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "Only 3", "B": "None of the above", "C": "1 and 2", "D": "Only 4", "E": "3 and 4"}, "correct": "D", "explanation": "Statement 4 is incorrect — layers attain a body weight of only 1.5-1.8 kg at sexual maturity (20-22 weeks), not 2.2-2.4 kg (which is the broiler figure at 6 weeks). Statements 1, 2 and 3 are correctly stated.", "sprint": true, "id": 129}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Layers typically attain sexual maturity around which age and continue laying eggs up to what age?", "options": {"A": "16 weeks maturity, laying up to 60 weeks", "B": "8 weeks maturity, laying up to 52 weeks", "C": "12-14 weeks maturity, laying up to 40 weeks", "D": "20-22 weeks maturity, laying up to 72 weeks", "E": "30 weeks maturity, laying up to 100 weeks"}, "correct": "D", "explanation": "Layers attain sexual maturity around 20-22 weeks and continue laying eggs up to 72 weeks of age, after which they are moulted or sold as spent hens.", "sprint": false, "id": 130}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "Among commercial layer breeds in India, which of the following has the highest net egg production at 72 weeks as per the chapter's data — ILI-80, Golden-92, Priya, Sonali or Devendra?", "options": {"A": "Devendra (200 eggs)", "B": "Sonali (275 eggs)", "C": "ILI-80 (280 eggs)", "D": "Golden-92 (265 eggs)", "E": "Priya (290 eggs)"}, "correct": "E", "explanation": "Priya has the highest net egg production at 72 weeks among the listed commercial layer breeds, with 290 eggs.", "sprint": false, "id": 131}, {"topic": "Poultry Breed Classification (Origin & Utility)", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which type of comb is the distinguishing feature found ONLY in the Sicilian Buttercup breed among the examples given?", "options": {"A": "Rose comb", "B": "Buttercup comb", "C": "V-shaped comb", "D": "Single comb", "E": "Pea comb"}, "correct": "B", "explanation": "The Buttercup comb is found exclusively in the Sicilian Buttercup breed, as noted in the chapter's list of comb types and associated breeds.", "sprint": false, "id": 132}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "statement", "difficulty": "Hard", "passage": "1. The Deep Litter system saves labour involved in frequent cleaning of faecal matter but requires periodical stirring.\n2. In the Cage system, the floor area provided is 450-525 sq. cm per bird.\n3. 'Fatty liver syndrome' in caged layers can be reduced by adding choline, vitamin B12, inositol and vitamin E to the diet.\n4. The Deep Litter system has a higher incidence of blood spots in eggs compared to the Cage system.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "Only 4", "B": "1 and 2", "C": "Only 1", "D": "None of the above", "E": "3 and 4"}, "correct": "A", "explanation": "Statement 4 is incorrect and reversed — it is the CAGE system (not deep litter) that has a higher incidence of blood spots in eggs, listed as a disadvantage of caging. Statements 1, 2 and 3 are correctly stated.", "sprint": true, "id": 133}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "As per the floor space requirement for poultry layers, what is the floor space (sq. ft.) needed per bird in the Deep Litter system during the 18-72 weeks age group?", "options": {"A": "1.25", "B": "0.30", "C": "0.60", "D": "1.50", "E": "0.65"}, "correct": "D", "explanation": "For layers aged 18-72 weeks in the deep litter system, the floor space requirement is 1.50 sq. ft. per bird (vs 0.65 sq. ft. in cages for the same age group).", "sprint": false, "id": 134}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "In the Elevated Cage system, what is the distance maintained between two supporting concrete pillars?", "options": {"A": "30-33 feet", "B": "2 feet", "C": "20-25 feet", "D": "6-7 feet", "E": "10 feet"}, "correct": "E", "explanation": "In the Elevated Cage system, the distance between two pillars is 10 feet, with the shed height raised by 6-7 feet using concrete pillars.", "sprint": false, "id": 135}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "As per management practices for broilers, what is the recommended poultry house temperature during the 1st week?", "options": {"A": "80°F", "B": "70°F", "C": "95°F", "D": "100°F", "E": "60°F"}, "correct": "C", "explanation": "The recommended poultry house temperature for broilers during the 1st week is 95°F, reduced at the rate of 5°F weekly until reaching 70°F by the 6th week.", "sprint": false, "id": 136}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "The management of birds during 9-20 weeks of age, or up to the point of laying, is referred to as which period?", "options": {"A": "Brooder period", "B": "Starter period", "C": "Layer period", "D": "Finisher period", "E": "Grower period"}, "correct": "E", "explanation": "The 9-20 weeks age period (up to the point of laying) is called the Grower period.", "sprint": false, "id": 137}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "As per the Egg Production Cycle, the typical production cycle lasts about how many months and involves how many distinct phases?", "options": {"A": "6 months, 1 phase", "B": "24 months, 4 phases", "C": "17 months, 3 phases", "D": "12 months, 2 phases", "E": "9 months, 3 phases"}, "correct": "C", "explanation": "The typical egg production cycle lasts about 17 months (72 weeks) and involves three distinct phases: brooders (0-8 weeks), growers (9-20 weeks), and layers (21-72 weeks).", "sprint": false, "id": 138}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "figure", "difficulty": "Moderate", "passage": null, "stem": "What is the optimum temperature that eggs need during natural incubation, especially in the early stage when the embryo is microscopic?", "options": {"A": "45°C", "B": "38°C", "C": "41°C", "D": "33°C", "E": "35°C"}, "correct": "B", "explanation": "During natural incubation, eggs need a controlled optimum temperature of 38°C, especially in the early stages when the embryo is microscopic.", "sprint": false, "id": 139}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "What hatchability percentage is considered normal for natural incubation, with a satisfactory range given in the chapter?", "options": {"A": "100%", "B": "65-75%", "C": "75-80% (80% considered normal)", "D": "50-60%", "E": "90-95%"}, "correct": "C", "explanation": "A hatchability of 80% (of eggs set) from natural incubation is normal, with a range of 75-80% considered satisfactory. Artificial incubation using parched rice/husk gives 65-75% hatchability.", "sprint": false, "id": 140}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "In artificial incubators, the relative humidity should be maintained around what percentage during the first 18 days, increasing to what percentage in the last 3 days?", "options": {"A": "40% then 50%", "B": "70% then 80%", "C": "50% then 60%", "D": "80% then 90%", "E": "60% then 70%"}, "correct": "E", "explanation": "Relative humidity in artificial incubators should be around 60% during the first 18 days of incubation and 70% during the last 3 days for optimum hatchability.", "sprint": false, "id": 141}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Eggs are candled on which two days during artificial incubation to identify infertile eggs and dead embryos?", "options": {"A": "Days 5 and 13", "B": "Days 1 and 7", "C": "Days 10 and 20", "D": "Days 3 and 15", "E": "Days 7 and 21"}, "correct": "A", "explanation": "Eggs are candled on days 5 and 13 during artificial incubation to identify infertile eggs/dead embryos and assess embryo development.", "sprint": false, "id": 142}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "figure", "difficulty": "Moderate", "passage": null, "stem": "As per Agmark grading of eggs, what is the air-cell depth allowed for an A-grade egg?", "options": {"A": "2 mm", "B": "10 mm", "C": "8 mm", "D": "6 mm", "E": "4 mm"}, "correct": "E", "explanation": "An A-grade egg under Agmark has a clean, unbroken shell with an air-cell depth of 4 mm; B-grade allows 8 mm air-cell depth.", "sprint": false, "id": 143}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "figure", "difficulty": "Moderate", "passage": null, "stem": "As per the egg grading by weight, what is the weight range for a 'Large' sized egg?", "options": {"A": "53-59 g", "B": "45-52 g", "C": "60 g and above", "D": "38-44 g", "E": "30-37 g"}, "correct": "A", "explanation": "Grading of eggs by weight: Extra large 60 g, Large 53-59 g, Medium 45-52 g, Small 38-44 g.", "sprint": false, "id": 144}, {"topic": "Poultry Housing, Egg Production & Hatching", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which government certifying agency issues the AGMARK quality certification for agricultural products in India, as mentioned in the egg grading section?", "options": {"A": "National Dairy Development Board", "B": "Indian Council of Agricultural Research", "C": "Directorate of Marketing and Inspection", "D": "Bureau of Indian Standards", "E": "Food Safety and Standards Authority of India"}, "correct": "C", "explanation": "AGMARK's certifying agency is the Directorate of Marketing and Inspection, Government of India.", "sprint": false, "id": 145}, {"topic": "Poultry Diseases & Vaccination", "type": "passage", "difficulty": "Moderate", "passage": "This is one of the most destructive diseases in broilers, capable of causing up to 100% mortality. It is caused by a paramyxo virus, with chicken as the natural host, though ducks and turkeys are also susceptible. Clinical signs include sneezing, cough, gasping for breath, depression, greenish watery diarrhoea, and twisting of the head in the neurotropic form.", "stem": "________ is being described above. Identify the disease.", "options": {"A": "Fowl Pox", "B": "Gumboro Disease", "C": "Ranikhet Disease (New Castle disease)", "D": "Avian Influenza", "E": "Marek's Disease"}, "correct": "C", "explanation": "Ranikhet Disease (New Castle disease), caused by a paramyxo virus, is one of the most destructive poultry diseases, up to 100% mortality in broilers, with the described neurotropic symptoms.", "sprint": false, "id": 146}, {"topic": "Poultry Diseases & Vaccination", "type": "passage", "difficulty": "Moderate", "passage": "This is one of the most destructive diseases in broilers, capable of causing up to 100% mortality. It is caused by a paramyxo virus, with chicken as the natural host, though ducks and turkeys are also susceptible. Clinical signs include sneezing, cough, gasping for breath, depression, greenish watery diarrhoea, and twisting of the head in the neurotropic form.", "stem": "Which of the following statements about this disease's causative agent and susceptibility is correct?", "options": {"A": "It is caused by a paramyxo virus and chicken is the natural host, though ducks/turkeys are also susceptible", "B": "It is caused by a bacteria and affects only chickens", "C": "It only affects birds above 2 years of age", "D": "It has no known causative agent identified yet", "E": "It is caused by a protozoan parasite affecting only ducks"}, "correct": "A", "explanation": "Ranikhet Disease is caused by a paramyxo virus; chicken is the natural host, but ducks and turkeys are also susceptible to infection.", "sprint": false, "id": 147}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which viral poultry disease is caused by the Influenza Type A virus (H5N1) and has zoonotic as well as pandemic potential?", "options": {"A": "Gumboro Disease", "B": "Avian Influenza (Bird Flu)", "C": "Ranikhet Disease", "D": "Fowl Pox", "E": "Infectious Bronchitis"}, "correct": "B", "explanation": "Avian Influenza (Bird Flu), caused by Influenza Type A virus (H5N1), has zoonotic and pandemic potential, with mortality rates of 50-100%.", "sprint": false, "id": 148}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which poultry disease targets the Bursa of Fabricius, an important part of the immune system, making chicks around 3 weeks old most susceptible?", "options": {"A": "Avian Leucosis", "B": "Egg Drop Syndrome", "C": "Infectious Bronchitis", "D": "Marek's Disease", "E": "Gumboro Disease (Infectious Bursal Disease)"}, "correct": "E", "explanation": "Gumboro Disease (Infectious Bursal Disease/IBD) targets the Bursa of Fabricius; chicks of 3 weeks age are most susceptible as immunity weakens.", "sprint": false, "id": 149}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which viral poultry disease is caused by a Herpes Virus, resulting in enlarged nerves, tumour formation, and immunosuppression in affected birds?", "options": {"A": "Fowl Pox", "B": "Gumboro Disease", "C": "Marek's Disease", "D": "Infectious Bronchitis", "E": "Egg Drop Syndrome"}, "correct": "C", "explanation": "Marek's Disease is caused by a Herpes Virus, causing enlarged nerves, tumour formation, and immunosuppression, making birds susceptible to other infections.", "sprint": false, "id": 150}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which poultry disease, caused by an adenovirus, produces a sudden and variable drop (30-40%) in egg production along with depigmented, cracked, or shell-less eggs?", "options": {"A": "Avian Leucosis", "B": "Gumboro Disease", "C": "Egg Drop Syndrome", "D": "Infectious Bronchitis", "E": "Fowl Pox"}, "correct": "C", "explanation": "Egg Drop Syndrome, caused by an adenovirus, causes a sudden 30-40% drop in egg production along with depigmented, cracked, or shell-less eggs.", "sprint": false, "id": 151}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which bacterial poultry disease is detected through the 'tuberculin test', with no treatment available, requiring isolation of the affected bird?", "options": {"A": "Tuberculosis", "B": "Fowl Cholera", "C": "Bacillary white diarrhoea", "D": "Infectious Coryza", "E": "Collibacillosis"}, "correct": "A", "explanation": "Tuberculosis in poultry, caused by Mycobacterium tuberculosis, is detected via the tuberculin test; there is no treatment, requiring isolation of affected birds.", "sprint": false, "id": 152}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Bacillary white diarrhoea (causing pullorum disease) in young chicks is caused by which organism?", "options": {"A": "Haemophilus gallinarum", "B": "Pasteurella ariseptica", "C": "E. coli", "D": "Staphylococcus", "E": "Salmonella pullorum"}, "correct": "E", "explanation": "Bacillary white diarrhoea, causing pullorum disease (fatal septicemia in young chicks), is caused by Salmonella pullorum.", "sprint": false, "id": 153}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Coccidiosis in poultry is caused by a group of protozoan parasites, with two important members being Eimeria tenella and Eimeria mitis. Which body part does Eimeria tenella primarily affect?", "options": {"A": "Liver", "B": "Kidney", "C": "Caeca (caecal coccidiosis)", "D": "Anterior small intestine", "E": "Lungs"}, "correct": "C", "explanation": "Eimeria tenella affects the caeca (causing caecal coccidiosis), while Eimeria mitis affects the anterior portion of the small intestine (intestinal coccidiosis).", "sprint": false, "id": 154}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Spirochaetosis (Tick fever) in poultry, caused by Borrelia gallinarum, is transmitted by which agent?", "options": {"A": "Mosquitoes", "B": "Airborne droplets", "C": "The fowl tick (Argus persicus)", "D": "Rodents", "E": "Contaminated water only"}, "correct": "C", "explanation": "The fowl tick (Argus persicus) is the transmitting agent of Spirochaetosis (Tick fever), a highly fatal disease with 70-100% mortality.", "sprint": false, "id": 155}, {"topic": "Poultry Diseases & Vaccination", "type": "statement", "difficulty": "Hard", "passage": "1. Vitamin D3 deficiency in poultry leads to rickets, thin-shelled eggs, and a 'penguin-like' sitting posture.\n2. Vitamin E deficiency leads to encephalomalacia (crazy chick disease) and exudative diathesis.\n3. Riboflavin (Vitamin B2) deficiency causes 'star-gazing' position in birds.\n4. Manganese deficiency causes Perosis, characterised by enlargement of hock joints, and is an incurable condition.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "Only 1", "B": "Only 3", "C": "None of the above", "D": "3 and 4", "E": "1 and 2"}, "correct": "B", "explanation": "Statement 3 is incorrect — the 'star-gazing' posture is a symptom of Thiamine (Vitamin B1) deficiency, not Riboflavin (B2), which instead causes 'curled toe paralysis'. Statements 1, 2 and 4 are correctly stated.", "sprint": true, "id": 156}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which vitamin deficiency in poultry causes 'curled toe paralysis' in birds between the first and second week of age?", "options": {"A": "Vitamin A", "B": "Pyridoxine (B6)", "C": "Riboflavin (B2)", "D": "Thiamine (B1)", "E": "Vitamin K"}, "correct": "C", "explanation": "Riboflavin (Vitamin B2) deficiency causes diarrhoea and 'curled toe paralysis' in birds between the 1st and 2nd week of age.", "sprint": false, "id": 157}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Deficiency of which vitamin in poultry is associated with increased blood spots in eggs, haemorrhages, and a failure of blood clotting, due to its role in prothrombin synthesis?", "options": {"A": "Vitamin A", "B": "Vitamin D3", "C": "Vitamin B12", "D": "Vitamin K", "E": "Vitamin E"}, "correct": "D", "explanation": "Vitamin K deficiency causes increased blood spots in eggs, haemorrhages, and failure of clotting, as it is essential for prothrombin synthesis.", "sprint": false, "id": 158}, {"topic": "Poultry Diseases & Vaccination", "type": "statement", "difficulty": "Hard", "passage": "1. An Attenuated vaccine uses an organism weakened during manufacture so it loses its ability to cause serious disease, while still triggering immunity.\n2. A Killed vaccine uses an organism that has been killed, generally producing STRONGER immunity than live/attenuated vaccines.\n3. In-ovo vaccination is administered into the embryo before hatch, at the late stage of development.\n4. In the Wing web method, the vaccine (e.g., Fowl pox) is introduced via a special grooved needle through the wing web.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "Only 2", "B": "None of the above", "C": "1 and 3", "D": "2 and 4", "E": "Only 1"}, "correct": "A", "explanation": "Statement 2 is incorrect — killed vaccines generally produce WEAKER immunity than live and attenuated vaccines, not stronger. Statements 1, 3 and 4 are correctly stated.", "sprint": true, "id": 159}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "In the commercial broiler vaccination programme, which vaccine is given at 0 day (day-old), administered strictly subcutaneously?", "options": {"A": "Marek's disease (HVT strain)", "B": "Ranikhet Disease (Lasota)", "C": "Infectious Bronchitis", "D": "Fowl Pox", "E": "IBD/Gumboro (Georgia vaccine)"}, "correct": "A", "explanation": "Marek's disease vaccine (HVT strain) is given at 0 day (day-old chicks), administered strictly subcutaneously.", "sprint": false, "id": 160}, {"topic": "Poultry Diseases & Vaccination", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which method of vaccine administration in poultry is described as the most recent/latest method, involving injection into the embryo or allantoic sac before hatching?", "options": {"A": "In-ovo vaccination", "B": "Aerosol spray", "C": "Subcutaneous", "D": "Wing web", "E": "Intra-ocular"}, "correct": "A", "explanation": "In-ovo vaccination is the most latest method, involving injecting the vaccine into the embryo/allantoic sac before hatch, at the late stage of development.", "sprint": false, "id": 161}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "What is the term for the period between the date of calving and the date of successful conception, with an optimum duration of 60-90 days for cattle?", "options": {"A": "Calving interval", "B": "Gestation period", "C": "Lactation period", "D": "Service period", "E": "Dry period"}, "correct": "D", "explanation": "Service period is the period between calving and successful conception; the optimum service period for cattle is 60-90 days.", "sprint": false, "id": 162}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "What is the desirable age at first calving in Indian cattle breeds, as noted in the chapter?", "options": {"A": "5 years", "B": "2 years", "C": "3 years", "D": "4 years", "E": "3.5 years"}, "correct": "C", "explanation": "The desirable age at first calving in Indian breeds is 3 years (2 years in crossbred cattle, and 3.5 years in buffaloes).", "sprint": false, "id": 163}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "What term describes the ability of certain individuals to stamp or impress their characters upon their offspring to a marked degree?", "options": {"A": "Prolificacy", "B": "Fertility", "C": "Fecundity", "D": "Prepotency", "E": "Atavism"}, "correct": "D", "explanation": "Prepotency is the ability of certain individuals to transmit/impress their characteristics upon their offspring to a marked degree.", "sprint": false, "id": 164}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "The failure of testes to descend fully into the scrotum is termed:", "options": {"A": "Atavism", "B": "Cryptorchid", "C": "Sterility", "D": "Buller", "E": "Free martin"}, "correct": "B", "explanation": "Cryptorchid refers to the failure of testes to descend fully into the scrotum; if both testes are retained in the abdominal cavity, sterility usually results.", "sprint": false, "id": 165}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Dressing percentage is calculated by dividing which two quantities?", "options": {"A": "Carcass weight by live weight, ×100", "B": "Milk yield by lactation days", "C": "Live weight by carcass weight, ×100", "D": "Meat yield by feed consumed", "E": "Total feed by body weight"}, "correct": "A", "explanation": "Dressing percentage is the percentage of live animal weight that becomes carcass weight at slaughter, calculated as (carcass weight ÷ live weight) × 100.", "sprint": false, "id": 166}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "What is a castrated male sheep called?", "options": {"A": "Buck", "B": "Wether", "C": "Barrow", "D": "Ram", "E": "Bullock"}, "correct": "B", "explanation": "A castrated male sheep is called a Wether. (Note: a castrated male goat is also called Wether, while a castrated bull is simply termed 'Bull' in the castration terms list, and a castrated male pig is called Barrow.)", "sprint": false, "id": 167}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "As per the castration terminology table, what is a castrated female pig called?", "options": {"A": "Wether", "B": "Spayed", "C": "Barrow", "D": "Gilt", "E": "Sow"}, "correct": "B", "explanation": "As per the chapter's castration terms table, a castrated female pig is termed 'Spayed', while a castrated male pig is termed 'Barrow'.", "sprint": false, "id": 168}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "What poultry term describes a male chicken less than 1 year old?", "options": {"A": "Cock", "B": "Pullet", "C": "Rooster", "D": "Cockerel", "E": "Capon"}, "correct": "D", "explanation": "Cockerel is a male chicken less than 1 year old. Cock and Rooster refer to a male chicken at least 1 year old. Capon is a castrated male chicken raised for meat.", "sprint": false, "id": 169}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "What is the term for male chickens castrated at 4-8 months old, weighing 5-9 pounds, producing more white meat with higher fat content?", "options": {"A": "Capon", "B": "Pullet", "C": "Cockerel", "D": "Rooster", "E": "Bantam"}, "correct": "A", "explanation": "Capon refers to male chickens castrated at 4-8 months old, weighing 5-9 pounds, producing more white meat with higher fat content than other chickens.", "sprint": false, "id": 170}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "A layer hen no longer commercially viable at around thirteen months of laying is termed a 'spent hen', also referred to by which term?", "options": {"A": "Broodiness", "B": "Henopause or Pause", "C": "Culling", "D": "Non-setter", "E": "Molt"}, "correct": "B", "explanation": "A layer hen no longer commercially viable at around 13 months is called a 'spent hen'; this phenomenon is also called 'Henopause' or 'Pause'.", "sprint": false, "id": 171}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "What is the process called by which the comb, and sometimes wattles and earlobes, of poultry are removed?", "options": {"A": "Debeaking", "B": "Candling", "C": "Sexing", "D": "Culling", "E": "Dubbing"}, "correct": "E", "explanation": "Dubbing is the procedure of removing the comb, and sometimes wattles and earlobes, of poultry (removing wattles alone is called 'dewattling').", "sprint": false, "id": 172}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "What is the term for the process of shining light through an egg to determine if it is fertilised?", "options": {"A": "Turning", "B": "Candling", "C": "Sexing", "D": "Lockdown", "E": "Pipping"}, "correct": "B", "explanation": "Candling is the procedure of shining light through an egg to determine whether it is fertilised or not.", "sprint": false, "id": 173}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which term refers to a chicken breed trait of having no tailbone, exemplified by the Araucana breed?", "options": {"A": "Bantam", "B": "Non-setter", "C": "Rumpless", "D": "Ratite", "E": "Ornamental breed"}, "correct": "C", "explanation": "Rumpless is the trait in some chicken breeds of having no tail/tailbone, with Araucana as an example.", "sprint": false, "id": 174}, {"topic": "Animal Husbandry & Poultry Terminology", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "What is the perch space recommended per bird in a poultry roost, with perches placed how far apart?", "options": {"A": "20-25 cm per bird, 35-40 cm apart", "B": "40-50 cm per bird, 60-70 cm apart", "C": "30-35 cm per bird, 50-60 cm apart", "D": "10-15 cm per bird, 20-25 cm apart", "E": "5-10 cm per bird, 15-20 cm apart"}, "correct": "A", "explanation": "The perch space recommended per bird is 20-25 cm, with perches placed at a distance of 35-40 cm apart.", "sprint": false, "id": 175}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "passage", "difficulty": "Moderate", "passage": "This is an indigenous anti-bacterial system present in cow and buffalo milk (and human saliva), mediated by short-lived oxidation products of a compound called thiocyanate. To activate this system in milk for preservation purposes, adequate concentrations of thiocyanate and hydrogen peroxide are added. This method must be controlled at the society level, with individual farmers not having direct access to the chemicals involved.", "stem": "________ is being described above. Identify the system.", "options": {"A": "Barfoed's test", "B": "Rosalic acid test", "C": "Hansa test", "D": "AOAC method", "E": "LP system (Lactoperoxidase system)"}, "correct": "E", "explanation": "The LP system (Lactoperoxidase/thiocyanate/hydrogen peroxide system) is an indigenous anti-bacterial system in milk, used for preserving raw milk under tropical conditions, controlled at the society level.", "sprint": false, "id": 176}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "passage", "difficulty": "Moderate", "passage": "This is an indigenous anti-bacterial system present in cow and buffalo milk (and human saliva), mediated by short-lived oxidation products of a compound called thiocyanate. To activate this system in milk for preservation purposes, adequate concentrations of thiocyanate and hydrogen peroxide are added. This method must be controlled at the society level, with individual farmers not having direct access to the chemicals involved.", "stem": "Why must this preservation method be controlled at the society level rather than allowing individual farmer access, as implied by the chapter?", "options": {"A": "Because the chemicals are radioactive", "B": "Because it requires expensive laboratory-grade equipment only societies can afford", "C": "Because only societies are legally permitted to sell milk", "D": "To ensure the chemicals used are not misused, given the importance of food safety over other objectives", "E": "Because farmers are not aware such a system exists"}, "correct": "D", "explanation": "The chapter states the main objective of such methods should be to maintain food safety, and hence control at the society level (rather than direct farmer access to chemicals) is emphasised as important for that reason.", "sprint": false, "id": 177}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "In rural milk collection systems in India, within how many hours of milking should milk ideally be brought for chilling/processing to avoid serious deterioration?", "options": {"A": "3 hours", "B": "24 hours", "C": "1 hour", "D": "12 hours", "E": "6 hours"}, "correct": "A", "explanation": "Milk should be brought for chilling/processing within 3 hours of milking, otherwise serious deterioration takes place, affecting product quality.", "sprint": false, "id": 178}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "figure", "difficulty": "Moderate", "passage": null, "stem": "At a chilling centre, rurally collected milk is chilled to what temperature before being transported to the milk processing plant?", "options": {"A": "2°C", "B": "10°C", "C": "0°C", "D": "4°C", "E": "8°C"}, "correct": "D", "explanation": "At the chilling centre, milk is promptly chilled to 4°C and transported at the same temperature to the milk processing plant.", "sprint": false, "id": 179}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "A chilling centre operation is considered economical only when it handles approximately how much milk per day?", "options": {"A": "5,000 litres", "B": "10,000 litres", "C": "50,000 litres", "D": "20,000 litres", "E": "30,000 litres"}, "correct": "E", "explanation": "Chilling centre operations are economical only when about 30,000 litres of milk is handled per day.", "sprint": false, "id": 180}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "The large vertical storage tank at a dairy plant, with a capacity of 25,000-1,50,000 litres, into which milk is pumped through a flow meter, is called a:", "options": {"A": "Silo", "B": "Chilling tank", "C": "Reservoir", "D": "Bulk cooler", "E": "Vat"}, "correct": "A", "explanation": "The large vertical storage tank (25,000-1,50,000 litre capacity) at the dairy plant reception dock is called a 'Silo'.", "sprint": false, "id": 181}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which milk adulterant is detected by observing the appearance of a blue colour (on adding iodine solution) that disappears on boiling and reappears on cooling?", "options": {"A": "Gelatin", "B": "Cane sugar", "C": "Formalin", "D": "Urea", "E": "Starch"}, "correct": "E", "explanation": "Starch adulteration is detected by adding 1% iodine solution — a blue colour appears, which disappears on boiling the sample and reappears on cooling.", "sprint": false, "id": 182}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which milk adulterant test involves adding p-dimethyl amino benzaldehyde reagent, with a distinct yellow colour indicating presence?", "options": {"A": "Starch", "B": "Urea", "C": "Formalin", "D": "Sodium chloride", "E": "Cane sugar"}, "correct": "B", "explanation": "Urea in milk is detected by adding p-dimethyl amino benzaldehyde reagent — a distinct yellow colour denotes presence of urea (pure milk shows a faint pink colour due to natural urea).", "sprint": false, "id": 183}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "The presence of buffalo milk in cow milk is detected using which immunological test?", "options": {"A": "Rosalic acid test", "B": "Resorcinol test", "C": "Barfoed's test", "D": "Hansa test", "E": "AOAC method"}, "correct": "D", "explanation": "The Hansa test, based on immunological assay using antiserum from rabbits injected with buffalo milk proteins, detects the presence of buffalo milk in cow milk.", "sprint": false, "id": 184}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which milk adulterant test involves adding concentrated sulfuric acid containing traces of ferric chloride, with a purple ring at the junction indicating presence?", "options": {"A": "Gelatin", "B": "Hydrogen peroxide", "C": "Cane sugar", "D": "Added colour", "E": "Formalin"}, "correct": "E", "explanation": "Formalin (formaldehyde) is detected by adding concentrated sulfuric acid with traces of ferric chloride — a purple ring forms at the junction if formalin is present.", "sprint": false, "id": 185}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which two Indian research institutes are mentioned as having developed rapid detection kits for chemical adulterants and environmental contaminants respectively?", "options": {"A": "CIRB Hisar and CSWRI Avikanagar", "B": "IARI Delhi and ICAR Bangalore", "C": "NDRI Karnal and CFTRI Mysore", "D": "IVRI Izatnagar and NDDB Anand", "E": "IIT Delhi and AIIMS Delhi"}, "correct": "C", "explanation": "The National Dairy Research Institute (NDRI), Karnal, and Central Food Technological Research Institute (CFTRI), Mysore, developed rapid detection kits for chemical adulterants and environmental contaminants respectively.", "sprint": false, "id": 186}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "statement", "difficulty": "Hard", "passage": "1. Grading of milk at collection centres uses organoleptic criteria including flavour, sediment, and cleanliness of container.\n2. Cans are used for handling up to 2,000 litres of milk per day, while tankers handle between 2,000 and 5,000 litres per day.\n3. Rail tankers are used for handling 10,000 litres or more for long-distance transportation, as in the National Milk Grid.\n4. Milk received at the dairy plant by tanker is always measured by weight, never by volume.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "Only 4", "B": "Only 1", "C": "1 and 2", "D": "None of the above", "E": "3 and 4"}, "correct": "A", "explanation": "Statement 4 is incorrect — milk received by tanker CAN be measured by weight or volume, but generally the milk from the tanker is measured by volume (via a flow meter), not always by weight. Statements 1, 2 and 3 are correctly stated.", "sprint": true, "id": 187}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which method of manual milking is described as the 'best method of hand milking', though most milkmen instead follow another (less ideal) method?", "options": {"A": "Wet milking", "B": "Fisting", "C": "Dry milking", "D": "Stripping", "E": "Knuckling"}, "correct": "B", "explanation": "Fisting is described as the best method of hand milking, though most milkmen follow the Knuckling method instead, which is injurious to the teat.", "sprint": false, "id": 188}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "What is the approximate pressure (mm Hg) applied over the teat canal by a calf during natural suckling, compared to hand milking (310 mm Hg)?", "options": {"A": "535 mm Hg", "B": "100 mm Hg", "C": "400 mm Hg", "D": "310 mm Hg (same as hand milking)", "E": "200 mm Hg"}, "correct": "A", "explanation": "The pressure applied by a calf during natural suckling is about 535 mm Hg, compared to 310 mm Hg in hand milking, and 350-400 mm Hg in mechanical milking.", "sprint": false, "id": 189}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "As per the frequency of milking guidelines, how many times a day should milking be done when the milk yield exceeds 10 litres/day?", "options": {"A": "Four times", "B": "Three times", "C": "Twice", "D": "Continuously", "E": "Once"}, "correct": "B", "explanation": "When milk yield is less than 10 litres/day, milking is done twice; when more than 10 litres/day, three-times milking is followed, improving yield by 10-15%.", "sprint": false, "id": 190}, {"topic": "Clean Milk Production, Milking Methods & Milk Adulteration", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "As per milk composition norms, milk obtained how many days before calving or after calving is excluded from the definition of 'milk' for clean milk production standards?", "options": {"A": "7 days before or 2 days after", "B": "20 days before or 10 days after", "C": "5 days before or 1 day after", "D": "10 days before or 3 days after", "E": "15 days before or 5 days after"}, "correct": "E", "explanation": "Milk is defined as the lacteal secretion from complete milking of healthy milch animals, excluding that obtained 15 days before or 5 days after calving.", "sprint": false, "id": 191}, {"topic": "Scenario-Based Diagnostic Questions", "type": "scenario", "difficulty": "Hard", "passage": "A veterinarian examines three animals on a farm with the following presentations:\n1. A dairy cow close to calving showing loss of appetite, depression, muscle const TOPIC_ORDER = [];
QUESTIONS.forEach(q => { if(!TOPIC_ORDER.includes(q.topic)) TOPIC_ORDER.push(q.topic); });

const state = {
  screen: 'home',
  order: 'pdf',
  set: [],
  setLabel: '',
  index: 0,
  answers: {},
  score: 0,
};
window.state = state; // exposed for diagnostics

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startSet(list, label, allowShuffleToggle){
  state.set = list;
  state.setLabel = label;
  state.index = 0;
  state.answers = {};
  state.score = 0;
  state.screen = 'quiz';
  state.allowShuffleToggle = !!allowShuffleToggle;
  render();
}

function goHome(){
  state.screen = 'home';
  render();
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'home') app.innerHTML = renderHome();
  else if(state.screen === 'sections') app.innerHTML = renderSections();
  else if(state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if(state.screen === 'end') app.innerHTML = renderEnd();
  try{ window.scrollTo(0,0); }catch(e){}
  attachHandlers();
}

function renderMasthead(){
  return `<div class="masthead">
    <h1 class="masthead-title">ARD Practice Register</h1>
    <span class="masthead-sub">ANIMAL HUSBANDRY &amp; POULTRY · ${QUESTIONS.length} ITEMS</span>
  </div>`;
}

function renderHome(){
  const sprintCount = QUESTIONS.filter(q => q.sprint).length;
  return renderMasthead() + `
    <p class="intro-line">A NABARD Grade A drill built from a single chapter of the ARD syllabus — breeds, feeding, breeding systems, poultry management and clean milk production. No shortcuts to the numbers; every figure traces back to the text.</p>
    <p class="section-label">CHOOSE A MODE</p>
    <div class="mode-list">
      <button class="mode-tab" data-action="mode-full">
        <div>
          <p class="mt-name">Full Practice Test</p>
          <p class="mt-desc">Every question in the bank, one sitting. Toggle order below.</p>
        </div>
        <span class="mt-count">${QUESTIONS.length} Qs</span>
      </button>
      <button class="mode-tab" data-action="mode-sections">
        <div>
          <p class="mt-name">Section-wise Revision</p>
          <p class="mt-desc">Drill one topic at a time — pick from the syllabus grid.</p>
        </div>
        <span class="mt-count">${TOPIC_ORDER.length} topics</span>
      </button>
      <button class="mode-tab" data-action="mode-sprint">
        <div>
          <p class="mt-name">Statement &amp; Scenario Sprint</p>
          <p class="mt-desc">Just the multi-statement and diagnostic-reasoning items — the exam's hardest format.</p>
        </div>
        <span class="mt-count">${sprintCount} Qs</span>
      </button>
    </div>
  `;
}

function renderSections(){
  let html = renderMasthead();
  html += `<button class="back-link" data-action="go-home">&larr; back to menu</button>`;
  html += `<p class="section-label">SYLLABUS SECTIONS</p>`;
  html += `<div class="topic-grid">`;
  TOPIC_ORDER.forEach(topic => {
    const count = QUESTIONS.filter(q => q.topic === topic).length;
    html += `<button class="topic-tile" data-action="pick-topic" data-topic="${escAttr(topic)}">
      <p class="tt-name">${esc(topic)}</p>
      <span class="tt-count">${count} questions</span>
    </button>`;
  });
  html += `</div>`;
  return html;
}

function renderQuizHeader(){
  const total = state.set.length;
  const answeredCount = Object.keys(state.answers).length;
  return `<div class="quiz-header">
    <div class="quiz-meta-row">
      <span>${esc(state.setLabel)} · Q ${Math.min(state.index+1,total)} / ${total}</span>
      <span class="score-live">SCORE ${state.score}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${(answeredCount/total*100).toFixed(1)}%"></div></div>
  </div>`;
}
function renderQuiz(){
  if(state.set.length === 0){
    return renderMasthead() + `<button class="back-link" data-action="go-home">&larr; back to menu</button>
    <p class="empty-note">No questions matched this selection.</p>`;
  }
  if(state.index >= state.set.length){
    state.screen = 'end';
    return renderEnd();
  }
  const q = state.set[state.index];
  const rec = state.answers[q.id];
  const locked = !!rec;
  const showToggle = state.allowShuffleToggle && state.index === 0 && Object.keys(state.answers).length === 0;

  let html = renderMasthead();
  html += `<button class="back-link" data-action="go-home">&larr; back to menu</button>`;
  if(showToggle){
    html += `<div class="order-toggle">
        <button class="${state.order==='pdf'?'active':''}" data-action="toggle-order" data-order="pdf">PDF ORDER</button>
        <button class="${state.order==='shuffled'?'active':''}" data-action="toggle-order" data-order="shuffled">SHUFFLED</button>
      </div>`;
  }
  html += renderQuizHeader();
  html += `<div class="diff-tag"><span class="diff-dot ${q.difficulty}"></span>${q.difficulty}</div>`;

  if(q.passage){
    html += `<div class="passage-box"><span class="passage-label">INSTRUCTION</span>${esc(q.passage)}</div>`;
  }

  html += `<p class="question-stem">${esc(q.stem)}</p>`;
  html += `<div class="options">`;
  ['A','B','C','D','E'].forEach(letter => {
    const val = q.options[letter];
    let cls = 'option';
    if(locked){
      cls += ' locked';
      if(letter === q.correct) cls += ' correct';
      else if(rec.selected === letter) cls += ' incorrect';
      else cls += ' dim';
    }
    html += `<button class="${cls}" data-action="answer" data-letter="${letter}" ${locked ? 'disabled':''}>
      <span class="opt-letter">${letter}</span><span>${esc(val)}</span>
    </button>`;
  });
  html += `</div>`;

  if(locked){
    let fcls, verdict;
    if(rec.status === 'skipped'){ fcls='skipped'; verdict='SKIPPED — CORRECT ANSWER SHOWN ABOVE'; }
    else if(rec.status === 'correct'){ fcls='correct'; verdict='CORRECT'; }
    else { fcls='incorrect'; verdict='NOT QUITE'; }
    html += `<div class="feedback-box show ${fcls}">
      <p class="feedback-verdict ${fcls}">${verdict}</p>
      <p>${esc(q.explanation)}</p>
    </div>`;
  }

  html += `<div class="quiz-footer">`;
  if(!locked){
    html += `<button class="btn btn-ghost" data-action="skip">Skip</button>`;
    html += `<span></span>`;
  } else {
    html += `<span></span>`;
    const isLast = state.index === state.set.length - 1;
    html += `<button class="btn btn-primary" data-action="next">${isLast ? 'See results' : 'Next question'}</button>`;
  }
  html += `</div>`;

  return html;
}

function renderEnd(){
  const total = state.set.length;
  const correct = Object.values(state.answers).filter(a => a.status === 'correct').length;
  const skipped = Object.values(state.answers).filter(a => a.status === 'skipped').length;
  const incorrect = total - correct - skipped;

  const diffs = ['Easy','Moderate','Hard'];
  const diffStats = diffs.map(d => {
    const qs = state.set.filter(q => q.difficulty === d);
    const cor = qs.filter(q => state.answers[q.id] && state.answers[q.id].status === 'correct').length;
    return {d, cor, total: qs.length};
  }).filter(s => s.total > 0);

  let html = renderMasthead();
  html += `<div class="end-score">
    <p class="big-num">${correct} / ${total}</p>
    <p class="big-label">${esc(state.setLabel)} · ${skipped} skipped · ${incorrect} missed</p>
  </div>`;

  if(diffStats.length){
    html += `<div class="stat-row">`;
    diffStats.forEach(s => {
      html += `<div class="stat-block ${s.d}"><div class="sb-diff">${s.d.toUpperCase()}</div><div class="sb-frac">${s.cor}/${s.total}</div></div>`;
    });
    html += `</div>`;
  }

  const missedOrSkipped = state.set.filter(q => {
    const a = state.answers[q.id];
    return a && a.status !== 'correct';
  });

  if(missedOrSkipped.length){
    html += `<p class="section-label">REVIEW — MISSED &amp; SKIPPED (${missedOrSkipped.length})</p>`;
    html += `<div class="review-list">`;
    missedOrSkipped.forEach((q,i) => {
      const a = state.answers[q.id];
      html += `<div class="review-item">
        <div class="review-item-head" data-action="toggle-review" data-idx="${i}">
          <p class="ri-stem">${esc(truncate(q.stem, 90))}</p>
          <span class="ri-status ${a.status}">${a.status === 'skipped' ? 'SKIPPED' : 'MISSED'}</span>
        </div>
        <div class="review-item-body" id="review-body-${i}">
          ${q.passage ? `<p>${esc(q.passage)}</p>` : ''}
          <p><strong>${esc(q.stem)}</strong></p>
          <p class="ri-correct">Correct: ${q.correct}. ${esc(q.options[q.correct])}</p>
          ${a.status==='incorrect' ? `<p class="ri-yours">Your answer: ${a.selected}. ${esc(q.options[a.selected])}</p>` : ''}
          <p>${esc(q.explanation)}</p>
        </div>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<p class="empty-note">Clean sweep — nothing missed or skipped.</p>`;
  }

  html += `<div class="end-actions">
    <button class="btn" data-action="retry">Retry same set</button>
    <button class="btn btn-primary" data-action="go-home">Back to menu</button>
  </div>`;

  return html;
}

function truncate(s, n){ return s.length > n ? s.slice(0,n-1) + '…' : s; }
function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onAction);
  });
}

function onAction(e){
  const action = e.currentTarget.dataset.action;
  if(action === 'go-home'){ goHome(); }
  else if(action === 'mode-sections'){ state.screen = 'sections'; render(); }
  else if(action === 'mode-full'){ openFullTest(); }
  else if(action === 'mode-sprint'){
    const list = QUESTIONS.filter(q => q.sprint);
    startSet(list, 'Statement & Scenario Sprint', false);
  }
  else if(action === 'pick-topic'){
    const topic = e.currentTarget.dataset.topic;
    const list = QUESTIONS.filter(q => q.topic === topic);
    startSet(list, topic, false);
  }
  else if(action === 'answer'){
    const letter = e.currentTarget.dataset.letter;
    submitAnswer(letter);
  }
  else if(action === 'skip'){
    submitAnswer(null);
  }
  else if(action === 'next'){
    state.index += 1;
    render();
  }
  else if(action === 'retry'){
    startSet(state.set, state.setLabel, state.allowShuffleToggle);
  }
  else if(action === 'toggle-review'){
    const idx = e.currentTarget.dataset.idx;
    const body = document.getElementById('review-body-' + idx);
    body.classList.toggle('show');
  }
  else if(action === 'toggle-order'){
    state.order = e.currentTarget.dataset.order;
    openFullTest(true);
  }
}

function openFullTest(preserveScreen){
  const list = state.order === 'shuffled' ? shuffle(QUESTIONS) : QUESTIONS.slice();
  startSet(list, 'Full Practice Test (' + (state.order === 'shuffled' ? 'Shuffled' : 'PDF Order') + ')', true);
}

function submitAnswer(letter){
  const q = state.set[state.index];
  if(letter === null){
    state.answers[q.id] = {status:'skipped', selected:null};
  } else if(letter === q.correct){
    state.answers[q.id] = {status:'correct', selected:letter};
    state.score += 1;
  } else {
    state.answers[q.id] = {status:'incorrect', selected:letter};
  }
  render();
}

render();
</script>
</body>
</html>
