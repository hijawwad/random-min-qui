<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARD Practice Register — Animal Husbandry &amp; Poultry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16140F;
    --bg-alt:#1B1811;
    --surface:#201C15;
    --surface-2:#2A251A;
    --border:#3A3527;
    --border-soft:#2C2819;
    --text:#EAE4D6;
    --text-muted:#A89B7D;
    --text-faint:#6E6450;
    --accent:#C99A4A;
    --accent-strong:#E0AD5E;
    --accent-dim:#8A6B36;
    --good:#7C9B63;
    --good-bg:rgba(124,155,99,0.14);
    --bad:#BD5B44;
    --bad-bg:rgba(189,91,68,0.14);
    --easy:#7C9B63;
    --moderate:#C99A4A;
    --hard:#BD5B44;
    --radius:3px;
    --serif:"Source Serif 4", Georgia, serif;
    --sans:"IBM Plex Sans", -apple-system, sans-serif;
    --mono:"IBM Plex Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,154,74,0.06), transparent 60%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-strong);}
  ::selection{background:var(--accent-dim);color:var(--text);}

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  /* ---------- Masthead ---------- */
  .masthead{
    border-bottom:1px solid var(--border);
    padding-bottom:18px;
    margin-bottom:28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .masthead-title{
    font-family:var(--serif);
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
    color:var(--text);
  }
  .masthead-sub{
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--text-faint);
    letter-spacing:0.03em;
  }

  /* ---------- Home ---------- */
  .intro-line{
    font-family:var(--serif);
    font-style:italic;
    color:var(--text-muted);
    font-size:1.02rem;
    line-height:1.6;
    margin:0 0 30px;
    max-width:56ch;
  }
  .section-label{
    font-family:var(--mono);
    font-size:0.7rem;
    color:var(--text-faint);
    letter-spacing:0.04em;
    margin:0 0 10px;
    padding-left:2px;
  }

  .mode-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:36px; }
  .mode-tab{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-left:4px solid var(--accent);
    border-radius:var(--radius);
    padding:16px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    transition:background 0.15s ease, border-color 0.15s ease;
    text-align:left;
    width:100%;
    font-family:inherit;
    color:inherit;
  }
  .mode-tab:hover{ background:var(--surface-2); border-left-color:var(--accent-strong); }
  .mode-tab:focus-visible{ outline:2px solid var(--accent-strong); outline-offset:2px; }
  .mode-tab .mt-name{
    font-family:var(--serif);
    font-size:1.12rem;
    font-weight:600;
    color:var(--text);
    margin:0 0 4px;
  }
  .mode-tab .mt-desc{
    font-size:0.85rem;
    color:var(--text-muted);
    margin:0;
    line-height:1.45;
  }
  .mode-tab .mt-count{
    font-family:var(--mono);
    font-size:0.85rem;
    color:var(--accent-strong);
    white-space:nowrap;
    flex-shrink:0;
  }

  .order-toggle{
    display:flex;
    gap:0;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    width:fit-content;
    margin:-20px 0 36px;
    overflow:hidden;
  }
  .order-toggle button{
    font-family:var(--mono);
    font-size:0.75rem;
    letter-spacing:0.02em;
    padding:8px 16px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
  }
  .order-toggle button.active{ background:var(--accent-dim); color:var(--text); }

  .topic-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  @media (max-width:560px){ .topic-grid{ grid-template-columns:1fr; } }
  .topic-tile{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:14px 16px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    color:inherit;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .topic-tile:hover{ background:var(--surface-2); border-color:var(--accent-dim); }
  .topic-tile .tt-name{
    font-family:var(--serif);
    font-size:0.95rem;
    font-weight:600;
    color:var(--text);
    margin:0 0 6px;
    line-height:1.3;
  }
  .topic-tile .tt-count{
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--accent);
  }

  .back-link{
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:0.75rem;
    cursor:pointer;
    padding:0 0 20px;
    display:inline-block;
  }
  .back-link:hover{ color:var(--accent-strong); }

  /* ---------- Quiz screen ---------- */
  .quiz-header{
    margin-bottom:20px;
  }
  .quiz-meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--mono);
    font-size:0.75rem;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .quiz-meta-row .score-live{ color:var(--accent-strong); }
  .progress-track{
    height:3px;
    background:var(--border-soft);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width 0.25s ease;
  }

  .diff-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--text-muted);
    margin-bottom:14px;
  }
  .diff-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .diff-dot.Easy{ background:var(--easy); }
  .diff-dot.Moderate{ background:var(--moderate); }
  .diff-dot.Hard{ background:var(--hard); }

  .passage-box{
    background:var(--bg-alt);
    border-left:3px solid var(--accent-dim);
    border-radius:0 var(--radius) var(--radius) 0;
    padding:16px 18px;
    margin:0 0 18px;
    font-family:var(--serif);
    font-size:0.98rem;
    line-height:1.7;
    color:var(--text-muted);
    white-space:pre-line;
  }
  .passage-label{
    font-family:var(--mono);
    font-size:0.65rem;
    letter-spacing:0.04em;
    color:var(--text-faint);
    margin-bottom:8px;
    display:block;
  }

  .question-stem{
    font-family:var(--serif);
    font-size:1.18rem;
    font-weight:500;
    line-height:1.5;
    color:var(--text);
    margin:0 0 20px;
    white-space:pre-line;
  }

  .options{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:12px 14px;
    cursor:pointer;
    text-align:left;
    font-family:var(--sans);
    font-size:0.92rem;
    color:var(--text);
    transition:background 0.12s ease, border-color 0.12s ease;
    width:100%;
  }
  .option:hover:not(.locked){ background:var(--surface-2); border-color:var(--accent-dim); }
  .option:focus-visible{ outline:2px solid var(--accent-strong); outline-offset:1px; }
  .option .opt-letter{
    font-family:var(--mono);
    font-size:0.78rem;
    color:var(--text-faint);
    flex-shrink:0;
    width:16px;
  }
  .option.correct{ background:var(--good-bg); border-color:var(--good); }
  .option.correct .opt-letter{ color:var(--good); }
  .option.incorrect{ background:var(--bad-bg); border-color:var(--bad); }
  .option.incorrect .opt-letter{ color:var(--bad); }
  .option.locked{ cursor:default; }
  .option.dim{ opacity:0.5; }

  .feedback-box{
    border-radius:var(--radius);
    padding:14px 16px;
    margin:4px 0 20px;
    font-size:0.88rem;
    line-height:1.6;
    display:none;
  }
  .feedback-box.show{ display:block; }
  .feedback-box.correct{ background:var(--good-bg); border:1px solid rgba(124,155,99,0.35); }
  .feedback-box.incorrect{ background:var(--bad-bg); border:1px solid rgba(189,91,68,0.35); }
  .feedback-box.skipped{ background:var(--surface-2); border:1px solid var(--border-soft); }
  .feedback-verdict{
    font-family:var(--mono);
    font-size:0.72rem;
    letter-spacing:0.03em;
    margin:0 0 6px;
  }
  .feedback-verdict.correct{ color:var(--good); }
  .feedback-verdict.incorrect{ color:var(--bad); }
  .feedback-verdict.skipped{ color:var(--text-muted); }
  .feedback-box p{ margin:0; color:var(--text-muted); }

  .quiz-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    font-family:var(--sans);
    font-size:0.85rem;
    font-weight:600;
    padding:11px 20px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#1A1508; }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-ghost{ background:none; border:none; color:var(--text-faint); }
  .btn-ghost:hover{ color:var(--text-muted); background:none; }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }

  /* ---------- End screen ---------- */
  .end-score{
    text-align:center;
    padding:28px 0 24px;
    border-bottom:1px solid var(--border);
    margin-bottom:24px;
  }
  .end-score .big-num{
    font-family:var(--serif);
    font-size:3.2rem;
    font-weight:600;
    color:var(--accent-strong);
    line-height:1;
    margin:0 0 6px;
  }
  .end-score .big-label{
    font-family:var(--mono);
    font-size:0.78rem;
    color:var(--text-muted);
  }
  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:26px;
  }
  .stat-block{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:14px 12px;
    text-align:center;
  }
  .stat-block .sb-diff{
    font-family:var(--mono);
    font-size:0.68rem;
    color:var(--text-faint);
    margin-bottom:6px;
  }
  .stat-block .sb-frac{
    font-family:var(--serif);
    font-size:1.3rem;
    font-weight:600;
  }
  .stat-block.Easy .sb-frac{ color:var(--easy); }
  .stat-block.Moderate .sb-frac{ color:var(--moderate); }
  .stat-block.Hard .sb-frac{ color:var(--hard); }

  .review-list{ margin-bottom:28px; }
  .review-item{
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    margin-bottom:8px;
    overflow:hidden;
  }
  .review-item-head{
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    cursor:pointer;
    background:var(--surface);
  }
  .review-item-head:hover{ background:var(--surface-2); }
  .review-item-head .ri-stem{
    font-family:var(--serif);
    font-size:0.9rem;
    color:var(--text);
    margin:0;
    line-height:1.4;
  }
  .review-item-head .ri-status{
    font-family:var(--mono);
    font-size:0.68rem;
    flex-shrink:0;
    white-space:nowrap;
  }
  .review-item-head .ri-status.incorrect{ color:var(--bad); }
  .review-item-head .ri-status.skipped{ color:var(--text-faint); }
  .review-item-body{
    display:none;
    padding:0 14px 14px;
    font-size:0.85rem;
    color:var(--text-muted);
    line-height:1.6;
  }
  .review-item-body.show{ display:block; }
  .review-item-body .ri-correct{ color:var(--good); font-weight:600; }
  .review-item-body .ri-yours{ color:var(--bad); }

  .end-actions{ display:flex; gap:10px; }
  .end-actions .btn{ flex:1; }

  .empty-note{
    font-family:var(--serif);
    font-style:italic;
    color:var(--text-muted);
    padding:30px 0;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>

. Importantly, this animal lacks sweat glands on its skin, causing more heat retention in the body, so it prefers staying around water and mud during the day.", "stem": "This blank refers to which bovine species?", "options": {"A": "Buffalo", "B": "Cattle", "C": "Bison", "D": "Mithun", "E": "Yak"}, "correct": "A", "explanation": "Buffalo is described this way — black colour, larger physique, absence of sweat glands, and horn shapes varying by type (e.g. Cape buffalo vs Wild Asian buffalo).", "sprint": false, "id": 4}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "passage", "difficulty": "Moderate", "passage": "________ is an important member among the bovines with a black colour cattle-like appearance. Usually all types are black in colour and larger in physique compared to other cattle species. Most have horns whose shape and size vary according to species — one African type has a thick horn with downward-and-upward curves while a wild Asian type has slender horns with an upward curve. Importantly, this animal lacks sweat glands on its skin, causing more heat retention in the body, so it prefers staying around water and mud during the day.", "stem": "Which of the following is stated as the reason this animal prefers staying around water during the daytime?", "options": {"A": "It cannot see well in sunlight", "B": "Its skin is allergic to sunlight", "C": "It lacks sweat glands, causing more body heat retention", "D": "It cannot digest feed without water nearby", "E": "All of the above"}, "correct": "C", "explanation": "The passage notes the animal lacks sweat glands, causing it to retain more body heat, so it prefers staying near water and covering itself with mud to cool down.", "sprint": false, "id": 5}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "The scientific name Bos taurus refers to which animal?", "options": {"A": "Cattle", "B": "Sheep", "C": "Yak", "D": "Goat", "E": "Water Buffalo"}, "correct": "A", "explanation": "Bos taurus is the scientific name for cattle, as listed among scientific names of important livestock and poultry.", "sprint": false, "id": 6}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which is the correct scientific name for Water Buffalo?", "options": {"A": "Capra aegagrus hircus", "B": "Ovis aries", "C": "Bos taurus", "D": "Bubalus bubalis", "E": "Bos frontalis"}, "correct": "D", "explanation": "Water Buffalo's scientific name is Bubalus bubalis; Bos frontalis is Mithun, and Ovis aries is Sheep.", "sprint": false, "id": 7}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which scientific name correctly corresponds to Mithun?", "options": {"A": "Bos javanicus", "B": "Bos grunniens", "C": "Bos frontalis", "D": "Bos taurus", "E": "Bubalus bubalis"}, "correct": "C", "explanation": "Mithun's scientific name is Bos frontalis. Bos javanicus is Bali cattle and Bos grunniens is Yak.", "sprint": false, "id": 8}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "What is the adult female of a goat called?", "options": {"A": "Hen", "B": "Mare", "C": "Nanny", "D": "Sow", "E": "Ewe"}, "correct": "C", "explanation": "The adult female goat is called Nanny, as per the terminology table for domesticated animals.", "sprint": false, "id": 9}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "What is the meat of goat specifically called?", "options": {"A": "Mutton", "B": "Pork", "C": "Venison", "D": "Beef", "E": "Chevon"}, "correct": "E", "explanation": "The meat of goat is called Chevon, per the terminology table of domesticated animals.", "sprint": false, "id": 10}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "The mating/service process in sheep is referred to by which specific term?", "options": {"A": "Foaling", "B": "Serving", "C": "Tupping", "D": "Coupling", "E": "Covering"}, "correct": "C", "explanation": "As per the terminology table, the mating term used specifically for sheep is 'Tupping'; goats use 'Serving' and pigs use 'Coupling'.", "sprint": false, "id": 11}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "What is the parturition (birthing) process called specifically in goats?", "options": {"A": "Hatching", "B": "Farrowing", "C": "Foaling", "D": "Kidding", "E": "Lambing"}, "correct": "D", "explanation": "The parturition process in goats is termed Kidding. Lambing is for sheep, Farrowing is for pigs, and Foaling is for horses.", "sprint": false, "id": 12}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "What is the normal body temperature of a hen, as listed among domesticated animals?", "options": {"A": "38.5°C", "B": "37.5°C", "C": "39.1°C", "D": "39.2°C", "E": "41.7°C"}, "correct": "E", "explanation": "The hen has the highest listed body temperature among the domesticated animals at 41.7°C, compared to cow (38.5°C), buffalo (37.5°C), goat (39.1°C), sheep (39°C) and pig (39.2°C).", "sprint": false, "id": 13}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "statement", "difficulty": "Hard", "passage": "1. Estrus is the stage characterised by receptivity to a male, commonly called 'heat'.\n2. Cattle and pigs are classified as Polyestrous animals, having estrous cycles throughout the year.\n3. Horses, sheep and goats are Seasonally Polyestrous, cycling only during certain periods of the year.\n4. Dogs, wolves and foxes are classified as Polyestrous animals, having estrous cycles throughout the year.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "None of the above", "B": "1 and 3", "C": "Only 4", "D": "2 and 4", "E": "Only 2"}, "correct": "C", "explanation": "Statement 4 is incorrect — dogs, wolves and foxes are classified as Monoestrous animals (one estrous cycle per year), not Polyestrous. Statements 1, 2 and 3 correctly describe Estrus, Polyestrous, and Seasonally Polyestrous animals respectively.", "sprint": true, "id": 14}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "statement", "difficulty": "Moderate", "passage": "1. The gestation period of cattle is 282 days.\n2. The gestation period of buffaloes is 316 days.\n3. The gestation period of sheep (ewe) is 250 days.\n4. The gestation period of goat (doe) is 150 days.", "stem": "Which of the above statements is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 4", "C": "1, 2, 3 and 4", "D": "2, 3 and 4", "E": "Only 4"}, "correct": "B", "explanation": "Statement 3 is incorrect — the gestation period of sheep (ewe) is 148 days, not 250 days. Cattle (282 days), buffaloes (316 days), and goat (150 days) are correctly stated.", "sprint": true, "id": 15}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "What is the average length of the estrous cycle in cattle?", "options": {"A": "28 days", "B": "15-18 days", "C": "20 days", "D": "10 days", "E": "21 days"}, "correct": "E", "explanation": "Cattle have an estrous cycle length of 21 days, same as buffaloes; sheep have 15-18 days and goats have 20 days.", "sprint": false, "id": 16}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "A group of sheep, goats, or poultry birds is collectively called a:", "options": {"A": "Herd", "B": "Trip", "C": "Flock", "D": "Litter", "E": "Drove"}, "correct": "C", "explanation": "A Flock refers to a group of sheep, goat, or poultry birds, whereas a Herd refers to a group of cattle or buffalo.", "sprint": false, "id": 17}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "What term describes a sterile heifer born as a twin with a male calf?", "options": {"A": "Teaser", "B": "Buller", "C": "Free martin", "D": "Atavism", "E": "Cryptorchid"}, "correct": "C", "explanation": "A Free martin is a sterile heifer born twin with a male calf, due to hormonal exposure in utero.", "sprint": false, "id": 18}, {"topic": "Livestock Basics, Census & Reproductive Terms", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "A vasectomized bull used to detect heat/estrus in cows is called a:", "options": {"A": "Teaser", "B": "Free martin", "C": "Wether", "D": "Steer", "E": "Buller"}, "correct": "A", "explanation": "A Teaser is a vasectomized (castrated) bull used specifically to detect the heat or estrus of a female cow.", "sprint": false, "id": 19}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "passage", "difficulty": "Easy", "passage": "This breed originally belongs to the Montgomery district of present-day Pakistan and is mainly found in Punjab, Haryana, U.P., Delhi, Bihar and M.P. It is otherwise known as Lola (loose skin), Lambi Bar, Montgomery, Multani, and Teli. It is considered the best indigenous dairy breed of India, reddish dun or pale red in colour, sometimes flashed with white patches, with a heavy body and loose skin.", "stem": "Which breed is being described in the above passage?", "options": {"A": "Rathi", "B": "Gir", "C": "Tharparkar", "D": "Sahiwal", "E": "Red Sindhi"}, "correct": "D", "explanation": "This is Sahiwal — originally from the Montgomery district (Pakistan), also known as Lola, Lambi Bar, Montgomery, Multani, Teli, and considered the best indigenous dairy breed.", "sprint": false, "id": 20}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "passage", "difficulty": "Moderate", "passage": "This breed originally belongs to the Montgomery district of present-day Pakistan and is mainly found in Punjab, Haryana, U.P., Delhi, Bihar and M.P. It is otherwise known as Lola (loose skin), Lambi Bar, Montgomery, Multani, and Teli. It is considered the best indigenous dairy breed of India, reddish dun or pale red in colour, sometimes flashed with white patches, with a heavy body and loose skin.", "stem": "As per the passage and related chapter data, which of the following is correct about this breed?", "options": {"A": "It has the highest fat percentage among Indian buffalo breeds", "B": "Its milk yield averages less than 500 litres per lactation", "C": "Age at first calving is 32-36 months and calving interval is 15 months", "D": "It is a pure draught breed used only for ploughing", "E": "It originated in the Gir forests of Gujarat"}, "correct": "C", "explanation": "Sahiwal has an age at first calving of 32-36 months and a calving interval of 15 months. It is a milch (dairy) breed, not draught, and does not originate from Gir forests (that is Gir cattle) nor is it a buffalo breed.", "sprint": false, "id": 21}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "Which of the following breeds originally belonged to the Kohistan, Sindh province of present-day Pakistan and is otherwise called Red Karachi, Sindhi and Mahi?", "options": {"A": "Sahiwal", "B": "Tharparkar", "C": "Kankrej", "D": "Gir", "E": "Red Sindhi"}, "correct": "E", "explanation": "Red Sindhi hails from Kohistan, Sindh province (Pakistan) and is otherwise called Red Karachi, Sindhi, and Mahi.", "sprint": false, "id": 22}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which milch breed of cattle is otherwise known as Bhadawari, Desan, Gujarati, Kathiawari, Sorthi, and Surati, and originated in the Gir forests of South Kathiawar, Gujarat?", "options": {"A": "Gir", "B": "Deoni", "C": "Red Sindhi", "D": "Ongole", "E": "Sahiwal"}, "correct": "A", "explanation": "Gir cattle originated in the Gir forests of South Kathiawar, Gujarat and is otherwise known as Bhadawari, Desan, Gujarati, Kathiawari, Sorthi, and Surati. It is known for its 'half-moon' shaped curved horns.", "sprint": false, "id": 23}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which breed's horns are described as giving a 'half-moon' appearance along with pendulous ears?", "options": {"A": "Murrah", "B": "Sahiwal", "C": "Kangayam", "D": "Gir", "E": "Ongole"}, "correct": "D", "explanation": "Gir cattle have peculiarly curved horns giving a 'half moon' appearance and pendulous ears.", "sprint": false, "id": 24}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "Which dual-purpose breed is mainly found in Karnal, Hisar and Gurgaon districts of Haryana, Delhi, and Western M.P., known for powerful bullocks used for road transport and rapid ploughing?", "options": {"A": "Deoni", "B": "Tharparkar", "C": "Hariana", "D": "Ongole", "E": "Kankrej"}, "correct": "C", "explanation": "Hariana is mainly found in Karnal, Hisar and Gurgaon districts of Haryana, Delhi and Western M.P., known for powerful bullocks.", "sprint": false, "id": 25}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which breed is otherwise known as White Sindhi, Gray Sindhi and Thari, and originated in the Tharparkar district of undivided India (present Pakistan)?", "options": {"A": "Red Sindhi", "B": "Hariana", "C": "Kankrej", "D": "Sahiwal", "E": "Tharparkar"}, "correct": "E", "explanation": "Tharparkar is otherwise known as White Sindhi, Gray Sindhi and Thari, originating in Tharparkar district (Pakistan) and also found in Rajasthan.", "sprint": false, "id": 26}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "The peculiar gait of the Kankrej breed, known as '1¼ paces', is locally called:", "options": {"A": "Dhak chal", "B": "Jallikattu chal", "C": "Sawai chal", "D": "Lambi chal", "E": "Swaichal gait"}, "correct": "C", "explanation": "Kankrej's peculiar 1¼-pace gait is called 'sawai chal' in the text (also referenced as 'Swaichal' elsewhere in the summary table).", "sprint": false, "id": 27}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which breed, otherwise called Nellore, has its home tract in Ongole taluk of Guntur district, Andhra Pradesh, and is a large muscular breed suitable for heavy draught work?", "options": {"A": "Rathi", "B": "Krishna Valley", "C": "Kankrej", "D": "Deoni", "E": "Ongole"}, "correct": "E", "explanation": "Ongole (otherwise known as Nellore) has its home tract in Ongole taluk, Guntur district, Andhra Pradesh, and is a large muscular breed with a well-developed hump.", "sprint": false, "id": 28}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Deoni cattle, known for an average calving interval of 447 days, originated in Western Andhra Pradesh and is also known by which of the following names?", "options": {"A": "Wadad or Waged", "B": "Dongerpati, Dongari, Wannera", "C": "Kongu, Konganad", "D": "Wadhiar", "E": "Lola, Lambi Bar"}, "correct": "B", "explanation": "Deoni is also known as Dongerpati, Dongari, Wannera, Waghyd, Balankya, and Shevera.", "sprint": false, "id": 29}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "statement", "difficulty": "Hard", "passage": "1. Sahiwal is native to Montgomery (Pakistan) and is India's highest and sweetest milk-producing cow breed, yielding about 2200 kg/lactation.\n2. Gir is native to Kathiawar (Gujarat) and yields about 2100 kg/lactation.\n3. Hariana, native to Hissar/Rohtak (Haryana), is a draught breed with a milk yield of only 700 kg/lactation.\n4. Kankrej, native to Kutchh (Gujarat), has the highest body weight among Indian cow breeds and yields about 1700 kg/lactation.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "Only 3", "B": "None of the above", "C": "Only 1", "D": "3 and 4", "E": "1 and 2"}, "correct": "A", "explanation": "Statement 3 is incorrect on two counts — Hariana is classified as a Dual-Purpose breed (not draught) with a milk yield of 1500 kg/lactation, not 700 kg (700 kg/lactation is Ongole's figure). Statements 1, 2 and 4 are correctly stated as per the ICAR summary table.", "sprint": true, "id": 30}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "As per the summary table of Indian cattle breeds (ICAR), which dairy breed has the highest listed milk yield per lactation among Sahiwal, Red Sindhi, and Gir?", "options": {"A": "Gir (2100 kg)", "B": "All three are equal", "C": "Red Sindhi (2000 kg)", "D": "None of the above", "E": "Sahiwal (2200 kg)"}, "correct": "E", "explanation": "Among the three dairy breeds listed, Sahiwal has the highest milk yield at 2200 litres/kg per lactation, followed by Gir (2100) and Red Sindhi (2000).", "sprint": false, "id": 31}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which breed is described as having a body colour that varies from silver-grey to iron-grey or steel black, with lyre-shaped horns, native to the Southeast Rann of Kutch?", "options": {"A": "Deoni", "B": "Tharparkar", "C": "Ongole", "D": "Kankrej", "E": "Hariana"}, "correct": "D", "explanation": "Kankrej, originating from the Southeast Rann of Kutch (Gujarat), has a colour varying from silver-grey to iron-grey/steel black and lyre-shaped horns.", "sprint": false, "id": 32}, {"topic": "Indian Milch & Dual-Purpose Cattle Breeds", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which of the following is NOT listed as an example of a Dual-Purpose breed of Indian cattle?", "options": {"A": "Kankrej", "B": "Rathi", "C": "Amritmahal", "D": "Hariana", "E": "Ongole"}, "correct": "C", "explanation": "Amritmahal is classified as a Draught-purpose breed, not Dual-purpose. Dual-purpose breed examples include Ongole, Hariana, Kankrej, Deoni, Tharparkar, Krishna Valley, Rathi and Goalo Mewathi.", "sprint": false, "id": 33}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which of the following breeds originated in Hassan, Chikmagalur and Chitradurga districts of Karnataka, with a grey shade varying from almost white to near black, and a black muzzle, feet and tail?", "options": {"A": "Bargur", "B": "Amritmahal", "C": "Kangayam", "D": "Hallikar", "E": "Khillari"}, "correct": "B", "explanation": "Amritmahal originated in Hassan, Chikmagalur and Chitradurga districts of Karnataka, is grey-coloured with shade variation, and has a black muzzle, feet and tail.", "sprint": false, "id": 34}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which draught breed, found in Tumkur, Hassan and Mysore districts of Karnataka, is best known for its trotting ability?", "options": {"A": "Kangayam", "B": "Hallikar", "C": "Amritmahal", "D": "Khillari", "E": "Bargur"}, "correct": "B", "explanation": "Hallikar, from Tumkur, Hassan and Mysore districts of Karnataka, is best known for its draught capacity and especially its trotting ability.", "sprint": false, "id": 35}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which breed is otherwise called Jathi madu, Mottai madu, Molai madu, or Therkathi madu, and is peculiar for the practice of dehorning its bullocks?", "options": {"A": "Pulikulam", "B": "Alambadi", "C": "Bargur", "D": "Khillari", "E": "Umblacherry"}, "correct": "E", "explanation": "Umblacherry (from Tanjore district, Tamil Nadu) is otherwise called Jathi madu, Mottai madu, Molai madu, Therkathi madu, and is known for the peculiar practice of dehorning its bullocks.", "sprint": false, "id": 36}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which breed, resembling Hallikar and originating from Sholapur and Sitapur districts of Maharashtra, has long horns that turn forward in a peculiar fashion?", "options": {"A": "Amritmahal", "B": "Pulikulam", "C": "Alambadi", "D": "Khillari", "E": "Bargur"}, "correct": "D", "explanation": "Khillari, originating from Sholapur and Sitapur districts of Maharashtra, closely resembles Hallikar and has long horns turning forwards peculiarly.", "sprint": false, "id": 37}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which breed is commonly seen in the Cumbum valley of Madurai district, Tamil Nadu, also known as Jallikattu madu, kidai madu, or sentharai, and is mainly used for penning in the field?", "options": {"A": "Bargur", "B": "Alambadi", "C": "Kangayam", "D": "Pulikulam", "E": "Umblacherry"}, "correct": "D", "explanation": "Pulikulam, from Cumbum valley (Madurai district, Tamil Nadu), is also known as Jallikattu madu, kidai madu, sentharai, and is mainly used for penning in the field.", "sprint": false, "id": 38}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which breed is bred in the southern/southeastern areas of Erode district, Tamil Nadu, and is also known as Kongu and Konganad?", "options": {"A": "Umblacherry", "B": "Pulikulam", "C": "Kangayam", "D": "Bargur", "E": "Alambadi"}, "correct": "C", "explanation": "Kangayam is bred in the Erode district area of Tamil Nadu and is also known as Kongu and Konganad.", "sprint": false, "id": 39}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "passage", "difficulty": "Moderate", "passage": "This breed is found around a specific hill range in the Bhavani taluk of Erode district, Tamil Nadu, and was developed for work in uneven hilly terrains. It is generally brown in colour with white markings, well-built, compact and of medium size, known for its speed and endurance in trotting, but is cautious in behaviour and tends to remain away from strangers.", "stem": "Which breed is being described in the above passage?", "options": {"A": "Kangayam", "B": "Khillari", "C": "Hallikar", "D": "Alambadi", "E": "Bargur"}, "correct": "E", "explanation": "This is the Bargur breed, found around Bargur hills in Bhavani taluk, Erode district, developed for hilly terrain work, brown with white markings, and cautious/shy of strangers.", "sprint": false, "id": 40}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "passage", "difficulty": "Moderate", "passage": "This breed is found around a specific hill range in the Bhavani taluk of Erode district, Tamil Nadu, and was developed for work in uneven hilly terrains. It is generally brown in colour with white markings, well-built, compact and of medium size, known for its speed and endurance in trotting, but is cautious in behaviour and tends to remain away from strangers.", "stem": "Which of the following characteristics is explicitly attributed to this breed in the passage?", "options": {"A": "Excellent milk yield exceeding 2000 litres/lactation", "B": "Origin from crossing with exotic breeds", "C": "Speed and endurance in trotting", "D": "Highest fat percentage among Indian cattle", "E": "All of the above"}, "correct": "C", "explanation": "The passage explicitly attributes speed and endurance in trotting to Bargur cattle, along with being cautious/shy of strangers.", "sprint": false, "id": 41}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "Which exotic dairy cattle breed, originating in the Netherlands (Friesland province), is the largest dairy breed with typical black-and-white markings?", "options": {"A": "Jersey", "B": "Brown Swiss", "C": "Ayrshire", "D": "Holstein Friesian", "E": "Guernsey"}, "correct": "D", "explanation": "Holstein Friesian, originating from northern Netherlands (Friesland), is the largest dairy breed, ruggedly built, with characteristic black-and-white markings.", "sprint": false, "id": 42}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "figure", "difficulty": "Moderate", "passage": null, "stem": "Which exotic cattle breed has the highest fat percentage in milk among exotic breeds, as noted in the chapter?", "options": {"A": "Holstein Friesian", "B": "Brown Swiss", "C": "Guernsey", "D": "Jersey", "E": "Ayrshire"}, "correct": "D", "explanation": "The chapter explicitly notes: 'Jersey has the highest fat% in exotic breeds' — with about 4.5% fat and average yield of 4500 kg/lactation.", "sprint": false, "id": 43}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which exotic breed, originating from a small island near France, produces milk with a distinctive golden colour due to high beta-carotene content?", "options": {"A": "Jersey", "B": "Holstein Friesian", "C": "Guernsey", "D": "Ayrshire", "E": "Brown Swiss"}, "correct": "C", "explanation": "Guernsey, originating from the small island of Guernsey, produces milk with a golden colour due to an exceptionally high content of beta-carotene.", "sprint": false, "id": 44}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "The Ayrshire cattle breed was also historically known by which other names?", "options": {"A": "Shanghai cattle", "B": "Dunlop cattle or Cunningham cattle", "C": "Kongu and Konganad", "D": "Wadad or Waged", "E": "Lola or Multani"}, "correct": "B", "explanation": "Ayrshire, originating in Scotland, was also known as Dunlop cattle or Cunningham cattle.", "sprint": false, "id": 45}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Karan Swiss is a crossbred cattle developed at NDRI, Karnal, by crossing Brown Swiss with which Indian breed?", "options": {"A": "Hariana", "B": "Sahiwal", "C": "Gir", "D": "Red Sindhi", "E": "Tharparkar"}, "correct": "B", "explanation": "Karan Swiss is the crossbred obtained by crossing Brown Swiss cattle with Sahiwal cattle, developed at NDRI, Karnal.", "sprint": false, "id": 46}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Karan Fries is a crossbreed developed from which two breeds?", "options": {"A": "Ayrshire and Red Sindhi", "B": "Brown Swiss and Sahiwal", "C": "Holstein-Friesian and Sahiwal", "D": "Jersey and Gir", "E": "Tharparkar and Holstein-Friesian"}, "correct": "E", "explanation": "Karan Fries is a crossbreed of Tharparkar and Holstein-Friesian, developed at NDRI Karnal.", "sprint": false, "id": 47}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "statement", "difficulty": "Hard", "passage": "1. Karan Swiss is a cross of Brown Swiss and Sahiwal.\n2. Karan Fries is a cross of Tharparkar and Holstein-Friesian.\n3. Frieswal is a cross of Holstein-Friesian and Sahiwal.\n4. Among the four breeds compared at NDRI Karnal, Karan Fries has the highest total lactation yield (3585 kg) followed by Karan Swiss (3602 kg).", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "2 and 4", "B": "Only 4", "C": "1 and 3", "D": "None of the above", "E": "Only 1"}, "correct": "B", "explanation": "Statement 4 reverses the figures — Karan Swiss actually has the highest total lactation yield (3602 kg) among the four, slightly ahead of Karan Fries (3585 kg), not the other way around. Statements 1, 2 and 3 correctly describe the crossbred origins.", "sprint": true, "id": 48}, {"topic": "Draught Cattle Breeds & Exotic/Crossbred Cattle", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "As per the NDRI Karnal performance data, which breed among Sahiwal, Tharparkar, Karan Swiss and Karan Fries has the highest fat percentage in milk?", "options": {"A": "Sahiwal (5.1%)", "B": "All are equal", "C": "Tharparkar (5.3%)", "D": "Karan Fries (4.1%)", "E": "Karan Swiss (4.2%)"}, "correct": "C", "explanation": "Among the four breeds at NDRI Karnal, Tharparkar has the highest fat percentage at 5.3%, followed by Sahiwal (5.1%), Karan Swiss (4.2%) and Karan Fries (4.1%).", "sprint": false, "id": 49}, {"topic": "Buffalo Breeds of India", "type": "passage", "difficulty": "Easy", "passage": "This is the most important breed of buffaloes, whose home tract is Rohtak, Hisar and Jind of Haryana, and Nabha and Patiala districts of Punjab. It is also called Delhi, Kundi, or Kali. Its colour is usually jet black, with a tightly curved horn as an important character, and it is one of the most efficient milk and butterfat producers in India, with a butterfat content of 7.8%.", "stem": "Which buffalo breed is being described in the above passage?", "options": {"A": "Bhadawari", "B": "Nili Ravi", "C": "Jaffarabadi", "D": "Surti", "E": "Murrah"}, "correct": "E", "explanation": "This is Murrah, from Rohtak/Hisar/Jind (Haryana) and Nabha/Patiala (Punjab), also called Delhi, Kundi, Kali, jet black with tightly curved horns, and 7.8% butterfat.", "sprint": false, "id": 50}, {"topic": "Buffalo Breeds of India", "type": "passage", "difficulty": "Moderate", "passage": "This is the most important breed of buffaloes, whose home tract is Rohtak, Hisar and Jind of Haryana, and Nabha and Patiala districts of Punjab. It is also called Delhi, Kundi, or Kali. Its colour is usually jet black, with a tightly curved horn as an important character, and it is one of the most efficient milk and butterfat producers in India, with a butterfat content of 7.8%.", "stem": "As per the chapter, which of the following is correctly stated about this breed?", "options": {"A": "It has distinctive white 'wall eyes'", "B": "It originated in Kathiawar, Gujarat", "C": "It has the highest fat percentage (13%) among all buffalo breeds", "D": "Age at first calving is 45-50 months and inter-calving period is 450-500 days", "E": "Average lactation yield exceeds 3000 kg"}, "correct": "D", "explanation": "Murrah's age at first calving is 45-50 months, with an inter-calving period of 450-500 days. The 13% fat and 'wall eyes' belong to Bhadawari and Nili Ravi respectively, not Murrah; average lactation yield is 1500-2000 kg.", "sprint": false, "id": 51}, {"topic": "Buffalo Breeds of India", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which buffalo breed is known for having distinctive white 'wall eyes' and is found in the Sutlej valley of Ferozpur district, Punjab?", "options": {"A": "Nili Ravi", "B": "Jaffarabadi", "C": "Mehsana", "D": "Toda", "E": "Murrah"}, "correct": "A", "explanation": "Nili Ravi, found in Sutlej valley (Ferozpur district, Punjab) and Sahiwal district (Pakistan), is known for its distinctive white 'wall eyes'.", "sprint": false, "id": 52}, {"topic": "Buffalo Breeds of India", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "Which buffalo breed has the highest fat percentage in milk (13%) among the breeds described in the chapter?", "options": {"A": "Nili Ravi", "B": "Toda", "C": "Bhadawari", "D": "Surti", "E": "Murrah"}, "correct": "C", "explanation": "Bhadawari, from Agra (UP), has the highest fat percentage at 13% among buffalo breeds listed, along with copper-coloured body coat.", "sprint": false, "id": 53}, {"topic": "Buffalo Breeds of India", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which buffalo breed is found in Kutch and Jamnagar districts of Gujarat, is massive in size, and is traditionally maintained by nomadic breeders called Maldharis?", "options": {"A": "Jaffarabadi", "B": "Godavari", "C": "Surti", "D": "Murrah", "E": "Mehsana"}, "correct": "A", "explanation": "Jaffarabadi, found in Kutch and Jamnagar districts of Gujarat (Gir forests), is massive, and traditionally maintained by nomadic Maldhari breeders.", "sprint": false, "id": 54}, {"topic": "Buffalo Breeds of India", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which buffalo breed has two white lines called 'Chevron' present on the lower side of the neck, similar to Surti buffaloes?", "options": {"A": "Mehsana", "B": "Godavari", "C": "Bhadawari", "D": "Nagpuri", "E": "Toda"}, "correct": "C", "explanation": "Bhadawari has two white lines called 'Chevron' at the lower neck, similar to Surti buffaloes.", "sprint": false, "id": 55}, {"topic": "Buffalo Breeds of India", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which buffalo breed, found in Kaira and Baroda districts of Gujarat, is known for two white collars — one around the jaw and the other at the brisket — and a high fat percentage of 8-12%?", "options": {"A": "Jaffarabadi", "B": "Mehsana", "C": "Bhadawari", "D": "Surti", "E": "Nagpuri"}, "correct": "D", "explanation": "Surti, from Kaira and Baroda districts of Gujarat, has two white collars (jaw and brisket regions) and high fat percentage (8-12%).", "sprint": false, "id": 56}, {"topic": "Buffalo Breeds of India", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Mehsana buffalo is a breed evolved by crossbreeding which two buffalo breeds?", "options": {"A": "Nagpuri and Surti", "B": "Murrah and Nili Ravi", "C": "Jaffarabadi and Bhadawari", "D": "Surti and Murrah", "E": "Godavari and Toda"}, "correct": "D", "explanation": "Mehsana buffalo evolved from crossbreeding between Surti and Murrah breeds.", "sprint": false, "id": 57}, {"topic": "Buffalo Breeds of India", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which buffalo breed, also called Elitchpuri or Barari, is black-coloured with white patches and has sword-shaped horns bending backward?", "options": {"A": "Nagpuri", "B": "Godavari", "C": "Mehsana", "D": "Surti", "E": "Toda"}, "correct": "A", "explanation": "Nagpuri (also called Elitchpuri or Barari), from Nagpur/Akola/Amrawati districts of Maharashtra, is black with white patches and has sword-shaped horns.", "sprint": false, "id": 58}, {"topic": "Buffalo Breeds of India", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which buffalo breed is named after a tribe of the Nilgiri Hills, is semi-wild, gregarious, and has horns forming a characteristic crescent shape?", "options": {"A": "Toda", "B": "Mehsana", "C": "Surti", "D": "Godavari", "E": "Nagpuri"}, "correct": "A", "explanation": "Toda buffalo, named after the Toda tribe of Nilgiri Hills, is semi-wild, gregarious, with crescent-shaped horns.", "sprint": false, "id": 59}, {"topic": "Buffalo Breeds of India", "type": "statement", "difficulty": "Hard", "passage": "1. Murrah has the best milk production among buffalo breeds with average fat around 7%.\n2. Bhadawari has the highest fat percentage (13%) among Indian buffalo breeds.\n3. Nili Ravi is known for 'wall eyes' and is found in the Montgomery and Firozpur regions.\n4. Godavari buffalo was developed purely as an indigenous breed with no crossing involved.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "2 and 4", "B": "None of the above", "C": "Only 4", "D": "Only 2", "E": "1 and 3"}, "correct": "C", "explanation": "Statement 4 is incorrect — Godavari buffalo originated from interbreed crossing, followed by grading up of local non-descript buffaloes with the Murrah breed; it is not purely indigenous with no crossing. Statements 1, 2 and 3 are correctly stated.", "sprint": true, "id": 60}, {"topic": "Buffalo Breeds of India", "type": "figure", "difficulty": "Moderate", "passage": null, "stem": "As per the buffalo breed summary table, which breed has the lowest average milk yield per lactation (500 kg) but a high fat content of 8%?", "options": {"A": "Murrah", "B": "Surti", "C": "Toda", "D": "Bhadawari", "E": "Nagpuri"}, "correct": "C", "explanation": "Toda buffalo has the lowest listed average milk yield (500 kg/lactation) among the breeds, but with a high fat content of 8%.", "sprint": false, "id": 61}, {"topic": "Goat & Sheep Breeds of India", "type": "passage", "difficulty": "Moderate", "passage": "This is the largest and most elegant of the long-legged goat breeds of India, found mainly in Uttar Pradesh. It has a pronounced Roman nose with a tuft of hair giving a parrot-mouth appearance, large folded pendulous ears, and a convex face line. An adult female weighs 45-60 kg while an adult male weighs 65-80 kg, with an average milk yield of 280 kg over a 274-day lactation.", "stem": "Which goat breed is being described in the above passage?", "options": {"A": "Sirohi", "B": "Barbari", "C": "Black Bengal", "D": "Beetal", "E": "Jamunapari"}, "correct": "E", "explanation": "This is Jamunapari, from Uttar Pradesh — the largest, most elegant long-legged Indian goat breed, with Roman nose/parrot mouth appearance and the given weight/yield figures.", "sprint": false, "id": 62}, {"topic": "Goat & Sheep Breeds of India", "type": "passage", "difficulty": "Moderate", "passage": "This is the largest and most elegant of the long-legged goat breeds of India, found mainly in Uttar Pradesh. It has a pronounced Roman nose with a tuft of hair giving a parrot-mouth appearance, large folded pendulous ears, and a convex face line. An adult female weighs 45-60 kg while an adult male weighs 65-80 kg, with an average milk yield of 280 kg over a 274-day lactation.", "stem": "Which of the following statements about this breed's milk is correct as per the passage and chapter?", "options": {"A": "Fat content exceeds 10%", "B": "It gives no milk at all, being a pure meat breed", "C": "Milk yield exceeds 500 kg per lactation", "D": "Fat content of the milk ranges between 3 to 3.5%", "E": "Average yield is 2 to 2.5 kg per day only during winters"}, "correct": "D", "explanation": "The chapter states Jamunapari's milk fat content ranges between 3 to 3.5%, with the ability to yield 2 to 2.5 kg of milk per day.", "sprint": false, "id": 63}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which goat breed is popular in urban areas of Delhi, U.P., Gurgaon, Karnal, Panipat and Rohtak, known as a good stall-fed breed that usually gives 2-3 kids per parturition?", "options": {"A": "Osmanabadi", "B": "Beetal", "C": "Sirohi", "D": "Barbari", "E": "Jamunapari"}, "correct": "D", "explanation": "Barbari is popular in urban areas of Delhi, UP, Gurgaon, Karnal, Panipat, and Rohtak, known for stall-feeding and 2-3 kids per parturition.", "sprint": false, "id": 64}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "Which goat breed, native to Western Bengal, is excellent for meat with black skin colour and is considered the most prolific among Indian breeds?", "options": {"A": "Black Bengal", "B": "Barbari", "C": "Jamunapari", "D": "Malabari", "E": "Beetal"}, "correct": "A", "explanation": "Black Bengal, from Western Bengal, is excellent for meat, has black skin (in demand for shoemaking), and is the most prolific among Indian goat breeds.", "sprint": false, "id": 65}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which goat breed, found in Gurdaspur (Punjab), resembles Jamunapari, and is notable for the presence of a beard in males?", "options": {"A": "Marwari", "B": "Osmanabadi", "C": "Jhakrana", "D": "Beetal", "E": "Sirohi"}, "correct": "D", "explanation": "Beetal, from Gurdaspur (Punjab), resembles Jamunapari and is a good dairy-type breed with a beard present in males.", "sprint": false, "id": 66}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which exotic goat breed is called the 'milk queen of goats' and originates from Switzerland?", "options": {"A": "Anglo-Nubian", "B": "Angora", "C": "Toggenburg", "D": "Alpine", "E": "Saanen"}, "correct": "E", "explanation": "Saanen, originating from Switzerland, is called the 'milk queen of goats'.", "sprint": false, "id": 67}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which exotic goat breed, originating in Turkey, is known for producing the lustrous fibre called mohair?", "options": {"A": "Angora", "B": "Anglo-Nubian", "C": "Saanen", "D": "Alpine", "E": "Boer"}, "correct": "A", "explanation": "Angora, originating in Turkey, produces the lustrous fibre known as mohair.", "sprint": false, "id": 68}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "The Anglo-Nubian goat breed, a cross of Indian Jamunapari and Egyptian Nubians, is sometimes called the 'Jersey cow' among goats because of:", "options": {"A": "Both good milk (5% fat) and meat production", "B": "Its origin in the island of Jersey", "C": "Its jet-black colour", "D": "Its ability to survive in cold climates only", "E": "Its extremely small body size"}, "correct": "A", "explanation": "Anglo-Nubian is called the 'Jersey cow' of goats due to both good milk production (5% fat) and meat qualities, similar to how the Jersey cattle breed is valued.", "sprint": false, "id": 69}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which region-wise classification does the Chokla sheep breed, called the 'Merino of Rajasthan', belong to?", "options": {"A": "Southern", "B": "Himalayan", "C": "Western", "D": "None of the above", "E": "Eastern"}, "correct": "C", "explanation": "Chokla belongs to the Western region classification of Indian sheep breeds (along with Lohi, Bikaneri/Pugal, Marwari, Jaisalmeri, Malpura, Hisardale), and is called the 'Merino of Rajasthan' for its fine carpet wool.", "sprint": false, "id": 70}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which sheep breed, found in Pakistan, is described as the 'largest sheep' among those listed under the Western region?", "options": {"A": "Malpura", "B": "Marwari", "C": "Jaisalmeri", "D": "Lohi", "E": "Chokla"}, "correct": "D", "explanation": "Lohi, native to Pakistan, is described as the 'largest sheep' among the Western-region breeds listed.", "sprint": false, "id": 71}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which sheep breed, formerly known as Bikaneri (also Bikaneri Chokhla/Chakri), is described as the only lustrous carpet-wool producing breed, found in villages around Bikaner?", "options": {"A": "Jaisalmeri", "B": "Magra", "C": "Marwari", "D": "Chokla", "E": "Nali"}, "correct": "B", "explanation": "Magra, formerly known as Bikaneri (also Bikaneri Chokhla/Chakri), is the only lustrous carpet-wool producing breed, found near Bikaner.", "sprint": false, "id": 72}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which sheep breed is described as the largest breed (in body size) among the eight breeds of Rajasthan, with a typical Roman nose and long drooping ears?", "options": {"A": "Jaisalmeri", "B": "Marwari", "C": "Chokla", "D": "Nali", "E": "Magra"}, "correct": "A", "explanation": "Jaisalmeri is the largest of the eight Rajasthan sheep breeds in body size, with a Roman nose and long drooping ears.", "sprint": false, "id": 73}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which sheep breed, found in Karnataka under the Southern region classification, is white in colour with a typical reverse 'U' shape from the rear end?", "options": {"A": "Mandya", "B": "Shahabadi", "C": "Balangir", "D": "Nellore", "E": "Deccani"}, "correct": "A", "explanation": "Mandya, from Karnataka (Southern region), is white in colour, compact-bodied, with the characteristic reverse 'U' shape from the rear.", "sprint": false, "id": 74}, {"topic": "Goat & Sheep Breeds of India", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Approximately what share of the world's wool production comes from Merino sheep and its crosses?", "options": {"A": "About 60%", "B": "About 80%", "C": "About 95%", "D": "About 20%", "E": "About 40%"}, "correct": "B", "explanation": "The chapter states that about 80% of the world's wool production comes from Merino and its crosses (the main exotic sheep breeds mentioned, along with Rambouillet).", "sprint": false, "id": 75}, {"topic": "Goat & Sheep Breeds of India", "type": "statement", "difficulty": "Hard", "passage": "1. Jamunapari is the largest and most elegant of the long-legged Indian goat breeds, native to Uttar Pradesh.\n2. Barbari is a dual-purpose breed suitable for stall feeding, known as the 'city goat'.\n3. Black Bengal is excellent for wool production and is native to Rajasthan.\n4. Sirohi is a dual-purpose breed with flattened, drooping, leaf-like ears.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "Only 1", "B": "1 and 2", "C": "Only 3", "D": "None of the above", "E": "3 and 4"}, "correct": "C", "explanation": "Statement 3 is incorrect — Black Bengal is excellent for meat (not wool) and is native to Western Bengal (not Rajasthan). Statements 1, 2 and 4 are correctly stated as per the chapter.", "sprint": true, "id": 76}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "passage", "difficulty": "Moderate", "passage": "These are the feedstuffs which contain more than 18 percent crude fibre and less than 60 percent Total Digestible Nutrients (TDN). Due to higher crude fibre content, they are more bulky and have lower digestibility as compared to another category of feed. The most common example of this type is grass; legumes such as lucerne, berseem and clover also fall in this category.", "stem": "________ is defined in the above passage. Which term fits the blank?", "options": {"A": "Unconventional feed stuff", "B": "Concentrates", "C": "Roughages", "D": "Feed additives", "E": "Feed supplements"}, "correct": "C", "explanation": "Roughages are feedstuffs with more than 18% crude fibre and less than 60% TDN, more bulky and less digestible than concentrates; grass and legumes like lucerne, berseem and clover are examples.", "sprint": false, "id": 77}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "passage", "difficulty": "Moderate", "passage": "These are the feedstuffs which contain more than 18 percent crude fibre and less than 60 percent Total Digestible Nutrients (TDN). Due to higher crude fibre content, they are more bulky and have lower digestibility as compared to another category of feed. The most common example of this type is grass; legumes such as lucerne, berseem and clover also fall in this category.", "stem": "Based on Digestible Crude Protein (DCP) content, which of the following is an example of the 'Production type' among this feed category, containing more than 5% DCP?", "options": {"A": "Green maize", "B": "Straw", "C": "Oat", "D": "Kadbi", "E": "Berseem, lucerne"}, "correct": "E", "explanation": "Production-type roughages contain more than 5% DCP — examples are Berseem and lucerne. Green maize and oat are Maintenance type (3-5% DCP); straw and kadbi are Non-maintenance type (less than 3% DCP).", "sprint": false, "id": 78}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "Which category of feedstuff contains less than 18 percent crude fibre and more than 60 percent TDN, making it a concentrated, highly digestible source of nutrients?", "options": {"A": "Green fodder", "B": "Unconventional feed stuff", "C": "Concentrates", "D": "Roughages", "E": "Feed additives"}, "correct": "C", "explanation": "Concentrates contain less than 18% crude fibre and more than 60% TDN, are less bulky, and have higher digestibility and nutritive value than roughages.", "sprint": false, "id": 79}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which of the following is an example of an Energy-Rich Concentrate?", "options": {"A": "Cereal grains", "B": "Blood meal", "C": "Fish meal", "D": "Oilseed cake", "E": "Brewer's yeast"}, "correct": "A", "explanation": "Cereal grains, cereal grain by-products, and roots/tubers are examples of Energy-Rich Concentrates. Fish meal and blood meal are animal-origin Protein-Rich Concentrates.", "sprint": false, "id": 80}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which feed additive category includes examples like Terramycin and Zinc bacitracin?", "options": {"A": "Antioxidants", "B": "Probiotics", "C": "Antibiotics", "D": "Coccidiostats", "E": "Enzymes"}, "correct": "C", "explanation": "Terramycin, Zinc bacitracin, and Flavomycin are examples of Antibiotic feed additives.", "sprint": false, "id": 81}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which feed additive category includes Amprolsol powder and Furasol powder as examples?", "options": {"A": "Mold inhibitors", "B": "Biostimulators", "C": "Pellet binders", "D": "Coccidiostats", "E": "Thyroprotein"}, "correct": "D", "explanation": "Amprolsol powder and Furasol powder are examples of Coccidiostats, a category of feed additives.", "sprint": false, "id": 82}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which of the following processing methods for feed involves treating straw with 1-3 percent urea, keeping moisture at 50 percent, and stacking for 20-30 days?", "options": {"A": "Formaldehyde treatment", "B": "Alkali treatment", "C": "Urea treatment", "D": "Chaffing", "E": "Pelleting"}, "correct": "C", "explanation": "Urea treatment involves treating poor-quality roughages with 1-3% urea at 50% moisture, stacked for 20-30 days, which breaks the lignocellulose complex and adds nitrogen.", "sprint": false, "id": 83}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which processing method for feed involves cutting roughages, especially fodder crops, into smaller size pieces to minimize wastage?", "options": {"A": "Chaffing", "B": "Heat treatment", "C": "Pelleting", "D": "Soaking", "E": "Grinding"}, "correct": "A", "explanation": "Chaffing is the process of cutting roughages (especially fodder crops) into smaller pieces to minimize fodder wastage.", "sprint": false, "id": 84}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "statement", "difficulty": "Hard", "passage": "1. Ruminants like cattle and buffaloes utilize micro-organisms in the rumen to digest feed.\n2. Buffaloes utilize fibre less efficiently than cattle, with a coefficient of digestion 5-8% lower.\n3. The recommended Ca:P ratio in animal feed is about 2:1.\n4. Lignin (wood-fibre) is not utilized by ruminants despite the presence of rumen microbes.", "stem": "Which of the above statements is/are INCORRECT?", "options": {"A": "None of the above", "B": "Only 2", "C": "Only 1", "D": "1 and 4", "E": "2 and 3"}, "correct": "B", "explanation": "Statement 2 is incorrect and reversed — buffaloes utilize fibre MORE efficiently than cattle, with a coefficient of digestion 5-8% HIGHER, not lower. Statements 1, 3 and 4 are correctly stated.", "sprint": true, "id": 85}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "statement", "difficulty": "Moderate", "passage": "1. The average Dry Matter (DM) requirement of a desi cow is 2 (dry) to 2.5 (lactating) kg per 100 kg body weight per day.\n2. For crossbred cows/buffaloes, DM requirement is 2.5 (dry) to 3.0 kg (lactating) per 100 kg body weight per day.\n3. A lactating animal should be given 1 kg additional concentrate for every 2.5 kg (buffalo) to 3 kg (cow) milk produced.\n4. Pregnant cows/buffaloes should receive an extra 3 kg per day of concentrate during advanced pregnancy.", "stem": "Which of the above statements is/are correct?", "options": {"A": "1, 2, 3 and 4", "B": "Only 1", "C": "2 and 3 only", "D": "1, 2 and 3", "E": "1 and 4 only"}, "correct": "D", "explanation": "Statement 4 is incorrect — pregnant cows/buffaloes should receive an extra 1.5 kg per day of concentrate (not 3 kg) during advanced pregnancy. Statements 1, 2 and 3 are correctly stated as per the thumb rule for cattle feeding.", "sprint": true, "id": 86}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "figure", "difficulty": "Hard", "passage": null, "stem": "As per the thumb rule for cattle feeding, breeding bulls in service should be given how much extra concentrate per day to maintain health and sex libido?", "options": {"A": "2 kg", "B": "2.5 kg", "C": "1.5 kg", "D": "1 kg", "E": "0.5 kg"}, "correct": "D", "explanation": "Breeding bulls in service should get 1 kg per day extra concentrate allowance to maintain good health and sex libido.", "sprint": false, "id": 87}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "figure", "difficulty": "Moderate", "passage": null, "stem": "As per the NABARD model project's feeding schedule, calves should be fed how much colostrum per day for the first 3 days following birth?", "options": {"A": "3 to 3.5 litres", "B": "2 to 2.5 litres", "C": "1 to 1.5 litres", "D": "0.5 to 1 litre", "E": "4 to 5 litres"}, "correct": "B", "explanation": "Calves should be fed 2 to 2.5 litres of colostrum daily for the first 3 days after birth, given within 15 minutes of calving.", "sprint": false, "id": 88}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "As per the colostrum feeding schedule, at what rate (relative to body weight) should buffalo calves be fed colostrum?", "options": {"A": "1/20th of body weight", "B": "1/8th of body weight", "C": "1/10th of body weight", "D": "1/5th of body weight", "E": "1/15th of body weight"}, "correct": "E", "explanation": "Cow calves should be fed colostrum at 1/10th of body weight while buffalo calves are fed at the rate of 1/15th of body weight.", "sprint": false, "id": 89}, {"topic": "Feeding, Fodder Classification & Nutrition", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Colostrum's immunoglobulins are best absorbed by a newborn calf within which window after birth?", "options": {"A": "72 hours only", "B": "2-4 hours (up to 16-27 hours)", "C": "1 week", "D": "Immediately and not thereafter", "E": "24-48 hours only"}, "correct": "B", "explanation": "Immunoglobulins in colostrum are absorbed during the first 16-27 hours after birth, preferably within 2-4 hours of age.", "sprint": false, "id": 90}, {"topic": "Breeding Systems, Artificial Insemination & Embryo Transfer", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Mating of a Grand-son and Grand-daughter, or half-brother and half-sister, is an example of which type of inbreeding?", "options": {"A": "Close breeding", "B": "Line breeding", "C": "Species hybridization", "D": "Grading up", "E": "Out crossing"}, "correct": "B", "explanation": "Line breeding is the mating of distinctly related animals like grandson-granddaughter or half-siblings, promoting uniformity in progeny.", "sprint": false, "id": 91}, {"topic": "Breeding Systems, Artificial Insemination & Embryo Transfer", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Mating of a Dam and her son, or a Sire and his Daughter, is an example of which type of inbreeding?", "options": {"A": "Cross breeding", "B": "Close breeding", "C": "Grading up", "D": "Line breeding", "E": "Out crossing"}, "correct": "B", "explanation": "Close breeding involves mating closely related animals like dam-son or sire-daughter, developing uniform progeny.", "sprint": false, "id": 92}, {"topic": "Breeding Systems, Artificial Insemination & Embryo Transfer", "type": "recall", "difficulty": "Easy", "passage": null, "stem": "The mating of unrelated purebred animals within the same breed (e.g., unrelated Deoni sire × Deoni cow) is called:", "options": {"A": "Species hybridization", "B": "Grading up", "C": "Out crossing", "D": "Cross breeding", "E": "Close breeding"}, "correct": "C", "explanation": "Out crossing is mating of unrelated purebred animals within the same breed, considered the best method for genetic improvement within a breed.", "sprint": false, "id": 93}, {"topic": "Breeding Systems, Artificial Insemination & Embryo Transfer", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Mating of a Jack (male ass) with a Mare (female horse) to produce a Mule is an example of:", "options": {"A": "Out crossing", "B": "Grading up", "C": "Cross breeding", "D": "Close breeding", "E": "Species hybridization"}, "correct": "E", "explanation": "Species hybridization is mating of animals of two different species, e.g., Jack × Mare producing a Mule, or European cattle × American buffalo producing Catallo.", "sprint": false, "id": 94}, {"topic": "Breeding Systems, Artificial Insemination & Embryo Transfer", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "In which type of systematic cross-breeding are F1(AB) females back-crossed to breed B, and F1(AB) males back-crossed to breed A, and so on?", "options": {"A": "Double cross", "B": "Single cross", "C": "Three-way rotational cross", "D": "Criss crossing (Reciprocal back crossing)", "E": "Back cross"}, "correct": "D", "explanation": "Criss crossing (Reciprocal back crossing) involves F1(AB) females being back-crossed to breed B and F1(AB) males back-crossed to breed A, repeating in rotation.", "sprint": false, "id": 95}, {"topic": "Breeding Systems, Artificial Insemination & Embryo Transfer", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Grading up is generally used for improvement of non-descript animals. After how many generations do the graded animals become more or less similar to the pure breed used for grading (reaching 98-99% inheritance)?", "options": {"A": "10 to 12 generations", "B": "1 to 2 generations", "C": "3 to 4 generations", "D": "8 to 10 generations", "E": "5 to 6 generations"}, "correct": "E", "explanation": "After about 5 to 6 generations of grading up, the animals will be more or less similar to the pure breed used for grading, reaching nearly 98-99% inheritance of the original breed.", "sprint": false, "id": 96}, {"topic": "Breeding Systems, Artificial Insemination & Embryo Transfer", "type": "statement", "difficulty": "Hard", "passage": "1. Artificial Insemination (AI) reduces the chances of spread of venereal diseases like brucellosis and trichomoniasis.\n2. AI increases the market value of breeding bulls significantly.\n3. AI permits crossbreeding to improve production performance and reduces the number of bulls required.\n4. AI is a low-cost technique requiring no special training.", "stem": "Which of the above statements is/are correct?", "options": {"A": "2 and 4", "B": "1, 2, 3 and 4", "C": "Only 2", "D": "1, 2 and 3", "E": "Only 1 and 3"}, "correct": "E", "explanation": "Statements 2 and 4 are incorrect — AI actually reduces the market value of bulls (a limitation) and is a costly technique requiring well-trained operators and special instruments (also a limitation), not low-cost/untrained. Statements 1 and 3 are correctly listed as advantages of AI.", "sprint": true, "id": 97}, {"topic": "Breeding Systems, Artificial Insemination & Embryo Transfer", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "In Embryo Transfer Technology, the sexually mature female injected with hormones to produce more ova is called the:", "options": {"A": "Teaser", "B": "Buller", "C": "Surrogate", "D": "Donor", "E": "Recipient"}, "correct": "D", "explanation": "The donor is the sexually mature female injected with exogenous hormones to super-ovulate and produce more ova for embryo transfer.", "sprint": false, "id": 98}, {"topic": "Breeding Systems, Artificial Insemination & Embryo Transfer", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "In a Three-way cross breeding programme, the first-generation crossbred females (from breeds A and B) are crossed with males of which breed?", "options": {"A": "They are crossed with each other", "B": "Breed B again", "C": "Breed A again", "D": "No further crossing occurs", "E": "A third breed (Breed C)"}, "correct": "E", "explanation": "In three-way crosses, the F1 crossbred females (from A×B) are crossed with males of a third breed (C), using the hybrid vigor of the dam.", "sprint": false, "id": 99}, {"topic": "Nutrient Deficiencies in Livestock", "type": "passage", "difficulty": "Moderate", "passage": "This is a highly fatal disease of livestock caused by magnesium deficiency, occurring especially when there is a change from indoor feeding to outdoor grazing. It is also called 'Grass Staggers'. Symptoms include excitability, inability to stand, stiff muscles, convulsions and sometimes death. It is associated with grazing on lush, newly emerging grass that is low in magnesium and high in potassium and nitrogen.", "stem": "________ is being described in the above passage. Identify the condition.", "options": {"A": "Protein Deficiency", "B": "Secondary Hyperparathyroidism", "C": "Milk Fever", "D": "Phosphorus Deficiency", "E": "Grass Tetany"}, "correct": "E", "explanation": "Grass Tetany (also called Grass Staggers) is caused by magnesium deficiency, often triggered by a switch from indoor feeding to grazing on lush grass low in Mg and high in K/N.", "sprint": false, "id": 100}, {"topic": "Nutrient Deficiencies in Livestock", "type": "passage", "difficulty": "Moderate", "passage": "This is a highly fatal disease of livestock caused by magnesium deficiency, occurring especially when there is a change from indoor feeding to outdoor grazing. It is also called 'Grass Staggers'. Symptoms include excitability, inability to stand, stiff muscles, convulsions and sometimes death. It is associated with grazing on lush, newly emerging grass that is low in magnesium and high in potassium and nitrogen.", "stem": "Which mineral deficiency is directly responsible for this condition?", "options": {"A": "Magnesium", "B": "Phosphorus", "C": "Copper", "D": "Zinc", "E": "Calcium"}, "correct": "A", "explanation": "Grass Tetany is directly caused by a low level of magnesium in the blood, distinct from Milk Fever which is caused by low blood calcium (hypocalcaemia).", "sprint": false, "id": 101}, {"topic": "Nutrient Deficiencies in Livestock", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Milk Fever, a metabolic disorder mainly affecting dairy cows close to calving, is caused by a low blood level of which mineral?", "options": {"A": "Calcium", "B": "Potassium", "C": "Phosphorus", "D": "Magnesium", "E": "Sodium"}, "correct": "A", "explanation": "Milk Fever is caused by a low blood calcium level (hypocalcaemia), distinct from Grass Tetany which is caused by magnesium deficiency.", "sprint": false, "id": 102}, {"topic": "Nutrient Deficiencies in Livestock", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "'Steely wool' condition in sheep, where wool loses its crimp and colour, becoming hair-like, is a symptom of which mineral deficiency?", "options": {"A": "Zinc", "B": "Cobalt", "C": "Selenium", "D": "Copper", "E": "Iodine"}, "correct": "D", "explanation": "Copper deficiency in sheep causes the 'steely wool' condition where wool loses its crimp, becomes hair-like, and loses colour.", "sprint": false, "id": 103}, {"topic": "Nutrient Deficiencies in Livestock", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Which mineral deficiency in cattle, buffaloes and sheep causes enlargement of the thyroid gland known as 'goitre'?", "options": {"A": "Cobalt", "B": "Zinc", "C": "Copper", "D": "Selenium", "E": "Iodine"}, "correct": "E", "explanation": "Iodine deficiency causes goitre (enlarged thyroid gland), particularly noted in areas lacking iodine in salt/water and in sub-mountainous Himalayan regions.", "sprint": false, "id": 104}, {"topic": "Nutrient Deficiencies in Livestock", "type": "recall", "difficulty": "Hard", "passage": null, "stem": "Sheep grazing on molybdenum-rich grasses may give birth to lambs showing a 'copper-deficient nervous syndrome' known as:", "options": {"A": "Wall eye", "B": "Sway back", "C": "Grass staggers", "D": "Perosis", "E": "Steely wool"}, "correct": "B", "explanation": "Lambs born to ewes grazing molybdenum-rich grass may show 'sway back', a copper-deficient nervous syndrome caused by molybdenum-induced copper deficiency.", "sprint": false, "id": 105}, {"topic": "Nutrient Deficiencies in Livestock", "type": "recall", "difficulty": "Moderate", "passage": null, "stem": "Which condition refers to the excessive secretion of parathyroid hormone in response to hypocalcemia, especially seen in animals fed high-bran or all-meat diets without supplements?", "options": {"A": "Secondary Hyperparathyroidism", "B": "Phosphorus Deficiency", "C": "Osteoporosis", "D": "Grass Tetany", "E": "Milk Fever"}, "correct": "A", "explanation": "Secondary Hyperparathyroidism (SHPT) i
