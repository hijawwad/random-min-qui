l solarisation routes."},{"id":157,"section":19,"type":"Numbered statements","level":"Hard","stem":"Match the PM-KUSUM components with the targets printed in the notes.","passage":"","items":["Component C targets 35 lakh pump solarisations.","Component A targets 10,000 MW.","Component B targets 14 lakh standalone pumps.","Component B targets 35 lakh standalone pumps."],"opts":["1, 2, 3 and 4","1, 2 and 3","1 and 2","1 and 3","2 and 3"],"key":1,"source":"Notes p. 12","pyq":null,"refs":["KUSUM"],"why":"These are the stated targets, distinct from achievements. MNRE reports the combined B and C target as 49 lakh pumps."},{"id":158,"section":19,"type":"Numbered statements","level":"Hard","stem":"Component A permits decentralised renewable power plants on qualifying land.","passage":"","items":["Eligible plant capacity can be up to 2 MW.","The generated electricity is necessarily consumed only by the farmer’s own pump.","A landowner leasing land to a developer can earn lease rent.","Farmers can participate through cooperatives or FPOs."],"opts":["3 and 4","1, 2 and 3","1 and 4","1, 3 and 4","2, 3 and 4"],"key":3,"source":"Notes p. 12","pyq":null,"refs":["KUSUM0"],"why":"DISCOMs can purchase the generated power at the prescribed tariff. Farmer groups, developers and other eligible entities can participate."},{"id":159,"section":19,"type":"Applied scenario","level":"Moderate","stem":"Assume the historical Component B dark-zone conditions in the chapter apply. Which applications fit those conditions?","passage":"","items":["A dark-zone farmer proposes replacing an existing diesel pump and uses micro-irrigation.","A dark-zone farmer requests a new standalone pump with no diesel pump being replaced.","A farmer outside a dark zone requests an eligible standalone solar pump."],"opts":["None of the above","Only 1","1, 2 and 3","Only 3","1 and 3"],"key":4,"source":"Notes p. 12","pyq":null,"refs":[],"why":"The notes allow dark-zone conversion of existing diesel pumps with micro-irrigation. They exclude new standalone pumps in dark zones."},{"id":160,"section":19,"type":"Figure recall","level":"Moderate","stem":"What production-based incentive to DISCOMs does the notes’ Component A table quote?","passage":"","items":[],"opts":["40 paise/kWh or ₹6.60 lakh/MW/year","60 paise/kWh or ₹10 lakh/MW/year","30 paise/kWh or ₹5 lakh/MW/year","50 paise/kWh or ₹6.60 lakh/MW/year","40 paise/kWh or ₹3.30 lakh/MW/year"],"key":0,"source":"Notes p. 12","pyq":null,"refs":[],"why":"The cited incentive runs for five years, with a maximum aggregate of ₹33 lakh/MW."},{"id":161,"section":19,"type":"Numbered statements","level":"Hard","stem":"Check the central financial assistance pattern for Components B and C.","passage":"","items":["The table gives the same 30% rate for eligible North-Eastern, hilly and island areas.","The ordinary central assistance rate shown is 30%.","The special-area rate shown is 50%.","Component C includes solarisation at the feeder level."],"opts":["2 and 3","1, 2, 3 and 4","2 and 4","3 and 4","2, 3 and 4"],"key":4,"source":"Notes p. 12","pyq":null,"refs":["KUSUM0"],"why":"The special-area rate is 50% in the notes and the MNRE guideline. These are central rates, separate from other shares."},{"id":162,"section":20,"type":"Concept identification","level":"Easy","stem":"A Central Sector pilot involves local communities in water budgeting and demand management in water-stressed Gram Panchayats. It was partly World Bank funded. Which scheme fits?","passage":"________ involved local communities in managing groundwater demand in water-stressed Gram Panchayats. The pilot combined local water planning with monitoring and capacity building. It was partly supported by the World Bank.","items":[],"opts":["Atal Bhujal Yojana","Mission Kakatiya","Per Drop More Crop","Long Term Irrigation Fund","National Water Mission"],"key":0,"source":"Notes p. 12","pyq":null,"refs":[],"why":"Atal Jal uses participatory, demand-side groundwater management, with an approved outlay of ₹6,000 crore."},{"id":163,"section":20,"type":"Figure recall","level":"Moderate","stem":"What outlay is associated with Atal Bhujal Yojana in the chapter?","passage":"________ involved local communities in managing groundwater demand in water-stressed Gram Panchayats. The pilot combined local water planning with monitoring and capacity building. It was partly supported by the World Bank.","items":[],"opts":["₹6,000 crore","₹2,000 crore","₹1,600 crore","₹5,000 crore","₹10,000 crore"],"key":0,"source":"Notes p. 12","pyq":null,"refs":[],"why":"The chapter gives ₹6,000 crore and identifies partial World Bank funding."},{"id":164,"section":20,"type":"Numbered statements","level":"Hard","stem":"Identify activities and places covered by Atal Jal.","passage":"","items":["It includes demand-side groundwater interventions.","Punjab and Bihar are among its seven pilot states.","Monitoring networks and local capacity building are part of the approach.","The notes specify women’s participation in scheme activities."],"opts":["Only 4","1, 3 and 4","1 and 4","3 and 4","1 and 3"],"key":1,"source":"Notes p. 12","pyq":null,"refs":["ATAL"],"why":"The seven states are Gujarat, Haryana, Karnataka, Madhya Pradesh, Maharashtra, Rajasthan and Uttar Pradesh."},{"id":165,"section":20,"type":"Figure recall","level":"Moderate","stem":"What pilot coverage is reported in the August 2026 parliamentary reply on Atal Bhujal Yojana?","passage":"","items":[],"opts":["8,203 Gram Panchayats, 220 blocks, 90 districts","8,213 Gram Panchayats, 230 blocks, 80 districts","8,203 Gram Panchayats, 229 blocks, 80 districts","8,203 Gram Panchayats, 229 blocks, 70 districts","8,213 Gram Panchayats, 229 blocks, 80 districts"],"key":2,"source":"Notes p. 12","pyq":null,"refs":["ATAL"],"why":"The August 2026 reply reports 8,203, 229 and 80. The notes print 8,213 Gram Panchayats."},{"id":166,"section":20,"type":"Technical recall","level":"Easy","stem":"When did the Atal Jal pilot begin?","passage":"","items":[],"opts":["9 April 2025","1 July 2015","1 April 2020","1 April 2019","30 June 2008"],"key":2,"source":"Notes p. 12","pyq":null,"refs":["ATAL"],"why":"The original start date was 1 April 2020. The August 2026 parliamentary reply records implementation through 15 October 2025."},{"id":167,"section":21,"type":"Technical recall","level":"Easy","stem":"Which NABARD fund was operationalised in 2016–17 to fast-track identified major and medium irrigation projects?","passage":"","items":[],"opts":["RIDF","AIBP","MIF","LTIF","WDC"],"key":3,"source":"Notes pp. 12–13","pyq":null,"refs":[],"why":"LTIF targeted 99 identified projects in 18 states, with additional named projects in the chapter."},{"id":168,"section":21,"type":"Numbered statements","level":"Hard","stem":"The Long Term Irrigation Fund has a central-share and a state-share financing route.","passage":"","items":["NWDA receives loan support for the central share.","The chapter gives a 15-year tenor.","DISCOMs are listed as borrowers for the state share.","State governments receive loan support for their share."],"opts":["2 and 4","1, 2 and 4","1, 2, 3 and 4","1 and 4","1 and 2"],"key":1,"source":"Notes pp. 12–13","pyq":null,"refs":[],"why":"The state share is financed through state governments. The NWDA is under the Ministry of Jal Shakti."},{"id":169,"section":21,"type":"Technical recall","level":"Easy","stem":"Which project is listed under LTIF beyond the 99 priority projects?","passage":"","items":[],"opts":["Sardar Sarovar","Tehri","Hirakud","Polavaram","Bhakra Nangal"],"key":3,"source":"Notes pp. 12–13","pyq":null,"refs":[],"why":"Other additional examples are North Koel, Sirhind and Rajasthan Feeders relining, and Shahpur Kandi Dam."},{"id":170,"section":21,"type":"Figure recall","level":"Moderate","stem":"What was the initial corpus and augmented total for the Micro Irrigation Fund in the notes?","passage":"","items":[],"opts":["₹5,000 crore and ₹6,000 crore","₹2,000 crore and ₹5,000 crore","₹5,000 crore and ₹10,000 crore","₹4,709 crore and ₹5,000 crore","₹6,000 crore and ₹10,000 crore"],"key":2,"source":"Notes pp. 12–13","pyq":null,"refs":[],"why":"The corpus was augmented by another ₹5,000 crore. The ₹4,709 crore figure is separately stated as approved loans in the notes’ snapshot."},{"id":171,"section":21,"type":"Technical recall","level":"Easy","stem":"What interest subvention does the Economic Survey 2024–25 cite for state loans under MIF?","passage":"","items":[],"opts":["4%","1%","2%","5%","3%"],"key":2,"source":"Notes pp. 12–13","pyq":null,"refs":["ES"],"why":"The Survey cites 2% interest subvention. MIF enables states to finance expanded micro-irrigation and related initiatives."},{"id":172,"section":21,"type":"Numbered statements","level":"Hard","stem":"Distinguish the start, loan terms and eligible activities of RIDF.","passage":"","items":["The stated loan quantum is 80–95% of project cost.","The usual repayment cited is 15 years with no grace period.","Eligible activities include rural connectivity and social-sector infrastructure.","RIDF began in 1995–96 with a ₹2,000 crore corpus."],"opts":["1 and 3","3 and 4","1, 2, 3 and 4","1, 3 and 4","Only 4"],"key":3,"source":"Notes pp. 12–13","pyq":null,"refs":[],"why":"The chapter gives seven years, including two years of grace. The 15-year tenor is for LTIF."},{"id":173,"section":21,"type":"Figure recall","level":"Moderate","stem":"How much was allocated to RIDF in FY2024, corresponding to RIDF XXIX?","passage":"","items":[],"opts":["₹44,605 crore","₹37,454 crore","₹49,730 crore","₹40,475 crore","₹35,180 crore"],"key":3,"source":"Notes pp. 12–13","pyq":null,"refs":["RIDF"],"why":"NABARD reports a ₹40,475 crore FY2024 allocation. ₹49,730 crore was mobilised as RIDF deposits in that year."},{"id":174,"section":21,"type":"Applied scenario","level":"Moderate","stem":"Which RIDF applications fit institutions or activities listed in the notes?","passage":"","items":["A state-owned corporation proposes an eligible rural-connectivity project.","A private applicant applies directly for a personal consumption loan.","A PRI proposes an eligible rural infrastructure project."],"opts":["1 and 3","Only 1","1, 2 and 3","Only 3","1 and 2"],"key":0,"source":"Notes pp. 12–13","pyq":null,"refs":[],"why":"Eligible institutions include state governments, state-owned corporations and PRIs. The chapter also lists SHGs and NGOs through nodal departments."},{"id":175,"section":21,"type":"Technical recall","level":"Easy","stem":"To what benchmark is the RIDF interest rate linked in the notes?","passage":"","items":[],"opts":["Cash reserve ratio","Marginal standing facility rate","Reverse repo rate","Treasury-bill cut-off yield","Bank Rate"],"key":4,"source":"Notes pp. 12–13","pyq":null,"refs":[],"why":"The notes link RIDF interest to Bank Rate from April 2012."},{"id":176,"section":22,"type":"Technical recall","level":"Easy","stem":"When was the original Command Area Development Programme launched?","passage":"","items":[],"opts":["1995–96","1986–87","1972–73","1974–75","2015–16"],"key":3,"source":"Notes p. 13","pyq":null,"refs":[],"why":"It began in 1974–75 to improve use of created irrigation potential and support production."},{"id":177,"section":22,"type":"Applied scenario","level":"Moderate","stem":"Which assignments follow the distinction between system-level and on-farm works?","passage":"","items":["Installing a turnout below the outlet is on-farm development.","Lining a farmer’s field channel below the outlet is system-level work.","Modernising a distributary above the government outlet is system-level work."],"opts":["1 and 3","Only 3","1, 2 and 3","1 and 2","Only 1"],"key":0,"source":"Notes p. 13","pyq":null,"refs":[],"why":"The government outlet is the dividing point in this classification."},{"id":178,"section":22,"type":"Concept identification","level":"Easy","stem":"Irrigation users take part in decisions and management throughout the irrigation system via local institutions. What approach is this?","passage":"________ places irrigation users in a role in managing the system beyond the lowest level of delivery. Water Users’ Associations and Pani Panchayats are among the institutions through which users organise. Odisha’s experience includes a statutory framework and a medium-irrigation project in Mayurbhanj.","items":[],"opts":["Participatory Irrigation Management","Supply-only canal management","Centralised irrigation allocation","Private groundwater leasing","Irrigation Potential Utilized"],"key":0,"source":"Notes p. 13","pyq":null,"refs":[],"why":"PIM involves users at all levels. Water Users’ Associations and Pani Panchayats are examples."},{"id":179,"section":22,"type":"Numbered statements","level":"Hard","stem":"Evaluate these examples and completion conditions for PIM.","passage":"________ places irrigation users in a role in managing the system beyond the lowest level of delivery. Water Users’ Associations and Pani Panchayats are among the institutions through which users organise. Odisha’s experience includes a statutory framework and a medium-irrigation project in Mayurbhanj.","items":["Odisha’s Pani Panchayat framework is linked to a 2002 Act.","Transfer of control to a WUA is listed as a CADWM completion condition.","The Sunei example is from Mayurbhanj, Odisha.","Mexico and Turkey are listed as Indian state examples."],"opts":["Only 3","1, 2, 3 and 4","1 and 2","1, 2 and 3","1 and 3"],"key":3,"source":"Notes p. 13","pyq":null,"refs":[],"why":"Mexico and Turkey are international examples. The Sunei case reports 36% yield improvement in a drought-like kharif season."},{"id":180,"section":22,"type":"Figure recall","level":"Moderate","stem":"What yield increase does the chapter report for the Sunei project example during kharif 2015–16?","passage":"","items":[],"opts":["46%","39%","36%","26%","30%"],"key":2,"source":"Notes p. 13","pyq":null,"refs":[],"why":"The cited Sunei example reports a 36% yield increase under drought-like conditions."},{"id":181,"section":22,"type":"Figure recall","level":"Moderate","stem":"As of 31 May 2018, how many Odisha Pani Panchayats were reported formed through elections in the notes?","passage":"","items":[],"opts":["30,033","28,105","32,105","24,105","28,305"],"key":1,"source":"Notes p. 13","pyq":null,"refs":[],"why":"The dated snapshot distinguishes 28,105 formed through elections from 30,033 programmed."},{"id":182,"section":23,"type":"Technical recall","level":"Easy","stem":"Which centrifugal pump class is associated with the specific-speed band 300–900 in the chapter?","passage":"","items":[],"opts":["Mixed flow","High-speed radial flow","Slow-speed radial flow","Axial flow","Medium-speed radial flow"],"key":2,"source":"Notes pp. 13–14","pyq":null,"refs":[],"why":"The table gives 300–900 for slow radial and 900–1,500 for medium radial."},{"id":183,"section":23,"type":"Applied scenario","level":"Moderate","stem":"Which pump selections match the listed specific-speed class at the stated value?","passage":"","items":["At 1,200, medium-speed radial flow.","At 10,000, axial or propeller flow.","At 1,800, slow-speed radial flow."],"opts":["1 and 3","Only 2","1, 2 and 3","1 and 2","Only 1"],"key":3,"source":"Notes pp. 13–14","pyq":null,"refs":[],"why":"1,800 falls in high-speed radial flow. Axial or propeller flow spans 3,400–15,000 and overlaps with mixed flow lower down."},{"id":184,"section":23,"type":"Technical recall","level":"Easy","stem":"Which principle is cited for centrifugal pumping in the notes?","passage":"","items":[],"opts":["Outward action from the impeller","Tidal pressure alone","Only capillary rise","Gravity flow through borders","Static suction without moving parts"],"key":0,"source":"Notes pp. 13–14","pyq":null,"refs":[],"why":"A rotating impeller imparts energy to the liquid and directs it outward."},{"id":185,"section":23,"type":"Concept identification","level":"Easy","stem":"A village stores runoff in a small reservoir for supplemental irrigation, livestock and fish production. Which decentralised technique is used?","passage":"A community can retain rainfall runoff in small structures before it leaves the catchment. Stored water may be used for supplemental irrigation, livestock or fish production. Other structures slow run-off or assist recharge, while crop and soil management can conserve moisture in place.","items":[],"opts":["Canal head sluice","Field drain","Farm pond","Deep tube-well","Subsurface drip lateral"],"key":2,"source":"Notes pp. 13–14","pyq":null,"refs":[],"why":"Farm ponds capture surface runoff and support several local uses."},{"id":186,"section":23,"type":"Numbered statements","level":"Hard","stem":"Match the water-conservation initiatives to their areas or activities.","passage":"","items":["Mission Kakatiya restores minor irrigation tanks and ponds in Telangana.","Jal Shakti Abhiyan includes restoration and rainwater harvesting.","Jalyukt Shivar is associated with Maharashtra.","Jalyukt Shivar is listed as a national crop-insurance scheme."],"opts":["1 and 3","1, 2 and 3","1 and 2","1, 2, 3 and 4","2 and 3"],"key":1,"source":"Notes pp. 13–14","pyq":null,"refs":[],"why":"Jalyukt Shivar is a Maharashtra water-conservation initiative. The Paani Foundation is another Maharashtra example mentioned in the notes."},{"id":187,"section":24,"type":"Applied scenario","level":"Moderate","stem":"Which are structural or engineering water-conservation measures?","passage":"A community can retain rainfall runoff in small structures before it leaves the catchment. Stored water may be used for supplemental irrigation, livestock or fish production. Other structures slow run-off or assist recharge, while crop and soil management can conserve moisture in place.","items":["Constructing a check dam.","Switching to mulching as an agronomic practice.","Building a percolation tank."],"opts":["Only 3","1, 2 and 3","1 and 2","Only 1","1 and 3"],"key":4,"source":"Notes pp. 14–15","pyq":null,"refs":[],"why":"The chapter classifies check dams, percolation tanks and farm ponds as structural measures. Mulching is agronomic."},{"id":188,"section":24,"type":"Numbered statements","level":"Hard","stem":"Identify water conservation interventions by their category.","passage":"","items":["Participatory irrigation management is categorised as a field tillage operation.","Demand-side management is policy-based.","Strip cropping and cover crops are agronomic.","Restoration of water bodies is listed as a structural measure."],"opts":["3 and 4","2, 3 and 4","1, 2, 3 and 4","2 and 3","1 and 3"],"key":1,"source":"Notes pp. 14–15","pyq":null,"refs":[],"why":"PIM is policy-based. Agronomic examples also include agroforestry and conservation tillage."},{"id":189,"section":24,"type":"Concept identification","level":"Easy","stem":"A rainfed crop uses precipitation stored as soil moisture in the root zone. What category of water footprint does this represent?","passage":"Water used in production can be classified by where it came from. A rainfed plant may draw on precipitation stored as moisture in its root zone. Irrigated fields and factories may instead consume water withdrawn from rivers or aquifers.","items":[],"opts":["Virtual-water export alone","Blue footprint","Green footprint","Grey footprint","Groundwater extraction stage"],"key":2,"source":"Notes pp. 14–15","pyq":null,"refs":[],"why":"Green water is rainwater stored in the soil and consumed or incorporated by plants."},{"id":190,"section":24,"type":"Concept identification","level":"Easy","stem":"A processor estimates the freshwater volume needed to assimilate discharged pollutants to a given standard. Which footprint is being estimated?","passage":"","items":[],"opts":["Green footprint","Rainfall footprint","Blue footprint","Grey footprint","Conveyance footprint"],"key":3,"source":"Notes pp. 14–15","pyq":null,"refs":[],"why":"Grey water footprint estimates the freshwater required to meet a pollution standard."},{"id":191,"section":24,"type":"Applied scenario","level":"Moderate","stem":"Which cases illustrate blue water consumption?","passage":"Water used in production can be classified by where it came from. A rainfed plant may draw on precipitation stored as moisture in its root zone. Irrigated fields and factories may instead consume water withdrawn from rivers or aquifers.","items":["A rice field uses river water that is consumed through evapotranspiration.","A factory uses extracted groundwater that is incorporated into its product.","A rainfed orchard consumes precipitation stored in its soil."],"opts":["1 and 3","1, 2 and 3","Only 2","1 and 2","Only 1"],"key":3,"source":"Notes pp. 14–15","pyq":null,"refs":[],"why":"River and groundwater withdrawals are blue sources. Precipitation stored in the root zone is green water."},{"id":192,"section":24,"type":"Figure recall","level":"Moderate","stem":"What India figure does the chapter quote for water used per kilogram of husked rice?","passage":"","items":[],"opts":["2,868 L","2,688 L","2,388 L","2,173 L","2,588 L"],"key":1,"source":"Notes pp. 14–15","pyq":null,"refs":[],"why":"The notes quote 2,688 L for India and 2,173 L as the global average. Actual footprints vary by production context."},{"id":193,"section":24,"type":"Technical recall","level":"Easy","stem":"What concept describes water embodied in agricultural goods shipped across borders?","passage":"","items":[],"opts":["Canal duty","Consumptive irrigation ratio","Virtual water","Surface irrigation depth","Water storage efficiency"],"key":2,"source":"Notes pp. 14–15","pyq":null,"refs":[],"why":"The chapter describes India as a large net exporter of virtual water through agricultural products."},{"id":194,"section":25,"type":"Numbered statements","level":"Hard","stem":"Match the regional water classifications in the notes.","passage":"","items":["Parts of peninsular India are classified as water scarce and low productivity.","Middle and lower Gangetic plains are classified as water scarce and low productivity.","Himalayan slopes and desert areas can be ecologically fragile.","Punjab, Haryana and western Uttar Pradesh include high-productivity areas."],"opts":["1 and 4","1, 2 and 4","1 and 3","1, 3 and 4","3 and 4"],"key":3,"source":"Notes pp. 15, 19","pyq":null,"refs":[],"why":"The middle and lower Gangetic plains are in the water-abundant, low-productivity category."},{"id":195,"section":25,"type":"Figure recall","level":"Moderate","stem":"What approximate share of national water resources does the chapter attribute to the Ganga–Brahmaputra–Meghna system?","passage":"","items":[],"opts":["70%","45%","80%","60%","50%"],"key":3,"source":"Notes pp. 15, 19","pyq":null,"refs":[],"why":"The notes attribute about 60% to this river system."},{"id":196,"section":25,"type":"Numbered statements","level":"Hard","stem":"Compare the chapter’s population, water and monsoon snapshots.","passage":"","items":["Over 90% of peninsular runoff is reported in June–September.","Rajasthan is shown with about 8% of the population and 1% of water resources.","Over 80% of Himalayan runoff is reported in June–September.","The chapter attributes most peninsular runoff to January–February."],"opts":["2 and 3","1 and 2","1 and 3","1, 2 and 3","1, 2, 3 and 4"],"key":3,"source":"Notes pp. 15, 19","pyq":null,"refs":[],"why":"The main runoff concentration in both snapshots is the summer monsoon period."},{"id":197,"section":25,"type":"Technical recall","level":"Easy","stem":"Which period corresponds to the southwest monsoon in the chapter’s rainfall table?","passage":"","items":[],"opts":["January–February","March–May","June–September","October–December","November–February"],"key":2,"source":"Notes pp. 15, 19","pyq":null,"refs":[],"why":"The southwest monsoon coincides with the kharif season and supplies roughly 70% of national annual rainfall in the notes."},{"id":198,"section":25,"type":"Technical recall","level":"Easy","stem":"Which rainfall season supplies roughly 60% of Tamil Nadu’s annual rainfall in the notes’ summary?","passage":"","items":[],"opts":["Northeast monsoon","Southwest monsoon","Hot-weather summer","Cold dry period only","Western disturbances"],"key":0,"source":"Notes pp. 15, 19","pyq":null,"refs":[],"why":"The October–December northeast monsoon is especially important for Tamil Nadu."},{"id":199,"section":26,"type":"Technical recall","level":"Easy","stem":"Which river-link project was the first taken up under the National Perspective Plan?","passage":"","items":[],"opts":["Ken–Betwa","Pamba–Achankovil–Vaippar","Godavari–Krishna","Mahanadi–Godavari","Par–Tapi–Narmada"],"key":0,"source":"Notes pp. 15–16, 20","pyq":null,"refs":["KBL"],"why":"Ken–Betwa was the first such project under the National Perspective Plan. Its Cabinet approval came in December 2021."},{"id":200,"section":26,"type":"Figure recall","level":"Moderate","stem":"What was the approved Ken–Betwa estimated cost at 2020–21 price levels?","passage":"","items":[],"opts":["₹40,475 crore","₹36,290 crore","₹44,605 crore","₹39,317 crore","₹93,068.56 crore"],"key":2,"source":"Notes pp. 15–16, 20","pyq":null,"refs":["KBL","KBL26"],"why":"The total cost was ₹44,605 crore. Central support is a separate figure, and the 2021 Cabinet breakdown distinguishes the grant and loan components."},{"id":201,"section":26,"type":"Figure recall","level":"Moderate","stem":"What annual irrigation benefit is projected for the Ken–Betwa Link Project?","passage":"","items":[],"opts":["10.62 lakh ha","8.11 lakh ha","2.51 lakh ha","13.88 lakh ha","25.80 lakh ha"],"key":0,"source":"Notes pp. 15–16, 20","pyq":null,"refs":["KBL26"],"why":"The project total is 10.62 lakh ha, including about 8.11 lakh ha in MP and 2.51 lakh ha in UP."},{"id":202,"section":26,"type":"Numbered statements","level":"Hard","stem":"Check the milestones and institutions associated with Ken–Betwa.","passage":"","items":["The foundation stone was laid at Khajuraho on 25 December 2024.","Cabinet approval came in December 2021.","The Ken–Betwa Link Project Authority is the project SPV.","The foundation stone was laid in December 2021."],"opts":["1 and 2","2 and 3","1, 2 and 3","1, 2, 3 and 4","1 and 3"],"key":2,"source":"Notes pp. 15–16, 20","pyq":null,"refs":["KBL","KBL26"],"why":"The 2021 date refers to approval and the 2024 date to the foundation stone. The February 2026 reply identifies the SPV and a planned March 2030 completion."},{"id":203,"section":26,"type":"Technical recall","level":"Easy","stem":"Which two states are the principal beneficiaries of the Ken–Betwa Link Project?","passage":"","items":[],"opts":["Rajasthan and Gujarat","Bihar and Jharkhand","Odisha and Chhattisgarh","Maharashtra and Karnataka","Madhya Pradesh and Uttar Pradesh"],"key":4,"source":"Notes pp. 15–16, 20","pyq":null,"refs":["KBL26"],"why":"The project serves the Bundelkhand region across MP and UP."},{"id":204,"section":27,"type":"Technical recall","level":"Easy","stem":"The National Water Mission is one of the missions under which national plan?","passage":"","items":[],"opts":["PMKSY only","NAPCC","National Aquifer Mapping Programme","National Water Policy alone","National Perspective Plan"],"key":1,"source":"Notes p. 16","pyq":null,"refs":[],"why":"It was set up under the National Action Plan on Climate Change. Its mission document was approved in April 2011."},{"id":205,"section":27,"type":"Numbered statements","level":"Hard","stem":"Identify the goals of the National Water Mission.","passage":"The National Water Mission combines information, conservation and efficiency objectives. Its activities include a campaign encouraging remunerative and nutritious crops that need less water in water-stressed areas. The mission also covers management at river-basin scale.","items":["Make a comprehensive water database publicly accessible.","Promote basin-level integrated water resources management.","Reduce water-use efficiency by 20%.","Assess the impact of climate change on water resources."],"opts":["2 and 4","1, 2 and 4","1 and 2","1 and 4","1, 2, 3 and 4"],"key":1,"source":"Notes p. 16","pyq":null,"refs":[],"why":"The target is to increase water-use efficiency by 20%. The mission also promotes action by citizens and states."},{"id":206,"section":27,"type":"Concept identification","level":"Easy","stem":"A campaign encourages remunerative, nutritious and water-efficient crops in water-stressed areas. Which campaign fits?","passage":"The National Water Mission combines information, conservation and efficiency objectives. Its activities include a campaign encouraging remunerative and nutritious crops that need less water in water-stressed areas. The mission also covers management at river-basin scale.","items":[],"opts":["NAQUIM","PRAYAG","Catch the Rain 2024","Sahi Fasal","JALAJ"],"key":3,"source":"Notes p. 16","pyq":null,"refs":[],"why":"The National Water Mission launched Sahi Fasal on 14 November 2019, according to the notes."},{"id":207,"section":27,"type":"Technical recall","level":"Easy","stem":"Which institution under the National Water Mission was set up in October 2022 to facilitate water-use efficiency across sectors?","passage":"","items":[],"opts":["Bureau of Water Use Efficiency","National Water Development Agency","Central Ground Water Authority","River Cities Alliance","National Mission for Clean Ganga"],"key":0,"source":"Notes p. 16","pyq":null,"refs":[],"why":"BWUE works across sectors including irrigation, industry, drinking water and power."},{"id":208,"section":27,"type":"Technical recall","level":"Easy","stem":"Which body was established in 1945, is headquartered in New Delhi and publishes Jalansh?","passage":"","items":[],"opts":["National Water Development Agency","National Mission for Clean Ganga","Central Ground Water Board","Water and Power Consultancy Services","Central Water Commission"],"key":4,"source":"Notes p. 16","pyq":null,"refs":[],"why":"CWC is an attached office of the relevant department under the Ministry of Jal Shakti."},{"id":209,"section":27,"type":"Numbered statements","level":"Hard","stem":"Distinguish the groundwater regulator and mapping programme.","passage":"","items":["NAQUIM mapped the mappable area of about 25 lakh km² according to the notes.","The National Aquifer Mapping Programme is a solar irrigation scheme.","CGWA was constituted under the Environment (Protection) Act, 1986.","The CGWB training wing is the Rajiv Gandhi National Ground Water Training and Research Institute."],"opts":["1, 2, 3 and 4","1 and 3","1 and 4","3 and 4","1, 3 and 4"],"key":4,"source":"Notes p. 16","pyq":null,"refs":[],"why":"CGWA has a regulatory role including applicable groundwater extraction NOCs. NAQUIM maps aquifers."},{"id":210,"section":27,"type":"Technical recall","level":"Easy","stem":"Which survey technique do the notes cite for high-resolution aquifer mapping in arid areas?","passage":"","items":[],"opts":["Canal-discharge gauging alone","Soil salinity titration alone","Heliborne geophysical survey","Rain gauge interpolation alone","Crop cutting experiment"],"key":2,"source":"Notes p. 16","pyq":null,"refs":[],"why":"The notes identify heliborne geophysics in arid Rajasthan, Gujarat and Haryana."},{"id":211,"section":28,"type":"Technical recall","level":"Easy","stem":"Which pair formed the River Cities Alliance in 2021?","passage":"","items":[],"opts":["NABARD and SIDBI","CWC and CGWB","NWDA and IMD","NMCG and NIUA","BWUE and NCPAH"],"key":3,"source":"Notes pp. 16–17","pyq":null,"refs":[],"why":"The National Mission for Clean Ganga and National Institute of Urban Affairs formed the alliance."},{"id":212,"section":28,"type":"Numbered statements","level":"Hard","stem":"Identify the platforms and initiatives in the Clean Ganga section.","passage":"","items":["JALAJ is described as a livelihood model.","PRAYAG is a scheme for standalone solar pumps.","The Global River Cities Alliance was launched at COP28 in Dubai.","PRAYAG supports real-time analysis of the Yamuna and Ganga tributaries."],"opts":["3 and 4","1 and 4","1, 2, 3 and 4","Only 1","1, 3 and 4"],"key":4,"source":"Notes pp. 16–17","pyq":null,"refs":[],"why":"The notes date PRAYAG to April 2023 and cite 40 JALAJ implementation locations in their snapshot."},{"id":213,"section":28,"type":"Figure recall","level":"Moderate","stem":"How many new NMCG projects were sanctioned in the chapter’s 2023 snapshot?","passage":"","items":[],"opts":["45","40","454","270","38"],"key":0,"source":"Notes pp. 16–17","pyq":null,"refs":[],"why":"The notes list 45 sanctioned and 38 completed that year. The larger figures refer to cumulative counts."},{"id":214,"section":28,"type":"Technical recall","level":"Easy","stem":"Which monthly magazine disseminates water-sector practices and seeks to build public water awareness?","passage":"","items":[],"opts":["Yojana","Jalansh","Jal Charcha","Namami Gange","Kurukshetra"],"key":2,"source":"Notes pp. 16–17","pyq":null,"refs":[],"why":"The notes describe Jal Charcha as a Ministry water-sector magazine. Jalansh is associated with CWC."},{"id":215,"section":28,"type":"Technical recall","level":"Easy","stem":"What was the theme of Jal Shakti Abhiyan’s 2023 Catch the Rain campaign?","passage":"","items":[],"opts":["More Crop Per Drop","Har Khet Ko Pani","Nari Shakti se Jal Shakti","Source Sustainability for Drinking Water","Water Accounting with SCADA"],"key":3,"source":"Notes pp. 16–17","pyq":null,"refs":[],"why":"The 2023 campaign was launched on 4 March. Nari Shakti se Jal Shakti was the 2024 theme."},{"id":216,"section":28,"type":"Numbered statements","level":"Hard","stem":"Match the campaigns with their dates and actions.","passage":"","items":["Geo-tagging water bodies and establishing Jal Shakti Kendras are listed actions.","The 2021 campaign ran from 22 March to 30 November in the notes.","The 2024 campaign used Nari Shakti se Jal Shakti.","The 2024 campaign used the 2023 drinking-water source theme."],"opts":["1 and 3","2 and 3","1 and 2","1, 2 and 3","1, 2, 3 and 4"],"key":3,"source":"Notes pp. 16–17","pyq":null,"refs":[],"why":"The 2024 campaign ran from 9 March to 30 November. The 2021 campaign covered both rural and urban areas."},{"id":217,"section":29,"type":"Figure recall","level":"Moderate","stem":"How many minor irrigation schemes were reported in the Sixth Minor Irrigation Census?","passage":"The Sixth Minor Irrigation Census counted groundwater and surface-water schemes. Ownership figures use different denominators, including all schemes, schemes by water source, and individually owned schemes. Keep those categories separate when comparing percentages.","items":[],"opts":["20.31 million","24.24 million","21.93 million","23.14 million","25.14 million"],"key":3,"source":"Notes p. 18","pyq":null,"refs":["MIC"],"why":"The census reports 23.14 million schemes. Of these, 21.93 million were groundwater schemes and 1.21 million surface-water schemes."},{"id":218,"section":29,"type":"Technical recall","level":"Easy","stem":"Which state had the largest number of minor irrigation schemes in that census?","passage":"","items":[],"opts":["Maharashtra","Tamil Nadu","Karnataka","Madhya Pradesh","Uttar Pradesh"],"key":4,"source":"Notes p. 18","pyq":null,"refs":["MIC"],"why":"Uttar Pradesh led overall, followed by Maharashtra, Madhya Pradesh and Tamil Nadu."},{"id":219,"section":29,"type":"Numbered statements","level":"Hard","stem":"Interpret the reported ownership shares for minor irrigation schemes.","passage":"The Sixth Minor Irrigation Census counted groundwater and surface-water schemes. Ownership figures use different denominators, including all schemes, schemes by water source, and individually owned schemes. Keep those categories separate when comparing percentages.","items":["Private ownership among groundwater schemes was 64.2%.","Women owned 18.1% of individually owned schemes.","Private ownership overall was 96.6%.","Private ownership among surface-water schemes was 64.2%."],"opts":["1, 2, 3 and 4","2 and 3","2 and 4","3 and 4","2, 3 and 4"],"key":4,"source":"Notes p. 18","pyq":null,"refs":["MIC"],"why":"Groundwater private ownership was 98.3%. The women’s share uses individually owned schemes as its denominator."},{"id":220,"section":29,"type":"Numbered statements","level":"Hard","stem":"Match the leading state with its Sixth Census category.","passage":"","items":["Karnataka led medium tube-wells.","Uttar Pradesh led deep tube-wells.","Maharashtra led dug wells.","Punjab led deep tube-wells."],"opts":["1 and 3","1, 2 and 4","None of the above","1, 3 and 4","1 and 4"],"key":3,"source":"Notes p. 18","pyq":null,"refs":["MIC"],"why":"Uttar Pradesh led shallow tube-wells. Maharashtra also led surface flow and surface lift schemes in the notes."},{"id":221,"section":29,"type":"Numbered statements","level":"Hard","stem":"Compare counts across the Fifth and Sixth Minor Irrigation Censuses as shown in the notes.","passage":"","items":["Dug wells declined from about 87 lakh to 82 lakh.","Medium tube-wells declined from 43 lakh to 31 lakh.","Deep tube-wells rose from about 26 lakh to 37 lakh.","Shallow tube-wells declined from about 59 lakh to 55 lakh."],"opts":["3 and 4","1, 2, 3 and 4","1 and 4","1, 3 and 4","1 and 3"],"key":3,"source":"Notes p. 18","pyq":null,"refs":[],"why":"Medium tube-wells increased from about 31 lakh to 43 lakh. The shallow and deep series moved in opposite directions."},{"id":222,"section":29,"type":"Technical recall","level":"Easy","stem":"How does the chapter classify a tube-well deeper than 70 m?","passage":"","items":[],"opts":["Dug well","Shallow tube-well","Medium tube-well","Surface lift scheme","Deep tube-well"],"key":4,"source":"Notes p. 18","pyq":null,"refs":[],"why":"The chapter lists shallow up to 35 m, medium up to 70 m and deep beyond 70 m."},{"id":223,"section":30,"type":"Figure recall","level":"Moderate","stem":"How many water bodies were enumerated in the First Census of Water Bodies?","passage":"The first national inventory of water bodies included er-conservation schemes in the table."},{"id":227,"section":30,"type":"Technical recall","level":"Easy","stem":"Which state leads the notes’ list by number of water bodies used for irrigation?","passage":"","items":[],"opts":["Andhra Pradesh","West Bengal","Gujarat","Jharkhand","Telangana"],"key":3,"source":"Notes pp. 18–19","pyq":null,"refs":[],"why":"The sequence is Jharkhand, Andhra Pradesh, Telangana, West Bengal and Gujarat. The total-count rankings use a different measure."},{"id":228,"section":31,"type":"PYQ-aligned","level":"Moderate","stem":"In the historical PMKSY micro-irrigation comparison used by the 2020 PYQ, which state led with 8.16 lakh ha?","passage":"","items":[],"opts":["Rajasthan","Gujarat","Maharashtra","Andhra Pradesh","Karnataka"],"key":4,"source":"PYQ pp. 6–7, 13–14 · Notes pp. 4, 19","pyq":9,"refs":[],"why":"The 2020 key gives Karnataka, followed by AP at 7.17 lakh ha and Gujarat at 7 lakh ha. The notes’ separate 2018 table names Rajasthan for overall/sprinkler and AP for drip. Neither ranking is a current claim."},{"id":229,"section":31,"type":"Numbered statements","level":"Hard","stem":"Compare the two dated micro-irrigation rankings in the source material.","passage":"","items":["Karnataka leads the 2020 PYQ’s cited PMKSY comparison.","The chapter’s separately cited 2018 ranking puts Rajasthan first in drip irrigation.","The chapter’s separately cited 2018 ranking puts Andhra Pradesh first in drip irrigation.","The chapter’s separately cited 2018 ranking puts Rajasthan first in sprinkler irrigation."],"opts":["3 and 4","Only 4","1, 2, 3 and 4","1 and 4","1, 3 and 4"],"key":4,"source":"Notes pp. 4, 19","pyq":null,"refs":[],"why":"Keep the year and metric attached to the rankings. A state’s sprinkler, drip and programme coverage rankings can differ."},{"id":230,"section":31,"type":"Figure recall","level":"Moderate","stem":"What share of irrigated area did tube-wells account for in the Agriculture Census 2010–11 table?","passage":"","items" sam, Bihar and Jharkhand"],"key":0,"source":"Notes pp. 4, 19","pyq":null,"refs":[],"why":"This is a coverage-share comparison, distinct from absolute PMKSY area and irrigation method rankings."},{"id":235,"section":31,"type":"Numbered statements","level":"Hard","stem":"Compare the chapter’s irrigation-source patterns in the 2010–11 snapshot.","passage":"","items":["Tube-wells dominate in Maharashtra in the cited table.","Canals dominate in Odisha in the cited table.","Tanks are listed as significant in Jharkhand.","Wells dominate in Tamil Nadu in the cited table."],"opts":["2 and 3","2 and 4","2, 3 and 4","3 and 4","Only 4"],"key":2,"source":"Notes pp. 4, 19","pyq":null,"refs":[],"why":"Maharashtra is in the well-dominant group. Jharkhand’s tank share is cited at about 18.2%."},{"id":236,"section":32,"type":"Figure recall","level":"Moderate","stem":"What change in gross cropped area coverage does Economic Survey 2024–25 report for FY2016 to FY2021?","passage":"","items":[],"opts":["55.0% to 60.0%","41.0% to 52.0%","44.2% to 54.5%","49.3% to 55.0%","48.8% to 51.2%"],"key":3,"source":"Notes pp. 11, 20","pyq":null,"refs":["ES"],"why":"The same Survey comparison shows irrigation intensity increasing from 144.2% to 154.5%."},{"id":237,"section":32,"type":"Figure recall","level":"Moderate","stem":"What area was covered under PDMC from FY2016 through December 2024 in the Survey snapshot?","passage":"","items":[],"opts":["98.55 lakh ha","95.58 lakh ha","34.63 lakh ha","25.80 lakh ha","96.97 lakh ha"],"key":1,"source":"Notes pp. 11, 20","pyq":null,"refs":["ES","PDMC25"],"why":"95.58 lakh ha is the December 2024 snapshot. A March 2025 reply gives 96.97 lakh ha at its later cut-off."},{"id":238,"section":32,"type":"Figure recall","level":"Moderate","stem":"How much was released to states for PDMC in the Survey’s FY2016–December 2024 reporting window?","passage":"","items":[],"opts":["₹19,968.75 crore","₹22,968.75 crore","₹21,968.75 crore","₹25,968.75 crore","₹20,434.56 crore"] on","origin":"Different source ranges","pages":"6, 12","id":58,"source":"PYQ pp. 6, 12 · Notes pp. 4, 6"},{"number":6,"year":2018,"fact":"Sugarcane has the greatest seasonal water requirement among the choices","origin":"Both PDFs","pages":"6, 12","id":104,"source":"PYQ pp. 6, 12 · Notes p. 8"},{"number":7,"year":2018,"fact":"Major projects have CCA greater than 10,000 ha","origin":"Both PDFs","pages":"6, 13","id":126,"source":"PYQ pp. 6, 13 · Notes pp. 9–10"},{"number":8,"year":2019,"fact":"Root-zone delivery, reduced evaporation and reduced deep percolation","origin":"PYQ adds detail","pages":"6, 13","id":44,"source":"PYQ pp. 6, 13 · Notes pp. 4–5"},{"number":9,"year":2020,"fact":"Karnataka leads the keyed historical comparison at 8.16 lakh ha","origin":"Both PDFs · dated ranking","pages":"6–7, 13–14","id":228,"source":"PYQ pp. 6–7, 13–14 · Notes pp. 4, 19"},{"number":10,"year":2020,"fact":"Minor irrigation’s CCA cap and the older cost threshold","origin":"Both PDFs · historical rule","pages":"7, 14","id":127,"source":"PYQ pp. 7, 14 · Notes pp. 9–10"},{"number":11,"year":2020,"fact":"Clayey soil retains the most total water among the choices","origin":"PYQ supplement","pages":"7, 14","id":103,"source":"PYQ pp. 7, 14"},{"number":12,"year":2021,"fact":"Drip irrigation applies small quantities near the root zone","origin":"Both PDFs","pages":"7, 15","id":43,"source":"PYQ pp. 7, 15 · Notes pp. 4–5"},{"number":13,"year":2023,"fact":"The 2,000–10,000 ha band is medium, with the official lower boundary clarified","origin":"Both PDFs","pages":"7, 15","id":128,"source":"PYQ pp. 7, 15 · Notes pp. 9–10"},{"number":14,"year":2023,"fact":"Drip irrigation requires technical knowledge and skill","origin":"PYQ adds detail","pages":"8, 15–16","id":45,"source":"PYQ pp. 8, 15–16 · Notes pp. 4–5"},{"number":15,"year":2024,"fact":"Surge irrigation is a modified furrow method with ON/OFF flow","origin":"PYQ adds detail","pages":"8, 16","id":36,"source":"PYQ pp. 8, 16 · Notes pp. 2–3"},{"number":16,"year":2024,"fact":"Subsurface drip releases water through buried emitters","origin":"Both PDFs","pages":"8, 16–17","id":46,"source":"PYQ pp. 8, 16–17 · Notes pp. 4–5"},{"number":17,"year":2024,"fact":"Crop water-use efficiency equals yield divided by crop ET","origin":"Both PDFs","pages":"8, 17","id":79,"source":"PYQ pp. 8, 17 · Notes p. 7"}],"references":{"GW22":["PIB · Groundwater assessment 2022","https://www.pib.gov.in/Pressreleaseshare.aspx?PRID=1881811"],"GW25":["PIB · Groundwater assessment 2025","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2220203"],"CWC":["PIB · CWC per-capita water estimates","https://www.pib.gov.in/PressReleasePage.aspx?PRID=1882796"],"ES":["PIB · Economic Survey 2024–25 irrigation highlights","https://www.pib.gov.in/Pressreleaseshare.aspx?PRID=2097882"],"ESCH":["Economic Survey 2024–25 · Agriculture and food management","https://www.indiabudget.gov.in/budget2025-26/economicsurvey/doc/eschapter/echap09.pdf"],"AIBP":["PIB · Jal Shakti year-end review 2024","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2096022"],"PIPE":["PIB · July 2025 parliamentary reply on PMKSY","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2147696"],"DRIP14":["PIB · 2014 micro-irrigation impact evaluation findings","https://www.pib.gov.in/Pressreleaseshare.aspx?PRID=1578978"],"CCA":["Jal Shakti · Irrigation project census classifications","https://www.jalshakti-dowr.gov.in/static/uploads/2026/03/596a6490b37977e6a0982af1702e1133.pdf"],"DUTY":["SRIT · Irrigation engineering, duty and delta","https://www.srit.edu.in/wp-content/uploads/2025/02/HIE.pdf"],"PMKSY":["PIB · PMKSY 2021–26 outlay","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2116177"],"PDMC":["PIB · Per Drop More Crop and RKVY","https://www.pib.gov.in/PressReleaseIframePage.aspx?PRID=2003188"],"PDMC25":["PIB · March 2025 PDMC progress","https://www.pib.gov.in/PressReleaseIframePage.aspx?PRID=2112401"],"MC":["PIB · M-CADWM Cabinet approval, April 2025","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2120360"],"MCP":["PIB · M-CADWM cluster update, December 2025","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2197174"],"KUSUM":["MNRE · PM-KUSUM programme targets","https://apipmk.mnre.gov.in/api/Master_Document_Landing/SliderImage?docid=190&docspid=41"],"KUSUM0":["MNRE · PM-KUSUM guidelines","https://pmkusum.mnre.gov.in/pdf/Guidelines%20for%20PM%20KUSUM%20Scheme%20%2822-07-2019%29.pdf"],"ATAL":["PIB · Atal Jal pilot, August 2026 parliamentary reply","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2293760"],"RIDF":["NABARD · Annual Report 2023–24","https://www.nabard.org/pdf/2024/version-final.pdf"],"KBL":["PIB · Ken–Betwa Cabinet approval, 2021","https://www.pib.gov.in/Pressreleaseshare.aspx?PRID=1779306"],"KBL26":["PIB · Ken–Betwa, February 2026 parliamentary reply","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2223845"],"MIC":["PIB · Sixth Minor Irrigation Census","https://www.pib.gov.in/Pressreleaseshare.aspx?PRID=1952480"],"WB":["PIB · First Census of Water Bodies","https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=1918970"]},"notes":[["Sprinkler water savings","The 2018 PYQ key uses 25–50% relative to surface irrigation. Notes p. 4 cites 16–70% across Indian trials. Both are tested with their own comparison.",[]],["Historical micro-irrigation rankings","The 2020 PYQ and notes p. 19 cite Karnataka first in a historical PMKSY comparison. The separately cited 2018 figures on notes p. 4 place Rajasthan first overall and in sprinklers, and Andhra Pradesh first in drip.",[]],["Command area boundaries","The PYQ booklet uses 2,000–10,000 ha as shorthand. The official census definition puts exactly 2,000 ha in minor irrigation, above 2,000 through 10,000 ha in medium, and above 10,000 ha in major. The older cost screen is asked only in its historical context.",["CCA"]],["Duty and delta units","Notes p. 7 prints centimetres beside the coefficient 8.64. With duty in ha/cumec and base period in days, 8.64B/D gives metres and 864B/D gives centimetres.",["DUTY"]],["Two technical labels in the notes","Notes p. 5 mixes sprinkler specifications with a drip diagram. The quiz follows the separate component tables on p. 4. The 30 psi figure on p. 20 is operating pressure, not wind speed.",[]],["M-CADWM, Atal Jal and PDMC","The quiz uses the dated official figures of 34 M-CADWM clusters in 23 States/UTs and 8,203 Atal Jal pilot Gram Panchayats. The notes print 32 and 8,213 respectively. Official reporting dates the PDMC shift to RKVY from FY2022–23.",["MCP","ATAL","PDMC"]],["Ken–Betwa cost and support","The estimated project cost is ₹44,605 crore at 2020–21 prices. The 2021 Cabinet approval broke ₹39,317 crore of central support into ₹36,290 crore grant and ₹3,027 crore loan. The February 2026 reply repeats ₹39,317 crore in its main text and quotes ₹36,290 crore in its annex. The quiz asks for the total project cost separately.",["KBL","KBL26"]],["Ultimate irrigation potential","The notes print 139.5 Mha on p. 2 and 139.9 Mha on p. 10. The quiz uses the definition and a question specifically anchored to the p. 2 split.",[]],["Figures excluded from scoring","The quiz omits the unsupported global percentage comparisons in the notes’ summary and the canal-length and dam-area asides in the PYQ explanations. It tests the corresponding exam identifications directly.",[]]]}</script>

const byId = new Map(questions.map(q => [q.id,q]));
const bySection = new Map(sections.map(s => [s.id,s]));
const sectionSets = new Map(sections.map(s => [s.id,questions.filter(q => q.section === s.id)]));
const pyqSet = coverage.map(item => byId.get(item.id));
const schemeSet = questions.filter(q => bySection.get(q.section).group === 'Schemes & institutions');
const storeKey = 'nabard.irrigation.2026.practice.v1';
let run = readRun();
let screen = 'home';
let order = 'pdf';

function esc(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]);
}

function paint(name, markup, focus = '#heading', scroll = true) {
  screen = name;
  app.innerHTML = markup;
  if (scroll) window.scrollTo(0,0);
  if (focus) document.querySelector(focus)?.focus({preventScroll:scroll});
}

function readRun() {
  try {
    const s = JSON.parse(localStorage.getItem(storeKey));
    if (!s || typeof s.title !== 'string' || typeof s.returnTo !== 'string' ||
        !Array.isArray(s.ids) || !s.ids.length || new Set(s.ids).size !== s.ids.length ||
        !s.ids.every(id => byId.has(id)) || !Number.isInteger(s.index) ||
        s.index < 0 || s.index > s.ids.length ||
        !Array.isArray(s.responses) || s.responses.length !== s.ids.length ||
        !s.responses.every(a => a === null || (Number.isInteger(a) && a >= -1 && a < 5)) ||
        !s.responses.slice(0,s.index).every(a => a !== null) ||
        !s.responses.slice(s.index+1).every(a => a === null)) return null;
    return s;
  } catch { return null; }
}

function saveRun() {
  try { localStorage.setItem(storeKey,JSON.stringify(run)); } catch {}
}

function button(action, label, classes = '', id = '') {
  return `<button type="button" class="btn ${classes}" data-action="${action}"${id === '' ? '' : ` data-id="${id}"`}>${esc(label)}</button>`;
}

function pageTitle(title, description) {
  return `<div class="heading"><h1 id="heading" tabindex="-1">${esc(title)}</h1><p>${esc(description)}</p></div>`;
}

function home(focus = true) {
  const resumable = run && run.index < run.ids.length;
  paint('home', `
    <section class="hero"><p class="eyebrow">Water resources &amp; irrigation</p>
      <h1 id="heading" tabindex="-1">Irrigation Management</h1>
      <p>${questions.length} questions across ${sections.length} sections, including ${pyqSet.length} questions mapped to the supplied NABARD PYQs.</p>
    </section>
    ${resumable ? `<div class="panel resume"><p><strong>${esc(run.title)}</strong> · Question ${run.index+1} of ${run.ids.length}</p>${button('resume','Resume practice')}</div>` : ''}
    <div class="mode-grid">
      <article class="panel mode"><h2>Full Practice Test</h2><p>Work through all ${questions.length} questions.</p>
        <fieldset class="order"><legend>Question order</legend>
          <label><input type="radio" name="order" value="pdf" ${order==='pdf'?'checked':''}><span>Chapter order</span></label>
          <label><input type="radio" name="order" value="shuffle" ${order==='shuffle'?'checked':''}><span>Shuffled</span></label>
        </fieldset>${button('full','Start full test','primary')}
      </article>
      <article class="panel mode"><h2>Section-wise Revision</h2><p>Choose a topic and start directly at its first question.</p>${button('topics','Browse sections')}</article>
      <article class="panel mode"><h2>PYQ Practice</h2><p>${pyqSet.length} adapted questions in PYQ order, one per tested fact or fact set.</p>${button('pyqs','Start PYQ practice')}</article>
      <article class="panel mode"><h2>Schemes &amp; Institutions</h2><p>${schemeSet.length} questions on programmes, funds, agencies and participation.</p>${button('schemes','Start schemes practice')}</article>
    </div>
    <div class="links">${button('coverage','PYQ Coverage & Source Notes','small')}${button('descriptive','Phase II Descriptive PYQ','small')}</div>
    <p class="source">The quiz, answer explanations and results work offline.</p>
  `, focus ? '#heading' : '');
}

function topicMenu() {
  paint('topics', `${button('home','Back to menu')}${pageTitle('Section-wise Revision','Choose one of the 32 sections. Each set follows chapter order.')}
    ${groups.map(group => `<section class="group"><h2>${esc(group)}</h2><div class="topics">
      ${sections.filter(s => s.group === group).map(s => {
        const count = sectionSets.get(s.id).length;
        return `<button type="button" class="topic" data-action="section" data-id="${s.id}"><strong>${esc(s.title)}</strong><span>${count} questions</span></button>`;
      }).join('')}
    </div></section>`).join('')}`);
}

function sourceLinks(keys) {
  if (!keys.length) return '';
  return `<ul class="refs">${keys.map(k => {
    const [label,url] = references[k];
    return `<li><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a></li>`;
  }).join('')}</ul>`;
}

function coveragePage() {
  paint('coverage', `${button('home','Back to menu')}${pageTitle('PYQ Coverage & Source Notes','All 17 objective PYQs in the supplied booklet map to a question that directly tests the same fact or fact set. Quiz numbers below use the full bank’s chapter order.')}
    <p class="source">Notes refer to Clarity4Sure’s Irrigation Management PDF. PYQ refers to EduTap’s Water Resources and Irrigation Management solved questions. Page references use PDF page numbers.</p>
    <div class="actions">${button('pyqs','Practise all 17','primary')}${button('descriptive','View the Phase II question')}</div>
    <div class="panel table-wrap group">
      <table class="table coverage-table">
        <thead><tr><th scope="col">PYQ</th><th scope="col">Fact tested</th><th scope="col">Where it comes from</th><th scope="col">Quiz</th></tr></thead>
        <tbody>${coverage.map(row => `<tr><th scope="row">${row.year} · Q${row.number}</th><td>${esc(row.fact)}</td><td>${esc(row.origin)}<span class="source">${esc(row.source)}</span></td><td>${button('one',`Q${row.id}`,'small',row.id)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <section class="panel changes"><h2>Source differences and corrections</h2>
      ${notes.map(([name,body,keys]) => `<details><summary>${esc(name)}</summary><p>${esc(body)}</p>${sourceLinks(keys)}</details>`).join('')}
    </section>`);
}

function descriptivePage() {
  paint('descriptive', `<div class="narrow">
    ${button('home','Back to menu')}
    ${pageTitle('Phase II Descriptive PYQ','NABARD Grade A 2021 · 10 marks · 400 words')}
    <article class="panel outline">
      <h2>Drip irrigation</h2>
      <p>Define drip irrigation, explain how it has changed farming, and discuss its advantages and limitations.</p>
      <p class="source">Adapted from the supplied PYQ booklet, pp. 20–21.</p>
      <details><summary>Show answer outline and marking checklist</summary>
        <ol>
          <li><strong>Define the method in about 45 words.</strong> Explain controlled root-zone application through a network of mains, laterals and emitters. Mention filtration.</li>
          <li><strong>Explain what changes on the farm.</strong> Link a smaller wetted area to reduced evaporation and runoff. Explain how scheduling and fertigation improve root-zone moisture and nutrient delivery.</li>
          <li><strong>Support the advantages.</strong> A 2014 evaluation cited by PIB reported average irrigation-cost savings of 32.3% across the micro-irrigation schemes it studied. Include the potential for fewer weeds between rows or better crop quality. State that outcomes depend on design and scheduling.</li>
          <li><strong>Develop the limitations.</strong> Discuss installation cost and credit, filter and emitter clogging, maintenance and the need for technical skill. Explain how fragmented holdings can complicate installation.</li>
          <li><strong>Close with conditions for adoption.</strong> Connect financial assistance under PDMC with training, good water quality management and appropriate scheduling.</li>
        </ol>
        <p><strong>Check before submitting</strong> · Definition and mechanism · Farm-level change explained · Advantages supported with data · Limitations explained · Within 400 words.</p>
        <span class="source">Supporting notes pp. 4–5, 11 · PYQ booklet pp. 20–21</span>${sourceLinks(['DRIP14','PDMC'])}
      </details>
    </article></div>`);
}

function shuffled(set) {
  const next = [...set];
  for (let i=next.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [next[i],next[j]]=[next[j],next[i]];
  }
  return next;
}

function start(title,set,returnTo = 'home') {
  run = {title,returnTo,ids:set.map(q=>q.id),index:0,responses:Array(set.length).fill(null)};
  saveRun();
  question();
}

function score() {
  return run.responses.reduce((n,value,i)=>n+Number(value===byId.get(run.ids[i]).key),0);
}

function instruction(q) {
  return q.passage ? `<div class="instruction"><strong>Instruction</strong><p>${esc(q.passage)}</p></div>` : '';
}

function statementList(q) {
  return q.items.length ? `<ol class="statements">${q.items.map(item=>`<li>${esc(item)}</li>`).join('')}</ol>` : '';
}

function question(afterAnswer = false) {
  const q = byId.get(run.ids[run.index]);
  const given = run.responses[run.index];
  const answered = given !== null;
  const result = given === -1 ? 'skip' : given === q.key ? 'correct' : 'wrong';
  const verdict = {skip:'Skipped',correct:'Correct',wrong:'Incorrect'}[result];
  const final = run.index+1 === run.ids.length;
  const completed = run.index + Number(answered);
  paint('question', `<div class="practice">
    <div class="q-top"><strong>${esc(run.title)}</strong>${button('leave',run.returnTo==='topics'?'Back to sections':run.returnTo==='coverage'?'Back to coverage':'Back to menu','muted-btn')}</div>
    <div class="progress-label"><span id="step">Question ${run.index+1} of ${run.ids.length}</span><span>Score <strong>${score()}</strong> · ${completed} done</span></div>
    <progress aria-labelledby="step" value="${completed}" max="${run.ids.length}"></progress>
    <article class="panel" aria-labelledby="heading">
      <div class="meta"><span>${esc(bySection.get(q.section).title)}</span><span>${esc(q.type)}</span><span>${q.level}</span>${q.pyq?`<span>${coverage[q.pyq-1].year} · PYQ Q${q.pyq}</span>`:''}</div>
      ${instruction(q)}
      <h1 class="question" id="heading" tabindex="-1">${esc(q.stem)}${q.type==='Numbered statements'?'<small>Which statements are correct?</small>':''}</h1>
      ${statementList(q)}
      <div class="choices" aria-label="Answer choices">
        ${q.opts.map((option,i)=>{
          const right = answered && i===q.key;
          const wrong = answered && given===i && i!==q.key;
          return `<button type="button" class="choice${right?' correct':wrong?' wrong':''}" data-action="answer" data-id="${i}" ${answered?'disabled':''}><span class="letter">${letters[i]}</span><span>${esc(option)}</span>${right||wrong?`<span class="mark">${right?'Correct':'Your choice'}</span>`:''}</button>`;
        }).join('')}
      </div>
      ${answered?`<div class="feedback" id="feedback" tabindex="-1" data-result="${result}"><h3>${verdict} · ${letters[q.key]} · ${esc(q.opts[q.key])}</h3><p>${esc(q.why)}</p><span class="source">${esc(q.source)}</span>${sourceLinks(q.refs)}</div>`:''}
      <div class="footer">${answered?`<span class="key-hint">Enter to continue</span>${button('next',final?'View results':'Next question','primary')}`:`${button('skip','Skip')}<span class="key-hint">A–E to answer</span>`}</div>
    </article>
  </div>`,afterAnswer?'#feedback':'#heading',!afterAnswer);
}

function record(answer) {
  if (run.responses[run.index] !== null) return;
  run.responses[run.index] = answer;
  saveRun();
  question(true);
}

function next() {
  if (run.index>=run.ids.length || run.responses[run.index]===null) return;
  run.index++;
  saveRun();
  if (run.index===run.ids.length) results();
  else question();
}

function results() {
  const correct = score();
  const skipCount = run.responses.filter(a=>a===-1).length;
  const stats = Object.fromEntries(levels.map(level=>[level,{correct:0,total:0,skip:0}]));
  const review = [];
  run.ids.forEach((id,index)=>{
    const q = byId.get(id);
    const response = run.responses[index];
    stats[q.level].total++;
    if (response===q.key) stats[q.level].correct++;
    else {
      if (response===-1) stats[q.level].skip++;
      review.push({q,index,response});
    }
  });
  paint('results',`<div class="practice">
    ${pageTitle('Practice results',run.title)}
    <div class="result-grid">
      <div class="panel"><h2>Final score</h2><p class="big-score">${correct} / ${run.ids.length}</p><p class="help">${run.ids.length-correct-skipCount} incorrect · ${skipCount} skipped</p></div>
      <div class="panel"><h2>Accuracy by difficulty</h2><table class="table score-table">
        <thead><tr><th scope="col">Level</th><th scope="col">Correct / total</th><th scope="col">Skipped</th><th scope="col">Accuracy</th></tr></thead>
        <tbody>${levels.map(level=>{
          const s=stats[level];
          return `<tr><th scope="row">${level}</th><td>${s.correct} / ${s.total}</td><td>${s.skip}</td><td>${s.total?Math.round(100*s.correct/s.total)+'%':'—'}</td></tr>`;
        }).join('')}</tbody>
      </table><span class="source">Accuracy includes skipped questions in the denominator.</span></div>
    </div>
    <div class="actions">${button('retry','Retry same set','primary')}${button('leave',run.returnTo==='topics'?'Back to sections':run.returnTo==='coverage'?'Back to coverage':'Back to menu')}</div>
    <section class="review"><h2>Missed and skipped · ${review.length}</h2>
      ${review.length?review.map(({q,index,response})=>`<article class="panel">
        <p class="review-status ${response===-1?'':'wrong'}">Question ${index+1} · ${response===-1?'Skipped':'Incorrect'} · Bank Q${q.id}</p>
        ${instruction(q)}
        <h3 class="question">${esc(q.stem)}</h3>${statementList(q)}
        ${response>=0?`<p>Your answer · ${letters[response]} · ${esc(q.opts[response])}</p>`:''}
        <p class="right-answer"><strong>Correct answer · ${letters[q.key]} · ${esc(q.opts[q.key])}</strong></p>
        <p>${esc(q.why)}</p><span class="source">${esc(q.source)}</span>${sourceLinks(q.refs)}
      </article>`).join(''):'<p>You answered every question correctly.</p>'}
    </section>
  </div>`);
}

function leave() {
  if (run.returnTo==='topics') topicMenu();
  else if (run.returnTo==='coverage') coveragePage();
  else home();
}

app.addEventListener('change',event=>{
  if (event.target.name==='order') order=event.target.value;
});

app.addEventListener('click',event=>{
  const control = event.target.closest('button[data-action]');
  if (!control || control.disabled) return;
  const id = Number(control.dataset.id);
  switch(control.dataset.action) {
    case 'home': home(); break;
    case 'full': start(order==='pdf'?'Full Practice · Chapter order':'Full Practice · Shuffled',order==='pdf'?questions:shuffled(questions)); break;
    case 'topics': topicMenu(); break;
    case 'section': start(bySection.get(id).title,sectionSets.get(id),'topics'); break;
    case 'pyqs': start('PYQ Practice',pyqSet,screen==='coverage'?'coverage':'home'); break;
    case 'schemes': start('Schemes & Institutions',schemeSet); break;
    case 'coverage': coveragePage(); break;
    case 'descriptive': descriptivePage(); break;
    case 'one': start(`PYQ Q${byId.get(id).pyq}`,[byId.get(id)],'coverage'); break;
    case 'leave': leave(); break;
    case 'resume': question(); break;
    case 'answer': record(id); break;
    case 'skip': record(-1); break;
    case 'next': next(); break;
    case 'retry': start(run.title,run.ids.map(id=>byId.get(id)),run.returnTo); break;
  }
});

document.addEventListener('keydown',event=>{
  if(screen!=='question' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
  if(run.responses[run.index]===null && /^[a-e]$/i.test(event.key)) {
    event.preventDefault();
    record(letters.indexOf(event.key.toUpperCase()));
  } else if(event.key==='Enter' && event.target.id==='feedback') {
    event.preventDefault();
    next();
  }
});
home(false);
</script>
</body>
</html>
