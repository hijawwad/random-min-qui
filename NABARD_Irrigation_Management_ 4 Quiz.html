d","stem":"The 2022 groundwater assessment compared national figures with 2017.","passage":"","items":["Annual extraction rose by about 9.53 BCM.","Annual extraction in 2022 was higher than 250 BCM.","Annual recharge rose by about 5.74 BCM.","The extraction stage declined by 3.25 percentage points."],"opts":["3 and 4","1, 3 and 4","2, 3 and 4","Only 3","Only 4"],"key":0,"source":"Notes p. 1","pyq":null,"refs":["GW22"],"why":"Extraction fell by 9.53 BCM to 239.16 BCM. The extraction stage declined from 63.33% to 60.08%."},{"id":9,"section":1,"type":"Figure recall","level":"Moderate","stem":"According to the recharge split in the notes, what share is attributed to rainfall?","passage":"","items":[],"opts":["65%","62%","68%","78%","72%"],"key":2,"source":"Notes p. 1","pyq":null,"refs":[],"why":"The remaining 32% is attributed to sources including canal seepage, irrigation return flow, tanks and ponds."},{"id":10,"section":1,"type":"Figure recall","level":"Moderate","stem":"In the CWC’s 2019 reassessment cited in the notes, what was projected annual per-capita water availability for 2031?","passage":"","items":[],"opts":["1,235 m³","1,367 m³","1,700 m³","1,486 m³","1,545 m³"],"key":1,"source":"Notes p. 1","pyq":null,"refs":["CWC"],"why":"The cited CWC assessment gives 1,486 m³ for 2021 and 1,367 m³ for 2031."},{"id":11,"section":1,"type":"Applied scenario","level":"Moderate","stem":"Which of these locations meets the stated water-scarcity threshold of below 1,000 m³ per person per year?","passage":"","items":["A basin with 1,600 m³ per person.","A basin with 900 m³ per person.","A basin with 1,050 m³ per person."],"opts":["Only 2","2 and 3","1 and 2","1 and 3","Only 1"],"key":0,"source":"Notes p. 1","pyq":null,"refs":[],"why":"The 900 m³ basin meets the scarcity threshold. The other two are below the separate 1,700 m³ water-stress threshold."},{"id":12,"section":1,"type":"Figure recall","level":"Moderate","stem":"What annual per-capita water availability does the notes’ able.","passage":"","items":["Infiltration is listed as 215 million hectare-metres.","Total precipitation is about 400 million hectare-metres.","Evaporation and transpiration losses are listed as 70 million hectare-metres.","Snowfall contributes about 70 million hectare-metres."],"opts":["1 and 3","1, 2 and 3","1 and 2","1, 2, 3 and 4","2, 3 and 4"],"key":1,"source":"Notes pp. 1–2","pyq":null,"refs":[],"why":"The precipitation split shown is 392 from rainfall and 8 from snowfall."},{"id":17,"section":2,"type":"Calculation","level":"Moderate","stem":"The budget counts 75 effective rainy days out of 130 rainy days. What approximate share is effective?","passage":"","items":[],"opts":["65.0%","48.8%","61.5%","51.2%","57.7%"],"key":4,"source":"Notes pp. 1–2","pyq":null,"refs":[],"why":"75 ÷ 130 × 100 is about 57.7%."},{"id":18,"section":2,"type":"Technical recall","level":"Easy","stem":"What small rainfall event is excluded by the chapter’s simplified water-budget rule?","passage":"","items":[],"opts":["Less than 7.5 mm","Less than 2.5 mm","Less than 5.0 mm","Less than 2.0 mm","Less than 1.0 mm"],"key":1,"source":"Notes pp. 1–2","pyq":null,"refs":[],"why":"The notes exclude events below 2.5 mm in this simplified accounting."},{"id":19,"section":2,"type":"Numbered statements","level":"Hard","stem":"The chapter provides a broad land-use and water-use snapshot.","passage":"","items":["Agriculture accounts for about 80% of water use in the snapshot.","About 80% of the 140 Mha agricultural land is irrigated.","The corresponding rainfed share is about 51.2%.","The snapshot reports about 48.8% irrigated land."],"opts":["3 and 4","1, 3 and 4","1 and 4","1 and 3","1, 2, 3 and 4"],"key":1,"source":"Notes pp. 1–2","pyq":null,"refs":[],"why":"The 80% figure refers to water use. The 48.8% figure refers to the land snapshot, with a different denominator."},{"id":20,"section":3,"type":"Concept identification","level":"Easy","stem":"Water can be supplied deliberately to a cropped soil to supplement rainfall and groundwater. Which term names this operation?","passage":"________ supplies water to cultivated soil when rainfall and groundwater contribution are insufficient. Decisions about the amount and timing depend on the crop stage and the soil’s ability to store water. Engineering deals with conveyance and structures, while agronomy deals with soil, crop and scheduling.","items":[],"opts":["Evapotranspiration","Drainage","Aquifer recharge","Leaching","Irrigation"],"key":4,"source":"Notes p. 2","pyq":null,"refs":[],"why":"Irrigation is the artificial application of water to soil to support crop growth and production."},{"id":21,"section":3,"type":"Technical recall","level":"Easy","stem":"Choosing the timing and amount of water using crop biology and soil properties belongs to which dimension?","passage":"________ supplies water to cultivated soil when rainfall and groundwater contribution are insufficient. Decisions about the amount and timing depend on the crop stage and the soil’s ability to store water. Engineering deals with conveyance and structures, while agronomy deals with soil, crop and scheduling.","items":[],"opts":["Groundwater regulation","Irrigation agronomy","Hydraulic surveying","Socio-economic study","Irrigation engineering"],"key":1,"source":"Notes p. 2","pyq":null,"refs":[],"why":"Agronomy focuses on soil, crop biology and water scheduling."},{"id":22,"section":3,"type":"Numbered statements","level":"Hard","stem":"Match the irrigation-management dimensions to their tasks.","passage":"","items":["Irrigation policies and water-user associations belong to the socio-economic dimension.","Study of farmer participation belongs only to engineering.","Reservoir and conveyance management belongs to engineering.","Crop biology and irrigation timing fall outside agronomy."],"opts":["1, 3 and 4","1 and 3","1, 2 and 3","Only 1","1 and 2"],"key":1,"source":"Notes p. 2","pyq":null,"refs":[],"why":"Agronomy includes crop biology and timing. Farmer participation falls under socio-economic study."},{"id":23,"section":3,"type":"Figure recall","level":"Moderate","stem":"In the 2022–23 access snapshot quoted in the notes, what was the approximate share of 141 Mha with irrigation access?","passage":"","items":[],"opts":["61%","48.8%","41%","52%","55%"],"key":3,"source":"Notes p. 2","pyq":null,"refs":[],"why":"The 2022–23 snapshot reports approximately 73 Mha or 52%. The FY2021 GCA figure belongs to a separately cited series."},{"id":24,"section":3,"type":"Technical recall","level":"Easy","stem":"In the notes’ productivity comparison, irrigated land produces approximately how much per hectare?","passage":"","items":[],"opts":["1.0 tonne","1.8 tonnes","2.2 tonnes","3.8 tonnes","2.8 tonnes"],"key":4,"source":"Notes p. 2","pyq":null,"refs":[],"why":"The snapshot compares approximately 2.8 t/ha on irrigated land with 1 t/ha on rainfed land."},{"id":25,"section":3,"type":"Numbered statements","level":"Hard","stem":"Interpret the notes’ distinct estimates of irrigation efficiency and exposure to flooding.","passage":"","items":["The improved surface-irrigation benchmark is 50–60%.","The improved groundwater-irrigation benchmark is 50–60%.","The overall major/medium project benchmark is about 38%.","The flood-prone estimate is about 40 Mha."],"opts":["1 and 3","2, 3 and 4","1, 3 and 4","1, 2, 3 and 4","3 and 4"],"key":2,"source":"Notes p. 2","pyq":null,"refs":[],"why":"The groundwater improvement range is 72–75%. About 8 Mha is affected by floods annually, distinct from the flood-prone total."},{"id":26,"section":3,"type":"Figure recall","level":"Moderate","stem":"What area does the chapter identify as waterlogged in its overview?","passage":"","items":[],"opts":["11.6 Mha","38.0 Mha","8.0 Mha","40.0 Mha","19.0 Mha"],"key":0,"source":"Notes p. 2","pyq":null,"refs":[],"why":"The 11.6 Mha waterlogged figure is separate from flood-prone or annually flooded area."},{"id":27,"section":3,"type":"Technical recall","level":"Easy","stem":"What share of net irrigated land is described as being under micro-irrigation in the 2021 snapshot?","passage":"","items":[],"opts":["21%","34%","19%","38%","12%"],"key":2,"source":"Notes p. 2","pyq":null,"refs":[],"why":"The denominator is net irrigated land. Later sections use distinct measures and years."},{"id":28,"section":3,"type":"Figure recall","level":"Moderate","stem":"In the chapter’s 139.5 Mha estimate of ultimate irrigation potential, what area is assigned to minor irrigation?","passage":"","items":[],"opts":["69 Mha","81 Mha","73 Mha","58.5 Mha","95.58 Mha"],"key":1,"source":"Notes p. 2","pyq":null,"refs":[],"why":"The p. 2 split gives 81 Mha minor and 58.5 Mha major/medium. The notes elsewhere print a slightly different UIP total. Keep the split tied to this table."},{"id":29,"section":4,"type":"Technical recall","level":"Easy","stem":"What distributes water across the field in ordinary surface irrigation?","passage":"","items":[],"opts":["Capillary rise alone","Subsurface drip tape","Emitter pressure","Gravity","Sprinkler nozzles"],"key":3,"source":"Notes pp. 2–3","pyq":null,"refs":[],"why":"Surface irrigation applies water over the soil surface by gravity."},{"id":30,"section":4,"type":"Concept identification","level":"Easy","stem":"A field is divided into long parallel strips by low ridges. The strips have a gentle uniform fall in the direction of water travel. Which method fits?","passage":"In ________, low ridges divide a field into parallel strips with a uniform fall along the direction of flow. Water advances as a sheet across a strip. This layout is suited to crops such as wheat and differs from orchard layouts that wet an area around each tree.","items":[],"opts":["Border irrigation","Surge irrigation","Ring irrigation","Wild flooding","Check basin irrigation"],"key":0,"source":"Notes pp. 2–3","pyq":null,"refs":[],"why":"The borders guide flow along gently sloping strips. The diagram gives a width of about 3–15 m."},{"id":31,"section":4,"type":"Applied scenario","level":"Moderate","stem":"Which proposed surface-irrigation layouts fit the chapter’s diagrams?","passage":"In ________, low ridges divide a field into parallel strips with a uniform fall along the direction of flow. Water advances as a sheet across a strip. This layout is suited to crops such as wheat and differs from orchard layouts that wet an area around each tree.","items":["A fruit grower uses rings around large widely spaced trees.","A wheat grower uses gently sloping parallel border strips.","An orchard manager uses a single unguided field-wide flood as the definition of ring irrigation."],"opts":["1 and 2","Only 2","1 and 3","1, 2 and 3","2 and 3"],"key":0,"source":"Notes pp. 2–3","pyq":null,"refs":[],"why":"Borders suit crops such as wheat. Ring irrigation wets an area around each tree, while wild flooding uses largely unguided flow."},{"id":32,"section":4,"type":"Technical recall","level":"Easy","stem":"Which method holds water in level plots bounded by ridges until it infiltrates?","passage":"In ________, low bunds hold water on level plots until it infiltrates. The retained water can assist salt leaching. Other gravity methods guide water in strips, between crop rows or around individual trees.","items":[],"opts":["Wild flooding","Furrow irrigation","Border irrigation","Check basin irrigation","Localized irrigation"],"key":3,"source":"Notes pp. 2–3","pyq":null,"refs":[],"why":"Check basins impound water and can help leach salts. The notes give a basin size of about 10–25 m²."},{"id":33,"section":4,"type":"Technical recall","level":"Easy","stem":"Which complete flooding method gives water minimal guidance as it leaves the ditch?","passage":"","items":[],"opts":["Wild flooding","Border irrigation","Basin and ring irrigation","Check basin irrigation","Surge irrigation"],"key":0,"source":"Notes pp. 2–3","pyq":null,"refs":[],"why":"Wild flooding permits largely uncontrolled movement over the field."},{"id":34,"section":4,"type":"Numbered statements","level":"Hard","stem":"Distinguish complete flooding methods from partial flooding methods.","passage":"In ________, low bunds hold water on level plots until it infiltrates. The retained water can assist salt leaching. Other gravity methods guide water in strips, between crop rows or around individual trees.","items":["Border irrigation is grouped under complete flooding.","Wild flooding delivers water only through buried drip lines.","Furrow irrigation is grouped under complete flooding.","Basin and ring irrigation is grouped under partial flooding."],"opts":["1, 3 and 4","Only 1","1, 2 and 4","1, 2, 3 and 4","1 and 4"],"key":4,"source":"Notes pp. 2–3","pyq":null,"refs":[],"why":"Furrow, basin/ring and surge are shown as partial flooding in the chapter. Wild flooding is a surface-flow method."},{"id":35,"section":4,"type":"Technical recall","level":"Easy","stem":"Where do irrigation channels normally run in a furrow system?","passage":"","items":[],"opts":["Beneath the entire root zone","Between crop rows","Above the crop canopy","Only around each trunk","Across level check plots"],"key":1,"source":"Notes pp. 2–3","pyq":null,"refs":[],"why":"Furrows carry water between rows or after every two rows in the chapter’s examples."},{"id":36,"section":4,"type":"PYQ-aligned","level":"Moderate","stem":"Surge irrigation uses alternating ON and OFF periods. Which existing method does the 2024 PYQ treat it as a modification of?","passage":"","items":[],"opts":["Check basin irrigation","Border irrigation","Furrow irrigation","Ring irrigation","Compartmental irrigation"],"key":2,"source":"PYQ pp. 8, 16 · Notes pp. 2–3","pyq":15,"refs":[],"why":"Intermittent flow in long furrows changes the advance and infiltration pattern. This directly tests the 2024 key."},{"id":37,"section":4,"type":"Numbered statements","level":"Hard","stem":"Surge irrigation alternates delivery and rest periods.","passage":"","items":["The chapter lists about 85–90% efficiency.","Flow is maintained without interruption throughout the set.","It can improve distribution compared with continuous furrow flow.","Intermittent application can help the water front advance faster."],"opts":["3 and 4","1, 3 and 4","Only 4","1 and 3","1 and 4"],"key":1,"source":"Notes pp. 2–3","pyq":null,"refs":[],"why":"The ON/OFF cycle is the defining feature. Flow pauses allow the wetted reach to change its infiltration behaviour."},{"id":38,"section":4,"type":"Figure recall","level":"Moderate","stem":"What ON/OFF cycle duration is cited in the PYQ explanation’s surge example?","passage":"","items":[],"opts":["10–20 minutes","30–45 minutes","2–4 minutes","20–30 minutes","5–10 minutes"],"key":4,"source":"PYQ pp. 15–16","pyq":null,"refs":[],"why":"The supplied explanation uses a 5–10 minute design example for long furrows. This is a cited example, not a universal design setting."},{"id":39,"section":5,"type":"Concept identification","level":"Easy","stem":"A grower artificially raises the water table so moisture moves upward into the root zone. Which irrigation method is this?","passage":"________ wets soil from below by raising and controlling the water table. Capillary action carries moisture upward toward the roots. It can be used in lowlands and differs from supplying water through buried drip emitters.","items":[],"opts":["Border irrigation","Surface drip irrigation","Subsurface seepage irrigation","Subsurface drip irrigation","Check basin irrigation"],"key":2,"source":"Notes p. 3","pyq":null,"refs":[],"why":"Seepage irrigation relies on capillary rise from a controlled water table. Buried drip uses emitters in buried tubing."},{"id":40,"section":5,"type":"Figure recall","level":"Moderate","stem":"What water-table depth is maintained in the chapter’s seepage irrigation example?","passage":"________ wets soil from below by raising and controlling the water table. Capillary action carries moisture upward toward the roots. It can be used in lowlands and differs from supplying water through buried drip emitters.","items":[],"opts":["5–15 cm below ground","10–25 cm below ground","75–120 cm below ground","30–75 cm below ground","150–300 cm below ground"],"key":3,"source":"Notes p. 3","pyq":null,"refs":[],"why":"The example maintains the water table 30–75 cm below the surface."},{"id":41,"section":5,"type":"Figure recall","level":"Moderate","stem":"What spacing does the chapter list for underground field trenches in seepage irrigation?","passage":"","items":[],"opts":["15–30 m","10–25 m","40–60 m","30–75 m","3–15 m"],"key":0,"source":"Notes p. 3","pyq":null,"refs":[],"why":"The trench spacing is 15–30 m. Border-strip widths and water-table depth refer to other dimensions."},{"id":42,"section":5,"type":"Numbered statements","level":"Hard","stem":"The notes list seepage irrigation applications and greenhouse variants.","passage":"","items":["The greenhouse variants exclude trough systems.","Ebb-and-flow is a greenhouse variant.","High water table areas can suit field seepage irrigation.","Flooded floors are listed among greenhouse variants."],"opts":["1, 2, 3 and 4","2 and 4","2, 3 and 4","2 and 3","3 and 4"],"key":2,"source":"Notes p. 3","pyq":null,"refs":[],"why":"The three variants named are ebb-and-flow, trough and flooded floor."},{"id":43,"section":6,"type":"PYQ-aligned","level":"Moderate","stem":"Which micro-irrigation method applies small, controlled quantities of water through emitters at or near the crop root zone?","passage":"","items":[],"opts":["Rain gun irrigation","Sprinkler irrigation","Check basin irrigation","Border irrigation","Drip irrigation"],"key":4,"source":"PYQ pp. 7, 15 · Notes pp. 4–5","pyq":12,"refs":[],"why":"Drip irrigation wets the root zone through emitters. It can also deliver dissolved fertilizers."},{"id":44,"section":6,"type":"PYQ-aligned","level":"Moderate","stem":"Which combination captures the three principal aims of drip irrigation tested in the 2019 PYQ?","passage":"","items":[],"opts":["Canopy wetting, less evaporation and more deep percolation","Root-zone delivery, more runoff and more surface evaporation","Root-zone delivery, less evaporation and less deep percolation","Surface ponding, reduced evaporation and higher percolation","Canopy wetting, surface ponding and reduced root-zone delivery"],"key":2,"source":"PYQ pp. 6, 13 · Notes pp. 4–5","pyq":8,"refs":[],"why":"Targeted application reduces the area exposed to evaporation and can limit avoidable deep percolation when scheduled properly."},{"id":45,"section":6,"type":"PYQ-aligned","level":"Moderate","stem":"A farmer expects to install a drip system and operate it correctly from day one. Which implementation requirement did the 2023 question test?","passage":"","items":[],"opts":["Technical skill in design and operation","Greater water use than conventional flooding","Removal of all filters from laterals","High-pressure overhead spraying","Continuous flooding of crop rows"],"key":0,"source":"PYQ pp. 8, 15–16 · Notes pp. 4–5","pyq":14,"refs":[],"why":"Design, scheduling, filtration and maintenance require knowledge and skill. The 2023 key tests this requirement."},{"id":46,"section":6,"type":"PYQ-aligned","level":"Moderate","stem":"Which configuration places drip tubing below the soil surface so buried emitters release water into the soil for crops such as row crops and orchards?","passage":"","items":[],"opts":["Subsurface seepage irrigation","Border irrigation","Surface drip irrigation","Subsurface drip irrigation","Micro-sprinkler irrigation"],"key":3,"source":"PYQ pp. 8, 16–17 · Notes pp. 4–5","pyq":16,"refs":[],"why":"The 2024 key identifies subsurface drip. Seepage relies on a controlled water table rather than buried emitters."},{"id":47,"section":6,"type":"Technical recall","level":"Easy","stem":"Who is associated with developing the plastic-emitter drip system in Israel?","passage":"A low-volume irrigation network can use plastic outlets to apply water at selected points near plants. Small outlet openings can become blocked by suspended material. The head unit may also introduce a dissolved nutrient solution into the water supply.","items":[],"opts":["Daniel Hillel and Jethro Tull","Norman Borlaug","F. H. King","Simcha and Yeshayahu Blass","M. S. Swaminathan"],"key":3,"source":"Notes pp. 4–5","pyq":null,"refs":[],"why":"The chapter attributes the plastic-emitter system to Simcha Blass and his son Yeshayahu."},{"id":48,"section":6,"type":"Technical recall","level":"Easy","stem":"Which component protects drip emitters against blockage?","passage":"A low-volume irrigation network can use plastic outlets to apply water at selected points near plants. Small outlet openings can become blocked by suspended material. The head unit may also introduce a dissolved nutrient solution into the water supply.","items":[],"opts":["Head regulator only","Filter","Main valve","Fertilizer tank alone","Pressure gauge"],"key":1,"source":"Notes pp. 4–5","pyq":null,"refs":[],"why":"Filters remove suspended particles that can clog small emitter openings."},{"id":49,"section":6,"type":"Figure recall","level":"Moderate","stem":"What emitter discharge range does the drip table give?","passage":"","items":[],"opts":["1,200–1,800 L/hour","2–10 L/hour","150–600 L/hour","20–150 L/hour","10,000–32,000 L/hour"],"key":1,"source":"Notes pp. 4–5","pyq":null,"refs":[],"why":"The 2–10 L/hour range is for drippers. The larger figures refer to sprinkler classes."},{"id":50,"section":6,"type":"Figure recall","level":"Moderate","stem":"What maximum drip efficiency does the chapter attribute to NABARD data?","passage":"","items":[],"opts":["85%","95%","90%","70%","75%"],"key":1,"source":"Notes pp. 4–5","pyq":null,"refs":[],"why":"The chapter cites up to 95% under drip, a conditional performance figure."},{"id":51,"section":6,"type":"Numbered statements","level":"Hard","stem":"Assess the components and pressures described for drip systems.","passage":"","items":["The lowest lateral pressure range given is 0.15–0.2 kg/cm².","Typical drippers discharge 150–600 L/hour in the table.","A chemical tank can inject fertilizer at the head of the system.","Filters are unnecessary if tubing is buried."],"opts":["1 and 3","1 and 2","Only 3","Only 1","1, 3 and 4"],"key":0,"source":"Notes pp. 4–5","pyq":null,"refs":[],"why":"The stated emitter discharge is 2–10 L/hour. Buried systems still require filtration."},{"id":52,"section":6,"type":"Numbered statements","level":"Hard","stem":"Match the drip-irrigation benefit ranges reported in the chapter’s comparison table.","passage":"","items":["Labour-cost saving is 30–40%.","Energy saving is 10–17%.","Fertilizer saving is 20–38%.","Irrigation water saving is 20–48%."],"opts":["1, 2 and 4","Only 1","1 and 4","1 and 2","2 and 4"],"key":0,"source":"Notes pp. 4–5","pyq":null,"refs":[],"why":"Fertilizer saving is 11–19%. The 20–38% range is the reported production increase."},{"id":53,"section":6,"type":"Figure recall","level":"Moderate","stem":"What average reduction in irrigation cost was reported by the 2014 micro-irrigation impact evaluation?","passage":"","items":[],"opts":["32.3%","20.0%","25.3%","31.0%","38.0%"],"key":0,"source":"Notes pp. 4–5","pyq":null,"refs":["DRIP14"],"why":"The reported average is 32.3%, with a 20–50% range. About 31% refers separately to electricity consumption reduction in the 2014 evaluation."},{"id":54,"section":6,"type":"Applied scenario","level":"Moderate","stem":"Which choices address the drip-adoption barriers described in the chapter?","passage":"","items":["An extension worker trains farmers in filter and emitter maintenance.","A group seeks credit to meet the upfront installation cost.","A planner dismisses fragmented holdings as irrelevant to adoption."],"opts":["1 and 3","Only 1","1 and 2","Only 2","1, 2 and 3"],"key":2,"source":"Notes pp. 4–5","pyq":null,"refs":[],"why":"High upfront cost, poor credit access, fragmented holdings and weak technology transfer are listed barriers."},{"id":55,"section":6,"type":"Technical recall","level":"Easy","stem":"Which process delivers dissolved fertilizer through a drip network?","passage":"","items":[],"opts":["Chemigation for pesticides only","Leaching","Capillary rise","Fertigation","Spray drift"],"key":3,"source":"Notes pp. 4–5","pyq":null,"refs":[],"why":"Fertigation is fertilizer application in irrigation water, commonly through drip."},{"id":56,"section":6,"type":"Technical recall","level":"Easy","stem":"What component shown in the drip diagram allows flushing at the end of a line?","passage":"","items":[],"opts":["End cap","Rain gun","Check basin bund","Rotating head","Water-table trench"],"key":0,"source":"Notes pp. 4–5","pyq":null,"refs":[],"why":"The illustration labels a flush cap on the main or lateral line. The overhead spray and sprinkler pressure table on the same image relate to sprinklers."},{"id":57,"section":7,"type":"Concept identification","level":"Easy","stem":"A pump moves water through mains and laterals to outlets that distribute it in droplets resembling rainfall. Which method is this?","passage":"________ distributes water through a pressurised network to outlets that spray it over a field. The main line carries water from the supply toward the field, and laterals supply individual outlets. Rotating heads and perforated pipes require different operating pressures.","items":[],"opts":["Border irrigation","Sprinkler irrigation","Surge irrigation","Subsurface seepage irrigation","Drip irrigation"],"key":1,"source":"Notes pp. 4, 6","pyq":null,"refs":[],"why":"Sprinklers spray water over the field through a pressurised network."},{"id":58,"section":7,"type":"PYQ-aligned","level":"Moderate","stem":"What water-saving range over surface irrigation was accepted in the 2018 sprinkler PYQ?","passage":"","items":[],"opts":["30–40%","25–50%","50–60%","20–48%","16–70%"],"key":1,"source":"PYQ pp. 6, 12 · Notes pp. 4, 6","pyq":5,"refs":[],"why":"The PYQ key uses 25–50% for its comparison. The chapter separately reports 16–70% across Indian trials. Treat each range in its stated context."},{"id":59,"section":7,"type":"Figure recall","level":"Moderate","stem":"What sprinkler water-saving range is reported across Indian trials in the chapter?","passage":"","items":[],"opts":["25–50%","30–40%","16–70%","50–60%","20–48%"],"key":2,"source":"Notes pp. 4, 6","pyq":null,"refs":[],"why":"The range across trials is 16–70%. The separate 2018 PYQ key uses 25–50% relative to surface irrigation."},{"id":60,"section":7,"type":"Numbered statements","level":"Hard","stem":"Compare the sprinkler components described in the notes.","passage":"________ distributes water through a pressurised network to outlets that spray it over a field. The main line carries water from the supply toward the field, and laterals supply individual outlets. Rotating heads and perforated pipes require different operating pressures.","items":["The listed rotating-head application rate is 4–20 mm/hour.","Mains convey water from the source toward the field.","Laterals are defined as the pipes that lift water vertically from an aquifer.","The perforated pipe system is described at a lower pressure than rotating heads."],"opts":["1 and 2","1, 2 and 4","2 and 4","1, 2, 3 and 4","2, 3 and 4"],"key":1,"source":"Notes pp. 4, 6","pyq":null,"refs":[],"why":"Laterals convey water to sprinklers. Perforated pipes are listed at roughly 1 kg/cm² and rotating heads at 2–4 kg/cm²."},{"id":61,"section":7,"type":"Technical recall","level":"Easy","stem":"What is the approximate minimum operating pressure cited for a typical rotating sprinkler head?","passage":"","items":[],"opts":["45 psi","60 psi","15 psi","20 psi","30 psi"],"key":4,"source":"Notes pp. 4, 6","pyq":null,"refs":[],"why":"The notes cite about 30 psi, equivalent to roughly 2.1 kg/cm². This is a pressure, despite the summary table’s misleading wind label."},{"id":62,"section":7,"type":"Technical recall","level":"Easy","stem":"What pump types are listed for sprinkler systems?","passage":"","items":[],"opts":["Centrifugal or turbine pumps","Hand-operated diaphragm pumps only","Axial-flow fans","Hydraulic ram pumps only","Archimedean screws only"],"key":0,"source":"Notes pp. 4, 6","pyq":null,"refs":[],"why":"The chapter lists high-speed centrifugal or turbine pumping units."},{"id":63,"section":7,"type":"Figure recall","level":"Moderate","stem":"Which radius and discharge pair belongs to the portable sprinkler class in the notes?","passage":"","items":[],"opts":["Up to 3 m and 20–150 L/hour","12–18 m and 1,200–1,800 L/hour","12–18 m and 150–600 L/hour","3–10 m and 150–600 L/hour","3–10 m and 1,200–1,800 L/hour"],"key":1,"source":"Notes pp. 4, 6","pyq":null,"refs":[],"why":"The smaller ranges in the table apply to mini- and micro-sprinklers."},{"id":64,"section":7,"type":"Applied scenario","level":"Moderate","stem":"Which equipment labels match the sprinkler discharge table?","passage":"","items":["An 18,000 L/hour unit fits the rain gun discharge range.","A 75 L/hour unit with a 2 m radius is classified as a micro-sprinkler.","A 300 L/hour unit with a 6 m radius is classified as a rain gun."],"opts":["1, 2 and 3","1 and 2","Only 2","1 and 3","Only 1"],"key":1,"source":"Notes pp. 4, 6","pyq":null,"refs":[],"why":"Mini-sprinklers are listed at 150–600 L/hour and 3–10 m. Rain guns are listed at 10,000–32,000 L/hour."},{"id":65,"section":8,"type":"Technical recall","level":"Easy","stem":"Which body provides monitoring and technical support for NMMI in the notes?","passage":"The historical micro-irrigation mission combined area expansion with demonstrations and training. A national technical committee supported implementation and monitoring. Precision Farming Development Centres helped prepare training material and support field-level evaluation.","items":[],"opts":["NMCG","NWDA","CWC","CGWA","NCPAH"],"key":4,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The National Committee on Plasticulture Applications in Horticulture supports implementation and monitoring."},{"id":66,"section":8,"type":"Numbered statements","level":"Hard","stem":"The notes trace NMMI from the earlier micro-irrigation initiative to mission mode.","passage":"","items":["The earlier initiative dates to 2005–06 in the notes.","Demonstrations and human resource development are mission components.","The mission aims to replace all drip systems with open channels.","Mission mode is associated with the Eleventh Plan."],"opts":["1, 2, 3 and 4","1 and 2","2 and 4","1, 2 and 4","1 and 4"],"key":3,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"Area expansion, demonstrations and human resource development support scientific irrigation and higher efficiency."},{"id":67,"section":8,"type":"Technical recall","level":"Easy","stem":"What area potential and coverage are contrasted in the NMMI overview?","passage":"","items":[],"opts":["139.5 Mha potential and about 19 Mha covered","69 Mha potential and about 19 Mha covered","81 Mha potential and about 5 Mha covered","73 Mha potential and about 2 Mha covered","69 Mha potential and about 2 Mha covered"],"key":4,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The notes’ historical NMMI overview gives potential of 69 Mha against about 2 Mha then covered."},{"id":68,"section":8,"type":"Numbered statements","level":"Hard","stem":"Match the historical NMMI subsidy rates and shares.","passage":"","items":["General farmers receive 50% total subsidy.","For general farmers, the Centre, state and farmer shares are 40%, 10% and 50%.","Small and marginal farmers receive 55% total subsidy under this NMMI schedule.","Small and marginal farmers receive 60% total subsidy."],"opts":["2 and 4","1, 2 and 4","1 and 4","1, 2, 3 and 4","1 and 2"],"key":1,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"Small and marginal shares are 50% Centre, 10% state and 40% farmer. The 55% rate belongs to PDMC."},{"id":69,"section":8,"type":"Calculation","level":"Moderate","stem":"An eligible small farmer’s admissible cost under the historical NMMI pattern is ₹1 lakh. What farmer contribution follows from the listed split?","passage":"","items":[],"opts":["₹10,000","₹60,000","₹45,000","₹50,000","₹40,000"],"key":4,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The 50% Centre and 10% state shares leave a 40% beneficiary contribution."},{"id":70,"section":8,"type":"Applied scenario","level":"Moderate","stem":"Assume BIS-marked equipment and all other conditions are met. Which applicants meet the land-tenure and water-source conditions in the historical NMMI notes?","passage":"","items":["A landowner with a reliable water source.","An applicant with a seven-year lease and a water source.","A cooperative with a ten-year lease and a water source."],"opts":["Only 1","1 and 3","1, 2 and 3","2 and 3","Only 3"],"key":1,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The minimum lease duration is ten years. A water source is also required and cooperatives are eligible entities."},{"id":71,"section":8,"type":"Figure recall","level":"Moderate","stem":"Which maximum beneficiary area and demonstration limit are listed for NMMI?","passage":"","items":[],"opts":["2 ha and 0.25 ha","5 ha and 0.5 ha","10 ha and 1 ha","5 ha and 1 ha","2 ha and 0.5 ha"],"key":1,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The overall cap is 5 ha per beneficiary. Demonstrations can get 75% central support for up to 0.5 ha."},{"id":72,"section":8,"type":"Numbered statements","level":"Hard","stem":"Consider the NMMI inclusion shares and admissible items.","passage":"","items":["Filters and fertilizer tanks are among the items covered.","The notes identify at least 33% for small, marginal and women farmers.","The ST share is 16%.","The SC share is 16%."],"opts":["1 and 2","Only 1","1, 2, 3 and 4","2 and 4","1, 2 and 4"],"key":4,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The ST share is 8%. The covered equipment list includes filters, fertilizer tanks and valves."},{"id":73,"section":8,"type":"Numbered statements","level":"Hard","stem":"Match the NMMI committees and meeting schedules.","passage":"","items":["The state committee meets monthly in the chapter’s table.","The district committee is chaired by the Union Agriculture Secretary.","The national executive committee is chaired by the Secretary (A&C).","The district committee meets monthly."],"opts":["Only 4","2 and 4","Only 3","3 and 4","1, 3 and 4"],"key":3,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The state committee is chaired by the APC or Principal Secretary and meets quarterly. The district committee is chaired by the Zila Parishad CEO or Collector."},{"id":74,"section":8,"type":"Figure recall","level":"Moderate","stem":"What markup above Category A applies to NMMI’s Category C states?","passage":"","items":[],"opts":["25%","10%","20%","30%","15%"],"key":0,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"Category C covers North-Eastern and Himalayan states at 25% above base. Category B is 15% above base."},{"id":75,"section":8,"type":"Numbered statements","level":"Hard","stem":"Check the NMMI release and reporting rules.","passage":"","items":["The first instalment is 50%.","The monthly report is due on the last day of the next month.","Remaining funds depend on progress and utilisation certificates.","An impact study is envisaged every three years."],"opts":["3 and 4","1 and 3","1, 2, 3 and 4","1, 3 and 4","1 and 4"],"key":3,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"Monthly reporting is due by the tenth of the next month. Annual reporting is due within two months of the financial year ending."},{"id":76,"section":8,"type":"Technical recall","level":"Easy","stem":"How many Precision Farming Development Centres are listed in the technical support section?","passage":"The historical micro-irrigation mission combined area expansion with demonstrations and training. A national technical committee supported implementation and monitoring. Precision Farming Development Centres helped prepare training material and support field-level evaluation.","items":[],"opts":["22","16","32","23","18"],"key":0,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The notes cite 22 PFDCs supporting training, standards and monitoring."},{"id":77,"section":8,"type":"Numbered statements","level":"Hard","stem":"NMMI was designed to converge with related agricultural programmes.","passage":"","items":["The convergence list identifies only irrigation-loan funds.","The technical support group is described as unrelated to the mission.","The National Horticulture Mission is listed for convergence.","RKVY and NFSM are listed for convergence."],"opts":["3 and 4","Only 4","1, 3 and 4","2, 3 and 4","Only 3"],"key":0,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The notes list convergence with NHM, NFSM, RKVY, ISOPOM, TMC and HMNEHS. NCPAH and the TSG provide technical support."},{"id":78,"section":8,"type":"Numbered statements","level":"Hard","stem":"Consider the historical NMMI delivery process.","passage":"","items":["The notes specify electronic banking or RTGS for payment.","Joint Inspection Teams form part of monitoring.","Payments must be made only in cash.","Central funds go through the state implementing agency and district mechanism."],"opts":["1, 2, 3 and 4","1, 2 and 4","1 and 4","1 and 2","2 and 4"],"key":1,"source":"Notes pp. 5–6","pyq":null,"refs":[],"why":"The flow described is Centre, state agency, district mechanism and suppliers via beneficiaries. The notes mention ICT-based monitoring and electronic payment."},{"id":79,"section":9,"type":"PYQ-aligned","level":"Moderate","stem":"Grain yield is divided by water depleted through crop evapotranspiration. Which efficiency measure does this define?","passage":"","items":[],"opts":["Crop water-use efficiency","Field water-use efficiency","Irrigation efficiency","Storage efficiency","Conveyance efficiency"],"key":0,"source":"PYQ pp. 8, 17 · Notes p. 7","pyq":17,"refs":[],"why":"CWUE = Y/ET. Field WUE uses the total water requirement as its denominator. This is the exact distinction tested in 2024."},{"id":80,"section":9,"type":"Technical recall","level":"Easy","stem":"Which denominator is used in field water-use efficiency, Y/WR?","passage":"Yield-based water-use efficiency expresses output per unit of water. A field measure uses total water requirement, while a crop measure uses crop evapotranspiration. If yield is expressed per hectare and the water amount as a depth, the efficiency retains both the hectare and depth terms in its unit.","items":[],"opts":["Total water requirement","Evapotranspiration only","Water diverted at the headworks","Water stored in root zone","Water delivered to the canal"],"key":0,"source":"Notes p. 7","pyq":null,"refs":[],"why":"The field-WUE formula uses the crop’s total water requirement."},{"id":81,"section":9,"type":"Technical recall","level":"Easy","stem":"What unit is used for grain-based water-use efficiency when yield is in kg/ha and water depth in mm?","passage":"Yield-based water-use efficiency expresses output per unit of water. A field measure uses total water requirement, while a crop measure uses crop evapotranspiration. If yield is expressed per hectare and the water amount as a depth, the efficiency retains both the hectare and depth terms in its unit.","items":[],"opts":["ha per cumec","m³ per second","kg ha⁻¹ mm⁻¹","mm ha⁻¹ kg⁻¹","kg ha⁻¹ day⁻¹"],"key":2,"source":"Notes p. 7","pyq":null,"refs":[],"why":"Dividing yield per area by a depth gives kg ha⁻¹ mm⁻¹."},{"id":82,"section":9,"type":"Calculation","level":"Moderate","stem":"A crop produces 4,200 kg/ha with 350 mm of evapotranspiration. What is crop water-use efficiency?","passage":"","items":[],"opts":["8 kg ha⁻¹ mm⁻¹","15 kg ha⁻¹ mm⁻¹","14 kg ha⁻¹ mm⁻¹","12 kg ha⁻¹ mm⁻¹","10 kg ha⁻¹ mm⁻¹"],"key":3,"source":"Notes p. 7","pyq":null,"refs":[],"why":"CWUE is 4,200 ÷ 350 = 12 kg ha⁻¹ mm⁻¹."},{"id":83,"section":9,"type":"Calculation","level":"Moderate","stem":"At the diversion point 1,000 m³ enters a watercourse and 790 m³ reaches the farm. What is conveyance efficiency?","passage":"","items":[],"opts":["91%","79%","21%","71%","82%"],"key":1,"source":"Notes p. 7","pyq":null,"refs":[],"why":"Conveyance efficiency is farm delivery divided by diversion, multiplied by 100. The other 21% is the loss."},{"id":84,"section":9,"type":"Calculation","level":"Moderate","stem":"An irrigation stores 45 mm in the root zone, which required 60 mm to reach field capacity before irrigation. What is storage efficiency?","passage":"","items":[],"opts":["80%","85%","75%","45%","60%"],"key":2,"source":"Notes p. 7","pyq":null,"refs":[],"why":"Storage efficiency is 45 ÷ 60 × 100. It measures how much of the root-zone deficit was replenished."},{"id":85,"section":9,"type":"Numbered statements","level":"Hard","stem":"Different efficiency measures answer different questions about the water balance.","passage":"","items":["Storage efficiency uses water stored in the root zone as its numerator.","Conveyance efficiency is crop yield divided by evapotranspiration.","Conveyance efficiency compares water reaching the farm with water diverted.","The notes cite about 21% losses in earthen watercourses."],"opts":["1, 2, 3 and 4","1 and 3","3 and 4","1, 2 and 3","1, 3 and 4"],"key":4,"source":"Notes p. 7","pyq":null,"refs":[],"why":"Crop yield divided by evapotranspiration is crop WUE. The 21% figure refers to the conveyance loss cited in the notes."},{"id":86,"section":9,"type":"Numbered statements","level":"Hard","stem":"Use the ratios as defined in the chapter.","passage":"","items":["The notes cite 12–34% efficiency in most major projects.","Crop WUE and field WUE use identical denominators in the notes.","The stated irrigation-efficiency ratio compares crop-consumed water with water delivered from canals.","The notes associate ragi and wheat with high WUE."],"opts":["3 and 4","1, 2, 3 and 4","1, 3 and 4","2, 3 and 4","1 and 3"],"key":2,"source":"Notes p. 7","pyq":null,"refs":[],"why":"CWUE uses ET and FWUE uses total water requirement. The 12–34% range is separate from the broad 38% benchmark."},{"id":87,"section":9,"type":"Technical recall","level":"Easy","stem":"Which ratio does the chapter label consumptive WUE?","passage":"","items":[],"opts":["Crop yield ÷ crop ET","Stored water ÷ root-zone deficit","Farm delivery ÷ diversion flow","Crop yield ÷ total water requirement","Consumptive use ÷ irrigation water stored in the root zone"],"key":4,"source":"Notes p. 7","pyq":null,"refs":[],"why":"The source table labels the first ratio consumptive WUE. The similarly named crop WUE uses yield over ET."},{"id":88,"section":10,"type":"Concept identification","level":"Easy","stem":"An irrigation engineer wants to express how many hectares a flow of one cumec can irrigate throughout a crop’s base period. Which quantity is being measured?","passage":"________ measures the area a unit flow can serve for the duration of irrigation. The duration runs from the first irrigation to the last irrigation applied to the crop. For a given seasonal depth, supplying the same flow over a longer duration lets it serve a greater area.","items":[],"opts":["Base period","Culturable command area","Duty","Irrigation intensity","Delta"],"key":2,"source":"Notes p. 7","pyq":null,"refs":[],"why":"Duty is irrigable area per unit flow over the base period."},{"id":89,"section":10,"type":"Technical recall","level":"Easy","stem":"What is the interval from the first irrigation applied to a crop to its last irrigation called?","passage":"________ measures the area a unit flow can serve for the duration of irrigation. The duration runs from the first irrigation to the last irrigation applied to the crop. For a given seasonal depth, supplying the same flow over a longer duration lets it serve a greater area.","items":[],"opts":["Crop coefficient","Growing degree period","Base period","Cropping intensity","Delta"],"key":2,"source":"Notes p. 7","pyq":null,"refs":[],"why":"The base period is measured in days between the first and last irrigation."},{"id":90,"section":10,"type":"Technical recall","level":"Easy","stem":"What term denotes the total seasonal depth of water required by a crop?","passage":"","items":[],"opts":["Delta","Discharge","Base period","Specific speed","Duty"],"key":0,"source":"Notes p. 7","pyq":null,"refs":[],"why":"Delta is a depth and can be expressed in metres, centimetres or millimetres."},{"id":91,"section":10,"type":"Calculation","level":"Hard","stem":"A crop has a 100-day base period and a duty of 1,200 ha/cumec. What is delta?","passage":"","items":[],"opts":["8.64 cm","120 cm","7.2 cm","72 cm","86.4 cm"],"key":3,"source":"Notes p. 7","pyq":null,"refs":["DUTY"],"why":"8.64 × 100 ÷ 1,200 = 0.72 m = 72 cm. The coefficient 8.64 gives metres, correcting the unit printed on p. 7."},{"id":92,"section":10,"type":"Calculation","level":"Hard","stem":"A crop needs a delta of 0.864 m in a base period of 120 days. What duty follows?","passage":"","items":[],"opts":["1,200 ha/cumec","864 ha/cumec","1,440 ha/cumec","1,000 ha/cumec","120 ha/cumec"],"key":0,"source":"Notes p. 7","pyq":null,"refs":["DUTY"],"why":"D = 8.64 × 120 ÷ 0.864 = 1,200 ha/cumec. Keep delta in metres with the coefficient 8.64."},{"id":93,"section":10,"type":"Numbered statements","level":"Hard","stem":"The relationship between duty, base period and delta follows from volume conservation.","passage":"","items":["At fixed duty, a longer base period implies a larger delta.","The coefficient 8.64 gives delta in centimetres when duty is in ha/cumec and B is in days.","One cusec is about 28.317 L/s.","At fixed base period, a higher duty implies a smaller delta."],"opts":["3 and 4","1 and 3","1, 3 and 4","1 and 4","1, 2, 3 and 4"],"key":2,"source":"Notes p. 7","pyq":null,"refs":["DUTY"],"why":"Δ = 8.64B/D in metres, or 864B/D in centimetres. One hectare is 10,000 m²."},{"id":94,"section":10,"type":"Calculation","level":"Moderate","stem":"A scheduler applies 50 mm when cumulative pan evaporation reaches 62.5 mm. What IW/CPE ratio is used?","passage":"","items":[],"opts":["1.2","0.8","1.25","1.0","0.6"],"key":1,"source":"Notes p. 7","pyq":null,"refs":[],"why":"Divide irrigation water applied by cumulative pan evaporation. A ratio below 1 can conserve water with a possible yield trade-off."},{"id":95,"section":10,"type":"Technical recall","level":"Easy","stem":"Which pair of decisions is central to irrigation scheduling?","passage":"","items":[],"opts":["Which pump and which nozzle","Which field and which subsidy","How much and how often","How much and which cultivar","What area and which dam"],"key":2,"source":"Notes p. 7","pyq":null,"refs":[],"why":"Scheduling determines the depth to apply and the interval or timing of applications."},{"id":96,"section":11,"type":"PYQ-aligned","level":"Moderate","stem":"Among maize, barley, wheat and rice, which crop is in the highly salt-tolerant category in the 2018 PYQ table?","passage":"","items":[],"opts":["Wheat","Barley","Pea","Maize","Rice"],"key":1,"source":"PYQ pp. 5, 11","pyq":4,"refs":[],"why":"The PYQ table puts barley in the highly tolerant group, wheat, rice and maize in the moderate group, and peas in the sensitive group."},{"id":97,"section":11,"type":"Applied scenario","level":"Moderate","stem":"Which crop selections fit the highly salt-tolerant group in the supplied PYQ table?","passage":"","items":["Cotton for a site requiring a highly tolerant crop.","Barley for a saline site.","Peas for a site requiring a highly tolerant crop."],"opts":["Only 1","Only 2","1 and 3","1, 2 and 3","1 and 2"],"key":4,"source":"PYQ p. 11","pyq":null,"refs":[],"why":"Barley and cotton are in the highly tolerant column. Peas are in the sensitive column."},{"id":98,"section":11,"type":"Concept identification","level":"Easy","stem":"A water sample has a high concentration of soluble salts. Which indicator in dS/m is used in the notes to screen this hazard?","passage":"An irrigation-water test reports a salinity indicator in dS/m along with concentrations of specific constituents. The first screening table groups salinity, total dissolved solids and boron into bands. Its screening thresholds differ from the paired C–S classes used in a separate table.","items":[],"opts":["Electrical conductivity","Cumulative pan evaporation","Carbonate hardness alone","Sodium adsorption ratio","Hydrogen ion activity alone"],"key":0,"source":"Notes pp. 7–8","pyq":null,"refs":[],"why":"Electrical conductivity reflects dissolved salts. The sodium adsorption ratio is used for the sodium hazard."},{"id":99,"section":11,"type":"Numbered statements","level":"Hard","stem":"Apply the chapter’s first irrigation-water-quality screening table.","passage":"An irrigation-water test reports a salinity indicator in dS/m along with concentrations of specific constituents. The first screening table groups salinity, total dissolved solids and boron into bands. Its screening thresholds differ from the paired C–S classes used in a separate table.","items":["An ECw of 0.5 dS/m is in its safe band.","An ECw of 2.0 dS/m is in its severe band.","Boron above 3.0 mg/L is in its severe band.","TDS above 2,000 mg/L is in its severe band."],"opts":["1, 2 and 3","1, 3 and 4","3 and 4","1 and 4","1 and 3"],"key":1,"source":"Notes pp. 7–8","pyq":null,"refs":[],"why":"ECw of 2.0 dS/m is in the slight-to-moderate band. This screening table is separate from the C–S classification."},{"id":100,"section":11,"type":"Numbered statements","level":"Hard","stem":"Assess the concentration and pH thresholds in the notes’ screening table.","passage":"","items":["Boron of 1.5 mg/L falls in the slight-to-moderate band.","Chloride below 140 mg/L is in the safe band.","Chloride at 200 mg/L is in the severe band.","The listed normal pH range is 6.5–8.4."],"opts":["2 and 4","1, 2, 3 and 4","1 and 4","1, 2 and 4","Only 4"],"key":3,"source":"Notes pp. 7–8","pyq":null,"refs":[],"why":"Chloride at 200 mg/L is slight to moderate. Severe chloride is above 350 mg/L in the table."},{"id":101,"section":11,"type":"Applied scenario","level":"Moderate","stem":"Which water samples fall in the C1-S1 row of the chapter’s classification?","passage":"","items":["EC 0.15 dS/m and SAR 6.","EC 0.20 dS/m and SAR 8.","EC 0.60 dS/m and SAR 12."],"opts":["1 and 3","1, 2 and 3","Only 1","Only 2","1 and 2"],"key":4,"source":"Notes pp. 7–8","pyq":null,"refs":[],"why":"C1-S1 combines EC below 0.25 dS/m with SAR below 10."},{"id":102,"section":11,"type":"Technical recall","level":"Easy","stem":"What management interpretation is attached to C3-S3 in the notes’ paired classes?","passage":"","items":[],"opts":["Low salinity and low sodium risk","Excellent, suitable for all crops","Good without any restrictions","Doubtful, needs special management","Unusable for reasons unrelated to salts"],"key":3,"source":"Notes pp. 7–8","pyq":null,"refs":[],"why":"The table pairs C3-S3 with EC 0.75–2.25 dS/m and SAR 18–26. C4-S4 has the highest listed risk."},{"id":103,"section":11,"type":"PYQ-aligned","level":"Moderate","stem":"Among sandy, silty and clayey soils, which generally retains the most total water in the comparison used by the 2020 PYQ?","passage":"","items":[],"opts":["Gravelly soil","All retain equally","Silty soil","Clayey soil","Sandy soil"],"key":3,"source":"PYQ pp. 7, 14","pyq":11,"refs":[],"why":"Clay’s small particles and large surface area favour total water retention. The PYQ does not ask which soil has the most plant-available water."},{"id":104,"section":12,"type":"PYQ-aligned","level":"Moderate","stem":"For the crop choices in the 2018 PYQ, which normally has the largest total seasonal water requirement?","passage":"","items":[],"opts":["Rice","Sunflower","Maize","Sugarcane","Sorghum"],"key":3,"source":"PYQ pp. 6, 12 · Notes p. 8","pyq":6,"refs":[],"why":"The PYQ table gives sugarcane about 2,200 mm, compared with rice 1,250 mm, maize 500 mm and sunflower 450 mm. The chapter ranges support the same ranking."},{"id":105,"section":12,"type":"Figure recall","level":"Moderate","stem":"What total seasonal water requirement is listed for rice in the chapter?","passage":"","items":[],"opts":["600–900 mm","850–1,000 mm","1,100–1,250 mm","1,800–2,200 mm","500–600 mm"],"key":2,"source":"Notes p. 8","pyq":null,"refs":[],"why":"Rice is listed at 1,100–1,250 mm. The substantially higher band of 1,800–2,200 mm is for sugarcane."},{"id":106,"section":12,"type":"Technical recall","level":"Easy","stem":"Which wheat growth stage is abbreviated CRI?","passage":"","items":[],"opts":["Critical rainfall interval","Canopy recovery interval","Crown root initiation","Coleoptile root inversion","Crop ripening initiation"],"key":2,"source":"Notes p. 8","pyq":null,"refs":[],"why":"Crown root initiation is a critical wheat irrigation stage, along with jointing, flowering and the milk stage."},{"id":107,"section":12,"type":"Technical recall","level":"Easy","stem":"Which crop should receive special attention at tasselling, silking and early dough?","passage":"","items":[],"opts":["Maize","Rice","Groundnut","Cotton","Sorghum"],"key":0,"source":"Notes p. 8","pyq":null,"refs":[],"why":"These are the listed critical stages for maize."},{"id":108,"section":12,"type":"Technical recall","level":"Easy","stem":"Which critical stage pair belongs to groundnut?","passage":"","items":[],"opts":["CRI and jointing","Booting and heading","Pegging and pod development","Tasselling and silking","Squaring and boll loading"],"key":2,"source":"Notes p. 8","pyq":null,"refs":[],"why":"Groundnut is particularly sensitive during pegging and pod development. The chapter also highlights the second irrigation at 25 days after sowing."},{"id":109,"section":12,"type":"Numbered statements","level":"Hard","stem":"Different crops face water stress at different reproductive or establishment stages.","passage":"","items":["Finger millet’s critical stages include primordial initiation, flowering and grain filling.","Sorghum’s grand growth and flowering stages are highlighted.","Cotton is sensitive during squaring, flowering and boll formation.","Pulses are sensitive only at maturity."],"opts":["1, 2 and 4","1, 2, 3 and 4","1, 2 and 3","1 and 2","1 and 3"],"key":2,"source":"Notes p. 8","pyq":null,"refs":[],"why":"Pulses require attention at germination, flowering and pod formation. The chapter lists a cotton peak rate of about 10 mm/day."},{"id":110,"section":12,"type":"Numbered statements","level":"Hard","stem":"Compare the chapter’s seasonal requirement bands.","passage":"","items":["Sorghum is listed at 350–500 mm.","Pulses are listed at 1,100–1,250 mm.","Groundnut is listed at 500–550 mm.","Maize is listed at 500–600 mm."],"opts":["1, 2, 3 and 4","3 and 4","1 and 4","1 and 3","1, 3 and 4"],"key":4,"source":"Notes p. 8","pyq":null,"refs":[],"why":"Pulses are listed at 200–450 mm. The 1,100–1,250 mm range belongs to rice."},{"id":111,"section":12,"type":"Applied scenario","level":"Moderate","stem":"Which plans protect a listed critical irrigation stage?","passage":"","items":["Protect cotton during boll formation.","Irrigate wheat at crown root initiation.","Protect maize at crown root initiation while ignoring silking."],"opts":["1 and 3","1 and 2","Only 1","2 and 3","Only 2"],"key":1,"source":"Notes p. 8","pyq":null,"refs":[],"why":"Silking is critical in maize. Crown root initiation is listed for wheat, and boll formation for cotton."},{"id":112,"section":13,"type":"Figure recall","level":"Moderate","stem":"Which breakdown matches the chapter’s allocation of rice water to nursery, puddling and field irrigation?","passage":"Rice irrigation is planned across nursery raising, land preparation and field growth. Field irrigation takes the largest part of the seasonal allocation. The crop is especially sensitive at flowering, while a brief drainage period may be used around maximum tillering.","items":[],"opts":["5%, 15%, 80%","16%, 3%, 81%","10%, 20%, 70%","3%, 21%, 76%","3%, 16%, 81%"],"key":4,"source":"Notes p. 8","pyq":null,"refs":[],"why":"The illustrative depths are about 40 mm for nursery, 200 mm for puddling and 1,000 mm for field irrigation."},{"id":113,"section":13,"type":"Technical recall","level":"Easy","stem":"What submergence depth does the chapter call for during rice flowering?","passage":"Rice irrigation is planned across nursery raising, land preparation and field growth. Field irrigation takes the largest part of the seasonal allocation. The crop is especially sensitive at flowering, while a brief drainage period may be used around maximum tillering.","items":[],"opts":["5 cm","15 cm","10 cm","2 cm","8 cm"],"key":0,"source":"Notes p. 8","pyq":null,"refs":[],"why":"The flowering phase is the most critical in the rice schedule and calls for about 5 cm submergence."},{"id":114,"section":13,"type":"Numbered statements","level":"Hard","stem":"Assess the chapter’s rice-irrigation schedule.","passage":"","items":["About 2 cm is maintained up to seven days after transplanting.","Excess water at booting is described as accelerating heading.","Pre-harvest drainage is listed 15–21 days ahead of harvest.","Mid-season drainage can be used at the beginning of maximum tillering."],"opts":["1 and 3","1, 2, 3 and 4","Only 1","3 and 4","1, 3 and 4"],"key":4,"source":"Notes p. 8","pyq":null,"refs":[],"why":"Excess water at booting may delay heading. One to two days of mid-season drainage can improve root respiration and check ineffective tillers."},{"id":115,"section":13,"type":"Figure recall","level":"Moderate","stem":"How much water saving does the rice example associate with applying 5 cm after ponded water disappears, compared with continuous submergence?","passage":"","items":[],"opts":["About 30%","About 40%","About 15%","About 50%","About 20%"],"key":0,"source":"Notes p. 8","pyq":null,"refs":[],"why":"The chapter gives an illustrative 30% saving for that alternative schedule."},{"id":116,"section":13,"type":"Technical recall","level":"Easy","stem":"Which sugarcane period is highlighted as especially critical for irrigation and tiller establishment?","passage":"","items":[],"opts":["First 120 days after planting","Only days 250–360","Only after sucrose accumulation","Only the final 30 days","Only post-harvest ratoon storage"],"key":0,"source":"Notes p. 8","pyq":null,"refs":[],"why":"The formative phase is the first 120 days. Smaller and more frequent irrigations are suggested during this period."},{"id":117,"section":13,"type":"Applied scenario","level":"Moderate","stem":"Which sugarcane plans match the chapter’s phase-specific guidance?","passage":"","items":["Use smaller, more frequent irrigations in the formative phase.","Maintain continuous heavy irrigation to maximise sucrose during ripening.","Allow moisture to decline gradually toward harvest."],"opts":["Only 1","1, 2 and 3","1 and 3","Only 3","2 and 3"],"key":2,"source":"Notes p. 8","pyq":null,"refs":[],"why":"The grand growth period requires optimum moisture. Gradually reducing irrigation toward ripening supports sucrose accumulation."},{"id":118,"section":13,"type":"Technical recall","level":"Easy","stem":"What is the cited peak daily water requirement for cotton at the flower and boll-loading stage?","passage":"","items":[],"opts":["15 mm/day","7 mm/day","10 mm/day","5 mm/day","20 mm/day"],"key":2,"source":"Notes p. 8","pyq":null,"refs":[],"why":"The chapter lists about 10 mm/day at peak. This is a daily rate, distinct from cotton’s 550–600 mm seasonal requirement."},{"id":119,"section":14,"type":"Concept identification","level":"Easy","stem":"Dissolved plant nutrients are injected into the irrigation supply so they can be carried to the crop. What is this practice called?","passage":"________ delivers dissolved fertilizer with irrigation water, often through drip lines. The product must be soluble and compatible with the supply water, since precipitation can block small outlets. This practice is a nutrient-specific use of the irrigation network.","items":[],"opts":["Foliar feeding","Flushing","Capillary irrigation","Soil fumigation","Fertigation"],"key":4,"source":"Notes pp. 8–9","pyq":null,"refs":[],"why":"Fertigation applies fertilizer with irrigation water. Chemigation is the broader use of irrigation to deliver chemicals."},{"id":120,"section":14,"type":"Technical recall","level":"Easy","stem":"Which nutrient is described as the principal nutrient applied through fertigation?","passage":"________ delivers dissolved fertilizer with irrigation water, often through drip lines. The product must be soluble and compatible with the supply water, since precipitation can block small outlets. This practice is a nutrient-specific use of the irrigation network.","items":[],"opts":["Copper","Boron","Sulphur","Calcium","Nitrogen"],"key":4,"source":"Notes pp. 8–9","pyq":null,"refs":[],"why":"Nitrogen is the principal nutrient in the chapter. Potassium and suitably soluble forms of zinc and iron are also listed."},{"id":121,"section":14,"type":"Technical recall","level":"Easy","stem":"Which formulation supplies nitrogen and phosphorus?","passage":"","items":[],"opts":["Multi K","Monoammonium phosphate","Potash","Potassium sulphate","Urea"],"key":1,"source":"Notes pp. 8–9","pyq":null,"refs":[],"why":"MAP supplies N and P. Multi K is listed for N and K, and potassium sulphate supplies K and S."},{"id":122,"section":14,"type":"Numbered statements","level":"Hard","stem":"Check the fertilizer combinations in the chapter.","passage":"","items":["Poly feed is listed as an N-P-K product.","Potassium sulphate is listed as supplying nitrogen and phosphorus.","Multi K is listed for nitrogen and potassium.","The notes prefer liquid phosphoric acid over superphosphate for this use."],"opts":["1, 3 and 4","3 and 4","None of the above","1, 2, 3 and 4","1 and 3"],"key":0,"source":"Notes pp. 8–9","pyq":null,"refs":[],"why":"Potassium sulphate supplies potassium and sulphur. Superphosphate can form precipitates."},{"id":123,"section":14,"type":"Applied scenario","level":"Moderate","stem":"Which choices address precipitate risk in a fertigation system with hard water?","passage":"","items":["Inject superphosphate on the assumption it cannot precipitate.","Use suitably soluble forms for zinc and iron when needed.","Check compatibility of phosphate fertilizers with high calcium or magnesium water."],"opts":["Only 3","1 and 3","2 and 3","Only 2","1, 2 and 3"],"key":2,"source":"Notes pp. 8–9","pyq":null,"refs":[],"why":"Incompatible phosphorus products may precipitate in hard water. The notes also flag anhydrous ammonia and superphosphate."},{"id":124,"section":14,"type":"Numbered statements","level":"Hard","stem":"The chapter uses a 2020 UPSC item on fertigation benefits.","passage":"","items":["Nutrient leaching can be reduced with suitable application.","Nutrient availability can increase.","Controlling irrigation-water alkalinity is possible.","All phosphatic fertilizers, including rock phosphate, can be efficiently injected."],"opts":["2 and 3","1, 2, 3 and 4","1 and 3","1 and 2","1, 2 and 3"],"key":4,"source":"Notes pp. 8–9","pyq":null,"refs":[],"why":"The advantages correspond to statements 1, 3 and 4 in the source item. Solubility and compatibility limit fertilizer selection."},{"id":125,"section":14,"type":"Technical recall","level":"Easy","stem":"Which term includes pesticide delivery through irrigation water as well as fertilizer delivery?","passage":"","items":[],"opts":["Soil solarisation","Canal lining","Fertigation only","Chemigation","Rainwater harvesting"],"key":3,"source":"Notes pp. 8–9","pyq":null,"refs":[],"why":"Chemigation is the broader term. Fertigation is specifically nutrient delivery."},{"id":126,"section":15,"type":"PYQ-aligned","level":"Moderate","stem":"What Culturable Command Area qualifies as a major irrigation project in the classification tested in 2018?","passage":"","items":[],"opts":["Up to 2,000 ha","Exactly 10,000 ha","2,000–8,000 ha","More than 5,000 ha","More than 10,000 ha"],"key":4,"source":"PYQ pp. 6, 13 · Notes pp. 9–10","pyq":7,"refs":["CCA"],"why":"Major projects have CCA above 10,000 ha. The official area-based classification treats exactly 10,000 ha as medium."},{"id":127,"section":15,"type":"PYQ-aligned","level":"Moderate","stem":"Under the older classification reproduced in the 2020 PYQ explanation, which pair identifies minor irrigation?","passage":"","items":[],"opts":["CCA up to 5,000 ha and cost above ₹5 crore","CCA up to 2,000 ha and cost below ₹25 lakh","CCA up to 2,000 ha and cost above ₹5 crore","CCA up to 5,000 ha and cost below ₹25 lakh","CCA above 10,000 ha and cost below ₹25 lakh"],"key":1,"source":"PYQ pp. 7, 14 · Notes pp. 9–10","pyq":10,"refs":["CCA"],"why":"The booklet’s key combines the 2,000 ha area limit and the approximate ₹2.5 million cost threshold. The explanation states cost below ₹2.5 million. Official census classification uses CCA."},{"id":128,"section":15,"type":"PYQ-aligned","level":"Moderate","stem":"A project has a Culturable Command Area of 8,000 ha. Which official category corresponds to the band tested in the 2023 PYQ?","passage":"","items":[],"opts":["Minor project","Major project","Medium project","Mini project","Micro project"],"key":2,"source":"PYQ pp. 7, 15 · Notes pp. 9–10","pyq":13,"refs":["CCA"],"why":"Medium is above 2,000 ha and up to 10,000 ha. The booklet writes the interval in shorthand."},{"id":129,"section":15,"type":"Applied scenario","level":"Moderate","stem":"Which project classifications agree with the official CCA boundaries?","passage":"","items":["A 10,001 ha project is medium.","A 2,000 ha project is minor.","A 10,000 ha project is medium."],"opts":["Only 2","1 and 3","2 and 3","1, 2 and 3","Only 3"],"key":2,"source":"Notes pp. 9–10","pyq":null,"refs":["CCA"],"why":"The lower boundary belongs to minor, and the upper boundary belongs to medium. A project beyond 10,000 ha is major."},{"id":130,"section":15,"type":"Concept identification","level":"Easy","stem":"A barrage diverts river water straight into a canal. The system has no storage reservoir and serves an even deltaic tract. Which work is described?","passage":"In ________, a diversion structure such as a weir feeds a canal without storing water behind a dam. A canal command can include roads, forests or barren land. Its culturable portion includes only the part suitable for cultivation.","items":[],"opts":["Indirect irrigation","Direct irrigation","Subsurface seepage","Lift irrigation from a reservoir","Storage irrigation"],"key":1,"source":"Notes pp. 9–10","pyq":null,"refs":[],"why":"Direct irrigation uses a diversion structure such as a weir or barrage. Storage irrigation holds water behind a dam for release later."},{"id":131,"section":15,"type":"Technical recall","level":"Easy","stem":"Which command-area measure excludes barren land, forests and roads unfit for cultivation?","passage":"In ________, a diversion structure such as a weir feeds a canal without storing water behind a dam. A canal command can include roads, forests or barren land. Its culturable portion includes only the part suitable for cultivation.","items":[],"opts":["Culturable Command Area","Gross Command Area","Irrigation Potential Utilized","Ultimate Irrigation Potential","Gross Irrigated Area"],"key":0,"source":"Notes pp. 9–10","pyq":null,"refs":[],"why":"CCA is the cultivable part of the gross command. Gross command includes the entire area served."},{"id":132,"section":15,"type":"Calculation","level":"Moderate","stem":"A scheme has a gross command of 9,500 ha, of which 1,800 ha is forest, roads and barren land. What is the CCA?","passage":"","items":[],"opts":["9,500 ha","11,300 ha","8,600 ha","7,500 ha","7,700 ha"],"key":4,"source":"Notes pp. 9–10","pyq":null,"refs":[],"why":"Subtract non-culturable area from gross command, giving 9,500 − 1,800 = 7,700 ha."},{"id":133,"section":15,"type":"Calculation","level":"Moderate","stem":"The same 300 ha is irrigated for one crop in kharif and one in rabi. What is gross irrigated area from those crops?","passage":"","items":[],"opts":["150 ha","450 ha","600 ha","900 ha","300 ha"],"key":2,"source":"Notes pp. 9–10","pyq":null,"refs":[],"why":"Gross irrigated area counts each irrigated crop separately. The net physical area is 300 ha."},{"id":134,"section":15,"type":"Numbered statements","level":"Hard","stem":"Distinguish the potential and area measures shown in the command-area diagram.","passage":"","items":["UIP refers only to land already receiving water in the current year.","IPU refers to gross area actually irrigated in the reference year.","Gross irrigated area counts multiple irrigated crops separately.","IPC is potential made available by irrigation works."],"opts":["3 and 4","1, 2, 3 and 4","2 and 4","1, 2 and 4","2, 3 and 4"],"key":4,"source":"Notes pp. 9–10","pyq":null,"refs":[],"why":"UIP is the maximum theoretically irrigable gross area with full development of resources. IPC and IPU distinguish capability from actual use."},{"id":135,"section":16,"type":"PYQ-aligned","level":"Moderate","stem":"Which canal is identified as India’s longest irrigation canal in the explanation to the 2017 PYQ?","passage":"","items":[],"opts":["Indira Gandhi Canal","Upper Ganga Canal","Agra Canal","Western Yamuna Canal","Sutlej–Yamuna Link Canal"],"key":0,"source":"PYQ pp. 5, 10","pyq":1,"refs":[],"why":"The 2017 key identifies the Indira Gandhi Canal, formerly the Rajasthan Canal. The quiz tests the keyed identification without using the booklet’s inconsistent length breakdown."},{"id":136,"section":16,"type":"PYQ-aligned","level":"Moderate","stem":"India’s principal jute-growing belt in the 2017 PYQ is associated with the delta of which river?","passage":"","items":[],"opts":["Ganga","Mahanadi","Krishna","Cauvery","Godavari"],"key":0,"source":"PYQ pp. 5, 10","pyq":2,"refs":[],"why":"The key names the Ganga. The wider Ganges delta spans parts of India and Bangladesh, with West Bengal central to the Indian belt."},{"id":137,"section":16,"type":"PYQ-aligned","level":"Moderate","stem":"A multipurpose dam on the Mahanadi near Sambalpur is the Hirakud Dam. Which state hosts it?","passage":"","items":[],"opts":["Chhattisgarh","Jharkhand","Madhya Pradesh","Odisha","West Bengal"],"key":3,"source":"PYQ pp. 5, 11","pyq":3,"refs":[],"why":"The 2018 key identifies Odisha. Hirakud is across the Mahanadi."},{"id":138,"section":16,"type":"Technical recall","level":"Easy","stem":"Which river is impounded by the Hirakud Dam?","passage":"","items":[],"opts":["Mahanadi","Baitarani","Subarnarekha","Godavari","Brahmani"],"key":0,"source":"PYQ pp. 5, 10–11","pyq":null,"refs":[],"why":"The PYQ explanation locates Hirakud on the Mahanadi near Sambalpur."},{"id":139,"section":16,"type":"Numbered statements","level":"Hard","stem":"Compare the geography links in the PYQ explanations.","passage":"","items":["Hirakud lies in Odisha.","Hirakud is a dam on the Ganga.","The jute delta tested in 2017 is the Cauvery delta.","The Indira Gandhi Canal serves Rajasthan."],"opts":["Only 1","1, 3 and 4","1 and 4","Only 4","1, 2 and 4"],"key":2,"source":"PYQ pp. 5, 10–11","pyq":null,"refs":[],"why":"The jute question is keyed to the Ganga delta. Hirakud impounds the Mahanadi."},{"id":140,"section":17,"type":"Technical recall","level":"Easy","stem":"When was PMKSY launched according to the chapter?","passage":"","items":[],"opts":["1 April 2014","1 July 2015","1 July 2016","1 April 2020","9 April 2025"],"key":1,"source":"Notes p. 11","pyq":null,"refs":[],"why":"The notes date PMKSY to 1 July 2015. The 9 April 2025 date is M-CADWM Cabinet approval."},{"id":141,"section":17,"type":"Figure recall","level":"Moderate","stem":"What was the approved outlay for the PMKSY 2021–26 continuation cited in the notes?","passage":"","items":[],"opts":["₹39,317 crore","₹40,475 crore","₹44,605 crore","₹93,068.56 crore","₹21,968.75 crore"],"key":3,"source":"Notes p. 11","pyq":null,"refs":["PMKSY"],"why":"The 2021–26 continuation was ₹93,068.56 crore. The smaller amounts apply to projects, disbursements or other funds."},{"id":142,"section":17,"type":"Numbered statements","level":"Hard","stem":"Match the PMKSY components with their primary roles.","passage":"","items":["WDC supports watershed management and water harvesting.","HKKP-SMI addresses surface minor irrigation schemes.","HKKP-RRR is the component for purchasing standalone solar pumps.","AIBP supports completion of priority major and medium projects."],"opts":["1, 2, 3 and 4","1 and 4","1 and 2","Only 1","1, 2 and 4"],"key":4,"source":"Notes p. 11","pyq":null,"refs":[],"why":"RRR repairs, renovates and restores water bodies. Solar pumps fall under PM-KUSUM."},{"id":143,"section":17,"type":"Numbered statements","level":"Hard","stem":"The PMKSY framework includes components handled by different departments.","passage":"","items":["Watershed Development Component is assigned to the Ministry of Power.","WDC is associated with Rural Development.","AIBP is under Jal Shakti.","PDMC is administered by Agriculture and Farmers Welfare."],"opts":["2 and 3","3 and 4","1, 3 and 4","None of the above","2, 3 and 4"],"key":4,"source":"Notes p. 11","pyq":null,"refs":[],"why":"The notes distinguish irrigation works under Jal Shakti, farm-level micro-irrigation under Agriculture, and watershed work under Rural Development."},{"id":144,"section":17,"type":"Figure recall","level":"Moderate","stem":"Which progress pair appears in Jal Shakti’s 2024 year-end review for AIBP priority projects?","passage":"","items":[],"opts":["34 of 99 completed, 95.58 lakh ha created","62 of 99 completed, 25.80 lakh ha created","62 of 99 completed, 34.63 lakh ha created","99 of 99 completed, 25.80 lakh ha created","62 of 80 completed, 25.80 lakh ha created"],"key":1,"source":"Notes p. 11","pyq":null,"refs":["AIBP"],"why":"The achievement was 62 of 99 projects and around 25.80 lakh ha of irrigation potential. The target was 34.63 lakh ha."},{"id":145,"section":17,"type":"Applied scenario","level":"Moderate","stem":"Assuming all other conditions are met, which profiles meet all three thresholds in the notes’ HKKP groundwater screen?","passage":"","items":["A marginal farmer with 63% development, 820 mm rain and 12 m depth.","A small farmer with 52% development, 740 mm rain and 17 m depth.","A small farmer with 52% groundwater development, 820 mm rain and 12 m groundwater depth."],"opts":["1 and 3","1, 2 and 3","2 and 3","Only 2","Only 3"],"key":4,"source":"Notes p. 11","pyq":null,"refs":[],"why":"The screen is development below 60%, rainfall above 750 mm and depth below 15 m below ground level."},{"id":146,"section":17,"type":"Technical recall","level":"Easy","stem":"Which pair of central assistance rates is stated for micro-irrigation under PDMC?","passage":"","items":[],"opts":["45% small/marginal and 55% others","55% small/marginal and 45% others","60% small/marginal and 50% others","75% small/marginal and 55% others","50% small/marginal and 40% others"],"key":1,"source":"Notes p. 11","pyq":null,"refs":["PDMC"],"why":"PDMC assistance is 55% for small and marginal farmers and 45% for other farmers. Historical NMMI rates are distinct."},{"id":147,"section":17,"type":"Numbered statements","level":"Hard","stem":"Trace the administrative history of Per Drop More Crop.","passage":"","items":["PIB identifies 2022–23 as the first year under RKVY.","Farm-level water efficiency is a central objective.","PDMC operated under PMKSY from 2015–16 through 2021–22.","PDMC excludes sprinkler irrigation."],"opts":["2 and 3","1, 2 and 3","1 and 2","1, 2, 3 and 4","1 and 3"],"key":1,"source":"Notes p. 11","pyq":null,"refs":["PDMC"],"why":"Both drip and sprinkler are eligible technologies. The official fiscal-year transition is 2022–23."},{"id":148,"section":17,"type":"Figure recall","level":"Moderate","stem":"What irrigation-potential target is cited for the priority PMKSY-AIBP projects?","passage":"","items":[],"opts":["34.63 lakh ha","39.31 lakh ha","32.63 lakh ha","95.58 lakh ha","25.80 lakh ha"],"key":0,"source":"Notes p. 11","pyq":null,"refs":["AIBP"],"why":"The target is 34.63 lakh ha. About 25.80 lakh ha was reported created during FY2016–17 to FY2023–24."},{"id":149,"section":17,"type":"Numbered statements","level":"Hard","stem":"The notes describe CAD&WM works proceeding alongside AIBP.","passage":"","items":["All pipelines under the cited progress snapshot are above ground.","The cited underground pipeline length is 55,290 km.","On-farm development is a core focus.","The cited land acquisition avoided is 76,594 ha."],"opts":["3 and 4","2 and 4","1, 3 and 4","2, 3 and 4","1, 2, 3 and 4"],"key":3,"source":"Notes p. 11","pyq":null,"refs":["PIPE"],"why":"The snapshot specifically identifies underground pipelines. The figures are also cited in a July 2025 parliamentary reply."},{"id":150,"section":18,"type":"Technical recall","level":"Easy","stem":"When did the Cabinet approve the M-CADWM pilot as a PMKSY sub-scheme?","passage":"","items":[],"opts":["1 July 2015","31 January 2025","25 December 2024","1 April 2020","9 April 2025"],"key":4,"source":"Notes p. 11","pyq":null,"refs":["MC"],"why":"The Cabinet approved it on 9 April 2025 for 2025–26."},{"id":151,"section":18,"type":"Figure recall","level":"Moderate","stem":"What was the initial approved M-CADWM outlay for 2025–26?","passage":"","items":[],"opts":["₹6,000 crore","₹2,000 crore","₹10,000 crore","₹5,000 crore","₹1,600 crore"],"key":4,"source":"Notes p. 11","pyq":null,"refs":["MC"],"why":"The initial pilot outlay was ₹1,600 crore."},{"id":152,"section":18,"type":"Numbered statements","level":"Hard","stem":"Assess the technology and governance in the M-CADWM pilot.","passage":"","items":["The scheme promotes underground pressurised piped networks.","SCADA and IoT support water accounting and management.","It bans linking piped delivery to micro-irrigation.","Irrigation management transfer is envisaged for Water User Societies."],"opts":["1, 2 and 4","2 and 4","1 and 2","Only 4","1, 2, 3 and 4"],"key":0,"source":"Notes p. 11","pyq":null,"refs":["MC"],"why":"Pressurised delivery can enable micro-irrigation at farm level. Water User Societies are central to the governance model."},{"id":153,"section":18,"type":"Figure recall","level":"Moderate","stem":"How many clusters and States/UTs were approved in the December 2025 parliamentary update for M-CADWM?","passage":"","items":[],"opts":["23 clusters in 34 States/UTs","32 clusters in 18 States/UTs","34 clusters in 18 States/UTs","32 clusters in 23 States/UTs","34 clusters in 23 States/UTs"],"key":4,"source":"Notes p. 11","pyq":null,"refs":["MCP"],"why":"The December 2025 parliamentary reply gives 34 clusters in 23 States/UTs. The supplied notes print 32 clusters."},{"id":154,"section":18,"type":"Technical recall","level":"Easy","stem":"The M-CADWM pilot seeks to deliver pressurised water to the farm gate at what plot scale?","passage":"","items":[],"opts":["Up to 1 ha","Up to 0.1 ha","Up to 2 ha","Up to 10 ha","Up to 5 ha"],"key":0,"source":"Notes p. 11","pyq":null,"refs":["MC"],"why":"The Cabinet release describes water delivery up to the farm gate at the 1-hectare scale."},{"id":155,"section":19,"type":"Technical recall","level":"Easy","stem":"Which PM-KUSUM component covers standalone solar agriculture pumps?","passage":"","items":[],"opts":["Component E","Component D","Component A","Component B","Component C"],"key":3,"source":"Notes p. 12","pyq":null,"refs":[],"why":"B is standalone pumps. C solarises grid-connected pumps, while A concerns decentralised power plants."},{"id":156,"section":19,"type":"Technical recall","level":"Easy","stem":"Which PM-KUSUM component includes both individual pump and feeder-level solarisation?","passage":"","items":[],"opts":["Component B","Component A","Component D","Component C","Component E"],"key":3,"source":"Notes p. 12","pyq":null,"refs":[],"why":"Component C has individual pump solarisation and feeder-leve
