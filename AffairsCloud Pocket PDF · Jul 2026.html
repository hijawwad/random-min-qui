Vaani", "BHASHINI Rajyam", "BHASHINI Sarathi"], "correct": 1, "expl": "DIBD and PNB signed an MoU to collaborate on multilingual AI solutions for inclusive banking under the BHASHINI for Seva/Sanchalan initiative."}, {"id": "q98", "sec": "Banking & Loans", "diff": "Moderate", "type": "single", "q": "Kakinada Cooperative Town Bank secured Tier-III status under RBI norms after its total deposits surpassed what threshold?", "options": ["Rs 1,000 crore", "Rs 2,500 crore", "Rs 2,000 crore", "Rs 3,000 crore", "Rs 1,500 crore"], "correct": 2, "expl": "The AP-based UCB secured Tier-III status after deposits surpassed Rs 2,000 crore with zero net NPAs, becoming the 2nd-largest among the state's 46 UCBs."}, {"id": "q99", "sec": "Banking & Loans", "diff": "Hard", "type": "single", "q": "EbixCash World Money Limited became India's first AD-II entity to receive RBI approval for trade remittances. What is the maximum trade remittance amount permitted per transaction?", "options": ["Rs 10 lakh per transaction", "Rs 20 lakh per transaction", "Rs 25 crore per transaction", "Rs 25 lakh per transaction", "Rs 50 lakh per transaction"], "correct": 3, "expl": "EbixCash's enhanced AD-II licence enables trade remittances up to Rs 25 lakh per transaction, under the updated FEMA, 1999 framework."}, {"id": "q100", "sec": "Banking & Loans", "diff": "Moderate", "type": "single", "q": "GoI approved RBI's proposal for field trials of Rs 10 and Rs 20 polymer banknotes. How many polymer banknotes of each denomination will be trialled, and under which section of the RBI Act was the proposal made?", "options": ["One billion of each denomination; Section 22 of the RBI Act", "500 million of each denomination; Section 25 of the RBI Act", "Half a billion of each denomination; Section 22 of the RBI Act", "One billion of each denomination; Section 26 of the RBI Act", "One billion of each denomination; under Section 25 of the RBI Act, 1934"], "correct": 4, "expl": "GoI approved field trials of one billion polymer banknotes each for Rs 10 and Rs 20, worth Rs 3,000 crore, under Section 25 of the RBI Act, 1934."}, {"id": "q101", "sec": "Banking & Loans", "diff": "Hard", "type": "single", "q": "Kotak Mahindra Bank announced acquiring Deutsche Bank's India retail, private banking, and wealth management business for what amount, expected to complete by when?", "options": ["Rs 281.7 crore; expected completion by September 2027", "Rs 281.7 crore; expected completion by March 2027", "Rs 281.7 crore; expected completion by December 2026", "Rs 500 crore; expected completion by September 2027", "Rs 381.7 crore; expected completion by September 2026"], "correct": 0, "expl": "Kotak Mahindra Bank's acquisition of Deutsche Bank's India retail/wealth business for Rs 281.7 crore is expected to complete by September 2027, subject to CCI approval."}, {"id": "q102", "sec": "Banking & Loans", "diff": "Moderate", "type": "single", "q": "IRDAI granted a final (R3) Certificate of Registration to Prudential HCL Health Insurance Limited, making it India's how many-eth standalone health insurer?", "options": ["7th standalone health insurer", "8th standalone health insurer", "10th standalone health insurer", "9th standalone health insurer", "6th standalone health insurer"], "correct": 1, "expl": "Prudential HCL Health Insurance became India's 8th standalone health insurer, the 3rd such registration issued by IRDAI in CY26, granted at its 136th meeting."}, {"id": "q103", "sec": "Banking & Loans", "diff": "Hard", "type": "single", "q": "Fairfax Financial Holdings emerged as preferred bidder to acquire what percentage stake in IDBI Bank, and for what deal value?", "options": ["60.72% stake, for USD 6 billion", "60.72% stake, for Rs 45,000 crore", "60.72% stake, for Rs 52,932 crore (USD 5.5 billion)", "51% stake, for Rs 45,000 crore", "74% stake, for Rs 52,932 crore"], "correct": 2, "expl": "Fairfax emerged as preferred bidder for a 60.72% stake in IDBI Bank from GoI and LIC, in a Rs 52,932 crore (USD 5.5 billion) deal — potentially the largest foreign investment in an Indian bank."}, {"id": "q104", "sec": "Banking & Loans", "diff": "Moderate", "type": "notcorrect", "q": "Which one of the following statements about banking developments in July 2026 is NOT correct?", "options": ["The NSE's natural gas futures contract is linked to the IGX Gujarat (Dahej) hub price", "SBI Card and Google Pay launched the 'Google Pay Flex SBI Card' co-branded credit card", "OmniCard launched India's first Flexi Benefits Basket on UPI", "NSE's 'Indian Natural Gas Futures' contract was launched under the symbol NATGASUSA", "GoI approved RBI field trials of Rs 10 and Rs 20 polymer currency notes"], "correct": 3, "expl": "NSE's natural gas futures contract was launched under the symbol NATGASIND (not NATGASUSA), linked to the IGX Gujarat (Dahej) hub price."}, {"id": "q105", "sec": "Banking & Loans", "diff": "Hard", "type": "multi", "q": "Consider the following statements about RBI and banking regulatory actions (2026):\nI. RBI imposed a combined penalty of Rs 66.7 lakh on Bank of Baroda and GIC Housing Finance.\nII. RBI's Financial Inclusion Index rose to 70 in FY26 from 67 in FY25.\nIII. Delhivery Financial Services received RBI approval for a Type-I NBFC licence.\nIV. RBI approved Areion Group's Rs 936 crore acquisition of Aviom India Housing Finance.\nHow many of the above statements are correct?", "options": ["All four", "None of the above are correct", "Only two", "Only one", "Only three"], "correct": 4, "expl": "Statements I, II, and IV are correct. Delhivery Financial Services received a Type-II (not Type-I) NBFC-ND licence, making statement III incorrect."}, {"id": "q106", "sec": "Finance News", "diff": "Moderate", "type": "single", "q": "Paytm Europe Payments S.A. secured a Payment Institution licence from which regulator, effective from what date?", "options": ["Luxembourg's CSSF, effective from July 2, 2026", "Germany's BaFin, effective from July 2, 2026", "Luxembourg's CSSF, effective from June 2, 2026", "Luxembourg's CSSF, effective from August 2, 2026", "Ireland's Central Bank, effective from July 2, 2026"], "correct": 0, "expl": "Paytm Europe secured a PI licence from Luxembourg's Commission de Surveillance du Secteur Financier (CSSF), effective from July 2, 2026, enabling services across the EEA."}, {"id": "q107", "sec": "Finance News", "diff": "Moderate", "type": "single", "q": "GIFT City signed an MoU with which entity to enhance cross-border investment linkages with Vietnam?", "options": ["Ho Chi Minh City Stock Exchange", "Vietnam International Financial Center–Da Nang (VIFC-DN)", "State Bank of Vietnam", "Vietnam Ministry of Finance", "Vietnam International Financial Center–Hanoi"], "correct": 1, "expl": "GIFT City signed an MoU with VIFC-DN to support development of Vietnam's international financial centre and cross-border investments."}, {"id": "q108", "sec": "Finance News", "diff": "Hard", "type": "single", "q": "Delhivery Financial Services received RBI approval for which type of NBFC licence?", "options": ["Type-I NBFC-Deposit Taking", "Type-I NBFC-ND", "Type-II Non-Banking Financial Company-Non-Deposit Taking (NBFC-ND)", "Type-III NBFC-ND", "Type-II NBFC-Deposit Taking"], "correct": 2, "expl": "Delhivery Financial Services received approval for a Certificate of Registration as a Type-II NBFC-ND, subject to submission of certain documents."}, {"id": "q109", "sec": "Finance News", "diff": "Moderate", "type": "single", "q": "NSE's 'Indian Natural Gas Futures' contract commenced trading from which date, quoted in what unit?", "options": ["1 July 2026, quoted in Rs. per mmBtu", "27 July 2026, quoted in Rs. per MT", "15 July 2026, quoted in Rs. per barrel", "27 July 2026, quoted in Rs. per mmBtu", "27 July 2026, quoted in USD per mmBtu"], "correct": 3, "expl": "The NATGASIND contract began trading from 27 July 2026, quoted in Rs. per mmBtu, cash-settled and linked to the IGX Gujarat (Dahej) hub price."}, {"id": "q110", "sec": "Finance News", "diff": "Hard", "type": "single", "q": "IRDAI approved Patanjali Ayurved and DS Group's acquisition of Magma General Insurance from Sanoti Properties for what amount?", "options": ["Rs 4,000 crore", "Rs 5,000 crore", "Rs 3,500 crore", "Rs 4,500 crore, from Adar Poonawalla directly", "Rs 4,500 crore"], "correct": 4, "expl": "IRDAI approved the Rs 4,500 crore acquisition of Magma General Insurance by Patanjali Ayurved and DS Group from Adar Poonawalla-owned Sanoti Properties."}, {"id": "q111", "sec": "Finance News", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about finance news items in June-July 2026:\nI. VIYONA Fintech received BBPS (now Bharat Connect) approval as a Customer Operating Unit.\nII. Axis Finance launched 'Drishti', an in-house Business Rules Engine platform for retail/MSME lending.\nIII. IRDAI approved a licence for ProTec General Insurance, a JV between M Pallonji Group and True North's Divya Sehgal.\nIV. NCDEX's 'Nidhi' platform leverages a network of 1,200 Farmer Producer Organisations.\nHow many of the above statements are correct?", "options": ["Only three", "Only two", "Only one", "All four", "None of the above are correct"], "correct": 0, "expl": "Statements I, II, and III are correct. NCDEX Nidhi leverages a network of 800 (not 1,200) FPOs, making statement IV incorrect."}, {"id": "q112", "sec": "GDP & Economy", "diff": "Moderate", "type": "single", "q": "The IMF's July 2026 World Economic Outlook Update projects India's economy to grow by what rate in FY27, and how does this compare to its April 2026 forecast?", "options": ["6.7% in FY27, lower than the 6.9% April 2026 forecast", "6.4% in FY27, marginally lower than the 6.5% April 2026 forecast", "6.4% in FY27, marginally higher than the 6.2% April 2026 forecast", "6.5% in FY27, same as the April 2026 forecast", "6.4% in FY27, higher than the 6.0% April 2026 forecast"], "correct": 1, "expl": "IMF's WEO Update (July 2026) projects 6.4% growth for India in FY27, marginally lower than the 6.5% forecast issued in April 2026."}, {"id": "q113", "sec": "GDP & Economy", "diff": "Hard", "type": "single", "q": "As per the IMF's WEO Update, what growth rate does India's economy see projected for FY28, and by how much was this revised up?", "options": ["6.9% in FY28, up from 6.5%", "7.0% in FY28, up from 6.5%", "6.7% in FY28, up from an earlier projection of 6.5%", "6.5% in FY28, unchanged from earlier projection", "6.7% in FY28, up from 6.4%"], "correct": 2, "expl": "IMF projects India will grow at 6.7% in FY28, up from the earlier projection of 6.5%."}, {"id": "q114", "sec": "GDP & Economy", "diff": "Moderate", "type": "single", "q": "The Asian Development Bank lowered India's FY27 GDP growth forecast to what level, from what earlier forecast, citing high energy prices?", "options": ["6.6%, lowered from 7.0%", "6.9%, lowered from 7.2%", "6.6%, lowered from 6.8%", "6.6%, lowered from 6.9% (April 2026)", "6.4%, lowered from 6.9%"], "correct": 3, "expl": "ADB lowered India's FY27 GDP growth forecast to 6.6% from 6.9% (projected in April 2026), citing high energy prices squeezing household incomes."}, {"id": "q115", "sec": "GDP & Economy", "diff": "Hard", "type": "single", "q": "ADB raised India's inflation forecast for FY27 to what level, from what earlier level?", "options": ["5.0%, up from 4.2%", "5.5%, up from 4.5%", "5.2%, up from 4.0%", "4.8%, up from 4.5%", "5.2%, up from 4.5%"], "correct": 4, "expl": "ADB raised India's FY27 inflation forecast to 5.2% from 4.5%, citing higher global oil prices, a weaker rupee, and persistent food inflation, while retaining the FY28 inflation forecast at 4.0%."}, {"id": "q116", "sec": "GDP & Economy", "diff": "Moderate", "type": "single", "q": "ICRA Limited projected India's real GDP growth for Q1 FY27 (April-June) at what range, given that Q4 FY26 growth was recorded at what rate?", "options": ["6.4–6.6% for Q1 FY27; Q4 FY26 growth was 7.8%", "7.0–7.2% for Q1 FY27; Q4 FY26 growth was 7.8%", "6.0–6.5% for Q1 FY27; Q4 FY26 growth was 7.8%", "6.4–6.6% for Q1 FY27; Q4 FY26 growth was 7.2%", "6.4–6.6% for Q1 FY27; Q4 FY26 growth was 6.9%"], "correct": 0, "expl": "ICRA projected Q1 FY27 real GDP growth at 6.4-6.6%, following India's real GDP growth of 7.8% in Q4 FY26 (January-March)."}, {"id": "q117", "sec": "GDP & Economy", "diff": "Hard", "type": "single", "q": "As per RBI provisional data, by how much did India's outward FDI decline Year-on-Year in June 2026, and to what value?", "options": ["Declined 35% Y-o-Y to USD 3.5 billion", "Declined 47.9% Y-o-Y to USD 3 billion", "Declined 40% Y-o-Y to USD 3 billion", "Declined 47.9% Y-o-Y to USD 4.5 billion", "Declined 47.9% Y-o-Y to USD 2.5 billion"], "correct": 1, "expl": "India's outward FDI declined 47.9% Y-o-Y to USD 3 billion in June 2026 (from USD 5.74 billion in June 2025), also down from USD 4.5 billion in May 2026."}, {"id": "q118", "sec": "GDP & Economy", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about growth forecasts for India (July 2026) is NOT correct?", "options": ["ADB lowered India's FY27 GDP growth forecast to 6.6% from 6.9%", "The IMF projects India's economy to grow by 6.4% in FY27", "ICRA projected India's real GDP growth at 7.0-7.5% for Q1 FY27", "ADB retained its FY28 growth forecast for India at 7.3%", "India's real GDP grew by 7.8% in Q4 FY26"], "correct": 2, "expl": "ICRA projected India's real GDP growth at 6.4-6.6% (not 7.0-7.5%) for Q1 FY27."}, {"id": "q119", "sec": "GDP & Economy", "diff": "Moderate", "type": "multi", "q": "Consider the following statements on GDP growth forecasts (July 2026):\nI. The IMF projects global growth at 3.0% in 2026, strengthening to 3.4% in 2027.\nII. World trade volume growth is projected to slow from 5.0% in 2025 to 3.5% in 2026.\nIII. ADB retained its FY28 inflation forecast for India at 4.0%.\nIV. ICRA's Q1 FY27 GDP growth projection range was 5.5-6.0%.\nHow many of the above statements are correct?", "options": ["Only two", "None of the above are correct", "Only one", "Only three", "All four"], "correct": 3, "expl": "Statements I, II and III are correct. ICRA's actual Q1 FY27 projection range was 6.4-6.6%, not 5.5-6.0%, making statement IV incorrect."}, {"id": "q120", "sec": "Business News", "diff": "Moderate", "type": "single", "q": "POWERGRID secured a JPY 80 billion green loan from JBIC for a Renewable Energy transmission project. How much of this is provided directly by JBIC, and by which other banks is the rest co-financed?", "options": ["JBIC provides 48 billion JPY; co-financed by SMBC only", "JBIC provides 40 billion JPY; co-financed by four Japanese banks", "JBIC provides 80 billion JPY entirely on its own", "JBIC provides 60 billion JPY; co-financed by SMBC and Kansai Mirai Bank only", "JBIC provides 48 billion JPY; co-financed by SMBC, Kansai Mirai Bank, Kiraboshi Bank, and The Joyo Bank"], "correct": 4, "expl": "JBIC provides 48 billion JPY directly, with the remainder co-financed by SMBC, Kansai Mirai Bank, Kiraboshi Bank, and The Joyo Bank, with JBIC guaranteeing the co-financed portion."}, {"id": "q121", "sec": "Business News", "diff": "Hard", "type": "single", "q": "POWERGRID's JBIC-financed transmission project supports India's goal of achieving how much RE capacity by 2030, and expanding the transmission network to what length by 2032?", "options": ["500 GW RE capacity by 2030; transmission network to 191,000 circuit km by 2032", "500 GW RE capacity by 2030; transmission network to 150,000 ckm by 2032", "500 GW RE capacity by 2028; transmission network to 191,000 ckm by 2032", "500 GW RE capacity by 2032; transmission network to 200,000 ckm by 2030", "450 GW RE capacity by 2030; transmission network to 191,000 ckm by 2032"], "correct": 0, "expl": "The project supports India's target of 500 GW RE capacity by 2030 and expanding the transmission network to 191,000 circuit km by 2032."}, {"id": "q122", "sec": "Business News", "diff": "Moderate", "type": "single", "q": "Paras Semiconductors signed an MoU with MPSeDC to establish a greenfield OSAT facility in the Indore-Ujjain region with a proposed investment of how much?", "options": ["Rs 4,500 crore", "Rs 6,200 crore", "Rs 5,000 crore", "Rs 6,200 crore, in Bhopal instead of Indore-Ujjain", "Rs 7,500 crore"], "correct": 1, "expl": "Paras Semiconductors (a PDST subsidiary) proposed an investment of Rs 6,200 crore for a greenfield OSAT facility in the Indore-Ujjain region of MP."}, {"id": "q123", "sec": "Business News", "diff": "Hard", "type": "single", "q": "Vizhinjam International Seaport received final CBIC approval to commence EXIM cargo operations from which date?", "options": ["18 July 2026", "1 August 2026", "18 August 2026", "1 September 2026", "18 August 2027"], "correct": 2, "expl": "CBIC notified Vizhinjam International Seaport as a Customs Port under the Customs Act, 1962, enabling EXIM operations from 18 August 2026."}, {"id": "q124", "sec": "Business News", "diff": "Moderate", "type": "single", "q": "AEL's Kutch Copper Limited secured LME certification for its 'Adani Copper' Grade A cathodes, enabling delivery against LME futures from which date?", "options": ["July 20, 2026", "July 1, 2026", "August 10, 2026", "July 10, 2026", "June 10, 2026"], "correct": 3, "expl": "Kutch Copper Limited's LME certification allows Adani Copper cathodes to be delivered against LME Copper futures contracts from July 10, 2026."}, {"id": "q125", "sec": "Business News", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about business developments in July 2026:\nI. GoI approved the Dixon-Vivo Joint Venture for domestic smartphone manufacturing.\nII. TCS expanded its partnership with ABB, marking the next phase of a 20-year partnership.\nIII. Sona Comstar and DENSO signed agreements to establish two JVs for electric and hybrid powertrain systems.\nIV. Air India and Saudia signed an MoU to strengthen aviation partnership, with the MoU signed by Tata Group's chairman.\nHow many of the above statements are correct?", "options": ["Only one", "Only two", "All four", "None of the above are correct", "Only three"], "correct": 4, "expl": "Statements I, II and III are correct. The Air India-Saudia MoU was signed by Air India's CEO Campbell Wilson and Saudia's DG Ibrahim Al-Omar, not by Tata Group's chairman, making statement IV incorrect."}, {"id": "q126", "sec": "MoUs & Agreements", "diff": "Moderate", "type": "single", "q": "Adani Enterprises Limited (AEL) and International Resources Holding (IRH) signed an MoU with the Government of Odisha to develop an integrated greenfield aluminium project worth how much, through what JV structure?", "options": ["USD 11.5 billion (Rs 1.08 lakh crore), through a 50:50 joint venture", "USD 10 billion, through a 60:40 joint venture", "USD 8 billion, through a 50:50 joint venture", "USD 11.5 billion, through a 50:50 joint venture with the Odisha government", "USD 11.5 billion, through a 70:30 joint venture"], "correct": 0, "expl": "AEL and IRH (an Abu Dhabi-based IHC group entity) signed an MoU for a USD 11.5 billion (Rs 1.08 lakh crore) aluminium project via a 50:50 JV."}, {"id": "q127", "sec": "MoUs & Agreements", "diff": "Hard", "type": "single", "q": "The Government of Odisha signed an MoU with HCLTech and Sarvam AI to establish an AI data centre at Odisha Sovereign AI Park with what outlay?", "options": ["Rs 12,500 crore", "Rs 14,257 crore", "Rs 15,000 crore", "Rs 10,000 crore", "Rs 14,257 crore, in Bhubaneswar's twin city Cuttack"], "correct": 1, "expl": "The MoU for the AI data centre at Odisha Sovereign AI Park, Bhubaneswar, carries an outlay of Rs 14,257 crore."}, {"id": "q128", "sec": "MoUs & Agreements", "diff": "Moderate", "type": "single", "q": "The Government of Arunachal Pradesh signed an MoU with Norway's Tidal Sail AS to implement what capacity River Kinetic Energy Demonstration Project?", "options": ["500 megawatt", "1 megawatt", "500 kilowatt (kW)", "250 kilowatt", "750 kilowatt"], "correct": 2, "expl": "The 500 kW River Kinetic Energy Demonstration Project paves the way for India's first such plant, implemented through CES&HS under the India-Norway Green Partnership."}, {"id": "q129", "sec": "MoUs & Agreements", "diff": "Moderate", "type": "single", "q": "The Ministry of Corporate Affairs signed an MoU with IIT Madras, ICAI, ICSI, and ICMAI to launch which scheme, and what is its training structure?", "options": ["'Corporate Mitra Scheme'; 200 hours online plus six months practical training", "'Corporate Sahayak Scheme'; 150 hours online plus six months practical training", "'Corporate Mitra Scheme'; 150 hours online plus one year practical training", "'Corporate Mitra Scheme'; 150 hours of online SWAYAM Plus learning plus six months of practical training", "'Corporate Setu Scheme'; 100 hours online plus three months practical training"], "correct": 3, "expl": "The Corporate Mitra Scheme includes 150 hours of SWAYAM Plus online learning followed by six months of practical training, for Indian nationals below 30 years."}, {"id": "q130", "sec": "MoUs & Agreements", "diff": "Hard", "type": "single", "q": "NABARD signed an MoU with MAHAPREIT to jointly finance green and climate-resilient infrastructure projects. What does MAHAPREIT stand for and whose enterprise is it?", "options": ["Mahatma Phule Rural Energy and Infrastructure Technology Limited, a Government of Maharashtra enterprise", "Maharashtra Rural Energy and Infrastructure Trust, a private enterprise", "Mahatma Phule Renewable Energy Investment Trust, a Government of India enterprise", "Maharashtra Phule Renewable Energy Infrastructure Trust, a Government of Maharashtra enterprise", "Mahatma Phule Renewable Energy and Infrastructure Technology Limited, a Government of Maharashtra enterprise"], "correct": 4, "expl": "MAHAPREIT (Mahatma Phule Renewable Energy and Infrastructure Technology Limited) is a Government of Maharashtra enterprise; NABARD's MoU focuses initially on green energy and rural infrastructure in Maharashtra."}, {"id": "q131", "sec": "MoUs & Agreements", "diff": "Moderate", "type": "single", "q": "The Department of Posts and TRAI signed an MoU to conduct India's largest village-level telecom network performance survey, covering how many villages, over what duration?", "options": ["Over 5.68 lakh villages, over a one-year initiative", "Over 4 lakh villages, over a one-year initiative", "Over 5.68 lakh villages, over a two-year initiative", "Over 5.68 lakh villages, over a six-month initiative", "Over 6 lakh villages, over a one-year initiative"], "correct": 0, "expl": "The one-year survey will assess mobile network performance of Airtel, Jio, Vi, and BSNL across over 5.68 lakh villages using a TRAI-developed Android app."}, {"id": "q132", "sec": "MoUs & Agreements", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about MoUs signed in July 2026 is NOT correct?", "options": ["The Andhra Pradesh Economic Development Board signed an MoU with the UAE Food Cluster to establish a food processing cluster", "The Government of Madhya Pradesh and DoT signed an MoU to establish India's first Telecom Manufacturing Zone at Indore", "NABARD signed an MoU with MAHAPREIT to finance green infrastructure projects in Maharashtra", "Government of Tripura signed three MoUs with NSE to strengthen financial literacy and skill development", "Google India signed an MoU with the Government of Tripura to enhance AI capabilities and cloud infrastructure"], "correct": 1, "expl": "India's first Telecom Manufacturing Zone (TMZ), Phase-I, was established at Gwalior (not Indore), Madhya Pradesh."}, {"id": "q133", "sec": "MoUs & Agreements", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about MoUs between organisations (July 2026):\nI. The Ministry of Tourism signed an MoU with Google India to boost digital promotion of tourism destinations.\nII. Air India signed an MoU with SIA Engineering Company to explore MRO sector collaboration.\nIII. Bisleri International signed a Letter of Association with the Indian Coast Guard through its 'Bottles for Change' initiative.\nIV. The Central University of Kerala signed an MoU with the Indian Air Force for maritime studies collaboration.\nHow many of the above statements are correct?", "options": ["Only one", "Only two", "Only three", "None of the above are correct", "All four"], "correct": 2, "expl": "Statements I, II and III are correct. The Central University of Kerala's MoU for maritime studies collaboration was signed with the Indian Navy (not the Air Force), making statement IV incorrect."}, {"id": "q134", "sec": "Appointments & Resignations", "diff": "Moderate", "type": "single", "q": "Ravi Agrawal was re-appointed as Chairman of the Central Board of Direct Taxes (CBDT) for another 6 months from July 1, 2026. Until what date will he remain in this post?", "options": ["June 30, 2027", "September 30, 2026", "December 31, 2027", "December 31, 2026, or until further orders, whichever is earlier", "March 31, 2027"], "correct": 3, "expl": "Ravi Agrawal's re-appointment as CBDT Chairman runs until December 31, 2026, or until further orders, whichever is earlier."}, {"id": "q135", "sec": "Appointments & Resignations", "diff": "Hard", "type": "single", "q": "Rajiv Kumar, former Chief Election Commissioner of India, was appointed as part-time Chairman of which bank, for how long?", "options": ["HDFC Bank, for a period of 4 years", "HDFC Bank, for a period of 5 years", "Axis Bank, for a period of 3 years", "ICICI Bank, for a period of 3 years", "HDFC Bank, for a period of 3 years"], "correct": 4, "expl": "Rajiv Kumar was appointed part-time Chairman of HDFC Bank for 3 years, succeeding interim chairman Keki Mistry, and also became an Additional Independent Director for four years."}, {"id": "q136", "sec": "Appointments & Resignations", "diff": "Moderate", "type": "single", "q": "Air Marshal Ashutosh Dixit assumed charge as which numbered Vice Chief of Air Staff (VCAS) of the Indian Air Force?", "options": ["51st VCAS", "50th VCAS", "52nd VCAS", "49th VCAS", "48th VCAS"], "correct": 0, "expl": "Air Marshal Ashutosh Dixit, former Chief of Integrated Defence Staff, became the 51st VCAS, succeeding Air Marshal Nagesh Kapoor."}, {"id": "q137", "sec": "Appointments & Resignations", "diff": "Hard", "type": "single", "q": "In the ACC's July 2026 reshuffle of IPS officers, who was appointed Director General of the Bureau of Police Research & Development (BPR&D), and what batch is he from?", "options": ["Sujeet Pandey, a 1993-batch IPS officer of Haryana cadre", "Alok Kumar Mittal, a 1993-batch IPS officer of Haryana cadre", "Alok Kumar Mittal, a 1994-batch IPS officer of Haryana cadre", "Alok Kumar Mittal, a 1993-batch IPS officer of Andhra Pradesh cadre", "Amit Garg, a 1993-batch IPS officer of Haryana cadre"], "correct": 1, "expl": "Alok Kumar Mittal, a 1993-batch IPS officer of Haryana cadre, was appointed DG of BPR&D, serving until June 30, 2029, or until further orders."}, {"id": "q138", "sec": "Appointments & Resignations", "diff": "Moderate", "type": "single", "q": "Dilip Asbe, MD & CEO of NPCI, was appointed to the Supervisory Board of which international financial messaging body, which is transitioning governance structure?", "options": ["BIS (Bank for International Settlements)", "SEPA (Single Euro Payments Area)", "SWIFT (Society for Worldwide Interbank Financial Telecommunication)", "FATF (Financial Action Task Force)", "IIF (Institute of International Finance)"], "correct": 2, "expl": "Dilip Asbe's SWIFT Supervisory Board appointment coincides with SWIFT's transition from a single-tier Board to a two-tier governance structure."}, {"id": "q139", "sec": "Appointments & Resignations", "diff": "Hard", "type": "single", "q": "Mahesh Muralidhar Pai was approved by RBI as MD & CEO of South Indian Bank for a 3-year term from October 1, 2026, succeeding whom?", "options": ["Murali Ramakrishnan", "V.G. Mathew", "N. S. Vishwanathan", "P.R. Seshadri", "Keki Mistry"], "correct": 3, "expl": "Mahesh Muralidhar Pai succeeds P.R. Seshadri as MD & CEO of South Indian Bank; RBI also re-appointed N.S. Vishwanathan as Non-Executive Chairman of Axis Bank."}, {"id": "q140", "sec": "Appointments & Resignations", "diff": "Moderate", "type": "single", "q": "Which three Indian-origin experts did the US Federal Reserve appoint to lead task forces reviewing its monetary policy framework, under Fed Chair Kevin Warsh?", "options": ["Raj Chetty, Asha Sharma, and Urjit Patel", "Raghuram Rajan, Raj Chetty, and Gita Gopinath", "Raghuram Rajan, Gita Gopinath, and Raj Chetty", "Raghuram Rajan, Arvind Subramanian, and Raj Chetty", "Raghuram Rajan, Raj Chetty, and Asha Sharma"], "correct": 4, "expl": "Raghuram Rajan, Raj Chetty, and Asha Sharma were appointed to lead three of five task forces reviewing the Fed's monetary policy framework."}, {"id": "q141", "sec": "Appointments & Resignations", "diff": "Hard", "type": "single", "q": "Anurag Jain was appointed as the new CEO of NITI Aayog, succeeding whom (who held additional charge since February 2026)?", "options": ["Nidhi Chhibber", "Amitabh Kant", "B.V.R. Subrahmanyam", "Suman Bery", "Parameswaran Iyer"], "correct": 0, "expl": "Anurag Jain succeeds Nidhi Chhibber, DG of NITI Aayog's DMEO, who had held additional CEO charge since 24 February 2026, for a two-year tenure."}, {"id": "q142", "sec": "Appointments & Resignations", "diff": "Moderate", "type": "single", "q": "Ashiss Kumar Dash was appointed CEO Designate of Infosys, set to assume charge as MD & CEO from which date, following whom?", "options": ["1 April 2027, following Nandan Nilekani", "1 April 2027, following Salil Parekh's second term", "1 April 2026, following Salil Parekh", "1 January 2027, following Salil Parekh", "1 April 2027, following U.B. Pravin Rao"], "correct": 1, "expl": "Ashiss Kumar Dash will assume charge as MD & CEO from 1 April 2027 for a five-year term (2027-2032), following completion of Salil Parekh's second term."}, {"id": "q143", "sec": "Appointments & Resignations", "diff": "Hard", "type": "single", "q": "Harjit Singh Grewal assumed charge as Chairman of the National Commission for Minorities (NCM), succeeding whom, whose tenure ended in April 2025?", "options": ["Berjis Desai", "Glenn Souza Ticlo", "Iqbal Singh Lalpura", "Rijiju Kiren", "S. Munawari Begum"], "correct": 2, "expl": "Harjit Singh Grewal succeeded Iqbal Singh Lalpura (tenure ended April 2025) as NCM Chairman for a three-year term under the NCM Act, 1992."}, {"id": "q144", "sec": "Appointments & Resignations", "diff": "Moderate", "type": "single", "q": "Who assumed office as Peru's President following the 2026 election, succeeding interim President José María Balcázar, and what was her earlier role?", "options": ["Keiko Fujimori; she previously served as Prime Minister of Peru", "Keiko Fujimori; she previously served as Vice President of Peru", "Keiko Fujimori; she previously served as Mayor of Lima", "Keiko Fujimori; she previously served as First Lady of Peru (1994-2000)", "Dina Boluarte; she previously served as First Lady of Peru"], "correct": 3, "expl": "Keiko Fujimori, leader of the Popular Force party, is set to assume office on 28 July 2026, becoming Peru's 10th President in a decade; she was First Lady of Peru from 1994-2000."}, {"id": "q145", "sec": "Appointments & Resignations", "diff": "Hard", "type": "single", "q": "Andy Burnham became the 59th Prime Minister of the United Kingdom after Keir Starmer resigned. By what margin of votes did he defeat Reform UK's Robert Kenyon in the leadership election?", "options": ["By a margin of more than 5,000 votes, securing 50% of the vote", "By a margin of more than 12,000 votes, securing 55% of the vote", "By a margin of more than 9,000 votes, securing 60% of the vote", "By a margin of more than 9,000 votes, securing 45% of the vote", "By a margin of more than 9,000 votes, securing nearly 55% of the vote"], "correct": 4, "expl": "Andy Burnham secured nearly 55% of the vote, defeating Robert Kenyon by more than 9,000 votes, with a record 59% turnout."}, {"id": "q146", "sec": "Appointments & Resignations", "diff": "Moderate", "type": "single", "q": "Viswanathan Anand assumed charge as Interim President of FIDE after incumbent President Arkady Dvorkovich suspended his duties following sanctions related to which conflict?", "options": ["Russia's war against Ukraine (EU and Switzerland sanctions)", "The Israel-Gaza conflict", "The Armenia-Azerbaijan conflict", "US-China trade tensions", "The Russia-Georgia conflict"], "correct": 0, "expl": "Dvorkovich voluntarily suspended his duties following EU and Swiss sanctions related to Russia's war against Ukraine, with Anand, FIDE Deputy President, stepping in as Interim President."}, {"id": "q147", "sec": "Appointments & Resignations", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about appointments in July 2026 is NOT correct?", "options": ["Bijay Kumar Mohanty assumed additional charge as Chairman and Managing Director of IREDA", "Satya Pal Kumar was appointed Director of the Financial Intelligence Unit-India (FIU-IND), succeeding Ravi Shankar", "C. Raghuram took charge as Chairman and Managing Director of Hindustan Shipyard Limited", "Sujeet Pandey was appointed Director of the Sardar Vallabhbhai Patel National Police Academy", "Pralhad Joshi was given additional charge as the 10th Union Minister of Education following Dharmendra Pradhan's resignation"], "correct": 1, "expl": "Satya Pal Kumar succeeded Pankaj Kumar Mishra (not Ravi Shankar) as Director of FIU-IND. Ravi Shankar was separately appointed RBI Executive Director."}, {"id": "q148", "sec": "Appointments & Resignations", "diff": "Hard", "type": "multi", "q": "Consider the following statements about appointments (July 2026):\nI. Amit Garg, a 1993-batch IPS officer of Andhra Pradesh cadre, was appointed Director of the National Crime Records Bureau.\nII. Rahul Himalian was appointed additional CMD of IRCTC following Sanjay Kumar Jain's resignation.\nIII. Naresh Pal Gangwar took charge as Secretary of Department of Higher Education, replacing Vineet Joshi.\nIV. Bassirou Diomaye Diakhar Faye was elected ECOWAS Chairman, marking the first time Senegal held the post since ECOWAS's founding in 1975.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "Only two", "All four", "Only three", "Only one"], "correct": 2, "expl": "All four statements are correct as detailed in the appointments coverage."}, {"id": "q149", "sec": "Awards & Recognitions", "diff": "Moderate", "type": "single", "q": "The 2026 Leadership Award was presented to Sunil Bharti Mittal by which organisation, at an event themed 'America At 250'?", "options": ["US Chamber of Commerce", "India Global Forum (IGF)", "American Association of Physicians of Indian Origin (AAPI)", "US-India Strategic Partnership Forum (USISPF)", "Confederation of Indian Industry (CII)"], "correct": 3, "expl": "USISPF presented the 2026 Leadership Award to Sunil Bharti Mittal at the IX Leadership Summit in Washington D.C., themed 'America At 250'."}, {"id": "q150", "sec": "Awards & Recognitions", "diff": "Easy", "type": "single", "q": "Nita Ambani was conferred the AAPI Humanitarian Award and the Key to the City of which US city?", "options": ["Houston", "Atlanta", "Orlando", "Chicago", "Tampa"], "correct": 4, "expl": "Nita Ambani received the AAPI Humanitarian Award and Key to the City of Tampa, Florida, at the 44th Annual AAPI Convention."}, {"id": "q151", "sec": "Awards & Recognitions", "diff": "Hard", "type": "single", "q": "As per the Brand Finance India 100 Report 2026, which group became the fastest company to enter India's Top 10 Most Valuable Brands, rising from what rank to what rank?", "options": ["Adani Group, rising from 13th to 8th spot", "Tata Group, rising from 13th t  period", "800 total; 125 registered in that period"], "correct": 1, "expl": "India's total GI-tagged products stand at 822, of which 125 alone were registered between April 2025 and March 2026 (as cited in the Sirsa Kinnow GI tag news item)."}, {"id": "q158", "sec": "Awards & Recognitions", "diff": "Moderate", "type": "single", "q": "Sirsa Kinnow became Haryana's first exclusive GI product in which category?", "options": ["Textile", "Handicraft", "Fruit", "Agricultural product (grain)", "Spice"], "correct": 2, "expl": "Sirsa Kinnow, granted GI tag by the GI Registry under DPIIT, became Haryana's first fruit to receive GI recognition."}, {"id": "q159", "sec": "Awards & Recognitions", "diff": "Hard", "type": "single", "q": "India recorded its best-ever performance at the 56th International Physics Olympiad 2026 in Bucaramanga, Colombia. How many gold medals did India win, and which countries did it tie for first place with?", "options": ["All 5 Indian participants won gold; India tied for first with only China", "All 5 won gold; tied for first with USA, China, and Russia", "4 gold medals; tied for first with China and Russia", "All 5 Indian participants won gold; India tied for joint first place with Russia, China, Kazakhstan, South Korea, and Taiwan", "5 gold medals; India secured outright first place alone"], "correct": 3, "expl": "All five Indian participants won gold medals at IPhO 2026, with India securing joint first place in the medal tally alongside Russia, China, Kazakhstan, South Korea, and Taiwan."}, {"id": "q160", "sec": "Awards & Recognitions", "diff": "Moderate", "type": "single", "q": "At the 72nd National Film Awards (for the year 2024), which film won the Best Feature Film award and also won two additional awards?", "options": ["'Chandu Champion', which also won Best Actor and Best Music Direction", "'Bramayugam', which also won Best Actress and Best Music Direction", "'Article 370', which also won Best Director and Best Actress", "'Article 370', whi so III and IV are incorrect."}, {"id": "q163", "sec": "Summits & Meetings", "diff": "Moderate", "type": "single", "q": "The 3rd edition of 'Bharat Tex', India's flagship global textile event, was held at Bharat Mandapam from which dates in July 2026?", "options": ["14 to 17 June 2026", "1 to 4 July 2026", "14 to 17 July 2026", "10 to 13 July 2026", "20 to 23 July 2026"], "correct": 2, "expl": "Union Minister Giriraj Singh inaugurated the 3rd Bharat Tex, held 14-17 July 2026 at Bharat Mandapam, New Delhi."}, {"id": "q164", "sec": "Summits & Meetings", "diff": "Hard", "type": "single", "q": "CITI collaborated with EURATEX to establish a bilateral industry platform to support implementation of which trade agreement for textiles and apparel?", "options": ["The India-EU Free Trade Agreement, called TAD", "The India-ASEAN FTA", "The India-EFTA agreement", "The India-EU Free Trade Agreement (FTA)", "The India-UK CETA"], "correct": 3, "expl": "CITI and EURATEX established the EU-India Textile and Apparel Dialogue (TAD) to support implementation of the India-EU FTA for textiles/apparel."}, {"id": "q165", "sec": "Summits & Meetings", "diff": "Moderate", "type": "single", "q": "The 16th Conference of the Central Council of Health and Family Welfare launched the 'SUMAN Roadmap 2030'. What is its target for Maternal Mortality Ratio (MMR)?", "options": ["Reduce MMR to below 90 per one lakh live births by 2030", "Reduce MMR to below 70 per one lakh live births by 2025", "Reduce MMR to below 100 per one lakh live births by 2030", "Reduce MMR to below 50 per one lakh live births by 2030", "Reduce MMR to below 70 per one lakh live births by 2030"], "correct": 4, "expl": "SUMAN Roadmap 2030 aims to reduce MMR below 70 per one lakh live births by 2030, alongside lowering neonatal and infant mortality."}, {"id": "q166", "sec": "Summits & Meetings", "diff": "Hard", "type": "single", "q": "At the 29th National Conference on e-Governance (NCeG) in Jaipur, how many National Awards for e-Governance 2026 were presented, and in what categories of prize money?", "options": ["17 awards: 10 Gold (Rs 10 lakh each), 6 Silver (Rs 5 lakh each), and 1 Jury Award", "15 awards: 8 Gold, 6 Silver, 1 Jury Award", "17 awards: 10 Gold, 7 Silver", "17 awards: 8 Gold, 8 Silver, 1 Jury Award", "17 awards: 10 Gold (Rs 5 lakh each), 6 Silver (Rs 10 lakh each), 1 Jury Award"], "correct": 0, "expl": "NCeG 2026 presented 17 awards across seven categories: 10 Gold (Rs 10 lakh each), 6 Silver (Rs 5 lakh each), and one Jury Award."}, {"id": "q167", "sec": "Summits & Meetings", "diff": "Moderate", "type": "single", "q": "India hosted the 12th BRICS Labour and Employment Ministers' Meeting in Hyderabad under its BRICS Chairship 2026. What new initiative was launched at this meeting?", "options": ["BRICS Integrated Early Warning System", "BRICS CONNECT", "BRICS Network University", "BRICS Mission for Healthy Lifestyle", "BRICS Health Ministerial Declaration"], "correct": 1, "expl": "The meeting concluded with the BRICS Labour and Employment Ministers' Declaration and launch of BRICS CONNECT, an India-proposed initiative for technical cooperation."}, {"id": "q168", "sec": "Summits & Meetings", "diff": "Hard", "type": "single", "q": "The 16th BRICS Health Ministers' meeting concluded in Chandigarh under India's BRICS chairmanship. Which of the following was NOT among its key outcomes?", "options": ["Establishment of the BRICS Expert Working Group on Traditional, Complementary and Integrative Medicine", "Release of the BRICS Good Practices (GxP) White Paper", "Adoption of the SUMAN Roadmap 2030", "Release of the BRICS Compendium on Digital Health Architecture", "Launch of the BRICS Mission for Healthy Lifestyle"], "correct": 2, "expl": "SUMAN Roadmap 2030 was launched at the Central Council of Health and Family Welfare Conference, not the BRICS Health Ministers' meeting — the latter's outcomes included the GxP White Paper, Healthy Lifestyle Mission, TCIM Working Group, and Digital Health Compendium."}, {"id": "q169", "sec": "Summits & Meetings", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about BRICS-related meetings hosted by India in 2026:\nI. The 2nd BRICS Science Academies Forum was held at IIT Hyderabad.\nII. India hosted the 3rd BRICS Ministerial Meeting on Disaster Risk Reduction (DRR) in New Delhi.\nIII. The BRICS CCI Women Empowerment segment released a whitepaper titled 'Women in Innovation, Science & Entrepreneurship (WISE)'.\nIV. India hosted the BRICS Ministers of Interior Meeting in Mumbai.\nHow many of the above statements are correct?", "options": ["Only one", "All four", "Only two", "Only three", "None of the above are correct"], "correct": 3, "expl": "Statements I, II and III are correct. The BRICS Ministers of Interior Meeting was hosted in New Delhi (not Mumbai), making statement IV incorrect."}, {"id": "q170", "sec": "Rankings & Indices", "diff": "Moderate", "type": "single", "q": "India secured its highest-ever rank in the UNSDSN's Sustainable Development Report (SDR) 2026. What rank and score did it achieve, among how many countries?", "options": ["94th among 165 countries, with a score of 70.1", "90th among 167 countries, with a score of 68.3", "94th among 167 countries, with a score of 65.0", "99th among 167 countries, with a score of 68.3", "94th among 167 countries, with a score of 68.3"], "correct": 4, "expl": "India secured its highest-ever SDR rank of 94th among 167 countries (score 68.3), improving from 99th in 2025. Finland topped with 87.4."}, {"id": "q171", "sec": "Rankings & Indices", "diff": "Hard", "type": "single", "q": "As per the SDR 2026, which country had the lowest score among the bottom 5 countries?", "options": ["South Sudan, ranked 167th with a score of 41.6", "Chad, ranked 167th with a score of 46.0", "South Sudan, ranked 165th with a score of 41.6", "Central African Republic, ranked 167th with a score of 45.2", "Somalia, ranked 167th with a score of 41.6"], "correct" pot with visa-free access to 192 destinations, followed by Japan, South Korea and UAE (188), and Sweden (187)."}, {"id": "q181", "sec": "Rankings & Indices", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about global rankings/indices (July 2026) is NOT correct?", "options": ["As per the Global Liveability Index 2026, Mumbai topped among Indian cities, securing 118th spot globally", "As per the SDR 2026, India secured its highest-ever rank of 94th among 167 countries", "As per the GPI July 2026, India ranked 125th among 197 countries with a score of 45.1", "As per the IFI 2026, Gujarat topped the overall ranking among large states with a score of 56.6", "As per the Henley Passport Index, Singapore retained the world's most powerful passport title"], "correct": 0, "expl": "New Delhi (not Mumbai) topped among Indian cities on the Global Liveability Index 2026, at 120th globally (not 118th)."}, {"id": "q182", "sec": "Rankings & Indices", "diff": "Hard", "type": "multi", "q": "Consider the following statements on rankings released in July 2026:\nI. Finland topped the SDR 2026 with a score of 87.4, followed by Sweden and Denmark.\nII. The USA topped the World Intangible Investment Report 2026 ranking with USD 4.9 trillion (2025).\nIII. As per Brand Finance India 100, the total valuation of India's top 100 brands stood at USD 252.8 billion, up 7% year-on-year.\nIV. As per the Henley Passport Index, India's rank fell in the July 2026 edition compared to February 2026.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "All four", "Only three", "Only two", "Only one"], "correct": 1, "expl": "All four statements are correct as per the rankings data in the source document."}, {"id": "q183", "sec": "Reports", "diff": "Moderate", "type": "single", "q": "NITI Aayog's 'Strategic Roadmap for Making Ayurveda Global' was prepared in collaboration with which firm, and is structured on how many pillars?", "options": ["PwC; two pillars", "Deloitte; three pillars", "PricewaterhouseCoopers (PwC); three pillars (Availability, Acceptability, Propagation)", "EY; three pillars", "PwC; four pillars"], "correct": 2, "expl": "The roadmap, prepared with PwC, is structured on three pillars: Availability, Acceptability, and Propagation, aligned with Viksit Bharat@2047."}, {"id": "q184", "sec": "Reports", "diff": "Hard", "type": "single", "q": "As per the UDISE+ 2025-26 report, by what percentage did the number of teachers rise, reaching what total figure?", "options": ["10% rise, reaching 1,02,73,020 teachers", "8.3% rise, reaching 94,83,294 teachers", "6% rise, reaching 1,02,73,020 teachers", "8.3% rise, reaching 1,02,73,020 teachers", "8.3% rise, reaching 1,10,00,000 teachers"], "correct": 3, "expl": "UDISE+ 2025-26 reported an 8.3% rise in teacher numbers to 1,02,73,020, up from 94,83,294 in 2022-23."}, {"id": "q185", "sec": "Reports", "diff": "Moderate", "type": "single", "q": "As per UDISE+ 2025-26, the Gross Enrolment Ratio (GER) at Secondary level increased to what percentage, from what earlier figure?", "options": ["71.7%, from 70.0% in 2024-25", "71.7%, from 65.0% in 2024-25", "68.5%, from 71.7% in 2024-25", "75.0%, from 68.5% in 2024-25", "71.7%, from 68.5% in 2024-25"], "correct": 4, "expl": "Secondary GER increased to 71.7% from 68.5% in 2024-25, indicating improved access and participation."}, {"id": "q186", "sec": "Reports", "diff": "Hard", "type": "single", "q": "Under the PGI 2.0-S report for 2025-26, which State/UT became the first to enter the 'Uttam' range, scoring how much out of 1,000?", "options": ["Chandigarh, scoring 766 out of 1,000", "Chandigarh, scoring 700 out of 1,000", "Chandigarh, scoring 850 out of 1,000", "Kerala, scoring 800 out of 1,000", "Delhi, scoring 766 out of 1,000"], "correct": 0, "expl": "Chandigarh became the first State/UT in the PGI 2.0 series to enter the Uttam range, scoring 766/1,000 in 2025-26; Meghalaya recorded the lowest score."}, {"id": "q187", "sec": "Reports", "diff": "Moderate", "type": "single", "q": "How many districts secured the 'Uttam-2' grade in the PGI-D rankings for 2025-26, up from how many the previous year?", "options": ["16 districts, up from 19 in 2024-25", "19 districts, up from 16 in 2024-25", "19 districts, up from 14 in 2024-25", "22 districts, up from 16 in 2024-25", "19 districts, up from 18 in 2024-25"], "correct": 1, "expl": "A total of 19 districts secured Uttam-2 grade in 2025-26, up from 16 the previous year; no district attained the top 'Utkarsh' or 'Uttam-1' grades."}, {"id": "q188", "sec": "Reports", "diff": "Hard", "type": "single", "q": "As per the Ministry of Commerce and Industry's Q1 FY27 trade data, what were India's total exports and total imports during Q1 FY27 (April-June)?", "options": ["Exports: USD 250 billion; Imports: USD 270.15 billion", "Exports: USD 129.32 billion; Imports: USD 216.18 billion", "Exports: USD 232.73 billion; Imports: USD 270.15 billion", "Exports: USD 270.15 billion; Imports: USD 232.73 billion", "Exports: USD 232.73 billion; Imports: USD 216.18 billion"], "correct": 2, "expl": "Q1FY27 total exports stood at USD 232.73 billion and total imports at USD 270.15 billion."}, {"id": "q189", "sec": "Reports", "diff": "Moderate", "type": "single", "q": "As per the same Q1 FY27 trade data, merchandise exports rose to what value compared to Q1 FY26?", "options": ["USD 129.32 billion in Q1FY27, compared to USD 105 billion in Q1FY26", "USD 135 billion in Q1FY27, compared to USD 111.57 billion in Q1FY26", "USD 111.57 billion in Q1FY27, compared to USD 129.32 billion in Q1FY26", "USD 129.32 billion in Q1FY27, compared to USD 111.57 billion in Q1FY26", "USD 129.32 billion in Q1FY27, compared to USD 120 billion in Q1FY26"], "correct": 3, "expl": "Merchandise exports during Q1FY27 stood at USD 129.32 billion, up from USD 111.57 billion in Q1FY26."}, {"id": "q190", "sec": "Reports", "diff": "Hard", "type": "single", "q": "As per UNCTAD's '2026 World Investment Report', India emerged as the world's how many-eth largest recipient of FDI, with total inflows of how much in 2025?", "options": ["11th largest recipient, with inflows of USD 35 billion", "9th largest recipient, with inflows of USD 38.89 billion", "13th largest recipient, with inflows of USD 38.89 billion", "11th largest recipient, with inflows of USD 42 billion", "11th largest recipient, with inflows of USD 38.89 billion (a ~44% surge)"], "correct": 4, "expl": "India emerged as the 11th largest FDI recipient globally (up 2 places), with inflows surging ~44% to USD 38.89 billion in 2025."}, {"id": "q191", "sec": "Reports", "diff": "Moderate", "type": "single", "q": "As per UNCTAD's report, which three countries were the top FDI destinations in 2025, in order?", "options": ["USA (USD 277bn), Singapore (USD 151bn), Hong Kong SAR (USD 116bn)", "USA, Hong Kong SAR, Singapore", "USA, China, Singapore", "China, USA, Singapore", "USA, Singapore, China"], "correct": 0, "expl": "USA remained the top FDI destination (USD 277 billion), followed by Singapore (USD 151 billion) and Hong Kong SAR of China (USD 116 billion)."}, {"id": "q192", "sec": "Reports", "diff": "Hard", "type": "single", "q": "As per the PLFS Monthly Bulletin for June 2026, India's overall Unemployment Rate for ages 15+ remained unchanged at what level, and what were rural vs urban UR figures?", "options": ["5.5% overall; rural UR rose to 5.5%, urban UR fell to 6.0%", "5.5% overall; rural UR fell to 5.0%, urban UR rose to 6.6%", "5.5% overall; rural UR fell to 4.5%, urban UR rose to 6.6%", "5.0% overall; rural UR fell to 5.0%, urban UR rose to 6.6%", "5.5% overall; rural UR rose to 6.6%, urban UR fell to 5.0%"], "correct": 1, "expl": "India's overall UR (15+) remained at 5.5% in June 2026; rural UR fell from 5.1% to 5.0%, while urban UR rose from 6.4% to 6.6%."}, {"id": "q193", "sec": "Reports", "diff": "Moderate", "type": "single", "q": "As per the PLFS Monthly Bulletin June 2026, what was India's Labour Force Participation Rate (LFPR) for persons aged 15 and above?", "options": ["51.4%", "53.8%", "54.4%", "56.0%", "50.0%"], "correct": 2, "expl": "The LFPR for persons aged 15+ stood at 54.4% in June 2026, while the Worker Population Ratio (WPR) stood at 51.4%."}, {"id": "q194", "sec": "Reports", "diff": "Hard", "type": "single", "q": "The Ministry of Coal's 'AAROH' report documents the closure of how many scientifically closed coal mines, with a target to close how many more over the next 2-3 years?", "options": ["42 mines closed; target to close 100 more", "50 mines closed; target to close 147 more", "42 mines closed; target to close 200 more", "42 mines closed (33 in the last year alone); target to close 147 more", "42 mines closed (30 in the last year); target to close 150 more"], "correct": 3, "expl": "AAROH documents 42 scientifically closed coal mines (33 closed in the last year alone), with a target of 147 more mines over the next two to three years."}, {"id": "q195", "sec": "Reports", "diff": "Moderate", "type": "single", "q": "As per the WDMMA 2026 Global Air Power Rankings, the Indian Air Force retained which rank among national air forces globally, ahead of China's PLAAF for how many consecutive years?", "options": ["3rd rank; ahead of China for the 3rd consecutive year", "2nd rank; ahead of China for the 5th consecutive year", "3rd rank; ahead of China for the 4th consecutive year", "4th rank; ahead of China for the 5th consecutive year", "3rd rank; ahead of China for the 5th consecutive year"], "correct": 4, "expl": "IAF ranked 3rd globally (behind US and Russia), ahead of China's PLAAF for the 5th consecutive year since 2022."}, {"id": "q196", "sec": "Reports", "diff": "Hard", "type": "single", "q": "As per the MHA data presented in the Lok Sabha, which state/UT recorded the highest number of e-Zero FIRs against cyber financial fraud in 2025, and how many were registered?", "options": ["Delhi, with 6,115 FIRs", "Chandigarh, with 6,115 FIRs", "Delhi, with 5,500 FIRs", "Delhi, with 4,174 FIRs", "Uttarakhand, with 6,115 FIRs"], "correct": 0, "expl": "Delhi recorded the highest e-Zero FIRs (6,115, since May 2025), followed by UT Chandigarh (4,174, since November 2025)."}, {"id": "q197", "sec": "Reports", "diff": "Moderate", "type": "single", "q": "As per the BIMCO-ICS Seafarer Workforce Report 2026, India became the world's 2nd largest supplier of seafarers with how many professionals, accounting for what global share?", "options": ["311,936 professionals, 15% of the global workforce", "311,936 professionals, 12.16% of the global workforce", "311,936 professionals, 10% of the global workforce", "350,000 professionals, 12.16% of the global workforce", "300,000 professionals, 12.16% of the global workforce"], "correct": 1, "expl": "India's 311,936 seafarers account for 12.16% of the global workforce, ranking after the Philippines and ahead of China, Russia, and Indonesia."}, {"id": "q198", "sec": "Reports", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about reports released in July 2026 is NOT correct?", "options": ["As per UDISE+ 2025-26, Secondary GER increased to 71.7% from 68.5%", "As per WDMMA 2026, the Indian Air Force ranks 3rd among global air forces", "As per PLFS Monthly Bulletin June 2026, India's overall Unemployment Rate for ages 15+ rose to 6.0%", "As per UNCTAD's 2026 World Investment Report, India's FDI inflows surged ~44% to USD 38.89 billion in 2025", "As per the AAROH report, 42 coal mines have been scientifically closed to date"], "correct": 2, "expl": "India's overall Unemployment Rate for ages 15+ remained UNCHANGED at 5.5% (not risen to 6.0%) in June 2026, as per the PLFS Monthly Bulletin."}, {"id": "q199", "sec": "Reports", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about reports released in July 2026:\nI. India's maritime workforce improved from 5th position in 2015 (5.2% global share) to 2nd position in 2026.\nII. India contributes 140,718 officers (13.41% of global officers) to the global shipping industry.\nIII. The Digital Threat Report 2025-26 sets out a 24-month roadmap for financial institutions.\nIV. The AAROH report was developed by the Coal Controller Organisation (CCO).\nHow many of the above statements are correct?", "options": ["Only one", "Only two", "All four", "Only three", "None of the above are correct"], "correct": 3, "expl": "Statements I, II and IV are correct. The Digital Threat Report sets out an 18-month roadmap (not 24-month), making statement III incorrect."}, {"id": "q200", "sec": "Acquisitions & Mergers", "diff": "Moderate", "type": "single", "q": "The Aditya Birla Group-led consortium acquired 100% shareholding in Royal Challengers Sports Private Limited (owner of RCB) from United Spirits Limited for what deal value?", "options": ["Rs 16,660 crore (approximately USD 2 billion)", "Rs 16,660 crore (approximately USD 1.5 billion)", "Rs 20,000 crore (approximately USD 2.4 billion)", "Rs 12,000 crore (approximately USD 1.4 billion)", "Rs 16,660 crore (approximately USD 1.78 billion)"], "correct": 4, "expl": "CCI cleared the Aditya Birla-led consortium's all-cash acquisition of 100% of RCB's parent company for Rs 16,660 crore (~USD 1.78 billion), one of the largest sports franchise acquisitions globally."}, {"id": "q201", "sec": "Acquisitions & Mergers", "diff": "Hard", "type": "single", "q": "CCI approved DWS Group's acquisition of a 40% stake in Nippon Life India Alternative Investment Fund Management, valued at approximately what amount?", "options": ["Rs 733 crore", "Rs 500 crore", "Rs 850 crore", "Rs 1,000 crore", "Rs 733 crore, for a 51% stake"], "correct": 0, "expl": "Germany-based DWS Group's acquisition of a 40% stake in Nippon Life India AIF Management was valued at around Rs 733 crore."}, {"id": "q202", "sec": "Acquisitions & Mergers", "diff": "Moderate", "type": "single", "q": "BPCL acquired the remaining stake of Videocon Energy Brazil Limited in IBV Brazil Petroleo Limitada, increasing its total shareholding from what percentage to 100%, for what deal value?", "options": ["From 70% to 100%, for Rs 2,312 crore", "From 65.40% to 100%, for Rs 2,312 crore", "From 65.40% to 95%, for Rs 2,312 crore", "From 60% to 100%, for Rs 2,000 crore", "From 65.40% to 100%, for Rs 2,500 crore"], "correct": 1, "expl": "BPCL, through BPRL Ventures BV, acquired the remaining 34.6% stake, raising its shareholding in IBV Brazil Petroleo from 65.40% to 100% for Rs 2,312 crore."}, {"id": "q203", "sec": "Acquisitions & Mergers", "diff": "Hard", "type": "single", "q": "TPG, GIC, and ICICI Bank signed agreements to acquire Aseem Infrastructure Finance Limited (AIFL) from which entity?", "options": ["Life Insurance Corporation of India", "IL&FS", "National Investment and Infrastructure Fund (NIIF)", "State Bank of India", "IDBI Bank"], "correct": 2, "expl": "TPG (via TPG Rise Climate), GIC, and ICICI Bank agreed to acquire 100% of AIFL from NIIF and other shareholders for an undisclosed amount."}, {"id": "q204", "sec": "Acquisitions & Mergers", "diff": "Moderate", "type": "single", "q": "Aviva Plc became the first foreign insurer to fully own its Indian life insurance business by acquiring the remaining 26% stake from which JV partner, following what policy change?", "options": ["HDFC Life; following 100% FDI approval in May 2026", "ICICI Prudential; following 100% FDI approval in May 2026", "Dabur Invest Corp.; following 100% FDI approval in July 2026", "Dabur Invest Corp.; following GoI's approval of 100% FDI in insurance in May 2026", "Dabur Invest Corp.; following 74% FDI approval in 2024"], "correct": 3, "expl": "Aviva Plc's acquisition of the remaining 26% stake from Dabur Invest Corp. followed GoI's May 2026 move allowing 100% FDI in insurance."}, {"id": "q205", "sec": "Acquisitions & Mergers", "diff": "Hard", "type": "single", "q": "SBI sold a 1.42% stake in SBI Funds Management for Rs 1,655 crore ahead of its IPO, at what price per share, and what was the total IPO size?", "options": ["Rs 500 per share; Rs 10,000 crore IPO", "Rs 574 per share; Rs 10,000 crore IPO", "Rs 600 per share; Rs 11,700 crore IPO", "Rs 574 per share; Rs 12,500 crore IPO", "Rs 574 per share; Rs 11,700 crore IPO"], "correct": 4, "expl": "SBI sold the 1.42% pre-IPO stake at Rs 574/share (upper end of price band), ahead of the Rs 11,700 crore SBIFM IPO opening 14 July 2026."}, {"id": "q206", "sec": "Acquisitions & Mergers", "diff": "Moderate", "type": "single", "q": "RBI approved Areion Group's acquisition of Aviom India Housing Finance for what amount, as part of which resolution process?", "options": ["Rs 936 crore; insolvency resolution process", "Rs 1,200 crore; insolvency resolution process", "Rs 936 crore; voluntary liquidation process", "Rs 750 crore; insolvency resolution process", "Rs 936 crore; merger process"], "correct": 0, "expl": "RBI approved Areion Group's Rs 936 crore acquisition of fraud-hit Aviom India Housing Finance as part of its insolvency resolution."}, {"id": "q207", "sec": "Acquisitions & Mergers", "diff": "Hard", "type": "single", "q": "CCI approved the merger of Go Digit Infoworks Services with Go Digit General Insurance Ltd, marking the first merger of its kind under which legislation?", "options": ["The Insurance Regulatory Development Act, 2025", "Sabka Bima Sabki Raksha (Amendment of Insurance Laws) Act, 2025", "The Digit Insurance Consolidation Act, 2025", "The Competition (Amendment) Act, 2023", "IRDAI (Registration) Regulations, 2024"], "correct": 1, "expl": "This marked the first merger between an insurance company and a non-insurance holding company under the Sabka Bima Sabki Raksha Act, 2025."}, {"id": "q208", "sec": "Acquisitions & Mergers", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about acquisitions/mergers (July 2026) is NOT correct?", "options": ["Fairfax Financial Holdings emerged as preferred bidder to acquire a 60.72% stake in IDBI Bank", "State Bank of India announced acquiring NHB's 10% stake in RDCL", "BPCL signed a pact to acquire a 60% stake in the Tiki Tar–Shell India JV for Rs 150 crore", "IRDAI approved Patanjali Ayurved and DS Group's acquisition of Magma General Insurance", "Kotak Mahindra Bank announced acquiring Deutsche Bank's India retail and wealth business for Rs 281.7 crore"], "correct": 2, "expl": "BPCL's pact was to acquire a 40% stake (not 60%) in the Tiki Tar-Shell India JV, for Rs 85 crore (not Rs 150 crore)."}, {"id": "q209", "sec": "Acquisitions & Mergers", "diff": "Hard", "type": "multi", "q": "Consider the following statements about acquisitions/mergers in July 2026:\nI. CCI cleared DWS Group's 40% stake acquisition in Nippon Life India AIF Management.\nII. The Aditya Birla-led RCB buyout deal is worth approximately USD 1.78 billion.\nIII. TPG's acquisition of Aseem Infrastructure Finance will be made through 'TPG Rise Climate' in partnership with GIC and ICICI Bank.\nIV. SBI sold a 5% stake in SBI Funds Management ahead of its IPO.\nHow many of the above statements are correct?", "options": ["Only one", "Only two", "All four", "Only three", "None of the above are correct"], "correct": 3, "expl": "Statements I, II and III are correct. SBI sold a 1.42% stake (not 5%) in SBI Funds Management, making statement IV incorrect."}, {"id": "q210", "sec": "Defence", "diff": "Moderate", "type": "single", "q": "Exercise RIMPAC 2026, hosted by the US Navy at Hawaii, is the world's largest multinational maritime warfare exercise. What edition was it, and what was its theme?", "options": ["30th edition; theme 'Indo-Pacific Resolve'", "32nd edition; theme 'Partners: Integrated and Prepared'", "30th edition; theme 'United and Ready'", "28th edition; theme 'Partners: Integrated and Prepared'", "30th edition; theme 'Partners: Integrated and Prepared'"], "correct": 4, "expl": "RIMPAC 2026 (24 June-31 July 2026) was the 30th edition, themed 'Partners: Integrated and Prepared', hosted at Joint Base Pearl Harbor-Hickam, Hawaii."}, {"id": "q211", "sec": "Defence", "diff": "Hard", "type": "single", "q": "Exercise Pitch Black 2026, hosted by the RAAF at RAAF Base Darwin, is a biennial exercise. What edition number was it, and how many nations participated?", "options": ["45th edition; 20 nations", "45th edition; 25 nations", "45th edition; 18 nations", "43rd edition; 20 nations", "44th edition; 20 nations"], "correct": 0, "expl": "The 45th edition of Pitch Black (20 July-7 August 2026) brought together air forces from 20 nations including the USA, France, Germany, Spain, Japan and South Korea."}, {"id": "q212", "sec": "Defence", "diff": "Moderate", "type": "single", "q": "DRDO's Pinaka Long Range Guided Rocket (LRGR) was successfully flight-tested at Chandipur, Odisha, with a user-specified minimum range of how much?", "options": ["45 km", "60 km", "75 km", "60 km, tested at Balasore instead of Chandipur", "50 km"], "correct": 1, "expl": "The Pinaka LRGR flight test at ITR, Chandipur, Odisha had a user-specified minimum range of 60 km, coordinated by DRDO's ITR and PXE."}, {"id": "q213", "sec": "Defence", "diff": "Hard", "type": "single", "q": "During the CE20 cryogenic engine flight acceptance hot test for the LVM3-M7 mission, at what thrust levels and durations did the engine operate?", "options": ["19.5 tonnes for 60 seconds, and 22 tonnes for 30 seconds", "19.5 tonnes for 30 seconds, and 22 tonnes for 45 seconds", "19.5 tonnes thrust for 45 seconds, and 22 tonnes for 25 seconds", "20 tonnes for 45 seconds, and 22 tonnes for 25 seconds", "19.5 tonnes for 45 seconds, and 25 tonnes for 25 seconds"], "correct": 2, "expl": "The CE20 engine test at ISRO's IPRC, Mahendragiri verified performance at 19.5 t thrust for 45 seconds and 22 t for 25 seconds for the LVM3-M7 mission."}, {"id": "q214", "sec": "Defence", "diff": "Moderate", "type": "single", "q": "DRDO's 'Kusha' missile system, successfully tested off the coast of Odisha, is which type of missile?", "options": ["Air-to-Air Missile", "Short-Range Ballistic Missile", "Anti-tank Guided Missile", "Long-Range Surface-to-Air Missile (LR-SAM)", "Submarine-Launched Ballistic Missile"], "correct": 3, "expl": "Kusha, a Long-Range Surface-to-Air Missile, was tested from APJ Abdul Kalam Island, successfully intercepting a simulated high-speed aerial threat."}, {"id": "q215", "sec": "Defence", "diff": "Hard", "type": "single", "q": "The AEW&C Mk-II Programme, for which DRDO signed two industry contracts in July 2026, was approved by the Cabinet Committee on Security with what outlay, and using which aircraft platform?", "options": ["Rs 19,000 crore outlay; using Boeing 737 aircraft", "Rs 15,000 crore outlay; using Airbus A320 aircraft", "Rs 19,000 crore outlay; using Airbus A330 aircraft, induction planned 2028-29", "Rs 25,000 crore outlay; using Airbus A321 aircraft", "Rs 19,000 crore outlay; using Airbus A321 aircraft acquired from Air India"], "correct": 4, "expl": "Approved by CCS in July 2025 with Rs 19,000 crore outlay, the AEW&C Mk-II programme uses Airbus A321 aircraft acquired from Air India, with induction planned for 2032-2033."}, {"id": "q216", "sec": "Defence", "diff": "Moderate", "type": "single", "q": "INS Mahendragiri, commissioned into the Eastern Fleet in July 2026, is the sixth ship of which frigate class/project?", "options": ["Nilgiri-class (Project-17A)", "Shivalik-class (Project-17)", "Kamorta-class (Project-28)", "Kolkata-class (Project-15A)", "Visakhapatnam-class (Project-15B)"], "correct": 0, "expl": "INS Mahendragiri (F38) is the sixth Nilgiri-class (Project-17A) frigate, commissioned under the MAHASAGAR vision, with motto 'Mighty, Majestic, Matchless'."}, {"id": "q217", "sec": "Defence", "diff": "Hard", "type": "single", "q": "The USA delivered the 21st MH-60R Seahawk helicopter to the Indian Navy. What is the total number of helicopters India agreed to procure under the 2020 FMS agreement, at what total cost?", "options": ["24 helicopters at a cost of USD 3 billion", "24 helicopters at a cost of USD 2.6 billion", "24 helicopters at a cost of USD 2.1 billion", "30 helicopters at a cost of USD 2.6 billion", "20 helicopters at a cost of USD 2.6 billion"], "correct": 1, "expl": "India signed an FMS agreement with the USA in February 2020 to procure 24 MH-60R Seahawk helicopters for USD 2.6 billion; 21 have been delivered so far."}, {"id": "q218", "sec": "Defence", "diff": "Moderate", "type": "single", "q": "INS Malvan, commissioned at Naval Base Karwar, is the second of eight vessels of which class, becoming the first-ever naval vessel commissioned at Karwar?", "options": ["Nilgiri-class Frigate", "Kalvari-class Submarine", "Mahe-class Anti-Submarine Warfare Shallow Water Craft (ASW-SWC)", "Arihant-class Submarine", "Kamorta-class Corvette"], "correct": 2, "expl": "INS Malvan is the second of eight Mahe-class ASW-SWC vessels and the first naval vessel ever commissioned at Karwar, and the 7th warship inducted by the Navy in 2026."}, {"id": "q219", "sec": "Defence", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about defence developments (July 2026) is NOT correct?", "options": ["The Indian Navy commissioned INS Mahendragiri into the Eastern Fleet", "DAC granted Acceptance of Necessity worth approximately Rs 52,000 crore for Army, Navy and Air Force modernisation", "DRDO's GTRE developed India's first indigenous 350 kg thrust class Expendable Turbojet Engine", "General Dhiraj Seth assumed charge as the 33rd Chief of the Army Staff and unveiled the 'VIJAY' roadmap", "China achieved its first controlled recovery of a reusable Long March-10B rocket booster"], "correct": 3, "expl": "General Dhiraj Seth assumed charge as the 31st (not 33rd) Chief of the Army Staff."}, {"id": "q220", "sec": "Defence", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about defence tests and inductions (2026):\nI. ISRO's SOLVE test validated the solid motor for Gaganyaan Crew Module parachute trials.\nII. ISRO's IMAT-05 test validated the Main Parachute System for the Gaganyaan G1 mission at Sheopur, Madhya Pradesh.\nIII. Cochin Shipyard launched Machilipatnam, the seventh of eight Mahe-class ASW-SWC vessels.\nIV. The Indian Navy's 'Samudra Pradakshina' expedition was an all-men circumnavigation voyage.\nHow many of the above statements are correct?", "options": ["Only one", "Only two", "All four", "None of the above are correct", "Only three"], "correct": 4, "expl": "Statements I, II and III are correct. 'Samudra Pradakshina' was India's first Tri-Service ALL-WOMEN circumnavigation expedition, not all-men, making statement IV incorrect."}, {"id": "q221", "sec": "Science & Technology", "diff": "Moderate", "type": "single", "q": "Skyroot Aerospace's 'Vikram-1' made India the third country to achieve private orbital launch capability, after which two countries?", "options": ["The United States of America and China", "The United States and Russia", "China and Russia", "The United States and Japan", "Russia and Japan"], "correct": 0, "expl": "Vikram-1, under 'Mission Aagaman', made India the third country (after USA and China) to achieve private orbital launch capability, following the Indian Space Policy 2023."}, {"id": "q222", "sec": "Science & Technology", "diff": "Hard", "type": "single", "q": "Reliance Jio secured IN-SPACe technical approval to deploy a Low Earth Orbit satellite constellation of approximately how many satellites?", "options": ["1,500 satellites", "1,600 satellites", "1,600 satellites, in Geostationary orbit", "2,000 satellites", "1,200 satellites"], "correct": 1, "expl": "Jio's LEO constellation proposal of around 1,600 satellites was assessed in consultation with ISRO and the WPC wing of DoT."}, {"id": "q223", "sec": "Science & Technology", "diff": "Moderate", "type": "single", "q": "DGCA completed India's first satellite-based landing system (SLS) approach on a commercial jet using an IndiGo Airbus A320, utilizing which indigenous system?", "options": ["BharatSat", "NavIC", "GAGAN (GPS Aided GEO Augmented Navigation)", "IRNSS", "ISRO SBAS-2"], "correct": 2, "expl": "The demonstration at Udaipur used GAGAN, India's Satellite-Based Augmentation System developed jointly by ISRO and AAI, to execute an LPV approach."}, {"id": "q224", "sec": "Science & Technology", "diff": "Hard", "type": "single", "q": "DRDO's GTRE developed India's first indigenous 350 kg thrust class Expendable Turbojet Engine, with which company as the industry partner for manufacturing?", "options": ["Paninian India Private Limited", "Bharat Electronics Limited", "Hindustan Aeronautics Limited", "Azad Engineering, Hyderabad", "Adani Defence Systems"], "correct": 3, "expl": "Hyderabad-based Azad Engineering served as GTRE's industry partner for manufacturing/assembly of the 350 kg thrust class turbojet engine."}, {"id": "q225", "sec": "Science & Technology", "diff": "Moderate", "type": "single", "q": "China's Long March-10B rocket achieved a major milestone in July 2026. More than how many years after SpaceX's first orbital-class rocket recovery did this occur?", "options": ["More than 15 years (SpaceX first recovered in 2010)", "More than a decade (SpaceX first recovered in 2010)", "More than 8 years (SpaceX first recovered in 2017)", "More than 5 years (SpaceX first recovered in 2020)", "More than a decade (SpaceX first recovered an orbital-class booster in 2015)"], "correct": 4, "expl": "China's first controlled recovery of a reusable orbital-class booster came more than a decade after SpaceX became the first to do so, in 2015."}, {"id": "q226", "sec": "Science & Technology", "diff": "Hard", "type": "single", "q": "NASA's James Webb Space Telescope discovered a new exoplanet 'Beta Pictoris d'. How far is it from Earth, and what did this discovery make Beta Pictoris become?", "options": ["63 light-years away; only the second known planetary system with at least 3 directly imaged planets", "53 light-years away; the first known system with 3 directly imaged planets", "63 light-years away; the first known system with 4 directly imaged planets", "73 light-years away; the second known system with 3 directly imaged planets", "63 light-years away; the third known system with directly imaged planets"], "correct": 0, "expl": "Beta Pictoris d, discovered via JWST, is located 63 light-years from Earth; Beta Pictoris became only the second known planetary system with at least 3 directly imaged planets."}, {"id": "q227", "sec": "Science & Technology", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about Science & Technology developments (July 2026) is NOT correct?", "options": ["Reliance Jio secured IN-SPACe approval for a ~1,600-satellite LEO network", "Kerala-based HEX20 launched its second satellite KOYO aboard ISRO's PSLV rocket", "AgniKul Cosmos partnered with ICEYE to co-develop a SAR Earth-observation ecosystem", "Skyroot Aerospace successfully launched Vikram-1 from Satish Dhawan Space Centre, Sriharikota", "DGCA completed India's first SLS approach trial using the GAGAN system at Udaipur, Rajasthan"], "correct": 1, "expl": "HEX20's KOYO satellite was launched aboard SpaceX's Transporter-17 mission (not ISRO's PSLV) from Vandenberg Space Force Base, California, USA."}, {"id": "q228", "sec": "Science & Technology", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about satellite launches (July 2026):\nI. China launched the 'Haiyang (HY)-2E' oceanographic satellite to replace HY-2B.\nII. Orienspace's Gravity-1 Y4 rocket achieved its first long-range sea launch, carrying 9 satellites.\nIII. Vikram-1's mission also carried a handwritten postcard by PM Modi bearing the message 'Vande Mataram'.\nIV. HEX20's KOYO satellite carried 50 payloads for in-orbit technology validation.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "All four", "Only three", "Only one", "Only two"], "correct": 2, "expl": "Statements I, II and III are correct. KOYO carried 81 payloads (not 50), making statement IV incorrect."}, {"id": "q229", "sec": "Sports", "diff": "Moderate", "type": "single", "q": "Australia won the 2026 ICC Women's T20 World Cup by defeating England in the final at Lord's. What was the result, and how many titles has Australia now won?", "options": ["Australia won by 7 wickets for a record 8th title", "England won by 7 wickets, denying Australia a 7th title", "Australia won by 7 wickets for a record 6th title", "Australia won by 7 wickets, chasing 151 with 153/3 in 17.1 overs, for a record 7th title", "Australia won by 5 wickets for a record 6th title"], "correct": 3, "expl": "Australia defeated England by 7 wickets (153/3 in 17.1 overs chasing 151) to win a record-extending 7th Women's T20 World Cup title."}, {"id": "q230", "sec": "Sports", "diff": "Hard", "type": "single", "q": "Which Indian bowler finished as the Leading Wicket-Taker of the 2026 ICC Women's T20 World Cup, and how many wickets did she take?", "options": ["Deepti Sharma, with 14 wickets", "Renuka Singh, with 12 wickets", "Shree Charani, with 16 wickets", "Shree Charani, with 12 wickets", "Shree Charani, with 14 wickets"], "correct": 4, "expl": "Shree Charani took 14 wickets, becoming the tournament's Leading Wicket-Taker and setting the national record for most wickets by an Indian in a single edition."}, {"id": "q231", "sec": "Sports", "diff": "Moderate", "type": "single", "q": "Vaibhav Sooryavanshi became India's youngest international debutant at what age, breaking whose record?", "options": ["15 years and 99 days, breaking Sachin Tendulkar's 36-year-old record", "15 years and 239 days, breaking Sachin Tendulkar's record", "15 years and 99 days, breaking Shafali Verma's record", "14 years and 99 days, breaking Sachin Tendulkar's record", "15 years and 99 days, breaking Yashasvi Jaiswal's record"], "correct": 0, "expl": "Sooryavanshi debuted in T20I against England at 15 years and 99 days, breaking Tendulkar's 36-year-old record (16 years 205 days in Tests) as well as Shafali Verma's overall youngest-debutant record."}, {"id": "q232", "sec": "Sports", "diff": "Hard", "type": "single", "q": "Sourav Ganguly was inducted into the ICC Hall of Fame, becoming the how many-eth Indian overall and how many-eth Indian male cricketer inducted?", "options": ["10th Indian overall and 8th Indian male cricketer", "12th Indian overall and 10th Indian male cricketer", "12th Indian overall and 12th Indian male cricketer", "14th Indian overall and 10th Indian male cricketer", "12th Indian overall and 9th Indian male cricketer"], "correct": 1, "expl": "Ganguly's induction, on his 54th birthday, made him the 12th Indian overall and 10th Indian male cricketer in the ICC Hall of Fame."}, {"id": "q233", "sec": "Sports", "diff": "Moderate", "type": "single", "q": "In the first-ever Women's Test at Lord's, India defeated England by how many runs, marking India's largest win by runs in Women's Tests?", "options": ["270 runs, India's largest-ever win by runs in Women's Tests", "270 runs, India's third-largest win by runs", "270 runs, India's second-largest win by runs in Women's Tests (fourth-largest overall)", "250 runs, India's largest win by runs", "300 runs, India's second-largest win by runs"], "correct": 2, "expl": "India, led by Harmanpreet Kaur, won by 270 runs — India's second-largest win by runs in Women's Tests and fourth-largest overall."}, {"id": "q234", "sec": "Sports", "diff": "Hard", "type": "single", "q": "Anjum Chopra was inducted into the ICC Hall of Fame, becoming the 3rd Indian woman after which two cricketers?", "options": ["Diana Edulji and Mithali Raj", "Diana Edulji and Shantha Rangaswamy", "Neetu David and Jhulan Goswami", "Diana Edulji and Neetu David", "Mithali Raj and Jhulan Goswami"], "correct": 3, "expl": "Anjum Chopra became the 3rd Indian woman (after Diana Edulji and Neetu David) and 13th Indian overall in the ICC Ha
