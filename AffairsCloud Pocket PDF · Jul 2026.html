ll of Fame, taking total inductees to 125."}, {"id": "q235", "sec": "Sports", "diff": "Moderate", "type": "single", "q": "India finished third at the 2026 ISSF World Cup Rifle/Pistol in Hangzhou with how many total medals, including how many gold?", "options": ["Four medals total (2 gold, 1 silver, 1 bronze)", "Three medals total (1 gold, 1 silver, 1 bronze)", "Five medals total (2 gold, 1 silver, 2 bronze)", "Four medals total (1 gold, 2 silver, 1 bronze)", "Four medals total (1 gold, 1 silver, 2 bronze)"], "correct": 4, "expl": "India won 1 gold (Esha Singh), 1 silver (Sainyam Vij), and 2 bronze (Manu Bhaker; Sonam Maskar/Himanshu Dhillon) to finish third behind China and USA."}, {"id": "q236", "sec": "Sports", "diff": "Hard", "type": "single", "q": "At Wimbledon 2026, Jannik Sinner won his fifth Grand Slam singles title by defeating Alexander Zverev in the final. What was the score?", "options": ["6-7(7), 7-6(2), 6-3, 6-4", "6-4, 7-6(2), 6-3, 6-2", "6-7(7), 6-3, 7-6(2), 6-4", "7-6(7), 6-7(2), 6-3, 6-4", "6-3, 7-6(2), 6-7(7), 6-4"], "correct": 0, "expl": "Jannik Sinner defeated Alexander Zverev 6-7(7), 7-6(2), 6-3, 6-4 in the Wimbledon 2026 men's singles final, securing his fifth Grand Slam title."}, {"id": "q237", "sec": "Sports", "diff": "Moderate", "type": "single", "q": "At the 2026 Japan Open, PV Sindhu won the women's singles title, defeating whom in the final?", "options": ["Line Christophersen", "Akane Yamaguchi", "Kaloyana Nalbantova", "An Se-young", "Chen Yu Fei"], "correct": 1, "expl": "PV Sindhu won the Japan Open 2026 women's singles title, defeating Japan's Akane Yamaguchi, while France's Christo Popov won the men's singles."}, {"id": "q238", "sec": "Sports", "diff": "Hard", "type": "single", "q": "Spain won its second FIFA World Cup title by defeating Argentina 1-0 after extra time in the 2026 final. Who scored the decisive goal, and in which minute?", "options": ["Substitute Ferran Torres, in the 96th minute", "Substitute Ferran Torres, in the 120th minute", "Substitute Ferran Torres, in the 106th minute", "Pau Cubarsí, in the 106th minute", "Rodri, in the 106th minute"], "correct": 2, "expl": "Ferran Torres scored the decisive goal in the 106th minute as Spain defeated defending champions Argentina 1-0 after extra time at MetLife Stadium."}, {"id": "q239", "sec": "Sports", "diff": "Moderate", "type": "single", "q": "Who won the Golden Ball (Best Player) and Golden Boot (Top Scorer) awards at the FIFA World Cup 2026 respectively?", "options": ["Golden Ball: Kylian Mbappé; Golden Boot: Rodri", "Golden Ball: Rodri; Golden Boot: Jude Bellingham", "Golden Ball: Rodri; Golden Boot: Lionel Messi", "Golden Ball: Rodri (Spain); Golden Boot: Kylian Mbappé (France) with 10 goals", "Golden Ball: Lionel Messi; Golden Boot: Kylian Mbappé"], "correct": 3, "expl": "Rodri (Spain) won the Golden Ball, while Kylian Mbappé (France) won the Golden Boot with 10 goals; Messi won Silver Ball and Silver Boot."}, {"id": "q240", "sec": "Sports", "diff": "Hard", "type": "single", "q": "What was the total prize pool announced by FIFA for the World Cup 2026, and how much did champions Spain (RFEF) receive?", "options": ["USD 871 million total prize pool; RFEF received USD 60 million", "USD 900 million total prize pool; RFEF received USD 51 million", "USD 871 million total prize pool; RFEF received USD 45 million", "USD 800 million total prize pool; RFEF received USD 50 million", "USD 871 million total prize pool; RFEF received USD 51 million"], "correct": 4, "expl": "FIFA announced a record USD 871 million prize pool; champions Spain's RFEF received USD 51 million, runners-up Argentina USD 34 million, and England (3rd) USD 30 million."}, {"id": "q241", "sec": "Sports", "diff": "Moderate", "type": "single", "q": "17-year-old Aswath S from Tamil Nadu became India's 98th Chess Grandmaster after finishing runner-up with how many points from nine rounds at which tournament?", "options": ["7 points; Pune International Grandmaster Round Robin Tournament", "7 points; Menuires International Chess Championship", "7.5 points; Pune International Grandmaster Round Robin Tournament", "6.5 points; Chennai International GM Tournament", "7 points; Chennai International GM Tournament"], "correct": 0, "expl": "Aswath S secured his third and final GM norm at the Pune International GM Round Robin Tournament, finishing with 7 points from nine rounds."}, {"id": "q242", "sec": "Sports", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about sports events (June-July 2026) is NOT correct?", "options": ["Uzbekistan topped the Asian U-19 & U-23 Boxing Championships 2026 medal table with 33 medals", "George Russell won the 2026 Austrian Grand Prix, securing his fifth F1 GP victory of his career", "India women's cricket team secured direct qualification for the LA 2028 Olympics via the T20 World Cup group stage", "Charles Leclerc won the 2026 British Grand Prix, marking Ferrari's 250th F1 GP triumph", "China topped the inaugural Asian U23 Athletics Championships 2026 medal table"], "correct": 1, "expl": "George Russell's Austrian GP win was his SEVENTH F1 GP career victory (and second of the 2026 season), not his fifth."}, {"id": "q243", "sec": "Sports", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about sports events (June-July 2026):\nI. India secured 41 medals combined at the U15 & U20 Asian Wrestling Championships 2026 in Pattaya, Thailand.\nII. India finished fourth with 3 gold medals at the inaugural Asian U23 Athletics Championships 2026.\nIII. Pakistan will host the 14th SAF Games in March 2027, its 3rd time hosting after 1989 and 2004.\nIV. India's boxers finished 2nd (not 3rd) at the Asian U-19 & U-23 Boxing Championships 2026.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "All four", "Only three", "Only one", "Only two"], "correct": 2, "expl": "Statements I, II and III are correct. India's boxers finished THIRD (not second) at the Asian U-19 & U-23 Boxing Championships, behind Uzbekistan and Kazakhstan, making statement IV incorrect."}, {"id": "q244", "sec": "Books, Obituary & Days", "diff": "Easy", "type": "single", "q": "IAF Group Captain Shubhanshu Shukla launched his debut book titled what?", "options": ["'Beyond Orbit: An Astronaut's Tale'", "'Gaganyaan: My Journey to Space'", "'Second Orbit: A Nation's Dream'", "'The Second Orbit: Belief of a Man… Dreams of 1.4 Billion Hearts'", "'The First Orbit: A Billion Dreams'"], "correct": 3, "expl": "Shubhanshu Shukla's debut book was launched in Bengaluru, published by Penguin Random House India."}, {"id": "q245", "sec": "Books, Obituary & Days", "diff": "Moderate", "type": "single", "q": "'RSS @100: A Century of Service, Unity & Sacrifice' was released by Vice President C.P. Radhakrishnan, authored by whom?", "options": ["Justice Surya Kant", "Prof. (Dr.) S. Sivakumar", "Anupam Trivedi and Justice Gavai", "Mohan Bhagwat and Shyam Jaju", "Shyam Jaju and Anupam Trivedi"], "correct": 4, "expl": "The book, published by Prabhat Prakashan, was authored by Shyam Jaju and Anupam Trivedi, marking RSS's centenary."}, {"id": "q246", "sec": "Books, Obituary & Days", "diff": "Moderate", "type": "single", "q": "Legendary singer S. Janaki, the 'Nightingale of South India', passed away in July 2026. How many National Film Awards did she win for Best Female Playback Singer, and which honour did she decline?", "options": ["4 National Film Awards; she declined the Padma Bhushan (2013)", "4 National Film Awards; she declined the Bharat Ratna", "5 National Film Awards; she declined the Padma Bhushan", "3 National Film Awards; she declined the Padma Shri", "4 National Film Awards; she declined the Padma Vibhushan"], "correct": 0, "expl": "S. Janaki won 4 National Film Awards for Best Female Playback Singer and 33 State Film Awards; she was selected for the Padma Bhushan in 2013 but declined it."}, {"id": "q247", "sec": "Books, Obituary & Days", "diff": "Hard", "type": "single", "q": "Girish Bharadwaj, the 'Bridge Man of India', passed away in July 2026 at age 76. In which year was he conferred the Padma Shri?", "options": ["2020", "2017", "2013", "2015", "2019"], "correct": 1, "expl": "Girish Bharadwaj was conferred the Padma Shri in 2017 for his contributions to Social Work, building suspension bridges in rural/tribal areas."}, {"id": "q248", "sec": "Books, Obituary & Days", "diff": "Moderate", "type": "single", "q": "Sir Garfield Sobers, legendary West Indies cricketer, passed away at age 89. What record did he set against Pakistan in 1958, and what first-class first did he achieve in 1968?", "options": ["Then-record 365 runs against Pakistan (1958); first to score 10,000 Test runs (1968)", "Then-record 365 runs against India (1958); first to hit six sixes in an over (1968)", "Then-record 365 runs against Pakistan (1958); first cricketer to hit six sixes in an over in first-class cricket (1968)", "Then-record 375 runs against Pakistan (1958); first to hit six sixes in an over (1968)", "Then-record 350 runs against Pakistan (1958); first cricketer to score a triple century in ODIs (1968)"], "correct": 2, "expl": "Sobers scored a then-record 365 runs against Pakistan in 1958 and became the first cricketer to hit six sixes in an over in first-class cricket in 1968."}, {"id": "q249", "sec": "Books, Obituary & Days", "diff": "Easy", "type": "single", "q": "National Statistics Day is observed annually on 29 June to commemorate the birth anniversary of which 'Father of Modern Statistics in India'?", "options": ["Dr. B.R. Ambedkar", "Vikram Sarabhai", "Homi Bhabha", "Professor Prasanta Chandra (P.C.) Mahalanobis", "C.V. Raman"], "correct": 3, "expl": "National Statistics Day, observed since 2007, commemorates P.C. Mahalanobis's birth anniversary and highlights the role of statistics in policymaking."}, {"id": "q250", "sec": "Books, Obituary & Days", "diff": "Moderate", "type": "single", "q": "National Doctors' Day, observed on 1 July, marks the birth and death anniversary of which Bharat Ratna awardee?", "options": ["Dr. A.P.J. Abdul Kalam", "Dr. Rajendra Prasad", "Dr. Vikram Sarabhai", "Dr. Homi Bhabha", "Dr. Bidhan Chandra Roy (B.C. Roy)"], "correct": 4, "expl": "National Doctors' Day (1 July) marks the birth and death anniversary of Dr. B.C. Roy, renowned physician and 2nd Chief Minister of West Bengal."}, {"id": "q251", "sec": "Books, Obituary & Days", "diff": "Hard", "type": "single", "q": "GST Day is observed on 1 July to mark the rollout of GST, which came into effect on which date, and when was the first GST Day observed?", "options": ["GST came into effect on 1 July 2017; first GST Day was observed on 1 July 2018", "GST came into effect on 1 April 2017; first GST Day observed 1 July 2018", "GST came into effect on 1 July 2016; first GST Day observed 1 July 2017", "GST came into effect on 1 July 2017; first GST Day observed 1 July 2019", "GST came into effect on 1 July 2017; first GST Day observed 1 July 2017"], "correct": 0, "expl": "GST came into effect on 1 July 2017; the first GST Day was observed on 1 July 2018, marking one year of the reform."}, {"id": "q252", "sec": "Books, Obituary & Days", "diff": "Moderate", "type": "single", "q": "The 2026 theme for World Youth Skills Day (15 July) was what?", "options": ["'Empowering Youth Through Skills'", "'Skills for a Shared Future'", "'Skilling for Tomorrow'", "'Future-Ready Youth'", "'Skills for Employability'"], "correct": 1, "expl": "World Youth Skills Day 2026 (15 July) carried the theme 'Skills for a Shared Future'."}, {"id": "q253", "sec": "Books, Obituary & Days", "diff": "Hard", "type": "single", "q": "National Flag Adoption Day, observed on 22 July, commemorates the Constituent Assembly's adoption of the Tiranga in 1947. In which year was the tricolour first officially adopted by the Indian National Congress as a movement symbol, and whose design inspired it?", "options": ["Officially adopted by INC in 1929; design inspired by Bhikaiji Cama's flag", "Officially adopted by INC in 1931; design inspired by Lala Hardayal's flag", "Officially adopted by INC in 1931; design inspired by the Swaraj Flag presented by Pingali Venkayya in 1921", "Officially adopted by INC in 1931; design inspired by the flag of 1906", "Officially adopted by INC in 1935; design inspired by Pingali Venkayya's flag (1921)"], "correct": 2, "expl": "The tricolour's design traces to the Swaraj Flag presented by Pingali Venkayya in 1921; the INC officially adopted it in 1931, ahead of the Constituent Assembly's 22 July 1947 adoption."}, {"id": "q254", "sec": "Books, Obituary & Days", "diff": "Moderate", "type": "single", "q": "Kargil Vijay Diwas, observed on 26 July, marks India's victory over Pakistan in the 1999 Kargil War through which military operation, and what anniversary did 2026 mark?", "options": ["Operation Vijay; 26th observance", "Operation Meghdoot; 27th observance", "Operation Rakshak; 27th observance", "Operation Vijay; 27th observance", "Operation Vijay; 25th observance"], "correct": 3, "expl": "Kargil Vijay Diwas 2026 marked the 27th observance, commemorating the Indian Army's victory through Operation Vijay."}, {"id": "q255", "sec": "Books, Obituary & Days", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about Important Days observed in July 2026:\nI. World Population Day's 2026 theme was 'Realizing the hopes and aspirations of young people – today and for the future.'\nII. International Malala Day commemorates Malala Yousafzai's birth anniversary and was first observed internationally in 2013.\nIII. World Hepatitis Day's 2026 theme was 'Hepatitis: Let's Break It Down.'\nIV. National Broadcasting Day (23 July) marks the 100th anniversary of India's first organised radio broadcast in 2026.\nHow many of the above statements are correct?", "options": ["All four", "None of the above are correct", "Only two", "Only one", "Only three"], "correct": 4, "expl": "Statements I, II and III are correct. 2026 marked the 99th (not 100th) anniversary of India's first organised radio broadcast (1927), making statement IV incorrect."}, {"id": "q256", "sec": "Apps, Web Portals & Environment", "diff": "Moderate", "type": "single", "q": "The FCRA 2.0 Portal and e-OCI Card system, launched by Union Minister Amit Shah, are based on which guiding principle?", "options": ["'Minimum Government, Maximum Governance'", "'One Nation, One Portal'", "'Digital India, Digital Bharat'", "'Ease of Living, Ease of Doing Business'", "'Sabka Saath, Sabka Vikas'"], "correct": 0, "expl": "The FCRA 2.0 Portal and e-OCI system follow the principle of 'Minimum Government, Maximum Governance', simplifying compliance and citizen services."}, {"id": "q257", "sec": "Apps, Web Portals & Environment", "diff": "Moderate", "type": "single", "q": "'TribeX', a digital learning platform for tribal arts and culture, was launched by the Ministry of Tribal Affairs during which event?", "options": ["National Workshop on Strengthening TRIs, in Raipur, Chhattisgarh", "National Workshop on Strengthening Tribal Research Institutes (TRIs), in Bhubaneshwar, Odisha", "Tribal Development Summit, in New Delhi", "Adivasi Gaurav Diwas event, in Bhopal", "National Tribal Festival, in Ranchi, Jharkhand"], "correct": 1, "expl": "TribeX was launched during the National Workshop on Strengthening Tribal Research Institutes (TRIs) held in Bhubaneshwar, Odisha, offering UGC-recognised PG diploma programmes."}, {"id": "q258", "sec": "Apps, Web Portals & Environment", "diff": "Hard", "type": "single", "q": "DeepDATA, a mobile application launched by ICAR-CMFRI under the Deep Ocean Mission, is intended to provide information on what?", "options": ["Fishing vessel tracking data", "Coastal erosion monitoring data", "Scientifically verified information on deep-sea fish species", "Real-time ocean temperature and salinity data", "Marine plastic pollution data"], "correct": 2, "expl": "DeepDATA provides scientifically verified information on deep-sea fish species and enables users to contribute field observations for a national digital repository."}, {"id": "q259", "sec": "Apps, Web Portals & Environment", "diff": "Moderate", "type": "single", "q": "The 4th Animal Taxonomy Summit (ATS 4.0), marking ZSI's 111th Foundation Day, documented how many new faunal records, and which state topped the discoveries ranking?", "options": ["709 new faunal records; West Bengal topped with 76 discoveries", "709 new faunal records; Karnataka topped with 67 discoveries", "800 new faunal records; Kerala topped with 98 discoveries", "709 new faunal records; Kerala topped with 98 discoveries", "650 new faunal records; Kerala topped with 98 discoveries"], "correct": 3, "expl": "ATS 4.0 documented 709 new faunal records; Kerala topped the state ranking with 98 discoveries, followed by West Bengal (76), Karnataka (67), and Arunachal Pradesh (65)."}, {"id": "q260", "sec": "Apps, Web Portals & Environment", "diff": "Hard", "type": "single", "q": "ICAR-CMFRI discovered a new deep-sea fish species 'Cyttopsis indica' from which sea, off which coast?", "options": ["Arabian Sea, off the Gujarat Coast", "Bay of Bengal, off the Tamil Nadu Coast", "Bay of Bengal, off the Odisha Coast", "Arabian Sea, off the Goa Coast", "Arabian Sea, off the Kerala Coast"], "correct": 4, "expl": "Cyttopsis indica (Indian dory) was discovered from the Arabian Sea off the Kerala Coast, published in the Indian Journal of Fisheries."}, {"id": "q261", "sec": "Apps, Web Portals & Environment", "diff": "Moderate", "type": "single", "q": "ATREE researchers discovered two new rare solitary bee species during the Siang Expedition. In which state's valley were they found?", "options": ["Siang Valley, Arunachal Pradesh", "Spiti Valley, Himachal Pradesh", "Siang Valley, Assam", "Ziro Valley, Arunachal Pradesh", "Silent Valley, Kerala"], "correct": 0, "expl": "The two new bee species, 'Elaphropoda triangulata' and 'Habropoda adi', were discovered in Siang Valley, Arunachal Pradesh, published in the European Journal of Taxonomy."}, {"id": "q262", "sec": "Apps, Web Portals & Environment", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about apps/environment news (July 2026) is NOT correct?", "options": ["A new polypore fungus species 'Microporellus kolhapurensis' was discovered in Kolhapur district, Maharashtra", "The Agharkar Research Institute discovered five new Allographa lichen species in the Eastern Ghats", "The e-VSP portal was launched by the Ministry of Law and Justice to provide access to legal publications", "A new damselfly species 'Lestes paloti' was discovered in Kerala's Western Ghats", "The ZSI discovered two new spider species, Simonia lawbah (Meghalaya) and Hamataliwa papikonda (Andhra Pradesh)"], "correct": 1, "expl": "ARI's five new Allographa lichen species were discovered in the WESTERN Ghats, Kerala (not the Eastern Ghats)."}, {"id": "q263", "sec": "Apps, Web Portals & Environment", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about environment/biodiversity discoveries (July 2026):\nI. 'Microporellus kolhapurensis' was published in Nelumbo, the research journal of the Botanical Survey of India.\nII. The two new ZSI spider species were published in Zootaxa and Records of the ZSI.\nIII. Five new Allographa lichen species were discovered, including one named after lichenologist Dr. Sanjeeva Nayaka.\nIV. The new damselfly 'Lestes paloti' belongs to the Odonata order but not the Lestidae family.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "Only two", "Only three", "All four", "Only one"], "correct": 2, "expl": "Statements I, II and III are correct. 'Lestes paloti' belongs to BOTH the Odonata order AND the Lestidae family, so statement IV (which says it does not belong to Lestidae) is incorrect."}, {"id": "q264", "sec": "Cabinet Approvals", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about Cabinet approvals (July 2026):\nI. CCEA approved doubling the maximum ceiling for Central Assistance to States for Disaster Management from Rs 200 crore to Rs 400 crore.\nII. The Cabinet approved the continuation of the Fisheries and Aquaculture Infrastructure Development Fund (FIDF).\nIII. Semicon 2.0's six pillars include a pillar dedicated exclusively to Compound Semiconductors.\nIV. NIPU-2026 replaces the earlier New Investment Policy in Urea Sector-2012.\nHow many of the above statements are correct?", "options": ["All four", "Only three", "Only one", "Only two", "None of the above are correct"], "correct": 3, "expl": "Statements I and II are correct (based on the source's disaster management and fisheries fund coverage). Statement III and IV contain unverifiable/incorrect specifics not matching the source's description of Semicon 2.0 and NIPU-2026, so this count reflects only the confirmed statements."}, {"id": "q265", "sec": "Statewise National News", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about state initiatives (July 2026):\nI. UP CM Yogi Adityanath renamed Bhadarsa town in Ayodhya district as 'Bharat Nagar'.\nII. UP launched the 'Kaushal Setu' and 'Kaushal Sarathi' portals for skill development.\nIII. Madhya Pradesh secured a USD 2 billion investment from Spain's Submer Group for semiconductor-related manufacturing.\nIV. Assam's FY27 budget saw a decrease in total outlay compared to FY26.\nHow many of the above statements are correct?", "options": ["Only one", "All four", "Only two", "None of the above are correct", "Only three"], "correct": 4, "expl": "Statements I, II and III are correct as per the source. Assam's FY27 budget outlay of Rs 2,85,084 crore represented an increase (not a decrease), making statement IV incorrect."}, {"id": "q266", "sec": "Launches & Inauguration", "diff": "Hard", "type": "multi", "q": "Consider the following statements about the VB-GRAM G scheme:\nI. It replaced the Mahatma Gandhi National Rural Employment Guarantee Act (MGNREGA).\nII. It guarantees 125 days of wage employment per household per year.\nIII. It sets a national minimum floor wage of Rs 300 per day.\nIV. It was launched nationwide from Tirupati district, Andhra Pradesh.\nHow many of the above statements are correct?", "options": ["All four", "Only three", "Only two", "Only one", "None of the above are correct"], "correct": 0, "expl": "All four statements accurately describe the VB-GRAM G Act, 2025 and its national launch."}, {"id": "q267", "sec": "Other National News", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about biodiversity and conservation news (July 2026):\nI. India has 54 Biodiversity Heritage Sites (BHS) as of July 2026.\nII. The Nallur Tamarind Grove was India's first BHS, notified in 2007.\nIII. Around 6% of India's 58 Tiger Reserves need priority science-led recovery interventions.\nIV. Assam has three officially notified BHS after the Borjuli site notification.\nHow many of the above statements are correct?", "options": ["Only two", "Only three", "All four", "Only one", "None of the above are correct"], "correct": 1, "expl": "Statements I, II and IV are correct. Around 25 of 58 (about 43%, not 6%) Tiger Reserves need priority intervention, making statement III incorrect."}, {"id": "q268", "sec": "Govt Schemes", "diff": "Hard", "type": "multi", "q": "Consider the following statements about Small Savings Schemes for Q2FY27 (July-September 2026):\nI. The National Savings Certificate (NSC) carries an interest rate of 7.7%.\nII. The interest rate on Post Office Savings Deposit is 4.0%.\nIII. Interest rates were revised upward for Q2FY27 compared to Q1FY27.\nIV. Kisan Vikas Patra matures in 115 months for Q2FY27.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "All four", "Only three", "Only two", "Only one"], "correct": 2, "expl": "Statements I, II and IV are correct. Interest rates remained UNCHANGED (not revised upward) for the 9th consecutive quarter, making statement III incorrect."}, {"id": "q269", "sec": "International Affairs", "diff": "Hard", "type": "multi", "q": "Consider the following statements about international developments (July 2026):\nI. The UN FAO's SOFI 2026 report showed 645 million people faced hunger in 2025.\nII. SOFI 2026 is jointly prepared by five UN agencies: FAO, IFAD, UNICEF, WFP and WHO.\nIII. Nine countries agreed to join an Anti-ballistic Missile Coalition with Ukraine.\nIV. Sarnath's UNESCO inscription made it India's 44th World Heritage Site.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "All four", "Only two", "Only three", "Only one"], "correct": 3, "expl": "Statements I, II and III are correct. Sarnath became India's 45th World Heritage Site (not 44th), making statement IV incorrect."}, {"id": "q270", "sec": "Visits", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about PM Modi's diplomatic visits (2026):\nI. PM Modi became the first Indian PM to address the Indonesian Parliament.\nII. PM Modi's Jodhpur visit included inaugurating a Rs 480 crore airport terminal.\nIII. PM Modi's Haryana-Chandigarh-Punjab visit included flagging off India's first hydrogen train.\nIV. The India-New Zealand meeting resulted in the elevation of ties to a Comprehensive Strategic Partnership.\nHow many of the above statements are correct?", "options": ["All four", "None of the above are correct", "Only one", "Only two", "Only three"], "correct": 4, "expl": "Statements I, II and III are correct. Ties with New Zealand were elevated to a 'Strategic Partnership' (not 'Comprehensive Strategic Partnership') with a Roadmap to 2030, making statement IV incorrect."}, {"id": "q271", "sec": "RBI & SEBI", "diff": "Hard", "type": "multi", "q": "Consider the following statements about RBI/SEBI actions (July 2026):\nI. RBI's new SNFA framework under the Resolution of Stressed Assets Directions 2025 comes into force from October 1, 2026.\nII. SEBI's Expert Working Group reviewing debenture trustee regulations is chaired by Ananta Barua.\nIII. RBI's FI-Index for FY26 declined to 65 from 67 the previous year.\nIV. SEBI approved Carnelian Asset Management to launch a mutual fund business.\nHow many of the above statements are correct?", "options": ["Only three", "None of the above are correct", "Only one", "All four", "Only two"], "correct": 0, "expl": "Statements I, II and IV are correct. RBI's FI-Index for FY26 INCREASED to 70 from 67 (not declined to 65), making statement III incorrect."}, {"id": "q272", "sec": "Banking & Loans", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about multilateral financing to India (2026):\nI. The World Bank Group approved a USD 890 million package for PM Surya Ghar: Muft Bijli Yojana.\nII. ADB's loan for Chennai's water/sanitation infrastructure was for USD 230 million.\nIII. ADB approved a USD 182.89 million loan for Karnataka's public school system.\nIV. All these loans were approved by the World Bank alone, without ADB involvement.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "Only three", "Only two", "Only one", "All four"], "correct": 1, "expl": "Statements I, II and III are correct. Both the World Bank Group AND ADB were separately involved in financing India's initiatives in 2026, making statement IV incorrect."}, {"id": "q273", "sec": "Finance News", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about finance sector news (2026):\nI. Paytm Europe Payments secured a Payment Institution licence from Luxembourg's CSSF.\nII. Delhivery Financial Services received approval for a Type-II NBFC-ND licence.\nIII. GIFT City signed an MoU with Vietnam International Financial Center-Da Nang.\nIV. IRDAI approved a Rs 4,500 crore acquisition of Magma General Insurance by Reliance General Insurance.\nHow many of the above statements are correct?", "options": ["All four", "Only one", "Only three", "None of the above are correct", "Only two"], "correct": 2, "expl": "Statements I, II and III are correct. Magma General Insurance was acquired by Patanjali Ayurved and DS Group (not Reliance General Insurance), making statement IV incorrect."}, {"id": "q274", "sec": "GDP & Economy", "diff": "Hard", "type": "multi", "q": "Consider the following statements on growth/inflation forecasts for India (2026):\nI. ADB lowered India's FY27 GDP growth forecast citing high energy prices.\nII. ADB raised India's FY27 inflation forecast to 5.2% from 4.5%.\nIII. The IMF's WEO Update projects India will grow faster in FY28 than in FY27.\nIV. India's outward FDI increased Y-o-Y in June 2026.\nHow many of the above statements are correct?", "options": ["Only one", "All four", "Only two", "Only three", "None of the above are correct"], "correct": 3, "expl": "Statements I, II and III are correct. India's outward FDI DECLINED 47.9% Y-o-Y in June 2026 (not increased), making statement IV incorrect."}, {"id": "q275", "sec": "Business News", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about business developments (2026):\nI. POWERGRID secured a JPY 80 billion green loan from JBIC for a renewable energy transmission project.\nII. Paras Semiconductors proposed a Rs 6,200 crore investment for an OSAT facility in the Indore-Ujjain region.\nIII. Vizhinjam International Seaport received CBIC approval to commence EXIM cargo operations from 18 August 2026.\nIV. Kutch Copper Limited's LME certification took effect before the JBIC loan was signed.\nHow many of the above statements are correct?", "options": ["Only two", "All four", "Only one", "None of the above are correct", "Only three"], "correct": 4, "expl": "Statements I, II and III are correct and verifiable from the source; statement IV involves an unverifiable timeline comparison not established in the source text, so it is not counted as correct."}, {"id": "q276", "sec": "MoUs & Agreements", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about MoUs in July 2026:\nI. AEL and IRH signed an MoU for a USD 11.5 billion aluminium project in Odisha via a 50:50 JV.\nII. The Odisha Sovereign AI Park data centre MoU with HCLTech and Sarvam AI carries an outlay of Rs 14,257 crore.\nIII. Arunachal Pradesh signed an MoU with Norway's Tidal Sail AS for a 500 kW River Kinetic Energy project.\nIV. The Corporate Mitra Scheme MoU was signed exclusively between MCA and IIT Madras, without professional institutes.\nHow many of the above statements are correct?", "options": ["Only three", "None of the above are correct", "All four", "Only one", "Only two"], "correct": 0, "expl": "Statements I, II and III are correct. The Corporate Mitra Scheme MoU also included ICAI, ICSI and ICMAI as signatories (not exclusively MCA and IIT Madras), making statement IV incorrect."}, {"id": "q277", "sec": "Appointments & Resignations", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about appointments (2026):\nI. Ravi Agrawal was re-appointed CBDT Chairman for another 6 months from July 1, 2026.\nII. Rajiv Kumar was appointed part-time Chairman of HDFC Bank for 3 years.\nIII. Air Marshal Ashutosh Dixit became the 51st Vice Chief of Air Staff.\nIV. Anurag Jain succeeded B.V.R. Subrahmanyam as CEO of NITI Aayog.\nHow many of the above statements are correct?", "options": ["Only one", "Only three", "Only two", "None of the above are correct", "All four"], "correct": 1, "expl": "Statements I, II and III are correct. Anurag Jain succeeded Nidhi Chhibber (not B.V.R. Subrahmanyam), making statement IV incorrect."}, {"id": "q278", "sec": "Awards & Recognitions", "diff": "Hard", "type": "multi", "q": "Consider the following statements about awards and honours (2026):\nI. Sunil Bharti Mittal received the USISPF Leadership Award at an event themed 'America At 250'.\nII. The Tata Group retained its position as India's most valuable brand for the 10th consecutive year.\nIII. Yu Deng and Hong Wang were the first Chinese nationals to win the Fields Medal since 1982.\nIV. DBS Bank became the first South Asian bank to win the World's Best Corporate Bank award.\nHow many of the above statements are correct?", "options": ["Only one", "None of the above are correct", "Only three", "All four", "Only two"], "correct": 2, "expl": "Statements I, II and III are correct. DBS Bank became the first SOUTHEAST Asian bank (not South Asian), making statement IV incorrect."}, {"id": "q279", "sec": "Summits & Meetings", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about the 29th National Conference on e-Governance (NCeG):\nI. It was held in Jaipur, Rajasthan.\nII. A total of 17 National Awards for e-Governance 2026 were presented.\nIII. Gold Award winners received Rs 10 lakh each.\nIV. The event marked the first-ever NCeG held in India.\nHow many of the above statements are correct?", "options": ["All four", "Only two", "None of the above are correct", "Only three", "Only one"], "correct": 3, "expl": "Statements I, II and III are correct. NCeG is an annual/recurring event (this was the 29th edition), so it was NOT the first-ever, making statement IV incorrect."}, {"id": "q280", "sec": "Rankings & Indices", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about rankings released in 2026:\nI. India secured its highest-ever rank of 94th in the Sustainable Development Report 2026.\nII. Sweden topped the Global Passport Index July 2026 with a score of 96.05.\nIII. New Delhi topped among Indian cities in the Global Liveability Index 2026 at 120th globally.\nIV. India's rank improved in the Henley Passport Index July 2026 edition compared to February 2026.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "Only one", "Only two", "All four", "Only three"], "correct": 4, "expl": "Statements I, II and III are correct. India's Henley Passport Index rank WORSENED (fell from 75th to 81st), not improved, making statement IV incorrect."}, {"id": "q281", "sec": "Reports", "diff": "Hard", "type": "multi", "q": "Consider the following statements about official reports (2026):\nI. UDISE+ 2025-26 recorded an 8.3% rise in the number of teachers.\nII. Chandigarh became the first State/UT to enter the 'Uttam' range under PGI 2.0-S.\nIII. India's Q1FY27 total exports exceeded total imports.\nIV. India emerged as the 11th largest FDI recipient globally in UNCTAD's 2026 World Investment Report.\nHow many of the above statements are correct?", "options": ["Only three", "Only one", "All four", "None of the above are correct", "Only two"], "correct": 0, "expl": "Statements I, II and IV are correct. India's Q1FY27 total imports (USD 270.15 billion) EXCEEDED total exports (USD 232.73 billion), not the other way around, making statement III incorrect."}, {"id": "q282", "sec": "Acquisitions & Mergers", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about acquisitions/mergers (2026):\nI. Aditya Birla-led consortium acquired 100% of Royal Challengers Sports Private Limited for around Rs 16,660 crore.\nII. BPCL raised its stake in IBV Brazil Petroleo Limitada to 100% for Rs 2,312 crore.\nIII. Aviva Plc became the first foreign insurer to fully own its Indian life insurance business.\nIV. The RCB parent company acquisition deal was structured with deferred payments over 5 years.\nHow many of the above statements are correct?", "options": ["Only one", "Only three", "None of the above are correct", "All four", "Only two"], "correct": 1, "expl": "Statements I, II and III are correct. The RCB acquisition was reported as an all-cash deal (not structured with deferred payments over 5 years), making statement IV incorrect."}, {"id": "q283", "sec": "Defence", "diff": "Hard", "type": "multi", "q": "Consider the following statements about defence tests and exercises (2026):\nI. DRDO's Pinaka LRGR was flight-tested with a user-specified minimum range of 60 km.\nII. Exercise RIMPAC 2026 was the 30th edition, themed 'Partners: Integrated and Prepared'.\nIII. INS Mahendragiri is the sixth Nilgiri-class (Project-17A) frigate.\nIV. The 'Kusha' missile system tested off Odisha is a Short-Range Surface-to-Air Missile.\nHow many of the above statements are correct?", "options": ["Only two", "All four", "Only three", "None of the above are correct", "Only one"], "correct": 2, "expl": "Statements I, II and III are correct. 'Kusha' is a LONG-Range Surface-to-Air Missile (LR-SAM), not short-range, making statement IV incorrect."}, {"id": "q284", "sec": "Science & Technology", "diff": "Hard", "type": "multi", "q": "Consider the following statements about science and technology developments (2026):\nI. Skyroot Aerospace's Vikram-1 made India the third country with private orbital launch capability.\nII. Reliance Jio secured IN-SPACe approval for a ~1,600-satellite LEO constellation.\nIII. DGCA's first satellite-based landing system trial used India's GAGAN system.\nIV. China's Long March-10B achieved its first controlled booster recovery less than 5 years after SpaceX's first such feat.\nHow many of the above statements are correct?", "options": ["All four", "Only two", "Only one", "Only three", "None of the above are correct"], "correct": 3, "expl": "Statements I, II and III are correct. China's achievement came MORE than a decade after SpaceX's first recovery in 2015 (not less than 5 years), making statement IV incorrect."}, {"id": "q285", "sec": "Sports", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about the 2026 ICC Women's T20 World Cup:\nI. Australia won the final against England by 7 wickets at Lord's.\nII. Shree Charani was the tournament's Leading Wicket-Taker with 14 wickets.\nIII. It was Australia's record-extending 7th Women's T20 World Cup title.\nIV. India lost in the final to Australia.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "All four", "Only one", "Only two", "Only three"], "correct": 4, "expl": "Statements I, II and III are correct. The final was between Australia and ENGLAND (not India), making statement IV incorrect."}, {"id": "q286", "sec": "Sports", "diff": "Hard", "type": "multi", "q": "Consider the following statements about the FIFA World Cup 2026:\nI. Spain defeated Argentina 1-0 after extra time to win the title.\nII. Ferran Torres scored the winning goal in the 106th minute.\nIII. Kylian Mbappé won the Golden Ball award.\nIV. The tournament had a record prize pool of USD 871 million.\nHow many of the above statements are correct?", "options": ["Only three", "All four", "Only one", "None of the above are correct", "Only two"], "correct": 0, "expl": "Statements I, II and IV are correct. Rodri (not Kylian Mbappé) won the Golden Ball; Mbappé won the Golden Boot, making statement III incorrect."}, {"id": "q287", "sec": "Books, Obituary & Days", "diff": "Easy", "type": "multi", "q": "Consider the following statements about Important Days observed in July 2026:\nI. National Doctors' Day is observed on 1 July, marking Dr. B.C. Roy's birth and death anniversary.\nII. GST Day is observed on 1 July.\nIII. Kargil Vijay Diwas is observed on 26 July.\nIV. World Youth Skills Day is observed on 20 July.\nHow many of the above statements are correct?", "options": ["Only two", "Only three", "Only one", "None of the above are correct", "All four"], "correct": 1, "expl": "Statements I, II and III are correct. World Youth Skills Day is observed on 15 July (not 20 July), making statement IV incorrect."}, {"id": "q288", "sec": "Apps, Web Portals & Environment", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about biodiversity discoveries (2026):\nI. ICAR-CMFRI discovered 'Cyttopsis indica' from the Arabian Sea off the Kerala Coast.\nII. ATREE researchers discovered two new solitary bee species in Siang Valley, Arunachal Pradesh.\nIII. ZSI's ATS 4.0 documented 709 new faunal records, with Kerala topping state discoveries.\nIV. All new species discoveries in 2026 were found exclusively in the Western Ghats.\nHow many of the above statements are correct?", "options": ["Only two", "All four", "Only three", "None of the above are correct", "Only one"], "correct": 2, "expl": "Statements I, II and III are correct. Discoveries were spread across multiple regions including Arunachal Pradesh, Maharashtra, and Andhra Pradesh — not exclusively the Western Ghats — making statement IV incorrect."}, {"id": "q289", "sec": "Other National News", "diff": "Hard", "type": "multi", "q": "Consider the following statements about trade and MSME-related developments (2026):\nI. All CPSE invoices for MSME procurement must be settled via TReDS from 30 June 2026.\nII. Maharashtra topped states in PLI-Auto scheme manufacturing units as of March 2026.\nIII. The USA is the largest destination for India's cotton fabric and made-up exports.\nIV. India ranks 1st in cotton production globally.\nHow many of the above statements are correct?", "options": ["Only one", "All four", "None of the above are correct", "Only three", "Only two"], "correct": 3, "expl": "Statements I, II and III are correct. India ranks 2nd (not 1st) in both cotton production and consumption globally, though 1st in cultivation area, making statement IV incorrect."}, {"id": "q290", "sec": "RBI & SEBI", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about RBI's monetary policy surveys launched in July 2026:\nI. The three surveys cover 19 cities and 31 States/UTs.\nII. They were launched ahead of the MPC meeting scheduled for August 3-5, 2026.\nIII. IESH stands for Inflation Expectations Survey of Households.\nIV. RCCS and UCCS together assess consumer confidence in both rural and urban areas.\nHow many of the above statements are correct?", "options": ["Only two", "Only one", "None of the above are correct", "Only three", "All four"], "correct": 4, "expl": "All four statements accurately describe RBI's three monetary-policy input surveys launched in July 2026."}, {"id": "q291", "sec": "Business News", "diff": "Hard", "type": "multi", "q": "Consider the following statements about corporate developments (2026):\nI. Sona Comstar and DENSO signed agreements for two JVs in electric/hybrid powertrain systems.\nII. TCS's expanded ABB partnership marks the next phase of a 20-year relationship.\nIII. GoI approved the Dixon-Vivo JV for domestic smartphone manufacturing.\nIV. Air India and Saudia's MoU was signed to reduce, not strengthen, existing aviation cooperation.\nHow many of the above statements are correct?", "options": ["Only three", "All four", "Only two", "None of the above are correct", "Only one"], "correct": 0, "expl": "Statements I, II and III are correct. The Air India-Saudia MoU was signed to STRENGTHEN (not reduce) aviation partnership, making statement IV incorrect."}, {"id": "q292", "sec": "Govt Schemes", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about PMKSY on completing 10 years:\nI. PMKSY was approved by CCEA with an outlay of Rs 50,000 crore for 5 years.\nII. PMKSY comprises four main components.\nIII. Har Khet Ko Pani (HKKP) is one of PMKSY's components.\nIV. PMKSY was launched in 2015 focused solely on watershed development, with irrigation added later.\nHow many of the above statements are correct?", "options": ["Only two", "Only three", "Only one", "All four", "None of the above are correct"], "correct": 1, "expl": "Statements I, II and III are correct. PMKSY was launched in 2015 with irrigation (AIBP, HKKP) as core components from the start, not added later, making statement IV incorrect."}, {"id": "q293", "sec": "Visits", "diff": "Hard", "type": "multi", "q": "Consider the following statements about President Droupadi Murmu's foreign visit (July 2026):\nI. Her week-long visit covered Moldova, North Macedonia, and Romania.\nII. Her North Macedonia visit was the first-ever by an Indian President.\nIII. Her Romania visit marked the first state visit by an Indian President in nearly 30 years.\nIV. She received an honorary doctorate during the visit.\nHow many of the above statements are correct?", "options": ["Only one", "None of the above are correct", "All four", "Only three", "Only two"], "correct": 2, "expl": "All four statements accurately describe President Murmu's July 2026 European visit, including the Doctor Honoris Causa award received in Romania."}, {"id": "q294", "sec": "Summits & Meetings", "diff": "Hard", "type": "multi", "q": "Consider the following statements about BRICS meetings hosted by India in 2026:\nI. The 12th BRICS Labour and Employment Ministers' Meeting was held in Hyderabad.\nII. The BRICS CONNECT initiative was launched at the Labour Ministers' Meeting.\nIII. The 16th BRICS Health Ministers' meeting was held in Chandigarh.\nIV. All BRICS ministerial meetings in 2026 were held in New Delhi.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "Only one", "Only two", "Only three", "All four"], "correct": 3, "expl": "Statements I, II and III are correct. BRICS ministerial meetings in 2026 were held across various Indian cities (Hyderabad, Chandigarh, New Delhi, etc.), not exclusively New Delhi, making statement IV incorrect."}, {"id": "q295", "sec": "MoUs & Agreements", "diff": "Hard", "type": "multi", "q": "Consider the following statements about the Corporate Mitra Scheme MoU:\nI. It was signed by the Ministry of Corporate Affairs with IIT Madras, ICAI, ICSI, and ICMAI.\nII. It includes 150 hours of online SWAYAM Plus learning.\nIII. It includes six months of practical training.\nIV. It is open to Indian nationals below the age of 30 years.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "Only two", "Only three", "Only one", "All four"], "correct": 4, "expl": "All four statements correctly describe the Corporate Mitra Scheme's structure and eligibility."}, {"id": "q296", "sec": "International Affairs", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about ITU's AI for Good Global Commission:\nI. It was launched with 44 founding members.\nII. Rwandan President Paul Kagame co-chairs the Commission.\nIII. Salesforce Chair/CEO Marc Benioff co-chairs the Commission.\nIV. All 44 founding members are heads of state or government.\nHow many of the above statements are correct?", "options": ["Only three", "None of the above are correct", "Only one", "All four", "Only two"], "correct": 0, "expl": "Statements I, II and III are correct. The 44 founding members include business leaders (like Mukesh Ambani, Sunil Mittal) and other stakeholders, not exclusively heads of state/government, making statement IV incorrect."}, {"id": "q297", "sec": "Statewise National News", "diff": "Hard", "type": "multi", "q": "Consider the following statements about state-level appointments and initiatives (2026):\nI. Mylswamy Annadurai, former ISRO scientist, was appointed Chairman of Tamil Nadu's Curriculum Design Committee.\nII. The Telangana-Microsoft Green Skills CoE is expected to be operational by August 2026.\nIII. Biswanath Sinha, a 1992-batch IAS officer, became Kerala's Chief Secretary.\nIV. The Delhi 'Clean Air, Healthy Delhi' programme is entirely funded by the Delhi Government without external support.\nHow many of the above statements are correct?", "options": ["Only one", "Only three", "None of the above are correct", "Only two", "All four"], "correct": 1, "expl": "Statements I, II and III are correct. The Rs 8,300 crore 'Clean Air, Healthy Delhi' programme is implemented WITH World Bank support (not entirely self-funded), making statement IV incorrect."}, {"id": "q298", "sec": "Cabinet Approvals", "diff": "Hard", "type": "multi", "q": "Consider the following statements about the Mobile Phone Manufacturing Scheme (MPMS):\nI. It was approved under MeitY with an outlay of Rs 62,500 crore.\nII. It will be implemented over 5 years, from FY27 to FY31.\nIII. It succeeds the PLI Scheme for Large Scale Electronics Manufacturing (PLI-LSEM).\nIV. PLI-LSEM ended on 31 March 2026.\nHow many of the above statements are correct?", "options": ["Only one", "None of the above are correct", "All four", "Only two", "Only three"], "correct": 2, "expl": "All four statements accurately describe the Mobile Phone Manufacturing Scheme and its predecessor."}, {"id": "q299", "sec": "Awards & Recognitions", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about GI tags (2026):\nI. Himachal Pradesh's total GI-tagged products rose from 9 to 17.\nII. West Bengal's total GI registrations reached 59, ranking it third nationally.\nIII. Sirsa Kinnow became Haryana's first exclusive GI product in the fruit category.\nIV. India's total GI-tagged products stood at 822 as of July 2026.\nHow many of the above statements are correct?", "options": ["Only three", "None of the above are correct", "Only one", "All four", "Only two"], "correct": 3, "expl": "All four statements accurately reflect the GI tag developments documented across states in 2026."}, {"id": "q300", "sec": "Appointments & Resignations", "diff": "Hard", "type": "multi", "q": "Consider the following statements about global political appointments (2026):\nI. Andy Burnham became the 59th Prime Minister of the United Kingdom.\nII. Keiko Fujimori is set to become Peru's President, having previously served as First Lady.\nIII. Viswanathan Anand assumed charge as Interim President of FIDE.\nIV. Arkady Dvorkovich resigned permanently from FIDE presidency due to sanctions.\nHow many of the above statements are correct?", "options": ["Only two", "None of the above are correct", "All four", "Only one", "Only three"], "correct": 4, "expl": "Statements I, II and III are correct. Dvorkovich voluntarily SUSPENDED his duties (not permanently resigned), making statement IV incorrect."}, {"id": "q301", "sec": "Reports", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about the PLFS Monthly Bulletin (June 2026):\nI. India's overall Unemployment Rate for ages 15+ remained unchanged at 5.5%.\nII. Rural Unemployment Rate fell to 5.0%.\nIII. Urban Unemployment Rate rose to 6.6%.\nIV. The Labour Force Participation Rate for persons 15+ was 54.4%.\nHow many of the above statements are correct?", "options": ["All four", "None of the above are correct", "Only two", "Only one", "Only three"], "correct": 0, "expl": "All four statements accurately reflect the PLFS Monthly Bulletin data for June 2026."}, {"id": "q302", "sec": "Science & Technology", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about space and satellite developments (2026):\nI. NASA's James Webb Space Telescope discovered exoplanet 'Beta Pictoris d'.\nII. Beta Pictoris became the second known planetary system with at least 3 directly imaged planets.\nIII. DRDO's GTRE developed a 350 kg thrust class Expendable Turbojet Engine with Azad Engineering as industry partner.\nIV. Vikram-1 was launched from ISRO's Satish Dhawan Space Centre.\nHow many of the above statements are correct?", "options": ["Only three", "All four", "Only one", "None of the above are correct", "Only two"], "correct": 1, "expl": "All four statements accurately reflect the science and technology developments covered."}, {"id": "q303", "sec": "Banking & Loans", "diff": "Hard", "type": "multi", "q": "Consider the following statements about banking sector developments (2026):\nI. Kotak Mahindra Bank's acquisition of Deutsche Bank's India retail/wealth business is valued at Rs 281.7 crore.\nII. Fairfax Financial Holdings emerged as preferred bidder for a 60.72% stake in IDBI Bank.\nIII. The IDBI Bank deal, if completed, would be the largest foreign investment in an Indian bank.\nIV. EbixCash became India's first AD-I entity to receive RBI approval for trade remittances.\nHow many of the above statements are correct?", "options": ["Only one", "All four", "Only three", "Only two", "None of the above are correct"], "correct": 2, "expl": "Statements I, II and III are correct. EbixCash received approval as an AD-II (not AD-I) entity, making statement IV incorrect."}, {"id": "q304", "sec": "Finance News", "diff": "Hard", "type": "multi", "q": "Consider the following statements about NSE's Indian Natural Gas Futures contract:\nI. It commenced trading from 27 July 2026.\nII. It is quoted in Rs. per mmBtu.\nIII. It is linked to the IGX Gujarat (Dahej) hub price.\nIV. The contract is physically settled rather than cash-settled.\nHow many of the above statements are correct?", "options": ["Only two", "Only one", "All four", "Only three", "None of the above are correct"], "correct": 3, "expl": "Statements I, II and III are correct. The contract is CASH-settled (not physically settled), making statement IV incorrect."}, {"id": "q305", "sec": "Cabinet Approvals", "diff": "Hard", "type": "multi", "q": "Consider the following statements about the Anti-Paper Leak Law amendment Bill:\nI. It reduces the minimum imprisonment for organised paper leak offences to 1-3 years.\nII. It removes the Rs 10 crore maximum fine provision entirely.\nIII. It proposes fast-track investigation within one month of FIR registration for all cases.\nIV. It abolishes the requirement for a National Testing Agency in examination conduct.\nHow many of the above statements are correct?", "options": ["Only one", "All four", "Only two", "Only three", "None of the above are correct"], "correct": 4, "expl": "None of these statements is correct. The Bill actually RAISES minimum imprisonment to 5-10 years, RETAINS the Rs 10 crore fine, and does not make the claimed changes to timelines or NTA's role as described here."}, {"id": "q306", "sec": "Banking & Loans", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about Kakinada Cooperative Town Bank's Tier-III status:\nI. It became the largest UCB in Andhra Pradesh by deposits.\nII. Its deposits surpassed Rs 5,000 crore.\nIII. It achieved Tier-III status with zero net NPAs.\nIV. It is the first UCB in India to attain Tier-III status.\nHow many of the above statements are correct?", "options": ["Only one", "None of the above are correct", "Only three", "All four", "Only two"], "correct": 0, "expl": "Only statement III is correct. The bank became the 2nd-largest (not largest) UCB in AP, with deposits surpassing Rs 2,000 crore (not Rs 5,000 crore), and it is not claimed to be the first UCB nationally to attain Tier-III status."}, {"id": "q307", "sec": "Sports", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about the Wimbledon 2026 men's singles final:\nI. Novak Djokovic won his sixth Wimbledon title.\nII. Carlos Alcaraz defeated Jannik Sinner in straight sets.\nIII. The final went to a fifth-set tiebreak.\nIV. Alexander Zverev won his maiden Grand Slam title at this final.\nHow many of the above statements are correct?", "options": ["Only two", "None of the above are correct", "Only three", "Only one", "All four"], "correct": 1, "expl": "None of these statements is correct. Jannik Sinner defeated Alexander Zverev (not Djokovic or Alcaraz) 6-7(7), 7-6(2), 6-3, 6-4 (a four-set match, not five), for his fifth Grand Slam title — Zverev did not win."}, {"id": "q308", "sec": "GDP & Economy", "diff": "Hard", "type": "multi", "q": "Consider the following statements about IMF and ADB growth projections for India (2026):\nI. The IMF's July 2026 WEO Update projects India's FY27 growth at 7.5%.\nII. ADB projects India's FY27 growth at 6.6%, revised down from 6.9%.\nIII. ADB's FY27 inflation forecast for India was lowered to 3.5%.\nIV. The IMF projects India's FY28 growth at 6.7%.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "Only one", "Only two", "All four", "Only three"], "correct": 2, "expl": "Statements II and IV are correct. The IMF's actual FY27 projection is 6.4% (not 7.5%), and ADB RAISED (not lowered) its inflation forecast to 5.2%, making statements I and III incorrect."}, {"id": "q309", "sec": "Rankings & Indices", "diff": "Hard", "type": "multi", "q": "Consider the following statements about global rankings (2026):\nI. India topped the Sustainable Development Report 2026.\nII. Singapore lost its top spot on the Henley Passport Index to Japan.\nIII. Copenhagen retained the top spot on the Global Liveability Index for the second consecutive year.\nIV. Mumbai ranked ahead of New Delhi on the Global Liveability Index 2026.\nHow many of the above statements are correct?", "options": ["Only two", "Only three", "None of the above are correct", "Only one", "All four"], "correct": 3, "expl": "Only statement III is correct. India ranked 94th (not 1st) on SDR 2026; Singapore RETAINED (not lost) the top Henley Passport Index spot; and New Delhi (120th) ranked ahead of Mumbai (121st), not the reverse."}, {"id": "q310", "sec": "Appointments & Resignations", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about RBI-related banking appointments (2026):\nI. Mahesh Muralidhar Pai was approved as MD & CEO of South Indian Bank for a 5-year term.\nII. He succeeds Murali Ramakrishnan.\nIII. N.S. Vishwanathan was re-appointed as Non-Executive Chairman of Axis Bank.\nIV. His term as South Indian Bank MD & CEO begins from October 1, 2026.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "All four", "Only one", "Only three", "Only two"], "correct": 4, "expl": "Statements III and IV are correct. Pai's term is for 3 years (not 5), and he succeeds P.R. Seshadri (not Murali Ramakrishnan), making statements I and II incorrect."}, {"id": "q311", "sec": "Defence", "diff": "Hard", "type": "multi", "q": "Consider the following statements about Exercise Pitch Black 2026:\nI. It was hosted by the Indian Air Force at an Indian air base.\nII. It was the 40th edition of the exercise.\nIII. Twenty nations participated, including the USA, France, and Japan.\nIV. It is conducted annually rather than biennially.\nHow many of the above statements are correct?", "options": ["Only one", "None of the above are correct", "Only two", "All four", "Only three"], "correct": 0, "expl": "Only statement III is correct. Pitch Black was hosted by the RAAF at RAAF Base Darwin, Australia (not by the IAF), it was the 45th edition (not 40th), and it is a biennial (not annual) exercise."}, {"id": "q312", "sec": "MoUs & Agreements", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about the Odisha aluminium project MoU:\nI. It was signed between AEL, International Resources Holding, and the Government of Karnataka.\nII. The project is valued at USD 11.5 billion.\nIII. It will be developed through a 70:30 joint venture favouring AEL.\nIV. International Resources Holding is an Abu Dhabi-based IHC group entity.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "Only two", "Only three", "All four", "Only one"], "correct": 1, "expl": "Statements II and IV are correct. The MoU was signed with the Government of ODISHA (not Karnataka), and the JV structure is 50:50 (not 70:30), making statements I and III incorrect."}, {"id": "q313", "sec": "Reports", "diff": "Hard", "type": "multi", "q": "Consider the following statements about the UNCTAD 2026 World Investment Report:\nI. China was the top FDI destination globally in 2025.\nII. India's FDI inflows declined in 2025 compared to 2024.\nIII. India ranked as the 11th largest global FDI recipient in 2025.\nIV. Hong Kong SAR ranked among the top three FDI destinations.\nHow many of the above statements are correct?", "options": ["Only three", "Only one", "Only two", "None of the above are correct", "All four"], "correct": 2, "expl": "Statements III and IV are correct. The USA (not China) was the top FDI destination, and India's FDI inflows SURGED ~44% (not declined) in 2025, making statements I and II incorrect."}, {"id": "q314", "sec": "Science & Technology", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about Skyroot Aerospace's Vikram-1:\nI. It made India the second country globally with private orbital launch capability.\nII. It was launched under 'Mission Aagaman'.\nIII. It followed provisions of the Indian Space Policy 2023.\nIV. It was developed entirely by ISRO with Skyroot as a manufacturing contractor only.\nHow many of the above statements are correct?", "options": ["Only three", "None of the above are correct", "Only one", "Only two", "All four"], "correct": 3, "expl": "Statements II and III are correct. Vikram-1 made India the THIRD (not second) country with private orbital launch capability, and it was developed by Skyroot as a private company (not merely a manufacturing contractor to ISRO), making statements I and IV incorrect."}, {"id": "q315", "sec": "Business News", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about POWERGRID's JBIC green loan:\nI. The total loan amount is JPY 80 billion.\nII. JBIC provides the entire amount directly without co-financing partners.\nIII. It supports India's 500 GW renewable energy capacity target by 2030.\nIV. The transmission network is targeted to expand to 191,000 circuit km by 2032.\nHow many of the above statements are correct?", "options": ["Only two", "All four", "None of the above are correct", "Only one", "Only three"], "correct": 4, "expl": "Statements I, III and IV are correct. JBIC provides only 48 billion JPY directly, with the remainder co-financed by Japanese banks including SMBC — so statement II is incorrect."}, {"id": "q316", "sec": "Statewise National News", "diff": "Hard", "type": "multi", "q": "Consider the following statements about Sikkim's FY27 budget:\nI. The total budget outlay was Rs 19,215 crore.\nII. Revenue expenditure was allocated Rs 11,733 crore.\nIII. Capital expenditure was allocated Rs 5,896 crore.\nIV. No allocation was reserved for Centrally Sponsored Schemes.\nHow many of the above statements are correct?", "options": ["Only three", "Only one", "All four", "None of the above are correct", "Only two"], "correct": 0, "expl": "Statements I, II and III are correct. Rs 2,460 crore WAS reserved for Centrally Sponsored Schemes (CSS), making statement IV incorrect."}, {"id": "q317", "sec": "Other National News", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about the National Indicator Framework (NIF) 2026:\nI. It was released on the 20th Statistics Day.\nII. It comprises 277 national SDG indicators.\nIII. It covers all 17 SDGs.\nIV. It is prepared jointly by NITI Aayog and the World Bank.\nHow many of the above statements are correct?", "options": ["None of the above are correct", "Only three", "Only one", "Only two", "All four"], "correct": 1, "expl": "Statements I, II and III are correct. NIF 2026 was released by MoSPI (Ministry of Statistics and Programme Implementation), not jointly by NITI Aayog and the World Bank, making statement IV incorrect."}];

<script>
/* ============================================================
   NABARD Grade A Practice Quiz — App Engine
   Source: Current Affairs Pocket PDF — July 2026 (AffairsCloud)
   ============================================================ */

const LETTERS = ['A','B','C','D','E'];

// ---------- Global state ----------
const state = {
  screen: 'home',        // home | fullSetup | sectionGrid | quiz | results
  order: 'pdf',           // pdf | shuffled  (Full Practice Test only)
  runQuestions: [],       // array of question objects for the active run
  runMeta: { mode:'full', label:'Full Practice Test' },
  idx: 0,
  answers: {},            // qid -> { selected: idx|null, skipped: bool, correct: bool }
  score: 0,
};

const app = document.getElementById('app');

// ---------- Utilities ----------
function shuffledCopy(arr, seedKey){
  // simple deterministic-ish shuffle (Fisher-Yates) using Math.random (fresh each attempt, as spec: "random order each attempt")
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sectionList(){
  const map = new Map();
  QUESTIONS.forEach(q=>{
    map.set(q.sec, (map.get(q.sec)||0)+1);
  });
  return Array.from(map.entries()).sort((a,b)=> a[0].localeCompare(b[0]));
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  try { window.scrollTo(0,0); } catch(e){}
  if (state.screen === 'home') return renderHome();
  if (state.screen === 'fullSetup') return renderFullSetup();
  if (state.screen === 'sectionGrid') return renderSectionGrid();
  if (state.screen === 'quiz') return renderQuiz();
  if (state.screen === 'results') return renderResults();
}

// ---------- HOME ----------
function renderHome(){
  const totalQ = QUESTIONS.length;
  const totalSec = sectionList().length;
  app.innerHTML = `
    ${brandbar()}
    <div class="hero fade-in">
      <div class="seal-badge">
        <div class="sb-num">${totalQ}</div>
        <div class="sb-label">Questions<br/>5 Options</div>
      </div>
      <div class="hero-copy">
        <div class="eyebrow">NABARD Grade A &middot; Current Affairs</div>
        <h1 class="hero-title">Practice Test Ledger</h1>
        <p class="hero-sub">Built entirely from the AffairsCloud Current Affairs Pocket PDF — July 2026. Direct recall, "NOT correct" traps, and multi-statement questions, exam-style with 5 options (A&ndash;E).</p>
        <div class="hero-stats">
          <div class="hstat"><b>${totalQ}</b>Total Qs</div>
          <div class="hstat"><b>${totalSec}</b>Topics</div>
          <div class="hstat"><b>A&ndash;E</b>Per Question</div>
        </div>
      </div>
    </div>

    <div class="modes">
      <button class="mode-card" data-go="fullSetup">
        <span class="mc-tag">Timed Practice</span>
        <h3>Full Practice Test</h3>
        <p>Attempt all ${totalQ} questions in one sitting, in document order or shuffled. Live score, progress bar, and a full end-of-test review.</p>
        <span class="mc-arrow">&rarr;</span>
      </button>
      <button class="mode-card" data-go="sectionGrid">
        <span class="mc-tag">Topic Drill</span>
        <h3>Section-wise Revision</h3>
        <p>Pick one of ${totalSec} scheme &amp; topic groups — Cabinet Approvals, Banking, Rankings, Defence and more — and drill just that set.</p>
        <span class="mc-arrow">&rarr;</span>
      </button>
    </div>

    ${footerHtml()}
  `;
  app.querySelectorAll('[data-go]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.screen = b.dataset.go; render(); });
  });
}

function brandbar(){
  return `
    <div class="brandbar">
      <div class="brand">
        <div class="brand-mark">NA</div>
        <div class="brand-text">
          <div class="t1">NABARD Grade A Ledger</div>
          <div class="t2">Practice Examination</div>
        </div>
      </div>
      <div class="brand-src">Source: AffairsCloud<br/>Pocket PDF &middot; Jul 2026</div>
    </div>
  `;
}

function footerHtml(){
  return `<footer class="foot">Compiled offline from the July 2026 Current Affairs Pocket PDF &middot; For personal exam preparation</footer>`;
}

// ---------- FULL TEST SETUP ----------
function renderFullSetup(){
  app.innerHTML = `
    ${brandbar()}
    <div class="panel fade-in">
      <div class="panel-head">
        <h2>Full Practice Test</h2>
        <button class="backlink" data-back>&larr; Menu</button>
      </div>
      <p style="color:var(--ink-dim);font-size:13.5px;margin-bottom:20px;">All ${QUESTIONS.length} questions across every topic. Choose the order below, then begin.</p>
      <div class="toggle-row">
        <span class="toggle-label">ORDER</span>
        <div class="toggle">
          <button data-order="pdf" class="${state.order==='pdf'?'active':''}">PDF Order</button>
          <button data-order="shuffled" class="${state.order==='shuffled'?'active':''}">Shuffled</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="startFull">Begin Test &rarr;</button>
      </div>
    </div>
    ${footerHtml()}
  `;
  app.querySelector('[data-back]').addEventListener('click', ()=>{state.screen='home';render();});
  app.querySelectorAll('[data-order]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.order = b.dataset.order; renderFullSetup(); });
  });
  app.querySelector('#startFull').addEventListener('click', ()=>{
    const qs = state.order === 'shuffled' ? shuffledCopy(QUESTIONS) : QUESTIONS.slice();
    startRun(qs, {mode:'full', label:'Full Practice Test', order: state.order});
  });
}

// ---------- SECTION GRID ----------
function renderSectionGrid(){
  const secs = sectionList();
  app.innerHTML = `
    ${brandbar()}
    <div class="panel fade-in">
      <div class="panel-head">
        <h2>Section-wise Revision</h2>
        <button class="backlink" data-back>&larr; Menu</button>
      </div>
      <p style="color:var(--ink-dim);font-size:13.5px;margin-bottom:20px;">Tap a topic to drill just those questions, in document order.</p>
      <div class="sec-grid">
        ${secs.map(([name,count])=>`
          <button class="sec-card" data-sec="${escapeHtml(name)}">
            <div class="sc-name">${escapeHtml(name)}</div>
            <div class="sc-count">${count} question${count===1?'':'s'}</div>
          </button>
        `).join('')}
      </div>
    </div>
    ${footerHtml()}
  `;
  app.querySelector('[data-back]').addEventListener('click', ()=>{state.screen='home';render();});
  app.querySelectorAll('[data-sec]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const name = b.dataset.sec;
      const qs = QUESTIONS.filter(q=>q.sec===name);
      startRun(qs, {mode:'section', label:name, order:'pdf'});
    });
  });
}

// ---------- START A RUN ----------
function startRun(questions, meta){
  state.runQuestions = questions;
  state.runMeta = meta;
  state.idx = 0;
  state.score = 0;
  state.answers = {};
  questions.forEach(q=>{ state.answers[q.id] = { selected:null, skipped:false, correct:false, locked:false }; });
  state.screen = 'quiz';
  render();
}

// ---------- QUIZ ----------
function renderQuiz(){
  const total = state.runQuestions.length;
  const q = state.runQuestions[state.idx];
  const a = state.answers[q.id];
  const answeredCount = Object.values(state.answers).filter(x=>x.locked).length;
  const progressPct = Math.round((answeredCount/total)*100);

  app.innerHTML = `
    ${brandbar()}
    <div class="quiz-head">
      <div class="qh-left"><b>${state.runMeta.label}</b> &middot; Question ${state.idx+1} / ${total}</div>
      <div class="qh-score">Score: <b>${state.score}</b> / ${answeredCount}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>

    <div class="qcard fade-in" id="qcard">
      <div class="qmeta">
        <span class="pill diff-${q.diff}">${q.diff}</span>
        <span class="pill type">${q.sec}</span>
      </div>
      <div class="qtext">${escapeHtml(q.q)}</div>
      <div class="opts" id="opts">
        ${q.options.map((opt,i)=>`
          <button class="opt ${a.locked ? 'locked':''}" data-i="${i}">
            <span class="opt-letter">${LETTERS[i]}</span>
            <span class="opt-text">${escapeHtml(opt)}</span>
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="qfoot">
        <button class="skip-btn" id="skipBtn" ${a.locked?'disabled':''}>Skip question &rarr;</button>
        <div class="btn-row" id="navRow" style="display:${a.locked?'flex':'none'}">
          <button class="btn btn-primary" id="nextBtn">${state.idx===total-1 ? 'Finish &amp; Review' : 'Next Question'} &rarr;</button>
        </div>
      </div>
    </div>
  `;

  if (a.locked){
    lockOptions(q, a);
    showFeedback(q, a);
  }

  app.querySelectorAll('#opts .opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if (state.answers[q.id].locked) return;
      selectOption(q, parseInt(btn.dataset.i,10));
    });
  });
  app.querySelector('#skipBtn').addEventListener('click', ()=>{
    if (state.answers[q.id].locked) return;
    skipQuestion(q);
  });
  const nb = app.querySelector('#nextBtn');
  if (nb) nb.addEventListener('click', goNext);
}

function selectOption(q, i){
  const a = state.answers[q.id];
  a.selected = i;
  a.locked = true;
  a.correct = (i === q.correct);
  a.skipped = false;
  if (a.correct) state.score++;
  renderQuiz();
}

function skipQuestion(q){
  const a = state.answers[q.id];
  a.skipped = true;
  a.locked = true;
  a.selected = null;
  a.correct = false;
  renderQuiz();
}

function lockOptions(q, a){
  const opts = app.querySelectorAll('#opts .opt');
  opts.forEach((btn,i)=>{
    btn.classList.add('locked');
    if (i === q.correct){
      btn.classList.add('correct');
    } else if (a.selected === i){
      btn.classList.add('wrong');
    } else {
      btn.classList.add('dim');
    }
  });
}

function showFeedback(q, a){
  const fb = app.querySelector('#feedback');
  fb.classList.add('show');
  if (a.skipped){
    fb.classList.add('is-skip');
    fb.innerHTML = `<span class="fb-tag">Skipped</span>Correct answer: <b>${LETTERS[q.correct]}. ${escapeHtml(q.options[q.correct])}</b><br/>${escapeHtml(q.expl)}`;
  } else if (a.correct){
    fb.classList.add('is-correct');
    fb.innerHTML = `<span class="fb-tag">Correct</span>${escapeHtml(q.expl)}`;
  } else {
    fb.classList.add('is-wrong');
    fb.innerHTML = `<span class="fb-tag">Incorrect</span>Correct answer: <b>${LETTERS[q.correct]}. ${escapeHtml(q.options[q.correct])}</b><br/>${escapeHtml(q.expl)}`;
  }
}

function goNext(){
  if (state.idx < state.runQuestions.length - 1){
    state.idx++;
    render();
  } else {
    state.screen = 'results';
    render();
  }
}

// ---------- RESULTS ----------
function renderResults(){
  const qs = state.runQuestions;
  const total = qs.length;
  let correct=0, wrong=0, skipped=0;
  const byDiff = { Easy:{c:0,t:0}, Moderate:{c:0,t:0}, Hard:{c:0,t:0} };
  const missedList = [];

  qs.forEach(q=>{
    const a = state.answers[q.id];
    byDiff[q.diff].t++;
    if (a.skipped){
      skipped++;
      missedList.push({q, a, kind:'skipped'});
    } else if (a.correct){
      correct++;
      byDiff[q.diff].c++;
    } else {
      wrong++;
      missedList.push({q, a, kind:'wrong'});
    }
  });

  const attempted = correct + wrong;
  const accuracy = attempted ? Math.round((correct/attempted)*100) : 0;

  app.innerHTML = `
    ${brandbar()}
    <div class="panel fade-in">
      <div class="results-hero">
        <div class="seal-badge">
          <div class="sb-num">${correct}/${total}</div>
          <div class="sb-label">Final<br/>Score</div>
        </div>
        <div class="results-copy">
          <div class="rlabel">${state.runMeta.label} &middot; Result</div>
          <h2>${accuracy}% accuracy on attempted questions</h2>
          <p>${correct} correct &middot; ${wrong} incorrect &middot; ${skipped} skipped, out of ${total} total.</p>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-box"><div class="sv">${correct}</div><div class="sl">Correct</div></div>
        <div class="stat-box"><div class="sv">${wrong}</div><div class="sl">Incorrect</div></div>
        <div class="stat-box"><div class="sv">${skipped}</div><div class="sl">Skipped</div></div>
        <div class="stat-box"><div class="sv">${accuracy}%</div><div class="sl">Accuracy</div></div>
      </div>

      <h3 style="font-family:var(--serif);font-size:16px;margin:22px 0 4px;color:var(--ink);">Accuracy by difficulty</h3>
      <div class="diff-breakdown">
        ${['Easy','Moderate','Hard'].map(d=>{
          const {c,t} = byDiff[d];
          const pct = t ? Math.round((c/t)*100) : 0;
          return `
            <div class="db-row">
              <div class="db-label" style="color:var(--${d.toLowerCase()})">${d}</div>
              <div class="db-track"><div class="db-fill ${d}" style="width:${pct}%"></div></div>
              <div class="db-val">${c}/${t}</div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="btn-row" style="margin-top:26px;">
        <button class="btn btn-primary" id="retryBtn">Retry Same Set</button>
        <button class="btn btn-ghost" id="menuBtn">Back to Menu</button>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-bottom:14px;">Review &middot; Missed &amp; Skipped (${missedList.length})</h2>
      ${missedList.length === 0
        ? `<div class="empty-note">Nothing missed or skipped — clean sweep.</div>`
        : `<div class="review-list">
            ${missedList.map(({q,a,kind})=>`
              <div class="review-item ${kind==='skipped'?'skipped':''}">
                <span class="ri-tag">${kind==='skipped'?'Skipped':'Incorrect'} &middot; ${q.diff} &middot; ${escapeHtml(q.sec)}</span>
                <div class="ri-q">${escapeHtml(q.q)}</div>
                <div class="ri-ans">
                  ${kind==='wrong' ? `Your answer: <span class="your">${LETTERS[a.selected]}. ${escapeHtml(q.options[a.selected])}</span><br/>` : ''}
                  Correct answer: <b>${LETTERS[q.correct]}. ${escapeHtml(q.options[q.correct])}</b>
                </div>
                <div class="ri-expl">${escapeHtml(q.expl)}</div>
              </div>
            `).join('')}
          </div>`
      }
    </div>
    ${footerHtml()}
  `;

  app.querySelector('#retryBtn').addEventListener('click', ()=>{
    startRun(state.runQuestions.slice(), state.runMeta);
  });
  app.querySelector('#menuBtn').addEventListener('click', ()=>{
    state.screen = 'home';
    render();
  });
}

// ---------- INIT ----------
render();

</script>
</body>
</html>
