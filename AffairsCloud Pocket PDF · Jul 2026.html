<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABARD Grade A — Current Affairs Practice Test (July 2026)</title>
<style>
:root{
  --bg:#0A0D10;
  --bg-ledger:#0D1013;
  --surface:#141A1F;
  --surface-2:#1B232A;
  --surface-3:#222C34;
  --border:#2A343D;
  --border-soft:#1E2730;
  --ink:#EAEDEF;
  --ink-dim:#9AA6AD;
  --ink-faint:#5E6A72;
  --seal:#C9A24B;
  --seal-bright:#E0BC6A;
  --seal-dim:#7A6435;
  --forest:#2F6F5E;
  --forest-bright:#3F9179;
  --correct:#3FB67F;
  --correct-bg:rgba(63,182,127,0.12);
  --wrong:#DC5B4E;
  --wrong-bg:rgba(220,91,78,0.12);
  --easy:#4FB3A9;
  --moderate:#D9A441;
  --hard:#C85C8E;
  --radius:10px;
  --radius-lg:16px;
  --serif:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{height:100%;}

body{
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,0.014) 0px, rgba(255,255,255,0.014) 1px, transparent 1px, transparent 34px),
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(47,111,94,0.16), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,162,75,0.08), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}

#app{
  max-width:900px;
  margin:0 auto;
  padding:28px 20px 80px;
}

a{color:inherit;}

/* ---------- Focus ---------- */
button:focus-visible, .opt:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--seal-bright);
  outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- Top bar / brand ---------- */
.brandbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:26px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border-soft);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-mark{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--seal);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);
  font-weight:700;
  font-size:14px;
  color:var(--seal);
  flex-shrink:0;
  position:relative;
}
.brand-mark::after{
  content:'';
  position:absolute;inset:3px;
  border:1px solid var(--seal-dim);
  border-radius:50%;
}
.brand-text .t1{font-family:var(--serif);font-size:15px;letter-spacing:0.02em;color:var(--ink);}
.brand-text .t2{font-family:var(--mono);font-size:10.5px;letter-spacing:0.08em;color:var(--ink-faint);text-transform:uppercase;margin-top:1px;}
.brand-src{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ink-faint);
  text-align:right;
  line-height:1.5;
}

/* ---------- Seal badge (signature element) ---------- */
.seal-badge{
  width:132px;height:132px;
  border-radius:50%;
  border:2px solid var(--seal);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
  flex-shrink:0;
  background:radial-gradient(circle at 35% 30%, rgba(201,162,75,0.10), transparent 70%);
}
.seal-badge::before{
  content:'';
  position:absolute;inset:6px;
  border:1px dashed var(--seal-dim);
  border-radius:50%;
}
.seal-badge .sb-num{
  font-family:var(--serif);
  font-size:34px;
  font-weight:700;
  color:var(--seal-bright);
  line-height:1;
}
.seal-badge .sb-label{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--ink-dim);
  margin-top:4px;
  text-align:center;
}

/* ---------- Home hero ---------- */
.hero{
  display:flex;
  gap:28px;
  align-items:center;
  padding:30px 8px 34px;
  flex-wrap:wrap;
}
.hero-copy{flex:1;min-width:260px;}
.eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--seal);
  margin-bottom:10px;
}
h1.hero-title{
  font-family:var(--serif);
  font-size:clamp(28px,4.4vw,40px);
  font-weight:700;
  line-height:1.12;
  color:var(--ink);
  margin-bottom:12px;
}
.hero-sub{
  color:var(--ink-dim);
  font-size:15px;
  max-width:52ch;
  margin-bottom:18px;
}
.hero-stats{
  display:flex;
  gap:22px;
  flex-wrap:wrap;
}
.hstat{font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);}
.hstat b{color:var(--seal-bright);font-size:15px;display:block;font-family:var(--serif);}

/* ---------- Mode cards ---------- */
.modes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:8px;
}
@media (max-width:640px){ .modes{grid-template-columns:1fr;} }

.mode-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:26px 24px;
  text-align:left;
  cursor:pointer;
  transition:border-color .15s ease, transform .12s ease, background .15s ease;
  color:var(--ink);
  position:relative;
  overflow:hidden;
}
.mode-card:hover{border-color:var(--seal-dim);background:var(--surface-2);transform:translateY(-2px);}
.mode-card .mc-tag{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--forest-bright);
  margin-bottom:10px;
  display:block;
}
.mode-card h3{
  font-family:var(--serif);
  font-size:21px;
  margin-bottom:8px;
}
.mode-card p{
  color:var(--ink-dim);
  font-size:13.5px;
  line-height:1.5;
}
.mode-card .mc-arrow{
  position:absolute;
  right:22px;bottom:22px;
  font-family:var(--serif);
  font-size:22px;
  color:var(--seal-dim);
}

/* ---------- Generic panel/card ---------- */
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:26px;
  margin-bottom:18px;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
  flex-wrap:wrap;
  gap:10px;
}
.panel h2{
  font-family:var(--serif);
  font-size:22px;
}
.backlink{
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--ink-dim);
  background:none;
  border:1px solid var(--border);
  padding:7px 12px;
  border-radius:20px;
  cursor:pointer;
  transition:all .15s ease;
  letter-spacing:0.03em;
}
.backlink:hover{border-color:var(--seal-dim);color:var(--seal-bright);}

/* ---------- Toggle (PDF order / Shuffled) ---------- */
.toggle-row{
  display:flex;align-items:center;gap:14px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.toggle-label{font-size:13px;color:var(--ink-dim);font-family:var(--mono);letter-spacing:0.02em;}
.toggle{
  display:inline-flex;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:24px;
  padding:3px;
  gap:2px;
}
.toggle button{
  border:none;background:none;color:var(--ink-dim);
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:0.03em;
  padding:8px 16px;
  border-radius:20px;
  cursor:pointer;
  transition:all .15s ease;
}
.toggle button.active{
  background:var(--seal);
  color:#171208;
  font-weight:600;
}

.btn{
  font-family:var(--sans);
  font-size:14.5px;
  font-weight:600;
  border:none;
  border-radius:9px;
  padding:13px 26px;
  cursor:pointer;
  transition:all .15s ease;
  letter-spacing:0.01em;
}
.btn-primary{
  background:var(--seal);
  color:#171208;
}
.btn-primary:hover{background:var(--seal-bright);}
.btn-ghost{
  background:transparent;
  border:1px solid var(--border);
  color:var(--ink);
}
.btn-ghost:hover{border-color:var(--seal-dim);color:var(--seal-bright);}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}

/* ---------- Section grid ---------- */
.sec-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
}
.sec-card{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 18px;
  text-align:left;
  cursor:pointer;
  transition:all .15s ease;
  color:var(--ink);
}
.sec-card:hover{border-color:var(--forest-bright);background:var(--surface-3);}
.sec-card .sc-name{font-size:14px;font-weight:600;margin-bottom:6px;line-height:1.3;}
.sec-card .sc-count{
  font-family:var(--mono);
  font-size:11px;
  color:var(--forest-bright);
  letter-spacing:0.04em;
}

/* ---------- Quiz header (score/progress) ---------- */
.quiz-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
  gap:14px;
  flex-wrap:wrap;
}
.qh-left{font-family:var(--mono);font-size:12px;color:var(--ink-dim);letter-spacing:0.03em;}
.qh-left b{color:var(--ink);}
.qh-score{
  font-family:var(--mono);
  font-size:13px;
  color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:6px 14px;
  border-radius:20px;
}
.qh-score b{color:var(--correct);}
.progress-track{
  height:6px;
  background:var(--surface-2);
  border:1px solid var(--border-soft);
  border-radius:6px;
  overflow:hidden;
  margin-bottom:24px;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--forest),var(--seal));
  border-radius:6px;
  transition:width .3s ease;
}

/* ---------- Question card ---------- */
.qcard{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:28px;
}
.qmeta{
  display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;
}
.pill{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:20px;
  border:1px solid var(--border);
  color:var(--ink-dim);
}
.pill.diff-Easy{color:var(--easy);border-color:rgba(79,179,169,0.4);}
.pill.diff-Moderate{color:var(--moderate);border-color:rgba(217,164,65,0.4);}
.pill.diff-Hard{color:var(--hard);border-color:rgba(200,92,142,0.4);}
.pill.type{color:var(--ink-faint);}

.qtext{
  font-family:var(--serif);
  font-size:18px;
  line-height:1.55;
  color:var(--ink);
  margin-bottom:22px;
  white-space:pre-line;
}

.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
.opt{
  display:flex;
  align-items:flex-start;
  gap:14px;
  text-align:left;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 16px;
  cursor:pointer;
  transition:all .12s ease;
  font-size:14.5px;
  color:var(--ink);
  width:100%;
}
.opt:hover:not(.locked){border-color:var(--seal-dim);background:var(--surface-3);}
.opt .opt-letter{
  font-family:var(--mono);
  font-weight:700;
  font-size:12.5px;
  width:24px;height:24px;
  border-radius:50%;
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  color:var(--ink-dim);
}
.opt .opt-text{flex:1;line-height:1.45;padding-top:2px;}
.opt.locked{cursor:default;}
.opt.correct{
  background:var(--correct-bg);
  border-color:var(--correct);
}
.opt.correct .opt-letter{border-color:var(--correct);color:var(--correct);background:rgba(63,182,127,0.15);}
.opt.wrong{
  background:var(--wrong-bg);
  border-color:var(--wrong);
}
.opt.wrong .opt-letter{border-color:var(--wrong);color:var(--wrong);background:rgba(220,91,78,0.15);}
.opt.dim{opacity:0.45;}

.feedback{
  margin-top:16px;
  padding:16px 18px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--surface-2);
  font-size:13.5px;
  line-height:1.55;
  color:var(--ink-dim);
  display:none;
}
.feedback.show{display:block;}
.feedback .fb-tag{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  font-weight:700;
  margin-bottom:6px;
  display:block;
}
.feedback.is-correct .fb-tag{color:var(--correct);}
.feedback.is-wrong .fb-tag{color:var(--wrong);}
.feedback.is-skip .fb-tag{color:var(--seal);}

.qfoot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:22px;
  gap:12px;
  flex-wrap:wrap;
}
.skip-btn{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:0.04em;
  background:none;
  border:1px solid var(--border);
  color:var(--ink-faint);
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  transition:all .15s ease;
}
.skip-btn:hover{border-color:var(--ink-faint);color:var(--ink-dim);}
.skip-btn:disabled{opacity:0.3;cursor:default;}

/* ---------- Results ---------- */
.results-hero{
  display:flex;gap:26px;align-items:center;
  padding:20px 6px 30px;
  flex-wrap:wrap;
}
.results-copy{flex:1;min-width:240px;}
.results-copy .rlabel{
  font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;
}
.results-copy h2{
  font-family:var(--serif);font-size:26px;margin-bottom:10px;
}
.results-copy p{color:var(--ink-dim);font-size:14px;}

.stat-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;
  margin:22px 0;
}
.stat-box{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  text-align:center;
}
.stat-box .sv{font-family:var(--serif);font-size:24px;color:var(--seal-bright);}
.stat-box .sl{font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px;}

.diff-breakdown{
  display:flex;flex-direction:column;gap:10px;margin:18px 0 8px;
}
.db-row{display:flex;align-items:center;gap:12px;}
.db-label{
  font-family:var(--mono);font-size:11.5px;width:82px;flex-shrink:0;
  text-transform:uppercase;letter-spacing:0.04em;
}
.db-track{
  flex:1;height:8px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:6px;overflow:hidden;
}
.db-fill{height:100%;border-radius:6px;}
.db-fill.Easy{background:var(--easy);}
.db-fill.Moderate{background:var(--moderate);}
.db-fill.Hard{background:var(--hard);}
.db-val{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);width:56px;text-align:right;flex-shrink:0;}

.review-list{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
.review-item{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-left:3px solid var(--wrong);
  border-radius:var(--radius);
  padding:16px 18px;
}
.review-item.skipped{border-left-color:var(--seal);}
.review-item .ri-tag{
  font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--wrong);margin-bottom:8px;display:inline-block;
}
.review-item.skipped .ri-tag{color:var(--seal);}
.review-item .ri-q{font-family:var(--serif);font-size:14.5px;margin-bottom:10px;line-height:1.5;white-space:pre-line;}
.review-item .ri-ans{font-size:12.5px;color:var(--ink-dim);line-height:1.6;}
.review-item .ri-ans b{color:var(--correct);}
.review-item .ri-ans .your{color:var(--wrong);}
.review-item .ri-expl{font-size:12.5px;color:var(--ink-faint);margin-top:8px;line-height:1.55;font-style:italic;}

.empty-note{
  text-align:center;color:var(--ink-faint);font-size:13.5px;padding:20px;font-family:var(--mono);
}

footer.foot{
  text-align:center;
  margin-top:50px;
  padding-top:20px;
  border-top:1px solid var(--border-soft);
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ink-faint);
  letter-spacing:0.04em;
}

/* fade-in for question changes */
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

</style>
</head>
<body>
<div id="app"></div>
<script>
const QUESTIONS = [{"id": "q1", "sec": "Cabinet Approvals", "diff": "Moderate", "type": "single", "q": "By how much did the Union Cabinet's additional investment commitment raise the Government of India's total commitment to the National Investment and Infrastructure Fund (NIIF)?", "options": ["Rs 30,000 crore additional, taking the total commitment to Rs 60,000 crore", "Rs 40,000 crore additional, taking the total to Rs 70,000 crore", "Rs 20,000 crore additional, taking the total to Rs 50,000 crore", "Rs 30,000 crore additional, taking the total to Rs 90,000 crore", "Rs 15,000 crore additional, taking the total to Rs 45,000 crore"], "correct": 0, "expl": "In June 2026, the Cabinet approved an additional Rs 30,000 Cr investment in NIIF, doubling GoI's total commitment to Rs 60,000 Cr, to be used for NIIF's Infrastructure Fund II."}, {"id": "q2", "sec": "Cabinet Approvals", "diff": "Hard", "type": "single", "q": "The CCEA-approved two highway projects in Delhi and Uttar Pradesh in July 2026 had a combined investment of approximately how much, and what was the cost of the 6-lane tunnel project in Delhi specifically?", "options": ["Combined Rs 14,114.81 crore; Delhi tunnel project cost Rs 7,500 crore", "Combined Rs 14,114.81 crore; Delhi tunnel project cost Rs 6,969.67 crore", "Combined Rs 16,000 crore; Delhi tunnel project cost Rs 6,969.67 crore", "Combined Rs 14,114.81 crore; UP corridor cost Rs 6,969.67 crore", "Combined Rs 12,500 crore; Delhi tunnel project cost Rs 5,500 crore"], "correct": 1, "expl": "CCEA approved highway projects worth a combined Rs 14,114.81 crore: a Rs 6,969.67 crore 6-lane tunnel in Delhi and a Rs 7,145.14 crore greenfield corridor in UP."}, {"id": "q3", "sec": "Cabinet Approvals", "diff": "Moderate", "type": "single", "q": "What is the total budget outlay approved by the Union Cabinet for the 'Semicon 2.0' programme in July 2026?", "options": ["Rs 1,00,000 crore", "Rs 1,50,000 crore", "Rs 1,27,500 crore", "Rs 76,000 crore", "Rs 90,000 crore"], "correct": 2, "expl": "Semicon 2.0 was approved with a total outlay of Rs 1,27,500 crore, structured around six pillars including Design, Machines & Materials, and R&D."}, {"id": "q4", "sec": "Cabinet Approvals", "diff": "Easy", "type": "single", "q": "Under which ministry was the 'Mobile Phone Manufacturing Scheme (MPMS)' approved with a Rs 62,500 crore outlay?", "options": ["Ministry of Commerce and Industry", "Ministry of Heavy Industries", "Ministry of Communications", "Ministry of Electronics and Information Technology (MeitY)", "Ministry of Finance"], "correct": 3, "expl": "MPMS was approved under MeitY with a Rs 62,500 crore outlay, succeeding the PLI scheme for Large Scale Electronics Manufacturing (PLI-LSEM)."}, {"id": "q5", "sec": "Cabinet Approvals", "diff": "Hard", "type": "single", "q": "For how many years will the Mobile Phone Manufacturing Scheme (MPMS) be implemented, and which scheme does it succeed?", "options": ["5 years (FY26–FY30), succeeding Semicon 1.0", "3 years (FY27–FY29), succeeding PLI-LSEM", "7 years (FY27–FY33), succeeding PLI 2.0", "5 years (FY27–FY31), succeeding the India Semiconductor Mission", "5 years (FY27–FY31), succeeding PLI-LSEM"], "correct": 4, "expl": "MPMS will run for 5 years, from FY27 to FY31, succeeding the PLI Scheme for Large Scale Electronics Manufacturing (PLI-LSEM), which ended 31 March 2026."}, {"id": "q6", "sec": "Cabinet Approvals", "diff": "Moderate", "type": "single", "q": "What is the estimated additional urea production capacity targeted under the National Investment Policy for Urea-2026 (NIPU-2026)?", "options": ["1 crore Metric Tonnes (MT)", "50 lakh Metric Tonnes", "75 lakh Metric Tonnes", "2 crore Metric Tonnes", "1.5 crore Metric Tonnes"], "correct": 0, "expl": "NIPU-2026, approved by CCEA, aims to encourage new gas-based urea manufacturing investment with an estimated 1 crore MT of additional production capacity."}, {"id": "q7", "sec": "Cabinet Approvals", "diff": "Hard", "type": "single", "q": "Under the Bill approved to strengthen the Anti-Paper Leak Law, what is the revised minimum imprisonment range for individuals involved in organised paper leak offences?", "options": ["3–7 years", "5–10 years", "7–10 years", "2–5 years", "1–5 years"], "correct": 1, "expl": "The Bill amending the Public Examinations (Prevention of Unfair Means) Act, 2024 raises minimum imprisonment for individuals to 5–10 years while retaining the maximum of 10 years and a fine up to Rs 10 crore."}, {"id": "q8", "sec": "Cabinet Approvals", "diff": "Moderate", "type": "single", "q": "What is the total outlay of the 'BHAVYA-Rasayan' scheme approved to set up three chemical parks, and how is the amount split?", "options": ["Rs 3,300 crore total; Rs 3,000 crore infrastructure and Rs 300 crore administrative", "Rs 3,030 crore total; Rs 30 crore infrastructure and Rs 3,000 crore administrative", "Rs 3,030 crore total; Rs 3,000 crore for common infrastructure and Rs 30 crore for administrative expenditure", "Rs 3,030 crore total; split equally between infrastructure and administration", "Rs 3,030 crore total; Rs 2,500 crore for infrastructure and Rs 530 crore administrative"], "correct": 2, "expl": "BHAVYA-Rasayan has a total outlay of Rs 3,030 crore — Rs 3,000 crore for common infrastructure/utilities and Rs 30 crore for administrative expenditure."}, {"id": "q9", "sec": "Cabinet Approvals", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about July 2026 Cabinet/CCEA approvals is NOT correct?", "options": ["The Mobile Phone Manufacturing Scheme (MPMS) was approved with a budgetary outlay of Rs 62,500 crore", "The Union Cabinet approved Semicon 2.0 with an outlay of Rs 1,27,500 crore", "CCEA approved the 3rd and 4th Line of the Ballari–Guntakal railway section at an estimated cost of nearly Rs 1,264 crore", "The BHAVYA-Rasayan scheme was approved with a total outlay of Rs 5,000 crore for setting up five chemical parks", "CCEA approved two elevated highway projects in Varanasi, UP with combined investment of over Rs 25,000 crore"], "correct": 3, "expl": "BHAVYA-Rasayan was approved with a total outlay of Rs 3,030 crore for THREE chemical parks, not Rs 5,000 crore for five parks."}, {"id": "q10", "sec": "Cabinet Approvals", "diff": "Hard", "type": "multi", "q": "Consider the following statements regarding Cabinet/CCEA approvals in June–July 2026:\nI. The additional NIIF investment of Rs 30,000 crore will be used to set up NIIF's Infrastructure Fund II.\nII. The Yamuna Water Project agreement was signed to resolve the Haryana–Rajasthan water dispute.\nIII. The Anti-Paper Leak Law amendment Bill proposes fast-track courts to complete investigations and trials within three months.\nIV. The two railway multitracking projects approved with NIPU-2026 (Paradeep–Haridaspur and Rajkharsawan–Dangoaposi) had an estimated cost of about Rs 3,907 crore.\nHow many of the above statements are correct?", "options": ["Only one", "None of the above are correct", "Only three", "Only two", "All four"], "correct": 4, "expl": "All four statements are accurate as per the July 2026 Cabinet/CCEA approvals covered in the PDF."}, {"id": "q11", "sec": "Statewise National News", "diff": "Moderate", "type": "single", "q": "Assam FM Jayanta Malla Baruah presented the state budget for FY27 with what total outlay?", "options": ["Rs 2,85,084 crore", "Rs 2,00,000 crore", "Rs 1,51,843 crore", "Rs 2,50,000 crore", "Rs 3,10,000 crore"], "correct": 0, "expl": "Assam's FY27 budget had a total outlay of Rs 2,85,084 crore, with total receipts in the Consolidated Fund estimated at Rs 1,51,843.23 crore."}, {"id": "q12", "sec": "Statewise National News", "diff": "Easy", "type": "single", "q": "Which Andhra Pradesh initiative was launched during World Population Day (July 11) to promote balanced population growth?", "options": ["DWEEPTI Yojana", "Pillale Sampada", "Amrutpan Abhiyan", "VB-GRAM G", "Namo Swachhta Abhiyan"], "correct": 1, "expl": "AP CM N. Chandrababu Naidu launched 'Pillale Sampada (Children are Wealth)' in Vijayawada to address declining fertility rates and an ageing population."}, {"id": "q13", "sec": "Statewise National News", "diff": "Moderate", "type": "single", "q": "The Delhi Government's 'Clean Air, Healthy Delhi' air pollution project, worth Rs 8,300 crore, is being implemented with the support of which institution?", "options": ["International Monetary Fund", "United Nations Environment Programme", "World Bank", "Asian Development Bank", "New Development Bank"], "correct": 2, "expl": "The Delhi Government announced a Rs 8,300 crore programme titled 'Clean Air, Healthy Delhi', implemented with World Bank support."}, {"id": "q14", "sec": "Statewise National News", "diff": "Hard", "type": "single", "q": "Who succeeded Dr A. Jayathilak as Chief Secretary of Kerala in July 2026, and what is his batch/cadre?", "options": ["Biswanath Sinha, a 1992-batch IPS officer of Kerala cadre", "Biswanath Sinha, a 1991-batch IAS officer of the Kerala cadre", "A. Jayathilak's successor was a 1994-batch officer named Biswanath Sinha", "Biswanath Sinha, a 1992-batch IAS officer of the Kerala cadre", "Biswanath Sinha, a 1990-batch IAS officer of Kerala cadre"], "correct": 3, "expl": "Biswanath Sinha, a 1992-batch IAS officer of the Kerala cadre, took charge as Chief Secretary, with tenure extending until September 2028."}, {"id": "q15", "sec": "Statewise National News", "diff": "Moderate", "type": "single", "q": "Sikkim CM Prem Singh Tamang presented the FY27 Annual Budget with a total outlay of how much, and how much was reserved for Centrally Sponsored Schemes (CSS)?", "options": ["Rs 19,215 crore total outlay; Rs 1,733 crore reserved for CSS", "Rs 21,000 crore total outlay; Rs 2,460 crore reserved for CSS", "Rs 11,733 crore total outlay; Rs 2,460 crore reserved for CSS", "Rs 19,215 crore total outlay; Rs 5,896 crore reserved for CSS", "Rs 19,215 crore total outlay; Rs 2,460 crore reserved for CSS"], "correct": 4, "expl": "Sikkim's FY27 Budget totalled Rs 19,215 crore, with Rs 11,733 Cr for Revenue Expenditure, Rs 5,896 Cr for Capital Expenditure, and Rs 2,460 Cr reserved for CSS."}, {"id": "q16", "sec": "Statewise National News", "diff": "Easy", "type": "single", "q": "Who was appointed Chairman of the Curriculum Design Committee (CDC) for School Education in Tamil Nadu?", "options": ["Mylswamy Annadurai, former ISRO scientist", "V. Kamakoti, IIT Madras Director", "Ishari K. Ganesh, VISTAS founder", "S. Somanath, former ISRO Chairman", "Sridhar Vembu, Zoho co-founder"], "correct": 0, "expl": "Former ISRO scientist Mylswamy Annadurai was appointed Chairman of the CDC for a 3-year tenure to modernise the curriculum for 1.3 crore students."}, {"id": "q17", "sec": "Statewise National News", "diff": "Moderate", "type": "single", "q": "What is the total outlay of the Green Skills Centre of Excellence (CoE) MoU signed between Telangana and Microsoft, and by when is it expected to become operational?", "options": ["Rs 500 crore outlay; operational by August 2026", "The article does not specify a monetary outlay; it is expected to become operational by August 2026", "Rs 1,000 crore outlay; operational by December 2026", "Rs 500 crore outlay; operational by January 2027", "Rs 200 crore outlay; operational by August 2026"], "correct": 1, "expl": "The Telangana-Microsoft Green Skills CoE in Hyderabad is expected to become operational by August 2026; no specific monetary outlay figure was given in the source."}, {"id": "q18", "sec": "Statewise National News", "diff": "Moderate", "type": "notcorrect", "q": "Which one of the following statements about July 2026 statewise news is NOT correct?", "options": ["UP renamed Jalalabad town in Shahjahanpur district as Parashurampuri", "UP CM Yogi Adityanath renamed Bhadarsa town in Ayodhya district as 'Bharat Nagar'", "The West Bengal government announced Rs 500 crore special assistance for tea garden workers under PMCSPY", "Uttar Pradesh launched Kaushal Setu and Kaushal Sarathi portals for skill development", "MP secured a USD 2 billion semiconductor-related investment from Spain's Submer Group"], "correct": 2, "expl": "West Bengal announced Rs 313 crore (not Rs 500 crore) special assistance for tea garden workers under the Pradhan Mantri Cha Shramik Protsahan Yojana (PMCSPY)."}, {"id": "q19", "sec": "Statewise National News", "diff": "Hard", "type": "multi", "q": "Consider the following statements about state government schemes covered in July 2026:\nI. Himachal Pradesh's 'Mukhyamantri Machhuara Samman Nidhi Yojana' provides a lump-sum grant of Rs 3,500 to reservoir fishermen during the fishing ban period.\nII. Delhi's 'Delhi Lakshmi Yojana' provides Rs 2,500 monthly assistance to eligible women with a total budget outlay of Rs 5,110 crore for 2026-27.\nIII. Chhattisgarh's DWEEPTI Yojana targets 5,000 solar enterprises and 50,000 green jobs.\nIV. Gujarat's Namo Swachhta Abhiyan is a month-long cleanliness drive covering all government hospitals in the state.\nHow many of the above statements are correct?", "options": ["Only two", "All four", "None of the above are correct", "Only three", "Only one"], "correct": 3, "expl": "Statements I, II and III are correct. Namo Swachhta Abhiyan was a WEEK-long drive (1–7 July 2026), not month-long, making statement IV incorrect."}, {"id": "q20", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "single", "q": "The 'VB-GRAM G' (Viksit Bharat – Guarantee for Rozgar and Ajeevika Mission Gramin Yojana), which replaced MGNREGA, guarantees how many days of wage employment and what minimum floor wage?", "options": ["150 days of wage employment and Rs 300 per day", "125 days of wage employment and Rs 350 per day", "125 days of wage employment and Rs 250 per day", "100 days of wage employment and Rs 300 per day", "125 days of wage employment and a national minimum floor wage of Rs 300 per day"], "correct": 4, "expl": "VB-GRAM G Act, 2025 guarantees 125 days of wage employment with a national minimum floor wage of Rs 300/day, with a committed outlay of Rs 7.5 lakh crore over 5 years."}, {"id": "q21", "sec": "Launches & Inauguration", "diff": "Hard", "type": "single", "q": "What is the total 5-year financial outlay committed under the VB-GRAM G (Viksit Bharat–Guarantee for Rozgar and Ajeevika Mission Gramin Yojana)?", "options": ["Rs 7.5 lakh crore", "Rs 10 lakh crore", "Rs 6 lakh crore", "Rs 7 lakh crore", "Rs 5 lakh crore"], "correct": 0, "expl": "The government committed an outlay of Rs 7.5 lakh crore over a 5-year period under VB-GRAM G, launched nationwide from Tirupati district, AP."}, {"id": "q22", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "single", "q": "The PRAGATI programme launched by Union Agriculture Minister Shivraj Singh Chouhan aims to empower how many agri-entrepreneurs and directly support how many smallholder farmers?", "options": ["15,000 agri-entrepreneurs and 20 lakh smallholder farmers", "20,000 agri-entrepreneurs and 20 lakh smallholder farmers", "26,000 agri-entrepreneurs and 26 lakh smallholder farmers", "20,000 agri-entrepreneurs and 30 lakh smallholder farmers", "10,000 agri-entrepreneurs and 10 lakh smallholder farmers"], "correct": 1, "expl": "PRAGATI aims to empower 20,000 agri-entrepreneurs and directly support 20 lakh smallholder farmers, building on an existing network of 26,000+ agri-entrepreneurs supporting 26 lakh farmers."}, {"id": "q23", "sec": "Launches & Inauguration", "diff": "Hard", "type": "single", "q": "By what percentage does PRAGATI aim to increase farmers' income, and what percentage of associated farmers should gain financial inclusion?", "options": ["Increase income by at least 20%; enable financial inclusion for 50%", "Increase income by at least 25%; enable financial inclusion for 60%", "Increase income by at least 30%; enable financial inclusion for 50% of associated farmers", "Increase income by at least 30%; enable financial inclusion for 30%", "Increase income by at least 30%; enable financial inclusion for 40%"], "correct": 2, "expl": "PRAGATI targets increasing farmers' income by at least 30%, improving yields by 15–20%, and enabling financial inclusion for 50% of associated farmers."}, {"id": "q24", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "single", "q": "'Gramodyam', an Entrepreneurship Development Programme launched by NABARD Chairman Dr. Shaji K.V., was launched on the occasion of which milestone?", "options": ["NABARD's 40th Foundation Day", "NABARD's 50th Foundation Day", "World Youth Skills Day", "NABARD's 45th Foundation Day", "NABARD's 44th Foundation Day"], "correct": 3, "expl": "Gramodyam was launched on 13 July 2026 on NABARD's 45th Foundation Day, implemented with NSDC through the Institute for Industrial Development (IID)."}, {"id": "q25", "sec": "Launches & Inauguration", "diff": "Easy", "type": "single", "q": "'Gramodyam' is being implemented in collaboration with which organisation under the Ministry of Skill Development and Entrepreneurship?", "options": ["National Council for Vocational Education and Training (NCVET)", "National Small Industries Corporation (NSIC)", "Institute of Chartered Accountants of India (ICAI)", "National Institute for Transforming India (NITI Aayog)", "National Skill Development Corporation (NSDC)"], "correct": 4, "expl": "NABARD's Gramodyam programme is implemented with NSDC (under MSDE) through the Institute for Industrial Development (IID)."}, {"id": "q26", "sec": "Launches & Inauguration", "diff": "Hard", "type": "single", "q": "Under the EPFO's 'VISHWAS 2026' dispute resolution scheme, what is the reduced damage rate for EPF defaults exceeding 4 months (for defaults before 14 June 2024)?", "options": ["1% per month", "2% per month", "1.5% per month", "0.25% per month", "0.50% per month"], "correct": 0, "expl": "Under VISHWAS 2026, damages for defaults before 14 June 2024 are recalculated at 0.25%/month (up to 2 months), 0.50%/month (2–4 months), and 1%/month (exceeding 4 months)."}, {"id": "q27", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "single", "q": "VISHWAS 2026 was notified under which regulation number, and for how long will it remain operational?", "options": ["Notified through G.S.R. 525(E); operational for three months", "Notified through G.S.R. 525(E); operational for six months from notification", "Notified through G.S.R. 625(E); operational for six months", "Notified through G.S.R. 525(E); operational for one year", "Notified through G.S.R. 425(E); operational for one year"], "correct": 1, "expl": "VISHWAS 2026 was notified via G.S.R. 525(E) on 29 June 2026 under the EPF Scheme, 2026, and remains operational for six months."}, {"id": "q28", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "single", "q": "The Biomedical Research Career Programme (BRCP) Phase-III was launched with a total outlay of Rs 1,500 crore. How is this funding split between DBT and the Wellcome Trust?", "options": ["Rs 1,200 crore from DBT and Rs 300 crore from Wellcome Trust", "Rs 500 crore from DBT and Rs 1,000 crore from Wellcome Trust", "Rs 1,000 crore from DBT and Rs 500 crore from Wellcome Trust", "Rs 1,500 crore entirely from DBT", "Rs 750 crore each from DBT and Wellcome Trust"], "correct": 2, "expl": "BRCP Phase-III's Rs 1,500 crore outlay includes Rs 1,000 crore from DBT (GoI) and Rs 500 crore from Wellcome Trust, London, implemented via the DBT-WT India Alliance."}, {"id": "q29", "sec": "Launches & Inauguration", "diff": "Hard", "type": "single", "q": "Under the PM SVANidhi Street Food Hub initiative, how much funding does each approved Street Food Hub receive, and in what installment structure?", "options": ["Rs 4 crore in 2 installments of 50%-50%", "Rs 5 crore in 3 installments of 30%-40%-30%", "Rs 4 crore in 3 installments of 40%-40%-20%", "Rs 4 crore in 3 installments of 30%-50%-20%", "Rs 3 crore in 3 installments of 30%-50%-20%"], "correct": 3, "expl": "Each approved Street Food Hub receives Rs 4 crore in 3 installments (30%-50%-20%), plus a Rs 25 lakh incentive for ULBs with a notified Street Vending Plan."}, {"id": "q30", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "single", "q": "What is the total outlay of the BharatNet rural broadband rollout addendum signed for Gujarat among DBN, GFGNL and BSNL?", "options": ["Rs 6,200 crore", "Rs 4,500 crore", "Rs 5,629 crore under a different name", "Rs 5,000 crore", "Rs 5,629 crore"], "correct": 4, "expl": "The addendum for implementing the Amended BharatNet Programme (ABP) in Gujarat under the State-led model had a total outlay of Rs 5,629 crore."}, {"id": "q31", "sec": "Launches & Inauguration", "diff": "Hard", "type": "single", "q": "By how many indicators did the PAIMANA infrastructure dashboard expand in its latest quarterly release, and what is the new total?", "options": ["Added 44 new indicators, expanding the total to 165 indicators", "Added 25 new indicators, expanding the total to 165 indicators", "Added 44 new indicators, expanding the total to 145 indicators", "Added 44 new indicators, expanding the total to 200 indicators", "Added 30 new indicators, expanding the total to 150 indicators"], "correct": 0, "expl": "MoSPI's PAIMANA dashboard's latest quarterly release added 44 new indicators, expanding India's infrastructure monitoring framework to 165 indicators."}, {"id": "q32", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "single", "q": "As per PAIMANA's civil aviation data, how many aerodromes did India have 10 years ago (2014) versus at present?", "options": ["90 (2014) to 165 (present)", "81 (2014) to 165 (present)", "81 (2014) to 150 (present)", "81 (2014) to 180 (present)", "75 (2014) to 165 (present)"], "correct": 1, "expl": "The number of aerodromes nearly doubled over the last 10 years, from 81 (2014) to 165 (at present), as per PAIMANA data."}, {"id": "q33", "sec": "Launches & Inauguration", "diff": "Hard", "type": "single", "q": "As per the MoHUA-approved PARIVARTAN Scheme, old trucks and buses in the NCR are to be replaced with which category of vehicles?", "options": ["Bharat Stage (BS)-IV-compliant vehicles only", "CNG vehicles only", "Bharat Stage (BS)-VI-compliant vehicles or Electric Vehicles (EVs)", "Bharat Stage (BS)-VI-compliant vehicles only (EVs excluded)", "Hybrid vehicles only"], "correct": 2, "expl": "PARIVARTAN aims to replace old, polluting trucks and buses in the NCR with BS-VI-compliant or Electric Vehicles (EVs)."}, {"id": "q34", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "single", "q": "NITI Aayog's 10-year roadmap targets a bioeconomy of what value by 2035, and what value by 2047?", "options": ["USD 500 billion by 2035 and USD 2 trillion by 2047", "USD 691 billion by 2035 and USD 2 trillion by 2047", "USD 800 billion by 2035 and USD 3 trillion by 2047", "USD 691 billion by 2035 and USD 2.6 trillion by 2047", "USD 691 billion by 2030 and USD 2.6 trillion by 2040"], "correct": 3, "expl": "The NITI Aayog roadmap targets scaling India's Bioeconomy to USD 691 billion by 2035 and USD 2.6 trillion by 2047, generating over 30 million high-value jobs."}, {"id": "q35", "sec": "Launches & Inauguration", "diff": "Hard", "type": "single", "q": "What is the proposed size of the 'BioEconomy Growth Fund' proposed for 2026–2035 under NITI Aayog's bioeconomy roadmap, and from which larger framework will it be drawn?", "options": ["Rs 25,000 crore, from the National Investment and Infrastructure Fund", "Rs 75,000 crore, from within the RDI framework", "Rs 50,000 crore, from the Atal Innovation Mission corpus", "Rs 1 lakh crore, a fully new allocation", "Rs 50,000 crore, from within the existing Rs 1 lakh crore Research, Development and Innovation (RDI) framework"], "correct": 4, "expl": "The proposal is to create a Rs 50,000 crore BioEconomy Growth Fund for 2026-2035 from within the existing Rs 1 lakh crore RDI framework."}, {"id": "q36", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "single", "q": "What was the funding pattern approved for the six urban development projects worth Rs 2,719.80 crore in Ahmedabad under the Urban Challenge Fund (UCF)?", "options": ["25% each from Centre and Gujarat Government; remaining 50% via municipal bonds/loans/PPP", "100% funded by the Central Government", "25% Centre, 25% State, 50% from AMC's own funds only", "50% from Centre, 50% from State", "25% Centre, 75% mobilised through PPP alone"], "correct": 0, "expl": "AMC receives 25% (Rs 679.95 crore) each from the Centre and Gujarat Government, while the remaining 50% (Rs 1,359.90 crore) is mobilised via municipal bonds, loans, or PPP models."}, {"id": "q37", "sec": "Launches & Inauguration", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about July 2026 national launches is NOT correct?", "options": ["EPFO's VISHWAS 2026 was notified through G.S.R. 525(E) on 29 June 2026", "The Rs 1,500 crore Biomedical Research Career Programme Phase-III is funded entirely by the Department of Biotechnology with no international partner", "NABARD launched 'Gramodyam' on its 45th Foundation Day in collaboration with NSDC", "The India Semiconductor Mission (ISM) 2.0 was approved with an outlay of Rs 1.28 lakh crore", "PM SVANidhi Street Food Hubs target up to 50 hubs nationwide"], "correct": 1, "expl": "BRCP Phase-III is jointly funded — Rs 1,000 crore from DBT and Rs 500 crore from the Wellcome Trust (London, UK) — so it is NOT funded entirely by DBT alone."}, {"id": "q38", "sec": "Launches & Inauguration", "diff": "Moderate", "type": "multi", "q": "Consider the following statements on July 2026 launches:\nI. NIELIT will establish two Centres of Excellence for semiconductor skilling in Ahmedabad and Guwahati.\nII. India became the 123rd member of the WTO Agreement on Fisheries Subsidies.\nIII. The 'Gems of India' Challenge pilot phase was launched on the MyWAVES platform.\nIV. Chhattisgarh became the first Indian state to introduce a Risk-based business approval system via the Ease of Doing Business Act, 2026.\nHow many of the above statements are correct?", "options": ["Only one", "None of the above are correct", "All four", "Only three", "Only two"], "correct": 2, "expl": "All four statements are correct as detailed in the July 2026 national news coverage."}, {"id": "q39", "sec": "Launches & Inauguration", "diff": "Hard", "type": "multi", "q": "Consider the following statements about the Digital India programme and related initiatives:\nI. Digital India completed 11 years on 1 July 2026, having been launched on 1 July 2015.\nII. The cost of mobile data has fallen from Rs 269 per GB to Rs 8-10 per GB.\nIII. The revised GDP series updated the base year to 2011-12 from 2022-23.\nIV. India's Index of Core Industries (ICI) was revised to a base year of 2022-23, increasing core industries from 8 to 9 with the inclusion of iron ore.\nHow many of the above statements are correct?", "options": ["Only two", "All four", "Only one", "Only three", "None of the above are correct"], "correct": 3, "expl": "Statements I, II and IV are correct. The GDP series base year was updated FROM 2011-12 TO 2022-23 (statement III reverses this), making it incorrect."}, {"id": "q40", "sec": "Other National News", "diff": "Moderate", "type": "single", "q": "The National Indicator Framework (NIF) 2026, under which India's SDG progress is tracked, consists of how many national SDG indicators covering how many SDGs?", "options": ["277 national SDG indicators covering 12 SDGs", "300 national SDG indicators covering all 17 SDGs", "250 national SDG indicators covering all 17 SDGs", "277 national SDG indicators covering 15 SDGs", "277 national SDG indicators covering all 17 SDGs"], "correct": 4, "expl": "MoSPI's NIF 2026 comprises 277 national SDG indicators covering all 17 SDGs, released on the 20th Statistics Day (29 June 2026)."}, {"id": "q41", "sec": "Other National News", "diff": "Hard", "type": "single", "q": "By how much did the proportion of India's population covered by social protection systems/floors increase between 2016 and 2026?", "options": ["From 22.0% (2016) to 65.3% (2026)", "From 22.0% (2016) to 55.3% (2026)", "From 25.0% (2016) to 70.3% (2026)", "From 30.0% (2016) to 65.3% (2026)", "From 22.0% (2018) to 65.3% (2026)"], "correct": 0, "expl": "As per MoSPI's SDG publications, coverage under social protection systems/floors rose from 22.0% in 2016 to 65.3% in 2026."}, {"id": "q42", "sec": "Other National News", "diff": "Moderate", "type": "single", "q": "How many Tiger Reserves (TRs) has the Government of India identified for priority reintroduction/recovery through science-led interventions, out of India's total TRs?", "options": ["25 TRs identified out of India's 55 TRs", "25 TRs identified out of India's 58 TRs", "30 TRs identified out of India's 58 TRs", "25 TRs identified out of India's 50 TRs", "20 TRs identified out of India's 58 TRs"], "correct": 1, "expl": "GoI identified 25 of India's 58 Tiger Reserves — those low on tigers or prey — as needing priority science-led recovery interventions."}, {"id": "q43", "sec": "Other National News", "diff": "Easy", "type": "single", "q": "As per the report released to mark 18 years of tiger reintroduction, at what annual rate is India's tiger population currently growing?", "options": ["10%", "3%", "6%", "4%", "8%"], "correct": 2, "expl": "Despite this growth of about 6% annually, roughly 25 of India's 58 Tiger Reserves remain low in tiger/prey population, requiring priority intervention."}, {"id": "q44", "sec": "Other National News", "diff": "Moderate", "type": "single", "q": "As of July 2026, how many Biodiversity Heritage Sites (BHS) does India have, and which was India's first BHS (notified in 2007)?", "options": ["50 BHS in total; Nallur Tamarind Grove was India's first", "45 BHS in total; Nallur Tamarind Grove was India's first", "54 BHS in total; Majuli BHS was India's first", "54 BHS in total; Nallur Tamarind Grove, Bengaluru was India's first", "54 BHS in total; Borjuli site was India's first"], "correct": 3, "expl": "As per NBA, India has 54 BHS as of July 2026. The Nallur Tamarind Grove in Bengaluru, Karnataka became India's first BHS in 2007."}, {"id": "q45", "sec": "Other National News", "diff": "Hard", "type": "single", "q": "How many officially notified Biodiversity Heritage Sites does Assam have as of July 2026, following the notification of the Borjuli site?", "options": ["Two: Majuli BHS and Borjuli Wild Rice BHS", "Three, but excluding Majuli BHS", "Five BHS across the state", "Four BHS including Kaziranga BHS", "Three: Majuli BHS, Borjuli Wild Rice BHS, and Hajong Tortoise Lake BHS"], "correct": 4, "expl": "With the Borjuli site notification, Assam has three officially notified BHS: Majuli BHS, Borjuli Wild Rice BHS, and Hajong Tortoise Lake BHS."}, {"id": "q46", "sec": "Other National News", "diff": "Moderate", "type": "single", "q": "The Defence Acquisition Council (DAC), chaired by Rajnath Singh, granted Acceptance of Necessity (AoN) worth approximately how much for Army, Navy and Air Force modernisation in July 2026?", "options": ["Rs 52,000 crore", "Rs 40,000 crore", "Rs 60,000 crore", "Rs 52,000 crore for Navy alone", "Rs 45,000 crore"], "correct": 0, "expl": "DAC granted AoN worth approximately Rs 52,000 crore for various acquisition proposals of the Indian Army, Navy and Air Force."}, {"id": "q47", "sec": "Other National News", "diff": "Hard", "type": "single", "q": "The Government of India approved the expansion of PM-SETU across how many ITI clusters, with what investment plan value?", "options": ["150 ITI clusters; Rs 1,000 crore", "200 ITI clusters; Rs 1,237.58 crore", "200 ITI clusters; Rs 1,500 crore", "250 ITI clusters; Rs 1,237.58 crore", "200 ITI clusters; Rs 937.58 crore"], "correct": 1, "expl": "PM-SETU expansion covers all 200 identified ITI clusters with strategic investment plans worth Rs 1,237.58 crore, approved by the 4th National Steering Committee."}, {"id": "q48", "sec": "Other National News", "diff": "Moderate", "type": "single", "q": "The Natural History Museum, Mizoram University was notified as India's how many-eth Designated Repository under the Biological Diversity Act, 2002?", "options": ["21st, but under a different Act", "15th", "21st", "25th", "18th"], "correct": 2, "expl": "MoEFCC notified NHM, Mizoram University as India's 21st Designated Repository under Section 39 of the Biological Diversity Act, 2002."}, {"id": "q49", "sec": "Other National News", "diff": "Easy", "type": "single", "q": "CSIR-IICT, Hyderabad developed India's first indigenous process technology for which green refrigerant?", "options": ["Hydrochlorofluorocarbon-22 (HCFC-22)", "Hydrofluorocarbon-32 (HFC-32)", "Chlorofluorocarbon-12 (CFC-12)", "Hydrofluoroolefin-1234yf (HFO-1234yf)", "Hydrofluoroolefin-1233zd"], "correct": 3, "expl": "CSIR-IICT developed India's first indigenous HFO-1234yf process technology, aimed at replacing HFCs in refrigeration/AC systems."}, {"id": "q50", "sec": "Other National News", "diff": "Moderate", "type": "single", "q": "Adani Defence and Aerospace's investment to create South Asia's largest private-sector missile ecosystem in Shivpuri, Madhya Pradesh, amounts to how much?", "options": ["Rs 3,000 crore", "Rs 2,000 crore", "Rs 1,500 crore", "Rs 2,500 crore in Telangana instead of MP", "Rs 2,500 crore"], "correct": 4, "expl": "Adani Defence and Aerospace invested Rs 2,500 crore to establish South Asia's largest private-sector missile ecosystem facility in Shivpuri, MP."}, {"id": "q51", "sec": "Other National News", "diff": "Hard", "type": "single", "q": "'Samudra Pradakshina', India's first Tri-Service all-women circumnavigation sailing expedition, was completed by IASV Triveni over how many days and how many nautical miles?", "options": ["314 days, covering nearly 25,500 nautical miles", "254 days, covering 20,000 nautical miles", "314 days, covering 22,000 nautical miles", "314 days, covering 30,000 nautical miles", "365 days, covering 25,500 nautical miles"], "correct": 0, "expl": "IASV Triveni, crewed by nine women officers from IA, IN and IAF, completed a 314-day voyage of nearly 25,500 nautical miles across four oceans."}, {"id": "q52", "sec": "Other National News", "diff": "Moderate", "type": "single", "q": "Under the MSME Ministry's notification effective 30 June 2026, all CPSE invoices for goods/services procured from MSMEs must be settled through which platform?", "options": ["Public Financial Management System (PFMS)", "Trade Receivables Discounting System (TReDS)", "Udyam Registration Portal", "National Payments Corporation of India (NPCI) platform", "Government e-Marketplace (GeM)"], "correct": 1, "expl": "MSME's notification mandates that CPSE invoices for MSME procurement be settled through RBI-authorised TReDS platforms, giving effect to a Union Budget FY27 announcement."}, {"id": "q53", "sec": "Other National News", "diff": "Hard", "type": "single", "q": "Maharashtra topped states in PLI-Auto scheme manufacturing units (as of March 31, 2026) with how many units, out of a nationwide total?", "options": ["70 units in Maharashtra, out of 225 nationwide", "66 units in Maharashtra, out of 200 nationwide", "66 units in Maharashtra, out of 225 nationwide", "66 units in Maharashtra, out of 250 nationwide", "60 units in Maharashtra, out of 225 nationwide"], "correct": 2, "expl": "Maharashtra topped with 66 units, followed by Tamil Nadu (38), Haryana (35) and Karnataka (35), out of 225 total units nationwide under PLI-Auto."}, {"id": "q54", "sec": "Other National News", "diff": "Moderate", "type": "single", "q": "India ranks 1st globally in cotton cultivation area with what share of world cotton area, and what rank does it hold in cotton production and consumption?", "options": ["114.84 lakh hectares (38%); 1st in production, 2nd in consumption", "114.84 lakh hectares (38%); 3rd in both production and consumption", "100 lakh hectares (30%); 2nd in both production and consumption", "114.84 lakh hectares (38% of world cotton area); 2nd in both production and consumption", "114.84 lakh hectares (45%); 2nd in both production and consumption"], "correct": 3, "expl": "India ranks 1st in cotton cultivation area (114.84 lakh ha, 38% of world area) and 2nd in both cotton production and consumption."}, {"id": "q55", "sec": "Other National News", "diff": "Hard", "type": "single", "q": "As per MoC&I data, which country is the largest destination for India's cotton fabric and made-up exports, and what share does it account for?", "options": ["USA, accounting for 19.81% of total exports", "USA, accounting for 30% of total exports", "United Kingdom, accounting for 26.35% of total exports", "Bangladesh, accounting for 26.35% of total exports", "United States of America (USA), accounting for 26.35% of total exports"], "correct": 4, "expl": "USA is the largest destination for India's cotton fabric/made-up exports (26.35%), followed by Bangladesh (19.81%), Sri Lanka (5.11%), UK (2.38%) and UAE (2.32%)."}, {"id": "q56", "sec": "Other National News", "diff": "Moderate", "type": "single", "q": "MoSPI's provisional Index of Core Industries (ICI) data for June 2026 recorded what Year-on-Year growth, compared to May 2026's growth?", "options": ["5% in June 2026, compared to 3.2% in May 2026", "5% in June 2026, compared to 2.5% in May 2026", "4% in June 2026, compared to 3.2% in May 2026", "6% in June 2026, compared to 3.2% in May 2026", "5% in June 2026, compared to 4% in May 2026"], "correct": 0, "expl": "The provisional ICI for June 2026 recorded 5% Y-o-Y growth, up from 3.2% growth recorded in May 2026."}, {"id": "q57", "sec": "Other National News", "diff": "Moderate", "type": "notcorrect", "q": "Which one of the following statements about July 2026 'Other National News' items is NOT correct?", "options": ["DAC granted Acceptance of Necessity worth approximately Rs 52,000 crore for Army, Navy and Air Force modernisation", "India's Digital India programme completed 15 years on 1 July 2026", "MoSPI plans to use the Producer Price Index (PPI) as a GDP deflator, replacing the WPI wherever applicable", "India became the 123rd WTO member to join the Agreement on Fisheries Subsidies", "The revised Index of Core Industries (ICI) uses base year 2022-23, replacing base year 2011-12"], "correct": 1, "expl": "Digital India completed 11 years (not 15) on 1 July 2026, having been launched by PM Modi on 1 July 2015."}, {"id": "q58", "sec": "Other National News", "diff": "Hard", "type": "multi", "q": "Consider the following statements about India's trade and industry data (July 2026):\nI. India ranks 1st globally in cotton cultivation area.\nII. The revised Index of Core Industries now has 10 core industries instead of 9.\nIII. GoI increased the windfall gains tax (SAED) on diesel exports from Rs 8.5/litre to Rs 15.5/litre.\nIV. India approved its first dengue vaccine QDENGA for individuals aged 4 to 60 years.\nHow many of the above statements are correct?", "options": ["Only two", "None of the above are correct", "Only three", "Only one", "All four"], "correct": 2, "expl": "Statements I, III and IV are correct. The revised ICI increased core industries from 8 to 9 (with iron ore added), not to 10, making statement II incorrect."}, {"id": "q59", "sec": "Govt Schemes", "diff": "Easy", "type": "single", "q": "For how many consecutive quarters has the Ministry of Finance kept interest rates on Small Savings Schemes (SSS) unchanged, as of Q2FY27?", "options": ["8th consecutive quarter", "7th consecutive quarter", "6th consecutive quarter", "9th consecutive quarter", "10th consecutive quarter"], "correct": 3, "expl": "DEA under MoF kept SSS interest rates unchanged for Q2FY27 (July-Sept 2026), marking the 9th consecutive quarter with no revision."}, {"id": "q60", "sec": "Govt Schemes", "diff": "Moderate", "type": "single", "q": "What is the interest rate on the Sukanya Samriddhi Yojana (SSY) and Senior Citizens' Savings Scheme (SCSS) for Q2FY27 (July-Sept 2026)?", "options": ["8.2% for SSY and 7.4% for SCSS", "7.7% for SSY and 8.2% for SCSS", "8.2% for SSY and 7.5% for SCSS", "7.1% for both SSY and SCSS", "8.2% for both SSY and SCSS"], "correct": 4, "expl": "As per the Q2FY27 SSS interest rate table, both Sukanya Samriddhi Yojana and Senior Citizens' Savings Scheme carry an interest rate of 8.2%."}, {"id": "q61", "sec": "Govt Schemes", "diff": "Hard", "type": "single", "q": "What is the interest rate on the Public Provident Fund (PPF) versus the 5-Year Post Office Time Deposit (POTD) for Q2FY27?", "options": ["PPF: 7.1%; 5-Year POTD: 7.5%", "PPF: 6.9%; 5-Year POTD: 7.5%", "PPF: 7.7%; 5-Year POTD: 7.5%", "PPF: 7.1%; 5-Year POTD: 7.1%", "PPF: 7.5%; 5-Year POTD: 7.1%"], "correct": 0, "expl": "For Q2FY27, PPF carries a 7.1% interest rate, while the 5-Year Post Office Time Deposit carries 7.5%."}, {"id": "q62", "sec": "Govt Schemes", "diff": "Moderate", "type": "single", "q": "Kisan Vikas Patra (KVP) for Q2FY27 carries what interest rate, and in how many months will it mature?", "options": ["7.5%, maturing in 100 months", "7.5%, maturing in 115 months", "7.5%, maturing in 124 months", "7.1%, maturing in 115 months", "8.2%, maturing in 115 months"], "correct": 1, "expl": "KVP carries a 7.5% interest rate for Q2FY27 and will mature in 115 months."}, {"id": "q63", "sec": "Govt Schemes", "diff": "Moderate", "type": "single", "q": "PMKSY (Pradhan Mantri Krishi Sinchayee Yojana) completed over 10 years in July 2026. What was its original budgetary outlay when approved by CCEA on 1 July 2015?", "options": ["Rs 60,000 crore for 5 years", "Rs 50,000 crore for 10 years", "Rs 50,000 crore for a period of 5 years", "Rs 50,000 crore for 3 years", "Rs 40,000 crore for 5 years"], "correct": 2, "expl": "PMKSY was approved by CCEA on 1 July 2015 with a budgetary outlay of Rs 50,000 crore for a period of 5 years."}, {"id": "q64", "sec": "Govt Schemes", "diff": "Hard", "type": "single", "q": "PMKSY comprises how many main components, and which of the following is one of them?", "options": ["5 components, including Per Drop More Crop", "4 components, but excluding AIBP", "3 components, including Har Khet Ko Pani (HKKP)", "4 components, including Har Khet Ko Pani (HKKP)", "4 components, including Jal Jeevan Mission"], "correct": 3, "expl": "PMKSY comprises 4 components: Accelerated Irrigation Benefit Programme (AIBP), Har Khet Ko Pani (HKKP), Watershed Development Component (WDC), and Per Drop More Crop (PDMC)."}, {"id": "q65", "sec": "Govt Schemes", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about Small Savings Scheme interest rates for Q2FY27 is NOT correct?", "options": ["The 5-Year Post Office Recurring Deposit (PORD) carries an interest rate of 6.7%", "The Post Office Savings Deposit (POSD) carries an interest rate of 4.0%", "The 1-Year Post Office Time Deposit carries an interest rate of 6.9%", "The National Savings Certificate (NSC) carries an interest rate of 7.7%", "The Post Office Monthly Income Scheme (PO-MIS) carries an interest rate of 8.2% for Q2FY27"], "correct": 4, "expl": "PO-MIS carries an interest rate of 7.4% (not 8.2%) for Q2FY27; 8.2% is the rate for SSY and SCSS."}, {"id": "q66", "sec": "Govt Schemes", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about Central Government schemes:\nI. Small Savings Scheme interest rates remained unchanged for the 9th consecutive quarter in Q2FY27.\nII. PMKSY was launched in July 2015 with an outlay of Rs 50,000 crore.\nIII. The Kisan Vikas Patra matures in 115 months at an interest rate of 7.5% for Q2FY27.\nIV. The Public Provident Fund carries a higher interest rate than the National Savings Certificate for Q2FY27.\nHow many of the above statements are correct?", "options": ["Only three", "Only one", "All four", "None of the above are correct", "Only two"], "correct": 0, "expl": "Statements I, II and III are correct. PPF (7.1%) carries a LOWER rate than NSC (7.7%) for Q2FY27, so statement IV is incorrect."}, {"id": "q67", "sec": "International Affairs", "diff": "Moderate", "type": "single", "q": "The ITU's 'AI for Good Global Commission' was launched with how many founding members, and which two leaders co-chair it?", "options": ["40 founding members, co-chaired by Paul Kagame and Doreen Bogdan-Martin", "44 founding members, co-chaired by Paul Kagame (Rwanda) and Marc Benioff (Salesforce)", "44 founding members, co-chaired by Mukesh Ambani and Marc Benioff", "50 founding members, co-chaired by Paul Kagame and Marc Benioff", "44 founding members, co-chaired by Sunil Mittal and Marc Benioff"], "correct": 1, "expl": "The Commission has 44 founding members, co-chaired by Rwandan President Paul Kagame and Salesforce Chair/CEO Marc Benioff, with ITU Secretary-General Doreen Bogdan-Martin as Vice-Chair."}, {"id": "q68", "sec": "International Affairs", "diff": "Easy", "type": "single", "q": "Which three Indian business figures were among the 44 founding members of ITU's AI for Good Global Commission?", "options": ["Mukesh Ambani, Lakshmi Mittal, and Azim Premji", "Sunil Bharti Mittal, Lakshmi Mittal, and Nita Ambani", "Mukesh Ambani, Sunil Bharti Mittal, and Lakshmi N. Mittal", "Mukesh Ambani, Sunil Bharti Mittal, and Gautam Adani", "Mukesh Ambani, Ratan Tata, and Gautam Adani"], "correct": 2, "expl": "Mukesh Ambani (Reliance), Sunil Bharti Mittal (Bharti Enterprises), and Lakshmi N. Mittal (ArcelorMittal) represented India among the founding members."}, {"id": "q69", "sec": "International Affairs", "diff": "Moderate", "type": "single", "q": "How many nations, apart from Ukraine, agreed to join the newly announced 'Anti-ballistic Missile Coalition' to protect Europe from missiles?", "options": ["Nine nations, but excluding Germany", "Eight nations", "Ten nations", "Nine (Denmark, France, Germany, Italy, the Netherlands, Norway, Spain, Sweden, and the UK)", "Twelve nations"], "correct": 3, "expl": "Nine other countries agreed to join Ukraine in the coalition: Denmark, France, Germany, Italy, the Netherlands, Norway, Spain, Sweden, and the UK."}, {"id": "q70", "sec": "International Affairs", "diff": "Hard", "type": "single", "q": "According to the UN FAO's SOFI 2026 report, how many people faced hunger globally in 2025, and what percentage of the global population did this represent?", "options": ["600 million people, 7.8% of global population", "645 million people, 8.1% of global population", "511 million people, 7.8% of global population", "700 million people, 8.1% of global population", "645 million people, 7.8% of global population"], "correct": 4, "expl": "SOFI 2026 estimated 645 million people (7.8% of global population) faced hunger in 2025, a slight decline from 8.1% the previous year."}, {"id": "q71", "sec": "International Affairs", "diff": "Moderate", "type": "single", "q": "The SOFI 2026 report is prepared jointly by how many specialised UN agencies?", "options": ["5 (FAO, IFAD, UNICEF, WFP, and WHO)", "6 agencies including UNESCO", "4 agencies (FAO, IFAD, UNICEF, WHO)", "5 agencies including UNDP instead of IFAD", "3 agencies (FAO, WFP, WHO)"], "correct": 0, "expl": "SOFI 2026 is prepared by 5 UN agencies: FAO, IFAD, UNICEF, WFP, and WHO."}, {"id": "q72", "sec": "International Affairs", "diff": "Hard", "type": "single", "q": "The Ancient Buddhist Site of Sarnath was inscribed as India's 45th UNESCO World Heritage Site and the fourth for Uttar Pradesh. Which three other UP sites are also WHS?", "options": ["Taj Mahal, Agra Fort, and Kushinagar", "Taj Mahal, Agra Fort, and Fatehpur Sikri", "Agra Fort, Fatehpur Sikri, and Lucknow Residency", "Taj Mahal, Fatehpur Sikri, and Ayodhya Ram Mandir", "Taj Mahal, Agra Fort, and Varanasi Ghats"], "correct": 1, "expl": "Sarnath became UP's fourth WHS after Taj Mahal, Agra Fort, and Fatehpur Sikri, and India's 45th overall, inscribed at the 48th WHC session in Busan, South Korea."}, {"id": "q73", "sec": "International Affairs", "diff": "Moderate", "type": "multi", "q": "Consider the following statements about international affairs (July 2026):\nI. India and Mali launched their inaugural export promotion forum in Bamako, Mali.\nII. CAC49 (49th Codex Alimentarius Commission session) adopted seven codex standards developed under India's leadership.\nIII. The UN's first scientific report on AI was co-chaired by Yoshua Bengio and Maria Ressa.\nIV. Sarnath was historically known as Rishipatana and Mrigadava in Buddhist literature.\nHow many of the above statements are correct?", "options": ["Only three", "Only one", "All four", "None of the above are correct", "Only two"], "correct": 2, "expl": "All four statements are correct as per the source document."}, {"id": "q74", "sec": "Visits", "diff": "Moderate", "type": "single", "q": "During PM Modi's visit to Rajasthan on 4 July 2026, he inaugurated a new terminal building at Jodhpur Airport costing how much and designed to handle how many passengers annually?", "options": ["Rs 480 crore; up to 3 million passengers annually", "Rs 350 crore; up to 1.5 million passengers annually", "Rs 480 crore; up to 2.5 million passengers annually", "Rs 480 crore; up to 2 million passengers annually", "Rs 500 crore; up to 2 million passengers annually"], "correct": 3, "expl": "PM Modi inaugurated the Rs 480 crore Jodhpur Airport terminal, designed for up to 2 million passengers annually, and launched the Modified UDAN scheme."}, {"id": "q75", "sec": "Visits", "diff": "Hard", "type": "single", "q": "During PM Modi's visit to Haryana, Chandigarh and Punjab on 17 July 2026, development projects worth over how much were dedicated across the three regions combined?", "options": ["Over Rs 30,000 crore combined", "Over Rs 20,000 crore combined", "Over Rs 26,800 crore, entirely in Haryana", "Over Rs 25,000 crore combined", "Over Rs 26,800 crore combined (Haryana ~14,700 Cr, Chandigarh ~4,700 Cr, Punjab ~5,470 Cr)"], "correct": 4, "expl": "PM Modi dedicated projects worth over Rs 26,800 crore across Haryana (Rs 14,700 Cr), Chandigarh (over Rs 4,700 Cr) and Punjab (over Rs 5,470 Cr), and flagged off India's first hydrogen train."}, {"id": "q76", "sec": "Visits", "diff": "Moderate", "type": "single", "q": "Japan PM Sanae Takaichi's visit to India (1-3 July 2026) was for which milestone summit?", "options": ["16th India-Japan Annual Summit", "17th India-Japan Annual Summit", "4th India-Japan 2+2 Ministerial", "15th India-Japan Annual Summit", "16th India-Japan Trade Summit"], "correct": 0, "expl": "Japanese PM Sanae Takaichi visited India for the 16th India-Japan Annual Summit and the Japan-India Joint Economic Forum in New Delhi."}, {"id": "q77", "sec": "Visits", "diff": "Hard", "type": "single", "q": "During PM Modi's visit to Indonesia (6-8 July 2026), what distinction did he achieve, and what vision did he unveil?", "options": ["First Indian PM to address the DPR; unveiled 'PACTS' framework", "First Indian PM to address the Indonesian Parliament (DPR); unveiled the 'Ganga-Mahakam Vision'", "First Indian PM to address the DPR; unveiled the 'Nusantara Vision'", "First Indian PM to visit Indonesia; unveiled the 'Ganga-Mahakam Vision'", "First Indian PM to receive Indonesia's highest civilian honour; unveiled 'Roadmap to 2030'"], "correct": 1, "expl": "PM Modi became the first Indian PM to address the Indonesian Parliament and unveiled the 'Ganga-Mahakam Vision' for long-term strategic partnership."}, {"id": "q78", "sec": "Visits", "diff": "Moderate", "type": "single", "q": "During PM Modi's visit to New Zealand (10-11 July 2026), how many major outcomes resulted from the bilateral meeting, including how many MoUs?", "options": ["18 major outcomes, including 12 MoUs", "15 major outcomes, including 10 MoUs", "18 major outcomes, including 10 MoUs", "20 major outcomes, including 10 MoUs", "18 major outcomes, including 8 MoUs"], "correct": 2, "expl": "The bilateral meeting resulted in 18 major outcomes including 10 MoUs, and elevation of ties to a Strategic Partnership with a Roadmap to 2030."}, {"id": "q79", "sec": "Visits", "diff": "Hard", "type": "single", "q": "President Droupadi Murmu's week-long visit (19-25 July 2026) covered which three countries, and which was a first-ever visit by an Indian President?", "options": ["Moldova, North Macedonia, and Romania; Romania was the first-ever visit", "Moldova, North Macedonia, and Bulgaria; North Macedonia was first-ever", "Poland, North Macedonia, and Romania; North Macedonia was first-ever", "Moldova, North Macedonia, and Romania; North Macedonia was the first-ever visit", "Moldova, Serbia, and Romania; Serbia was the first-ever visit"], "correct": 3, "expl": "President Murmu visited Moldova, North Macedonia (first-ever visit by an Indian President), and Romania (first state visit by an Indian President in nearly 30 years)."}, {"id": "q80", "sec": "Visits", "diff": "Moderate", "type": "notcorrect", "q": "Which one of the following statements about PM Modi's/President Murmu's July 2026 visits is NOT correct?", "options": ["India and Australia launched the 'PACTS' framework during PM Modi's visit", "PM Modi was conferred with Indonesia's highest civilian honour, the 'Bintang Adipurna'", "PM Modi's visit to New Zealand marked the first-ever visit by an Indian PM to New Zealand in 40 years", "President Murmu received the Doctor Honoris Causa award in Romania", "PM Modi's visit to Australia marked the first-ever visit by an Indian PM to Australia in 40 years"], "correct": 4, "expl": "It was PM Modi's visit to NEW ZEALAND (not Australia) that marked the first Indian PM visit there in 40 years."}, {"id": "q81", "sec": "Visits", "diff": "Hard", "type": "multi", "q": "Consider the following statements about foreign visits in June–July 2026:\nI. FM Sitharaman co-chaired the France Economic and Financial Dialogue at Aix-en-Provence.\nII. During PM Modi's Seychelles visit, India and Seychelles signed a total of 9 MoUs.\nIII. PM Modi was honoured with the 'Guardian of the Blue Horizon' title in Seychelles.\nIV. The India-Australia Annual Leaders' Summit held in Melbourne was the 5th such summit.\nHow many of the above statements are correct?", "options": ["Only three", "All four", "Only two", "Only one", "None of the above are correct"], "correct": 0, "expl": "Statements I, II and III are correct. The source specifies it was the 3rd India-Australia Annual Leaders' Summit, not the 5th, making statement IV incorrect."}, {"id": "q82", "sec": "RBI & SEBI", "diff": "Moderate", "type": "single", "q": "What combined monetary penalty did RBI impose on Bank of Baroda (BoB) and GIC Housing Finance in July 2026?", "options": ["Rs 66.7 crore", "Rs 66.7 lakh", "Rs 76.7 lakh", "Rs 56.7 lakh", "Rs 60 lakh"], "correct": 1, "expl": "RBI imposed a combined penalty of Rs 66.7 lakh on BoB and GIC Housing Finance for non-compliance including KYC norms and Fair Practices Code violations."}, {"id": "q83", "sec": "RBI & SEBI", "diff": "Hard", "type": "single", "q": "RBI launched three key surveys in July 2026 to gather inputs for monetary policy. Which of the following is NOT one of the three surveys launched?", "options": ["Systemic Risk Survey (SRS)", "Inflation Expectations Survey of Households (IESH)", "Bank Lending Survey (BLS)", "Urban Consumer Confidence Survey (UCCS)", "Rural Consumer Confidence Survey (RCCS)"], "correct": 2, "expl": "The three surveys launched were IESH, RCCS, and UCCS, covering 19 cities and 31 States/UTs, ahead of the MPC meeting scheduled for August 3-5, 2026."}, {"id": "q84", "sec": "RBI & SEBI", "diff": "Moderate", "type": "single", "q": "RBI's Financial Inclusion (FI) Index for FY26 rose to what level, up from what level in the previous year?", "options": ["72 in March 2026, up from 67 in March 2025", "68 in March 2026, up from 67 in March 2025", "70 in March 2026, up from 70 in March 2025", "70 in March 2026, up from 67 in March 2025", "70 in March 2026, up from 65 in March 2025"], "correct": 3, "expl": "RBI's composite FI-Index for FY26 increased to 70 in March 2026, from 67 in March 2025."}, {"id": "q85", "sec": "RBI & SEBI", "diff": "Hard", "type": "single", "q": "RBI's new 'Prudential Norms on Specified Non-Financial Asset (SNFA)' under the Resolution of Stressed Assets Directions, 2025, will come into effect from which date?", "options": ["November 1, 2026", "January 1, 2027", "July 1, 2026", "September 1, 2026", "October 1, 2026"], "correct": 4, "expl": "The new SNFA framework, prohibiting REs from selling SNFA back to defaulting borrowers, comes into effect from October 1, 2026."}, {"id": "q86", "sec": "RBI & SEBI", "diff": "Moderate", "type": "single", "q": "SEBI constituted an Expert Working Group (EWG), chaired by former Whole-Time Member Ananta Barua, to review the regulatory framework for which entities?", "options": ["Debenture trustees, under SEBI (Debenture Trustees) Regulations, 1993", "Merchant bankers", "Credit rating agencies", "Portfolio managers", "Mutual fund distributors"], "correct": 0, "expl": "SEBI's EWG, chaired by Ananta Barua, will review the debenture trusteeship regulatory framework under SEBI (Debenture Trustees) Regulations, 1993."}, {"id": "q87", "sec": "RBI & SEBI", "diff": "Easy", "type": "single", "q": "Which asset management firm did SEBI approve in July 2026 to launch a Mutual Fund (MF) business, in addition to its existing PMS and AIF offerings?", "options": ["Edelweiss Asset Management", "Carnelian Asset Management & Advisors Private Limited", "SBI Funds Management", "Bandhan Asset Management", "Zerodha Fund House"], "correct": 1, "expl": "SEBI approved Carnelian Asset Management & Advisors to launch its MF business, expanding beyond PMS, AIFs, and offshore strategies."}, {"id": "q88", "sec": "Banking & Loans", "diff": "Moderate", "type": "single", "q": "The Asian Development Bank (ADB) approved a USD 182.89 million loan to Karnataka for which programme, and how many students will benefit?", "options": ["Strengthening Karnataka Public Schools Program; 2 million students", "Karnataka Skill Development Program; over 1 million students", "Strengthening Karnataka Public Schools Program; over 1 million students", "Strengthening Karnataka Public Schools Program; 500,000 students", "Karnataka Urban Development Program; over 1 million students"], "correct": 2, "expl": "ADB approved USD 182.89 million to establish 500 integrated school clusters in Karnataka, benefiting over 1 million students from pre-primary to secondary levels."}, {"id": "q89", "sec": "Banking & Loans", "diff": "Hard", "type": "single", "q": "The ADB's USD 230 million loan for Chennai's water supply and sanitation infrastructure is aligned with which schemes?", "options": ["Jal Jeevan Mission and Smart Cities Mission", "Swachh Bharat Mission and AMRUT 2.0", "AMRUT 2.0 and Namami Gange", "AMRUT 2.0 and the Urban Challenge Fund", "Urban Challenge Fund and PM Awas Yojana"], "correct": 3, "expl": "The USD 230 million (~Rs 1,920 crore) ADB loan for Chennai is aligned with AMRUT 2.0 and the Urban Challenge Fund."}, {"id": "q90", "sec": "Banking & Loans", "diff": "Moderate", "type": "single", "q": "The World Bank Group approved a USD 890 million financing package for which Indian scheme, and how many jobs is it expected to create?", "options": ["PM Awas Yojana; 1.7 million jobs", "PM Surya Ghar: Muft Bijli Yojana; 2 million jobs", "PM Surya Ghar: Muft Bijli Yojana; 1 million jobs", "PM-KUSUM; 1.7 million jobs", "PM Surya Ghar: Muft Bijli Yojana (PMSGMBY); 1.7 million jobs"], "correct": 4, "expl": "The WBG's USD 890 million package accelerates PMSGMBY, expanding rooftop solar and creating 1.7 million jobs across the renewable energy value chain."}, {"id": "q91", "sec": "Banking & Loans", "diff": "Hard", "type": "single", "q": "ADB's USD 850 million loan supporting PM Surya Ghar: Muft Bijli Yojana aims to help India achieve what rooftop solar capacity target by FY27, and reduce how much CO2-equivalent emissions?", "options": ["30 GW cumulative rooftop solar capacity; reduce 28.8 Million Tonnes of CO2 equivalent", "40 GW cumulative rooftop solar capacity; reduce 28.8 Million Tonnes of CO2", "30 GW cumulative rooftop solar capacity; reduce 20 Million Tonnes of CO2", "25 GW cumulative rooftop solar capacity; reduce 28.8 Million Tonnes of CO2", "30 GW cumulative rooftop solar capacity; reduce 35 Million Tonnes of CO2"], "correct": 0, "expl": "ADB's USD 850 million loan supports India's target of 30 GW cumulative rooftop solar capacity by FY27, reducing 28.8 MT of CO2 equivalent emissions, and covering at least 3.5 million rooftop installations."}, {"id": "q92", "sec": "Banking & Loans", "diff": "Hard", "type": "notcorrect", "q": "Which one of the following statements about multilateral bank loans to India (July 2026) is NOT correct?", "options": ["ADB's PMSGMBY loan is expected to support at least 3.5 million rooftop solar installations", "The World Bank Group's USD 890 million financing package for PMSGMBY is expected to create 2.5 million renewable energy jobs", "ADB approved a USD 230 million loan to modernise Chennai's water supply and sanitation infrastructure", "ADB approved a USD 182.89 million loan to strengthen Karnataka's public school system", "ADB approved an USD 850 million loan to support PMSGMBY's rooftop solar adoption target"], "correct": 1, "expl": "The World Bank Group's PMSGMBY package is expected to create 1.7 million jobs (not 2.5 million) across the renewable energy value chain."}, {"id": "q93", "sec": "Banking & Loans", "diff": "Moderate", "type": "single", "q": "SBI Life Insurance signed an MoU with IIT Bombay to establish which innovation hub?", "options": ["'AI Cyber Defence Hub for Banking'", "'Bharat FinTech Innovation Hub'", "'Bharat AI & Cyber Innovation Hub for Insurance'", "'Digital Insurance Research Centre'", "'Insurance Technology Innovation Centre'"], "correct": 2, "expl": "SBI Life Insurance and IIT Bombay signed an MoU to establish the 'Bharat AI & Cyber Innovation Hub for Insurance' for deep-tech defence systems in insurance."}, {"id": "q94", "sec": "Banking & Loans", "diff": "Moderate", "type": "single", "q": "Punjab National Bank (PNB) and the Government of Andhra Pradesh signed an MoU to establish India's first bank-led Quantum Finance Hub at which location?", "options": ["GIFT City, Gujarat", "Bengaluru, Karnataka", "Vishakhapatnam, AP", "Amaravati Quantum Valley (AQV), Amaravati, AP", "Hyderabad, Telangana"], "correct": 3, "expl": "PNB became the first bank to partner with a state government to establish a dedicated Quantum Finance Hub, at Amaravati Quantum Valley, AP."}, {"id": "q95", "sec": "Banking & Loans", "diff": "Hard", "type": "single", "q": "Which two international payment firms did NPCI partner with to enable real-time FX settlement for cross-border UPI transactions?", "options": ["Visa and Mastercard", "HSBC India and Citibank", "Western Union and HSBC India", "JP Morgan Payments and Standard Chartered", "HSBC India and JP Morgan Payments"], "correct": 4, "expl": "NPCI collaborated with HSBC India and JP Morgan Payments to enable real-time FX settlement for cross-border UPI transactions."}, {"id": "q96", "sec": "Banking & Loans", "diff": "Moderate", "type": "single", "q": "Razorpay's 'Banking Connect' mobile-first NetBanking solution was launched in partnership with which NPCI subsidiary?", "options": ["NPCI Bharat BillPay Limited (NBBL)", "NPCI Digital Governance Wing", "NPCI Cyber Cell", "NPCI International Payments Limited (NIPL)", "National Financial Switch (NFS)"], "correct": 0, "expl": "Razorpay partnered with NBBL, a wholly owned NPCI subsidiary, to launch Banking Connect in Mumbai."}, {"id": "q97", "sec": "Banking & Loans", "diff": "Hard", "type": "single", "q": "The Digital India BHASHINI Division (DIBD) signed an MoU with Punjab National Bank to develop multilingual AI solutions for banking under which initiative?", "options": ["Digital Bhasha Setu", "BHASHINI for Seva/Sanchalan", "BHASHINI
