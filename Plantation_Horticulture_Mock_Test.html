<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARD Mock — Plantation & Horticulture Crops</title>
<style>
:root{
  --bg: #0f1613;
  --bg-raised: #161f1b;
  --bg-card: #1b2621;
  --border: #2a3833;
  --border-soft: #223029;
  --text: #eef1ec;
  --text-dim: #a9b6ae;
  --text-faint: #74827b;
  --gold: #d3a24c;
  --gold-dim: #a5813d;
  --green: #6fae7c;
  --green-bg: #1c3324;
  --red: #d97a6c;
  --red-bg: #3a2420;
  --serif: "Source Serif Pro", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(211,162,76,0.07), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(111,174,124,0.06), transparent 55%);
  color: var(--text);
  font-family: var(--sans);
  min-height:100vh;
  line-height:1.5;
}
.app{ max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }
.brandline{
  display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom: 22px; padding-bottom:14px; border-bottom:1px solid var(--border-soft);
}
.brandline .mark{ font-family:var(--serif); font-size:15px; color:var(--gold); letter-spacing:.02em;}
.brandline .meta{ font-size:12px; color:var(--text-faint); }

/* ---------- Home ---------- */
.hero{ margin-bottom: 28px; }
.hero h1{
  font-family: var(--serif); font-weight:600; font-size: 30px; line-height:1.22;
  margin: 0 0 10px; color:var(--text);
}
.hero h1 em{ font-style: italic; color: var(--gold); }
.hero p{ color: var(--text-dim); font-size:15px; max-width:56ch; margin:0; }
.notebox{
  margin-top:16px; padding:12px 14px; border:1px solid var(--border); border-radius:10px;
  background: var(--bg-raised); font-size:13px; color: var(--text-dim);
}
.notebox b{ color: var(--gold); font-weight:600; }

.modes{ display:flex; flex-direction:column; gap:12px; margin-top:22px; }
.mode-card{
  border:1px solid var(--border); background: var(--bg-card); border-radius:14px;
  padding:18px 20px; cursor:pointer; transition: border-color .15s ease, transform .1s ease;
  position:relative;
}
.mode-card:hover{ border-color: var(--gold-dim); }
.mode-card:active{ transform: scale(0.995); }
.mode-card .num{
  font-family: var(--serif); font-size:13px; color: var(--text-faint); margin-bottom:6px; display:block;
}
.mode-card h3{ margin:0 0 6px; font-size:17px; font-weight:600; }
.mode-card p{ margin:0; color: var(--text-dim); font-size:13.5px; }
.mode-card .count{ color: var(--gold); font-weight:600; }
.mode-card .arrow{ position:absolute; right:20px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:18px;}

.toggle-row{ display:flex; gap:8px; margin: 6px 0 4px; }
.toggle-btn{
  flex:1; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
  background: var(--bg-raised); color: var(--text-dim); font-size:13px; cursor:pointer; font-family:var(--sans);
}
.toggle-btn.active{ background: var(--gold); color:#1b1406; border-color:var(--gold); font-weight:600; }

/* ---------- Section grid ---------- */
.backlink{ color: var(--text-dim); font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-bottom:16px; }
.backlink:hover{ color: var(--gold); }
.section-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
@media (max-width:520px){ .section-grid{ grid-template-columns: 1fr; } }
.sec-card{
  border:1px solid var(--border); background: var(--bg-card); border-radius:12px;
  padding:14px 16px; cursor:pointer;
}
.sec-card:hover{ border-color: var(--gold-dim); }
.sec-card .t{ font-size:14px; font-weight:600; margin-bottom:4px; }
.sec-card .c{ font-size:12px; color: var(--text-faint); }

/* ---------- Quiz screen ---------- */
.quiz-header{ margin-bottom:18px; }
.progress-row{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-dim); margin-bottom:8px; }
.progress-track{ height:6px; border-radius:4px; background: var(--bg-raised); overflow:hidden; border:1px solid var(--border-soft);}
.progress-fill{ height:100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); transition: width .25s ease; }
.score-pill{ font-size:12.5px; color: var(--text-dim); }
.score-pill b{ color: var(--green); }

.q-meta{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.tag{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:99px; border:1px solid var(--border); color:var(--text-faint); }
.tag.diff-Easy{ color:#8fbf9a; border-color:#2c4a34; }
.tag.diff-Moderate{ color:#d3a24c; border-color:#4a3b21; }
.tag.diff-Hard{ color:#d97a6c; border-color:#4a2c26; }

.passage{
  font-family: var(--serif); font-size:15.5px; line-height:1.65; color:var(--text-dim);
  background: var(--bg-raised); border-left:3px solid var(--gold-dim); border-radius: 4px 10px 10px 4px;
  padding:16px 18px; margin-bottom:16px;
}
.passage .label{ display:block; font-family:var(--sans); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); margin-bottom:8px; font-weight:600;}

.question{ font-size:17px; font-weight:500; line-height:1.5; margin-bottom:18px; white-space:pre-line; }

.options{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
.opt{
  display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  padding:13px 15px; border-radius:11px; border:1px solid var(--border); background: var(--bg-card);
  color: var(--text); font-family: var(--sans); font-size:14.5px; cursor:pointer; line-height:1.45;
}
.opt:hover:not(:disabled){ border-color: var(--gold-dim); }
.opt .letter{
  flex:0 0 auto; width:24px; height:24px; border-radius:7px; background: var(--bg-raised);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-dim);
  border:1px solid var(--border);
}
.opt.correct{ background: var(--green-bg); border-color: var(--green); }
.opt.correct .letter{ background: var(--green); color:#0d1a10; border-color:var(--green); }
.opt.wrong{ background: var(--red-bg); border-color: var(--red); }
.opt.wrong .letter{ background: var(--red); color:#2a0e08; border-color:var(--red); }
.opt:disabled{ cursor:default; opacity: .92; }
.opt.dim{ opacity:.55; }

.explain{
  background: var(--bg-raised); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; font-size:13.5px; color: var(--text-dim); margin-bottom:16px; line-height:1.55;
}
.explain b{ color: var(--text); }
.explain .verdict{ font-weight:700; margin-right:6px; }
.explain .verdict.ok{ color: var(--green); }
.explain .verdict.no{ color: var(--red); }
.explain .verdict.skip{ color: var(--text-faint); }

.controls{ display:flex; justify-content:space-between; gap:10px; }
.btn{
  padding:11px 18px; border-radius:10px; border:1px solid var(--border); background: var(--bg-card);
  color: var(--text); font-family: var(--sans); font-size:14px; cursor:pointer; font-weight:600;
}
.btn.primary{ background: var(--gold); color:#1b1406; border-color:var(--gold); }
.btn.primary:hover{ background:#e0b15c; }
.btn.ghost{ background:transparent; color: var(--text-dim); }
.btn.ghost:hover{ color: var(--text); }
.btn:disabled{ opacity:.4; cursor:default; }

/* ---------- End screen ---------- */
.end-score{ text-align:center; margin: 10px 0 24px; }
.end-score .big{ font-family: var(--serif); font-size:52px; color: var(--gold); font-weight:600; }
.end-score .sub{ color: var(--text-dim); font-size:14px; margin-top:4px; }
.breakdown{ display:flex; gap:10px; margin-bottom:24px; }
.bd-card{ flex:1; border:1px solid var(--border); background: var(--bg-card); border-radius:12px; padding:14px; text-align:center; }
.bd-card .n{ font-size:20px; font-weight:700; }
.bd-card .l{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
.end-actions{ display:flex; gap:10px; margin-bottom:26px; }
.end-actions .btn{ flex:1; text-align:center; }

.review-item{ border:1px solid var(--border); background: var(--bg-card); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.review-item .rq{ font-size:14px; font-weight:600; margin-bottom:8px; }
.review-item .ra{ font-size:13px; color: var(--text-dim); margin-bottom:6px; }
.review-item .ra.correct-line{ color: var(--green); }
.review-item .ra.wrong-line{ color: var(--red); text-decoration: line-through; text-decoration-color: rgba(217,122,108,.5); }
.review-item .rexp{ font-size:12.5px; color: var(--text-faint); margin-top:8px; padding-top:8px; border-top:1px dashed var(--border-soft); }
.review-toggle{ font-size:13px; color:var(--gold); cursor:pointer; text-align:center; margin: 6px 0 20px; }
.review-list{ display:none; }
.review-list.open{ display:block; }

.empty-hint{ text-align:center; color:var(--text-faint); font-size:13px; padding: 30px 0; }

@media (max-width:480px){
  .hero h1{ font-size:25px; }
  .end-score .big{ font-size:42px; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const QUESTIONS = [{"id": 1, "section": "Horticulture Basics & Spices", "difficulty": "Easy", "type": "recall", "passage": null, "q": "The term 'Horticulture' is derived from the Latin words 'hortus' and 'cultura', meaning respectively:", "options": ["Orchard and science", "Garden and harvest", "Fruit and cultivation", "Garden and cultivation", "Field and cultivation"], "correct": 3, "exp": "Horticulture = hortus (garden) + cultura (cultivation) — the science and technique of production, processing and merchandising of fruits, vegetables, flowers, spices etc."}, {"id": 2, "section": "Horticulture Basics & Spices", "difficulty": "Easy", "type": "passage", "passage": "Food ingredients mainly used to season a food dish during its preparation include cinnamon, mace, mustard, black pepper, cloves, saffron, fennel, turmeric, ginger, curry powder, chilli powder, salt and galingale. These are distinguished from products such as compound butter, barbecue sauce, teriyaki sauce, ketchup and mayonnaise, which are mainly used at the dining table to enhance a dish.", "q": "________ is defined as food ingredients mainly used to season a food dish during its preparation (e.g. cinnamon, mace, mustard, black pepper, cloves, saffron), as distinct from products used mainly at the dining table to enhance a dish.", "options": ["Condiments", "Herbs", "Garnishes", "Spices"], "correct": 3, "exp": "Spices season food during preparation, while condiments (compound butter, ketchup, mayonnaise, mustard sauce) are used at the table."}, {"id": 3, "section": "Horticulture Basics & Spices", "difficulty": "Moderate", "type": "passage", "passage": "Food ingredients mainly used to season a food dish during its preparation include cinnamon, mace, mustard, black pepper, cloves, saffron, fennel, turmeric, ginger, curry powder, chilli powder, salt and galingale. These are distinguished from products such as compound butter, barbecue sauce, teriyaki sauce, ketchup and mayonnaise, which are mainly used at the dining table to enhance a dish.", "q": "Which of the following is true regarding the paragraph above?", "options": ["Both categories are used only at the dining table", "Condiments are used during cooking, spices at the table", "Spices season food during preparation while the table-use category enhances the dish at serving time", "There is no distinction between the two categories"], "correct": 2, "exp": "The passage distinguishes spices (used during preparation) from condiments (used at the table)."}, {"id": 4, "section": "Horticulture Basics & Spices", "difficulty": "Easy", "type": "recall", "passage": null, "q": "The term 'spice' originally derives from the Latin phrase meaning:", "options": ["Fruits of the earth", "Gift of the soil", "Seeds of the field", "Aroma of plants"], "correct": 0, "exp": "'Spice' derives from Latin 'species aromatase', meaning fruits of the earth."}, {"id": 5, "section": "Horticulture Basics & Spices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Cinnamon, cardamom, allspice and cloves are spices obtained respectively from which plant parts?", "options": ["Root, leaf, fruit, seed", "Stem, bark, fruit, leaf", "Bark, root, leaf, stigma", "Bark, seed pod, dried berry, dried flower buds", "Rhizome, seed, fruit, bud"], "correct": 3, "exp": "Cinnamon = bark; cardamom = seed pod; allspice (Jamaica pepper) = dried berry; cloves = dried flower buds."}, {"id": 6, "section": "Horticulture Basics & Spices", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Among fruits and vegetables listed for micronutrient content, which combination correctly matches a nutrient with its richest source in the chapter's comparison table?", "options": ["Vitamin C — Barbados cherry (2000 mg/100g)", "Iron — Litchi (0.21%)", "Vitamin A — Mango (11,300 IU/100g)", "Calcium — Cashew nut (21.2%)"], "correct": 0, "exp": "Barbados cherry has about 2000 mg Vitamin C per 100g among fruits (vs. Aonla ~600 mg/100g); Bathua leaves (11,300 IU/100g) is the vegetable source of Vitamin A, not mango."}, {"id": 7, "section": "Horticulture Basics & Spices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Among vegetables, which has the highest listed source of Vitamin A (Retinol) per the chapter's nutrient table?", "options": ["Coriander leaves (135 mg/100g)", "Amaranthus (22.9%)", "Bathua leaves (11,300 IU/100g)", "Fenugreek leaves"], "correct": 2, "exp": "Bathua leaves are listed with 11,300 IU/100g of Vitamin A, the highest vegetable source cited."}, {"id": 8, "section": "Plantation Crops", "difficulty": "Easy", "type": "passage", "passage": "A group of commercial crops of perennial nature, cultivated extensively in tropical and subtropical situations, which need employment of labour throughout the year and the produce of which is usually consumed after processing, is called ________.", "q": "________ refers to a group of commercial crops of perennial nature, cultivated extensively in tropical and subtropical situations, which need employment of labour throughout the year and whose produce is usually consumed after processing.", "options": ["Horticultural crops", "Field crops", "Cash crops", "Plantation crops"], "correct": 3, "exp": "Plantation crops are perennial commercial crops needing year-round labour, with produce usually processed before consumption (e.g. tea, coffee, rubber)."}, {"id": 9, "section": "Plantation Crops", "difficulty": "Moderate", "type": "stmt", "passage": null, "q": "Consider the following statements about plantation crops:\n1. They are of perennial nature.\n2. They are cultivated mainly in temperate regions.\n3. They require labour employment throughout the year.\n4. Their produce is generally consumed fresh, without processing.\nWhich of the statements given above are correct?", "options": ["2 and 4", "1 and 3", "1, 2 and 3", "1, 3 and 4", "All of the above"], "correct": 1, "exp": "Plantation crops are perennial (1) and need year-round labour (3), but they are cultivated in tropical/subtropical (not temperate) regions and their produce is usually consumed after processing, not fresh."}, {"id": 10, "section": "Fruit Classification – Climatic Adaptability", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Fruits are broadly classified on the basis of temperature requirement into temperate, subtropical and which third category?", "options": ["Semi-arid", "Alpine", "Tropical", "Arid"], "correct": 2, "exp": "The three broad climatic categories for fruits are temperate, subtropical and tropical (tropical is further divided into central, southern and coastal tropical zones)."}, {"id": 11, "section": "Fruit Classification – Climatic Adaptability", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which fruit is specifically mentioned in the chapter as being grown under BOTH tropical and subtropical climates?", "options": ["Litchi", "Mango", "Banana", "Apple"], "correct": 1, "exp": "The chapter notes mango is grown under both tropical and subtropical climates, while grape and peach can be grown in both temperate and subtropical regions."}, {"id": 12, "section": "Fruit Classification – Climatic Adaptability", "difficulty": "Easy", "type": "passage", "passage": "Vegetative and flower buds of most fruits of this zone enter into dormancy in late summer or autumn and require a substantial amount of winter cold before they can resume growth in the following spring. These fruit plants are frost-hardy and even tolerant to snowfall and ice. In India, this climatic environment occurs at sufficiently high elevations. Examples include apple, almond, peach, pear, plum, strawberry, apricot, persimmon, cherimoya, pecan nut, walnut, hazelnut, cherry, pistachio and kiwifruit.", "q": "Fruits of this climatic zone enter dormancy of vegetative and flower buds in late summer or autumn, require substantial winter chilling to resume growth in spring, and are frost-hardy, even tolerant to snowfall and ice. Examples include apple, almond, peach, pear, plum, strawberry and walnut.", "options": ["Arid zone fruits", "Temperate zone fruits", "Subtropical zone fruits", "Tropical zone fruits"], "correct": 1, "exp": "This description precisely matches temperate zone fruit crops, which need winter chilling and are frost-hardy."}, {"id": 13, "section": "Fruit Classification – Climatic Adaptability", "difficulty": "Moderate", "type": "passage", "passage": "Vegetative and flower buds of most fruits of this zone enter into dormancy in late summer or autumn and require a substantial amount of winter cold before they can resume growth in the following spring. These fruit plants are frost-hardy and even tolerant to snowfall and ice. In India, this climatic environment occurs at sufficiently high elevations. Examples include apple, almond, peach, pear, plum, strawberry, apricot, persimmon, cherimoya, pecan nut, walnut, hazelnut, cherry, pistachio and kiwifruit.", "q": "Which of the following is/are true according to the paragraph above?", "options": ["These crops have no winter chilling requirement", "Light frost may occur but has no significant effect", "These fruit crops are frost-hardy and can tolerate snowfall and ice", "These crops occur only at low elevations in India"], "correct": 2, "exp": "The passage explicitly states these (temperate) fruits are frost-hardy, tolerant to snowfall and ice, and occur at high elevations in India."}, {"id": 14, "section": "Fruit Classification – Climatic Adaptability", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The fruit crops grown under climatic conditions between temperate and tropical, having no distinct rest period and no marked photoperiodic requirement (e.g., grape, citrus, durian, jackfruit) are classified as:", "options": ["Tropical zone fruits", "Subtropical zone fruits", "Temperate zone fruits", "Arid zone fruits"], "correct": 1, "exp": "Subtropical fruit crops experience only brief chilling (if any), have no distinct rest period, and show no marked photoperiodic requirement."}, {"id": 15, "section": "Fruit Classification – Climatic Adaptability", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Approximately what area does the hot, arid zone of India cover, spanning Rajasthan, Gujarat, Andhra Pradesh/Telangana, Punjab, Haryana, Karnataka and Maharashtra?", "options": ["Over 2.0 lakh sq. km", "Over 1.5 lakh sq. km", "Over 5.0 lakh sq. km", "Over 3.2 lakh sq. km", "Over 70,300 sq. km"], "correct": 3, "exp": "The chapter states the hot arid zone covers over 3.2 lakh sq. km, while the cold arid zone of Ladakh covers about 70,300 sq. km."}, {"id": 16, "section": "Fruit Classification – Climatic Adaptability", "difficulty": "Moderate", "type": "stmt", "passage": null, "q": "Consider the following statements about fruit growing regions of India:\n1. The Temperate zone includes Jammu & Kashmir, Himachal Pradesh and the Nilgiri hills.\n2. The North Western subtropical zone includes Bihar, Assam and Meghalaya.\n3. The Coastal tropical humid zone includes the coasts of Maharashtra, Kerala and Andhra Pradesh.\n4. The Southern tropical zone lies entirely within Jammu & Kashmir.\nWhich of the statements given above are correct?", "options": ["3 and 4", "1, 2 and 3", "1 and 2", "2 and 4", "1 and 3"], "correct": 4, "exp": "Statement 1 and 3 are correct as per the chapter's list of fruit growing regions. Bihar, Assam and Meghalaya actually fall under the North Eastern (not North Western) subtropical zone, and the Southern tropical zone covers parts of Karnataka, AP, TN and Kerala, not J&K."}, {"id": 17, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Easy", "type": "recall", "passage": null, "q": "When a single fruit develops from a single ovary of a single flower (e.g. banana, papaya, grapes), it is classified as a:", "options": ["Simple fruit", "Aggregate fruit", "Accessory fruit", "Composite/multiple fruit"], "correct": 0, "exp": "A simple fruit develops from a single ovary of a single flower."}, {"id": 18, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Simple fruits are further divided into which two broad types based on the nature of the pericarp?", "options": ["Dry fruits and succulent (fleshy) fruits", "Climacteric and non-climacteric fruits", "Dehiscent and aggregate fruits", "Drupe and pome fruits"], "correct": 0, "exp": "Simple fruits are of two types: dry fruits (pericarp not differentiated into 3 layers) and succulent/fleshy fruits (pericarp differentiated into epicarp, mesocarp, endocarp)."}, {"id": 19, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Hard", "type": "recall", "passage": null, "q": "In dehiscent (capsular) dry fruits, the type where the ovary splits along two seams with seeds borne on only one half of the split ovary (e.g. pea, bean, peanut) is called a:", "options": ["Legume", "Follicle", "Silique", "Capsule"], "correct": 0, "exp": "A legume splits along two seams with seeds attached to only one half; a follicle splits from only one side (columbine, milkweed, larkspur, magnolia)."}, {"id": 20, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The dehiscence type in which seeds are attached to a central structure, as seen in radish and mustard, is termed:", "options": ["Legume", "Pyxis", "Follicle", "Silique or silicula"], "correct": 3, "exp": "Silique/silicula: seeds attached to a central structure, as in radish (Raphanus sativus) and mustard (Brassica campestris)."}, {"id": 21, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Which type of capsule dehiscence gives the fruit the appearance of a lid coming off a box of seeds, as in Celosia (cock's comb) and Amaranthus?", "options": ["Loculicidal", "Porocidal", "Septicidal", "Pyxis"], "correct": 3, "exp": "Pyxis dehiscence is transverse, so the top comes off as a lid — seen in Celosia and Amaranthus."}, {"id": 22, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "In Poppy (Papaver), the capsule dehiscence occurs through small openings near the top of the fruit. This type of dehiscence is called:", "options": ["Septicidal", "Porocidal", "Loculicidal", "Pyxis"], "correct": 1, "exp": "Porocidal dehiscence occurs through pores, as in poppy."}, {"id": 23, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Indehiscent fruits with a hard, stony pericarp (exocarp+mesocarp+endocarp) that must be cracked to reach the seed, as in chestnut and hazelnut, are called:", "options": ["Nuts", "Caryopses", "Samaras", "Achenes"], "correct": 0, "exp": "Such stony-walled indehiscent fruits are termed nuts."}, {"id": 24, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "A small, one-seeded, indehiscent fruit in which the pericarp is free from the seed coat (typical of the sunflower and buttercup families) is called:", "options": ["Achene", "Caryopsis", "Samara", "Lomentum"], "correct": 0, "exp": "An achene has a pericarp free from the seed coat, typical of Asteraceae and Ranunculaceae."}, {"id": 25, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "In cereal grains (Poaceae), the seed is fully fused to the pericarp, unlike in an achene. This fruit type is called:", "options": ["Follicle", "Samara", "Achene", "Caryopsis (grain)"], "correct": 3, "exp": "Caryopsis/grain: seed fully fused to the pericarp, characteristic of the grass family."}, {"id": 26, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The winged, one-seeded schizocarpic fruit type found in maple, ash and elm is known as a:", "options": ["Caryopsis", "Achene", "Samara", "Lomentum"], "correct": 2, "exp": "A samara has a winged pericarp, seen in maple, ash and elm; some botanists classify it as a type of schizocarp."}, {"id": 27, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The fruit type found in Mimosoideae (e.g. Mimosa, Acacia, Tamarind), which is constricted/divided into one-seeded mericarps that separate after maturity, is called:", "options": ["Pome", "Silique", "Samara", "Lomentum"], "correct": 3, "exp": "Lomentum develops like a legume but is constricted into one-seeded mericarps that separate after maturity."}, {"id": 28, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Mango, coconut, peach and almond are classic examples of which type of succulent fruit, also called a stone fruit?", "options": ["Pome", "Berry", "Pepo", "Drupe"], "correct": 3, "exp": "A drupe has epicarp (skin), fleshy mesocarp, and a stony endocarp — hence 'stone fruit'. Examples: mango, coconut, peach, almond."}, {"id": 29, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "In coconut, which part of the drupe is the fibrous edible husk, and which part is the actual hard 'shell' we see?", "options": ["Mesocarp is fibrous; endocarp is the hard edible-bearing shell", "Epicarp is fibrous; mesocarp is the hard shell", "Endocarp is fibrous; mesocarp is the hard shell", "Epicarp is the hard shell; endocarp is fibrous"], "correct": 0, "exp": "In coconut, mesocarp is fibrous (coir) and the endocarp is the hard stony shell; the edible copra lies within the endocarp."}, {"id": 30, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "A simple, fleshy but 'false' fruit surrounded by a fleshy thalamus (receptacle tissue) with the actual fruit lying within, exemplified by apple, pear and quince, is called a:", "options": ["Drupe", "Pome", "Hesperidium", "Berry"], "correct": 1, "exp": "Pome: false fruit where most of the fleshy part is receptacle tissue; family Rosaceae; examples apple, pear, quince."}, {"id": 31, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "A berry with a leathery, oil-containing exocarp/skin, typical of citrus fruits like orange, lemon and grapefruit, is specifically termed a:", "options": ["Amphisarca", "Balusta", "Pepo", "Hesperidium"], "correct": 3, "exp": "Hesperidium is the citrus-type berry with a leathery, oil-bearing rind."}, {"id": 32, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "A berry with a hard rind, as in watermelon, cucumber and pumpkin, is termed a:", "options": ["Amphisarca", "Hesperidium", "Balusta", "Pepo"], "correct": 3, "exp": "Pepo: rind-bearing berry seen in cucurbits (watermelon, cucumber, pumpkin)."}, {"id": 33, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Hard", "type": "recall", "passage": null, "q": "A hard-rinded fruit with a succulent interior and a crustaceous/woody exterior, exemplified by Bael and Wood apple, is a variant berry called:", "options": ["Amphisarca", "Balusta", "Pepo", "Hesperidium"], "correct": 0, "exp": "Amphisarca: hard woody exterior with succulent interior; example Bael, Wood apple."}, {"id": 34, "section": "Fruit Morphology – Simple, Dry & Fleshy Fruits", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Pomegranate is classified as which special variant of berry, where the epicarp is rough/leathery, mesocarp is papery, and the endocarp is hard, forming irregular seed-enclosing chambers?", "options": ["Balusta", "Hesperidium", "Pepo", "Amphisarca"], "correct": 0, "exp": "Balusta describes the pomegranate's structure: leathery epicarp, papery mesocarp, hard chambered endocarp."}, {"id": 35, "section": "Fruit Morphology – Aggregate & Composite Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Fruits developing from the apocarpous ovaries of a single flower, such that many fruits develop from one flower (e.g. custard apple, raspberry), are called:", "options": ["Simple fruits", "Accessory fruits", "Composite/multiple fruits", "Aggregate fruits"], "correct": 3, "exp": "Aggregate fruits develop from apocarpous (free) ovaries of a single flower — example: custard apple, raspberry."}, {"id": 36, "section": "Fruit Morphology – Aggregate & Composite Fruits", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "A fruit developing from a complete inflorescence, i.e., many flowers producing a single fruit (e.g. fig, jackfruit, pineapple, mulberry), is called a:", "options": ["Simple fruit", "Aggregate fruit", "Composite or multiple fruit", "Drupe"], "correct": 2, "exp": "Composite/multiple fruit: many flowers → single fruit; examples fig, jackfruit, pineapple, mulberry."}, {"id": 37, "section": "Fruit Morphology – Aggregate & Composite Fruits", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements about gynoecium terminology:\n1. Monocarpous refers to a gynoecium with a single carpel.\n2. Apocarpous refers to a gynoecium with multiple carpels fused into a single structure.\n3. Syncarpous refers to a gynoecium with multiple, distinct (unfused) carpels.\n4. Gynoecium is a collective term for the flower parts that develop into fruit and seeds.\nWhich of the statements given above are correct?", "options": ["1, 2 and 4", "3 and 4", "2 and 3", "1 and 4", "1, 2, 3 and 4"], "correct": 3, "exp": "Statement 2 and 3 are swapped: apocarpous = multiple distinct/unfused carpels, syncarpous = multiple carpels fused together. Statements 1 and 4 are correctly stated."}, {"id": 38, "section": "Fruit Ripening, Ethylene & Respiration", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Fruits that continue to ripen after being removed from the plant, producing large amounts of ethylene as they do so (e.g. banana, apple, peach), are called:", "options": ["Orthodox fruits", "Recalcitrant fruits", "Non-climacteric fruits", "Climacteric fruits"], "correct": 3, "exp": "Climacteric fruits ripen after harvest and produce much larger amounts of ethylene than non-climacteric fruits."}, {"id": 39, "section": "Fruit Ripening, Ethylene & Respiration", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which of the following is listed as a NON-climacteric fruit in the chapter?", "options": ["Banana", "Mango", "Guava", "Cashew"], "correct": 3, "exp": "Non-climacteric fruits listed: Ber, Jamun, Cashew, Cherry and Strawberry. Mango, banana and guava are climacteric."}, {"id": 40, "section": "Fruit Ripening, Ethylene & Respiration", "difficulty": "Hard", "type": "figure", "passage": null, "q": "According to the chapter's ethylene-production classification, which crop group falls in the 'Very high' class (>100 µL C2H4/kg/hr), with passion fruit showing the highest recorded production?", "options": ["Apple and papaya", "Banana and mango", "Passion fruit and sapota", "Grape and citrus"], "correct": 2, "exp": "'Very high' class (>100 µL/kg/hr) includes passion fruit and sapota; passion fruit shows the highest ethylene production at 466–530 µL/L."}, {"id": 41, "section": "Fruit Ripening, Ethylene & Respiration", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Grape and citrus fall under which ethylene-production class, with values less than 0.1 µL C2H4/kg/hr?", "options": ["Low", "High", "Very low", "Medium"], "correct": 2, "exp": "Grape and citrus are 'Very Low' ethylene producers (<0.1 µL/kg/hr)."}, {"id": 42, "section": "Fruit Ripening, Ethylene & Respiration", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements on rate of respiration in harvested produce:\n1. Nuts and dried fruits fall in the 'Very Low' respiration class, releasing under 5 mg CO2.\n2. Strawberry and avocado fall in the 'High' respiration class (20–40 mg CO2).\n3. For every 10°C rise in temperature, the respiration rate roughly doubles or triples.\n4. Non-climacteric fruits show a sharp rise in respiration immediately after harvest.\nWhich of the statements given above are correct?", "options": ["1, 2 and 3", "2 and 4 only", "1, 3 and 4", "1 and 3 only", "All of the above"], "correct": 0, "exp": "Statement 4 is incorrect — it is climacteric fruits that show a sharp rise in respiration after harvest; non-climacteric fruits show steady respiration."}, {"id": 43, "section": "Fruit Ripening, Ethylene & Respiration", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "Snap melon, which shows the 'Very High' rate of respiration among fruits, releases CO2 in which range?", "options": ["5–10 mg", "40–60 mg", "10–20 mg", "20–40 mg", "<5 mg"], "correct": 1, "exp": "Very High respiration rate (example: snap melon) corresponds to 40–60 mg CO2 release."}, {"id": 44, "section": "Fruit Classification – Photoperiod, Salt Tolerance & Acids", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Strawberry, pineapple and coffee are examples of fruits classified under which photoperiod-response category?", "options": ["Short day plants", "Photo-insensitive plants", "Long day plants", "Day neutral plants"], "correct": 0, "exp": "Strawberry, pineapple and coffee are short day plants, per the chapter's photoperiod classification of fruits."}, {"id": 45, "section": "Fruit Classification – Photoperiod, Salt Tolerance & Acids", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which fruit crop is listed as 'highly sensitive' to salt among the salt-tolerance classification?", "options": ["Strawberry", "Ber", "Guava", "Date palm"], "correct": 0, "exp": "Strawberry is listed as highly sensitive to salt; Date palm, Ber, Amla, Pomegranate, Cashew, Fig, Jamun, Guava, Coconut and Khirni are highly tolerant."}, {"id": 46, "section": "Fruit Classification – Photoperiod, Salt Tolerance & Acids", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Apple, banana, cherry, plum and melon are grouped together because they are relatively rich in which organic acid, as per the chapter's classification of fruits by acid content?", "options": ["Oxalic acid", "Citric acid", "Tartaric acid", "Malic acid"], "correct": 3, "exp": "Malic acid group includes apple, banana, cherry, plum and melon, while citric acid group includes berries, citrus, guava, pear and pineapple."}, {"id": 47, "section": "Vegetable Classification – Edible Part & Culture", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Potato is technically considered which type of vegetable, since it grows on underground stems known as stolons, even though it is popularly thought of as a root?", "options": ["Stem vegetable (tuber)", "Root vegetable", "Bulb vegetable", "Rhizome vegetable"], "correct": 0, "exp": "Potato is a stem vegetable/tuber, growing on underground stems (stolons), not true roots."}, {"id": 48, "section": "Vegetable Classification – Edible Part & Culture", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Onion, garlic, shallot, leek and chives are all examples of which category of vegetable, based on edible plant part?", "options": ["Corms", "Rhizomes", "Tubers", "Bulbs"], "correct": 3, "exp": "Bulbs consist of a short stem surrounded by fleshy scale leaves; examples include onion, garlic, shallot, leek and chives."}, {"id": 49, "section": "Vegetable Classification – Edible Part & Culture", "difficulty": "Moderate", "type": "passage", "passage": "This category of vegetables is generally a storage organ, enlarged to store energy in the form of carbohydrates. Examples of this category include carrots, beet root, turnips, celeriac and radish.", "q": "________ vegetables are generally storage organs enlarged to store energy in the form of carbohydrates, with carrot, beetroot, turnip, celeriac and radish as examples.", "options": ["Stem", "Root", "Tuber", "Bulb"], "correct": 1, "exp": "Root vegetables are storage organs for carbohydrates — carrot, beet root, turnips, celeriac, radish."}, {"id": 50, "section": "Vegetable Classification – Edible Part & Culture", "difficulty": "Moderate", "type": "passage", "passage": "This category of vegetables is generally a storage organ, enlarged to store energy in the form of carbohydrates. Examples of this category include carrots, beet root, turnips, celeriac and radish.", "q": "Which of the following statements about the paragraph's category is correct?", "options": ["These vegetables develop from apocarpous ovaries", "These vegetables are modified underground stems with scale leaves", "These vegetables are enlarged storage organs holding carbohydrate reserves", "These vegetables require long-day photoperiods to form"], "correct": 2, "exp": "The passage describes root vegetables as enlarged storage organs for carbohydrates — matching only the first option; bulbs (not roots) have scale leaves and modified stems."}, {"id": 51, "section": "Vegetable Classification – Edible Part & Culture", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Cauliflower, artichoke and broccoli are vegetables in which category of the classification based on economic/edible part?", "options": ["Flowers", "Fruits", "Leaves", "Stems"], "correct": 0, "exp": "Cauliflower, artichoke and broccoli are classified under 'flower vegetables' since their flowers are eaten."}, {"id": 52, "section": "Vegetable Classification – Edible Part & Culture", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Eggplant, cucumber, tomato, squash and avocado are technically fruits but classified as vegetables in culinary use. Under the chapter's classification, which category do they belong to?", "options": ["Seeds", "Roots", "Stems", "Fruits (vegetable-fruits)"], "correct": 3, "exp": "These are technically fruits (pulpy, seed-rich bodies growing on shrub/vine) but used as vegetables."}, {"id": 53, "section": "Vegetable Classification – Edible Part & Culture", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements on classification of vegetables by type of culture:\n1. Cole crops include cabbage, cauliflower, broccoli and Brussels sprout.\n2. Solanaceous crops include tomato, brinjal, chilli and pepper.\n3. Bulb crops include potato, sweet potato and cassava.\n4. Perennial vegetables include asparagus, artichoke, moringa and ivy gourd.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 3 and 4", "All of the above", "1, 2 and 4", "1 and 2 only"], "correct": 3, "exp": "Statement 3 is incorrect — potato, sweet potato and cassava belong to 'tuber crops', not 'bulb crops' (bulb crops are onion, leek, garlic, shallot, welsh onion, chive)."}, {"id": 54, "section": "Vegetable Classification – Lifecycle, Thermal & Photoperiod", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Cabbage, cauliflower, turnip and carrot complete their life cycle in how many seasons, classifying them as biennial vegetables?", "options": ["Two seasons", "More than three seasons", "One season", "Three seasons"], "correct": 0, "exp": "Biennial vegetables like cabbage, cauliflower, turnip and carrot complete their lifecycle in two seasons (though the chapter text has a minor internal inconsistency describing it as 'one season')."}, {"id": 55, "section": "Vegetable Classification – Lifecycle, Thermal & Photoperiod", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Artichoke, chicory, asparagus and chow chow, which complete their life cycle over more than two seasons, are classified as:", "options": ["Annual vegetables", "Semi-perennial vegetables", "Biennial vegetables", "Perennial vegetables"], "correct": 3, "exp": "Perennial vegetables complete their life cycle in more than two seasons — examples: artichoke, chicory, asparagus, chow chow, coccinia."}, {"id": 56, "section": "Vegetable Classification – Lifecycle, Thermal & Photoperiod", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "Cool season vegetable crops grow best when the monthly mean temperature does not exceed what value?", "options": ["18°C", "15°C", "25°C", "21°C"], "correct": 3, "exp": "Cool season crops grow well when monthly mean temperature does not exceed 21°C, thriving best at 15–18°C."}, {"id": 57, "section": "Vegetable Classification – Lifecycle, Thermal & Photoperiod", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Among the following, which pair of crops is classified as cool season crops even though they belong to the fruit-vegetable ('warm season') edible category?", "options": ["Corn and shallot", "Okra and eggplant", "Tomato and brinjal", "Pea and broad bean"], "correct": 3, "exp": "Pea and broad bean are exceptions — cool season crops despite the general rule that fruit-type vegetables are warm season."}, {"id": 58, "section": "Vegetable Classification – Lifecycle, Thermal & Photoperiod", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Tomato, brinjal, chilli and okra are examples of which photoperiod category of vegetables — plants that flower regardless of day length?", "options": ["Day neutral crops", "Short day plants", "Facultative long-day plants", "Long day plants"], "correct": 0, "exp": "Tomato, brinjal, chilli, okra, french bean, cowpea, sweet pepper and cucurbits are day-neutral crops."}, {"id": 59, "section": "Vegetable Classification – Lifecycle, Thermal & Photoperiod", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Potato, cabbage, cauliflower, radish, lettuce and spinach are examples of which photoperiod category among vegetables?", "options": ["Short day plants", "Long day plants", "Photoperiod-insensitive plants", "Day neutral plants"], "correct": 1, "exp": "These are long-day vegetable plants that bloom when receiving more than 12 hours of light."}, {"id": 60, "section": "Vegetable Classification – Season & Raising Method", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Cruciferous vegetables, carrot, radish, beetroot, onion, garlic and peas are typical examples of which seasonal group in North Indian plains?", "options": ["Summer season crops", "Rainy season crops", "Mild winter crops", "Winter season crops"], "correct": 3, "exp": "Winter season crops (October–January) include cruciferous vegetables, carrot, radish, beetroot, onion, garlic and peas."}, {"id": 61, "section": "Vegetable Classification – Season & Raising Method", "difficulty": "Hard", "type": "recall", "passage": null, "q": "In Kerala's climate, which lacks a distinct winter, vegetable crops are instead grouped into rainy season, mild winter season and which third group?", "options": ["Post-monsoon crops", "Autumn season crops", "Summer season crops", "Spring season crops"], "correct": 2, "exp": "In Kerala's warm humid climate, crops are grouped as rainy season, mild winter season, and summer season crops, since rainy season starts in June and extends to September."}, {"id": 62, "section": "Vegetable Classification – Season & Raising Method", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Tomato, brinjal, chillies, cabbage and cauliflower — first raised in nurseries and later moved to the main field — are examples of vegetables propagated by which method of raising?", "options": ["Bits of tubers and corms", "Transplanted crops", "Direct sown crops", "Vines and cuttings"], "correct": 1, "exp": "Transplanted crops are first raised in nurseries and the seedlings later transplanted to the main field."}, {"id": 63, "section": "Vegetable Classification – Season & Raising Method", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Sweet potato, cassava, pointed gourd and coccinia are propagated using which method of raising vegetable crops?", "options": ["Transplanted crops", "Direct sown crops", "Bits of tubers and corms", "Vines and cuttings"], "correct": 3, "exp": "These crops are raised from stem/vine cuttings."}, {"id": 64, "section": "Vegetable Classification – Hardiness, Respiration, pH, Rooting, Water & Salinity", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Among vegetables classified by hardiness, which group can tolerate frost — for example, asparagus, broccoli, cabbage, garlic and onion?", "options": ["Tender vegetable crops", "Frost-sensitive crops", "Hardy vegetable crops", "Semi-hardy vegetable crops"], "correct": 2, "exp": "Hardy crops tolerate frost (asparagus, broccoli, brussels sprout, cabbage, garlic, knol khol, leek, onion, peas, radish, spinach, turnip)."}, {"id": 65, "section": "Vegetable Classification – Hardiness, Respiration, pH, Rooting, Water & Salinity", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Which of the following vegetables is classified as 'tender' (cannot tolerate frost) in the chapter's hardiness classification?", "options": ["Peas", "Tomato", "Garlic", "Cabbage"], "correct": 1, "exp": "Tomato is listed among tender vegetable crops (along with amaranthus, okra, chilli, cluster bean, cowpea, cucurbits, snap bean, sweet potato, tapioca and yams)."}, {"id": 66, "section": "Vegetable Classification – Hardiness, Respiration, pH, Rooting, Water & Salinity", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Which vegetable is listed as having the 'Very Low' rate of respiration, giving it the longest storage ability, alongside potato and pumpkin?", "options": ["Bean", "Cabbage", "Asparagus", "Onion"], "correct": 3, "exp": "Onion, potato, pumpkin and ashgourd fall in the 'Very low' respiration category, giving them the longest storage ability."}, {"id": 67, "section": "Vegetable Classification – Hardiness, Respiration, pH, Rooting, Water & Salinity", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Potato and sweet potato are grouped under which pH-tolerance class in the chapter's classification of vegetables by soil reaction?", "options": ["Highly tolerant (5.0–5.5 pH)", "Slightly tolerant (6–6.8 pH)", "Moderately tolerant (5.5–6.0 pH)", "Neutral tolerant (7.0 pH)"], "correct": 0, "exp": "Potato, sweet potato, watermelon, chicory and rhubarb are highly tolerant, thriving even at 5.0–5.5 pH."}, {"id": 68, "section": "Vegetable Classification – Hardiness, Respiration, pH, Rooting, Water & Salinity", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Deep-rooted vegetable crops such as artichoke, asparagus, cluster bean and tomato typically develop roots to what depth range?", "options": ["20–30 cm", "50–60 cm", "30–40 cm", "80–100 cm and above"], "correct": 3, "exp": "Deep-rooted crops extend 80–100 cm and above; shallow-rooted crops are 30–40 cm and moderately deep are 50–60 cm."}, {"id": 69, "section": "Vegetable Classification – Hardiness, Respiration, pH, Rooting, Water & Salinity", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Radish and leafy vegetables have which relative water requirement compared to other vegetable groups?", "options": ["Low", "High", "Moderate", "Very low"], "correct": 1, "exp": "Radish and leafy vegetables are classed under 'High' water requirement; watermelon, muskmelon and pumpkin are 'Very Low'."}, {"id": 70, "section": "Vegetable Classification – Hardiness, Respiration, pH, Rooting, Water & Salinity", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Bitter gourd, ash gourd, palak, turnip, lettuce, beetroot and french bean are grouped under which soil-salinity tolerance class for vegetables?", "options": ["Less tolerant", "Highly tolerant", "Very sensitive", "Moderate"], "correct": 1, "exp": "These crops are highly tolerant to soil salinity, while potato, sweet potato, radish, brinjal and peas are 'less tolerant'."}, {"id": 71, "section": "Planting Systems", "difficulty": "Easy", "type": "recall", "passage": null, "q": "In which planting system is plant-to-plant and row-to-row distance the same, with every unit of four plants forming a right-angled unit — the most commonly used and easiest to lay out?", "options": ["Rectangular system", "Square system", "Quincunx system", "Hexagonal system"], "correct": 1, "exp": "The square system is the most commonly used and easiest to lay out; row and plant spacing is equal."}, {"id": 72, "section": "Planting Systems", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "In the hexagonal planting system, six trees form a hexagon with another tree at its centre, accommodating approximately how many more plants than the square system?", "options": ["25 percent more", "100 percent more", "10 percent more", "50 percent more", "15 percent more"], "correct": 4, "exp": "The hexagonal system accommodates about 15% more plants than the square system due to the additional central tree."}, {"id": 73, "section": "Planting Systems", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which planting system is usually followed in hilly areas with high slopes, using bench terraces where the slope exceeds 10 percent?", "options": ["Triangular system", "Contour system", "Rectangular system", "Quincunx system"], "correct": 1, "exp": "The contour system is used in hilly, sloped terrain and resembles the square/rectangular system otherwise; bench terraces are used for slopes greater than 10%."}, {"id": 74, "section": "Planting Systems", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "In which planting system is the number of plants per acre almost doubled compared to the square system, with filler crops like papaya, kinnow, phalsa, guava, peach and plum often planted between the main trees?", "options": ["Hexagonal system", "Quincunx system", "Contour system", "Triangular system"], "correct": 1, "exp": "In the quincunx system, plant density is nearly doubled versus the square system, with fillers like papaya, kinnow, phalsa, guava, peach and plum."}, {"id": 75, "section": "Planting Systems", "difficulty": "Hard", "type": "recall", "passage": null, "q": "In the triangular planting system, plants in the 2nd, 4th, 6th and other alternate rows are planted:", "options": ["At the corners of equilateral triangles around a central tree", "Midway between the plants of the 1st, 3rd, 5th alternate rows", "Directly aligned with the 1st row", "Along contour lines on sloped terrain"], "correct": 1, "exp": "The triangular system offsets alternate rows midway relative to adjacent rows, unlike the hexagonal system (which uses equilateral triangles with a central tree)."}, {"id": 76, "section": "Planting Systems", "difficulty": "Easy", "type": "recall", "passage": null, "q": "In the rectangular planting system, trees are planted at the four corners of rectangles in straight rows running at what angle to each other?", "options": ["45-degree angles", "30-degree angles", "Right angles", "60-degree angles"], "correct": 2, "exp": "In the rectangular system, trees are planted at the corners of rectangles with rows running at right angles, similar to the square system but with unequal plant/row spacing."}, {"id": 77, "section": "Sexual Propagation & Seed Types", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Seed propagation is the ONLY practicable method of propagation for which two crops mentioned in the chapter, since asexual means are not practical for them?", "options": ["Mango and Guava", "Citrus and Jackfruit", "Coconut and Papaya", "Banana and Pineapple"], "correct": 2, "exp": "Coconut and papaya can only be propagated by seed since asexual propagation is not practicable for them."}, {"id": 78, "section": "Sexual Propagation & Seed Types", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which phenomenon, seen in mango, citrus and jamun, refers to the production of two or more embryos from a single seed?", "options": ["Parthenocarpy", "Apomixis", "Vegetative propagation", "Polyembryony"], "correct": 3, "exp": "Polyembryony is the production of two or more embryos from a single seed, seen in mango, citrus, jamun."}, {"id": 79, "section": "Sexual Propagation & Seed Types", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Apomixis, seen in Sikkim crabapple and Chinese crabapple, refers to the asexual formation of a seed from maternal tissue of the ovule, avoiding meiosis and fertilization. What is a key outcome of apomixis for propagation purposes?", "options": ["It only works in vegetatively propagated crops", "It produces heterozygous seedling variation", "It requires cross-pollination", "It produces 'true-to-type' plants"], "correct": 3, "exp": "Apomixis produces true-to-type plants since no meiosis/fertilization occurs, making it useful where asexual propagation is impractical."}, {"id": 80, "section": "Sexual Propagation & Seed Types", "difficulty": "Hard", "type": "passage", "passage": "These seeds can be dried to low moisture content and stored at low temperature without losing their viability for long periods of time; they are also termed desiccation-tolerant seeds. Their lifespan can be prolonged with low moisture content and freezing temperatures. Examples include Citrus aurantifolia, Capsicum annum, guava (Psidium guajava), Cashew (Anacardium occidentale) and most grains and legume types.", "q": "________ are seeds which can be dried to low moisture content and stored at low temperature without losing viability for long periods; they are also termed desiccation-tolerant seeds. Examples include citrus, capsicum, guava and cashew.", "options": ["Recalcitrant seeds", "Hybrid seeds", "Orthodox seeds", "Apomictic seeds"], "correct": 2, "exp": "Orthodox seeds tolerate desiccation and can be stored long-term at low moisture and low temperature."}, {"id": 81, "section": "Sexual Propagation & Seed Types", "difficulty": "Moderate", "type": "passage", "passage": "These seeds can be dried to low moisture content and stored at low temperature without losing their viability for long periods of time; they are also termed desiccation-tolerant seeds. Their lifespan can be prolonged with low moisture content and freezing temperatures. Examples include Citrus aurantifolia, Capsicum annum, guava (Psidium guajava), Cashew (Anacardium occidentale) and most grains and legume types.", "q": "Which of the following best matches a claim made about the seed type in the paragraph above?", "options": ["Their lifespan can be prolonged using low moisture content and freezing temperatures", "They lose viability rapidly below 12–13% moisture content", "They must be propagated vegetatively rather than stored as seed", "They are typically larger than recalcitrant seeds"], "correct": 0, "exp": "The passage states orthodox seed lifespan can be extended with low moisture and freezing temperatures — the opposite (losing viability below 12-13% moisture, larger size, vegetative-only propagation) describes recalcitrant seeds."}, {"id": 82, "section": "Sexual Propagation & Seed Types", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Recalcitrant seeds, such as those of avocado, cacao, coconut, jackfruit, mango and rubber, show drastic loss of viability when moisture content decreases below what level?", "options": ["20 to 25 percent", "12 to 13 percent", "5 to 6 percent", "30 to 35 percent"], "correct": 1, "exp": "Recalcitrant seeds lose viability drastically when moisture drops below 12-13%, and are also generally larger than orthodox seeds."}, {"id": 83, "section": "Sexual Propagation & Seed Types", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements about seedling (sexually propagated) plants:\n1. They are heterozygous in nature and not true-to-type to the mother plant.\n2. They have a short juvenile phase of 3–4 years.\n3. Hybrids can only be developed through sexual (seed) propagation.\n4. Seeds of papaya, mango and citrus retain viability for very long periods after extraction.\nWhich of the statements given above are correct?", "options": ["1, 3 and 4", "All of the above", "2 and 4", "1 and 3", "1, 2 and 3"], "correct": 3, "exp": "Statement 2 is wrong — seedling plants have a LONG juvenile phase (6–10 years), not short. Statement 4 is wrong — seeds of papaya, mango, citrus lose viability quickly and must be sown soon after extraction."}, {"id": 84, "section": "Sexual Propagation & Seed Types", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Which quality is generally true of plants raised from seed compared to asexually propagated plants?", "options": ["Long lived, more tolerant to hostile soil/climate and diseases", "True-to-type with a short juvenile phase", "Guaranteed uniform commercial fruit quality", "Short lived with an early bearing age"], "correct": 0, "exp": "Seedling plants raised from seed tend to be long-lived, tolerant of adverse conditions and diseases, but are heterozygous and slow to bear (long juvenile phase)."}, {"id": 85, "section": "Asexual Propagation – Cuttings", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Among the different kinds of cuttings, which type is most widely used for plant propagation?", "options": ["Bud cuttings", "Root cuttings", "Leaf cuttings", "Stem cuttings"], "correct": 3, "exp": "Stem cuttings are the most widely used type of cutting among all types."}, {"id": 86, "section": "Asexual Propagation – Cuttings", "difficulty": "Moderate", "type": "stmt", "passage": null, "q": "Consider the following statements about the three types of stem cuttings:\n1. Hardwood cuttings are taken from the current year's growth and are typically 25–30 cm with 4–5 nodes.\n2. Semi-hardwood cuttings are about 20 cm long with a pair of leaves at the tip and show brown blotches on a green stem.\n3. Softwood cuttings are 8–10 cm long with a growing tip and leaves at the tip, taken from soft tender shoots.\n4. Hardwood cuttings are typically used for herbs like Bacopa monnieri (Brahmi).\nWhich of the statements given above are correct?", "options": ["1 and 4 only", "1, 2 and 3", "All of the above", "2, 3 and 4", "1 and 2 only"], "correct": 1, "exp": "Statement 4 is incorrect — softwood cuttings (not hardwood) are used for herbs like Bacopa monnieri and Gymnema sylvestre; hardwood cuttings are used for Hibiscus rosa-sinensis, Punica granatum and Lawsonia inermis."}, {"id": 87, "section": "Asexual Propagation – Cuttings", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Root cuttings, where a portion of root is cut from a mother plant and grown to develop its own roots and stems, are used to propagate which examples cited in the chapter?", "options": ["Mulberry and Loquat", "Guava and Grapes", "Rose and Pomegranate", "Ber and Mango"], "correct": 0, "exp": "Root cuttings are exemplified in the chapter by Mulberry and Loquat."}, {"id": 88, "section": "Asexual Propagation – Layering", "difficulty": "Easy", "type": "recall", "passage": null, "q": "In which layering method, an ancient technique originally introduced from China, is a ring of bark removed near the base of a pencil-thick current-year shoot and the exposed wood wrapped in moist rooting medium (like sphagnum moss) covered with polythene?", "options": ["Mound layering", "Serpentine layering", "Air layering", "Simple layering"], "correct": 2, "exp": "Air layering (gootee) involves ring-barking a shoot and wrapping the wound in moist rooting medium under polythene; used in gooseberry, tamarind, litchi, guava, mango."}, {"id": 89, "section": "Asexual Propagation – Layering", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which layering method is considered the easiest and most common, in which a selected flexible one-year-old dormant shoot is bent and pegged down at a location 15–20 cm from the tip, forming a 'U' shape?", "options": ["Simple layering", "Mound (stooling) layering", "Air layering", "Continuous/trench layering"], "correct": 0, "exp": "Simple layering: shoots bent and pegged down 15-20 cm from the tip, forming a 'U' — used for climbing rose, rhododendron."}, {"id": 90, "section": "Asexual Propagation – Layering", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The term 'stooling' for mound layering was first coined by which researcher, and in which year?", "options": ["Lynch, in 1942", "Letham, in 1963", "Thimmann, in 1948", "Skoog and Miller, in 1950"], "correct": 0, "exp": "'Stooling' for mound layering was first coined by Lynch in 1942 (note: Thimmann proposed 'phytohormone' in 1948; Skoog and Miller discovered kinetin in 1950; Letham proposed 'cytokinin' in 1963)."}, {"id": 91, "section": "Asexual Propagation – Layering", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Mound layering (stooling) is commonly used as a method to propagate dwarfing rootstocks for which crop, examples being M-16 and M-25?", "options": ["Mango", "Grapes", "Apple", "Citrus"], "correct": 2, "exp": "Mound layering is used to propagate vigorous rootstocks of apple, such as M-16 and M-25, as well as walnut."}, {"id": 92, "section": "Asexual Propagation – Layering", "difficulty": "Hard", "type": "recall", "passage": null, "q": "In continuous/trench layering, which is used for vigorous rootstocks difficult to propagate otherwise, the parent plant's row is bent to the ground and covered. Shoots then arise from which structures under the soil?", "options": ["Adventitious leaves", "Buried roots only", "Buried buds", "Aerial roots"], "correct": 2, "exp": "In continuous/trench layering, shoots arise from buried buds and roots form under the soil."}, {"id": 93, "section": "Asexual Propagation – Layering", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Which layering method is similar to trench layering but the branch is alternately covered with soil and exposed over its entire length, with each buried section having at least one bud exposed and one covered — used in philodendron, pothos and grapes?", "options": ["Air layering", "Serpentine layering", "Simple layering", "Continuous layering"], "correct": 1, "exp": "Serpentine layering alternately covers/exposes sections along the branch's length; used for heart-leaf philodendron, pothos, wisteria, clematis and grapes."}, {"id": 94, "section": "Asexual Propagation – Grafting", "difficulty": "Easy", "type": "recall", "passage": null, "q": "In grafting terminology, the plant part that receives another plant part is called the stock, while the plant part that provides the desired variety and is joined onto it is called the:", "options": ["Scion", "Rootstock", "Bud patch", "Cambium"], "correct": 0, "exp": "The scion carries the desired variety's qualities; the stock provides the root system."}, {"id": 95, "section": "Asexual Propagation – Grafting", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "In which type of grafting does the graft union occur between two branches while both are still attached and growing on their respective parent plants (used in roses and peaches)?", "options": ["Approach grafting", "Inarch grafting", "Veneer grafting", "Wedge grafting"], "correct": 0, "exp": "Approach grafting: the union is formed while both stock and scion branches are still growing on their parent plants."}, {"id": 96, "section": "Asexual Propagation – Grafting", "difficulty": "Hard", "type": "figure", "passage": null, "q": "In inarch grafting, one-year-old twigs of the scion tree of what approximate length are chosen for the grafting operation?", "options": ["About 100 cm", "About 30 cm", "About 60 cm", "About 20 cm"], "correct": 2, "exp": "Inarch grafting uses scion twigs about 60 cm in length, of similar thickness to the stock; commonly used in mango, guava."}, {"id": 97, "section": "Asexual Propagation – Grafting", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which grafting method is described as a simple process suited for mass-scale commercial propagation, where a downward and inward 30–40 mm cut is made in the stock at about 20 cm height, and is commonly used in mango, fir, maple and pine?", "options": ["Cleft grafting", "Wedge grafting", "Veneer grafting", "Epicotyl grafting"], "correct": 2, "exp": "Veneer grafting is a simple, mass-scale commercial method used in mango, fir, maple and pine."}, {"id": 98, "section": "Asexual Propagation – Grafting", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "Epicotyl/stone grafting, a simple, cheap and quick method of mango propagation, has what typical success rate?", "options": ["60–65 percent", "40–50 percent", "90–95 percent", "75–80 percent"], "correct": 3, "exp": "Epicotyl/stone grafting in mango achieves a success rate of 75-80%, with stones best sown in June-July."}, {"id": 99, "section": "Asexual Propagation – Grafting", "difficulty": "Hard", "type": "figure", "passage": null, "q": "In epicotyl/stone grafting of mango, the scion typically starts sprouting how many days after grafting?", "options": ["15–20 days", "30–40 days", "2–3 months", "1–5 days"], "correct": 0, "exp": "The scion sprouts 15-20 days after epicotyl/stone grafting."}, {"id": 100, "section": "Asexual Propagation – Grafting", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Cleft grafting, used to unite a rootstock limb much larger than the scion piece (e.g. in apple), is best conducted during which season?", "options": ["Peak summer, during active growth", "Monsoon season", "Late winter, when both are dormant", "Early spring flowering period"], "correct": 2, "exp": "Cleft grafting is conducted in late winter when both rootstock and scion are dormant."}, {"id": 101, "section": "Asexual Propagation – Grafting", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Which grafting method is used specifically to repair trees girdled by rodents or mechanical injury, by connecting the cambium layers above and below the girdled area?", "options": ["Wedge grafting", "Softwood grafting", "Tongue and whip grafting", "Bridge grafting"], "correct": 3, "exp": "Bridge grafting restores carbohydrate flow to roots by connecting cambium above and below a girdled/damaged area — used in apples, pears, walnuts, cherries."}, {"id": 102, "section": "Asexual Propagation – Grafting", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Softwood grafting, used in mango, sapota, jackfruit, cashew and tamarind, is best performed during which months?", "options": ["July and August", "October and November", "December and January", "March and April"], "correct": 0, "exp": "July and August are the best months for softwood grafting; the scion wood is defoliated 10 days prior to grafting."}, {"id": 103, "section": "Asexual Propagation – Grafting", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements about grafting methods:\n1. In wedge grafting, the scion is inserted as a wedge onto an incision in the stock, used for avocado and passion fruit.\n2. The whip graft is more stable than the tongue graft.\n3. In tongue-and-whip grafting, a slit is cut in both scion and stock to interlock the pieces.\n4. Bridge grafting is conducted in late winter when both stock and scion are dormant.\nWhich of the statements given above are correct?", "options": ["1 and 3", "1, 3 and 4", "All of the above", "1, 2 and 3", "2 and 4"], "correct": 0, "exp": "Statement 2 is reversed — the tongue graft is more stable and stronger than the plain whip graft, not the other way round. Statement 4 describes cleft grafting, not bridge grafting."}, {"id": 104, "section": "Asexual Propagation – Budding", "difficulty": "Easy", "type": "recall", "passage": null, "q": "In T- or Shield budding, incisions are made in the bark of the rootstock in the shape of which letter?", "options": ["T", "I", "Y", "H"], "correct": 0, "exp": "T-budding uses a horizontal cut and a downward cut forming the letter 'T'; used in peaches, apple, pears, citrus, roses, plums, apricots, almonds, pistachio."}, {"id": 105, "section": "Asexual Propagation – Budding", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Inverted T-budding differs from standard T-budding in that the horizontal cut is made at which position, in order to prevent water entry and rotting of the shield piece?", "options": ["At the bottom of the vertical cut", "On both ends of the vertical cut", "At the top of the vertical cut", "In the middle of the vertical cut"], "correct": 0, "exp": "In inverted T-budding, the horizontal cut is at the bottom, preventing water pooling at the top that could rot the shield piece."}, {"id": 106, "section": "Asexual Propagation – Budding", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Patch budding involves removing a rectangular patch of bark from the rootstock and replacing it with a similarly-sized bud patch. Which budding methods are described as modified forms of patch budding?", "options": ["Chip and Veneer budding", "T- and Inverted T-budding", "Wedge and Cleft budding", "I-, Forkert, Flute and Ring budding"], "correct": 3, "exp": "The I-, Forkert, Flute, and Ring methods of budding are considered modified forms of patch budding."}, {"id": 107, "section": "Asexual Propagation – Budding", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which budding method involves removing a chip of bark with a small piece of attached wood from between the nodes of a young rootstock stem, commonly used for grapes and most fruit trees?", "options": ["Chip budding", "Ring budding", "Patch budding", "I-budding"], "correct": 0, "exp": "Chip budding removes a chip of bark with wood attached between nodes; used for grapes and most fruit trees."}, {"id": 108, "section": "Asexual Propagation – Budding", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Ring budding, used in ber, peach and mulberry, involves removing what from the rootstock, unlike flute budding which leaves a connecting strip?", "options": ["A complete ring of bark with no connecting strip left", "A single narrow vertical incision", "A T-shaped incision", "Only a small rectangular patch"], "correct": 0, "exp": "Ring budding removes a complete encircling ring of bark (no connecting strip), unlike flute budding which leaves a narrow (~1/8 circumference) connecting strip."}, {"id": 109, "section": "Asexual Propagation – Budding", "difficulty": "Hard", "type": "recall", "passage": null, "q": "In flute budding, what proportion of the rootstock's circumference is left as a connecting strip of bark between the upper and lower parts?", "options": ["About 1/8th of the circumference", "About 1/16th of the circumference", "About 1/2 of the circumference", "About 1/4th of the circumference"], "correct": 0, "exp": "Flute budding leaves a narrow strip (~1/8 the rootstock circumference) connecting the upper and lower parts."}, {"id": 110, "section": "Asexual Propagation – Budding", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "I-budding, which uses incisions shaped like the letter 'I' and is used in forest and fruit trees, is closely related to which other budding method in terms of bud-patch preparation?", "options": ["Chip budding", "T-budding", "Patch budding", "Ring budding"], "correct": 2, "exp": "I-budding uses a rectangular bud patch similar to patch budding, differing mainly in the incision shape."}, {"id": 111, "section": "Modified Organs & Micropropagation", "difficulty": "Easy", "type": "recall", "passage": null, "q": "A small plantlet appearing around the base of a mother plant, which remains attached and can be separated to grow independently — seen in banana, pineapple and aloe vera — is called a:", "options": ["Tuber", "Rhizome", "Sucker", "Bulb"], "correct": 2, "exp": "A sucker is a small plantlet at the base of a mother plant, e.g. in Aloe vera, Banana, Pineapple."}, {"id": 112, "section": "Modified Organs & Micropropagation", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "For potato, the vegetative propagating material can be described as:", "options": ["A sucker separated from the base", "A corm cut into segments", "A whole tuber or a cut tuber with eyes/sprouts", "A rhizome piece with a bud"], "correct": 2, "exp": "Potato's vegetative 'seed' is a whole or cut tuber bearing eyes/sprouts."}, {"id": 113, "section": "Modified Organs & Micropropagation", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Ginger, turmeric and Costus speciosus are propagated using which modified underground organ, described as a swollen, compressed underground stem with short scaly leaves and vegetative buds?", "options": ["Bulb", "Tuber", "Rhizome", "Sucker"], "correct": 2, "exp": "Rhizome — swollen, compressed underground stem with scaly leaves and buds; used to propagate ginger, turmeric, Costus speciosus, banana."}, {"id": 114, "section": "Modified Organs & Micropropagation", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Micropropagation, the aseptic culture of cells, tissue pieces or organs, is carried out in how many stages, beginning with the initiation stage where an explant is disinfested and placed on a medium?", "options": ["2 stages", "3 stages", "6 stages", "4 stages"], "correct": 3, "exp": "Micropropagation proceeds through 4 stages, the first being the initiation stage."}, {"id": 115, "section": "Modified Organs & Micropropagation", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Which banana varieties are specifically named in the chapter as being commonly produced using the tissue culture (micropropagation) technique?", "options": ["Shrimanti, Gross Michael and Grand Naine", "Red Banana and Elaichi Banana", "Robusta, Nendran and Rasthali", "Poovan, Monthan and Karpuravalli"], "correct": 0, "exp": "The chapter names Shrimanti, Gross Michael and Grand Naine as banana varieties commonly propagated via tissue culture."}, {"id": 116, "section": "Training Systems", "difficulty": "Easy", "type": "recall", "passage": null, "q": "In the training system where the central leader branches are allowed to grow indefinitely, resulting in a tall tree bearing fruit more near the top (e.g. pear), the system is called:", "options": ["Spindle Bush system", "Central Leader System", "Open Centre System", "Modified Leader System"], "correct": 1, "exp": "The Central Leader System allows unrestricted vertical growth, producing tall trees bearing fruit near the top."}, {"id": 117, "section": "Training Systems", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which training system involves cutting the main trunk within a year of planting to allow lateral branches to grow, resulting in a low head with maximum sunshine reaching the branches and better fruit colouration?", "options": ["Modified Leader System", "Open Centre System", "Central Leader System", "Spindle Bush system"], "correct": 1, "exp": "Open Centre system limits main trunk height (up to 1 m), promoting lateral growth, better sunlight penetration and fruit colouration, though the structure is weaker."}, {"id": 118, "section": "Training Systems", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The training system that stands intermediate between central leader and open centre, allowing the central stem to grow unchecked for the first 4-5 years before cutting off the main stem, is:", "options": ["Central Leader System", "Modified Leader System", "Open Centre System", "Spindle Bush system"], "correct": 1, "exp": "The Modified Leader System combines advantages of both other systems — leader growth for 4-5 years, then cutting off the main stem so top laterals take over."}, {"id": 119, "section": "Training Systems", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "The overhead trellis or Bower system of training, highly suited for vigorous grape varieties like Anab-e-Shahi, Bangalore Blue and Gulabi, involves training vines on a:", "options": ["Wire fence", "Mandap", "T-shaped trellis", "Pergola frame only"], "correct": 1, "exp": "The Bower system trains vines on a mandap (overhead trellis), suited to vigorous grape varieties."}, {"id": 120, "section": "Training Systems", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The modified bower or 'Telephone' system of grape training uses a T-shaped support with how many top wires, and is suited to moderately vigorous varieties like Thompson Seedless?", "options": ["Two top wires", "Five top wires", "Four top wires", "Three top wires"], "correct": 3, "exp": "The Telephone system uses three top wires with T-shaped supports, resembling a telephone pole; suited to moderately vigorous grape varieties."}, {"id": 121, "section": "Training Systems", "difficulty": "Hard", "type": "figure", "passage": null, "q": "In the Kniffin system of grape training, two wires are stretched horizontally at what heights?", "options": ["1.20 m and 0.90 m", "0.60 m and 0.30 m", "0.50 m and 0.30 m", "0.90 m and 0.60 m"], "correct": 3, "exp": "In the Kniffin system, two horizontal wires are strung at 0.90 m and 0.60 m height, with vines trained to bear 4 canes total (2 per wire)."}, {"id": 122, "section": "Training Systems", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Dwarf Pyramid training consists of a tree with a central stem of about what height, from which short branches radiate in successive tiers?", "options": ["6.0 m", "2.5 m", "4.0 m", "1.0 m"], "correct": 1, "exp": "Dwarf pyramid: central stem about 2.5 m tall, with fruiting spurs developed on short radiating branches."}, {"id": 123, "section": "Training Systems", "difficulty": "Moderate", "type": "recall", "passage": null, "q"
