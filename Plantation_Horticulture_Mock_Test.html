: "Cordons, single-stemmed trees now largely replaced by dwarf pyramids in commercial fruit production, can be trained in which orientations?", "options": ["Only vertical", "Vertical, oblique or horizontal", "Only horizontal", "Only oblique"], "correct": 1, "exp": "Cordons can be vertical, oblique or horizontal; vertical cordons are trained to 10-12 feet with first fruiting wood at about 30 cm from the ground."}, {"id": 124, "section": "Training Systems", "difficulty": "Hard", "type": "recall", "passage": null, "q": "In Palmette training, lateral scaffold branches begin developing from the trunk starting at what height from the ground, formed in pairs balanced in opposite directions?", "options": ["100 cm", "30 cm", "10 cm", "60 cm"], "correct": 1, "exp": "Palmette training begins scaffold development at 30 cm from the ground, with laterals kept about 30 cm apart; four groups exist: Horizontal, Oblique, Candelabra and Fan Palmette."}, {"id": 125, "section": "Training Systems", "difficulty": "Easy", "type": "recall", "passage": null, "q": "A low headed tree, whose scaffold branches arise within 0.7–0.9 m of ground level, has which practical advantage over a high headed tree?", "options": ["Grows only in temperate climates", "Is immune to sunscald", "Requires no pruning at all", "Comes into bearing earlier and resists stormy winds more effectively"], "correct": 3, "exp": "Low headed trees bear earlier, resist wind better, and have lower spraying/harvesting costs; high headed trees (branches above 1.2 m) are prone to trunk sunscald in tropical climates."}, {"id": 126, "section": "Pruning & Special Horticultural Practices", "difficulty": "Easy", "type": "recall", "passage": null, "q": "The pruning method that refers to removal of branches entirely from their base, leaving no stubs, is called:", "options": ["Thinning out", "Disbudding", "Pinching and topping", "Heading back"], "correct": 0, "exp": "Thinning out removes branches entirely from the base, leaving no stubs."}, {"id": 127, "section": "Pruning & Special Horticultural Practices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Heading back, often used for hedges, ornamental shrubs and first dormant/October pruning in grapes, involves:", "options": ["Removing branches entirely from the base", "Removing only the shoot tip", "Cutting the main stem or branches, leaving a basal portion", "Nipping young buds before they sprout"], "correct": 2, "exp": "Heading back cuts the main stem/branches while leaving a basal portion, unlike thinning out which removes branches completely."}, {"id": 128, "section": "Pruning & Special Horticultural Practices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Pinching and topping, practiced in coffee to remove apical dominance and encourage lateral growth, involves removal of:", "options": ["Young unopened buds", "The entire branch from its base", "Only the tip of the shoot", "A ring of bark around the trunk"], "correct": 2, "exp": "Pinching and topping removes only the shoot tip to stimulate lateral growth, as practiced in coffee and desi cotton."}, {"id": 129, "section": "Pruning & Special Horticultural Practices", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Low head, medium head and high head pruning are classified based on cutting height. What height range defines 'Medium head pruning'?", "options": ["0.7 m – 0.9 m", "Less than 0.5 m", "More than 1.2 m", "0.9 m – 1.2 m"], "correct": 3, "exp": "Low head pruning: 0.7-0.9 m; Medium head pruning: 0.9-1.2 m; High head pruning: more than 1.2 m."}, {"id": 130, "section": "Pruning & Special Horticultural Practices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Top working, a technique of rejuvenation upgrading inferior seedling plantations with superior commercial cultivars (e.g. in Cashew), typically uses which grafting method during the monsoon season?", "options": ["Bridge grafting", "Softwood grafting", "Cleft grafting", "Approach grafting"], "correct": 1, "exp": "Top working uses softwood grafting during monsoon on shoots emerging from pruned branches; classic example is cashew."}, {"id": 131, "section": "Pruning & Special Horticultural Practices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "The practice of removing a ring of bark 1-2 cm wide around the trunk/branches to increase carbohydrate concentration above the cut and promote flowering (practiced in vigorous mango trees) is called:", "options": ["Ringing", "Girdling", "Bending", "Notching"], "correct": 0, "exp": "Ringing removes a 1-2 cm wide ring of bark, increasing carbohydrates above the ring and promoting flowering; girdling is a milder version (cutting through bark but not wood)."}, {"id": 132, "section": "Pruning & Special Horticultural Practices", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Notching, practiced in fig cultivation, involves removing a thin strip of bark near a dormant bud during which season?", "options": ["December–January", "June–July", "March–April", "August–September"], "correct": 3, "exp": "Notching in figs is done August-September, removing 0.2-0.5 cm thick bark 1.5-2.5 cm long near a dormant bud."}, {"id": 133, "section": "Pruning & Special Horticultural Practices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Bending of branches, a practice used as a substitute for severe pruning that increases carbohydrate concentration and flowering, is particularly practiced with local guava varieties in which region?", "options": ["Coastal Kerala", "Gangetic plains of UP", "Deccan area of Maharashtra", "Punjab plains"], "correct": 2, "exp": "Bending is a substitute for severe pruning, practiced with local guava varieties in the Deccan area (Maharashtra)."}, {"id": 134, "section": "Pruning & Special Horticultural Practices", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Smudging — smoking the tree crown to induce off-season flowering via ethylene — is commonly employed for mango production in which country, as mentioned in the chapter?", "options": ["The Philippines", "Thailand", "India", "Vietnam"], "correct": 0, "exp": "Smudging (smoking) is commonly employed in the Philippines to produce off-season mango crops; it is not commonly followed in India."}, {"id": 135, "section": "Pruning & Special Horticultural Practices", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Root pruning, used to induce fruitfulness or determine flowering time, is typically done how long before the required bloom period?", "options": ["One week", "One year", "Two weeks", "Two months"], "correct": 3, "exp": "Root pruning is done two months before the required bloom; trees flower about 2-3 weeks after the first irrigation following root exposure."}, {"id": 136, "section": "Pruning & Special Horticultural Practices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Root pruning, widely adopted by citrus growers in western and central India (santra), is generally included as part of which broader horticultural treatment given to fruit trees like mosambi, santra, guava and pomegranate?", "options": ["Top working", "Bower training", "Bahar treatment", "Degreening"], "correct": 2, "exp": "Root pruning is generally included within bahar treatments given to citrus and other fruit trees."}, {"id": 137, "section": "Bahar Treatment", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Bahar treatment, practiced in states like Maharashtra, MP and Gujarat, includes three flowering seasons. Which bahar corresponds to flowering in October-November?", "options": ["Ambe bahar", "Mrig bahar", "Basant bahar", "Hasta bahar"], "correct": 3, "exp": "Hasta bahar: flowering October-November. Mrig bahar: June-July. Ambe bahar: December-February."}, {"id": 138, "section": "Bahar Treatment", "difficulty": "Moderate", "type": "stmt", "passage": null, "q": "Consider the following statements about Bahar treatment:\n1. Mrig bahar corresponds to flowering in June-July.\n2. Ambe bahar corresponds to flowering in December-February.\n3. Root exposure is necessary even in sandy and sandy loam soils.\n4. The orchard is ploughed up to 20 cm depth on both sides before root exposure.\nWhich of the statements given above are correct?", "options": ["1, 2 and 4", "2 and 3", "3 and 4", "1 and 3", "All of the above"], "correct": 0, "exp": "Statement 3 is incorrect — root exposure is NOT necessary in sandy, sandy loam and other light soils, per the chapter."}, {"id": 139, "section": "Bahar Treatment", "difficulty": "Hard", "type": "figure", "passage": null, "q": "In Bahar treatment, roots are exposed by removing the upper soil layer within what radius around the trunk?", "options": ["60–90 cm", "10–20 cm", "200–250 cm", "100–150 cm"], "correct": 0, "exp": "Roots are exposed by removing the upper 10-15 cm of soil within a radius of 60-90 cm around the trunk."}, {"id": 140, "section": "Plant Growth Hormones", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Which plant hormone was the first to be discovered, and is the active ingredient in most rooting mixtures, influencing cell elongation, cell division and adventitious root formation?", "options": ["Cytokinin", "Ethylene", "Gibberellin", "Auxin"], "correct": 3, "exp": "Auxins were the first plant hormones discovered, later followed by gibberellins and cytokinins."}, {"id": 141, "section": "Plant Growth Hormones", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "The typical concentration range at which auxins are active is:", "options": ["0.1 to 10 mg/L", "0.01 to 10 mg/L", "5 to 500 mg/L", "1 to 100 mg/L"], "correct": 1, "exp": "Auxin concentration typically ranges from 0.01 to 10 mg/L; cytokinin concentration ranges from 0.1-10 mg/L; polyamines range 5-500 mg/L."}, {"id": 142, "section": "Plant Growth Hormones", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The phenomenon in which an intact, growing terminal bud suppresses the growth of lateral buds below it is known as:", "options": ["Parthenocarpy", "Polyembryony", "Apical dominance", "Senescence"], "correct": 2, "exp": "Apical dominance: the terminal bud suppresses lateral bud growth; removing the apical bud allows rapid lateral growth."}, {"id": 143, "section": "Plant Growth Hormones", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Kinetin, discovered from tobacco pith callus and chemically identified as 6-furfuryl aminopurine, was discovered by which scientists, in which year?", "options": ["Letham, in 1963", "Thimmann, in 1948", "Kurosawa, in 1926", "Skoog and Miller, in 1950"], "correct": 3, "exp": "Skoog and Miller discovered kinetin from tobacco pith callus in 1950; the term 'cytokinin' itself was later proposed by Letham in 1963."}, {"id": 144, "section": "Plant Growth Hormones", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which plant hormone class, unlike auxin, INHIBITS root formation, making it useful in tissue culture media where strong shoot growth without roots is desired?", "options": ["Cytokinins", "Ethylene", "Abscisic acid", "Gibberellins"], "correct": 0, "exp": "Cytokinins promote cell division and shoot proliferation but inhibit root formation."}, {"id": 145, "section": "Plant Growth Hormones", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Gibberellin was first isolated from rice seedlings infected by which fungus, discovered by the Japanese scientist Kurosawa?", "options": ["Gibberella fujikuroi", "Alternaria alternata", "Fusarium oxysporum", "Colletotrichum gloeosporioides"], "correct": 0, "exp": "Kurosawa found rice seedlings infected by Gibberella fujikuroi grew abnormally tall and thin, leading to the isolation of gibberellin."}, {"id": 146, "section": "Plant Growth Hormones", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Although there are about 100 different gibberellins, which specific form is the most commonly used in horticultural applications?", "options": ["Gibberellic acid (GA3)", "GA20", "GA7", "GA1"], "correct": 0, "exp": "Gibberellic acid (GA3) is the most commonly used form among the roughly 100 known gibberellins."}, {"id": 147, "section": "Plant Growth Hormones", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Abscisic acid (ABA), a plant growth inhibitor and antagonist of gibberellins, was originally isolated from young cotton fruits by Addicott in 1963 and was first named:", "options": ["Abscissin II", "Dormin", "Kinetin", "Auxin B"], "correct": 0, "exp": "Addicott (1963) isolated 'Abscissin II' from young cotton fruits, later renamed abscisic acid; it is also called 'Dormin' due to its role in inducing dormancy."}, {"id": 148, "section": "Plant Growth Hormones", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which plant hormone is unique in that it exists only in gaseous form, and hastens ripening of fleshy fruits like banana, apple, pear, tomato and citrus?", "options": ["Ethylene", "Gibberellin", "Polyamine", "Auxin"], "correct": 0, "exp": "Ethylene is the only plant hormone found solely in gaseous form; it induces ripening, leaf abscission and senescence."}, {"id": 149, "section": "Plant Growth Hormones", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Polyamines are unique among plant hormones in being effective at relatively high concentrations, typically in the range of:", "options": ["0.1 to 10 mg/L", "5 to 500 mg/L", "0.01 to 10 mg/L", "1 to 5 mg/L"], "correct": 1, "exp": "Polyamines are applied at higher concentrations (5-500 mg/L) than auxins (0.01-10 mg/L) or cytokinins (0.1-10 mg/L)."}, {"id": 150, "section": "Plant Growth Hormones", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements about growth retardants (anti-gibberellins):\n1. Cycocel (CCC) is 2-chloroethyl trimethyl ammonium chloride.\n2. Phosphon D is a phosphonium chloride compound.\n3. Morphactins and Maleic hydrazide are also classified as growth retardants.\n4. Growth retardants promote cell enlargement and stem elongation.\nWhich of the statements given above are correct?", "options": ["1, 2 and 3", "All of the above", "2, 3 and 4", "1 and 4", "1 and 3 only"], "correct": 0, "exp": "Statement 4 is incorrect — growth retardants PREVENT gibberellins from exhibiting responses like cell enlargement and stem elongation, they do not promote them."}, {"id": 151, "section": "Plant Growth Hormones", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The term 'cytokinin' (as distinct from 'kinetin') was formally proposed by which scientist, in which year?", "options": ["Thimmann, in 1948", "Letham, in 1963", "Addicott, in 1963", "Skoog and Miller, in 1950"], "correct": 1, "exp": "Letham proposed the term 'cytokinin' in 1963, while Skoog and Miller had discovered kinetin itself in 1950."}, {"id": 152, "section": "Plant Growth Hormones", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which scientist proposed the term 'Phytohormone', and in which year, since these hormones are synthesized within plants?", "options": ["Addicott, in 1963", "Thimmann, in 1948", "Letham, in 1963", "Kurosawa, in 1926"], "correct": 1, "exp": "Thimmann proposed the term 'Phytohormone' in 1948."}, {"id": 153, "section": "Plant Growth Hormones", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which of the following is classified among the synthetic auxins listed in the chapter, alongside NAA and 2,4-D?", "options": ["BAP (Benzylaminopurine)", "ABA (Abscisic acid)", "GA3 (Gibberellic acid)", "IBA (Indole Butyric Acid)"], "correct": 3, "exp": "IBA, NAA, MENA, MCPA, TIBA, 2,4-D and 2,4,5-T are all listed as synthetic auxins."}, {"id": 154, "section": "Plant Growth Hormones", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Natural auxins that move/diffuse freely out of plant tissue are termed 'free auxins', while those released only after hydrolysis, autolysis or enzymolysis are called:", "options": ["Inhibited auxins", "Conjugated gibberellins", "Latent auxins", "Bound auxins"], "correct": 3, "exp": "Bound auxins are released from plant tissue only after hydrolysis, autolysis or enzymolysis, unlike freely diffusing free auxins."}, {"id": 155, "section": "Hormone Uses in Horticulture", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "For rooting of cuttings, which two hormones are described as the most successful chemical compounds, more effective than sugars, potassium permanganate or phosphate?", "options": ["Ethylene and polyamines", "GA3 and ABA", "Cytokinin and ethylene", "IBA and NAA"], "correct": 3, "exp": "Indolebutyric acid (IBA) and naphthalene acetic acid (NAA) are described as the most successful compounds for rooting cuttings."}, {"id": 156, "section": "Hormone Uses in Horticulture", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "For blossom thinning in papaya to reduce fruit number and increase fruit size, which hormone has been reported effective?", "options": ["NAA (naphthaleneacetic acid)", "Cytokinin", "Ethylene", "GA3"], "correct": 0, "exp": "NAA has been reported effective for blossom/fruit thinning in papaya; only fully opened but unpollinated flowers are killed at the right concentration."}, {"id": 157, "section": "Hormone Uses in Horticulture", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The corky layer of cells at the junction of fruit and stalk, whose formation causes fruit drop and can be prevented by naphthaleneacetic acid and its derivatives, is called the:", "options": ["Meristematic layer", "Periderm layer", "Cambium layer", "Abscission layer"], "correct": 3, "exp": "The abscission layer causes fruit drop; NAA and derivatives are the best hormones to prevent its formation, especially in apples."}, {"id": 158, "section": "Hormone Uses in Horticulture", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Application of NAA spray at what concentration has been found to reduce the maturity period of pineapple by about 2 months?", "options": ["0.06 percent", "0.006 percent", "0.6 percent", "6 percent"], "correct": 1, "exp": "A 0.006% NAA spray reduces pineapple maturity period by about 2 months; ethylene and acetylene are also used in Hawaii and Australia for early flowering in pineapple."}, {"id": 159, "section": "Hormone Uses in Horticulture", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "For increasing fruit set via seedless fruit production (parthenocarpy), the use of hormones is currently limited mainly to glasshouse crops, particularly which crop?", "options": ["Grape", "Pineapple", "Tomato", "Papaya"], "correct": 2, "exp": "Seedless fruit production via hormone (NAA) treatment is currently limited mainly to glasshouse tomato crops."}, {"id": 160, "section": "Hormone Uses in Horticulture", "difficulty": "Hard", "type": "recall", "passage": null, "q": "In tomato, which chemical is noted to change leaf buds into flower buds, thereby controlling/inducing flowering?", "options": ["Tri-iodobenzoic acid", "Indole butyric acid", "Gibberellic acid", "Naphthalene acetic acid"], "correct": 0, "exp": "Tri-iodobenzoic acid changes leaf buds into flower buds in tomato."}, {"id": 161, "section": "Maturity – Concepts & Indices", "difficulty": "Easy", "type": "recall", "passage": null, "q": "The developmental stage of a fruit while still on the tree, which will result in a satisfactory product after harvest, is termed:", "options": ["Commercial maturity", "Physiological maturity", "Horticultural maturity", "Harvest maturity"], "correct": 2, "exp": "Horticultural maturity is the stage on the tree that will yield a satisfactory product after harvest."}, {"id": 162, "section": "Maturity – Concepts & Indices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "The stage when maximum growth and maturation has occurred in a fruit/vegetable, usually associated with full ripening and followed by senescence, is called:", "options": ["Horticultural maturity", "Physiological maturity", "Harvest maturity", "Commercial maturity"], "correct": 1, "exp": "Physiological maturity is the stage of maximum growth/maturation, associated with full ripening, followed by senescence."}, {"id": 163, "section": "Maturity – Concepts & Indices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "The stage of a plant organ required by the market, which commonly bears little relation to physiological maturity and may occur at any developmental stage, is:", "options": ["Horticultural maturity", "Harvest maturity", "Commercial maturity", "Physiological maturity"], "correct": 2, "exp": "Commercial maturity is defined purely by market requirement, independent of physiological maturity stage."}, {"id": 164, "section": "Maturity – Concepts & Indices", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Mango fruits are considered mature for harvest when their specific gravity falls in which range, and TSS reaches which level?", "options": ["Specific gravity 0.95–1.00; TSS 5–8° Brix", "Specific gravity 1.05–1.10; TSS 20–25° Brix", "Specific gravity 1.01–1.02; TSS 20–24° Brix", "Specific gravity 1.01–1.02; TSS 11–15° Brix"], "correct": 3, "exp": "Mango maturity indices: specific gravity 1.01-1.02, TSS reaching 11-15° Brix."}, {"id": 165, "section": "Maturity – Concepts & Indices", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Banana is considered mature for harvest when the pulp-peel ratio reaches what range, taking how many months from shooting?", "options": ["1.2–1.6, taking 5–6 months", "2.0–2.5, taking 5–6 months", "1.2–1.6, taking 3.0–3.5 months", "0.5–0.8, taking 1–2 months"], "correct": 2, "exp": "Banana maturity index: pulp-peel ratio 1.2-1.6, achieved 3.0-3.5 months after shooting."}, {"id": 166, "section": "Maturity – Concepts & Indices", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Grapes are harvested when they reach a TSS (Total Soluble Solids) of what range, depending on variety?", "options": ["16 to 24 percent", "5 to 10 percent", "30 to 35 percent", "8 to 12 percent"], "correct": 0, "exp": "Grape maturity is judged when TSS reaches 16-24%, depending on the variety."}, {"id": 167, "section": "Maturity – Concepts & Indices", "difficulty": "Hard", "type": "figure", "passage": null, "q": "For long-distance transport, papaya is harvested when the skin colour changes from green to yellow to what extent?", "options": ["75 percent", "25 percent", "50 percent", "6 percent"], "correct": 3, "exp": "For long-distance transport, papaya is harvested at just 6% colour break; pineapple for local market is harvested at 25% surface yellowing."}, {"id": 168, "section": "Maturity – Concepts & Indices", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "For pineapple intended for local markets, harvest maturity is judged at what percentage of surface yellow colouration?", "options": ["50 percent", "25 percent", "75–80 percent", "6 percent"], "correct": 1, "exp": "Local market pineapple: 25% surface yellow. Long-distance transport pineapple: eyes still green, 75-80% maturity."}, {"id": 169, "section": "Maturity – Concepts & Indices", "difficulty": "Hard", "type": "figure", "passage": null, "q": "According to the International Standards Organization, what is the minimum juice content requirement for Washington navel oranges?", "options": ["25 percent", "35 percent", "33 percent", "30 percent"], "correct": 3, "exp": "ISO minimum juice content: Washington navel oranges 30%; other orange varieties 35%; grapefruit 35%; mandarin orange 33%; lemons and limes 25%."}, {"id": 170, "section": "Maturity – Concepts & Indices", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "Pomegranate fruits are ready for harvest between what number of days after anthesis (flowering)?", "options": ["30–45 days", "200–250 days", "60–90 days", "135–170 days"], "correct": 3, "exp": "Pomegranate reaches harvest maturity 135-170 days after anthesis."}, {"id": 171, "section": "Maturity – Concepts & Indices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "In assessing maturity of vegetables such as musk melon, the formation of which structure signals that harvest should occur?", "options": ["Waxy bloom", "Suberized periderm", "Lignified stem", "Abscission layer"], "correct": 3, "exp": "Musk melon should be harvested at the formation of the abscission layer."}, {"id": 172, "section": "Maturity – Concepts & Indices", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "In tomato and citrus, maturity is commonly assessed by observing changes in which visible characteristic?", "options": ["Leaf shape", "Skin colour", "Root growth", "Stem thickness"], "correct": 1, "exp": "Skin colour change (loss of green colour in citrus, colour development in tomato) is a key maturity indicator."}, {"id": 173, "section": "Factors Affecting Maturity", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "Gulabi (Pink) grapes take about 100 days to mature in Western India, but how many days in the warmer climate of Northern India?", "options": ["82 days", "60 days", "120 days", "150 days"], "correct": 0, "exp": "Higher temperature accelerates maturity: Gulabi grapes mature in 100 days in Western India versus just 82 days in warmer Northern India."}, {"id": 174, "section": "Factors Affecting Maturity", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Grapes grown on which soil type are harvested earlier compared to those grown on heavy clay soils, per the chapter's discussion of soil effects on maturity?", "options": ["Peaty soils", "Alkaline saline soils", "Light sandy soils", "Waterlogged soils"], "correct": 2, "exp": "Grapes on light sandy soils mature earlier than those on heavy clays."}, {"id": 175, "section": "Factors Affecting Maturity", "difficulty": "Hard", "type": "recall", "passage": null, "q": "In pineapple propagation, planting material size affects maturity timing. Using larger suckers and slips (compared to smaller ones) has what effect on the number of days from flowering to fruit maturity?", "options": ["It increases the number of days taken", "It has no effect on maturity timing", "It only affects fruit size, not timing", "It decreases the number of days taken"], "correct": 0, "exp": "Larger planting material (suckers/slips) in pineapple results in MORE days from flowering to fruit maturity compared to smaller ones."}, {"id": 176, "section": "Factors Affecting Maturity", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Closer spacing of hill bananas has what effect on fruit maturity, per the chapter?", "options": ["It hastens (speeds up) maturity", "It delays maturity significantly", "It has no measurable effect", "It only affects fruit colour"], "correct": 0, "exp": "Close spacing of hill bananas hastens their maturity."}, {"id": 177, "section": "Factors Affecting Maturity", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements on factors affecting maturity:\n1. Girdling in grapevines hastens maturity and reduces the number of green berries in unevenly maturing cultivars.\n2. Pruning intensity has been shown to enhance the maturity of Flordasun and Sharbati peaches.\n3. Girdling is most effective when done very close to harvest time.\n4. Higher temperature generally delays fruit maturity.\nWhich of the statements given above are correct?", "options": ["3 and 4 only", "2 and 3", "1 and 2", "1, 3 and 4", "All of the above"], "correct": 2, "exp": "Statements 3 and 4 are incorrect — girdling is ineffective when done close to harvest, and higher temperature generally gives EARLIER (not delayed) maturity."}, {"id": 178, "section": "Post-Harvest Losses & Technologies", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Post-harvest losses caused by bruising, cracking, cuts, and microbial spoilage due to fungi/bacteria are classified as:", "options": ["Mechanical losses", "Chemical losses", "Physiological losses", "Enzymatic losses"], "correct": 0, "exp": "Mechanical losses include bruising, cracking, cuts, and microbial spoilage; physiological losses involve changes in respiration, transpiration, pigments, organic acids and flavour."}, {"id": 179, "section": "Post-Harvest Losses & Technologies", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which post-harvest technology acts as a protective coating that reduces moisture loss and respiration rate, but does NOT improve the quality of an inferior horticultural product?", "options": ["Waxing", "Irradiation", "Curing", "Edible coating"], "correct": 0, "exp": "Waxing reduces moisture loss and respiration but cannot improve the inherent quality of an inferior product; it is only a beneficial adjunct to good handling."}, {"id": 180, "section": "Post-Harvest Losses & Technologies", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Curing, used to reduce water loss during storage of onion, garlic and sweet potato, differs in method between root crops and which other crop group?", "options": ["Leafy vegetables", "Fruit crops", "Tuber crops", "Bulbous crops (onions and garlic)"], "correct": 3, "exp": "The chapter notes curing methods for root crops differ entirely from those used for bulbous crops like onion and garlic."}, {"id": 181, "section": "Post-Harvest Losses & Technologies", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The post-harvest treatment of citrus fruits with ethylene under controlled conditions to hasten chlorophyll loss and reveal underlying pigment colour is called:", "options": ["Degreening", "Curing", "Waxing", "Blanching"], "correct": 0, "exp": "Degreening uses ethylene to degrade chlorophyll, revealing the natural yellow/orange pigment of citrus fruits."}, {"id": 182, "section": "Post-Harvest Losses & Technologies", "difficulty": "Hard", "type": "figure", "passage": null, "q": "In the ethylene exposure method of degreening, what ethylene concentration and duration are typically used, at 25-30°C and 85-95% RH?", "options": ["500 PPM for 5 minutes", "2–3 PPM for 6–12 hours", "20–30 PPM (or 10 µL L⁻¹) for 24–72 hours", "100–150 PPM for 1–2 hours"], "correct": 2, "exp": "Degreening by ethylene exposure uses 20-30 PPM (10 µL/L) ethylene at 25-30°C, 85-95% RH, for 24-72 hours."}, {"id": 183, "section": "Post-Harvest Losses & Technologies", "difficulty": "Hard", "type": "recall", "passage": null, "q": "When weather prevents natural colour development in oranges, a legally permitted dye can artificially colour the peel. This process is called:", "options": ["Sulphuring", "Colour Add", "Bleaching", "Degreening"], "correct": 1, "exp": "'Colour Add' uses a legally permitted dye (e.g. Citrus Red No. 2) to artificially colour orange peel when natural colour fails to develop."}, {"id": 184, "section": "Post-Harvest Losses & Technologies", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Evaporative Cooling Chambers (ECCs), also known as 'zero energy cool chambers' (ZECCs), maintain vegetable freshness using which principle, without needing electricity?", "options": ["Compression refrigeration cycle", "Evaporation of water removes heat, creating a cooling effect", "Vacuum-based cooling", "Chemical absorption of heat"], "correct": 1, "exp": "ECCs/ZECCs use evaporative cooling — water evaporation removes heat — requiring no electricity."}, {"id": 185, "section": "Post-Harvest Losses & Technologies", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements about Modified Atmosphere Packaging (MAP):\n1. MAP extends the shelf life of Cavendish banana from 5 to 15 days.\n2. MAP extends the shelf life of green chilli from 8 to 13 days.\n3. Papaya storage can be extended to 4 weeks at 10-12°C under MA conditions using LDPE bags.\n4. MAP works by increasing the oxygen concentration inside the package well above ambient levels.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 2 and 3", "All of the above", "1 and 4", "1 and 3 only"], "correct": 1, "exp": "Statement 4 is incorrect — MAP modifies the atmosphere through the produce's own respiration, typically REDUCING oxygen and increasing CO2, not increasing oxygen."}, {"id": 186, "section": "Post-Harvest Losses & Technologies", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Controlled Atmosphere (CA) storage works on the principle of maintaining higher concentration of which gas and lower concentration of which gas compared to normal atmosphere?", "options": ["Higher O2, lower CO2", "Higher ethylene, lower CO2", "Higher CO2, lower O2", "Higher nitrogen, lower CO2"], "correct": 2, "exp": "CA storage maintains higher CO2 and lower O2 than normal atmosphere, reducing respiration and delaying aging."}, {"id": 187, "section": "Post-Harvest Losses & Technologies", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Exposure of fruits and vegetables to ionizing radiation (e.g. gamma rays) at optimum dosage is used as a disinfection treatment to control which pests, among others mentioned in the chapter?", "options": ["Fungal wilt pathogens only", "Fruit fly on citrus, mango seed weevil and papaya fruit fly", "Aphids and whiteflies", "Rodents in storage godowns"], "correct": 1, "exp": "Irradiation controls fruit fly on citrus, mango seed weevil and papaya fruit fly, besides delaying ripening and minimizing insect infestation."}, {"id": 188, "section": "Post-Harvest Losses & Technologies", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Edible coatings, used as film wraps that become part of the food when consumed, are prepared from which categories of edible materials?", "options": ["Only starches", "Only synthetic polymers", "Proteins, polysaccharides and lipids", "Only waxes and oils"], "correct": 2, "exp": "Edible coatings are continuous matrices made from proteins, polysaccharides and lipids."}, {"id": 189, "section": "Post-Harvest Losses & Technologies", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "During dehydration, the initial dehydrator temperature of about 43°C is gradually increased to what final range for fruits?", "options": ["80–85°C", "60–66°C", "50–55°C", "66–71°C"], "correct": 3, "exp": "Dehydration temperature is gradually raised from 43°C to 60-66°C for vegetables and 66-71°C for fruits."}, {"id": 190, "section": "Post-Harvest Losses & Technologies", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Shade drying is specifically employed for products which risk losing colour or turning brown if exposed to which condition?", "options": ["Direct sunlight", "Excess ventilation", "High humidity", "Low temperature"], "correct": 0, "exp": "Shade drying (under a roof/thatch with open sides) prevents colour loss/browning caused by direct sunlight."}, {"id": 191, "section": "Post-Harvest Losses & Technologies", "difficulty": "Hard", "type": "recall", "passage": null, "q": "In osmotic dehydration, fresh material is first soaked in a heavy sugar or strong salt solution, and then subjected to which final drying method?", "options": ["Freeze drying", "Sun or solar drying", "Vacuum drying", "Cryogenic drying"], "correct": 1, "exp": "Osmotic dehydration involves soaking in concentrated sugar/salt solution followed by sun or solar drying."}, {"id": 192, "section": "Post-Harvest Losses & Technologies", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Blanching before drying helps preserve which pigment class by protecting them from oxidative breakdown during subsequent drying?", "options": ["Carotenoid (orange and yellow) pigments", "Chlorophylls only", "Anthocyanins", "Flavonoids only"], "correct": 0, "exp": "Blanching dissolves carotenoid pigments into small intracellular oil drops, protecting them from oxidative breakdown during drying."}, {"id": 193, "section": "Post-Harvest Losses & Technologies", "difficulty": "Hard", "type": "figure", "passage": null, "q": "In the rehydration ratio calculation, if the dry sample weight (a) is 5 g and the drained rehydrated sample weight (b) is 30 g, the rehydration ratio (b/a) equals:", "options": ["6", "0.6", "3", "1.5"], "correct": 0, "exp": "Rehydration ratio = b/a = 30/5 = 6."}, {"id": 194, "section": "Post-Harvest Losses & Technologies", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Putting KMnO4-soaked filter paper (at about 100 ppm) inside packaging acts as which type of post-harvest treatment, particularly useful in banana storage?", "options": ["Ethylene absorbent", "Antifungal agent", "Preservative acid", "Growth regulator"], "correct": 0, "exp": "KMnO4 (potassium permanganate) soaked filter paper acts as an ethylene absorbent, minimizing ripening and extending shelf life, especially in banana."}, {"id": 195, "section": "Post-Harvest Losses & Technologies", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Post-harvest dipping of papaya fruits in 100 ppm GA3 or 2% CaCl2 has been shown to extend shelf life by how many days without quality decline?", "options": ["Up to 3 days", "Up to 9 days", "Up to 30 days", "Up to 20 days"], "correct": 1, "exp": "Papaya dipping in 100 ppm GA3 or 2% CaCl2 extends shelf life up to 9 days without quality decline."}, {"id": 196, "section": "Precooling Methods", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Precooling is defined as:", "options": ["The removal of field heat from freshly harvested produce to slow metabolism and reduce deterioration", "A chemical treatment applied to delay flowering", "The process of freezing produce at sub-zero temperatures for long-term storage", "The final stage of ripening before marketing"], "correct": 0, "exp": "Precooling removes field heat immediately after harvest to slow metabolism and minimize spoilage, forming the first step of the cold chain."}, {"id": 197, "section": "Precooling Methods", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which precooling method is described as an old, well-established practice suited only to small amounts of produce or slowly-deteriorating produce, due to its slow and variable cooling rate?", "options": ["Room cooling", "Vacuum cooling", "Hydrocooling", "Forced-air cooling"], "correct": 0, "exp": "Room cooling is slow and variable, suited only to small quantities or produce that doesn't deteriorate rapidly."}, {"id": 198, "section": "Precooling Methods", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Forced-air cooling is typically how many times faster than room cooling, according to the chapter's comparative figures?", "options": ["4 to 10 times faster", "50 to 60 times faster", "20 to 30 times faster", "1 to 2 times faster"], "correct": 0, "exp": "Forced-air cooling is 4-10 times faster than room cooling; hydrocooling and vacuum cooling are 2-23 times faster than forced-air cooling."}, {"id": 199, "section": "Precooling Methods", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "A permanent false wall containing an exhaust fan that draws room air through produce containers with a damper system that opens only when containers face it describes which forced-air cooling variant?", "options": ["Cold wall", "Forced air tunnel", "Cryogenic tunnel", "Serpentine cooling"], "correct": 0, "exp": "The cold wall method uses a false wall with an exhaust fan and damper system opening only for aligned containers."}, {"id": 200, "section": "Precooling Methods", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Serpentine cooling, a modification of the cold-wall method designed for bulk bin cooling, matches every OTHER forklift opening (sealed with canvas) to a corresponding structure. What is that structure?", "options": ["A hydrocooling tank inlet", "A refrigerant coil", "A vacuum chamber port", "A cold wall opening"], "correct": 3, "exp": "In serpentine cooling, alternating sealed forklift openings in stacked bulk bins match cold wall openings."}, {"id": 201, "section": "Precooling Methods", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Hydrocooling uses chilled or cold water applied by flooding, spraying or immersion; to prevent microbial contamination during this process, which mild disinfectant is commonly used at about 100 ppm?", "options": ["Chlorine", "Sulphur dioxide", "Potassium permanganate", "Benzoic acid"], "correct": 0, "exp": "Chlorine at about 100 ppm (measured as hypochlorous acid) or approved phenol compounds are used to disinfect hydrocooling water."}, {"id": 202, "section": "Precooling Methods", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which precooling method uses crushed or granular ice packed around produce or made into slurry and injected into waxed cartons, historically used before modern precooling techniques became common?", "options": ["Cryogenic cooling", "Evaporative cooling", "Ice cooling", "Vacuum cooling"], "correct": 2, "exp": "Ice cooling — using crushed/granular ice around or slurried with produce — was widely used before modern precooling techniques."}, {"id": 203, "section": "Precooling Methods", "difficulty": "Hard", "type": "figure", "passage": null, "q": "In vacuum cooling, at what saturation pressure does water boil at 0°C, illustrating the pressure-temperature relationship used in this method?", "options": ["6.09 mbar", "1013 mbar", "23.37 mbar", "101.3 mbar"], "correct": 0, "exp": "At 6.09 mbar, water boils at 0°C; at 23.37 mbar, water boils at 20°C; at 1013 mbar (atmospheric), water boils at 100°C."}, {"id": 204, "section": "Precooling Methods", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Cryogenic cooling uses the latent heat of evaporation of liquid nitrogen or solid CO2 (dry ice), which can produce boiling temperatures of approximately:", "options": ["-100°C and -40°C respectively", "-196°C and -78°C respectively", "-273°C and -100°C respectively", "-50°C and -20°C respectively"], "correct": 1, "exp": "Liquid nitrogen evaporates at about -196°C and solid CO2 (dry ice) at about -78°C, forming the basis of cryogenic precooling."}, {"id": 205, "section": "Precooling Methods", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Evaporative cooling is most effective in areas with low humidity, and works best when incoming air has relative humidity below what threshold?", "options": ["65 percent", "40 percent", "80 percent", "95 percent"], "correct": 0, "exp": "Effective evaporative cooling requires incoming air below 65% relative humidity; it typically reduces temperature by only 10-15°F."}, {"id": 206, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Easy", "type": "recall", "passage": null, "q": "Sterilization, defined as the complete destruction of all microorganisms by heat, is achieved at what temperature range, requiring pressure sterilizers such as autoclaves?", "options": ["Above 100°C", "Below 60°C", "60–70°C", "Exactly 100°C"], "correct": 0, "exp": "Sterilization occurs above 100°C, requiring steam pressure sterilizers/autoclaves since normal boiling caps out at 100°C."}, {"id": 207, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Pasteurization, which kills part but not all microorganisms, is carried out below what temperature?", "options": ["100°C", "200°C", "50°C", "150°C"], "correct": 0, "exp": "Pasteurization occurs below 100°C; surviving organisms are controlled by low temperature or another preservative method."}, {"id": 208, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Hard", "type": "figure", "passage": null, "q": "The HTST (High Temperature Short Time) method of pasteurization uses temperatures above what value, in contrast to the LTH (Low Temperature Holding) method's 60-70°C range?", "options": ["90°C", "50°C", "100°C", "70°C"], "correct": 3, "exp": "HTST method uses temperatures above 70°C; LTH (holding) method uses 60-70°C."}, {"id": 209, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Fruits and tomato products, being acidic, require sterilization for spore-forming bacteria at 100°C for how long, whereas low-acid vegetables like green peas and beans require continuous heating at 116°C for how long?", "options": ["60 min for fruits; 10 min at 90°C for vegetables", "10 min for fruits; 5 min at 150°C for vegetables", "2 hours for fruits; 2 hours at 100°C for vegetables", "30 min for fruits/tomato; 30–90 min at 116°C for low-acid vegetables"], "correct": 3, "exp": "Fruits/tomato products: 100°C for 30 min. Low-acid, starchy vegetables (peas, okra, beans): continuous heating 30-90 min at 116°C."}, {"id": 210, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Canning was invented in 1804 by which individual in France, giving canning its alternative name 'appertizing'?", "options": ["Nicolas Leblanc", "Lavoisier", "Pasteur", "Appert"], "correct": 3, "exp": "Appert invented the hermetic sealing and heat sterilization process in France in 1804; canning is also called 'appertizing' in his honour."}, {"id": 211, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "In lye peeling, fruits like peaches and vegetables like carrots are dipped in boiling caustic soda solution of what concentration, for a specified time, to loosen the skin by dissolving pectin?", "options": ["20 to 25 percent", "10 to 15 percent", "0.5 to 1 percent", "1 to 2 percent"], "correct": 3, "exp": "Lye peeling uses 1-2% boiling caustic soda for 30 seconds to 2 minutes, then residual alkali is neutralized in citric acid solution."}, {"id": 212, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Flame peeling, which involves simply burning off the outer covering, is used only for which two crops in the chapter?", "options": ["Garlic and onion", "Peaches and apricots", "Peas and beans", "Carrots and potatoes"], "correct": 0, "exp": "Flame peeling is used only for garlic and onion, which have a papery outer covering."}, {"id": 213, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Syruping (a sugar solution poured hot onto canned fruit) is done only for fruits, while brining (a salt solution) is done only for:", "options": ["Vegetables", "Grains", "Meats", "Dairy products"], "correct": 0, "exp": "Syruping is exclusive to fruits; brining is exclusive to vegetables, per the chapter's canning process."}, {"id": 214, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Hot syrup used in canning is typically poured at what concentration (degrees Brix) and filled at what temperature range?", "options": ["5–10° Brix; filled at 50–60°C", "20–55° Brix; filled at 79–82°C", "60–80° Brix; filled at 100–110°C", "10–15° Brix; filled at 60–70°C"], "correct": 1, "exp": "Syrup of 20-55° Brix is used, filled at 79-82°C, with a head space of 0.3-0.5 cm."}, {"id": 215, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Hard", "type": "figure", "passage": null, "q": "During sealing of canned products, the temperature at the time of sealing should not fall below what value?", "options": ["50°C", "74°C", "100°C", "90°C"], "correct": 1, "exp": "During sealing, the temperature should not fall below 74°C to maintain a proper seal and prevent spoilage."}, {"id": 216, "section": "Preservation – Heat Treatment & Canning", "difficulty": "Moderate", "type": "stmt", "passage": null, "q": "Consider the following statements about the canning process:\n1. Grading is done according to size and colour to obtain uniform quality.\n2. Blanching generally enhances the green colour of vegetables such as peas and spinach.\n3. Exhausting refers to the removal of air from filled cans, typically taking 6 to 10 minutes.\n4. After processing, cans should be cooled slowly over several hours to avoid thermal shock.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1 and 4", "1, 2 and 3", "1, 3 and 4", "All of the above"], "correct": 2, "exp": "Statement 4 is incorrect — cans are cooled RAPIDLY after processing (e.g. by dipping in cold water) to about 39°C to stop cooking and prevent stack-burning; slow cooling causes quality defects like discolouration."}, {"id": 217, "section": "Preservation – Freezing & Drying", "difficulty": "Easy", "type": "recall", "passage": null, "q": "'Good' frozen storage generally means maintaining temperatures at or below:", "options": ["0°C (32°F)", "-5°C (23°F)", "5°C (41°F)", "-18°C (0°F)"], "correct": 3, "exp": "Good frozen storage generally means -18°C (0°F) or below, distinct from cold storage which covers temperatures above freezing down to about -2.2°C."}, {"id": 218, "section": "Preservation – Freezing & Drying", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "Sharp (slow) freezing operates at temperatures of -15 to -29°C and may take how long to complete, resulting in large ice crystals that rupture cells?", "options": ["10 to 30 minutes", "5 to 10 days", "1 to 3 hours", "3 to 72 hours"], "correct": 3, "exp": "Sharp freezing takes 3-72 hours; the resulting large ice crystals rupture cells so thawed tissue cannot regain its original water content."}, {"id": 219, "section": "Preservation – Freezing & Drying", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Quick freezing achieves the temperature of maximum ice , "difficulty": "Hard", "type": "recall", "passage": null, "q": "During frozen storage, unfrozen concentrated solutions of sugars and salts may ooze out of fruits, forming a viscous material known as:", "options": ["Cryoprotectant residue", "Metacryotic liquid", "Osmotic exudate", "Freezer syrup"], "correct": 1, "exp": "This viscous ooze from unfrozen concentrated solutions during frozen storage is called 'metacryotic liquid'."}, {"id": 224, "section": "Preservation – Freezing & Drying", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "'Freezer burn', appearing as dry, grainy, brownish spots on frozen produce, results from which process occurring at the food's surface during storage?", "options": ["Desiccation (ice crystal evaporation from the surface)", "Bacterial spoilage", "Enzymatic browning from heat exposure", "Chemical reaction with packaging material"], "correct": 0, "exp": "Freezer burn results from desiccation — ice crystals evaporating from the food's surface — causing dry, grainy, brownish spots."}, {"id": 225, "section": "Preservation – Freezing & Drying", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Dried ripe banana, prepared by peeling, slicing lengthwise, sulphuring and sun-drying, is commercially known as:", "options": ["Banana wafer", "Banana chip", "Banana crisp", "Banana fig"], "correct": 3, "exp": "Dried ripe banana is called 'banana fig'; unripe bananas are instead blanched, cut into discs and dried."}, {"id": 226, "section": "Preservation – Freezing & Drying", "difficulty": "Hard", "type": "recall", "passage": null, "q": "The large seedless grapes imported into India from Afghanistan, hung in dark rooms called 'kishmish khanas' until they acquire a greenish or light amber tint, are known as:", "options": ["Kishmish grapes", "Monucca grapes", "Anardana grapes", "Haitha grapes"], "correct": 0, "exp": "Kishmish grapes are dried in kishmish khanas; 'Monucca' (raisin) is instead prepared from large-seeded Haitha grapes that are lye-dipped before sun drying."}, {"id": 227, "section": "Preservation – Freezing & Drying", "difficulty": "Hard", "type": "figure", "passage": null, "q": "For efficient drying, grapes should have a high sugar content of what degree Brix range?", "options": ["30 to 40 degree Brix", "5 to 10 degree Brix", "20 to 24 degree Brix", "50 to 60 degree Brix"], "correct": 2, "exp": "Grapes need 20-24° Brix sugar content for efficient drying without sulphuring, until no juice exudes when pressed."}, {"id": 228, "section": "Preservation – Freezing & Drying", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Pomegranate seeds, when dried, produce a product used as a savoury and acidulant similar to tamarind in cooking, known as:", "options": ["Amchur", "Kokum", "Imli powder", "Anardana"], "correct": 3, "exp": "Dried pomegranate seeds are known as anardana, used as a savoury/acidulant like tamarind."}, {"id": 229, "section": "Preservatives & Food Colours", "difficulty": "Easy", "type": "recall", "passage": null, "q": "According to the Fruit Products Order (FPO) 1955, which two chemical preservatives are permitted for use in beverages?", "options": ["Potassium sorbate and Nitrite", "Ascorbic acid and Tartaric acid", "Sodium chloride and Citric acid", "Sulphur dioxide and Benzoic acid"], "correct": 3, "exp": "FPO 1955 permits two chemical preservatives in beverages: Sulphur dioxide and Benzoic acid."}, {"id": 230, "section": "Preservatives & Food Colours", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which chemical preservative is widely used in preservation of juice, pulp, nectar, squash and cordial, also acting as an antioxidant and bleaching agent that helps retain ascorbic acid and carotene?", "options": ["Sodium propionate", "Sulphur dioxide", "Sorbic acid", "Benzoic acid"], "correct": 1, "exp": "Sulphur dioxide (used as sulphite/bisulphate/metabisulphite salts) preserves juice/pulp/nectar and acts as an antioxidant and bleaching agent."}, {"id": 231, "section": "Preservatives & Food Colours", "difficulty": "Hard", "type": "recall", "passage": null, "q": "Since benzoic acid is only partially soluble in water, which more soluble salt form is commonly used instead as a food preservative?", "options": ["Calcium benzoate", "Potassium benzoate", "Sodium benzoate", "Ammonium benzoate"], "correct": 2, "exp": "Sodium benzoate is used since benzoic acid itself is poorly soluble (only 0.34 parts per 100 parts water) compared to sodium benzoate."}, {"id": 232, "section": "Preservatives & Food Colours", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Benzoic acid's antibacterial action against organisms like Bacillus subtilis is enhanced in the presence of which gas and condition?", "options": ["CO2 and acid", "Oxygen and alkalinity", "Nitrogen and neutral pH", "Ozone and high humidity"], "correct": 0, "exp": "Benzoic acid's antibacterial action increases in the presence of CO2 and acid; it is more effective against yeasts than moulds."}, {"id": 233, "section": "Preservatives & Food Colours", "difficulty": "Moderate", "type": "figure", "passage": null, "q": "In wine preservation by fermentation, what approximate alcohol concentration acts as a preservative, since yeasts cannot grow at that level?", "options": ["14 percent", "40 percent", "25 percent", "5 percent"], "correct": 0, "exp": "Fourteen percent alcohol prevents yeast growth in wines, acting as a natural preservative; about 2% acetic acid prevents spoilage in other fermented products."}, {"id": 234, "section": "Preservatives & Food Colours", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements about classification of preservatives:\n1. Class I preservatives include common salt, sugar, dextrose and honey.\n2. Class II preservatives include benzoic acid, sulphurous acid and sorbic acid salts.\n3. Nitrates/nitrites of sodium/potassium are Class I preservatives used in fresh fruit juices.\n4. Sodium and calcium propionate fall under Class II preservatives.\nWhich of the statements given above are correct?", "options": ["1, 2 and 4", "1 and 3", "3 and 4 only", "All of the above", "2 and 3"], "correct": 0, "exp": "Statement 3 is incorrect — nitrates/nitrites of sodium/potassium are Class II preservatives (used for foods like ham and pickled meat), not Class I."}, {"id": 235, "section": "Preservatives & Food Colours", "difficulty": "Hard", "type": "figure", "passage": null, "q": "Permitted synthetic food colour usage in fruit products is capped at what level?", "options": ["2 g/kg", "0.02 g/kg", "0.2 g/kg", "1 g/kg"], "correct": 2, "exp": "The chapter states permitted level of synthetic colour in fruit products is 0.2/kg."}, {"id": 236, "section": "Preservatives & Food Colours", "difficulty": "Hard", "type": "stmt", "passage": null, "q": "Consider the following statements about permitted heavy-metal impurity limits in synthetic food colours (FPO-1995):\n1. Copper is limited to 10 ppm.\n2. Chromium is limited to 20 ppm.\n3. Arsenic is limited to 1 ppm.\n4. Lead is limited to 100 ppm.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 2 and 3", "1 and 4", "1, 2 and 4", "All of the above"], "correct": 1, "exp": "Statement 4 is incorrect — Lead is limited to 10 ppm, not 100 ppm, per the chapter's FPO-1995 limits."}, {"id": 237, "section": "Preservatives & Food Colours", "difficulty": "Moderate", "type": "recall", "passage": null, "q": "Which of the following is listed as a permitted NATURAL food colour under FPO-1995?", "options": ["Curcumin", "Tartrazine", "Sunset Yellow", "Erythrosine"], "correct": 0, "exp": "Curcumin, along with Cochineal, Caramel, Annatto, Carotene, Chlorophyll, Lactoflavin, Ratanjot and Saffron, are permitted natural colours; the other options are synthetic dyes."}];

<script>
// ===================== State =====================
let state = {
  screen: 'home',        // home | sectionPicker | quiz | end
  mode: null,            // 'full' | 'section' | 'sprint'
  order: 'pdf',          // 'pdf' | 'shuffled'
  pool: [],              // active question objects for this run
  idx: 0,
  answers: {},           // qId -> { chosen: idx|null, skipped: bool, correct: bool }
  sectionName: null,
};

const SECTIONS = [...new Set(QUESTIONS.map(q => q.section))];
const SPRINT_TYPES = new Set(['stmt','figure']); // Figures & Statements Sprint

function sectionCount(name){ return QUESTIONS.filter(q=>q.section===name).length; }
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const app = document.getElementById('app');

function render(){
  if(state.screen==='home') return renderHome();
  if(state.screen==='sectionPicker') return renderSectionPicker();
  if(state.screen==='quiz') return renderQuiz();
  if(state.screen==='end') return renderEnd();
}

// ===================== Home =====================
function renderHome(){
  app.innerHTML = `
    <div class="brandline">
      <span class="mark">ARD · Plantation &amp; Horticulture Crops</span>
      <span class="meta">NABARD Grade A practice</span>
    </div>
    <div class="hero">
      <h1>Plantation &amp; Horticulture <em>Mock Test</em></h1>
      <p>${QUESTIONS.length} questions built directly from the chapter — classification systems, propagation, training &amp; pruning, hormones, maturity indices, and post-harvest technology.</p>
      <div class="notebox"><b>A note on format:</b> this chapter is technical/classification-based horticulture content with no schemes, ministries or eligibility criteria in the source text, so questions lean on passage-led definitions, bare technical recall, numbered-statement combinations, and precise figures rather than scheme-style questions.</div>
    </div>
    <div class="modes">
      <div class="mode-card" id="mode-full">
        <span class="num">01</span>
        <h3>Full Practice Test</h3>
        <p>All <span class="count">${QUESTIONS.length}</span> questions, cover to cover. Choose order below, then start.</p>
        <div class="toggle-row">
          <button class="toggle-btn ${state.order==='pdf'?'active':''}" data-order="pdf">PDF Order</button>
          <button class="toggle-btn ${state.order==='shuffled'?'active':''}" data-order="shuffled">Shuffled</button>
        </div>
      </div>
      <div class="mode-card" id="mode-section">
        <span class="num">02</span>
        <h3>Section-wise Revision</h3>
        <p>Drill one topic at a time — <span class="count">${SECTIONS.length}</span> topics.</p>
        <span class="arrow">›</span>
      </div>
      <div class="mode-card" id="mode-sprint">
        <span class="num">03</span>
        <h3>Figures &amp; Statements Sprint</h3>
        <p>Just the numbered-statement and precise-figure questions — <span class="count">${QUESTIONS.filter(q=>SPRINT_TYPES.has(q.type)).length}</span> questions.</p>
        <span class="arrow">›</span>
      </div>
    </div>
  `;
  document.querySelectorAll('.toggle-btn').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); state.order = b.dataset.order; render(); };
  });
  document.getElementById('mode-full').onclick = ()=> startRun('full');
  document.getElementById('mode-section').onclick = ()=>{ state.screen='sectionPicker'; render(); };
  document.getElementById('mode-sprint').onclick = ()=> startRun('sprint');
}

// ===================== Section Picker =====================
function renderSectionPicker(){
  app.innerHTML = `
    <div class="brandline">
      <span class="mark">ARD · Plantation &amp; Horticulture Crops</span>
      <span class="meta">NABARD Grade A practice</span>
    </div>
    <div class="backlink" id="back">‹ Back to menu</div>
    <div class="hero" style="margin-bottom:16px;">
      <h1 style="font-size:22px;">Section-wise <em>Revision</em></h1>
      <p>Pick a topic to drill just those questions.</p>
    </div>
    <div class="section-grid">
      ${SECTIONS.map(s=>`
        <div class="sec-card" data-sec="${encodeURIComponent(s)}">
          <div class="t">${s}</div>
          <div class="c">${sectionCount(s)} questions</div>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('back').onclick = ()=>{ state.screen='home'; render(); };
  document.querySelectorAll('.sec-card').forEach(c=>{
    c.onclick = ()=> startRun('section', decodeURIComponent(c.dataset.sec));
  });
}

// ===================== Run setup =====================
function startRun(mode, sectionName){
  state.mode = mode;
  state.sectionName = sectionName || null;
  let pool;
  if(mode==='full') pool = QUESTIONS.slice();
  else if(mode==='sprint') pool = QUESTIONS.filter(q=>SPRINT_TYPES.has(q.type));
  else pool = QUESTIONS.filter(q=>q.section===sectionName);

  if(mode==='full' && state.order==='shuffled') pool = shuffleArr(pool);
  if(mode==='sprint') pool = shuffleArr(pool);

  state.pool = pool;
  state.idx = 0;
  state.answers = {};
  state.screen = 'quiz';
  render();
}

// ===================== Quiz =====================
function currentQ(){ return state.pool[state.idx]; }

function renderQuiz(){
  const q = currentQ();
  const total = state.pool.length;
  const answered = state.answers[q.id];
  const answeredCount = Object.keys(state.answers).length;
  const correctCount = Object.values(state.answers).filter(a=>a.correct).length;
  const pct = Math.round(((state.idx)/total)*100);

  const modeLabel = state.mode==='full' ? `Full Practice · ${state.order==='pdf'?'PDF Order':'Shuffled'}`
                    : state.mode==='sprint' ? 'Figures & Statements Sprint'
                    : `Section · ${state.sectionName}`;

  app.innerHTML = `
    <div class="brandline">
      <span class="mark">${modeLabel}</span>
      <span class="meta">Question ${state.idx+1} of ${total}</span>
    </div>
    <div class="quiz-header">
      <div class="progress-row">
        <span>Progress</span>
        <span class="score-pill">Score: <b>${correctCount}</b> / ${answeredCount} answered</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-meta">
      <span class="tag diff-${q.difficulty}">${q.difficulty}</span>
      <span class="tag">${labelForType(q.type)}</span>
      <span class="tag">${q.section}</span>
    </div>
    ${q.passage ? `<div class="passage"><span class="label">Instructions</span>${escapeHtml(q.passage)}</div>` : ''}
    <div class="question">${escapeHtml(q.q)}</div>
    <div class="options" id="opts">
      ${q.options.map((opt,i)=>`
        <button class="opt" data-i="${i}" ${answered?'disabled':''}>
          <span class="letter">${String.fromCharCode(65+i)}</span>
          <span>${escapeHtml(opt)}</span>
        </button>
      `).join('')}
    </div>
    <div id="explainSlot"></div>
    <div class="controls">
      <button class="btn ghost" id="skipBtn" ${answered?'disabled':''}>Skip</button>
      <button class="btn primary" id="nextBtn" ${answered?'':'disabled'}>${state.idx===total-1?'Finish':'Next'}</button>
    </div>
  `;

  if(answered){ paintAnswered(q, answered); }

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=> chooseOption(q, parseInt(btn.dataset.i,10));
  });
  document.getElementById('skipBtn').onclick = ()=> skipQuestion(q);
  document.getElementById('nextBtn').onclick = ()=> goNext();
}

function labelForType(t){
  return { passage:'Passage-Led', recall:'Technical Recall', stmt:'Statement-Based', figure:'Figure Recall' }[t] || t;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function chooseOption(q, i){
  const correct = (i === q.correct);
  state.answers[q.id] = { chosen: i, skipped:false, correct };
  paintAnswered(q, state.answers[q.id]);
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('skipBtn').disabled = true;
  document.getElementById('nextBtn').disabled = false;
  refreshScorePill();
}

function skipQuestion(q){
  state.answers[q.id] = { chosen:null, skipped:true, correct:false };
  paintAnswered(q, state.answers[q.id]);
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('skipBtn').disabled = true;
  document.getElementById('nextBtn').disabled = false;
  refreshScorePill();
}

function refreshScorePill(){
  const answeredCount = Object.keys(state.answers).length;
  const correctCount = Object.values(state.answers).filter(a=>a.correct).length;
  const pill = document.querySelector('.score-pill');
  if(pill) pill.innerHTML = `Score: <b>${correctCount}</b> / ${answeredCount} answered`;
}

function paintAnswered(q, ans){
  document.querySelectorAll('.opt').forEach((btn,i)=>{
    btn.disabled = true;
    if(i===q.correct) btn.classList.add('correct');
    else if(i===ans.chosen) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  const slot = document.getElementById('explainSlot');
  let verdict, verdictClass;
  if(ans.skipped){ verdict='Skipped —'; verdictClass='skip'; }
  else if(ans.correct){ verdict='Correct.'; verdictClass='ok'; }
  else{ verdict='Not quite.'; verdictClass='no'; }
  slot.innerHTML = `<div class="explain"><span class="verdict ${verdictClass}">${verdict}</span>${escapeHtml(q.exp)}</div>`;
}

function goNext(){
  if(state.idx < state.pool.length-1){
    state.idx += 1;
    render();
  } else {
    state.screen = 'end';
    render();
  }
}

// ===================== End Screen =====================
function renderEnd(){
  const total = state.pool.length;
  const list = state.pool.map(q=>({ q, a: state.answers[q.id] || {chosen:null, skipped:true, correct:false} }));
  const correct = list.filter(x=>x.a.correct).length;
  const skipped = list.filter(x=>x.a.skipped).length;
  const wrong = total - correct - skipped;
  const pct = total ? Math.round((correct/total)*100) : 0;

  const byDiff = {};
  ['Easy','Moderate','Hard'].forEach(d=>{
    const items = list.filter(x=>x.q.difficulty===d);
    const c = items.filter(x=>x.a.correct).length;
    byDiff[d] = { total: items.length, correct: c };
  });

  const missedOrSkipped = list.filter(x=> !x.a.correct);

  app.innerHTML = `
    <div class="brandline">
      <span class="mark">Results</span>
      <span class="meta">${state.mode==='full'?'Full Practice Test':state.mode==='sprint'?'Figures & Statements Sprint':'Section · '+state.sectionName}</span>
    </div>
    <div class="end-score">
      <div class="big">${pct}%</div>
      <div class="sub">${correct} correct · ${wrong} incorrect · ${skipped} skipped &nbsp;(out of ${total})</div>
    </div>
    <div class="breakdown">
      ${['Easy','Moderate','Hard'].map(d=>`
        <div class="bd-card">
          <div class="n">${byDiff[d].total ? byDiff[d].correct+'/'+byDiff[d].total : '—'}</div>
          <div class="l">${d}</div>
        </div>
      `).join('')}
    </div>
    <div class="end-actions">
      <button class="btn primary" id="retryBtn">Retry Same Set</button>
      <button class="btn ghost" id="menuBtn">Back to Menu</button>
    </div>
    ${missedOrSkipped.length ? `
      <div class="review-toggle" id="reviewToggle">Review ${missedOrSkipped.length} missed / skipped question${missedOrSkipped.length>1?'s':''} ▾</div>
      <div class="review-list" id="reviewList">
        ${missedOrSkipped.map(x=>`
          <div class="review-item">
            <div class="rq">${escapeHtml(x.q.q)}</div>
            ${x.a.skipped ? '' : `<div class="ra wrong-line">Your answer: ${String.fromCharCode(65+x.a.chosen)}. ${escapeHtml(x.q.options[x.a.chosen])}</div>`}
            <div class="ra correct-line">Correct answer: ${String.fromCharCode(65+x.q.correct)}. ${escapeHtml(x.q.options[x.q.correct])}</div>
            <div class="rexp">${escapeHtml(x.q.exp)}</div>
          </div>
        `).join('')}
      </div>
    ` : `<div class="empty-hint">Clean sweep — nothing missed or skipped.</div>`}
  `;

  document.getElementById('retryBtn').onclick = ()=>{
    state.idx = 0;
    state.answers = {};
    if(state.mode==='full' && state.order==='shuffled') state.pool = shuffleArr(state.pool);
    if(state.mode==='sprint') state.pool = shuffleArr(state.pool);
    state.screen='quiz';
    render();
  };
  document.getElementById('menuBtn').onclick = ()=>{ state.screen='home'; render(); };
  const rt = document.getElementById('reviewToggle');
  if(rt){
    rt.onclick = ()=>{
      const list2 = document.getElementById('reviewList');
      list2.classList.toggle('open');
      rt.textContent = rt.textContent.includes('▾')
        ? rt.textContent.replace('▾','▴')
        : rt.textContent.replace('▴','▾');
    };
  }
}

// ===================== Boot =====================
render();

</script>
</body>
</html>
