<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ESI/GA Schemes Practice — NABARD Grade A</title>
<style>
  :root{
    --bg: #14171c;
    --bg-raised: #1b1f26;
    --bg-card: #20242c;
    --line: #2c313b;
    --ink: #e8e6df;
    --ink-dim: #9aa0ab;
    --ink-faint: #6b7280;
    --gold: #c9a24b;
    --gold-dim: #8a7238;
    --teal: #3a9188;
    --green: #4caf7d;
    --green-bg: rgba(76,175,125,0.14);
    --red: #d9685f;
    --red-bg: rgba(217,104,95,0.14);
    --serif: Georgia, Cambria, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app{ max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; min-height: 100vh; }

  /* ---------- Header ---------- */
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .brand h1{
    font-family: var(--serif); font-size: 1.35rem; font-weight: 400;
    letter-spacing: 0.2px; margin:0; color: var(--ink);
  }
  .brand h1 em{ color: var(--gold); font-style: normal; }
  .brand .tag{ font-size: 0.72rem; color: var(--ink-faint); font-family: var(--sans); }

  /* ---------- Home screen ---------- */
  .intro{
    font-family: var(--serif); font-size: 0.98rem; line-height: 1.6;
    color: var(--ink-dim); margin: 0 0 30px; max-width: 56ch;
  }
  .mode-list{ display:flex; flex-direction:column; gap:14px; }
  .mode-card{
    background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px 22px; cursor:pointer; text-align:left; width:100%;
    transition: border-color .15s ease, transform .1s ease;
    font-family: var(--sans); color: var(--ink);
  }
  .mode-card:hover{ border-color: var(--gold-dim); }
  .mode-card:active{ transform: scale(0.995); }
  .mode-card .mtitle{ font-family: var(--serif); font-size: 1.08rem; margin-bottom:6px; color: var(--ink); }
  .mode-card .mdesc{ font-size: 0.85rem; color: var(--ink-dim); line-height:1.5; }
  .mode-card .mcount{ font-size: 0.75rem; color: var(--gold); margin-top:8px; }

  .stats-strip{
    display:flex; gap:20px; margin: 22px 0 6px; font-size: 0.78rem; color: var(--ink-faint);
    flex-wrap: wrap;
  }
  .stats-strip b{ color: var(--ink-dim); }

  /* ---------- Section grid ---------- */
  .back-link{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    color: var(--ink-dim); font-size:0.85rem; cursor:pointer; padding: 4px 0; margin-bottom: 18px;
    font-family: var(--sans);
  }
  .back-link:hover{ color: var(--gold); }
  .screen-title{ font-family: var(--serif); font-size: 1.2rem; margin: 0 0 6px; }
  .screen-sub{ font-size: 0.85rem; color: var(--ink-dim); margin: 0 0 20px; }

  .topic-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width: 480px){ .topic-grid{ grid-template-columns: 1fr; } }
  .topic-card{
    background: var(--bg-card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; cursor:pointer; text-align:left; color: var(--ink);
    font-family: var(--sans);
  }
  .topic-card:hover{ border-color: var(--gold-dim); }
  .topic-card .ttitle{ font-size: 0.86rem; line-height:1.35; margin-bottom:8px; }
  .topic-card .tcount{ font-size: 0.72rem; color: var(--gold); }

  /* ---------- Toggle (Full test order) ---------- */
  .toggle-row{ display:flex; gap:0; margin-bottom: 20px; border:1px solid var(--line); border-radius: var(--radius); overflow:hidden; width: fit-content; }
  .toggle-btn{
    background: var(--bg-card); border:none; color: var(--ink-dim); padding: 10px 18px;
    font-size: 0.82rem; cursor:pointer; font-family: var(--sans);
  }
  .toggle-btn.active{ background: var(--gold-dim); color: var(--ink); }
  .start-btn{
    background: var(--gold); color: #1a1a16; border:none; border-radius: var(--radius);
    padding: 13px 26px; font-size: 0.92rem; font-weight:600; cursor:pointer; font-family: var(--sans);
  }
  .start-btn:hover{ filter: brightness(1.06); }

  /* ---------- Quiz screen ---------- */
  .quiz-top{ margin-bottom: 18px; }
  .progress-row{ display:flex; justify-content:space-between; align-items:center; font-size:0.78rem; color: var(--ink-faint); margin-bottom:8px; }
  .progress-bar{ height:5px; background: var(--line); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background: var(--gold); transition: width .25s ease; }
  .score-chip{ font-size:0.78rem; color: var(--green); font-family: var(--sans); }

  .qmeta{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .badge{
    font-size: 0.68rem; padding: 3px 9px; border-radius: 20px; letter-spacing:0.2px;
    border:1px solid var(--line); color: var(--ink-faint); font-family: var(--sans);
  }
  .badge.diff-E{ color:#7fbf8f; border-color: rgba(127,191,143,.3); }
  .badge.diff-M{ color: var(--gold); border-color: rgba(201,162,75,.3); }
  .badge.diff-H{ color: var(--red); border-color: rgba(217,104,95,.3); }

  .passage{
    background: var(--bg-raised); border-left: 3px solid var(--gold-dim); border-radius: 4px;
    padding: 14px 16px; margin-bottom: 16px; font-family: var(--serif); font-size: 0.92rem;
    line-height: 1.65; color: var(--ink-dim); white-space: pre-line;
  }
  .question-stem{
    font-family: var(--serif); font-size: 1.08rem; line-height:1.55; margin: 0 0 18px; color: var(--ink);
  }
  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom: 18px; }
  .option{
    display:flex; gap:12px; align-items:flex-start; background: var(--bg-card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px;
    cursor:pointer; text-align:left; font-family: var(--sans); font-size: 0.9rem; color: var(--ink);
    line-height: 1.45; transition: border-color .12s ease, background .12s ease;
  }
  .option:hover:not(.locked){ border-color: var(--gold-dim); }
  .option .oletter{
    flex-shrink:0; width:22px; height:22px; border-radius:50%; border:1px solid var(--ink-faint);
    display:flex; align-items:center; justify-content:center; font-size:0.72rem; color: var(--ink-faint);
  }
  .option.correct{ background: var(--green-bg); border-color: var(--green); }
  .option.correct .oletter{ border-color: var(--green); color: var(--green); }
  .option.wrong{ background: var(--red-bg); border-color: var(--red); }
  .option.wrong .oletter{ border-color: var(--red); color: var(--red); }
  .option.locked{ cursor: default; }
  .option.dim{ opacity: 0.55; }

  .explain{
    background: var(--bg-raised); border-radius: var(--radius); padding: 14px 16px;
    font-size: 0.85rem; line-height: 1.6; color: var(--ink-dim); margin-bottom: 18px;
    border: 1px solid var(--line);
  }
  .explain b{ color: var(--ink); }

  .quiz-actions{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .skip-btn{
    background:none; border:1px solid var(--line); color: var(--ink-dim); border-radius: var(--radius);
    padding: 11px 18px; font-size: 0.84rem; cursor:pointer; font-family: var(--sans);
  }
  .skip-btn:hover{ border-color: var(--red); color: var(--red); }
  .next-btn{
    background: var(--gold); color: #1a1a16; border:none; border-radius: var(--radius);
    padding: 11px 22px; font-size: 0.88rem; font-weight:600; cursor:pointer; font-family: var(--sans);
  }
  .next-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  /* ---------- Results screen ---------- */
  .result-hero{ text-align:center; padding: 20px 0 26px; border-bottom:1px solid var(--line); margin-bottom: 24px; }
  .result-hero .rscore{ font-family: var(--serif); font-size: 2.6rem; color: var(--gold); }
  .result-hero .rlabel{ font-size:0.85rem; color: var(--ink-dim); margin-top:4px; }
  .breakdown{ display:flex; gap:12px; margin-bottom:26px; }
  .bd-card{ flex:1; background: var(--bg-card); border:1px solid var(--line); border-radius: var(--radius); padding: 14px; text-align:center; }
  .bd-card .bdn{ font-family: var(--serif); font-size:1.3rem; }
  .bd-card .bdl{ font-size:0.68rem; color: var(--ink-faint); margin-top:4px; }

  .review-item{
    background: var(--bg-card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 12px;
  }
  .review-item .rtopic{ font-size:0.7rem; color: var(--gold); margin-bottom:6px; }
  .review-item .rq{ font-family: var(--serif); font-size: 0.95rem; margin-bottom:10px; line-height:1.5; }
  .review-item .rline{ font-size:0.83rem; margin-bottom:4px; line-height:1.5; }
  .review-item .ryour{ color: var(--red); }
  .review-item .rcorrect{ color: var(--green); }
  .review-item .rskip{ color: var(--ink-faint); font-style: italic; }
  .review-item .rexp{ font-size:0.82rem; color: var(--ink-dim); margin-top:8px; line-height:1.55; }

  .end-actions{ display:flex; gap:12px; margin-top: 24px; }
  .end-actions button{ flex:1; }
  .secondary-btn{
    background: var(--bg-card); color: var(--ink); border:1px solid var(--line); border-radius: var(--radius);
    padding: 13px; font-size: 0.88rem; cursor:pointer; font-family: var(--sans);
  }
  .secondary-btn:hover{ border-color: var(--gold-dim); }

  .empty-note{ color: var(--ink-faint); font-size: 0.85rem; padding: 30px 0; text-align:center; }

  h3.section-h{ font-family: var(--serif); font-size:1rem; color: var(--ink); margin: 26px 0 12px; }
</style>
</head>

/Current Status section on MPMS."}, {"topic": "Mobile Phone Manufacturing Scheme (MPMS)", "diff": "H", "ftype": "fig", "passage": null, "q": "Which one of the following correctly pairs the MPMS incentive component with its rate?", "opts": ["Domestic sourcing linked incentive: up to 3%; Design & R&D incentive for Indian brands: 1.5%", "Domestic sourcing linked incentive: up to 1%; Design & R&D incentive for Indian brands: 2%", "Domestic sourcing linked incentive: up to 1.5%; Design & R&D incentive for Indian brands: 3%", "Domestic sourcing linked incentive: up to 2%; Design & R&D incentive for Indian brands: 4%", "Domestic sourcing linked incentive: up to 5%; Design & R&D incentive for Indian brands: 2.25%"], "correct": 2, "exp": "The scheme provides an additional incentive of up to 1.5% linked to domestic sourcing, and an additional 3% incentive on eligible sales for design and R&D for building Indian brands."}, {"topic": "Pradhan Mantri Surya Sarovar Yojana (PM-SSY)", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the total outlay approved for the Pradhan Mantri Surya Sarovar Yojana (PM-SSY)?", "opts": ["₹5,070 crore", "₹5,700 crore", "₹50,700 crore", "₹570 crore", "₹7,050 crore"], "correct": 0, "exp": "PM-SSY was approved with a total outlay of ₹5,070 crore for the development of Floating Solar Photovoltaic Projects with Energy Storage Systems."}, {"topic": "Pradhan Mantri Surya Sarovar Yojana (PM-SSY)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about PM-SSY is correct?", "opts": ["CFA of up to ₹1 crore per project is available for feasibility studies.", "The scheme provides CFA of ₹1 crore per MW before commissioning of projects.", "The minimum storage capacity mandated under the scheme is one hour, i.e., 5,000 MWh.", "Projects under PM-SSY will be sanctioned during FY2025-26 to FY2029-30.", "PM-SSY has a total outlay of ₹5,070 crore for developing 5,000 MW of floating solar PV with co-located Energy Storage Systems."], "correct": 4, "exp": "CFA of ₹1 crore/MW is paid after successful commissioning (not before); projects are sanctioned FY2026-27 to FY2030-31; the minimum storage capacity is two hours (10,000 MWh); feasibility-study CFA is up to ₹50 lakh/project, not ₹1 crore."}, {"topic": "Pradhan Mantri Surya Sarovar Yojana (PM-SSY)", "diff": "M", "ftype": "num", "passage": "Recently, the Cabinet approved PM-SSY for the development of floating solar photovoltaic projects.\n1. The scheme envisages 5,000 MW of floating solar PV with co-located Energy Storage Systems having a minimum storage capacity of two hours (10,000 MWh).\n2. CFA of ₹1 crore per MW will be provided for eligible projects after successful commissioning.\n3. Disbursement of financial support under the scheme will continue only up to FY2030-31.\n4. CFA of up to ₹50 lakh per project is available for feasibility studies, including bathymetry and hydrography assessments.", "q": "Which of the above statements is/are correct?", "opts": ["1, 2 and 3", "1, 2 and 4", "1 and 4", "All of the above", "2 and 3"], "correct": 1, "exp": "Statement 3 is incorrect: while projects are sanctioned during FY2026-27 to FY2030-31, disbursement of financial support continues up to FY2032-33, not stopping at FY2030-31. Statements 1, 2 and 4 are correct."}, {"topic": "Pradhan Mantri Surya Sarovar Yojana (PM-SSY)", "diff": "M", "ftype": "fig", "passage": null, "q": "Under PM-SSY, which one of the following correctly represents the capacity target paired with the mandated storage requirement?", "opts": ["Capacity: 10,000 MW; Minimum storage: 1 hour (10,000 MWh)", "Capacity: 5,000 MW; Minimum storage: 4 hours (20,000 MWh)", "Capacity: 10,000 MW; Minimum storage: 2 hours (20,000 MWh)", "Capacity: 5,000 MW; Minimum storage: 2 hours (10,000 MWh)", "Capacity: 5,000 MW; Minimum storage: 1 hour (5,000 MWh)"], "correct": 3, "exp": "PM-SSY envisages 5,000 MW of floating solar PV with co-located ESS having a minimum storage capacity of two hours, i.e., 10,000 MWh."}, {"topic": "Pradhan Mantri Surya Sarovar Yojana (PM-SSY)", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT genuinely part of the feasibility studies eligible for CFA under PM-SSY?", "opts": ["Hydrography assessments", "Marine biodiversity impact audits", "Environmental studies", "Other de-risking preparatory activities", "Bathymetry assessments"], "correct": 1, "exp": "The chapter mentions bathymetry and hydrography assessments, environmental studies, and other de-risking preparatory activities as eligible feasibility study components — 'marine biodiversity impact audits' is not mentioned."}, {"topic": "Pradhan Mantri Surya Sarovar Yojana (PM-SSY)", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the maximum CFA available per project for undertaking feasibility studies under PM-SSY?", "opts": ["₹1 crore", "₹10 lakh", "₹50 lakh", "₹75 lakh", "₹25 lakh"], "correct": 2, "exp": "CFA of up to ₹50 lakh per project is available for undertaking feasibility studies, including bathymetry and hydrography assessments and environmental studies."}, {"topic": "Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the total outlay of the Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)?", "opts": ["₹99,446 crore", "₹1,00,446 crore", "₹94,446 crore", "₹69,446 crore", "₹89,446 crore"], "correct": 0, "exp": "PM-VBRY has a total outlay of ₹99,446 crore."}, {"topic": "Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about PM-VBRY is correct?", "opts": ["The incentive to first-time employees is capped at ₹25,000, paid in three instalments.", "Employer support duration is uniformly 4 years across all sectors.", "PM-VBRY was announced in August 2026 with an outlay of ₹99,446 crore.", "PM-VBRY's nodal framework is the Employees' State Insurance Corporation (ESIC).", "The scheme period runs from 1 August 2025 to 31 July 2027, with a job creation target of over 3.5 crore."], "correct": 4, "exp": "PM-VBRY's nodal framework is the EPFO, not ESIC; the first-time employee incentive is capped at ₹15,000 paid in two instalments; employer support is 2 years generally, extended to 4 years only for manufacturing; the scheme was announced in August 2025, not 2026."}, {"topic": "Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)", "diff": "M", "ftype": "num", "passage": "Recently, on 1 August 2026, PM-VBRY completed one year of implementation.\n1. The scheme targets employment generation for over 3.5 crore people, including 1.92 crore first-time employees.\n2. The incentive to first-time employees is a one-time amount equivalent to one month's EPF wage, capped at ₹15,000.\n3. The first instalment of the employee incentive is paid after twelve months of service, and the second after six months.\n4. Employers are eligible for incentives on employees with salaries up to ₹1,00,000 per month.", "q": "Which of the statements given above is/are correct?", "opts": ["Only 1", "1, 2 and 4", "2 and 3", "1, 3 and 4", "All of the above"], "correct": 1, "exp": "Statement 3 reverses the actual sequence: the first instalment is paid after six months of service, and the second after twelve months of continuous service — not the other way round."}, {"topic": "Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)", "diff": "M", "ftype": "num", "passage": "As per PM-VBRY's Part B (Support to Employers):\n1. Employers receive up to ₹3,000 per month for each additional eligible employee retained for at least six months.\n2. The duration of employer support is 2 years for all sectors.\n3. For the manufacturing sector, support is extended to 4 years, covering the third and fourth years additionally.\n4. Employer incentives apply only to employees with salaries up to ₹50,000 per month.", "q": "Which of the above statements is/are correct?", "opts": ["1 and 4", "Only 1", "1, 2 and 3", "All of the above", "2, 3 and 4"], "correct": 2, "exp": "Statement 4 is incorrect: employer incentives under Part B apply to employees with salaries up to ₹1,00,000 per month, not ₹50,000. Statements 1, 2 and 3 are correct."}, {"topic": "Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT genuinely a mandatory feature for a first-time employee to receive the second instalment of incentive under PM-VBRY?", "opts": ["Completion of an Online Financial Literacy course", "Twelve months of continuous service", "Gross wages up to ₹1 lakh per month", "Investment of a portion of the incentive in a mutual fund of the employee's own choice", "Registration with EPFO"], "correct": 3, "exp": "The chapter states that a portion of the incentive is invested in a 'designated savings instrument' to encourage financial security — not a 'mutual fund of the employee's own choice'."}, {"topic": "Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the maximum one-time incentive amount payable to a first-time employee under PM-VBRY?", "opts": ["₹25,000", "₹10,000", "₹20,000", "₹12,000", "₹15,000"], "correct": 4, "exp": "The incentive to first-time employees registered with EPFO is up to ₹15,000, capped at one month's EPF wage."}, {"topic": "Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)", "diff": "E", "ftype": "acr", "passage": null, "q": "What does 'PM-VBRY' stand for?", "opts": ["Pradhan Mantri Viksit Bharat Rozgar Yojana", "Pradhan Mantri Naya Bharat Rozgar Yojana", "Pradhan Mantri Viksit Bharat Employment Abhiyan", "Pradhan Mantri Vikas Bharat Employment Yojana", "Pradhan Mantri Viksit Bharat Kaushal Yojana"], "correct": 0, "exp": "PM-VBRY stands for Pradhan Mantri Viksit Bharat Rozgar Yojana."}, {"topic": "Pradhan Mantri Viksit Bharat Rozgar Yojana (PM-VBRY)", "diff": "H", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["PM-VBRY complements the National Manufacturing Mission by promoting employment in new and expanding industries.", "Employers of all sectors get support for 2 years, extended to 4 years for the manufacturing sector.", "The scheme's nodal framework is EPFO.", "Employees with gross wages up to ₹1 lakh per month are eligible for the Part A incentive.", "The employee incentive under Part A is disbursed in a single lump sum after six months of service."], "correct": 4, "exp": "The Part A incentive is actually paid in two instalments — after six months and after twelve months of continuous service — not as a single lump sum."}, {"topic": "Samudra Manthan — National Offshore Exploration Scheme", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the Phase-I outlay approved for the 'Samudra Manthan' National Offshore Exploration Scheme?", "opts": ["₹94,084 crore", "₹80,484 crore", "₹84,048 crore", "₹84,084 crore", "₹48,084 crore"], "correct": 3, "exp": "The Phase-I outlay of Samudra Manthan is ₹84,084 crore."}, {"topic": "Samudra Manthan — National Offshore Exploration Scheme", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about Samudra Manthan is correct?", "opts": ["Samudra Manthan is a Centrally Sponsored Scheme with validity up to 31 March 2028.", "The Phase-I outlay of the scheme is ₹84,084 crore, with financial support capped at 75% of drilling costs.", "The scheme provides financial support of up to 50% of the cost of drilling deepwater exploration wells, with Phase-I validity up to 31 March 2031.", "The scheme aims to increase India's oil & gas production from 80 MMTOE to 100 MMTOE annually.", "Samudra Manthan targets expansion of the hydrocarbon resource base from 2.2 billion TOE to 1.6 billion TOE."], "correct": 2, "exp": "Samudra Manthan is a Central Sector Scheme (not Centrally Sponsored) valid up to 31 March 2031; the production target is 62 to 80 MMTOE (not 80 to 100); the resource base expansion is from 1.6 to 2.2 billion TOE (not reversed); financial support is capped at 50%, not 75%."}, {"topic": "Samudra Manthan — National Offshore Exploration Scheme", "diff": "M", "ftype": "num", "passage": "The Cabinet approved 'Samudra Manthan' — National Offshore Exploration Scheme.\n1. It is a Central Sector Scheme with a Phase-I outlay of ₹84,084 crore.\n2. The scheme aims to increase India's domestic oil and gas production from around 62 MMTOE to 80 MMTOE annually.\n3. It aims to expand the hydrocarbon resource base from 2.2 billion TOE to 1.6 billion TOE.\n4. The scheme provides financial support of up to 50% of the cost of drilling deepwater exploration wells.", "q": "Which of the above statements is/are correct?", "opts": ["1, 2 and 4", "1 and 3", "All of the above", "2, 3 and 4", "Only 2"], "correct": 0, "exp": "Statement 3 reverses the actual direction: the scheme expands the hydrocarbon resource base from 1.6 billion TOE to 2.2 billion TOE, not the other way round."}, {"topic": "Samudra Manthan — National Offshore Exploration Scheme", "diff": "H", "ftype": "fig", "passage": null, "q": "Which one of the following correctly pairs India's production target with the import reduction potential under Samudra Manthan?", "opts": ["Target production increase: 50 to 62 MMTOE; Import reduction potential: nearly ₹1 lakh crore annually", "Target production increase: 62 to 80 MMTOE; Import reduction potential: nearly ₹1 lakh crore annually", "Target production increase: 62 to 80 MMTOE; Import reduction potential: nearly ₹2 lakh crore annually", "Target production increase: 62 to 90 MMTOE; Import reduction potential: nearly ₹75,000 crore annually", "Target production increase: 80 to 100 MMTOE; Import reduction potential: nearly ₹50,000 crore annually"], "correct": 1, "exp": "The scheme aims to raise production from ~62 MMTOE to 80 MMTOE annually, with the potential to cut crude oil import bills by nearly ₹1 lakh crore annually."}, {"topic": "Samudra Manthan — National Offshore Exploration Scheme", "diff": "E", "ftype": "fig", "passage": null, "q": "As per the chapter, India is the world's ______ largest consumer of crude oil.", "opts": ["second", "fifth", "third", "first", "fourth"], "correct": 2, "exp": "The chapter states India is the world's third-largest consumer of crude oil."}, {"topic": "Samudra Manthan — National Offshore Exploration Scheme", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["The scheme provides financial support of up to 50% of deepwater drilling well costs.", "India is the world's second-largest consumer of crude oil.", "The scheme aims to expand the hydrocarbon resource base to 2.2 billion TOE.", "Samudra Manthan represents a shift to mission-mode execution in offshore exploration.", "The scheme's Phase-I validity extends up to 31 March 2031."], "correct": 1, "exp": "India is described in the chapter as the world's third-largest consumer of crude oil, not second-largest."}, {"topic": "Semicon 2.0", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the total budget outlay of the Semicon 2.0 programme?", "opts": ["₹1,27,500 crore", "₹1,27,000 crore", "₹1,17,500 crore", "₹76,000 crore", "₹1,37,500 crore"], "correct": 0, "exp": "Semicon 2.0 was approved with a total budget outlay of ₹1,27,500 crore. (₹76,000 crore was the outlay of the earlier Semicon India Program/ISM 1.0.)"}, {"topic": "Semicon 2.0", "diff": "E", "ftype": "fig", "passage": null, "q": "In which month/year was Semicon 2.0 approved by the Union Cabinet?", "opts": ["December 2026", "January 2026", "July 2025", "July 2026", "October 2025"], "correct": 3, "exp": "Semicon 2.0 was approved in July 2026."}, {"topic": "Semicon 2.0", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is correct?", "opts": ["Under Semicon 2.0, capex support for conventional packaging units is 35%.", "The revised incentive structure under Semicon 2.0 offers 40% capex support for advanced packaging facilities.", "Semicon 2.0 was launched in 2021 by the Ministry of Electronics & Information Technology.", "Under Semicon 2.0, capex support for silicon fabs has been increased to 50% from 40% under ISM 1.0.", "Semicon 2.0 has a total budget outlay of ₹1,27,500 crore, approved in July 2026 by the Union Cabinet."], "correct": 4, "exp": "Capex support for silicon fabs was actually reduced from 50% to 40%; the 2021 MeitY launch refers to the earlier Semicon India Program (ISM 1.0), not Semicon 2.0; conventional packaging units get 25% (not 35%); advanced packaging facilities get 35% (not 40%)."}, {"topic": "Semicon 2.0", "diff": "M", "ftype": "num", "passage": "Recently in July 2026, the Union Cabinet approved the Semicon 2.0 programme.\n1. Semicon 2.0 has a total budget outlay of ₹1,27,500 crore.\n2. Under the revised incentive structure, capex support for silicon fabs has been reduced to 40% from 50% earlier.\n3. The programme builds on Semicon 1.0, also known as the India Semiconductor Mission (ISM) 2.0.\n4. Capex support for Display, Compound Semiconductor & other fabs stands at 35% under Semicon 2.0.", "q": "Which of the above statements is/are correct?", "opts": ["1 and 3", "1, 2 and 4", "Only 1 and 2", "2, 3 and 4", "All the above"], "correct": 1, "exp": "Statement 3 is incorrect: Semicon 2.0 builds on Semicon 1.0, also known as India Semiconductor Mission (ISM) 1.0 — not 'ISM 2.0'."}, {"topic": "Semicon 2.0", "diff": "M", "ftype": "num", "passage": "Under the Six Key Pillars of Semicon 2.0:\n1. The 'Design' pillar builds on the success of 105 startups already developing semiconductor chips.\n2. India's first semiconductor fabrication plant is scheduled to be commissioned in 2027.\n3. The 'Talent Development' pillar covers clean-room operations, semiconductor fabrication, and fab construction.\n4. India's semiconductor journey under the R&D pillar began with technologies ranging from 28 nm to 110 nm.", "q": "Which of the above statements is/are correct?", "opts": ["1 and 2", "2, 3 and 4", "Only 1", "1, 3 and 4", "All of the above"], "correct": 3, "exp": "Statement 2 is incorrect: India's first semiconductor fabrication plant is scheduled to be commissioned in 2028, not 2027."}, {"topic": "Semicon 2.0", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT one of the Six Key Pillars of Semicon 2.0?", "opts": ["Global Chip Diplomacy", "Design", "ATMP/OSAT Industry", "Machines & Materials", "Talent Development"], "correct": 0, "exp": "The Six Key Pillars of Semicon 2.0 are Design, Machines & Materials, Setting up More Fabs, ATMP/OSAT Industry, Research & Development, and Talent Development. 'Global Chip Diplomacy' is not one of them."}, {"topic": "Semicon 2.0", "diff": "M", "ftype": "fig", "passage": null, "q": "Which one of the following correctly states the progress under ISM 1.0 (Semicon 1.0)?", "opts": ["9 projects approved; cumulative investment of more than ₹1.27 lakh crore", "10 projects approved; cumulative investment of more than ₹1.64 lakh crore", "12 projects approved; cumulative investment of more than ₹1.64 lakh crore", "12 projects approved; cumulative investment of more than ₹2 lakh crore", "12 projects approved; cumulative investment of more than ₹76,000 crore"], "correct": 2, "exp": "Under ISM 1.0, 12 semiconductor manufacturing projects were approved with a cumulative investment of more than ₹1.64 lakh crore."}, {"topic": "Semicon 2.0", "diff": "H", "ftype": "num", "passage": "Regarding Key Progress under ISM 1.0 (Semicon 1.0):\n1. A total of 12 semiconductor manufacturing projects were approved with cumulative investment of more than ₹1.64 lakh crore.\n2. This includes 1 silicon fabrication plant and 1 silicon carbide fabrication unit.\n3. It includes 2 integrated Gallium Nitride (GaN) Micro LED display fabrication facilities.\n4. It includes 9 semiconductor packaging units.", "q": "Which of the above statements is/are correct?", "opts": ["2 and 3", "All of the above", "Only 1", "1, 2, 3 and 4", "1, 2 and 4"], "correct": 4, "exp": "Statement 3 is incorrect: ISM 1.0's progress includes only 1 integrated Gallium Nitride (GaN) Micro LED display fabrication facility, not 2."}, {"topic": "Semicon 2.0", "diff": "M", "ftype": "fig", "passage": null, "q": "Which one of the following correctly identifies the launch year and nodal ministry of the Semicon India Program (ISM 1.0)?", "opts": ["Launched 2019 by the Ministry of Commerce & Industry", "Launched 2022 by MeitY", "Launched 2021 by the Ministry of Finance", "Launched 2021 by NITI Aayog", "Launched 2021 by the Ministry of Electronics & Information Technology (MeitY)"], "correct": 4, "exp": "The Semicon India Program (ISM 1.0) was launched in 2021 by the Ministry of Electronics & Information Technology (MeitY)."}, {"topic": "Semicon 2.0", "diff": "E", "ftype": "fig", "passage": null, "q": "What was the total outlay of the original Semicon India Program (ISM 1.0)?", "opts": ["₹76,000 crore", "₹50,000 crore", "₹1,27,500 crore", "₹60,000 crore", "₹1,00,000 crore"], "correct": 0, "exp": "The Semicon India Program was launched with a total outlay of ₹76,000 crore (around USD 10 billion)."}, {"topic": "Semicon 2.0", "diff": "M", "ftype": "fig", "passage": null, "q": "As per the chapter, what is India's current dependence on chip imports, and from where mostly?", "opts": ["80%–85% of chip components imported, mostly from China", "65%–70% of chip components imported, mostly from China", "65%–70% of chip components imported, mostly from the USA", "50%–55% of chip components imported, mostly from Taiwan", "65%–70% of chip components imported, mostly from South Korea"], "correct": 1, "exp": "India currently depends on imports for 65%–70% of chip components, mostly from China."}, {"topic": "Semicon 2.0", "diff": "H", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["Semicon 2.0 builds on Semicon 1.0 / India Semiconductor Mission (ISM) 1.0.", "The Semicon India Program's key target includes making India a global hub for chipmakers.", "Under Semicon 2.0, capex support for silicon fabs is 50%, unchanged from ISM 1.0.", "Semicon 2.0 offers 35% capex support for Advanced Packaging facilities.", "Semicon 2.0 reaffirms India's commitment to be a global hub for semiconductor design, manufacturing and innovation."], "correct": 2, "exp": "Capex support for silicon fabs was reduced to 40% under Semicon 2.0, from 50% under ISM 1.0 — it did not remain unchanged."}, {"topic": "BHAVYA — Bharat Audyogik Vikas Yojana Rasayan", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the total budget outlay of the BHAVYA — Rasayan scheme?", "opts": ["₹3,003 crore", "₹3,130 crore", "₹3,300 crore", "₹3,030 crore", "₹30,300 crore"], "correct": 3, "exp": "The BHAVYA — Rasayan scheme has a total budget outlay of ₹3,030 crore."}, {"topic": "BHAVYA — Bharat Audyogik Vikas Yojana Rasayan", "diff": "E", "ftype": "acr", "passage": null, "q": "What does 'BHAVYA' stand for?", "opts": ["Bharat Audyogik Vridhi Yojana Rasayan", "Bharat Aavashyak Vikas Yojana Rasayan", "Bharat Audyogik Vikas Yojana Rashtriya", "Bharatiya Audyogik Vikas Yojana Rasayan", "Bharat Audyogik Vikas Yojana Rasayan"], "correct": 4, "exp": "BHAVYA stands for Bharat Audyogik Vikas Yojana Rasayan."}, {"topic": "BHAVYA — Bharat Audyogik Vikas Yojana Rasayan", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about BHAVYA is correct?", "opts": ["Each chemical park requires a minimum of 5,000 acres of contiguous, encumbrance-free land.", "Of the ₹3,030 crore outlay, ₹3,030 crore is earmarked purely for administrative expenditure.", "BHAVYA will run for a period of 3 years, from FY27 to FY30.", "The scheme provides maximum central assistance of ₹1,000 crore per chemical park, with states contributing a minimum of ₹500 crore.", "BHAVYA was announced by PM Narendra Modi in the Union Budget FY27."], "correct": 3, "exp": "BHAVYA was initially announced by Union Minister Nirmala Sitharaman (not the PM) in the Union Budget FY27; each park needs at least 2,000 acres (or 8 sq km), not 5,000 acres; the scheme runs for 5 years (FY27–FY31), not 3; only ₹30 crore of the ₹3,030 crore outlay is for administration."}, {"topic": "BHAVYA — Bharat Audyogik Vikas Yojana Rasayan", "diff": "M", "ftype": "num", "passage": "The Union Cabinet approved the BHAVYA — Rasayan scheme to set up dedicated chemical parks.\n1. The scheme has a total budget outlay of ₹3,030 crore, of which ₹3,000 crore is for common infrastructure and ₹30 crore for administration.\n2. Central assistance is capped at a maximum of ₹1,000 crore per park.\n3. Each park will require at least 2,000 acres or 8 square kilometres of contiguous, encumbrance-free land.\n4. The parks will be developed exclusively by the Central Government through GoI-owned SPVs.", "q": "Which of the above statements is/are correct?", "opts": ["1, 2 and 3", "Only 1", "2, 3 and 4", "All of the above", "1 and 4"], "correct": 0, "exp": "Statement 4 is incorrect: the chemical parks are to be developed by state governments through a challenge-based selection process, not exclusively by the Central Government through GoI-owned SPVs."}, {"topic": "BHAVYA — Bharat Audyogik Vikas Yojana Rasayan", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT genuinely part of the plug-and-play infrastructure planned under BHAVYA chemical parks?", "opts": ["Solvent recovery and distillation facilities", "Common Effluent Treatment Plants (CETPs)", "Dedicated freight rail corridors", "Steam generation and distribution networks", "Treatment, Storage and Disposal Facilities (TSDFs)"], "correct": 2, "exp": "The chapter lists CETPs, TSDFs, water supply systems, solvent recovery/distillation facilities, steam generation networks, pipeline systems, and logistics/warehousing infrastructure — 'dedicated freight rail corridors' is not mentioned."}, {"topic": "BHAVYA — Bharat Audyogik Vikas Yojana Rasayan", "diff": "M", "ftype": "fig", "passage": null, "q": "What is the minimum land requirement specified for each chemical park under BHAVYA?", "opts": ["2,000 acres or 20 square kilometres", "2,000 acres or 8 square kilometres", "1,000 acres or 4 square kilometres", "5,000 acres or 8 square kilometres", "2,000 acres or 4 square kilometres"], "correct": 1, "exp": "Each park will require at least 2,000 acres or 8 square kilometres of contiguous, encumbrance-free land."}, {"topic": "BHAVYA — Bharat Audyogik Vikas Yojana Rasayan", "diff": "E", "ftype": "fig", "passage": null, "q": "For how many years will the BHAVYA — Rasayan scheme run?", "opts": ["4 years", "10 years", "7 years", "3 years", "5 years"], "correct": 4, "exp": "The scheme will run for a period of 5 years, from FY27 to FY31."}, {"topic": "BHAVYA — Bharat Audyogik Vikas Yojana Rasayan", "diff": "H", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["The scheme aims to establish three dedicated large chemical parks.", "The chemical parks will be developed by state governments through a challenge-based selection process.", "State governments must contribute a maximum of ₹500 crore per park, with no upper limit on central assistance.", "The scheme was initially announced by Union Minister Nirmala Sitharaman in the Union Budget FY27.", "Of the total outlay of ₹3,030 crore, ₹30 crore is meant for administrative expenditure."], "correct": 2, "exp": "In fact, the Central Government's contribution is capped at a maximum of ₹1,000 crore per park, while state governments must contribute a minimum (not maximum) of ₹500 crore."}, {"topic": "PM Family Care Tracker (PM-FCT)", "diff": "E", "ftype": "fig", "passage": null, "q": "In which city was the PM Family Care Tracker (PM-FCT) pilot project launched?", "opts": ["Ahmedabad", "Gandhinagar", "Vadodara", "Rajkot", "Surat"], "correct": 1, "exp": "The PM-FCT pilot project was launched in Gandhinagar, Gujarat."}, {"topic": "PM Family Care Tracker (PM-FCT)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about PM-FCT is correct?", "opts": ["PM-FCT provides every child a unique ID linked with the Birth Registration Number or ABHA ID, covering pregnancy to 18 years of age.", "PM-FCT was launched by Union Minister Amit Shah and covers children from birth to 18 years of age.", "The PM-FCT pilot was launched in Ahmedabad, Gujarat.", "PM-FCT was launched by the Ministry of Health & Family Welfare as a pilot in Gandhinagar.", "ABHA is a 12-digit unique digital health ID launched under the National Digital Health Mission in 2020."], "correct": 0, "exp": "PM-FCT's coverage is from pregnancy (not birth) to 18 years; ABHA is a 14-digit ID launched in September 2021 under the Ayushman Bharat Digital Mission, not a 12-digit ID under the NDHM; PM-FCT was launched by the Ministry of Home Affairs and Ministry of Cooperation, not Health & Family Welfare; the pilot city is Gandhinagar, not Ahmedabad."}, {"topic": "PM Family Care Tracker (PM-FCT)", "diff": "M", "ftype": "num", "passage": "Union Minister Amit Shah launched the PM Family Care Tracker (PM-FCT) pilot project.\n1. PM-FCT is an integrated digital platform monitoring health, nutrition, education and welfare benefits from pregnancy to 18 years of age.\n2. Every child will receive a unique ID linked to the BRN or ABHA ID.\n3. The platform does not integrate with birth and death registration databases.\n4. It provides a digital Health Passport for seamless welfare delivery.", "q": "Which of the above statements is/are correct?", "opts": ["2, 3 and 4", "All of the above", "1 and 3", "1, 2 and 4", "Only 2"], "correct": 3, "exp": "Statement 3 is incorrect: PM-FCT does integrate birth and death registration with government databases."}, {"topic": "PM Family Care Tracker (PM-FCT)", "diff": "E", "ftype": "fig", "passage": null, "q": "ABHA is a ______-digit unique digital health ID.", "opts": ["16", "18", "12", "14", "10"], "correct": 3, "exp": "ABHA (Ayushman Bharat Health Account) is a 14-digit unique digital health ID."}, {"topic": "PM Family Care Tracker (PM-FCT)", "diff": "M", "ftype": "fig", "passage": null, "q": "When was ABHA launched, and under which mission?", "opts": ["September 2021, under Ayushman Bharat-PMJAY", "September 2021, under the Ayushman Bharat Digital Mission", "September 2022, under the Ayushman Bharat Digital Mission", "August 2021, under the Ayushman Bharat Digital Mission", "September 2020, under the National Health Mission"], "correct": 1, "exp": "ABHA was launched in September 2021 under the Ayushman Bharat Digital Mission (ABDM)."}, {"topic": "PM Family Care Tracker (PM-FCT)", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT genuinely among the key features of PM-FCT?", "opts": ["Automatic enrolment in the National Pension Scheme for every child", "A digital Health Passport for welfare delivery", "Integration of birth and death registration with government databases", "Child unique ID linked to BRN/ABHA", "Generation of alerts for timely interventions"], "correct": 0, "exp": "PM-FCT's key features are: a unique child ID linked to BRN/ABHA, integration with birth/death registration, alerts for timely interventions, and a digital Health Passport. 'Automatic NPS enrolment' is not mentioned."}, {"topic": "PM Family Care Tracker (PM-FCT)", "diff": "E", "ftype": "acr", "passage": null, "q": "What does 'ABHA' stand for?", "opts": ["Ayushman Bharat Health Application", "Aadhaar Bharat Health Account", "Ayushman Bharat Health Account", "Ayushman Bharat Hospital Account", "Ayushman Bharat Health Authority"], "correct": 2, "exp": "ABHA stands for Ayushman Bharat Health Account."}, {"topic": "PM Family Care Tracker (PM-FCT)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["ABHA was launched in September 2021 under the Ayushman Bharat Digital Mission.", "ABHA enables individuals to securely create, store and share health records with consent.", "PM-FCT was launched under the Ministry of Home Affairs and Ministry of Cooperation.", "PM-FCT's coverage extends from pregnancy to 18 years of age.", "PM-FCT's pilot project was launched in Lakhanpur, Jammu & Kashmir."], "correct": 4, "exp": "The PM-FCT pilot was launched in Gandhinagar, Gujarat — Lakhanpur, J&K is where the PM SVANidhi Street Food Hub was selected, a different initiative."}, {"topic": "VISHWAS 2026", "diff": "E", "ftype": "fig", "passage": null, "q": "For how long will the VISHWAS 2026 scheme remain operational, from the date of notification?", "opts": ["12 months", "3 months", "6 months", "1 month", "9 months"], "correct": 2, "exp": "VISHWAS 2026 will remain operational for six months from the date of notification (29 June 2026)."}, {"topic": "VISHWAS 2026", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about VISHWAS 2026 is correct?", "opts": ["The scheme covers cases involving fraud, misappropriation or falsification of records.", "VISHWAS 2026 was launched by the Ministry of Labour & Employment directly, not by EPFO.", "The scheme covers only cases with fully recovered penalties.", "VISHWAS 2026 is a one-time dispute resolution scheme operational for 6 months from 29 June 2026.", "Under VISHWAS 2026, damages for defaults exceeding 4 months will be recalculated at 0.50% per month."], "correct": 3, "exp": "VISHWAS 2026 was launched by EPFO (under the Ministry of Labour & Employment), not directly by the ministry; cases involving fraud/misappropriation and fully-recovered-penalty cases are actually excluded; the rate for defaults exceeding 4 months is 1% per month, not 0.50%."}, {"topic": "VISHWAS 2026", "diff": "M", "ftype": "num", "passage": "The EPFO launched 'VISHWAS 2026' for the amicable settlement of damages and penalty-related disputes.\n1. The scheme covers cases where penalty/damages orders are under judicial challenge.\n2. It covers final orders with pending or partial recovery, including Revenue Recovery Certificate (RRC) cases.\n3. Cases involving unpaid statutory interest are covered under the scheme.\n4. Cases where penalty/damages notices are yet to be issued are also covered.", "q": "Which of the above statements is/are correct?", "opts": ["2, 3 and 4", "1, 2 and 4", "All of the above", "Only 1", "1 and 3"], "correct": 1, "exp": "Statement 3 is incorrect: cases with unpaid statutory interest are excluded from VISHWAS 2026, not covered."}, {"topic": "VISHWAS 2026", "diff": "M", "ftype": "num", "passage": "For defaults occurring before 14 June 2024, VISHWAS 2026 recalculates damages at reduced rates:\n1. 0.25% per month for defaults up to 2 months.\n2. 0.50% per month for defaults exceeding 2 months but less than 4 months.\n3. 1% per month for defaults exceeding 4 months.\n4. 2% per month for defaults exceeding 6 months.", "q": "Which of the above statements is/are correct regarding the reduced penalty rates?", "opts": ["1, 2 and 3", "1, 2, 3 and 4", "Only 3", "2 and 3", "All of the above"], "correct": 0, "exp": "Statement 4 is fabricated — the chapter specifies only three reduced-rate slabs (up to 2 months, 2–4 months, and beyond 4 months); no separate slab for defaults exceeding 6 months is mentioned."}, {"topic": "VISHWAS 2026", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT excluded from VISHWAS 2026 (i.e., is actually covered by it)?", "opts": ["None of the above — all are excluded", "Cases involving fully recovered penalties", "Cases involving fraud, misappropriation, or falsification of records", "Cases with unpaid statutory interest", "Cases where penalty/damages notices are yet to be issued"], "correct": 4, "exp": "Cases where penalty/damages notices are yet to be issued are one of the categories actually covered by VISHWAS 2026, unlike the other three which are excluded."}, {"topic": "VISHWAS 2026", "diff": "E", "ftype": "fig", "passage": null, "q": "What reduced penalty rate applies under VISHWAS 2026 for defaults exceeding 4 months?", "opts": ["1% per month", "1.5% per month", "0.50% per month", "0.25% per month", "0.75% per month"], "correct": 0, "exp": "For defaults exceeding 4 months, damages will be recalculated at 1% per month."}, {"topic": "VISHWAS 2026", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["The scheme will remain operational for six months from the date of notification.", "Cases with unpaid statutory interest are eligible for settlement under VISHWAS 2026.", "VISHWAS 2026 is administered by EPFO under the Ministry of Labour & Employment.", "The scheme promotes voluntary compliance and reduces litigation through a fully digital process.", "Defaults exceeding 2 months but less than 4 months attract a reduced rate of 0.50% per month."], "correct": 1, "exp": "Cases with unpaid statutory interest are explicitly excluded from VISHWAS 2026."}, {"topic": "PM-SETU", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the total outlay of the PM-SETU scheme?", "opts": ["₹66,000 crore", "₹70,000 crore", "₹6,000 crore", "₹60,000 crore", "₹50,000 crore"], "correct": 3, "exp": "PM-SETU has a total outlay of ₹60,000 crore for 5 years (2025–2030)."}, {"topic": "PM-SETU", "diff": "E", "ftype": "fig", "passage": null, "q": "On which date was PM-SETU formally launched?", "opts": ["4 July 2025", "14 October 2025", "4 October 2025", "4 October 2024", "1 August 2025"], "correct": 2, "exp": "PM-SETU's launch date is 4 October 2025."}, {"topic": "PM-SETU", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about PM-SETU is correct?", "opts": ["Under PM-SETU, the Anchor Industry Partner holds a 24.5% equity stake with management control.", "The scheme has a total outlay of ₹6,000 crore over 5 years, funded entirely by the Central Government.", "PM-SETU's nodal ministry is the Ministry of Micro, Small and Medium Enterprises.", "PM-SETU's implementing agency is the National Skill Development Corporation (NSDC).", "PM-SETU aims to upgrade 1,000 Government ITIs using a Hub-and-Spoke model of 200 Hubs and 800 Spokes."], "correct": 4, "exp": "PM-SETU's nodal ministry is MSDE, not MoMSME; the total outlay is ₹60,000 crore, co-financed by the Centre, states and industry (not entirely Central); the implementing agencies are industry-led SPVs (Section 8 companies), not NSDC; the Anchor Industry Partner holds 51% equity with management control, not 24.5%."}, {"topic": "PM-SETU", "diff": "M", "ftype": "num", "passage": "The equity structure of the SPV managing each ITI cluster under PM-SETU is:\n1. Anchor Industry Partner (AIP): 51% with management control.\n2. Central Government: 24.5%.\n3. State Government: 33%.\n4. Each SPV is incorporated as a Section 8 (not-for-profit) company.", "q": "Which of the above statements is/are correct?", "opts": ["All of the above", "Only 1", "2, 3 and 4", "1, 2 and 4", "1 and 3"], "correct": 3, "exp": "Statement 3 is incorrect: the State Government's equity share in the SPV is 24.5%, not 33% — the Anchor Industry Partner and Central Government also each hold defined shares (51% and 24.5% respectively)."}, {"topic": "PM-SETU", "diff": "M", "ftype": "num", "passage": "Under PM-SETU's funding pattern for the ₹60,000 crore outlay:\n1. Centre's share: 50% (₹30,000 crore).\n2. State's share: 33% (₹20,000 crore).\n3. Industry's share: 17% (₹10,000 crore).\n4. For North-Eastern and Himalayan States, the Centre's share can increase up to 90%.", "q": "Which of the above statements is/are correct?", "opts": ["1, 2 and 3", "1, 3 and 4", "All of the above", "2 and 4", "Only 1 and 2"], "correct": 0, "exp": "Statement 4 is incorrect: for North-Eastern/Hilly States, the Centre's share can increase up to 83%, not 90%."}, {"topic": "PM-SETU", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT among the five National Skill Training Institutes (NSTIs) being upgraded into National Centres of Excellence under PM-SETU?", "opts": ["Chennai (TN)", "Hyderabad (Telangana)", "Guwahati (Assam)", "Ludhiana (Punjab)", "Kanpur (UP)"], "correct": 2, "exp": "The five NSTIs being upgraded are located in Kanpur, Chennai, Bhubaneswar, Hyderabad and Ludhiana — Guwahati is not among them."}, {"topic": "PM-SETU", "diff": "H", "ftype": "inter", "passage": "Item 1: Uttar Pradesh\nItem 2: Tamil Nadu\nItem 3: Odisha\nItem 4: Gujarat\nItem 5: Telangana\nItem 6: Punjab", "q": "Which of the above states are common to BOTH the NCoE (Component II) locations AND the states with currently approved Strategic Investment Plans (SIPs) under Component I expansion?", "opts": ["All of the above", "3 and 5", "3, 4 and 5", "4 and 6", "1 and 2"], "correct": 1, "exp": "NCoE (Component II) locations span Uttar Pradesh, Tamil Nadu, Odisha, Telangana and Punjab, while the states with currently approved SIPs under the Component I nationwide expansion are Odisha, Gujarat and Telangana. Odisha and Telangana are common to both lists."}, {"topic": "PM-SETU", "diff": "H", "ftype": "fig", "passage": null, "q": "Which one of the following correctly identifies the Anchor Industry Partner, hub institute, and approved investment for the Gujarat ITI cluster under PM-SETU's expansion?", "opts": ["ArcelorMittal Nippon Steel India — Government ITI Barbil — ₹240.21 crore", "Apollo Medskills — Government ITI Surat — ₹240.18 crore", "Jindal Naveen Avsar Limited — Government ITI Surat — ₹240.18 crore", "ArcelorMittal Nippon Steel India — Government ITI Surat — ₹275.24 crore", "ArcelorMittal Nippon Steel India — Government ITI Surat — ₹240.18 crore"], "correct": 4, "exp": "The Gujarat cluster's anchor industry partner is ArcelorMittal Nippon Steel India, hub institute is Government ITI Surat, with an approved investment of ₹240.18 crore."}, {"topic": "PM-SETU", "diff": "H", "ftype": "num", "passage": "The Government approved the nationwide expansion of PM-SETU across all 200 ITI clusters, with Strategic Investment Plans (SIPs) worth ₹1,237.58 crore approved by the 4th National Steering Committee.\n1. Telangana has three approved clusters with a total proposed investment of ₹757.19 crore.\n2. The Odisha cluster's hub institute is Government ITI Barbil, with an approved investment of ₹240.21 crore.\n3. The Gujarat cluster's approved investment (₹240.18 crore) exceeds that of the Odisha cluster.\n4. All three Telangana clusters have identical approved investments of ₹240 crore each.", "q": "Which of the above statements is/are correct?", "opts": ["Only 1", "1, 2 and 3", "1 and 2", "All of the above", "3 and 4"], "correct": 2, "exp": "Statement 3 is incorrect: Gujarat's approved investment (₹240.18 crore) is actually slightly less than, not more than, Odisha's (₹240.21 crore). Statement 4 is also incorrect since the three Telangana clusters have differing investments (₹241.01, ₹275.24 and ₹240.94 crore), not identical amounts."}, {"topic": "PM-SETU", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the total Strategic Investment Plans (SIPs) outlay approved by the 4th National Steering Committee for PM-SETU's nationwide expansion?", "opts": ["₹1,237.85 crore", "₹2,237.58 crore", "₹1,327.58 crore", "₹1,137.58 crore", "₹1,237.58 crore"], "correct": 4, "exp": "The 4th NSC approved Strategic Investment Plans worth ₹1,237.58 crore for PM-SETU's nationwide expansion."}, {"topic": "PM-SETU", "diff": "M", "ftype": "fig", "passage": null, "q": "What was the Union Budget 2026-27 allocation for PM-SETU, as per the chapter?", "opts": ["₹7,140.50 crore", "₹6,140.00 crore", "₹6,040.50 crore", "₹6,140.50 crore", "₹5,140.50 crore"], "correct": 3, "exp": "PM-SETU received an allocation of ₹6,140.50 crore in the Union Budget 2026-27."}, {"topic": "PM-SETU", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT genuinely one of the Anchor Industry Partners associated with PM-SETU's ITI clusters?", "opts": ["None — all are correct", "Tata Steel Skill Development Society", "Apollo Medskills", "Jindal Naveen Avsar Limited", "ArcelorMittal Nippon Steel India"], "correct": 1, "exp": "The chapter names Jindal Naveen Avsar Limited (Odisha), ArcelorMittal Nippon Steel India (Gujarat), and Apollo Medskills (Telangana) as anchor industry partners. 'Tata Steel Skill Development Society' is not mentioned."}, {"topic": "PM-SETU", "diff": "E", "ftype": "acr", "passage": null, "q": "What does 'PM-SETU' stand for?", "opts": ["Pradhan Mantri Skilling and Employability Transformation through Upgraded ITIs", "Pradhan Mantri Skilling and Entrepreneurship Transformation through Upgraded ITIs", "Pradhan Mantri Skill Enhancement and Training through Upgraded ITIs", "Pradhan Mantri Sectoral Employability Transformation through Upgraded ITIs", "Pradhan Mantri Skilling and Employment Transformation through Unified ITIs"], "correct": 0, "exp": "PM-SETU stands for Pradhan Mantri Skilling and Employability Transformation through Upgraded ITIs."}, {"topic": "PM-SETU", "diff": "H", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["PM-SETU uses a Result-Based Financing model where funds are released based on achieving KPIs.", "Component II aims to upgrade 5 NSTIs into National Centres of Excellence.", "The scheme marks a shift from 'Government-run' to 'Government-owned, Industry-managed' ITIs.", "The Anchor Industry Partner holds 33% equity with management control over the SPV.", "50% of the Central Share is funded via loans from the World Bank and ADB."], "correct": 3, "exp": "The Anchor Industry Partner actually holds 51% equity with management control, not 33%."}, {"topic": "PM-SETU", "diff": "H", "ftype": "fig", "passage": null, "q": "Recent MoUs to set up National Centres of Excellence (NCoEs) under PM-SETU's Component II were signed with which countries, and when?", "opts": ["France and Germany, in January 2026", "Singapore and Japan, in February 2026", "Singapore and France, in February 2026", "Singapore and France, in October 2025", "USA and France, in February 2026"], "correct": 2, "exp": "Recent MoUs with Singapore and France (February 2026) were signed to set up National Centres of Excellence under PM-SETU's Component II."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "E", "ftype": "fig", "passage": null, "q": "Which state became the first in India to qualify for the release of the second RKVY installment?", "opts": ["Madhya Pradesh", "Karnataka", "Gujarat", "Uttar Pradesh", "Maharashtra"], "correct": 4, "exp": "Maharashtra became the first state in India to qualify for the release of the second installment under RKVY."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "E", "ftype": "fig", "passage": null, "q": "What was the value of the first RKVY installment released to Maharashtra?", "opts": ["₹335 crore", "₹300 crore", "₹435 crore", "₹235 crore", "₹360 crore"], "correct": 0, "exp": "The Government of India had earlier released ₹335 crore as the first installment under RKVY to Maharashtra."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about RKVY is correct?", "opts": ["Maharashtra utilised only 50% of its first RKVY installment, falling short of the eligibility benchmark.", "RKVY was converted from a Central Sector Scheme to a Centrally Sponsored Scheme since 2015-16, with general states funded in a 60:40 (Centre:State) ratio.", "RKVY funding for Union Territories follows a 90:10 (Centre:UT) ratio.", "RKVY was launched in 2010-11 as a Central Sector Scheme with 100% funding by state governments.", "The original target of RKVY was to achieve 6% annual growth in agriculture during the Twelfth Plan period."], "correct": 1, "exp": "RKVY was launched in 2007-08 as a Central Sector Scheme funded 100% by the GoI (not states); its original target was 4% annual growth during the Eleventh Plan; Maharashtra utilised nearly ₹260 crore of its ₹335 crore installment (about 78%), exceeding the 75% benchmark; UTs are funded 100% by the Centre, not 90:10."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "M", "ftype": "num", "passage": "Maharashtra became the first state in India to qualify for the release of the second installment under RKVY.\n1. The Government of India had earlier released ₹335 crore as the first installment to Maharashtra.\n2. Of this, the state utilised nearly ₹260 crore, which is less than the prescribed 75% utilisation benchmark.\n3. This achievement made Maharashtra eligible for the second installment of ₹335 crore.\n4. The eligibility condition for the second installment is a 75% fund utilisation benchmark.", "q": "Which of the above statements is/are correct?", "opts": ["Only 1", "All of the above", "1 and 2", "2, 3 and 4", "1, 3 and 4"], "correct": 4, "exp": "Statement 2 is incorrect: Maharashtra's utilisation of nearly ₹260 crore out of ₹335 crore is about 78%, which is MORE than, not less than, the prescribed 75% benchmark."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "M", "ftype": "num", "passage": "About the Rashtriya Krishi Vikas Yojana (RKVY):\n1. RKVY was launched in 2007-2008 as a Centrally Sponsored Scheme of the Department of Agriculture & Co-operation.\n2. Its original target was to achieve 4% annual growth in the agriculture sector during the Eleventh Plan period.\n3. RKVY was initially launched as a Central Sector Scheme with 100% funding by the Government of India.\n4. Since 2015-16, the funding pattern for North Eastern and Himalayan States has been 60:40 (Centre:State).", "q": "Which of the above statements is/are correct?", "opts": ["Only 2", "2 and 3", "1 and 4", "1, 2 and 3", "All of the above"], "correct": 1, "exp": "Statement 1 is incorrect: RKVY was initially launched as a Central Sector Scheme, not a Centrally Sponsored Scheme (it converted to a CSS only from 2015-16). Statement 4 is incorrect: the funding pattern for North Eastern and Himalayan States is 90:10, not 60:40."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT genuinely one of the allied sectors covered under RKVY?", "opts": ["Rural Housing Infrastructure", "Crop husbandry (including horticulture)", "Food Storage and Warehousing", "Animal Husbandry, Dairy Development and Fisheries", "Soil and Water Conservation"], "correct": 0, "exp": "RKVY covers crop husbandry, animal husbandry/dairy/fisheries, food storage & warehousing, and soil & water conservation — 'Rural Housing Infrastructure' is not listed among its allied sectors."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "M", "ftype": "num", "passage": "Evolution of RKVY:\n1. In November 2017, the Union Cabinet approved the continuation of RKVY as RKVY-RAFTAR for a period of three years.\n2. RKVY-RAFTAR stands for Remunerative Approaches for Agriculture and Allied Sector Rejuvenation.\n3. In October 2024, the Union Cabinet rationalised all Centrally Sponsored Schemes under MoA&FW into three umbrella schemes.\n4. The rationalised schemes have a total budget outlay of ₹1,01,321.61 crore.", "q": "Which of the above statements is/are correct?", "opts": ["Only 4", "2, 3 and 4", "1, 2 and 4", "1 and 3", "All of the above"], "correct": 2, "exp": "Statement 3 is incorrect: the October 2024 rationalisation created two umbrella schemes (PM-RKVY and Krishonnati Yojana), not three."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "M", "ftype": "fig", "passage": null, "q": "What is the total budget outlay of the rationalised schemes (PM-RKVY and Krishonnati Yojana) formed in October 2024?", "opts": ["₹91,321.61 crore", "₹1,11,321.61 crore", "₹1,01,321.16 crore", "₹1,01,321.61 crore", "₹93,068.56 crore"], "correct": 3, "exp": "The total budget outlay of the rationalised schemes (PM-RKVY and Krishonnati Yojana) is ₹1,01,321.61 crore."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "E", "ftype": "acr", "passage": null, "q": "What does 'RAFTAR' in RKVY-RAFTAR stand for?", "opts": ["Remunerative Approaches for Agriculture and Allied Sector Rejuvenation", "Regional Approaches for Agriculture and Allied Sector Rejuvenation", "Remunerative Approaches for Farmers and Allied Sector Rejuvenation", "Remunerative Approaches for Agriculture and Agrarian Sector Reform", "Rapid Approaches for Farming and Agricultural Sector Transformation"], "correct": 0, "exp": "RAFTAR stands for Remunerative Approaches for Agriculture and Allied Sector Rejuvenation."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "E", "ftype": "fig", "passage": null, "q": "Who is named as the Union Minister of Agriculture and Farmers Welfare in the chapter?", "opts": ["Narendra Singh Tomar", "Amit Shah", "Nirmala Sitharaman", "Shivraj Singh Chouhan", "Piyush Goyal"], "correct": 3, "exp": "Shivraj Singh Chouhan (Constituency – Madhya Pradesh) is named as the Union Minister of Agriculture and Farmers Welfare."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "H", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["The two umbrella schemes formed via the 2024 rationalisation are PM-RKVY and Krishonnati Yojana.", "Since 2015-16, Union Territories are funded 100% by the Centre under RKVY.", "Maharashtra's fund utilisation of nearly ₹260 crore exceeded the 75% benchmark on the ₹335 crore first installment.", "RKVY was launched in 2007-2008 under the Department of Agriculture & Co-operation.", "RKVY-RAFTAR was approved for a period of five years in November 2017."], "correct": 4, "exp": "RKVY-RAFTAR was approved for a period of three years in November 2017, not five years."}, {"topic": "RKVY & Maharashtra's Second Installment", "diff": "M", "ftype": "num", "passage": "Regarding the Ministry of Agriculture and Farmers Welfare leadership mentioned in this context:\n1. Shivraj Singh Chouhan is the Union Minister, representing Madhya Pradesh.\n2. Ram Nath Thakur is a Minister of State, representing Rajya Sabha from Bihar.\n3. Bhagirath Choudhary is a Minister of State, representing Ajmer, Rajasthan.\n4. Narendra Singh Tomar continues to serve as a Minister of State in the Ministry.", "q": "Which of the above statements is/are correct?", "opts": ["All of the above", "1, 2 and 3", "1 and 4", "Only 1", "2, 3 and 4"], "correct": 1, "exp": "Statement 4 is fabricated — the chapter does not mention Narendra Singh Tomar as a continuing Minister of State in this context; the Ministers of State named are Ram Nath Thakur and Bhagirath Choudhary."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "E", "ftype": "fig", "passage": null, "q": "Which town/district was selected among the first in India for development of a Street Food Hub under PM SVANidhi?", "opts": ["Udhampur", "Anantnag", "Lakhanpur, Kathua district", "Jammu city", "Srinagar"], "correct": 2, "exp": "Lakhanpur in Kathua district, Jammu & Kashmir, was selected among the first towns in India for development of a Street Food Hub."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the total funding provided per approved Street Food Hub under PM SVANidhi?", "opts": ["₹3 crore", "₹2 crore", "₹5 crore", "₹4 crore", "₹10 crore"], "correct": 3, "exp": "Each approved Street Food Hub receives ₹4 crore, disbursed in three instalments of 30%, 50% and 20%."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is correct?", "opts": ["The scheme's nodal ministry for the Street Food Hub initiative is the Ministry of Tourism.", "The national target under this initiative is to develop up to 100 Street Food Hubs across India.", "PM SVANidhi Street Food Hub funding is disbursed in three instalments of 40%-40%-20%.", "PM SVANidhi was launched in 2019 by the Ministry of Urban Development.", "Each approved Street Food Hub receives ₹4 crore in three instalments of 30%-50%-20%, plus an additional ₹25 lakh incentive for ULBs with a notified Street Vending Plan."], "correct": 4, "exp": "The instalment pattern is 30%-50%-20%, not 40%-40%-20%; the national target is 50 hubs, not 100; PM SVANidhi was launched in 2020 by MoHUA; MoHUA is the nodal ministry, while Ministry of Tourism is only a convergence partner."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "M", "ftype": "num", "passage": "Lakhanpur in Kathua district, J&K, was selected among the first towns for a Street Food Hub under PM SVANidhi.\n1. Each approved Street Food Hub receives ₹4 crore in three instalments of 30%, 50% and 20%.\n2. An additional ₹25 lakh incentive is available for Urban Local Bodies with a notified Street Vending Plan.\n3. The initiative targets development of up to 50 Street Food Hubs nationwide.\n4. The initiative is being implemented solely by the Ministry of Housing and Urban Affairs, without convergence with any other ministry.", "q": "Which of the above statements is/are correct?", "opts": ["1 and 4", "Only 1", "1, 2 and 3", "2, 3 and 4", "All of the above"], "correct": 2, "exp": "Statement 4 is incorrect: the initiative involves convergence with MoHUA, the Ministry of Tourism, and FSSAI — it is not implemented solely by MoHUA."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "M", "ftype": "num", "passage": "About PM SVANidhi (background):\n1. PM SVANidhi was launched in 2020 by the Ministry of Housing and Urban Affairs.\n2. The scheme has been extended until March 2028.\n3. It provides collateral-free working capital loans to street vendors.\n4. Loan amounts are tiered: up to ₹15,000 in the first cycle, ₹25,000 in the second, and ₹50,000 in the third.", "q": "Which of the above statements is/are correct?", "opts": ["Only 3", "1, 3 and 4", "All of the above", "1 and 2", "2, 3 and 4"], "correct": 1, "exp": "Statement 2 is incorrect: PM SVANidhi has been extended until March 2030, not March 2028."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "M", "ftype": "fig", "passage": null, "q": "Which one of the following correctly represents the tiered loan amounts under PM SVANidhi across its three cycles?", "opts": ["1st: ₹15,000; 2nd: ₹25,000; 3rd: ₹50,000", "1st: ₹10,000; 2nd: ₹20,000; 3rd: ₹50,000", "1st: ₹15,000; 2nd: ₹30,000; 3rd: ₹50,000", "1st: ₹15,000; 2nd: ₹25,000; 3rd: ₹75,000", "1st: ₹20,000; 2nd: ₹25,000; 3rd: ₹40,000"], "correct": 0, "exp": "PM SVANidhi provides tiered loans: up to ₹15,000 in the first cycle, ₹25,000 in the second, and ₹50,000 in the third."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT among the ministries/bodies involved in convergence for the PM SVANidhi Street Food Hub initiative?", "opts": ["Ministry of Food Processing Industries", "None — all are correct", "Ministry of Tourism", "FSSAI", "Ministry of Housing and Urban Affairs (MoHUA)"], "correct": 0, "exp": "The convergence partners named are MoHUA, the Ministry of Tourism, and FSSAI — the Ministry of Food Processing Industries is not mentioned."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "E", "ftype": "fig", "passage": null, "q": "Until when has PM SVANidhi been extended?", "opts": ["March 2028", "March 2029", "March 2030", "December 2030", "March 2027"], "correct": 2, "exp": "PM SVANidhi has been extended until March 2030."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "E", "ftype": "acr", "passage": null, "q": "What does 'PM SVANidhi' stand for?", "opts": ["Pradhan Mantri Swanidhi Vendor Yojana", "Pradhan Mantri Street Vyapari AtmaNirbhar Nidhi", "Pradhan Mantri Street Vendor's Aajeevika Nidhi", "Pradhan Mantri SVA Nidhi Yojana for Street Vendors", "Pradhan Mantri Street Vendor's AtmaNirbhar Nidhi"], "correct": 4, "exp": "PM SVANidhi stands for Pradhan Mantri Street Vendor's AtmaNirbhar Nidhi."}, {"topic": "PM SVANidhi Street Food Hub", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["The scheme promotes financial inclusion and digital transactions among street vendors.", "The national target is up to 50 Street Food Hubs across India.", "PM SVANidhi's nodal ministry is the Ministry of Housing and Urban Affairs.", "Each Street Food Hub project's ₹4 crore funding is released fully upfront in a single instalment.", "Lakhanpur is located in Kathua district, Jammu & Kashmir."], "correct": 3, "exp": "The ₹4 crore funding is released in three instalments of 30%, 50% and 20% — not as a single upfront payment."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the total outlay of the Modified Regional Connectivity Scheme – UDAN?", "opts": ["₹38,840 crore", "₹28,840 crore", "₹18,840 crore", "₹28,480 crore", "₹2,88,400 crore"], "correct": 1, "exp": "The Modified UDAN scheme has a total outlay of ₹28,840 crore (approximately ₹29,000 crore)."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "E", "ftype": "fig", "passage": null, "q": "For how many years has the Modified UDAN scheme been approved?", "opts": ["10 years", "3 years", "5 years", "7 years", "15 years"], "correct": 0, "exp": "The Modified UDAN scheme has been approved for a period of ten years, from FY2026-27 to FY2035-36."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about Modified UDAN is correct?", "opts": ["The Modified UDAN scheme was launched by the PM from New Delhi on 15 August 2026.", "The original RCS-UDAN was launched in October 2014 to connect metro cities.", "Under Modified UDAN, VGF support has been extended from 5 years to 3 years.", "The Modified UDAN scheme has a total outlay of approximately ₹28,840 crore for a ten-year period from FY2026-27 to FY2035-36.", "The eligibility threshold for 'underserved' airports has been narrowed from 14 weekly flights to fewer than 7."], "correct": 3, "exp": "The original RCS-UDAN was launched in October 2016 to connect Tier-2/3 cities, not metro cities in 2014; VGF support was extended from 3 years to 5 years, not the reverse; the underserved threshold was widened from fewer than 7 to 14 or fewer weekly flights, not narrowed; the Modified scheme was launched from Jodhpur on 4 July 2026."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "M", "ftype": "num", "passage": "The Union Cabinet approved the Modified Regional Connectivity Scheme – UDAN, formally launched by PM Modi on 4 July 2026 from Jodhpur.\n1. The scheme has a total outlay of ₹28,840 crore for ten years (FY2026-27 to 2035-36).\n2. The eligibility threshold for 'underserved' airports has been widened from fewer than 7 weekly flights to 14 or fewer weekly flights.\n3. For priority regions including the North-East and hilly states, the threshold has been reduced to 10 weekly flights.\n4. VGF support for airlines has been extended from 3 years to 5 years.", "q": "Which of the above statements is/are correct?", "opts": ["All of the above", "1 and 3", "1, 2 and 4", "2, 3 and 4", "Only 1"], "correct": 2, "exp": "Statement 3 is incorrect: for priority regions including the North-East and hilly states, the threshold has been increased to 21 weekly flights, not reduced to 10."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "H", "ftype": "num", "passage": "Under the tapered Viability Gap Funding (VGF) model of Modified UDAN:\n1. 100% support is provided in the first two years.\n2. 75% support is provided in the third year.\n3. 50% support is provided in the fourth year, and 25% in the fifth year.\n4. VGF support ceases entirely after the third year.", "q": "Which of the above statements is/are correct?", "opts": ["All of the above", "1, 2 and 3", "2, 3 and 4", "1 and 4", "Only 2"], "correct": 1, "exp": "Statement 4 is incorrect: VGF support does not cease after the third year — it continues in tapered form at 50% in the fourth year and 25% in the fifth year."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT among the infrastructure development targets under Modified UDAN?", "opts": ["Development of 100 airports over the next decade", "None — all are correct", "Operational & maintenance support to unviable Tier-2/3 airports", "Development of 200 heliports", "Development of 20 new international cargo hubs"], "correct": 4, "exp": "Modified UDAN targets developing 100 airports and 200 heliports over the next decade, plus O&M support to unviable airports — 'development of 20 new international cargo hubs' is not mentioned."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "M", "ftype": "fig", "passage": null, "q": "How many routes and across how many airports/heliports/water aerodromes had RCS-UDAN operationalised over its nine years, as per the chapter?", "opts": ["663 routes across 663 airports", "763 routes across 95 airports", "663 routes across 95 airports, heliports & water aerodromes", "600 routes across 100 airports", "663 routes across 90 airports"], "correct": 2, "exp": "Over nine years, RCS-UDAN operationalised 663 routes across 95 airports, heliports and water aerodromes."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "M", "ftype": "fig", "passage": null, "q": "How many airports has India added in the last 12 years, compared to the number added between 2001 and 2014?", "opts": ["100 vs 10", "90 vs 19", "80 vs 9", "90 vs 9", "95 vs 9"], "correct": 3, "exp": "India added 90 airports in the last 12 years, compared to only 9 airports added between 2001 and 2014."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "E", "ftype": "fig", "passage": null, "q": "As per the chapter, India stands as the world's ______ largest domestic civil aviation market.", "opts": ["fourth-largest", "second-largest", "fifth-largest", "largest", "third-largest"], "correct": 4, "exp": "India stands as the world's third-largest domestic civil aviation market."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "M", "ftype": "fig", "passage": null, "q": "How many domestic passengers were recorded in May 2026 alone, as per the chapter?", "opts": ["5 lakh", "more than 1.5 crore", "2 crore", "1 crore", "1.2 crore"], "correct": 1, "exp": "The chapter records more than 1.5 crore domestic passengers in May 2026 alone (separately noting about 5 lakh domestic passengers daily)."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "M", "ftype": "num", "passage": "Under 'Support for Indigenous Manufacturing and Ecosystem Development' in Modified UDAN:\n1. Two Hindustan-228 Dornier aircraft will be procured for Alliance Air.\n2. Two helicopters will be procured for Pawan Hans.\n3. The scheme strengthens the domestic Maintenance, Repair and Overhaul (MRO) ecosystem.\n4. This component is entirely separate from the Make in India and Atmanirbhar Bharat initiatives.", "q": "Which of the above statements is/are correct?", "opts": ["1, 2 and 3", "1 and 4", "2, 3 and 4", "Only 1", "All of the above"], "correct": 0, "exp": "Statement 4 is incorrect: this component actually promotes the Make in India and Atmanirbhar Bharat initiatives — it is not separate from them."}, {"topic": "Modified Regional Connectivity Scheme (UDAN)", "diff": "H", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["Over the past nine years, UDAN operationalised 663 routes across 95 airports/heliports/water aerodromes.", "Modified UDAN's VGF is now a flat 100% support throughout its 5-year duration.", "The original RCS-UDAN was launched in October 2016.", "For NE and hilly states, the underserved threshold has been increased to 21 weekly flights.", "The Centre will, for the first time, provide operational and maintenance support to financially unviable Tier-2/3 city airports."], "correct": 1, "exp": "Modified UDAN's VGF is tapered — 100% in the first two years, 75% in the third, 50% in the fourth, and 25% in the fifth — not a flat 100% throughout."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "E", "ftype": "fig", "passage": null, "q": "On which date was PMKSY launched?", "opts": ["1 July 2016", "1 July 2014", "1 January 2015", "15 July 2015", "1 July 2015"], "correct": 4, "exp": "PMKSY was launched on 1 July 2015 and has completed more than a decade of implementation."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "M", "ftype": "fig", "passage": null, "q": "What does 'Jal Sinchan' refer to under PMKSY?", "opts": ["Efficient water application at the farm level", "Rainwater harvesting and storage", "Canal lining and desilting", "Groundwater recharge only", "Drought monitoring"], "correct": 0, "exp": "PMKSY focuses on Jal Sanchay (rainwater harvesting and storage) and Jal Sinchan (efficient water application) to strengthen irrigation infrastructure from source to farm."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about PMKSY is correct?", "opts": ["The Union Budget 2026-27 allocation for PMKSY is ₹93,068.56 crore.", "PDMC was merged under Pradhan Mantri Krishi Sinchayee Yojana itself from 2022-23 onwards.", "PMKSY was launched on 1 July 2015 and focuses on 'Per Drop More Crop' through Jal Sanchay and Jal Sinchan.", "As of August 2025, more than 27 crore farmers have benefited under PMKSY.", "The overall outlay approved for PMKSY's continuation
