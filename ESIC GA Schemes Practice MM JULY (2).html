 (2021-26) is ₹6,587 crore."], "correct": 2, "exp": "More than 27 million (not crore) farmers have benefited; the ₹6,587 crore figure is the Union Budget 2026-27 allocation, while the overall 2021-26 outlay is ₹93,068.56 crore; PDMC was merged under PM-RKVY (not PMKSY itself) from 2022-23."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "M", "ftype": "num", "passage": "PMKSY has completed more than a decade of implementation, having been launched on 1 July 2015.\n1. As of August 2025, more than 27 million farmers have benefited under the scheme.\n2. The Union Budget 2026-27 allocation for PMKSY is ₹6,587 crore.\n3. The Government approved the continuation of PMKSY for 2021-26 with an overall outlay of ₹93,068.56 crore.\n4. PMKSY has only three major components.", "q": "Which of the above statements is/are correct?", "opts": ["2, 3 and 4", "Only 1", "1 and 4", "1, 2 and 3", "All of the above"], "correct": 3, "exp": "Statement 4 is incorrect: PMKSY has four major components (AIBP, HKKP, Watershed Development, and PDMC), not three."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT one of the four major components of PMKSY?", "opts": ["Accelerated Irrigation Benefit Programme (AIBP)", "Per Drop More Crop (PDMC)", "Watershed Development", "National Command Area Modernisation Mission", "Har Khet Ko Pani (HKKP)"], "correct": 3, "exp": "PMKSY's four major components are AIBP, HKKP, Watershed Development, and PDMC — 'National Command Area Modernisation Mission' is not one of them."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "M", "ftype": "num", "passage": "Regarding the components of PMKSY:\n1. Central assistance under AIBP since 2016-17 stands at ₹21,023 crore.\n2. Central assistance under Watershed Development since 2016-17 stands at ₹12,432.09 crore.\n3. Under PDMC, financial assistance is 45% for small/marginal farmers and 55% for other farmers.\n4. HKKP has completed 3,462 Surface Minor Irrigation (SMI) and RRR schemes.", "q": "Which of the above statements is/are correct?", "opts": ["1 and 3", "1, 2 and 4", "Only 1", "2, 3 and 4", "All of the above"], "correct": 1, "exp": "Statement 3 reverses the actual split: under PDMC, financial assistance is 55% for small and marginal farmers, and 45% for other farmers."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "M", "ftype": "fig", "passage": null, "q": "In 2025-26, which sub-scheme was launched under AIBP, and with what initial outlay?", "opts": ["M-CADWM, ₹1,600 crore", "M-CADWM, ₹1,000 crore", "PDMC-2.0, ₹1,600 crore", "HKKP-Plus, ₹1,600 crore", "M-CADWM, ₹2,600 crore"], "correct": 0, "exp": "In 2025-26, the Modernization of Command Area Development and Water Management (M-CADWM) was launched as a sub-scheme of AIBP, with an initial outlay of ₹1,600 crore."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "E", "ftype": "fig", "passage": null, "q": "Under PDMC, what percentage of financial assistance is provided to small and marginal farmers?", "opts": ["40%", "45%", "55%", "50%", "60%"], "correct": 2, "exp": "PDMC provides financial assistance of 55% for small and marginal farmers, and 45% for other farmers."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "M", "ftype": "fig", "passage": null, "q": "The Micro Irrigation Fund supporting PDMC is set up under which institution?", "opts": ["SIDBI", "RBI", "SBI", "EXIM Bank", "NABARD"], "correct": 4, "exp": "PDMC is supported by the Micro Irrigation Fund under the National Bank for Agriculture and Rural Development (NABARD)."}, {"topic": "Pradhan Mantri Krishi Sinchayee Yojana (PMKSY)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["PDMC has, from 2022-23 onwards, been merged under Pradhan Mantri Krishi Vikas Yojana (PM-RKVY).", "The scheme's vision is captured in the phrase 'Per Drop More Crop'.", "Central assistance under Watershed Development since 2016-17 is ₹21,023 crore.", "PMKSY was launched on 1 July 2015.", "HKKP aims to create new water sources through minor irrigation."], "correct": 2, "exp": "The ₹21,023 crore figure belongs to AIBP; central assistance under Watershed Development since 2016-17 is actually ₹12,432.09 crore."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "E", "ftype": "fig", "passage": null, "q": "On which date did the Employees' Provident Funds Scheme, 2026 come into force?", "opts": ["30 June 2026", "29 June 2026", "1 July 2026", "29 June 2025", "1 April 2026"], "correct": 1, "exp": "The Employees' Provident Funds Scheme, 2026 came into force on 29 June 2026, replacing the scheme in operation since 1952."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "E", "ftype": "fig", "passage": null, "q": "What is the statutory wage ceiling that remains unchanged under the EPF Scheme, 2026?", "opts": ["₹15,000", "₹10,000", "₹12,000", "₹21,000", "₹18,000"], "correct": 0, "exp": "The statutory wage ceiling remains unchanged at ₹15,000 per month."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about the EPF Scheme, 2026 is correct?", "opts": ["The EPF Scheme, 2026 requires all existing members to undergo fresh enrolment.", "The new scheme reduces the uniform service-eligibility period for partial withdrawals to 24 months.", "Full withdrawal after job loss is now possible after 2 months of continuous unemployment, same as before.", "Under the new scheme, members must retain at least 50% of their aggregate PF balance after any partial withdrawal.", "The statutory contribution rate remains 12% of wages by both employer and employee (10% in specified establishments), with the wage ceiling unchanged at ₹15,000."], "correct": 4, "exp": "Existing members continue without fresh enrolment; the minimum balance retention rule requires 25% (not 50%); the service-eligibility period was reduced to 12 months (not 24); the waiting period for full withdrawal after job loss has actually been extended, not kept the same."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "M", "ftype": "num", "passage": "The Employees' Provident Funds Scheme, 2026 came into force on 29 June 2026, replacing the scheme in operation since 1952.\n1. The statutory contribution rate remains 12% of wages by both employer and employee.\n2. The new scheme allows contributions above the statutory rate and on wages exceeding the statutory ceiling.\n3. Contributions beyond the statutory wage ceiling can be insisted upon unilaterally by the employee.\n4. Employer contributions to EPF, NPS and superannuation funds remain tax-exempt up to an aggregate limit of ₹7.5 lakh per year.", "q": "Which of the above statements is/are correct?", "opts": ["Only 1", "1 and 3", "2, 3 and 4", "1, 2 and 4", "All of the above"], "correct": 3, "exp": "Statement 3 is incorrect: contributions beyond the statutory wage ceiling require mutual agreement between employer and employee — the employee cannot insist on higher contributions unilaterally."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "M", "ftype": "num", "passage": "Regarding the consolidated withdrawal rules under the new EPF Scheme, 2026:\n1. The earlier scheme had 13 separate provisions for partial withdrawals.\n2. The new scheme consolidates these into three broad categories: Essential needs, Housing needs, and Special circumstances.\n3. The uniform service-eligibility period for partial withdrawals has been increased to 24 months.\n4. Members can make up to 10 withdrawals for education, five each for marriage and housing.", "q": "Which of the above statements is/are correct?", "opts": ["1, 2 and 4", "All of the above", "2, 3 and 4", "Only 2", "1 and 3"], "correct": 0, "exp": "Statement 3 is incorrect: the uniform service-eligibility period for partial withdrawals has been reduced to 12 months, not increased to 24 months."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "M", "ftype": "fig", "passage": null, "q": "How many withdrawals are permitted for marriage and housing needs, respectively, under the new EPF Scheme?", "opts": ["Five for marriage, ten for housing", "Ten each for marriage and housing", "Five for marriage, two for housing", "Five each for marriage and housing", "Three each for marriage and housing"], "correct": 3, "exp": "The new scheme permits up to 10 withdrawals for education, and five each for marriage and housing."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "E", "ftype": "fig", "passage": null, "q": "What minimum percentage of the aggregate PF balance must a member retain after any partial withdrawal under the new scheme?", "opts": ["30%", "20%", "25%", "10%", "15%"], "correct": 2, "exp": "Members must retain at least 25% of the aggregate Provident Fund balance after any partial withdrawal — a universal rule unlike the purpose-based limits earlier."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "H", "ftype": "num", "passage": "Regarding full withdrawal after job loss under the new EPF Scheme:\n1. Earlier, full withdrawal was possible after 2 months of continuous unemployment.\n2. Now, up to 75% of the balance can be withdrawn during unemployment.\n3. The remaining balance becomes withdrawable only after 6 months of continuous unemployment.\n4. This change represents a longer waiting period for full withdrawal compared to the earlier scheme.", "q": "Which of the above statements is/are correct?", "opts": ["1 and 3", "All of the above", "2, 3 and 4", "Only 2", "1, 2 and 4"], "correct": 4, "exp": "Statement 3 is incorrect: the remaining balance becomes withdrawable only after 12 months of continuous unemployment, not 6 months."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following does NOT remain unchanged under the Employees' Provident Funds Scheme, 2026 (i.e., it has actually changed)?", "opts": ["Portability through UAN", "Waiting period for full withdrawal after job loss", "Retirement age", "Statutory contribution rate of 12%", "Statutory wage ceiling of ₹15,000"], "correct": 1, "exp": "The statutory contribution rate, wage ceiling, UAN portability, and retirement age all remain unchanged — but the waiting period for full withdrawal after job loss has been extended under the new scheme."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "M", "ftype": "fig", "passage": null, "q": "What is the aggregate annual limit up to which employer contributions to EPF, NPS and superannuation funds remain tax-exempt?", "opts": ["₹7.5 lakh", "₹5 lakh", "₹7 lakh", "₹6 lakh", "₹10 lakh"], "correct": 0, "exp": "Employer contributions to EPF, NPS, and superannuation funds remain tax-exempt up to an aggregate limit of ₹7.5 lakh per year."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "E", "ftype": "fig", "passage": null, "q": "Within what prescribed timelines must EPFO process claims or communicate deficiencies under the new scheme?", "opts": ["5 or 30 days", "3 or 20 days", "3 or 15 days", "7 or 15 days", "10 or 20 days"], "correct": 1, "exp": "EPFO must process claims or communicate deficiencies within prescribed timelines of 3 days or 20 days, depending on the case; delays may attract interest liability."}, {"topic": "Employees' Provident Funds Scheme, 2026", "diff": "H", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["The new scheme reduces the uniform service-eligibility period for partial withdrawal to 12 months.", "The minimum monthly contribution under EPF is ₹1,800 each from employee and employer based on the statutory ceiling.", "Nominations under the earlier scheme automatically carry forward without any need for review.", "An employer may contribute only up to ₹1,800/month while allowing the employee to contribute 12% of full basic pay.", "The scheme came into force on 29 June 2026."], "correct": 2, "exp": "Earlier nominations may actually lapse if they conflict with the new scheme; members are required to file a fresh nomination where necessary — they do not automatically carry forward."}, {"topic": "EPFO Amnesty Scheme, 2026", "diff": "E", "ftype": "fig", "passage": null, "q": "For how long is the EPFO Amnesty Scheme, 2026 open, from the date of notification?", "opts": ["12 months", "3 months", "9 months", "6 months", "1 month"], "correct": 3, "exp": "The EPFO Amnesty Scheme, 2026 is open for six months from the date of notification."}, {"topic": "EPFO Amnesty Scheme, 2026", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about the EPFO Amnesty Scheme, 2026 is correct?", "opts": ["The scheme applies to establishments that already possess a formal exemption notification.", "The scheme is administered by the Income Tax Department.", "The scheme was introduced under the Finance Act, 2025.", "The scheme is open for twelve months from the date of notification.", "The Amnesty Scheme grants retrospective exemption under Section 17 of the EPF&MP Act, 1952 and Section 143 of the Code on Social Security, 2020."], "correct": 4, "exp": "The scheme actually applies to establishments lacking a formal exemption notification; it was introduced under the Finance Act, 2026 (not 2025); it is open for six months, not twelve; and it is administered by EPFO under the Ministry of Labour and Employment, not the Income Tax Department."}, {"topic": "EPFO Amnesty Scheme, 2026", "diff": "M", "ftype": "num", "passage": "The EPFO introduced the Amnesty Scheme, 2026, under the Ministry of Labour and Employment.\n1. It provides a one-time opportunity for establishments operating exempted PF Trusts recognised under the Income Tax Act, 1961.\n2. The Finance Act, 2026 aligned the Income Tax framework governing recognised PFs with the EPF&MP Act, 1952.\n3. Recognition under the Income Tax Act is now available to any PF trust irrespective of exemption status.\n4. The scheme is open for six months from the date of notification.", "q": "Which of the above statements is/are correct?", "opts": ["1 and 3", "All of the above", "2, 3 and 4", "Only 1", "1, 2 and 4"], "correct": 4, "exp": "Statement 3 is incorrect: recognition under the Income Tax Act is now available only to provident funds that have obtained exemption under Section 17 of the EPF&MP Act, 1952 — not to any PF trust irrespective of exemption status."}, {"topic": "EPFO Amnesty Scheme, 2026", "diff": "M", "ftype": "num", "passage": "The Amnesty Scheme classifies eligible establishments into two categories:\n1. Category-I includes establishments already compliant as un-exempted, or opting for prospective compliance as un-exempted.\n2. Category-II includes establishments choosing to continue operating as exempted establishments under the Code on Social Security, 2020.\n3. Both categories are open only to establishments with a formal exemption notification already in place.\n4. Category-I and Category-II both seek retrospective trust regularisation.", "q": "Which of the above statements is/are correct?", "opts": ["2, 3 and 4", "1 and 3", "All of the above", "1, 2 and 4", "Only 1"], "correct": 3, "exp": "Statement 3 is incorrect: the scheme is specifically meant for establishments that do NOT possess a formal exemption notification, not the other way round."}, {"topic": "EPFO Amnesty Scheme, 2026", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following establishments is NOT eligible for the EPFO Amnesty Scheme, 2026?", "opts": ["An establishment that already possesses a formal exemption notification from the appropriate government", "An establishment opting for prospective compliance as an un-exempted establishment", "An establishment operating a PF Trust recognised under the Income Tax Act, 1961, without a formal exemption notification, seeking to become un-exempted", "An establishment continuing to operate as exempted under the Code on Social Security, 2020, seeking retrospective regularisation", "An establishment seeking retrospective trust regularisation under Category-I"], "correct": 0, "exp": "The scheme applies only to establishments that do NOT possess a formal exemption notification — an establishment that already has one is not eligible for this one-time regularisation opportunity."}, {"topic": "EPFO Amnesty Scheme, 2026", "diff": "E", "ftype": "acr", "passage": null, "q": "The EPFO Amnesty Scheme, 2026 grants retrospective exemption under which provisions?", "opts": ["Section 7A of the EPF&MP Act, 1952 and Section 143 of the Code on Social Security, 2020", "Section 17 of the EPF&MP Act, 1952 and Section 143 of the Code on Social Security, 2020", "Section 36 of the Income Tax Act, 1961 and Section 143 of the Code on Social Security, 2020", "Section 17 of the EPF&MP Act, 1952 and Section 17 of the Code on Social Security, 2020", "Section 17 of the Finance Act, 2026 and Section 143 of the Code on Social Security, 2020"], "correct": 1, "exp": "The Amnesty Scheme grants retrospective exemption under Section 17 of the EPF&MP Act, 1952 and Section 143 of the Code on Social Security, 2020."}, {"topic": "EPFO Amnesty Scheme, 2026", "diff": "M", "ftype": "fig", "passage": null, "q": "Which legislation aligned the Income Tax framework governing recognised provident funds with the EPF&MP Act, 1952?", "opts": ["Income Tax (Amendment) Act, 2026", "Finance Act, 2025", "Finance Act, 2026", "EPF Amendment Act, 2026", "Code on Social Security, 2020"], "correct": 2, "exp": "The Finance Act, 2026 aligned the Income Tax framework governing recognised provident funds with the EPF&MP Act, 1952."}, {"topic": "EPFO Amnesty Scheme, 2026", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["The scheme applies to establishments lacking a formal exemption notification.", "The Amnesty Scheme is open indefinitely, with no fixed duration.", "The Finance Act, 2026 is the basis for aligning the Income Tax framework with the EPF&MP Act, 1952.", "Category-II establishments choose to continue as exempted establishments under the Code on Social Security, 2020.", "The scheme is a one-time opportunity to regularise status."], "correct": 1, "exp": "The Amnesty Scheme is open for six months from the date of notification — it does not run indefinitely."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "E", "ftype": "fig", "passage": null, "q": "In which year was SMAM launched, and under which scheme?", "opts": ["2014-15, as a CSS under NFSM", "2014-15, as a Central Sector Scheme", "2014-15, as a CSS under RKVY", "2007-08, as a CSS under RKVY", "2016-17, as a CSS under RKVY"], "correct": 2, "exp": "SMAM was launched in 2014-15 as a Centrally Sponsored Scheme under the Rashtriya Krishi Vikas Yojana (RKVY)."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about SMAM is correct?", "opts": ["In the North-Eastern Region, SMAM provides up to 100% subsidy for Farm Machinery Banks.", "SMAM provides a uniform 50% subsidy for all farmer categories on agricultural machinery.", "40% of total SMAM funds are earmarked for women farmers.", "SMAM was launched in 2014-15 as a Centrally Sponsored Scheme under RKVY, aiming to 'reach the unreached'.", "Custom Hiring Centres (CHCs) receive financial assistance of 80% of project cost, up to ₹250 lakh."], "correct": 3, "exp": "SMAM provides 40% subsidy for general beneficiaries and 50% for SC/ST, small/marginal, women and NE farmers, not a uniform 50%; CHCs get 40% (not 80%) of project cost up to ₹250 lakh; NER FMBs get 95% support (100% is for small machinery); 30% (not 40%) of total funds are earmarked for women farmers."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "M", "ftype": "num", "passage": "Under SMAM's Financial Assistance for Procurement of Agricultural Machinery:\n1. General beneficiaries receive a 40% subsidy of the machine cost via Direct Benefit Transfer.\n2. SC/ST farmers, small and marginal farmers, women farmers and NE beneficiaries receive a 50% subsidy.\n3. Small and marginal farmers receive ₹2,000 per hectare for mechanized services including drones through CHCs, SHGs and FPOs.\n4. This subsidy is disbursed only through cash payments, not Direct Benefit Transfer.", "q": "Which of the above statements is/are correct?", "opts": ["Only 2", "2, 3 and 4", "1 and 4", "All of the above", "1, 2 and 3"], "correct": 4, "exp": "Statement 4 is incorrect: the subsidy support under SMAM is disbursed via Direct Benefit Transfer (DBT), not only through cash payments."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "M", "ftype": "num", "passage": "Regarding financial support for Farm Machinery Banks (FMBs) and Custom Hiring Centres (CHCs) under SMAM:\n1. CHCs receive financial assistance of 40% of project cost, up to ₹250 lakh.\n2. FMBs receive support of 80% for projects up to ₹30 lakh.\n3. SHGs, FPOs and local institutions receive 80-90% financial support.\n4. In the North-Eastern Region, FMBs receive 100% financial support.", "q": "Which of the above statements is/are correct?", "opts": ["1, 2 and 3", "Only 2", "1 and 4", "All of the above", "2, 3 and 4"], "correct": 0, "exp": "Statement 4 is incorrect: in the North-Eastern Region, Farm Machinery Banks receive 95% support (100% support is for small machinery, not FMBs)."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT among the Focus Areas of SMAM?", "opts": ["Provide Financial Support", "Ensure Testing and Certification", "Establish Farm Machinery Banks", "Promote Custom Hiring Centres", "Guarantee Minimum Support Price for machinery-linked crops"], "correct": 4, "exp": "SMAM's focus areas include financial support, FMBs, awareness/capacity building, mechanization access, CHCs, hi-tech equipment hubs, and testing/certification — guaranteeing MSP is not one of them."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "H", "ftype": "num", "passage": "Under SMAM's special focus on drones (financial support):\n1. CHCs, FPOs, Cooperatives and Rural Entrepreneurs receive 40% assistance up to ₹4 lakh.\n2. Agriculture graduates establishing rental CHCs receive 50% assistance up to ₹5 lakh.\n3. ICAR institutes, KVKs and State Agricultural Universities receive 100% support up to ₹10 lakh per drone.\n4. FPOs receive up to 50% grant for drones.", "q": "Which of the above statements is/are correct?", "opts": ["1, 2 and 3", "All of the above", "Only 1", "1 and 4", "2, 3 and 4"], "correct": 0, "exp": "Statement 4 is incorrect: FPOs receive up to 75% grant for drones, not 50%."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "M", "ftype": "fig", "passage": null, "q": "What is the contingency expenditure allowed per hectare for agencies using drones through service models under SMAM?", "opts": ["₹5,000", "₹8,000", "₹6,000", "₹4,000", "₹3,000"], "correct": 2, "exp": "SMAM allows a contingency expenditure of ₹6,000 per hectare for agencies using drones through service models."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "E", "ftype": "fig", "passage": null, "q": "What percentage of total SMAM funds are earmarked for women farmers?", "opts": ["33%", "50%", "25%", "30%", "20%"], "correct": 3, "exp": "30% of the total funds under SMAM are earmarked for women farmers."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "M", "ftype": "fig", "passage": null, "q": "What is the funding pattern for most states, and for NE & Himalayan States, under SMAM?", "opts": ["Most states: 60:40; NE & Himalayan States: 100:0", "Most states: 60:40; NE & Himalayan States: 90:10", "Most states: 60:40; NE & Himalayan States: 80:20", "Most states: 50:50; NE & Himalayan States: 90:10", "Most states: 90:10; NE & Himalayan States: 60:40"], "correct": 1, "exp": "SMAM's funding pattern is 60:40 (Centre:State) for most states and 90:10 for North-Eastern and Himalayan States; Union Territories get 100% central funding."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "E", "ftype": "fig", "passage": null, "q": "For individual ownership of drones, what percentage assistance (up to ₹5 lakh) do small/marginal, SC/ST, women, and NE farmers receive?", "opts": ["50%", "45%", "60%", "75%", "40%"], "correct": 0, "exp": "Small and marginal farmers, SC/ST, women farmers, and farmers from North-Eastern States receive 50% assistance (up to ₹5 lakh) for individual drone ownership; other farmers get 40% (up to ₹4 lakh)."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "E", "ftype": "acr", "passage": null, "q": "What is the full form of 'SMAM'?", "opts": ["Sub-Mission on Agricultural Marketing", "Sub-Mission on Agricultural Mechanization", "Sub-Mission for Agri Machinery", "State Mission on Agricultural Mechanization", "Special Mission for Agricultural Modernisation"], "correct": 1, "exp": "SMAM stands for Sub-Mission on Agricultural Mechanization."}, {"topic": "Sub-Mission on Agricultural Mechanization (SMAM)", "diff": "H", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["CHC financial assistance is capped at 40% of project cost up to ₹250 lakh.", "30% of total SMAM funds are earmarked for women farmers.", "Union Territories receive 60:40 (Centre:UT) funding under SMAM.", "SMAM aims to 'reach the unreached' by extending mechanization benefits to small/marginal farmers, women, SC, ST, FPOs, SHGs, and rural entrepreneurs.", "RKVY, under which SMAM operates, was restructured in 2017-18 as RKVY-RAFTAR."], "correct": 2, "exp": "Union Territories actually receive 100% central funding under SMAM, not a 60:40 split."}, {"topic": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "diff": "E", "ftype": "fig", "passage": null, "q": "SSBSK provides a continuum of care from birth up to how many months of age?", "opts": ["30 months", "60 months", "48 months", "24 months", "36 months"], "correct": 4, "exp": "SSBSK aims to provide a seamless continuum of home and community-based care from birth to 36 months of age."}, {"topic": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements about SSBSK is correct?", "opts": ["SSBSK was launched by Union Minister Amit Shah.", "Under SSBSK, at-risk newborns receive up to 5 home visits in the first 42 days.", "SSBSK's vision is captured in the phrase 'Sampoorna Swasthya Abhiyan'.", "SSBSK consolidates HBNC and HBYC into a single comprehensive framework for continuum of care from birth to 36 months.", "Joint home visits under SSBSK are conducted only by ASHAs, without involvement of ANMs or Anganwadi Workers."], "correct": 3, "exp": "SSBSK was launched by Union Minister for Health & Family Welfare, Jagat Prakash Nadda, not Amit Shah; at-risk newborns receive up to 9 (not 5) home visits in the first 42 days; the vision phrase is 'Pehle Teen Saal Sampoorna Dekhbhaal'; joint home visits are conducted by ASHAs, ANMs, CHOs and AWWs together."}, {"topic": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "diff": "M", "ftype": "num", "passage": "Union Minister Jagat Prakash Nadda launched the Samagra Shishu Bal Swasthya Karyakram (SSBSK).\n1. SSBSK provides a seamless continuum of home and community-based care from birth to 36 months of age.\n2. It consolidates Home-Based Newborn Care (HBNC) and Home-Based Care for Young Child (HBYC).\n3. 'At-risk' newborns will receive up to 9 home visits in the first 42 days.\n4. 'At-risk' children will receive up to 12 home visits up to 36 months of age.", "q": "Which of the above statements is/are correct?", "opts": ["1 and 4", "1, 2 and 3", "Only 1", "All of the above", "2, 3 and 4"], "correct": 1, "exp": "Statement 4 is incorrect: 'at-risk' children receive up to 8 home visits up to 36 months of age, not 12."}, {"topic": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "diff": "M", "ftype": "not", "passage": null, "q": "Which of the following is NOT genuinely one of the 'New Community Platforms' introduced under SSBSK?", "opts": ["Quarterly Mother-Child Health Fairs at District Hospitals", "Risk-Stratified Approach for at-risk newborns and children", "Well-Baby Sessions at every Village Health, Sanitation and Nutrition Day (VHSND)", "Joint Home Visits by ASHAs, ANMs, CHOs and AWWs", "Monthly Shishu Shivir at Ayushman Arogya Mandirs"], "correct": 0, "exp": "The chapter mentions Well-Baby Sessions at VHSNDs and monthly Shishu Shivir at Ayushman Arogya Mandirs as new community platforms, alongside the Risk-Stratified Approach and Joint Home Visits as other innovations — 'Quarterly Mother-Child Health Fairs' is not mentioned."}, {"topic": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "diff": "M", "ftype": "fig", "passage": null, "q": "Under the Risk-Stratified Approach, how many home visits can 'at-risk' newborns and 'at-risk' children respectively receive?", "opts": ["Newborns: up to 9 visits; Children: up to 12 visits", "Newborns: up to 6 visits; Children: up to 8 visits", "Newborns: up to 9 visits in the first 60 days; Children: up to 8 visits up to 24 months", "Newborns: up to 9 visits in the first 42 days; Children: up to 8 visits up to 36 months", "Newborns: up to 8 visits; Children: up to 9 visits"], "correct": 3, "exp": "'At-risk' newborns can receive up to 9 home visits in the first 42 days, and 'at-risk' children up to 8 home visits up to 36 months of age."}, {"topic": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "diff": "M", "ftype": "fig", "passage": null, "q": "SSBSK's vision phrase, 'Pehle Teen Saal Sampoorna Dekhbhaal', translates to what in English?", "opts": ["First Three Years – Total Nutrition", "First Five Years – Total Wellness", "First Three Years – Complete Care", "First Two Years – Complete Care", "First Three Years – Community Care"], "correct": 2, "exp": "'Pehle Teen Saal Sampoorna Dekhbhaal' translates to 'First Three Years – Complete Care'."}, {"topic": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "diff": "M", "ftype": "fig", "passage": null, "q": "Who conducts the 'Joint Home Visits' under SSBSK?", "opts": ["ASHAs, ANMs and Doctors", "ASHAs, CHOs, AWWs and Pharmacists", "ANMs, CHOs and AWWs only", "ASHAs and ANMs only", "ASHAs, ANMs, CHOs and AWWs"], "correct": 4, "exp": "Joint home visits under SSBSK are conducted by Accredited Social Health Activists (ASHAs), Auxiliary Nurse Midwives (ANMs), Community Health Officers (CHOs), and Anganwadi Workers (AWWs)."}, {"topic": "Samagra Shishu Bal Swasthya Karyakram (SSBSK)", "diff": "M", "ftype": "stmt", "passage": null, "q": "Which one of the following statements is NOT correct?", "opts": ["SSBSK consolidates HBNC and HBYC into one unified national programme.", "The scheme introduces a Risk-Stratified Approach for the first time.", "Monthly Shishu Shivir sessions are held at Ayushman Arogya Mandirs.", "SSBSK was launched by Union Minister Jagat Prakash Nadda.", "SSBSK provides care only for the first 12 months after birth."], "correct": 4, "exp": "SSBSK actually provides a continuum of care from birth up to 36 months of age, not just 12 months."}, {"topic": "Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS)", "diff": "E", "ftype": "fig", "passage": null, "q": "PM VIKAS is a Central Sector Scheme of which ministry?", "opts": ["Ministry of Skill Development & Entrepreneurship", "Ministry of Minority Affairs", "Ministry of Tribal Affairs", "Ministry of Rural Development", "Ministry of Social Justice & Empowermen /* ============================================================
   STATE
   ============================================================ */
let state = {
  screen: 'home',          // home | sectionGrid | sprintReady | quiz | results
  mode: null,              // 'full' | 'section' | 'sprint'
  order: 'pdf',            // 'pdf' | 'shuffled'  (full mode only)
  activeTopic: null,
  queue: [],               // array of question objects for current session
  idx: 0,
  answers: {},             // idx -> {status:'correct'|'wrong'|'skipped', chosen:int|null}
  score: 0,
};

const DIFF_LABEL = { E: 'Easy', M: 'Moderate', H: 'Hard' };
const SPRINT_TYPES = ['num','not','acr'];

/* ============================================================
   HELPERS
   ============================================================ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function topicList(){
  const map = {};
  QUESTIONS.forEach(q=>{ map[q.topic] = (map[q.topic]||0)+1; });
  return Object.entries(map);
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function letterOf(i){ return ['A','B','C','D','E'][i]; }

/* ============================================================
   RENDER ROUTER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'brand';
  header.innerHTML = `<h1>ESI/GA <em>Schemes</em> Practice</h1><span class="tag">NABARD Grade A</span>`;
  app.appendChild(header);

  if(state.screen === 'home') renderHome(app);
  else if(state.screen === 'sectionGrid') renderSectionGrid(app);
  else if(state.screen === 'fullSetup') renderFullSetup(app);
  else if(state.screen === 'quiz') renderQuiz(app);
  else if(state.screen === 'results') renderResults(app);
}

/* ============================================================
   HOME
   ============================================================ */
function renderHome(app){
  const total = QUESTIONS.length;
  const sprintCount = QUESTIONS.filter(q=>SPRINT_TYPES.includes(q.ftype)).length;
  const topics = topicList().length;

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <p class="intro">A practice bank drawn from the July and May Schemes chapters — government schemes, launches, and current-affairs figures, styled after real NABARD Grade A ESI/GA mocks.</p>
    <div class="mode-list">
      <button class="mode-card" id="mode-full">
        <div class="mtitle">Full Practice Test</div>
        <div class="mdesc">Every question in the bank, in chapter order or shuffled. Best for a complete timed run.</div>
        <div class="mcount">${total} questions</div>
      </button>
      <button class="mode-card" id="mode-section">
        <div class="mtitle">Section-wise Revision</div>
        <div class="mdesc">Drill one scheme or topic at a time — pick from the full list of ${topics} topics covered.</div>
        <div class="mcount">${topics} topics</div>
      </button>
      <button class="mode-card" id="mode-sprint">
        <div class="mtitle">Schemes-Only Sprint</div>
        <div class="mdesc">Just the scheme/organisation-specific format — numbered-statement, not-among, and acronym questions.</div>
        <div class="mcount">${sprintCount} questions</div>
      </button>
    </div>
    <div class="stats-strip">
      <span><b>${total}</b> total questions</span>
      <span><b>${topics}</b> schemes covered</span>
    </div>
  `;
  app.appendChild(wrap);
  document.getElementById('mode-full').onclick = ()=>{ state.screen='fullSetup'; render(); };
  document.getElementById('mode-section').onclick = ()=>{ state.screen='sectionGrid'; render(); };
  document.getElementById('mode-sprint').onclick = ()=>{
    state.mode='sprint';
    startQuiz(QUESTIONS.filter(q=>SPRINT_TYPES.includes(q.ftype)));
  };
}

/* ============================================================
   FULL TEST SETUP (order toggle)
   ============================================================ */
function renderFullSetup(app){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <button class="back-link" id="back">&larr; Back to menu</button>
    <div class="screen-title">Full Practice Test</div>
    <div class="screen-sub">${QUESTIONS.length} questions, covering every scheme in both chapters.</div>
    <div class="toggle-row">
      <button class="toggle-btn ${state.order==='pdf'?'active':''}" id="ord-pdf">PDF Order</button>
      <button class="toggle-btn ${state.order==='shuffled'?'active':''}" id="ord-shuf">Shuffled</button>
    </div>
    <br>
    <button class="start-btn" id="start-full">Start Test</button>
  `;
  app.appendChild(wrap);
  document.getElementById('back').onclick = ()=>{ state.screen='home'; render(); };
  document.getElementById('ord-pdf').onclick = ()=>{ state.order='pdf'; render(); };
  document.getElementById('ord-shuf').onclick = ()=>{ state.order='shuffled'; render(); };
  document.getElementById('start-full').onclick = ()=>{
    state.mode='full';
    const qs = state.order==='shuffled' ? shuffle(QUESTIONS) : QUESTIONS.slice();
    startQuiz(qs);
  };
}

/* ============================================================
   SECTION GRID
   ============================================================ */
function renderSectionGrid(app){
  const wrap = document.createElement('div');
  const topics = topicList();
  let cardsHtml = topics.map(([name,count],i)=>`
    <button class="topic-card" data-topic="${i}">
      <div class="ttitle">${escapeHtml(name)}</div>
      <div class="tcount">${count} question${count===1?'':'s'}</div>
    </button>
  `).join('');
  wrap.innerHTML = `
    <button class="back-link" id="back">&larr; Back to menu</button>
    <div class="screen-title">Section-wise Revision</div>
    <div class="screen-sub">Tap a topic to drill just its questions.</div>
    <div class="topic-grid">${cardsHtml}</div>
  `;
  app.appendChild(wrap);
  document.getElementById('back').onclick = ()=>{ state.screen='home'; render(); };
  topics.forEach(([name],i)=>{
    document.querySelector(`[data-topic="${i}"]`).onclick = ()=>{
      state.mode='section';
      state.activeTopic = name;
      startQuiz(QUESTIONS.filter(q=>q.topic===name));
    };
  });
}

/* ============================================================
   QUIZ FLOW
   ============================================================ */
function startQuiz(queue){
  state.queue = queue;
  state.idx = 0;
  state.answers = {};
  state.score = 0;
  state.screen = 'quiz';
  render();
}

function currentQ(){ return state.queue[state.idx]; }

function renderQuiz(app){
  const q = currentQ();
  const total = state.queue.length;
  const answered = state.answers[state.idx];

  const wrap = document.createElement('div');
  const pct = Math.round((state.idx/total)*100);
  wrap.innerHTML = `
    <div class="quiz-top">
      <div class="progress-row">
        <span>Question ${state.idx+1} of ${total}</span>
        <span class="score-chip">Score: ${state.score}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="qmeta">
      <span class="badge">${escapeHtml(q.topic)}</span>
      <span class="badge diff-${q.diff}">${DIFF_LABEL[q.diff]}</span>
    </div>
    ${q.passage ? `<div class="passage">${escapeHtml(q.passage)}</div>` : ''}
    <div class="question-stem">${escapeHtml(q.q)}</div>
    <div class="options" id="opts"></div>
    <div id="explainBox"></div>
    <div class="quiz-actions">
      <button class="skip-btn" id="skipBtn">Skip</button>
      <button class="next-btn" id="nextBtn" disabled>${state.idx===total-1 ? 'Finish' : 'Next question'}</button>
    </div>
  `;
  app.appendChild(wrap);

  const optsEl = document.getElementById('opts');
  q.opts.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="oletter">${letterOf(i)}</span><span>${escapeHtml(opt)}</span>`;
    btn.onclick = ()=> selectOption(i);
    optsEl.appendChild(btn);
  });

  document.getElementById('skipBtn').onclick = skipQuestion;
  document.getElementById('nextBtn').onclick = nextQuestion;

  if(answered){ lockOptions(answered.chosen); }
  if(answered) document.getElementById('nextBtn').disabled = false;
  if(answered && answered.status==='skipped') document.getElementById('skipBtn').style.display='none';
}

function lockOptions(chosenIdx){
  const q = currentQ();
  const opts = document.querySelectorAll('#opts .option');
  opts.forEach((el,i)=>{
    el.classList.add('locked');
    el.onclick = null;
    if(i === q.correct) el.classList.add('correct');
    else if(i === chosenIdx) el.classList.add('wrong');
    else el.classList.add('dim');
  });
  showExplain();
}

function showExplain(){
  const q = currentQ();
  const box = document.getElementById('explainBox');
  box.innerHTML = `<div class="explain"><b>Correct answer: ${letterOf(q.correct)}.</b> ${escapeHtml(q.exp)}</div>`;
}

function selectOption(i){
  if(state.answers[state.idx]) return; // already answered
  const q = currentQ();
  const correct = (i === q.correct);
  state.answers[state.idx] = { status: correct ? 'correct' : 'wrong', chosen: i };
  if(correct) state.score++;
  lockOptions(i);
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('skipBtn').style.display = 'none';
  updateScoreChip();
}

function skipQuestion(){
  if(state.answers[state.idx]) return;
  state.answers[state.idx] = { status:'skipped', chosen: null };
  lockOptions(null);
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('skipBtn').style.display = 'none';
}

function updateScoreChip(){
  const chip = document.querySelector('.score-chip');
  if(chip) chip.textContent = `Score: ${state.score}`;
}

function nextQuestion(){
  if(state.idx < state.queue.length-1){
    state.idx++;
    render();
  } else {
    state.screen = 'results';
    render();
  }
}

/* ============================================================
   RESULTS
   ============================================================ */
function renderResults(app){
  const total = state.queue.length;
  const attempted = Object.values(state.answers).filter(a=>a.status!=='skipped').length;
  const skippedCount = Object.values(state.answers).filter(a=>a.status==='skipped').length;
  const score = state.score;

  // difficulty breakdown
  const diffStats = { E:{c:0,t:0}, M:{c:0,t:0}, H:{c:0,t:0} };
  state.queue.forEach((q,i)=>{
    diffStats[q.diff].t++;
    const a = state.answers[i];
    if(a && a.status==='correct') diffStats[q.diff].c++;
  });

  const missed = [];
  state.queue.forEach((q,i)=>{
    const a = state.answers[i];
    if(!a || a.status!=='correct') missed.push({q, a, i});
  });

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="result-hero">
      <div class="rscore">${score} / ${total}</div>
      <div class="rlabel">${attempted} attempted &middot; ${skippedCount} skipped &middot; ${Math.round((score/total)*100)}% overall</div>
    </div>
    <div class="breakdown">
      ${['E','M','H'].map(d=>`
        <div class="bd-card">
          <div class="bdn">${diffStats[d].t ? diffStats[d].c+'/'+diffStats[d].t : '—'}</div>
          <div class="bdl">${DIFF_LABEL[d]}</div>
        </div>
      `).join('')}
    </div>
    ${missed.length ? `<h3 class="section-h">Review — missed &amp; skipped (${missed.length})</h3>` : `<p class="empty-note">Clean sweep — no missed or skipped questions.</p>`}
    <div id="reviewList"></div>
    <div class="end-actions">
      <button class="secondary-btn" id="retryBtn">Retry same set</button>
      <button class="start-btn" id="menuBtn" style="flex:1;">Back to menu</button>
    </div>
  `;
  app.appendChild(wrap);

  const list = document.getElementById('reviewList');
  missed.forEach(({q,a})=>{
    const div = document.createElement('div');
    div.className = 'review-item';
    let yourLine = '';
    if(!a || a.status==='skipped'){
      yourLine = `<div class="rline rskip">Skipped</div>`;
    } else {
      yourLine = `<div class="rline ryour">Your answer: ${letterOf(a.chosen)}. ${escapeHtml(q.opts[a.chosen])}</div>`;
    }
    div.innerHTML = `
      <div class="rtopic">${escapeHtml(q.topic)}</div>
      <div class="rq">${escapeHtml(q.q)}</div>
      ${yourLine}
      <div class="rline rcorrect">Correct answer: ${letterOf(q.correct)}. ${escapeHtml(q.opts[q.correct])}</div>
      <div class="rexp">${escapeHtml(q.exp)}</div>
    `;
    list.appendChild(div);
  });

  document.getElementById('retryBtn').onclick = ()=>{ startQuiz(state.queue); };
  document.getElementById('menuBtn').onclick = ()=>{ state.screen='home'; render(); };
}

render();
</script>
</body>
</html>
