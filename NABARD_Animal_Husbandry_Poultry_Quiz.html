<html lang="en">

<title>NABARD Grade A Practice Quiz — Animal Husbandry & Poultry</title>
<style>
  :root{

    --leaf:#2f5233;
    --leaf-dark:#20391f;
    --leaf-light:#4c7a4f;
    --barn:#a13c2c;
    --good:#2f5233;
    --good-bg:#e3ecdf;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{

    color: var(--ink);
    min-height:100%;
    padding: 18px 12px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .masthead{
    border-bottom: 3px solid var(--leaf-dark);
    padding-bottom:14px;
    margin-bottom:20px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .masthead h1{
    font-family: 'Iowan Old Style','Georgia',serif;
    font-size:1.5rem;
    letter-spacing:0.02em;
    margin:0 0 4px;
    color:var(--leaf-dark);
  }
  .masthead .sub{
    font-size:0.82rem;
    color:#5a5240;
    font-style:italic;
  }
  .badge{
    font-family: Arial, sans-serif;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    background:var(--leaf-dark);
    color:var(--paper);
    padding:5px 10px;
    border-radius:2px;
    white-space:nowrap;
  }
  .statbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    font-family: Arial, sans-serif;
    font-size:0.76rem;
    margin-bottom:18px;
    color:#4a4433;
  }
  .stat{
    background:var(--paper2);
    border:1px solid var(--line);
    border-radius:3px;
    padding:6px 10px;
    display:flex;
    gap:6px;
    align-items:baseline;
  }
  .stat b{color:var(--leaf-dark);font-size:0.95rem;}
  .progress-outer{
    height:8px;
    background:var(--paper2);
    border:1px solid var(--line);
    border-radius:5px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-inner{
    height:100%;
    background: linear-gradient(90deg, var(--leaf), var(--wheat));
    width:0%;
    transition:width .35s ease;
  }
  .card{
    background:#fffdf6;
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow: var(--shadow);
    padding:22px 20px 18px;
    margin-bottom:18px;
  }
  .qmeta{
    font-family: Arial, sans-serif;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--wheat-dark);
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
  }
  .qtext{
    font-size:1.03rem;
    line-height:1.55;
    white-space:pre-line;
    margin-bottom:16px;
    color:var(--ink);
  }
  .options{display:flex;flex-direction:column;gap:9px;}
  .opt{
    font-family: Arial, sans-serif;
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:5px;
    padding:11px 13px;
    font-size:0.9rem;
    line-height:1.4;
    cursor:pointer;
    transition: background .15s, border-color .15s, transform .1s;
    color:var(--ink);
  }
  .opt:hover:not(.locked){
    border-color: var(--leaf-light);
    background: #fbf9f0;
  }
  .opt .letter{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:0.72rem;
    font-weight:bold;
    color:var(--leaf-dark);
    background:#fff;
  }
  .opt.correct{
    background: var(--good-bg);
    border-color: var(--good);
  }
  .opt.correct .letter{ background:var(--good); border-color:var(--good); color:#fff; }
  .opt.incorrect{
    background: var(--bad-bg);
    border-color: var(--bad);
  }
  .opt.incorrect .letter{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .opt.locked{cursor:default;}
  .opt.dim{opacity:0.55;}

  .feedback{
    margin-top:14px;
    padding:12px 14px;
    border-radius:5px;
    font-family: Arial, sans-serif;
    font-size:0.85rem;
    line-height:1.5;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{ background:var(--good-bg); border:1px solid var(--good); color:var(--leaf-dark);}
  .feedback.bad{ background:var(--bad-bg); border:1px solid var(--bad); color:#6e2418;}
  .feedback .tag{font-weight:bold; text-transform:uppercase; letter-spacing:0.05em; font-size:0.72rem; display:block; margin-bottom:4px;}

  .navrow{display:flex; justify-content:flex-end; margin-top:16px;}
  .btn{
    font-family: Arial, sans-serif;
    background: var(--leaf-dark);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:4px;
    font-size:0.85rem;
    cursor:pointer;
    letter-spacing:0.02em;
    transition: background .15s;

  .btn:hover{background:var(--leaf);}
  .btn:disabled{background:#b9b19a;cursor:not-allowed;}
  .btn.secondary{background:transparent; color:var(--leaf-dark); border:1.5px solid var(--leaf-dark);}
  .btn.secondary:hover{background:var(--paper2);}

  .jumprow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
  .jbtn{
    width:28px;height:28px;

    font-size:0.65rem;

  .setup h2{color:var(--leaf-dark); font-size:1.25rem;}

  .results h2{color:var(--leaf-dark); text-align:center; margin-bottom:4px;}
  .scoreRing{
    width:150px;height:150px;
    margin:14px auto 20px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    border:8px solid var(--leaf);
    background:#fffdf6;
  }
  .scoreRing .pct{font-size:2rem; font-weight:bold; color:var(--leaf-dark); font-family:Arial, sans-serif;}
  .scoreRing .lbl{font-size:0.7rem; color:#6a604a; font-family:Arial, sans-serif; text-transform:uppercase; letter-spacing:0.06em;}

  .summarygrid{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:24px;
    font-family:Arial, sans-serif;
  }
  .sbox{background:var(--paper2); border:1px solid var(--line); border-radius:5px; padding:10px 16px; text-align:center; min-width:90px;}
  .sbox .n{font-size:1.3rem; font-weight:bold;}
  .sbox .l{font-size:0.68rem; text-transform:uppercase; color:#6a604a; letter-spacing:0.05em;}
  .sbox.good .n{color:var(--good);}
  .sbox.bad .n{color:var(--bad);}

  .reviewitem{
    border:1px solid var(--line);
    border-left:4px solid var(--bad);
    background:#fffdf6;
    border-radius:4px;
    padding:14px 16px;

  .reviewitem .ryour{font-family:Arial, sans-serif; font-size:0.8rem; color:var(--bad); margin-bottom:3px;}
  .reviewitem .rcorrect{font-family:Arial, sans-serif; font-size:0.8rem; color:var(--good); margin-bottom:6px;}
  .reviewitem .rexp{font-family:Arial, sans-serif; font-size:0.78rem; color:#5a5240; line-height:1.5; background:var(--paper2); padding:8px 10px; border-radius:4px;}

  .filterbtns{display:flex; gap:6px; font-family:Arial,sans-serif;}

  footer.note{
    text-align:center; font-family:Arial,sans-serif; font-size:0.72rem; color:#8a8268; margin-top:24px;
  }
  @media (max-width:480px){
    .masthead h1{font-size:1.2rem;}
    .card{padding:16px 14px 14px;}
  }
</style>
</head>

    "question": "Consider the following statements about the 'Restive Phase' of the milking cycle during calf suckling:\n1. About 20 mm Hg pressure is created at the teat end during this phase.\n2. In buffaloes, about 400 mm Hg pressure is applied during suckling overall.\n3. In cattle, pressure during suckling can be restricted to 360-380 mm Hg.\nWhich of the above statements are correct?",
    "options": [
      "1, 2 and 3",
      "1 and 2 only",
      "2 and 3 only",
      "1 only",
      "None of the above"
    ],
    "correctIndex": 0,
    "correctLetter": "A",
    "explanation": "All three statements correctly describe the pressure dynamics during the restive phase of natural suckling."
  },
  {
    "id": 252,
    "question": "What is the last-drawn milk during hand milking called, and why is it significant?",
    "options": [
      "Residual milk; it has no nutritional value",
      "Stripping; it is rich in fat content",
      "Foremilk; it is rich in protein",
      "Colostrum; it is rich in antibodies",
      "Skim; it is low in fat"
    ],
    "correctIndex": 1,
    "correctLetter": "B",
    "explanation": "The last drawn milk is called 'stripping' and is rich in fat content; the process should be done quickly to avoid the animal becoming a 'stripper'."
  }
]</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const app = document.getElementById('app');
  const modeBadge = document.getElementById('modeBadge');
  const LETTERS = ['A','B','C','D','E'];

  let order = DATA.map((_,i)=>i);
  let current = 0;
  let answers = {}; // qIndex -> {selected, correct}
  let started = false;

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function renderSetup(){
    modeBadge.textContent = DATA.length + ' Questions';
    app.innerHTML = `
      <div class="card setup">
        <h2>Ready when you are</h2>
        <p>${DATA.length} NABARD-style questions covering the entire Animal Husbandry &amp; Poultry summary sheet — cattle, buffalo, goat, sheep &amp; pig breeds, feeding, breeding, nutrient deficiencies, poultry breeds, housing, diseases, vaccination, terminology, and clean milk production. Multi-statement items, direct facts, and "NOT correct" trap questions, skewed hard.</p>
        <button class="btn" id="startBtn">Start Quiz</button>
        <div style="margin-top:14px;">
          <label style="font-family:Arial,sans-serif;font-size:0.8rem;color:#5a5240;">
            <input type="checkbox" id="shuffleChk"> Shuffle question order
          </label>
        </div>
      </div>
    `;
    document.getElementById('startBtn').onclick = function(){
      if(document.getElementById('shuffleChk').checked){
        order = shuffle(DATA.map((_,i)=>i));
      } else {
        order = DATA.map((_,i)=>i);
      }
      current = 0;
      answers = {};
      started = true;
      renderQuiz();
    };
  }

  function scoreCount(){
    let correct=0, incorrect=0;
    Object.values(answers).forEach(a=>{ if(a.correct) correct++; else incorrect++; });
    return {correct, incorrect, answered: correct+incorrect};
  }

  function renderJumpRow(){
    let html = '<div class="jumprow">';
    order.forEach((qIdx, pos)=>{
      let cls = 'jbtn';
      if(pos===current) cls+=' current';
      if(answers[qIdx]){
        cls += answers[qIdx].correct ? ' answered-correct':' answered-incorrect';
      }
      html += `<button class="${cls}" data-pos="${pos}">${pos+1}</button>`;
    });
    html += '</div>';
    return html;
  }

  function renderQuiz(){
    const qIdx = order[current];
    const q = DATA[qIdx];
    const s = scoreCount();
    const pct = Math.round(((current)/order.length)*100);
    const answered = answers[qIdx];

    modeBadge.textContent = `Q ${current+1} / ${order.length}`;

    let html = '';
    html += `<div class="statbar">
      <div class="stat">Score <b>${s.correct}</b>/${s.answered}</div>
      <div class="stat">Correct <b style="color:var(--good)">${s.correct}</b></div>
      <div class="stat">Incorrect <b style="color:var(--bad)">${s.incorrect}</b></div>
      <div class="stat">Remaining <b>${order.length - s.answered}</b></div>
    </div>`;
    html += `<div class="progress-outer"><div class="progress-inner" style="width:${Math.round((current/(order.length))*100)}%"></div></div>`;
    html += renderJumpRow();

    html += `<div class="card">
      <div class="qmeta"><span>Question ${current+1} of ${order.length}</span><span>NABARD Grade A · AHP</span></div>
      <div class="qtext">${escapeHtml(q.question)}</div>
      <div class="options" id="optionsWrap">`;

    q.options.forEach((opt, i)=>{
      let cls = 'opt';
      if(answered){
        cls += ' locked';
        if(i===q.correctIndex) cls+=' correct';
        else if(i===answered.selected) cls+=' incorrect';
        else cls+=' dim';
      }
      html += `<button class="${cls}" data-i="${i}" ${answered?'disabled':''}>
        <span class="letter">${LETTERS[i]}</span>
        <span>${escapeHtml(opt)}</span>
      </button>`;
    });

    html += `</div>`;

    if(answered){
      const good = answered.correct;
      html += `<div class="feedback show ${good?'good':'bad'}">
        <span class="tag">${good?'✓ Correct':'✗ Incorrect'}</span>
        ${escapeHtml(q.explanation)}
      </div>`;
    }

    html += `</div>`;

    html += `<div class="navrow" style="justify-content:space-between;">
      <button class="btn secondary" id="prevBtn" ${current===0?'disabled':''}>← Previous</button>
      <div style="display:flex;gap:8px;">
        ${current === order.length-1 ? '<button class="btn" id="finishBtn">Finish &amp; See Results</button>' : `<button class="btn" id="nextBtn" ${answered?'':'disabled'}>Next →</button>`}
      </div>
    </div>`;

    app.innerHTML = html;

    document.querySelectorAll('#optionsWrap .opt').forEach(btn=>{
      btn.onclick = function(){
        if(answers[qIdx]) return;
        const i = parseInt(this.dataset.i,10);
        answers[qIdx] = { selected: i, correct: i === q.correctIndex };
        renderQuiz();
      };
    });
    const prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.onclick = ()=>{ if(current>0){ current--; renderQuiz(); } };
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.onclick = ()=>{ if(current<order.length-1){ current++; renderQuiz(); } };
    const finishBtn = document.getElementById('finishBtn');
    if(finishBtn) finishBtn.onclick = renderResults;

    document.querySelectorAll('.jbtn').forEach(btn=>{
      btn.onclick = function(){ current = parseInt(this.dataset.pos,10); renderQuiz(); };
    });
  }

  function renderResults(){
    const s = scoreCount();
    const total = order.length;
    const pct = total? Math.round((s.correct/total)*100) : 0;
    modeBadge.textContent = 'Results';

    let missed = order.filter(qIdx => answers[qIdx] && !answers[qIdx].correct);
    let unanswered = order.filter(qIdx => !answers[qIdx]);

    let html = `<div class="results">
      <h2>Quiz Complete</h2>
      <div class="scoreRing"><div class="pct">${pct}%</div><div class="lbl">Score</div></div>
      <div class="summarygrid">
        <div class="sbox good"><div class="n">${s.correct}</div><div class="l">Correct</div></div>
        <div class="sbox bad"><div class="n">${s.incorrect}</div><div class="l">Incorrect</div></div>
        <div class="sbox"><div class="n">${unanswered.length}</div><div class="l">Skipped</div></div>
        <div class="sbox"><div class="n">${total}</div><div class="l">Total</div></div>
      </div>
      <div style="text-align:center;margin-bottom:24px;">
        <button class="btn" id="retryBtn">Retake Quiz</button>
        <button class="btn secondary" id="retryMissedBtn" ${missed.length===0?'disabled':''}>Retry Missed Only (${missed.length})</button>
      </div>`;

    if(missed.length>0){
      html += `<h3 style="color:var(--leaf-dark);font-size:1rem;margin-bottom:10px;">Review — Questions You Missed</h3>`;
      missed.forEach(qIdx=>{
        const q = DATA[qIdx];
        const a = answers[qIdx];
        html += `<div class="reviewitem">
          <div class="rq">${escapeHtml(q.question)}</div>
          <div class="ryour">Your answer: ${LETTERS[a.selected]}. ${escapeHtml(q.options[a.selected])}</div>
          <div class="rcorrect">Correct answer: ${LETTERS[q.correctIndex]}. ${escapeHtml(q.options[q.correctIndex])}</div>
          <div class="rexp">${escapeHtml(q.explanation)}</div>
        </div>`;
      });
    } else {
      html += `<p style="text-align:center;font-family:Arial,sans-serif;color:var(--good);">Perfect score on this attempt — no missed questions!</p>`;
    }

    html += `</div>`;
    app.innerHTML = html;

    document.getElementById('retryBtn').onclick = function(){
      current=0; answers={}; renderQuiz();
    };
    document.getElementById('retryMissedBtn').onclick = function(){
      if(missed.length===0) return;
      order = missed.slice();
      current=0; answers={};
      renderQuiz();
    };
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML.replace(/\n/g,'<br>');
  }

  renderSetup();
})();
</script>
</body>
</html>
