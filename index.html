<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Quizzes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px 80px;
      background: radial-gradient(circle at top, #1a1a2e, #0a0a12 60%);
      color: #e8e8ec;
      min-height: 100vh;
    }
    .header { text-align: center; margin-bottom: 36px; }
    h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .subtitle { color: #8b8b96; font-size: 14px; }
    .count {
      display: inline-block;
      background: #1e1e2e;
      border: 1px solid #34344a;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #a78bfa;
      margin-top: 10px;
    }
    a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      margin: 10px 0;
      background: linear-gradient(135deg, #17172488, #1e1e2e88);
      backdrop-filter: blur(10px);
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      text-decoration: none;
      color: #ececf1;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    a:active {
      border-color: #a78bfa;
      background: linear-gradient(135deg, #a78bfa22, #60a5fa22);
      transform: scale(0.98);
    }
    .icon {
      width: 36px; height: 36px;
      min-width: 36px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #a78bfa33, #60a5fa33);
      border-radius: 10px;
      font-size: 16px;
    }
    .arrow { margin-left: auto; color: #52525b; font-size: 18px; }
    #loading { text-align: center; color: #71717a; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 My Quizzes</h1>
    <p class="subtitle">Tap any quiz to start practicing</p>
    <div class="count" id="quizCount">Loading...</div>
  </div>
  <div id="quizList"><p id="loading">Fetching your quizzes...</p></div>

  <script>
    const icons = ['📝','📊','🎯','📖','✅','🧠','⭐','🔖','📌','💡'];
    fetch('https://api.github.com/repos/hijawwad/random-min-qui/contents/')
      .then(res => res.json())
      .then(files => {
        const list = document.getElementById('quizList');
        list.innerHTML = '';
        const htmlFiles = files.filter(f => f.name.endsWith('.html') && f.name !== 'index.html');
        document.getElementById('quizCount').textContent = htmlFiles.length + ' quizzes available';
        if (htmlFiles.length === 0) {
          list.innerHTML = '<p id="loading">No quizzes found yet.</p>';
          return;
        }
        htmlFiles.forEach((file, i) => {
          const link = document.createElement('a');
          link.href = file.name;
          link.innerHTML = <span class="icon">${icons[i % icons.length]}</span><span>${file.name.replace('.html','')}</span><span class="arrow">›</span>;
          list.appendChild(link);
        });
      })
      .catch(() => {
        document.getElementById('quizList').innerHTML = '<p id="loading">Could not load quiz list. Refresh the page.</p>';
      });
  </script>
</body>
</html>
