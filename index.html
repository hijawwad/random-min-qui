<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Quizzes</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; background: #f9f9f9; }
    h1 { text-align: center; color: #222; }
    a { display: block; padding: 16px; margin: 10px 0; background: #fff; 
        border-radius: 10px; text-decoration: none; color: #333; font-size: 17px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    a:active { background: #eee; }
    #loading { text-align: center; color: #888; }
  </style>
</head>
<body>
  <h1>📚 My Quizzes</h1>
  <div id="quizList"><p id="loading">Loading quizzes...</p></div>

  <script>
    fetch('https://api.github.com/repos/hijawwad/random-min-qui/contents/')
      .then(res => res.json())
      .then(files => {
        const list = document.getElementById('quizList');
        list.innerHTML = '';
        const htmlFiles = files.filter(f => f.name.endsWith('.html') && f.name !== 'index.html');
        if (htmlFiles.length === 0) {
          list.innerHTML = '<p>No quizzes found yet.</p>';
          return;
        }
        htmlFiles.forEach(file => {
          const link = document.createElement('a');
          link.href = file.name;
          link.textContent = file.name.replace('.html', '');
          list.appendChild(link);
        });
      })
      .catch(() => {
        document.getElementById('quizList').innerHTML = '<p>Could not load quiz list. Refresh the page.</p>';
      });
  </script>
</body>
</html>
