<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABARD Grade A — Current Affairs Practice Quiz (1st–11th July 2026)</title>
<style>
  :root{
    --navy:#12294a;
    --navy-2:#1c3a63;
    --accent:#0e7c66;
    --accent-2:#0a5c4c;
    --gold:#b8860b;
    --bg:#f4f6f9;
    --card:#ffffff;
    --border:#dde3ea;
    --text:#1c2733;
    --muted:#5b6b7c;
    --green:#1e8a4c;
    --green-bg:#e6f6ec;
    --red:#c0392b;
    --red-bg:#fdecea;
    --amber:#b8860b;
    --amber-bg:#fdf6e3;
    --radius:10px;
    --shadow:0 1px 3px rgba(18,41,74,0.08), 0 1px 2px rgba(18,41,74,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }

  /* HEADER */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color:#fff; padding:16px 20px; border-radius: var(--radius);
    margin-bottom:20px; box-shadow: var(--shadow);
  }
  .topbar h1{ font-size:17px; margin:0; font-weight:600; line-height:1.35;}
  .topbar .sub{ font-size:12px; opacity:0.8; margin-top:3px;}
  .topbar-right{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .badge{
    background: rgba(255,255,255,0.15); padding:4px 10px; border-radius:20px; font-size:12px; white-space:nowrap;
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 18px; border-radius:8px; border:1px solid var(--border);
    background:#fff; color:var(--text); font-size:14px; font-weight:600;
    cursor:pointer; transition: all 0.15s ease; user-select:none;
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent-2); box-shadow: var(--shadow); }
  .btn.primary{ background: var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background: var(--accent-2); border-color:var(--accent-2); color:#fff; }
  .btn.ghost{ background:transparent; border-color:var(--border); }
  .btn.small{ padding:6px 12px; font-size:12.5px; }
  .btn.wide{ width:100%; }
  .btn.danger-outline{ border-color:#e0b3ad; color:var(--red); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* CARD */
  .card{ background:var(--card); border:1px solid var(--border); border-radius: var(--radius); padding:22px; box-shadow: var(--shadow); margin-bottom:16px; }

  /* HOME */
  .home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:8px; }
  @media (max-width:640px){ .home-grid{ grid-template-columns:1fr; } }
  .mode-card{
    background:var(--card); border:1px solid var(--border); border-radius: var(--radius);
    padding:24px 20px; cursor:pointer; transition:all 0.15s ease; text-align:left;
    box-shadow: var(--shadow);
  }
  .mode-card:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 14px rgba(18,41,74,0.12);}
  .mode-card .icon{ font-size:28px; margin-bottom:10px; }
  .mode-card h3{ margin:0 0 6px; font-size:16.5px; color:var(--navy); }
  .mode-card p{ margin:0; font-size:13px; color:var(--muted); line-height:1.5; }
  .home-stats{ display:flex; gap:14px; margin: 18px 0 6px; flex-wrap:wrap; }
  .stat-pill{ background:#eef2f7; border-radius:8px; padding:10px 16px; font-size:13px; color:var(--navy); flex:1; min-width:120px; text-align:center; }
  .stat-pill b{ display:block; font-size:20px; color:var(--accent-2); margin-bottom:2px;}

  /* TOGGLE */
  .toggle-row{ display:flex; align-items:center; gap:10px; margin: 14px 0; font-size:13px; color:var(--muted); flex-wrap:wrap;}
  .toggle-group{ display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .toggle-group button{
    border:none; background:#fff; padding:8px 16px; font-size:13px; cursor:pointer; color:var(--muted); font-weight:600;
  }
  .toggle-group button.active{ background:var(--accent); color:#fff; }

  /* SECTION GRID */
  .section-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; margin-top:14px; }
  .section-tile{
    background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px 16px;
    cursor:pointer; transition:all .15s ease;
  }
  .section-tile:hover{ border-color:var(--accent); box-shadow:var(--shadow); }
  .section-tile .stitle{ font-weight:600; font-size:13.5px; color:var(--navy); margin-bottom:6px; line-height:1.35; }
  .section-tile .scount{ font-size:12px; color:var(--muted); }
  .section-tile .scount b{ color:var(--accent-2); }

  /* QUIZ SCREEN */
  .progress-wrap{ margin-bottom:14px; }
  .progress-bar-bg{ background:#e4e9ef; border-radius:20px; height:8px; overflow:hidden; }
  .progress-bar-fill{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); height:100%; border-radius:20px; transition: width .25s ease; }
  .progress-meta{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:6px; }
  .score-live{ font-weight:700; color:var(--accent-2); }

  .q-meta{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .tag{ font-size:11px; padding:3px 9px; border-radius:20px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; }
  .tag.section-tag{ background:#e8eef7; color:var(--navy-2); }
  .tag.diff-easy{ background:#e6f6ec; color:var(--green); }
  .tag.diff-moderate{ background:#fdf6e3; color:var(--amber); }
  .tag.diff-hard{ background:#fdecea; color:var(--red); }

  .q-text{ font-size:16px; font-weight:600; color:var(--text); margin: 10px 0 18px; line-height:1.55; white-space:pre-line; }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    display:flex; align-items:flex-start; gap:12px;
    border:1.5px solid var(--border); border-radius:9px; padding:12px 14px;
    cursor:pointer; transition: all .12s ease; background:#fff; font-size:14.5px; line-height:1.45;
  }
  .option:hover:not(.disabled){ border-color:var(--accent); background:#f7fbfa; }
  .option .letter{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; background:#eef2f7; color:var(--navy);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px;
  }
  .option.correct{ background:var(--green-bg); border-color:var(--green); }
  .option.correct .letter{ background:var(--green); color:#fff; }
  .option.wrong{ background:var(--red-bg); border-color:var(--red); }
  .option.wrong .letter{ background:var(--red); color:#fff; }
  .option.disabled{ cursor:default; }
  .option.faded{ opacity:0.55; }

  .feedback{
    margin-top:16px; padding:14px 16px; border-radius:9px; font-size:13.5px; line-height:1.55;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct-fb{ background:var(--green-bg); border:1px solid #b7e3c6; color:#155c33; }
  .feedback.wrong-fb{ background:var(--red-bg); border:1px solid #f0c2bc; color:#8a2c22; }
  .feedback.skip-fb{ background:var(--amber-bg); border:1px solid #ecd9a0; color:#7a5c07; }
  .feedback b{ display:block; margin-bottom:3px; }

  .q-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; flex-wrap:wrap; }

  /* RESULTS */
  .score-hero{
    text-align:center; padding:26px 20px; background: linear-gradient(135deg, var(--navy), var(--navy-2));
    border-radius:var(--radius); color:#fff; margin-bottom:18px;
  }
  .score-hero .big{ font-size:42px; font-weight:800; margin:4px 0; }
  .score-hero .sub2{ font-size:13.5px; opacity:0.85; }

  .breakdown-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0; }
  @media (max-width:560px){ .breakdown-grid{ grid-template-columns:1fr; } }
  .breakdown-card{ background:#fff; border:1px solid var(--border); border-radius:9px; padding:14px; text-align:center; }
  .breakdown-card .lbl{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px; font-weight:700;}
  .breakdown-card .val{ font-size:22px; font-weight:800; color:var(--navy); }
  .breakdown-card .subval{ font-size:12px; color:var(--muted); margin-top:2px; }

  .review-item{ border:1px solid var(--border); border-radius:9px; padding:14px 16px; margin-bottom:10px; }
  .review-item .rq{ font-weight:600; font-size:14px; margin-bottom:8px; white-space:pre-line; }
  .review-item .ra-row{ font-size:13px; margin:3px 0; }
  .review-item .ra-row.you-wrong{ color:var(--red); }
  .review-item .ra-row.you-skip{ color:var(--amber); }
  .review-item .ra-row.correct-ans{ color:var(--green); font-weight:600; }
  .review-item .rexp{ font-size:12.5px; color:var(--muted); margin-top:6px; border-top:1px dashed var(--border); padding-top:6px; }
  .review-item .rtags{ display:flex; gap:6px; margin-bottom:8px; }

  .empty-review{ text-align:center; color:var(--muted); padding:30px 0; font-size:14px; }

  .footer-actions{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .footer-actions .btn{ flex:1; min-width:160px; }

  .section-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:10px;}
  .section-title-row h2{ font-size:16px; margin:0; color:var(--navy); }
  .hint-text{ font-size:12.5px; color:var(--muted); margin-top:2px; }

  .back-link{ font-size:13px; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:4px; margin-bottom:10px; }
  .back-link:hover{ color:var(--accent-2); }

  ::selection{ background: #bcdfd4; }
  a{ color: var(--accent-2); }
</style>
</head>

 New Zealand are celebrating how many years of sporting ties in 2026?", "options": ["125 years", "90 years", "75 years", "50 years", "100 years"], "correctLetter": "E", "explanation": "India and New Zealand are celebrating 100 years of sporting ties in 2026.", "pdfOrder": 434}, {"id": 436, "section": "One-liner News", "difficulty": "Moderate", "question": "Māori culture (Māoritanga) is the indigenous heritage of which country?", "options": ["New Zealand", "Fiji", "Australia", "Papua New Guinea", "Samoa"], "correctLetter": "A", "explanation": "Māori culture, or Māoritanga, is the indigenous Polynesian heritage of New Zealand.", "pdfOrder": 435}, {"id": 437, "section": "One-liner News", "difficulty": "Hard", "question": "The Maharashtra government will develop the world's largest water metro network at what estimated cost?", "options": ["Rs 8,200 crore", "Rs 6,066 crore", "Rs 3,750 crore", "Rs 4,500 crore", "Rs 10,000 crore"], "correctLetter": "B", "explanation": "The Maharashtra government will develop the world's largest water metro network at a cost of Rs 6,066 crore.", "pdfOrder": 436}, {"id": 438, "section": "One-liner News", "difficulty": "Hard", "question": "Sourav Ganguly joined the ICC Hall of Fame in 2026, becoming which numbered Indian cricketer to receive this honour?", "options": ["20th Indian cricketer", "8th Indian cricketer", "12th Indian cricketer", "10th Indian cricketer", "15th Indian cricketer"], "correctLetter": "C", "explanation": "Sourav Ganguly became the 12th Indian cricketer to receive the ICC Hall of Fame honour.", "pdfOrder": 437}, {"id": 439, "section": "One-liner News", "difficulty": "Hard", "question": "Consider the following statements:\nI. Tarapur Atomic Power Station Units 1&2, commissioned in 1969, are the world's oldest operating commercial nuclear power reactors.\nII. MECON Limited received Miniratna Category-I status from the Ministry of Steel.\nIII. A PNR for train travel typically consists of 6 alphanumeric digits, same as for f n": "Statement II is incorrect — Sukhna Lake is located in Chandigarh, not Punjab. The rest are correct.", "pdfOrder": 440}], "sectionsOrder": ["ESI, Finance & Business News", "Regulatory Bodies News", "Banking News", "Insurance News", "National", "State", "International News", "MOUs", "Mergers & Acquisitions", "Science & Technology", "Defence", "Indices/Rankings", "Reports", "Awards", "Books & Festivals", "Sports", "Appointments", "Conferences", "Obituaries, Important Days & Person in News", "One-liner News"]};
</script>
<script>
(function(){
"use strict";

var ALL_Q = QUIZ_DATA.questions;
var SECTIONS_ORDER = QUIZ_DATA.sectionsOrder;
var LETTERS = ["A","B","C","D","E"];

// ---------- App State ----------
var state = {
  screen: "home",           // home | quiz | results
  mode: null,                // "full" | "section"
  orderMode: "pdf",          // "pdf" | "shuffled"
  activeSection: null,       // for section mode
  set: [],                   // array of question objects for current run
  idx: 0,                    // current question index
  answers: {},                // qid -> {status: 'correct'|'wrong'|'skipped', chosenLetter: 'A'|null}
  score: 0
};

var root = document.getElementById("app");

// ---------- Helpers ----------
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function countBySection(){
  var m = {};
  SECTIONS_ORDER.forEach(function(s){ m[s]=0; });
  ALL_Q.forEach(function(q){ m[q.section] = (m[q.section]||0)+1; });
  return m;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function diffTagClass(d){
  if(d==="Easy") return "diff-easy";
  if(d==="Hard") return "diff-hard";
  return "diff-moderate";
}

// ---------- Render dispatcher ----------
function render(){
  if(state.screen === "home") renderHome();
  else if(state.screen === "quiz") renderQuiz();
  else if(state.screen === "results") renderResults();
  window.scrollTo({top:0, behavior:"instant"});
}

// ---------- HOME ----------
function renderHome(){
  var secCounts = countBySection();
  var totalQ = ALL_Q.length;

  var html = "";
  html += headerHtml();

  html += '<div class="card">';
  html += '<div class="home-stats">';
  html += '<div class="stat-pill"><b>'+totalQ+'</b>Total Questions</div>';
  html += '<div class="stat-pill"><b>'+SECTIONS_ORDER.length+'</b>Topics Covered</div>';
  html += '<div class="stat-pill"><b>A\u2013E</b>Options per Question</div>';
  html += '</div>';

  html += '<div class="home-grid">';
  html += '<div class="mode-card" id="mode-full">';
  html += '<div class="icon">\uD83D\uDCDD</div>';
  html += '<h3>Full Practice Test</h3>';
  html += '<p>Attempt all '+totalQ+' questions across every section, in document order or shuffled. Best for a complete mock-exam style run.</p>';
  html += '</div>';

  html += '<div class="mode-card" id="mode-section">';
  html += '<div class="icon">\uD83D\uDCDA</div>';
  html += '<h3>Section-wise Revision</h3>';
  html += '<p>Drill a single scheme or topic at a time \u2014 pick from the grid of sections, each showing its question count.</p>';
  html += '</div>';
  html += '</div>'; // home-grid

  html += '</div>'; // card

  root.innerHTML = html;

  document.getElementById("mode-full").onclick = function(){
    state.mode = "full";
    renderFullSetup();
  };
  document.getElementById("mode-section").onclick = function(){
    state.mode = "section";
    renderSectionGrid();
  };
}

function headerHtml(){
  return '<div class="topbar">' +
    '<div><h1>NABARD Grade A \u2014 Current Affairs Practice Quiz</h1>' +
    '<div class="sub">Source: CGB Mentors Compilation, 1st\u201311th July 2026</div></div>' +
    '<div class="topbar-right"><span class="badge">'+ALL_Q.length+' Qs</span></div>' +
    '</div>';
}

// ---------- FULL TEST SETUP (order toggle) ----------
function renderFullSetup(){
  var html = "";
  html += headerHtml();
  html += '<div class="back-link" id="backHome">\u2190 Back to menu</div>';
  html += '<div class="card">';
  html += '<div class="section-title-row"><h2>Full Practice Test</h2></div>';
  html += '<div class="hint-text">Choose question order, then start. All '+ALL_Q.length+' questions will be included.</div>';
  html += '<div class="toggle-row">';
  html += '<span>Order:</span>';
  html += '<div class="toggle-group">';
  html += '<button id="ord-pdf" class="'+(state.orderMode==="pdf"?"active":"")+'">PDF Order</button>';
  html += '<button id="ord-shuf" class="'+(state.orderMode==="shuffled"?"active":"")+'">Shuffled</button>';
  html += '</div></div>';
  html += '<button class="btn primary wide" id="startFull" style="margin-top:14px;">Start Full Practice Test \u2192</button>';
  html += '</div>';
  root.innerHTML = html;

  document.getElementById("backHome").onclick = function(){ state.screen="home"; render(); };
  document.getElementById("ord-pdf").onclick = function(){ state.orderMode="pdf"; renderFullSetup(); };
  document.getElementById("ord-shuf").onclick = function(){ state.orderMode="shuffled"; renderFullSetup(); };
  document.getElementById("startFull").onclick = function(){ startRun(ALL_Q.slice(), "Full Practice Test"); };
}

// ---------- SECTION GRID ----------
function renderSectionGrid(){
  var secCounts = countBySection();
  var html = "";
  html += headerHtml();
  html += '<div class="back-link" id="backHome">\u2190 Back to menu</div>';
  html += '<div class="card">';
  html += '<div class="section-title-row"><h2>Section-wise Revision</h2></div>';
  html += '<div class="hint-text">Tap a topic to drill just those questions.</div>';
  html += '<div class="section-grid">';
  SECTIONS_ORDER.forEach(function(sec, i){
    html += '<div class="section-tile" data-sec="'+i+'">';
    html += '<div class="stitle">'+escapeHtml(sec)+'</div>';
    html += '<div class="scount"><b>'+secCounts[sec]+'</b> questions</div>';
    html += '</div>';
  });
  html += '</div></div>';
  root.innerHTML = html;

  document.getElementById("backHome").onclick = function(){ state.screen="home"; render(); };
  Array.prototype.forEach.call(document.querySelectorAll(".section-tile"), function(tile){
    tile.onclick = function(){
      var sec = SECTIONS_ORDER[parseInt(tile.getAttribute("data-sec"),10)];
      state.activeSection = sec;
      var qs = ALL_Q.filter(function(q){ return q.section === sec; });
      startRun(qs, sec);
    };
  });
}

// ---------- START A RUN ----------
function startRun(questions, label){
  var set = questions.slice();
  if(state.mode === "full" && state.orderMode === "shuffled"){
    set = shuffleArr(set);
  } else {
    // pdf order = sort by pdfOrder
    set.sort(function(a,b){ return a.pdfOrder - b.pdfOrder; });
  }
  state.set = set;
  state.idx = 0;
  state.answers = {};
  state.score = 0;
  state.runLabel = label;
  state.screen = "quiz";
  state.answeredCurrent = false;
  render();
}

// ---------- QUIZ SCREEN ----------
function renderQuiz(){
  var q = state.set[state.idx];
  var total = state.set.length;
  var answeredCount = Object.keys(state.answers).length;
  var progressPct = Math.round((answeredCount/total)*100);

  var html = "";
  html += headerHtml();

  html += '<div class="card">';

  // progress
  html += '<div class="progress-wrap">';
  html += '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+progressPct+'%;"></div></div>';
  html += '<div class="progress-meta"><span>'+state.runLabel+' \u2022 Question '+(state.idx+1)+' of '+total+'</span>';
  html += '<span class="score-live">Score: '+state.score+' / '+answeredCount+'</span></div>';
  html += '</div>';

  html += '<div class="q-meta">';
  html += '<span class="tag section-tag">'+escapeHtml(q.section)+'</span>';
  html += '<span class="tag '+diffTagClass(q.difficulty)+'">'+q.difficulty+'</span>';
  html += '</div>';

  html += '<div class="q-text">'+escapeHtml(q.question)+'</div>';

  html += '<div class="options" id="optionsWrap">';
  q.options.forEach(function(optText, i){
    var letter = LETTERS[i];
    html += '<div class="option" data-letter="'+letter+'" id="opt-'+letter+'">';
    html += '<span class="letter">'+letter+'</span><span class="opt-text">'+escapeHtml(optText)+'</span>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="feedback" id="feedbackBox"></div>';

  html += '<div class="q-actions">';
  html += '<button class="btn ghost" id="skipBtn">Skip \u2192</button>';
  html += '<button class="btn primary" id="nextBtn" style="display:none;">'+(state.idx===total-1?"Finish":"Next Question \u2192")+'</button>';
  html += '</div>';

  html += '</div>'; // card

  root.innerHTML = html;

  // if already answered previously (navigated back is not supported, but guard anyway)
  var existing = state.answers[q.id];
  if(existing){
    lockOptions(q, existing.chosenLetter, existing.status);
  } else {
    Array.prototype.forEach.call(document.querySelectorAll(".option"), function(optEl){
      optEl.onclick = function(){
        selectAnswer(q, optEl.getAttribute("data-letter"));
      };
    });
  }

  document.getElementById("skipBtn").onclick = function(){
    if(state.answers[q.id]) return; // already answered
    state.answers[q.id] = {status:"skipped", chosenLetter:null};
    lockOptions(q, null, "skipped");
  };

  document.getElementById("nextBtn").onclick = function(){
    goNext();
  };
}

function selectAnswer(q, letter){
  if(state.answers[q.id]) return;
  var isCorrect = (letter === q.correctLetter);
  state.answers[q.id] = {status: isCorrect ? "correct":"wrong", chosenLetter: letter};
  if(isCorrect) state.score++;
  lockOptions(q, letter, isCorrect ? "correct":"wrong");
}

function lockOptions(q, chosenLetter, status){
  Array.prototype.forEach.call(document.querySelectorAll(".option"), function(optEl){
    var letter = optEl.getAttribute("data-letter");
    optEl.onclick = null;
    optEl.classList.add("disabled");
    if(letter === q.correctLetter){
      optEl.classList.add("correct");
    } else if(letter === chosenLetter && status === "wrong"){
      optEl.classList.add("wrong");
    } else {
      optEl.classList.add("faded");
    }
  });

  var fb = document.getElementById("feedbackBox");
  fb.classList.add("show");
  if(status === "correct"){
    fb.classList.add("correct-fb");
    fb.innerHTML = "<b>\u2713 Correct!</b>" + escapeHtml(q.explanation);
  } else if(status === "wrong"){
    fb.classList.add("wrong-fb");
    fb.innerHTML = "<b>\u2717 Not quite \u2014 correct answer is " + q.correctLetter + ".</b>" + escapeHtml(q.explanation);
  } else {
    fb.classList.add("skip-fb");
    fb.innerHTML = "<b>Skipped \u2014 correct answer is " + q.correctLetter + ".</b>" + escapeHtml(q.explanation);
  }

  document.getElementById("skipBtn").style.display = "none";
  document.getElementById("nextBtn").style.display = "inline-flex";

  // update live score/progress display without full re-render (cheap partial update)
  var answeredCount = Object.keys(state.answers).length;
  var total = state.set.length;
  var progressPct = Math.round((answeredCount/total)*100);
  var fillEl = document.querySelector(".progress-bar-fill");
  if(fillEl) fillEl.style.width = progressPct + "%";
  var metaEl = document.querySelector(".progress-meta");
  if(metaEl){
    metaEl.innerHTML = '<span>'+state.runLabel+' \u2022 Question '+(state.idx+1)+' of '+total+'</span>' +
      '<span class="score-live">Score: '+state.score+' / '+answeredCount+'</span>';
  }
}

function goNext(){
  if(state.idx < state.set.length - 1){
    state.idx++;
    render();
  } else {
    state.screen = "results";
    render();
  }
}

// ---------- RESULTS ----------
function renderResults(){
  var total = state.set.length;
  var correct = 0, wrong = 0, skipped = 0;
  var diffStats = {Easy:{c:0,t:0}, Moderate:{c:0,t:0}, Hard:{c:0,t:0}};

  state.set.forEach(function(q){
    var a = state.answers[q.id];
    diffStats[q.difficulty].t++;
    if(a && a.status === "correct"){ correct++; diffStats[q.difficulty].c++; }
    else if(a && a.status === "wrong"){ wrong++; }
    else { skipped++; }
  });

  var attempted = correct + wrong;
  var accuracy = attempted > 0 ? Math.round((correct/attempted)*100) : 0;
  var overallPct = total > 0 ? Math.round((correct/total)*100) : 0;

  var html = "";
  html += headerHtml();

  html += '<div class="score-hero">';
  html += '<div class="sub2">'+escapeHtml(state.runLabel)+' \u2014 Result</div>';
  html += '<div class="big">'+correct+' / '+total+'</div>';
  html += '<div class="sub2">Overall '+overallPct+'% \u2022 Accuracy on attempted: '+accuracy+'%</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<div class="section-title-row"><h2>Summary</h2></div>';
  html += '<div class="breakdown-grid">';
  html += '<div class="breakdown-card"><div class="lbl">Correct</div><div class="val" style="color:var(--green)">'+correct+'</div></div>';
  html += '<div class="breakdown-card"><div class="lbl">Wrong</div><div class="val" style="color:var(--red)">'+wrong+'</div></div>';
  html += '<div class="breakdown-card"><div class="lbl">Skipped</div><div class="val" style="color:var(--amber)">'+skipped+'</div></div>';
  html += '</div>';

  html += '<div class="section-title-row" style="margin-top:10px;"><h2>Accuracy by Difficulty</h2></div>';
  html += '<div class="breakdown-grid">';
  ["Easy","Moderate","Hard"].forEach(function(d){
    var s = diffStats[d];
    var pct = s.t>0 ? Math.round((s.c/s.t)*100) : 0;
    html += '<div class="breakdown-card"><div class="lbl">'+d+'</div><div class="val">'+pct+'%</div><div class="subval">'+s.c+' / '+s.t+' correct</div></div>';
  });
  html += '</div>';

  html += '<div class="footer-actions">';
  html += '<button class="btn primary" id="retryBtn">\u21BB Retry Same Set</button>';
  html += '<button class="btn ghost" id="menuBtn">\u2190 Back to Menu</button>';
  html += '</div>';
  html += '</div>'; // card

  // Review list
  html += '<div class="card">';
  html += '<div class="section-title-row"><h2>Review: Missed & Skipped</h2></div>';
  var missedOrSkipped = state.set.filter(function(q){
    var a = state.answers[q.id];
    return !a || a.status !== "correct";
  });
  if(missedOrSkipped.length === 0){
    html += '<div class="empty-review">\uD83C\uDF89 Perfect run \u2014 nothing missed or skipped!</div>';
  } else {
    missedOrSkipped.forEach(function(q){
      var a = state.answers[q.id];
      html += '<div class="review-item">';
      html += '<div class="rtags"><span class="tag section-tag">'+escapeHtml(q.section)+'</span><span class="tag '+diffTagClass(q.difficulty)+'">'+q.difficulty+'</span></div>';
      html += '<div class="rq">'+escapeHtml(q.question)+'</div>';
      if(a && a.status === "wrong"){
        html += '<div class="ra-row you-wrong">Your answer: '+a.chosenLetter+') '+escapeHtml(q.options[LETTERS.indexOf(a.chosenLetter)])+'</div>';
      } else {
        html += '<div class="ra-row you-skip">You skipped this question.</div>';
      }
      html += '<div class="ra-row correct-ans">Correct answer: '+q.correctLetter+') '+escapeHtml(q.options[LETTERS.indexOf(q.correctLetter)])+'</div>';
      html += '<div class="rexp">'+escapeHtml(q.explanation)+'</div>';
      html += '</div>';
    });
  }
  html += '</div>';

  root.innerHTML = html;

  document.getElementById("retryBtn").onclick = function(){
    startRun(state.set, state.runLabel);
  };
  document.getElementById("menuBtn").onclick = function(){
    state.screen = "home";
    render();
  };
}

// ---------- INIT ----------
render();

})();

</script>
</body>
</html>
