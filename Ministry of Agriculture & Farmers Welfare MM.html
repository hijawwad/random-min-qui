<script>
// ===================== State =====================
let state = {
  mode: null,          // 'full' | 'section' | 'sprint'
  order: 'pdf',        // 'pdf' | 'shuffled'
  pool: [],            // array of question objects for current run
  idx: 0,
  answers: {},         // qid -> {chosen: idx|null, skipped: bool, correct: bool}
  scheme: null
};

const SPRINT_TYPES = ['combo', 'scenario', 'figurepair'];

function schemeOrder() {
  const seen = [];
  QUESTIONS.forEach(q => { if (!seen.includes(q.s)) seen.push(q.s); });
  return seen;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(id) {
  ['screen-home', 'screen-section', 'screen-quiz', 'screen-end'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
  window.scrollTo(0, 0);
}

// ===================== Home Screen =====================
function renderHome() {
  const el = document.getElementById('screen-home');
  const total = QUESTIONS.length;
  const sprintCount = QUESTIONS.filter(q => SPRINT_TYPES.includes(q.t)).length;

  el.innerHTML = `
    <div class="card">
      <p style="margin:0;color:var(--text-dim);font-size:0.88rem;">
        ${total} questions covering every scheme in the compiled document. Choose a mode to begin.
      </p>
    </div>
    <div class="mode-grid">
      <div class="mode-card" id="mode-full">
        <h3>Full Practice Test</h3>
        <p>All ${total} questions, in document order or shuffled. The complete exam simulation.</p>
        <span class="tag">${total} questions</span>
      </div>
      <div class="mode-card" id="mode-section">
        <h3>Section-wise Revision</h3>
        <p>Drill one scheme at a time. Pick a scheme and work through just its questions.</p>
        <span class="tag">${schemeOrder().length} schemes</span>
      </div>
      <div class="mode-card" id="mode-sprint">
        <h3>Schemes-Only Sprint</h3>
        <p>Just the deep scheme-mechanics questions — statement combos, scenarios, and figure-pairs. No bare recall.</p>
        <span class="tag">${sprintCount} questions</span>
      </div>
    </div>
  `;
  document.getElementById('mode-full').onclick = () => startFullSetup();
  document.getElementById('mode-section').onclick = () => renderSectionPicker();
  document.getElementById('mode-sprint').onclick = () => startSprint();
}

// ===================== Full Practice Setup =====================
function startFullSetup() {
  const el = document.getElementById('screen-home');
  el.innerHTML = `
    <span class="top-link" id="back-home">&larr; Back to menu</span>
    <div class="card">
      <h2 style="margin-top:0;font-size:1.15rem;">Full Practice Test</h2>
      <p style="color:var(--text-dim);font-size:0.88rem;">Choose the question order.</p>
      <div class="toggle-row">
        <div class="toggle-btn active" id="opt-pdf">PDF Order</div>
        <div class="toggle-btn" id="opt-shuffled">Shuffled</div>
      </div>
      <button class="btn" id="start-full-btn">Start Test</button>
    </div>
  `;
  let order = 'pdf';
  document.getElementById('opt-pdf').onclick = () => {
    order = 'pdf';
    document.getElementById('opt-pdf').classList.add('active');
    document.getElementById('opt-shuffled').classList.remove('active');
  };
  document.getElementById('opt-shuffled').onclick = () => {
    order = 'shuffled';
    document.getElementById('opt-shuffled').classList.add('active');
    document.getElementById('opt-pdf').classList.remove('active');
  };
  document.getElementById('start-full-btn').onclick = () => {
    let pool = QUESTIONS.slice();
    if (order === 'shuffled') pool = shuffle(pool);
    launchQuiz(pool, 'full', null);
  };
  document.getElementById('back-home').onclick = renderHome;
}

// ===================== Section Picker =====================
function renderSectionPicker() {
  const el = document.getElementById('screen-home');
  const schemes = schemeOrder();
  el.innerHTML = `
    <span class="top-link" id="back-home">&larr; Back to menu</span>
    <div class="card">
      <h2 style="margin-top:0;font-size:1.15rem;">Section-wise Revision</h2>
      <p style="color:var(--text-dim);font-size:0.88rem;">Tap a scheme to drill just its questions.</p>
      <div class="section-grid">
        ${schemes.map(s => {
          const count = QUESTIONS.filter(q => q.s === s).length;
          return `<div class="section-item" data-scheme="${escapeAttr(s)}">
            <span class="name">${s}</span>
            <span class="count">${count} Qs</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
  document.getElementById('back-home').onclick = renderHome;
  el.querySelectorAll('.section-item').forEach(item => {
    item.onclick = () => {
      const s = item.getAttribute('data-scheme');
      const pool = QUESTIONS.filter(q => q.s === s);
      launchQuiz(pool, 'section', s);
    };
  });
}

function escapeAttr(s) {
  return s.replace(/"/g, '&quot;');
}

// ===================== Sprint =====================
function startSprint() {
  const pool = shuffle(QUESTIONS.filter(q => SPRINT_TYPES.includes(q.t)));
  launchQuiz(pool, 'sprint', null);
}

// ===================== Quiz Runner =====================
function launchQuiz(pool, mode, scheme) {
  state = { mode, order: 'pdf', pool, idx: 0, answers: {}, scheme };
  show('screen-quiz');
  renderQuestion();
}

function currentQ() {
  return state.pool[state.idx];
}

function renderQuestion() {
  const el = document.getElementById('screen-quiz');
  const q = currentQ();
  const total = state.pool.length;
  const answered = Object.keys(state.answers).length;
  const pct = Math.round(((state.idx) / total) * 100);
  const already = state.answers[q.id];

  const letters = ['A', 'B', 'C', 'D', 'E'];

  let statementsHtml = '';
  if (q.st && q.st.length) {
    statementsHtml = `<ul class="statements">${q.st.map((s, i) => `<li><span class="num">${i + 1}.</span>${s}</li>`).join('')}</ul>`;
  }
  let instructionHtml = q.ins ? `<p class="instruction">${q.ins}</p>` : '';

  el.innerHTML = `
    <div class="quiz-header">
      <span>${modeLabel()} &middot; Question ${state.idx + 1} / ${total}</span>
      <span>Score: ${scoreSoFar()} / ${answered}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <span class="scheme-pill">${q.s}</span><span class="diff-pill">${q.d}</span>
      ${instructionHtml}
      ${statementsHtml}
      <p class="stem">${q.q}</p>
      <div class="options" id="options-wrap">
        ${q.o.map((opt, i) => `
          <div class="option" data-idx="${i}">
            <span class="letter">${letters[i]}</span>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
      <div id="feedback-wrap"></div>
    </div>
    <div class="qnav">
      <div class="left-btns">
        <button class="btn ghost" id="skip-btn">Skip</button>
      </div>
      <div class="right-btns">
        <button class="btn secondary" id="prev-btn" ${state.idx === 0 ? 'disabled' : ''}>&larr; Prev</button>
        <button class="btn" id="next-btn" ${already ? '' : 'disabled'}>${state.idx === total - 1 ? 'Finish' : 'Next \u2192'}</button>
      </div>
    </div>
  `;

  if (already) {
    revealAnswer(already.chosen, already.skipped);
  } else {
    el.querySelectorAll('.option').forEach(optEl => {
      optEl.onclick = () => selectOption(parseInt(optEl.getAttribute('data-idx')));
    });
  }

  document.getElementById('skip-btn').onclick = () => {
    if (state.answers[q.id]) return;
    state.answers[q.id] = { chosen: null, skipped: true, correct: false };
    revealAnswer(null, true);
    document.getElementById('next-btn').disabled = false;
  };
  document.getElementById('prev-btn').onclick = () => {
    if (state.idx > 0) { state.idx--; renderQuestion(); }
  };
  document.getElementById('next-btn').onclick = () => {
    if (state.idx < total - 1) { state.idx++; renderQuestion(); }
    else renderEnd();
  };
}

function modeLabel() {
  if (state.mode === 'full') return 'Full Practice Test';
  if (state.mode === 'sprint') return 'Schemes-Only Sprint';
  if (state.mode === 'section') return state.scheme;
  return '';
}

function scoreSoFar() {
  return Object.values(state.answers).filter(a => a.correct).length;
}

function selectOption(idx) {
  const q = currentQ();
  if (state.answers[q.id]) return;
  const correct = idx === q.c;
  state.answers[q.id] = { chosen: idx, skipped: false, correct };
  revealAnswer(idx, false);
  document.getElementById('next-btn').disabled = false;
}

function revealAnswer(chosenIdx, wasSkipped) {
  const q = currentQ();
  const letters = ['A', 'B', 'C', 'D', 'E'];
  const optsEl = document.querySelectorAll('#options-wrap .option');
  optsEl.forEach((optEl, i) => {
    optEl.classList.add('disabled');
    if (i === q.c) optEl.classList.add('correct');
    else if (i === chosenIdx) optEl.classList.add('wrong');
    else optEl.classList.add('faded');
    optEl.onclick = null;
  });
  const fb = document.getElementById('feedback-wrap');
  let cls, headline;
  if (wasSkipped) {
    cls = 'skip'; headline = `Skipped — correct answer: <b>${letters[q.c]}</b>`;
  } else if (chosenIdx === q.c) {
    cls = 'correct'; headline = `Correct! <b>${letters[q.c]}</b>`;
  } else {
    cls = 'wrong'; headline = `Incorrect — correct answer: <b>${letters[q.c]}</b>`;
  }
  fb.innerHTML = `<div class="feedback ${cls}">${headline}<br>${q.e}</div>`;
}

// ===================== End Screen =====================
function renderEnd() {
  show('screen-end');
  const el = document.getElementById('screen-end');
  const total = state.pool.length;
  const answeredList = state.pool.map(q => state.answers[q.id] || { chosen: null, skipped: true, correct: false });
  const correctCount = answeredList.filter(a => a.correct).length;
  const skippedCount = answeredList.filter(a => a.skipped).length;
  const wrongCount = total - correctCount - skippedCount;
  const pct = total ? Math.round((correctCount / total) * 100) : 0;

  const diffs = ['Easy', 'Moderate', 'Hard'];
  const diffStats = diffs.map(d => {
    const idxs = state.pool.map((q, i) => ({ q, i })).filter(x => x.q.d === d);
    const attempted = idxs.length;
    const got = idxs.filter(x => (state.answers[x.q.id] || {}).correct).length;
    return { d, attempted, got };
  });

  const missedOrSkipped = state.pool
    .map((q, i) => ({ q, a: state.answers[q.id] || { chosen: null, skipped: true, correct: false } }))
    .filter(x => !x.a.correct);

  const letters = ['A', 'B', 'C', 'D', 'E'];

  el.innerHTML = `
    <div class="card">
      <div class="score-hero">
        <p class="big">${correctCount} / ${total}</p>
        <p class="sub">${pct}% accuracy &middot; ${modeLabel()}</p>
      </div>
      <div class="diff-breakdown">
        ${diffStats.map(s => `
          <div class="diff-box">
            <div class="label">${s.d}</div>
            <div class="val">${s.got}/${s.attempted}</div>
          </div>
        `).join('')}
      </div>
      <p style="color:var(--text-dim);font-size:0.85rem;text-align:center;">
        ${wrongCount} incorrect &middot; ${skippedCount} skipped
      </p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" id="retry-btn">Retry Same Set</button>
        <button class="btn secondary" id="menu-btn">Back to Menu</button>
      </div>
    </div>

    ${missedOrSkipped.length ? `
      <h2 style="font-size:1.05rem;margin:22px 0 10px;">Review — Missed &amp; Skipped</h2>
      ${missedOrSkipped.map(x => `
        <div class="review-item">
          <span class="rtag ${x.a.skipped ? 'skip2' : 'miss'}">${x.a.skipped ? 'SKIPPED' : 'MISSED'}</span>
          <span class="scheme-pill">${x.q.s}</span>
          <p class="stem2">${x.q.q}</p>
          <div class="ans-line">Correct answer: <b>${letters[x.q.c]}</b> — ${x.q.o[x.q.c]}${x.a.skipped ? '' : ` &nbsp;|&nbsp; You chose: <b>${letters[x.a.chosen]}</b>`}</div>
          <div class="exp2">${x.q.e}</div>
        </div>
      `).join('')}
    ` : `<p style="text-align:center;color:var(--text-dim);margin-top:20px;">Perfect run — nothing missed or skipped.</p>`}
  `;

  document.getElementById('retry-btn').onclick = () => {
    launchQuiz(state.pool.slice(), state.mode, state.scheme);
  };
  document.getElementById('menu-btn').onclick = () => {
    show('screen-home');
    renderHome();
  };
}

// ===================== Init =====================
show('screen-home');
renderHome();

</script>
</body>
</html>
