<html lang="en">
<head>

<title>NABARD Grade A | Cropping Patterns &amp; Cropping Systems — Practice Quiz</title>
<style>
:root{
  --navy:#0b2f4a;
  --navy-deep:#081f33;
  --green:#0f7a52;
  --green-deep:#0a5c3d;
  --amber:#c98a1f;
  --amber-light:#f2b53c;
  --paper:#f7f5ef;
  --paper-card:#ffffff;
  --ink:#1c2b33;
  --ink-soft:#5b6b73;
  --line:#e2ded2;
  --red:#b13a2e;
  --red-bg:#fdecea;
  --green-bg:#e9f6ef;
  --shadow: 0 6px 20px rgba(11,47,74,0.08);
  --radius: 14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Georgia','Iowan Old Style', 'Times New Roman', serif;
  background:
    radial-gradient(circle at 10% 0%, rgba(15,122,82,0.05), transparent 40%),
    radial-gradient(circle at 90% 10%, rgba(201,138,31,0.06), transparent 45%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app-font{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;}
#root{max-width:900px;margin:0 auto;padding:22px 16px 60px;}

.brandbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;background:linear-gradient(120deg,var(--navy-deep),var(--navy) 60%,#0e3a58);
  border-radius:16px;color:#f4efe1;margin-bottom:22px;box-shadow:var(--shadow);
}
.brandbar .brand-left{display:flex;align-items:center;gap:12px;}
.brand-badge{
  width:40px;height:40px;border-radius:10px;background:linear-gradient(145deg,var(--amber-light),var(--amber));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy-deep);font-family:'Segoe UI',sans-serif;font-size:16px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35);
}
.brandbar h1{font-size:16.5px;margin:0;font-weight:700;letter-spacing:.2px;font-family:'Segoe UI',sans-serif;}
.brandbar p{margin:2px 0 0;font-size:12px;color:#c9d6de;font-family:'Segoe UI',sans-serif;}
.pill{font-family:'Segoe UI',sans-serif;font-size:11px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);padding:5px 10px;border-radius:20px;color:#f2e9d4;}

.card{
  background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px;
}
.hidden{display:none !important;}

/* HOME */
.home-title{font-family:'Segoe UI',sans-serif;font-size:22px;font-weight:800;color:var(--navy-deep);margin:6px 0 4px;}
.home-sub{font-family:'Segoe UI',sans-serif;font-size:13.5px;color:var(--ink-soft);margin-bottom:22px;line-height:1.5;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px;}
@media(max-width:640px){.mode-grid{grid-template-columns:1fr;}}
.mode-card{
  border-radius:14px;padding:20px;cursor:pointer;border:1.5px solid var(--line);
  background:linear-gradient(160deg,#ffffff,#faf8f2);transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  font-family:'Segoe UI',sans-serif;
}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(11,47,74,0.12);border-color:var(--green);}
.mode-icon{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;margin-bottom:12px;
}
.mode-icon.full{background:#e9f6ef;color:var(--green-deep);}
.mode-icon.sect{background:#fdf1de;color:var(--amber);}
.mode-card h3{margin:0 0 6px;font-size:16px;color:var(--navy-deep);}
.mode-card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.stat-strip{
  margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;font-family:'Segoe UI',sans-serif;
}
.stat-chip{
  background:var(--navy-deep);color:#f2e9d4;font-size:11.5px;padding:7px 12px;border-radius:20px;
  display:flex;align-items:center;gap:6px;
}
.stat-chip b{color:var(--amber-light);}

/* toggle */
.toggle-row{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-family:'Segoe UI',sans-serif;font-size:13px;color:var(--ink-soft);}
.toggle-switch{
  display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;
}
.toggle-opt{padding:7px 14px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-family:'Segoe UI',sans-serif;transition:.15s;}
.toggle-opt.active{background:var(--green-deep);color:#fff;}

.btn{
  font-family:'Segoe UI',sans-serif;border:none;cursor:pointer;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:600;
  transition:transform .1s ease, box-shadow .1s ease, opacity .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(120deg,var(--green-deep),var(--green));color:#fff;box-shadow:0 4px 12px rgba(15,122,82,0.28);}
.btn-primary:hover{box-shadow:0 6px 16px rgba(15,122,82,0.35);}
.btn-secondary{background:#fff;color:var(--navy-deep);border:1.5px solid var(--line);}
.btn-secondary:hover{border-color:var(--navy);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px dashed var(--line);}
.btn-amber{background:linear-gradient(120deg,var(--amber),var(--amber-light));color:#3a2705;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* section grid */
.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
@media(max-width:640px){.section-grid{grid-template-columns:1fr;}}
.section-tile{
  border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:#fff;
  font-family:'Segoe UI',sans-serif;transition:.15s;
}
.section-tile:hover{border-color:var(--amber);background:#fffaf0;transform:translateY(-2px);}
.section-tile h4{margin:0 0 4px;font-size:13.5px;color:var(--navy-deep);line-height:1.35;}
.section-tile span{font-size:11.5px;color:var(--ink-soft);}
.count-badge{
  display:inline-block;margin-top:6px;background:var(--green-bg);color:var(--green-deep);font-size:11px;
  padding:2px 8px;border-radius:20px;font-weight:700;
}

/* QUIZ SCREEN */
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:'Segoe UI',sans-serif;}
.qmeta{font-size:12px;color:var(--ink-soft);}
.qmeta b{color:var(--navy-deep);}
.score-box{
  font-family:'Segoe UI',sans-serif;background:var(--navy-deep);color:#f4efe1;padding:6px 14px;border-radius:10px;font-size:13px;font-weight:700;
}
.progress-outer{height:8px;background:#eee7d6;border-radius:6px;overflow:hidden;margin-bottom:18px;}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--green-deep),var(--green));border-radius:6px;transition:width .3s ease;}

.diff-tag{
  font-family:'Segoe UI',sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:3px 9px;border-radius:20px;display:inline-block;
}
.diff-Easy{background:#e9f6ef;color:var(--green-deep);}
.diff-Moderate{background:#fdf1de;color:#8a5a12;}
.diff-Hard{background:var(--red-bg);color:var(--red);}
.type-tag{
  font-family:'Segoe UI',sans-serif;font-size:10.5px;color:var(--ink-soft);background:#f0eee5;padding:3px 9px;border-radius:20px;margin-left:6px;
}

.question-text{
  font-size:17px;line-height:1.55;color:var(--ink);margin:14px 0 18px;white-space:pre-wrap;font-weight:500;
}
.options{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;cursor:pointer;background:#fff;font-family:'Segoe UI',sans-serif;font-size:14px;line-height:1.5;
  transition:.12s;
}
.opt:hover:not(.locked){border-color:var(--navy);background:#f9fbfc;}
.opt .letter{
  flex:0 0 26px;height:26px;border-radius:50%;background:#eef0ea;color:var(--navy-deep);font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;
}
.opt.correct{background:var(--green-bg);border-color:var(--green);}
.opt.correct .letter{background:var(--green-deep);color:#fff;}
.opt.wrong{background:var(--red-bg);border-color:var(--red);}
.opt.wrong .letter{background:var(--red);color:#fff;}
.opt.locked{cursor:default;}
.opt.dim{opacity:.55;}

.explain-box{
  margin-top:16px;padding:14px 16px;border-radius:12px;background:#fbf9f2;border:1px solid var(--line);
  font-family:'Segoe UI',sans-serif;font-size:13px;color:var(--ink-soft);line-height:1.55;
}
.explain-box b{color:var(--navy-deep);}

.qfooter{display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap;gap:10px;}

/* RESULTS */
.result-hero{
  text-align:center;padding:26px 10px 10px;
}
.result-score{font-size:46px;font-weight:800;color:var(--navy-deep);font-family:'Segoe UI',sans-serif;}
.result-score span{font-size:20px;color:var(--ink-soft);font-weight:500;}
.result-sub{font-family:'Segoe UI',sans-serif;font-size:13px;color:var(--ink-soft);margin-top:4px;}
.diff-breakdown{display:flex;gap:12px;justify-content:center;margin:22px 0;flex-wrap:wrap;}
.diff-block{
  font-family:'Segoe UI',sans-serif;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 18px;min-width:100px;
}
.diff-block .num{font-size:20px;font-weight:800;color:var(--navy-deep);}
.diff-block .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}

.review-list{margin-top:10px;}
.review-item{
  border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-family:'Segoe UI',sans-serif;
}
.review-item .rq{font-size:13.5px;color:var(--ink);white-space:pre-wrap;line-height:1.5;margin-bottom:8px;}
.review-tag{font-size:10.5px;padding:2px 8px;border-radius:20px;margin-right:6px;font-weight:700;}
.tag-wrong{background:var(--red-bg);color:var(--red);}
.tag-skip{background:#fdf1de;color:#8a5a12;}
.review-answers{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.review-answers b{color:var(--navy-deep);}

.section-title{font-family:'Segoe UI',sans-serif;font-weight:700;color:var(--navy-deep);font-size:16px;margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';width:5px;height:16px;background:var(--amber);border-radius:3px;display:inline-block;}

.topbar-mini{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-family:'Segoe UI',sans-serif;}
.back-link{font-size:12.5px;color:var(--navy);cursor:pointer;text-decoration:none;font-weight:600;}
.back-link:hover{text-decoration:underline;}

footer.credit{
  text-align:center;font-family:'Segoe UI',sans-serif;font-size:11px;color:#9aa4a9;margin-top:30px;
}
</style>
</head>

// ---------- State ----------
let state = {
  mode: null,          // 'full' | 'section'
  order: 'pdf',         // 'pdf' | 'shuffled'
  sectionName: null,
  pool: [],             // active question ids in play order
  idx: 0,
  answers: {},           // qid -> {selected, correct, skipped}
  score: 0

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function sectionCount(name){
  return QUESTIONS.filter(q=>q.section===name).length;
}

// ---------- Render: SECTION PICK GRID ----------
function renderSectionPick(){
  hideAll();
  const el = document.getElementById('screen-sectionpick');
  el.classList.remove('hidden');
  let tiles = SECTIONS.map(s=>{
    const c = sectionCount(s);
    return `<div class="section-tile" data-sec="${escapeAttr(s)}">
      <h4>${s}</h4>
      <span class="count-badge">${c} question${c===1?'':'s'}</span>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="app-font">
      <div class="topbar-mini">
        <a class="back-link" id="backHome">&larr; Back to menu</a>
      </div>
      <div class="home-title">Section-wise Revision</div>
      <div class="home-sub">Tap a topic to drill only those questions.</div>
      <div class="section-grid">${tiles}</div>
    </div>
  `;
  document.getElementById('backHome').onclick = renderHome;
  el.querySelectorAll('.section-tile').forEach(t=>{
    t.onclick = ()=>{
      const sec = t.getAttribute('data-sec');
      const ids = QUESTIONS.filter(q=>q.section===sec).map(q=>q.id);
      startQuiz('section', ids, sec);
    };
  });
}

function escapeAttr(s){ return s.replace(/"/g,'&quot;'); }
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- Quiz flow ----------
function startQuiz(mode, ids, sectionName){
  state.mode = mode;
  state.sectionName = sectionName;
  state.pool = ids;
  state.idx = 0;
  state.answers = {};
  state.score = 0;
  renderQuiz();
}

function currentQ(){
  const id = state.pool[state.idx];
  return QUESTIONS.find(q=>q.id===id);
}

function renderQuiz(){

  const el = document.getElementById('screen-quiz');
  el.classList.remove('hidden');

      if(L===q.correct_letter) cls += ' correct';
      else if(L===already.selected) cls += ' wrong';
      else cls += ' dim';
    }
    return `<div class="${cls}" data-letter="${L}">
      <div class="letter">${L}</div>
      <div>${escapeHtml(txt)}</div>
    </div>`;
  }).join('');

  let explainHtml = '';
  if(already){
    explainHtml = `<div class="explain-box"><b>${already.skipped? 'Skipped — correct answer: '+q.correct_letter : (already.correct? 'Correct!' : 'Not quite — correct answer: '+q.correct_letter)}.</b><br>${escapeHtml(q.exp)}</div>`;
  }

  el.innerHTML = `
    <div class="app-font">
      <div class="quiz-header">
        <div class="qmeta">
          ${state.mode==='section' ? `<b>${state.sectionName}</b> &middot; ` : ''}Question <b>${state.idx+1}</b> of <b>${total}</b>
        </div>
        <div class="score-box">Score: ${state.score} / ${answered}</div>
      </div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
      <div>
        <span class="diff-tag diff-${q.difficulty}">${q.difficulty}</span>
        <span class="type-tag">${q.section}</span>
      </div>
      <div class="question-text">${escapeHtml(q.q)}</div>
      <div class="options">${optsHtml}</div>
      ${explainHtml}
      <div class="qfooter">
        <div>
          <button class="btn btn-secondary" id="btnMenu">Back to Menu</button>
        </div>
        <div class="btn-row" style="margin-top:0">
          ${!already ? '<button class="btn btn-ghost" id="btnSkip">Skip &rarr;</button>' : ''}
          <button class="btn btn-primary" id="btnNext" ${already?'':'disabled'}>${state.idx+1===total ? 'Finish Quiz' : 'Next Question &rarr;'}</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnMenu').onclick = renderHome;

  if(!already){
    el.querySelectorAll('.opt').forEach(o=>{
      o.onclick = ()=>{
        const sel = o.getAttribute('data-letter');
        const correct = sel === q.correct_letter;
        state.answers[q.id] = {selected: sel, correct: correct, skipped:false};
        if(correct) state.score++;
        renderQuiz();
      };
    });
    const skipBtn = document.getElementById('btnSkip');
    if(skipBtn) skipBtn.onclick = ()=>{
      state.answers[q.id] = {selected:null, correct:false, skipped:true};
      renderQuiz();
    };
  } else {
    document.getElementById('btnNext').onclick = ()=>{
      if(state.idx+1 === total){
        renderResults();
      } else {
        state.idx++;
        renderQuiz();
      }
    };
  }
}

// ---------- Results ----------
function renderResults(){
  hideAll();
  const el = document.getElementById('screen-results');
  el.classList.remove('hidden');
  const total = state.pool.length;
  const answeredIds = state.pool.filter(id=>state.answers[id] && !state.answers[id].skipped);
  const skippedIds = state.pool.filter(id=>state.answers[id] && state.answers[id].skipped);
  const correctCount = state.pool.filter(id=>state.answers[id] && state.answers[id].correct).length;
  const pct = total ? Math.round(correctCount/total*100) : 0;

  const diffs = ['Easy','Moderate','Hard'];
  const diffStats = diffs.map(d=>{
    const idsInDiff = state.pool.filter(id=>QUESTIONS.find(q=>q.id===id).difficulty===d);
    const correctInDiff = idsInDiff.filter(id=>state.answers[id] && state.answers[id].correct).length;
    return {d, total: idsInDiff.length, correct: correctInDiff};
  });

  const missedIds = state.pool.filter(id=>{
    const a = state.answers[id];
    return a && !a.correct; // includes wrong + skipped
  });

  let reviewHtml = missedIds.length===0 ? '<p style="font-family:Segoe UI,sans-serif;color:var(--ink-soft);font-size:13px;">Nothing missed — clean sweep!</p>' :
    missedIds.map(id=>{
      const q = QUESTIONS.find(qq=>qq.id===id);
      const a = state.answers[id];
      const tag = a.skipped ? '<span class="review-tag tag-skip">SKIPPED</span>' : '<span class="review-tag tag-wrong">INCORRECT</span>';
      const yourAns = a.skipped ? '—' : (a.selected + '. ' + q.options[a.selected]);
      return `<div class="review-item">
        <div>${tag}<span class="diff-tag diff-${q.difficulty}" style="margin-left:4px;">${q.difficulty}</span></div>
        <div class="rq">${escapeHtml(q.q)}</div>
        <div class="review-answers">
          ${a.skipped ? '' : '<div><b>Your answer:</b> '+escapeHtml(yourAns)+'</div>'}
          <div><b>Correct answer:</b> ${q.correct_letter}. ${escapeHtml(q.options[q.correct_letter])}</div>
          <div style="margin-top:4px;">${escapeHtml(q.exp)}</div>
        </div>
      </div>`;
    }).join('');

  el.innerHTML = `
    <div class="app-font">
      <div class="result-hero">
        <div class="result-score">${correctCount}<span> / ${total}</span></div>
        <div class="result-sub">${pct}% accuracy ${state.mode==='section' ? '&middot; '+state.sectionName : '&middot; Full Practice Test ('+(state.order==='pdf'?'PDF Order':'Shuffled')+')'}</div>
      </div>
      <div class="diff-breakdown">
        ${diffStats.map(s=>`<div class="diff-block"><div class="num">${s.total? Math.round(s.correct/s.total*100):0}%</div><div class="lbl">${s.d} (${s.correct}/${s.total})</div></div>`).join('')}
        <div class="diff-block"><div class="num">${skippedIds.length}</div><div class="lbl">Skipped</div></div>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" id="btnRetry">Retry Same Set</button>
        <button class="btn btn-secondary" id="btnMenu2">Back to Menu</button>
      </div>
      <div class="section-title">Review — Missed &amp; Skipped (${missedIds.length})</div>
      <div class="review-list">${reviewHtml}</div>
    </div>
  `;
  document.getElementById('btnRetry').onclick = ()=>{
    let ids = state.pool.slice();
    if(state.mode==='full' && state.order==='shuffled') ids = shuffleArr(state.pool.slice());
    startQuiz(state.mode, ids, state.sectionName);
  };
  document.getElementById('btnMenu2').onclick = renderHome;
}

function hideAll(){
  ['screen-home','screen-sectionpick','screen-quiz','screen-results'].forEach(id=>{
    document.getElementById(id).classList.add('hidden');
  });
}

// init
document.getElementById('qcountpill').textContent = QUESTIONS.length + ' Questions';
renderHome();
</script>
</body>
</html>
