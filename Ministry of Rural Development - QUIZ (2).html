<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NABARD Grade A Practice Quiz - Ministry of Rural Development</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #ffffff;
    --accent: #1e3a8a;
    --accent2: #2563eb;
    --correct: #15803d;
    --correct-bg: #dcfce7;
    --wrong: #b91c1c;
    --wrong-bg: #fee2e2;
    --neutral-bg: #f1f5f9;
    --text: #1e293b;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f1720 0%, #1e293b 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 12px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .header {
    color: white;
    text-align: center;
    margin-bottom: 18px;
  }
  .header h1 { font-size: 1.35rem; margin: 0 0 4px 0; font-weight: 700;}
  .header p { margin: 0; color: #cbd5e1; font-size: 0.85rem; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 14px;
    color: white;
    font-size: 0.85rem;
    flex-wrap: wrap;
    gap: 8px;
  }
  .progressbar {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    margin: 0 14px;
    overflow: hidden;
    min-width: 120px;
  }
  .progressfill {
    height: 100%;
    background: linear-gradient(90deg,#38bdf8,#2563eb);
    transition: width 0.3s ease;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 22px 22px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .section-tag {
    display: inline-block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent2);
    background: #eff6ff;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .qtype-tag {
    display: inline-block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #92400e;
    background: #fef3c7;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
    margin-left: 6px;
    font-weight: 600;
  }
  .stem {
    white-space: pre-line;
    font-size: 1rem;
    line-height: 1.55;
    margin: 6px 0 18px 0;
    font-weight: 500;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    text-align: left;
    border: 1.5px solid #e2e8f0;
    background: var(--neutral-bg);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.92rem;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .option:hover:not(.locked) { border-color: var(--accent2); background: #eaf2ff; }
  .option .letter {
    font-weight: 700;
    color: var(--accent2);
    min-width: 20px;
  }
  .option.correct { background: var(--correct-bg); border-color: var(--correct); }
  .option.correct .letter { color: var(--correct); }
  .option.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
  .option.wrong .letter { color: var(--wrong); }
  .option.locked { cursor: default; }
  .feedback {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .feedback.correct { background: var(--correct-bg); color: var(--correct); }
  .feedback.wrong { background: var(--wrong-bg); color: var(--wrong); }
  .nextbtn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent2);
    color: white;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .nextbtn:hover { background: var(--accent); }
  .startscreen, .endscreen {
    background: var(--card);
    border-radius: 14px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .startscreen h2, .endscreen h2 { margin-top: 0; }
  .bigbtn {
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    background: var(--accent2);
    color: white;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 14px;
  }
  .bigbtn:hover { background: var(--accent); }
  .scoreCircle {
    width: 130px; height: 130px;
    border-radius: 50%;
    border: 8px solid var(--accent2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    margin: 10px auto 20px;
  }
  .scoreCircle .num { font-size: 2rem; font-weight: 800; color: var(--accent2); }
  .scoreCircle .den { font-size: 0.8rem; color: var(--muted); }
  .statgrid {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin: 18px 0;
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat .val { font-size: 1.3rem; font-weight: 700; }
  .stat .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
  .reviewlist { text-align: left; margin-top: 24px; }
  .reviewitem {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: #fafafa;
  }
  .reviewitem .stem { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; white-space: pre-line;}
  .reviewitem .yourans { color: var(--wrong); font-size: 0.85rem; margin-bottom: 4px; }
  .reviewitem .correctans { color: var(--correct); font-size: 0.85rem; }
  .reviewitem .sectiontag { font-size: 0.7rem; color: var(--accent2); font-weight: 600; margin-bottom: 6px; display:block;}
  .footer-note { text-align:center; color:#94a3b8; font-size:0.75rem; margin-top:16px;}
  .restartsmall {
    background: transparent;
    border: 1.5px solid var(--accent2);
    color: var(--accent2);
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>NABARD Grade A Practice Quiz</h1>
    <p>Ministry of Rural Development — Schemes & Programmes</p>
  </div>

  <div id="app"></div>

  <div class="footer-note" id="footerNote"></div>
</div>

<script>
const QUESTIONS = [{"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements about the VB-G RAM G Act, 2025:\n1. It became effective from July 1, 2026.\n2. The Central share for FY 2026-27 is ₹95,692.31 crore.\n3. Including State contributions, the total programme outlay is expected to exceed ₹2 lakh crore.\n4. The Act increases guaranteed employment from 100 to 125 days.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "None of the above", "2, 3 and 4 only", "1, 2, 3 and 4", "1, 2 and 4 only"], "correct": 4}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements regarding the rationale for the VB-G RAM G Act, 2025:\n1. Rural poverty declined from 27.1% in 2011-12 to 5.3% in 2022-23 as per World Bank estimates.\n2. Women's participation under MGNREGA rose from 48% to 58.15% between FY 2013-14 and FY 2025-26.\n3. The Act aligns rural employment with the vision of Viksit Bharat 2047.\n4. The reform proceeds on the premise that MGNREGA's open-ended demand-driven design remains fully aligned with today's rural realities.\nWhich of the above statements are correct?", "options": ["1, 2 and 3 only", "1 only", "1 and 2 only", "2 and 4 only", "1, 2, 3 and 4"], "correct": 0}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "direct", "stem": "What is the guiding principle of the VB-G RAM G Act, 2025?", "options": ["Sabka Saath Sabka Vikas", "Rozgar Bhi, Samman Bhi", "Antyodaya se Samriddhi", "Atmanirbhar Gramin Bharat", "Ghar Ghar Rozgar"], "correct": 1}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "trap", "stem": "Regarding the statutory guarantees under the VB-G RAM G Act, 2025:\n1. Unemployment allowance must be paid if work is not provided within 15 days.\n2. The allowance is at least one-fourth of the notified wage rate for the first 30 days of the financial year.\n3. For the remaining period, it is at least one-half of the notified wage rate.\n4. States can notify an agricultural pause of up to 90 days in a financial year.\nWhich of the above statements is/are NOT correct?", "options": ["3 only", "4 only", "1 only", "1 and 4 only", "2 only"], "correct": 1}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements on the digital governance mandate of the VB-G RAM G Act, 2025:\n1. Bhu-Aadhaar (ULPIN) is a 14-digit unique land parcel identification number.\n2. Face-Auth Attendance is mandatory for mobile-based attendance to eliminate ghost workers.\n3. Gram Sabhas must upload video evidence of social audits every month under Real-time Social Audit.\n4. All these fall under the Act's Digital-First Governance mandate.\nWhich of the above statements are correct?", "options": ["1, 2 and 4 only", "1 and 2 only", "1, 3 and 4 only", "All four", "None"], "correct": 0}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements about funding under the VB-G RAM G Act, 2025:\n1. The Centre-State cost-sharing ratio is 60:40 for general states.\n2. It is 90:10 for North-Eastern and Himalayan States.\n3. Union Territories without legislatures receive 100% Central funding.\n4. The administrative ceiling has been increased from 6% to 10%.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "2 and 3 only", "1, 2, 3 and 4", "1, 2 and 3 only", "3 and 4 only"], "correct": 3}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "direct", "stem": "Under the VB-G RAM G Act, 2025, what is the rate of compensation for delayed wage payment?", "options": ["0.05% of unpaid wages per day after the 16th day from muster roll closure", "0.5% of unpaid wages per day after the 15th day", "No compensation is provided", "1% per week after 15 days", "0.1% per day from day one"], "correct": 0}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements on women's participation and worker welfare under the VB-G RAM G Act, 2025:\n1. At worksites with 3 or more children below age 5, a woman worker must be appointed for childcare.\n2. Such a woman worker receives the prescribed wage rate.\n3. Daily allowance during hospitalisation equals half the wage rate.\n4. Ex-gratia assistance in cases of death/permanent disability is provided under PMSBY.\nWhich of the above statements are correct?", "options": ["2 and 3 only", "All four", "2, 3 and 4 only", "1, 3 and 4 only", "1, 2 and 3 only"], "correct": 2}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Which of the following statements is/are correct regarding the administrative structure under the VB-G RAM G Act, 2025?\n1. The Viksit Bharat Gramin Council operates at the National Level, chaired by the PM.\n2. The District Development Commissioner (DDC) is the same officer as the DM/DC.\n3. At the Gram Panchayat level, the 'Gram Rozgar-cum-Ajeevika Sahayak' is the primary facilitator.", "options": ["1 and 3 only", "2 and 3 only", "1 and 2 only", "1 only", "All three"], "correct": 0}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "trap", "stem": "Which of the following is NOT one of the Four Priority Thematic Areas under the VB-G RAM G Act, 2025?", "options": ["Core Rural Infrastructure", "Works to mitigate extreme weather events", "Water security and water-related works", "Urban slum redevelopment works", "Livelihood-Related Infrastructure"], "correct": 3}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "direct", "stem": "What was the increase in guaranteed days of unskilled manual work per financial year under the VB-G RAM G Act, 2025?", "options": ["125 to 150 days", "No change", "90 to 100 days", "100 to 125 days", "100 to 150 days"], "correct": 3}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements about the 'Great Integration' under the VB-G RAM G Act, 2025:\n1. It marks a transition from 'Survival-based employment' to 'Prosperity-based livelihoods.'\n2. It integrates the demand-driven employment of MGNREGA with the entrepreneurial framework of DAY-NRLM.\n3. Its vision is to ensure every rural household moves above the 'Livelihood Threshold' by 2047.\n4. It replaces DAY-NRLM entirely with a new livelihoods body.\nWhich of the above statements are correct?", "options": ["3 only", "2, 3 and 4 only", "1, 2 and 3 only", "1 and 2 only", "All four"], "correct": 2}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "direct", "stem": "What is the estimated total programme outlay of the VB-G RAM G Act (including States' contribution) for FY 2026-27?", "options": ["₹83,977 crore", "₹95,692.31 crore", "More than ₹1.51 lakh crore", "₹3.06 lakh crore", "₹70,125 crore"], "correct": 2}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements on worker safety and social security under the VB-G RAM G Act, 2025:\n1. Free medical treatment is guaranteed for workplace accidents.\n2. Hospitalisation support includes accommodation, medicines, and treatment.\n3. Ex-gratia assistance in case of death is provided under Ayushman Bharat.\nWhich of the above statements are correct?", "options": ["3 only", "1 and 2 only", "1 only", "2 only", "1, 2 and 3"], "correct": 1}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "trap", "stem": "Which of the following statements about the VB-G RAM G Act, 2025 is NOT correct?", "options": ["It is a statutory guarantee consolidating employment and livelihood", "It increases the administrative ceiling from 6% to 9%", "It mandates face-authentication for worker attendance", "It became effective on July 1, 2026", "It reduces the number of guaranteed workdays from 125 to 100"], "correct": 4}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements:\n1. States can notify an aggregate period of up to 60 days in a financial year during which the employment guarantee under the VB-G RAM G Act does not apply.\n2. This pause is intended to ensure labour availability during peak sowing and harvesting seasons.\n3. This provision applies uniformly across all States regardless of any State notification.\nWhich of the above statements are correct?", "options": ["1 only", "2 and 3 only", "1 and 2 only", "None", "All three"], "correct": 2}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "direct", "stem": "Under the VB-G RAM G Act, 2025, which body is chaired by the Prime Minister at the national level?", "options": ["Mission Antyodaya Council", "National Management Support Unit", "Viksit Bharat Gramin Council", "National Rural Infrastructure Development Agency", "DAY-NRLM National Mission Management Unit"], "correct": 2}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements:\n1. The cost-sharing pattern under the VB-G RAM G Act is 60:40 between Centre and States for general states.\n2. It is 90:10 for North-Eastern and Himalayan States.\n3. Union Territories without legislatures get 100% Central funding.\n4. The Administrative Ceiling was increased from 6% to 9% to allow for better technical staffing and AI-driven monitoring at the block level.\nHow many of the above statements are correct?", "options": ["Only one", "None", "All four", "Only two", "Only three"], "correct": 2}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "direct", "stem": "Wages under the VB-G RAM G Act must be paid weekly or within a maximum timeline of:", "options": ["60 days", "10 days", "30 days", "7 days", "15 days"], "correct": 4}, {"section": "Viksit Bharat - Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025", "type": "statement", "stem": "Consider the following statements about the rationale for the 2025 reform:\n1. MGNREGA's Aadhaar-Based Payment System was widely adopted.\n2. Electronic wage payments became near-universal under MGNREGA.\n3. Rural India's rising incomes, expanded connectivity, and diversified livelihoods necessitated modernising the employment framework.\nWhich of the above statements are correct?", "options": ["2 and 3 only", "None", "1 only", "1, 2 and 3", "1 and 2 only"], "correct": 3}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "direct", "stem": "PMAY-G was launched on:", "options": ["April 1, 2014", "April 1, 2016", "December 25, 2000", "June 2011", "August 15, 1995"], "correct": 1}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following statements about PMAY-G targets:\n1. The original target was 2.95 crore houses, largely achieved by 2024.\n2. Budget 2024-25 announced an additional 1 crore houses over the next 5 years.\n3. The total outlay for the new phase is approximately ₹3.06 lakh crore.\n4. PMAY-G 2.0 targets completion by 2028-29.\nWhich of the above statements are correct?", "options": ["1, 2 and 3 only", "All four", "1, 3 and 4 only", "1 and 4 only", "2, 3 and 4 only"], "correct": 2}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following statements regarding the updated PMAY-G eligibility criteria (late 2025):\n1. The monthly income ceiling has been raised from ₹10,000 to ₹15,000.\n2. Ownership of a two-wheeler, fishing boat, landline, or refrigerator no longer leads to automatic disqualification.\n3. Households owning a pucca house anywhere in India remain eligible.\nWhich of the above statements are correct?", "options": ["1 only", "1, 2 and 3", "2 only", "1 and 2 only", "3 only"], "correct": 3}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "direct", "stem": "What is the minimum unit size prescribed under PMAY-G, including a dedicated area for hygienic cooking?", "options": ["25 sq. mt.", "22 sq. mt.", "20 sq. mt.", "35 sq. mt.", "30 sq. mt."], "correct": 0}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following statements on the automatic exclusion criteria under PMAY-G:\n1. Households with a Kisan Credit Card of ₹50,000 or above are excluded.\n2. Households owning 2.5 acres or more of irrigated land are excluded.\n3. Households owning 3 acres or more of unirrigated land are excluded.\n4. Households with any member as a government employee are excluded.\nWhich of the above statements are correct?", "options": ["1, 2 and 4 only", "All four", "1, 2 and 3 only", "1 and 4 only", "2, 3 and 4 only"], "correct": 0}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "direct", "stem": "Which survey is used to identify PMAY-G beneficiaries left out of SECC 2011?", "options": ["Awaas+ survey", "Mission Antyodaya survey", "PIP survey", "NFHS survey", "Kaushal Panjee"], "correct": 0}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following statements:\n1. PMAY-G mandates a minimum 60% target for SC/ST beneficiaries.\n2. Widows and unmarried women are priority groups.\n3. Manual scavengers and Primitive Tribal Groups fall under automatic inclusion criteria.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "1 only", "None", "2 and 3 only", "1, 2 and 3"], "correct": 4}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "trap", "stem": "Which of the following is NOT among the automatic exclusion criteria under PMAY-G?", "options": ["Paying income tax", "Motorised three/four-wheeler ownership", "Household with a member as government employee", "Any family member earning more than ₹15,000 per month", "Ownership of a fishing boat"], "correct": 4}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following deprivation parameters used to rank PMAY-G beneficiaries:\n1. No adult member between 16-59 years.\n2. Female-headed household with no adult male member between 16-59 years.\n3. No literate adult above 30 years.\n4. Landless households mainly dependent on manual casual labour.\nWhich of the above statements are correct?", "options": ["1, 2 and 4 only", "1, 2 and 3 only", "All four", "2, 3 and 4 only", "3 only"], "correct": 0}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "direct", "stem": "Under PMAY-G, what is the minimum number of instalments in which the unit assistance must be paid to a beneficiary?", "options": ["3", "4", "There is no minimum", "5", "2"], "correct": 0}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following statements about the unit assistance under PMAY-G:\n1. Plain areas receive ₹1.20 lakh with a 60:40 Centre-State funding ratio.\n2. Hilly/Difficult/NER/IAP areas receive ₹1.30 lakh with a 90:10 funding ratio.\n3. UTs without legislature receive ₹1.20 lakh with 100% Central funding.\n4. All regions receive the same unit assistance of ₹1.25 lakh.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "2 and 3 only", "All four", "1, 2 and 3 only", "4 only"], "correct": 3}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "direct", "stem": "What percentage of the annual PMAY-G allocation is earmarked for construction of new houses (including 2% administrative expenditure)?", "options": ["100%", "98%", "90%", "95%", "92%"], "correct": 3}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Of the 2% administrative funds under PMAY-G:\n1. 0.3% is retained by the Centre.\n2. 1.7% is released to States/UTs.\n3. The remaining 5% of the total allocation is retained centrally as a reserve fund for Special Projects.\nWhich of the above statements are correct?", "options": ["1 only", "1, 2 and 3", "None", "2 and 3 only", "1 and 2 only"], "correct": 1}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following statements about PMAY-G's convergence with other schemes:\n1. ₹12,000 is provided for toilet construction through Swachh Bharat Mission (Gramin).\n2. 90 days (Plains) or 95 days (Hills) of unskilled labour assistance is available via MGNREGA/VB-G RAM G.\n3. LPG connection is provided via the Saubhagya scheme.\n4. Electricity connection is provided via PM Ujjwala Yojana.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "2, 3 and 4 only", "All four", "3 and 4 only", "1, 2 and 3 only"], "correct": 0}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "direct", "stem": "What is the maximum optional institutional loan a PMAY-G beneficiary can avail?", "options": ["₹60,000", "₹1,00,000", "₹70,000", "₹50,000", "₹1,20,000"], "correct": 2}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following statements about PMAY-G's technology and monitoring framework:\n1. AwaasSoft is used for data entry, target setting and fund transfer.\n2. The Awaas+ App is used for geo-tagging houses at stages like foundation, plinth, lintel, roof, and completion.\n3. Funds are transferred to beneficiaries via cheques rather than DBT.\nWhich of the above statements are correct?", "options": ["2 only", "1, 2 and 3", "1 and 2 only", "3 only", "1 only"], "correct": 2}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "direct", "stem": "Under PMAY-G's inspection framework, what percentage of houses do block-level officers inspect?", "options": ["2%", "20%", "5%", "15%", "10%"], "correct": 4}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following statements:\n1. Climate-resilient house designs under PMAY-G were developed in collaboration with UNDP and IITs.\n2. This initiative is called 'Pahal (Prakriti Hunar Lokvidya).'\n3. It focuses on using imported materials to increase durability.\nWhich of the above statements are correct?", "options": ["2 only", "None", "1 only", "1 and 2 only", "1, 2 and 3"], "correct": 3}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "trap", "stem": "Which of the following statements about PMAY-G is NOT correct?", "options": ["It was restructured from the Indira Awaas Yojana", "Beneficiaries are entitled to only 30 person-days of unskilled labour from MGNREGS", "Selection is based on housing deprivation parameters in SECC 2011", "National level implementation support is via the National Management Support Unit (NMSU)", "Its vision is 'Housing for All'"], "correct": 1}, {"section": "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)", "type": "statement", "stem": "Consider the following statements:\n1. Households under the 'compulsory inclusion' category in SECC are given highest priority under PMAY-G.\n2. Automatically included households can be ranked below other households in the same priority group if their deprivation score is lower.\n3. Priority within subgroups uses cumulative deprivation scores with equal weight to each parameter.\nWhich of the above statements are correct?", "options": ["2 and 3 only", "1 and 3 only", "All three", "1 only", "1 and 2 only"], "correct": 1}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "DAY-NRLM was originally launched in June 2011 as:", "options": ["Aajeevika Skills", "SVEP", "NRLM", "SGSY", "MKSP"], "correct": 2}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements about the history of DAY-NRLM:\n1. The Swarnajayanti Gram Swarozgar Yojana (SGSY) was launched in 1999.\n2. SGSY promoted self-employment through Self Help Groups.\n3. NRLM was renamed DAY-NRLM in 2015.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "1, 2 and 3", "1 only", "None", "2 and 3 only"], "correct": 1}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements about the tiered institutional structure under DAY-NRLM:\n1. A standard SHG has 10-20 women members.\n2. Special SHGs (in difficult areas, with disabled persons, or in remote tribal areas) may have a minimum of 5 members.\n3. A Village Organization (VO) comprises 10-15 SHGs at the village level.\n4. A Cluster Level Federation (CLF) comprises 5-10 VOs at the district level.\nWhich of the above statements are correct?", "options": ["2, 3 and 4 only", "4 only", "1 and 2 only", "1, 2 and 3 only", "All four"], "correct": 3}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "Under DAY-NRLM, the Revolving Fund grant given to eligible SHGs ranges between:", "options": ["₹20,000 – ₹30,000", "₹30,000 – ₹50,000", "₹10,000 – ₹20,000", "₹1,00,000 – ₹1,50,000", "₹50,000 – ₹75,000"], "correct": 0}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements:\n1. The Revolving Fund is given to SHGs that have been active for 3-6 months.\n2. SHGs must follow 'Panchasutra' to be eligible for the Revolving Fund.\n3. A capital subsidy is also sanctioned to eligible SHGs under DAY-NRLM in addition to the Revolving Fund.\nWhich of the above statements are correct?", "options": ["1 only", "1 and 2 only", "1, 2 and 3", "3 only", "2 only"], "correct": 1}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "What is the maximum Community Investment Fund (CIF) provided to SHGs through Federations under DAY-NRLM?", "options": ["₹2 lakh", "₹1.5 lakh", "₹2.50 lakh", "₹3 lakh", "₹1 lakh"], "correct": 2}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements on the Interest Subvention Scheme for Women SHGs under DAY-NRLM:\n1. For loans up to ₹3 lakh, banks provide credit at a concessional rate of 7% per annum.\n2. SHGs that repay on time get an additional 3% subvention, reducing the effective rate to 4% per annum.\n3. For loans above ₹3 lakh and up to ₹5 lakh, banks lend at 1-year MCLR/EBLR or 10% per annum, whichever is higher.\n4. This scheme applies only to Women SHGs in rural areas.\nWhich of the above statements are correct?", "options": ["1 and 3 only", "1, 2 and 3 only", "2, 3 and 4 only", "All four", "1, 2 and 4 only"], "correct": 4}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "What is the minimum active period required for an SHG to avail loans under DAY-NRLM (as per books of accounts)?", "options": ["9 months", "12 months", "6 months", "3 months", "24 months"], "correct": 2}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements:\n1. Previously defunct SHGs are eligible for credit if revived and continuously active for at least 3 months.\n2. SHGs must qualify per NABARD grading norms to avail loans.\n3. Federations cannot undertake grading even once established.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "3 only", "1, 2 and 3", "2 only", "1 only"], "correct": 0}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "What is the minimum Cash Credit Limit (CCL) sanctioned to SHGs, and for what period?", "options": ["₹3 lakh for 2 years", "₹10 lakh for 3 years", "₹6 lakh for 3 years", "₹6 lakh for 5 years", "₹20 lakh for 3 years"], "correct": 2}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements on the Drawing Power (DP) structure for CCL under DAY-NRLM:\n1. In the first year, DP is 6 times of existing corpus or minimum ₹1.5 lakh, whichever is higher.\n2. In the second year, DP is 8 times of corpus or minimum ₹3 lakh, whichever is higher.\n3. In the third year, DP is a minimum of ₹6 lakh based on the Micro Credit Plan.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "None", "2 and 3 only", "1, 2 and 3", "1 only"], "correct": 3}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "What is the collateral-free loan limit enhanced to, per SHG, under DAY-NRLM?", "options": ["₹30 lakh", "₹10 lakh", "₹15 lakh", "₹25 lakh", "₹20 lakh"], "correct": 4}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements about credit facilities for individual SHG members under DAY-NRLM:\n1. Banks may extend loans up to ₹10 lakh to individual members of well-performing, mature women SHGs.\n2. Eligible SHGs must be more than 2 years old and have availed at least one bank loan.\n3. One woman member per SHG may avail a loan up to ₹2 lakh under the MUDRA Scheme.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "1 only", "2 only", "1, 2 and 3", "3 only"], "correct": 0}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "What minimum overdraft facility must banks provide to every woman SHG member holding a PMJDY account, as per IBA guidelines?", "options": ["₹15,000", "₹5,000", "₹2,000", "₹10,000", "₹20,000"], "correct": 1}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements on the utilisation of loans for income-generating purposes under DAY-NRLM:\n1. At least 50% of loans above ₹1 lakh must be used for income-generating productive purposes.\n2. At least 75% of loans above ₹4 lakh must be so utilised.\n3. At least 85% of loans above ₹6 lakh must be so utilised.\nWhich of the above statements are correct?", "options": ["None", "2 and 3 only", "1 and 2 only", "1, 2 and 3", "1 only"], "correct": 3}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "Under the Term Loan (TL) repayment schedule of DAY-NRLM, the 'Second Dose' is repayable within:", "options": ["12-24 months", "36-48 months", "48-60 months", "60-84 months", "24-36 months"], "correct": 1}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements about security and margin norms for DAY-NRLM loans:\n1. For loans up to ₹10 lakh, no collateral and no margin is required.\n2. For loans above ₹10 lakh up to ₹20 lakh, the entire loan is eligible for coverage under CGFMU.\n3. Banks may insist on deposits while sanctioning loans up to ₹10 lakh.\nWhich of the above statements are correct?", "options": ["3 only", "2 only", "1 and 2 only", "1, 2 and 3", "1 only"], "correct": 2}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "What is the maximum margin banks may obtain on loans above ₹10 lakh and up to ₹20 lakh under DAY-NRLM?", "options": ["20% of the total loan", "No margin permitted", "10% of the amount exceeding ₹10 lakh", "5% of the amount exceeding ₹10 lakh", "15% of the total loan"], "correct": 2}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements on DAY-NRLM's Universal Social Mobilization targets:\n1. 50% of beneficiaries should come from SC/ST communities.\n2. 15% should be minorities.\n3. 5% should be persons with disabilities.\nWhich of the above statements are correct?", "options": ["1 only", "1, 2 and 3", "2 only", "1 and 2 only", "3 only"], "correct": 3}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "The Participatory Identification of Poor (PIP) list under DAY-NRLM is vetted by the Gram Sabha and approved by:", "options": ["The District Collector", "The Block Development Officer", "The Gram Panchayat", "NABARD", "The State Rural Livelihoods Mission"], "correct": 2}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements about the PIP process under DAY-NRLM:\n1. It uses social mapping, well-being categorisation, and deprivation indicators.\n2. Up to 30% of SHG membership may consist of households marginally above the poverty line.\n3. Households with at least one SECC deprivation criterion are covered only after PIP is conducted.\nWhich of the above statements are correct?", "options": ["None", "1 only", "1, 2 and 3", "2 only", "1 and 2 only"], "correct": 4}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "What is the DAY-NRLM funding pattern for North-Eastern States including Sikkim?", "options": ["75:25", "60:40", "100% Central", "50:50", "90:10"], "correct": 4}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements about the Lakhpati Didi initiative:\n1. The original target was to enable 3 crore women SHG members to earn at least ₹1 lakh annual income.\n2. This target has been achieved.\n3. The new target is 6 crore women by 2029.\nWhich of the above statements are correct?", "options": ["2 and 3 only", "1 and 2 only", "None", "1, 2 and 3", "1 only"], "correct": 3}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "Under the Namo Drone Didi scheme, how many Women SHGs are targeted to receive agricultural drones?", "options": ["15,000", "20,000", "10,000", "5,000", "25,000"], "correct": 0}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements about the Namo Drone Didi scheme:\n1. The Central Government provides an 80% subsidy for the cost of the drone.\n2. The maximum subsidy amount is ₹8 lakh.\n3. The scheme is meant only for spraying pesticides and not fertilizers.\nWhich of the above statements are correct?", "options": ["1, 2 and 3", "1 and 2 only", "1 only", "2 only", "3 only"], "correct": 1}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "MKSP (Mahila Kisan Sashaktikaran Pariyojana) was launched as a sub-component under DAY-NRLM in:", "options": ["2010-11", "2016-17", "2014-15", "2011-12", "2005-06"], "correct": 0}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements about Community Resource Persons (CRPs) under DAY-NRLM and its sub-components:\n1. Krishi Sakhis and Pashu Sakhis are CRPs under MKSP.\n2. Van Sakhis are also mentioned as CRPs under MKSP.\n3. Bank Sakhis and Bima Sakhis are types of CRPs implementing the mission's interventions more broadly.\nWhich of the above statements are correct?", "options": ["1, 2 and 3", "None", "2 and 3 only", "1 and 2 only", "1 only"], "correct": 0}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "trap", "stem": "Which of the following statements about DAY-NRLM is NOT correct?", "options": ["No capital subsidy is sanctioned to any SHG under the scheme", "It aims to reduce poverty via self-employment and skilled wage employment", "DDU-GKY is the placement-linked skilling arm converged with the VB-G RAM G Act, 2025", "The Revolving Fund is routed directly by NABARD, bypassing federations", "SVEP supports rural poor to set up small non-farm enterprises"], "correct": 3}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "direct", "stem": "What is the funding pattern for DAY-NRLM for general states (Centre:State)?", "options": ["100:0", "75:25", "50:50", "60:40", "70:30"], "correct": 3}, {"section": "Deendayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY-NRLM)", "type": "statement", "stem": "Consider the following statements:\n1. SVEP supports rural poor in setting up small non-farm enterprises.\n2. Farm Value Chain Intervention under DAY-NRLM focuses only on non-timber forest products.\n3. DAY-NRLM promotes sustainable agriculture, NTFP, and livestock in intensive blocks through states' Annual Action Plans.\nWhich of the above statements are correct?", "options": ["1 and 3 only", "2 and 3 only", "None", "All three", "1 only"], "correct": 0}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "direct", "stem": "PMGSY was launched on:", "options": ["June 2011", "December 25, 2000", "August 15, 1995", "September 25, 2014", "April 1, 2014"], "correct": 1}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "statement", "stem": "Consider the following statements:\n1. PMGSY-III was originally scheduled to end in 2025.\n2. The Union Cabinet approved its extension till March 2028 with an increased outlay.\n3. The revised outlay is ₹83,977 crore, up from ₹80,250 crore.\nWhich of the above statements are correct?", "options": ["1 and 2 only", "1 only", "2 and 3 only", "None", "1, 2 and 3"], "correct": 4}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "direct", "stem": "Under PMGSY, the extended timeline for completion of bridges in Hilly Areas is:", "options": ["March 2028", "March 2027", "March 2029", "December 2026", "March 2030"], "correct": 2}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "statement", "stem": "Consider the following statements about the evolution of PMGSY:\n1. PMGSY-I (2000) focused on new connectivity based on Census 2001.\n2. PMGSY-II (2013) focused on upgradation of existing roads, targeting 50,000 km.\n3. RCPLWEA (2016) targeted strategic roads in 44 Left Wing Extremism affected districts.\n4. PMGSY-III (2019) targets 1,25,000 km covering markets, schools, and hospitals.\nHow many of the above statements are correct?", "options": ["Only one", "None", "Only two", "Only three", "All four"], "correct": 4}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "direct", "stem": "What does RCPLWEA stand for?", "options": ["Road Construction Project for Landless Workers in Extreme Areas", "Regional Connectivity Programme for Livelihood and Welfare Enhancement Areas", "Rural Connectivity Project for Left Wing Extremism Affected areas", "Rural Coordination Programme for Left Wing Emergency Assistance", "Road Connectivity Project for Left Wing Extremism Affected areas"], "correct": 4}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "statement", "stem": "Consider dhan Mantri Gram Sadak Yojana (PMGSY)", "type": "statement", "stem": "Consider the following statements:\n1. States must distribute at least 80% of their allocation for road length required for connecting Unconnected Habitations.\n2. Up to 20% may be used for road length requiring upgradation.\n3. Urban roads are eligible for funding under PMGSY provided they meet population thresholds.\nWhich of the above statements are correct?", "options": ["1, 2 and 3", "2 only", "1 only", "3 only", "1 and 2 only"], "correct": 4}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "direct", "stem": "What is the name of the online software used for monitoring progress, accounting, and tenders under PMGSY?", "options": ["SAMBAL", "OMMAS", "NGDRS", "Kaushal Panjee", "AwaasSoft"], "correct": 1}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "statement", "stem": "Consider the following statements about green technology under PMGSY:\n1. Over 1.24 lakh km of roads have been built using green technologies.\n2. Materials used include waste plastic, fly ash, slag, cold mix, and geosynthetics.\n3. Full Depth Reclamation (FDR) recycles existing road materials, reducing the need for new aggregates.\nWhich of the above statements are correct?", "options": ["None", "1, 2 and 3", "2 and 3 only", "1 and 2 only", "1 only"], "correct": 1}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "direct", "stem": "Which tier of PMGSY's quality system involves unannounced surprise inspections?", "options": ["Tier 4", "Tier 1", "Tier 2", "None conduct surprise inspections", "Tier 3"], "correct": 4}, {"section": "Pradhan Mantri Gram Sadak Yojana (PMGSY)", "type": "statement", "stem": "Consider the following statements:\n1. Tier 1 involves internal checks by the executing agency.\n2. Tier 2 involves periodic inspections by independent State Quality Monitors (SQMs).\n3. Tier 3 involves inspections by District Quality Monitors.\nWhich of the above statements are cor let current = 0;
let score = 0;
let answers = [];
let locked = false;

const app = document.getElementById('app');
const footerNote = document.getElementById('footerNote');

function letterFor(i){ return ["A","B","C","D","E"][i]; }

function renderStart(){
  footerNote.textContent = "";
  app.innerHTML = `
    <div class="startscreen">
      <h2>Ready to test yourself?</h2>
      <p style="color:#475569;">${QUESTIONS.length} questions covering all 10 MoRD schemes — VB-G RAM G Act, PMAY-G, DAY-NRLM, PMGSY, DDU-GKY, Mission Antyodaya, NSAP, DILRMP, SVAMITVA and RGSA.</p>
      <p style="color:#475569; font-size:0.85rem;">Multi-statement questions, direct fact questions, and "NOT correct" trap questions — in actual NABARD exam style. Click an option to get instant feedback.</p>
      <button class="bigbtn" id="startBtn">Start Quiz</button>
    </div>
  `;
  document.getElementById('startBtn').onclick = () => {
    current = 0;
    score = 0;
    answers = [];
    renderQuestion();
  };
}

function renderTopbar(){
  const pct = Math.round((current)/QUESTIONS.length*100);
  return `
    <div class="topbar">
      <div>Q ${current+1} / ${QUESTIONS.length}</div>
      <div class="progressbar"><div class="progressfill" style="width:${pct}%;"></div></div>
      <div>Score: ${score} / ${answers.length}</div>
    </div>
  `;
}

function renderQuestion(){
  locked = false;
  const q = QUESTIONS[current];
  const typeLabel = q.type === 'statement' ? 'Multi-Statement' : (q.type === 'trap' ? 'NOT Correct' : 'Direct Fact');
  let optionsHtml = q.options.map((opt, idx) => `
    <button class="option" data-idx="${idx}">
      <span class="letter">${letterFor(idx)}.</span>
      <span>${opt}</span>
    </button>
  `).join('');

  app.innerHTML = `
    ${renderTopbar()}
    <div class="card">
      <span class="section-tag">${q.section}</span>
      <span class="qtype-tag">${typeLabel}</span>
      <div class="stem">${q.stem}</div>
      <div class="options" id="optionsBox">${optionsHtml}</div>
      <div id="feedbackBox"></div>
      <button class="nextbtn" id="nextBtn" style="display:none;">Next Question →</button>
    </div>
  `;

  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => selectOption(parseInt(btn.dataset.idx)));
  });
}

function selectOption(idx){
  if (locked) return;
  locked = true;
  const q = QUESTIONS[current];
  const isCorrect = idx === q.correct;
  if (isCorrect) score++;
  answers.push({ qIndex: current, selectedIdx: idx, correctIdx: q.correct, isCorrect });

  document.querySelectorAll('.option').forEach((btn, i) => {
    btn.classList.add('locked');
    if (i === q.correct) btn.classList.add('correct');
    if (i === idx && !isCorrect) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedbackBox');
  fb.innerHTML = isCorrect
    ? `<div class="feedback correct">✓ Correct!</div>`
    : `<div class="feedback wrong">✗ Incorrect — correct answer is ${letterFor(q.correct)}.</div>`;

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = (current === QUESTIONS.length - 1) ? 'See Final Results →' : 'Next Question →';
  nextBtn.onclick = () => {
    if (current === QUESTIONS.length - 1){
      renderEnd();
    } else {
      current++;
      renderQuestion();
    }
  };

  const topbarDiv = document.querySelector('.topbar');
  if (topbarDiv) topbarDiv.outerHTML = renderTopbar();
}

function renderEnd(){
  const total = QUESTIONS.length;
  const pct = Math.round(score/total*100);
  const missed = answers.filter(a => !a.isCorrect);

  let reviewHtml = '';
  if (missed.length === 0){
    reviewHtml = `<p style="color:var(--correct); font-weight:600; text-align:center;">Perfect score! No questions missed.</p>`;
  } else {
    reviewHtml = `<h3 style="margin-top:28px;">Review — Questions Missed (${missed.length})</h3><div class="reviewlist">` +
      missed.map(a => {
        const q = QUESTIONS[a.qIndex];
        return `
          <div class="reviewitem">
            <span class="sectiontag">${q.section}</span>
            <div class="stem">Q${a.qIndex+1}. ${q.stem}</div>
            <div class="yourans">Your answer: ${letterFor(a.selectedIdx)}. ${q.options[a.selectedIdx]}</div>
            <div class="correctans">Correct answer: ${letterFor(a.correctIdx)}. ${q.options[a.correctIdx]}</div>
          </div>
        `;
      }).join('') + `</div>`;
  }

  app.innerHTML = `
    <div class="endscreen">
      <h2>Quiz Complete!</h2>
      <div class="scoreCircle"><div class="num">${pct}%</div><div class="den">${score}/${total}</div></div>
      <div class="statgrid">
        <div class="stat"><div class="val" style="color:var(--correct)">${score}</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="val" style="color:var(--wrong)">${total-score}</div><div class="lbl">Incorrect</div></div>
        <div class="stat"><div class="val">${total}</div><div class="lbl">Total</div></div>
      </div>
      <button class="restartsmall" id="restartBtn">Restart Quiz</button>
      ${reviewHtml}
    </div>
  `;
  document.getElementById('restartBtn').onclick = renderStart;
  window.scrollTo({top:0, behavior:'smooth'});
}

renderStart();
</script>
