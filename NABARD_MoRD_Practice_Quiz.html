<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoRD Scheme Compendium — NABARD Grade A Practice Quiz</title>
<style>
  :root{
    --navy:#12263a;
    --navy-deep:#0b1a29;
    --slate:#3d5266;
    --paper:#f6f4ee;
    --paper-card:#ffffff;
    --line:#dcd6c8;
    --gold:#a9762f;
    --gold-soft:#f1e6d2;
    --good:#1f7a4d;
    --good-bg:#e6f4ec;
    --bad:#a4322a;
    --bad-bg:#fbeae8;
    --skip:#8a6d3b;
    --skip-bg:#fdf3e0;
    --shadow: 0 4px 18px rgba(18,38,58,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Georgia","Iowan Old Style", serif;
    background:var(--paper);
    color:var(--navy-deep);
    min-height:100vh;
  }
  .util-font{ font-family: "Helvetica Neue", Arial, sans-serif; }
  #app{max-width:920px;margin:0 auto;padding:22px 18px 60px;}

  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 0 18px;border-bottom:2px solid var(--navy);
    margin-bottom:22px;
  }
  header.topbar .brand{
    font-family:"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;color:var(--gold);
    font-weight:700;
  }
  header.topbar h1{
    font-size:22px;margin:2px 0 0;color:var(--navy-deep);font-weight:700;
  }
  header.topbar .meta{
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--slate);text-align:right;
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:26px 28px;
  }

  /* HOME */
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
  @media(max-width:640px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    border:1px solid var(--line);background:var(--paper-card);
    border-radius:6px;padding:22px;cursor:pointer;transition:.15s;
    box-shadow:var(--shadow);
  }
  .mode-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .mode-card h3{margin:0 0 8px;font-size:18px;color:var(--navy-deep);}
  .mode-card p{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13.5px;color:var(--slate);line-height:1.5;}
  .mode-card .tag{
    display:inline-block;margin-top:12px;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;
  }

  .intro-note{
    font-family:"Helvetica Neue",Arial,sans-serif;color:var(--slate);font-size:13.5px;line-height:1.6;
    background:var(--gold-soft);border-left:3px solid var(--gold);padding:14px 16px;border-radius:4px;margin-top:20px;
  }

  /* SECTION GRID */
  .section-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px;}
  @media(max-width:640px){.section-grid{grid-template-columns:1fr;}}
  .section-tile{
    border:1px solid var(--line);border-radius:6px;padding:16px 18px;cursor:pointer;background:#fff;
    transition:.15s;
  }
  .section-tile:hover{border-color:var(--gold);background:var(--gold-soft);}
  .section-tile .name{font-weight:700;font-size:15px;color:var(--navy-deep);}
  .section-tile .count{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--gold);margin-top:4px;}

  .btn{
    font-family:"Helvetica Neue",Arial,sans-serif;
    display:inline-block;padding:10px 20px;border-radius:4px;border:1.5px solid var(--navy);
    background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;letter-spacing:.02em;
    cursor:pointer;text-align:center;
  }
  .btn:hover{background:var(--navy-deep);}
  .btn.secondary{background:#fff;color:var(--navy);border-color:var(--navy);}
  .btn.secondary:hover{background:var(--paper);}
  .btn.gold{background:var(--gold);border-color:var(--gold);}
  .btn.gold:hover{background:#8f6226;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .toggle-row{display:flex;gap:10px;align-items:center;margin:14px 0 4px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--slate);}
  .toggle{
    display:inline-flex;border:1px solid var(--navy);border-radius:20px;overflow:hidden;
  }
  .toggle button{
    font-family:"Helvetica Neue",Arial,sans-serif;
    border:none;background:#fff;color:var(--navy);padding:6px 16px;font-size:12.5px;cursor:pointer;font-weight:600;
  }
  .toggle button.active{background:var(--navy);color:#fff;}

  /* QUIZ HEADER */
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:"Helvetica Neue",Arial,sans-serif;}
  .quiz-top .progress-label{font-size:12.5px;color:var(--slate);}
  .quiz-top .score-label{font-size:12.5px;color:var(--navy);font-weight:700;}
  .progress-bar-bg{width:100%;height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:20px;}
  .progress-bar-fill{height:100%;background:var(--gold);transition:width .25s;}

  .q-meta{
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin-bottom:10px;display:flex;gap:10px;
  }
  .q-meta .diff{
    padding:2px 8px;border-radius:10px;background:var(--gold-soft);color:var(--gold);
  }
  .q-text{font-size:17.5px;line-height:1.55;color:var(--navy-deep);margin-bottom:18px;white-space:pre-line;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:14.5px;line-height:1.4;color:var(--navy-deep);
    background:#fff;transition:.12s;
  }
  .opt:hover{border-color:var(--navy);}
  .opt .letter{
    font-weight:700;color:var(--gold);min-width:18px;
  }
  .opt.correct{background:var(--good-bg);border-color:var(--good);}
  .opt.correct .letter{color:var(--good);}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);}
  .opt.wrong .letter{color:var(--bad);}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.55;}

  .explain-box{
    margin-top:16px;padding:14px 16px;border-radius:6px;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13.5px;line-height:1.55;display:none;
  }
  .explain-box.show{display:block;}
  .explain-box.good{background:var(--good-bg);color:#15532f;border-left:3px solid var(--good);}
  .explain-box.bad{background:var(--bad-bg);color:#6e211c;border-left:3px solid var(--bad);}
  .explain-box.skip{background:var(--skip-bg);color:#6b501f;border-left:3px solid var(--skip);}

  .quiz-actions{display:flex;justify-content:space-between;margin-top:22px;}
  .quiz-actions .left, .quiz-actions .right{display:flex;gap:10px;}

  /* RESULTS */
  .score-hero{
    text-align:center;padding:24px 0 8px;
  }
  .score-hero .big{font-size:52px;font-weight:700;color:var(--navy-deep);}
  .score-hero .sub{font-family:"Helvetica Neue",Arial,sans-serif;color:var(--slate);font-size:14px;margin-top:4px;}

  .diff-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0;}
  .diff-box{border:1px solid var(--line);border-radius:6px;padding:14px;text-align:center;font-family:"Helvetica Neue",Arial,sans-serif;}
  .diff-box .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate);}
  .diff-box .val{font-size:22px;font-weight:700;color:var(--navy-deep);margin-top:4px;}

  .review-item{
    border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;
  }
  .review-item .rq{font-size:14.5px;margin-bottom:8px;color:var(--navy-deep);}
  .review-item .ra{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1.5;}
  .review-item .ra .correct-line{color:var(--good);font-weight:700;}
  .review-item .ra .wrong-line{color:var(--bad);font-weight:700;}
  .review-item .ra .skip-line{color:var(--skip);font-weight:700;}
  .review-item .expl{margin-top:6px;color:var(--slate);font-family:"Helvetica Neue",Arial,sans-serif;font-size:12.5px;}
  .review-tag{
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--gold);font-weight:700;
  }

  h2.section-h{font-size:18px;margin:26px 0 10px;color:var(--navy-deep);border-bottom:1px solid var(--line);padding-bottom:6px;}

  .hidden{display:none !important;}
  .backlink{
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--slate);cursor:pointer;
    display:inline-block;margin-bottom:14px;
  }
  .backlink:hover{color:var(--navy);}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="brand">CGB Mentors · MoRD Compendium</div>
      <h1>NABARD Grade A Practice Quiz</h1>
    </div>
    <div class="meta">257 questions · 5-option format<br>Offline, self-contained</div>
  </header>

  <div id="screen-home"></div>
  <div id="screen-sections" class="hidden"></div>
  <div id="screen-quiz" class="hidden"></div>
  <div id="screen-results" class="hidden"></div>
</div>

<script>
/* =========================================================
   QUESTION BANK
   Each entry: [section, difficulty(E/M/H), type(s/t/m), question, [5 options], correctIndex(0-4), explanation]
   ========================================================= */
const QUESTIONS = [
["evolution","M","s","In which year was the Intensive Agricultural District Programme (IADP) launched?",["1960-61","1965-66","1970-71","1973-74","1978-79"],0,"IADP (1960-61) increased agricultural production in 7 districts through a 'package programme.'"],
["evolution","E","s","The Green Revolution, which revolutionized agriculture with improved seeds and technology, is dated to which period?",["1960-61","1964-65","1970-71","1973-74","1976-77"],1,"The Green Revolution is dated 1964-65."],
["evolution","M","s","The Rural Works Programme (RWP), aimed at reducing drought impact and providing employment, was later renamed as which programme?",["IRDP","NREP","DPAP","JRY","SGSY"],2,"RWP (1970-71) was later renamed DPAP, focused on minimizing drought effects."],
["evolution","M","s","The Hill Area Development Programme (HADP), which focused on horticulture, animal husbandry and industry in hill areas, was launched in which year?",["1970-71","1974-75","1976-77","1973-74","1977-78"],3,"HADP was launched in 1973-74."],
["evolution","H","s","The Command Area Development Programme (CADP), launched in December 1974, was renamed CADWMP in which year and integrated with which scheme since 2016?",["2000; NREGA","2002; SGSY","2006; NRLM","2010; PMGSY","2004; AIBP of PMKSY"],4,"CADP was renamed CADWMP in 2004 and integrated with AIBP of PMKSY since 2016."],
["evolution","M","s","The Minimum Needs Programme (MNP), part of the Fifth Five Year Plan (1975-76), included which of the following components?",["Education, healthcare, water supply, electrification, roads, nutrition, sanitation","Only irrigation and roads","Only health and education","Wage employment only","Rural credit only"],0,"MNP covered education, healthcare, water supply, electrification, roads, nutrition and sanitation."],
["evolution","H","s","Under the Minimum Needs Programme, the Rural Sanitation Programme was initiated in which year?",["1975-76","1987-88","1995-96","2000-01","2004-05"],1,"The Rural Sanitation Programme was initiated in 1987-88 under MNP."],
["evolution","M","s","The Integrated Tribal Development Programme (ITDP) targeted blocks with what minimum tribal population percentage?",["30%","40%",">50%","60%","70%"],2,"ITDP targeted blocks with more than 50% tribal population."],
["evolution","H","s","The Food for Work Programme (FFWP), launched in 1977 to generate rural employment using surplus food grains, was merged with NREGA in which month/year?",["August 2005","January 2006","April 2007","February 2006","March 2008"],3,"FFWP (renamed National FFWP in 2004) was merged with NREGA in February 2006."],
["evolution","H","s","The Desert Development Programme (DDP), launched in 1977, has been implemented using a watershed approach since which date?",["January 1, 1990","April 1, 1985","April 1, 2000","January 1, 1995","April 1, 1995"],4,"DDP has used a watershed approach since April 1, 1995."],
["evolution","M","s","The Integrated Watershed Management Program (IWMP), formed by merging various watershed initiatives, was formed in which year?",["2000","2002","2004","2006","2008"],0,"IWMP was formed in 2000."],
["evolution","M","s","Which agencies executed the Integrated Rural Development Programme (IRDP), launched in 1978?",["State Rural Livelihood Missions","District Rural Development Agencies (DRDAs)","Block Development Offices","Gram Panchayats","NABARD Regional Offices"],1,"IRDP was executed by District Rural Development Agencies (DRDAs)."],
["evolution","E","s","IRDP and its allied programmes were eventually merged into which scheme?",["NRLM","PMAY-G","SGSY","MGNREGA","DDU-GKY"],2,"IRDP and allied programmes merged into SGSY."],
["evolution","H","s","TRYSEM (Training of Rural Youth for Self-Employment), launched on 15 August 1979, mandated what minimum percentage of trainees from SC/ST and women respectively?",["20% SC/ST, 25% women","40% SC/ST, 30% women","25% SC/ST, 40% women","30% SC/ST, 33% women","50% SC/ST, 33% women"],3,"TRYSEM mandated at least 30% SC/ST and 33% women trainees."],
["evolution","M","s","TRYSEM provided training to rural youth of which age group from BPL families?",["15-30 years","16-32 years","21-40 years","14-28 years","18-35 years"],4,"TRYSEM targeted rural youth aged 18-35 from poor families."],
["evolution","M","s","The National Rural Employment Programme (NREP), launched in 1980 and managed by DRDA, provided which in-kind benefit per man-day?",["1 kg of food grains","2 kg of food grains","Cash wages only","5 kg of food grains","500 grams of food grains"],0,"NREP provided 1 kg of food grains per man-day."],
["evolution","M","s","In 1989, NREP was merged with which programme to form the Jawahar Rozgar Yojana (JRY)?",["IRDP","RLEGP","DWCRA","TRYSEM","MWS"],1,"NREP and RLEGP were merged in 1989 to form JRY."],
["evolution","H","s","DWCRA (Development of Women and Children in Rural Areas), started in 1982, was piloted in how many districts before nationwide expansion?",["25","35","50","75","100"],2,"DWCRA was piloted in 50 districts, then expanded nationwide."],
["evolution","H","s","The Rural Landless Employment Guarantee Program (RLEGP), launched in August 1983, guaranteed employment to at least one person per landless labourer household for up to how many days a year?",["50 days","60 days","80 days","100 days","125 days"],3,"RLEGP guaranteed up to 100 days of employment per landless labourer household."],
["evolution","H","s","Indira Awaas Yojana (IAY) was delinked from JRY and made an independent scheme with effect from which date?",["April 1, 1993","January 1, 1999","April 1, 1996","January 1, 1989","January 1, 1996"],4,"IAY became an independent scheme from January 1, 1996."],
["evolution","H","s","Under IAY, what was the financial assistance for house construction in plain areas versus hilly regions respectively?",["₹70,000 (plain); ₹75,000 (hilly)","₹75,000 (plain); ₹70,000 (hilly)","₹1,20,000 (plain); ₹1,30,000 (hilly)","₹60,000 (plain); ₹65,000 (hilly)","₹50,000 (plain); ₹55,000 (hilly)"],0,"IAY provided ₹70,000 in plain areas and ₹75,000 in hilly regions."],
["evolution","M","s","Under IAY, funding allocation nationally was fixed at 60% for SC/STs and what percentage for minorities?",["10%","15%","20%","25%","5%"],1,"IAY's national funding allocation was 60% for SC/STs, 15% for minorities."],
["evolution","E","s","IAY was restructured and renamed Pradhan Mantri Awaas Yojana-Gramin (PMAY-G) with effect from which date?",["November 20, 2016","January 1, 2016","April 1, 2016","October 2, 2014","December 25, 2015"],2,"IAY was renamed PMAY-G with effect from April 1, 2016."],
["evolution","H","s","Under the Million Wells Scheme (MWS), 1988-89, open wells for irrigation were provided free of cost to which beneficiary group?",["BPL farmers generally","Women SHG members","Marginal farmers","SC/ST beneficiaries","Landless agricultural labourers only"],3,"MWS provided free open wells for irrigation to SC/ST beneficiaries."],
["evolution","M","s","Under the Jawahar Rozgar Yojana (JRY), 1989, what percentage of employment was reserved for women?",["20%","25%","40%","50%","30%"],4,"JRY reserved 30% of employment for women."],
["evolution","H","s","Under JRY, what were the funding allocations for IAY and MWS respectively?",["6% for IAY, 20% for MWS","10% for IAY, 15% for MWS","20% for IAY, 6% for MWS","15% for IAY, 25% for MWS","5% for IAY, 30% for MWS"],0,"Under JRY, 6% was allocated for IAY and 20% for MWS."],
["evolution","M","s","JRY was revamped and renamed as which scheme in 1999?",["Sampoorna Gramin Rozgar Yojana","Jawahar Gram Samridhi Yojana","Swarnajayanti Gram Swarozgar Yojana","National Food for Work Programme","Employment Assurance Scheme"],1,"JRY was renamed Jawahar Gram Samridhi Yojana in 1999."],
["evolution","H","s","The Employment Assurance Scheme (EAS), launched on 2 October 1993, mandated a wage-material ratio of how much for its labour-intensive projects?",["70:30","50:50","60:40","80:20","40:60"],2,"EAS mandated a wage-material ratio of 60:40."],
["evolution","H","s","EAS provided up to how many days of assured manual employment at statutory minimum wages, limited to how many beneficiaries per family?",["80 days, 1 beneficiary","120 days, 3 beneficiaries","90 days, 2 beneficiaries","100 days, 2 beneficiaries","100 days, 1 beneficiary"],3,"EAS provided up to 100 days of employment, limited to two beneficiaries per family."],
["evolution","M","s","The National Social Assistance Programme (NSAP), launched on 15 August 1995, advances the principles of which Articles of the Constitution?",["Articles 38 and 39","Articles 45 and 46","Articles 21 and 25","Articles 14 and 19","Articles 41 and 42"],4,"NSAP advances the principles in Articles 41 and 42."],
["evolution","M","s","Under NSAP's IGNOAPS component, beneficiaries aged 60+ receive a monthly pension in what range?",["₹200-500","₹300-600","₹500-1000","₹1000-2000","₹100-300"],0,"IGNOAPS provides ₹200-500 monthly to beneficiaries aged 60+."],
["evolution","E","s","Under NSAP, the National Family Benefit Scheme (NFBS) provides what amount to bereaved households?",["₹10,000","₹20,000","₹15,000","₹25,000","₹30,000"],1,"NFBS provides ₹20,000 to bereaved households."],
["evolution","H","s","The IGNWPS and IGNDPS components under NSAP, introduced in 2009, cover which beneficiaries respectively?",["Orphans; disabled children","Elderly women; elderly men","Widows aged ≥40; Disabled aged ≥18","Widows aged ≥60; Disabled aged ≥60","Single mothers; war veterans"],2,"IGNWPS covers widows aged ≥40 (₹300-500); IGNDPS covers disabled aged ≥18 (₹300-500)."],
["evolution","M","s","The Annapurna scheme, launched in 2000 under NSAP, offers how much food grain monthly to eligible seniors?",["5 kg","15 kg","20 kg","10 kg","25 kg"],3,"Annapurna offers 10 kg monthly food grains to seniors."],
["evolution","M","s","The Rural Employment Generation Programme (REGP), launched by KVIC on 1st April 1995, aimed to create how many jobs in the KVI sector?",["10 lakh","15 lakh","25 lakh","5 lakh","20 lakh"],4,"REGP aimed to create 20 lakh jobs in the KVI sector."],
["evolution","H","s","The Swarn Jayanti Shahari Rozgar Yojana (SJSRY), launched 1 December 1997 by MoHUA, consolidated which earlier schemes?",["NRY, UBSP, PMIUPEP","IRDP, TRYSEM, DWCRA","JRY, EAS","SGSY, SGRY","NREP, RLEGP"],0,"SJSRY consolidated NRY, UBSP, and PMIUPEP."],
["evolution","M","s","Under SJSRY, the USEP (Urban Self-Employment Promotion) component offered loans up to ₹2 lakh with what subsidy?",["20% subsidy","25% subsidy","30% subsidy","35% subsidy","15% subsidy"],1,"USEP offered loans up to ₹2 lakh with a 25% subsidy."],
["evolution","H","s","Which SJSRY component focused on Urban Women SHG Promotion, offering a subsidy or 35% of project cost with a revolving fund?",["UWEP","STEP-UP","UWSP","UCDN","USEP"],2,"UWSP (Urban Women SHG Promotion) offered a subsidy or 35% of project cost with a revolving fund."],
["evolution","H","s","The Swarnajayanti Gram Swarozgar Yojana (SGSY), launched on 1 April 1999, mandated reservation percentages for SC/ST, women, and disabled beneficiaries as:",["40% SC/ST, 50% women, 5% disabled","60% SC/ST, 30% women, 5% disabled","45% SC/ST, 45% women, 3% disabled","50% SC/ST, 40% women, 3% disabled","55% SC/ST, 35% women, 2% disabled"],3,"SGSY mandated 50% SC/ST, 40% women, 3% disabled."],
["evolution","H","s","Under SGSY, banks provided a revolving fund of ₹25,000 with DRDAs contributing how much, with interest charged only above what threshold?",["₹5,000; above ₹5,000","₹15,000; above ₹15,000","₹20,000; above ₹15,000","₹5,000; above ₹20,000","₹10,000; above ₹10,000"],4,"DRDAs contributed ₹10,000, with interest charged only on the amount exceeding ₹10,000."],
["evolution","M","s","Under SGSY, the subsidy was capped at what percentage of project cost, subject to a ceiling of ₹7,500?",["30%","40%","50%","20%","35%"],0,"SGSY subsidy was 30% of project cost, capped at ₹7,500."],
["evolution","E","s","SGSY was replaced by NRLM with effect from which date?",["April 1, 2011","April 1, 2013","April 1, 2015","January 1, 2013","October 2, 2014"],1,"SGSY was replaced by NRLM from April 1, 2013."],
["evolution","M","s","The Sampoorna Gramin Rozgar Yojana (SGRY), announced on 15 August 2001, merged which two schemes?",["IRDP and TRYSEM","JRY and NREP","JGSY and EAS","SGSY and DWCRA","NFFWP and MGNREGA"],2,"SGRY merged JGSY and EAS."],
["evolution","H","s","Under SGRY, wage payment required a minimum percentage in cash along with how much food grain per man-day?",["20% cash; 3 kg grain","30% cash; 10 kg grain","15% cash; 2 kg grain","25% cash; 5 kg grain","50% cash; 5 kg grain"],3,"SGRY required at least 25% cash and 5 kg of food grains per man-day."],
["evolution","M","s","The Hariyali guidelines, applicable to new watershed projects under IWDP, DPAP, and DDP from April 1, 2003, primarily aimed to:",["Provide urban housing subsidies","Establish rural employment exchanges","Fund skill training centres","Create micro-finance institutions","Harvest rainwater and mitigate drought effects"],4,"Hariyali guidelines aimed to harvest rainwater, generate employment and mitigate drought effects."],
["evolution","H","s","The National Food for Work Programme (NFFWP), launched 14 November 2004, was implemented in how many backward districts and was funded how?",["150 districts, 100% centrally sponsored","100 districts, 60:40 sharing","200 districts, 90:10 sharing","250 districts, 75:25 sharing","150 districts, 50:50 sharing"],0,"NFFWP was launched in 150 backward districts, 100% centrally sponsored."],
["pmgsy","E","s","Pradhan Mantri Gram Sadak Yojana (PMGSY) was launched on which date?",["15 August 1999","25 December 2000","2 October 2000","1 April 2000","26 January 2001"],1,"PMGSY was launched on 25.12.2000."],

const SECTION_NAMES = {
  evolution: "Evolution of Development Programmes",
  pmgsy: "PMGSY",
  mgnrega: "MGNREGA",
  vbgramg: "VB-GRAM G Act, 2025",
  sagy: "SAGY",
  pmayg: "PMAY-G",
  daynrlm: "DAY-NRLM",
  mksp: "MKSP",
  ddugky: "DDU-GKY",
  svep: "SVEP",
  rurban: "Rurban Mission (SPMRM)",
  antyodaya: "Mission Antyodaya",
  misc: "NRLP · DISHA · PURA · DRDA · AGEY · SARAS · NRETP · RHISS"
};
const SECTION_ORDER = ["evolution","pmgsy","mgnrega","vbgramg","sagy","pmayg","daynrlm","mksp","ddugky","svep","rurban","antyodaya","misc"];

/* attach stable ids matching original PDF order index */
QUESTIONS.forEach((q,i)=>{ q.__id = i; });

/* =========================================================
   APP STATE / LOGIC
   ========================================================= */
let state = {
  mode:null,          // 'full' or 'section'
  order:'pdf',         // 'pdf' or 'shuffled'
  sectionKey:null,
  set:[],              // array of question objects (with __id) for current run
  idx:0,
  answers:{},          // __id -> {chosen: idx|null, correct: bool|null, skipped: bool}
  score:0
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstChild;
}

function show(screenId){
  ["screen-home","screen-sections","screen-quiz","screen-results"].forEach(id=>{
    document.getElementById(id).classList.toggle('hidden', id!==screenId);
  });
}

/* ---------- HOME ---------- */
function renderHome(){
  const c = document.getElementById('screen-home');
  c.innerHTML = `
    <div class="card">
      <div class="mode-grid">
        <div class="mode-card" id="mode-full">
          <h3>Full Practice Test</h3>
          <p>Attempt all 257 questions in one sitting. Choose PDF order (follows the document's section sequence) or Shuffled order for a fresh randomized attempt.</p>
          <span class="tag">Start full test →</span>
        </div>
        <div class="mode-card" id="mode-section">
          <h3>Section-wise Revision</h3>
          <p>Pick a single scheme or topic and drill only those questions — ideal for targeted revision before the exam.</p>
          <span class="tag">Choose a section →</span>
        </div>
      </div>
      <div class="intro-note">Source: Ministry of Rural Development scheme compendium (CGB Mentors). Questions follow NABARD Grade A's 5-option format, including trap ("NOT correct") and multi-statement questions.</div>
    </div>
  `;
  document.getElementById('mode-full').onclick = ()=> renderFullSetup();
  document.getElementById('mode-section').onclick = ()=> renderSections();
  show('screen-home');
}

/* ---------- FULL TEST SETUP ---------- */
function renderFullSetup(){
  const c = document.getElementById('screen-home');
  c.innerHTML = `
    <div class="card">
      <span class="backlink" id="back-home">← Back to menu</span>
      <h3 style="margin-top:0;">Full Practice Test</h3>
      <p class="util-font" style="color:var(--slate);font-size:13.5px;">All 257 questions. Choose the order you'd like to attempt them in.</p>
      <div class="toggle-row">
        <span>Order:</span>
        <div class="toggle">
          <button id="order-pdf" class="active">PDF Order</button>
          <button id="order-shuffled">Shuffled</button>
        </div>
      </div>
      <div style="margin-top:22px;">
        <button class="btn gold" id="start-full">Begin Test →</button>
      </div>
    </div>
  `;
  let order = 'pdf';
  document.getElementById('back-home').onclick = renderHome;
  document.getElementById('order-pdf').onclick = (e)=>{ order='pdf'; toggleBtns(e.target); };
  document.getElementById('order-shuffled').onclick = (e)=>{ order='shuffled'; toggleBtns(e.target); };
  function toggleBtns(activeBtn){
    document.getElementById('order-pdf').classList.toggle('active', activeBtn.id==='order-pdf');
    document.getElementById('order-shuffled').classList.toggle('active', activeBtn.id==='order-shuffled');
  }
  document.getElementById('start-full').onclick = ()=>{
    state.mode='full'; state.order=order; state.sectionKey=null;
    startQuiz(order==='pdf' ? QUESTIONS.slice() : shuffle(QUESTIONS));
  };
  show('screen-home');
}

/* ---------- SECTION GRID ---------- */
function renderSections(){
  const counts = {};
  QUESTIONS.forEach(q=>{ counts[q[0]] = (counts[q[0]]||0)+1; });
  const c = document.getElementById('screen-sections');
  c.innerHTML = `
    <div class="card">
      <span class="backlink" id="back-home2">← Back to menu</span>
      <h3 style="margin-top:0;">Section-wise Revision</h3>
      <p class="util-font" style="color:var(--slate);font-size:13.5px;">Tap a topic to drill only its questions (in document order).</p>
      <div class="section-grid" id="grid"></div>
    </div>
  `;
  const grid = c.querySelector('#grid');
  SECTION_ORDER.forEach(key=>{
    const tile = el(`<div class="section-tile">
        <div class="name">${SECTION_NAMES[key]}</div>
        <div class="count">${counts[key]||0} questions</div>
      </div>`);
    tile.onclick = ()=>{
      state.mode='section'; state.sectionKey=key;
      const set = QUESTIONS.filter(q=>q[0]===key);
      startQuiz(set);
    };
    grid.appendChild(tile);
  });
  document.getElementById('back-home2').onclick = renderHome;
  show('screen-sections');
}

/* ---------- QUIZ ---------- */
function startQuiz(set){
  state.set = set;
  state.idx = 0;
  state.answers = {};
  state.score = 0;
  renderQuestion();
}

function currentAnswerState(q){
  return state.answers[q.__id] || {chosen:null, correct:null, skipped:false};
}

function renderQuestion(){
  const q = state.set[state.idx];
  const total = state.set.length;
  const answered = Object.keys(state.answers).length;
  const pct = Math.round((state.idx/total)*100);
  const diffLabel = {E:"Easy",M:"Moderate",H:"Hard"}[q[1]];
  const typeLabel = {s:"Single Fact", t:"Which is NOT correct", m:"Multi-Statement"}[q[2]];

  const c = document.getElementById('screen-quiz');
  c.innerHTML = `
    <div class="card">
      <div class="quiz-top">
        <span class="progress-label">Question ${state.idx+1} of ${total} ${state.mode==='section' ? '· '+SECTION_NAMES[state.sectionKey] : ''}</span>
        <span class="score-label">Score: ${state.score}</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
      <div class="q-meta"><span class="diff">${diffLabel}</span><span>${SECTION_NAMES[q[0]]} · ${typeLabel}</span></div>
      <div class="q-text">${q[3]}</div>
      <div class="options" id="options"></div>
      <div class="explain-box" id="explain"></div>
      <div class="quiz-actions">
        <div class="left">
          <button class="btn secondary" id="skip-btn">Skip →</button>
        </div>
        <div class="right">
          <button class="btn" id="next-btn" style="display:none;">Next →</button>
        </div>
      </div>
    </div>
  `;

  const optWrap = c.querySelector('#options');
  const letters = ['A','B','C','D','E'];
  const st = currentAnswerState(q);
  q[4].forEach((optText,i)=>{
    const div = el(`<div class="opt" data-i="${i}"><span class="letter">${letters[i]}.</span><span>${optText}</span></div>`);
    optWrap.appendChild(div);
  });

  function lockOptions(chosenIdx, skipped){
    const opts = optWrap.querySelectorAll('.opt');
    opts.forEach((o,i)=>{
      o.classList.add('disabled');
      if(i===q[5]) o.classList.add('correct');
      if(chosenIdx!==null && i===chosenIdx && chosenIdx!==q[5]) o.classList.add('wrong');
      if(chosenIdx!==null && i!==chosenIdx && i!==q[5]) o.classList.add('dim');
    });
    const box = c.querySelector('#explain');
    box.classList.add('show');
    if(skipped){
      box.classList.add('skip');
      box.innerHTML = `<strong>Skipped.</strong> Correct answer: ${letters[q[5]]}. ${q[6]}`;
    } else if(chosenIdx===q[5]){
      box.classList.add('good');
      box.innerHTML = `<strong>Correct.</strong> ${q[6]}`;
    } else {
      box.classList.add('bad');
      box.innerHTML = `<strong>Incorrect.</strong> Correct answer: ${letters[q[5]]}. ${q[6]}`;
    }
    c.querySelector('#skip-btn').style.display='none';
    c.querySelector('#next-btn').style.display='inline-block';
  }

  // if already answered (e.g. navigated back — not used currently, but safe)
  if(st.chosen!==null || st.skipped){
    lockOptions(st.chosen, st.skipped);
  } else {
    optWrap.querySelectorAll('.opt').forEach(o=>{
      o.onclick = ()=>{
        const i = parseInt(o.dataset.i);
        const correct = (i===q[5]);
        state.answers[q.__id] = {chosen:i, correct:correct, skipped:false};
        if(correct) state.score++;
        lockOptions(i,false);
      };
    });
  }

  c.querySelector('#skip-btn').onclick = ()=>{
    state.answers[q.__id] = {chosen:null, correct:false, skipped:true};
    lockOptions(null, true);
  };

  c.querySelector('#next-btn').onclick = ()=>{
    if(state.idx < state.set.length-1){
      state.idx++;
      renderQuestion();
    } else {
      renderResults();
    }
  };

  show('screen-quiz');
}

/* ---------- RESULTS ---------- */
function renderResults(){
  const total = state.set.length;
  let correctCount=0, wrongCount=0, skipCount=0;
  const diffStats = {E:{c:0,t:0},M:{c:0,t:0},H:{c:0,t:0}};
  const missed = [];

  state.set.forEach(q=>{
    const st = state.answers[q.__id] || {chosen:null, correct:false, skipped:true};
    diffStats[q[1]].t++;
    if(st.skipped){ skipCount++; missed.push({q,st}); }
    else if(st.correct){ correctCount++; diffStats[q[1]].c++; }
    else { wrongCount++; missed.push({q,st}); }
  });

  const pct = total? Math.round((correctCount/total)*100) : 0;

  const c = document.getElementById('screen-results');
  let html = `
    <div class="card">
      <div class="score-hero">
        <div class="big">${correctCount} / ${total}</div>
        <div class="sub">${pct}% correct &nbsp;·&nbsp; ${wrongCount} incorrect &nbsp;·&nbsp; ${skipCount} skipped</div>
      </div>
      <div class="diff-breakdown">
        ${['E','M','H'].map(d=>{
          const lbl = {E:'Easy',M:'Moderate',H:'Hard'}[d];
          const s = diffStats[d];
          const p = s.t ? Math.round((s.c/s.t)*100) : 0;
          return `<div class="diff-box"><div class="lbl">${lbl}</div><div class="val">${s.c}/${s.t}</div><div class="lbl">${p}%</div></div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:12px;margin:20px 0 8px;">
        <button class="btn gold" id="retry-btn">Retry Same Set</button>
        <button class="btn secondary" id="menu-btn">Back to Menu</button>
      </div>
    </div>
  `;

  if(missed.length){
    html += `<h2 class="section-h">Review — Missed &amp; Skipped (${missed.length})</h2>`;
    const letters = ['A','B','C','D','E'];
    missed.forEach(({q,st})=>{
      const correctText = letters[q[5]]+'. '+q[4][q[5]];
      let statusLine;
      if(st.skipped){
        statusLine = `<span class="skip-line">Skipped.</span> Correct answer: ${correctText}`;
      } else {
        const wrongText = letters[st.chosen]+'. '+q[4][st.chosen];
        statusLine = `<span class="wrong-line">Your answer: ${wrongText}</span><br><span class="correct-line">Correct answer: ${correctText}</span>`;
      }
      html += `<div class="review-item">
        <div class="review-tag">${SECTION_NAMES[q[0]]}</div>
        <div class="rq">${q[3]}</div>
        <div class="ra">${statusLine}</div>
        <div class="expl">${q[6]}</div>
      </div>`;
    });
  } else {
    html += `<div class="intro-note" style="margin-top:20px;">Perfect run — every question answered correctly. No review items.</div>`;
  }

  c.innerHTML = html;
  c.querySelector('#retry-btn').onclick = ()=>{
    startQuiz(state.mode==='full' && state.order==='shuffled' ? shuffle(QUESTIONS) : state.set.slice());
  };
  c.querySelector('#menu-btn').onclick = renderHome;
  show('screen-results');
}

renderHome();
</script>
