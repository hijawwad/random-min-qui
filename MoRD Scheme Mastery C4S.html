<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoRD Scheme Mastery — NABARD Grade A Practice</title>
<style>
:root{
  --bg:#12141a; --bg2:#191c24; --card:#1e222b; --card2:#242833;
  --text:#e8e8ec; --muted:#9198a6; --accent:#d9a441; --accent2:#7fb8e0;
  --green:#3fbf7f; --red:#e2584f; --border:#2c3140;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;}
#app{max-width:760px;margin:0 auto;min-height:100%;padding:18px 16px 40px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.brand{font-family:Georgia,serif;font-size:1.05rem;color:var(--accent);letter-spacing:.3px;}
.pill{font-size:.72rem;color:var(--muted);border:1px solid var(--border);padding:3px 9px;border-radius:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
.card:hover{border-color:#3a4054;}
h1.hero{font-size:1.5rem;margin:6px 0 4px;color:var(--text);}
p.sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;line-height:1.5;}
.mode-btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer;color:var(--text);transition:.15s;}
.mode-btn:hover{border-color:var(--accent);background:var(--card2);}
.mode-btn .t{font-family:Georgia,serif;font-size:1.05rem;color:var(--accent);margin-bottom:4px;}
.mode-btn .d{font-size:.85rem;color:var(--muted);line-height:1.4;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:480px){.grid{grid-template-columns:1fr;}}
.topic-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;}
.topic-card:hover{border-color:var(--accent2);background:var(--card2);}
.topic-card .tt{font-family:Georgia,serif;font-size:.95rem;margin-bottom:4px;}
.topic-card .tc{font-size:.78rem;color:var(--muted);}
.toggle-row{display:flex;gap:8px;margin:10px 0 16px;}
.toggle-btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);
  color:var(--muted);cursor:pointer;font-size:.85rem;text-align:center;}
.toggle-btn.active{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:600;}
.btn{background:var(--accent);color:#1a1300;border:none;border-radius:10px;padding:12px 18px;font-weight:600;
  cursor:pointer;font-size:.95rem;}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:500;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn:disabled{opacity:.45;cursor:default;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.progress-wrap{background:var(--bg2);border-radius:8px;height:8px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border);}
.progress-bar{background:linear-gradient(90deg,var(--accent2),var(--accent));height:100%;transition:width .25s;}
.scorebar{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:10px;}
.qmeta{display:flex;gap:8px;margin-bottom:10px;}
.tag{font-size:.68rem;padding:3px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted);}
.tag.diffE{color:#3fbf7f;border-color:#245c3e;}
.tag.diffM{color:#d9a441;border-color:#5c4a24;}
.tag.diffH{color:#e2584f;border-color:#5c2b28;}
.context{background:var(--bg2);border-left:3px solid var(--accent2);border-radius:8px;padding:12px 14px;
  margin-bottom:14px;font-size:.9rem;line-height:1.55;color:#c9cedb;white-space:pre-line;}
.qtext{font-size:1.05rem;line-height:1.5;margin-bottom:16px;color:var(--text);font-weight:500;}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;color:var(--text);font-size:.92rem;
  line-height:1.4;transition:.12s;}
.opt:hover:not(.locked){border-color:var(--accent2);}
.opt .lab{color:var(--accent2);font-weight:700;margin-right:8px;}
.opt.correct{background:rgba(63,191,127,.14);border-color:var(--green);}
.opt.wrong{background:rgba(226,88,79,.14);border-color:var(--red);}
.opt.locked{cursor:default;}
.explain{background:var(--bg2);border-radius:10px;padding:12px 14px;margin:10px 0 16px;font-size:.87rem;
  color:#c9cedb;border:1px solid var(--border);line-height:1.5;}
.explain b{color:var(--accent);}
.qfooter{display:flex;justify-content:space-between;gap:10px;margin-top:6px;}
.endstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0;}
.stat{background:var(--card2);border-radius:10px;padding:14px 8px;text-align:center;border:1px solid var(--border);}
.stat .num{font-family:Georgia,serif;font-size:1.5rem;color:var(--accent);}
.stat .lab{font-size:.72rem;color:var(--muted);margin-top:2px;}
.diffrow{display:flex;gap:8px;margin:14px 0;}
.diffbox{flex:1;background:var(--card2);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border);}
.diffbox .n{font-size:1.1rem;font-weight:700;}
.review-item{background:var(--card2);border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--border);}
.review-item .qh{font-size:.9rem;margin-bottom:6px;}
.review-item .status{font-size:.7rem;padding:2px 8px;border-radius:20px;margin-bottom:6px;display:inline-block;}
.status.skip{background:#3a3220;color:#d9a441;}
.status.miss{background:#3a2422;color:#e2584f;}
.backlink{color:var(--muted);font-size:.85rem;cursor:pointer;margin-bottom:10px;display:inline-block;}
.backlink:hover{color:var(--accent2);}
.footer-note{color:var(--muted);font-size:.75rem;text-align:center;margin-top:24px;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#2c3140;border-radius:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= QUESTION BANK ============================= */
const TOPICS = {
  mord:{n:"MoRD — Introduction & Mandate"},
  nrlm:{n:"DAY-NRLM"},
  ddugky:{n:"DDU-GKY"},
  pmgsy:{n:"PMGSY & NRIDA"},
  pmayg:{n:"PMAY-G"},
  nsap:{n:"NSAP"},
  dolr:{n:"DoLR, SVAMITVA & Mission Antyodaya"},
  misc:{n:"Recent Developments & Misc"}
};
/* ty: 1 numbered-statement, 2 scenario, 3 not-among-list, 4 acronym, 5 pick-correct, 6 figure-recall
   df: difficulty E/M/H  |  a: 0-based correct index into o[] */
const Q = [
/* ---------------- MoRD (10) ---------------- */
{t:'mord',ty:1,df:'E',cx:"Read the following statements about the Ministry of Rural Development (MoRD).",
 qq:"1. The Ministry's main focus areas include skilling rural youth and empowering rural women.\n2. The District Collector is the nodal officer for MoRD schemes, with monthly review meetings chaired by the concerned MLA.\n3. Rao Birender Singh was the first Union Cabinet Minister for Rural Development, taking office on 23 January 1982.\n\nWhich of the above statements is/are correct?",
 o:["1 and 2","1 and 3","2 and 3","All of the above","None of the above"],a:1,
 ex:"Statement 2 is wrong — the monthly review meetings are chaired by the concerned <b>MP</b>, not the MLA, with Gram Panchayat heads invited."},
{t:'mord',ty:4,df:'E',cx:"",
 qq:"The Ministry of Rural Development was renamed on 23 January 1982 from which earlier ministry?",
 o:["Ministry of Rural Reconstruction","Ministry of Village Development","Ministry of Panchayati Raj and Rural Welfare","Ministry of Rural Affairs","Ministry of Community Development"],a:0,
 ex:"MoRD was created and renamed from the <b>Ministry of Rural Reconstruction</b> on 23 January 1982, when Rao Birender Singh took charge."},
{t:'mord',ty:5,df:'M',cx:"",
 qq:"Pick the one CORRECT statement about MoRD's institutional review mechanism.",
 o:["The District Collector is the nodal officer, with monthly review meetings chaired by the concerned MP.","The District Collector is the nodal officer, with monthly review meetings chaired by the Chief Minister.","The Block Development Officer is the nodal officer, with weekly review meetings chaired by the MP.","The Gram Panchayat head is the nodal officer, with monthly review meetings chaired by the District Collector.","The District Magistrate is the nodal officer, with quarterly review meetings chaired by the MP."],a:0,
 ex:"As per the document, the District Collector is the nodal officer and monthly review meetings are chaired by the concerned MP, with Gram Panchayat heads invited."},
{t:'mord',ty:6,df:'E',cx:"",
 qq:"In what year was the Ministry of Rural Development officially created via renaming, per the document?",
 o:["1978","1982","1985","1996","2000"],a:1,
 ex:"MoRD was officially created (renamed) on 23 January <b>1982</b>."},
{t:'mord',ty:3,df:'M',cx:"MoRD's document lists its 'Main focus areas'.",
 qq:"Which of the following is NOT one of MoRD's stated Main focus areas?",
 o:["Skilling rural youth and increasing livelihood opportunities","Empowering rural women and expanding livelihood opportunities","Providing a social safety net and undertaking infrastructure development","Promoting urban-rural migration through skill certification","Sustainable and resilient development of rural areas using multi-pronged strategies"],a:3,
 ex:"'Promoting urban-rural migration through skill certification' is fabricated — it is not among MoRD's four stated focus areas."},
{t:'mord',ty:1,df:'M',cx:"Read the following statements about MoRD's objectives and governance structure.",
 qq:"1. Raising institutions of the poor and forging partnerships with PRIs is one of MoRD's main objectives.\n2. MoRD's vision aims for sustainable and inclusive growth of rural India through poverty eradication strategies.\n3. Under MoRD's mandate, the Block Development Officer chairs monthly review meetings with Gram Panchayat heads invited.\n\nWhich of the above statements is/are correct?",
 o:["1 and 2","1 and 3","2 and 3","All of the above","None of the above"],a:0,
 ex:"Statement 3 is incorrect — monthly review meetings are chaired by the concerned MP, not the Block Development Officer."},
{t:'mord',ty:5,df:'M',cx:"",
 qq:"Pick the one CORRECT statement about MoRD's review mechanism.",
 o:["Monthly review meetings are chaired by the concerned MP, with Gram Panchayat heads invited.","Monthly review meetings are chaired by the District Collector, with Zilla Parishad heads invited.","Weekly review meetings are chaired by the concerned MLA, with Block heads invited.","Monthly review meetings are chaired by the Secretary, Rural Development, with Sarpanch invited.","Annual review meetings are chaired by the concerned MP, with Gram Sabha invited."],a:0,
 ex:"Correct as per the document: monthly review meetings chaired by the concerned MP, Gram Panchayat heads invited."},
{t:'mord',ty:1,df:'H',cx:"Read the following statements about MoRD's main objectives.",
 qq:"1. Objective (i) is uplifting deprived rural households through multidimensional support with a saturation approach.\n2. Objective (ii) is convergence of programmes and schemes.\n3. Objective (iv) is raising institutions of the poor and forging partnerships with PRIs.\n\nWhich of the above statements is/are correct?",
 o:["1 and 2","1 and 3","2 and 3","All of the above","None of the above"],a:0,
 ex:"Statement 3 is incorrect — objective (iv) is 'integrated and sustained monitoring of measurable outcomes'; raising institutions of the poor is objective (iii)."},
{t:'mord',ty:6,df:'E',cx:"",
 qq:"Rao Birender Singh took office as the first Union Cabinet Minister for Rural Development on which date?",
 o:["23 January 1982","15 August 1982","1 April 1982","26 January 1982","2 October 1982"],a:0,
 ex:"He took office on <b>23 January 1982</b>, the date MoRD was created."},
{t:'mord',ty:3,df:'H',cx:"MoRD's scheme timeline table lists several flagship schemes with their launch years (NSAP-1995, PMGSY-2000, MGNREGA-2005, PMAY-G-2011, DAY-NRLM-2011, DDU-GKY-2014, RSETI-2016, SPMRM-2016, VB-G RAM G-2020).",
 qq:"Which of the following scheme–launch year pairings is NOT correct, as per MoRD's scheme timeline?",
 o:["MGNREGA – 2005","DDU-GKY – 2014","PMAY-G – 2011","SPMRM – 2016","VB-G RAM G – 2018"],a:4,
 ex:"VB-G RAM G (Viksit Bharat-Guarantee for Rozgar & Aajeevika Mission) was launched in <b>2020</b>, not 2018."},

/* ---------------- DAY-NRLM (45) ---------------- */
{t:'nrlm',ty:1,df:'E',cx:"DAY-NRLM, MoRD's flagship rural livelihoods mission, was restructured from an earlier programme.",
 qq:"1. DAY-NRLM was launched by restructuring SGSY with effect from 1 April 2013.\n2. It was renamed DAY-NRLM with effect from 29 March 2016.\n3. The programme originated from the recommendations of the Committee on Credit Related Issues under SGSY, chaired by Prof. Radhakrishna.\n\nWhich of the above statements is/are correct?",
 o:["Only 1","1 and 2","2 and 3","All of the above","None of the above"],a:3,
 ex:"All three statements are correct as per the document."},
{t:'nrlm',ty:6,df:'E',cx:"",qq:"DAY-NRLM is supported by the World Bank with a credit of:",
 o:["USD 500 million","USD 1 Billion","USD 2 Billion","USD 750 million","USD 1.5 Billion"],a:1,
 ex:"DAY-NRLM is supported by a World Bank credit of <b>USD 1 Billion</b>."},
{t:'nrlm',ty:5,df:'E',cx:"",qq:"Pick the one CORRECT statement about DAY-NRLM's Centre:State funding pattern.",
 o:["All States (general) 60:40; NE States & Sikkim 90:10; UTs 100% Centre.","All States 70:30; NE States & Sikkim 90:10; UTs 100% Centre.","All States 60:40; NE States & Sikkim 80:20; UTs 100% Centre.","All States 60:40; NE States & Sikkim 90:10; UTs 90:10.","All States 50:50; NE States & Sikkim 90:10; UTs 100% Centre."],a:0,
 ex:"Correct funding pattern: 60:40 (general), 90:10 (NE & Sikkim), 100% Centre (UTs)."},
{t:'nrlm',ty:3,df:'M',cx:"DAY-NRLM's Four Core Components are: Social mobilisation & community institutions; Financial inclusion of the rural poor; Sustainable livelihoods; Social inclusion, development & convergence.",
 qq:"Which of the following is NOT one of DAY-NRLM's Four Core Components?",
 o:["Social mobilisation and promotion of sustainable community institutions","Financial inclusion of the rural poor","Sustainable livelihoods","Digital literacy and e-governance training","Social inclusion, development and convergence"],a:3,
 ex:"'Digital literacy and e-governance training' is fabricated — the four real components are mobilisation, financial inclusion, livelihoods, and social inclusion/convergence."},
{t:'nrlm',ty:1,df:'M',cx:"Read the following statements about DAY-NRLM's institutional architecture.",
 qq:"1. SHGs federate into Village Organisations (VOs) and then Cluster Level Federations (CLFs).\n2. Minimum SHG membership is 10–20 members, reduced to 5 for special SHGs in difficult/remote tribal areas or for persons with disability.\n3. Men are allowed as regular members in all SHGs formed under DAY-NRLM.\n\nWhich of the above statements is/are correct?",
 o:["1 and 2","1 and 3","2 and 3","All of the above","None of the above"],a:0,
 ex:"Statement 3 is incorrect — men are allowed only in special categories (persons with disabilities, elders, transgenders), not as regular members."},
{t:'nrlm',ty:2,df:'M',cx:"Consider the following individuals under DAY-NRLM's SHG membership norms.",
 qq:"1. Meena, a woman from a difficult/remote tribal area, wants to join a special SHG with only 6 members.\n2. Suresh, an adult male with no disability, wants to be a regular member of a general SHG.\n3. Kiran, a transgender person, wants to join an SHG.\n\nWho among the above can be validly included as per DAY-NRLM norms?",
 o:["1 and 2","1 and 3","2 and 3","All of the above","None of the above"],a:1,
 ex:"Suresh cannot be a regular member — men are allowed only in special categories (PwD, elders, transgenders). Special SHGs need a minimum of 5 members, so Meena's group of 6 qualifies; Kiran (transgender) is an allowed special category."},
{t:'nrlm',ty:6,df:'M',cx:"",qq:"The one-time Revolving Fund (RF) provided per eligible SHG under DAY-NRLM ranges between:",
 o:["Rs 10,000–15,000","Rs 20,000–30,000","Rs 25,000–50,000","Rs 15,000–25,000","Rs 30,000–50,000"],a:1,
 ex:"The Revolving Fund is <b>Rs 20,000–30,000</b>, one-time per eligible SHG."},
{t:'nrlm',ty:6,df:'M',cx:"",qq:"The Community Investment Fund (CIF) under DAY-NRLM can go up to how much per eligible SHG?",
 o:["Rs 1 lakh","Rs 1.5 lakh","Rs 2 lakh","Rs 2.5 lakh","Rs 3 lakh"],a:3,
 ex:"CIF can be up to <b>Rs 2.5 lakh</b> per eligible SHG, routed through federations."},
{t:'nrlm',ty:1,df:'H',cx:"Read the following statements on DAY-NRLM's bank lending norms.",
 qq:"1. SHGs must be active for at least 6 months (per books, not S/B account date) to be eligible for bank credit linkage.\n2. For CCL, a minimum of Rs 6 lakh is sanctioned for a period of 3 years.\n3. Revived defunct SHGs become eligible for financing only after 12 months of renewed activity.\n\nWhich of the above statements is/are INCORRECT?",
 o:["Only 1","Only 2","Only 3","1 and 2","All of the above"],a:2,
 ex:"Statement 3 is wrong — revived defunct SHGs are eligible after <b>3 months</b> of activity, not 12 months."},
{t:'nrlm',ty:5,df:'H',cx:"",qq:"Pick the one CORRECT statement on the SHG loan dose progression under the RBI Master Circular on DAY-NRLM.",
 o:["First dose: 6× corpus or ₹1.5 lakh, whichever is higher (subject to minimum).","Second dose: 8× corpus or ₹3 lakh minimum.","Third dose: minimum ₹4 lakh.","Fourth dose onwards: fixed at ₹6 lakh regardless of MCP.","First dose: 10× corpus or ₹2 lakh minimum."],a:1,
 ex:"Second dose is 8× corpus or ₹3 lakh minimum, whichever is higher."},
{t:'nrlm',ty:6,df:'H',cx:"An SHG has a corpus (group savings + grants) of ₹50,000.",
 qq:"As per the illustrative dosage table, what loan amounts is it eligible for in Year 1 and Year 2 respectively?",
 o:["₹3,00,000 in Year 1 and ₹4,00,000 in Year 2","₹1,50,000 in Year 1 and ₹3,00,000 in Year 2","₹3,00,000 in Year 1 and ₹6,00,000 in Year 2","₹6,00,000 in Year 1 and ₹6,00,000 in Year 2","₹1,50,000 in Year 1 and ₹6,00,000 in Year 2"],a:0,
 ex:"6×₹50,000=₹3,00,000 (Year 1, exceeds the ₹1.5 lakh minimum); 8×₹50,000=₹4,00,000 (Year 2, exceeds the ₹3 lakh minimum)."},
{t:'nrlm',ty:6,df:'M',cx:"",qq:"For SHG loans up to ₹10 lakh under DAY-NRLM, what collateral/margin is required?",
 o:["No collateral, no margin","10% margin only","Collateral required, no margin","No collateral but 10% margin","Full collateral and 10% margin"],a:0,
 ex:"Loans up to ₹10 lakh require <b>no collateral and no margin</b>; no lien on SHG savings accounts."},
{t:'nrlm',ty:1,df:'M',cx:"Read the following statements about SHG loans above ₹10 lakh under DAY-NRLM.",
 qq:"1. No collateral is required for such loans.\n2. They are covered under the Credit Guarantee Fund for Micro Units (CGFMU).\n3. A margin exceeding 15% of the amount above ₹10 lakh may be obtained.\n\nWhich of the above statements is/are correct?",
 o:["1 and 2","1 and 3","2 and 3","All of the above","None of the above"],a:0,
 ex:"Statement 3 is wrong — the margin must not exceed <b>10%</b> of the amount above ₹10 lakh, not 15%."},
{t:'nrlm',ty:6,df:'M',cx:"",qq:"As per DAY-NRLM norms, what minimum share of loans above ₹6 lakh must go toward income-generating activities?",
 o:["50%","60%","75%","85%","100%"],a:3,
 ex:"At least <b>85%</b> of loans above ₹6 lakh must go to income-generating activities (50% above ₹1 lakh, 75% above ₹4 lakh)."},
{t:'nrlm',ty:6,df:'M',cx:"",qq:"Repayment tenure for the fourth dose onwards under DAY-NRLM SHG bank loans ranges up to:",
 o:["24–36 months","36–48 months","48–60 months","60–84 months","84–96 months"],a:3,
 ex:"Repayment tenures range from 24–36 months (first dose) up to <b>60–84 months</b> (fourth dose onwards)."},
{t:'nrlm',ty:6,df:'E',cx:"",qq:"Under the Interest Subvention Scheme FY2025-26, women SHG loans up to ₹3 lakh are extended at a concessional rate of:",
 o:["4%","5%","6%","7%","8%"],a:3,
 ex:"Loans up to ₹3 lakh are extended at a concessional <b>7% p.a.</b>, with 4.5% p.a. subvention."},
{t:'nrlm',ty:1,df:'M',cx:"Read the following statements on the Interest Subvention Scheme FY2025-26.",
 qq:"1. For loans up to ₹3 lakh, banks are reimbursed at a uniform subvention of 4.5% p.a.\n2. For loans above ₹3 lakh up to ₹5 lakh, subvention is provided at 5% p.a.\n3. Indian Bank is the Nodal Bank for the Interest Subvention Scheme for FY2025-26.\n\nWhich of the above statements is/are correct?",
 o:["Only 1","1 and 2","2 and 3","All of the above","None of the above"],a:3,
 ex:"All three statements are correct."},
{t:'nrlm',ty:6,df:'H',cx:"",qq:"As per the RBI Master Circular, all FY2025-26 interest subvention claims under DAY-NRLM must be submitted by:",
 o:["31 March 2026","30 June 2026","30 September 2026","31 December 2026","31 October 2026"],a:2,
 ex:"Claims must be submitted by <b>30 September 2026</b>, with statutory auditor certification for the March-end claim."},
{t:'nrlm',ty:2,df:'H',cx:"Consider the following applicants under DAY-NRLM's Women Enterprise Acceleration Fund (WEAF, Annex III).",
 qq:"1. Sunita, an individual woman entrepreneur from an SHG, wants credit guarantee fee reimbursement for a ₹4 lakh loan — her first time availing this benefit.\n2. Radha wants to avail this same reimbursement benefit for a second time, on a fresh loan.\n3. Kavita wants a 2% interest subvention on prompt repayment for an outstanding loan of ₹1.2 lakh.\n\nWho among the above is eligible under WEAF provisions?",
 o:["1 and 2","1 and 3","2 and 3","All of the above","None of the above"],a:1,
 ex:"Each WEAF benefit is available only <b>once per individual</b> — so Radha (2nd time) is not eligible. Sunita and Kavita both meet the criteria."},
{t:'nrlm',ty:6,df:'M',cx:"",qq:"Under WEAF, the 2% interest subvention on prompt repayment is capped on an outstanding loan up to:",
 o:["₹1 lakh","₹1.5 lakh","₹2 lakh","₹2.5 lakh","₹5 lakh"],a:1,
 ex:"The 2% subvention applies on an outstanding loan up to <b>₹1.5 lakh</b>, for up to 3 years."},
{t:'nrlm',ty:4,df:'E',cx:"",qq:"What does 'CIF' stand for under DAY-NRLM's financial support structure?",
 o:["Community Investment Fund","Cluster Investment Facility","Capital Inclusion Fund","Community Infrastructure Fund","Collective Investment Fund"],a:0,
 ex:"CIF = <b>Community Investment Fund</b>."},
{t:'nrlm',ty:4,df:'E',cx:"",qq:"MKSP, the women-in-agriculture initiative under DAY-NRLM, stands for:",
 o:["Mahila Kisan Sashaktikaran Pariyojana","Mahila Krishi Sahyog Pariyojana","Mahila Kisan Samvardhan Pariyojana","Mahila Krishak Sashaktikaran Pariyojana","Mahila Kisan Sashaktikaran Programme"],a:0,
 ex:"MKSP = <b>Mahila Kisan Sashaktikaran Pariyojana</b>, launched 2010-11."},
{t:'nrlm',ty:3,df:'M',cx:"DAY-NRLM's farm livelihoods CRPs include: Krishi Sakhi, Pashu Sakhi, Udyog Sakhi, Van Sakhi, Matsya Sakhi.",
 qq:"Which of the following is NOT among the named livelihoods CRPs under DAY-NRLM's farm interventions?",
 o:["Krishi Sakhi","Pashu Sakhi","Van Sakhi","Bima Sakhi","Matsya Sakhi"],a:3,
 ex:"'Bima Sakhi' relates to the insurance/financial-inclusion strand (Bima Vaahak/Bima Vistaar), not the farm livelihoods CRP list."},
{t:'nrlm',ty:6,df:'M',cx:"",qq:"How many lakh livelihoods CRPs (Krishi Sakhi, Pashu Sakhi, etc.) have been trained and deployed under DAY-NRLM?",
 o:["2.08 lakh","3.08 lakh","4.08 lakh","5.08 lakh","6.08 lakh"],a:2,
 ex:"<b>4.08 lakh</b> livelihoods CRPs trained and deployed, through a three-tier model (NRPs train SRPs, who train CRPs)."},

/* ---------------- DDU-GKY (30) ---------------- */
{t:'ddugky',ty:1,df:'E',cx:"DDU-GKY, launched on Antyodaya Diwas, operates under the DAY-NRLM umbrella.",
 qq:"1. DDU-GKY was launched on 25 September 2014.\n2. It is a Centrally Sponsored, demand-driven, placement-linked rural skilling scheme.\n3. DDU-GKY 2.0 guidelines were notified in 2023 and rolled out from FY2023-24.\n\nWhich of the above statements is/are correct?",
 o:["1 and 2","1 and 3","2 and 3","All of the above","None of the above"],a:0,
 ex:"Statement 3 is wrong — DDU-GKY 2.0 guidelines were notified in <b>2025</b> and rolled out from <b>FY2025-26</b>."},
{t:'ddugky',ty:4,df:'E',cx:"",qq:"DDU-GKY's current portal, which replaced the old DDU-GKY portal, is called:",
 o:["Kaushal Bharat Portal","Skill India Portal","Rozgar Bharat Portal","Kaushal Vikas Portal","DDU Digital Portal"],a:0,
 ex:"The <b>Kaushal Bharat Portal</b> (kaushal.rural.gov.in) replaced the old DDU-GKY portal."},
{t:'ddugky',ty:6,df:'E',cx:"",qq:"What is the general age eligibility range for DDU-GKY beneficiaries?",
 o:["14–32 years","15–35 years","18–35 years","15–40 years","16–35 years"],a:1,
 ex:"General age eligibility is <b>15–35 years</b>, extended to 45 for special groups."},
{t:'ddugky',ty:1,df:'E',cx:"Read the following statements about DDU-GKY's age eligibility.",
 qq:"1. The age limit is extended to 45 years for women.\n2. The age limit is extended to 45 years for PVTGs and PwDs.\n3. School/college dropouts are NOT eligible under DDU-GKY 2.0.\n\nWhich of the above statements is/are INCORRECT?",
 o:["Only 1","Only 2","Only 3","1 and 2","All of the above"],a:2,
 ex:"Statement 3 is wrong — school/college dropouts are explicitly eligible under DDU-GKY 2.0."},
{t:'ddugky',ty:2,df:'M',cx:"Consider the following candidates seeking DDU-GKY eligibility documents.",
 qq:"1. Ramesh, who holds a BPL Card.\n2. Suresh, who holds only a landline telephone connection proof.\n3. Geeta, who is a family member of an SHG member.\n\nWho among the above satisfies the identification-document criteria for DDU-GKY?",
 o:["1 and 2","1 and 3","2 and 3","All of the above","None of the above"],a:1,
 ex:"A landline connection is not an accepted DDU-GKY identification document. Ramesh (BPL Card) and Geeta (family member of SHG member) both qualify."},
{t:'ddugky',ty:3,df:'M',cx:"DDU-GKY's accepted identification documents (any one): BPL Card, AAY Card, RSBY Card, SHG-member family, MGNREGA worker (≥15 days in last 12 months), NRLM-SHG certificate, Birth Certificate.",
 qq:"Which of the following is NOT among the accepted identification documents for DDU-GKY?",
 o:["BPL Card","AAY Card","Aadhaar Card alone","Birth Certificate","RSBY Card"],a:2,
 ex:"'Aadhaar Card alone' is not listed as a valid identification document for DDU-GKY eligibility."},
