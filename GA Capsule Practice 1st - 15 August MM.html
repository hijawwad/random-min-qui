","explanation":"The Ramsar Convention came into force in 1975, while India joined on 1 February 1982 — after, not before, the Convention came into force."},{"id":93,"section":"Nasha Mukt Yuva Abhiyan","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the 'Nasha Mukt Yuva for Viksit Bharat Sankalp Abhiyan' is correct?","options":[["A","The campaign is a one-time, single-day national event."],["B","Nasha Mukt Bharat Abhiyan, the parent programme, was launched in August 2022."],["C","It is a 100-week campaign held every Sunday."],["D","The pilot for this campaign began in New Delhi in 2024."],["E","The parent programme is run by the Ministry of Youth Affairs and Sports."]],"correct":"C","explanation":"The pilot began in Kashi, Uttar Pradesh in 2025 (not New Delhi in 2024). Nasha Mukt Bharat Abhiyan was launched in August 2020 (not 2022) by the Ministry of Social Justice and Empowerment (not Youth Affairs and Sports)."},{"id":94,"section":"Nasha Mukt Yuva Abhiyan","type":"numbered","difficulty":"Moderate","context":"1. The campaign began as a pilot project in Kashi, Uttar Pradesh, in 2025.\n2. Through a nationwide video conference, the PM addressed more than 1 crore young people from over 28,000 locations.\n3. More than 125 spiritual organisations supported the campaign under the Kashi Declaration.\n4. Nasha Mukt Bharat Abhiyan, the parent initiative, was launched in August 2020 under NAPDDR.\n5. The campaign duration is 52 weeks, running every Sunday for a year.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","All of the above"],["C","1, 3 and 5"],["D","1, 2, 3 and 4"],["E","2, 4 and 5"]],"correct":"D","explanation":"Statement 5 is incorrect — the campaign duration is 100 weeks, not 52 weeks."},{"id":95,"section":"Nasha Mukt Yuva Abhiyan","type":"acronym","difficulty":"Moderate","stem":"NAPDDR, under which the Nasha Mukt Bharat Abhiyan was launched, stands for:","options":[["A","National Action Plan for Drug Detection and Reduction"],["B","National Action Plan for Drug Distribution Regulation"],["C","National Awareness Programme for Drug Demand Reduction"],["D","National Anti-Drug Programme for Development and Reduction"],["E","National Action Plan for Drug Demand Reduction"]],"correct":"E","explanation":"NAPDDR stands for National Action Plan for Drug Demand Reduction."},{"id":96,"section":"Nasha Mukt Yuva Abhiyan","type":"figure","difficulty":"Easy","stem":"The PM addressed more than how many young people, from how many locations, at the launch of this campaign?","options":[["A","1 crore; 28,000 locations"],["B","50 lakh; 28,000 locations"],["C","2 crore; 28,000 locations"],["D","1 crore; 25,000 locations"],["E","1 crore; 18,000 locations"]],"correct":"A","explanation":"The PM addressed more than 1 crore young people connected from over 28,000 locations."},{"id":97,"section":"Satish Gujral Commemorative Stamp","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the Satish Gujral commemorative stamp is correct?","options":[["A","The stamp has a face value of ₹10."],["B","The stamp marks the birth centenary of Padma Vibhushan Satish Gujral and was unveiled by Union Minister Jyotiraditya M. Scindia."],["C","The stamp was designed by Union Minister Jyotiraditya M. Scindia himself."],["D","Satish Gujral lived from 1930 to 2020."],["E","Satish Gujral was honoured with the Bharat Ratna in 1999."]],"correct":"B","explanation":"Satish Gujral was honoured with the Padma Vibhushan (not Bharat Ratna) in 1999. The stamp was designed by Anuj Kumar, not the Minister. Its face value is ₹5, not ₹10. Gujral lived from 1925 to 2020."},{"id":98,"section":"Satish Gujral Commemorative Stamp","type":"figure","difficulty":"Easy","stem":"What is the face value of the commemorative stamp issued for Satish Gujral's birth centenary, and in which year was he awarded the Padma Vibhushan?","options":[["A","₹10; 1999"],["B","₹5; 2001"],["C","₹5; 1999"],["D","₹5; 1989"],["E","₹15; 1995"]],"correct":"C","explanation":"The stamp has a face value of ₹5, and Satish Gujral was awarded the Padma Vibhushan in 1999."},{"id":99,"section":"SC on Third-Party Vehicle Insurance","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the Supreme Court's ruling on third-party vehicle insurance is correct?","options":[["A","IRDAI was established in 2000 under the Insurance Act."],["B","The extended period applies retrospectively to all existing vehicles."],["C","The bench was headed by the Chief Justice of India along with Justice Sanjay Karol."],["D","The Supreme Court extended mandatory third-party insurance cover to 4 years for new cars and 6 years for new two-wheelers."],["E","The Court mandated an immediate nationwide 'No Insurance, No Fuel' policy."]],"correct":"D","explanation":"The bench comprised Justice Sanjay Karol and Justice Prashant Kumar Mishra (not the CJI). IRDAI was set up in 1999 under the IRDA Act, 1999. The Court only asked IRDAI and MoRTH to EXAMINE a possible pilot for 'No Insurance, No Fuel', not mandate it immediately."},{"id":100,"section":"SC on Third-Party Vehicle Insurance","type":"numbered","difficulty":"Moderate","context":"1. New cars now require a mandatory third-party insurance cover period of 4 years.\n2. New two-wheelers require a mandatory cover period of 6 years.\n3. The decision was delivered by a bench comprising Justice Sanjay Karol and Justice Prashant Kumar Mishra.\n4. The Court directed IRDAI and MoRTH to examine a pilot for 'No Insurance, No Fuel' at petrol pumps.\n5. IRDAI is headquartered in New Delhi.","stem":"Which of the above statements are correct?","options":[["A","1, 3 and 5"],["B","2, 4 and 5"],["C","All of the above"],["D","1, 2 and 3"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is incorrect — IRDAI is headquartered in Hyderabad, Telangana, not New Delhi."},{"id":101,"section":"SC on Third-Party Vehicle Insurance","type":"acronym","difficulty":"Easy","stem":"IRDAI, asked by the Supreme Court to examine a 'No Insurance, No Fuel' pilot, stands for:","options":[["A","Insurance Regulatory and Development Authority of India"],["B","Indian Regulatory and Development Authority for Insurance"],["C","Insurance Reform and Development Authority of India"],["D","Insurance Regulatory and Deposit Authority of India"],["E","Insurance Regulation and Development Authority of India"]],"correct":"A","explanation":"IRDAI stands for Insurance Regulatory and Development Authority of India."},{"id":102,"section":"Vande Mataram Protection Law","type":"statement","difficulty":"Hard","stem":"Which one of the following statements about the new Vande Mataram protection law is correct?","options":[["A","Vande Mataram was adopted as India's National Anthem by the Constituent Assembly in 1950."],["B","The law, amending Section 3 of the Prevention of Insults to National Honour Act, 1971, prescribes up to 3 years' imprisonment for disrupting the singing of Vande Mataram."],["C","Repeated offenders under this law face a maximum of 1 year imprisonment."],["D","Vande Mataram was composed by Rabindranath Tagore in 1875."],["E","The MHA order mandates only the first two stanzas be sung at official functions."]],"correct":"B","explanation":"Vande Mataram was composed by Bankim Chandra Chattopadhyay (not Tagore) in 1875. It was adopted as the National Song (not Anthem). The MHA order mandates all six stanzas be sung. Repeated offenders face a MINIMUM (not maximum) of 1 year imprisonment as an enhanced penalty."},{"id":103,"section":"Vande Mataram Protection Law","type":"numbered","difficulty":"Moderate","context":"1. Vande Mataram was composed in Sanskrit by Bankim Chandra Chattopadhyay in November 1875.\n2. It was first sung by Rabindranath Tagore at the 1896 Congress Session in Calcutta.\n3. It was adopted as India's National Song by the Constituent Assembly in 1950.\n4. As per the MHA order, when both the National Song and National Anthem are performed, the National Anthem is sung first.\n5. All six stanzas of Vande Mataram take about 3 minutes and 10 seconds to sing.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 4"],["B","1, 4 and 5"],["C","1, 2, 3 and 5"],["D","2, 3 and 4"],["E","All of the above"]],"correct":"C","explanation":"Statement 4 is incorrect — Vande Mataram is sung first when both are performed, not the National Anthem."},{"id":104,"section":"Vande Mataram Protection Law","type":"numbered","difficulty":"Moderate","context":"1. Preventing the singing of Vande Mataram, or causing disturbance during its singing, is now a criminal offence.\n2. The punishment for a first offence can extend up to 3 years' imprisonment.\n3. A repeated offence attracts a minimum of one year's imprisonment as an enhanced penalty.\n4. This legislation amends Section 5 of the Prevention of Insults to National Honour Act, 1971.\n5. The legislation places the National Song on the same legal footing as the National Anthem.","stem":"Which of the above statements are correct?","options":[["A","2, 3 and 4"],["B","1, 2 and 4"],["C","All of the above"],["D","1, 2, 3 and 5"],["E","1, 4 and 5"]],"correct":"D","explanation":"Statement 4 is incorrect — the legislation amends Section 3 (not Section 5) of the Prevention of Insults to National Honour Act, 1971."},{"id":105,"section":"Vande Mataram Protection Law","type":"figure","difficulty":"Moderate","stem":"The MHA order on the official protocol for singing Vande Mataram was issued on which date, and what is the duration of all six stanzas?","options":[["A","26 January; 3 minutes 10 seconds"],["B","15 August; 3 minutes 10 seconds"],["C","28 January; 2 minutes 30 seconds"],["D","28 February; 3 minutes 10 seconds"],["E","28 January; 3 minutes 10 seconds"]],"correct":"E","explanation":"The MHA order was issued on 28 January, and all six stanzas take 3 minutes and 10 seconds to sing."},{"id":106,"section":"Vande Mataram Protection Law","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements is NOT correct?","options":[["A","The new law makes disrupting Vande Mataram punishable only by a fine, without imprisonment."],["B","Bankim Chandra Chattopadhyay composed Vande Mataram in Sanskrit in November 1875."],["C","The Constituent Assembly adopted Vande Mataram as the National Song in 1950."],["D","The legislation gives the National Song the same legal status as the National Anthem."],["E","Vande Mataram was first sung by Rabindranath Tagore at the 1896 Indian National Congress session in Calcutta."]],"correct":"A","explanation":"The punishment prescribed is imprisonment of up to 3 years (with an enhanced minimum of 1 year for repeat offences), not merely a fine."},{"id":107,"section":"Venezuela Quits ICC","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Venezuela's exit from the ICC is correct?","options":[["A","The ICC only prosecutes crimes committed by state actors, not individuals."],["B","Venezuela has officially informed the United Nations of its decision to leave the Rome Statute that created the ICC."],["C","The ICC is headquartered in Geneva, Switzerland."],["D","The ICC came into force in 1998 upon adoption of the Rome Statute."],["E","Venezuela cited financial constraints as its reason for leaving the ICC."]],"correct":"B","explanation":"The Rome Statute was adopted in 1998 but came into force in 2002. Venezuela cited alleged geographical bias (not financial constraints). The ICC is headquartered in The Hague, Netherlands, and it prosecutes individuals, not states."},{"id":108,"section":"Venezuela Quits ICC","type":"numbered","difficulty":"Moderate","context":"1. Venezuela's government claims the ICC has shown geographical bias against African and Latin American nations.\n2. The ICC is an independent court created by the Rome Statute, which came into force in 2002.\n3. The ICC prosecutes genocide, crimes against humanity, war crimes and the crime of aggression.\n4. The ICC's headquarters is located in The Hague, Netherlands.\n5. Venezuela is the founding member that hosted the original Rome Statute negotiations.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","1, 3 and 5"],["C","1, 2, 3 and 4"],["D","All of the above"],["E","2, 4 and 5"]],"correct":"C","explanation":"Statement 5 is fabricated and not supported by the passage."},{"id":109,"section":"Venezuela Quits ICC","type":"notamong","difficulty":"Moderate","stem":"Which of the following is NOT among the crimes prosecuted by the ICC, as per the passage?","options":[["A","Crime of aggression"],["B","War crimes"],["C","Crimes against humanity"],["D","Economic espionage"],["E","Genocide"]],"correct":"D","explanation":"The ICC prosecutes genocide, crimes against humanity, war crimes and the crime of aggression. 'Economic espionage' is not among these."},{"id":110,"section":"Venezuela Quits ICC","type":"acronym","difficulty":"Easy","stem":"ICC, which Venezuela has decided to leave, stands for:","options":[["A","International Court of Crimes"],["B","International Criminal Council"],["C","International Crime Commission"],["D","International Court of Criminal Cases"],["E","International Criminal Court"]],"correct":"E","explanation":"ICC stands for International Criminal Court."},{"id":111,"section":"UNESCO World Heritage Committee (48th Session)","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the 48th session of the UNESCO World Heritage Committee is correct?","options":[["A","The session was held at BEXCO in Busan, South Korea, chaired by Lee Byong Hyun."],["B","The next session of the WHC will be hosted in Paris, France in 2027."],["C","The total number of World Heritage Sites after the 48th session stands at 1,173."],["D","The session added 30 new sites to the World Heritage List in 2026."],["E","The World Heritage Convention was adopted in 1982."]],"correct":"A","explanation":"25 (not 30) new sites were added. The next session will be in Istanbul, Türkiye (not Paris). The World Heritage Convention was adopted in 1972 (not 1982). The total after the session is 1,273 sites (not 1,173)."},{"id":112,"section":"UNESCO World Heritage Committee (48th Session)","type":"numbered","difficulty":"Moderate","context":"1. 25 new sites were added to the World Heritage List at the 48th session.\n2. The total number of World Heritage Sites now stands at 1,273 across 173 countries.\n3. Comoros, Sao Tome and Principe, and South Sudan achieved World Heritage Site status for the first time.\n4. The next session will be hosted in Istanbul, Türkiye in 2027.\n5. None of the newly inscribed sites in 2026 are from India.","stem":"Which of the above statements are correct?","options":[["A","1, 3 and 4"],["B","1, 2, 3 and 4"],["C","All of the above"],["D","2, 3 and 5"],["E","1, 2 and 5"]],"correct":"B","explanation":"Statement 5 is incorrect — one of the newly inscribed sites in 2026 is from India."},{"id":113,"section":"UNESCO World Heritage Committee (48th Session)","type":"notamong","difficulty":"Hard","stem":"Which of the following is NOT one of the six strategic objectives (the original five Cs plus the new sixth C) of UNESCO's heritage framework?","options":[["A","Capacity-building"],["B","Communication"],["C","Community Development"],["D","Credibility"],["E","Conservation"]],"correct":"C","explanation":"The six strategic objectives are Conservation, Credibility, Capacity-building, Communication, Communities, and (newly added) Collaboration. 'Community Development' is not among them."},{"id":114,"section":"UNESCO World Heritage Committee (48th Session)","type":"numbered","difficulty":"Moderate","context":"1. The Busan Declaration on World Heritage was adopted at the 48th session.\n2. A USD 13 million strategy for Small Island Developing States was adopted, covering 2026–2034.\n3. 'Collaboration' was introduced as the sixth strategic objective under the Busan Declaration.\n4. The five earlier Cs were Conservation, Credibility, Capacity-building, Communication and Communities.\n5. The USD 13 million SIDS strategy covers the period 2024–2032.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 2 and 3"],["C","1, 3 and 5"],["D","1, 2, 3 and 4"],["E","2, 4 and 5"]],"correct":"D","explanation":"Statement 5 is incorrect — the SIDS strategy covers 2026–2034, not 2024–2032."},{"id":115,"section":"UNESCO World Heritage Committee (48th Session)","type":"acronym","difficulty":"Easy","stem":"SIDS, referenced in the Busan Declaration's funding strategy, stands for:","options":[["A","Small Island Development Strategy"],["B","Sustainable Island Development States"],["C","South Island Developing States"],["D","Small Isolated Developing States"],["E","Small Island Developing States"]],"correct":"E","explanation":"SIDS stands for Small Island Developing States."},{"id":116,"section":"UNESCO World Heritage Committee (48th Session)","type":"figure","difficulty":"Easy","stem":"In what year was the World Heritage Convention, which the World Heritage Committee implements, adopted?","options":[["A","1972"],["B","1975"],["C","1992"],["D","1965"],["E","1982"]],"correct":"A","explanation":"The World Heritage Convention was adopted in 1972."},{"id":117,"section":"NITI Aayog Investment Friendliness Index","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the NITI Aayog Investment Friendliness Index is correct?","options":[["A","Among Large States, Maharashtra ranks first, ahead of Gujarat."],["B","The Index evaluates states/UTs across eight pillars, including Infrastructure, Business Climate and Regulatory Ease."],["C","States scoring between 40 and 50 are classified as 'Top Performers'."],["D","Goa is classified among the 'Hilly and North-Eastern States' category."],["E","The Index covers only the 28 States, excluding Union Territories."]],"correct":"B","explanation":"The Index covers all 28 States AND 8 Union Territories. 'Top Performers' score above 50 (not 40-50). Among Large States, Gujarat ranks first, ahead of Maharashtra. Goa is classified among 'City States and Union Territories', not 'Hilly and North-Eastern States'."},{"id":118,"section":"NITI Aayog Investment Friendliness Index","type":"numbered","difficulty":"Moderate","context":"1. Gujarat, Maharashtra, Tamil Nadu, Goa and Odisha were classified as 'Top Performers'.\n2. States scoring above 50 fall in the 'Top Performers' category.\n3. There are 15 states in the 'Frontrunners' category.\n4. There are 8 states/UTs each in the 'Emerging Performers' and 'Aspiring States' categories.\n5. The 'Aspiring States' category includes states scoring between 40 and 45.","stem":"Which of the above statements are correct?","options":[["A","1, 3 and 5"],["B","1, 2 and 3"],["C","1, 2, 3 and 4"],["D","2, 4 and 5"],["E","All of the above"]],"correct":"C","explanation":"Statement 5 is incorrect — 'Aspiring States' score below 40; the 40 to under-45 range is 'Emerging Performers'."},{"id":119,"section":"NITI Aayog Investment Friendliness Index","type":"notamong","difficulty":"Moderate","stem":"Which of the following is NOT one of the eight pillars of the Investment Friendliness Index?","options":[["A","Infrastructure"],["B","Resources"],["C","Government Policy"],["D","Social Inclusion"],["E","Business Climate"]],"correct":"D","explanation":"The eight pillars are Infrastructure, Business Climate, Resources, Government Policy, Regulatory Ease, Institutional Environment, Financial Health, and Environmental Resilience. 'Social Inclusion' is not among them."},{"id":120,"section":"NITI Aayog Investment Friendliness Index","type":"numbered","difficulty":"Moderate","context":"1. Among Large States, Gujarat ranks first, followed by Maharashtra and Tamil Nadu.\n2. Among Hilly and North-Eastern States, Uttarakhand ranks highest, followed by Assam and Himachal Pradesh.\n3. Among City States and Union Territories, Goa holds the top position, followed by Delhi and Chandigarh.\n4. The top three performers in the Large States category are also the top three performers in the overall Index.\n5. Sikkim ranks second among Hilly and North-Eastern States.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","All of the above"],["C","1, 3 and 5"],["D","2, 4 and 5"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is incorrect — Assam, not Sikkim, ranks second among Hilly and North-Eastern States."},{"id":121,"section":"NITI Aayog Investment Friendliness Index","type":"figure","difficulty":"Moderate","stem":"Which one of the following correctly pairs a performance category of the Investment Friendliness Index with its score range?","options":[["A","Frontrunners: 45–50"],["B","Aspiring States: 45–50"],["C","Top Performers: 40–45"],["D","Emerging Performers: Above 50"],["E","Frontrunners: Below 40"]],"correct":"A","explanation":"'Frontrunners' corresponds to a score range of 45 to 50."},{"id":122,"section":"NITI Aayog Investment Friendliness Index","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements is NOT correct?","options":[["A","Uttarakhand is ranked highest among Hilly and North-Eastern States."],["B","Delhi ranks first among City States and Union Territories."],["C","The Index covers all 28 States and 8 Union Territories of India."],["D","Emerging Performers score between 40 (inclusive) and 45 (exclusive)."],["E","Top Performers score above 50 on the Index."]],"correct":"B","explanation":"Goa, not Delhi, ranks first among City States and Union Territories; Delhi ranks second."},{"id":123,"section":"NITI Aayog Investment Friendliness Index","type":"intersection","difficulty":"Hard","context":"Consider the following states from NITI Aayog's Investment Friendliness Index:\n1. Gujarat\n2. Maharashtra\n3. Tamil Nadu\n4. Goa\n5. Odisha\n6. Uttarakhand","stem":"Which of the above are common to BOTH the 'Top Performers' category (overall Index) AND the top three ranked 'Large States'?","options":[["A","4, 5 and 6"],["B","All of the above"],["C","1, 2 and 3"],["D","1, 3 and 5"],["E","1, 2 and 4"]],"correct":"C","explanation":"Gujarat, Maharashtra and Tamil Nadu appear both among the overall 'Top Performers' and as the top three ranked Large States. Goa and Odisha are Top Performers but not Large States; Uttarakhand tops the Hilly/NE category, not Large States."},{"id":124,"section":"Market Distortions Performance Index (MDPI)","type":"acronym","difficulty":"Moderate","stem":"MDPI, on which India climbed to the 57th rank in 2023, stands for:","options":[["A","Market Development Performance Indicator"],["B","Market Distortion Policy Index"],["C","Marginal Distortions Performance Index"],["D","Market Distortions Performance Index"],["E","Market Distortions Progress Index"]],"correct":"D","explanation":"MDPI stands for Market Distortions Performance Index."},{"id":125,"section":"Market Distortions Performance Index (MDPI)","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about India's MDPI ranking is correct?","options":[["A","India's projected GDP loss from remaining market distortions is about 8% of GDP."],["B","The report reviews reforms carried out between 2015 and 2023."],["C","The MDPI evaluates countries on five core parameters."],["D","The MDPI report was released by the World Economic Forum."],["E","India ranked 57th in the MDPI 2023, marking a jump of 25 places."]],"correct":"E","explanation":"The report was released by the Competere Foundation for Trade and Competition Policy (not WEF), evaluates three (not five) core parameters, projects a loss of about 4.2% (not 8%) of GDP, and reviews reforms from 2010 to 2023 (not 2015-2023)."},{"id":126,"section":"Market Distortions Performance Index (MDPI)","type":"numbered","difficulty":"Moderate","context":"1. The MDPI evaluates performance on three core parameters: protection of property rights, level of domestic competition, and degree of international competition.\n2. Reforms are expected to generate roughly an additional 1% yearly increase in GDP per capita over the long term.\n3. Remaining market distortions are projected to cost the economy around USD 173.6 billion over the next five years.\n4. This projected cost is equal to approximately 4.2% of India's GDP.\n5. The report studies India's reform progress from 2005 to 2023.","stem":"Which of the above statements are correct?","options":[["A","1, 2, 3 and 4"],["B","1, 2 and 3"],["C","2, 4 and 5"],["D","All of the above"],["E","1, 3 and 5"]],"correct":"A","explanation":"Statement 5 is incorrect — the report studies reform progress from 2010 to 2023, not 2005 to 2023."},{"id":127,"section":"Market Distortions Performance Index (MDPI)","type":"numbered","difficulty":"Moderate","context":"1. Protection of property rights\n2. Level of domestic competition\n3. Degree of international competition\n4. Ease of tax compliance\n5. Quality of infrastructure","stem":"Which of the above are NOT among the three core parameters used by the MDPI to rank countries?","options":[["A","Only 4"],["B","4 and 5"],["C","1 and 2"],["D","Only 5"],["E","3, 4 and 5"]],"correct":"B","explanation":"The MDPI's three core parameters are protection of property rights, level of domestic competition, and degree of international competition. 'Ease of tax compliance' and 'Quality of infrastructure' are not among them."},{"id":128,"section":"Candere Hurun India Women Leaders List","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the Candere Hurun India Women Leaders List 2026 is correct?","options":[["A","Sheetal Devi is the oldest name on the list at 86 years."],["B","The list groups women under six broad pillars."],["C","The second edition of the list features 117 women with a combined valuation of ₹39 lakh crore."],["D","The number of categories decreased from 12 to 9 in this edition."],["E","Priya Nair topped the Wealth Multipliers category."]],"correct":"C","explanation":"The number of categories INCREASED from 9 to 12 (not decreased). Roshni Nadar Malhotra (not Priya Nair) topped the Wealth Multipliers category. Sheetal Devi (19) is the YOUNGEST, not oldest; Rajni Bector (86) is the oldest. The list groups women under five (not six) pillars."},{"id":129,"section":"Candere Hurun India Women Leaders List","type":"numbered","difficulty":"Moderate","context":"1. Roshni Nadar Malhotra topped the Wealth Multipliers category.\n2. Priya Nair led the Professional CEOs category.\n3. Sudha Murthy was recognised among Authors.\n4. 98 of the 117 women featured (84%) are self-made.\n5. The youngest name on the list is a Paralympic swimmer aged 17.","stem":"Which of the above statements are correct?","options":[["A","2, 4 and 5"],["B","1, 3 and 5"],["C","1, 2 and 3"],["D","1, 2, 3 and 4"],["E","All of the above"]],"correct":"D","explanation":"Statement 5 is incorrect — the youngest name is Sheetal Devi, a para-archer aged 19, not a swimmer aged 17."},{"id":130,"section":"Candere Hurun India Women Leaders List","type":"notamong","difficulty":"Moderate","stem":"Which of the following is NOT one of the five broad pillars used to classify women in the Candere Hurun India Women Leaders List 2026?","options":[["A","Social Impact"],["B","Value Creation"],["C","Startups"],["D","Culture"],["E","Governance Leadership"]],"correct":"E","explanation":"The five pillars are Culture, Startups, Value Creation, Wealth Creation, and Social Impact. 'Governance Leadership' is not one of them — Wealth Creation is the genuine fifth pillar in place of it."},{"id":131,"section":"Candere Hurun India Women Leaders List","type":"figure","difficulty":"Moderate","stem":"Which pillar has the largest share of women on the Candere Hurun India Women Leaders List 2026, and what percentage does it represent?","options":[["A","Culture; 36%"],["B","Wealth Creation; 42%"],["C","Culture; 24%"],["D","Startups; 36%"],["E","Value Creation; 36%"]],"correct":"A","explanation":"Culture is the largest pillar, with 42 women representing 36% of the total list."},{"id":132,"section":"Candere Hurun India Women Leaders List","type":"numbered","difficulty":"Moderate","context":"1. Olympic and Paralympic Medallists form the largest single category, with 20 honourees.\n2. Of these 20 honourees, 60% are para-athletes.\n3. The number of categories in the list increased from 9 to 12 compared to the previous edition.\n4. Rajni Bector, founder of Cremica, is the oldest name on the list at 86 years.\n5. The list is released solely by Hurun India, without any corporate association.","stem":"Which of the above statements are correct?","options":[["A","2, 4 and 5"],["B","1, 2, 3 and 4"],["C","1, 3 and 5"],["D","All of the above"],["E","1, 2 and 3"]],"correct":"B","explanation":"Statement 5 is incorrect — the list is released by Candere in association with Hurun India."},{"id":133,"section":"Candere Hurun India Women Leaders List","type":"figure","difficulty":"Easy","stem":"What are the ages of the youngest and oldest names on the Candere Hurun India Women Leaders List 2026?","options":[["A","Youngest: Sheetal Devi, 19 years; Oldest: Rajni Bector, 82 years"],["B","Youngest: Sheetal Devi, 17 years; Oldest: Rajni Bector, 86 years"],["C","Youngest: Sheetal Devi, 19 years; Oldest: Rajni Bector, 86 years"],["D","Youngest: Sheetal Devi, 19 years; Oldest: Sudha Murthy, 86 years"],["E","Youngest: Sheetal Devi, 21 years; Oldest: Rajni Bector, 90 years"]],"correct":"C","explanation":"The youngest name is para-archer Sheetal Devi (19 years); the oldest is Rajni Bector, founder of Cremica (86 years)."},{"id":134,"section":"Environmental Performance Index (EPI) 2026","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the EPI 2026 is correct?","options":[["A","India topped the EPI 2026 among South Asian countries."],["B","Laos ranked just above India, at 175th position."],["C","The EPI 2026 was released by the World Bank."],["D","India ranked 176th out of 177 countries in the EPI 2026, with a score of 22.46."],["E","India's EPI score declined by 7.47 points over the last decade."]],"correct":"D","explanation":"India ranked near the bottom among South Asian countries (Bhutan, Sri Lanka, Nepal, Pakistan all ranked better). The EPI was released by Yale University, not the World Bank. India's score IMPROVED (not declined) by 7.47 points. Laos ranked 177th, below (not above) India."},{"id":135,"section":"Environmental Performance Index (EPI) 2026","type":"numbered","difficulty":"Moderate","context":"1. The EPI 2026 evaluates 177 countries using 47 indicators across 12 issue categories.\n2. India's score of 22.46 places it 176th, the second-lowest ranked nation.\n3. Laos is the lowest-ranked country, with a score of 21.78.\n4. India has shown a marginal improvement of +7.47 points over the last ten years.\n5. Estonia topped the index for the fifth consecutive year.","stem":"Which of the above statements are correct?","options":[["A","2, 4 and 5"],["B","1, 3 and 5"],["C","All of the above"],["D","1, 2 and 3"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is fabricated and not supported by the passage."},{"id":136,"section":"Environmental Performance Index (EPI) 2026","type":"numbered","difficulty":"Hard","context":"1. Bhutan ranks 52nd in the EPI 2026.\n2. Sri Lanka ranks 94th.\n3. Nepal ranks 128th.\n4. Pakistan ranks 157th, better than India's rank.\n5. Mali ranks worse than India in the EPI 2026.","stem":"Which of the above statements are correct?","options":[["A","1, 2, 3 and 4"],["B","All of the above"],["C","2, 4 and 5"],["D","1, 2 and 3"],["E","1, 3 and 5"]],"correct":"A","explanation":"Statement 5 is incorrect — Mali ranks 174th, which is better than India's 176th, not worse."},{"id":137,"section":"Environmental Performance Index (EPI) 2026","type":"figure","difficulty":"Easy","stem":"What was India's score in the EPI 2026, and its improvement over the last ten years?","options":[["A","22.46; +4.77 points"],["B","22.46; +7.47 points"],["C","21.78; +7.47 points"],["D","24.46; +5.47 points"],["E","22.46; +8.47 points"]],"correct":"B","explanation":"India scored 22.46 in the EPI 2026, showing a marginal improvement of +7.47 points over the last ten years."},{"id":138,"section":"Environmental Performance Index (EPI) 2026","type":"statement","difficulty":"Moderate","stem":"Which one of the following correctly lists the top three ranked countries in the EPI 2026, in order?","options":[["A","Luxembourg, Estonia, United Kingdom"],["B","United Kingdom, Estonia, Luxembourg"],["C","Estonia, Luxembourg, United Kingdom"],["D","Estonia, Luxembourg, Switzerland"],["E","Estonia, United Kingdom, Luxembourg"]],"correct":"C","explanation":"The top three ranked countries in the EPI 2026 were Estonia, Luxembourg, and the United Kingdom, in that order."},{"id":139,"section":"Environmental Performance Index (EPI) 2026","type":"figure","difficulty":"Moderate","stem":"How does the regional average EPI score compare with India's score of 22.46?","options":[["A","Regional average 20.15, lower than India's score"],["B","Regional average 22.46, same as India"],["C","Regional average 31.81, lower than India's score"],["D","Regional average 31.81, higher than India's score"],["E","Regional average 40.81, much higher"]],"correct":"D","explanation":"The regional average stood at 31.81, which is higher than India's score of 22.46."},{"id":140,"section":"NITI Aayog Caregiving Report","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about NITI Aayog's caregiving report is correct?","options":[["A","The proposed National Portal for Caregivers will be managed exclusively by private hospitals."],["B","The report recommends a National Caregiver Council to be chaired by the Prime Minister."],["C","NITI Aayog was established in 2014 to replace the Finance Commission."],["D","NITI Aayog's Chairperson is elected by the Governing Council of Chief Ministers."],["E","The report was presented by Vice Chairperson Ashok Kumar Lahiri in New Delhi."]],"correct":"E","explanation":"NITI Aayog was established in 2015 (not 2014) to replace the Planning Commission (not Finance Commission). The Chairperson is the Prime Minister ex officio, not an elected position."},{"id":141,"section":"NITI Aayog Caregiving Report","type":"acronym","difficulty":"Easy","stem":"NITI Aayog stands for:","options":[["A","National Institution for Transforming India"],["B","National Investment and Transformation Institution"],["C","National Institution for Trade and Investment"],["D","National Institute for Transformation of India"],["E","National Institute for Territorial Improvement"]],"correct":"A","explanation":"NITI Aayog stands for National Institution for Transforming India."},{"id":142,"section":"NITI Aayog Caregiving Report","type":"numbered","difficulty":"Moderate","context":"1. NITI Aayog was established in 2015, replacing the Planning Commission.\n2. The Prime Minister serves as the Chairperson of NITI Aayog.\n3. The caregiving report recommends setting up a National Caregiver Council to regulate training, accreditation and certification.\n4. The National Caregiver Council will also maintain a National Caregiver Registry.\n5. NITI Aayog's composition does not include any ex-officio Union Ministers.","stem":"Which of the above statements are correct?","options":[["A","2, 4 and 5"],["B","1, 2, 3 and 4"],["C","1, 2 and 3"],["D","1, 3 and 5"],["E","All of the above"]],"correct":"B","explanation":"Statement 5 is incorrect — NITI Aayog's composition includes ex-officio Union Ministers."},{"id":143,"section":"NITI Aayog Caregiving Report","type":"numbered","difficulty":"Moderate","context":"NITI Aayog's caregiving report makes the following recommendations:\n1. National Policy on Caregiving (NPC)\n2. National Caregiver Council (NCC)\n3. National Portal for Caregivers and Care Seekers\n4. National Caregiver Insurance Scheme\n5. National Caregiver Training Fund","stem":"Which of the above are NOT among the recommendations of NITI Aayog's caregiving report?","options":[["A","3, 4 and 5"],["B","1 and 2"],["C","4 and 5"],["D","Only 4"],["E","Only 5"]],"correct":"C","explanation":"The report's recommendations are the National Policy on Caregiving, the National Caregiver Council, and the National Portal for Caregivers and Care Seekers. A 'National Caregiver Insurance Scheme' and 'National Caregiver Training Fund' are not mentioned."},{"id":144,"section":"Kroll Celebrity Brand Valuation 2025","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the Kroll Celebrity Brand Valuation 2025 is correct?","options":[["A","Ranveer Singh topped the rankings, followed by Shah Rukh Khan."],["B","MS Dhoni ranked ahead of Sachin Tendulkar in the top 5."],["C","The Kroll report is the 15th edition of its celebrity brand valuation series."],["D","Shah Rukh Khan topped the rankings with a brand value of USD 177.9 million."],["E","Virat Kohli retained the top position in the 2025 rankings."]],"correct":"D","explanation":"Virat Kohli SLIPPED from 1st to 3rd (did not retain top position). This is the 11th (not 15th) edition. Sachin Tendulkar (rank 4) ranked ahead of MS Dhoni (rank 5). Shah Rukh Khan topped the list, not Ranveer Singh."},{"id":145,"section":"Kroll Celebrity Brand Valuation 2025","type":"numbered","difficulty":"Moderate","context":"1. This is the 11th edition of Kroll's Celebrity Brand Valuation report.\n2. Shah Rukh Khan's brand value was assessed at USD 177.9 million.\n3. Ranveer Singh retained the second position in the rankings.\n4. Virat Kohli, who ranked first in the previous year, slipped to third place.\n5. Sachin Tendulkar ranked ahead of Virat Kohli in the 2025 list.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","All of the above"],["C","1, 3 and 5"],["D","2, 4 and 5"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is incorrect — Virat Kohli (rank 3) ranked ahead of Sachin Tendulkar (rank 4), not the reverse."},{"id":146,"section":"Kroll Celebrity Brand Valuation 2025","type":"figure","difficulty":"Moderate","stem":"Which one of the following correctly pairs a celebrity with their rank and profession in the Kroll Celebrity Brand Valuation 2025?","options":[["A","Rank 3 – Virat Kohli – Cricketer"],["B","Rank 5 – Sachin Tendulkar – Cricketer"],["C","Rank 4 – Mahendra Singh Dhoni – Cricketer"],["D","Rank 3 – Ranveer Singh – Actor"],["E","Rank 2 – Virat Kohli – Cricketer"]],"correct":"A","explanation":"Virat Kohli ranked 3rd as a cricketer. Sachin Tendulkar ranked 4th (not 5th) and MS Dhoni ranked 5th (not 4th)."},{"id":147,"section":"Kroll Celebrity Brand Valuation 2025","type":"figure","difficulty":"Easy","stem":"What was Shah Rukh Khan's brand value in the Kroll Celebrity Brand Valuation 2025, making him India's most valuable celebrity?","options":[["A","USD 157.9 million"],["B","USD 177.9 million"],["C","USD 177.9 billion"],["D","USD 197.7 million"],["E","USD 117.9 million"]],"correct":"B","explanation":"Shah Rukh Khan's brand value was assessed at USD 177.9 million."},{"id":148,"section":"BHASHINI–PNB MoU","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the BHASHINI-PNB MoU is correct?","options":[["A","The MoU was signed to promote UPI merchant payments abroad."],["B","PNB is the CEO signatory institution for this MoU."],["C","The MoU between DIBD and PNB was signed by Shri Amitabh Nag, CEO of Digital India BHASHINI Division."],["D","The MoU focuses exclusively on cybersecurity training."],["E","BHASHINI is a State Bank of India initiative."]],"correct":"C","explanation":"The MoU promotes multilingual AI for inclusive banking, not UPI payments abroad. BHASHINI is a Digital India initiative, not an SBI initiative, and the MoU's focus is multilingual AI, not cybersecurity."},{"id":149,"section":"BHASHINI–PNB MoU","type":"acronym","difficulty":"Easy","stem":"BHASHINI, referenced in this MoU, is a division under which government initiative?","options":[["A","Startup India"],["B","Digital Bharat Nidhi"],["C","Bharat Net"],["D","Digital India"],["E","Skill India"]],"correct":"D","explanation":"BHASHINI (Digital India BHASHINI Division) operates under the Digital India initiative."},{"id":150,"section":"IN-SPACe Re-entry Guidelines","type":"acronym","difficulty":"Moderate","stem":"IN-SPACe, which issued the controlled re-entry guidelines, stands for:","options":[["A","Indian National Space Policy and Authorization Center"],["B","Indian National Space Promotion and Administration Council"],["C","Indian National Space Program and Authorization Center"],["D","Indian National Satellite Promotion and Authorization Center"],["E","Indian National Space Promotion and Authorization Center"]],"correct":"E","explanation":"IN-SPACe stands for Indian National Space Promotion and Authorization Center."},{"id":151,"section":"IN-SPACe Re-entry Guidelines","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about IN-SPACe's re-entry guidelines is correct?","options":[["A","The guidelines set the maximum allowed casualty risk for controlled re-entry at less than 1 in 10,000."],["B","IN-SPACe was established in 2018 under the Ministry of Science and Technology."],["C","Foreign companies can directly apply for re-entry authorisation without an Indian entity."],["D","IN-SPACe is headquartered in Bengaluru, Karnataka."],["E","The current Chairperson of IN-SPACe is Dr. S. Somanath."]],"correct":"A","explanation":"IN-SPACe was set up in 2020 under the Department of Space (not the Ministry of Science and Technology). Foreign companies must apply through an Indian-incorporated entity. IN-SPACe is headquartered in Bopal, Ahmedabad, Gujarat. Its current Chairperson is Dr. Pawan Kumar Goenka."},{"id":152,"section":"IN-SPACe Re-entry Guidelines","type":"numbered","difficulty":"Moderate","context":"1. IN-SPACe's re-entry guidelines are governed by the Indian Space Policy 2023.\n2. The maximum allowed casualty risk is less than 1 in 10,000.\n3. Foreign companies can apply only through an Indian-incorporated entity.\n4. Operators must submit detailed trajectory data as part of the approval process.\n5. Insurance cover under these guidelines is entirely optional and not mentioned as a requirement.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","1, 2, 3 and 4"],["C","1, 3 and 5"],["D","2, 4 and 5"],["E","All of the above"]],"correct":"B","explanation":"Statement 5 is incorrect — third-party liability insurance cover is required wherever prescribed, per the guidelines."},{"id":153,"section":"IN-SPACe Re-entry Guidelines","type":"figure","difficulty":"Moderate","stem":"When was IN-SPACe set up, and where is it headquartered?","options":[["A","2020; Bengaluru, Karnataka"],["B","2018; Bopal, Ahmedabad, Gujarat"],["C","2020; Bopal, Ahmedabad, Gujarat"],["D","2020; Thiruvananthapuram, Kerala"],["E","2023; New Delhi"]],"correct":"C","explanation":"IN-SPACe was set up in 2020 and is headquartered in Bopal, Ahmedabad, Gujarat."},{"id":154,"section":"IN-SPACe Re-entry Guidelines","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements is NOT correct?","options":[["A","IN-SPACe operates under the Department of Space."],["B","IN-SPACe was established before the Indian Space Policy 2023 was formulated."],["C","IN-SPACe promotes and authorises private sector participation in space activities."],["D","The re-entry guidelines apply only to government-run space missions, not private companies."],["E","Dr. Pawan Kumar Goenka is the current Chairperson of IN-SPACe."]],"correct":"D","explanation":"The re-entry guidelines specifically apply to private space companies carrying out planned re-entry, not exclusively to government missions."},{"id":155,"section":"ANUGYAN Nuclear Training Programme","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about ANUGYAN is correct?","options":[["A","ANUGYAN was launched by the Department of Atomic Energy alone."],["B","ANUGYAN is a 6-month online certification course."],["C","ANUGYAN focuses on renewable solar energy training."],["D","ANUGYAN is India's second dedicated nuclear training programme."],["E","ANUGYAN is a 3-month residential nuclear training programme launched by IIT Hyderabad in partnership with Crimson Energy."]],"correct":"E","explanation":"ANUGYAN is India's FIRST (not second) dedicated nuclear training programme, launched jointly by IIT Hyderabad and Crimson Energy (CEEPL), not the Department of Atomic Energy alone. It is a residential (not online) programme focused on nuclear, not solar, energy."},{"id":156,"section":"ANUGYAN Nuclear Training Programme","type":"figure","difficulty":"Easy","stem":"What is the duration and nature of the ANUGYAN programme?","options":[["A","3-month residential programme"],["B","1-year residential programme"],["C","6-month residential programme"],["D","3-week residential programme"],["E","3-month online programme"]],"correct":"A","explanation":"ANUGYAN is a 3-month residential training programme."},{"id":157,"section":"ICAR Pigeonpea Genome","type":"acronym","difficulty":"Easy","stem":"T2T, in the context of ICAR's pigeonpea genome, stands for:","options":[["A","Trait-to-Trait"],["B","Telomere-to-Telomere"],["C","Telomere-to-Terminal"],["D","Total-to-Total Genome"],["E","Tissue-to-Tissue"]],"correct":"B","explanation":"T2T stands for Telomere-to-Telomere, referring to a fully annotated end-to-end reference genome."},{"id":158,"section":"ICAR Pigeonpea Genome","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about ICAR's pigeonpea genome is correct?","options":[["A","The genome assembly is named NIPB_CcT2T_1."],["B","The pigeonpea variety used is called 'Pusa Arhar'."],["C","ICAR developed India's first fully annotated T2T reference genome of the pigeonpea variety 'Asha', deposited in the NCBI database."],["D","The genome was deposited in a database maintained by ICRISAT."],["E","This is the world's first pigeonpea genome ever sequenced."]],"correct":"C","explanation":"The genome assembly is named NIPB_CcT2T_4 (not _1), the variety is 'Asha' (not 'Pusa Arhar'), and it was deposited in NCBI (not an ICRISAT database). The passage describes it as India's first, not the world's first."},{"id":159,"section":"ICAR Pigeonpea Genome","type":"figure","difficulty":"Moderate","stem":"What is the name given to ICAR's fully annotated T2T pigeonpea genome assembly?","options":[["A","CcT2T_NIPB_2"],["B","ICAR_PigeonPea_T2T"],["C","NIPB_AshaT2T_4"],["D","NIPB_CcT2T_4"],["E","NIPB_CcT2T_1"]],"correct":"D","explanation":"The genome assembly is named NIPB_CcT2T_4."},{"id":160,"section":"Jupiter Wagons–Lucchini Railwheel Venture","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the Jupiter Wagons-Lucchini RS railwheel venture is correct?","options":[["A","This is a joint venture between two Indian public sector companies."],["B","The investment in this venture is EUR 280 million."],["C","The facility will manufacture only railway axles, not complete wheelsets."],["D","The new manufacturing entity is named Jupiter Italia Railwheel Factory."],["E","Jupiter Wagons Limited partnered with Italy's Lucchini RS and SIMEST to set up India's first fully integrated private-sector railwheel manufacturing facility."]],"correct":"E","explanation":"The new entity is named Jupiter Tatravagonka Railwheel Factory Private Limited (JTRWF), not 'Jupiter Italia Railwheel Factory'. The investment is EUR 28 million (not 280 million). It is an India-Italy partnership involving a private Indian company (not two public sector companies), and the facility will produce wheels, axles AND complete wheelsets."},{"id":161,"section":"Jupiter Wagons–Lucchini Railwheel Venture","type":"numbered","difficulty":"Moderate","context":"1. The new platform will operate under the name Jupiter Tatravagonka Railwheel Factory Private Limited (JTRWF).\n2. The investment in the venture is approximately EUR 28 million, or about ₹307 crore.\n3. The facility will produce railway wheels, axles and complete wheelsets.\n4. This is India's first fully integrated private-sector railwheel manufacturing facility.\n5. SIMEST is an Indian government agency co-investing in the project.","stem":"Which of the above statements are correct?","options":[["A","1, 2, 3 and 4"],["B","2, 4 and 5"],["C","1, 3 and 5"],["D","All of the above"],["E","1, 2 and 3"]],"correct":"A","explanation":"Statement 5 is incorrect — SIMEST is associated with the Italian side of the partnership, not an Indian government agency."},{"id":162,"section":"Jupiter Wagons–Lucchini Railwheel Venture","type":"acronym","difficulty":"Moderate","stem":"JTRWF, the new railwheel manufacturing entity, stands for:","options":[["A","Jupiter Tatra Rail Wagon Factory"],["B","Jupiter Tatravagonka Railwheel Factory"],["C","Jupiter Transnational Railwheel Foundry"],["D","Jupiter Tatravagonka Rail Works Facility"],["E","Jupiter Trans-Railwheel Works Factory"]],"correct":"B","explanation":"JTRWF stands for Jupiter Tatravagonka Railwheel Factory Private Limited."},{"id":163,"section":"Jupiter Wagons–Lucchini Railwheel Venture","type":"figure","difficulty":"Moderate","stem":"What is the approximate investment made in the Jupiter Wagons-Lucchini RS railwheel manufacturing venture?","options":[["A","EUR 28 million (approximately ₹207 crore)"],["B","EUR 18 million (approximately ₹207 crore)"],["C","EUR 28 million (approximately ₹307 crore)"],["D","USD 28 million (approximately ₹307 crore)"],["E","EUR 38 million (approximately ₹307 crore)"]],"correct":"C","explanation":"The investment is approximately EUR 28 million, or about ₹307 crore."},{"id":164,"section":"COSPAR Vikram Sarabhai Medal","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Annapurni Subramaniam's COSPAR Vikram Sarabhai Medal is correct?","options":[["A","She is the first Indian to ever receive this medal."],["B","The medal is conferred solely by ISRO, without COSPAR's involvement."],["C","The medal is open only to Indian citizens."],["D","She is the first Indian woman scientist to receive the COSPAR Vikram Sarabhai Medal."],["E","The medal was presented at the 40th COSPAR Scientific Assembly."]],"correct":"D","explanation":"She is the 4th Indian (not the first) to receive the medal, presented at the 46th (not 40th) COSPAR Scientific Assembly, jointly conferred by COSPAR AND ISRO. It is open to candidates from any country."},{"id":165,"section":"COSPAR Vikram Sarabhai Medal","type":"numbered","difficulty":"Moderate","context":"1. Annapurni Subramaniam is the 4th Indian and the first Indian woman scientist to receive this medal.\n2. She is only the third woman globally to receive the medal.\n3. The medal was presented at the 46th COSPAR Scientific Assembly, held in Florence, Italy.\n4. The medal is jointly conferred by COSPAR and ISRO.\n5. The medal was instituted in 1985 in honour of Vikram Sarabhai.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","2, 4 and 5"],["C","1, 2 and 3"],["D","1, 3 and 5"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is incorrect — the medal was instituted in 1990, not 1985."},{"id":166,"section":"COSPAR Vikram Sarabhai Medal","type":"figure","difficulty":"Moderate","stem":"In which year was the COSPAR Vikram Sarabhai Medal instituted, and at which COSPAR Scientific Assembly was the 2026 medal presented?","options":[["A","1990; 46th Assembly"],["B","1990; 48th Assembly"],["C","1990; 44th Assembly"],["D","2000; 46th Assembly"],["E","1985; 46th Assembly"]],"correct":"A","explanation":"The medal was instituted in 1990, and the 2026 edition was presented at the 46th COSPAR Scientific Assembly."},{"id":167,"section":"COSPAR Vikram Sarabhai Medal","type":"acronym","difficulty":"Moderate","stem":"COSPAR, which jointly confers this medal with ISRO, stands for:","options":[["A","Committee on Space Regulation"],["B","Committee on Space Research"],["C","Cooperative Space Research Agency"],["D","Council of Space Research"],["E","Committee for Space and Radiation"]],"correct":"B","explanation":"COSPAR stands for Committee on Space Research."},{"id":168,"section":"COSPAR Vikram Sarabhai Medal","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements is NOT correct?","options":[["A","The medal recognises outstanding contributions to space research in developing countries."],["B","Annapurni Subramaniam serves as Director of the Indian Institute of Astrophysics, Bengaluru."],["C","The medal is open only to scientists affiliated with ISRO."],["D","Selection for the medal is based primarily on research work over a five-year period."],["E","The Vikram Sarabhai Medal honours the founder of ISRO."]],"correct":"C","explanation":"The medal is open to candidates from any country, not limited to ISRO-affiliated scientists."},{"id":169,"section":"GARUD Binoculars – India Optel","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the GARUD High Resolution Binoculars is correct?","options":[["A","The binoculars were developed by DRDO."],["B","IOL is classified as a Navratna Category defence company."],["C","Ordnance Factory, Dehradun operates independently of India Optel Limited."],["D","India Optel Limited, a Mini Ratna Category-I DPSU, launched the indigenous 'GARUD' High Resolution Binoculars for the civil market."],["E","GARUD binoculars are meant exclusively for military use, not civilian markets."]],"correct":"D","explanation":"GARUD binoculars have been launched for the civil market. IOL is a Mini Ratna Category-I (not Navratna) DPSU. The binoculars were developed by Ordnance Factory, Dehradun, a unit OF India Optel Limited, not DRDO or an independent entity."},{"id":170,"section":"GARUD Binoculars – India Optel","type":"numbered","difficulty":"Moderate","context":"1. India Optel Limited is a Mini Ratna Category-I Defence Public Sector Undertaking.\n2. IOL functions under the Department of Defence Production.\n3. GARUD binoculars were developed and manufactured by Ordnance Factory, Dehradun, a unit of IOL.\n4. GARUD binoculars have been launched specifically for the civil market.\n5. GARUD binoculars are IOL's first-ever product launch since incorporation.","stem":"Which of the above statements are correct?","options":[["A","1, 3 and 5"],["B","2, 4 and 5"],["C","All of the above"],["D","1, 2 and 3"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is fabricated and not supported by the passage."},{"id":171,"section":"GARUD Binoculars – India Optel","type":"figure","difficulty":"Easy","stem":"Which unit of India Optel Limited developed and manufactured the 'GARUD' binoculars?","options":[["A","Ordnance Factory, Dehradun"],["B","Bharat Electronics Limited"],["C","Ordnance Factory, Chennai"],["D","Instruments Research and Development Establishment"],["E","Ordnance Factory, Kanpur"]],"correct":"A","explanation":"The GARUD binoculars were developed and manufactured by Ordnance Factory, Dehradun, a unit of India Optel Limited."},{"id":172,"section":"NSDC–AVPL Drone Skill Centres","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the NSDC-AVPL drone skill centres initiative is correct?","options":[["A","AVPL International will provide co-investment support, while NSDC handles lab setup."],["B","NSDC and AVPL International aim to establish 350 Advanced Skill Centres for drone technology over three years."],["C","The first-year target under this partnership is 150 centres."],["D","The partnership focuses solely on curriculum design, with no physical infrastructure component."],["E","NSDC was established in 2015 under the Ministry of Skill Development."]],"correct":"B","explanation":"The first-year target is 75 centres (not 150). NSDC provides co-investment support, while AVPL handles lab setup, curriculum and faculty (the statement about their roles reverses this division of work). NSDC was set up in 2008 (not 2015). The partnership does include physical infrastructure (labs), not just curriculum design."},{"id":173,"section":"NSDC–AVPL Drone Skill Centres","type":"numbered","difficulty":"Easy","context":"1. The NSDC-AVPL partnership aims to establish 350 Advanced Skill Centres for drone technology.\n2. The first-year target under this initiative is 75 centres.\n3. NSDC will provide co-investment support for the initiative.\n4. AVPL International will handle setting up laboratories, curriculum design and faculty deployment.\n5. NSDC was set up in 2008 under the Ministry of Skill Development and Entrepreneurship.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","1, 2, 3 and 4"],["C","All of the above"],["D","1, 3 and 5"],["E","2, 4 and 5"]],"correct":"C","explanation":"All five statements are correct as per the passage."},{"id":174,"section":"NSDC–AVPL Drone Skill Centres","type":"acronym","difficulty":"Easy","stem":"ASC, as used for the drone skill centres under this initiative, stands for:","options":[["A","Aerial Systems College"],["B","Aviation Skill Centre"],["C","Advanced Simulation Centre"],["D","Advanced Skill Centre"],["E","Applied Skill Council"]],"correct":"D","explanation":"ASC stands for Advanced Skill Centre."},{"id":175,"section":"NSDC–AVPL Drone Skill Centres","type":"figure","difficulty":"Easy","stem":"What is the duration of the NSDC-AVPL partnership, and its overall target for Advanced Skill Centres?","options":[["A","Three years; 250 centres"],["B","Five years; 350 centres"],["C","Three years; 300 centres"],["D","Two years; 350 centres"],["E","Three years; 350 centres"]],"correct":"E","explanation":"The partnership runs for three years, with an overall target of 350 Advanced Skill Centres."},{"id":176,"section":"INS Nipun","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about 'Nipun' is correct?","options":[["A","'Nipun' is the second Diving Support Vessel built entirely in India, constructed by Hindustan Shipyard Limited."],["B","'Nipun' is a submarine, not a diving support vessel."],["C","'Nipun' is the first vessel of its class."],["D","'Nipun' was built by Mazagon Dock Shipbuilders Limited."],["E","The first vessel of this class was named INS Nireekshak."]],"correct":"A","explanation":"'Nipun' is the second (not first) vessel of its class, built by Hindustan Shipyard Limited (not Mazagon Dock). The first vessel of the class is INS Nistar (not Nireekshak). 'Nipun' is a Diving Support Vessel, not a submarine."},{"id":177,"section":"INS Nipun","type":"figure","difficulty":"Easy","stem":"What is the name of the first vessel in the Diving Support Vessel class to which 'Nipun' belongs?","options":[["A","INS Nipun"],["B","INS Nistar"],["C","INS Nirbhik"],["D","INS Nireekshak"],["E","INS Nilgiri"]],"correct":"B","explanation":"INS Nistar is the first vessel of the Diving Support Vessel class."},{"id":178,"section":"INS Nipun","type":"numbered","difficulty":"Moderate","context":"1. 'Nipun' is a Diving Support Vessel built entirely in India.\n2. It was built by Hindustan Shipyard Limited, Visakhapatnam.\n3. 'Nipun' is the second ship of its class.\n4. INS Nistar is the first vessel of this class.\n5. 'Nipun' was inducted into the Indian Air Force.","stem":"Which of the above statements are correct?","options":[["A","2, 4 and 5"],["B","1, 2 and 3"],["C","1, 2, 3 and 4"],["D","All of the above"],["E","1, 3 and 5"]],"correct":"C","explanation":"Statement 5 is incorrect — 'Nipun' was inducted into the Indian Navy, not the Indian Air Force."},{"id":179,"section":"Key Appointments","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Smt. Varsha Ashok Aglawe's appointment is correct?","options":[["A","She was appointed Director General of the Survey of India (not the Geological Survey)."],["B","She is the 50th Director General of GSI."],["C","She succeeds Shri Asit Saha as Chairperson of ONGC."],["D","She has assumed charge as the 54th Director General of the Geological Survey of India, succeeding Shri Asit Saha."],["E","GSI's Director General post is a two-year rotating position."]],"correct":"D","explanation":"She is the 54th (not 50th) DG of the Geological Survey of India (not ONGC or the Survey of India)."},{"id":180,"section":"Key Appointments","type":"numbered","difficulty":"Moderate","context":"Recently, in August 2026, several key appointments were made across Indian regulatory and government bodies.\n1. K. Rajaraman's tenure as IFSCA Chairman has been extended until October 2028.\n2. A. S. Rajeev has taken charge as Acting Central Vigilance Commissioner, succeeding Praveen Kumar Srivastava.\n3. Monisha Chakraborty has been appointed RBI Executive Director, overseeing the Foreign Exchange Department and Financial Markets Regulation Department.\n4. Prasanta Mahapatra has taken charge as Chairman of SEBI.\n5. T. V. Somanathan received a one-year extension as Cabinet Secretary.","stem":"Which of the above statements are correct?","options":[["A","2, 4 and 5"],["B","1, 2 and 3"],["C","All of the above"],["D","1, 3 and 4"],["E","1, 2, 3 and 5"]],"correct":"E","explanation":"Statement 4 is incorrect — Prasanta Mahapatra took charge as Executive Director of SEBI, not Chairman."},{"id":181,"section":"Key Appointments","type":"figure","difficulty":"Moderate","stem":"K. Rajaraman was originally appointed IFSCA Chairman in which year, and his tenure has now been extended until when?","options":[["A","October 2023; October 2028"],["B","October 2021; October 2028"],["C","October 2020; October 2025"],["D","October 2023; October 2026"],["E","January 2023; January 2028"]],"correct":"A","explanation":"K. Rajaraman was originally appointed in October 2023, and his tenure has been extended until October 2028."},{"id":182,"section":"Key Appointments","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the Central Vigilance Commission (CVC) is correct?","options":[["A","CVC is a non-statutory advisory body only."],["B","The Central Vigilance Commission was set up on the recommendations of the K. Santhanam Committee on Prevention of Corruption."],["C","The CVC's composition allows for up to five Vigilance Commissioners."],["D","A. S. Rajeev succeeds K. V. Chowdary as Acting CVC."],["E","The CVC has three Central Vigilance Commissioners as its chairperson."]],"correct":"B","explanation":"The CVC has ONE Central Vigilance Commissioner as chairperson (not three) and up to two (not five) Vigilance Commissioners. A. S. Rajeev succeeds Praveen Kumar Srivastava (not K. V. Chowdary). CVC is India's highest STATUTORY anti-corruption body, not merely advisory."},{"id":183,"section":"Key Appointments","type":"numbered","difficulty":"Moderate","context":"1. T. V. Somanathan received a one-year extension as Cabinet Secretary, approved by the Appointments Committee of the Cabinet.\n2. His earlier tenure was due to end on 30 August 2026.\n3. He assumed charge as the 33rd Cabinet Secretary on 30 August 2024, succeeding Rajiv Gauba.\n4. Union Home Secretary Govind Mohan was also given a one-year extension.\n5. The Appointments Committee of the Cabinet is headed by the Union Home Minister.","stem":"Which of the above statements are correct?","options":[["A","2, 4 and 5"],["B","All of the above"],["C","1, 2, 3 and 4"],["D","1, 2 and 3"],["E","1, 3 and 5"]],"correct":"C","explanation":"Statement 5 is incorrect — the Appointments Committee of the Cabinet is headed by the Prime Minister, not the Union Home Minister."},{"id":184,"section":"Key Appointments","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Monisha Chakraborty's appointment as RBI Executive Director is correct?","options":[["A","She is RBI's first-ever woman Executive Director."],["B","She will oversee the Department of Banking Supervision and Department of Payment Systems."],["C","She previously served as Chairperson of SEBI."],["D","She brings more than three decades of experience within the RBI."],["E","She was earlier the Deputy Governor of RBI."]],"correct":"D","explanation":"She will oversee the Foreign Exchange Department and Financial Markets Regulation Department (not Banking Supervision/Payment Systems). She was earlier Chief General Manager-in-Charge, Department of Supervision — not Deputy Governor or SEBI Chairperson. The passage does not claim she is RBI's first-ever woman ED."},{"id":185,"section":"Key Appointments","type":"figure","difficulty":"Moderate","stem":"Which two departments will Monisha Chakraborty oversee as RBI Executive Director?","options":[["A","Foreign Exchange Department and Department of Communication"],["B","Financial Markets Regulation Department and Human Resource Management Department"],["C","Department of Payment and Settlement Systems and Department of Statistics"],["D","Department of Banking Supervision and Department of Currency Management"],["E","Foreign Exchange Department and Financial Markets Regulation Department"]],"correct":"E","explanation":"She will oversee the Foreign Exchange Department and the Financial Markets Regulation Department."},{"id":186,"section":"Key Appointments","type":"statement","difficulty":"Hard","stem":"Which one of the following appointment pairings is INCORRECT?","options":[["A","Prasanta Mahapatra — Chairman, Reserve Bank of India"],["B","K. Rajaraman — Chairman, IFSCA"],["C","Varsha Ashok Aglawe — 54th Director General, Geological Survey of India"],["D","A. S. Rajeev — Acting Central Vigilance Commissioner"],["E","Monisha Chakraborty — Executive Director, RBI"]],"correct":"A","explanation":"Prasanta Mahapatra took charge as Executive Director of SEBI, not Chairman of the Reserve Bank of India."},{"id":187,"section":"Sports","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Ajinkya Rahane's retirement is correct?","options":[["A","Rahane scored 20 international centuries."],["B","Rahane retired from international cricket after a 12-year career, having scored 15 centuries."],["C","Rahane was the highest first-innings scorer only in the 2023 WTC Final, not 2021."],["D","Rahane retired as India's full-time Test captain."],["E","Rahane's international career spanned from 2008 to 2020."]],"correct":"B","explanation":"Rahane's international career spanned 2011 to 2023 (not 2008-2020). He was the highest first-innings scorer in BOTH the 2021 and 2023 WTC Finals, not just 2023. He was a Test vice-captain/stand-in captain, not full-time captain, and scored 15 (not 20) centuries."},{"id":188,"section":"Sports","type":"numbered","difficulty":"Moderate","context":"1. Ajinkya Rahane's international career spanned from 2011 to 2023.\n2. He scored 15 centuries during his international career.\n3. He was India's highest first-innings scorer in both the 2021 and 2023 ICC World Test Championship Finals.\n4. Rahane served as India's full-time Test captain throughout his career.\n5. He was a former India Test vice-captain and stand-in captain.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 2 and 3"],["C","1, 2, 3 and 5"],["D","2, 4 and 5"],["E","1, 3 and 4"]],"correct":"C","explanation":"Statement 4 is incorrect — Rahane was vice-captain/stand-in captain, not India's full-time Test captain throughout his career."},{"id":189,"section":"Sports","type":"statement","difficulty":"Easy","stem":"Which one of the following statements about the World Junior Squash Championships 2026 is correct?","options":[["A","The championship was held in Cairo, Egypt."],["B","The runner-up in the women's singles was from Sri Lanka."],["C","Anahat Singh won the men's singles title."],["D","Anahat Singh became the first Indian to win the World Junior Squash Championships, held in Niagara-on-the-Lake, Canada."],["E","Anahat Singh is the first Indian woman to win any international squash title."]],"correct":"D","explanation":"The runner-up (Ruqayya Salem) was from Egypt, not Sri Lanka. Anahat Singh won the women's (not men's) singles title, and the event was held in Niagara-on-the-Lake, Canada, not Cairo."},{"id":190,"section":"Sports","type":"figure","difficulty":"Moderate","stem":"Who was the runner-up to Anahat Singh in the Women's Singles final at the World Junior Squash Championships 2026?","options":[["A","Hania El Hammamy (Egypt)"],["B","Amina Orfi (Egypt)"],["C","Ruqayya Salem (Morocco)"],["D","Nour El Sherbini (Egypt)"],["E","Ruqayya Salem (Egypt)"]],"correct":"E","explanation":"Ruqayya Salem of Egypt was the runner-up to Anahat Singh."},{"id":191,"section":"Sports","type":"figure","difficulty":"Easy","stem":"In which two editions of the ICC World Test Championship Final was Ajinkya Rahane India's highest first-innings scorer?","options":[["A","2021 and 2023"],["B","2017 and 2021"],["C","2023 and 2025"],["D","2021 and 2025"],["E","2019 and 2021"]],"correct":"A","explanation":"Rahane was India's highest first-innings scorer in both the 2021 and 2023 ICC World Test Championship Finals."},{"id":192,"section":"Books and Authors","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about \"Bringing the Cheetah Back to India\" is correct?","options":[["A","The first batch consisted of 12 cheetahs from South Africa."],["B","The book is authored by Prashant Agrawal and published by Hachette India."],["C","The book narrates the reintroduction of tigers, not cheetahs, to Kuno National Park."],["D","Cheetahs were declared extinct in India in 1972."],["E","The first batch of cheetahs was released into Kuno National Park in 2020."]],"correct":"B","explanation":"The book is about cheetahs (not tigers). The first batch was released on 17 September 2022 (not 2020). Cheetahs were declared extinct in India in 1952 (not 1972). The first batch consisted of eight cheetahs from Namibia (not 12 from South Africa)."},{"id":193,"section":"Books and Authors","type":"numbered","difficulty":"Moderate","context":"1. The book \"Bringing the Cheetah Back to India\" is authored by Prashant Agrawal.\n2. Cheetahs were declared extinct in India in 1952.\n3. The first batch of eight cheetahs from Namibia was released into Kuno National Park on 17 September 2022.\n4. Kuno National Park is located in Madhya Pradesh.\n5. The book is published by Penguin Random House India.","stem":"Which of the above statements are correct?","options":[["A","2, 4 and 5"],["B","1, 2 and 3"],["C","1, 2, 3 and 4"],["D","All of the above"],["E","1, 3 and 5"]],"correct":"C","explanation":"Statement 5 is incorrect — the book is published by Hachette India, not Penguin Random House India."},{"id":194,"section":"Books and Authors","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Zoramthanga's memoir is correct?","options":[["A","Zoramthanga was the former Chief Minister of Nagaland."],["B","Zoramthanga founded the Mizo National Front."],["C","The book was co-authored with a foreign journalist."],["D","\"From Guerrilla Fighter to Chief Minister\" chronicles his journey from the Mizo National Front insurgency to democratic power."],["E","The memoir focuses solely on his tenure as Chief Minister, without discussing his insurgency years."]],"correct":"D","explanation":"Zoramthanga was the former Chief Minister of Mizoram (not Nagaland). The memoir spans both his insurgency years and his time in democratic power. The passage does not state that he founded the MNF or that the book was co-authored with a foreign journalist."},{"id":195,"section":"Books and Authors","type":"figure","difficulty":"Easy","stem":"How many cheetahs were in the first batch released into Kuno National Park, and from which country did they come?","options":[["A","Eight; South Africa"],["B","Eight; Botswana"],["C","Five; Namibia"],["D","Twelve; Namibia"],["E","Eight; Namibia"]],"correct":"E","explanation":"The first batch of eight cheetahs came from Namibia."},{"id":196,"section":"Awards","type":"statement","difficulty":"Easy","stem":"Which one of the following statements about the 'Soil Farmer Hero' award is correct?","options":[["A","Valluvan, a coconut farmer from Pollachi district, Tamil Nadu, was conferred the 'Soil Farmer Hero' award by the FAO."],["B","The award was conferred by the World Bank."],["C","Valluvan received the award for pioneering work in cotton cultivation."],["D","The award was given in December 2025."],["E","Valluvan is from Kerala."]],"correct":"A","explanation":"Valluvan is a coconut (not cotton) farmer from Pollachi district, Tamil Nadu (not Kerala), honoured in May 2026 (not December 2025) by the FAO (not the World Bank)."},{"id":197,"section":"Awards","type":"acronym","difficulty":"Easy","stem":"FAO, which conferred the 'Soil Farmer Hero' award on Valluvan, stands for:","options":[["A","Food and Agrarian Office"],["B","Food and Agriculture Organization"],["C","Food and Agro-industries Organization"],["D","Farmers' Agricultural Organization"],["E","Federal Agriculture Organization"]],"correct":"B","explanation":"FAO stands for Food and Agriculture Organization (of the United Nations)."},{"id":198,"section":"Important Days (FinTech Day, Hiroshima Day)","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about World FinTech Day and the Global Fintech Festival is correct?","options":[["A","GFF is organised solely by the RBI, without any other partners."],["B","The Global Fintech Festival 2026 will be the 5th edition."],["C","World FinTech Day is observed every year on 1 August."],["D","GFF 2026 will be held in New Delhi."],["E","The theme of GFF 2026 is unrelated to AI or tokenisation."]],"correct":"C","explanation":"GFF 2026 is the 7th (not 5th) edition, held at the Jio World Centre, Mumbai (not New Delhi), jointly organised by MeitY and RBI in partnership with PCI, NPCI and FCC (not RBI alone). Its theme explicitly includes Agentic AI and Tokenisation."},{"id":199,"section":"Important Days (FinTech Day, Hiroshima Day)","type":"numbered","difficulty":"Moderate","context":"1. The Global Fintech Festival is jointly organised by MeitY and RBI, in partnership with PCI, NPCI and FCC.\n2. The 2026 edition is the 7th Global Fintech Festival.\n3. GFF 2026 will be held from 9–11 September 2026 at the Jio World Centre, Mumbai.\n4. The theme of GFF 2026 includes Agentic AI, Tokenisation and Quantum.\n5. World FinTech Day and the Global Fintech Festival are held on the same date each year.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","All of the above"],["C","2, 4 and 5"],["D","1, 2, 3 and 4"],["E","1, 3 and 5"]],"correct":"D","explanation":"Statement 5 is incorrect — World FinTech Day is 1 August, while GFF 2026 is held in September."},{"id":200,"section":"Important Days (FinTech Day, Hiroshima Day)","type":"figure","difficulty":"Moderate","stem":"What are the dates and venue of the 7th Global Fintech Festival 2026?","options":[["A","9–11 September 2026; Bharat Mandapam, New Delhi"],["B","9–11 October 2026; Jio World Centre, Mumbai"],["C","19–21 September 2026; Jio World Centre, Mumbai"],["D","1–3 August 2026; Jio World Centre, Mumbai"],["E","9–11 September 2026; Jio World Centre, Mumbai"]],"correct":"E","explanation":"GFF 2026 will be held from 9–11 September 2026 at the Jio World Centre, Mumbai."},{"id":201,"section":"Important Days (FinTech Day, Hiroshima Day)","type":"statement","difficulty":"Hard","stem":"Which one of the following statements about Hiroshima Day is correct?","options":[["A","Hiroshima Day, observed on 6 August, marked the 81st anniversary of the atomic bombing in 2026."],["B","The aircraft that dropped the Hiroshima bomb was named 'Bock's Car'."],["C","The bombing destroyed around 30 square kilometres of the city."],["D","The bomb dropped on Hiroshima was named 'Fat Man'."],["E","The Hiroshima bomb used Plutonium-239 as its material."]],"correct":"A","explanation":"The Hiroshima bomb was named 'Little Boy' (Fat Man was dropped on Nagasaki), made of Uranium-235 (not Plutonium-239). It destroyed around 13 (not 30) square kilometres, and was dropped by the aircraft 'Enola Gay' (Bock's Car dropped the Nagasaki bomb)."},{"id":202,"section":"Important Days (FinTech Day, Hiroshima Day)","type":"numbered","difficulty":"Moderate","context":"1. The Hiroshima bomb, 'Little Boy,' was made of Uranium-235.\n2. The bomb was dropped by the USAAF B-29 aircraft 'Enola Gay'.\n3. The bombing caused approximately 140,000 deaths by the end of 1945.\n4. On 9 August 1945, 'Fat Man' was dropped on Nagasaki by the aircraft 'Bock's Car', causing around 40,000 deaths.\n5. The first Hiroshima Day Peace Festival was held in 1950 at the Genbaku Dome.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","1, 2, 3 and 4"],["C","2, 4 and 5"],["D","1, 3 and 5"],["E","All of the above"]],"correct":"B","explanation":"Statement 5 is incorrect — the first Hiroshima Day Peace Festival was held in 1947, not 1950."},{"id":203,"section":"Important Days (FinTech Day, Hiroshima Day)","type":"figure","difficulty":"Moderate","stem":"What was the explosive force of the Hiroshima bomb, and its detonation height?","options":[["A","Equivalent to 21,000 tons of TNT; about 1,900 feet"],["B","Equivalent to 15,000 tons of TNT; about 2,800 feet"],["C","Equivalent to 15,000 tons of TNT; about 1,800 feet"],["D","Equivalent to 15,000 tons of TNT; about 1,500 feet"],["E","Equivalent to 20,000 tons of TNT; about 1,800 feet"]],"correct":"C","explanation":"The Hiroshima bomb had an explosive force equivalent to 15,000 tons of TNT and detonated at about 1,800 feet."},{"id":204,"section":"Obituary – D. Y. Patil","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Dr. D. Y. Patil is correct?","options":[["A","He served as Governor of Maharashtra and Gujarat."],["B","RAIT was the first engineering college in Pune, not Navi Mumbai."],["C","He was awarded the Padma Vibhushan in 1991."],["D","Dr. D. Y. Patil, former Governor of Tripura and Bihar, was awarded the Padma Shri in 1991 for his contribution to social work."],["E","He founded the D. Y. Patil Group in 1995."]],"correct":"D","explanation":"He was awarded the Padma Shri (not Padma Vibhushan) in 1991. He served as Governor of Tripura and Bihar (not Maharashtra and Gujarat). He founded the D. Y. Patil Group in 1983 (not 1995), and RAIT was the first engineering college in Navi Mumbai, not Pune."},{"id":205,"section":"Obituary – D. Y. Patil","type":"numbered","difficulty":"Moderate","context":"1. D. Y. Patil founded the D. Y. Patil Group in 1983.\n2. The group grew to include more than 182 educational institutions and 7 universities.\n3. He established the Ramrao Adik Institute of Technology, the first engineering college in Navi Mumbai.\n4. He was awarded the Padma Shri in 1991 for social work.\n5. He passed away at the age of 85 in August 2026.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 3 and 5"],["C","1, 2 and 3"],["D","2, 4 and 5"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is incorrect — he passed away at the age of 90 (not 85) in August 2026."},{"id":206,"section":"Obituary – D. Y. Patil","type":"figure","difficulty":"Easy","stem":"D. Y. Patil served as Governor of which two states?","options":[["A","Tripura
