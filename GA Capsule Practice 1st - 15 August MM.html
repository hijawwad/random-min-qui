 and Bihar"],["B","Tripura and Jharkhand"],["C","Tripura and West Bengal"],["D","Bihar and Odisha"],["E","Bihar and Uttar Pradesh"]],"correct":"A","explanation":"D. Y. Patil served as Governor of Tripura and Bihar."},{"id":207,"section":"Obituary – D. Y. Patil","type":"figure","difficulty":"Easy","stem":"In which year did D. Y. Patil establish the Ramrao Adik Institute of Technology, India's first engineering college in Navi Mumbai?","options":[["A","1985"],["B","1983"],["C","1995"],["D","1991"],["E","1978"]],"correct":"B","explanation":"D. Y. Patil established the Ramrao Adik Institute of Technology (RAIT) in 1983."},{"id":208,"section":"Cross-Scheme Comparisons","type":"intersection","difficulty":"Hard","context":"Consider the following features of two schemes covered in this capsule — the Urban Challenge Fund (UCF) and GOBARdhan:\n1. Nodal ministry is a Central Government ministry\n2. Total central outlay/assistance exceeds ₹50,000 crore\n3. Implementation period extends beyond 5 years\n4. Aimed at supporting climate-resilient agriculture\n5. Received Union Cabinet approval specifically dated 6 August 2026","stem":"Which of the above are true for BOTH the Urban Challenge Fund AND GOBARdhan?","options":[["A","1, 2 and 3"],["B","All of the above"],["C","1 and 3"],["D","2 and 5"],["E","3 and 4"]],"correct":"C","explanation":"Both schemes have a Central ministry as nodal authority (MoHUA for UCF, MoPNG for GOBARdhan) and both run for more than 5 years (UCF: FY2025-26 to FY2030-31/FY2033-34; GOBARdhan: FY2026-27 to FY2035-36). However, UCF's outlay is ₹1 lakh crore (>₹50,000 crore) while GOBARdhan's is ₹23,731 crore (not >₹50,000 crore), so statement 2 is not common. Statement 4 does not apply to either, and only GOBARdhan (not UCF) was explicitly approved on 6 August 2026."}];
</script>
<script>
(function(){

  // ---------- helpers ----------
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderContext(ctx){
    if(!ctx) return '';
    const lines = ctx.split('\n');
    let html = '<div class="passage">';
    let inList = false;
    lines.forEach(line=>{
      const m = line.match(/^\d+\.\s+(.*)$/);
      if(m){
        if(!inList){ html += '<ol>'; inList = true; }
        html += '<li>'+esc(m[1])+'</li>';
      } else {
        if(inList){ html += '</ol>'; inList = false; }
        if(line.trim().length) html += '<p>'+esc(line)+'</p>';
      }
    });
    if(inList) html += '</ol>';
    html += '</div>';
    return html;
  }
  function schemeType(q){ return q.type==='numbered' || q.type==='notamong' || q.type==='acronym'; }

  const SECTIONS = (function(){
    const order = [];
    const counts = {};
    QUESTIONS.forEach(q=>{
      if(!(q.section in counts)){ counts[q.section]=0; order.push(q.section); }
      counts[q.section]++;
    });
    return order.map(name=>({name, count:counts[name]}));
  })();

  // ---------- app state ----------
  let state = {
    screen:'home',        // home | fullSetup | sectionPicker | quiz | end
    quizMode:null,        // 'full' | 'section' | 'schemes'
    order:'pdf',          // 'pdf' | 'shuffled' (full mode only)
    activeSet:[],         // question objects for current run
    idx:0,
    answers:{},           // id -> {status:'correct'|'wrong'|'skipped', selected:letter|null}
    lockedThisQ:false,
    selectedThisQ:null,
    lastSetDescriptor:null // for retry
  };

  const app = document.getElementById('app');

  function go(screen, extra){
    state.screen = screen;
    if(extra) Object.assign(state, extra);
    render();
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  }

  function startQuiz(set, descriptor){
    state.activeSet = set;
    state.idx = 0;
    state.answers = {};
    state.lockedThisQ = false;
    state.selectedThisQ = null;
    state.lastSetDescriptor = descriptor;
    go('quiz');
  }

  function retrySameSet(){
    const d = state.lastSetDescriptor;
    if(!d) return go('home');
    startQuiz(d.set, d);
  }

  // ---------- render router ----------
  function render(){
    if(state.screen==='home') return renderHome();
    if(state.screen==='fullSetup') return renderFullSetup();
    if(state.screen==='sectionPicker') return renderSectionPicker();
    if(state.screen==='quiz') return renderQuiz();
    if(state.screen==='end') return renderEnd();
  }

  function masthead(sub){
    return '<div class="masthead"><span class="brand"><b>ESI / GA</b> &middot; NABARD Grade A Ledger</span>' +
      '<span class="tally">'+QUESTIONS.length+' questions on file</span></div>';
  }

  // ---------- HOME ----------
  function renderHome(){
    const schemesCount = QUESTIONS.filter(schemeType).length;
    app.innerHTML = masthead() +
      '<h1 class="title">GA Capsule Practice</h1>' +
      '<p class="sub">Drawn entirely from the 1st&ndash;15th August GA Capsule &mdash; schemes, reports, appointments and current affairs, styled after the real NABARD ESI/GA mock-test paper.</p>' +
      '<div class="mode-grid">' +
        '<button class="mode-card" data-mode="full">' +
          '<span class="m-label">MODE 01</span>' +
          '<span class="count-chip">'+QUESTIONS.length+' Qs</span>' +
          '<h3>Full Practice Test</h3>' +
          '<p>Every question in the capsule, in PDF order or shuffled &mdash; the complete paper.</p>' +
        '</button>' +
        '<button class="mode-card" data-mode="section">' +
          '<span class="m-label">MODE 02</span>' +
          '<span class="count-chip">'+SECTIONS.length+' topics</span>' +
          '<h3>Section-wise Revision</h3>' +
          '<p>Drill a single scheme, report or topic at a time until it sticks.</p>' +
        '</button>' +
        '<button class="mode-card" data-mode="schemes">' +
          '<span class="m-label">MODE 03</span>' +
          '<span class="count-chip">'+schemesCount+' Qs</span>' +
          '<h3>Schemes-Only Sprint</h3>' +
          '<p>Numbered-statement, "not-among" and acronym questions on schemes &amp; organisations only.</p>' +
        '</button>' +
      '</div>' +
      '<p class="footnote">Works fully offline. Skip, review and retry as many times as you like.</p>';

    app.querySelectorAll('.mode-card').forEach(el=>{
      el.addEventListener('click', ()=>{
        const mode = el.getAttribute('data-mode');
        if(mode==='full') return go('fullSetup');
        if(mode==='section') return go('sectionPicker');
        if(mode==='schemes'){
          const set = QUESTIONS.filter(schemeType);
          return startQuiz(set, {label:'Schemes-Only Sprint', set});
        }
      });
    });
  }

  // ---------- FULL TEST SETUP ----------
  function renderFullSetup(){
    app.innerHTML = masthead() +
      '<button class="back-link" id="backHome">&larr; Back to menu</button>' +
      '<h1 class="title">Full Practice Test</h1>' +
      '<p class="sub">All '+QUESTIONS.length+' questions from the capsule. Choose an order and begin.</p>' +
      '<div class="toggle-row">' +
        '<div class="toggle">' +
          '<button data-order="pdf" class="'+(state.order==='pdf'?'active':'')+'">PDF Order</button>' +
          '<button data-order="shuffled" class="'+(state.order==='shuffled'?'active':'')+'">Shuffled</button>' +
        '</div>' +
      '</div>' +
      '<div class="btn-row"><button class="btn primary" id="startFull">Begin Test &rarr;</button></div>';

    document.getElementById('backHome').addEventListener('click', ()=>go('home'));
    app.querySelectorAll('.toggle button').forEach(b=>{
      b.addEventListener('click', ()=>{ state.order = b.getAttribute('data-order'); renderFullSetup(); });
    });
    document.getElementById('startFull').addEventListener('click', ()=>{
      const set = state.order==='shuffled' ? shuffle(QUESTIONS) : QUESTIONS.slice();
      startQuiz(set, {label:'Full Practice Test ('+(state.order==='shuffled'?'Shuffled':'PDF Order')+')', set});
    });
  }

  // ---------- SECTION PICKER ----------
  function renderSectionPicker(){
    app.innerHTML = masthead() +
      '<button class="back-link" id="backHome">&larr; Back to menu</button>' +
      '<h1 class="title">Section-wise Revision</h1>' +
      '<p class="sub">Tap a topic to drill just those questions.</p>' +
      '<div class="section-grid">' +
      SECTIONS.map(s=>
        '<button class="section-tile" data-sec="'+esc(s.name)+'">'+
          '<span class="st-name">'+esc(s.name)+'</span>'+
          '<span class="st-count">'+s.count+' question'+(s.count===1?'':'s')+'</span>'+
        '</button>'
      ).join('') +
      '</div>';
    document.getElementById('backHome').addEventListener('click', ()=>go('home'));
    app.querySelectorAll('.section-tile').forEach(el=>{
      el.addEventListener('click', ()=>{
        const sec = el.getAttribute('data-sec');
        const set = QUESTIONS.filter(q=>q.section===sec);
        startQuiz(set, {label:sec, set});
      });
    });
  }

  // ---------- QUIZ ----------
  function renderQuiz(){
    const total = state.activeSet.length;
    const q = state.activeSet[state.idx];
    const answered = Object.keys(state.answers).length;
    const correctSoFar = Object.values(state.answers).filter(a=>a.status==='correct').length;
    const pct = Math.round((state.idx/total)*100);

    let optsHtml = '';
    q.options.forEach(opt=>{
      const letter = opt[0], text = opt[1];
      let cls = 'opt';
      if(state.lockedThisQ){
        cls += ' locked';
        if(letter === q.correct) cls += ' correct';
        else if(letter === state.selectedThisQ) cls += ' wrong';
      }
      optsHtml += '<button class="'+cls+'" data-letter="'+letter+'">'+
        '<span class="opt-letter">'+letter+'</span><span class="opt-text">'+esc(text)+'</span></button>';
    });

    let feedbackHtml = '';
    if(state.lockedThisQ){
      const wasSkipped = state.selectedThisQ === null;
      const wasCorrect = !wasSkipped && state.selectedThisQ === q.correct;
      const cls = wasSkipped ? '' : (wasCorrect ? 'is-correct' : 'is-wrong');
      const head = wasSkipped ? 'Skipped &mdash; correct answer shown above.' : (wasCorrect ? 'Correct.' : 'Not quite.');
      feedbackHtml = '<div class="feedback '+cls+'"><div class="fb-head">'+head+'</div><div class="fb-body">'+esc(q.explanation)+'</div></div>';
    }

    const isLast = state.idx === total-1;

    app.innerHTML =
      '<div class="quiz-topbar">' +
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="quiz-meta"><span>Question '+(state.idx+1)+' of '+total+'</span>' +
        '<span class="score-chip">'+correctSoFar+' correct</span></div>' +
      '</div>' +
      '<div class="tag-row"><span class="tag diff-'+q.difficulty+'">'+q.difficulty+'</span><span class="tag">'+esc(q.section)+'</span></div>' +
      renderContext(q.context) +
      '<div class="stem">'+esc(q.stem)+'</div>' +
      '<div class="options">'+optsHtml+'</div>' +
      feedbackHtml +
      '<div class="quiz-actions">' +
        (state.lockedThisQ
          ? '<span></span><button class="btn primary" id="nextBtn">'+(isLast?'Finish':'Next')+' &rarr;</button>'
          : '<button class="btn ghost" id="skipBtn">Skip</button><span></span>') +
      '</div>';

    if(!state.lockedThisQ){
      app.querySelectorAll('.opt').forEach(el=>{
        el.addEventListener('click', ()=>{
          const letter = el.getAttribute('data-letter');
          answerQuestion(q, letter);
        });
      });
      document.getElementById('skipBtn').addEventListener('click', ()=>{
        answerQuestion(q, null);
      });
    } else {
      document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    }
  }

  function answerQuestion(q, letter){
    if(state.lockedThisQ) return;
    state.lockedThisQ = true;
    state.selectedThisQ = letter;
    let status;
    if(letter === null) status = 'skipped';
    else status = (letter === q.correct) ? 'correct' : 'wrong';
    state.answers[q.id] = {status, selected:letter};
    renderQuiz();
  }

  function nextQuestion(){
    if(state.idx < state.activeSet.length-1){
      state.idx++;
      state.lockedThisQ = false;
      state.selectedThisQ = null;
      renderQuiz();
    } else {
      go('end');
    }
  }

  // ---------- END SCREEN ----------
  function renderEnd(){
    const set = state.activeSet;
    const total = set.length;
    const results = set.map(q=>({q, res:state.answers[q.id] || {status:'skipped', selected:null}}));
    const correct = results.filter(r=>r.res.status==='correct').length;
    const wrong = results.filter(r=>r.res.status==='wrong').length;
    const skipped = results.filter(r=>r.res.status==='skipped').length;
    const pct = total ? Math.round((correct/total)*100) : 0;

    const diffs = ['Easy','Moderate','Hard'];
    const diffHtml = diffs.map(d=>{
      const inDiff = results.filter(r=>r.q.difficulty===d);
      if(inDiff.length===0) return '';
      const c = inDiff.filter(r=>r.res.status==='correct').length;
      return '<div class="bd-card"><div class="bd-num">'+c+'/'+inDiff.length+'</div><div class="bd-label">'+d+'</div></div>';
    }).join('');

    const missed = results.filter(r=>r.res.status!=='correct');

    function reviewItem(r){
      const q = r.q, res = r.res;
      const tagCls = res.status==='skipped' ? 'skipped' : 'wrong';
      const tagText = res.status==='skipped' ? 'Skipped' : 'Incorrect';
      const yourAnsLine = res.status==='wrong'
        ? '<div class="ri-line">Your answer: <b>'+res.selected+'</b> &middot; Correct answer: <b>'+q.correct+'</b></div>'
        : '<div class="ri-line">Correct answer: <b>'+q.correct+'</b></div>';
      return '<div class="review-item">' +
        '<span class="ri-tag '+tagCls+'">'+tagText+'</span>' +
        '<div class="ri-stem">'+esc(q.stem)+'</div>' +
        yourAnsLine +
        '<div class="ri-exp">'+esc(q.explanation)+'</div>' +
      '</div>';
    }

    app.innerHTML = masthead() +
      '<h1 class="title">'+esc(state.lastSetDescriptor ? state.lastSetDescriptor.label : 'Results')+'</h1>' +
      '<div class="score-hero"><div class="big-num">'+correct+' / '+total+'</div>' +
        '<div class="big-label">'+pct+'% correct &middot; '+wrong+' incorrect &middot; '+skipped+' skipped</div></div>' +
      '<div class="breakdown">'+diffHtml+'</div>' +
      '<div class="btn-row">' +
        '<button class="btn primary" id="retryBtn">Retry Same Set</button>' +
        '<button class="btn" id="menuBtn">Back to Menu</button>' +
      '</div>' +
      (missed.length ? ('<div class="section-heading">Review &mdash; missed &amp; skipped ('+missed.length+')</div>' + missed.map(reviewItem).join(''))
        : '<p class="empty-note">Perfect run &mdash; nothing to review.</p>');

    document.getElementById('retryBtn').addEventListener('click', retrySameSet);
    document.getElementById('menuBtn').addEventListener('click', ()=>go('home'));
  }

  render();
})();
</script>
</body>
</html>
