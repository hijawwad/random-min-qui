<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>NABARD Grade A — ESI/GA Practice Ledger</title>
<style>
  :root{
    --bg:#12141c;
    --bg-2:#0d0f16;
    --surface:#1b1e29;
    --surface-2:#232838;
    --surface-3:#2a3040;
    --border:#323850;
    --border-soft:#262c40;
    --text:#e9e8e3;
    --text-dim:#a8afc2;
    --text-faint:#6d7590;
    --accent:#c9a227;
    --accent-bright:#e0bc4a;
    --accent-soft:rgba(201,162,39,0.14);
    --success:#4c9a6a;
    --success-soft:rgba(76,154,106,0.16);
    --error:#c1554b;
    --error-soft:rgba(193,85,75,0.16);
    --serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --radius:10px;
    --maxw:760px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 700px at 50% -10%, #1a1e2c 0%, var(--bg) 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  #app{max-width:var(--maxw); margin:0 auto; padding:28px 18px 60px;}

  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    padding-bottom:16px; margin-bottom:22px;
    border-bottom:1px solid var(--border-soft);
  }
  .masthead .brand{font-family:var(--serif); font-size:1.05rem; letter-spacing:0.02em; color:var(--text-dim);}
  .masthead .brand b{color:var(--accent-bright); font-weight:600;}
  .masthead .tally{font-size:0.78rem; color:var(--text-faint); font-variant-numeric:tabular-nums;}

  h1.title{
    font-family:var(--serif); font-weight:400; font-size:1.9rem; line-height:1.25;
    margin:0 0 6px; color:var(--text);
  }
  p.sub{color:var(--text-dim); font-size:0.96rem; margin:0 0 28px; max-width:56ch;}

  /* ---------- home mode cards ---------- */
  .mode-grid{display:flex; flex-direction:column; gap:14px;}
  .mode-card{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:20px 22px; color:var(--text);
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    position:relative; overflow:hidden;
  }
  .mode-card:hover{border-color:var(--accent); background:var(--surface-2);}
  .mode-card:active{transform:scale(0.997);}
  .mode-card .m-label{
    font-size:0.68rem; letter-spacing:0.06em; color:var(--accent-bright);
    font-family:var(--sans); font-weight:600; margin-bottom:6px; display:block;
  }
  .mode-card h3{font-family:var(--serif); font-weight:400; font-size:1.28rem; margin:0 0 6px;}
  .mode-card p{margin:0; color:var(--text-dim); font-size:0.9rem;}
  .mode-card .count-chip{
    position:absolute; right:20px; top:20px; font-size:0.75rem; color:var(--text-faint);
    font-variant-numeric:tabular-nums; text-align:right;
  }

  .footnote{margin-top:26px; font-size:0.78rem; color:var(--text-faint); text-align:center;}

  /* ---------- buttons / controls ---------- */
  .btn{
    font-family:var(--sans); font-size:0.88rem; font-weight:600; cursor:pointer;
    border-radius:8px; padding:11px 20px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); transition:.15s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); color:#20180a; border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent-bright);}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}

  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:0.83rem; color:var(--text-dim);
    cursor:pointer; margin-bottom:18px; background:none; border:none; padding:0; font-family:var(--sans);
  }
  .back-link:hover{color:var(--accent-bright);}

  /* ---------- toggle ---------- */
  .toggle-row{display:flex; align-items:center; gap:12px; margin:18px 0;}
  .toggle{
    display:inline-flex; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:8px; padding:3px;
  }
  .toggle button{
    border:none; background:transparent; color:var(--text-dim); padding:8px 16px; border-radius:6px;
    font-size:0.84rem; font-weight:600; cursor:pointer; font-family:var(--sans);
  }
  .toggle button.active{background:var(--accent); color:#20180a;}

  /* ---------- section grid ---------- */
  .section-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:480px){.section-grid{grid-template-columns:1fr;}}
  .section-tile{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:8px;
    padding:13px 15px; cursor:pointer; text-align:left; transition:.15s ease;
  }
  .section-tile:hover{border-color:var(--accent); background:var(--surface-2);}
  .section-tile .st-name{font-size:0.86rem; color:var(--text); display:block; margin-bottom:3px; font-weight:600;}
  .section-tile .st-count{font-size:0.74rem; color:var(--text-faint);}

  /* ---------- quiz screen ---------- */
  .quiz-topbar{margin-bottom:20px;}
  .progress-track{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-bottom:10px;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-bright)); transition:width .25s ease;}
  .quiz-meta{display:flex; justify-content:space-between; align-items:center; font-size:0.78rem; color:var(--text-faint); font-variant-numeric:tabular-nums;}
  .quiz-meta .score-chip{color:var(--success); font-weight:700;}
  .tag-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .tag{
    font-size:0.68rem; letter-spacing:0.04em; padding:3px 9px; border-radius:20px; font-weight:600;
    border:1px solid var(--border-soft); color:var(--text-dim); font-family:var(--sans);
  }
  .tag.diff-Easy{color:#8bbf9f; border-color:rgba(140,191,159,0.35);}
  .tag.diff-Moderate{color:#e0bc4a; border-color:rgba(224,188,74,0.35);}
  .tag.diff-Hard{color:#d38a82; border-color:rgba(211,138,130,0.35);}

  .passage{
    background:var(--surface-2); border-left:3px solid var(--accent);
    padding:14px 18px; border-radius:0 6px 6px 0; margin-bottom:18px;
    font-family:var(--serif); font-size:0.95rem; color:var(--text-dim); line-height:1.65;
  }
  .passage p{margin:0 0 8px;}
  .passage p:last-child{margin-bottom:0;}
  .passage ol{margin:6px 0 0; padding-left:22px;}
  .passage li{margin-bottom:4px;}

  .stem{
    font-family:var(--serif); font-size:1.18rem; line-height:1.5; color:var(--text);
    margin:0 0 20px;
  }

  .options{display:flex; flex-direction:column; gap:9px; margin-bottom:6px;}
  .opt{
    display:flex; align-items:flex-start; gap:12px; text-align:left; width:100%;
    background:var(--surface); border:1px solid var(--border-soft); border-radius:8px;
    padding:13px 16px; cursor:pointer; color:var(--text); font-size:0.93rem; font-family:var(--sans);
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(.locked){border-color:var(--accent); background:var(--surface-2);}
  .opt .opt-letter{
    flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700; color:var(--text-dim);
    margin-top:1px;
  }
  .opt .opt-text{flex:1; padding-top:1px;}
  .opt.correct{border-color:var(--success); background:var(--success-soft);}
  .opt.correct .opt-letter{border-color:var(--success); background:var(--success); color:#0d1a12;}
  .opt.wrong{border-color:var(--error); background:var(--error-soft);}
  .opt.wrong .opt-letter{border-color:var(--error); background:var(--error); color:#210a08;}
  .opt.locked{cursor:default;}
  .opt.locked:not(.correct):not(.wrong){opacity:0.55;}

  .feedback{
    margin-top:16px; padding:14px 18px; border-radius:8px; font-size:0.9rem; line-height:1.6;
    background:var(--surface-2); border:1px solid var(--border-soft);
  }
  .feedback.is-correct{border-color:rgba(76,154,106,0.4);}
  .feedback.is-wrong{border-color:rgba(193,85,75,0.4);}
  .feedback .fb-head{font-weight:700; margin-bottom:5px; font-size:0.86rem;}
  .feedback.is-correct .fb-head{color:var(--success);}
  .feedback.is-wrong .fb-head{color:var(--error);}
  .feedback .fb-body{color:var(--text-dim);}

  .quiz-actions{display:flex; justify-content:space-between; align-items:center; margin-top:22px;}

  /* ---------- end screen ---------- */
  .score-hero{
    text-align:center; padding:30px 20px; background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius); margin-bottom:22px;
  }
  .score-hero .big-num{font-family:var(--serif); font-size:3rem; color:var(--accent-bright); line-height:1;}
  .score-hero .big-label{font-size:0.85rem; color:var(--text-dim); margin-top:6px;}
  .breakdown{display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;}
  .breakdown .bd-card{
    flex:1; min-width:110px; background:var(--surface); border:1px solid var(--border-soft); border-radius:8px;
    padding:12px 14px; text-align:center;
  }
  .breakdown .bd-num{font-family:var(--serif); font-size:1.4rem; color:var(--text);}
  .breakdown .bd-label{font-size:0.72rem; color:var(--text-faint); margin-top:2px;}

  .review-item{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:8px;
    padding:16px 18px; margin-bottom:12px;
  }
  .review-item .ri-tag{font-size:0.7rem; font-weight:700; letter-spacing:0.03em; margin-bottom:8px; display:inline-block; padding:2px 9px; border-radius:20px;}
  .ri-tag.skipped{color:var(--text-dim); background:var(--surface-2);}
  .ri-tag.wrong{color:var(--error); background:var(--error-soft);}
  .review-item .ri-stem{font-family:var(--serif); font-size:1rem; margin-bottom:8px; color:var(--text);}
  .review-item .ri-line{font-size:0.85rem; margin-bottom:4px; color:var(--text-dim);}
  .review-item .ri-line b{color:var(--text);}
  .review-item .ri-exp{font-size:0.85rem; color:var(--text-dim); margin-top:8px; padding-top:8px; border-top:1px solid var(--border-soft);}

  .section-heading{font-family:var(--serif); font-size:1.1rem; margin:26px 0 12px; color:var(--text);}
  .empty-note{color:var(--text-faint); font-size:0.88rem; text-align:center; padding:20px 0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const QUESTIONS = [{"id":1,"section":"Elderline 14567","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Elderline 14567 is correct?","options":[["A","Elderline 14567 operates from 8:00 AM to 8:00 PM on all seven days of the week."],["B","The helpline is run by the Ministry of Rural Development."],["C","Elderline operates only from 9:00 AM to 6:00 PM on weekdays."],["D","Elderline provides services only in States, excluding Union Territories."],["E","Elderline was dedicated to the nation on 1st October 2020."]],"correct":"A","explanation":"Elderline 14567 works 8 AM to 8 PM, all 7 days. It was dedicated to the nation on 1st October 2021 (not 2020), is run by the Ministry of Social Justice and Empowerment (not Rural Development), and covers all States and Union Territories (Pan-India)."},{"id":2,"section":"Elderline 14567","type":"numbered","difficulty":"Moderate","context":"As of August 2026, the Ministry of Social Justice and Empowerment operates the National Helpline for Senior Citizens under two major initiatives.\n1. Elderline 14567 is a toll-free, pan-India single-window platform for senior citizens.\n2. The helpline was dedicated to the nation on 1st October 2021.\n3. Elderline works from 8:00 AM to 8:00 PM, seven days a week.\n4. The \"Take a Pledge\" initiative is run under the Ageing with Dignity campaign.\n5. Elderline handles only healthcare-related information services and does not offer guidance on legal or pension matters.","stem":"Which of the above statements are correct?","options":[["A","1, 3 and 5"],["B","1, 2, 3 and 4"],["C","2, 3 and 4"],["D","1, 2 and 3"],["E","All of the above"]],"correct":"B","explanation":"Statement 5 is incorrect — Elderline's Guidance Services also cover legal issues, pension-related matters, government schemes, maintenance issues and dispute resolution, not just healthcare information."},{"id":3,"section":"Elderline 14567","type":"notamong","difficulty":"Moderate","stem":"Which of the following is NOT a genuine category of services provided by Elderline 14567?","options":[["A","Guidance Services"],["B","Emotional support for loneliness and family disputes"],["C","Financial Compensation Services"],["D","Information Services"],["E","Field Intervention & Support"]],"correct":"C","explanation":"Elderline's real service categories are Information Services, Guidance Services, and Field Intervention & Support (which includes emotional support). 'Financial Compensation Services' is not a listed category."},{"id":4,"section":"Take a Pledge Campaign","type":"figure","difficulty":"Easy","stem":"The 'Take a Pledge' initiative, encouraging citizens to build an age-inclusive society, is run under which campaign?","options":[["A","Suraksha Bandhan Abhiyan"],["B","Sishu se Shakti Abhiyan"],["C","Viksit Bharat Senior Citizens Mission"],["D","Ageing with Dignity campaign"],["E","Elder Care India Campaign"]],"correct":"D","explanation":"The 'Take a Pledge' initiative is run under the Ageing with Dignity campaign, alongside Elderline 14567."},{"id":5,"section":"India's Debt-to-GDP Ratio","type":"figure","difficulty":"Easy","stem":"Which one of the following correctly pairs India's Debt-to-GDP ratio figures?","options":[["A","FY26 (provisional): 56.8%; Previous year: 58.2%"],["B","FY26 (provisional): 57.2%; Previous year: 58.5%"],["C","FY26 (provisional): 58.5%; Previous year: 58.2%"],["D","FY26 (provisional): 58.2%; Previous year: 59.5%"],["E","FY26 (provisional): 58.2%; Previous year: 58.5%"]],"correct":"E","explanation":"India's debt-to-GDP ratio moderated to 58.2% (provisional) in FY26, compared to 58.5% in the previous financial year."},{"id":6,"section":"Favara-UPI Corridor & UPI Abroad","type":"statement","difficulty":"Hard","stem":"Which one of the following statements about the Favara-UPI cross-border payment corridor is correct?","options":[["A","The corridor enables real-time transfer of funds from Maldives to India."],["B","The initial phase includes five participating Maldivian banks."],["C","Favara is UPI's own payment system operated by NPCI in the Maldives."],["D","The corridor supports merchant 'scan and pay' transactions in its initial phase."],["E","Transfers under Favara-UPI are credited in Indian Rupees but initiated in US Dollars."]],"correct":"A","explanation":"Transfers are initiated in Maldivian Rufiyaa (MVR), not US Dollars. The corridor is for Person-to-Person (P2P) transfers, not merchant scan-and-pay. Favara is the Maldives Monetary Authority's own instant payment system, not run by NPCI. Only two banks (Bank of Maldives Plc and Maldives Islamic Bank Plc) participate in the initial phase."},{"id":7,"section":"Favara-UPI Corridor & UPI Abroad","type":"numbered","difficulty":"Moderate","context":"Recently in August 2026, the Maldives Monetary Authority announced the integration of its instant payment system with India's UPI.\n1. The corridor allows real-time transfer of funds from Maldives to India.\n2. Transfers are initiated in Indian Rupees and credited in Maldivian Rufiyaa.\n3. The initial phase includes Bank of Maldives Plc and Maldives Islamic Bank Plc.\n4. Permitted categories include family maintenance-related and gift-related remittances.\n5. The facility also allows routine merchant QR-code shopping payments in India.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 3 and 4"],["C","2, 4 and 5"],["D","Only 1"],["E","1, 2 and 3"]],"correct":"B","explanation":"Statement 2 reverses the currency flow — transfers are initiated in Maldivian Rufiyaa and credited in Indian Rupees. Statement 5 is wrong — Maldives is live for remittances only, not routine merchant QR shopping."},{"id":8,"section":"Favara-UPI Corridor & UPI Abroad","type":"notamong","difficulty":"Hard","stem":"Which of the following is NOT among the nine countries where UPI is currently accepted for merchant payments (scan and pay)?","options":[["A","Singapore"],["B","Bhutan"],["C","Maldives"],["D","Cambodia"],["E","United Arab Emirates"]],"correct":"C","explanation":"The nine countries for UPI merchant/scan-and-pay payments are Bhutan, Singapore, UAE, France, Mauritius, Nepal, Sri Lanka, Qatar and Cambodia. Maldives (via Favara-UPI) is live only for remittances, not routine merchant QR shopping."},{"id":9,"section":"Favara-UPI Corridor & UPI Abroad","type":"numbered","difficulty":"Hard","context":"As of August 2026, UPI's international footprint has expanded across several countries.\n1. UPI is accepted for merchant payments in nine countries.\n2. Greece and Maldives are live for remittances only, not routine QR shopping.\n3. Uzbekistan has signed an agreement for UPI acceptance, with rollout expected within about a year.\n4. Including India, UPI is now operational in some form in 12 countries.\n5. The total number of foreign countries with a live UPI arrangement stands at 9.","stem":"Which of the above statements are correct?","options":[["A","1, 3 and 5"],["B","2, 3, 4 and 5"],["C","All of the above"],["D","1, 2, 3 and 4"],["E","1, 2 and 3"]],"correct":"D","explanation":"Statement 5 is incorrect — 11 foreign countries are operational in some form (9 for merchant payments + Greece and Maldives for remittances only), not 9."},{"id":10,"section":"Index of Core Industries (ICI)","type":"acronym","difficulty":"Easy","stem":"ICI, whose revised series was released by the Office of Economic Adviser, stands for:","options":[["A","Index of Industrial Core"],["B","Index of Composite Industries"],["C","Indicator of Core Infrastructure"],["D","Index of Core Infrastructure"],["E","Index of Core Industries"]],"correct":"E","explanation":"ICI stands for Index of Core Industries, compiled by the Office of Economic Adviser (OEA), DPIIT."},{"id":11,"section":"Index of Core Industries (ICI)","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the revised Index of Core Industries (ICI) is correct?","options":[["A","The new ICI series has Base Year 2022-23, replacing the old series with Base Year 2011-12."],["B","The ICI is compiled by the Ministry of Statistics and Programme Implementation (MoSPI)."],["C","The provisional ICI index is released on the 15th of the following month."],["D","The overall linking factor for the new ICI series is 1.74."],["E","ICI is released quarterly."]],"correct":"A","explanation":"ICI is compiled by the OEA under DPIIT (not MoSPI), the overall linking factor is 1.47 (not 1.74), the provisional index is released on the 20th (not 15th) of the following month, and it is a monthly (not quarterly) index."},{"id":12,"section":"Index of Core Industries (ICI)","type":"numbered","difficulty":"Moderate","context":"1. ICI is compiled by the Office of Economic Adviser under DPIIT.\n2. The new base year for ICI is 2022-23, replacing 2011-12.\n3. The overall linking factor is 1.47.\n4. Users cannot calculate sector-wise linking factors; only the overall figure is published.\n5. If the 20th falls on a non-working day, the index is released on the next working day.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 2, 3 and 5"],["C","1, 2 and 3"],["D","Only 1, 2 and 4"],["E","2, 3, 4 and 5"]],"correct":"B","explanation":"Statement 4 is incorrect — users CAN calculate the linking factor for individual sectors using the same formula."},{"id":13,"section":"MSME Sustainable (ZED) Certification","type":"acronym","difficulty":"Easy","stem":"Under the MSME Sustainable Certification Scheme, ZED stands for:","options":[["A","Zonal Economic Development"],["B","Zero Emission Development"],["C","Zero Defect Zero Effect"],["D","Zero Defect Environmental Design"],["E","Zero Deficiency Enterprise Development"]],"correct":"C","explanation":"ZED stands for Zero Defect Zero Effect — Zero Defect means minimum-defect manufacturing, Zero Effect means minimal environmental impact."},{"id":14,"section":"MSME Sustainable (ZED) Certification","type":"numbered","difficulty":"Hard","context":"1. Women-owned MSMEs get 100% subsidy on the cost of ZED Certification.\n2. Testing/System/Product certification support is available up to 75% of cost, capped at ₹50,000.\n3. Handholding and Consultancy support is capped at ₹3 lakh.\n4. Support for adopting Zero Effect solutions and cleaner technologies is available up to ₹3 lakh.\n5. The scheme is administered by the Ministry of Commerce and Industry.","stem":"Which of the above statements are correct?","options":[["A","2, 3 and 5"],["B","1, 3 and 4"],["C","1, 2, 3 and 4"],["D","1, 2 and 4"],["E","All of the above"]],"correct":"D","explanation":"Statement 3 is wrong — Handholding & Consultancy Support is capped at ₹2 lakh (₹3 lakh is for adopting Zero Effect solutions). Statement 5 is wrong — the scheme is run by the Ministry of MSME, not Commerce and Industry."},{"id":15,"section":"MSME Sustainable (ZED) Certification","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the MSME Sustainable (ZED) Certification Scheme is NOT correct?","options":[["A","Zero Effect means minimising negative impact on the environment."],["B","Zero Defect means manufacturing high-quality products with minimum defects."],["C","ZED stands for Zero Defect Zero Effect."],["D","The scheme aims to strengthen competitiveness of MSMEs in domestic and global markets."],["E","The scheme offers 100% subsidy on ZED Certification cost for all MSMEs regardless of ownership."]],"correct":"E","explanation":"The 100% subsidy on ZED Certification cost applies specifically to women-owned MSMEs, not all MSMEs."},{"id":16,"section":"Udyam Registration & MSME Portals","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about MSME digital platforms is correct?","options":[["A","The Udyam Assist Platform enables enterprises without GST or Income Tax registration to get formal recognition as micro enterprises."],["B","The MSME Online Dispute Resolution Portal resolves disputes for medium enterprises only."],["C","Udyam Assist Partners are private consultants who charge a registration fee."],["D","The Udyam Registration Portal was launched by the Ministry of Corporate Affairs."],["E","The Udyam Registration Portal is a paid registration process requiring documentary proof."]],"correct":"A","explanation":"Udyam Registration is free and self-declaration based, launched by the Ministry of MSME. The ODR Portal resolves disputes for Micro and Small Enterprises, not medium. Recognition through Udyam Assist is based on verified data from authorised Udyam Assist Partners, not a paid consultancy."},{"id":17,"section":"Udyam Registration & MSME Portals","type":"numbered","difficulty":"Moderate","context":"1. Udyam Registration Portal provides official identity to MSMEs.\n2. Udyam Assist Platform brings informal micro enterprises into the formal economy.\n3. Recognition under Udyam Assist is given based on verified data from authorised Udyam Assist Partners.\n4. The MSME ODR Portal resolves disputes related to delayed payments involving Micro and Small Enterprises.\n5. The Udyam Registration Portal charges a nominal fee for MSME registration.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 4"],["B","1, 2, 3 and 4"],["C","1, 3 and 5"],["D","2, 3 and 4"],["E","All of the above"]],"correct":"B","explanation":"Statement 5 is incorrect — Udyam Registration is free, paperless and self-declaration based."},{"id":18,"section":"Udyam Registration & MSME Portals","type":"acronym","difficulty":"Easy","stem":"ODR, under the MSME Online Dispute Resolution Portal, stands for:","options":[["A","Online Delayed-payment Resolution"],["B","Organised Dispute Registry"],["C","Online Dispute Resolution"],["D","Official Dispute Redressal"],["E","Online Data Resolution"]],"correct":"C","explanation":"ODR stands for Online Dispute Resolution, a digital platform resolving delayed payment disputes for Micro and Small Enterprises."},{"id":19,"section":"Index of Services Production (ISP)","type":"figure","difficulty":"Moderate","stem":"MoSPI's first Trial Index of Services Production covered how many sub-sectors, and for which month?","options":[["A","19 sub-sectors; March 2026"],["B","19 sub-sectors; April 2025"],["C","24 sub-sectors; April 2026"],["D","19 sub-sectors; April 2026"],["E","29 sub-sectors; April 2026"]],"correct":"D","explanation":"The first Trial Index of Services Production (ISP) was released for 19 sub-sectors for the month of April 2026."},{"id":20,"section":"Index of Services Production (ISP)","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the Index of Services Production (ISP) is correct?","options":[["A","India aims to achieve a 15% share in global services by 2047."],["B","Services sector contribution to GVA has exceeded 50% only since 2020-21."],["C","ISP is released on the 20th of every month with an average time lag of 60 days."],["D","ISP covers both formal and informal services sector enterprises."],["E","The base year for ISP is 2024-25, and the trial index covers about 60% of the services sector."]],"correct":"E","explanation":"ISP is released on the 29th (not 20th) of every month. It covers only the formal services sector. Services have contributed over 50% of GVA since 2013-14. India's target is a 10% (not 15%) share in global services by 2047."},{"id":21,"section":"Index of Services Production (ISP)","type":"numbered","difficulty":"Moderate","context":"1. ISP is a monthly high-frequency indicator covering only the formal services sector.\n2. The trial index released in April 2026 covered about 60% of the services sector.\n3. ISP will be regularly released on the 29th of every month, or the next working day if the 29th is a holiday.\n4. The time lag for ISP release is approximately 90 days.\n5. Core government activities, non-market activities and the informal sector are excluded from ISP coverage.","stem":"Which of the above statements are correct?","options":[["A","1, 2, 3 and 5"],["B","1, 3 and 4"],["C","1, 2 and 3"],["D","2, 4 and 5"],["E","All of the above"]],"correct":"A","explanation":"Statement 4 is incorrect — the time lag for ISP release is approximately 60 days, not 90 days."},{"id":22,"section":"Index of Services Production (ISP)","type":"numbered","difficulty":"Hard","context":"The following deflators are used to convert value-based ISP data into volume-based data.\n1. Wholesale Trade — Wholesale Price Index (WPI)\n2. Repair & Maintenance, Banking, Insurance — CPI-General\n3. Most other sectors — Relevant or closest matching CPI\n4. Sectors without a specific CPI — CPI-Services\n5. Road Transport — Producer Price Index (PPI)","stem":"Which of the above statements is/are incorrect?","options":[["A","All of the above"],["B","Only 5"],["C","4 and 5"],["D","None of the above"],["E","Only 3"]],"correct":"B","explanation":"Statement 5 is fabricated — the passage lists only four deflator categories (WPI for Wholesale Trade; CPI-General for Repair & Maintenance/Banking/Insurance; relevant/closest CPI for most sectors; CPI-Services for sectors without a specific CPI). A separate PPI-based rule for Road Transport is not mentioned."},{"id":23,"section":"Index of Services Production (ISP)","type":"figure","difficulty":"Easy","stem":"In 2024-25, the services sector's share of India's Gross Value Added (GVA) stood close to which figure?","options":[["A","55.9%"],["B","60.9%"],["C","52.9%"],["D","50.9%"],["E","48.9%"]],"correct":"C","explanation":"In 2024-25, the services sector's share of GVA stood close to 52.9%."},{"id":24,"section":"GOBARdhan Scheme","type":"acronym","difficulty":"Easy","stem":"GOBARdhan, India's National Unified Scheme for Compressed Biogas, stands for:","options":[["A","Galvanizing Organic Bio-Agro Rural Development"],["B","Global Organic Bio-Agro Resource Development"],["C","Galvanizing Organic Biomass Agro Resources Dhan"],["D","Galvanizing Organic Bio-Agro Resources Dhan"],["E","Government Organic Biogas and Agro Resources Dhan"]],"correct":"D","explanation":"GOBARdhan stands for Galvanizing Organic Bio-Agro Resources Dhan."},{"id":25,"section":"GOBARdhan Scheme","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about GOBARdhan is correct?","options":[["A","The scheme's total outlay is ₹32,731 crore."],["B","The scheme's nodal ministry is the Ministry of New and Renewable Energy."],["C","GOBARdhan was originally launched in 2015 under the Swachh Bharat Mission."],["D","GOBARdhan's implementation period runs from FY2025-26 to FY2034-35."],["E","GOBARdhan was approved by the Union Cabinet on 6 August 2026 with a total outlay of ₹23,731 crore."]],"correct":"E","explanation":"The implementation period is FY2026-27 to FY2035-36; the nodal ministry is Petroleum and Natural Gas (MoPNG); and GOBARdhan was originally launched in 2018 (not 2015)."},{"id":26,"section":"GOBARdhan Scheme","type":"numbered","difficulty":"Moderate","context":"Under the Assured CBG Offtake growth engine of GOBARdhan, City Gas Distribution entities must procure CBG as per a fixed obligation trajectory.\n1. 3% obligation in FY 2026-27\n2. 4% obligation in FY 2027-28\n3. 5% obligation from FY 2028-29 onwards\n4. The administered price of CBG is fixed at ₹2,110 per MMBTU.\n5. This price is equivalent to ₹150 per kg of CBG.","stem":"Which of the above statements are correct?","options":[["A","1, 2, 3 and 4"],["B","All of the above"],["C","1, 3 and 5"],["D","2, 4 and 5"],["E","1, 2 and 3"]],"correct":"A","explanation":"Statement 5 is incorrect — ₹2,110 per MMBTU is equivalent to ₹105 per kg of CBG, not ₹150 per kg."},{"id":27,"section":"GOBARdhan Scheme","type":"notamong","difficulty":"Hard","stem":"Which of the following is NOT one of the six growth engines (components) of GOBARdhan?","options":[["A","Assured CBG Offtake"],["B","National CBG Export Promotion Council"],["C","Development of Pipeline Infrastructure"],["D","Capital Assistance"],["E","Stable CBG Pricing Framework"]],"correct":"B","explanation":"The six growth engines are Assured CBG Offtake, Stable CBG Pricing Framework, Capital Assistance, Development of Pipeline Infrastructure, Credit Guarantee Support, and CBG Ecosystem Challenge Fund. 'National CBG Export Promotion Council' is not among them."},{"id":28,"section":"GOBARdhan Scheme","type":"numbered","difficulty":"Moderate","context":"Expected outcomes of GOBARdhan over 10 years:\n1. Growth in CBG production is expected to be nearly 10-fold.\n2. Foreign exchange savings are projected at over ₹40,000 crore.\n3. Fossil fuel displacement is targeted at 10 MMT.\n4. Employment generation is expected to exceed 2.5 lakh jobs.\n5. Organic fertilizer production target is 250 MMT.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 4 and 5"],["C","1, 2, 3 and 5"],["D","1, 2 and 4"],["E","2, 3 and 4"]],"correct":"C","explanation":"Statement 4 is incorrect — employment generation is expected to exceed 1.5 lakh jobs, not 2.5 lakh."},{"id":29,"section":"GOBARdhan Scheme","type":"figure","difficulty":"Hard","stem":"Under GOBARdhan's Capital Assistance component, what is the maximum capital assistance for greenfield CBG projects, and the credit guarantee coverage limit for MSME-based CBG projects?","options":[["A","₹3 crore per TPD; 75% credit guarantee"],["B","₹2 crore per TPD; 75% credit guarantee"],["C","₹2.5 crore per TPD; 90% credit guarantee"],["D","₹2 crore per TPD; 85% credit guarantee"],["E","₹1.5 crore per TPD; 85% credit guarantee"]],"correct":"D","explanation":"Capital assistance is up to ₹2 crore per tonne per day (TPD) for greenfield projects, and credit guarantee coverage is up to 85% on eligible loans for MSME-based CBG projects."},{"id":30,"section":"GOBARdhan Scheme","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements is NOT correct?","options":[["A","Before GOBARdhan's consolidation, the CBG ecosystem was spread across four different ministries."],["B","The Strait of Hormuz carries 55–60% of India's LNG imports."],["C","GOBARdhan's vision states that India's villages will become centres of clean energy production."],["D","India currently meets nearly 50% of its natural gas requirement through imports."],["E","GOBARdhan was originally launched under the Ayushman Bharat scheme in 2018."]],"correct":"E","explanation":"GOBARdhan was originally launched in 2018 under the Swachh Bharat Mission (Grameen), not the Ayushman Bharat scheme."},{"id":31,"section":"CPGRAMS","type":"acronym","difficulty":"Easy","stem":"CPGRAMS, the Government of India's flagship grievance redressal platform, stands for:","options":[["A","Centralised Public Grievance Redress and Monitoring System"],["B","Centralised Portal for Grievance Redressal and Monitoring Services"],["C","Centralised Public Grievance Registration and Management System"],["D","Central Public Grievance Resolution and Monitoring System"],["E","Central Public Grievance Redressal Agency Management System"]],"correct":"A","explanation":"CPGRAMS stands for Centralised Public Grievance Redress and Monitoring System."},{"id":32,"section":"CPGRAMS","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about CPGRAMS is correct?","options":[["A","Appeals against unresolved grievances must be filed before the Central Vigilance Commission."],["B","Grievances under CPGRAMS should be resolved within 21 days, reduced from the earlier 30 days as per August 2024 guidelines."],["C","CPGRAMS entertains RTI-related grievances on a priority basis."],["D","CPGRAMS is available in 18 scheduled languages plus English."],["E","An appeal filed with the Nodal Appellate Authority must be resolved within 45 days."]],"correct":"B","explanation":"CPGRAMS is available in 22 scheduled languages plus English, appeals go to the Nodal Appellate Authority (not CVC) and must be resolved within 30 days (not 45), and RTI matters are explicitly excluded from CPGRAMS."},{"id":33,"section":"CPGRAMS","type":"numbered","difficulty":"Moderate","context":"1. The number of grievances handled annually has increased nearly nine-fold since 2014.\n2. About 3.01 lakh grievances were handled in 2014, rising to around 27 lakh in 2024.\n3. CPGRAMS has launched an AI-enabled voice chatbot named \"Samadhan Didi\".\n4. CPGRAMS entertains grievances related to sub-judice court matters if the citizen requests expedited review.\n5. Service matters of government employees, including disciplinary proceedings, are excluded from CPGRAMS.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 3 and 4"],["C","1, 2, 3 and 5"],["D","1, 2 and 4"],["E","2, 4 and 5"]],"correct":"C","explanation":"Statement 4 is incorrect — court-related/sub-judice matters are NOT entertained by CPGRAMS under any circumstance."},{"id":34,"section":"CPGRAMS","type":"notamong","difficulty":"Moderate","stem":"Which of the following is NOT among the categories of grievances excluded from redress under CPGRAMS?","options":[["A","Religious matters"],["B","RTI matters"],["C","Service matters of government employees, including disciplinary proceedings"],["D","Consumer protection disputes"],["E","Court-related/Sub-judice matters"]],"correct":"D","explanation":"CPGRAMS excludes RTI matters, court-related/sub-judice matters, religious matters, and service matters of government employees. 'Consumer protection disputes' is not one of the listed exclusions."},{"id":35,"section":"CPGRAMS","type":"figure","difficulty":"Easy","stem":"What was the growth trajectory in the number of grievances handled annually by CPGRAMS between 2014 and 2024?","options":[["A","Rose from about 5 lakh to around 27 lakh, a nearly five-fold increase"],["B","Rose from about 3.01 lakh to around 21 lakh, a nearly seven-fold increase"],["C","Rose from about 3.01 lakh to around 30 lakh, a ten-fold increase"],["D","Rose from about 1.01 lakh to around 27 lakh, a nearly 27-fold increase"],["E","Rose from about 3.01 lakh to around 27 lakh, a nearly nine-fold increase"]],"correct":"E","explanation":"Grievances handled annually rose from about 3.01 lakh in 2014 to around 27 lakh in 2024, a nearly nine-fold increase."},{"id":36,"section":"MSMED (Amendment) Bill, 2026","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the MSMED (Amendment) Bill, 2026 is correct?","options":[["A","The Bill bases MSME classification on both investment in plant & machinery/equipment and turnover."],["B","The Bill was passed by Parliament in July 2026."],["C","Under the 2026 Bill, MSME registration remains mandatory for medium manufacturing enterprises."],["D","The 2026 Bill removes the TReDS-based invoice settlement requirement for CPSEs."],["E","As per Economic Survey 2025-26, MSMEs contribute 41.1% to India's GDP."]],"correct":"A","explanation":"As per Economic Survey 2025-26, MSMEs contribute 31.1% (not 41.1%) to GDP. Under the 2026 Bill, MSME registration is free and voluntary for all MSMEs. The Bill was passed in August 2026, and it INTRODUCES (not removes) the TReDS settlement requirement for CPSEs."},{"id":37,"section":"MSMED (Amendment) Bill, 2026","type":"numbered","difficulty":"Moderate","context":"As per Economic Survey 2025-26, cited to justify the MSMED (Amendment) Bill, 2026:\n1. MSMEs contribute 31.1% to GDP.\n2. MSMEs contribute 35.4% of manufacturing output.\n3. MSMEs account for 48.58% of India's exports.\n4. MSMEs employ over 30% of the country's total workforce.\n5. The MSMED Act being amended dates to 2006.","stem":"Which of the above statements are correct?","options":[["A","1, 4 and 5"],["B","1, 2, 3 and 5"],["C","1, 2 and 4"],["D","All of the above"],["E","2, 3 and 4"]],"correct":"B","explanation":"Statement 4 is not supported by the passage — no workforce-employment figure is cited among the Economic Survey figures given."},{"id":38,"section":"MSMED (Amendment) Bill, 2026","type":"numbered","difficulty":"Hard","context":"1. All CPSEs must settle invoices for goods/services procured from MSMEs through the TReDS platform.\n2. States may also mandate their Public Sector Enterprises to use TReDS.\n3. The value of invoices discounted through TReDS rose from ₹40,000 crore in 2022-23 to ₹3.47 lakh crore in 2025-26.\n4. TReDS stands for Trade Receivables Electronic Discounting System.\n5. The TReDS mandate for CPSEs is a new provision introduced by the 2026 Bill.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 4 and 5"],["C","1, 2, 3 and 5"],["D","2, 3 and 4"],["E","1, 2 and 4"]],"correct":"C","explanation":"Statement 4 is incorrect — TReDS stands for Trade Receivables Discounting System (no 'Electronic' in the name)."},{"id":39,"section":"MSMED (Amendment) Bill, 2026","type":"acronym","difficulty":"Easy","stem":"TReDS, the electronic platform for MSME invoice financing/discounting, stands for:","options":[["A","Trade Receivables Electronic Discounting System"],["B","Trade Revenue Discounting System"],["C","Traders' Receivables Discounting Scheme"],["D","Trade Receivables Discounting System"],["E","Trade Receivables Development System"]],"correct":"D","explanation":"TReDS stands for Trade Receivables Discounting System."},{"id":40,"section":"MSMED (Amendment) Bill, 2026","type":"numbered","difficulty":"Hard","context":"1. Mediation must be completed within 90 days from the date fixed for first appearance.\n2. If mediation fails, the matter must be referred for arbitration within 30 days.\n3. The arbitral award must be made within 90 days from the completion of pleadings.\n4. If an application to set aside a Council's order remains pending for more than 6 months, the court shall direct payment of at least 50% of the awarded amount.\n5. An application to set aside a Council's order can be filed only after depositing 100% of the awarded amount.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","2, 4 and 5"],["C","1, 3 and 5"],["D","All of the above"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is incorrect — the application can be filed after depositing 75% (not 100%) of the awarded amount."},{"id":41,"section":"MSMED (Amendment) Bill, 2026","type":"statement","difficulty":"Hard","stem":"Which one of the following 'Offence — New Punishment (2026 Bill)' pairs is INCORRECTLY matched?","options":[["A","Non-disclosure of unpaid dues by buyers (1st instance) — Fine of at least ₹10,000"],["B","Non-filing of registration/non-supply of information — Decriminalised"],["C","Non-disclosure of unpaid dues by buyers (3rd & subsequent instance) — Fine"],["D","Furnishing incorrect information (2nd & subsequent instance) — Penalty"],["E","Furnishing incorrect information (1st instance) — Warning"]],"correct":"A","explanation":"Under the 2026 Bill, the 1st instance of non-disclosure of unpaid dues attracts a Warning, not a fine of ₹10,000 (that was the punishment under the earlier 2006 Act)."},{"id":42,"section":"MSMED (Amendment) Bill, 2026","type":"numbered","difficulty":"Hard","context":"1. Under the 2026 Bill, State Governments can establish multiple MSEFCs for faster resolution.\n2. States are now empowered to provide adequate infrastructure, digital systems and trained manpower for MSEFCs.\n3. Filing of the Udyam memorandum is now free and voluntary for all MSMEs.\n4. Earlier (under the 2006 Act), State Governments could establish only a single MSEFC per state.\n5. The 2026 Bill makes MSME registration mandatory for all micro enterprises.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 2 and 3"],["C","1, 3 and 4"],["D","1, 2 and 4"],["E","2, 4 and 5"]],"correct":"B","explanation":"Statement 4 is incorrect — earlier, State Governments could already establish 'one or more' MSEFCs. Statement 5 is incorrect — registration is now free and voluntary for all MSMEs, not mandatory."},{"id":43,"section":"MSMED (Amendment) Bill, 2026","type":"figure","difficulty":"Moderate","stem":"Which one of the following correctly pairs the value of invoices discounted through TReDS?","options":[["A","₹4 lakh crore in 2022-23; ₹3.47 lakh crore in 2025-26"],["B","₹50,000 crore in 2022-23; ₹4.37 lakh crore in 2025-26"],["C","₹40,000 crore in 2022-23; ₹3.47 lakh crore in 2025-26"],["D","₹40,000 crore in 2021-22; ₹3.47 lakh crore in 2025-26"],["E","₹40,000 crore in 2022-23; ₹3.47 crore in 2025-26"]],"correct":"C","explanation":"The value of invoices discounted through TReDS rose from ₹40,000 crore in 2022-23 to ₹3.47 lakh crore in 2025-26."},{"id":44,"section":"CBDC-based DBT under PMGKAY","type":"acronym","difficulty":"Easy","stem":"CBDC, the digital form of the Digital Rupee used for the new DBT rollout under PMGKAY, stands for:","options":[["A","Centralised Banking Digital Currency"],["B","Consolidated Bank Digital Currency"],["C","Central Board Digital Currency"],["D","Central Bank Digital Currency"],["E","Central Bank Digital Cash"]],"correct":"D","explanation":"CBDC stands for Central Bank Digital Currency."},{"id":45,"section":"CBDC-based DBT under PMGKAY","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about CBDC-based DBT under PMGKAY is correct?","options":[["A","The scheme was first piloted in Jammu & Kashmir and Ladakh."],["B","CBDC tokens under this scheme are non-programmable."],["C","PMGKAY beneficiaries will receive subsidy in cash directly at ration shops."],["D","Earlier pilots of this system were conducted in Delhi and Chandigarh."],["E","The scheme will first be operationalised in the Union Territories of Chandigarh and Dadra & Nagar Haveli."]],"correct":"E","explanation":"Earlier pilots were conducted in Puducherry and Gujarat (not Delhi/Chandigarh or J&K/Ladakh). Beneficiaries receive subsidy via programmable Digital Rupee (CBDC) tokens, not cash."},{"id":46,"section":"CBDC-based DBT under PMGKAY","type":"numbered","difficulty":"Moderate","context":"1. Chandigarh and Dadra & Nagar Haveli are the first Union Territories to operationalise CBDC-based DBT under PMGKAY.\n2. Earlier pilots of the system were conducted in Puducherry and Gujarat.\n3. Beneficiaries will receive food subsidy directly into their CBDC wallets instead of conventional bank accounts.\n4. The transfer will use programmable Digital Rupee tokens.\n5. Beneficiaries can use these tokens at any retail merchant, not just empanelled ones.","stem":"Which of the above statements are correct?","options":[["A","1, 2, 3 and 4"],["B","2, 4 and 5"],["C","1, 3 and 5"],["D","1, 2 and 3"],["E","All of the above"]],"correct":"A","explanation":"Statement 5 is incorrect — beneficiaries can use the tokens only to purchase foodgrains from empanelled merchants."},{"id":47,"section":"CBDC-based DBT under PMGKAY","type":"acronym","difficulty":"Easy","stem":"PMGKAY, the scheme under which CBDC-based DBT is being rolled out, stands for:","options":[["A","Pradhan Mantri Garib Kalyan Awas Yojana"],["B","Pradhan Mantri Garib Kalyan Anna Yojana"],["C","Pradhan Mantri Garib Kisan Awas Yojana"],["D","Pradhan Mantri Grameen Kalyan Anna Yojana"],["E","Pradhan Mantri Gramin Kalyan Anna Yojana"]],"correct":"B","explanation":"PMGKAY stands for Pradhan Mantri Garib Kalyan Anna Yojana."},{"id":48,"section":"Currency-in-Circulation & Reserve Money","type":"numbered","difficulty":"Moderate","context":"1. Currency-in-Circulation growth decelerated to 3.7% for the week ended 9 February, from 8.2% a year ago.\n2. This slowdown reflects the RBI's decision to withdraw ₹2,000 banknotes.\n3. Reserve Money growth decelerated to 5.8% as on 9 February 2024, compared to 11.2% a year ago.\n4. 'Currency with the Public' equals Currency-in-Circulation plus cash held by banks.\n5. Currency-in-Circulation refers to notes and coins in circulation.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 4"],["B","All of the above"],["C","1, 2, 3 and 5"],["D","1, 4 and 5"],["E","2, 3 and 4"]],"correct":"C","explanation":"Statement 4 is incorrect — Currency with the Public equals Currency-in-Circulation MINUS cash held by banks, not plus."},{"id":49,"section":"Currency-in-Circulation & Reserve Money","type":"figure","difficulty":"Easy","stem":"Reserve Money (RM) growth decelerated to what rate as on 9 February 2024, compared to what rate a year ago?","options":[["A","5.8%; 8.2%"],["B","8.2%; 11.2%"],["C","3.7%; 8.2%"],["D","5.8%; 11.2%"],["E","11.2%; 5.8%"]],"correct":"D","explanation":"Reserve Money growth decelerated to 5.8% as on 9 February 2024, compared to 11.2% a year ago."},{"id":50,"section":"80th Independence Day & Sapta Dhara","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the 80th Independence Day is correct?","options":[["A","The goal of 'Viksit Bharat' is to be achieved by 2035."],["B","India is celebrating 100 years of Vande Mataram this year."],["C","The National Flag on the 80th Independence Day was hoisted by the President of India."],["D","Sapta Dhara refers to seven newly announced infrastructure corridors."],["E","The National Flag was hoisted by Justice Ajay Manikrao Khanwilkar, Chairperson of the Lokpal of India."]],"correct":"E","explanation":"India is celebrating 150 years (not 100) of Vande Mataram. 'Viksit Bharat' is targeted for 2047 (not 2035). Sapta Dhara refers to seven 'streams of strength' announced by the PM, not infrastructure corridors."},{"id":51,"section":"80th Independence Day & Sapta Dhara","type":"notamong","difficulty":"Hard","stem":"Which of the following is NOT one of the seven streams of strength (Sapta Dhara) announced by the PM?","options":[["A","Digital Public Infrastructure"],["B","Power of Manufacturing"],["C","Technology and Innovation"],["D","Agriculture and Food Production"],["E","Defence Power"]],"correct":"A","explanation":"The seven streams (Sapta Dhara) are Power of Manufacturing, Agriculture and Food Production, Technology and Innovation, Gati Shakti, Defence Power, Green Economy and Blue Economy, and Soft Power. 'Digital Public Infrastructure' is not one of them."},{"id":52,"section":"80th Independence Day & Sapta Dhara","type":"numbered","difficulty":"Moderate","context":"1. Sapta Dhara was a term used by PM Modi in his 80th Independence Day speech.\n2. Sapta Dhara comprises seven streams of strength, including Gati Shakti and Soft Power.\n3. India will train 1 crore young people in AI skills over the next one year.\n4. India is set to host the 2030 Commonwealth Games.\n5. India (Bharat) will also host the 2036 Olympic Games, as announced this year.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 3"],["B","1, 2, 3 and 4"],["C","All of the above"],["D","2, 4 and 5"],["E","1, 3 and 5"]],"correct":"B","explanation":"Statement 5 is not supported by the passage — no announcement regarding hosting the 2036 Olympics is mentioned."},{"id":53,"section":"80th Independence Day & Sapta Dhara","type":"figure","difficulty":"Easy","stem":"According to the PM's 80th Independence Day speech, by which year does India aim to achieve 'Viksit Bharat' (Developed India)?","options":[["A","2040"],["B","2050"],["C","2047"],["D","2035"],["E","2030"]],"correct":"C","explanation":"The goal of achieving 'Viksit Bharat' (Developed India) is targeted for 2047."},{"id":54,"section":"EPFO VISHWAS, 2026","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about EPFO's 'VISHWAS, 2026' is correct?","options":[["A","The scheme is a permanent replacement for EPFO's penalty structure."],["B","Under VISHWAS, 2026, defaults exceeding 4 months attract a reduced damage rate of 0.50% per month."],["C","VISHWAS, 2026 applies to EPFO defaults occurring after 14 June 2024."],["D","VISHWAS, 2026 is effective from 29 June 2026 and remains in force for 6 months from the date of notification."],["E","VISHWAS, 2026 was launched by the Ministry of Labour and Employment directly, bypassing EPFO."]],"correct":"D","explanation":"VISHWAS, 2026 applies to defaults PRIOR TO 14 June 2024. Defaults exceeding 4 months attract a reduced rate of 1.00% per month (not 0.50%). It is a one-time, six-month scheme launched by EPFO itself, not a permanent replacement."},{"id":55,"section":"EPFO VISHWAS, 2026","type":"numbered","difficulty":"Moderate","context":"1. VISHWAS, 2026 is a one-time dispute resolution initiative launched by EPFO.\n2. It applies to defaults pertaining to the period prior to 14 June 2024.\n3. For defaults up to 2 months, the reduced rate of damages is 0.25% per month.\n4. For defaults exceeding 4 months, the reduced rate is 1.00% per month.\n5. The scheme became effective on 29 June 2024.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 3 and 5"],["C","1, 2 and 3"],["D","2, 4 and 5"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is incorrect — the scheme became effective on 29 June 2026, not 2024."},{"id":56,"section":"EPFO VISHWAS, 2026","type":"figure","difficulty":"Easy","stem":"Under VISHWAS, 2026, what is the reduced rate of damages for a default duration 'from 2 months to less than 4 months'?","options":[["A","0.50% per month"],["B","1.00% per month"],["C","1.50% per month"],["D","0.25% per month"],["E","0.75% per month"]],"correct":"A","explanation":"For defaults from 2 months to less than 4 months, the reduced rate of damages under VISHWAS, 2026 is 0.50% per month."},{"id":57,"section":"ADB Loan & Urban Challenge Fund","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about the ADB loan for urban transformation is correct?","options":[["A","Under the UCF funding pattern, 50% of project funding comes directly from the Urban Challenge Fund."],["B","The Urban Challenge Fund has a central assistance of ₹1 lakh crore and runs from FY2025-26 to FY2030-31, extendable up to FY2033-34."],["C","Indian cities currently contribute about 75% of India's GDP."],["D","The ADB loan is accompanied by USD 10 million in technical assistance."],["E","ADB's loan of USD 1 billion will be implemented by the Ministry of Finance."]],"correct":"B","explanation":"The programme is implemented by the Ministry of Housing and Urban Affairs (not Finance). Only 25% (not 50%) of project funding comes from the UCF. Indian cities currently contribute about 63% of GDP (expected to climb to 75% by 2030). The technical assistance is USD 3 million, not USD 10 million."},{"id":58,"section":"ADB Loan & Urban Challenge Fund","type":"numbered","difficulty":"Moderate","context":"1. ADB approved a USD 1 billion loan along with USD 3 million in technical assistance for India's urban transformation.\n2. The programme will be implemented by the Ministry of Housing and Urban Affairs.\n3. Indian cities create nearly 70% of new jobs and contribute about 63% of the country's GDP.\n4. This urban share of GDP is expected to climb to 75% by 2035.\n5. The Urban Challenge Fund is a Centrally Sponsored Scheme under MoHUA.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 4"],["B","All of the above"],["C","1, 2, 3 and 5"],["D","2, 3 and 4"],["E","1, 4 and 5"]],"correct":"C","explanation":"Statement 4 is incorrect — the urban GDP share is expected to climb to 75% by 2030, not 2035."},{"id":59,"section":"ADB Loan & Urban Challenge Fund","type":"numbered","difficulty":"Moderate","context":"Funding pattern for projects under the Urban Challenge Fund:\n1. 25% of project funding comes from the Urban Challenge Fund.\n2. 50% is to be mobilised through market-based financing.\n3. 25% comes from the State/UT/Urban Local Body or additional market borrowing.\n4. The Union government bears 75% of the funding for each project.\n5. The UCF's duration is FY2025-26 to FY2030-31, extendable up to FY2033-34.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 2 and 4"],["C","1, 4 and 5"],["D","1, 2, 3 and 5"],["E","2, 3 and 4"]],"correct":"D","explanation":"Statement 4 is incorrect — it contradicts the actual 25/50/25 funding split; the Union government does not bear 75% of funding directly."},{"id":60,"section":"ADB Loan & Urban Challenge Fund","type":"figure","difficulty":"Easy","stem":"What total central assistance has been allocated for the Urban Challenge Fund?","options":[["A","₹1.5 lakh crore"],["B","₹50,000 crore"],["C","₹75,000 crore"],["D","₹2 lakh crore"],["E","₹1 lakh crore"]],"correct":"E","explanation":"The Urban Challenge Fund's central assistance is ₹1 lakh crore."},{"id":61,"section":"ADB Loan & Urban Challenge Fund","type":"acronym","difficulty":"Easy","stem":"UCF, the Centrally Sponsored Scheme supported by the ADB-funded urban transformation programme, stands for:","options":[["A","Urban Challenge Fund"],["B","Urban Cities Fund"],["C","Universal Challenge Fund"],["D","Urban Credit Facility"],["E","Urban Capital Fund"]],"correct":"A","explanation":"UCF stands for Urban Challenge Fund."},{"id":62,"section":"Bharat Maritime Insurance Pool (P&I)","type":"acronym","difficulty":"Easy","stem":"P&I insurance, India's first sovereign-backed product of this kind, stands for:","options":[["A","Pool & Indemnity"],["B","Protection & Indemnity"],["C","Premium & Indemnity"],["D","Protection & Insurance"],["E","Protection & Investment"]],"correct":"B","explanation":"P&I insurance stands for Protection & Indemnity."},{"id":63,"section":"Bharat Maritime Insurance Pool (P&I)","type":"statement","difficulty":"Hard","stem":"Which one of the following statements about India's first sovereign-backed P&I insurance product is correct?","options":[["A","The product offers third-party liability cover of up to USD 2.5 billion."],["B","The Bharat Maritime Insurance Pool is managed by NIACL, with GIC Re acting as underwriter."],["C","It is designed and issued by The New India Assurance Company Limited (NIACL)."],["D","The product is regulated solely by the Insurance Regulatory and Development Authority of India."],["E","The first policy under BMIP was handed over to the Ministry of Ports, Shipping and Waterways."]],"correct":"C","explanation":"The pool is managed by GIC Re, with NIACL as primary underwriter (the statement about BMIP's management reverses these roles). The first policy was handed to the Shipping Corporation of India, not MoPSW. Coverage is up to USD 1.5 billion, not 2.5 billion. The product is jointly regulated by IRDAI and MoPSW, not IRDAI alone."},{"id":64,"section":"Bharat Maritime Insurance Pool (P&I)","type":"numbered","difficulty":"Moderate","context":"1. The Bharat Maritime Insurance Pool offers third-party liability cover of up to USD 1.5 billion.\n2. NIACL serves as the primary underwriter and product architect of the pool.\n3. GIC Re manages the pool.\n4. The first policy under this product was handed over to the Shipping Corporation of India.\n5. The product is regulated solely by the Ministry of Finance, with no role for IRDAI.","stem":"Which of the above statements are correct?","options":[["A","1, 3 and 5"],["B","All of the above"],["C","2, 4 and 5"],["D","1, 2, 3 and 4"],["E","1, 2 and 3"]],"correct":"D","explanation":"Statement 5 is incorrect — the product is jointly regulated by IRDAI and the Ministry of Ports, Shipping and Waterways (MoPSW)."},{"id":65,"section":"Bharat Maritime Insurance Pool (P&I)","type":"notamong","difficulty":"Moderate","stem":"Which of the following is NOT among the risks covered under India's first sovereign-backed P&I insurance product?","options":[["A","Cargo"],["B","Wreck removal"],["C","Crew liability"],["D","Pollution"],["E","Hull damage from war and piracy"]],"correct":"E","explanation":"The risks covered are crew liability, cargo, pollution and wreck removal. 'Hull damage from war and piracy' is not mentioned."},{"id":66,"section":"Bharat Maritime Insurance Pool (P&I)","type":"figure","difficulty":"Easy","stem":"What third-party liability coverage is offered under India's first sovereign-backed P&I insurance product?","options":[["A","Up to USD 1.5 billion"],["B","Up to USD 1 billion"],["C","Up to USD 2 billion"],["D","Up to USD 500 million"],["E","Up to USD 1.5 million"]],"correct":"A","explanation":"The product offers third-party liability cover of up to USD 1.5 billion."},{"id":67,"section":"Public Examinations (Unfair Means) Amendment Bill, 2026","type":"statement","difficulty":"Hard","stem":"Which one of the following statements about the Public Examinations (Prevention of Unfair Means) Amendment Bill, 2026 is correct?","options":[["A","The 2024 Act superseded all earlier IPC provisions dealing with any form of cheating."],["B","Individual offenders under Section 10 now face a jail term of 5 to 10 years and a fine of up to ₹50 lakh."],["C","Appeals against Special Fast Track Court decisions must be filed within 60 days."],["D","Organised crime/exam-fraud syndicates face jail terms of 5 to 10 years under the 2026 Bill."],["E","Under the 2026 Bill, service providers face a fine up to ₹1 crore and a 4-year ban."]],"correct":"B","explanation":"Under the 2026 Bill, service providers face a fine up to ₹5 crore and an 8-year ban (₹1 crore/4-year ban was the earlier position). Organised crime/exam-fraud syndicates now face 7 to 10 years (not 5 to 10). Appeals must normally be filed within 30 days (extendable, but not beyond 90 days)."},{"id":68,"section":"Public Examinations (Unfair Means) Amendment Bill, 2026","type":"numbered","difficulty":"Hard","context":"1. Individual offenders' jail term increased from 3–5 years to 5–10 years under the 2026 Bill.\n2. Service providers' fine cap increased from ₹1 crore to ₹5 crore, with the ban period extended from 4 to 8 years.\n3. Organised crime/exam-fraud syndicates now face a minimum fine of ₹10 crore, up from ₹1 crore.\n4. The jail term for organised crime/exam-fraud syndicates has been reduced from 7-10 years to 5-10 years.\n5. An appeal against a High Court order in this matter can be filed before the Supreme Court within 30 days as a matter of routine right.","stem":"Which of the above statements are correct?","options":[["A","1, 3 and 5"],["B","All of the above"],["C","1, 2 and 3"],["D","2, 4 and 5"],["E","1, 2 and 4"]],"correct":"C","explanation":"Statement 4 reverses the actual direction of change — the jail term for organised crime/exam-fraud syndicates increased from 5-10 years to 7-10 years. Statement 5 is fabricated and not supported by the passage."},{"id":69,"section":"Public Examinations (Unfair Means) Amendment Bill, 2026","type":"numbered","difficulty":"Moderate","context":"1. An appeal against any judgment or order of the Special Fast Track Court (except routine interim orders) goes to the High Court.\n2. The appeal is heard by a bench of two judges.\n3. The High Court must try to dispose of the appeal within 3 months of admission.\n4. Even bail orders can be appealed directly to the High Court.\n5. No appeal can be filed after 60 days, even for good reason.","stem":"Which of the above statements are correct?","options":[["A","1, 3 and 5"],["B","All of the above"],["C","1, 2 and 3"],["D","1, 2, 3 and 4"],["E","2, 4 and 5"]],"correct":"D","explanation":"Statement 5 is incorrect — no appeal can be filed after 90 days (not 60 days); the normal filing window is 30 days, extendable by the High Court for good reason."},{"id":70,"section":"Public Examinations (Unfair Means) Amendment Bill, 2026","type":"figure","difficulty":"Moderate","stem":"Which one of the following correctly pairs the earlier and revised (2026 Bill) punishment for individual offenders under Section 10?","options":[["A","Earlier: 2–5 years + fine up to ₹10 lakh; Now: 5–10 years + fine up to ₹40 lakh"],["B","Earlier: 5–10 years + fine up to ₹10 lakh; Now: 3–5 years + fine up to ₹50 lakh"],["C","Earlier: 3–5 years + fine up to ₹5 lakh; Now: 5–10 years + fine up to ₹25 lakh"],["D","Earlier: 3–5 years + fine up to ₹10 lakh; Now: 7–10 years + fine up to ₹50 lakh"],["E","Earlier: 3–5 years + fine up to ₹10 lakh; Now: 5–10 years + fine up to ₹50 lakh"]],"correct":"E","explanation":"Earlier, individual offenders faced 3–5 years' jail + fine up to ₹10 lakh; under the 2026 Bill, this is 5–10 years + fine up to ₹50 lakh."},{"id":71,"section":"Public Examinations (Unfair Means) Amendment Bill, 2026","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements is NOT correct?","options":[["A","No appeal can be filed after 60 days under any circumstance."],["B","An appeal must normally be filed within 30 days, with the High Court allowed to condone delay for good reason."],["C","The Special Fast Track Court's appeal process was introduced for the first time by the 2026 Bill."],["D","Organised crime/exam-fraud syndicates face a minimum fine of ₹10 crore under the 2026 Bill."],["E","Apart from the High Court appeal route, no other appeal or revision is permitted in any other court."]],"correct":"A","explanation":"No appeal can be filed after 90 days, not 60 days."},{"id":72,"section":"Public Examinations (Unfair Means) Amendment Bill, 2026","type":"figure","difficulty":"Easy","stem":"In which House of Parliament was the Public Examinations (Prevention of Unfair Means) Amendment Bill, 2026 introduced?","options":[["A","Rajya Sabha"],["B","Lok Sabha"],["C","Parliamentary Standing Committee"],["D","State Legislative Assembly"],["E","Both Houses jointly"]],"correct":"B","explanation":"The Bill was introduced in the Lok Sabha."},{"id":73,"section":"National Coal Gasification Mission","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements is correct?","options":[["A","The Promotion of Surface Coal/Lignite Gasification Projects scheme has a financial outlay of ₹27,500 crore."],["B","The new scheme is expected to utilise approximately 100 MTPA of coal."],["C","The National Coal Gasification Mission has set a target of 100 Million Tonnes of coal gasification capacity by 2030."],["D","The scheme's outlay is ₹37,500 lakh."],["E","The National Coal Gasification Mission targets 2035 as its deadline."]],"correct":"C","explanation":"The scheme's outlay is ₹37,500 crore (not ₹27,500 crore or ₹37,500 lakh), with expected utilisation of about 75 MTPA (not 100 MTPA). The Mission's target year is 2030, not 2035."},{"id":74,"section":"National Coal Gasification Mission","type":"figure","difficulty":"Moderate","stem":"What is the financial outlay of the 'Promotion of Surface Coal/Lignite Gasification Projects' scheme, and its expected coal utilisation?","options":[["A","₹37,500 crore; ~100 MTPA"],["B","₹47,500 crore; ~65 MTPA"],["C","₹27,500 crore; ~75 MTPA"],["D","₹37,500 crore; ~75 MTPA"],["E","₹37,500 crore; ~50 MTPA"]],"correct":"D","explanation":"The scheme has a financial outlay of ₹37,500 crore and expected coal utilisation of approximately 75 MTPA."},{"id":75,"section":"National Coal Gasification Mission","type":"numbered","difficulty":"Moderate","context":"1. The National Coal Gasification Mission targets 100 MT of coal gasification capacity by 2030.\n2. The new scheme 'Promotion of Surface Coal/Lignite Gasification Projects' has an outlay of ₹37,500 crore.\n3. This new scheme is expected to utilise approximately 75 MTPA of coal.\n4. The scheme aims to fully replace the need for the broader National Coal Gasification Mission.\n5. The scheme will substantially help achieve the 100 MT national target.","stem":"Which of the above statements are correct?","options":[["A","1, 4 and 5"],["B","All of the above"],["C","1, 2 and 4"],["D","2, 3 and 4"],["E","1, 2, 3 and 5"]],"correct":"E","explanation":"Statement 4 is fabricated and not supported by the passage — the new scheme complements rather than replaces the National Coal Gasification Mission."},{"id":76,"section":"PAIMANA","type":"acronym","difficulty":"Moderate","stem":"PAIMANA, the web-based infrastructure monitoring platform, stands for:","options":[["A","Project Assessment, Infrastructure Monitoring and Analytics for Nation-Building"],["B","Programme for Assessment, Infrastructure Monitoring and Analysis for National Advancement"],["C","Project Appraisal, Infrastructure Monitoring and Analytics for Nation-Building"],["D","Project Assessment, Investment Monitoring and Analytics for Nation-Building"],["E","Project Assessment, Infrastructure Management and Analytics for Nation-Building"]],"correct":"A","explanation":"PAIMANA stands for Project Assessment, Infrastructure Monitoring and Analytics for Nation-Building."},{"id":77,"section":"PAIMANA","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about PAIMANA is correct?","options":[["A","PAIMANA covers seven infrastructure sub-sectors."],["B","PAIMANA monitors ongoing Central Sector infrastructure projects costing ₹150 crore or more."],["C","PAIMANA was launched on 25 September 2024."],["D","PAIMANA is developed by the Ministry of Housing and Urban Affairs."],["E","PAIMANA replaces the earlier OCMS 2010 system."]],"correct":"B","explanation":"PAIMANA was launched on 25 September 2025 (not 2024), developed by MoSPI (not MoHUA), replaces OCMS 2006 (not OCMS 2010), and covers six (not seven) sub-sectors."},{"id":78,"section":"PAIMANA","type":"notamong","difficulty":"Moderate","stem":"Which of the following is NOT one of PAIMANA's six infrastructure sub-sectors?","options":[["A","Roads"],["B","Civil Aviation"],["C","Renewable Energy"],["D","Telecommunications"],["E","Power"]],"correct":"C","explanation":"PAIMANA's six sub-sectors are Power, Civil Aviation, Telecommunications, Railways, Roads, and Ports, Shipping & Waterways. 'Renewable Energy' is not among them."},{"id":79,"section":"PAIMANA","type":"numbered","difficulty":"Moderate","context":"1. PAIMANA was developed by the Ministry of Statistics and Programme Implementation.\n2. It replaces the earlier Online Computerized Monitoring System (OCMS) of 2006.\n3. The threshold project cost for monitoring under PAIMANA is ₹150 crore or more.\n4. PAIMANA monitors both Central Sector and State Sector infrastructure projects.\n5. PAIMANA was launched on 25 September 2025.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 4"],["B","2, 3 and 4"],["C","1, 4 and 5"],["D","1, 2, 3 and 5"],["E","All of the above"]],"correct":"D","explanation":"Statement 4 is incorrect — PAIMANA monitors only Central Sector infrastructure projects, not State Sector projects."},{"id":80,"section":"PAIMANA","type":"figure","difficulty":"Moderate","stem":"PAIMANA replaces which earlier project-monitoring system?","options":[["A","e-Pragati 2006"],["B","PRAGATI 2015"],["C","OCMS 2010"],["D","Project Monitoring Group (PMG) 2013"],["E","OCMS 2006 (Online Computerized Monitoring System)"]],"correct":"E","explanation":"PAIMANA replaces the earlier OCMS 2006 (Online Computerized Monitoring System)."},{"id":81,"section":"Pithora Painting GI Tag","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Pithora Painting's GI tag is correct?","options":[["A","Pithora Painting is mainly practised in Chhota Udepur district, Gujarat, and is associated with the Rathwa, Bhil, Bhilala and Nayaka tribes."],["B","The GI tag for Pithora Painting was granted by the Ministry of Culture."],["C","Along with Pithora Painting, three agricultural products from Gujarat also received GI tags this period."],["D","GI tags are valid for 5 years and can be renewed for successive 5-year periods."],["E","Pithora Painting is primarily practised in Kutch district, Gujarat."]],"correct":"A","explanation":"The GI tag was granted by the Geographical Indications Registry under DPIIT (not the Ministry of Culture). GI tags are valid for 10 years, renewable for 10-year periods. Two agricultural products (Unjha Cumin and Fennel), not three, also received GI tags."},{"id":82,"section":"Pithora Painting GI Tag","type":"numbered","difficulty":"Moderate","context":"1. Pithora Painting received a GI tag from the Geographical Indications Registry, which functions under DPIIT.\n2. The painting is mainly practised in Chhota Udepur district of Gujarat.\n3. Unjha Cumin and Fennel are two agricultural products from Gujarat that also received GI registration.\n4. A GI tag is valid for 10 years and can be renewed for successive 10-year periods.\n5. GI registration for Pithora Painting is permanent and does not require renewal.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 2, 3 and 4"],["C","1, 3 and 5"],["D","1, 2 and 3"],["E","2, 4 and 5"]],"correct":"B","explanation":"Statement 5 contradicts statement 4 — GI registration is valid for 10 years and requires renewal, not permanent."},{"id":83,"section":"Pithora Painting GI Tag","type":"notamong","difficulty":"Moderate","stem":"Which of the following tribal communities is NOT associated with Pithora Painting?","options":[["A","Nayaka"],["B","Bhil"],["C","Gond"],["D","Rathwa"],["E","Bhilala"]],"correct":"C","explanation":"Pithora Painting is associated with the Rathwa, Bhil, Bhilala and Nayaka tribes. The Gond community is not mentioned."},{"id":84,"section":"Pithora Painting GI Tag","type":"figure","difficulty":"Moderate","stem":"Which one of the following correctly ranks the leading states by number of GI registrations, from highest to third-highest?","options":[["A","Uttar Pradesh (83) > West Bengal (76) > Tamil Nadu (59)"],["B","Tamil Nadu (83) > Uttar Pradesh (76) > West Bengal (59)"],["C","Karnataka (83) > Uttar Pradesh (76) > Tamil Nadu (59)"],["D","Uttar Pradesh (83) > Tamil Nadu (76) > West Bengal (59)"],["E","Uttar Pradesh (76) > Tamil Nadu (83) > West Bengal (59)"]],"correct":"D","explanation":"The leading states in GI registrations are Uttar Pradesh (83), Tamil Nadu (76), and West Bengal (59)."},{"id":85,"section":"Ramsar Sites & Glaw Lake","type":"statement","difficulty":"Moderate","stem":"Which one of the following statements about Glaw Lake is correct?","options":[["A","The Ramsar Convention was adopted in 1975 and came into force in 1971."],["B","The Ramsar Convention Secretariat is headquartered in Geneva, Switzerland."],["C","Glaw Lake is India's first Ramsar site overall."],["D","India joined the Ramsar Convention on 1 February 1985."],["E","Glaw Lake in Tawang district, Arunachal Pradesh, has become India's 101st Ramsar Site."]],"correct":"E","explanation":"Glaw Lake is India's 101st (not first) Ramsar Site. The Convention was adopted in 1971 and came into force in 1975 (the statement about the Convention's dates reverses this order). India joined on 1 February 1982 (not 1985). The Secretariat is headquartered in Gland (not Geneva), Switzerland."},{"id":86,"section":"Ramsar Sites & Glaw Lake","type":"numbered","difficulty":"Moderate","context":"1. Glaw Lake is a high-altitude Himalayan wetland located in Tawang district.\n2. With this designation, Arunachal Pradesh received its first Ramsar site.\n3. India now ranks first in Asia and third in the world in the number of Ramsar sites.\n4. The United Kingdom has the highest number of Ramsar sites in the world, followed by Mexico.\n5. India ranks second in the world, after only the United Kingdom.","stem":"Which of the above statements are correct?","options":[["A","1, 2, 3 and 4"],["B","2, 4 and 5"],["C","1, 3 and 5"],["D","1, 2 and 3"],["E","All of the above"]],"correct":"A","explanation":"Statement 5 is incorrect — India ranks third in the world, after the United Kingdom and Mexico, not second."},{"id":87,"section":"Ramsar Sites & Glaw Lake","type":"numbered","difficulty":"Hard","context":"State-wise distribution of Ramsar Sites in India:\n1. Tamil Nadu has the highest number of Ramsar sites in India, with 20 sites.\n2. Uttar Pradesh has 13 Ramsar sites.\n3. Punjab, Bihar and Odisha each have 6 Ramsar sites.\n4. Gujarat has the second-highest number of Ramsar sites in India.\n5. Arunachal Pradesh's total number of Ramsar sites is now two.","stem":"Which of the above statements are correct?","options":[["A","All of the above"],["B","1, 2 and 3"],["C","1, 3 and 4"],["D","2, 4 and 5"],["E","1, 2 and 4"]],"correct":"B","explanation":"Statement 4 is fabricated — Uttar Pradesh, not Gujarat, is stated as second-highest. Statement 5 is incorrect — Glaw Lake is described as Arunachal Pradesh's first (only) Ramsar site."},{"id":88,"section":"Ramsar Sites & Glaw Lake","type":"numbered","difficulty":"Moderate","context":"Consider the following statements about Ramsar Sites in India:\n1. Chilka Lake, Odisha and Keoladeo National Park, Rajasthan were India's first two Ramsar Sites (1981).\n2. The Sundarban Wetland, West Bengal is the largest Ramsar site in India.\n3. Renuka Lake, Himachal Pradesh is the smallest Ramsar site in India.\n4. India joined the Ramsar Convention on 1 February 1982.\n5. Wular Lake, Jammu & Kashmir was India's first Ramsar site.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 5"],["B","Only 5"],["C","1, 2, 3 and 4"],["D","All of the above"],["E","2, 3 and 5"]],"correct":"C","explanation":"Statement 5 is not supported by the passage — Chilka Lake and Keoladeo National Park, not Wular Lake, are named as India's first two Ramsar Sites."},{"id":89,"section":"Ramsar Sites & Glaw Lake","type":"figure","difficulty":"Moderate","stem":"Which one of the following correctly pairs the world's largest and smallest Ramsar Sites with their locations?","options":[["A","Largest: Sundarban Wetland, India; Smallest: Renuka Lake, India"],["B","Largest: Rio Negro, Brazil; Smallest: Renuka Lake, India"],["C","Largest: Cobourg Peninsula, Australia; Smallest: Ganghwa Maehwamarum Habitat, South Korea"],["D","Largest: Rio Negro, Brazil; Smallest: Ganghwa Maehwamarum Habitat, South Korea"],["E","Largest: Ganghwa Maehwamarum Habitat, South Korea; Smallest: Rio Negro, Brazil"]],"correct":"D","explanation":"The world's largest Ramsar Site is Rio Negro, Brazil (~1,20,000 sq km) and the smallest is the Ganghwa Maehwamarum Habitat, South Korea (1 hectare)."},{"id":90,"section":"Ramsar Sites & Glaw Lake","type":"numbered","difficulty":"Moderate","context":"1. The Ramsar Convention was adopted in 1971 at Ramsar, Iran, and came into force in 1975.\n2. India joined the Convention on 1 February 1982.\n3. The Convention currently has 172 member countries.\n4. The Convention's headquarters is located in Gland, Switzerland.\n5. The world's first Ramsar Site, Cobourg Peninsula in Australia, was designated in 1978.","stem":"Which of the above statements are correct?","options":[["A","1, 2 and 5"],["B","1, 3 and 4"],["C","All of the above"],["D","2, 3 and 5"],["E","1, 2, 3 and 4"]],"correct":"E","explanation":"Statement 5 is incorrect — Cobourg Peninsula was designated the world's first Ramsar Site in 1974, not 1978."},{"id":91,"section":"Ramsar Sites & Glaw Lake","type":"figure","difficulty":"Easy","stem":"As of August 2026, approximately how many Ramsar Sites exist worldwide?","options":[["A","Nearly 2,600"],["B","Nearly 1,600"],["C","Nearly 3,600"],["D","Nearly 2,900"],["E","Nearly 2,100"]],"correct":"A","explanation":"As of August 2026, there are nearly 2,600 Ramsar Sites worldwide."},{"id":92,"section":"Ramsar Sites & Glaw Lake","type":"statement","difficulty":"Hard","stem":"Which one of the following statements about the Ramsar Convention and Ramsar Sites in India is NOT correct?","options":[["A","Renuka Lake in Himachal Pradesh is the smallest Ramsar site in India."],["B","India became a member of the Ramsar Convention before the Convention itself came into force."],["C","Dr. Musonda Mumbai serves as the Secretary-General of the Ramsar Convention."],["D","Chilka Lake and Keoladeo National Park were India's first two Ramsar Sites, both designated in 1981."],["E","The Sundarban Wetland in West Bengal is the largest Ramsar site in India."]],"correct":"B
