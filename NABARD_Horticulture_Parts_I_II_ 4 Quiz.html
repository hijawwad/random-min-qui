<style>

.choice-mark { font-size: .75rem; font-weight: 700; }
.feedback { padding: .68rem .8rem; margin: .85rem 0 0; border-radius: .55rem; border: 1px solid var(--line); background: #111a14; }

.feedback[data-result="skip"] h3 { color: var(--gold); }
.source { color: var(--subtle); font-size: .77rem; display: block; margin-top: .3rem; }
.card-actions { display: flex; justify-content: space-between; align-items: center; gap: .6rem; margin-top: .8rem; }
.shortcut { color: var(--subtle); font-size: .73rem; }
.result-grid { display: grid; grid-template-columns: .75fr 1.25fr; gap: .8rem; margin: 1rem 0; }
.result-card h2 { font-size: 1.45rem; margin-bottom: .5rem; }
.score { font: 400 clamp(2.3rem, 8vw, 3.8rem)/1.15 var(--serif); color: var(--accent); }
.score-detail { color: var(--muted); font-size: .86rem; }
table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: .33rem .18rem; border-bottom: 1px solid var(--line); }

details { margin: .55rem 0; color: var(--muted); }

@media (max-width: 770px) { .mode-grid { grid-template-columns: 1fr; } .mode { gap: .42rem; } }
@media (max-width: 520px) {

@media (prefers-reduced-motion: no-preference) { progress::-webkit-progress-value { transition: width .2s ease; } }

age-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 4–5","instruction":"________ fruits include apple, pear, plum and walnut in the classification used in the notes. Low-chilling cultivars can extend cultivation of certain crops into lower hills. India’s hilly zone includes Jammu and Kashmir, Himachal Pradesh and Uttarakhand.","prompt":"Which climate class completes the passage?","items":[],"choices":["Subtropical","Temperate","Tropical","Equatorial","Coastal humid"],"explanation":"Apple, pear, plum and walnut belong to the temperate group in the table.","key":1},{"id":13,"topic":2,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 4–5","instruction":"________ fruits include apple, pear, plum and walnut in the classification used in the notes. Low-chilling cultivars can extend cultivation of certain crops into lower hills. India’s hilly zone includes Jammu and Kashmir, Himachal Pradesh and Uttarakhand.","prompt":"Which states or regions are cited for the hilly zone?","items":[],"choices":["J&K, Himachal Pradesh and Punjab","J&K, Uttarakhand and Rajasthan","Uttarakhand, Sikkim and Meghalaya","J&K, Himachal Pradesh and Uttarakhand","Himachal Pradesh, Punjab and Haryana"],"explanation":"The passage identifies all three regions.","key":3},{"id":14,"topic":2,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 4–5","instruction":"","prompt":"Which fruit is grouped with phalsa, litchi and loquat in the climate table?","items":[],"choices":["Cashew","Quince","Walnut","Sapota","Guava"],"explanation":"Guava is listed under subtropical fruits along with phalsa, litchi and loquat.","key":4},{"id":15,"topic":2,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part I · pp. 4–5","instruction":"The notes split the major climatic groups into six horticultural zones. Check these groupings.","prompt":"Which of the numbered statements are correct?","items":["The north-western and nort anting permits interculture in two directions.","A triangular layout aligns successive rows without any offset.","Contour planting is designed for perfectly level land only."],"choices":["2 and 3","1, 2 and 4","Only 2","Only 1","1 and 2"],"explanation":"Triangular planting offsets alternate rows, while contour planting is used on slopes.","key":4},{"id":23,"topic":3,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part I · pp. 5–6","instruction":"A planner is comparing planting systems at a common nominal spacing. Assess the traits given in the layout table.","prompt":"Which of the numbered statements are correct?","items":["The hexagonal layout is listed at roughly 15% more plants than square planting.","Triangular planting is described as having about 11% more plants than square planting.","The square system allows interculture in only one direction.","The quincunx system introduces an extra tree at the centre of a square."],"choices":["Only 1","1 and 4","1, 2 and 4","Only 4","1, 3 and 4"],"explanation":"The notes put triangular planting about 11% below square and allow two-direction interculture in the square layout.","key":1},{"id":24,"topic":3,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part I · pp. 5–6","instruction":"","prompt":"An extension worker is checking the fit between each orchard site and its proposed layout. Which plans fit their stated purpose?","items":["Kabir selects rectangular planting because row and plant spacing must be identical.","Ravi selects a contour layout for a hilly site.","Asha uses quincunx to add temporary filler trees."],"choices":["Only 3","1 and 3","1, 2 and 3","2 and 3","Only 2"],"explanation":"Equal inter-row and within-row spacing describes square planting, whereas the contour and quincunx plans match their purposes.","key":3},{"id":25,"topic":4,"kind":"Passage-led","policy":false,"difficulty":"Moderate","source":"Part I · pp. 6–12","instruction":"________ produces roots on a branch while it remains attached to the parent plant. A ring of bark is removed and the area is packed with moist rooting medium. The covering is secured with polythene until roots form.","prompt":"Which method completes the passage?","items":[],"choices":["Patch budding","Air layering","Softwood grafting","Trench layering","Tip layering"],"explanation":"Air layering, or gootee, roots an attached branch above the ground.","key":1},{"id":26,"topic":4,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"________ produces roots on a branch while it remains attached to the parent plant. A ring of bark is removed and the area is packed with moist rooting medium. The covering is secured with polythene until roots form.","prompt":"Which actions are described in the passage? Choose the most complete answer.","items":[],"choices":["Securing with polythene","Leaving the branch attached","Removing a bark ring","Adding moist medium","All of the above"],"explanation":"The passage describes all four actions.","key":4},{"id":27,"topic":4,"kind":"Passage-led","policy":false,"difficulty":"Moderate","source":"Part I · pp. 6–12","instruction":"________ allows fruit to develop even though fertilisation has not occurred. It can occur naturally or be induced by growth regulators such as auxins and gibberellins. Banana is a familiar example of this process.","prompt":"Which concept completes the passage?","items":[],"choices":["Scarification","Polyembryony","Protandry","Apomixis","Parthenocarpy"],"explanation":"Parthenocarpy is fruit development without fertilisation.","key":4},{"id":28,"topic":4,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"________ allows fruit to develop even though fertilisation has not occurred. It can occur naturally or be induced by growth regulators such as auxins and gibberellins. Banana is a familiar example of this process.","prompt":"Which fruit illustrates the process in the passage?","items":[],"choices":["Arecanut","Banana","Jackfruit","Coconut","Cashew"],"explanation":"The classic example supplied is banana.","key":1},{"id":29,"topic":4,"kind":"Passage-led","policy":false,"difficulty":"Moderate","source":"Part I · pp. 6–12","instruction":"________ uses a bud as the propagating piece, with the bud inserted beneath bark opened by a T-shaped incision. The method is listed for sweet orange, peach, plum and rose. It is one of several budding methods named for the way the bark is cut.","prompt":"Which budding method completes the passage?","items":[],"choices":["Patch budding","Forkert budding","Flute budding","Shield budding","Ring budding"],"explanation":"Shield budding uses a T-shaped incision.","key":3},{"id":30,"topic":4,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"________ uses a bud as the propagating piece, with the bud inserted beneath bark opened by a T-shaped incision. The method is listed for sweet orange, peach, plum and rose. It is one of several budding methods named for the way the bark is cut.","prompt":"Which crops are named as examples in the passage? Choose the most complete answer.","items":[],"choices":["Sweet orange","Plum","Peach","Rose","All of the above"],"explanation":"All four are included among the method’s examples.","key":4},{"id":31,"topic":4,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"","prompt":"Which graft uses a mango seedling younger than two weeks as the stock?","items":[],"choices":["Whip grafting","Bridge grafting","Approach grafting","Epicotyl grafting","Tongue grafting"],"explanation":"Epicotyl or stone grafting is performed on very young mango seedlings.","key":3},{"id":32,"topic":4,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"","prompt":"Which budding method is specifically listed for rubber?","items":[],"choices":["Forkert budding","Flute budding","Patch budding","Shield budding","Ring budding"],"explanation":"The budding table links Forkert budding to rubber.","key":0},{"id":33,"topic":4,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"","prompt":"Which cutting includes a leaf blade, petiole and a stem piece carrying an axillary bud?","items":[],"choices":["Herbaceous cutting","Hardwood cutting","Root cutting","Softwood cutting","Leaf-bud cutting"],"explanation":"A leaf-bud cutting retains the axillary bud, which can produce a shoot.","key":4},{"id":34,"topic":4,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"","prompt":"Which layering method alternates buried and exposed portions of a shoot and is listed for muscadine grape?","items":[],"choices":["Compound layering","Tip layering","Simple layering","Mound layering","Air layering"],"explanation":"Compound, or serpentine, layering alternately covers and exposes sections of the shoot.","key":0},{"id":35,"topic":4,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"","prompt":"Which grafting method is used to repair a damaged trunk by bridging the affected area?","items":[],"choices":["Bridge grafting","Whip grafting","Veneer grafting","Stone grafting","Softwood grafting"],"explanation":"Bridge grafting reconnects living tissues across the damaged trunk area.","key":0},{"id":36,"topic":4,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"","prompt":"Which specialised plant structure is listed for gladiolus?","items":[],"choices":["Bulb","Corm","Offshoot","Tuber","Runner"],"explanation":"Gladiolus is propagated using corms.","key":1},{"id":37,"topic":4,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 6–12","instruction":"","prompt":"Which method is listed for date palm propagation?","items":[],"choices":["Runners","Cormels","Slips","Offshoots","Crown cuttings"],"explanation":"Date palms are propagated through offshoots or offsets.","key":3},{"id":38,"topic":4,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part I · pp. 6–12","instruction":"Cutting types differ by the degree of shoot maturity and the tissues retained. Evaluate the following descriptions.","prompt":"Which of the numbered statements are correct?","items":["Semi-hardwood cuttings use fully succulent herbaceous stems only.","Blackberry and raspberry are examples for root cuttings.","Hardwood cuttings can use mature, lignified one-year-old shoots.","Young non-lignified shoots can supply softwood cuttings."],"choices":["2 and 4","1, 2, 3 and 4","3 and 4","2, 3 and 4","2 and 3"],"explanation":"Semi-hardwood uses partially matured wood. Herbaceous cuttings use soft, succulent material.","key":3},{"id":39,"topic":4,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part I · pp. 6–12","instruction":"Layering techniques keep plant material attached during root formation. Consider these pairings.","prompt":"Which of the numbered statements are correct?","items":["Mound layering alternately buries and exposes successive sections of a shoot.","Tip layering can be used for blackberry and raspberry.","Trench layering pegs long shoots horizontally.","Air layering requires burying the shoot tip in soil at ground level."],"choices":["Only 3","2 and 4","1, 2 and 3","1, 2, 3 and 4","2 and 3"],"explanation":"Burying the tip is tip layering, while alternating exposed and covered sections is compound layering.","key":4},{"id":40,"topic":4,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part I · pp. 6–12","instruction":"Vegetative structures can act as planting material. Examine these crop matches.","prompt":"Which of the numbered statements are correct?","items":["Onion — bulb.","Strawberry — runner.","Ginger — rhizome.","Pineapple — corm."],"choices":["1 and 3","1, 2 and 4","2 and 3","1, 2 and 3","1, 2, 3 and 4"],"explanation":"Pineapple is propagated by crowns, slips or suckers. Corm is the example given for gladiolus.","key":3},{"id":41,"topic":4,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part I · pp. 6–12","instruction":"Embryo formation and fruit formation can occur independently of fertilisation. Evaluate these statements.","prompt":"Which of the numbered statements are correct?","items":["Mangosteen is listed under obligate apomixis.","Parthenocarpy necessarily results in a seed carrying a clonal embryo.","Citrus and polyembryonic mango are examples associated with adventive embryony.","Apomixis is the development of fruit without fertilisation."],"choices":["1, 2 and 3","1 and 3","Only 3","1, 3 and 4","3 and 4"],"explanation":"Apomixis involves asexual seed formation. Parthenocarpy concerns fruit development and can produce seedless fruit.","key":1},{"id":42,"topic":4,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part I · pp. 6–12","instruction":"","prompt":"A nursery supervisor is checking whether each technician’s proposed method matches the crop summary. Which proposed methods match?","items":["Isha plans hardwood cuttings for grapes.","Vikram plans ring budding for litchi.","Rehan plans patch budding for aonla."],"choices":["2 and 3","1, 2 and 3","1 and 3","Only 3","Only 1"],"explanation":"Grape uses hardwood cuttings and aonla can use patch budding. Litchi is listed for air layering.","key":2},{"id":43,"topic":4,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part I · pp. 6–12","instruction":"","prompt":"Which nursery selections match the method–crop pairings in the budding table?","items":["Javed assigns ring budding to ber.","Aman assigns Forkert budding to peach.","Nisha assigns patch budding to bael."],"choices":["1 and 3","Only 3","2 and 3","None of the above","1, 2 and 3"],"explanation":"Peach appears under shield or T-budding. Patch budding for bael and ring budding for ber match the table.","key":0},{"id":44,"topic":4,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part I · pp. 6–12","instruction":"Grafting and budding differ by the propagating unit and by how tissues are joined. Consider these descriptions.","prompt":"Which of the numbered statements are correct?","items":["Whip grafting uses stock and scion of similar thickness.","Tongue grafting requires a large rootstock and a much smaller scion.","Ring budding is performed by pegging a shoot tip into the soil.","Approach grafting joins two independent plants."],"choices":["1, 2 and 4","1 and 4","Only 1","Only 4","1, 3 and 4"],"explanation":"Tongue grafting adds a tongue cut to the whip method. Burying a shoot tip is tip layering.","key":1},{"id":45,"topic":5,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"________ removes a branch completely at its point of origin. The operator leaves no stub and opens the canopy by removing whole shoots or branches. It is distinguished from the cut that retains the basal part of a shoot.","prompt":"Which operation completes the passage?","items":[],"choices":["Thinning out","Disbudding","Deadheading","Pinching","Heading back"],"explanation":"Thinning out removes the entire branch at its origin.","key":0},{"id":46,"topic":5,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"________ removes a branch completely at its point of origin. The operator leaves no stub and opens the canopy by removing whole shoots or branches. It is distinguished from the cut that retains the basal part of a shoot.","prompt":"Which action describes the cut in the passage?","items":[],"choices":["Removing old flowers","Nipping young buds","Shortening only the tip","Leaving a basal stub","Removing the entire branch"],"explanation":"The defining cut removes the branch completely.","key":4},{"id":47,"topic":5,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"________ trains fruiting shoots on overhead wires that form a canopy. The arrangement is widely used for grapes in India. Passion fruit and pointed gourd also appear among the examples for this form of support.","prompt":"Which training system completes the passage?","items":[],"choices":["Espalier","Bower","Cordon","Open centre","Central leader"],"explanation":"Bower, pergola and pandal are names for the overhead training system.","key":1},{"id":48,"topic":5,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"________ trains fruiting shoots on overhead wires that form a canopy. The arrangement is widely used for grapes in India. Passion fruit and pointed gourd also appear among the examples for this form of support.","prompt":"Which features are described in the passage? Choose the most complete answer.","items":[],"choices":["Overhead wire support","Use for passion fruit","Use for grapes","Use for pointed gourd","All of the above"],"explanation":"The passage describes all three crop applications and the overhead support.","key":4},{"id":49,"topic":5,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"________ replaces an existing inferior variety with a better scion while retaining the established tree. It can be used in mango and cashew. The aim is to convert an existing tree to a more productive cultivar.","prompt":"Which operation completes the passage?","items":[],"choices":["Coppicing","Pollarding","Lopping","Top working","Root pruning"],"explanation":"Top working uses superior scion material to change the variety on an established tree.","key":3},{"id":50,"topic":5,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"________ replaces an existing inferior variety with a better scion while retaining the established tree. It can be used in mango and cashew. The aim is to convert an existing tree to a more productive cultivar.","prompt":"Which pair of trees is cited in the passage?","items":[],"choices":["Tea and coffee","Coconut and date palm","Apple and pear","Peach and plum","Mango and cashew"],"explanation":"Mango and cashew are the examples in the passage.","key":4},{"id":51,"topic":5,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"","prompt":"Which system forms three to six horizontal tiers at right angles to the trunk in apple or pear?","items":[],"choices":["Bush","Cordon","Bower","Espalier","Open centre"],"explanation":"Espalier arranges branches horizontally in tiers on either side of the main stem.","key":3},{"id":52,"topic":5,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"","prompt":"Which training method retains the main leader for four to five years before heading it back?","items":[],"choices":["Open centre","Modified leader","Cordon","Bower","Central leader"],"explanation":"The modified leader system initially retains the main leader and later heads it back.","key":1},{"id":53,"topic":5,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"","prompt":"Which pruning-height class corresponds to 0.7–0.9 m?","items":[],"choices":["Pollarding","Medium-head","Low-head","Skiffing","High-head"],"explanation":"The table gives 0.7–0.9 m for low-head pruning.","key":2},{"id":54,"topic":5,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"","prompt":"What is the name of the operation that removes spent blooms to encourage new flowering?","items":[],"choices":["Disbudding","Bracing","Stenting","Deadheading","Notching"],"explanation":"Deadheading removes old flowers, while disbudding removes selected young buds.","key":3},{"id":55,"topic":5,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"","prompt":"Which operation is listed to strengthen scaffolding limbs in heavy-bearing trees?","items":[],"choices":["Bending","Stenting","Ringing","Nicking","Bracing"],"explanation":"Bracing strengthens structural limbs.","key":4},{"id":56,"topic":5,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · pp. 12–17","instruction":"","prompt":"Which operation is linked to off-season flowering in mango and litchi?","items":[],"choices":["Bracing","Stenting","Pinching","Notching","Smudging"],"explanation":"The notes list smudging for off-season flowering and fruit-fly management.","key":4},{"id":57,"topic":5,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part I · pp. 12–17","instruction":"Training systems set the shape of a young orchard tree and its future bearing framework. Assess these statements.","prompt":"Which of the numbered statements are correct?","items":["Open-centre training heads the main stem at about 1.5–1.8 m in the notes.","Central leader training removes the trunk at establishment to form a vase.","Tatura trellis is presented as an unsupported bush system.","A cordon can be trained along wires as a single stem."],"choices":["1, 2 and 4","Only 1","1 and 4","Only 4","1, 3 and 4"],"explanation":"The central leader remains intact, and the Tatura system uses a wire trellis for high-density planting.","key":2},{"id":58,"topic":5,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part I · pp. 12–17","instruction":"Specialised pruning may be used to renew shoots, produce fodder or stimulate flowering. Match the practices and uses.","prompt":"Which of the numbered statements are correct?","items":["Lopping is used to obtain fodder from Morus and Grewia.","Dehorning is listed for reducing vegetative growth in mango.","Coppicing retains the trunk at 2 m to form the canopy.","Root pruning is listed for fruit-bud differentiation in guava and citrus."],"choices":["1, 2 and 4","2 and 4","Only 2","1, 2, 3 and 4","1 and 4"],"explanation":"The coppicing example cuts the trunk low, to about 30–35 cm.","key":0},{"id":59,"topic":5,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part I · pp. 12–17","instruction":"Crop and region affect pruning schedules. Evaluate these crop–timing matches.","prompt":"Which of the numbered statements are correct?","items":["North Indian grapes — late-winter heading back of canes.","Ber — pruning in December–January in the notes.","Apple — heavy pruning during the summer crop harvest.","Mango — thinning after harvest."],"choices":["1, 2 and 4","1, 3 and 4","Only 4","1 and 4","None of the above"],"explanation":"Ber pruning is placed in April–May. Apple is lightly thinned and headed back in late winter.","key":3},{"id":60,"topic":5,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part I · pp. 12–17","instruction":"Special orchard and floricultural operations target different parts of the plant. Evaluate the pairings.","prompt":"Which of the numbered statements are correct?","items":["Nicking is listed for strengthening scaffold limbs.","Stenting is listed for off-season flowering in mango.","Notching is listed for encouraging lateral growth in citrus and fig.","Disbudding improves individual flower size in rose and chrysanthemum."],"choices":["3 and 4","1, 3 and 4","Only 4","Only 3","2, 3 and 4"],"explanation":"Bracing strengthens scaffolds, and stenting is a quick propagation method used in rose.","key":0},{"id":61,"topic":5,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part I · pp. 12–17","instruction":"","prompt":"Which growers correctly selected the operation for their objective?","items":["Dev plans pinching to remove the shoot tip and break apical dominance.","Sonal plans bending to improve flowering and fruit set in guava.","Imran plans lopping to replace an inferior mango cultivar."],"choices":["Only 1","1 and 3","1, 2 and 3","Only 2","1 and 2"],"explanation":"Changing the mango cultivar requires top working. Bending and pinching fit the other two goals.","key":4},{"id":62,"topic":6,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · p. 18","instruction":"________ uses a chemical response to gauge the maturity of an apple. It tracks a change in reserves in the flesh as the fruit matures. It differs from visual colour or tapping-based harvest indices used for other fruits.","prompt":"Which maturity test completes the passage?","items":[],"choices":["Slip test","Thump test","Starch test","Tendril-drying test","Pulp-to-peel ratio"],"explanation":"The apple maturity index in the table is the starch test.","key":2},{"id":63,"topic":6,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part I · p. 18","instruction":"","prompt":"A dull hollow sound on tapping, together with an aromatic odour, is a maturity clue for which fruit?","items":[],"choices":["Pomegranate","Apple","Papaya","Grape","Jackfruit"],"explanation":"The notes use both sound and aroma as harvest cues for jackfruit.","key":4},{"id":64,"topic":6,"kind":"Technical recall","policy":false,"difficulty":"Moderate","source":"Part I · p. 18","instruction":"","prompt":"Which maturity range after anthesis is listed for pomegranate?","items":[],"choices":["135–170 days","100–135 days","110–145 days","150–185 days","175–210 days"],"explanation":"Pomegranate maturity is given as 135–170 days after anthesis.","key":0},{"id":65,"topic":6,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part I · p. 18","instruction":"Different fruits are harvested using crop-specific physical or compositional indices. Examine the listed matches.","prompt":"Which of the numbered statements are correct?","items":["Mango maturity is associated with specific gravity of 1.01–1.02.","Grapes are assessed mainly by a pulp-to-peel ratio of 1.2–1.6.","The banana maturity table includes rounder ridges and a pulp-to-peel ratio.","A higher degree of yellowing is allowed for papaya for local sale than for long-distance shipment."],"choices":["2, 3 and 4","1, 3 and 4","1 and 3","1, 2, 3 and 4","1 and 4"],"explanation":"The pulp-to-peel ratio is for banana. Grapes use a variety-dependent soluble solids reading.","key":1},{"id":66,"topic":6,"kind":"Figure recall","policy":false,"difficulty":"Moderate","source":"Part I · p. 18","instruction":"","prompt":"Under the ISO juice-content figures listed in the fruit maturity table, what is the value for mandarin?","items":[],"choices":["32%","33%","35%","34%","30%"],"explanation":"The table gives 33% for mandarin, 30% for Washington navel and 35% for grapefruit.","key":1},{"id":67,"topic":6,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part I · p. 18","instruction":"","prompt":"An inspector is checking harvest cues against the Part I maturity table. Which lots use the listed maturity cue?","items":["Milan’s grapes are assessed by variety-dependent TSS.","Anita’s local-market pineapples show about 25% yellow surface.","Biju’s apples are assessed primarily by a hollow sound and strong aroma."],"choices":["1 and 3","Only 2","1, 2 and 3","1 and 2","Only 1"],"explanation":"Hollow sound and aroma are listed for jackfruit. The pineapple and grape cues match the table.","key":3},{"id":68,"topic":7,"kind":"Passage-led","policy":false,"difficulty":"Moderate","source":"Part I · pp. 18–20, 31","instruction":"________ appears at the distal end of mangoes grown near brick kilns. The affected area darkens as the fruit develops. The notes link it with exposure to kiln gases and list borax sprays as a management measure.","prompt":"Which disorder completes the passage?","items":[],"choices":["Jhumka","Black tip","Spongy tissue","Alternate bearing","Mango malformation"],"explanation":"Black tip is associated with brick-kiln emissions near orchards.","key":1},{"id":69,"topic":7,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 18–20, 31","instruction":"________ appears at the distal end of mangoes grown near brick kilns. The affected area darkens as the fruit develops. The notes link it with exposure to kiln gases and list borax sprays as a management measure.","prompt":"Which measure is mentioned for this disorder?","items":[],"choices":["Shade-tree lopping","Casing","Borax spray","Cane heading","Fruit stripping"],"explanation":"Borax application is the measure listed in the passage.","key":2},{"id":70,"topic":7,"kind":"Passage-led","policy":false,"difficulty":"Moderate","source":"Part I · pp. 18–20, 31","instruction":"________ is an internal breakdown disorder associated particularly with Alphonso. High temperature and exposure to the sun after harvest can aggravate it. The notes mention mulching and sod culture as management practices.","prompt":"Which disorder completes the passage?","items":[],"choices":["Fruit cracking","Jhumka","Citrus granulation","Spongy tissue","Black tip"],"explanation":"Spongy tissue is the internal physiological disorder associated with Alphonso.","key":3},{"id":71,"topic":7,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part I · pp. 18–20, 31","instruction":"________ is an internal breakdown disorder associated particularly with Alphonso. High temperature and exposure to the sun after harvest can aggravate it. The notes mention mulching and sod culture as management practices.","prompt":"Which management practices are named?","items":[],"choices":["Budding and ring barking","Pinching and bracing","Mulching and sod culture","Coppicing and pollarding","Lopping and top working"],"explanation":"Mulching and sod culture are both mentioned in the passage.","key":2},{"id":72,"topic":7,"kind":"Technical recall","policy":false,"difficulty":"Moderate"," y. The yellow-leaf and Arka Neelkiran entries match the cross tables.","key":1},{"id":147,"topic":20,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 3, 6, 18","instruction":"________ are perennial cash crops often grown on large, contiguous tracts in tropical or subtropical regions. They commonly require considerable capital and labour. Their produce is typically processed before marketing.","prompt":"Which group completes the passage?","items":[],"choices":["Legume vegetables","Cereal crops","Plantation crops","Cole crops","Ephemeral crops"],"explanation":"Tea, coffee and rubber are examples of the perennial commercial group described.","key":2},{"id":148,"topic":20,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 3, 6, 18","instruction":"________ are perennial cash crops often grown on large, contiguous tracts in tropical or subtropical regions. They commonly require considerable capital and labour. Their produce is typically processed before marketing.","prompt":"Which feature is mentioned in the passage?","items":[],"choices":["Mechanisation with negligible labour","Exclusive cultivation in cold zones","A one-season life cycle","Processing before marketing","A focus on subsistence"],"explanation":"The passage identifies processing before sale as a typical feature.","key":3},{"id":149,"topic":20,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part II · pp. 3, 6, 18","instruction":"The opening chapters compare plantations with other horticultural crop groups. Consider the following.","prompt":"Which of the numbered statements are correct?","items":["The notes stress rural employment and export earnings from plantations.","Plantation crops are predominantly annual staples.","Landscape gardening is the study of vegetable production.","Coffee and oil palm are included among plantation crops."],"choices":["1, 3 and 4","Only 1","1, 2 and 4","Only 4","1 and 4"],"explanation":"Pl igns or factors are named in the passage? Choose the most complete answer.","items":[],"choices":["Inadequate calcium","A dark, sunken patch","Water stress","High salinity","All of the above"],"explanation":"The passage names the visible lesion, the calcium problem and both aggravating factors.","key":4},{"id":154,"topic":21,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part II · pp. 6–7","instruction":"","prompt":"Which antioxidant is associated with the characteristic red colour of ripe tomato?","items":[],"choices":["Caricaxanthin","Lycopene","Quercetin","Curcumin","Capsanthin"],"explanation":"Lycopene is a prominent tomato antioxidant and pigment.","key":1},{"id":155,"topic":21,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part II · pp. 6–7","instruction":"","prompt":"Which tomato is listed as the first commercially grown genetically modified food crop?","items":[],"choices":["Arka Ruby","Flavr Savr","Hisar Lalit","Arka Vikas","Arka Rakshak"],"explanation":"The historical cultivar identified is Flavr Savr.","key":1},{"id":156,"topic":21,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part II · pp. 6–7","instruction":"The tomato production table distinguishes open-pollinated varieties and hybrids. Assess these statements.","prompt":"Which of the numbered statements are correct?","items":["Hybrid seed rate is listed at 300–350 g/ha.","The listed hybrid yield is 80–95 t/ha.","Open-pollinated varieties use 300–350 g seed/ha.","Duration is about 110–115 days from transplanting."],"choices":["1, 2, 3 and 4","2 and 3","2 and 4","2, 3 and 4","Only 3"],"explanation":"Hybrid seed rate is 100–150 g/ha, lower than for open-pollinated varieties.","key":3},{"id":157,"topic":21,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part II · pp. 6–7","instruction":"Tomato disorders can be separated by symptom and field conditions. Check these descriptions.","prompt":"Which of the numbered statements are correct?","items":["Blossom end rot is diagnosed by radial and concentric skin splits.","Cat facing is a uniform dark leathery patch without fruit deformity.","Low temperatures during flowering are linked to cat facing.","Calcium and boron deficiency may be associated with cracking."],"choices":["Only 4","2 and 4","3 and 4","1 and 4","2, 3 and 4"],"explanation":"Cat facing causes scarring and deformation. Radial or concentric splits describe fruit cracking.","key":2},{"id":158,"topic":21,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part II · pp. 6–7","instruction":"","prompt":"Which growers’ observations fit cat facing rather than the other tomato disorders described in the notes?","items":["Lata reports a dark sunken patch on an otherwise regularly shaped fruit.","Nikhil reports concentric splits after alternating dry and wet periods.","Fatima reports puckered, scarred fruit after cool weather during flowering."],"choices":["Only 3","Only 1","Only 2","1 and 3","2 and 3"],"explanation":"Puckering and scarring after cool flowering conditions fit cat facing. Nikhil describes cracking, while Lata describes blossom end rot.","key":0},{"id":159,"topic":21,"kind":"Figure recall","policy":false,"difficulty":"Moderate","source":"Part II · pp. 6–7","instruction":"","prompt":"In the tomato production table, what is the listed crop duration from sowing?","items":[],"choices":["140–145 days","145–150 days","130–135 days","125–130 days","135–140 days"],"explanation":"The table gives 135–140 days from sowing and 110–115 days from transplanting.","key":4},{"id":160,"topic":22,"kind":"Technical recall","policy":false,"difficulty":"Moderate","source":"Part II · p. 7","instruction":"","prompt":"Which brinjal hybrid is listed as resistant to root-knot nematode?","items":[],"choices":["Pusa Rituraj","Pusa Upkar","Pusa Navneet","Pusa Bindu","Arka Neelkant"],"explanation":"Arka Neelkant is the hybrid associated with root-knot nem ruits about 58 days after transplanting.","Renuka schedules subsequent tender-fruit pickings about four to five days apart."],"choices":["1 and 3","Only 2","Only 3","2 and 3","1, 2 and 3"],"explanation":"The notes recommend harvesting at the tender stage from around 55–60 days after transplanting, with pickings every four to five days.","key":3},{"id":165,"topic":23,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 8–9","instruction":"________ is the principal carotenoid responsible for the bright red colour of ripe chilli. The pigment has applications in food and cosmetics. It is distinct from the compound responsible for pungency.","prompt":"Which pigment completes the passage?","items":[],"choices":["Capsanthin","Capsaicin","Quercetin","Curcumin","Lycopene"],"explanation":"Capsanthin gives ripe chilli its red colour. Capsaicin is associated with pungency.","key":0},{"id":166,"topic":23,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 8–9","instruction":"________ is the principal carotenoid responsible for the bright red colour of ripe chilli. The pigment has applications in food and cosmetics. It is distinct from the compound responsible for pungency.","prompt":"Which applications are cited for the pigment?","items":[],"choices":["Rubber tapping","Seed scarification","Fruit thinning","Food and cosmetics","Casing and spawning"],"explanation":"The passage mentions natural colouring applications in food and cosmetics.","key":3},{"id":167,"topic":23,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part II · pp. 8–9","instruction":"","prompt":"What scale is used for chilli pungency?","items":[],"choices":["Beaufort scale","Brix scale","Lovibond scale","Baumé scale","Scoville scale"],"explanation":"Scoville units express chilli pungency.","key":4},{"id":168,"topic":23,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part II · pp. 8–9","instruction":"The chill ces":["Tuber","Head","Curd","Swollen taproot","Siliqua"],"explanation":"The head is a cluster of tightly packed leaves. The siliqua is the fruit.","key":1},{"id":180,"topic":25,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part II · pp. 9–13","instruction":"","prompt":"Which is the principal trap crop named for diamondback moth in the cole-crop section?","items":[],"choices":["Onion","Cowpea","Mustard","Ginger","Cluster bean"],"explanation":"Mustard is listed as an intercrop and trap crop for diamondback moth.","key":2},{"id":181,"topic":25,"kind":"Technical recall","policy":false,"difficulty":"Moderate","source":"Part II · pp. 9–13","instruction":"","prompt":"Which cabbage variety is associated with black rot resistance?","items":[],"choices":["Copenhagen Market","Pusa Mukta","Pusa Drumhead","Golden Acre","Quisto"],"explanation":"Pusa Mukta is listed for black rot resistance, and Pusa Drumhead for black leg resistance.","key":1},{"id":182,"topic":25,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 9–13","instruction":"Cabbage and cauliflower form different edible structures and have different seed rates. Evaluate these comparisons.","prompt":"Which of the numbered statements are correct?","items":["Cauliflower’s curd is a compact head of mature leaves.","The cabbage fruit is a siliqua.","The listed cauliflower seed rate is 375 g/ha.","The listed cabbage seed rate is about 650 g/ha."],"choices":["2 and 4","1, 2 and 4","Only 2","2, 3 and 4","1, 2, 3 and 4"],"explanation":"Cauliflower curd is a compact, developmentally arrested floral structure. The compact leafy head is cabbage.","key":3},{"id":183,"topic":25,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 9–13","instruction":"Several cauliflower disorders can be distinguished by symptoms and nutrient status. Check the following matches.","prompt":"Which of the numbered statements are correct?","items":["Buttoning :"Part II · p. 13","instruction":"________ is the premature production of a flower stalk before an onion bulb has properly formed. Exposure to low temperatures can induce the condition. Early stalk development reduces marketable bulb quality and storage life.","prompt":"What condition can induce the problem?","items":[],"choices":["Bright light on the bulb","Exposure to low temperature","High salinity during ripening","Poor fruit pollination","Sun exposure after harvest"],"explanation":"The passage links bolting with low temperatures.","key":1},{"id":191,"topic":26,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part II · p. 13","instruction":"","prompt":"Which flavonoid contributes to onion skin colour?","items":[],"choices":["Quercetin","Catechol","Curcumin","Lycopene","Capsanthin"],"explanation":"Quercetin is identified with onion skin colour. Catechol is discussed for antifungal action.","key":0},{"id":192,"topic":26,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part II · p. 13","instruction":"Onion production uses distinct sowing systems and seed or bulb rates. Check these statements.","prompt":"Which of the numbered statements are correct?","items":["Direct seeding is listed at 10–12 kg seed/ha.","The nursery area is listed at only 100 m² per field hectare.","Bulb-to-bulb planting uses about 1,000 kg bulbs/ha.","Nursery raising is listed at 10–12 kg seed/ha."],"choices":["Only 4","1, 3 and 4","3 and 4","2 and 3","Only 3"],"explanation":"The profile gives direct seeding as 8 kg/ha and nursery area as 500 m² for a hectare.","key":2},{"id":193,"topic":26,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part II · p. 13","instruction":"The onion profile links flowering biology with storage practices. Evaluate the following.","prompt":"Which of the numbered statements are correct?","items":["Maleic hydrazide is applied before harvest for sprout suppression.","Wind is the principal pollination agent named in the notes.","Rabi onions are important for storage and export.","Onion flowers are protandrous."],"choices":["3 and 4","1 and 4","1, 3 and 4","1, 2, 3 and 4","1 and 3"],"explanation":"Honeybees are identified as the principal pollinators.","key":2},{"id":194,"topic":26,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part II · p. 13","instruction":"","prompt":"Which onion growers have selected a variety listed for the season they want to sow?","items":["Manu selects Pusa Red for rabi.","Irfan selects Arka Kalyan for kharif.","Mala selects Agrifound Dark Red as a listed rabi cultivar."],"choices":["Only 1","1 and 3","Only 2","1, 2 and 3","1 and 2"],"explanation":"Agrifound Dark Red is in the kharif list, alongside Arka Kalyan. Pusa Red is in the rabi list.","key":4},{"id":195,"topic":27,"kind":"Passage-led","policy":false,"difficulty":"Moderate","source":"Part II · pp. 14–16","instruction":"________ plants produce only female flowers. In cucumber, this trait can simplify the production of F1 hybrid seed because emasculation is unnecessary. Breeders may induce some male flowers when maintaining the parental line.","prompt":"Which sex form completes the passage?","items":[],"choices":["Trimonoecious","Gynomonoecious","Gynoecious","Andromonoecious","Dioecious"],"explanation":"Gynoecious plants bear female flowers only under normal expression.","key":2},{"id":196,"topic":27,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 14–16","instruction":"________ plants produce only female flowers. In cucumber, this trait can simplify the production of F1 hybrid seed because emasculation is unnecessary. Breeders may induce some male flowers when maintaining the parental line.","prompt":"Which advantage is mentioned for F1 seed production?","items":[],"choices":["All flowers become bisexual","Fruit ripens before pollination","No emasculation needed","Seeds become triploid","No pollination needed"],"explanation":"The female-only flowers simplify crossing because they do not require emasculation.","key":2},{"id":197,"topic":27,"kind":"Passage-led","policy":false,"difficulty":"Moderate","source":"Part II · pp. 14–16","instruction":"________ describes the sex form in which male and female flowers occur on different plants. A grower must have plants of both sexes for normal pollination. Pointed gourd, ivy gourd and spine gourd are examples in the notes.","prompt":"Which sex form completes the passage?","items":[],"choices":["Hermaphrodite","Andromonoecious","Dioecious","Gynoecious","Monoecious"],"explanation":"Dioecious crops carry male and female flowers on separate plants.","key":2},{"id":198,"topic":27,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 14–16","instruction":"________ describes the sex form in which male and female flowers occur on different plants. A grower must have plants of both sexes for normal pollination. Pointed gourd, ivy gourd and spine gourd are examples in the notes.","prompt":"Which crops are examples in the passage?","items":[],"choices":["Bottle, ivy and ridge gourds","Pointed, ivy and spine gourds","Bitter, ridge and spine gourds","Pointed, bottle and ash gourds","Pointed, ash and sponge gourds"],"explanation":"All three gourds are named in the passage.","key":1},{"id":199,"topic":27,"kind":"Technical recall","policy":false,"difficulty":"Moderate","source":"Part II · pp. 14–16","instruction":"","prompt":"Which watermelon cultivar is identified as triploid and seedless?","items":[],"choices":["Pusa Sanyog","Sugar Baby","Arka Manik","Pusa Bedana","Durgapur Meetha"],"explanation":"Pusa Bedana is the triploid seedless watermelon in the table.","key":3},{"id":200,"topic":27,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part II · pp. 14–16","instruction":"","prompt":"Which crop is suited to pickling and is identified separately from ordinary salad cucumber?","items":[],"choices":["Bitter gourd","Spine gourd","West Indian gherkin","Ash gourd","Bottle gourd"],"explanation":"The notes identify West Indian gherkin as a pickling cucurbit.","key":2},{"id":201,"topic":27,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 14–16","instruction":"Cucurbits exhibit several sex forms based on the distribution of flowers. Check these matches.","prompt":"Which of the numbered statements are correct?","items":["Hermaphrodite plants have male and female flowers on different plants.","Trimonoecious plants carry male, female and bisexual flowers.","Monoecious plants have separate male and female flowers on the same plant.","Andromonoecious plants produce only female and bisexual flowers."],"choices":["2 and 4","1, 2 and 3","2, 3 and 4","Only 3","2 and 3"],"explanation":"Andromonoecious plants carry male and bisexual flowers. A hermaphrodite flower itself has both reproductive organs.","key":4},{"id":202,"topic":27,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 14–16","instruction":"Cucurbit sex expression responds to day length, temperature and growth regulators. Consider these effects.","prompt":"Which of the numbered statements are correct?","items":["High soil nitrogen is described as favouring femaleness.","Ethylene can increase female flower expression.","Long days and high temperatures favour femaleness.","Silver nitrate can induce male flowers in gynoecious cucumber lines."],"choices":["2, 3 and 4","1, 2 and 4","1, 2, 3 and 4","Only 4","2 and 4"],"explanation":"The notes associate long days, high temperatures and high nitrogen with maleness.","key":4},{"id":203,"topic":27,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 14–16","instruction":"Commercial cucurbits differ in seed rate, maturity cues and cultivar groups. Evaluate these pairings.","prompt":"Which of the numbered statements are correct?","items":["Pusa Sanyog is listed as a bottle gou o vegetative propagation is recommended.","key":1},{"id":269,"topic":36,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 29–30","instruction":"The cashew management schedule covers training, bearing and nut handling. Evaluate the following.","prompt":"Which of the numbered statements are correct?","items":["The stated drying target is around 25% moisture.","Trees may begin bearing after about three years.","New orchards reach full bearing in the third year.","Fresh nuts are sun-dried after removal of the apples."],"choices":["Only 2","1, 2 and 4","1 and 4","2 and 4","2, 3 and 4"],"explanation":"Full bearing is around the tenth year. Sun-drying reduces moisture from about 25% to about 9%.","key":3},{"id":270,"topic":36,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 29–30","instruction":"Cashew tree architecture changes with age. Check the establishment and pruning guidelines in the notes.","prompt":"Which of the numbered statements are correct?","items":["Initial training and pruning are important during the first three to four years.","Young trees are trained to a single stem up to roughly 0.75–1 m.","August–September is the preferred period for training and pruning.","The notes recommend detopping at 0.5 m in the fifth year."],"choices":["1, 2 and 3","1 and 3","None of the above","2 and 3","1 and 2"],"explanation":"The notes describe detopping at a height of 4–5 m after four to five years.","key":0},{"id":271,"topic":36,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part II · pp. 29–30","instruction":"","prompt":"Which growers are following the specified cashew management schedules?","items":["Vikas starts top working by beheading old trees in July.","Anita starts high-density planting at 4 × 4 m and plans to thin to 8 × 8 m by year ten.","Jaya grafts a beheaded tree in April within the in-situ grafting window."],"choices":["2 and 3","1, 2 and 3","Only 2","On .","key":1},{"id":276,"topic":37,"kind":"Technical recall","policy":false,"difficulty":"Moderate","source":"Part II · pp. 31–32","instruction":"","prompt":"Which is a ginger variety from the IISR series named in the source?","items":[],"choices":["Kalpa Mitra","IISR Varada","Arka Bahar","Pusa Madhvi","Pusa Manjari"],"explanation":"IISR Varada is listed for ginger alongside IISR Mahima and IISR Rejatha.","key":1},{"id":277,"topic":37,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part II · pp. 31–32","instruction":"Ginger and turmeric are propagated through rhizomes. Examine these source-based rate and cultivar claims.","prompt":"Which of the numbered statements are correct?","items":["Rio de Janeiro is in the ginger cultivar list.","Turmeric in fruit gardens may use only 125–200 kg/acre.","Sole-crop turmeric is listed at 125–200 kg rhizome/acre.","Ginger uses 1,500–1,800 kg rhizome/ha."],"choices":["1, 2, 3 and 4","Only 1","1 and 2","2 and 4","1, 2 and 4"],"explanation":"The turmeric sole-crop figure is about 1,000 kg/acre. The lower rate is for intercropping in fruit gardens.","key":4},{"id":278,"topic":37,"kind":"Numbered statements","policy":true,"difficulty":"Hard","source":"Part II · pp. 31–32","instruction":"The National Turmeric Board is described as an institution for promotion of cultivation, processing and exports. Check the following.","prompt":"Which of the numbered statements are correct?","items":["Its headquarters is Nizamabad, Telangana.","Its remit includes encouraging GI-tagged products.","Its objectives include developing the complete turmeric value chain.","Its nodal ministry is the Ministry of Food Processing Industries."],"choices":["1 and 2","2 and 3","1, 2 and 3","1 and 3","1, 2, 3 and 4"],"explanation":"The notes name the Ministry of Commerce and Industry as the nodal ministry.","key":2},{"id":279,"topic":37,"kind":"Numbered statements","policy":true,"difficulty":"Hard","source":"Part II · pp. 31–32","instructi n a fruit garden.","Preeti budgets about 1,000 kg rhizomes per acre for a sole crop."],"choices":["1, 2 and 3","Only 2","2 and 3","Only 3","1 and 3"],"explanation":"The table uses about 1,000 kg/acre for a sole crop and 125–200 kg/acre in a fruit garden.","key":2},{"id":283,"topic":38,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 32–35","instruction":"________ describes the journey of a commodity from its origin to its final destination. In the dairy cooperative example, farmers are at the start and consumers are at the end. Chilling, processing and distribution connect these points.","prompt":"Which concept completes the passage?","items":[],"choices":["Bahar treatment","Demand forecasting","Source-to-sink","Reverse logistics","Value engineering"],"explanation":"The source-to-sink concept traces a product from origin through the chain to the end user.","key":2},{"id":284,"topic":38,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 32–35","instruction":"________ describes the journey of a commodity from its origin to its final destination. In the dairy cooperative example, farmers are at the start and consumers are at the end. Chilling, processing and distribution connect these points.","prompt":"Which participants form the two ends of the example?","items":[],"choices":["Input dealers and processors","Retailers and delivery agents","Wholesalers and processors","Chilling plants and retailers","Farmers and consumers"],"explanation":"Farmers supply the product at the source, and consumers receive it at the sink.","key":4},{"id":285,"topic":38,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part II · pp. 32–35","instruction":"","prompt":"Which actor is part of the upstream segment relative to a processing plant?","items":[],"choices":["Raw material supplier","Home delivery contractor","End consumer","Finished-goods wholesaler","Retail store"],"explanation":"The raw material supplier
