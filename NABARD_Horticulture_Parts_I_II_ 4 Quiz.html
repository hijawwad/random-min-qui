awn run is the substrate colonisation stage.","key":1},{"id":314,"topic":41,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 38–41","instruction":"________ is the period in which a mushroom fungus spreads through its substrate. The expanding vegetative network colonises the medium. Fruiting and the harvest cycles occur later.","prompt":"Which activity occurs during this stage?","items":[],"choices":["Applying casing before inoculation","Drying the fruit bodies","Harvesting mature caps","Vegetative colonisation","Grading the harvested crop"],"explanation":"The passage describes vegetative colonisation of the substrate.","key":3},{"id":315,"topic":41,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part II · pp. 38–41","instruction":"","prompt":"Which commercial mushroom is commonly called Dhingri?","items":[],"choices":["Shiitake","Oyster","Button","Milky","Paddy straw"],"explanation":"Dhingri is oyster mushroom, belonging to Pleurotus.","key":1},{"id":316,"topic":41,"kind":"Technical recall","policy":false,"difficulty":"Moderate","source":"Part II · pp. 38–41","instruction":"","prompt":"Which scientific name is associated with Reishi?","items":[],"choices":["Ganoderma lucidum","Flammulina velutipes","Morchella esculenta","Calocybe indica","Lentinula edodes"],"explanation":"Reishi is Ganoderma lucidum, listed under medicinal mushrooms.","key":0},{"id":317,"topic":41,"kind":"Technical recall","policy":false,"difficulty":"Easy","source":"Part II · pp. 38–41","instruction":"","prompt":"Which premium wild mushroom has a pale cap with large pits and ridges and is collected in the Himalayan foothills?","items":[],"choices":["Black ear","Gucchi","Reishi","Button","Enoki"],"explanation":"Gucchi is the morel mushroom in the notes.","key":1},{"id":318,"topic":41,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 38–41","instruction":"The notes distinguish fungal inoculum, vegetative growth and harvesting terms. Evaluate these statements.","prompt":"Which of the numbered statements are correct?","items":["Spawn is the fungal inoculum used for mushroom cultivation.","Mycelium refers only to mature fruit bodies.","Casing is applied over colonised compost in button mushroom production.","A flush is one harvest cycle."],"choices":["1 and 4","Only 1","1 and 3","1, 3 and 4","1, 2, 3 and 4"],"explanation":"Mycelium is the thread-like vegetative body of the fungus.","key":3},{"id":319,"topic":41,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 38–41","instruction":"The crop comparison pairs mushroom species with substrates and growing ranges. Check these combinations.","prompt":"Which of the numbered statements are correct?","items":["Milky mushroom is presented as a cold-season crop requiring 14–18°C.","Oyster can use straw, sawdust and other agricultural waste.","Paddy straw mushroom is grown primarily on the compost listed for button mushroom.","Button mushroom is listed at 14–18°C in the cropping comparison."],"choices":["2 and 4","1, 2 and 4","Only 2","2, 3 and 4","Only 4"],"explanation":"Paddy straw mushroom uses paddy straw. Milky mushroom is a warmer crop and is listed at 28–35°C.","key":0},{"id":320,"topic":41,"kind":"Numbered statements","policy":false,"difficulty":"Hard","source":"Part II · pp. 38–41","instruction":"Commercial and specialty mushrooms differ in environmental preferences and use. Evaluate these matches.","prompt":"Which of the numbered statements are correct?","items":["Black ear — Flammulina velutipes.","Milky mushroom — Calocybe indica.","Shiitake — Ganoderma lucidum.","Enoki — winter mushroom."],"choices":["2, 3 and 4","Only 2","Only 4","1, 2, 3 and 4","2 and 4"],"explanation":"Shiitake is Lentinula edodes, while black ear is Auricularia. Flammulina is enoki.","key":4},{"id":321,"topic":41,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part II · pp. 38–41","instruction":"","prompt":"Which growers chose a medium explicitly listed for their mushroom?","items":["Lalita chooses sawdust for shiitake.","Samina chooses compost for button mushroom.","Sanjay chooses cotton waste as the listed medium for button mushroom."],"choices":["1 and 2","Only 2","1, 2 and 3","1 and 3","Only 1"],"explanation":"Cotton waste is listed for oyster, and sawdust is listed for both oyster and shiitake.","key":0},{"id":322,"topic":41,"kind":"Figure recall","policy":false,"difficulty":"Moderate","source":"Part II · pp. 38–41","instruction":"","prompt":"About how many edible mushroom types does the diversity section say can be cultivated under controlled conditions?","items":[],"choices":["150","250","225","175","200"],"explanation":"The notes cite over 3,000 edible species and around 200 cultivable types.","key":4},{"id":323,"topic":41,"kind":"Figure recall","policy":false,"difficulty":"Moderate","source":"Part II · pp. 38–41","instruction":"","prompt":"What annual Indian oyster mushroom production is quoted in the Part II profile?","items":[],"choices":["About 9,000 tonnes","About 12,000 tonnes","About 8,000 tonnes","About 10,000 tonnes","About 11,000 tonnes"],"explanation":"The oyster mushroom profile quotes about 10,000 tonnes annually.","key":3},{"id":324,"topic":42,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 42–43","instruction":"________ covers fully colonised button mushroom compost with a moist layer of soil or peat. The added layer supports the transition to fruiting. It comes after the spread of the vegetative network through the compost.","prompt":"Which step completes the passage?","items":[],"choices":["Composting","Pinhead picking","Spawning","Casing","Grading"],"explanation":"Casing adds a moist layer over colonised compost and precedes fruiting.","key":3},{"id":325,"topic":42,"kind":"Passage-led","policy":false,"difficulty":"Easy","source":"Part II · pp. 42–43","instruction":"________ covers fully colonised button mushroom compost with a moist layer of soil or peat. The added layer supports the transition to fruiting. It comes after the spread of the vegetative network through the compost.","prompt":"At what stage is the layer applied?","items":[],"choices":["After compost colonisation","Before adding spawn","After packing for storage","Before compost preparation","After the final flush"],"explanation":"The passage specifies that the compost is already fully colonised.","key":0},{"id":326,"topic":42,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part II · pp. 42–43","instruction":"The oyster mushroom cultivation diagram distinguishes incubation and fruiting. Examine the following.","prompt":"Which of the numbered statements are correct?","items":["White mycelium spreads through the bagged substrate during incubation.","Spawn running takes place in dark conditions in the diagram.","The diagram lists indirect light and fresh air during fruiting.","The diagram recommends excluding light throughout fruiting."],"choices":["Only 2","1, 2, 3 and 4","1, 3 and 4","1, 2 and 3","1 and 3"],"explanation":"The oyster diagram specifies indirect light during fruiting rather than continuous darkness.","key":3},{"id":327,"topic":42,"kind":"Numbered statements","policy":false,"difficulty":"Moderate","source":"Part II · pp. 42–43","instruction":"The button mushroom diagram gives a stage-specific order and temperature ranges. Consider these claims.","prompt":"Which of the numbered statements are correct?","items":["Casing comes before spawning.","The cropping range shown is 14–18°C.","The spawn-running range shown is 22–25°C.","Caps should be allowed to open fully before harvest."],"choices":["1 and 3","Only 2","2, 3 and 4","2 and 3","Only 3"],"explanation":"Casing follows spawn running. Harvest is recommended while the caps are still closed.","key":3},{"id":328,"topic":42,"kind":"Applied scenario","policy":false,"difficulty":"Moderate","source":"Part II · pp. 42–43","instruction":"","prompt":"Which growers followed a stage-specific condition in the two mushroom diagrams?","items":["Rekha uses darkness during oyster spawn run.","Nazia picks button mushrooms at the closed-cap stage.","Mohan uses 22–25°C as the stated button cropping temperature."],"choices":["1 and 2","Only 2","Only 1","1 and 3","1, 2 and 3"],"explanation":"The button diagram gives 22–25°C for spawn run and 14–18°C for cropping.","key":0},{"id":329,"topic":42,"kind":"Figure recall","policy":false,"difficulty":"Moderate","source":"Part II · pp. 42–43","instruction":"","prompt":"What total cultivation duration is highlighted in the oyster mushroom diagram?","items":[],"choices":["40–55 days","45–60 days","50–65 days","55–70 days","35–50 days"],"explanation":"The oyster cultivation diagram gives a total cycle of 45–60 days.","key":1},{"id":330,"topic":42,"kind":"Figure recall","policy":false,"difficulty":"Moderate","source":"Part II · pp. 42–43","instruction":"","prompt":"How thick is the casing layer shown in the button mushroom diagram?","items":[],"choices":["1–2 cm","4–5 cm","3–4 cm","2–3 cm","5–6 cm"],"explanation":"The button mushroom diagram specifies a 3–4 cm casing layer.","key":2}],"topics":[{"id":1,"part":"I","title":"Fundamentals, branches & estimates"},{"id":2,"part":"I","title":"Fruit climate classes & Indian horticultural zones"},{"id":3,"part":"I","title":"Orchard planting systems"},{"id":4,"part":"I","title":"Propagation, budding & seed biology"},{"id":5,"part":"I","title":"Training, pruning & special operations"},{"id":6,"part":"I","title":"Fruit maturity & harvest indices"},{"id":7,"part":"I","title":"Mango varieties, hybrids & disorders"},{"id":8,"part":"I","title":"Banana"},{"id":9,"part":"I","title":"Citrus varieties, rootstocks & disorders"},{"id":10,"part":"I","title":"Papaya"},{"id":11,"part":"I","title":"Apple"},{"id":12,"part":"I","title":"Pomegranate bahars, varieties & disorders"},{"id":13,"part":"I","title":"Grapes"},{"id":14,"part":"I","title":"Ber, guava & aonla"},{"id":15,"part":"I","title":"Pineapple"},{"id":16,"part":"I","title":"Fruit types & edible parts"},{"id":17,"part":"I","title":"Institutes, coordinated projects & boards"},{"id":18,"part":"I","title":"Floriculture & rapid-recall concepts"},{"id":19,"part":"I","title":"Quick-recall cross tables"},{"id":20,"part":"II","title":"Plantation and vegetable sector overview"},{"id":21,"part":"II","title":"Tomato"},{"id":22,"part":"II","title":"Brinjal"},{"id":23,"part":"II","title":"Chilli"},{"id":24,"part":"II","title":"Okra"},{"id":25,"part":"II","title":"Cole crops"},{"id":26,"part":"II","title":"Onion"},{"id":27,"part":"II","title":"Cucurbits"},{"id":28,"part":"II","title":"Legume vegetables"},{"id":29,"part":"II","title":"Tea"},{"id":30,"part":"II","title":"Coffee cultivation, geography & trade"},{"id":31,"part":"II","title":"Coffee Board, GI & Know Your Kaapi"},{"id":32,"part":"II","title":"Coconut"},{"id":33,"part":"II","title":"Arecanut"},{"id":34,"part":"II","title":"Rubber policy & initiatives"},{"id":35,"part":"II","title":"Rubber cultivation, tapping & diseases"},{"id":36,"part":"II","title":"Cashew"},{"id":37,"part":"II","title":"Ginger, turmeric & National Turmeric Board"},{"id":38,"part":"II","title":"Post-harvest management, logistics & value chain"},{"id":39,"part":"II","title":"Fruit beverages & processed products"},{"id":40,"part":"II","title":"Preservatives, pasteurisation & sterilisation"},{"id":41,"part":"II","title":"Mushroom biology, species & substrates"},{"id":42,"part":"II","title":"Oyster & button mushroom cultivation diagrams"}]}</script>
<script>
'use strict';
const {questions, topics} = JSON.parse(document.getElementById('quiz-data').textContent);
const app = document.getElementById('app');
const alphabet = 'ABCDE';
const levels = ['Easy', 'Moderate', 'Hard'];
const byId = new Map(questions.map(question => [question.id, question]));
const byTopic = new Map(topics.map(topic => [topic.id, topic]));
const sectionSets = new Map(topics.map(topic => [topic.id, questions.filter(q => q.topic === topic.id)]));
const policy = questions.filter(question => question.policy);
const storeKey = 'nabard.horticulture.partsIandII.v1';
let session = loadSession();
let view = 'menu';
let fullOrder = 'pdf';

function esc(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
}

function mount(name, html, {focus = '', top = true} = {}) {
  view = name;
  app.innerHTML = html;
  if (top) window.scrollTo(0, 0);
  if (focus) document.querySelector(focus)?.focus({preventScroll: top});
}

function loadSession() {
  try {
    const saved = JSON.parse(localStorage.getItem(storeKey));
    if (!saved || typeof saved.title !== 'string' ||
        !Array.isArray(saved.ids) || !saved.ids.length ||
        !saved.ids.every(id => byId.has(id)) ||
        new Set(saved.ids).size !== saved.ids.length ||
        !Array.isArray(saved.responses) || saved.responses.length !== saved.ids.length ||
        !Number.isInteger(saved.index) || saved.index < 0 || saved.index > saved.ids.length ||
        !saved.responses.every(answer => answer === null || (Number.isInteger(answer) && answer >= -1 && answer < 5)) ||
        !saved.responses.slice(0,saved.index).every(answer => answer !== null) ||
        !saved.responses.slice(saved.index + 1).every(answer => answer === null)) return null;
    return saved;
  } catch { return null; }
}

function persist() {
  try { localStorage.setItem(storeKey, JSON.stringify(session)); } catch {}
}

function showMenu(focus = true) {
  const inProgress = session && session.index < session.ids.length;
  mount('menu', `
    <div class="menu-hero">
      <p class="eyebrow">Horticulture notes · Parts I and II</p>
      <h1 id="page-title" tabindex="-1">Plantation &amp;<br>Horticulture</h1>
      <p>${questions.length} five-option questions across ${topics.length} topics, from orchard layout and propagation to plantation crops, food processing and mushrooms.</p>
    </div>
    ${inProgress ? `<div class="resume">
      <p><strong>${esc(session.title)}</strong> · Question ${session.index + 1} of ${session.ids.length}</p>
      <button type="button" class="action" data-action="resume">Resume Practice</button>
    </div>` : ''}
    <div class="mode-grid" aria-label="Practice modes">
      <article class="mode">
        <h2>Full Practice Test</h2>
        <p>Work through all ${questions.length} questions in source sequence or a shuffled order.</p>
        <fieldset class="order">
          <legend>Question order</legend>
          <label><input type="radio" name="order" value="pdf" ${fullOrder === 'pdf' ? 'checked' : ''}><span>PDF Order</span></label>
          <label><input type="radio" name="order" value="shuffle" ${fullOrder === 'shuffle' ? 'checked' : ''}><span>Shuffled</span></label>
        </fieldset>
        <button type="button" class="action primary" data-action="full">Start Full Test</button>
      </article>
      <article class="mode">
        <h2>Section-wise Revision</h2>
        <p>Choose a topic and practise its question set.</p>
        <button type="button" class="action" data-action="sections">Browse Topics</button>
      </article>
      <article class="mode">
        <h2>Schemes-Only Sprint</h2>
        <p>${policy.length} numbered questions on coffee initiatives and GIs, rubber policy and initiatives, and the National Turmeric Board.</p>
        <button type="button" class="action" data-action="policy">Start Schemes Sprint</button>
      </article>
    </div>
    <p class="menu-note">Works offline. Each answer includes an explanation and a source page reference.</p>
  `, {focus: focus ? '#page-title' : ''});
}

function showSections() {
  const groups = ['I', 'II'].map(part => `
    <section class="topic-group">
      <h2>Part ${part}</h2>
      <div class="topic-grid">
        ${topics.filter(topic => topic.part === part).map(topic => {
          const count = sectionSets.get(topic.id).length;
          return `<button type="button" class="topic" data-action="topic" data-topic="${topic.id}">
            <strong>${esc(topic.title)}</strong><span>${count} ${count === 1 ? 'question' : 'questions'}</span>
          </button>`;
        }).join('')}
      </div>
    </section>`).join('');
  mount('sections', `
    <div class="section-top"><button type="button" class="action" data-action="menu">Back to Menu</button></div>
    <div class="page-intro">
      <h1 id="page-title" tabindex="-1">Section-wise Revision</h1>
      <p>Select a topic to start its questions in PDF order.</p>
    </div>
    ${groups}
  `, {focus: '#page-title'});
}

function shuffled(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function start(title, set) {
  session = {title, ids: set.map(q => q.id), index: 0, responses: Array(set.length).fill(null)};
  persist();
  showQuestion();
}

function countScore() {
  return session.responses.reduce((score, response, index) =>
    score + Number(response === byId.get(session.ids[index]).key), 0);
}

function instruction(question) {
  return question.instruction ? `<div class="instruction"><strong>Instruction</strong><p>${esc(question.instruction)}</p></div>` : '';
}

function numbered(question) {
  return question.items.length ? `<ol class="numbered">${question.items.map(item => `<li>${esc(item)}</li>`).join('')}</ol>` : '';
}

function showQuestion(afterAnswer = false) {
  const q = byId.get(session.ids[session.index]);
  const response = session.responses[session.index];
  const answered = response !== null;
  const result = response === -1 ? 'skip' : response === q.key ? 'correct' : 'wrong';
  const verdict = {skip:'Skipped', correct:'Correct', wrong:'Incorrect'}[result];
  const topic = byTopic.get(q.topic);
  const total = session.ids.length;
  const final = session.index + 1 === total;
  const completed = session.index + Number(answered);
  const prompt = `<h1 id="question-prompt" class="prompt" tabindex="-1">${esc(q.prompt)}</h1>`;
  mount('question', `
    <div class="practice">
      <div class="practice-head">
        <div class="practice-top">
          <p class="run-label">${esc(session.title)}</p>
          <button type="button" class="action text" data-action="menu">Back to Menu</button>
        </div>
        <div class="progress-label">
          <span id="progress-label">Question ${session.index + 1} of ${total}</span>
          <span>Score <strong>${countScore()}</strong> · ${completed} completed</span>
        </div>
        <progress aria-labelledby="progress-label" value="${completed}" max="${total}"></progress>
      </div>
      <article class="card" aria-labelledby="question-prompt">
        <div class="question-meta"><span>${esc(topic.title)}</span><span>${q.kind}</span><span>${q.difficulty}</span></div>
        ${instruction(q)}
        ${q.kind === 'Numbered statements' ? numbered(q) + prompt : prompt + numbered(q)}
        <div class="choices" aria-label="Answer options">
          ${q.choices.map((label, index) => {
            const correct = answered && index === q.key;
            const wrong = answered && response === index && !correct;
            return `<button type="button" class="choice${correct ? ' correct' : wrong ? ' wrong' : ''}" data-action="answer" data-option="${index}" ${answered ? 'disabled' : ''}>
              <span class="choice-key">${alphabet[index]}</span><span>${esc(label)}</span>
              ${correct || wrong ? `<span class="choice-mark">${correct ? 'Correct' : 'Your choice'}</span>` : ''}
            </button>`;
          }).join('')}
        </div>
        ${answered ? `<div class="feedback" id="feedback" data-result="${result}" tabindex="-1">
          <h3>${verdict} · ${alphabet[q.key]} · ${esc(q.choices[q.key])}</h3>
          <p>${esc(q.explanation)}</p><span class="source">${esc(q.source)}</span>
        </div>` : ''}
        <div class="card-actions">
          ${answered ? `<span class="shortcut">Enter to continue</span>
            <button type="button" class="action primary" data-action="next">${final ? 'View Results' : 'Next Question'}</button>` :
            `<button type="button" class="action" data-action="skip">Skip</button>
              <span class="shortcut">A–E to answer</span>`}
        </div>
      </article>
    </div>
  `, {focus: afterAnswer ? '#feedback' : '#question-prompt', top: !afterAnswer});
}

function record(response) {
  if (session.responses[session.index] !== null) return;
  session.responses[session.index] = response;
  persist();
  showQuestion(true);
}

function next() {
  if (session.responses[session.index] === null || session.index >= session.ids.length) return;
  session.index++;
  persist();
  if (session.index === session.ids.length) showResults();
  else showQuestion();
}

function showResults() {
  const score = countScore();
  const breakdown = Object.fromEntries(levels.map(level => [level, {total:0, correct:0, skipped:0}]));
  const review = [];
  session.ids.forEach((id, index) => {
    const q = byId.get(id);
    const given = session.responses[index];
    const row = breakdown[q.difficulty];
    row.total++;
    if (given === q.key) row.correct++;
    else {
      if (given === -1) row.skipped++;
      review.push({q, index, given});
    }
  });
  const skipped = session.responses.filter(response => response === -1).length;
  const wrong = session.ids.length - score - skipped;
  const percentage = (part, whole) => whole ? Math.round(100 * part / whole) + '%' : '—';
  mount('results', `
    <div class="practice">
      <div class="page-intro">
        <p class="eyebrow">${esc(session.title)}</p>
        <h1 id="page-title" tabindex="-1">Practice results</h1>
      </div>
      <div class="result-grid">
        <div class="card result-card">
          <h2>Final score</h2>
          <p class="score">${score} / ${session.ids.length}</p>
          <p class="score-detail">${wrong} incorrect · ${skipped} skipped</p>
        </div>
        <div class="card result-card">
          <h2>Accuracy by difficulty</h2>
          <table>
            <thead><tr><th scope="col">Level</th><th scope="col">Correct / total</th><th scope="col">Skipped</th><th scope="col">Accuracy</th></tr></thead>
            <tbody>${levels.map(level => {
              const {total, correct, skipped} = breakdown[level];
              return `<tr><th scope="row">${level}</th><td>${correct} / ${total}</td><td>${skipped}</td><td>${percentage(correct, total)}</td></tr>`;
            }).join('')}</tbody>
          </table>
          <p class="source">Accuracy uses all questions at each level.</p>
        </div>
      </div>
      <div class="result-actions">
        <button type="button" class="action primary" data-action="retry">Retry Same Set</button>
        <button type="button" class="action" data-action="menu">Back to Menu</button>
      </div>
      <section class="review" aria-labelledby="review-title">
        <h2 id="review-title">Missed and skipped · ${review.length}</h2>
        ${review.length ? review.map(({q, index, given}) => `
          <article class="card review-item">
            <p class="review-status ${given === -1 ? '' : 'wrong'}">Question ${index + 1} · ${given === -1 ? 'Skipped' : 'Incorrect'} · ${esc(byTopic.get(q.topic).title)}</p>
            <h3 class="prompt">${esc(q.prompt)}</h3>
            ${q.instruction || q.items.length ? `<details><summary>Question context</summary>${instruction(q)}${numbered(q)}</details>` : ''}
            ${given >= 0 ? `<p>Your answer · ${alphabet[given]} · ${esc(q.choices[given])}</p>` : ''}
            <p class="review-answer"><strong>Correct answer · ${alphabet[q.key]} · ${esc(q.choices[q.key])}</strong></p>
            <p>${esc(q.explanation)}</p>
            <span class="source">${esc(q.source)}</span>
          </article>`).join('') : '<p>You answered every question correctly.</p>'}
      </section>
    </div>
  `, {focus: '#page-title'});
}

app.addEventListener('change', event => {
  if (event.target.name === 'order') fullOrder = event.target.value;
});

app.addEventListener('click', event => {
  const control = event.target.closest('button[data-action]');
  if (!control || control.disabled) return;
  switch (control.dataset.action) {
    case 'full':
      start(fullOrder === 'pdf' ? 'Full Practice Test · PDF Order' : 'Full Practice Test · Shuffled',
        fullOrder === 'pdf' ? questions : shuffled(questions));
      break;
    case 'sections': showSections(); break;
    case 'topic': {
      const topic = byTopic.get(Number(control.dataset.topic));
      start(topic.title, sectionSets.get(topic.id));
      break;
    }
    case 'policy': start('Schemes-Only Sprint', policy); break;
    case 'resume': showQuestion(); break;
    case 'answer': record(Number(control.dataset.option)); break;
    case 'skip': record(-1); break;
    case 'next': next(); break;
    case 'retry': start(session.title, session.ids.map(id => byId.get(id))); break;
    case 'menu': showMenu(); break;
  }
});

document.addEventListener('keydown', event => {
  if (view !== 'question' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
  if (session.responses[session.index] === null && /^[a-e]$/i.test(event.key)) {
    event.preventDefault();
    record(alphabet.indexOf(event.key.toUpperCase()));
  } else if (event.key === 'Enter' && event.target.id === 'feedback') {
    event.preventDefault();
    next();
  }
});

showMenu(false);
</script>
</body>
</html>
