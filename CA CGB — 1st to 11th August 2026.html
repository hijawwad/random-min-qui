<title>NABARD Grade A — Current Affairs Practice Quiz</title>
<style>
  :root{
    --bg:#0d1117;
    --bg-alt:#141b26;
    --card:#161d29;
    --card-hover:#1b2433;
    --border:#26303f;
    --text:#e6edf3;
    --text-dim:#93a1b2;
    --accent:#4f8ef7;
    --accent-dim:#2b4a7a;
    --green:#3ec177;
    --green-bg:#123d28;
    --red:#f2555a;
    --red-bg:#3d1418;
    --amber:#e0a83c;
    --purple:#9d7cf2;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at top, #101722 0%, #090c11 65%);
    color:var(--text);
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  .app{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px 20px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;color:var(--text);}
  .brand small{color:var(--text-dim);font-weight:400;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.25);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent-dim);
    color:var(--text);
    border:1px solid #3a5a8f;
    padding:12px 18px;
    border-radius:10px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
    user-select:none;
  }
  .btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-1px);}
  .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .btn.secondary:hover{border-color:var(--accent);color:var(--text);}
  .btn.wide{width:100%;padding:16px;font-size:15.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn.skip{background:transparent;border:1px dashed #4a5568;color:var(--text-dim);}
  .btn.skip:hover{border-color:var(--amber);color:var(--amber);}

  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
  @media (max-width:620px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px 20px;cursor:pointer;transition:.15s;text-align:left;
  }
  .mode-card:hover{border-color:var(--accent);background:var(--card-hover);transform:translateY(-2px);}
  .mode-card h3{margin:0 0 8px;font-size:17px;color:var(--text);}
  .mode-card p{margin:0;color:var(--text-dim);font-size:13.5px;}
  .mode-card .icon{font-size:26px;margin-bottom:10px;display:block;}

  .toggle-row{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap;}
  .toggle{
    display:flex;background:var(--bg-alt);border-radius:10px;padding:4px;border:1px solid var(--border);
  }
  .toggle button{
    border:none;background:transparent;color:var(--text-dim);padding:9px 16px;border-radius:8px;
    cursor:pointer;font-size:13.5px;font-weight:600;transition:.15s;
  }
  .toggle button.active{background:var(--accent);color:#fff;}

  .section-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  @media (max-width:560px){.section-grid{grid-template-columns:1fr;}}
  .section-item{
    background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;cursor:pointer;transition:.15s;display:flex;justify-content:space-between;align-items:center;
  }
  .section-item:hover{border-color:var(--accent);background:#182234;}
  .section-item .name{font-size:13.5px;font-weight:600;color:var(--text);}
  .section-item .count{
    font-size:11.5px;color:var(--accent);background:rgba(79,142,247,.12);
    padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;margin-left:8px;
  }

  /* quiz screen */
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .quiz-meta{font-size:12.5px;color:var(--text-dim);}
  .pill{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;
    letter-spacing:.3px;text-transform:uppercase;
  }
  .pill.Easy{background:rgba(62,193,119,.14);color:var(--green);}
  .pill.Moderate{background:rgba(224,168,60,.14);color:var(--amber);}
  .pill.Hard{background:rgba(242,85,90,.14);color:var(--red);}
  .progress-wrap{background:var(--bg-alt);border-radius:10px;height:8px;overflow:hidden;margin-bottom:18px;border:1px solid var(--border);}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width .25s ease;}

  .score-row{display:flex;gap:18px;font-size:13px;color:var(--text-dim);margin-bottom:6px;flex-wrap:wrap;}
  .score-row b{color:var(--text);}

  .question-text{
    font-size:16.5px;font-weight:600;color:var(--text);white-space:pre-line;margin:14px 0 20px;line-height:1.6;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;
    padding:13px 15px;cursor:pointer;transition:.12s;font-size:14.5px;
  }
  .option:hover{border-color:var(--accent);background:#182234;}
  .option .key{
    flex-shrink:0;width:26px;height:26px;border-radius:7px;background:var(--bg);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;color:var(--text-dim);
  }
  .option.correct{border-color:var(--green);background:var(--green-bg);}
  .option.correct .key{background:var(--green);color:#08210f;border-color:var(--green);}
  .option.wrong{border-color:var(--red);background:var(--red-bg);}
  .option.wrong .key{background:var(--red);color:#2a0708;border-color:var(--red);}
  .option.disabled{cursor:default;}
  .option.dim{opacity:.55;}

  .explanation{
    margin-top:16px;padding:14px 16px;border-radius:10px;background:#0f1722;border:1px solid var(--border);
    font-size:13.5px;color:var(--text-dim);border-left:3px solid var(--accent);
  }
  .explanation b{color:var(--text);}

  .quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap;}

  /* results */
  .score-hero{text-align:center;padding:26px 10px 10px;}
  .score-hero .big{font-size:44px;font-weight:800;color:var(--accent);margin:6px 0;}
  .score-hero .sub{color:var(--text-dim);font-size:14px;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0;}
  @media (max-width:520px){.stat-grid{grid-template-columns:1fr 1fr;}}
  .stat-box{background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
  .stat-box .num{font-size:20px;font-weight:800;color:var(--text);}
  .stat-box .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-top:4px;}

  .diff-breakdown{margin-top:10px;}
  .diff-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .diff-row .label{width:90px;font-size:12.5px;color:var(--text-dim);font-weight:700;}
  .diff-bar-bg{flex:1;height:9px;background:var(--bg-alt);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .diff-bar-fill{height:100%;border-radius:6px;}
  .diff-row .pct{width:46px;text-align:right;font-size:12px;color:var(--text-dim);}

  .review-item{
    background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;
  }
  .review-item .q{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:8px;white-space:pre-line;}
  .review-item .row{font-size:12.5px;margin-bottom:3px;}
  .review-item .row.your{color:var(--red);}
  .review-item .row.correctans{color:var(--green);}
  .review-item .row.skipped{color:var(--amber);}
  .review-item .exp{margin-top:6px;font-size:12px;color:var(--text-dim);border-left:2px solid var(--border);padding-left:8px;}
  .tag{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--text-dim);margin-left:6px;}

  .footer-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .footer-actions .btn{flex:1;min-width:150px;}

  h2.section-title{font-size:18px;margin:0 0 4px;color:var(--text);}
  p.section-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 8px;}
  .hidden{display:none !important;}
  .badge-count{color:var(--text-dim);font-size:12.5px;margin-bottom:10px;}

  ::selection{background:var(--accent-dim);}
  a{color:var(--accent);}
  .back-link{color:var(--text-dim);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;}
  .back-link:hover{color:var(--accent);}
</style>

<script>
(function(){
  "use strict";
  var QUESTIONS = JSON.parse(document.getElementById('questions-data').textContent);

  // ---------- helpers ----------
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- section list ----------
  var SECTION_ORDER = [];
  var seen = {};
  QUESTIONS.forEach(function(q){
    if(!seen[q.section]){ seen[q.section]=true; SECTION_ORDER.push(q.section); }
  });
  function sectionCount(sec){
    return QUESTIONS.filter(function(q){return q.section===sec;}).length;
  }

  // ---------- app state ----------
  var state = {
    screen: 'home',
    fullPanelOpen: false,
    orderMode: 'pdf', // 'pdf' | 'shuffled'
    currentSet: [],
    setLabel: '',
    setKind: '', // 'full' | 'section'
    index: 0,
    score: 0,
    answers: {}, // qid -> {status, chosenKey}
  };

  var screens = {
    home: document.getElementById('screen-home'),
    sectionSelect: document.getElementById('screen-section-select'),
    quiz: document.getElementById('screen-quiz'),
    results: document.getElementById('screen-results'),
  };

  function showScreen(name){
    state.screen = name;
    Object.keys(screens).forEach(function(k){
      screens[k].classList.toggle('hidden', k!==name);
    });
    window.scrollTo({top:0, behavior:'instant'});
  }

  // ================= HOME =================
  function renderHome(){
    var c = screens.home;
    c.innerHTML = '';

    var intro = el('div','card');
    intro.innerHTML =
      '<h2 class="section-title">Choose a practice mode</h2>' +
      '<p class="section-sub">'+QUESTIONS.length+' questions covering the full CA compendium (1st&ndash;11th August 2026). Pick a full randomized/ordered run, or drill a specific topic.</p>';
    c.appendChild(intro);

    var grid = el('div','mode-grid');

    var fullCard = el('div','mode-card');
    fullCard.innerHTML =
      '<span class="icon">📝</span>' +
      '<h3>Full Practice Test</h3>' +
      '<p>Attempt all '+QUESTIONS.length+' questions in PDF order or shuffled.</p>';
    fullCard.onclick = function(){ state.fullPanelOpen = !state.fullPanelOpen; renderHome(); };
    grid.appendChild(fullCard);

    var secCard = el('div','mode-card');
    secCard.innerHTML =
      '<span class="icon">📚</span>' +
      '<h3>Section-wise Revision</h3>' +
      '<p>Pick a topic/section and drill just those questions.</p>';
    secCard.onclick = function(){ renderSectionSelect(); showScreen('sectionSelect'); };
    grid.appendChild(secCard);

    c.appendChild(grid);

    if(state.fullPanelOpen){
      var panel = el('div','card');
      panel.style.marginTop = '4px';
      var title = el('div', null, '<h2 class="section-title" style="font-size:15px;">Question order</h2>');
      panel.appendChild(title);

      var toggleRow = el('div','toggle-row');
      var toggle = el('div','toggle');
      var pdfBtn = el('button', state.orderMode==='pdf' ? 'active':'', 'PDF Order');
      var shufBtn = el('button', state.orderMode==='shuffled' ? 'active':'', 'Shuffled');
      pdfBtn.onclick = function(){ state.orderMode='pdf'; renderHome(); };
      shufBtn.onclick = function(){ state.orderMode='shuffled'; renderHome(); };
      toggle.appendChild(pdfBtn); toggle.appendChild(shufBtn);
      toggleRow.appendChild(toggle);
      panel.appendChild(toggleRow);

      var startBtn = el('button','btn wide','Start Full Practice Test →');
      startBtn.onclick = function(){ startFullTest(); };
      panel.appendChild(startBtn);

      c.appendChild(panel);
    }
  }

  function startFullTest(){
    var set = state.orderMode === 'shuffled' ? shuffle(QUESTIONS) : QUESTIONS.slice();
    state.currentSet = set;
    state.setLabel = 'Full Practice Test (' + (state.orderMode==='shuffled'?'Shuffled':'PDF Order') + ')';
    state.setKind = 'full';
    beginQuiz();
  }

  // ================= SECTION SELECT =================
  function renderSectionSelect(){
    var c = screens.sectionSelect;
    c.innerHTML = '';
    var back = el('div','back-link','&larr; Back to menu');
    back.onclick = function(){ showScreen('home'); };
    c.appendChild(back);

    var card = el('div','card');
    card.innerHTML = '<h2 class="section-title">Section-wise Revision</h2>' +
      '<p class="section-sub">Tap a topic to drill only its questions, in document order.</p>';
    var grid = el('div','section-grid');
    SECTION_ORDER.forEach(function(sec){
      var count = sectionCount(sec);
      var item = el('div','section-item');
      item.innerHTML = '<span class="name">'+escapeHtml(sec)+'</span><span class="count">'+count+' Qs</span>';
      item.onclick = function(){ startSection(sec); };
      grid.appendChild(item);
    });
    card.appendChild(grid);
    c.appendChild(card);
  }

  function startSection(sec){
    var set = QUESTIONS.filter(function(q){return q.section===sec;});
    state.currentSet = set;
    state.setLabel = sec;
    state.setKind = 'section';
    beginQuiz();
  }

  // ================= QUIZ =================
  function beginQuiz(){
    state.index = 0;
    state.score = 0;
    state.answers = {};
    showScreen('quiz');
    renderQuiz();
  }

  function currentQuestion(){
    return state.currentSet[state.index];
  }

  function renderQuiz(){
    var c = screens.quiz;
    c.innerHTML = '';
    var q = currentQuestion();
    if(!q){ finishQuiz(); return; }

    var back = el('div','back-link','&larr; Exit to menu');
    back.onclick = function(){
      if(confirm('Leave this test? Your progress in this run will be lost.')){ showScreen('home'); }
    };
    c.appendChild(back);

    var top = el('div','quiz-top');
    var meta = el('div','quiz-meta', escapeHtml(state.setLabel)+' &middot; Question '+(state.index+1)+' / '+state.currentSet.length);
    var pill = el('span','pill '+q.difficulty, q.difficulty);
    top.appendChild(meta);
    top.appendChild(pill);
    c.appendChild(top);

    var pbwrap = el('div','progress-wrap');
    var pbar = el('div','progress-bar');
    pbar.style.width = Math.round((state.index/state.currentSet.length)*100)+'%';
    pbwrap.appendChild(pbar);
    c.appendChild(pbwrap);

    var counts = tallyCounts();
    var scoreRow = el('div','score-row');
    scoreRow.innerHTML =
      'Score: <b>'+state.score+'</b> &nbsp;|&nbsp; Correct: <b style="color:var(--green)">'+counts.correct+'</b>' +
      ' &nbsp;|&nbsp; Wrong: <b style="color:var(--red)">'+counts.wrong+'</b>' +
      ' &nbsp;|&nbsp; Skipped: <b style="color:var(--amber)">'+counts.skipped+'</b>';
    c.appendChild(scoreRow);

    var card = el('div','card');
    var qtext = el('div','question-text', escapeHtml(q.question).replace(/\n/g,'<br>'));
    card.appendChild(qtext);

    var optWrap = el('div','options');
    var existing = state.answers[q.id];

    q.options.forEach(function(opt){
      var o = el('div','option');
      o.innerHTML = '<span class="key">'+opt.key+'</span><span class="txt">'+escapeHtml(opt.text)+'</span>';
      if(existing){
        o.classList.add('disabled');
        if(opt.key === q.correct){ o.classList.add('correct'); }
        if(existing.chosenKey && opt.key === existing.chosenKey && existing.status==='wrong'){ o.classList.add('wrong'); }
        if(existing.status!=='wrong' && opt.key!==q.correct){ o.classList.add('dim'); }
      } else {
        o.onclick = function(){ answerQuestion(opt.key); };
      }
      optWrap.appendChild(o);
    });
    card.appendChild(optWrap);

    if(existing){
      var exp = el('div','explanation',
        '<b>'+(existing.status==='correct' ? '✓ Correct. ' : existing.status==='wrong' ? '✗ Incorrect. ' : '⤼ Skipped. ')+'</b>' +
        escapeHtml(q.explanation));
      card.appendChild(exp);
    }

    c.appendChild(card);

    var actions = el('div','quiz-actions');
    if(!existing){
      var skipBtn = el('button','btn skip','Skip →');
      skipBtn.onclick = function(){ skipQuestion(); };
      actions.appendChild(skipBtn);
      actions.appendChild(el('div'));
    } else {
      var isLast = state.index === state.currentSet.length - 1;
      var nextBtn = el('button','btn', isLast ? 'Finish Test ✓' : 'Next Question →');
      nextBtn.onclick = function(){ goNext(); };
      actions.appendChild(el('div'));
      actions.appendChild(nextBtn);
    }
    c.appendChild(actions);
  }

  function tallyCounts(){
    var correct=0, wrong=0, skipped=0;
    Object.keys(state.answers).forEach(function(id){
      var a = state.answers[id];
      if(a.status==='correct') correct++;
      else if(a.status==='wrong') wrong++;
      else if(a.status==='skipped') skipped++;
    });
    return {correct:correct, wrong:wrong, skipped:skipped};
  }

  function answerQuestion(chosenKey){
    var q = currentQuestion();
    if(state.answers[q.id]) return;
    var isCorrect = chosenKey === q.correct;
    state.answers[q.id] = {status: isCorrect?'correct':'wrong', chosenKey: chosenKey};
    if(isCorrect) state.score += 1;
    renderQuiz();
  }

  function skipQuestion(){
    var q = currentQuestion();
    if(state.answers[q.id]) return;
    state.answers[q.id] = {status:'skipped', chosenKey:null};
    renderQuiz();
  }

  function goNext(){
    if(state.index < state.currentSet.length - 1){
      state.index += 1;
      renderQuiz();
    } else {
      finishQuiz();
    }
  }

  // ================= RESULTS =================
  function finishQuiz(){
    showScreen('results');
    renderResults();
  }

  function renderResults(){
    var c = screens.results;
    c.innerHTML = '';
    var total = state.currentSet.length;
    var counts = tallyCounts();
    var attempted = counts.correct + counts.wrong;
    var accuracy = attempted>0 ? Math.round((counts.correct/attempted)*100) : 0;

    var hero = el('div','card');
    var heroInner = el('div','score-hero');
    heroInner.innerHTML =
      '<div class="sub">'+escapeHtml(state.setLabel)+'</div>' +
      '<div class="big">'+state.score+' / '+total+'</div>' +
      '<div class="sub">Accuracy on attempted questions: <b style="color:var(--text)">'+accuracy+'%</b></div>';
    hero.appendChild(heroInner);

    var statGrid = el('div','stat-grid');
    statGrid.appendChild(statBox(counts.correct,'Correct','var(--green)'));
    statGrid.appendChild(statBox(counts.wrong,'Wrong','var(--red)'));
    statGrid.appendChild(statBox(counts.skipped,'Skipped','var(--amber)'));
    hero.appendChild(statGrid);
    c.appendChild(hero);

    // difficulty breakdown
    var diffCard = el('div','card');
    diffCard.innerHTML = '<h2 class="section-title">Accuracy by Difficulty</h2>';
    var diffs = ['Easy','Moderate','Hard'];
    var colors = {'Easy':'var(--green)','Moderate':'var(--amber)','Hard':'var(--red)'};
    var breakdownWrap = el('div','diff-breakdown');
    diffs.forEach(function(d){
      var qsInSet = state.currentSet.filter(function(q){return q.difficulty===d;});
      var correctInDiff = 0, attemptedInDiff = 0;
      qsInSet.forEach(function(q){
        var a = state.answers[q.id];
        if(a && a.status!=='skipped'){ attemptedInDiff++; if(a.status==='correct') correctInDiff++; }
      });
      var pct = attemptedInDiff>0 ? Math.round((correctInDiff/attemptedInDiff)*100) : 0;
      var row = el('div','diff-row');
      row.innerHTML =
        '<div class="label" style="color:'+colors[d]+'">'+d+'</div>' +
        '<div class="diff-bar-bg"><div class="diff-bar-fill" style="width:'+pct+'%;background:'+colors[d]+'"></div></div>' +
        '<div class="pct">'+(qsInSet.length? (correctInDiff+'/'+attemptedInDiff) : '—')+'</div>';
      breakdownWrap.appendChild(row);
    });
    diffCard.appendChild(breakdownWrap);
    c.appendChild(diffCard);

    // review list (missed + skipped)
    var reviewItems = state.currentSet.filter(function(q){
      var a = state.answers[q.id];
      return a && (a.status==='wrong' || a.status==='skipped');
    });
    var reviewCard = el('div','card');
    reviewCard.innerHTML = '<h2 class="section-title">Review: Missed &amp; Skipped ('+reviewItems.length+')</h2>';
    if(reviewItems.length===0){
      reviewCard.appendChild(el('p','section-sub','Nothing missed or skipped — excellent run!'));
    } else {
      reviewItems.forEach(function(q){
        var a = state.answers[q.id];
        var item = el('div','review-item');
        var correctOpt = q.options.filter(function(o){return o.key===q.correct;})[0];
        var chosenOpt = a.chosenKey ? q.options.filter(function(o){return o.key===a.chosenKey;})[0] : null;
        var html = '<div class="q">'+escapeHtml(q.question).replace(/\n/g,'<br>')+
          '<span class="tag">'+q.difficulty+'</span><span class="tag">'+escapeHtml(q.section)+'</span></div>';
        if(a.status==='wrong'){
          html += '<div class="row your">Your answer: '+chosenOpt.key+'. '+escapeHtml(chosenOpt.text)+'</div>';
        } else {
          html += '<div class="row skipped">You skipped this question.</div>';
        }
        html += '<div class="row correctans">Correct answer: '+correctOpt.key+'. '+escapeHtml(correctOpt.text)+'</div>';
        html += '<div class="exp">'+escapeHtml(q.explanation)+'</div>';
        item.innerHTML = html;
        reviewCard.appendChild(item);
      });
    }
    c.appendChild(reviewCard);

    // footer actions
    var footer = el('div','footer-actions');
    var retryBtn = el('button','btn','↻ Retry Same Set');
    retryBtn.onclick = function(){ beginQuiz(); };
    var menuBtn = el('button','btn secondary','Back to Menu');
    menuBtn.onclick = function(){ state.fullPanelOpen=false; showScreen('home'); renderHome(); };
    footer.appendChild(retryBtn);
    footer.appendChild(menuBtn);
    c.appendChild(footer);
  }

  function statBox(num,label,color){
    var b = el('div','stat-box');
    b.innerHTML = '<div class="num" style="color:'+color+'">'+num+'</div><div class="lbl">'+label+'</div>';
    return b;
  }

  // ---------- init ----------
  renderHome();
  showScreen('home');
})();

</script>
