<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NABARD Grade A Practice Quiz — Schemes (16th-30th June)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f4f2;
    color: #1a1a1a;
    margin: 0;
    padding: 24px 12px;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 13px;
    color: #666;
    margin-bottom: 20px;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #e0e0dc;
    border-radius: 3px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #3c3489;
    transition: width 0.2s ease;
  }
  .score {
    font-weight: 600;
  }
  .question-box {
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
    white-space: pre-line;
    font-size: 15px;
    line-height: 1.65;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .opt-btn {
    text-align: left;
    background: #ffffff;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    line-height: 1.5;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: #999;
    background: #fafafa;
  }
  .opt-btn:disabled {
    cursor: default;
  }
  .opt-btn.correct {
    background: #e5f4e5;
    border-color: #4caf50;
  }
  .opt-btn.incorrect {
    background: #fbe8e8;
    border-color: #e24b4a;
  }
  .opt-letter {
    font-weight: 700;
    margin-right: 8px;
  }
  .next-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 16px;
  }
  button.action-btn {
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
  }
  button.action-btn:hover {
    background: #333;
  }
  .summary-score {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    margin: 20px 0;
  }
  .review-item {
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    white-space: pre-line;
    font-size: 14px;
    line-height: 1.6;
  }
  .review-item .qtext {
    font-weight: 600;
    margin-bottom: 8px;
  }
  .review-item .wrong-ans {
    color: #c0392b;
  }
  .review-item .right-ans {
    color: #2e7d32;
  }
  .restart-row {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }
  .perfect-msg {
    background: #e5f4e5;
    color: #2e7d32;
    padding: 16px;
    border-radius: 8px;
    text-align: center;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>NABARD Grade A Practice Quiz</h1>
  <div class="sub">Schemes — 16th to 30th June | 32 questions</div>
  <div id="quiz-root"></div>
</div>

<script>
const QUESTIONS = [
{q:"Consider the following statements regarding the 23rd instalment of PM-KISAN:\n1. It was released by the PM in Hooghly, West Bengal.\n2. The day was celebrated as \"PM KISAN Utsav Diwas\".\n3. Over 9.44 crore farmers benefited, including 2.18 crore women farmers.\n4. Total disbursement under PM-KISAN since 2019 has crossed ₹5 lakh crore.\nWhich of the above statements are correct?", opts:["1 and 2 only","1, 2 and 3 only","2, 3 and 4 only","1, 2, 3 and 4","None of the above"], correct:1},
{q:"Which of the following districts was NOT among the four districts where the PM Dhan-Dhaanya Krishi Yojana was launched in West Bengal?", opts:["Purulia","Darjeeling","Alipurduar","Jhargram","Cooch Behar"], correct:4},
{q:"Consider the following statements about Kisan-eMitra:\n1. It was launched in September 2023.\n2. It is an AI-enabled chatbot developed with EkStep Foundation and BHASHINI.\n3. It provides services in 15 languages.\n4. It offers 24×7 assistance.\nWhich of the statements given above are correct?", opts:["1, 2 and 4 only","1 and 2 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"], correct:0},
{q:"Consider the following statements about Ayushman Sarathi:\n1. It is an official WhatsApp Chatbot launched by the National Health Authority.\n2. It allows users to check PM-JAY eligibility and download the Ayushman Card.\n3. It provides health cover of up to ₹10 lakh per family per year.\n4. It allows tracking of claim status.\nWhich of the statements given above are correct?", opts:["1, 2 and 3 only","1, 2 and 4 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"], correct:1},
{q:"Consider the following statements about the Viksit Bharat-Guarantee for Rozgar and Ajeevika Mission (Gramin):\n1. It was unveiled by Union Minister Shivraj Singh Chouhan.\n2. It became effective from 1 July 2026.\n3. The total outlay of the scheme is ₹1,25,000 crore.\n4. It introduced a new national minimum wage benchmark of ₹350 per day.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 3 and 4 only","2, 3 and 4 only","1, 2, 3 and 4","None of the above"], correct:0},
{q:"Under VB-G RAM G, what is the average wage increase per day, and by what percentage did it rise?", opts:["₹18.6 per day; less than 5%","₹38.6 per day; more than 15%","₹28.6 per day; more than 10%","₹20 per day; exactly 10%","₹30 per day; more than 12%"], correct:2},
{q:"Consider the following statements about the Pradhan Mantri Matru Vandana Yojana (PMMVY):\n1. It was launched in 2017.\n2. It was integrated under Mission Shakti with effect from 1 April 2022.\n3. Financial assistance for the first living child is ₹6,000, disbursed in two instalments.\n4. Maternity benefits have been extended to the second child if it is a girl child.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 2 and 4 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"], correct:1},
{q:"As on 30 April 2026, what was the total amount disbursed under PMMVY to 4.27 crore beneficiaries?", opts:["₹15,150 crore","₹18,250 crore","₹20,150 crore","₹22,150 crore","₹25,150 crore"], correct:2},
{q:"Consider the following statements about the Pradhan Mantri Surakshit Matritva Abhiyaan (PMSMA):\n1. It was launched on 9 June 2016.\n2. It provides free antenatal care on the 9th of every month.\n3. It targets pregnant women only in their 3rd trimester.\n4. India recorded a 43-point reduction in MMR between 2014-16 and 2022-24.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 3 and 4 only","2, 3 and 4 only","1, 2 and 4 only","1, 2, 3 and 4"], correct:3},
{q:"What is India's Maternal Mortality Ratio (MMR), as per the latest figures (2022-24) cited in the document, down from 130 in 2014-16?", opts:["97","92","87","82","77"], correct:2},
{q:"Consider the following statements about Beti Bachao Beti Padhao (BBBP):\n1. It was launched on 22 January 2015.\n2. It is a joint initiative of MWCD, MoHFW, and the Ministry of Education.\n3. The Sex Ratio at Birth improved from 918 (2014-15) to 929 (2024-25).\n4. Girls' enrolment at secondary level declined from 80.2% to 75.51% between 2014-15 and 2024-25.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 2 and 4 only","1, 3 and 4 only","2, 3 and 4 only","1, 2, 3 and 4"], correct:0},
{q:"Which of the following statements about BBBP is NOT correct?", opts:["It was launched on 22 January 2015.","It addresses declining Child Sex Ratio and gender-based discrimination.","It is a joint initiative of three ministries.","Sex Ratio at Birth improved from 929 to 918 between 2014-15 and 2024-25.","Girls' enrolment at secondary level increased between 2014-15 and 2024-25."], correct:3},
{q:"Consider the following statements about the Textile PLI Scheme:\n1. The government approved 22 new applicants under Round-III, taking the total approved companies to 96.\n2. New investment from these approvals is ₹2,339.14 crore.\n3. Employment generation from new approvals is expected to exceed 50,000 jobs.\n4. Overall Round-III projected turnover stands at ₹58,294.18 crore.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 2 and 4 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"], correct:1},
{q:"What is the total outlay of the PLI Scheme for Textiles (MMF Apparel, Fabrics and Technical Textiles)?", opts:["₹8,683 crore","₹9,683 crore","₹10,683 crore","₹12,683 crore","₹14,683 crore"], correct:2},
{q:"Consider the following statements regarding the revised investment norms (effective 1 August 2025) under the Textile PLI Scheme:\n1. Minimum investment for Part-1 (large scale) was revised from ₹300 crore to ₹150 crore.\n2. Minimum investment for Part-2 (smaller scale) was revised from ₹100 crore to ₹50 crore.\n3. The incremental turnover requirement was reduced from 25% to 10% from FY 2025-26.\n4. New companies must be incorporated separately even if an existing company wants to set up units.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 3 and 4 only","2, 3 and 4 only","1, 2 and 4 only","1, 2, 3 and 4"], correct:0},
{q:"How many new HSN codes were included for MMF Apparel and MMF Fabrics respectively under the 2025 revisions to the Textile PLI Scheme?", opts:["6 and 7","10 and 12","9 and 8","8 and 9","5 and 6"], correct:3},
{q:"The Textile PLI Scheme is expected to generate investment of over how much over five years?", opts:["₹10,000 crore","₹12,822 crore","₹15,561 crore","₹19,000 crore","₹25,000 crore"], correct:3},
{q:"Consider the following statements about PM-SETU:\n1. It was officially launched on 4 October 2025 by PM Narendra Modi.\n2. It is a Centrally Sponsored Scheme for a five-year period from 2025 to 2030.\n3. The total outlay of the scheme is ₹50,000 crore.\n4. The nodal agency for implementation is the Directorate General of Training under MSDE.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 2 and 4 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"], correct:1},
{q:"Under PM-SETU's total outlay of ₹60,000 crore, what is the funding contribution split among Central Government, State Governments, and Industry Partners respectively?", opts:["₹30,000 crore; ₹20,000 crore; ₹10,000 crore","₹25,000 crore; ₹25,000 crore; ₹10,000 crore","₹35,000 crore; ₹15,000 crore; ₹10,000 crore","₹30,000 crore; ₹15,000 crore; ₹15,000 crore","₹40,000 crore; ₹10,000 crore; ₹10,000 crore"], correct:0},
{q:"Consider the following statements about multilateral co-financing under PM-SETU:\n1. 50% of the Central share is co-financed by multilateral agencies.\n2. The Asian Development Bank and World Bank each contribute ₹7,500 crore.\n3. This co-financing amounts to ₹15,000 crore out of the ₹30,000 crore Central share.\n4. For UTs without legislature, the funding ratio is Centre:State:Industry = 83%:0%:17%.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","2, 3 and 4 only","1, 2, 3 and 4","1, 3 and 4 only","None of the above"], correct:2},
{q:"Consider the following statements about PM-SETU's Component I:\n1. It involves the upgradation of 1,000 Government ITIs under a Hub-and-Spoke model.\n2. There will be 200 Hub ITIs and 800 Spoke ITIs.\n3. The initial share capital of the SPV is ₹10,00,000.\n4. In the Industry-led SPV model, the Anchor Industry Partner holds 51%, with the remaining 49% shared equally between Central and State Governments.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 2, 3 and 4","2, 3 and 4 only","1, 3 and 4 only","1, 2 and 4 only"], correct:4},
{q:"The five National Skill Training Institutes (NSTIs) being augmented under PM-SETU Component II are located in Bhubaneswar, Chennai, Hyderabad, Kanpur, and which other city?", opts:["Pune","Ludhiana","Nagpur","Bhopal","Coimbatore"], correct:1},
{q:"Consider the following statements about indicative investment under PM-SETU:\n1. Average investment per Hub ITI is ₹81 crore.\n2. Average investment per Spoke ITI is ₹40 crore.\n3. One Hub with four Spokes costs approximately ₹241 crore per cluster.\n4. The target is to skill 20 lakh youth over five years.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4","None of the above"], correct:3},
{q:"Consider the following statements about CGSMFI-2.0:\n1. The scheme was extended up to 31 August 2026 or till guarantees of ₹20,000 crore are issued, whichever is earlier.\n2. The loan cap for large-sized NBFC-MFIs/MFIs was raised from ₹300 crore to ₹1,000 crore.\n3. Guarantee coverage for small NBFC-MFIs/MFIs is 90%.\n4. The guarantee fee is 0.50% p.a. on the sanctioned amount in the first year.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 2 and 4 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"], correct:1},
{q:"As per CGSMFI-2.0, what is the guarantee coverage for large NBFC-MFIs/MFIs?", opts:["90%","85%","80%","75%","70%"], correct:4},
{q:"Consider the following statements about the Skill India Mission on completion of 12 years:\n1. The number of ITIs increased from 9,776 in 2014 to more than 13,888.\n2. Over 1.64 crore candidates have been trained under PMKVY.\n3. The Skill India Digital Hub has over 1.5 crore registrations with courses in 23 languages.\n4. India's WorldSkills ranking improved from 13th (2015) to 29th (2024).\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 2 and 4 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"], correct:0},
{q:"Which of the following is NOT one of the major initiatives under the Skill India Mission mentioned in the document?", opts:["PM-SETU","Future Skills focused on AI and cybersecurity","International Mobility through Skill India International Centres","Integration with the National Education Policy 2020","Direct Benefit Transfer through AgriStack"], correct:4},
{q:"Consider the following statements about the Green Hydrogen Certification Portal of India (GHCI):\n1. It was launched by the Union Minister for New and Renewable Energy.\n2. It was developed by the Ministry of New and Renewable Energy.\n3. Its purpose is to support transparent certification under the Green Hydrogen Certification Scheme of India.\n4. It was launched during a national workshop on the National Green Hydrogen Mission.\nWhich of the above statements are correct?", opts:["1 and 2 only","1, 2 and 3 only","2, 3 and 4 only","1, 2, 3 and 4","None of the above"], correct:3},
{q:"Consider the following statements about the National Green Hydrogen Mission:\n1. It was announced by the PM during the Independence Day address on 15 August 2021.\n2. It was approved by the Union Cabinet on 4 January 2023.\n3. Its implementation period is from FY 2023-24 to FY 2029-30.\n4. The initial outlay of the mission is ₹19,744 crore.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4","None of the above"], correct:3},
{q:"Under the National Green Hydrogen Mission's initial outlay of ₹19,744 crore, how much has been allocated to the SIGHT Programme?", opts:["₹15,490 crore","₹16,490 crore","₹17,490 crore","₹18,490 crore","₹19,490 crore"], correct:2},
{q:"Which of the following is NOT among the expected outcomes of the National Green Hydrogen Mission by 2030, as stated in the document?", opts:["Green hydrogen production capacity of 5 MMT per annum","Renewable energy addition of 125 GW","Total investments of over ₹8 lakh crore","Creation of over 6 lakh jobs","Complete elimination of fossil fuel imports"], correct:4},
{q:"Consider the following statements about Green Hydrogen Hubs recognised under NGHM in 2025:\n1. Deendayal Port in Kandla, Gujarat is one of the recognised hubs.\n2. V.O. Chidambaranar Port in Tuticorin, Tamil Nadu is one of the recognised hubs.\n3. Visakhapatnam Port in Andhra Pradesh is one of the recognised hubs.\n4. Paradip Port in Odisha is one of the recognised hubs.\nWhich of the above statements are correct?", opts:["1, 2 and 3 only","1, 2, 3 and 4","2, 3 and 4 only","1, 3 and 4 only","1, 2 and 4 only"], correct:4}
];

let current = 0;
let score = 0;
let answered = new Array(QUESTIONS.length).fill(null);
const letters = ["A","B","C","D","E"];

function escapeHtml(str){
  const div = document.createElement("div");
  div.innerText = str;
  return div.innerHTML;
}

function render(){
  const root = document.getElementById("quiz-root");
  if(current >= QUESTIONS.length){ renderSummary(root); return; }
  const item = QUESTIONS[current];
  const alreadyAnswered = answered[current] !== null;
  const pct = Math.round((current / QUESTIONS.length) * 100);

  let html = "";
  html += '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;"></div></div>';
  html += '<div class="top-row"><span>Question '+(current+1)+' of '+QUESTIONS.length+'</span><span class="score">Score: '+score+' / '+QUESTIONS.length+'</span></div>';
  html += '<div class="question-box">'+escapeHtml(item.q)+'</div>';
  html += '<div class="options">';
  for(let i=0;i<item.opts.length;i++){
    let cls = "opt-btn";
    if(alreadyAnswered){
      if(i === item.correct) cls += " correct";
      else if(i === answered[current]) cls += " incorrect";
    }
    html += '<button class="'+cls+'" data-idx="'+i+'" '+(alreadyAnswered ? "disabled" : "")+'><span class="opt-letter">'+letters[i]+'.</span>'+escapeHtml(item.opts[i])+'</button>';
  }
  html += '</div>';
  if(alreadyAnswered){
    html += '<div class="next-row"><button class="action-btn" id="next-btn">'+(current === QUESTIONS.length-1 ? "See results" : "Next question →")+'</button></div>';
  }
  root.innerHTML = html;

  if(!alreadyAnswered){
    document.querySelectorAll(".opt-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.getAttribute("data-idx"));
        answered[current] = idx;
        if(idx === item.correct) score++;
        render();
      });
    });
  } else {
    document.getElementById("next-btn").addEventListener("click", () => {
      current++;
      render();
    });
  }
}

function renderSummary(root){
  const pct = Math.round((score / QUESTIONS.length) * 100);
  let html = "";
  html += '<div class="summary-score">'+score+' / '+QUESTIONS.length+' correct ('+pct+'%)</div>';
  const missed = [];
  for(let i=0;i<QUESTIONS.length;i++){
    if(answered[i] !== QUESTIONS[i].correct) missed.push(i);
  }
  if(missed.length === 0){
    html += '<div class="perfect-msg">Perfect score. Every question answered correctly.</div>';
  } else {
    html += '<div style="font-size:14px; color:#555; margin-bottom:10px;">Review — questions missed:</div>';
    missed.forEach(i => {
      const item = QUESTIONS[i];
      html += '<div class="review-item">';
      html += '<div class="qtext">Q'+(i+1)+'. '+escapeHtml(item.q)+'</div>';
      html += '<div class="wrong-ans">Your answer: '+letters[answered[i]]+'. '+escapeHtml(item.opts[answered[i]])+'</div>';
      html += '<div class="right-ans">Correct answer: '+letters[item.correct]+'. '+escapeHtml(item.opts[item.correct])+'</div>';
      html += '</div>';
    });
  }
  html += '<div class="restart-row"><button class="action-btn" id="restart-btn">Restart quiz</button></div>';
  root.innerHTML = html;
  document.getElementById("restart-btn").addEventListener("click", () => {
    current = 0; score = 0; answered = new Array(QUESTIONS.length).fill(null);
    render();
  });
}

render();
</script>
</body>
</html>
