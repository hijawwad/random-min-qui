let idx = 0, score = 0, missed = [];
const quizArea = document.getElementById('quizArea');
const finalArea = document.getElementById('finalArea');
const letters = ["A","B","C","D","E"];

function shuffle(arr, seedIdx){
  // deterministic-ish shuffle per question using a simple seeded generator so re-runs stay consistent
  let a = arr.slice();
  let seed = seedIdx * 9301 + 49297;
  for(let i=a.length-1;i>0;i--){
    seed = (seed * 233280 + 12345) % 1000000;
    const j = seed % (i+1);
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function render(){
  if(idx >= Q.length){ showFinal(); return; }
  const item = Q[idx];
  // build option order with original index tracked, but keep as-authored order (already balanced) — no reshuffle needed
  const opts = item.opts.map((text,i)=>({text, orig:i}));
  quizArea.innerHTML = `
    <div class="card">
      <div class="qnum">Question ${idx+1} of ${Q.length}</div>
      <div class="qtext">${item.q}</div>
      <div id="optlist"></div>
      <div class="feedback" id="feedback"></div>
      <button class="nextbtn" id="nextbtn">Next Question →</button>
    </div>
  `;
  const optlist = document.getElementById('optlist');
  opts.forEach((o,i)=>{
    const btn = document.createElement('div');
    btn.className = 'opt';
    btn.innerHTML = `<span class="lbl">${letters[i]}</span><span>${o.text}</span>`;
    btn.onclick = () => selectOption(i, item, opts);
    optlist.appendChild(btn);
  });
  updateStats();
}

function selectOption(chosenI, item, opts){
  const allOpts = document.querySelectorAll('#optlist .opt');
  const correctI = item.c;
  allOpts.forEach((el,i)=>{
    el.classList.add('disabled');
    if(i === correctI) el.classList.add('correct');
    if(i === chosenI && i !== correctI) el.classList.add('incorrect');
    if(i !== correctI && i !== chosenI) el.classList.add('dim');
    el.onclick = null;
  });
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  if(chosenI === correctI){
    score++;
    fb.classList.add('correct');
    fb.innerText = "✓ Correct!";
  } else {
    fb.classList.add('incorrect');
    fb.innerText = "✗ Incorrect. Correct answer: " + letters[correctI] + ") " + item.opts[correctI];
    missed.push({q:item.q, given: letters[chosenI]+") "+item.opts[chosenI], correct: letters[correctI]+") "+item.opts[correctI]});
  }
  document.getElementById('nextbtn').classList.add('show');
  document.getElementById('nextbtn').onclick = () => { idx++; render(); };
  updateStats();
}

function updateStats(){
  document.getElementById('qcounter').innerText = `Question ${Math.min(idx+1,Q.length)} of ${Q.length}`;
  document.getElementById('scoretracker').innerText = `Score: ${score} / ${idx}`;
  document.getElementById('progressfill').style.width = (idx/Q.length*100) + "%";
}

function showFinal(){
  quizArea.style.display='none';
  finalArea.style.display='block';
  document.getElementById('progressfill').style.width = "100%";
  document.getElementById('qcounter').innerText = `Completed ${Q.length} of ${Q.length}`;
  document.getElementById('scoretracker').innerText = `Final Score: ${score} / ${Q.length}`;
  const pct = Math.round(score/Q.length*100);
  let reviewHTML = '';
  if(missed.length === 0){
    reviewHTML = '<div class="allcorrect">🎉 Perfect score — you answered every question correctly!</div>';
  } else {
    reviewHTML = `<div class="reviewlist"><h3>Review — Questions Missed (${missed.length})</h3>`;
    missed.forEach((m,i)=>{
      reviewHTML += `<div class="reviewitem">
        <div class="rq">${i+1}. ${m.q}</div>
        <div class="ra">Your answer: ${m.given}</div>
        <div class="rc">Correct answer: ${m.correct}</div>
      </div>`;
    });
    reviewHTML += '</div>';
  }
  finalArea.innerHTML = `
    <div class="finalcard">
      <h2>Quiz Complete</h2>
      <div class="scorebig">${score} <span>/ ${Q.length}</span></div>
      <div class="badge">${pct}% Accuracy</div>
      ${reviewHTML}
      <button class="restartbtn" id="restartbtn">Restart Quiz</button>
    </div>
  `;
  document.getElementById('restartbtn').onclick = () => {
    idx=0; score=0; missed=[];
    quizArea.style.display='block';
    finalArea.style.display='none';
    render();
  };
}

render();
</script>
