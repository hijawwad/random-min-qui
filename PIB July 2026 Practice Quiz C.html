d been issued at healthcare facilities across the country?","options":["Over 15 crore","Over 30 crore","Over 10 crore","Over 23.21 crore","Over 50 crore"],"correct":3,"explanation":"Over 23.21 crore ABHA-linked tokens were issued at healthcare facilities as on June 18, 2026."},{"id":65,"topic":"Indiahandmade","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about Indiahandmade is correct?","options":["It was launched in 2020 by the Ministry of MSME","It requires all sellers to have GST registration with no alternative option","It is developed by NABARD as a rural credit platform","It focuses exclusively on GI-tagged food products","It was launched in 2023 and is developed by Digital India Corporation under the Ministry of Textiles"],"correct":4,"explanation":"Indiahandmade was launched in 2023, developed by Digital India Corporation under the Ministry of Textiles; sellers without GST registration can register using an Enrolment ID (restricted to their own state)."},{"id":66,"topic":"LokOS/SHE-LEAPS","type":"numbered-combo","difficulty":"moderate","context":"Regarding LokOS and SHE-LEAPS, consider the following statements:","statements":["1. LokOS is a platform under DAY-NRLM for digitization of SHGs and their federations.","2. SHE-LEAPS was launched on 29 June 2026 at the Rashtriya Gramin Vikas Sammelan.","3. SHE-LEAPS will be implemented in all 36 States and UTs.","4. LokOS captures financial transactions amounting to ₹2 lakh crore per year within the SHG network."],"question":"Which of the above statements is/are incorrect?","options":["3 only","1 only","2 only","4 only","1 and 4"],"correct":0,"explanation":"SHE-LEAPS will be implemented in 34 States/UTs (not all 36). Statements 1, 2 and 4 are correct."},{"id":67,"topic":"LokOS/SHE-LEAPS","type":"acronym","difficulty":"moderate","question":"What does 'SHE-LEAPS' stand for?","options":["Self-Help Enterprise for Livelihood Empowerment and Poverty Support","Self-Help Entrepreneur-Livelihoods and Enterprise Application for Prosperity and Sustainability","Self-Help Group Enterprise Loan and Employment Assistance Programme for SHGs","Sustainable Health and Entrepreneurship Learning for Empowerment and Prosperity Scheme","Self-Help Employment and Livelihood Enhancement for Aajeevika Progress Scheme"],"correct":1,"explanation":"SHE-LEAPS stands for Self-Help Entrepreneur-Livelihoods and Enterprise Application for Prosperity and Sustainability."},{"id":68,"topic":"LokOS/SHE-LEAPS","type":"figure-recall","difficulty":"hard","question":"The government has increased the Lakhpati Didi scheme target from how much to how much?","options":["2 crore to 5 crore women","3 crore to 5 crore women","3 crore to 6 crore women","1 crore to 3 crore women","4 crore to 8 crore women"],"correct":2,"explanation":"The Lakhpati Didi scheme target has been increased from 3 crore to 6 crore women."},{"id":69,"topic":"NCW Helpline","type":"figure-recall","difficulty":"easy","question":"What is the toll-free short-code number for the NCW Women Helpline?","options":["14446","14567","14444","14490","1930"],"correct":3,"explanation":"The NCW Women Helpline short code is 14490, linked to the existing helpline 7827170170."},{"id":70,"topic":"Ethanol Blending","type":"numbered-combo","difficulty":"hard","context":"Regarding the Ethanol Blended Petrol (EBP) Programme timeline, consider the following statements:","statements":["1. The policy framework was notified in the Gazette of India in January 2013 with a target of 5% blending across 10 States/UTs.","2. The 'Roadmap for Ethanol Blending in India 2020-25' set an intermediate milestone of 10% blending by November 2022.","3. India achieved the 20% ethanol blending (E20) target in 2025, five years ahead of the original 2030 deadline.","4. The Global Biofuels Alliance was launched on 9 September 2023 in New Delhi during the G20 Summit."],"question":"Which of the above statements are correct?","options":["1 and 2 only","2, 3 and 4 only","1, 3 and 4 only","3 and 4 only","1, 2, 3 and 4"],"correct":4,"explanation":"All four statements are correct as per the EBP timeline described in the chapter."},{"id":71,"topic":"Ethanol Blending","type":"figure-recall","difficulty":"moderate","question":"Under the EBP Programme, ethanol blending increased from what level in 2013-14 to what level in 2025-26?","options":["Less than 1.5% to 20%","5% to 15%","2% to 10%","1% to 25%","3% to 20%"],"correct":0,"explanation":"Ethanol blending increased from less than 1.5 percent in 2013-14 to 20 percent in 2025-26."},{"id":72,"topic":"Ethanol Blending","type":"not-among","difficulty":"moderate","statements":["1. United States (E10 standard, E15 expanding)","2. Brazil (E27 mandated, moving toward 35%)","3. Japan (phased E10 rollout)","4. Germany (mandatory E40 blend)","5. Canada, Thailand and several European nations also adopting ethanol blending"],"question":"Which one of the following is NOT a genuine country/blending detail mentioned in the chapter's global ethanol comparison?","options":["United States (E10 standard, E15 expanding)","Germany (mandatory E40 blend)","Brazil (E27 mandated, moving toward 35%)","Japan (phased E10 rollout)","Canada, Thailand and several European nations also adopting ethanol blending"],"correct":1,"explanation":"Germany with a mandatory E40 blend is fabricated; the chapter mentions the US, Brazil, Japan, and separately Canada, Thailand and European nations, but not Germany specifically with an E40 mandate."},{"id":73,"topic":"TReDS","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about TReDS is correct?","options":["TReDS was launched in 2020 and is regulated by SEBI","There are only two operational TReDS platforms in India","TReDS has been operational since 2017 and invoice discounting grew from ₹40,000 crore (FY2021-22) to ₹3.47 lakh crore (FY2025-26)","TReDS financing requires collateral from MSME sellers","The CPSE mandate to route MSME invoices through TReDS was notified on 1 April 2025"],"correct":2,"explanation":"TReDS has been operational since 2017 (RBI-regulated); invoice discounting grew from ₹40,000 crore to ₹3.47 lakh crore. It is collateral-free; there are five platforms (RXIL, M1xchange, Invoicemart, C2treds, DTX); and the CPSE mandate notification was issued on 30 June 2026."},{"id":74,"topic":"TReDS","type":"not-among","difficulty":"hard","statements":["1. RXIL","2. M1xchange","3. Invoicemart","4. C2treds","5. TradeLinkX"],"question":"Which one of the following is NOT among the five operational TReDS platforms mentioned in the chapter?","options":["RXIL","M1xchange","Invoicemart","TradeLinkX","C2treds"],"correct":3,"explanation":"'TradeLinkX' is fabricated. The five genuine platforms are RXIL, M1xchange, Invoicemart, C2treds, and DTX."},{"id":75,"topic":"UDISE+","type":"numbered-combo","difficulty":"hard","context":"Regarding the UDISE+ 2025-26 report on school education, consider the following statements:","statements":["1. There was an 8.3% increase in the number of teachers compared to 2022-23.","2. The dropout rate at the secondary level declined from 8.2% to 7.0%.","3. The GER at the secondary level increased from 68.5% in 2024-25 to 71.7% in 2025-26.","4. The number of schools with zero enrolment increased by around 29% in 2025-26."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","1 and 4","4 only"],"correct":4,"explanation":"The number of zero-enrolment schools DECLINED by around 29% (not increased). Statements 1, 2 and 3 are correct."},{"id":76,"topic":"UDISE+","type":"figure-recall","difficulty":"moderate","question":"As per UDISE+ 2025-26, what is the reported Pupil-Teacher Ratio (PTR) at the Foundational and Secondary levels respectively?","options":["10 (Foundational) and 21 (Secondary)","15 (Foundational) and 30 (Secondary)","8 (Foundational) and 25 (Secondary)","12 (Foundational) and 17 (Secondary)","10 (Foundational) and 30 (Secondary)"],"correct":0,"explanation":"The PTR is reported as 10 (Foundational), 12 (Preparatory), 17 (Middle), and 21 (Secondary)."},{"id":77,"topic":"AISHE","type":"numbered-combo","difficulty":"hard","context":"Regarding the AISHE 2022-23 & 2023-24 reports, consider the following statements:","statements":["1. GER increased from 23.7 in 2014-15 to 30 in 2023-24.","2. The Gender Parity Index (GPI) for 2023-24 stands at 1.08.","3. Higher education enrolment increased from 3.42 crore (2014-15) to 4.50 crore (2023-24).","4. The GPI has remained above 1.0 for only two consecutive years."],"question":"Which of the above statements is/are incorrect?","options":["1 only","4 only","2 only","3 only","2 and 4"],"correct":1,"explanation":"The GPI has remained above 1.0 for seven consecutive years (not two). Statements 1, 2 and 3 are correct."},{"id":78,"topic":"AISHE","type":"figure-recall","difficulty":"moderate","question":"What was the participation rate of HEIs in the AISHE surveys for both 2022-23 and 2023-24?","options":["Exactly 75%","Around 60%","More than 90%","100%","Less than 50%"],"correct":2,"explanation":"HEI participation was 56,180/60,380 (2022-23) and 59,533/64,756 (2023-24), both representing more than 90% participation."},{"id":79,"topic":"TribeX","type":"figure-recall","difficulty":"easy","question":"How many free certificate courses does the TribeX platform currently host, with a roadmap to expand to how many?","options":["10 courses, expanding to 50","25 courses, expanding to 75","15 courses, expanding to 60","20 courses, expanding to over 100","30 courses, expanding to 120"],"correct":3,"explanation":"TribeX currently hosts 20 free certificate courses, with a roadmap to expand to over 100 certificate courses."},{"id":80,"topic":"SEED Scheme","type":"figure-recall","difficulty":"moderate","question":"During 2025-26, how many beneficiaries were covered under the SEED scheme components, and how much financial assistance was released?","options":["Exactly 2 lakh beneficiaries; ₹75 crore released","50,000 beneficiaries; ₹30 crore released","1.5 lakh beneficiaries; ₹100 crore released","80,000 beneficiaries; ₹53.06 crore released","More than 1.10 lakh beneficiaries; ₹53.06 crore released"],"correct":4,"explanation":"During 2025-26, more than 1.10 lakh beneficiaries were covered under SEED, with ₹53.06 crore released."},{"id":81,"topic":"NPS-CAB","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about the new NPS investment choices for Central Autonomous Body (CAB) employees is correct?","options":["The Aggressive Life Cycle Fund (LC-75), renamed LC-75-High, offers equity exposure of up to 75%","The Balanced Life Cycle Fund, renamed Aggressive Life Cycle Fund, caps equity exposure at 75%","Both new options begin reducing equity allocation from age 60","LC-75-High is designed for conservative, low-risk investors","The Balanced Life Cycle Fund was renamed 'LC-75-High'"],"correct":0,"explanation":"LC-75, renamed LC-75-High, offers up to 75% equity exposure for higher growth potential. The Balanced Life Cycle Fund (renamed 'Aggressive Life Cycle Fund') caps equity at 50% (not 75%), with reduction beginning at age 45 (not 60)."},{"id":82,"topic":"Ayurveda Global","type":"not-among","difficulty":"moderate","statements":["1. Availability","2. Acceptability","3. Propagation","4. Affordability","5. NITI Aayog's three-pillar framework"],"question":"Which one of the following is NOT one of the three pillars of NITI Aayog's 'Strategic Roadmap for Making Ayurveda Global' report?","options":["Availability","Affordability","Acceptability","Propagation","(All three are pillars: Availability, Acceptability, Propagation)"],"correct":1,"explanation":"The three genuine pillars are Availability, Acceptability, and Propagation — not Affordability."},{"id":83,"topic":"VB-G RAM-G","type":"numbered-combo","difficulty":"moderate","context":"Regarding the Viksit Bharat – Guarantee for Rozgar and Aajeevika Mission (Gramin) (VB-G RAM G), consider the following statements:","statements":["1. It was launched nationwide from Mukkavaripalli village, Tirupati district, Andhra Pradesh.","2. In the first year, the Centre's share will be more than ₹95,000 crore.","3. The target is to spend a total of ₹7.5 lakh crore under this scheme over the next five years.","4. Each panchayat will get an average of more than ₹5 crore per year."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","1 and 2"],"correct":2,"explanation":"Each panchayat is projected to receive more than ₹2 crore per year on average (not ₹5 crore). Statements 1, 2 and 3 are correct."},{"id":84,"topic":"VB-G RAM-G","type":"figure-recall","difficulty":"moderate","question":"Which State received the highest interim allocation and the highest first instalment (mother sanction) under VB-G RAM G?","options":["Madhya Pradesh, with ₹8,000 crore interim allocation","Bihar, with ₹7,500 crore interim allocation","Andhra Pradesh, with ₹9,721.48 crore interim allocation","Uttar Pradesh, with ₹9,721.48 crore interim allocation and ₹3,210.76 crore first instalment","Uttar Pradesh, with ₹5,000 crore interim allocation"],"correct":3,"explanation":"Uttar Pradesh received the highest interim allocation (₹9,721.48 crore) and the highest first instalment/mother sanction (₹3,210.76 crore) under VB-G RAM G."},{"id":85,"topic":"PMGKAY","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the CCEA-approved rice quality reform under PMGKAY is correct?","options":["Raw rice will now contain up to 5% broken grains (down from 10%)","The reform applies only to export-quality rice, not PMGKAY supplies","Broken rice will now be stored in jute bags instead of HDPE bags","The reform is expected to increase annual costs by ₹2,161 crore","Raw rice will now contain up to 10% broken grains (down from 25%), and parboiled rice up to 5% (down from 16%)"],"correct":4,"explanation":"Raw rice broken-grain content is reduced to up to 10% (from 25%) and parboiled rice to up to 5% (from 16%); broken rice will be stored in HDPE bags (reducing jute bag use); and the reform is expected to save (not increase) about ₹2,161 crore annually."},{"id":86,"topic":"India-Israel BIA","type":"figure-recall","difficulty":"moderate","question":"The India-Israel Bilateral Investment Agreement (BIA), signed on 8 September 2025, entered into force with effect from which date?","options":["4 July 2026","1 January 2026","15 August 2026","1 April 2026","8 September 2026"],"correct":0,"explanation":"The BIA entered into force with effect from 4 July 2026."},{"id":87,"topic":"NAPDDR/NMBA","type":"numbered-combo","difficulty":"hard","context":"Regarding the Nasha Mukt Bharat Abhiyaan (NMBA), consider the following statements:","statements":["1. NMBA was launched on 15 August 2020 under NAPDDR.","2. It was initially launched in 272 vulnerable districts.","3. The Ministry's first survey on 'Magnitude of Substance Use' (2019) found more than 7 crore individuals affected by substance use disorder.","4. The Ministry's toll-free Drug De-addiction Helpline number is 1933."],"question":"Which of the above statements is/are incorrect?","options":["1 only","4 only","2 only","3 only","1 and 4"],"correct":1,"explanation":"The Drug De-addiction Helpline number is 14446 (1933 is instead the national helpline for the separate MANAS platform under the Narcotics Control Bureau/MHA). Statements 1, 2 and 3 are correct."},{"id":88,"topic":"NAPDDR/NMBA","type":"acronym","difficulty":"easy","question":"What does 'NAPDDR' stand for?","options":["National Agency for Prevention of Drug Distribution and Rehabilitation","National Awareness Programme for Drug De-addiction and Recovery","National Action Plan for Drug Demand Reduction","National Alliance for Prevention of Drug-related Deaths and Rehabilitation","National Action Plan for Drug Detection and Reduction"],"correct":2,"explanation":"NAPDDR stands for National Action Plan for Drug Demand Reduction, the framework under which NMBA operates."},{"id":89,"topic":"AVYAY","type":"numbered-combo","difficulty":"moderate","context":"Regarding senior citizen welfare schemes under AVYAY, consider the following statements:","statements":["1. Elderline operates on helpline number 14567 from 8:00 AM to 8:00 PM.","2. Rashtriya Vayoshri Yojana (RVY) was launched on 1 April 2017.","3. RVY eligibility includes BPL senior citizens or those with monthly income up to ₹15,000.","4. SAGE was launched in August 2022 to promote innovative products/services for senior citizens."],"question":"Which of the above statements are correct?","options":["1, 2 and 3 only","2, 3 and 4 only","1 and 4 only","1, 2, 3 and 4","1, 3 and 4 only"],"correct":3,"explanation":"All four statements about AVYAY's components (Elderline, RVY, SAGE) are correct as per the chapter."},{"id":90,"topic":"AVYAY","type":"acronym","difficulty":"easy","question":"What does 'AVYAY' stand for?","options":["Atal Vridh Yojana for Aged and Youth","Atmanirbhar Vayoshri Yojana","Atal Vayoshri Abhyudaya Yatra","Atal Vayo Ayushman Yojana","Atal Vayo Abhyudaya Yojana"],"correct":4,"explanation":"AVYAY stands for Atal Vayo Abhyudaya Yojana, the umbrella scheme for senior citizen welfare."},{"id":91,"topic":"WPI/CPI Indices","type":"numbered-combo","difficulty":"hard","context":"Regarding the revised WPI series (Base Year 2022-23), consider the following statements:","statements":["1. The number of items in the WPI basket increased from 697 to 957.","2. Crude Petroleum & Natural Gas was shifted from Primary Articles to Fuel & Power.","3. Solar, Wind and Nuclear Electricity were added under the Electricity group.","4. The base year was revised from 2004-05 to 2022-23."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","1 and 3"],"correct":0,"explanation":"The base year was revised from 2011-12 (not 2004-05) to 2022-23. Statements 1, 2 and 3 are correct."},{"id":92,"topic":"WPI/CPI Indices","type":"figure-recall","difficulty":"moderate","question":"As per the CPI (Combined) release for June 2026 (Base 2024=100), what was the retail inflation rate and the number of weighted items at the all-India level?","options":["Retail inflation 5.5%; weighted items increased from 250 to 300","Retail inflation 4.38%; weighted items increased from 299 to 358","Retail inflation 4.38%; weighted items increased from 350 to 400","Retail inflation 3.2%; weighted items increased from 299 to 350","Retail inflation 6.1%; weighted items increased from 299 to 358"],"correct":1,"explanation":"Retail inflation (CPI, June 2026) was 4.38%; weighted items increased from 299 to 358 under CPI Base 2024=100."},{"id":93,"topic":"Index of Core Industries","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about the new Index of Core Industries (ICI) series (Base Year 2022-23) is correct?","options":["The number of core industries decreased from 9 to 8, with Cement removed","The Steel Index is now based on Net Production instead of Gross Production","The number of core industries increased from 8 to 9, with Iron Ore newly added","Coal coverage now includes Washed Coal and Coal Middling to avoid double counting","The overall linking factor between old and new ICI series is 2.47"],"correct":2,"explanation":"Core industries increased from 8 to 9 with Iron Ore newly added; Steel Index shifted to Gross (not Net) Production; Coal coverage now EXCLUDES Coal Middling and Washed Coal; and the overall linking factor is 1.47 (not 2.47)."},{"id":94,"topic":"CapaCITIES","type":"not-among","difficulty":"hard","statements":["1. Coimbatore, Tiruchirappalli, Tirunelveli (Tamil Nadu)","2. Ahmedabad, Rajkot, Vadodara (Gujarat)","3. Udaipur (Rajasthan)","4. Siliguri (West Bengal)","5. Bhopal (Madhya Pradesh)"],"question":"Which one of the following is NOT among the cities covered under the CapaCITIES programme?","options":["Coimbatore, Tiruchirappalli, Tirunelveli (Tamil Nadu)","Ahmedabad, Rajkot, Vadodara (Gujarat)","Udaipur (Rajasthan)","Bhopal (Madhya Pradesh)","Siliguri (West Bengal)"],"correct":3,"explanation":"Bhopal is not among the CapaCITIES cities. The genuine list covers Coimbatore, Tiruchirappalli, Tirunelveli (TN); Ahmedabad, Rajkot, Vadodara (Gujarat); Udaipur (Rajasthan); and Siliguri (West Bengal)."},{"id":95,"topic":"Atmanirbhar Panchayat","type":"figure-recall","difficulty":"moderate","question":"Under the Atmanirbhar Panchayat programme, what is the minimum Own Source Revenue (OSR) eligibility for a Gram Panchayat and a Block Panchayat respectively?","options":["₹1 crore (Gram Panchayat) and ₹2 crore (Block Panchayat)","₹25 lakh (Gram Panchayat) and ₹50 lakh (Block Panchayat)","₹75 lakh (Gram Panchayat) and ₹1.5 crore (Block Panchayat)","₹50 lakh (Gram Panchayat) and ₹2 crore (Block Panchayat)","₹50 lakh (Gram Panchayat) and ₹1 crore (Block Panchayat)"],"correct":4,"explanation":"The eligibility is minimum OSR of ₹50 lakh for Gram Panchayats and ₹1 crore for Block Panchayats."},{"id":96,"topic":"WTO AFS","type":"numbered-combo","difficulty":"moderate","context":"Regarding the WTO Agreement on Fisheries Subsidies (AFS), consider the following statements:","statements":["1. India became the 123rd WTO Member to accept the Agreement.","2. AFS was adopted at MC12, Geneva, in June 2022.","3. AFS entered into force on 15 September 2025.","4. AFS covers both marine wild capture fisheries and aquaculture."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","2 and 3"],"correct":0,"explanation":"AFS covers marine wild capture fisheries and related activities at sea, but explicitly does NOT cover aquaculture or inland fisheries. Statements 1, 2 and 3 are correct."},{"id":97,"topic":"WTO AFS","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about India's benefit from the WTO Agreement on Fisheries Subsidies is correct?","options":["India's shrimp exports will be banned under the new agreement","India's shrimp exports remain largely unaffected since they are primarily aquaculture-based, outside the Agreement's scope","The Agreement mandates subsidies for overfished stocks","AFS is the first multilateral WTO agreement focused on digital trade","India rejected the Agreement due to fishing industry concerns"],"correct":1,"explanation":"India's shrimp exports are primarily aquaculture-based, which is outside AFS's scope (marine wild capture only), so they remain largely unaffected; AFS actually PROHIBITS (not mandates) subsidies for overfished stocks; and it is the first WTO agreement with an environmental sustainability objective (not digital trade)."},{"id":98,"topic":"SMILE Scheme","type":"numbered-combo","difficulty":"moderate","context":"Regarding the SMILE Scheme, consider the following statements:","statements":["1. SMILE was launched in February 2022 by the Ministry of Social Justice and Empowerment.","2. It has two sub-schemes: one for transgender persons and one for welfare of persons engaged in begging.","3. Under the transgender sub-scheme, financial assistance for gender-affirmation surgery is provided through select AIIMS/govt hospitals.","4. The scheme is exclusively implemented through State Governments with no role for NGOs."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","1 and 4"],"correct":2,"explanation":"SMILE is implemented through both State Governments and NGOs/CBOs (not exclusively through states). Statements 1, 2 and 3 are correct."},{"id":99,"topic":"SMILE Scheme","type":"acronym","difficulty":"easy","question":"What does 'SMILE' stand for?","options":["Scheme for Marginalized Individuals' Livelihood and Employment","Support for Marginalised Individuals for Livelihood Empowerment","Social Mission for Inclusive Livelihood and Enterprise","Support for Marginalized Individuals for Livelihood and Enterprise","Scheme for Marginalized and Impoverished Livelihood Enhancement"],"correct":3,"explanation":"SMILE stands for Support for Marginalized Individuals for Livelihood and Enterprise."},{"id":100,"topic":"UPI","type":"figure-recall","difficulty":"moderate","question":"As per the chapter, UPI transactions in June 2026 reached approximately what volume and value?","options":["15 billion transactions worth ₹20 lakh crore","10 billion transactions worth ₹15 lakh crore","25 billion transactions worth ₹30 lakh crore","19.7 billion transactions worth ₹18 lakh crore","19.7 billion transactions worth ₹25.14 lakh crore"],"correct":4,"explanation":"UPI processed about 19.7 billion transactions worth ₹25.14 lakh crore in June 2026."},{"id":101,"topic":"e-Shram","type":"figure-recall","difficulty":"moderate","question":"As of the chapter's reporting period, how many workers had been registered on the e-Shram portal?","options":["More than 30.65 crore","20 crore","25 crore","15 crore","35.65 crore exactly, with no unorganised worker gap remaining"],"correct":0,"explanation":"More than 30.65 crore workers had registered on the e-Shram portal, India's national database for unorganised workers."},{"id":102,"topic":"NHA Awards","type":"numbered-combo","difficulty":"hard","context":"Regarding the NHA's performance awards presented at the National Review Meeting, consider the following statements:","statements":["1. A total of 15 performance awards were presented across AB PM-JAY and ABDM categories.","2. Under AB PM-JAY, Andhra Pradesh won for Highest VVS Cards per Lakh in the Large State category.","3. Under ABDM, Uttar Pradesh was awarded for ABHA Creation & Scan and Pay Adoption.","4. Six awards were given under ABDM and nine under AB PM-JAY."],"question":"Which of the above statements is/are incorrect?","options":["1 only","4 only","2 only","3 only","1 and 4"],"correct":1,"explanation":"It is reversed — six awards were given under AB PM-JAY and nine under ABDM (not the other way round). Statements 1, 2 and 3 are correct."},{"id":103,"topic":"Investment Friendliness Index","type":"numbered-combo","difficulty":"hard","context":"Regarding NITI Aayog's Investment Friendliness Index (IFI), consider the following statements:","statements":["1. The IFI covers all 28 states and 8 Union Territories across eight pillars.","2. The framework comprises 84 indicators combining secondary data and investor perception surveys.","3. States/UTs are classified into four categories: Top Performers, Frontrunners, Emerging Performers, and Aspiring States.","4. 'Top Performer' status requires a score above 50, and 5 states achieved this, including Gujarat, Maharashtra, Tamil Nadu, Goa and Odisha."],"question":"Which of the above statements are correct?","options":["1, 2 and 3 only","2, 3 and 4 only","1, 2, 3 and 4","1 and 4 only","1, 3 and 4 only"],"correct":2,"explanation":"All four statements accurately reflect the IFI's coverage, indicator framework, and performance categorisation as reported."},{"id":104,"topic":"PM-NAPS","type":"numbered-combo","difficulty":"hard","context":"Regarding MSDE's Special Intervention for apprenticeship promotion in the North-Eastern Region under PM-NAPS, consider the following statements:","statements":["1. It is implemented by the Indian Institute of Entrepreneurship (IIE), Guwahati.","2. The FY 2026-27 target is 30,000 apprentices, an increase of around 15% over the pilot phase.","3. Of the 30,000, 15,000 apprentices will be supported for opportunities outside the North-East.","4. The financial outlay for FY 2026-27 is ₹57.58 crore, and an additional incentive of ₹1,500 per month is provided over PM-NAPS support."],"question":"Which of the above statements are correct?","options":["1, 2 and 3 only","2, 3 and 4 only","1 and 4 only","1, 2, 3 and 4","1, 3 and 4 only"],"correct":3,"explanation":"All four statements accurately describe the MSDE Special Intervention extension for FY 2026-27 as reported."},{"id":105,"topic":"EPFO","type":"numbered-combo","difficulty":"hard","context":"Regarding EPFO's VISHWAS 2026 Scheme (effective 29 June 2026), consider the following statements:","statements":["1. It provides a one-time settlement of disputes related to damages/penalty under Section 14B of the EPF & MP Act, 1952.","2. The scheme window is open for a period of 6 months.","3. Full payment of statutory interest under Section 7Q is waived as an incentive to employers.","4. Cases involving fraud, misappropriation, or falsification of records are excluded from the scheme."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 and 4","3 only"],"correct":4,"explanation":"Full payment of statutory interest under Section 7Q is actually MANDATORY (not waived) for eligibility — only the damages/penalty rates are reduced. Statements 1, 2 and 4 are correct."},{"id":106,"topic":"EPFO","type":"acronym","difficulty":"easy","question":"What does 'EPFO' stand for?","options":["Employees' Provident Fund Organisation","Employment Pension Fund Organisation","Employees' Pension and Fund Office","Employees Provident Financial Organisation","Employment Provident Fund Office"],"correct":0,"explanation":"EPFO stands for the Employees' Provident Fund Organisation."},{"id":107,"topic":"Bioeconomy","type":"figure-recall","difficulty":"moderate","question":"As per NITI Aayog's Bioeconomy Roadmap, what is India's target for the size of its bioeconomy and by which year?","options":["US$500 billion by 2035","US$300 billion by 2030","US$200 billion by 2028","US$1 trillion by 2040","US$150 billion by 2027"],"correct":1,"explanation":"NITI Aayog's roadmap targets a US$300 billion bioeconomy by 2030."},{"id":108,"topic":"PARIVARTAN","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about the PARIVARTAN Scheme, approved by the Union Cabinet on 3 June 2026, is correct?","options":["It aims to replace old vehicles nationwide with a total outlay of ₹5,041 crore, all from state budgets","MoHUA is the implementing ministry, while NCRPB only provides guidelines","It aims to replace older polluting trucks/buses in the NCR with BS-VI/electric vehicles, with a total outlay of ₹9,585 crore including ₹5,041 crore in central budgetary support","It offers a 15% interest subvention on vehicle loans with no OEM discount requirement","It excludes CNG vehicles from fuel voucher support"],"correct":2,"explanation":"PARIVARTAN targets NCR trucks/buses replacement with BS-VI/EV vehicles; total outlay ₹9,585 crore including ₹5,041 crore central budgetary support. MoRTH (not MoHUA) is the implementing ministry, funded through NCRPB; interest subvention is 5% (not 15%) with a minimum 8% OEM discount required; and CNG replacement vehicles ARE eligible for fuel voucher support."},{"id":109,"topic":"Modified UDAN","type":"numbered-combo","difficulty":"hard","context":"Regarding the Regional Connectivity Scheme – Modified UDAN, approved for FY 2026-27 to FY 2035-36 with a total outlay of ₹28,840 crore, consider the following statements:","statements":["1. The scheme proposes developing 100 airports from unserved airstrips at an outlay of ₹12,159 crore.","2. O&M support is proposed for 3 years, capped at ₹3.06 crore per annum per airport, for around 441 aerodromes.","3. The scheme proposes developing 200 modern helipads at ₹15 crore each.","4. VGF support to airline operators is proposed at ₹10,043 crore over 10 years, with airlines receiving funding for up to 7 years."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","4 only","1 and 3"],"correct":3,"explanation":"Airlines will receive VGF funding support for up to 5 years (not 7 years), with a tapered mechanism from the third year. Statements 1, 2 and 3 are correct."},{"id":110,"topic":"JJM 2.0","type":"numbered-combo","difficulty":"moderate","context":"Regarding the Jal Jeevan Mission (JJM), extended by the Union Cabinet in March 2026, consider the following statements:","statements":["1. JJM was launched in August 2019 by the Ministry of Jal Shakti.","2. JJM has been extended till December 2028 under a restructured JJM 2.0.","3. Rural tap water coverage increased from 16.71% at launch to 82.09% by July 2026.","4. The total Mission outlay has been enhanced from ₹3.60 lakh crore to ₹6.50 lakh crore."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","3 and 4","4 only"],"correct":4,"explanation":"The total Mission outlay has been enhanced from ₹3.60 lakh crore to ₹8.69 lakh crore (not ₹6.50 lakh crore), with the central share rising from ₹2.08 lakh crore to ₹3.59 lakh crore. Statements 1, 2 and 3 are correct."},{"id":111,"topic":"JJM 2.0","type":"figure-recall","difficulty":"moderate","question":"Under JJM, what is the prescribed water supply standard in terms of quantity per person and the applicable quality standard?","options":["55 litres per capita per day (LPCD), meeting BIS 10500 standards","40 LPCD, meeting WHO 2011 standards","70 LPCD, meeting BIS 14543 standards","55 LPCD, meeting ISO 24510 standards","100 LPCD, meeting BIS 10500 standards"],"correct":0,"explanation":"JJM's objective is to provide 55 litres per capita per day (LPCD) of safe potable water meeting BIS 10500 standards."},{"id":112,"topic":"JJM 2.0","type":"not-among","difficulty":"hard","statements":["1. Andaman & Nicobar Islands","2. Goa","3. Punjab","4. Kerala","5. Telangana"],"question":"Which one of the following States/UTs is NOT listed among those with 100% rural tap water coverage under JJM?","options":["Andaman & Nicobar Islands","Kerala","Goa","Punjab","Telangana"],"correct":1,"explanation":"Kerala is not listed among the States/UTs with 100% rural tap water coverage. The listed States/UTs include Andaman & Nicobar Islands, Arunachal Pradesh, DNH & DD, Goa, Haryana, Himachal Pradesh, Mizoram, Puducherry, Punjab, and Telangana."},{"id":113,"topic":"PMAY-U 2.0","type":"numbered-combo","difficulty":"moderate","context":"Regarding PMAY-U 2.0, launched on 1 September 2024, consider the following statements:","statements":["1. PMAY-U (original) was launched on 25 June 2015.","2. PMAY-U 2.0 targets support for 1 crore additional eligible urban beneficiaries.","3. Houses under the scheme must have a minimum carpet area of 30 sqm, with states allowed flexibility up to 45 sqm without additional central financial assistance.","4. As on 13 July 2026, total houses sanctioned stood at 99.07 lakh, of which 127.68 lakh were completed/delivered."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","1 and 3"],"correct":2,"explanation":"The figures are reversed — 127.68 lakh houses were sanctioned in total, of which 99.07 lakh were completed/delivered (not the other way round). Statements 1, 2 and 3 are correct."},{"id":114,"topic":"PMAY-U 2.0","type":"not-among","difficulty":"hard","statements":["1. Beneficiary Led Construction (BLC)","2. Affordable Housing in Partnership (AHP)","3. Affordable Rental Housing (ARH)","4. Interest Subsidy Scheme (ISS)","5. Slum Redevelopment Vertical (SRV)"],"question":"Which one of the following is NOT one of the four verticals of PMAY-U 2.0?","options":["Beneficiary Led Construction (BLC)","Affordable Housing in Partnership (AHP)","Affordable Rental Housing (ARH)","Slum Redevelopment Vertical (SRV)","Interest Subsidy Scheme (ISS)"],"correct":3,"explanation":"'Slum Redevelopment Vertical (SRV)' is fabricated — this was associated with the original PMAY-U (2015), not listed as a PMAY-U 2.0 vertical. The four genuine PMAY-U 2.0 verticals are BLC, AHP, ARH and ISS."},{"id":115,"topic":"PMAY-U 2.0","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about the Interest Subsidy Scheme (ISS) vertical of PMAY-U 2.0 is correct?","options":["The maximum loan value eligible is ₹35 lakh with mandatory land ownership","Loan subsidy is disbursed in a single lump-sum instalment","EWS/LIG/MIG beneficiaries get a loan subsidy of up to ₹3 lakh","ISS is available to beneficiaries under any of the four verticals simultaneously","The maximum loan value eligible is ₹25 lakh with a maximum house value of ₹35 lakh, and ownership of land is not mandatory for a ready-built dwelling"],"correct":4,"explanation":"Under ISS, the max loan value is ₹25 lakh and max house value ₹35 lakh, with land ownership not mandatory for ready-built/under-construction units; the loan subsidy (up to ₹1.80 lakh for EWS/LIG/MIG) is disbursed in 5 yearly instalments, and a beneficiary may avail benefit under only one vertical."},{"id":116,"topic":"PM SVANidhi","type":"numbered-combo","difficulty":"moderate","context":"Regarding PM SVANidhi, launched on 1 June 2020 by MoHUA, consider the following statements:","statements":["1. As of 12 July 2026, 76.95 lakh street vendors had availed 1.15 crore loans worth ₹18,475.06 crore.","2. The 1st loan tranche is ₹15,000 with a 12-month repayment period.","3. The 3rd loan tranche is ₹50,000 with a 36-month repayment period.","4. Uttar Pradesh, Madhya Pradesh, Maharashtra, Gujarat and Telangana are the top-performing states."],"question":"Which of the above statements are correct?","options":["1, 2, 3 and 4","1, 2 and 3 only","2, 3 and 4 only","1 and 4 only","1, 3 and 4 only"],"correct":0,"explanation":"All four statements accurately reflect PM SVANidhi's structure and achievements as of 12 July 2026."},{"id":117,"topic":"PM SVANidhi","type":"figure-recall","difficulty":"moderate","question":"What is the maximum loan amount and repayment period under the 2nd tranche of PM SVANidhi?","options":["₹15,000, repayable over 12 months","₹25,000, repayable over 18 months","₹50,000, repayable over 24 months","₹30,000, repayable over 18 months","₹25,000, repayable over 24 months"],"correct":1,"explanation":"The 2nd tranche offers a maximum loan of ₹25,000 with an 18-month repayment period."},{"id":118,"topic":"PM SVANidhi","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about 'SVANidhi Se Samriddhi' is correct?","options":["It was launched on 1 June 2020 as an alternative to PM SVANidhi","It provides linkage to 15 Central Government welfare schemes","It was launched on 4 January 2021 to build a social security net for PM SVANidhi beneficiaries, linking them to 8 selected Central Government welfare schemes","It is implemented by the Ministry of Finance instead of MoHUA","It replaces the loan-tranche structure of PM SVANidhi"],"correct":2,"explanation":"SVANidhi Se Samriddhi was launched on 4 January 2021 to build a social security net for beneficiaries, providing linkages to 8 selected Central Government welfare schemes."},{"id":119,"topic":"PM POSHAN","type":"numbered-combo","difficulty":"hard","context":"Regarding nutritional and food norms under PM POSHAN, consider the following statements:","statements":["1. Primary-level (Classes I-V) children are entitled to 450 kcal and 12g protein per day.","2. Upper Primary-level (Classes VI-VIII) children are entitled to 700 kcal and 20g protein per day.","3. Food grain norms are 100g for Primary and 150g for Upper Primary students per day.","4. 10% of the total recurring budget is earmarked as a Flexi Component."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","4 only","1 and 4"],"correct":3,"explanation":"The Flexi Component is earmarked at 5% (not 10%) of the total recurring budget. Statements 1, 2 and 3 are correct."},{"id":120,"topic":"PM POSHAN","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the PM POSHAN Scheme is correct?","options":["The scheme is implemented solely by the Central Government with no State role","Beneficiaries are limited to Classes I to V only","The Flexi Component is used exclusively for mid-day snacks","Nutritional evaluation for 2025-26 was conducted internally by the Ministry of Education without a third party","Nutritional norms are prescribed under the National Food Security Act (NFSA), 2013 and PM POSHAN Guidelines, and the scheme covers Bal Vatika (pre-Class I) through Class VIII"],"correct":4,"explanation":"Norms are prescribed under NFSA 2013 and PM POSHAN Guidelines, covering Bal Vatika through Class VIII; it's implemented in partnership with States/UTs; the Flexi Component funds School Nutrition Gardens and supplementary nutrition; and the 2025-26 evaluation was conducted by NITI Aayog through an independent third-party agency."}];
</script>
<script>
/* ======================= App logic ======================= */

const SPRINT_TYPES = ['numbered-combo','not-among','acronym'];

const state = {
  screen: 'home',       // 'home' | 'section-grid' | 'quiz' | 'end'
  mode: null,           // 'full' | 'section' | 'sprint'
  order: 'pdf',         // 'pdf' | 'shuffled'  (full mode only)
  queue: [],            // ordered array of question objects for this session
  index: 0,
  answers: {},          // qid -> { selected: idx|null, skipped: bool, correct: bool }
  answeredCurrent: false,
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function topicCounts(){
  const map = {};
  QUESTIONS.forEach(q=>{ map[q.topic] = (map[q.topic]||0)+1; });
  return map;
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen === 'home') app.appendChild(renderHome());
  else if(state.screen === 'section-grid') app.appendChild(renderSectionGrid());
  else if(state.screen === 'quiz') app.appendChild(renderQuiz());
  else if(state.screen === 'end') app.appendChild(renderEnd());
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant':'auto'});
}

/* ---------------- HOME ---------------- */
function renderHome(){
  const total = QUESTIONS.length;
  const sprintCount = QUESTIONS.filter(q=>SPRINT_TYPES.includes(q.type)).length;
  const topics = Object.keys(topicCounts()).length;

  const wrap = el(`<div class="home"><div class="wrap"></div></div>`);
  const inner = wrap.querySelector('.wrap');
  inner.appendChild(el(`
    <div class="home-header">
      <div class="kicker">NABARD GRADE A · ESI / GA</div>
      <h1>PIB July 2026 Practice Quiz</h1>
      <p class="sub">${total} questions built from the PIB compilation — schemes, organisations, reports and current affairs, styled after the real mock-test format.</p>
    </div>
  `));

  const list = el(`<div class="mode-list"></div>`);

  // Full Practice Test
  const fullCard = el(`
    <div class="mode-card" style="--mode-color:var(--accent)">
      <div class="mode-top">
        <div>
          <h3 class="mode-title">Full Practice Test</h3>
          <p class="mode-desc">All ${total} questions, in the order they appear across the chapter or fully shuffled.</p>
        </div>
        <div class="mode-count">${total} Qs</div>
      </div>
      <div class="mode-actions">
        <div class="toggle-group" id="order-toggle">
          <button class="toggle-opt ${state.order==='pdf'?'active':''}" data-order="pdf">PDF Order</button>
          <button class="toggle-opt ${state.order==='shuffled'?'active':''}" data-order="shuffled">Shuffled</button>
        </div>
        <button class="btn" id="start-full">Start Test</button>
      </div>
    </div>
  `);
  fullCard.querySelectorAll('[data-order]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.order = b.dataset.order;
      render();
    });
  });
  fullCard.querySelector('#start-full').addEventListener('click',()=>{
    let qs = QUESTIONS.slice();
    if(state.order==='shuffled') qs = shuffle(qs);
    startQuiz(qs,'full');
  });
  list.appendChild(fullCard);

  // Section-wise Revision
  const sectionCard = el(`
    <div class="mode-card" style="--mode-color:var(--blue)">
      <div class="mode-top">
        <div>
          <h3 class="mode-title">Section-wise Revision</h3>
          <p class="mode-desc">Drill a single scheme, organisation or topic at a time — ${topics} topics covered.</p>
        </div>
        <div class="mode-count">${topics} topics</div>
      </div>
      <div class="mode-actions">
        <span></span>
        <button class="btn secondary" id="browse-topics">Browse Topics</button>
      </div>
    </div>
  `);
  sectionCard.querySelector('#browse-topics').addEventListener('click',()=>{
    state.screen = 'section-grid';
    render();
  });
  list.appendChild(sectionCard);

  // Schemes-Only Sprint
  const sprintCard = el(`
    <div class="mode-card" style="--mode-color:var(--green)">
      <div class="mode-top">
        <div>
          <h3 class="mode-title">Schemes-Only Sprint</h3>
          <p class="mode-desc">Numbered-statement, "not-among" and acronym questions only — pure scheme &amp; organisation recall.</p>
        </div>
        <div class="mode-count">${sprintCount} Qs</div>
      </div>
      <div class="mode-actions">
        <span></span>
        <button class="btn" id="start-sprint">Start Sprint</button>
      </div>
    </div>
  `);
  sprintCard.querySelector('#start-sprint').addEventListener('click',()=>{
    const qs = QUESTIONS.filter(q=>SPRINT_TYPES.includes(q.type));
    startQuiz(qs,'sprint');
  });
  list.appendChild(sprintCard);

  inner.appendChild(list);
  inner.appendChild(el(`<div class="home-footer">Tap any option to answer instantly — right or wrong, you'll get the correct answer and a short explanation. Skip anything without penalty; skipped questions come back in your end-of-quiz review.</div>`));

  return wrap;
}

/* ---------------- SECTION GRID ---------------- */
function renderSectionGrid(){
  const counts = topicCounts();
  const topics = Object.keys(counts).sort((a,b)=>a.localeCompare(b));

  const wrap = el(`
    <div>
      <div class="topbar"><div class="topbar-inner">
        <button class="back-btn" id="back-home">← Menu</button>
        <div class="topbar-meta"><div class="topbar-row"><span>Section-wise Revision</span></div></div>
      </div></div>
      <div class="wrap section-screen">
        <div class="section-head">
          <h2>Choose a topic</h2>
          <p>${topics.length} topics · tap one to drill just those questions</p>
        </div>
        <input type="text" class="search-box" id="topic-search" placeholder="Search topics…">
        <div class="topic-grid" id="topic-grid"></div>
      </div>
    </div>
  `);
  wrap.querySelector('#back-home').addEventListener('click',()=>{state.screen='home';render();});

  const grid = wrap.querySelector('#topic-grid');
  function paintGrid(filter){
    grid.innerHTML='';
    const f = (filter||'').toLowerCase();
    topics.filter(t=>t.toLowerCase().includes(f)).forEach(topic=>{
      const card = el(`
        <button class="topic-card">
          <div class="topic-name">${escapeHtml(topic)}</div>
          <div class="topic-count">${counts[topic]} question${counts[topic]>1?'s':''}</div>
        </button>
      `);
      card.addEventListener('click',()=>{
        const qs = QUESTIONS.filter(q=>q.topic===topic);
        startQuiz(qs,'section',topic);
      });
      grid.appendChild(card);
    });
    if(grid.children.length===0){
      grid.appendChild(el(`<div class="empty-topic">No topics match "${escapeHtml(filter)}"</div>`));
    }
  }
  paintGrid('');
  wrap.querySelector('#topic-search').addEventListener('input',(e)=>paintGrid(e.target.value));

  return wrap;
}

/* ---------------- QUIZ FLOW ---------------- */
function startQuiz(questions, mode, sectionTopic){
  state.mode = mode;
  state.sectionTopic = sectionTopic || null;
  state.queue = questions;
  state.index = 0;
  state.answers = {};
  state.answeredCurrent = false;
  state.screen = 'quiz';
  render();
}

function currentQuestion(){ return state.queue[state.index]; }

function renderQuiz(){
  if(state.queue.length===0){
    const wrap = el(`
      <div>
        <div class="topbar"><div class="topbar-inner">
          <button class="back-btn" id="back-home">← Menu</button>
        </div></div>
        <div class="wrap"><div class="empty-topic">No questions available.</div></div>
      </div>
    `);
    wrap.querySelector('#back-home').addEventListener('click',()=>{state.screen='home';render();});
    return wrap;
  }

  const q = currentQuestion();
  const total = state.queue.length;
  const answeredCount = Object.keys(state.answers).length;
  const scoreSoFar = Object.values(state.answers).filter(a=>a.correct).length;
  const pct = Math.round(((state.index)/total)*100);

  const wrap = el(`
    <div>
      <div class="topbar"><div class="topbar-inner">
        <button class="back-btn" id="back-home">← Menu</button>
        <div class="topbar-meta">
          <div class="topbar-row">
            <span>Question ${state.index+1} of ${total}</span>
            <span class="score">Score: ${scoreSoFar}/${answeredCount}</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      </div></div>
      <div class="wrap quiz-screen">
        <div class="q-meta-row">
          <span class="topic-chip">${escapeHtml(q.topic)}</span>
          <span class="diff-chip diff-${q.difficulty}">${capitalize(q.difficulty)}</span>
        </div>
        <div id="context-slot"></div>
        <p class="question-text">${escapeHtml(q.question)}</p>
        <div class="options" id="options-slot"></div>
        <div class="action-row" id="action-row"></div>
        <div id="explanation-slot"></div>
        <div class="next-row" id="next-slot"></div>
      </div>
    </div>
  `);

  wrap.querySelector('#back-home').addEventListener('click',()=>{
    state.screen='home'; render();
  });

  // context / statements
  if(q.context || q.statements){
    const box = el(`<div class="context-box"></div>`);
    if(q.context) box.appendChild(el(`<p>${escapeHtml(q.context)}</p>`));
    if(q.statements){
      const listEl = el(`<ul></ul>`);
      q.statements.forEach(s=>listEl.appendChild(el(`<li>${escapeHtml(s)}</li>`)));
      box.appendChild(listEl);
    }
    wrap.querySelector('#context-slot').appendChild(box);
  }

  const existing = state.answers[q.id];
  const optionsSlot = wrap.querySelector('#options-slot');
  q.options.forEach((optText, idx)=>{
    const letter = String.fromCharCode(65+idx);
    const btn = el(`
      <button class="option" data-idx="${idx}">
        <span class="option-letter">${letter}</span>
        <span>${escapeHtml(optText)}</span>
      </button>
    `);
    optionsSlot.appendChild(btn);
    btn.addEventListener('click',()=>handleAnswer(idx));
  });

  const actionRow = wrap.querySelector('#action-row');
  if(!existing){
    const skipBtn = el(`<button class="btn secondary">Skip</button>`);
    skipBtn.addEventListener('click',handleSkip);
    actionRow.appendChild(skipBtn);
  }

  if(existing){
    paintAnsweredState(wrap, q, existing);
  }

  return wrap;
}

function paintAnsweredState(wrap, q, record){
  const options = wrap.querySelectorAll('.option');
  options.forEach((opt,idx)=>{
    opt.classList.add('locked');
    if(idx===q.correct) opt.classList.add('correct');
    else if(idx===record.selected) opt.classList.add('incorrect');
    else opt.classList.add('faded');
  });

  const expSlot = wrap.querySelector('#explanation-slot');
  let tagText, tagClass;
  if(record.skipped){ tagText='Skipped'; tagClass='skipped'; }
  else if(record.correct){ tagText='Correct'; tagClass='correct'; }
  else { tagText='Incorrect'; tagClass='incorrect'; }

  expSlot.appendChild(el(`
    <div class="explanation ${tagClass}">
      <span class="tag">${tagText}</span>
      ${escapeHtml(q.explanation)}
    </div>
  `));

  const nextSlot = wrap.querySelector('#next-slot');
  const isLast = state.index === state.queue.length-1;
  const nextBtn = el(`<button class="btn">${isLast?'Finish':'Next →'}</button>`);
  nextBtn.addEventListener('click',()=>{
    if(isLast){ state.screen='end'; render(); }
    else { state.index++; render(); }
  });
  nextSlot.appendChild(nextBtn);
}

function handleAnswer(idx){
  const q = currentQuestion();
  if(state.answers[q.id]) return;
  const correct = idx === q.correct;
  state.answers[q.id] = { selected: idx, skipped:false, correct };
  render();
}

function handleSkip(){
  const q = currentQuestion();
  if(state.answers[q.id]) return;
  state.answers[q.id] = { selected:null, skipped:true, correct:false };
  render();
}

/* ---------------- END SCREEN ---------------- */
function renderEnd(){
  const total = state.queue.length;
  const records = state.queue.map(q=>({q, r: state.answers[q.id] || {selected:null,skipped:true,correct:false}}));
  const correctCount = records.filter(x=>x.r.correct).length;
  const skippedCount = records.filter(x=>x.r.skipped).length;
  const wrongCount = total - correctCount - skippedCount;
  const pct = total? Math.round((correctCount/total)*100) : 0;

  const diffs = ['easy','moderate','hard'];
  const diffStats = {};
  diffs.forEach(d=>{
    const inDiff = records.filter(x=>x.q.difficulty===d);
    const correctInDiff = inDiff.filter(x=>x.r.correct).length;
    diffStats[d] = {correct:correctInDiff, total:inDiff.length};
  });

  const wrap = el(`
    <div>
      <div class="topbar"><div class="topbar-inner">
        <button class="back-btn" id="back-home">← Menu</button>
        <div class="topbar-meta"><div class="topbar-row"><span>Results</span></div></div>
      </div></div>
      <div class="wrap end-screen">
        <div class="end-hero">
          <div class="score-num">${correctCount}/${total}</div>
          <div class="score-label">${pct}% correct · ${wrongCount} wrong · ${skippedCount} skipped</div>
        </div>
        <div class="breakdown" id="breakdown"></div>
        <div class="end-actions">
          <button class="btn secondary" id="retry-btn">Retry Same Set</button>
          <button class="btn" id="menu-btn">Back to Menu</button>
        </div>
        <h3 class="review-head">Review</h3>
        <div id="review-list"></div>
      </div>
    </div>
  `);

  wrap.querySelector('#back-home').addEventListener('click',()=>{state.screen='home';render();});
  wrap.querySelector('#menu-btn').addEventListener('click',()=>{state.screen='home';render();});
  wrap.querySelector('#retry-btn').addEventListener('click',()=>{
    startQuiz(state.queue.slice(), state.mode, state.sectionTopic);
  });

  const bdSlot = wrap.querySelector('#breakdown');
  diffs.forEach(d=>{
    const s = diffStats[d];
    const p = s.total? Math.round((s.correct/s.total)*100):0;
    bdSlot.appendChild(el(`
      <div class="breakdown-card">
        <div class="bd-label">${capitalize(d)}</div>
        <div class="bd-value">${s.correct}/${s.total}</div>
        <div class="bd-bar-track"><div class="bd-bar-fill" style="width:${p}%"></div></div>
      </div>
    `));
  });

  const reviewList = wrap.querySelector('#review-list');
  const misses = records.filter(x=>!x.r.correct);
  if(misses.length===0){
    reviewList.appendChild(el(`<div class="no-review">Clean sweep — nothing missed or skipped. 🎉</div>`));
  } else {
    misses.forEach(({q,r})=>{
      const statusLabel = r.skipped ? 'Skipped' : 'Wrong';
      const statusClass = r.skipped ? 'skipped' : 'wrong';
      const item = el(`
        <div class="review-item">
          <div class="review-item-head">
            <span class="topic-chip">${escapeHtml(q.topic)}</span>
            <span class="review-status ${statusClass}">${statusLabel}</span>
          </div>
          <p class="review-q">${escapeHtml(q.question)}</p>
          ${(!r.skipped && r.selected!==null) ? `<p class="review-your-answer">Your answer: ${String.fromCharCode(65+r.selected)}. ${escapeHtml(q.options[r.selected])}</p>` : ''}
          <p class="review-answer">Correct: ${String.fromCharCode(65+q.correct)}. ${escapeHtml(q.options[q.correct])}</p>
          <p class="review-explain">${escapeHtml(q.explanation)}</p>
        </div>
      `);
      reviewList.appendChild(item);
    });
  }

  return wrap;
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

render();
</script>
