 first greenfield integrated Refinery-cum-Petrochemical Complex at Pachpadra, Balotra, is a joint venture between which entities, with what capacity and investment?","options":["HPCL and Government of Rajasthan; 9 MMTPA capacity; investment of over ₹79,450 crore","IOCL and Government of Gujarat; 12 MMTPA capacity; ₹50,000 crore investment","ONGC and Government of Rajasthan; 6 MMTPA capacity; ₹60,000 crore investment","HPCL and Government of Madhya Pradesh; 9 MMTPA capacity; ₹79,450 crore","BPCL and Government of Rajasthan; 15 MMTPA capacity; ₹1 lakh crore investment"],"correct":0,"explanation":"The Pachpadra refinery-cum-petrochemical complex is a JV between HPCL and the Government of Rajasthan, with a 9 MMTPA capacity and an investment of over ₹79,450 crore."},{"id":187,"topic":"NIFTEM-K","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about NIFTEM-K is correct?","options":["It is under the Ministry of Agriculture & Farmers Welfare","It is an Institute of National Importance under the Ministry of Food Processing Industries, and signed an MoU with Massey University, New Zealand","It signed an MoU with a university in Australia, not New Zealand","NIFTEM-K stands for the National Institute for Food Technology, Engineering and Management, Karnal","It is a private institution with no government affiliation"],"correct":1,"explanation":"NIFTEM-K (National Institute of Food Technology Entrepreneurship and Management, Kundli) is an Institute of National Importance under the Ministry of Food Processing Industries; it signed the MoU with Massey University, New Zealand (not Australia)."},{"id":188,"topic":"Maritime Investment Fund","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Maritime Investment Fund (MIF) is correct?","options":["MIF is established under the Ministry of Finance as a sovereign wealth fund","MIF exclusively funds shipbuilding startups with no institutional capital involvement","MIF is being established under the Maritime Development Fund by the Ministry of Ports, Shipping & Waterways to mobilise long-term institutional capital","MIF was established prior to the Maritime Development Fund and later merged into it","MIF focuses solely on inland waterways, excluding maritime shipping"],"correct":2,"explanation":"MIF is being established under the Maritime Development Fund (MDF), an initiative of the Ministry of Ports, Shipping & Waterways, to mobilise long-term institutional capital into India's maritime sector."},{"id":189,"topic":"Made-in-India Container","type":"numbered-combo","difficulty":"hard","context":"Regarding India's first Made-in-India EXIM shipping container, unveiled by Sarbananda Sonowal, consider the following statements:","statements":["1. It was manufactured for A.P. Moller-Maersk at the Maersk-CONCOR Inland Container Depot in Dadri, Uttar Pradesh.","2. It meets ISO specifications and the International Convention for Safe Containers (CSC) standards.","3. The Container Manufacturing Promotion Scheme (CMPS) has an outlay of ₹10,000 crore, announced in the Union Budget 2026.","4. CMPS envisages a 5-times boost in annual manufacturing capacity up to 3.5 lakh TEUs."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","4 only","2 and 4"],"correct":3,"explanation":"CMPS envisages a 10-TIMES capacity boost up to 7.5 lakh TEUs (not 5 times up to 3.5 lakh TEUs). Statements 1, 2 and 3 are correct."},{"id":190,"topic":"Ship Recycling","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about India-EU cooperation on sustainable ship recycling is correct?","options":["The EU has already banned all Indian ship recycling facilities from operating","India ranks second globally in ship recycling, behind Bangladesh","EUSRR is a UNCTAD-administered regulation, not an EU regulation","Cooperation on ship recycling excludes any EU recognition of Indian yards","India and the EU are working towards including Indian ship recycling facilities under the European Union Ship Recycling Regulation (EUSRR), with India being the world's leading ship recycling nation"],"correct":4,"explanation":"India and the EU are advancing cooperation to include Indian ship recycling facilities under the EU's own Ship Recycling Regulation (EUSRR); India is described as the world's leading ship recycling nation, not ranked second."},{"id":21,"topic":"FCRA","type":"numbered-combo","difficulty":"hard","context":"Regarding the evolution of the Foreign Contribution (Regulation) Act (FCRA), consider the following statements:","statements":["1. The original FCRA was enacted in 1976.","2. The 2010 FCRA Act made registration renewal mandatory every five years.","3. The 2020 amendment cut the administrative-expense ceiling from 50% to 20%.","4. The 2022 amendment reduced the limit on contributions from relatives abroad from ₹10 lakh to ₹1 lakh per year."],"question":"Which of the above statements is/are correct?","options":["1, 2 and 3 only","1, 2, 3 and 4","2 and 4 only","1 and 3 only","1, 2, 3 and 4 are all incorrect"],"correct":0,"explanation":"Statement 4 is reversed — the 2022 amendment raised the limit on contributions from relatives abroad from ₹1 lakh to ₹10 lakh a year, not decreased it."},{"id":22,"topic":"FCRA","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about FCRA registration is correct?","options":["FCRA registration is valid for 3 years with automatic renewal","FCRA registration is valid for 5 years and mandatory renewal is required before expiry","FCRA registration, once granted, never requires renewal","Prior Permission mode is available only to NGOs operational for at least 5 years","FCRA registration is administered by the Ministry of Finance"],"correct":1,"explanation":"FCRA registration is valid for 5 years, with mandatory renewal before expiry; it is administered by the Ministry of Home Affairs; FCRA Registration mode requires at least 3 years of NGO operation, while Prior Permission is for specific projects."},{"id":23,"topic":"FCRA","type":"acronym","difficulty":"easy","question":"What does 'FCRA' stand for?","options":["Foreign Currency Regulation Authority","Federal Contribution Regulatory Act","Foreign Contribution (Regulation) Act","Foreign Capital Reporting Act","Foreign Contribution Recognition Act"],"correct":2,"explanation":"FCRA stands for the Foreign Contribution (Regulation) Act, administered by the Ministry of Home Affairs."},{"id":24,"topic":"FCRA","type":"not-among","difficulty":"moderate","statements":["1. Election candidates","2. MPs/MLAs","3. Judges","4. Registered NGOs with 3+ years of operation","5. Political parties"],"question":"Which one of the following is NOT among the categories barred from receiving foreign contribution under Section 3 of FCRA?","options":["Election candidates","MPs/MLAs","Judges","Registered NGOs with 3+ years of operation","Political parties"],"correct":3,"explanation":"NGOs operational for at least 3 years are actually eligible to apply for FCRA registration; they are not a barred category. Election candidates, MPs/MLAs, judges, and political parties are all barred under Section 3."},{"id":25,"topic":"FCRA","type":"figure-recall","difficulty":"moderate","question":"Under FCRA's financial compliance rules, what is the maximum percentage of annual foreign contribution that can be spent on administrative expenses, and what is the minimum utilisation requirement under the 2026 rules for renewal?","options":["Maximum 50% on administrative expenses; minimum ₹5 lakh utilised in previous 2 years","Maximum 20% on administrative expenses; minimum ₹5 lakh utilised in previous year","Maximum 30% on administrative expenses; minimum ₹10 lakh utilised in previous 3 years","Maximum 10% on administrative expenses; no minimum utilisation requirement","Maximum 20% on administrative expenses; minimum ₹10 lakh utilised in previous 2 years for renewal"],"correct":4,"explanation":"A maximum of 20% of annual foreign contribution can go to administrative expenses; NGOs must have utilised at least ₹10 lakh foreign contribution in the previous 2 years for renewal under the 2026 rules."},{"id":26,"topic":"RSETI","type":"numbered-combo","difficulty":"moderate","context":"As of March 2026, regarding Rural Self-Employment Training Institutes (RSETIs), consider the following statements:","statements":["1. RSETIs are established through a three-way partnership among MoRD, State/UT Governments and Sponsor Banks.","2. 632 RSETIs operate across 33 States/UTs covering 619 districts.","3. RSETIs are supported by 25 sponsor banks nationwide.","4. Training is provided to rural unemployed persons aged 21–55 years."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","1 and 4"],"correct":0,"explanation":"The target age group is 18–50 years (not 21–55 years). Statements 1, 2 and 3 are correct."},{"id":27,"topic":"RSETI","type":"figure-recall","difficulty":"easy","question":"Against a training target of 60.81 lakh, what percentage had been achieved by RSETIs as of March 2026?","options":["95% (57.5 lakh candidates trained)","99.7% (60.63 lakh candidates trained)","100% (60.81 lakh candidates trained)","85% (51.5 lakh candidates trained)","90% (54.7 lakh candidates trained)"],"correct":1,"explanation":"About 99.7% of the 60.81 lakh target was achieved, with 60.63 lakh candidates trained."},{"id":28,"topic":"Textiles","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about PM MITRA Parks is correct?","options":["Ten PM MITRA Parks have been approved with an outlay of ₹5,000 crore","PM MITRA Parks are built around a '3F' vision: Farm, Fashion, Foreign","Seven PM MITRA Parks have been approved with an outlay of ₹4,445 crore up to 2027-28, built around the '5F' vision","The scheme is implemented solely by state governments without central funding","PM MITRA Parks focus exclusively on jute cultivation"],"correct":2,"explanation":"Seven PM MITRA Parks were approved with an outlay of ₹4,445 crore up to 2027-28, built around the '5F' vision: Farm to Fibre to Factory to Fashion to Foreign."},{"id":29,"topic":"Textiles","type":"not-among","difficulty":"hard","statements":["1. Virudhunagar, Tamil Nadu","2. Warangal, Telangana","3. Navsari, Gujarat","4. Indore, Madhya Pradesh","5. Amravati, Maharashtra"],"question":"Which one of the following locations is NOT among the seven finalised sites for PM MITRA Parks?","options":["Virudhunagar, Tamil Nadu","Warangal, Telangana","Navsari, Gujarat","Indore, Madhya Pradesh","Amravati, Maharashtra"],"correct":3,"explanation":"The finalised MP site is Dhar (not Indore), Madhya Pradesh. The seven sites are Virudhunagar (TN), Warangal (Telangana), Navsari (Gujarat), Kalaburagi (Karnataka), Dhar (MP), Lucknow (UP), and Amravati (Maharashtra)."},{"id":30,"topic":"Textiles","type":"acronym","difficulty":"moderate","question":"Under the RAMP Programme, what does 'MSE-GIFT' primarily support?","options":["25% capital subsidy for circular economy plant and machinery","GI-tagged handicraft branding for MSMEs","Interest-free loans for MSME exporters","Green hydrogen production subsidies for large textile mills","Adoption of green technologies and clean energy in MSMEs, with 2% interest subvention on term loans up to ₹2 crore"],"correct":4,"explanation":"MSE-GIFT supports green technology/clean energy adoption in MSMEs with 2% annual interest subvention on term loans up to ₹2 crore, plus 75% credit guarantee coverage."},{"id":31,"topic":"Textiles","type":"figure-recall","difficulty":"moderate","question":"As per the National Account Statistics 2025, the textile sector accounts for approximately what share of India's GDP and manufacturing GVA respectively?","options":["~2% of GDP and ~11% of manufacturing GVA","~5% of GDP and ~20% of manufacturing GVA","~2% of GDP and ~25% of manufacturing GVA","~8% of GDP and ~11% of manufacturing GVA","~1% of GDP and ~5% of manufacturing GVA"],"correct":0,"explanation":"The textile sector accounts for approximately 2% of India's GDP and 11% of manufacturing GVA, per National Account Statistics 2025."},{"id":32,"topic":"ISP","type":"numbered-combo","difficulty":"hard","context":"Regarding the Index of Services Production (ISP), first released on 14 July 2026, consider the following statements:","statements":["1. ISP was launched by the Ministry of Statistics and Programme Implementation (MoSPI).","2. ISP covers 19 service sub-sectors, accounting for approximately 60% of the services sector.","3. The base year for ISP is 2022-23.","4. ISP uses GST data for the first time in official statistical applications."],"question":"Which of the above statements is/are incorrect?","options":["1 only","3 only","2 only","4 only","2 and 4"],"correct":1,"explanation":"The ISP base year is 2024-25 (not 2022-23). Statements 1, 2 and 4 are correct."},{"id":33,"topic":"ISP","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Index of Services Production (ISP) is correct?","options":["ISP is released quarterly with a lag of 90 days","ISP replaced the IIP entirely for measuring industrial output","ISP is released monthly with a lag of around 60 days, published on the 29th of every month","ISP was developed solely using the OECD Compilation Manual without any Technical Advisory Committee","ISP covers Public Administration & Defence as a key included sector"],"correct":2,"explanation":"ISP is released monthly with about a 60-day lag, published on the 29th of every month; it excludes Public Administration & Defence; IIP still exists separately; a Technical Advisory Committee (constituted May 2025) developed its framework."},{"id":34,"topic":"ISP","type":"not-among","difficulty":"hard","statements":["1. Accommodation & Food","2. Retail Trade","3. Administrative & Support Services","4. Public Administration & Defence","5. Real Estate"],"question":"Which one of the following was among the Top 5 monthly-growing sub-sectors under ISP in April 2026, but is actually a sector EXCLUDED from ISP coverage — making its inclusion in this list a deliberate error?","options":["Accommodation & Food","Retail Trade","Administrative & Support Services","Public Administration & Defence","Real Estate"],"correct":3,"explanation":"Public Administration & Defence is explicitly excluded from ISP coverage; it cannot be among growth-tracked sub-sectors. The genuine Top 5 (April 2026) are Accommodation & Food, Retail Trade, Administrative & Support Services, Real Estate, and Telecommunications."},{"id":35,"topic":"Rural Credit","type":"numbered-combo","difficulty":"moderate","context":"Regarding the evolution of India's rural credit system, consider the following statements:","statements":["1. NABARD was established in 1982.","2. The SHG-Bank Linkage Programme was introduced in 1992.","3. The Kisan Credit Card (KCC) Scheme was launched in 1998.","4. The MUDRA Scheme (PMMY) was launched in 2010."],"question":"Which of the above statements is/are correct?","options":["1, 2, 3 and 4","1 and 4 only","2, 3 and 4 only","1, 3 and 4 only","1, 2 and 3 only"],"correct":4,"explanation":"The MUDRA Scheme (PMMY) was launched in 2015, not 2010. Statements 1, 2 and 3 are correct."},{"id":36,"topic":"Rural Credit","type":"figure-recall","difficulty":"moderate","question":"NABARD celebrated its foundation day on 12 July 2026. Which anniversary was this, and in which year was NABARD established?","options":["45th foundation day; established in 1982","40th foundation day; established in 1986","50th foundation day; established in 1976","45th foundation day; established in 1975","35th foundation day; established in 1991"],"correct":0,"explanation":"NABARD was established in 1982 and celebrated its 45th foundation day on 12 July 2026."},{"id":37,"topic":"Rural Credit","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about Priority Sector Lending (PSL) for agriculture is correct?","options":["Banks must earmark at least 25% of Adjusted Net Bank Credit for agriculture with no sub-targets","Banks must earmark at least 18% of Adjusted Net Bank Credit for agriculture, with sub-targets of 14% for non-corporate farmers and 10% for small/marginal farmers","PSL guidelines exclude Regional Rural Banks and Small Finance Banks","The sub-target for small and marginal farmers under PSL is 18%","PSL for agriculture is set at a flat 10% with no distinction for farmer categories"],"correct":1,"explanation":"PSL mandates at least 18% of Adjusted Net Bank Credit (or Credit Equivalent) for agriculture, with sub-targets of 14% for non-corporate farmers and 10% for small and marginal farmers; RRBs and SFBs are covered under these guidelines."},{"id":38,"topic":"Rural Credit","type":"acronym","difficulty":"easy","question":"What does 'DAY-NRLM' stand for?","options":["Delhi Agricultural Yojana – National Rural Loan Mission","Deendayal Antyodaya Yojana – National Rural Land Mission","Deendayal Antyodaya Yojana – National Rural Livelihoods Mission","Development Aid Yojana – National Rural Livelihoods Mission","Deendayal Antyodaya Yojana – National Rural Loan Management"],"correct":2,"explanation":"DAY-NRLM stands for Deendayal Antyodaya Yojana – National Rural Livelihoods Mission, the renamed NRLM effective from 29 March 2016."},{"id":39,"topic":"Rural Credit","type":"list-intersection","difficulty":"hard","context":"Consider the following rural credit institutions/instruments described in the chapter:","statements":["1. Regional Rural Banks (RRBs)","2. Small Finance Banks (SFBs)","3. Primary Agricultural Credit Societies (PACS)","4. Modified Interest Subvention Scheme (MISS)","5. Ground Level Credit (GLC) targets","6. Jan Samarth Portal","7. Kisan Credit Card (KCC)"],"question":"Which of the above are described in the chapter as institutions (as opposed to credit schemes/instruments)?","options":["4, 5, 6 and 7 only","1, 3, 5 and 7","2, 4 and 6 only","1, 2 and 3 only","1, 2, 3 and 4"],"correct":3,"explanation":"RRBs, SFBs, and PACS are institutions; MISS, GLC targets, Jan Samarth Portal, and KCC are schemes/instruments/platforms, not institutions."},{"id":40,"topic":"Rural Credit","type":"figure-recall","difficulty":"moderate","question":"As on 8 July 2026, which category of lender accounted for the highest number of KCC applications?","options":["Commercial banks, with over 900 lakh applications","RRBs, with over 800 lakh applications","Small Finance Banks, with over 500 lakh applications","NABARD directly, with over 700 lakh applications","Cooperative banks, with over 1178 lakh applications"],"correct":4,"explanation":"Cooperative banks recorded the highest number of KCC applications at over 1178 lakh, ahead of ~739 lakh under commercial banks and 365 lakh under RRBs."},{"id":191,"topic":"TSDSI/TDIP","type":"numbered-combo","difficulty":"hard","context":"Regarding the DoT-TSDSI MoU signed during the 9th TSDSI Technical Deep Dive (TTDD) 2026, consider the following statements:","statements":["1. TSDSI is India's Telecom Standards Development Organization, an Organizational Partner of 3GPP and oneM2M, and a Sector Member of ITU.","2. The MoU was signed under the Technology Development and Investment Promotion (TDIP) Scheme.","3. TDIP has a total outlay of ₹203 crore for the period 2026-31.","4. TDIP is administered by the Ministry of Electronics and Information Technology (MeitY)."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","1 and 4"],"correct":0,"explanation":"TDIP is an initiative of the Department of Telecommunications (DoT), not MeitY. Statements 1, 2 and 3 are correct."},{"id":192,"topic":"India-France Roadmap","type":"not-among","difficulty":"hard","statements":["1. Franco-Indian Campus for Aeronautics Training (Kanpur)","2. India-France InnoXchange Bridge","3. Joint steering committee for IFIN (India-France Innovation Network)","4. India-France Green Hydrogen Corridor Initiative","5. France's target to host 30,000 Indian students by 2030"],"question":"Which one of the following is NOT among the new initiatives announced under the India-France Innovation Roadmap 2030?","options":["Franco-Indian Campus for Aeronautics Training (Kanpur)","India-France Green Hydrogen Corridor Initiative","India-France InnoXchange Bridge","Joint steering committee for IFIN (India-France Innovation Network)","France's target to host 30,000 Indian students by 2030"],"correct":1,"explanation":"'India-France Green Hydrogen Corridor Initiative' is fabricated. The genuine new initiatives are the Franco-Indian Campus for Aeronautics Training, the InnoXchange Bridge, and the IFIN joint steering committee, alongside France's target of hosting 30,000 Indian students by 2030."},{"id":193,"topic":"Aqua Park Bhojpur","type":"figure-recall","difficulty":"moderate","question":"On which date, and at which location, was the Integrated Aqua Park foundation stone laid along with the inauguration of the NFDB Regional Centre?","options":["1 July 2026, at Ranchi, Jharkhand","10 May 2026, at Bhubaneswar, Odisha","15 June 2026, at Vanasaur Fish Seed Farm, Bhojpur, with NFDB Regional Centre inaugurated at Patna, Bihar","15 June 2026, at Guwahati, Assam","20 July 2026, at Lucknow, Uttar Pradesh"],"correct":2,"explanation":"The Integrated Aqua Park foundation stone was laid at Vanasaur Fish Seed Farm, Bhojpur, and the NFDB Regional Centre was inaugurated at Patna, Bihar, on 15 June 2026."},{"id":194,"topic":"RajmargYatra","type":"numbered-combo","difficulty":"hard","context":"Regarding NHAI's new digital services on the RajmargYatra Mobile App, consider the following statements:","statements":["1. The Digital Local Pass was first launched at the Mundka-Bakkarwala Toll Plaza on UER-II, Delhi.","2. It is available to residents living within a 20 km radius of an eligible toll plaza, providing unlimited travel for one month.","3. MargMitra Help Centre is an AI-enabled digital assistance platform supporting queries in 22 Indian languages.","4. Digital Local Pass eligibility verification requires manual document submission at NHAI offices."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","4 only","2 and 4"],"correct":3,"explanation":"Eligibility is verified through GIS-based verification, eliminating (not requiring) manual documentation. Statements 1, 2 and 3 are correct."},{"id":195,"topic":"KSVY","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Kala Sanskriti Vikas Yojana (KSVY) is correct?","options":["It is a Centrally Sponsored Scheme requiring 60:40 state co-funding","It is administered by the Ministry of Tribal Affairs exclusively for tribal artists","KSVY funds are disbursed only to registered NGOs, not individual artists","It falls under the Ministry of Textiles' handicrafts promotion umbrella","It is a Central Sector Scheme of the Ministry of Culture providing financial assistance to cultural organizations and individual (including tribal and rural) artists, funded through the Consolidated Fund of India"],"correct":4,"explanation":"KSVY is a Central Sector Scheme (not Centrally Sponsored) of the Ministry of Culture, funded from the Consolidated Fund of India, supporting both organizations and individual artists including tribal and rural performing artists."},{"id":196,"topic":"NAPS","type":"numbered-combo","difficulty":"hard","context":"Regarding the National Apprenticeship Promotion Scheme (NAPS), consider the following statements:","statements":["1. NAPS was launched in August 2016.","2. The current version, NAPS-2, has been implemented since 2022-23.","3. Apprentices are engaged under the Apprentices Act, 1961.","4. Stipend support is 50% of the stipend, subject to a maximum of ₹3,000 per month per apprentice."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","1 and 4"],"correct":0,"explanation":"Stipend support is 25% of the stipend, subject to a maximum of ₹1,500 per month per apprentice (not 50% up to ₹3,000). Statements 1, 2 and 3 are correct."},{"id":197,"topic":"BHAVYA Rasayan","type":"numbered-combo","difficulty":"hard","context":"Regarding the Bharat Audyogik Vikas Yojana Rasayan (BHAVYA Rasayan) Scheme, consider the following statements:","statements":["1. It was announced in the Union Budget 2026-27 to establish 3 dedicated Chemical Parks under the challenge route.","2. The total financial outlay is ₹3,030 crore, of which ₹3,000 crore is for Common Infrastructure Facilities and ₹30 crore for administrative expenditure.","3. The scheme period is FY 2026-27 to FY 2030-31 (5 years).","4. The Central Grant is up to ₹500 crore per Chemical Park, with a minimum State contribution of ₹1,000 crore."],"question":"Which of the above statements is/are incorrect?","options":["1 only","4 only","2 only","3 only","2 and 4"],"correct":1,"explanation":"It is reversed — the Central Grant is up to ₹1,000 crore per Chemical Park, with a minimum State Government contribution of ₹500 crore (not the other way round). Statements 1, 2 and 3 are correct."},{"id":198,"topic":"BHAVYA Rasayan","type":"figure-recall","difficulty":"moderate","question":"Under BHAVYA Rasayan, what is the minimum contiguous land area required for each Chemical Park?","options":["5 sq. km (minimum 1,000 acres)","10 sq. km (minimum 2,500 acres)","8 sq. km (minimum 2,000 acres), encumbrance-free","4 sq. km (minimum 1,000 acres)","12 sq. km (minimum 3,000 acres)"],"correct":2,"explanation":"Each Chemical Park requires a minimum contiguous, encumbrance-free area of 8 sq. km (minimum 2,000 acres)."},{"id":199,"topic":"US Section 301","type":"numbered-combo","difficulty":"hard","context":"Regarding the final US Section 301 measures on forced labour affecting India, consider the following statements:","statements":["1. The final measures were announced by USTR on 23 July 2026 under Section 301 of the U.S. Trade Act, 1974.","2. The final additional tariff on India is 10%, down from an earlier proposed 12.5% (announced 2 June 2026).","3. Generic pharmaceuticals and smartphones are exempted from the additional 10% duty.","4. Products already covered under Section 232 measures (steel, aluminium, auto parts) are also subject to the additional 10% duty."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","4 only","1 and 4"],"correct":3,"explanation":"Products already covered under Section 232 measures (steel, aluminium, auto parts) are explicitly EXEMPT from (not subject to) the additional 10% Section 301 duty. Statements 1, 2 and 3 are correct."},{"id":200,"topic":"US Section 301","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the scope of the US Section 301 investigation is correct?","options":["It targeted India exclusively, with no other economies investigated","The investigation resulted in a total import ban on Indian textiles","India received the highest tariff tier among all 60 economies investigated","The investigation was conducted under Section 232 of the Trade Act, not Section 301","It investigated forced labour-related import enforcement across 60 economies, including India, placing India in a relatively favourable lower tariff tier"],"correct":4,"explanation":"The Section 301 investigation covered 60 economies including India; India was placed in a LOWER (more favourable) tariff tier of 10%, giving it a relative advantage — not the highest tier, and it was conducted under Section 301, not 232."},{"id":201,"topic":"Samriddh Gram","type":"numbered-combo","difficulty":"hard","context":"Regarding DoT's 'Samriddh Gram' project, consider the following statements:","statements":["1. It won the WSIS Prize 2026 under Action Line C6 - Enabling Environment.","2. It is built on the BharatNet backbone as an integrated rural digital transformation initiative.","3. The award was presented during the WSIS Forum 2026 held in Geneva.","4. Samriddh Gram was one of five Champion Projects selected from India among the WSIS Prize categories."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","2 and 4"],"correct":0,"explanation":"Only TWO (not five) projects from India were selected as Champion Projects among the WSIS Prize categories. Statements 1, 2 and 3 are correct."},{"id":202,"topic":"Samriddh Gram","type":"acronym","difficulty":"easy","question":"The WSIS Prizes are instituted under a process led by which international body?","options":["World Bank","International Telecommunication Union (ITU)","United Nations Development Programme (UNDP)","World Trade Organization (WTO)","UNESCO"],"correct":1,"explanation":"The World Summit on the Information Society (WSIS) process, under which the WSIS Prizes are instituted, is led by the International Telecommunication Union (ITU)."},{"id":203,"topic":"FMD Workshop","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the National Workshop on Compartmentalization and Zoning for FMD is correct?","options":["It was a one-day workshop hosted at New Delhi","It targeted FMD-free status by 2025, a year already passed","It was hosted by DAHD on 8 July 2026 at Bhubaneswar, Odisha, as a two-day workshop supporting India's goal of FMD-free status by 2030","It was hosted by the Ministry of Health & Family Welfare","It focused only on avian influenza, not FMD"],"correct":2,"explanation":"The two-day workshop was hosted by DAHD on 8 July 2026 at Bhubaneswar, Odisha, supporting India's objective of achieving FMD-free status by 2030."},{"id":204,"topic":"FMD Workshop","type":"not-among","difficulty":"hard","statements":["1. Rate My Laboratory App — under the Pandemic Fund","2. Dairy Vikas Portal — for real-time monitoring of milk collection infrastructure","3. Vidyapeeth Portal","4. Nabhmitra App — for fishermen","5. (Nabhmitra was launched separately, in the BoPS context, not at this FMD workshop)"],"question":"Which one of the following was NOT launched at the National Workshop on FMD Compartmentalization and Zoning?","options":["Rate My Laboratory App — under the Pandemic Fund","Dairy Vikas Portal — for real-time monitoring of milk collection infrastructure","Vidyapeeth Portal","Nabhmitra App — for fishermen","(All three genuine launches are listed among 1-3)"],"correct":3,"explanation":"The Nabhmitra app (developed by ISRO for fishermen) was mentioned in a separate context (Bureau of Port Security review), not launched at the FMD workshop. The genuine launches at the FMD workshop were the Rate My Laboratory App, Dairy Vikas Portal, and Vidyapeeth Portal."},{"id":205,"topic":"Financial Inclusion","type":"numbered-combo","difficulty":"hard","context":"Regarding PMJDY as on 01.07.2026, consider the following statements:","statements":["1. Total accounts opened stood at 58.63 crore.","2. Total deposits stood at ₹3.08 lakh crore.","3. Women account holders constituted 55.74% (32.68 crore) of total accounts.","4. Rural & Semi-Urban accounts constituted 60% of total accounts."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","3 and 4","4 only"],"correct":4,"explanation":"Rural & Semi-Urban accounts constituted 77.80% (45.62 crore), not 60%. Statements 1, 2 and 3 are correct."},{"id":206,"topic":"Financial Inclusion","type":"numbered-combo","difficulty":"moderate","context":"Regarding PMJJBY and PMSBY as on 01.07.2026, consider the following statements:","statements":["1. PMJJBY had cumulative enrolments of 27.84 crore, offering ₹2 lakh insurance cover for death due to any reason.","2. PMSBY had cumulative enrolments of 58.78 crore.","3. PMSBY provides ₹2 lakh for death/permanent total disability and ₹1 lakh for permanent partial disability.","4. PMSBY provides a two-year accidental insurance cover."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","1 and 4"],"correct":0,"explanation":"PMSBY provides a one-year (not two-year) accidental insurance cover, renewable annually. Statements 1, 2 and 3 are correct."},{"id":207,"topic":"Financial Inclusion","type":"figure-recall","difficulty":"moderate","question":"As on 26.06.2026, how many loans had been sanctioned under Pradhan Mantri Mudra Yojana (PMMY), and what was the total value?","options":["45 crore loans, worth ₹30 lakh crore","59.14 crore loans, worth ₹41.71 lakh crore","59.14 crore loans, worth ₹25 lakh crore","40 crore loans, worth ₹41.71 lakh crore","65 crore loans, worth ₹50 lakh crore"],"correct":1,"explanation":"As on 26.06.2026, 59.14 crore loans worth ₹41.71 lakh crore had been sanctioned under PMMY, providing collateral-free loans up to ₹20 lakh."},{"id":208,"topic":"Financial Inclusion","type":"not-among","difficulty":"moderate","statements":["1. Atal Pension Yojana (APY)","2. Stand-Up India Scheme (SUPI)","3. Pradhan Mantri Mudra Yojana (PMMY)","4. Pradhan Mantri Suraksha Bima Yojana (PMSBY)","5. Pradhan Mantri Awas Bima Yojana (PMABY)"],"question":"Which one of the following is NOT among the major Financial Inclusion schemes listed in the chapter?","options":["Atal Pension Yojana (APY)","Stand-Up India Scheme (SUPI)","Pradhan Mantri Awas Bima Yojana (PMABY)","Pradhan Mantri Mudra Yojana (PMMY)","Pradhan Mantri Suraksha Bima Yojana (PMSBY)"],"correct":2,"explanation":"'Pradhan Mantri Awas Bima Yojana (PMABY)' is fabricated. The genuine major Financial Inclusion schemes listed are PMJDY, PMJJBY, PMSBY, APY, PMMY, and Stand-Up India."},{"id":209,"topic":"Stand-Up India","type":"figure-recall","difficulty":"moderate","question":"As on 31.03.2025, how many cumulative loans had been sanctioned under the Stand-Up India Scheme (SUPI), and what was the total value?","options":["5 lakh loans, worth ₹1 lakh crore","1 lakh loans, worth ₹30,000 crore","3.5 lakh loans, worth ₹75,000 crore","2.75 lakh loans, worth ₹62,790 crore","2 lakh loans, worth ₹50,000 crore"],"correct":3,"explanation":"As on 31.03.2025, 2.75 lakh loans worth ₹62,790 crore had been sanctioned under Stand-Up India, supporting SC/ST and women entrepreneurs in greenfield enterprises."},{"id":210,"topic":"National Cooperation Policy","type":"numbered-combo","difficulty":"hard","context":"Regarding the National Cooperation Policy (NCP), 2025, consider the following statements:","statements":["1. It provides a roadmap for the cooperative sector's development over the next 10 years.","2. It contains 6 Strategic Pillars, 16 Objectives, and 83 Recommendations.","3. The National Steering Committee on Cooperation Policy is chaired by the Union Minister of Cooperation.","4. The Policy Implementation and Monitoring Committee (PIMC) is chaired by the Prime Minister."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","1 and 4","4 only"],"correct":4,"explanation":"PIMC is chaired by the Union Cooperation Secretary (not the Prime Minister). Statements 1, 2 and 3 are correct."},{"id":211,"topic":"National Cooperation Policy","type":"figure-recall","difficulty":"moderate","question":"Which state has the highest number of cooperative societies as per the chapter's state-wise data?","options":["Maharashtra, with over 2.27 lakh cooperative societies","Gujarat, with 88,119 cooperative societies","Telangana, with 60,680 cooperative societies","Uttar Pradesh, with 1.5 lakh cooperative societies","Tamil Nadu, with 1 lakh cooperative societies"],"correct":0,"explanation":"Maharashtra has the highest number of cooperative societies at over 2.27 lakh, followed by Gujarat (88,119) and Telangana (60,680)."},{"id":212,"topic":"National Cooperation Policy","type":"acronym","difficulty":"easy","question":"What does 'PIMC', a monitoring body under the National Cooperation Policy 2025, stand for?","options":["Provincial Institutional Management Council","Policy Implementation and Monitoring Committee","Policy Investment and Modernisation Committee","Programme Implementation and Management Cell","Policy Integration and Monitoring Cooperative"],"correct":1,"explanation":"PIMC stands for Policy Implementation and Monitoring Committee, chaired by the Union Cooperation Secretary, responsible for Centre-State coordination and resolving implementation bottlenecks."},{"id":213,"topic":"PMKVY","type":"numbered-combo","difficulty":"hard","context":"Regarding the evolution of PMKVY, consider the following statements:","statements":["1. PMKVY was launched in 2015 by the Ministry of Skill Development and Entrepreneurship (MSDE).","2. PMKVY 2.0 expanded sectoral and geographical coverage and introduced State-led implementation.","3. PMKVY 3.0 strengthened decentralized planning through State Skill Development Missions (SSDMs) and District Skill Committees (DSCs).","4. PMKVY 1.0 introduced training targets based on skill-gap assessments and institutional capacity."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","2 and 4"],"correct":2,"explanation":"Training targets based on skill-gap assessments and institutional capacity were introduced under PMKVY 4.0 (not 1.0), which established the STT/RPL national framework. Statements 1, 2 and 3 are correct."},{"id":214,"topic":"PMKVY","type":"not-among","difficulty":"moderate","statements":["1. Artificial Intelligence (AI)","2. Cyber Security","3. Semiconductors","4. 5G and Internet of Things (IoT)","5. Nuclear Energy Technology"],"question":"Which one of the following is NOT among the listed focus areas under PMKVY 4.0?","options":["Artificial Intelligence (AI)","Cyber Security","Semiconductors","Nuclear Energy Technology","5G and Internet of Things (IoT)"],"correct":3,"explanation":"'Nuclear Energy Technology' is not listed among PMKVY 4.0's focus areas. The genuine focus areas include AI, Cyber Security, Semiconductors, 5G, IoT, Drone Technology, Green Energy, and Additive Manufacturing."},{"id":215,"topic":"DAANVEER","type":"numbered-combo","difficulty":"hard","context":"Regarding the DAANVEER Initiative launched on 29 July 2026, consider the following statements:","statements":["1. It was launched by the Secretary, Ministry of Panchayati Raj, developed in collaboration with NIC and DigiHaat.","2. Its tagline is 'Give Back to Your Village'.","3. It is available through the Meri Panchayat mobile application, integrating with the DigiHaat marketplace.","4. Only Indian citizens residing within India are eligible to contribute; NRIs/diaspora are excluded."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","2 and 4","4 only"],"correct":4,"explanation":"DAANVEER explicitly enables citizens, INCLUDING the Indian diaspora, to contribute to their native villages — NRIs are not excluded. Statements 1, 2 and 3 are correct."},{"id":216,"topic":"DAANVEER","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the DAANVEER Initiative is correct?","options":["It enables citizens and organisations to voluntarily contribute computers to eligible Gram Panchayats to strengthen digital infrastructure","It provides direct cash transfers to Gram Panchayats from corporate CSR funds","It is a scholarship scheme for panchayat employees","It replaces the Svamitva Scheme's digital land records initiative","It is administered by the Ministry of Electronics and IT rather than Panchayati Raj"],"correct":0,"explanation":"DAANVEER enables voluntary citizen/organisation contributions of computers to Gram Panchayats to strengthen their digital infrastructure, launched under the Ministry of Panchayati Raj."},{"id":217,"topic":"MNRE Solar (PM-JANMAN/DAJGUA)","type":"numbered-combo","difficulty":"hard","context":"Regarding MNRE's New Solar Power Scheme under PM-JANMAN and DAJGUA, consider the following statements:","statements":["1. It provides 100% Central Financial Assistance (CFA) for solar electrification of PVTG and tribal habitations.","2. It targets covering 1 lakh un-electrified households and 1,500 Multi-Purpose Centres (MPCs).","3. Under PM-JANMAN, ₹50,000 per household is provided for a 0.3 kW off-grid solar system.","4. Under DAJGUA, public institutions receive ₹1 lakh/kW, capped at 50 kW per institution."],"question":"Which of the above statements is/are incorrect?","options":["1 only","4 only","2 only","3 only","1 and 4"],"correct":1,"explanation":"Under DAJGUA, the cap is 20 kW per institution (not 50 kW), at ₹1 lakh/kW. Statements 1, 2 and 3 are correct."},{"id":218,"topic":"MNRE Solar (PM-JANMAN/DAJGUA)","type":"acronym","difficulty":"moderate","question":"What does 'DAJGUA' stand for?","options":["Deendayal Antyodaya Janjati Gram Unnati Abhiyan","Dharti Adivasi Janjati Gramin Utthan Abhiyan","Dharti Aaba Janjatiya Gram Utkarsh Abhiyan","Development of Aadivasi Janjati Gram Utkarsh Abhiyan","Dharti Aaba Jan Gram Utkarsh Adhikar"],"correct":2,"explanation":"DAJGUA stands for Dharti Aaba Janjatiya Gram Utkarsh Abhiyan, one of the two schemes (alongside PM-JANMAN) under which MNRE's solar electrification for tribal habitations is implemented."},{"id":219,"topic":"Urban Challenge Fund","type":"numbered-combo","difficulty":"hard","context":"Regarding the Cabinet-approved Urban Challenge Fund (UCF), consider the following statements:","statements":["1. Central Assistance is ₹1 lakh crore, for the implementation period FY 2025-26 to FY 2030-31, extendable by 3 years till FY 2033-34.","2. Central Assistance can fund up to 25% of project cost, with a minimum of 50% market financing required.","3. Central Assistance is to be released in three instalments in the ratio 30%:50%:20%.","4. Total expected urban investment over the next 5 years is ₹2 lakh crore."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","4 only","2 and 4"],"correct":3,"explanation":"The total expected urban investment is ₹4 lakh crore (not ₹2 lakh crore) over the next five years. Statements 1, 2 and 3 are correct."},{"id":220,"topic":"Urban Challenge Fund","type":"not-among","difficulty":"hard","statements":["1. Projects — ₹90,000 crore","2. Project Preparation & Capacity Building — ₹5,000 crore","3. Credit Repayment Guarantee Sub-Scheme (CRGSS) — ₹5,000 crore","4. Urban Land Bank Digitization — ₹10,000 crore","5. (The UCF has three components totalling ₹1 lakh crore)"],"question":"Which one of the following is NOT one of the three components of the Urban Challenge Fund (UCF)?","options":["Projects — ₹90,000 crore","Project Preparation & Capacity Building — ₹5,000 crore","Credit Repayment Guarantee Sub-Scheme (CRGSS) — ₹5,000 crore","(All three genuine components are listed among 1-3)","Urban Land Bank Digitization — ₹10,000 crore"],"correct":4,"explanation":"'Urban Land Bank Digitization' is fabricated. The three genuine UCF components are Projects (₹90,000 crore), Project Preparation & Capacity Building (₹5,000 crore), and CRGSS (₹5,000 crore)."},{"id":221,"topic":"Digital Learning","type":"numbered-combo","difficulty":"hard","context":"Regarding the PM Research Chair (PMRC) Scheme, consider the following statements:","statements":["1. It aims to attract Indian-origin researchers/professionals working abroad to Indian institutions.","2. It has three categories: Young Research Fellow (up to 5 years post-PhD experience), Senior Fellow (5-10 years), and Research Chair (more than 10 years).","3. It covers 13 thematic areas of engineering, science and technology.","4. It is implemented exclusively at IITs, excluding other institution types."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","1 and 4"],"correct":0,"explanation":"The chapter does not restrict PMRC exclusively to IITs; this exclusivity claim is incorrect. Statements 1, 2 and 3 are correct."},{"id":222,"topic":"Digital Learning","type":"numbered-combo","difficulty":"hard","context":"Regarding the MERITE Scheme, consider the following statements:","statements":["1. MERITE stands for Multidisciplinary Education and Research Improvement in Technical Education.","2. Its objective is to improve Quality, Equity and Governance.","3. It covers 275 Technical Institutions.","4. Its total outlay is ₹2,100 crore."],"question":"Which of the above statements is/are incorrect?","options":["1 only","4 only","2 only","3 only","3 and 4"],"correct":1,"explanation":"MERITE's total outlay is ₹4,200 crore (not ₹2,100 crore). Statements 1, 2 and 3 are correct."},{"id":223,"topic":"Digital Learning","type":"not-among","difficulty":"hard","statements":["1. AVGC Content Creator Labs — announced in Union Budget 2026-27, covering 15,000 secondary schools and 500 colleges","2. Partner Institution: Indian Institute of Creative Technologies (IICT), Mumbai","3. Objective: develop industry-ready skills in Animation, VFX, Gaming and Comics","4. Partner Institution: National Institute of Design (NID), Ahmedabad","5. (AVGC has one designated partner institution mentioned in the chapter)"],"question":"Which one of the following is NOT correctly stated as the AVGC Content Creator Labs' partner institution?","options":["AVGC Content Creator Labs — announced in Union Budget 2026-27, covering 15,000 secondary schools and 500 colleges","Indian Institute of Creative Technologies (IICT), Mumbai","National Institute of Design (NID), Ahmedabad","Objective: develop industry-ready skills in Animation, VFX, Gaming and Comics","(IICT Mumbai is the genuine partner institution)"],"correct":2,"explanation":"The genuine partner institution for AVGC Content Creator Labs is the Indian Institute of Creative Technologies (IICT), Mumbai — not NID Ahmedabad, which is fabricated in this context."},{"id":224,"topic":"PM eVidya","type":"numbered-combo","difficulty":"moderate","context":"Regarding PM eVidya, launched on 17 May 2020 under Atma Nirbhar Bharat Abhiyaan, consider the following statements:","statements":["1. It provides multi-mode digital education for Classes 1-12.","2. Its major components include 200 DTH TV Channels and 400 Radio Channels.","3. It includes the DIKSHA platform for digital learning content.","4. Content under PM eVidya is available only in English and Hindi."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","4 only","2 and 4"],"correct":3,"explanation":"PM eVidya's content is available in MULTIPLE Indian languages (not just English and Hindi). Statements 1, 2 and 3 are correct."},{"id":225,"topic":"PM-USHA","type":"numbered-combo","difficulty":"hard","context":"Regarding PM-USHA (Pradhan Mantri Uchchatar Shiksha Abhiyan), consider the following statements:","statements":["1. It is the third phase of the Rashtriya Uchchatar Shiksha Abhiyan (RUSA), launched in June 2023.","2. Its outlay is ₹12,926.10 crore for the period 2023-24 to 2025-26.","3. PM-USHA projects have been extended till 31 March 2028.","4. Ongoing RUSA projects have been extended till 31 March 2029."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","1 and 4","4 only"],"correct":4,"explanation":"Ongoing RUSA projects have been extended till 30 September 2026 (not 31 March 2029). Statements 1, 2 and 3 are correct."},{"id":226,"topic":"NISHTHA/BharatNet Education","type":"acronym","difficulty":"easy","question":"What does 'NISHTHA', a teacher-training initiative mentioned in the chapter, stand for?","options":["National Initiative for School Heads' and Teachers' Holistic Advancement","National Institute for Skilling Teachers and Heads of Academia","National Initiative for Strengthening Teacher Holistic Advancement","New Initiative for School Health, Teaching and Holistic Achievement","National Institution for School and Teacher Holistic Advancement"],"correct":0,"explanation":"NISHTHA stands for National Initiative for School Heads' and Teachers' Holistic Advancement, aimed at improving the professional competencies of teachers and school heads."},{"id":227,"topic":"ODOP","type":"numbered-combo","difficulty":"moderate","context":"Regarding DPIIT's One District One Product (ODOP) Initiative, consider the following statements:","statements":["1. DPIIT is the nodal department, with product selection done by respective State/UT Governments.","2. 1,244 unique products have been identified across 773 districts.","3. PM Ekta Malls (Unity Malls) are funded under the Scheme for Special Assistance to States for Capital Investment (SASCI).","4. Financial assistance for PM Ekta Malls is up to ₹500 crore per State/UT as a grant."],"question":"Which of the above statements is/are incorrect?","options":["1 only","4 only","2 only","3 only","1 and 4"],"correct":1,"explanation":"PM Ekta Malls receive up to ₹200 crore per State/UT (not ₹500 crore), provided as a 50-year INTEREST-FREE LOAN (not a grant). Statements 1, 2 and 3 are correct."},{"id":228,"topic":"ODOP","type":"figure-recall","difficulty":"moderate","question":"PM Ekta Malls (Unity Malls) are eligible for Union Territories with legislature. Which UTs are these?","options":["Delhi, Chandigarh and Ladakh","Puducherry, Andaman & Nicobar Islands and Lakshadweep","Delhi, Jammu & Kashmir and Puducherry","Jammu & Kashmir, Ladakh and Chandigarh","Delhi, Puducherry and Daman & Diu"],"correct":2,"explanation":"The eligible UTs with legislature for PM Ekta Malls funding are Delhi, Jammu & Kashmir, and Puducherry."},{"id":229,"topic":"PMFME","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about PMFME (Formalisation of Micro Food Processing Enterprises) is correct?","options":["It offers a 50% credit-linked subsidy up to ₹20 lakh","It is administered by DPIIT, not the Ministry of Food Processing Industries","Branding and marketing assistance is provided as a 25% grant","It adopts the ODOP approach in the food processing sector, offering a 35% credit-linked capital subsidy up to a maximum of ₹10 lakh","PMFME excludes common branding support"],"correct":3,"explanation":"PMFME (under the Ministry of Food Processing Industries) offers a 35% credit-linked capital subsidy up to ₹10 lakh, plus a 50% grant for common branding and marketing under the ODOP approach."},{"id":230,"topic":"PM-USP CGFSEL","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about PM-USP CGFSEL is correct?","options":["Launched in 2020, it guarantees 100% of loans up to ₹10 lakh","It requires third-party guarantee in addition to the credit guarantee cover","CGFSEL stands for 'Credit Guarantee Fund Scheme for Skill Enhancement Loans'","The scheme guarantee cover is capped at 50% of the loan amount","Launched in 2015, it provides a Central Government credit guarantee of 75% for collateral-free education loans up to ₹7.5 lakh"],"correct":4,"explanation":"PM-USP CGFSEL (PM Uchchatar Shiksha Protsahan Credit Guarantee Fund Scheme for Education Loans), launched in 2015, provides 75% credit guarantee cover for collateral-free, third-party-guarantee-free loans up to ₹7.5 lakh."},{"id":231,"topic":"PM Vidyalaxmi Portal","type":"figure-recall","difficulty":"moderate","question":"As per the chapter, how many Public Sector Banks, Private Banks, Regional Rural Banks and Cooperative Banks have been onboarded on the PM Vidyalaxmi Portal?","options":["12 Public Sector Banks, 20 Private Banks, 25 Regional Rural Banks, and 7 Cooperative Banks","15 Public Sector Banks, 25 Private Banks, 30 RRBs, and 10 Cooperative Banks","10 Public Sector Banks, 15 Private Banks, 20 RRBs, and 5 Cooperative Banks","12 Public Sector Banks, 30 Private Banks, 15 RRBs, and 12 Cooperative Banks","20 Public Sector Banks, 20 Private Banks, 20 RRBs, and 20 Cooperative Banks"],"correct":0,"explanation":"On the PM Vidyalaxmi Portal (operational since 25 February 2025), 12 PSBs, 20 Private Banks, 25 RRBs, and 7 Cooperative Banks have been onboarded."},{"id":232,"topic":"RKVY Maharashtra","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about Maharashtra's RKVY milestone is correct?","options":["Maharashtra became the first State to qualify for the RKVY Third Instalment","Maharashtra became the first State to qualify for the Second Instalment (Second Mother Sanction) under RKVY, after utilising more than 75% of the first instalment","Uttar Pradesh, not Maharashtra, was the first State to qualify for the Second Instalment","The threshold for qualifying for the Second Instalment is 50% utilisation of the first instalment","Maharashtra qualified without any utilisation threshold requirement"],"correct":1,"explanation":"Maharashtra became the first State to qualify for the Second Instalment (Second Mother Sanction) under RKVY, after utilising more than 75% of the first instalment."},{"id":233,"topic":"IIP","type":"numbered-combo","difficulty":"hard","context":"Regarding the Index of Industrial Production (IIP) as per the new series (Base Year 2022-23), consider the following statements:","statements":["1. The Quick Estimate of IIP is released on the 28th of every month (or next working day if a holiday).","2. IIP growth for June 2026 was 7.3%, up from 5.1% (Quick Estimate) in May 2026.","3. The revised basket consists of 1,042 products mapped to 463 item groups, compared to 839 items/407 groups in the 2011-12 series.","4. Under the new series, Manufacturing has the highest weightage at 76.062%, followed by Electricity & Gas Supply at 11.053%."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","3 and 4"],"correct":2,"explanation":"After Manufacturing (76.062%), the second-highest weightage is Mining & Quarrying at 11.053% (not Electricity & Gas Supply, which is 10.865%). Statements 1, 2 and 3 are correct."},{"id":234,"topic":"IIP","type":"figure-recall","difficulty":"easy","question":"What is the base year of the current IIP series, as referenced alongside the new ICI and WPI series in the chapter?","options":["2011-12","2004-05","2018-19","2022-23","2020-21"],"correct":3,"explanation":"The current IIP series uses 2022-23 as its base year, replacing the earlier 2011-12 series."},{"id":235,"topic":"Slovakia PM Honour","type":"numbered-combo","difficulty":"hard","context":"Regarding PM Modi's visit to Slovakia, consider the following statements:","statements":["1. PM Modi was conferred the 'Order of the White Double Cross, 1st Class', Slovakia's highest civilian honour.","2. The honour was conferred by Slovakia's President Peter Pellegrini.","3. This was the first visit by an Indian Prime Minister to Slovakia since its independence in 1993.","4. India will establish its first Chair in Artificial Intelligence at the Technical University of Bratislava."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","1 and 4","4 only"],"correct":4,"explanation":"The AI Chair will be established at the Technical University of Kosice (not Bratislava). Statements 1, 2 and 3 are correct."},{"id":236,"topic":"Digital Threat Report BFSI","type":"not-among","difficulty":"hard","statements":["1. Ministry of Electronics and Information Technology (MeitY)","2. Indian Computer Emergency Response Team (CERT-In)","3. Computer Security Incident Response Team in Finance (CSIRT-Fin)","4. SISA","5. Reserve Bank of India (RBI)"],"question":"Which one of the following is NOT among the entities that jointly released the 2nd edition of the Digital Threat Report 2025-26 for India's BFSI Sector?","options":["Reserve Bank of India (RBI)","Ministry of Electronics and Information Technology (MeitY)","Indian Computer Emergency Response Team (CERT-In)","Computer Security Incident Response Team in Finance (CSIRT-Fin)","SISA"],"correct":0,"explanation":"RBI is not listed among the releasing entities. The report was jointly released by MeitY, CERT-In, CSIRT-Fin, and SISA."},{"id":237,"topic":"Honorary Doctorate","type":"figure-recall","difficulty":"easy","question":"Which university conferred an Honorary Doctorate on President Droupadi Murmu, and in which country?","options":["University of Warsaw, Poland","Bucharest University of Economic Studies, Romania","Charles University, Czech Republic","Sofia University, Bulgaria","University of Vienna, Austria"],"correct":1,"explanation":"The Bucharest University of Economic Studies conferred an Honorary Doctorate on President Droupadi Murmu at a ceremony held in Bucharest, Romania."},{"id":238,"topic":"List Intersection: PM-AJAY vs AVYAY","type":"list-intersection","difficulty":"hard","context":"Consider the following components/initiatives drawn from two different welfare schemes covered in the chapter:","statements":["1. Adarsh Gram","2. Elderline (14567 helpline)","3. Grants-in-Aid for livelihood generation","4. Rashtriya Vayoshri Yojana (RVY)","5. Hostels for SC students","6. SAGE (innovative products for senior citizens)"],"question":"Which of the above are components of PM-AJAY (and not of AVYAY)?","options":["2, 4 and 6","1, 2 and 3","1, 3 and 5","3, 5 and 6","1, 4 and 5"],"correct":2,"explanation":"Adarsh Gram, Grants-in-Aid, and Hostels are the three components of PM-AJAY (Ministry of Social Justice & Empowerment for SC welfare). Elderline, RVY and SAGE are components of AVYAY (senior citizen welfare)."},{"id":239,"topic":"List Intersection: MNRE Solar Sub-Schemes","type":"list-intersection","difficulty":"hard","context":"Consider the following components of MNRE's New Solar Power Scheme for PVTG/Tribal habitations:","statements":["1. ₹50,000/HH for 0.3 kW off-grid solar system","2. ₹1 lakh/MPC for solar lighting & street lighting","3. ₹1 lakh/kW (max 20 kW/institution) for public institutions"],"question":"Which of the above component(s) fall under DAJGUA (Dharti Aaba Janjatiya Gram Utkarsh Abhiyan), as opposed to PM-JANMAN?","options":["1 only","2 only","1 and 2","3 only","1, 2 and 3"],"correct":3,"explanation":"The public institution solar component (₹1 lakh/kW, max 20 kW/institution) falls under DAJGUA, while the household off-grid system and MPC lighting components fall under PM-JANMAN."},{"id":240,"topic":"List Intersection: PMAY-U 2.0 vs Urban Challenge Fund","type":"list-intersection","difficulty":"hard","context":"Consider the following items drawn from two distinct urban development initiatives:","statements":["1. Beneficiary Led Construction (BLC)","2. Projects (₹90,000 crore)","3. Affordable Rental Housing (ARH)","4. Credit Repayment Guarantee Sub-Scheme (CRGSS)","5. Interest Subsidy Scheme (ISS)","6. Project Preparation & Capacity Building"],"question":"Which of the above are verticals of PMAY-U 2.0 (and not components of the Urban Challenge Fund)?","options":["2, 4 and 6","1, 2 and 4","3, 5 and 6","1, 4 and 6","1, 3 and 5"],"correct":4,"explanation":"BLC, ARH and ISS are three of PMAY-U 2.0's four verticals (the fourth being AHP). Projects, CRGSS, and Project Preparation & Capacity Building are the three components of the Urban Challenge Fund."},{"id":241,"topic":"List Intersection: Cybercrime Mechanism vs Coal Mine Closure","type":"list-intersection","difficulty":"hard","context":"Consider the following mechanisms/frameworks mentioned in the chapter:","statements":["1. Indian Cyber Crime Coordination Centre (I4C)","2. RECLAIM Framework","3. National Cyber Crime Reporting Portal (NCRP)","4. SUVIKALP (Mine Repurposing Tool)","5. Citizen Financial Cyber Fraud Reporting and Management System (CFCFRMS)","6. L.I.V.E.S. Framework"],"question":"Which of the above are part of India's National Cybercrime Response Mechanism (and not part of AAROH's Mine Closure Framework)?","options":["1, 3 and 5","2, 4 and 6","1, 2 and 4","3, 5 and 6","1, 4 and 5"],"correct":0,"explanation":"I4C, NCRP and CFCFRMS make up the National Cybercrime Response Mechanism. RECLAIM, SUVIKALP and L.I.V.E.S. are frameworks under AAROH's Mine Closure Framework by the Ministry of Coal."},{"id":242,"topic":"List Intersection: TSDSI vs Global Tiger Forum","type":"list-intersection","difficulty":"hard","context":"Consider the following facts about two different bodies mentioned in the chapter:","statements":["1. Serves as an Organizational Partner of 3GPP and oneM2M","2. Has 13 tiger-range country members","3. Is a Sector Member of ITU","4. Headquartered in New Delhi, dedicated exclusively to tiger conservation","5. India's Telecom Standards Development Organization"],"question":"Which of the above facts describe TSDSI (and not the Global Tiger Forum)?","options":["2 and 4","1, 3 and 5","1, 2 and 3","3, 4 and 5","2, 3 and 4"],"correct":1,"explanation":"TSDSI is India's Telecom Standards Development Organization, an Organizational Partner of 3GPP/oneM2M and a Sector Member of ITU. The Global Tiger Forum has 13 tiger-range country members and is headquartered in New Delhi, dedicated exclusively to tiger conservation."},{"id":243,"topic":"List Intersection: Financial Inclusion vs Education Credit Schemes","type":"list-intersection","difficulty":"moderate","context":"Consider the following schemes mentioned in the chapter:","statements":["1. Pradhan Mantri Jan Dhan Yojana (PMJDY)","2. PM Vidyalaxmi","3. Pradhan Mantri Mudra Yojana (PMMY)","4. PM-USP CGFSEL","5. Atal Pension Yojana (APY)","6. PM-USP CSIS"],"question":"Which of the above are Financial Inclusion Mission schemes (and not higher-education credit/loan schemes)?","options":["2, 4 and 6","1, 2 and 3","1, 3 and 5","4, 5 and 6","1, 4 and 5"],"correct":2,"explanation":"PMJDY, PMMY, and APY are Financial Inclusion Mission schemes. PM Vidyalaxmi, PM-USP CGFSEL, and PM-USP CSIS are higher-education loan/credit-guarantee schemes."},{"id":244,"topic":"List Intersection: WPI vs ICI Revised Series","type":"list-intersection","difficulty":"hard","context":"Consider the following features of India's revised statistical series (both rebased to 2022-23):","statements":["1. Number of core industries increased from 8 to 9 with Iron Ore added","2. Number of basket items increased from 697 to 957","3. Crude Petroleum & Natural Gas shifted from Primary Articles to Fuel & Power group","4. Steel Index shifted to Gross Production basis","5. Overall linking factor of 1.47 between old and new series"],"question":"Which of the above features are specific to the revised WPI series (and not the revised ICI series)?","options":["1 and 4","1, 4 and 5","2, 3 and 5","2 and 3","All are common to both series"],"correct":3,"explanation":"The increase in basket items (697→957) and the shift of Crude Petroleum & Natural Gas between groups are WPI-specific changes. The addition of Iron Ore as a core industry, the Steel Index basis shift, and the 1.47 linking factor are ICI-specific changes."},{"id":245,"topic":"List Intersection: SVEP vs RSETI","type":"list-intersection","difficulty":"moderate","context":"Consider the following facts about two rural livelihood-related initiatives:","statements":["1. Implemented through State Rural Livelihoods Missions (SRLMs)","2. Established through a three-way partnership among MoRD, State/UT Governments and Sponsor Banks","3. Targets rural unemployed persons aged 18-50 years for training","4. Launched in 2016 under DAY-NRLM","5. Community Resource Persons mentor up to 50 enterprises each"],"question":"Which of the above facts pertain to RSETI (and not SVEP)?","options":["1 and 4","1, 4 and 5","2 and 5","3 and 4","2 and 3"],"correct":4,"explanation":"The three-way partnership structure and the 18-50 age-group training target are specific to RSETI. SVEP is implemented through SRLMs under DAY-NRLM (launched 2016), with Community Resource Persons (CRP-EPs) mentoring up to 50 enterprises each."},{"id":41,"topic":"Catch the Rain","type":"numbered-combo","difficulty":"moderate","context":"Regarding Jal Sanchay Jan Bhagidari (JSJB), consider the following statements:","statements":["1. JSJB 1.0 was launched on 6 September 2024 at Surat, Gujarat, with a target of 10 lakh groundwater recharge structures.","2. JSJB 1.0 achieved over 27 lakh artificial recharge structures.","3. JSJB 2.0 was launched on 1 June 2025 with a target of 1 crore recharge structures by 31 May 2026.","4. JSJB 2.0 achieved less than 50% of its target."],"question":"Which of the above statements is/are correct?","options":["1, 2 and 3 only","1, 2, 3 and 4","2 and 4 only","1 and 4 only","1, 2, 3 and 4 are all correct"],"correct":0,"explanation":"JSJB 2.0 achieved over 1.5 crore structures — over 50% ABOVE the target, not less than 50% of it. Statements 1, 2 and 3 are correct."},{"id":42,"topic":"Catch the Rain","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Jal Shakti Abhiyan: Catch the Rain (JSA:CTR) is correct?","options":["It was launched on 5 June 2020 (World Environment Day) with the theme 'Every Drop Counts'","It was launched on 22 March 2021 (World Water Day) with the theme 'Catch the Rain, Where It Falls, When It Falls'","It is a state-only initiative with no central coordination","It was launched as a one-time campaign without follow-up phases","Its theme in 2021 was 'Nari Shakti se Jal Shakti'"],"correct":1,"explanation":"JSA:CTR was launched on 22 March 2021 (World Water Day) with the theme 'Catch the Rain, Where It Falls, When It Falls'. The 'Nari Shakti se Jal Shakti' theme was for 2024, not 2021."},{"id":43,"topic":"Cotton","type":"numbered-combo","difficulty":"hard","context":"As per 'White Gold: India's Cotton Story', consider the following statements:","statements":["1. India is the largest country in terms of cotton cultivation area, with 114.84 lakh hectares.","2. India is the only country cultivating all four recognised cotton species.","3. Bt Cotton was commercially introduced in India in 2002.","4. G. hirsutum contributes about 60% of hybrid cotton production."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","2 and 3"],"correct":2,"explanation":"G. hirsutum contributes about 90% (not 60%) of hybrid cotton production. Statements 1, 2 and 3 are correct."},{"id":44,"topic":"Cotton","type":"not-among","difficulty":"moderate","statements":["1. Punjab, Haryana, Rajasthan (Northern Zone)","2. Gujarat, Maharashtra, Madhya Pradesh (Central Zone)","3. Telangana, Andhra Pradesh, Karnataka (Southern Zone)","4. Bihar, Jharkhand (Eastern Zone)","5. Also grown in Tamil Nadu and Odisha"],"question":"Which one of the following is NOT a genuine cotton-growing zone/state grouping described in the chapter?","options":["Punjab, Haryana, Rajasthan (Northern Zone)","Gujarat, Maharashtra, Madhya Pradesh (Central Zone)","Telangana, Andhra Pradesh, Karnataka (Southern Zone)","Bihar, Jharkhand (Eastern Zone)","Also grown in Tamil Nadu and Odisha"],"correct":3,"explanation":"There is no 'Eastern Zone' of Bihar/Jharkhand in the chapter's cotton-growing zone classification; cotton zones are Northern, Central and Southern, with additional growth in Tamil Nadu and Odisha."},{"id":45,"topic":"Cotton","type":"figure-recall","difficulty":"moderate","question":"As per the chapter, cotton is India's largest cultivated among all countries; what is India's cotton area and its share of global cotton area?","options":["100 lakh hectares; ~30% of global cotton area","120 lakh hectares; ~45% of global cotton area","114.84 lakh hectares; ~50% of global cotton area","95 lakh hectares; ~38% of global cotton area","114.84 lakh hectares; ~38% of global cotton area"],"correct":4,"explanation":"India's cotton area is 114.84 lakh hectares, about 38% of the global cotton area of 304.08 lakh hectares."},{"id":46,"topic":"Cotton","type":"acronym","difficulty":"easy","question":"What does 'CCI', the nodal agency for cotton procurement under MSP, stand for?","options":["Cotton Corporation of India","Central Cotton Institute","Cotton Certification of India","Cotton Council of India","Central Cotton Investment Board"],"correct":0,"explanation":"CCI stands for the Cotton Corporation of India, the nodal agency for cotton procurement under MSP."},{"id":47,"topic":"NAD/APAAR","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Academic Bank of Credits (ABC) is correct?","options":["ABC is regulated by AICTE and credits are valid indefinitely","ABC is regulated by the University Grants Commission (UGC) and credits are valid for a maximum of 7 years","ABC allows credits to be reused multiple times after redemption","ABC is a state-level initiative with no central regulation","ABC's maximum credit validity period is 3 years"],"correct":1,"explanation":"ABC is regulated by the UGC; credits are valid for a maximum of 7 years (or the duration prescribed by the discipline), and once redeemed, cannot be reused."},{"id":48,"topic":"NAD/APAAR","type":"acronym","difficulty":"easy","question":"What does 'APAAR' stand for?","options":["Academic Portal for Assessment and Accreditation Records","All-India Permanent Academic Aptitude Register","Automated Permanent Academic Account Registry","Automated Personal Academic Achievement Record","Aadhaar-linked Permanent Academic Access Registry"],"correct":2,"explanation":"APAAR stands for Automated Permanent Academic Account Registry, a unique 12-digit student ID under the 'One Nation, One Student ID' initiative."},{"id":49,"topic":"NAD/APAAR","type":"figure-recall","difficulty":"moderate","question":"As of 2nd July 2026, how many verified APAAR IDs had been generated across India?","options":["20 crore","30 crore","15.5 crore","26.35 crore","26.35 lakh"],"correct":3,"explanation":"As of 2 July 2026, 26.35 crore verified APAAR IDs had been generated across India."},{"id":50,"topic":"NAD/APAAR","type":"not-among","difficulty":"hard","statements":["1. National Academic Depository (NAD)","2. Academic Bank of Credits (ABC)","3. Automated Permanent Academic Account Registry (APAAR)","4. National Credit Verification Authority (NCVA)","5. DigiLocker"],"question":"Which one of the following is NOT a genuine component of India's digital academic credentials ecosystem as described in the chapter?","options":["National Academic Depository (NAD)","Academic Bank of Credits (ABC)","Automated Permanent Academic Account Registry (APAAR)","DigiLocker","National Credit Verification Authority (NCVA)"],"correct":4,"explanation":"'National Credit Verification Authority (NCVA)' is a fabricated body. The genuine ecosystem components are NAD, ABC, APAAR and DigiLocker."},{"id":51,"topic":"Toy Ecosystem","type":"figure-recall","difficulty":"moderate","question":"India's overall toy exports (HSN 9503, 9504 & 9505) grew from what value in 2017-18 to what value in 2025-26?","options":["US$152.7 million to US$384.7 million (growth of over 151.9%)","US$100 million to US$300 million (growth of 200%)","US$200 million to US$400 million (growth of 100%)","US$152.7 million to US$500 million (growth of over 227%)","US$77.35 million to US$200.89 million (growth of 160%)"],"correct":0,"explanation":"Overall toy exports rose from US$152.7 million (2017-18) to US$384.7 million (2025-26), a growth of over 151.9%. (The last option describes Electronic & Non-Electronic Toys specifically, not overall exports.)"},{"id":52,"topic":"Poshan Tracker","type":"numbered-combo","difficulty":"moderate","context":"Regarding Poshan Tracker, consider the following statements:","statements":["1. Poshan Tracker was launched in March 2021 through MoWCD and NeGD.","2. As of May 2026, Poshan Tracker registered over 8.93 crore beneficiaries.","3. Poshan Tracker's IT-Enabled Home Visit Scheduler supports 23 structured home visits.","4. Poshan Tracker won the National Award for e-Governance (Gold) in September 2023."],"question":"Which of the above statements is/are incorrect?","options":["1 only","4 only","2 only","3 only","2 and 3"],"correct":1,"explanation":"Poshan Tracker won the National Award for e-Governance (Gold) at the 27th National Conference in September 2024, not 2023. Statements 1, 2 and 3 are correct."},{"id":53,"topic":"Poshan Tracker","type":"acronym","difficulty":"easy","question":"What does 'POSHAN' in POSHAN Abhiyaan stand for?","options":["Programme for Overall Sustainable Health and Nutrition","Public Overarching Scheme for Health and Nutrition","Prime Minister's Overarching Scheme for Holistic Nourishment","Prime Minister's Organised Scheme for Health and Anganwadi Nutrition","Programme for Optimal School Health and Nutrition"],"correct":2,"explanation":"POSHAN stands for Prime Minister's Overarching Scheme for Holistic Nourishment, launched on 8 March 2018."},{"id":54,"topic":"Poshan Tracker","type":"figure-recall","difficulty":"hard","question":"Under Poshan Tracker's IT-Enabled Home Visit Scheduler, how are the 23 structured home visits distributed across the maternal and child stages?","options":["5 during pregnancy, 5 postpartum, 5 from 1–2 years, 8 from 2–3 years","4 during pregnancy, 6 postpartum, 6 from 1–2 years, 7 from 2–3 years","6 during pregnancy, 4 postpartum, 4 from 2 months–1 year, 5 from 1–2 years, 4 from 2–3 years","4 during pregnancy, 4 in the first postpartum month, 7 from 2 months–1 year, 5 from 1–2 years, 3 from 2–3 years","3 during pregnancy, 5 postpartum, 7 from 2 months–1 year, 5 from 1–2 years, 3 from 2–3 years"],"correct":3,"explanation":"The 23 visits break down as: 4 during pregnancy, 4 in the first postpartum month, 7 from 2 months to 1 year, 5 from 1–2 years, and 3 from 2–3 years."},{"id":55,"topic":"SMAM","type":"numbered-combo","difficulty":"moderate","context":"Regarding the Sub-Mission on Agricultural Mechanization (SMAM), consider the following statements:","statements":["1. SMAM was launched in 2014-15 as a Centrally Sponsored Scheme under RKVY.","2. From 2014-15 to 2025-26, SMAM's central assistance of ₹9,404.47 crore supported distribution of 21.61 lakh machines.","3. SMAM covers 40% of machine cost for general beneficiaries and 50% for SC/ST/small/marginal farmers and NE states.","4. The funding pattern for most states under SMAM is 50:50 between Centre and State."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","1 and 4","4 only"],"correct":4,"explanation":"The funding pattern is 60:40 (Centre:State) for most states, 90:10 for NE/Himalayan states, and 100% Central funding for UTs — not 50:50. Statements 1, 2, and 3 are correct."},{"id":56,"topic":"SMAM","type":"acronym","difficulty":"easy","question":"What does 'RKVY' stand for?","options":["Rashtriya Krishi Vikas Yojana","Rural Krishi Vikas Yojana","Rashtriya Kisan Vikas Yojana","Rashtriya Krishi Vistar Yojana","Rural Kisan Vikas Yojana"],"correct":0,"explanation":"RKVY stands for Rashtriya Krishi Vikas Yojana, launched in 2007, later restructured as RKVY-RAFTAR in 2017-18."},{"id":57,"topic":"SMAM","type":"figure-recall","difficulty":"moderate","question":"What percentage of total SMAM funds is earmarked specifically for women farmers?","options":["20%","30%","40%","10%","50%"],"correct":1,"explanation":"SMAM earmarks 30% of total funds for women farmers to enhance their access to agricultural machinery."},{"id":58,"topic":"Cooperation","type":"numbered-combo","difficulty":"moderate","context":"The 5th Foundation Day of the Ministry of Cooperation was celebrated on 6 July 2026. Consider the following statements:","statements":["1. The Ministry of Cooperation was established on 6 July 2021.","2. 50,000 PACS were transformed into e-PACS as a key highlight.","3. Sahakar CBS and Sahakar Sahyogi were unveiled as flagship initiatives of NUCFDC.","4. The surcharge for cooperatives having income between ₹1-10 crore was increased from 7% to 12%."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","2 and 4"],"correct":2,"explanation":"The surcharge was reduced from 12% to 7% (not increased from 7% to 12%) for cooperatives with income between ₹1-10 crore. Statements 1, 2 and 3 are correct."},{"id":59,"topic":"Cooperation","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about National Cooperative Institutions is correct?","options":["National Cooperative Exports Limited (NCEL) is dedicated only to organic product certification","Bharatiya Beej Sahakari Samiti Limited (BBSSL) has fewer member cooperatives than NCOL","NCEL recorded exports worth ₹6,295 crore to 15 countries as of June 2026","National Cooperative Organics Limited (NCOL) had 14,286 member cooperatives as of June 2026","Tribhuvan Sahkari University is India's second cooperative university"],"correct":3,"explanation":"NCOL had 14,286 member cooperatives as of June 2026. NCEL handles exports (not organics certification, which is NCOL's role) and exported to 38 countries (not 15); BBSSL had 38,665 member cooperatives — more than NCOL's 14,286; and Tribhuvan Sahkari University is India's FIRST cooperative university."},{"id":60,"topic":"Cooperation","type":"figure-recall","difficulty":"moderate","question":"Under White Revolution 2.0, what is the target increase in milk procurement and by which year?","options":["30% increase by 2027-28","100% increase by 2030-31","25% increase by 2026-27","75% increase by 2029-30","50% increase by 2028-29"],"correct":4,"explanation":"White Revolution 2.0 targets a 50% increase in milk procurement by 2028-29."},{"id":61,"topic":"ABDM","type":"numbered-combo","difficulty":"moderate","context":"Regarding the Ayushman Bharat Digital Mission (ABDM), consider the following statements:","statements":["1. ABDM was launched in September 2021.","2. As of May 2026, over 100 crore health records were linked to more than 90 crore ABHA accounts.","3. The ABHA number is a 14-digit unique health identifier.","4. Aarogya Setu 2.0 was launched on 29 June 2026, originally developed as a COVID-19 contact-tracing app."],"question":"Which of the above statements are correct?","options":["1, 2, 3 and 4","1, 2 and 3 only","2, 3 and 4 only","1 and 4 only","1, 3 and 4 only"],"correct":0,"explanation":"All four statements are correct as per the chapter's description of ABDM's milestones and the ABHA number/Aarogya Setu 2.0 relaunch."},{"id":62,"topic":"ABDM","type":"acronym","difficulty":"easy","question":"What does 'UHI' stand for in the context of ABDM?","options":["Universal Health Insurance","Unified Health Interface","Unified Health Identifier","Universal Health Interoperability","Unified Hospital Infrastructure"],"correct":1,"explanation":"UHI stands for Unified Health Interface — an open network for health services, described as 'like UPI for healthcare'."},{"id":63,"topic":"ABDM","type":"not-among","difficulty":"hard","statements":["1. Blood bank discovery","2. PM Jan Arogya Yojana hospital search","3. Jan Aushadhi Kendra discovery","4. Ambulance booking","5. Organ donor registration"],"question":"Which one of the following is NOT among the five live services on the Unified Health Interface (UHI) platform as described in the chapter?","options":["Blood bank discovery","PM Jan Arogya Yojana hospital search","Organ donor registration","Jan Aushadhi Kendra discovery","Ambulance booking"],"correct":2,"explanation":"'Organ donor registration' is fabricated. The five genuine UHI live services are: blood bank discovery, PMJAY hospital search, Jan Aushadhi Kendra discovery, ambulance booking, and doctor consultation."},{"id":64,"topic":"ABDM","type":"figure-recall","difficulty":"moderate","question":"As on June 18, 2026, how many ABHA-linked tokens ha
