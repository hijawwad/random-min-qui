<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABARD Grade A — ESI/GA Practice</title>
<style>
  :root{
    --bg:#14171C;
    --panel:#1B1F26;
    --panel-2:#21262F;
    --panel-3:#262C36;
    --border:#2E343D;
    --border-soft:#262B33;
    --text:#ECE9E1;
    --text-dim:#9AA1AC;
    --text-faint:#6B7280;
    --accent:#D9A441;
    --accent-soft:rgba(217,164,65,0.14);
    --accent-dim:#8C6A2C;
    --green:#5BB98C;
    --green-bg:rgba(91,185,140,0.13);
    --green-border:rgba(91,185,140,0.45);
    --red:#E0655A;
    --red-bg:rgba(224,101,90,0.13);
    --red-border:rgba(224,101,90,0.45);
    --blue:#6FA3D8;
    --font-serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
    --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --radius:8px;
    --maxw:760px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);}
  body{min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--accent-soft);}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  .wrap{max-width:var(--maxw);margin:0 auto;width:100%;padding:0 20px;}

  /* ---------- Top bar (quiz/section/end screens) ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(20,23,28,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border-soft);
  }
  .topbar-inner{
    max-width:var(--maxw);margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:14px;
  }
  .back-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    padding:6px 12px;border-radius:6px;font-size:13px;white-space:nowrap;
    transition:border-color .15s,color .15s;
  }
  .back-btn:hover{border-color:var(--accent-dim);color:var(--text);}
  .topbar-meta{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .topbar-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--text-dim);}
  .topbar-row .score{color:var(--accent);font-weight:600;}
  .progress-track{height:4px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .25s ease;}

  /* ---------- Home screen ---------- */
  .home{flex:1;display:flex;flex-direction:column;justify-content:center;padding:56px 0 40px;}
  .home-header{margin-bottom:40px;}
  .kicker{
    font-size:12px;letter-spacing:.04em;color:var(--accent);font-weight:600;
    margin-bottom:10px;
  }
  .home h1{
    font-family:var(--font-serif);font-size:34px;line-height:1.2;margin:0 0 10px;
    font-weight:400;color:var(--text);
  }
  .home .sub{color:var(--text-dim);font-size:15px;line-height:1.5;margin:0;max-width:52ch;}

  .mode-list{display:flex;flex-direction:column;gap:14px;}
  .mode-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px;display:flex;flex-direction:column;gap:14px;
    position:relative;overflow:hidden;
  }
  .mode-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mode-color,var(--accent));
  }
  .mode-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .mode-title{font-family:var(--font-serif);font-size:20px;color:var(--text);margin:0 0 6px;}
  .mode-desc{color:var(--text-dim);font-size:13.5px;line-height:1.5;margin:0;}
  .mode-count{font-size:12px;color:var(--text-faint);white-space:nowrap;padding-top:3px;}
  .mode-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}

  .toggle-group{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .toggle-opt{
    background:transparent;border:none;color:var(--text-dim);font-size:12.5px;
    padding:7px 13px;transition:background .15s,color .15s;
  }
  .toggle-opt.active{background:var(--accent-soft);color:var(--accent);}

  .btn{
    background:var(--accent);color:#1A1608;border:none;border-radius:6px;
    padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter .15s,transform .1s;
    white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.secondary:hover{border-color:var(--accent-dim);}
  .btn.ghost{background:transparent;border:none;color:var(--text-dim);padding:9px 8px;}
  .btn.ghost:hover{color:var(--text);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .home-footer{margin-top:34px;font-size:12px;color:var(--text-faint);line-height:1.6;}

  /* ---------- Section grid ---------- */
  .section-screen{padding:22px 0 60px;}
  .section-head{margin:18px 0 20px;}
  .section-head h2{font-family:var(--font-serif);font-weight:400;font-size:24px;margin:0 0 6px;}
  .section-head p{color:var(--text-dim);font-size:13.5px;margin:0;}
  .search-box{
    width:100%;background:var(--panel);border:1px solid var(--border);border-radius:6px;
    color:var(--text);padding:10px 14px;font-size:13.5px;margin-bottom:18px;
  }
  .search-box:focus{outline:none;border-color:var(--accent-dim);}
  .topic-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;
  }
  .topic-card{
    background:var(--panel);border:1px solid var(--border);border-radius:7px;
    padding:14px 16px;text-align:left;color:var(--text);transition:border-color .15s,background .15s;
  }
  .topic-card:hover{border-color:var(--accent-dim);background:var(--panel-2);}
  .topic-name{font-size:13.5px;font-weight:600;margin-bottom:4px;line-height:1.3;}
  .topic-count{font-size:11.5px;color:var(--text-faint);}

  /* ---------- Quiz screen ---------- */
  .quiz-screen{flex:1;padding:26px 0 80px;}
  .q-meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;}
  .topic-chip{
    font-size:11px;color:var(--accent);background:var(--accent-soft);
    padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap;
  }
  .diff-chip{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap;border:1px solid var(--border);color:var(--text-dim);}
  .diff-easy{color:var(--green);border-color:var(--green-border);}
  .diff-moderate{color:var(--accent);border-color:var(--accent-dim);}
  .diff-hard{color:var(--red);border-color:var(--red-border);}

  .context-box{
    background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent-dim);
    border-radius:6px;padding:16px 18px;margin-bottom:18px;font-size:14px;line-height:1.6;color:var(--text-dim);
  }
  .context-box p{margin:0 0 10px;}
  .context-box ol,.context-box ul{margin:0;padding-left:0;list-style:none;}
  .context-box li{margin:0 0 6px;color:var(--text);}
  .context-box li:last-child{margin-bottom:0;}

  .question-text{
    font-family:var(--font-serif);font-size:19px;line-height:1.5;color:var(--text);
    margin:0 0 20px;font-weight:400;
  }

  .options{display:flex;flex-direction:column;gap:9px;margin-bottom:18px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;text-align:left;
    background:var(--panel);border:1px solid var(--border);border-radius:7px;
    padding:13px 16px;font-size:14px;line-height:1.5;color:var(--text);
    transition:border-color .15s,background .15s;width:100%;
  }
  .option:hover:not(.locked){border-color:var(--accent-dim);background:var(--panel-2);}
  .option-letter{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    color:var(--text-dim);margin-top:1px;
  }
  .option.correct{background:var(--green-bg);border-color:var(--green-border);}
  .option.correct .option-letter{background:var(--green);border-color:var(--green);color:#0E1512;}
  .option.incorrect{background:var(--red-bg);border-color:var(--red-border);}
  .option.incorrect .option-letter{background:var(--red);border-color:var(--red);color:#1A0E0C;}
  .option.locked{cursor:default;}
  .option.faded{opacity:.55;}

  .action-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;}

  .explanation{
    background:var(--panel-2);border:1px solid var(--border);border-radius:7px;
    padding:15px 17px;font-size:13.5px;line-height:1.6;color:var(--text-dim);margin-bottom:18px;
    animation:fadeIn .2s ease;
  }
  .explanation .tag{font-weight:700;font-size:12px;letter-spacing:.02em;margin-bottom:6px;display:block;}
  .explanation.correct .tag{color:var(--green);}
  .explanation.incorrect .tag{color:var(--red);}
  .explanation.skipped .tag{color:var(--text-faint);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:translateY(0);}}

  .next-row{display:flex;justify-content:flex-end;}

  /* ---------- End screen ---------- */
  .end-screen{padding:30px 0 70px;}
  .end-hero{text-align:center;margin-bottom:28px;}
  .end-hero .score-num{font-family:var(--font-serif);font-size:56px;color:var(--accent);line-height:1;}
  .end-hero .score-label{color:var(--text-dim);font-size:14px;margin-top:8px;}

  .breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px;}
  .breakdown-card{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:14px;text-align:center;}
  .breakdown-card .bd-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
  .breakdown-card .bd-value{font-family:var(--font-serif);font-size:22px;color:var(--text);}
  .bd-bar-track{height:4px;background:var(--panel-2);border-radius:3px;margin-top:8px;overflow:hidden;}
  .bd-bar-fill{height:100%;background:var(--accent);border-radius:3px;}

  .end-actions{display:flex;gap:10px;margin-bottom:34px;}
  .end-actions .btn{flex:1;text-align:center;}

  .review-head{font-family:var(--font-serif);font-size:18px;margin:0 0 14px;color:var(--text);}
  .review-item{
    background:var(--panel);border:1px solid var(--border);border-radius:7px;
    padding:16px 18px;margin-bottom:10px;
  }
  .review-item-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;}
  .review-status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .review-status.wrong{background:var(--red-bg);color:var(--red);}
  .review-status.skipped{background:var(--panel-2);color:var(--text-faint);}
  .review-q{font-size:14px;color:var(--text);margin:0 0 8px;line-height:1.5;}
  .review-answer{font-size:13px;color:var(--green);margin:0 0 6px;}
  .review-your-answer{font-size:13px;color:var(--red);margin:0 0 6px;}
  .review-explain{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin:0;}
  .no-review{color:var(--text-faint);font-size:13.5px;text-align:center;padding:20px 0;}

  .empty-topic{padding:40px 20px;text-align:center;color:var(--text-faint);}

  @media(max-width:520px){
    .home h1{font-size:27px;}
    .breakdown{grid-template-columns:1fr 1fr 1fr;gap:7px;}
    .breakdown-card{padding:10px 6px;}
    .breakdown-card .bd-value{font-size:18px;}
    .question-text{font-size:17px;}
    .mode-actions{flex-direction:column;align-items:stretch;}
    .mode-actions .btn{width:100%;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const QUESTIONS = [{"id":1,"topic":"SVEP","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Start-up Village Entrepreneurship Programme (SVEP) is correct?","options":["SVEP was launched in 2016 by the Ministry of Rural Development and is implemented under DAY-NRLM","SVEP mandates that at least 75% of beneficiaries under the programme be women","SVEP provides a fixed provision of ₹10 crore per block for enterprise support","SVEP is implemented directly by the Ministry of Finance through NABARD","Community Resource Persons under SVEP may mentor up to 100 enterprises each"],"correct":0,"explanation":"SVEP was launched in 2016 under the Ministry of Rural Development, implemented via DAY-NRLM. The women mandate is 60% (not 75%), the provision is ₹6.50 crore per block, it is not run by Finance Ministry/NABARD, and each CRP-EP mentors up to 50 (not 100) enterprises."},{"id":2,"topic":"SVEP","type":"figure-recall","difficulty":"easy","question":"As per SVEP achievements (June 2026), what percentage increase was recorded in Central Share released (till Feb 2026) for the programme?","options":["438%","738%","638%","838%","338%"],"correct":1,"explanation":"The Central Share released till Feb 2026 was ₹942.09 crore, marking a 738% increase."},{"id":3,"topic":"Tiger Conservation","type":"numbered-combo","difficulty":"moderate","context":"Recently in July 2026, PIB highlighted India's tiger conservation achievements. Consider the following statements:","statements":["1. India has approximately 70% of the world's wild tigers.","2. The Tx2 Goal aimed to double the global tiger population by 2022, following the 2010 Saint Petersburg Tiger Summit.","3. As per the 2022 tiger census, India's tiger population was recorded as 3,682 across a survey covering 28 States.","4. Project Tiger was launched in 1973 as a Centrally Sponsored Scheme."],"question":"Which of the above statements is/are correct?","options":["1, 2, 3 and 4","2 and 3 only","1, 2 and 4 only","1 and 4 only","3 and 4 only"],"correct":2,"explanation":"Statement 3 is incorrect — the 2022 survey covered 20 States (not 28), covering a distance of 6.41 lakh km."},{"id":4,"topic":"Tiger Conservation","type":"acronym","difficulty":"easy","question":"What does the acronym NTCA stand for?","options":["National Tiger Census Agency","National Trust for Conservation of Animals","National Task force for Conservation Activities","National Tiger Conservation Authority","National Tiger Corridor Authority"],"correct":3,"explanation":"NTCA stands for the National Tiger Conservation Authority, established in 2006 through an amendment to the Wildlife (Protection) Act, 1972."},{"id":5,"topic":"Tiger Conservation","type":"not-among","difficulty":"hard","statements":["1. M-STrIPES","2. CaTRAT","3. ExtractCompare","4. TigerNet AI","5. Camera Trap Data Repository system used by NTCA"],"question":"Which one of the following is NOT a genuine technology/tool used in India's tiger monitoring system as described in the chapter?","options":["M-STrIPES","CaTRAT","ExtractCompare","None — all are genuine tools","TigerNet AI"],"correct":4,"explanation":"'TigerNet AI' is a fabricated name. The genuine technologies mentioned are M-STrIPES, CaTRAT (Camera Trap Data Repository and Analysis Tool), and ExtractCompare."},{"id":6,"topic":"Tiger Conservation","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the International Big Cat Alliance (IBCA) is correct?","options":["IBCA was approved by the Union Cabinet on 12 March 2024 and covers seven big cat species","IBCA has its headquarters in Bangkok, Thailand","IBCA was launched at the 1st Asian Parks Congress in Japan in 2013","IBCA currently has a membership of 58 countries","IBCA covers only tiger and lion species"],"correct":0,"explanation":"IBCA was approved on 12 March 2024, headquartered in India, with 95 members, covering 7 big cats (Tiger, Lion, Leopard, Snow Leopard, Cheetah, Jaguar, Puma). CA|TS (not IBCA) was launched at the Asian Parks Congress in Japan in 2013."},{"id":7,"topic":"Tiger Conservation","type":"numbered-combo","difficulty":"moderate","context":"Consider the following statements about the Global Tiger Forum (GTF):","statements":["1. GTF is headquartered in New Delhi.","2. GTF has 15 tiger-range member countries.","3. GTF is the world's only intergovernmental organisation dedicated exclusively to tiger conservation."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","1 and 3","1, 2 and 3"],"correct":1,"explanation":"GTF has 13 (not 15) tiger range country members. Statements 1 and 3 are correct."},{"id":8,"topic":"Tiger Conservation","type":"figure-recall","difficulty":"moderate","question":"As per the Management Effectiveness Evaluation (MEE) findings by 2022, what was the average management score of India's evaluated tiger reserves, and how many received an 'Excellent' rating?","options":["Average score 85%; 15 reserves rated 'Excellent'","Average score 78%; 20 reserves rated 'Excellent'","Average score 78%; 12 reserves rated 'Excellent'","Average score 65%; 12 reserves rated 'Excellent'","Average score 78%; 8 reserves rated 'Excellent'"],"correct":2,"explanation":"By 2022, 51 tiger reserves were evaluated; 12 received 'Excellent' ratings and the average management score was 78%."},{"id":9,"topic":"Tiger Conservation","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Integrated Tiger Habitat Conservation Programme (ITHCP) is correct?","options":["ITHCP is India's own domestic tiger conservation scheme funded solely by the Ministry of Environment","ITHCP was launched at the 1st Asian Parks Congress in Japan in 2013","ITHCP is administered by the Global Tiger Forum headquartered in New Delhi","ITHCP is implemented by IUCN and funded by the German Government through KfW Development Bank","ITHCP funds are routed through the International Big Cat Alliance"],"correct":3,"explanation":"ITHCP is the flagship tiger programme of IUCN, implemented by IUCN and funded by the German Government through KfW Development Bank."},{"id":10,"topic":"PM Vidyalaxmi","type":"numbered-combo","difficulty":"moderate","context":"As of the PIB briefing on PM Vidyalaxmi Scheme (approved 6 November 2024), consider the following statements:","statements":["1. The scheme covers 1,425 Quality Higher Education Institutions (QHEIs).","2. Credit guarantee of 75% is available for loans up to ₹7.5 lakh.","3. Interest subvention of 3% is available on loans up to ₹10 lakh for families with annual income up to ₹8 lakh.","4. The scheme has a budget allocation of ₹5,000 crore for 2024-25 to 2030-31."],"question":"Which of the above statements are correct?","options":["1, 2, 3 and 4","2 and 4 only","1 and 4 only","3 and 4 only","1, 2 and 3 only"],"correct":4,"explanation":"Statement 4 is incorrect — the budget allocation is ₹3,600 crore (not ₹5,000 crore) for 2024-25 to 2030-31."},{"id":11,"topic":"PM Vidyalaxmi","type":"acronym","difficulty":"easy","question":"In the context of PM Vidyalaxmi, what does 'QHEI' stand for?","options":["Quality Higher Education Institution","Qualified Higher Education Institute","Quality Higher Education Initiative","Quality Health and Education Institution","Quantified Higher Education Index"],"correct":0,"explanation":"QHEI stands for Quality Higher Education Institution — the designated institutions eligible for PM Vidyalaxmi collateral-free loans."},{"id":12,"topic":"PM Vidyalaxmi","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements correctly distinguishes PM Vidyalaxmi from PM-USP CSIS?","options":["PM Vidyalaxmi offers 100% interest subvention during the moratorium period while PM-USP CSIS offers 3%","PM Vidyalaxmi covers family income up to ₹8 lakh while PM-USP CSIS covers up to ₹4.5 lakh","PM-USP CSIS covers all degree and diploma courses while PM Vidyalaxmi is limited to technical courses","PM Vidyalaxmi has no annual slot limit while PM-USP CSIS is capped at 1 lakh fresh slots","PM-USP CSIS is a new scheme that supplements PM Vidyalaxmi"],"correct":1,"explanation":"PM Vidyalaxmi's income ceiling is ₹8 lakh vs PM-USP CSIS's ₹4.5 lakh. PM-USP CSIS gives 100% interest subvention (not PM Vidyalaxmi, which gives 3%); PM Vidyalaxmi covers all courses while CSIS is for technical/professional; PM Vidyalaxmi (not CSIS) is capped at 1 lakh fresh slots annually; and PM Vidyalaxmi supplements the existing CSIS scheme, not vice versa."},{"id":13,"topic":"PM Vidyalaxmi","type":"figure-recall","difficulty":"moderate","question":"As of 21 July 2026, how many collateral-free education loans worth how much had been sanctioned under PM-Vidyalaxmi?","options":["1,25,000 loans worth ₹18,000 crore","95,000 loans worth ₹12,500 crore","1,12,817 loans worth ₹15,634.78 crore","1,12,817 loans worth ₹10,634.78 crore","2,00,000 loans worth ₹15,634.78 crore"],"correct":2,"explanation":"As of 21 July 2026, 1,12,817 collateral-free education loans worth ₹15,634.78 crore had been sanctioned under PM-Vidyalaxmi."},{"id":14,"topic":"Paper Leak Law","type":"numbered-combo","difficulty":"hard","context":"Regarding the Public Examinations (Prevention of Unfair Means) Amendment Bill, 2026, consider the following statements:","statements":["1. Individuals found guilty under Section 10 face 5-10 years imprisonment and a fine up to ₹50 lakh.","2. Service providers face a fine up to ₹5 crore and an 8-year ban from conducting public examinations.","3. Organised crime/syndicate offences under Section 11 attract 7-10 years imprisonment and a fine of at least ₹10 crore.","4. Investigations under the new provisions must be completed within 3 months."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","4 only","1 and 2"],"correct":3,"explanation":"Investigation must be completed within 2 months (not 3 months) as per the new Special Task Force provision; trial must be completed within 3 months of chargesheet, which is a different timeline."},{"id":15,"topic":"Paper Leak Law","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the appeal process under the 2026 Amendment Bill for exam-fraud cases is correct?","options":["Appeals lie to the Supreme Court within 60 days, extendable to 120 days","Appeals must be filed within 15 days with no scope for condonation of delay","Bail orders cannot be appealed directly to the High Court","Appeals can also be filed before District Courts in addition to the High Court","Appeals lie to the High Court before a 2-judge bench, and must normally be filed within 30 days, extendable up to a maximum of 90 days"],"correct":4,"explanation":"Appeals go to the High Court (2-judge bench), normally within 30 days, with a maximum condonation limit of 90 days; no other court can hear appeals or revisions."},{"id":16,"topic":"Hepatitis","type":"figure-recall","difficulty":"moderate","question":"As per India's 2021 HIV Sentinel Surveillance data cited in the chapter, what were the approximate positivity rates for Hepatitis B and Hepatitis C respectively?","options":["0.85% and 0.29%","1.2% and 0.5%","0.29% and 0.85%","2.1% and 0.9%","0.5% and 0.15%"],"correct":0,"explanation":"About 0.85% tested positive for Hepatitis B and 0.29% for Hepatitis C, roughly 1 in 118 and 1 in 345 people respectively."},{"id":17,"topic":"Soil & Farming","type":"numbered-combo","difficulty":"moderate","context":"Regarding India's soil management initiatives, consider the following statements:","statements":["1. The Soil Health Card Scheme was launched in 2015.","2. The National Mission on Natural Farming (NMNF) was launched in 2024.","3. The National Mission for Sustainable Agriculture (NMSA) was launched in 2014-15 as part of NAPCC.","4. The National Action Plan on Climate Change (NAPCC) contains 10 National Missions."],"question":"Which of the above statements are correct?","options":["1, 2, 3 and 4","1, 2 and 3 only","1 and 4 only","2, 3 and 4 only","1, 3 and 4 only"],"correct":1,"explanation":"NAPCC contains 8 (not 10) National Missions. Statements 1, 2 and 3 are correct."},{"id":18,"topic":"Soil & Farming","type":"acronym","difficulty":"easy","question":"What does 'NMSA' stand for in the context of India's climate-resilient agriculture initiatives?","options":["National Mission for Soil Assessment","National Mission for Scientific Agronomy","National Mission for Sustainable Agriculture","National Mission on Sustainable Afforestation","National Mission for Sustainable Aquaculture"],"correct":2,"explanation":"NMSA stands for the National Mission for Sustainable Agriculture, launched in 2014-15 as part of NAPCC."},{"id":19,"topic":"Soil & Farming","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about the Carbon Credit Trading Scheme (CCTS) is correct?","options":["CCTS was adopted in 2021 and one carbon credit equals 10 Metric Tonnes of CO2 equivalent","CCTS is administered exclusively by the Ministry of Power with no role for farmers","CCTS was notified under the Wildlife Protection Act, 1972","CCTS was adopted in 2023 and one carbon credit equals 1 Metric Tonne of CO2 equivalent","One carbon credit under CCTS equals 1 Kilogram of CO2 equivalent"],"correct":3,"explanation":"CCTS was adopted/notified in 2023, and one carbon credit equals 1 Metric Tonne of CO2 equivalent; it allows farmers to earn carbon credits too."},{"id":20,"topic":"Soil & Farming","type":"figure-recall","difficulty":"moderate","question":"As per Land Use Statistics 2022-23 cited in the chapter, what is India's total reported geographical area and the approximate share under agricultural land?","options":["328.7 million hectares; ~65%","280 million hectares; ~50%","306.65 million hectares; ~46%","350 million hectares; ~59%","306.65 million hectares; ~59%"],"correct":4,"explanation":"Total reported geographical area is 306.65 million hectares, of which agricultural land is approximately 59%."},{"id":121,"topic":"PMAY-G","type":"numbered-combo","difficulty":"moderate","context":"Regarding the progress of Pradhan Mantri Awas Yojana-Gramin (PMAY-G), consider the following statements:","statements":["1. The cumulative target is 4.18 crore houses, of which 3.92 crore have been sanctioned and 3.11 crore completed.","2. Phase-2 runs up to March 2029 with an additional target of 2 crore houses.","3. Financial assistance is ₹1.20 lakh/house in plain areas and ₹1.30 lakh/house in NE States, Himachal Pradesh, Uttarakhand, J&K and Ladakh.","4. The highest PMAY-G target allocation is in Uttar Pradesh."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","1 and 4"],"correct":0,"explanation":"The highest target allocation under PMAY-G is in Madhya Pradesh (57,74,572 houses), not Uttar Pradesh. Statements 1, 2 and 3 are correct."},{"id":122,"topic":"PMAY-G","type":"figure-recall","difficulty":"easy","question":"Under PMAY-G, what is the toilet assistance amount provided through convergence with SBM-G?","options":["₹15,000","₹12,000","₹10,000","₹20,000","₹8,000"],"correct":1,"explanation":"Toilet assistance of ₹12,000 is provided through convergence with the Swachh Bharat Mission-Gramin (SBM-G)."},{"id":123,"topic":"NAKSHA","type":"acronym","difficulty":"moderate","question":"What does 'NAKSHA' stand for, as launched by the Department of Land Resources?","options":["National Aadhaar-linked Knowledge System for Housing Assessment","National Kisan Survey of Habitations and Agriculture","National Geospatial Knowledge-based Land Survey of Urban Habitations","National GIS Knowledge System for Housing Allocation","National Authority for Knowledge-Sharing on Habitation Assets"],"correct":2,"explanation":"NAKSHA stands for National Geospatial Knowledge-based Land Survey of Urban Habitations, a GIS-based urban land parcel mapping initiative under DILRMP."},{"id":124,"topic":"NAKSHA","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about NAKSHA is correct?","options":["It is implemented by the Ministry of Rural Development for rural land records only","It focuses exclusively on forest land demarcation","It is a satellite-imagery programme run by ISRO independently","It is implemented under the Digital India Land Records Modernization Programme (DILRMP) by the Department of Land Resources","It replaces the Svamitva Scheme entirely"],"correct":3,"explanation":"NAKSHA is a GIS-based urban land parcel mapping initiative under DILRMP, implemented by the Department of Land Resources (DoLR) — distinct from ISRO-run programmes or the rural-focused SVAMITVA scheme."},{"id":125,"topic":"PM-AJAY","type":"numbered-combo","difficulty":"moderate","context":"Regarding PM-AJAY, a Central Sponsored Scheme launched in 2021-22 by the Ministry of Social Justice & Empowerment, consider the following statements:","statements":["1. It has three components: Adarsh Gram, Grants-in-Aid, and Hostels.","2. ₹4,276.62 crore has been released under the scheme up to 2025-26 across 30 States/UTs.","3. Under Adarsh Gram, 3,112 villages have been identified since 2018-19.","4. The Government has proposed continuation of PM-AJAY for 2025-26 to 2029-30."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","2 and 4","4 only"],"correct":4,"explanation":"The proposed continuation period is 2026-27 to 2030-31 (not 2025-26 to 2029-30). Statements 1, 2 and 3 are correct."},{"id":126,"topic":"PM-AJAY","type":"not-among","difficulty":"moderate","statements":["1. Adarsh Gram — development of SC-majority villages into model villages","2. Grants-in-Aid — financial assistance for livelihood generation","3. Hostels — construction/strengthening of hostels for SC students","4. Skill Certification — vocational certification for SC youth","5. (PM-AJAY has exactly three components)"],"question":"Which one of the following is NOT one of the three components of PM-AJAY?","options":["Skill Certification","Adarsh Gram","Grants-in-Aid","Hostels","(All three genuine components are listed among 1-3)"],"correct":0,"explanation":"'Skill Certification' is not a component of PM-AJAY. The three genuine components are Adarsh Gram, Grants-in-Aid, and Hostels."},{"id":127,"topic":"Seafarers","type":"figure-recall","difficulty":"moderate","question":"India's rank in global seafarer supply improved from which position in 2015 to which position in 2026, and what is the target under 'Mission 20%'?","options":["From 3rd (2015) to 1st (2026), targeting a share increase from 15% to 25%","From 5th (2015) to 2nd (2026), targeting an increase in global seafaring workforce share from 12.16% to 20%","From 5th (2015) to 1st (2026), targeting a share increase from 10% to 20%","From 2nd (2015) to 1st (2026), targeting a share increase from 12.16% to 30%","From 5th (2015) to 3rd (2026), targeting a share increase from 8% to 20%"],"correct":1,"explanation":"India rose from 5th place (2015) to the world's 2nd-largest seafarer pool (2026); Mission 20% aims to raise India's share of the global seafaring workforce from 12.16% to 20%."},{"id":128,"topic":"Critical Diseases","type":"numbered-combo","difficulty":"hard","context":"Regarding financial assistance schemes for critical diseases, consider the following statements:","statements":["1. AB PM-JAY provides coverage of ₹5 lakh per family per year for secondary and tertiary hospitalisation.","2. Under AB PM-JAY, beneficiary families increased from 10.74 crore to 12 crore in January 2023.","3. Rashtriya Arogya Nidhi (RAN) provides one-time assistance up to ₹15 lakh for life-threatening diseases.","4. The Health Minister's Discretionary Grant (HMDG) offers financial assistance up to ₹5 lakh."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","1 and 4"],"correct":2,"explanation":"HMDG offers financial assistance up to ₹1.25 lakh (not ₹5 lakh). Statements 1, 2 and 3 are correct."},{"id":129,"topic":"Critical Diseases","type":"acronym","difficulty":"easy","question":"What does 'RAN', a scheme providing one-time assistance for life-threatening diseases, stand for?","options":["Rashtriya Ayushman Nidhi","Regional Arogya Network","Rashtriya AIDS Nidhi","Rashtriya Arogya Nidhi","Rashtriya Anudan Nidhi"],"correct":3,"explanation":"RAN stands for Rashtriya Arogya Nidhi, providing one-time assistance of up to ₹15 lakh to poor patients for life-threatening diseases treated at government super-speciality hospitals."},{"id":130,"topic":"PSB Financial Health","type":"numbered-combo","difficulty":"hard","context":"Regarding the financial health of Public Sector Banks (PSBs) in FY 2025-26, consider the following statements:","statements":["1. Gross NPA fell to a historic low of 1.9%.","2. Net Profit reached a highest-ever ₹1.98 lakh crore.","3. The Capital Adequacy Ratio (CRAR) stood at 16.6%.","4. Retail loan credit growth (19.8%) was lower than MSME loan credit growth (19.6%)."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","1 and 4","4 only"],"correct":4,"explanation":"Retail loan growth (19.8%) was actually HIGHER than MSME loan growth (19.6%), not lower. Statements 1, 2 and 3 are correct."},{"id":131,"topic":"RRB Financial Health","type":"figure-recall","difficulty":"moderate","question":"Regional Rural Banks (RRBs) posted their highest-ever net profit in FY 2025-26. What was this net profit figure, along with the GNPA and CRAR?","options":["Net Profit ₹10,177 crore; GNPA 5.3%; CRAR 15.0%","Net Profit ₹8,500 crore; GNPA 6.0%; CRAR 14.0%","Net Profit ₹12,000 crore; GNPA 4.5%; CRAR 16.0%","Net Profit ₹10,177 crore; GNPA 3.5%; CRAR 18.0%","Net Profit ₹9,000 crore; GNPA 5.3%; CRAR 12.5%"],"correct":0,"explanation":"RRBs posted a highest-ever net profit of ₹10,177 crore in FY 2025-26, with GNPA at 5.3% and CRAR at 15.0%."},{"id":132,"topic":"Hub & Spoke Aviation","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Hub & Spoke International Flight Operations from Amritsar is correct?","options":["Amritsar became the 1st spoke airport under the framework, with Mumbai as the hub","Amritsar became the 2nd spoke airport under the framework after Varanasi (which began operations on 25 June 2026), with Delhi as the designated hub","Passengers must complete repeat immigration and customs checks at the hub airport","The framework serves only domestic flight connectivity, not international","Amritsar serves as a spoke exclusively for Jammu & Kashmir, excluding Punjab and Himachal Pradesh"],"correct":1,"explanation":"Amritsar is the 2nd spoke airport after Varanasi (first operations 25 June 2026), with Delhi as the hub; passengers complete check-in/immigration/customs at the spoke airport with no repeat process at the hub; the strategy targets INTERNATIONAL flight operations; and Amritsar serves Punjab, J&K AND Himachal Pradesh."},{"id":133,"topic":"PM-KISAN","type":"numbered-combo","difficulty":"moderate","context":"Regarding the Cabinet's approval to continue PM-KISAN from 2026-27 to 2030-31, consider the following statements:","statements":["1. PM-KISAN was launched in February 2019, offering ₹6,000/year in 3 equal instalments via DBT.","2. The financial outlay for the continuation period is ₹3.15 lakh crore.","3. More than ₹4.47 lakh crore has been transferred through 23 instalments so far.","4. Women farmers have received less than ₹50,000 crore under the scheme."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","2 and 4"],"correct":2,"explanation":"Women farmers have received more than ₹1.06 lakh crore under PM-KISAN (nearly 1 in 4 beneficiaries is a woman) — far more than ₹50,000 crore. Statements 1, 2 and 3 are correct."},{"id":134,"topic":"PM-KISAN","type":"figure-recall","difficulty":"moderate","question":"As per NITI Aayog's DMEO evaluation of PM-KISAN, what percentage of beneficiaries used the assistance for agricultural activities/investment, and what percentage reported improved agricultural income?","options":["75% used it for agricultural activities; ~60% reported improved income","100% used it for agricultural activities; ~90% reported improved income","80% used it for agricultural activities; ~70% reported improved income","92%+ used it for agricultural activities; ~85% reported improved income","92%+ used it for agricultural activities; ~95% reported improved income"],"correct":3,"explanation":"92%+ of beneficiaries used the assistance for agricultural activities/investment, and ~85% reported improved agricultural income and reduced dependence on informal credit."},{"id":135,"topic":"Samudra Manthan","type":"numbered-combo","difficulty":"hard","context":"Regarding the 'Samudra Manthan' National Offshore Exploration Scheme approved by the Cabinet, consider the following statements:","statements":["1. It has an approved outlay of ₹84,084 crore, to be implemented up to FY 2030-31.","2. It is expected to result in a reserve accretion of 600+ Million Metric Tons of Oil Equivalent (MMTOE).","3. It is administered by the Ministry of New and Renewable Energy.","4. Its components include Exploration & Drilling, Infrastructure & Industry, and Digital & Institutional Support."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","1 and 3","3 only"],"correct":4,"explanation":"Samudra Manthan is administered by the Ministry of Petroleum & Natural Gas (not New and Renewable Energy). Statements 1, 2 and 4 are correct."},{"id":136,"topic":"PM Surya Sarovar","type":"figure-recall","difficulty":"moderate","question":"Under the Pradhan Mantri Surya Sarovar Yojana (PM-SSY) for floating solar projects, what is the total outlay and the targeted FSPV capacity with energy storage?","options":["₹5,070 crore outlay; 5,000 MW FSPV with 10,000 MWh storage capacity","₹10,000 crore outlay; 10,000 MW FSPV with 20,000 MWh storage","₹3,000 crore outlay; 3,000 MW FSPV with 5,000 MWh storage","₹5,070 crore outlay; 2,500 MW FSPV with 5,000 MWh storage","₹7,500 crore outlay; 5,000 MW FSPV with 15,000 MWh storage"],"correct":0,"explanation":"PM-SSY has a total outlay of ₹5,070 crore, targeting 5,000 MW of FSPV with co-located Energy Storage Systems totalling 10,000 MWh (minimum 2-hour storage)."},{"id":137,"topic":"PM Surya Sarovar","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about the Central Financial Assistance (CFA) under PM-SSY is correct?","options":["CFA for FSPV projects is ₹2 crore/MW paid upfront before commissioning","CFA for FSPV projects is ₹1 crore/MW after successful commissioning, with up to ₹50 lakh/project for feasibility studies","Feasibility study assistance is capped at ₹10 lakh/project","CFA disbursement is available only up to FY 2027-28","The floating solar potential assessed by NISE is around 50 GWp"],"correct":1,"explanation":"CFA is ₹1 crore/MW after successful commissioning, with up to ₹50 lakh/project for feasibility studies; CFA disbursement extends up to FY 2032-33; and NISE estimated floating solar potential at approximately 102.18 GWp, not 50 GWp."},{"id":138,"topic":"CGTMSE","type":"numbered-combo","difficulty":"hard","context":"Regarding the Credit Guarantee Scheme (CGS) for MSEs implemented through CGTMSE, consider the following statements:","statements":["1. The loan guarantee ceiling was enhanced to ₹10 crore, effective from 1 April 2025.","2. The minimum Annual Guarantee Fee (AGF) was revised to 0.37% per annum after a 50% reduction in the standard rate.","3. As per RBI's Master Direction dated 9 February 2026, Scheduled Commercial Banks shall not obtain collateral security for MSE loans up to ₹20 lakh.","4. For Identified Credit Deficient Districts (ICDDs), CGTMSE provides a 20% discount on AGF and 10% additional guarantee coverage."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","1 and 4"],"correct":2,"explanation":"For ICDDs, CGTMSE provides a 10% discount on AGF and an additional 5% guarantee coverage — not 20% discount and 10% additional coverage. Statements 1, 2 and 3 are correct."},{"id":139,"topic":"CGTMSE","type":"acronym","difficulty":"easy","question":"What does 'CGTMSE' stand for?","options":["Central Government Trust for MSME Enterprises","Credit Guarantee Trust for Medium and Small Enterprises","Corporate Guarantee Fund for Trade and MSME Enterprises","Credit Guarantee Fund Trust for Micro and Small Enterprises","Credit Guarantee Fund for Technology and Small Enterprises"],"correct":3,"explanation":"CGTMSE stands for Credit Guarantee Fund Trust for Micro and Small Enterprises, which implements the Credit Guarantee Scheme (CGS) for MSEs."},{"id":140,"topic":"BRICS Meetings","type":"not-among","difficulty":"moderate","statements":["1. BRICS Women's Working Group Meeting — Kochi, Kerala","2. 3rd BRICS Transport Ministers' Meeting — Nagpur","3. BRICS Health Ministers' Meeting — Chennai","4. India holds the BRICS Chairship in 2026","5. (List drawn from the chapter's BRICS-related events during July 2026)"],"question":"Which one of the following is NOT a genuine BRICS-related event mentioned in the chapter for July 2026?","options":["BRICS Women's Working Group Meeting — Kochi, Kerala","3rd BRICS Transport Ministers' Meeting — Nagpur","India holds the BRICS Chairship in 2026","(All others are genuine)","BRICS Health Ministers' Meeting — Chennai"],"correct":4,"explanation":"'BRICS Health Ministers' Meeting — Chennai' is fabricated. The genuine events are the BRICS Women's Working Group Meeting in Kochi and the 3rd BRICS Transport Ministers' Meeting in Nagpur, both under India's 2026 BRICS Chairship."},{"id":141,"topic":"BRICS Meetings","type":"figure-recall","difficulty":"easy","question":"On which dates was the 3rd BRICS Transport Ministers' Meeting held in Nagpur?","options":["11 and 12 July 2026","1 and 2 July 2026","20 and 21 July 2026","5 and 6 July 2026","15 and 16 July 2026"],"correct":0,"explanation":"The 3rd BRICS Transport Ministers' Meeting was held in Nagpur on 11 and 12 July 2026."},{"id":142,"topic":"Coastal Shipping Act","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the exemption granted under the Coastal Shipping Act, 2025 is correct?","options":["Units in Mumbai's BKC financial district were exempted from all coastal shipping regulations","Units in the IFSC, GIFT City, Gandhinagar were exempted from licensing under Section 11 for chartering foreign vessels for EXIM and international trade","The exemption applies to all Indian ports uniformly, not just IFSC units","Section 11 relates to crew welfare, not licensing for chartering vessels","The exemption was granted under the Merchant Shipping Act, 2025, not the Coastal Shipping Act"],"correct":1,"explanation":"IFSC units in GIFT City, Gandhinagar were exempted from the Section 11 licensing requirement of the Coastal Shipping Act, 2025 for chartering foreign vessels for EXIM/international trade operations."},{"id":143,"topic":"CSIR-TKDL","type":"numbered-combo","difficulty":"hard","context":"Regarding the CSIR Traditional Knowledge Digital Library (TKDL), consider the following statements:","statements":["1. TKDL was established in 2001 through collaboration between CSIR and the Ministry of AYUSH.","2. It is the world's first database dedicated to defensive protection of traditional knowledge.","3. TKDL contains information on over 5.2 lakh formulations from Ayurveda, Unani, Siddha, Sowa Rigpa and Yoga.","4. TKDL content is translated into five languages: English, German, French, Japanese and Chinese."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","1 and 4"],"correct":2,"explanation":"The five languages are English, German, French, Japanese and Spanish — not Chinese. Statements 1, 2 and 3 are correct."},{"id":144,"topic":"CSIR-TKDL","type":"figure-recall","difficulty":"easy","question":"India and Australia signed an agreement on access to CSIR-TKDL during the 3rd India-Australia Annual Summit held where and when?","options":["Sydney, Australia, on 15 July 2026","New Delhi, India, on 1 July 2026","Canberra, Australia, on 20 July 2026","Melbourne, Australia, on 9 July 2026","Melbourne, Australia, on 1 August 2026"],"correct":3,"explanation":"The CSIR-TKDL access agreement between CSIR and IP Australia was signed during the 3rd India-Australia Annual Summit in Melbourne on 9 July 2026."},{"id":145,"topic":"Bureau of Port Security","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Bureau of Port Security (BoPS) is correct?","options":["BoPS is established under the Coastal Shipping Act, 2025","BoPS functions under the Ministry of Home Affairs","BoPS is headed by a Cabinet Secretary-rank officer","BoPS focuses only on cyber-security of port IT systems","BoPS is being established as a statutory body under Section 13 of the Merchant Shipping Act, 2025, headed by a Director General under the Ministry of Ports, Shipping and Waterways"],"correct":4,"explanation":"BoPS is a statutory body under Section 13 of the Merchant Shipping Act, 2025, headed by a Director General, functioning under the Ministry of Ports, Shipping and Waterways, responsible for security/inspection of ships and port facilities (not limited to cyber-security)."},{"id":146,"topic":"CAMPA","type":"acronym","difficulty":"moderate","question":"In the context of the National CAMPA Governing Body meeting, what does the 'Harit-SANKALP' portal's SANKALP stand for?","options":["System for Accreditation, Nursery Knowledge for Afforestation Linkage Platform","Scheme for Afforestation and National Knowledge Alliance for Land Planning","System for Assessment of Nursery and Kisan Land Protection","Strategic Alliance for National Knowledge on Afforestation and Land Preservation","System for Accreditation of National Kisan Afforestation Land Programme"],"correct":0,"explanation":"SANKALP stands for System for Accreditation, Nursery Knowledge for Afforestation Linkage Platform, developed in consultation with FAO-India for QR-code traceability of seed sources and nurseries."},{"id":147,"topic":"MY Bharat","type":"numbered-combo","difficulty":"moderate","context":"Regarding MY Bharat (Mera Yuva Bharat), consider the following statements:","statements":["1. It was launched in October 2023 under the Ministry of Youth Affairs and Sports.","2. Nearly 65% of India's population is below the age of 35.","3. The MY Bharat mobile app, available in 22 Indian languages, recorded over 1 lakh downloads as of 2 July 2026.","4. MY Bharat earned a Guinness World Record on 4 June 2026 for 'Most Users to Take an Online Quiz in One Week' with over 5 lakh verified participants."],"question":"Which of the above statements is/are incorrect?","options":["1 only","4 only","2 only","3 only","2 and 4"],"correct":1,"explanation":"The Guinness World Record was earned with 390,812 verified participants (not over 5 lakh). Statements 1, 2 and 3 are correct."},{"id":148,"topic":"MY Bharat","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about MY Bharat's global engagement is correct?","options":["MY Bharat is exclusively a domestic programme with no international engagement","MY Bharat was launched at the G20 Summit in 2023","MY Bharat enabled India's youth participation at the United Nations ECOSOC Youth Forum 2026","MY Bharat represents India solely at the UN Security Council","MY Bharat's international work is limited to the Commonwealth Youth Forum"],"correct":2,"explanation":"MY Bharat enabled India's youth participation at the UN Economic and Social Council (ECOSOC) Youth Forum 2026, providing a platform for young leaders in global policy discussions."},{"id":149,"topic":"Onion Procurement","type":"figure-recall","difficulty":"moderate","question":"By what percentage was the onion procurement price for the Price Stabilisation Buffer raised, and to what new price, effective from 4 July 2026?","options":["10% increase, from ₹2,000 to ₹2,200 per quintal","15% increase, from ₹1,800 to ₹2,070 per quintal","13% increase, from ₹2,000 to ₹2,260 per quintal","13% increase, from ₹1,875 to ₹2,125 per quintal","20% increase, from ₹1,875 to ₹2,250 per quintal"],"correct":3,"explanation":"The procurement price was raised by 13%, from ₹1,875 to ₹2,125 per quintal, effective from 4 July 2026, procured through NAFED and NCCF."},{"id":150,"topic":"Onion Procurement","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about onion production estimates is correct?","options":["Onion production for 2025-26 is estimated at 400 LMT, a significant jump from 2024-25","Onion procurement is carried out only through NAFED, with no role for NCCF","The price hike applies retroactively from 1 January 2026","Onion production fell sharply from 350 LMT to 307 LMT between 2024-25 and 2025-26","As per the Second Advance Estimates for 2025-26, onion production is estimated at 307.37 lakh metric tonnes, comparable to 307.67 LMT in 2024-25"],"correct":4,"explanation":"As per the Second Advance Estimates, 2025-26 onion production is estimated at 307.37 LMT, comparable to (not sharply different from) 307.67 LMT in 2024-25; procurement is through both NAFED and NCCF; and the price hike is effective from 4 July 2026, not retroactively from January."},{"id":151,"topic":"MANAS Helpline","type":"numbered-combo","difficulty":"hard","context":"Regarding the National Narcotics Helpline MANAS, consider the following statements:","statements":["1. MANAS (Madak Padarth Nishedh Asoochna Kendra) was launched on 18 July 2024 under the Narcotics Control Bureau (NCB), Ministry of Home Affairs.","2. It is accessible through the national helpline number 1933.","3. It links the public with 30 NCB Zonal Units and 36 State/UT Anti-Narcotics Task Forces (ANTFs).","4. MANAS was developed solely by NCB without involvement of Digital India Corporation."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","3 and 4"],"correct":0,"explanation":"MANAS was developed in collaboration WITH the Digital India Corporation (DIC), not solely by NCB. Statements 1, 2 and 3 are correct."},{"id":152,"topic":"MANAS Helpline","type":"figure-recall","difficulty":"hard","question":"As per India's first 'Magnitude of Substance Abuse' report (2019) cited in the chapter, how many people were estimated to consume alcohol, and how many were severely affected?","options":["Around 10 crore consume alcohol; 2 crore severely affected","Around 16 crore consume alcohol; over 5.7 crore severely affected","Around 20 crore consume alcohol; 8 crore severely affected","Around 16 crore consume alcohol; 3 crore severely affected","Around 12 crore consume alcohol; 5.7 crore severely affected"],"correct":1,"explanation":"Around 16 crore people consume alcohol, of which over 5.7 crore are severely affected, as per the 2019 report cited in the chapter."},{"id":153,"topic":"Cybercrime Mechanism","type":"not-among","difficulty":"moderate","statements":["1. Indian Cyber Crime Coordination Centre (I4C) — set up by MHA","2. National Cyber Crime Reporting Portal (NCRP) — part of I4C","3. Citizen Financial Cyber Fraud Reporting and Management System (CFCFRMS) — operates under I4C, launched 2021","4. Cyber Crime Prevention Against Women and Children Scheme (CCPWC) as a fourth I4C component","5. (The chapter lists three components: I4C, NCRP and CFCFRMS)"],"question":"Which one of the following was NOT listed among the specific components of India's National Cybercrime Response Mechanism described in the chapter?","options":["Indian Cyber Crime Coordination Centre (I4C) — set up by MHA","National Cyber Crime Reporting Portal (NCRP) — part of I4C","Cyber Crime Prevention Against Women and Children Scheme (CCPWC) as a fourth I4C component","Citizen Financial Cyber Fraud Reporting and Management System (CFCFRMS) — operates under I4C, launched 2021","(The chapter lists three components: I4C, NCRP and CFCFRMS)"],"correct":2,"explanation":"The chapter describes three components — I4C, NCRP, and CFCFRMS — as the National Cybercrime Response Mechanism; a fourth 'CCPWC Scheme' component is not listed in this context."},{"id":154,"topic":"Cybercrime Mechanism","type":"acronym","difficulty":"easy","question":"What does 'CFCFRMS' stand for?","options":["Central Financial Cybercrime Fraud Response and Monitoring System","Citizen Financial Crime Fraud Reporting and Monitoring Scheme","Central Fraud Cybercrime Financial Response Management System","Citizen Financial Cyber Fraud Reporting and Management System","Citizen Financial Cyber Fraud Recovery and Management Scheme"],"correct":3,"explanation":"CFCFRMS stands for Citizen Financial Cyber Fraud Reporting and Management System, launched in 2021 to enable immediate reporting and freezing of siphoned funds."},{"id":155,"topic":"Shipbuilding/MDF","type":"numbered-combo","difficulty":"hard","context":"Regarding the Shipbuilding Financial Assistance Policy (SBFAP) and Maritime Development Fund (MDF), consider the following statements:","statements":["1. SBFAP extension has an outlay of ₹24,736 crore to address cost disadvantages of Indian shipyards.","2. MDF has a total corpus of ₹25,000 crore, comprising the Maritime Investment Fund (₹20,000 crore) and Interest Incentivisation Fund (₹5,000 crore).","3. Maritime Amrit Kaal Vision 2047 (MAKV 2047) targets India ranking among the Top 10 in ship ownership and shipbuilding by 2030, and Top 5 by 2047.","4. MDF is administered exclusively by the Ministry of Finance with no role for the Ministry of Ports, Shipping and Waterways."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","2 and 4","4 only"],"correct":4,"explanation":"MDF/MIF/SBFAP are maritime-sector initiatives under the Ministry of Ports, Shipping and Waterways, not exclusively the Ministry of Finance. Statements 1, 2 and 3 are correct."},{"id":156,"topic":"Shipbuilding/MDF","type":"acronym","difficulty":"easy","question":"What does 'MAKV 2047' stand for?","options":["Maritime Amrit Kaal Vision 2047","Maritime Advancement and Kaal Vikas 2047","Ministry of Amrit Kaal Vision 2047","Maritime Atmanirbhar Kaal Vision 2047","Maritime Aatma-nirbhar Kaushal Vikas 2047"],"correct":0,"explanation":"MAKV 2047 stands for Maritime Amrit Kaal Vision 2047, targeting India's rise in global ship ownership and shipbuilding rankings."},{"id":157,"topic":"Telecom","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about India's first Telecom Manufacturing Zone (TMZ) is correct?","options":["Phase-I of the TMZ will be established at Indore, Madhya Pradesh","Phase-I of the TMZ will be established at Gwalior, Madhya Pradesh, through a DoT-Madhya Pradesh Government MoU","The TMZ is being set up as a joint venture with a private telecom operator, not a state government","The TMZ initiative falls under the Ministry of Electronics and IT, not DoT","TMZ Phase-I focuses exclusively on 5G handset assembly"],"correct":1,"explanation":"India's first TMZ, Phase-I, is being established at Gwalior, Madhya Pradesh, through an MoU between the Department of Telecommunications (DoT) and the Government of Madhya Pradesh."},{"id":158,"topic":"Telecom","type":"figure-recall","difficulty":"moderate","question":"The Pandit Deendayal Upadhyaya Telecom Excellence Awards, conferred by Union Minister Jyotiraditya Scindia, were awarded to which companies?","options":["Reliance Jio and Bharti Airtel","Tata Communications and Vodafone Idea","Amantya Technologies Pvt. Ltd. and Finaara","BSNL and MTNL","Nokia India and Ericsson India"],"correct":2,"explanation":"The awards were conferred to Amantya Technologies Pvt. Ltd. and Finaara, recognising outstanding contributions and innovations in the telecom sector."},{"id":159,"topic":"Khelo India","type":"numbered-combo","difficulty":"hard","context":"Regarding the Cabinet-approved revamped Khelo India Scheme and Assistance to National Sports Federations (ANSFs), consider the following statements:","statements":["1. The combined outlay for the period 2026-27 to 2030-31 is ₹36,441 crore.","2. Emerging Khelo India Athletes (E-KIAs) expands the structured athlete ecosystem nearly 10 times.","3. The scheme aligns with the Khelo Bharat Niti 2025 and NEP 2020.","4. A National Coach Accreditation Board (NCAB) has been proposed to standardise coaching qualifications."],"question":"Which of the above statements are correct?","options":["1, 2 and 3 only","2, 3 and 4 only","1 and 4 only","1, 2, 3 and 4","1, 3 and 4 only"],"correct":3,"explanation":"All four statements accurately describe the revamped Khelo India Scheme and ANSF as approved by the Cabinet."},{"id":160,"topic":"Khelo India","type":"not-among","difficulty":"moderate","statements":["1. Khelo India Feeder Schools (KIFS)","2. Khelo India Utkrishta Vidyalayas (KIUV)","3. Emerging Khelo India Athletes (E-KIAs)","4. Khelo India State Centres of Excellence (KI-SCoE)","5. (These are the athlete development pathway initiatives under the revamped scheme)"],"question":"Which one of the following is NOT among the athlete development pathway initiatives introduced under the revamped Khelo India Scheme?","options":["Khelo India Feeder Schools (KIFS)","Khelo India Utkrishta Vidyalayas (KIUV)","Emerging Khelo India Athletes (E-KIAs)","(All three genuine initiatives are listed among 1-3)","Khelo India State Centres of Excellence (KI-SCoE)"],"correct":4,"explanation":"'Khelo India State Centres of Excellence (KI-SCoE)' is fabricated. The genuine athlete development pathway initiatives are E-KIAs, KIFS, and KIUV."},{"id":161,"topic":"Coal Gasification","type":"numbered-combo","difficulty":"moderate","context":"Regarding the promotion of coal gasification, consider the following statements:","statements":["1. The Government approved a ₹37,500 crore Scheme for Promotion of Surface Coal/Lignite Gasification Projects on 13 May 2026.","2. The National Coal Gasification Mission targets 100 Million Tonnes (MT) of coal gasification capacity by 2030.","3. The Coal/Lignite Gasification Scheme's total outlay is ₹8,500 crore.","4. The scheme is administered by the Ministry of Petroleum & Natural Gas."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","1 and 4"],"correct":0,"explanation":"Coal gasification promotion is administered by the Ministry of Coal (not Petroleum & Natural Gas). Statements 1, 2 and 3 are correct."},{"id":162,"topic":"Coal Gasification","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements correctly distinguishes the two coal gasification-related figures mentioned in the chapter?","options":["₹8,500 crore was approved for the broader scheme, while ₹37,500 crore is the specific scheme's outlay","₹37,500 crore was approved for the broader Scheme for Promotion of Surface Coal/Lignite Gasification Projects, while ₹8,500 crore is the total outlay of the Coal/Lignite Gasification Scheme specifically","Both figures refer to the same single amount, ₹37,500 crore","₹37,500 crore is a target for reduced import expenditure, unrelated to any scheme","₹8,500 crore refers to private-sector matching funds, not government outlay"],"correct":1,"explanation":"₹37,500 crore was the amount approved on 13 May 2026 for the Scheme for Promotion of Surface Coal/Lignite Gasification Projects, while ₹8,500 crore refers to the Coal/Lignite Gasification Scheme's specific total outlay."},{"id":163,"topic":"Tenzing Norgay Award","type":"numbered-combo","difficulty":"hard","context":"Regarding the Tenzing Norgay National Adventure Award (TNNAA), consider the following statements:","statements":["1. It is India's highest national honour for outstanding achievements in adventure, presented by the Ministry of Youth Affairs & Sports.","2. The award enjoys a status equivalent to the Arjuna Award.","3. It is conferred in four categories: Land Adventure, Water (Sea) Adventure, Air Adventure, and Lifetime Achievement.","4. Each awardee receives a cash prize of ₹25 lakh along with a bronze statuette and certificate."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","2 and 4"],"correct":2,"explanation":"Each awardee receives a cash prize of ₹15 lakh (not ₹25 lakh), along with a bronze statuette, certificate, and blazer with silken tie/saree. Statements 1, 2 and 3 are correct."},{"id":164,"topic":"GREAT Scheme","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the GREAT Scheme is correct?","options":["GREAT stands for 'Global Renewable Energy Advancement Technologies'","GREAT is implemented under the National Handloom Development Programme","The maximum financial support under GREAT is ₹1 crore per start-up","GREAT stands for 'Grant for Research and Entrepreneurship across Aspiring Innovators in Technical Textiles', implemented under NTTM since 2023, with max support of ₹50 lakh per start-up","GREAT has been operational since 2018"],"correct":3,"explanation":"GREAT stands for Grant for Research and Entrepreneurship across Aspiring Innovators in Technical Textiles, implemented under the National Technical Textiles Mission (NTTM) since 2023, offering max support of ₹50 lakh per approved start-up."},{"id":165,"topic":"Textile Circularity","type":"not-among","difficulty":"hard","statements":["1. Tex-Eco Initiative (Union Budget 2026-27) — textile waste management and recycling","2. Eliminating Hazardous Chemicals from Textile Fashion Supply Chain — with UNIDO/GEF support","3. In-Tex India — Accelerating the Transition of the Indian Textile Sector towards Circularity, with UNEP","4. Green Textile Passport Initiative — with World Bank support","5. (These are genuine circularity initiatives described in the chapter)"],"question":"Which one of the following is NOT a genuine textile circularity/sustainability initiative described in the chapter?","options":["Tex-Eco Initiative (Union Budget 2026-27) — textile waste management and recycling","Eliminating Hazardous Chemicals from Textile Fashion Supply Chain — with UNIDO/GEF support","In-Tex India — Accelerating the Transition of the Indian Textile Sector towards Circularity, with UNEP","(All three genuine initiatives are listed among 1-3)","Green Textile Passport Initiative — with World Bank support"],"correct":4,"explanation":"'Green Textile Passport Initiative' with World Bank support is fabricated. The genuine initiatives are Tex-Eco, the UNIDO/GEF hazardous chemicals elimination project, and In-Tex India (with UNEP)."},{"id":166,"topic":"Ex-Agniveer Reservation","type":"numbered-combo","difficulty":"hard","context":"Regarding the reservation for Ex-Agniveers in CAPFs & Assam Rifles recruitment (Constable/Rifleman post), consider the following statements:","statements":["1. 50% of vacancies are reserved for Ex-Agniveers.","2. A general age relaxation of 3 years is provided, with an additional 5-year relaxation for the first batch of Ex-Agniveers.","3. Ex-Agniveers are exempted from the Physical Standards Test (PST), Physical Efficiency Test (PET) and written examination.","4. A dedicated Ex-Agniveer wing has been established under the Ministry of Defence."],"question":"Which of the above statements is/are incorrect?","options":["4 only","1 only","2 only","3 only","1 and 4"],"correct":0,"explanation":"The dedicated Ex-Agniveer wing has been established under the Ministry of Home Affairs (not Defence), since it coordinates recruitment into CAPFs & Assam Rifles. Statements 1, 2 and 3 are correct."},{"id":167,"topic":"AAROH","type":"figure-recall","difficulty":"moderate","question":"As per the Ministry of Coal's 'AAROH – Annual Report on Mine Closure', how many coal mines have been scientifically closed for the first time since independence?","options":["25 coal mines","42 coal mines","60 coal mines","15 coal mines","100 coal mines"],"correct":1,"explanation":"For the first time since independence, 42 coal mines have been scientifically closed in accordance with approved mine closure plans, as reported in AAROH."},{"id":168,"topic":"BHASHINI","type":"numbered-combo","difficulty":"hard","context":"Regarding the Digital India BHASHINI Division (DIBD), consider the following statements:","statements":["1. It functions under Digital India Corporation (DIC), under MeitY.","2. It operates through the National Hub for Language Technology (NHLT).","3. BHASHINI supports 36 Indian text languages, 23 Indian voice languages, and 35 international languages.","4. BHASHINI offers more than 30 specialised NLP services."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","4 only","3 only","1 and 4"],"correct":2,"explanation":"BHASHINI offers MORE THAN 20 (not 30) specialised NLP services. Statements 1, 2 and 3 are correct."},{"id":169,"topic":"BHASHINI","type":"acronym","difficulty":"easy","question":"Under which Ministry does the Digital India BHASHINI Division (DIBD) function?","options":["Ministry of Culture","Ministry of Education","Ministry of Information & Broadcasting","Ministry of Electronics and Information Technology (MeitY)","Ministry of Communications"],"correct":3,"explanation":"DIBD functions under Digital India Corporation (DIC), which operates under the Ministry of Electronics and Information Technology (MeitY)."},{"id":170,"topic":"Bharat Tex 2026","type":"numbered-combo","difficulty":"hard","context":"Regarding Bharat Tex 2026, held at Bharat Mandapam, New Delhi, consider the following statements:","statements":["1. It was organised by the Bharat Tex Trade Federation (BTTF) with support from the Ministry of Textiles.","2. There were 8 Sponsor States, including Madhya Pradesh, Bihar, Uttar Pradesh and Gujarat.","3. There were 9 Participating States/UTs, including Andhra Pradesh, Assam and West Bengal.","4. A Letter of Intent was signed between BTTF and Milan Unica to strengthen India-Europe textile collaboration."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","2 and 4","4 only"],"correct":4,"explanation":"The Letter of Intent was signed with Première Vision Paris (not Milan Unica) to strengthen India-Europe textile collaboration. Statements 1, 2 and 3 are correct."},{"id":171,"topic":"NIDAR 2.0","type":"correct-statement","difficulty":"hard","question":"Which one of the following statements about NIDAR 2.0 is correct?","options":["It is the second edition of the National Innovation Challenge for Drone Application and Research, launched by MeitY with Drone Federation India under the SwaYaan initiative, with a prize pool of over ₹65 lakh","It is the first edition of a drone research challenge launched solely by DRDO","The prize pool for NIDAR 2.0 is capped at ₹10 lakh","NIDAR 2.0 focuses only on agricultural drone applications","It was held exclusively online with no in-person component"],"correct":0,"explanation":"NIDAR 2.0 (2026-27) is the second edition, launched by MeitY with Drone Federation India (DFI) under SwaYaan, with a prize pool grown to over ₹65 lakh; it was held in HYBRID mode (both in-person and online) at Electronics Niketan, New Delhi."},{"id":172,"topic":"NIDAR 2.0","type":"acronym","difficulty":"moderate","question":"The VEGA processor, highlighted in the context of NIDAR 2.0, is designed by which institution and based on which architecture?","options":["Indian Institute of Technology Delhi, based on ARM architecture","Centre for Development of Advanced Computing (C-DAC), based on the open-standard RISC-V architecture","ISRO, based on a proprietary architecture","C-DAC, based on x86 architecture","Drone Federation India, based on RISC-V architecture"],"correct":1,"explanation":"VEGA is a family of indigenous microprocessors designed by C-DAC under MeitY's Microprocessor Development Programme, based on the open-standard RISC-V architecture."},{"id":173,"topic":"World Breastfeeding Week","type":"figure-recall","difficulty":"easy","question":"World Breastfeeding Week 2026, observed by the Ministry of Women & Child Development, is observed on which dates and under what theme?","options":["1-7 July 2026; 'Every Drop of Milk Counts'","1-7 August 2026; 'Empowering Mothers, Nourishing Futures'","1-7 August 2026; 'Breastfeeding for a Sustainable Start in Life: Strengthen What Works'","1-7 September 2026; 'Breastfeeding for a Sustainable Start in Life'","1-8 August 2026; 'Strengthen What Works'"],"correct":2,"explanation":"World Breastfeeding Week 2026 is observed from 1-7 August 2026 under the theme 'Breastfeeding for a Sustainable Start in Life: Strengthen What Works'."},{"id":174,"topic":"Yuva Yakrit Mitra","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the 'Yuva Yakrit Mitra (Y2M)' programme is correct?","options":["It was launched by AIIMS Delhi independently of MY Bharat","It focuses exclusively on kidney disease awareness","It is a scheme for financial assistance to liver transplant patients","It was launched by Prof. (Dr.) Shiv Kumar Sarin, jointly developed by ILBS and MY Bharat, to build a nationwide network of Yuva Health Champions","It was launched under the Ayushman Bharat Digital Mission"],"correct":3,"explanation":"Y2M is an Experiential Learning Programme launched by Padma Bhushan awardee Prof. (Dr.) Shiv Kumar Sarin, jointly developed by the Institute of Liver and Biliary Sciences (ILBS) and MY Bharat, to build a network of Yuva Health Champions."},{"id":175,"topic":"PAIMANA","type":"numbered-combo","difficulty":"hard","context":"Regarding MoSPI's PAIMANA (Project Assessment, Infrastructure Monitoring & Analytics for Nation-building) dashboard, consider the following statements:","statements":["1. It was launched on 16 April 2026.","2. The dashboard has been expanded to 165 indicators, including 44 newly added indicators.","3. It monitors infrastructure performance across five dimensions: Access, Quality, Fiscal Cost & Revenue, Utilization, and Affordability.","4. PAIMANA is released annually, not quarterly."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","1 and 4","4 only"],"correct":4,"explanation":"PAIMANA is released quarterly (not annually). Statements 1, 2 and 3 are correct."},{"id":176,"topic":"Ayush Nivesh Saarthi","type":"figure-recall","difficulty":"moderate","question":"When was the Ayush Nivesh Saarthi portal launched, and what is its primary purpose?","options":["Launched on 29 May 2025, to serve as a comprehensive investment facilitation platform for the AYUSH sector","Launched on 15 August 2024, to certify Ayurvedic doctors","Launched on 29 May 2026, to regulate Ayush drug pricing","Launched on 1 April 2025, to provide health insurance for Ayush practitioners","Launched on 29 May 2025, to register AYUSH hospitals under Ayushman Bharat"],"correct":0,"explanation":"The Ayush Nivesh Saarthi portal was launched on 29 May 2025 by the Ministry of Ayush as a comprehensive investment facilitation platform to boost traditional medicine as an economic sector."},{"id":177,"topic":"AAROH","type":"not-among","difficulty":"hard","statements":["1. RECLAIM Framework — scientific assessment and restoration of mined land","2. L.I.V.E.S. Framework — sustainable post-mining development and stakeholder participation","3. SUVIKALP — mine repurposing tool for alternative land use","4. SUVIKALP Samvaad — platform for knowledge exchange and stakeholder engagement","5. GREENSHIFT Protocol — carbon offsetting for closed coal mines"],"question":"Which one of the following is NOT a genuine initiative under AAROH's Mine Closure Framework, as prepared by the Coal Controller Organisation?","options":["RECLAIM Framework — scientific assessment and restoration of mined land","GREENSHIFT Protocol — carbon offsetting for closed coal mines","L.I.V.E.S. Framework — sustainable post-mining development and stakeholder participation","SUVIKALP — mine repurposing tool for alternative land use","SUVIKALP Samvaad — platform for knowledge exchange and stakeholder engagement"],"correct":1,"explanation":"'GREENSHIFT Protocol' is fabricated. The four genuine initiatives under AAROH's Mine Closure Framework are RECLAIM, L.I.V.E.S., SUVIKALP, and SUVIKALP Samvaad."},{"id":178,"topic":"Meri Samiti Mera Patal","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about 'Meri Samiti Mera Patal' is correct?","options":["It is a scheme for providing subsidized food plates (patal) to cooperative society members","It was launched by NABARD to promote organic farming cooperatives","It was launched by the Regional Institute of Cooperative Management (RICM), Chandigarh, under the National Council for Cooperative Training (NCCT), to empower and modernize PACS","It covers all States and UTs of India uniformly","It focuses on dairy cooperative societies exclusively"],"correct":2,"explanation":"'Meri Samiti Mera Patal' was launched by RICM Chandigarh under NCCT to empower and modernize Primary Agricultural Credit Societies (PACS) via digital profiles and centralized data — implemented specifically in Punjab, Haryana, HP, J&K, Delhi, Chandigarh and Leh-Ladakh, not all of India."},{"id":179,"topic":"Mission Golden Spice","type":"figure-recall","difficulty":"moderate","question":"Mission 'Golden Spice', launched for Meghalaya's Lakadong Turmeric, has what financial outlay and covers which GI-tagged product?","options":["₹250 crore, for Naga Chilli, a GI-tagged product of Nagaland","₹100 crore, for Lakadong Turmeric, not yet GI-tagged","₹175.45 crore, for Sikkim Large Cardamom","₹175.45 crore, for Lakadong Turmeric, a GI-tagged product of Meghalaya","₹200 crore, for Assam's Tezpur Litchi"],"correct":3,"explanation":"Mission Golden Spice is a ₹175.45-crore initiative for the 'Integrated Lakadong Turmeric Value Chain Enhancement Project' — Lakadong Turmeric being a GI-tagged product of Meghalaya."},{"id":180,"topic":"One-Liners","type":"numbered-combo","difficulty":"hard","context":"Regarding select scheme one-liners from the chapter, consider the following statements:","statements":["1. Under Section 16 of the VB-G RAM G Act, 2025, every Gram Panchayat must prepare a Viksit Gram Panchayat Plan (VGPP) through participatory planning.","2. 'Yuktdhara' is a GIS-based planning support tool assisting VGPP preparation.","3. The National Forensic Infrastructure Enhancement Scheme (NFIES) has a financial outlay of ₹2,254.43 crore for FY 2024-25 to 2028-29.","4. The PM E-DRIVE Scheme has an outlay of ₹15,000 crore for the period 1.4.2024 to 31.3.2028."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","3 and 4","4 only"],"correct":4,"explanation":"The PM E-DRIVE Scheme (PM Electric Drive Revolution in Innovative Vehicle Enhancement) has an outlay of ₹10,900 crore (not ₹15,000 crore) for the same period. Statements 1, 2 and 3 are correct."},{"id":181,"topic":"One-Liners","type":"figure-recall","difficulty":"moderate","question":"The Scheme to Promote Manufacturing of Sintered Rare Earth Permanent Magnet (REPM), notified by the Ministry of Heavy Industries, has what financial outlay and manufacturing capacity target?","options":["₹7,280 crore outlay; target of 6,000 MTPA of sintered REPM manufacturing capacity","₹5,000 crore outlay; target of 4,000 MTPA","₹10,000 crore outlay; target of 8,000 MTPA","₹7,280 crore outlay; target of 10,000 MTPA","₹3,500 crore outlay; target of 6,000 MTPA"],"correct":0,"explanation":"The REPM scheme has a financial outlay of ₹7,280 crore, targeting 6,000 Metric Tons Per Annum (MTPA) of sintered Rare Earth Permanent Magnet manufacturing capacity in India."},{"id":182,"topic":"Schemes in News","type":"not-among","difficulty":"moderate","statements":["1. NAMASTE","2. PM Matru Vandana Yojana","3. PM Vishwakarma Yojana","4. PM-YASASVVI","5. PM Kaushal Vridhi Yojana (PMKVY-Plus)"],"question":"Which one of the following was NOT listed among the schemes featured in the 'Schemes in News' round-up of the chapter?","options":["NAMASTE","PM Kaushal Vridhi Yojana (PMKVY-Plus)","PM Matru Vandana Yojana","PM Vishwakarma Yojana","PM-YASASVVI"],"correct":1,"explanation":"'PM Kaushal Vridhi Yojana (PMKVY-Plus)' is fabricated and does not appear in the chapter's 'Schemes in News' list, which includes NAMASTE, PM Matru Vandana Yojana, PM Vishwakarma Yojana, and PM-YASASVVI among others."},{"id":183,"topic":"Telecom Network Survey","type":"correct-statement","difficulty":"moderate","question":"Which one of the following statements about the Telecom Network Performance Survey is correct?","options":["The survey is being conducted solely by TRAI without DoP involvement","The survey covers only urban areas with over 1 lakh population","DoP and TRAI signed an MoU to conduct a nationwide app-based survey assessing mobile network performance of Airtel, Jio, Vodafone Idea and BSNL across over 5.68 lakh villages","It assesses network performance of only two operators: Jio and Airtel","The survey covers around 2 lakh villages"],"correct":2,"explanation":"The Department of Posts (DoP) and TRAI signed an MoU for a nationwide app-based survey covering Bharti Airtel, Reliance Jio, Vodafone Idea and BSNL across over 5.68 lakh villages."},{"id":184,"topic":"UNCTAD Consumer Protection","type":"numbered-combo","difficulty":"hard","context":"Regarding India's chairing of UNCTAD's Ninth Session on Consumer Protection, consider the following statements:","statements":["1. India will chair the Ninth Session of the Intergovernmental Group of Experts (IGE) on Consumer Protection Law and Policy at Geneva, Switzerland.","2. The IGE is constituted under the United Nations Guidelines for Consumer Protection.","3. The UN Principles for Consumer Product Safety were adopted by the UN General Assembly in December 2025.","4. UNCTAD stands for the United Nations Council on Trade and Development."],"question":"Which of the above statements is/are incorrect?","options":["1 only","2 only","3 only","4 only","1 and 4"],"correct":3,"explanation":"UNCTAD stands for the United Nations Trade and Development (formerly Conference on Trade and Development), not 'Council on Trade and Development'. Statements 1, 2 and 3 are correct."},{"id":185,"topic":"ICMR e-Governance","type":"figure-recall","difficulty":"moderate","question":"ICMR-MINDS won a Gold Award at the National Awards for e-Governance 2026 under which category, and how many states is it implemented across?","options":["Category 1 (Best Digital Health Initiative); implemented across 10 states","Category 3 (Citizen Engagement); implemented across 5 states","Category 2; implemented across 15 states","Category 4 (Best Use of Blockchain); implemented across 7 states","Category 2 (Innovation by Use of AI and Other New Age Technologies); implemented across 7 states through 7 collaborating institutions"],"correct":4,"explanation":"ICMR-MINDS won Gold under Category 2 — Innovation by Use of AI and Other New Age Technologies for Providing Citizen-Centric Services — and is implemented across 7 states through 7 collaborating institutions."},{"id":186,"topic":"Refinery Complex","type":"figure-recall","difficulty":"moderate","question":"India's
