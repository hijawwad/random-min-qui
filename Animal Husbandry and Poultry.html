let flat = [];
QUIZ.forEach(topic => {
  topic.questions.forEach((q, i) => {

  });
});

let state = {
  idx: -1,
  score: 0,
  answered: [],
  showingTopicDivider: false,
  currentTopic: null
};

const app = document.getElementById('app');

function renderIntro(){
  app.innerHTML = `
    <div class="intro">
      <h1>NABARD Grade A Practice Quiz</h1>
      <p><b>Subject:</b> Animal Husbandry and Poultry</p>
      <p>${flat.length} questions across ${QUIZ.length} topics, organized part-wise and section-wise, in NABARD exam style (5 options, A-E). Answer distribution is spread evenly across A-E. Click an option to get instant feedback and an explanation, then move to the next question. A full review of any missed questions appears at the end.</p>
      <button class="startbtn" onclick="startQuiz()">Start quiz →</button>
    </div>
  `;
}

function startQuiz(){
  state.idx = 0;
  render();
}

function currentQ(){ return flat[state.idx]; }

function render(){
  if(state.idx >= flat.length){ renderResults(); return; }
  const q = currentQ();
  const answeredRec = state.answered[state.idx];
  const pct = Math.round((state.idx/flat.length)*100);

  let topicDividerHtml = '';
  if(q.firstInTopic){
    topicDividerHtml = `
      <div class="topic-divider">
        <div class="tname">${q.topic}</div>
        <div class="tmeta">${q.part} · ${q.topicTotal} question${q.topicTotal>1?'s':''} in this section</div>
      </div>`;
  }

  let optionsHtml = '';
  const letters = ['A','B','C','D','E'];
  letters.forEach(L => {
    let cls = 'opt';
    if(answeredRec){
      if(L === q.correct) cls += ' correct locked';
      else if(L === answeredRec.picked) cls += ' wrong locked';
      else cls += ' locked';
    }
    optionsHtml += `<div class="${cls}" onclick="pick('${L}')">
      <div class="letter">${L}</div>
      <div>${q.options[L]}</div>
    </div>`;
  });

  let explainHtml = '';
  if(answeredRec){
    const correctness = answeredRec.picked === q.correct ? 'Correct!' : 'Not quite.';
    explainHtml = `<div class="explain show"><b>${correctness}</b> Correct answer: <b>${q.correct}</b>. ${q.explanation}</div>`;
  }

  app.innerHTML = `
    <div class="header">
      <div class="scorebar">
        <span>Question ${state.idx+1} of ${flat.length}</span>
        <span>Score: <b>${state.score}</b> / ${state.answered.filter(a=>a).length}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    ${topicDividerHtml}
    <div class="labels">
      <span class="pill part">${q.part.replace('Part I: ','Part I · ')}</span>
      <span class="pill topic">${q.topic}</span>
    </div>
    <div class="card">
      <div class="qnum">Question ${state.idx+1}</div>
      <div class="qtext">${q.question}</div>
      <div class="options">${optionsHtml}</div>
      ${explainHtml}
      <div class="footer-row">
        <span class="diff">Difficulty: ${q.difficulty==='E'?'Easy':q.difficulty==='M'?'Moderate':'Hard'}</span>
        <button class="next ${answeredRec ? 'show':''}" onclick="nextQ()">${state.idx===flat.length-1?'See results':'Next question'} →</button>
      </div>
    </div>
  `;
}

function pick(letter){
  if(state.answered[state.idx]) return;
  const q = currentQ();
  const correct = letter === q.correct;
  state.answered[state.idx] = {picked: letter, correct: correct};
  if(correct) state.score++;
  render();
}

function nextQ(){
  state.idx++;
  render();
}

function renderResults(){
  const total = flat.length;
  const correct = state.score;
  const pct = Math.round((correct/total)*100);
  const missed = flat.map((q,i)=>({q,i})).filter(x => state.answered[x.i] && !state.answered[x.i].correct);

  let missedHtml = '';
  if(missed.length === 0){
    missedHtml = `<p style="color:var(--accent-text); font-weight:600;">Perfect score — nothing missed. Excellent preparation.</p>`;
  } else {
    missed.forEach(({q,i}) => {
      const picked = state.answered[i].picked;
      missedHtml += `
        <div class="review-item">
          <div class="rq">${q.topic}: ${q.question}</div>
          <div class="ra wrong">Your answer: ${picked}. ${q.options[picked]}</div>
          <div class="ra correct">Correct answer: ${q.correct}. ${q.options[q.correct]}</div>
          <div class="rexp">${q.explanation}</div>
        </div>`;
    });
  }

  app.innerHTML = `
    <div class="results">
      <h1 style="font-size:22px; margin:0 0 4px;">Quiz complete</h1>
      <p style="color:var(--text-secondary); font-size:14px;">Animal Husbandry and Poultry — full run</p>
      <div class="big-score">${correct} / ${total}</div>
      <div class="stat-row">
        <div class="stat"><div class="num">${pct}%</div><div class="lbl">Accuracy</div></div>
        <div class="stat"><div class="num">${missed.length}</div><div class="lbl">Missed</div></div>
        <div class="stat"><div class="num">${QUIZ.length}</div><div class="lbl">Topics covered</div></div>
      </div>
      <h2 style="font-size:17px; margin:20px 0 10px;">Review: missed questions</h2>
      ${missedHtml}
      <button class="restart" onclick="restart()">Restart quiz</button>
    </div>
  `;
}

function restart(){
  state = {idx:-1, score:0, answered:[], showingTopicDivider:false, currentTopic:null};
  renderIntro();
}

renderIntro();
</script>
</body>
</html>
