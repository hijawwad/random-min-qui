Which region's sheep breed, Nellore, is noted as the tallest sheep breed in the southern region table?", "options": {"A": "Himalayan region (J&K)", "B": "Eastern region (UP)", "C": "Western region (Rajasthan)", "D": "Southern region (Andhra Pradesh)", "E": "Northern plains"}, "correct": "D", "explanation": "The regional table lists Nellore under the Southern region (Andhra Pradesh) and describes it as the tallest breed.", "difficulty": "M"}, {"id": 90, "question": "Magra sheep, also known as Bikaneri Chokhla, is notable for producing:", "options": {"A": "Black wool", "B": "Mutton primarily", "C": "Coarse fleece unsuitable for carpets", "D": "Pashmina-grade wool", "E": "Lustrous, extremely white carpet-quality wool"}, "correct": "E", "explanation": "The notes describe Magra as the only lustrous carpet-wool producing breed, with extremely white and lustrous fleeces.", "difficulty": "H"}]}, {"topic": "8. Pig Breeds", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 91, "question": "Which pig breed listed in the notes is distributed in England only, distinct from breeds shared with India?", "options": {"A": "Tamworth", "B": "Berkshire (also England, but check distribution)", "C": "Large White Yorkshire", "D": "Landrace", "E": "Middle White Yorkshire"}, "correct": "A", "explanation": "The pig breeds table lists Tamworth's distribution as England, unlike Large White/Middle White Yorkshire which are distributed in both England and India.", "difficulty": "M"}, {"id": 92, "question": "Which pig breed listed in the notes originates from Denmark?", "options": {"A": "Large White Yorkshire", "B": "Landrace", "C": "Tamworth", "D": "Essex Saddleback", "E": "Berkshire"}, "correct": "B", "explanation": "The pig breeds table lists Landrace as originating from Denmark.", "difficulty": "M"}, {"id": 93, "question": "Large White Yorkshire and Middle White Yorkshire pig breeds are distributed in which two countries as per the notes?", "options": {"A": "Netherlands and India", "B": "India and Pakistan", "C": "England and India", "D": "Denmark and India", "E": "England and Denmark"}, "correct": "C", "explanation": "The notes list both Large White Yorkshire and Middle White Yorkshire as distributed in England and India.", "difficulty": "M"}]}, {"topic": "9. Feeding of Livestock & Rationing", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 94, "question": "Per the thumb rule, breeding bulls in active service should receive how much extra concentrate per day?", "options": {"A": "2 Kg", "B": "2.5 Kg", "C": "1.5 Kg", "D": "1 Kg", "E": "0.5 Kg"}, "correct": "D", "explanation": "The notes state breeding bulls in service should get 1 Kg per day extra concentrate to maintain good health and sex libido.", "difficulty": "H"}, {"id": 95, "question": "Maintenance ration is typically given to which category of animals, per the notes?", "options": {"A": "Pregnant animals in the last quarter only", "B": "Growing calves only", "C": "Lactating animals only", "D": "Breeding bulls only", "E": "Dry, non-producing animals"}, "correct": "E", "explanation": "The notes describe maintenance ration as the minimum allowance given usually to dry, non-producing animals to carry out essential body processes without weight gain or loss.", "difficulty": "M"}, {"id": 96, "question": "As per the thumb rule for cattle feeding, the average dry matter (DM) requirement of a lactating desi cow is:", "options": {"A": "2.5 Kg per 100 Kg body weight/day", "B": "2 Kg per 100 Kg body weight/day", "C": "1.5 Kg per 100 Kg body weight/day", "D": "3 Kg per 100 Kg body weight/day", "E": "1 Kg per 100 Kg body weight/day"}, "correct": "A", "explanation": "The notes state the DM requirement is 2 (dry) to 2.5 (lactating) Kg/100 Kg body weight/day for desi cows.", "difficulty": "H"}, {"id": 97, "question": "A 'ration' is defined in the notes as the feed allowance given to an animal over what time period?", "options": {"A": "1 month", "B": "24 hours", "C": "1 week", "D": "12 hours", "E": "48 hours"}, "correct": "B", "explanation": "The notes define ration as the allowance of feed given to the animal for a period of 24 hours.", "difficulty": "E"}, {"id": 98, "question": "Which of the following is NOT listed as a desirable characteristic of a good/balanced ration?", "options": {"A": "Ration should include variety of feed stuffs", "B": "Ration should satisfy total dry matter requirement", "C": "Ration should be composed of a single feedstuff for consistency", "D": "Ration should be economical", "E": "Ration should include sufficient green fodder, preferably legumes"}, "correct": "C", "explanation": "The notes explicitly recommend a variety of feedstuffs for better nutrient composition \u2014 not a single feedstuff.", "difficulty": "M"}, {"id": 99, "question": "Feed accounts for approximately what percentage of the total cost of animal rearing, per the notes?", "options": {"A": "10\u201320%", "B": "40\u201350%", "C": "20\u201330%", "D": "60\u201370%", "E": "80\u201390%"}, "correct": "D", "explanation": "The notes state ration should be economical since feed accounts for about 60\u201370% of the cost of animal rearing.", "difficulty": "M"}, {"id": 100, "question": "As per the thumb rule, roughly what fraction of dry matter requirement should come from dry fodder versus green fodder?", "options": {"A": "Half and half", "B": "All from green fodder", "C": "1/3 from dry fodder and 2/3 from green fodder", "D": "All from dry fodder", "E": "About 2/3 from dry fodder and 1/3 from green fodder"}, "correct": "E", "explanation": "The notes state roughage requirement is fulfilled with about 2/3 of DM through dry fodder and the remaining 1/3 from green fodder.", "difficulty": "H"}, {"id": 101, "question": "As per the thumb rule, pregnant cows/buffaloes should receive how much extra concentrate per day during advanced pregnancy?", "options": {"A": "1.5 Kg", "B": "0.5 Kg", "C": "2.5 Kg", "D": "1 Kg", "E": "2 Kg"}, "correct": "A", "explanation": "The notes specify 1.5 Kg per day extra concentrate allowance during advanced pregnancy to meet the extra nutrient needs of foetal growth.", "difficulty": "H"}, {"id": 102, "question": "Cattle and buffaloes are classified as ruminants primarily because they:", "options": {"A": "Digest food only in the small intestine", "B": "Utilize micro-organisms in the rumen to digest feed", "C": "Cannot digest cellulose at all", "D": "Have a single-chambered stomach", "E": "Do not chew their cud"}, "correct": "B", "explanation": "The notes define ruminants as animals that utilize micro-organisms in the rumen to digest feed, allowing conversion of cellulose to milk and meat.", "difficulty": "E"}, {"id": 103, "question": "According to the thumb rule, a lactating cow should be given how much additional concentrate for every 3 Kg of milk produced?", "options": {"A": "1.5 Kg", "B": "2 Kg", "C": "1 Kg", "D": "2.5 Kg", "E": "0.5 Kg"}, "correct": "C", "explanation": "The notes specify 1 Kg additional concentrate for every 2.5 Kg (buffalo) to 3 Kg (cow) of milk produced.", "difficulty": "H"}, {"id": 104, "question": "Which type of ration is given to a pregnant animal during the last quarter of pregnancy in addition to maintenance ration?", "options": {"A": "Maintenance ration", "B": "Production ration", "C": "Starter ration", "D": "Gestation/Pregnancy ration", "E": "Balanced ration"}, "correct": "D", "explanation": "The notes describe Gestation or Pregnancy Ration as the additional allowance given during the last quarter of pregnancy for foetal growth.", "difficulty": "M"}]}, {"topic": "10. Feeds, Fodders & Processing", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 105, "question": "Soaking of straw in water is beneficial mainly because it removes which compound, improving nutritive value?", "options": {"A": "Nitrates", "B": "Silica", "C": "Tannins", "D": "Lignin", "E": "Oxalates"}, "correct": "E", "explanation": "The notes state soaking of straw removes some oxalates and softens coarse feed material, improving nutritive value.", "difficulty": "H"}, {"id": 106, "question": "Which of the following is classified as a 'production type' roughage based on Digestible Crude Protein content?", "options": {"A": "Berseem and Lucerne", "B": "Green maize and Oat", "C": "Straw and Kadbi", "D": "Wheat straw", "E": "Rice husk"}, "correct": "A", "explanation": "The notes classify production-type roughages (more than 5% DCP) as e.g. Berseem and Lucerne.", "difficulty": "H"}, {"id": 107, "question": "Which of the following is an advantage of Lucerne (Alfalfa) as a roughage, per the notes?", "options": {"A": "Highest energy content among all roughages", "B": "Elevated calcium, vitamin E and carotene content", "C": "Zero protein content", "D": "Lowest moisture content among green fodders", "E": "Contains anti-nutritional compounds only"}, "correct": "B", "explanation": "The notes state Lucerne contains an elevated amount of calcium, vitamin E and carotene, of major importance for milk production.", "difficulty": "M"}, {"id": 108, "question": "Dry roughages, such as straw, hay and kadbi, typically contain approximately what percentage of moisture?", "options": {"A": "60\u201390 percent", "B": "50\u201360 percent", "C": "10\u201315 percent", "D": "30\u201340 percent", "E": "less than 5 percent"}, "correct": "C", "explanation": "The notes state dry roughages contain about 10-15 percent moisture, compared to green/succulent roughages at 60-90 percent.", "difficulty": "M"}, {"id": 109, "question": "Urea treatment of poor-quality roughage involves treating straw with what percentage of urea?", "options": {"A": "10\u201315 percent", "B": "5\u201310 percent", "C": "15\u201320 percent", "D": "1\u20133 percent", "E": "0.5 percent"}, "correct": "D", "explanation": "The notes state poor quality roughages are treated with 1-3 percent urea, with moisture kept at 50% level, stacked for 20-30 days.", "difficulty": "H"}, {"id": 110, "question": "Legume roughages may have a crude protein content of approximately:", "options": {"A": "3\u20134%", "B": "less than 5%", "C": "60% or more", "D": "10\u201312%", "E": "20% or more"}, "correct": "E", "explanation": "The notes state legumes may have 20% or more crude protein content, in contrast to straw's 3-4%.", "difficulty": "M"}, {"id": 111, "question": "Which feed additive category includes examples like Terramycin and Zinc bacitracin?", "options": {"A": "Antibiotics", "B": "Probiotics", "C": "Mold inhibitors", "D": "Antioxidants", "E": "Enzymes"}, "correct": "A", "explanation": "The notes list Terramycin, Zinc bacitracin, and Flavomycin as examples of antibiotic feed additives.", "difficulty": "M"}, {"id": 112, "question": "Roughages are defined as feedstuffs containing more than what percentage of crude fibre?", "options": {"A": "25 percent", "B": "18 percent", "C": "10 percent", "D": "5 percent", "E": "30 percent"}, "correct": "B", "explanation": "The notes define roughages as feedstuffs containing more than 18 percent crude fibre and less than 60 percent TDN.", "difficulty": "M"}, {"id": 113, "question": "Which of the following is an example of a protein-rich concentrate of animal origin?", "options": {"A": "Brewer's grains", "B": "Oilseed cake", "C": "Fish meal", "D": "Cereal grains", "E": "Roots and tubers"}, "correct": "C", "explanation": "The notes list Fish meal, Meat meal, and Blood meal as protein-rich concentrates of animal origin.", "difficulty": "M"}, {"id": 114, "question": "Green/succulent roughages contain approximately what percentage of moisture?", "options": {"A": "10\u201315 percent", "B": "20\u201330 percent", "C": "40\u201350 percent", "D": "60\u201390 percent", "E": "90\u2013100 percent"}, "correct": "D", "explanation": "The notes state green/succulent roughages contain about 60-90 percent moisture, e.g. pastures and silages.", "difficulty": "M"}, {"id": 115, "question": "Which processing method for feed specifically involves cutting roughages, especially fodder crops, into smaller size pieces to minimize wastage?", "options": {"A": "Grinding", "B": "Soaking", "C": "Pelleting", "D": "Alkali treatment", "E": "Chaffing"}, "correct": "E", "explanation": "The notes define chaffing as the process of cutting roughages/fodder crops into smaller pieces, minimizing fodder wastage.", "difficulty": "E"}, {"id": 116, "question": "Which of the following is NOT correct regarding feed additive categories?", "options": {"A": "Probiotics examples include Vitamin E and BHT", "B": "Antioxidant examples include Vitamin E and BHT", "C": "Probiotic examples include Lactobacillus", "D": "Mold inhibitor examples include propionic and acetic acid", "E": "Coccidiostats examples include Amprolsol and Furasol powder"}, "correct": "A", "explanation": "Vitamin E and BHT are listed under Antioxidants, not Probiotics; Probiotics examples given are microbial species like Lactobacillus.", "difficulty": "H"}, {"id": 117, "question": "Concentrates are defined as feedstuffs containing more than what percentage of Total Digestible Nutrients (TDN)?", "options": {"A": "50 percent", "B": "60 percent", "C": "40 percent", "D": "80 percent", "E": "18 percent"}, "correct": "B", "explanation": "The notes define concentrates as feedstuffs with less than 18% crude fibre and more than 60% TDN.", "difficulty": "M"}, {"id": 118, "question": "Alkali treatment of cereal straw commonly uses NaOH at what concentration?", "options": {"A": "1 percent", "B": "10 percent", "C": "3.3 percent", "D": "5.5 percent (this figure applies to CaOH)", "E": "0.5 percent"}, "correct": "C", "explanation": "The notes specify alkali treatment with 3.3 percent NaOH at 1 litre/kg of chaffed straw, or alternatively 5.5 percent CaOH.", "difficulty": "H"}, {"id": 119, "question": "Formaldehyde treatment of protein-rich concentrates is typically given at what rate?", "options": {"A": "10 ml per 100 gm oil cake", "B": "1 ml per 100 gm oil cake", "C": "2 ml per kg oil cake", "D": "5 ml per 100 gm crude protein of oil cake", "E": "50 ml per kg oil cake"}, "correct": "D", "explanation": "The notes specify formaldehyde treatment at 5ml/100gm of crude protein of oil cake, or alternatively 3 percent tannic acid.", "difficulty": "H"}, {"id": 120, "question": "Which of the following is an example of a mineral feed supplement mentioned in the notes?", "options": {"A": "Propionic acid", "B": "Amprolsol powder", "C": "Rovimix", "D": "Terramycin", "E": "Minimix"}, "correct": "E", "explanation": "The notes list Minimix, Milk min, Nutrimilk and Aromin as examples of mineral supplements; Rovimix is a vitamin supplement example.", "difficulty": "H"}]}, {"topic": "11. Breeding Systems in Livestock", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 121, "question": "In systematic crossbreeding, a back cross (AB) where F1 females are crossed back to one of the parent breeds exploits which effect?", "options": {"A": "Maternal heterosis", "B": "Grading up inheritance", "C": "Paternal heterosis only", "D": "Species hybridization vigour", "E": "Line breeding uniformity"}, "correct": "A", "explanation": "The notes state back crossing (F1 females back-crossed to a parent breed) exploits maternal heterosis.", "difficulty": "H"}, {"id": 122, "question": "Mating of Jack (male ass) with Mare (female horse) to produce a Mule is an example of:", "options": {"A": "Line breeding", "B": "Species hybridization", "C": "Cross breeding", "D": "Out crossing", "E": "Grading up"}, "correct": "B", "explanation": "The notes classify Jack \u00d7 Mare (producing a Mule) as species hybridization \u2014 mating animals of two different species.", "difficulty": "M"}, {"id": 123, "question": "Mating of unrelated purebred animals within the same breed (e.g. unrelated Deoni sire \u00d7 Deoni cow) is called:", "options": {"A": "Close breeding", "B": "Species hybridization", "C": "Out crossing", "D": "Grading up", "E": "Cross breeding"}, "correct": "C", "explanation": "The notes define out crossing as mating of unrelated purebred animals within the same breed for genetic improvement.", "difficulty": "M"}, {"id": 124, "question": "A single two-way cross, where two different breeds are crossed to produce an F1 useful for production but not breeding, is called:", "options": {"A": "Three-way cross", "B": "Criss crossing", "C": "Back cross", "D": "Single cross", "E": "Double cross"}, "correct": "D", "explanation": "The notes describe a single two-way cross (single cross) as crossing two different breeds to produce an F1 useful for production, not breeding.", "difficulty": "M"}, {"id": 125, "question": "Repeated mating of a purebred sire with non-descript females over generations, aiming for near-total inheritance of the sire's breed, is called:", "options": {"A": "Out crossing", "B": "Species hybridization", "C": "Close breeding", "D": "Line breeding", "E": "Grading up"}, "correct": "E", "explanation": "The notes describe grading up as mating a purebred sire with non-descript females over generations until 98-99% inheritance of the original breed is reached.", "difficulty": "M"}, {"id": 126, "question": "In a three-way rotational crossbreeding system commercially used in the pig industry, what is primarily maintained without needing purebred populations?", "options": {"A": "A high degree of heterozygosity, using frozen semen/sire", "B": "Only maternal lines", "C": "Pure lines through inbreeding", "D": "Only F1 hybrids", "E": "Complete homozygosity"}, "correct": "A", "explanation": "The notes state three-way rotational crossing maintains high heterozygosity and can use frozen semen/sire without maintaining a purebred population.", "difficulty": "H"}, {"id": 127, "question": "In a double cross (four-way cross) breeding programme, the resulting F2 progeny carries approximately what percentage of genes from each of the four breeds involved?", "options": {"A": "50%", "B": "25%", "C": "12.5%", "D": "75%", "E": "10%"}, "correct": "B", "explanation": "The notes describe the double/four-way cross as combining genes so that F2 progeny carries 25% of genes from each of the four different breeds.", "difficulty": "H"}, {"id": 128, "question": "Mating of a grandson with a granddaughter or half-brother with half-sister is an example of:", "options": {"A": "Close breeding", "B": "Out crossing", "C": "Line breeding", "D": "Grading up", "E": "Species hybridization"}, "correct": "C", "explanation": "The notes define line breeding as mating of distinctly (more distantly) related animals like grandson and grand-dam, promoting uniformity.", "difficulty": "M"}, {"id": 129, "question": "What is a key advantage of Artificial Insemination (AI) mentioned in the notes?", "options": {"A": "It is inexpensive compared to natural mating", "B": "It increases market value of bulls", "C": "It requires no special training", "D": "It reduces the number of bulls required for breeding purposes", "E": "It has no risk of genetic abnormalities"}, "correct": "D", "explanation": "The notes list reduced bull requirement as an advantage; AI actually requires trained operators, is costly, and can increase incidence of genetic abnormalities (a stated limitation).", "difficulty": "M"}, {"id": 130, "question": "Mating of a Holstein-Friesian sire with a Deoni cow is an example of which breeding system?", "options": {"A": "Grading up", "B": "Out crossing", "C": "Line breeding", "D": "Close breeding", "E": "Cross breeding"}, "correct": "E", "explanation": "The notes give HF sire \u00d7 Deoni cow as an example of cross breeding \u2014 mating animals of different established breeds.", "difficulty": "E"}, {"id": 131, "question": "Embryo Transfer Technology involves injecting a sexually mature donor female with exogenous hormones to produce more ova, which are then transferred to which animals?", "options": {"A": "Synchronized surrogate mothers (recipients) of the same species", "B": "The same donor after re-implantation", "C": "A different species entirely", "D": "Male recipients for gestation", "E": "Only laboratory culture dishes permanently"}, "correct": "A", "explanation": "The notes describe embryo transfer as involving fertilized ova removed from a donor and transferred to synchronized surrogate recipients of the same species.", "difficulty": "M"}, {"id": 132, "question": "Mating of closely related animals such as dam and son, or full brother and sister, is called:", "options": {"A": "Line breeding", "B": "Close breeding", "C": "Cross breeding", "D": "Grading up", "E": "Out crossing"}, "correct": "B", "explanation": "The notes define close breeding as mating of closely related animals like dam and son or full siblings.", "difficulty": "M"}]}, {"topic": "12. Nutrient Deficiencies in Animals", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 133, "question": "Sodium chloride (salt) and potassium deficiencies in animals are particularly noticed during which conditions?", "options": {"A": "Excess mineral mixture supplementation", "B": "Cold weather stress only", "C": "Excessive emesis, diarrhoea and sweating", "D": "High-fibre diets only", "E": "Overfeeding of concentrates"}, "correct": "C", "explanation": "The notes state these deficiencies are noticed in animals fed rations not supplemented with salt, and especially during excessive emesis, diarrhoea and sweating.", "difficulty": "M"}, {"id": 134, "question": "Excess molybdenum intake in sheep during grazing can cause lambs to develop a condition known as:", "options": {"A": "Grass tetany", "B": "Osteoporosis", "C": "Steely wool", "D": "Sway back (copper-deficient nervous syndrome)", "E": "Goitre"}, "correct": "D", "explanation": "The notes describe how sheep grazing on molybdenum-rich grass give birth to lambs showing 'copper deficient nervous syndrome' known as sway back.", "difficulty": "H"}, {"id": 135, "question": "Zinc deficiency in sheep, especially when fed excessive calcium and phosphorus, is characterised by which symptom?", "options": {"A": "Steely wool with loss of crimp", "B": "Sway back in newborn lambs", "C": "Goitre (enlarged thyroid)", "D": "Progressive emaciation and anaemia", "E": "Loss of wool and thick wrinkled skin"}, "correct": "E", "explanation": "The notes state zinc deficiency in sheep causes loss of wool and thick, wrinkled skin, distinct from copper deficiency's 'steely wool'.", "difficulty": "H"}, {"id": 136, "question": "Grass Tetany, also called Grass Staggers, is caused by a deficiency of which mineral?", "options": {"A": "Magnesium", "B": "Phosphorus", "C": "Zinc", "D": "Calcium", "E": "Selenium"}, "correct": "A", "explanation": "The notes describe Grass Tetany as caused by magnesium deficiency, often occurring when animals switch from indoor feeding to outdoor grazing.", "difficulty": "M"}, {"id": 137, "question": "Which of the following is NOT correct regarding Secondary Hyperparathyroidism (SHPT)?", "options": {"A": "It is associated with high-phosphorus, low-calcium diets", "B": "It is caused by excess dietary calcium and low phosphorus", "C": "It involves excessive secretion of parathyroid hormone (PTH)", "D": "It is seen in patients with chronic kidney failure", "E": "It can occur from all-meat diets with no supplements"}, "correct": "B", "explanation": "SHPT is actually associated with high-phosphorus, low-calcium diets (and hypocalcemia), not excess calcium with low phosphorus.", "difficulty": "H"}, {"id": 138, "question": "Cobalt deficiency in ruminants primarily manifests as which symptom, per the notes?", "options": {"A": "Loss of wool and thick wrinkled skin", "B": "Steely wool", "C": "Anaemia with progressive emaciation", "D": "Enlarged thyroid (goitre)", "E": "Rickets"}, "correct": "C", "explanation": "The notes describe cobalt deficiency causing anemia, loss of appetite, progressive emaciation, rough hair coat and pale mucous membranes.", "difficulty": "M"}, {"id": 139, "question": "Which mineral deficiency in sheep causes the characteristic 'steely wool' condition?", "options": {"A": "Cobalt", "B": "Molybdenum", "C": "Iodine", "D": "Copper", "E": "Zinc"}, "correct": "D", "explanation": "The notes state copper deficiency causes 'steely wool' in affected sheep, where wool loses its crimp and colour.", "difficulty": "H"}, {"id": 140, "question": "Selenium deficiency in a herd is primarily associated with which outcome, per the notes?", "options": {"A": "Steely wool in sheep", "B": "Enlarged thyroid gland (goitre)", "C": "Sway back in lambs", "D": "Loss of wool and thick skin", "E": "Neonatal mortality and unthriftiness in weaner calves, lambs and goats"}, "correct": "E", "explanation": "The notes describe selenium deficiency as causing neonatal mortality and unthriftiness in weaner calves/lambs/goats, chronic diarrhoea in calves and infertility in adult cattle.", "difficulty": "H"}, {"id": 141, "question": "Enlargement of the thyroid gland (goitre) in cattle and buffaloes is associated with deficiency of:", "options": {"A": "Iodine", "B": "Zinc", "C": "Cobalt", "D": "Copper", "E": "Selenium"}, "correct": "A", "explanation": "The notes describe iodine deficiency causing goitre, particularly in sub-mountainous Himalayan areas of India.", "difficulty": "M"}, {"id": 142, "question": "Which of the following is a symptom of Vitamin A deficiency, per the notes?", "options": {"A": "Sway back in lambs", "B": "Night blindness", "C": "Steely wool", "D": "Goitre", "E": "Perosis"}, "correct": "B", "explanation": "The notes list night blindness (along with xerophthalmia, abortions, retained placentas) as a Vitamin A deficiency symptom.", "difficulty": "M"}, {"id": 143, "question": "Milk Fever, a metabolic disorder in dairy cows close to calving, is caused by low levels of which blood mineral?", "options": {"A": "Magnesium", "B": "Sodium", "C": "Calcium (hypocalcaemia)", "D": "Phosphorus", "E": "Potassium"}, "correct": "C", "explanation": "The notes define Milk Fever as caused by hypocalcaemia \u2014 a low blood calcium level.", "difficulty": "M"}]}, {"topic": "13. Vaccination Programmes \u2013 Sheep, Goat & Dairy Cattle", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 144, "question": "According to the goat vaccination programme, P.P.R. vaccine (primary) is given at what age, with what regular vaccination frequency?", "options": {"A": "3 months; once in a lifetime", "B": "4 months; twice yearly", "C": "1 week; annually", "D": "3 months and above; once in three years", "E": "6 months; annually"}, "correct": "D", "explanation": "The table lists P.P.R. primary vaccination at 3 months and above for kid/lamb, with regular vaccination once in three years.", "difficulty": "H"}, {"id": 145, "question": "For post-bite rabies therapy in dairy cattle, subsequent doses are given at which intervals after the first dose?", "options": {"A": "Once after 10 days only", "B": "Weekly for a month", "C": "Annually thereafter", "D": "Monthly for 6 months", "E": "4th day, then 7, 14, 28 and 90 days (optional)"}, "correct": "E", "explanation": "The notes specify booster on the 4th day and subsequent doses at 7, 14, 28 and 90 days (optional) after the first dose, given immediately after a suspected bite.", "difficulty": "H"}, {"id": 146, "question": "As per the dairy cattle vaccination programme, Anthrax vaccination is given from what age, with what regular schedule?", "options": {"A": "4 months and above; annually in endemic areas", "B": "4-8 months, female calves only; once in a lifetime", "C": "At birth; once in three years", "D": "3 months and above; six monthly", "E": "6 months and above; once in a lifetime"}, "correct": "A", "explanation": "The notes list Anthrax vaccination at 4 months and above, repeated annually in endemic areas.", "difficulty": "M"}, {"id": 147, "question": "Theileriosis vaccination in dairy cattle is specifically required for which category of animals?", "options": {"A": "All cattle regardless of breed", "B": "Crossbred and exotic cattle only", "C": "Only buffaloes", "D": "All indigenous cattle", "E": "Only male cattle"}, "correct": "B", "explanation": "The notes note Theileriosis vaccination (once in a lifetime) is required only for crossbred and exotic cattle, given at 3 months of age and above.", "difficulty": "H"}, {"id": 148, "question": "As per the vaccination schedule for goats, when is the primary vaccination for Enterotoxaemia given if the dam is NOT vaccinated?", "options": {"A": "At 6 months of age", "B": "At 1 year of age", "C": "At the age of the 1st week for kid or lamb", "D": "At 3 months of age", "E": "At 4 months of age"}, "correct": "C", "explanation": "The notes specify Enterotoxaemia primary vaccination at the 1st week of age if the dam is not vaccinated (versus 4 months if the dam is vaccinated).", "difficulty": "H"}, {"id": 149, "question": "Which disease's vaccine in the dairy cattle programme is noted as 'presently not produced in India'?", "options": {"A": "FMD", "B": "Anthrax", "C": "Brucellosis", "D": "IBR", "E": "Theileriosis"}, "correct": "D", "explanation": "The notes remark that the six-monthly IBR vaccine is 'presently not produced in India'.", "difficulty": "H"}, {"id": 150, "question": "How frequently is Foot and Mouth Disease (FMD) booster/subsequent vaccination given to dairy cattle?", "options": {"A": "Once in a lifetime", "B": "Monthly", "C": "Once in three years", "D": "Annually", "E": "Six monthly"}, "correct": "E", "explanation": "The dairy cattle vaccination table lists FMD subsequent dose as six-monthly, following the first dose at 4 months and booster 1 month later.", "difficulty": "M"}, {"id": 151, "question": "Black Quarter (BQ) vaccination in dairy cattle is given from what age and repeated how often in endemic areas?", "options": {"A": "6 months and above; annually", "B": "Birth; annually", "C": "8 months and above; once in three years", "D": "3 months and above; once in a lifetime", "E": "4 months and above; six monthly"}, "correct": "A", "explanation": "The notes list Black Quarter (BQ) vaccination from 6 months of age, repeated annually in endemic areas.", "difficulty": "M"}, {"id": 152, "question": "Haemorrhagic Septicaemia (H.S.) vaccination in dairy cattle, once given at 6 months and above, is repeated:", "options": {"A": "Once in three years", "B": "Annually in endemic areas", "C": "Monthly during monsoon", "D": "Once in a lifetime", "E": "Six monthly"}, "correct": "B", "explanation": "The dairy cattle vaccination schedule lists H.S. as repeated annually in endemic areas.", "difficulty": "M"}, {"id": 153, "question": "In the dairy cattle vaccination schedule, Brucellosis vaccination is given only to which group, at what age?", "options": {"A": "All calves, at birth", "B": "Female calves only, at 1 month", "C": "Female calves only, at 4\u20138 months of age", "D": "All cattle annually", "E": "Male calves only, at 6 months"}, "correct": "C", "explanation": "The notes state Brucellosis vaccination is given only to female calves, at 4-8 months of age, once in a lifetime.", "difficulty": "M"}]}, {"topic": "14. Poultry Classification & Breeds", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 154, "question": "Which of the following is NOT correctly matched (poultry class and origin)?", "options": {"A": "Orpington \u2014 England", "B": "Sussex \u2014 England", "C": "Leghorn \u2014 Italy", "D": "Cornish \u2014 developed in Italy", "E": "Australorp \u2014 Australia"}, "correct": "D", "explanation": "Cornish actually originates from Cornwall, UK (also known as Indian Game), not Italy.", "difficulty": "H"}, {"id": 155, "question": "Among commercially available broiler chickens in India, which breed is listed with the highest weight (2100 g) at seven weeks?", "options": {"A": "Varna", "B": "CARIBRO Naked Neck", "C": "CARIBRO Multicoloured", "D": "B-77", "E": "CARIBRO-91"}, "correct": "E", "explanation": "The commercial broiler table lists CARIBRO-91 with the highest weight of 2100 g at seven weeks.", "difficulty": "H"}, {"id": 156, "question": "Among commercial layer breeds in India, which is listed with the highest net egg production (290 eggs) at 72 weeks?", "options": {"A": "Priya", "B": "Golden-92", "C": "ILI-80", "D": "Sonali", "E": "Devendra"}, "correct": "A", "explanation": "The commercial layer breeds table lists Priya with the highest net egg production of 290 eggs at 72 weeks, first egg at 17-18 weeks.", "difficulty": "H"}, {"id": 157, "question": "The Wyandotte breed of poultry is distinguished by which comb type and average weight?", "options": {"A": "Pea comb; cock 5.4 kg, hen 4.3 kg", "B": "Rose comb; cock 4 kg, hen 3 kg", "C": "Strawberry comb; cock 4 kg, hen 3 kg", "D": "Buttercup comb; cock 4.5 kg, hen 3.5 kg", "E": "Single comb; cock 3.8 kg, hen 3 kg"}, "correct": "B", "explanation": "The notes describe Wyandotte as having a comparatively round body with a rose comb, average weight cock 4 kg and hen 3 kg.", "difficulty": "M"}, {"id": 158, "question": "Which poultry breed is described as the world's No.1 egg producer breed, weighing 2\u20132.7 kg at maturity?", "options": {"A": "Plymouth Rock", "B": "Rhode Island Red", "C": "Leghorn", "D": "Wyandotte", "E": "Minorca"}, "correct": "C", "explanation": "The Mediterranean class table describes Leghorn as the world's no. 1 egg-producing breed.", "difficulty": "M"}, {"id": 159, "question": "Delawares, the newest of the American poultry breeds, were developed by crossing which two breeds?", "options": {"A": "Leghorn male and Minorca female", "B": "Sussex male and Orpington female", "C": "Cochin male and Brahma female", "D": "Barred Plymouth Rock male and New Hampshire female", "E": "Rhode Island Red male and Wyandotte female"}, "correct": "D", "explanation": "The notes state Delawares were developed by crossing the barred Plymouth Rock male with the New Hampshire female.", "difficulty": "H"}, {"id": 160, "question": "Rhode Island Red, the most popular American breed, produces eggs of which shell colour?", "options": {"A": "White-shelled eggs", "B": "Blue-shelled eggs", "C": "Speckled eggs", "D": "Green-shelled eggs", "E": "Large brown-shelled eggs"}, "correct": "E", "explanation": "The notes state Rhode Island Red is a good layer producing large brown-shelled eggs.", "difficulty": "M"}, {"id": 161, "question": "The New Hampshire poultry breed was developed from the stock of which other breed?", "options": {"A": "Rhode Island Red", "B": "Cochin", "C": "Wyandotte", "D": "Plymouth Rock", "E": "Leghorn"}, "correct": "A", "explanation": "The notes state New Hampshire was developed from Rhode Island Red stock, named after the place of development.", "difficulty": "M"}, {"id": 162, "question": "Which poultry breed/class is also known as 'Indian Game' and is considered the source of most modern broiler breeds?", "options": {"A": "Leghorn", "B": "Cornish", "C": "Orpington", "D": "Australorp", "E": "Sussex"}, "correct": "B", "explanation": "The English class table describes Cornish as also known as Indian Game, from which most modern broiler chicken breeds were developed.", "difficulty": "M"}, {"id": 163, "question": "Which type of comb is unique to the Sicilian Buttercup breed among poultry?", "options": {"A": "Strawberry comb", "B": "Single comb", "C": "Buttercup comb", "D": "Rose comb", "E": "Pea comb"}, "correct": "C", "explanation": "The notes state the buttercup comb is found only in Sicilian Buttercup, the only breed with this comb type.", "difficulty": "H"}, {"id": 164, "question": "Which poultry breed originated in the Brahmaputra valley of India?", "options": {"A": "Langshan", "B": "Cochin", "C": "Leghorn", "D": "Brahma", "E": "Minorca"}, "correct": "D", "explanation": "The notes state Brahma originated from the Brahmaputra valley in India, while Cochin and Langshan are from China.", "difficulty": "M"}, {"id": 165, "question": "The American class of poultry breeds includes how many different breeds, per the notes, although a few are most popular?", "options": {"A": "Three", "B": "Twenty", "C": "Five", "D": "Fifteen", "E": "Eleven"}, "correct": "E", "explanation": "The notes state the American class includes eleven different breeds, though only a handful (Rhode Island Red, Wyandotte, etc.) are popular.", "difficulty": "H"}, {"id": 166, "question": "Minorca, from Spain, is also known by which alternative name?", "options": {"A": "Red-faced black Spanish", "B": "Shanghai", "C": "Betas", "D": "Star Cross", "E": "Jallikattu"}, "correct": "A", "explanation": "The notes note Minorca is also known as 'Red-faced black Spanish' and is the largest/heaviest Mediterranean breed.", "difficulty": "H"}, {"id": 167, "question": "Cochin chickens were historically also known by which name because of their origin?", "options": {"A": "Hunan", "B": "Shanghai", "C": "Canton", "D": "Beijing", "E": "Nanking"}, "correct": "B", "explanation": "The notes explain Cochin chickens, originating from China, were known as 'Shanghai' in the past.", "difficulty": "H"}, {"id": 168, "question": "Kadaknath, a poultry breed known for black flesh, is primarily bred and abundant in which state?", "options": {"A": "Rajasthan", "B": "Gujarat", "C": "Madhya Pradesh", "D": "Andhra Pradesh", "E": "Kerala"}, "correct": "C", "explanation": "The notes state Kadaknath is abundant in Madhya Pradesh and bred by tribals; its black colour is due to melanin.", "difficulty": "M"}, {"id": 169, "question": "Which poultry class was developed in the United States generally by crossing Mediterranean and Asiatic types?", "options": {"A": "English class", "B": "Mediterranean class", "C": "African class", "D": "American class", "E": "Asiatic class"}, "correct": "D", "explanation": "The notes describe the American class as developed in the US, generally by crossing Mediterranean and Asian types.", "difficulty": "M"}, {"id": 170, "question": "Which class of poultry breeds is characterized by large body, heavy bones, feathered shanks and yellow skin?", "options": {"A": "European class", "B": "English class", "C": "American class", "D": "Mediterranean class", "E": "Asiatic class"}, "correct": "E", "explanation": "The notes describe the Asiatic class (e.g. Brahma, Cochin, Langshan) as large-bodied with heavy bones, feathered shanks, red ear lobes, and yellow skin.", "difficulty": "M"}]}, {"topic": "15. Poultry Housing Systems", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 171, "question": "Which poultry housing system is described as providing a floor area of about 450\u2013525 sq. cm per bird and is called a 'super intensive system'?", "options": {"A": "Cage system", "B": "Elevated cage system", "C": "Free range system", "D": "Battery cage system (identical floor space)", "E": "Deep litter system"}, "correct": "A", "explanation": "The notes describe the cage system as super intensive, providing 450-525 sq.cm (0.6-0.75 sq. ft.) of floor area per bird.", "difficulty": "M"}, {"id": 172, "question": "In the deep litter system, litter material is typically maintained at what depth?", "options": {"A": "10 to 12 inches", "B": "3 to 5 inches", "C": "6 to 8 inches", "D": "Less than 1 inch", "E": "1 to 2 inches"}, "correct": "B", "explanation": "The notes specify birds are kept on litter material about 3 to 5 inches in depth in the deep litter system.", "difficulty": "M"}, {"id": 173, "question": "What is the recommended minimum distance between the chick shed and the grower shed in a poultry farm layout?", "options": {"A": "200\u2013300 feet", "B": "10\u201320 feet", "C": "50\u2013100 feet", "D": "500 feet", "E": "5\u201310 feet"}, "correct": "C", "explanation": "The notes specify a minimum distance of 50-100 feet between chick and grower sheds to help prevent disease spread.", "difficulty": "H"}, {"id": 174, "question": "In the Elevated Cage system, what is the total height range of the poultry house?", "options": {"A": "6\u20137 feet", "B": "10\u201315 feet", "C": "30\u201333 feet (this is the width, not height)", "D": "20\u201325 feet", "E": "40\u201350 feet"}, "correct": "D", "explanation": "The notes state the total height of the elevated cage house is 20-25 feet, while the width is 30-33 feet.", "difficulty": "H"}, {"id": 175, "question": "What is the recommended minimum distance between the grower shed and the layer shed in a poultry farm layout?", "options": {"A": "10 metres", "B": "500 metres", "C": "50 feet", "D": "25 feet", "E": "100 metres"}, "correct": "E", "explanation": "The notes specify the distance between grower and layer sheds should be a minimum of 100 metres.", "difficulty": "H"}, {"id": 176, "question": "Which of the following is a key disadvantage of the deep litter system, per the notes?", "options": {"A": "Bacterial and parasitic disease risk due to direct bird-litter contact", "B": "Higher initial investment than cage system", "C": "Increased incidence of blood spots in eggs", "D": "High cost of cage installation", "E": "Reduced availability of Vitamin B2 and B12"}, "correct": "A", "explanation": "The notes list disease risk from direct contact between bird and litter as a disadvantage of the deep litter system.", "difficulty": "M"}, {"id": 177, "question": "What is the recommended poultry house temperature for broilers during the first week, per the management practices notes?", "options": {"A": "70\u00b0F", "B": "95\u00b0F", "C": "100\u00b0F", "D": "60\u00b0F", "E": "85\u00b0F"}, "correct": "B", "explanation": "The notes specify 95\u00b0F is comfortable during the 1st week, reduced by 5\u00b0F weekly until reaching 70\u00b0F in the 6th week.", "difficulty": "H"}, {"id": 178, "question": "In poultry housing layout, where should the disposal pit and sick room ideally be located?", "options": {"A": "Near the main entrance", "B": "Adjacent to the egg store room", "C": "At the extreme end of the site", "D": "Between the brooder and grower sheds", "E": "Next to the feed store room"}, "correct": "C", "explanation": "The notes specify that the disposal pit and sick room should be constructed only at the extreme end of the site.", "difficulty": "M"}, {"id": 179, "question": "In the Battery Cage system, what is the usual floor space and height per hen, as described in the notes?", "options": {"A": "20 x 20 inches, 24 inches height", "B": "10 x 10 inches, 12 inches height", "C": "30 x 30 inches, 20 inches height", "D": "14 x 16 inches floor space, 17 inches height", "E": "450-525 sq.cm, 25 inches height"}, "correct": "D", "explanation": "The notes specify the usual battery cage floor space is 14 x 16 inches with a height of 17 inches per hen.", "difficulty": "H"}, {"id": 180, "question": "The floor space requirement for broilers in cages (per bird) is what fraction of the floor space needed in deep litter?", "options": {"A": "25 percent", "B": "75 percent", "C": "10 percent", "D": "100 percent (same as deep litter)", "E": "50 percent"}, "correct": "E", "explanation": "The notes state the floor space requirement in cages is 50% of the floor space needed in deep litter for broilers.", "difficulty": "H"}, {"id": 181, "question": "Which vitamins are noted as being made available to birds from deep litter material through bacterial action?", "options": {"A": "Vitamin B2 and Vitamin B12", "B": "Vitamin A and D", "C": "Vitamin B1 and B6", "D": "Vitamin C and E", "E": "Vitamin K only"}, "correct": "A", "explanation": "The notes list Vitamin B2 and Vitamin B12 as advantages of the deep litter system, made available through bacterial action on litter.", "difficulty": "H"}, {"id": 182, "question": "Which of the following is a disadvantage specifically associated with cage-reared broilers, per the notes?", "options": {"A": "Difficulty catching birds at market time", "B": "Higher incidence of breast blisters and crooked keel", "C": "Lower feed efficiency", "D": "Higher incidence of coccidiosis", "E": "More litter-related expenditure"}, "correct": "B", "explanation": "The notes list higher incidence of breast blisters and crooked keel as disadvantages of cage rearing for broilers; cage rearing actually reduces coccidiosis and improves feed efficiency.", "difficulty": "M"}]}, {"topic": "16. Egg Production Cycle & Hatching", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 183, "question": "Birds usually begin laying eggs at approximately what age, as per the egg production cycle notes?", "options": {"A": "30 weeks", "B": "12 weeks", "C": "20\u201321 weeks (about five months)", "D": "52 weeks", "E": "8 weeks"}, "correct": "C", "explanation": "The notes state birds usually start to lay at around five months (20-21 weeks) of age.", "difficulty": "M"}, {"id": 184, "question": "During artificial incubation, relative humidity should be increased to what level during the last 3 days for optimum hatchability?", "options": {"A": "80 percent", "B": "50 percent", "C": "90 percent", "D": "70 percent", "E": "60 percent"}, "correct": "D", "explanation": "The notes specify relative humidity around 60% for the first 18 days and 70% during the last 3 days of incubation.", "difficulty": "H"}, {"id": 185, "question": "A normal hatchability rate from natural incubation is considered to be around:", "options": {"A": "95 percent", "B": "100 percent", "C": "65 percent", "D": "50 percent", "E": "80 percent"}, "correct": "E", "explanation": "The notes state a hatchability of 80 percent (of eggs set) from natural incubation is normal, with 75-80% considered satisfactory.", "difficulty": "M"}, {"id": 186, "question": "What is the approximate caloric value of egg per 100 grams, per the notes?", "options": {"A": "148 calories", "B": "200 calories", "C": "250 calories", "D": "100 calories", "E": "65 calories"}, "correct": "A", "explanation": "The notes state the caloric value of egg is 148 cal per 100 gm, alongside 12% protein, 11% fat, 12% minerals and 65% water.", "difficulty": "H"}, {"id": 187, "question": "As per Agmark egg grading, an A-grade egg should have an air cell depth of no more than:", "options": {"A": "2 mm", "B": "4 mm", "C": "8 mm", "D": "10 mm", "E": "6 mm"}, "correct": "B", "explanation": "The notes describe A-grade eggs as having an air cell depth of 4mm, compared to B-grade's 8mm.", "difficulty": "H"}, {"id": 188, "question": "During artificial incubation, eggs are candled on which specific days to identify infertile eggs and dead embryos?", "options": {"A": "Days 10 and 18", "B": "Days 3 and 20", "C": "Days 5 and 13", "D": "Days 1 and 7", "E": "Days 15 and 21"}, "correct": "C", "explanation": "The notes state eggs are candled on days 5 and 13 to identify infertile eggs and dead embryos and assess embryo development.", "difficulty": "H"}, {"id": 189, "question": "As per the egg grading by weight in the notes, an egg weighing 53\u201359 grams is classified as:", "options": {"A": "Extra large", "B": "Jumbo", "C": "Medium", "D": "Large", "E": "Small"}, "correct": "D", "explanation": "The notes classify eggs as extra large (60g), large (53-59g), medium (45-52g) and small (38-44g).", "difficulty": "M"}, {"id": 190, "question": "During natural incubation, eggs stored prior to setting should be kept at what temperature and for how long?", "options": {"A": "0\u00b0C, for 3 days", "B": "4\u00b0C, for up to 2 weeks", "C": "20\u201325\u00b0C, for up to 10 days", "D": "37\u00b0C, for 1 day", "E": "12\u201314\u00b0C, for no longer than 7 days"}, "correct": "E", "explanation": "The notes specify eggs for incubation should be stored at 12-14\u00b0C at 75-85% humidity for no longer than seven days.", "difficulty": "H"}, {"id": 191, "question": "The incubation period for chicken eggs under natural incubation is:", "options": {"A": "20 to 21 days", "B": "10 to 12 days", "C": "30 days", "D": "25 to 28 days", "E": "15 to 18 days"}, "correct": "A", "explanation": "The notes state the incubation period for chicken eggs is 20 to 21 days, extending up to 30 days for other poultry.", "difficulty": "E"}, {"id": 192, "question": "By weight composition, what percentage of a hen's egg is made up of yolk?", "options": {"A": "65%", "B": "30%", "C": "12%", "D": "20%", "E": "58%"}, "correct": "B", "explanation": "The notes state an egg is composed of about 30% yolk, 58% white/albumen, and 12% shell and membranes.", "difficulty": "M"}, {"id": 193, "question": "The typical poultry egg production cycle lasts about how many months in total?", "options": {"A": "12 months", "B": "24 months", "C": "17 months (72 weeks)", "D": "6 months", "E": "9 months"}, "correct": "C", "explanation": "The notes describe the typical production cycle as lasting about 17 months (72 weeks), across brooder, grower and layer phases.", "difficulty": "M"}, {"id": 194, "question": "In artificial (forced-draft) incubators, what is the recommended incubator temperature range?", "options": {"A": "90\u00b0F to 92\u00b0F", "B": "105\u00b0F to 107\u00b0F", "C": "95\u00b0F to 96\u00b0F", "D": "99.5\u00b0F to 100.5\u00b0F", "E": "101\u00b0F to 103\u00b0F"}, "correct": "D", "explanation": "The notes give the recommended forced-draft incubator temperature as 99.5\u00b0 to 100.5\u00b0F (37.2\u00b0C-37.8\u00b0C), about 1\u00b0F higher for still-air incubators.", "difficulty": "H"}]}, {"topic": "17. Poultry Diseases \u2013 Vitamin Deficiencies & Viral Diseases", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 195, "question": "Thiamine (Vitamin B1) deficiency causes birds to adopt which characteristic posture?", "options": {"A": "Curled toe posture", "B": "Wing-drooping posture only", "C": "Torticollis", "D": "'Penguin-like' sitting posture", "E": "'Star-gazing' position"}, "correct": "E", "explanation": "The notes describe thiamine-deficient birds sitting on flexed legs and drawing back the head in a 'star-gazing' position.", "difficulty": "H"}, {"id": 196, "question": "Deficiency of which vitamin in poultry causes 'nutritional roup' with conjunctivitis and oculo-nasal discharge?", "options": {"A": "Vitamin A", "B": "Vitamin E", "C": "Vitamin D3", "D": "Vitamin B2", "E": "Vitamin K"}, "correct": "A", "explanation": "The notes describe Vitamin A deficiency causing nutritional roup with conjunctivitis and oculo-nasal discharge.", "difficulty": "M"}, {"id": 197, "question": "Which of the following is a clinical sign specifically associated with Marek's Disease in poultry?", "options": {"A": "Drop in egg production of 60\u201390%", "B": "Grey iris or irregular pupil", "C": "Cyanotic, oedematous combs", "D": "Wart-like protuberances on comb", "E": "Whitish diarrhoea"}, "correct": "B", "explanation": "The notes list grey iris or irregular pupil, along with paralysis of legs/wings/neck, as clinical signs of Marek's Disease.", "difficulty": "H"}, {"id": 198, "question": "Choline deficiency in poultry primarily causes which condition?", "options": {"A": "Curled toe paralysis", "B": "Crazy chick disease", "C": "Perosis", "D": "Coccidiosis", "E": "Rickets"}, "correct": "C", "explanation": "The notes state choline deficiency causes perosis, characterised by puffiness around the hock joint and twisting of the metatarsal.", "difficulty": "M"}, {"id": 199, "question": "Egg Drop Syndrome, causing a sudden drop in egg production of 30\u201340%, is caused by which type of virus?", "options": {"A": "Paramyxovirus", "B": "Influenza Type A virus", "C": "Herpes virus", "D": "Adeno virus", "E": "Coronavirus"}, "correct": "D", "explanation": "The notes state Egg Drop Syndrome is caused by adeno virus, producing depigmented, cracked or shell-less eggs.", "difficulty": "M"}, {"id": 200, "question": "Infectious Bronchitis in poultry is unique in that it is naturally caused only in which bird species?", "options": {"A": "Turkey", "B": "Quail", "C": "Duck", "D": "Goose", "E": "Chicken"}, "correct": "E", "explanation": "The notes state chicken is the only bird that is naturally infected by the infectious bronchitis virus, though it can affect any age or breed of chicken.", "difficulty": "M"}, {"id": 201, "question": "Manganese deficiency in growing chicks causes perosis, which is characterised by:", "options": {"A": "Enlargement of hock joints and bending of long bone ends", "B": "Blood spots in eggs", "C": "Thin-shelled eggs", "D": "Curled toe paralysis", "E": "Encephalomalacia"}, "correct": "A", "explanation": "The notes describe manganese-deficiency perosis as causing enlargement of hock joints and bending of the distal ends of long bones; the disease is incurable.", "difficulty": "M"}, {"id": 202, "question": "Deficiency of Pyridoxine (Vitamin B6) in poultry is characterised by which symptom?", "options": {"A": "Rickets", "B": "Spasmodic convulsions and jerky movements", "C": "Perosis", "D": "Curled toe paralysis", "E": "Star-gazing posture"}, "correct": "B", "explanation": "The notes state pyridoxine deficiency causes spasmodic convulsions and jerky movements, since it's necessary for amino acid metabolism.", "difficulty": "H"}, {"id": 203, "question": "Deficiency of Riboflavin (Vitamin B2) is specifically associated with which characteristic condition in young birds?", "options": {"A": "Star-gazing posture", "B": "Perosis", "C": "Curled toe paralysis", "D": "Sway back", "E": "Rickets"}, "correct": "C", "explanation": "The notes describe riboflavin deficiency causing diarrhoea and 'curled toe paralysis' in birds between the first and second week of age.", "difficulty": "H"}, {"id": 204, "question": "Vitamin K deficiency in poultry is primarily associated with which symptom?", "options": {"A": "Curled toe paralysis", "B": "Perosis and hock joint enlargement", "C": "Rickets and thin-shelled eggs", "D": "Increase of blood spots in eggs and haemorrhages", "E": "Encephalomalacia (crazy chick disease)"}, "correct": "D", "explanation": "The notes state Vitamin K deficiency may cause increased blood spots in eggs, haemorrhages in legs/breast and failure of blood clotting, since it is essential for prothrombin synthesis.", "difficulty": "M"}, {"id": 205, "question": "Which viral disease targets the Bursa of Fabricius, making birds more susceptible to other infections?", "options": {"A": "Infectious Bronchitis", "B": "Marek's Disease", "C": "Egg Drop Syndrome", "D": "Avian Leucosis", "E": "Gumboro Disease (Infectious Bursal Disease)"}, "correct": "E", "explanation": "The notes describe Gumboro Disease (IBD) as targeting the Bursa of Fabricius, an important immune organ, causing inflammation and susceptibility to other infections.", "difficulty": "M"}, {"id": 206, "question": "Which viral disease of poultry is described as the 'most destructive disease in broilers' with up to 100% mortality, caused by a paramyxovirus?", "options": {"A": "Ranikhet Disease (Newcastle disease)", "B": "Avian Influenza", "C": "Marek's disease", "D": "Gumboro disease", "E": "Fowl pox"}, "correct": "A", "explanation": "The notes describe Ranikhet/Newcastle disease as the most destructive broiler disease (up to 100% mortality), caused by paramyxovirus.", "difficulty": "M"}, {"id": 207, "question": "Embryonic mortality due to Cyanocobalamin (Vitamin B12) deficiency typically peaks around which day of incubation?", "options": {"A": "5th day", "B": "17th day", "C": "10th day", "D": "1st day", "E": "20th day"}, "correct": "B", "explanation": "The notes state B12 deficiency's embryonic mortality reaches a peak on the 17th day of incubation, with myotrophy of legs and allantoic haemorrhages.", "difficulty": "H"}, {"id": 208, "question": "H5N1, a strain causing Avian Influenza (bird flu), belongs to which virus type?", "options": {"A": "Adenovirus", "B": "Paramyxovirus", "C": "Influenza Type A virus", "D": "Herpes virus", "E": "Coronavirus"}, "correct": "C", "explanation": "The notes state Avian Influenza (HPAI) is caused by the Influenza Type A virus, with H5N1 as the causal strain of bird flu.", "difficulty": "M"}, {"id": 209, "question": "Vitamin D3 deficiency in poultry primarily leads to which condition, affecting eggshell formation and bone development?", "options": {"A": "Perosis", "B": "Curled toe paralysis", "C": "Encephalomalacia", "D": "Rickets", "E": "Crazy chick disease"}, "correct": "D", "explanation": "The notes state Vitamin D3 deficiency leads to rickets, with thin-shelled eggs, leg weakness and a 'penguin-like' sitting posture.", "difficulty": "M"}, {"id": 210, "question": "Fowl pox in poultry is characterized by wart-like protuberances mainly on which body parts?", "options": {"A": "Legs and feet", "B": "Wings and tail", "C": "Beak and crop", "D": "Eyes only", "E": "Comb and wattles"}, "correct": "E", "explanation": "The notes describe fowl pox symptoms as wart-like protuberances on comb and wattles.", "difficulty": "M"}, {"id": 211, "question": "Which vitamin deficiency causes 'encephalomalacia' or crazy chick disease in poultry?", "options": {"A": "Vitamin E", "B": "Vitamin D3", "C": "Vitamin K", "D": "Vitamin A", "E": "Vitamin B1"}, "correct": "A", "explanation": "The notes attribute encephalomalacia/crazy chick disease and exudative diathesis to Vitamin E deficiency.", "difficulty": "M"}]}, {"topic": "18. Poultry Diseases \u2013 Bacterial, Protozoan & Other Disorders", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 212, "question": "Spirochaetosis (Tick fever) in poultry is transmitted by which agent?", "options": {"A": "Rodents", "B": "The fowl tick (Argus persicus)", "C": "Houseflies", "D": "Contaminated feed only", "E": "Mosquitoes"}, "correct": "B", "explanation": "The notes state the fowl tick, Argus persicus, is the transmitting agent for Spirochaetosis caused by Borrelia gallinarum.", "difficulty": "H"}, {"id": 213, "question": "Coccidiosis mainly affects chicks of which age range and can cause what level of mortality, per the notes?", "options": {"A": "Adult birds only; 5% mortality", "B": "0\u20132 weeks; 10\u201320% mortality", "C": "3\u201310 weeks; 50\u201370% mortality", "D": "10\u201320 weeks; 90\u2013100% mortality", "E": "20\u201330 weeks; 30% mortality"}, "correct": "C", "explanation": "The notes state Coccidiosis mainly affects the intestines of chicks between 3-10 weeks of age, causing heavy mortality of 50-70%.", "difficulty": "M"}, {"id": 214, "question": "Coccidiosis in poultry is caused by which type of organism, mainly affecting chicks between 3-10 weeks of age?", "options": {"A": "Bacteria", "B": "Viruses", "C": "Fungi", "D": "Protozoan parasites (coccidia)", "E": "Nematode worms"}, "correct": "D", "explanation": "The notes describe Coccidiosis as caused by protozoan parasites called coccidia, causing heavy mortality (50-70%) in chicks aged 3-10 weeks.", "difficulty": "M"}, {"id": 215, "question": "The mortality rate of Spirochaetosis (Tick fever) in poultry, once symptoms appear, is typically:", "options": {"A": "Less than 10%", "B": "50%", "C": "30\u201340%", "D": "10\u201320%", "E": "70\u2013100%"}, "correct": "E", "explanation": "The notes state Spirochaetosis has a mortality rate of 70-100%, with affected birds dying within 24-48 hours of symptom onset.", "difficulty": "H"}, {"id": 216, "question": "Infectious Coryza in poultry is caused by which bacterium?", "options": {"A": "Haemophilus gallinarum", "B": "Salmonella pullorum", "C": "Staphylococcus", "D": "Pasteurella ariseptica", "E": "Micobacterium tuberclosis"}, "correct": "A", "explanation": "The notes state Infectious Coryza is caused by Haemophilus gallinarum, causing inflammation of head sinuses and respiratory passages.", "difficulty": "M"}, {"id": 217, "question": "Bacillary white diarrhoea in young chicks, causing pullorum disease, is caused by which bacterium?", "options": {"A": "Staphylococcus", "B": "Salmonella pullorum", "C": "Haemophilus gallinarum", "D": "Micobacterium tuberclosis", "E": "Pasteurella ariseptica"}, "correct": "B", "explanation": "The notes state Bacillary white diarrhoea/pullorum disease is caused by Salmonella pullorum, causing fatal septicemia in young chicks.", "difficulty": "M"}, {"id": 218, "question": "The 'Crop Bound' condition in poultry, caused by regular overeating of rough/fibrous food, is initially treated with:", "options": {"A": "Surgical removal in all cases", "B": "Antibiotics", "C": "A teaspoon of castor oil", "D": "Increased salt in feed", "E": "Vitamin A supplements"}, "correct": "C", "explanation": "The notes state initial treatment for crop bound is administering a teaspoon full of castor oil; surgery is only for acute cases.", "difficulty": "H"}, {"id": 219, "question": "Which bacterial disease of poultry is diagnosed using the 'tuberculin test'?", "options": {"A": "Fowl Cholera", "B": "Infectious Coryza", "C": "Bumble foot", "D": "Tuberculosis", "E": "Collibacillosis"}, "correct": "D", "explanation": "The notes state tuberculosis-affected birds are isolated upon detection by the 'tuberculin test'; there is no treatment.", "difficulty": "M"}, {"id": 220, "question": "Bumble foot (pododermatitis) in poultry is typically caused by infection with which bacteria following injury to the foot pad?", "options": {"A": "Pasteurella", "B": "Mycobacterium", "C": "E. coli", "D": "Salmonella", "E": "Staphylococcus"}, "correct": "E", "explanation": "The notes describe bumble foot as injury to the foot's lower surface followed by infection with Staphylococcus bacteria.", "difficulty": "M"}, {"id": 221, "question": "Which of the following is NOT correct regarding Fowl Cholera as described in the notes?", "options": {"A": "It is a very common disease in India caused by a virus", "B": "It is caused by bacteria called Pasteurella ariseptica", "C": "Affected birds should be kept aloof", "D": "It is of rare occurrence in India", "E": "Prevention involves fowl cholera serum followed by vaccine"}, "correct": "A", "explanation": "Fowl Cholera is stated to be of rare occurrence in India and is bacterial (Pasteurella ariseptica), not a common viral disease.", "difficulty": "H"}, {"id": 222, "question": "Feather picking in poultry, often caused by overcrowding or nutritional deficiency, can be treated by adding what to the feed?", "options": {"A": "Antibiotics only", "B": "2\u20134% extra salt", "C": "Extra fat", "D": "Extra vitamin K", "E": "Extra calcium only"}, "correct": "B", "explanation": "The notes state treatment of feather picking by adding 2-4% extra salt in the feed is effective.", "difficulty": "M"}]}, {"topic": "19. Poultry Vaccination Programmes", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 223, "question": "In the commercial broiler vaccination programme, Marek's disease (HVT strain) vaccine is given at what age and by what route?", "options": {"A": "14th day, eye drop", "B": "25-28 days, drinking water", "C": "Day 0, strictly subcutaneous", "D": "5-7 days, oculo-nasal", "E": "Day 0, intra-muscular"}, "correct": "C", "explanation": "The notes state the commercial broiler programme gives Marek's disease HVT strain vaccine on day 0, strictly subcutaneously.", "difficulty": "H"}, {"id": 224, "question": "In-ovo vaccination, described as the most modern administration method, is given at which stage?", "options": {"A": "At the time of sexing", "B": "Immediately after hatching", "C": "After the first 3 weeks of life", "D": "Late stage of embryo development, before hatch", "E": "During the grower phase"}, "correct": "D", "explanation": "The notes describe in-ovo vaccination as administered into the embryo/allantoic sac at the late developmental stage, before hatching.", "difficulty": "H"}, {"id": 225, "question": "A live vaccine, as defined in the notes, uses an organism that is:", "options": {"A": "Weakened but still infectious in a mild form", "B": "Derived only from bacterial antigens", "C": "Completely killed but still immunogenic", "D": "Genetically modified to remove all pathogenicity", "E": "Alive and capable of inducing disease in unvaccinated birds"}, "correct": "E", "explanation": "The notes define a live vaccine as containing the live organism causing the disease, capable of inducing disease in birds without prior contact, and able to infect non-vaccinated birds housed together.", "difficulty": "M"}, {"id": 226, "question": "Marek's disease vaccine is typically administered via which route, per the notes?", "options": {"A": "Subcutaneous injection", "B": "Vent method", "C": "Intra-ocular drops", "D": "Aerosol spray", "E": "Wing web"}, "correct": "A", "explanation": "The notes list subcutaneous administration as the example route for Marek's disease vaccine.", "difficulty": "M"}, {"id": 227, "question": "Which method of vaccine administration involves rubbing vaccine onto the upper part of the cloaca with a small glass rod, used for ILT?", "options": {"A": "Intra-muscular", "B": "Vent method", "C": "Wing web", "D": "Subcutaneous", "E": "Intra-nasal"}, "correct": "B", "explanation": "The notes describe the vent method as rubbing vaccine onto the upper part of the cloaca with a glass rod, e.g. for ILT vaccine.", "difficulty": "H"}, {"id": 228, "question": "In the vaccine-type classification, which type uses an organism weakened by manufacturing procedures so it loses ability to cause serious disease but still triggers immunity?", "options": {"A": "Killed vaccine", "B": "Toxoid vaccine", "C": "Attenuated vaccine", "D": "Live vaccine", "E": "Recombinant vaccine"}, "correct": "C", "explanation": "The notes describe attenuated vaccines as containing an organism weakened during manufacture (e.g. Lasota, F1, IBD live).", "difficulty": "M"}, {"id": 229, "question": "For drinking-water vaccination, what quantity of ice and skimmed milk powder is recommended per 10 litres of water?", "options": {"A": "1 kg ice only, no milk powder", "B": "5 kg ice and 200 gm skimmed milk powder", "C": "0.5 kg ice and 30 gm skimmed milk powder", "D": "1 kg ice and 60 gm skimmed milk powder", "E": "2 kg ice and 100 gm skimmed milk powder"}, "correct": "D", "explanation": "The notes specify for 10 litres of water, 1 kg ice and 60 gm skimmed milk powder are used to bring down water temperature for vaccination.", "difficulty": "H"}, {"id": 230, "question": "Which of the following is an example of a viral vaccine used in poultry, per the notes' classification by contents?", "options": {"A": "Coryza killed vaccine", "B": "BQ vaccine", "C": "Anthrax vaccine", "D": "Coccivin", "E": "ND vaccine"}, "correct": "E", "explanation": "The notes classify ND (Newcastle Disease), IBD and IB vaccines under viral vaccines; Coryza killed vaccine is bacterial and Coccivin is parasitic.", "difficulty": "M"}, {"id": 231, "question": "For intra-nasal vaccine administration in poultry, birds should not be given water for how long afterward?", "options": {"A": "2 hours", "B": "30 minutes", "C": "24 hours", "D": "6 hours", "E": "12 hours"}, "correct": "A", "explanation": "The notes specify birds should not be supplied water for 2 hours after intra-nasal vaccine administration (e.g. Lasota, IBD Live).", "difficulty": "H"}]}, {"topic": "20. Animal Husbandry Terminology (Cattle & Reproduction)", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 232, "question": "A sterile heifer born twin with a male calf is termed:", "options": {"A": "Buller", "B": "Free martin", "C": "Teaser", "D": "Cryptorchid", "E": "Steer"}, "correct": "B", "explanation": "The notes define free martin as a sterile heifer born twin with a male.", "difficulty": "M"}, {"id": 233, "question": "The percentage of live animal weight that becomes carcass weight at slaughter is termed:", "options": {"A": "Prolificacy", "B": "Variation", "C": "Dressing percentage", "D": "Fecundity", "E": "Prepotency"}, "correct": "C", "explanation": "The notes define dressing percentage as carcass weight divided by live weight, multiplied by 100.", "difficulty": "M"}, {"id": 234, "question": "What is the term for the younger female of cattle from six months of age up to first calving?", "options": {"A": "Calf", "B": "Steer", "C": "Cow", "D": "Heifer", "E": "Bullock"}, "correct": "D", "explanation": "The notes define heifer as the younger female of cattle above six months of age to first calving.", "difficulty": "E"}, {"id": 235, "question": "'West average' is defined in the notes as:", "options": {"A": "Sum of production divided by number of animals", "B": "Total milk yield of a day divided by number of milking animals", "C": "Total milk yield of lactation divided by calving interval", "D": "Average of herd milk yield over a year", "E": "Total milk yield of a lactation divided by lactation period (days)"}, "correct": "E", "explanation": "The notes define West Average (W.A.) as total milk yield of a lactation divided by the lactation period in days.", "difficulty": "H"}, {"id": 236, "question": "What is the term for the period after lactation in which an animal does not produce milk?", "options": {"A": "Dry period", "B": "Service period", "C": "Lactation period", "D": "Calving interval", "E": "Gestation period"}, "correct": "A", "explanation": "The notes define the dry period as the period after lactation during which the animal does not produce milk.", "difficulty": "E"}, {"id": 237, "question": "What is the act of giving birth to a young one called?", "options": {"A": "Weaning", "B": "Parturition", "C": "Gestation", "D": "Lactation", "E": "Conception"}, "correct": "B", "explanation": "The notes define parturition as the act of giving birth to a young one.", "difficulty": "E"}, {"id": 238, "question": "What is the successful union of male and female gametes and implantation of the zygote called?", "options": {"A": "Gestation", "B": "Parturition", "C": "Conception", "D": "Fecundity", "E": "Fertility"}, "correct": "C", "explanation": "The notes define conception as the successful union of male and female gametes and implantation of the zygote.", "difficulty": "E"}, {"id": 239, "question": "What is the term for a castrated male of cattle used for work?", "options": {"A": "Sire", "B": "Bull", "C": "Steer", "D": "Bullock", "E": "Wedder"}, "correct": "D", "explanation": "The notes define bullock as the castrated male of cattle used for work; a bull is the uncastrated male used for breeding.", "difficulty": "E"}, {"id": 240, "question": "The potential capacity of a female to produce functional ova, regardless of what happens after production, is termed:", "options": {"A": "Prolificacy", "B": "Prepotency", "C": "Fertility", "D": "Sterility", "E": "Fecundity"}, "correct": "E", "explanation": "The notes define fecundity as the potential capacity of the female to produce functional ova, distinct from fertility (ability to produce living young).", "difficulty": "M"}, {"id": 241, "question": "What is the meat of goat specifically called, per the terminology notes?", "options": {"A": "Chevon", "B": "Wedder", "C": "Pork", "D": "Mutton", "E": "Beef"}, "correct": "A", "explanation": "The notes define chevon as the meat of goat, distinct from mutton (sheep and goat meat collectively) and pork (swine meat).", "difficulty": "E"}, {"id": 242, "question": "A group of individuals with common characteristics that distinguish them from other groups, and which are fertile within the group but not across groups, defines:", "options": {"A": "Germplasm", "B": "Species", "C": "Genotype", "D": "Phenotype", "E": "Breed"}, "correct": "B", "explanation": "The notes define species as a group with common characteristics distinguishing them from others, fertile within the species but not across different species.", "difficulty": "M"}, {"id": 243, "question": "The desirable age at first calving for cross-bred cattle, as per the notes, is:", "options": {"A": "3\u00bd years", "B": "1 year", "C": "2 years", "D": "4 years", "E": "3 years"}, "correct": "C", "explanation": "The notes state the desirable age at first calving is 3 years for Indian breeds, 2 years for crossbred cattle, and 3\u00bd years for buffaloes.", "difficulty": "H"}, {"id": 244, "question": "A vasectomized bull used to detect heat/estrus in cows is called a:", "options": {"A": "Steer", "B": "Bullock", "C": "Sire", "D": "Teaser", "E": "Buller"}, "correct": "D", "explanation": "The notes define a teaser as a vasectomized (castrated) bull used to detect heat/estrus of the female (cow).", "difficulty": "M"}, {"id": 245, "question": "The optimum service period for cattle (period between calving and successful conception) is stated as:", "options": {"A": "180 days", "B": "15\u201330 days", "C": "120\u2013150 days", "D": "30\u201345 days", "E": "60\u201390 days"}, "correct": "E", "explanation": "The notes specify the optimum service period for cattle as 60-90 days, balancing recovery from calving stress and reproductive efficiency.", "difficulty": "M"}, {"id": 246, "question": "What is the term for the male parent of a calf?", "options": {"A": "Sire", "B": "Dam", "C": "Bull", "D": "Sire (specifically opposite of Dam)", "E": "Bullock"}, "correct": "A", "explanation": "The notes define Sire as the male parent of the calf, and Dam as the female parent.", "difficulty": "E"}, {"id": 247, "question": "The failure of testes to descend fully into the scrotum is termed:", "options": {"A": "Steer", "B": "Cryptorchids", "C": "Teaser", "D": "Buller", "E": "Free martin"}, "correct": "B", "explanation": "The notes define cryptorchids as the condition where testes fail to descend fully; if both are retained abdominally, sterility usually results.", "difficulty": "M"}, {"id": 248, "question": "Which of the following terms refers to the reappearance of a character after it has not appeared for one or more generations?", "options": {"A": "Prepotency", "B": "Fecundity", "C": "Atavism", "D": "Inheritance", "E": "Variation"}, "correct": "C", "explanation": "The notes define atavism as the reappearance of a character after it has not appeared for one or more generations.", "difficulty": "H"}, {"id": 249, "question": "What is the term for a group of sheep, goat or poultry birds?", "options": {"A": "Trip", "B": "Clutch", "C": "Drove", "D": "Flock", "E": "Herd"}, "correct": "D", "explanation": "The notes define flock as a group of sheep, goat or poultry birds, while herd refers to cattle or buffalo groups.", "difficulty": "E"}]}, {"topic": "21. Poultry Terminology", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 250, "question": "What term describes the procedure of removing the comb and sometimes wattles and earlobes of poultry?", "options": {"A": "Candling", "B": "Sexing", "C": "Culling", "D": "Debeaking", "E": "Dubbing"}, "correct": "E", "explanation": "The notes define dubbing as the procedure of removing the comb, and sometimes wattles/earlobes, a tradition required for some breed standards.", "difficulty": "M"}, {"id": 251, "question": "What is the term for the process of killing newly hatched poultry (typically males) for which the industry has no use?", "options": {"A": "Culling", "B": "Debeaking", "C": "Dubbing", "D": "Sexing", "E": "Weaning"}, "correct": "A", "explanation": "The notes define culling as the process of killing newly hatched poultry with no industry use, common because males cannot lay eggs.", "difficulty": "M"}, {"id": 252, "question": "What is the term for male chickens that have been castrated at 4\u20138 months, producing more white meat with higher fat content?", "options": {"A": "Cockerel", "B": "Capon", "C": "Bantam", "D": "Pullet", "E": "Rooster"}, "correct": "B", "explanation": "The notes define capon as castrated male chickens (4-8 months old, 5-9 lbs) producing more white meat and higher fat content.", "difficulty": "M"}, {"id": 253, "question": "What is the term for the procedure of shining light through an egg to determine fertility?", "options": {"A": "Lockdown", "B": "Turning", "C": "Candling", "D": "Pipping", "E": "Culling"}, "correct": "C", "explanation": "The notes define candling as the procedure of shining light through an egg to check fertilization.", "difficulty": "E"}, {"id": 254, "question": "What is the term for a male chicken over one year of age?", "options": {"A": "Pullet", "B": "Rooster (defined differently in the notes)", "C": "Capon", "D": "Cock", "E": "Cockerel"}, "correct": "D", "explanation": "The notes specifically define 'Cock' as a male chicken over one year of age, and 'Cockerel' as under one year.", "difficulty": "M"}, {"id": 255, "question": "A commercial layer hen considered no longer commercially viable at around thirteen months is termed a spent hen, a phenomenon also called:", "options": {"A": "Broodiness", "B": "Molt", "C": "Pasting", "D": "Photoperiod", "E": "Henopause"}, "correct": "E", "explanation": "The notes note that the spent hen phenomenon is also called 'Henopause' or 'Pause'.", "difficulty": "H"}, {"id": 256, "question": "The opening in the rear of a chicken through which intestinal, urinary and reproductive tracts empty is called the:", "options": {"A": "Cloaca (vent)", "B": "Gizzard", "C": "Comb", "D": "Wattle", "E": "Crop"}, "correct": "A", "explanation": "The notes define cloaca as the rear opening through which intestinal, urinary and reproductive tracts empty, also known as the vent.", "difficulty": "M"}, {"id": 257, "question": "What term describes a small domestic chicken that is often a miniature version of a larger breed?", "options": {"A": "Cockerel", "B": "Bantam", "C": "Biddy", "D": "Pullet", "E": "Capon"}, "correct": "B", "explanation": "The notes define bantam as a small domestic chicken, often a miniature version of a larger breed.", "difficulty": "E"}, {"id": 258, "question": "The interval in a 24-hour period during which a bird is exposed to light is termed:", "options": {"A": "Lockdown", "B": "Brooding period", "C": "Photoperiod", "D": "Molt", "E": "Pipping"}, "correct": "C", "explanation": "The notes define photoperiod as the interval in a 24-hour period in which an animal is exposed to light.", "difficulty": "M"}, {"id": 259, "question": "A commercially non-viable layer hen at around thirteen months of production is termed a:", "options": {"A": "Bantam", "B": "Non-setter", "C": "Pullet", "D": "Spent hen", "E": "Broody hen"}, "correct": "D", "explanation": "The notes define a spent hen as a layer no longer commercially viable at ods of manual milking \u2014 'Squeezing' is not a separately named method, though milk is meant to be squeezed, not drawn.", "difficulty": "M"}, {"id": 289, "question": "Under normal conditions, milking is completed within how many minutes as per the principles of milking?", "options": {"A": "20\u201330 minutes", "B": "1\u20132 minutes", "C": "10\u201315 minutes", "D": "5\u20138 minutes", "E": "15\u201320 minutes"}, "correct": "D", "explanation": "The notes state milking is a laborious hormonal-reflex process that should be performed within 5-8 minutes.", "difficulty": "M"}, {"id": 290, "question": "Which hand-milking method involves holding the teat with thumb and index finger encircling its base, considered the best method?", "options": {"A": "Knuckling", "B": "Wet milking", "C": "Dry milking", "D": "Stripping", "E": "Fisting"}, "correct": "E", "explanation": "The notes describe fisting as the best hand-milking method, though most milkmen actually use the (inferior) knuckling method.", "difficulty": "M"}, {"id": 291, "question": "The last-drawn milk during stripping is notable for being richer in which component?", "options": {"A": "Fat", "B": "Water", "C": "Protein", "D": "Minerals", "E": "Lactose"}, "correct": "A", "explanation": "The notes state the last drawn milk (stripping) is rich in fat content.", "difficulty": "M"}, {"id": 292, "question": "The pressure applied at the teat end by a suckling calf is approximately how much, compared to hand milking (310 mm Hg)?", "options": {"A": "200 mm Hg", "B": "535 mm Hg", "C": "400 mm Hg", "D": "150 mm Hg", "E": "310 mm Hg (same as hand milking)"}, "correct": "B", "explanation": "The notes state calf suckling applies about 535 mm Hg pressure at the teat, versus 310 mm Hg in hand milking.", "difficulty": "H"}, {"id": 293, "question": "The total differential pressure created by a milking machine on cattle teats is approximately:", "options": {"A": "250 mm Hg", "B": "400 mm Hg (this is the buffalo figure)", "C": "352 mm H
