<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NABARD Grade A Practice Quiz — Animal Husbandry and Poultry</title>
<style>
:root{
  --bg:#faf8f3; --card:#ffffff; --border:#e3ddd0; --border-strong:#c9c0ac;
  --text:#2b2620; --text-secondary:#6b6255; --text-muted:#9a9182;
  --accent:#3b6d11; --accent-light:#eaf3de; --accent-text:#27500a;
  --danger:#a32d2d; --danger-light:#fcebeb; --danger-text:#791f1f;
  --amber:#854f0b; --amber-light:#faeeda;
  --radius:10px;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
}
.wrap{max-width:760px; margin:0 auto; padding:24px 16px 60px;}
.header{margin-bottom:20px;}
.title{font-size:20px; font-weight:700; margin:0 0 4px;}
.subtitle{font-size:13px; color:var(--text-secondary); margin:0 0 16px;}
.scorebar{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 16px; font-size:13px; color:var(--text-secondary); margin-bottom:16px;
}
.scorebar b{color:var(--text); font-weight:700;}
.progress-track{height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:20px;}
.progress-fill{height:100%; background:var(--accent); transition:width .3s ease;}
.labels{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.pill{
  font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
  padding:4px 10px; border-radius:999px;
}
.pill.part{background:var(--amber-light); color:var(--amber);}
.pill.topic{background:var(--accent-light); color:var(--accent-text);}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:22px 22px 18px; margin-bottom:16px;
}
.qnum{font-size:12px; color:var(--text-muted); margin-bottom:6px;}
.qtext{font-size:16.5px; font-weight:600; margin:0 0 16px; color:var(--text);}
.options{display:flex; flex-direction:column; gap:9px;}
.opt{
  display:flex; gap:10px; align-items:flex-start; text-align:left;
  border:1.5px solid var(--border); border-radius:10px; background:var(--card);
  padding:11px 14px; cursor:pointer; font-size:14.5px; color:var(--text);
  transition:border-color .15s, background .15s;
}
.opt:hover:not(.locked){border-color:var(--border-strong); background:#f7f4ee;}
.opt .letter{
  flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-secondary);
}
.opt.correct{border-color:var(--accent); background:var(--accent-light); color:var(--accent-text);}
.opt.correct .letter{border-color:var(--accent); background:var(--accent); color:#fff;}
.opt.wrong{border-color:var(--danger); background:var(--danger-light); color:var(--danger-text);}
.opt.wrong .letter{border-color:var(--danger); background:var(--danger); color:#fff;}
.opt.locked{cursor:default;}
.explain{
  margin-top:16px; padding:13px 15px; border-radius:10px; font-size:13.5px;
  background:#f3f1ea; border-left:3px solid var(--border-strong); color:var(--text-secondary);
  display:none;
}
.explain.show{display:block;}
.explain b{color:var(--text); font-weight:700;}
.footer-row{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
.diff{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
button.next{
  background:var(--text); color:#fff; border:none; border-radius:8px; padding:10px 20px;
  font-size:14px; font-weight:600; cursor:pointer; display:none;
}
button.next.show{display:inline-block;}
button.next:hover{background:#000;}
.intro, .results{
  background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px;
}
.intro h1{font-size:22px; margin:0 0 8px;}
.intro p{color:var(--text-secondary); font-size:14.5px;}
.startbtn{
  background:var(--accent); color:#fff; border:none; border-radius:8px; padding:12px 24px;
  font-size:15px; font-weight:700; cursor:pointer; margin-top:12px;
}
.topic-divider{
  background:var(--accent-light); border:1px solid var(--accent); border-radius:12px;
  padding:16px 20px; margin-bottom:16px; text-align:center;
}
.topic-divider .tname{font-size:16px; font-weight:700; color:var(--accent-text);}
.topic-divider .tmeta{font-size:12.5px; color:var(--text-secondary); margin-top:4px;}
.review-item{
  background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px;
}
.review-item .rq{font-weight:600; font-size:14px; margin-bottom:6px;}
.review-item .ra{font-size:13px; margin-bottom:4px;}
.review-item .ra.wrong{color:var(--danger-text);}
.review-item .ra.correct{color:var(--accent-text);}
.review-item .rexp{font-size:13px; color:var(--text-secondary); margin-top:6px;}
.big-score{font-size:40px; font-weight:800; margin:6px 0;}
.stat-row{display:flex; gap:14px; margin:16px 0;}
.stat{flex:1; background:#f3f1ea; border-radius:10px; padding:14px; text-align:center;}
.stat .num{font-size:22px; font-weight:800;}
.stat .lbl{font-size:11.5px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.03em;}
.restart{
  background:var(--text); color:#fff; border:none; border-radius:8px; padding:10px 20px;
  font-size:14px; font-weight:600; cursor:pointer; margin-top:16px;
}
.jump{font-size:12.5px; color:var(--text-muted); margin-top:20px; text-align:center;}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
const QUIZ = [{"topic": "1. Introduction & Livestock Basics", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 1, "question": "Which of the following is an example of a Seasonally Polyestrous animal, having multiple estrous cycles only during certain periods of the year?", "options": {"A": "Horse", "B": "Pig", "C": "Mouse", "D": "Rat", "E": "Cattle"}, "correct": "A", "explanation": "The notes list horses, sheep, goats, deer and cats as Seasonally Polyestrous animals, distinct from Polyestrous animals like cattle and pigs that cycle year-round.", "difficulty": "M"}, {"id": 2, "question": "The gestation period of buffalo, as given in the reproductive cycle table, is:", "options": {"A": "391 days", "B": "316 days", "C": "150 days", "D": "282 days", "E": "148 days"}, "correct": "B", "explanation": "The table lists buffalo gestation period as 316 days, compared to cattle's 282 days.", "difficulty": "M"}, {"id": 3, "question": "Livestock provides for human needs in all of the following ways EXCEPT:", "options": {"A": "Food", "B": "Traction", "C": "Currency/direct monetary exchange as legal tender", "D": "Fuel", "E": "Fibre"}, "correct": "C", "explanation": "The notes list livestock's contribution as Food, Fibre, Fuel, Fertilizer, Skin and Traction \u2014 not as a form of currency.", "difficulty": "E"}, {"id": 4, "question": "In the estrous cycle, which stage immediately precedes Diestrus and is characterised by sexual inactivity and formation of the corpus luteum?", "options": {"A": "Proestrus", "B": "Anestrus", "C": "Puberty", "D": "Metestrus", "E": "Estrus"}, "correct": "D", "explanation": "The notes describe Metestrus as the third stage, immediately before Diestrus, marked by sexual inactivity and corpus luteum formation.", "difficulty": "H"}, {"id": 5, "question": "The scientific name of poultry, as listed in the notes, is:", "options": {"A": "Anser anser", "B": "Anas platyrhynchos", "C": "Sus domesticus", "D": "Bos taurus", "E": "Gallus gallus"}, "correct": "E", "explanation": "The notes list the scientific name of Poultry as Gallus gallus, distinct from cattle (Bos taurus) or duck (Anas platyrhynchos).", "difficulty": "M"}, {"id": 6, "question": "Which of the following animals is classified as a Monoestrous animal (one estrous cycle per year)?", "options": {"A": "Dog", "B": "Goat", "C": "Cattle", "D": "Pig", "E": "Horse"}, "correct": "A", "explanation": "The notes classify dogs, wolves, foxes and bears as Monoestrous animals with one estrous cycle per year, versus cattle/pigs (Polyestrous) and horses/goats (Seasonally polyestrous).", "difficulty": "M"}, {"id": 7, "question": "The lactation period, i.e. the period of milk production between birth of a young one and the next pregnancy, usually lasts about how many days?", "options": {"A": "200 days", "B": "300 days", "C": "150 days", "D": "365 days", "E": "450 days"}, "correct": "B", "explanation": "The notes state the lactation period usually lasts about 300 days.", "difficulty": "M"}, {"id": 8, "question": "What is the correct body temperature of a Hen as listed in the notes?", "options": {"A": "37.5\u00b0C", "B": "39.1\u00b0C", "C": "41.7\u00b0C", "D": "39.2\u00b0C", "E": "38.5\u00b0C"}, "correct": "C", "explanation": "The body temperature table lists Hen at 41.7\u00b0C, the highest among the animals listed.", "difficulty": "M"}, {"id": 9, "question": "Which animal has the shortest estrous cycle length among those listed in the reproductive cycle table?", "options": {"A": "Cattle (21 days)", "B": "Sheep (16.5 days)", "C": "Buffaloes (21 days)", "D": "Camel (10 days)", "E": "Goat (20 days)"}, "correct": "D", "explanation": "The reproductive cycle table lists Camel's estrous cycle length as 10 days, shortest among the listed animals.", "difficulty": "H"}, {"id": 10, "question": "Which of the following statements about Buffalo is INCORRECT?", "options": {"A": "Wild Asian buffalo has slender, upward-curving horns", "B": "Buffalo prefers to stay near water during the daytime", "C": "Cape buffalo horns curve downward and upward", "D": "Buffalo lacks sweat glands on its skin", "E": "Buffalo has sweat glands that keep it cool in the daytime"}, "correct": "E", "explanation": "The notes state buffaloes lack sweat glands, which is precisely why they seek water and mud to cool down.", "difficulty": "M"}, {"id": 11, "question": "The branch of science dealing with the study of breeds of domesticated animals and their management for better products/services is called:", "options": {"A": "Animal Husbandry", "B": "Zoology", "C": "Agronomy", "D": "Veterinary science", "E": "Livestock farming"}, "correct": "A", "explanation": "The notes define Animal Husbandry as the branch of science dealing with breeds and management of domesticated animals for better products/services.", "difficulty": "E"}, {"id": 12, "question": "Puberty in female animals is generally considered to occur at the age of:", "options": {"A": "Full mature body size", "B": "First estrus", "C": "Weaning", "D": "Six months regardless of species", "E": "First calving"}, "correct": "B", "explanation": "The notes define puberty as the age at which reproduction becomes possible, considered in females as the age of first estrus, occurring before full mature body size is attained.", "difficulty": "E"}]}, {"topic": "2. Cattle Breed Basics & Milch Breeds", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 13, "question": "A pair of bullocks of draught breeds can haul approximately how much load, per the notes?", "options": {"A": "250 kg", "B": "2000 kg", "C": "1000 kg", "D": "500 kg", "E": "1500 kg"}, "correct": "C", "explanation": "The notes mention a pair of bullocks can haul 1000 kg, and twice as much on pneumatic rubber-tyre carts.", "difficulty": "H"}, {"id": 14, "question": "Sahiwal cattle are also known by which of these alternative names?", "options": {"A": "Kongu", "B": "Nellore", "C": "Wadad", "D": "Lola", "E": "Dongerpati"}, "correct": "D", "explanation": "Sahiwal is otherwise called Lola (due to its loose skin), Lambi Bar, Montgomery, Multani, or Teli.", "difficulty": "M"}, {"id": 15, "question": "Which of the following statements about milch breeds is NOT correct?", "options": {"A": "Milk breed examples include Sahiwal, Red Sindhi and Gir", "B": "Male milch-breed animals are slow or poor work animals", "C": "Average milk production of milch breeds exceeds 1600 litres per lactation", "D": "Cows of milch breeds have high milk yields", "E": "Male animals of milch breeds are excellent work/draught animals"}, "correct": "E", "explanation": "The notes explicitly state that male animals of milch breeds are slow or poor work animals, not excellent draught animals.", "difficulty": "M"}, {"id": 16, "question": "Sahiwal cattle have an age at first calving of approximately:", "options": {"A": "32\u201336 months", "B": "20\u201324 months", "C": "45\u201350 months", "D": "24\u201330 months", "E": "36\u201342 months"}, "correct": "A", "explanation": "The notes state Sahiwal's age at first calving is 32-36 months, with a calving interval of 15 months.", "difficulty": "H"}, {"id": 17, "question": "Draught purpose cattle breeds typically have a milk yield of:", "options": {"A": "1500 to 2000 litres per lactation", "B": "Less than 500 litres per lactation", "C": "More than 1600 litres per lactation", "D": "500 to 1500 litres per lactation", "E": "More than 2000 litres per lactation"}, "correct": "B", "explanation": "The notes state draught breed cows are poor milk yielders with an average less than 500 litres per lactation.", "difficulty": "M"}, {"id": 18, "question": "The Gir breed is particularly noted in the notes for which trait?", "options": {"A": "Fastest draught speed", "B": "Best carpet-wool production", "C": "Hardiness and disease resistance", "D": "Highest fat% among Indian breeds", "E": "Largest body size among Indian cattle"}, "correct": "C", "explanation": "The notes specifically describe Gir as known for its hardiness and disease resistance.", "difficulty": "M"}, {"id": 19, "question": "The average calving interval of the Deoni breed, as given in the notes, is approximately:", "options": {"A": "365 days", "B": "600 days", "C": "500 days", "D": "447 days", "E": "300 days"}, "correct": "D", "explanation": "The notes state the Deoni breed's average calving interval is 447 days.", "difficulty": "H"}, {"id": 20, "question": "Which of the following milk yield figures (litres/lactation, per ICAR) is correctly matched to its breed?", "options": {"A": "Gir \u2013 2200", "B": "Ongole \u2013 2200", "C": "Red Sindhi \u2013 2200", "D": "Hariana \u2013 2200", "E": "Sahiwal \u2013 2200"}, "correct": "E", "explanation": "Per the summary table, Sahiwal's milk yield is listed as 2200 litres/lactation, the highest among the three milch breeds shown (Sindhi 2000, Gir 2100).", "difficulty": "H"}, {"id": 21, "question": "Red Sindhi cattle are also known by which of the following alternative names?", "options": {"A": "Red Karachi", "B": "Kongu", "C": "Wadad", "D": "Lola", "E": "Betas"}, "correct": "A", "explanation": "The notes state Red Sindhi is otherwise called Red Karachi, Sindhi and Mahi.", "difficulty": "M"}, {"id": 22, "question": "Based on utility, Indian cattle breeds are classified into Milch, Draught, and which third category?", "options": {"A": "Exotic breeds", "B": "Dual-purpose breeds", "C": "Improved breeds", "D": "Crossbred breeds", "E": "Grade breeds"}, "correct": "B", "explanation": "The notes classify cattle breeds by utility into Milch, Draught purpose, and Dual-purpose breeds.", "difficulty": "E"}, {"id": 23, "question": "Which of the following is the home tract of the Sahiwal breed?", "options": {"A": "Kutch, Gujarat", "B": "Kohistan, Sindh province", "C": "Montgomery district, Pakistan", "D": "Ongole taluk, Andhra Pradesh", "E": "Gir forests, Gujarat"}, "correct": "C", "explanation": "The notes state Sahiwal originally belongs to the Montgomery district of present Pakistan.", "difficulty": "M"}, {"id": 24, "question": "The Gir breed of cattle is characterized by horns that give which distinctive appearance?", "options": {"A": "Lyre shape", "B": "Sword shape", "C": "Straight backward curve", "D": "Half-moon appearance", "E": "Sawai chal (1\u00bc pace) gait"}, "correct": "D", "explanation": "The notes describe Gir's horns as peculiarly curved, giving a 'half moon' appearance, along with pendulous ears.", "difficulty": "M"}, {"id": 25, "question": "Which of the following is NOT among the alternative names given for the Gir breed in the notes?", "options": {"A": "Bhadawari", "B": "Desan", "C": "Kathiawari", "D": "Sorthi", "E": "Wadad"}, "correct": "E", "explanation": "Wadad is actually an alternative name for the Kankrej breed. Gir is otherwise called Bhadawari, Desan, Gujarati, Kathiawari, Sorthi and Surati.", "difficulty": "H"}]}, {"topic": "3. Dual-Purpose & Draught Cattle Breeds", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 26, "question": "Which of the following is NOT a correct match of draught breed to native region?", "options": {"A": "Umblacherry \u2014 Karnataka", "B": "Kangayam \u2014 Tamil Nadu (Erode district)", "C": "Amritmahal \u2014 Karnataka (Hassan, Chikmagalur)", "D": "Hallikar \u2014 Karnataka (Tumkur, Hassan, Mysore)", "E": "Khillari \u2014 Maharashtra (Sholapur, Sitapur)"}, "correct": "A", "explanation": "Umblacherry actually originates from Tanjore, Thiruvarur and Nagappattinam districts of Tamil Nadu, not Karnataka.", "difficulty": "H"}, {"id": 27, "question": "Rathi cattle, a dual-purpose breed, are found in which districts per the summary table?", "options": {"A": "Kutch district of Gujarat", "B": "Bikaner and Ganganagar districts of Rajasthan", "C": "Jhalawar district of Rajasthan", "D": "Nasik and Ahmednagar districts of Maharashtra", "E": "Guntur district of Andhra Pradesh"}, "correct": "B", "explanation": "The summary table lists Rathi as found in Bikaner and Ganganagar districts of Rajasthan, native to Alwar.", "difficulty": "H"}, {"id": 28, "question": "Pulikulam cattle, mainly used for penning in the field, are commonly seen in which valley?", "options": {"A": "Gir forests, Gujarat", "B": "Bargur hills, Erode district", "C": "Cumbum valley, Madurai district", "D": "Sutlej valley, Punjab", "E": "Rann of Kutch, Gujarat"}, "correct": "C", "explanation": "The notes state Pulikulam is commonly seen in the cumbum valley of Madurai district in Tamil Nadu.", "difficulty": "H"}, {"id": 29, "question": "According to the summary table, which breed is described as the 'best dual-purpose breed' with short and stumpy horns?", "options": {"A": "Dangi", "B": "Mewati", "C": "Rathi", "D": "Hariana", "E": "Kankrej"}, "correct": "D", "explanation": "The summary table lists Hariana as the best dual-purpose breed with short and stumpy horns.", "difficulty": "H"}, {"id": 30, "question": "According to the summary table, which breed has the lowest listed milk yield among the dual-purpose breeds (430 kg/lactation)?", "options": {"A": "Ongole", "B": "Mewati", "C": "Tharparkar", "D": "Rathi", "E": "Dangi"}, "correct": "E", "explanation": "The summary table lists Dangi (Maharashtra) with the lowest milk yield among dual-purpose breeds at 430 litres/lactation.", "difficulty": "H"}, {"id": 31, "question": "Kangayam cattle are also known by which alternative names, per the notes?", "options": {"A": "Kongu and Konganad", "B": "Wadad and Waged", "C": "Betas and Jathi madu", "D": "Kali and Kundi", "E": "Dongerpati and Dongari"}, "correct": "A", "explanation": "The notes state Kangayam is also known by the names Kanganad, Kongu and Konganad.", "difficulty": "M"}, {"id": 32, "question": "Which cattle breed is noted for the peculiar practice of dehorning its bullocks?", "options": {"A": "Khillari", "B": "Umblacherry", "C": "Pulikulam", "D": "Alambadi", "E": "Bargur"}, "correct": "B", "explanation": "The notes specifically state the practice of dehorning bullocks is peculiar in Umblacherry cattle.", "difficulty": "H"}, {"id": 33, "question": "As per the summary table, which draught breed is native to Nagaur and Jodhpur (Rajasthan) and considered superior among draught breeds?", "options": {"A": "Hallikar", "B": "Kangayam", "C": "Nagori", "D": "Malvi", "E": "Amritmahal"}, "correct": "C", "explanation": "The summary table describes Nagori (from Nagaur and Jodhpur, Rajasthan) as superior among draught breeds, coloured white or grey.", "difficulty": "H"}, {"id": 34, "question": "Alambadi cattle, which resemble the Hallikar breed, are also known as:", "options": {"A": "Elitchpuri", "B": "Kongu", "C": "Wadad", "D": "Betas", "E": "Jathi madu"}, "correct": "D", "explanation": "The notes state Alambadi resembles Hallikar and is also known as Betas.", "difficulty": "H"}, {"id": 35, "question": "Hariana cattle are mainly found in which of the following districts?", "options": {"A": "Sholapur, Sitapur", "B": "Ongole taluk, Guntur", "C": "Tanjore district", "D": "Hassan, Chikmagalur", "E": "Karnal, Hisar and Gurgaon"}, "correct": "E", "explanation": "The notes state Hariana is mainly found in Karnal, Hisar and Gurgaon districts of Haryana, Delhi and Western M.P.", "difficulty": "M"}, {"id": 36, "question": "The Tharparkar breed is also known by which alternative name?", "options": {"A": "White Sindhi", "B": "Dongerpati", "C": "Jathi madu", "D": "Betas", "E": "Wadad"}, "correct": "A", "explanation": "Tharparkar is otherwise known as White Sindhi, Gray Sindhi and Thari.", "difficulty": "M"}, {"id": 37, "question": "Which draught breed closely resembles the Hallikar breed and originates from Sholapur and Sitapur districts?", "options": {"A": "Amritmahal", "B": "Khillari", "C": "Kangayam", "D": "Bargur", "E": "Alambadi"}, "correct": "B", "explanation": "Khillari is described as originating from Sholapur and Sitapur districts of Maharashtra and closely resembling Hallikar.", "difficulty": "M"}, {"id": 38, "question": "As per the summary table of Indian cattle breeds, which breed has the highest body weight among Indian cows and is famous for 'Swaichal'?", "options": {"A": "Tharparkar", "B": "Rathi", "C": "Kankrej", "D": "Ongole", "E": "Hariana"}, "correct": "C", "explanation": "The summary table notes Kankrej has the highest body weight in Indian cows, a powerful body, and is famous for 'Swaichal'.", "difficulty": "H"}, {"id": 39, "question": "The peculiar gait of the Kankrej breed is called:", "options": {"A": "Trotting gait", "B": "Roman gait", "C": "Crescent walk", "D": "Sawai chal (1\u00bc paces)", "E": "Half-moon gait"}, "correct": "D", "explanation": "The notes describe Kankrej's peculiar gait as '1\u00bc paces' or sawai chal.", "difficulty": "H"}, {"id": 40, "question": "Ongole cattle, known for heavy draught work, originate from which district?", "options": {"A": "Kutch, Gujarat", "B": "Tanjore, Tamil Nadu", "C": "Jodhpur, Rajasthan", "D": "Nagpur, Maharashtra", "E": "Guntur district, Andhra Pradesh"}, "correct": "E", "explanation": "Ongole (also called Nellore) has its home tract in Ongole taluk, Guntur district of Andhra Pradesh.", "difficulty": "M"}, {"id": 41, "question": "Which draught breed is described in the notes as cautious in behaviour and tending to remain away from strangers?", "options": {"A": "Bargur", "B": "Kangayam", "C": "Khillari", "D": "Pulikulam", "E": "Hallikar"}, "correct": "A", "explanation": "The notes describe Bargur cattle as cautious in behaviour, tending to remain away from strangers, and known for speed and endurance in trotting.", "difficulty": "H"}]}, {"topic": "4. Exotic & Improved Cattle Breeds", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 42, "question": "Which exotic cattle breed has the highest fat percentage in milk among exotic breeds?", "options": {"A": "Ayrshire", "B": "Jersey", "C": "Brown Swiss", "D": "Guernsey", "E": "Holstein Friesian"}, "correct": "B", "explanation": "The notes explicitly note that Jersey has the highest fat% among exotic breeds.", "difficulty": "M"}, {"id": 43, "question": "Which exotic dairy breed has the highest average milk yield per lactation (6000\u20137000 litres)?", "options": {"A": "Brown Swiss", "B": "Guernsey", "C": "Holstein Friesian", "D": "Ayrshire", "E": "Jersey"}, "correct": "C", "explanation": "The exotic breeds table lists Holstein Friesian with the highest yield of 6000\u20137000 litres/lactation from the Netherlands.", "difficulty": "M"}, {"id": 44, "question": "In the NDRI Karnal performance table, which breed recorded the highest total lactation yield?", "options": {"A": "None of these", "B": "Karan Fries (3585 kg)", "C": "Tharparkar (2000 kg)", "D": "Karan Swiss (3602 kg)", "E": "Sahiwal (2200 kg)"}, "correct": "D", "explanation": "The performance table shows Karan Swiss with the highest lactation yield of 3602 kg, slightly above Karan Fries at 3585 kg.", "difficulty": "H"}, {"id": 45, "question": "Which of the following is NOT correctly matched (improved/crossbred cattle and their parent breeds)?", "options": {"A": "Karan Fries \u2014 Tharparkar \u00d7 Holstein-Friesian", "B": "Frieswal \u2014 Holstein-Friesian \u00d7 Sahiwal", "C": "Karan Swiss \u2014 an NDRI Karnal crossbred", "D": "Karan Swiss \u2014 Brown Swiss \u00d7 Sahiwal", "E": "Frieswal \u2014 Brown Swiss \u00d7 Sahiwal"}, "correct": "E", "explanation": "Frieswal is actually a crossbreed of Holstein-Friesian and Sahiwal, not Brown Swiss and Sahiwal (that combination is Karan Swiss).", "difficulty": "H"}, {"id": 46, "question": "Which of the following statements about Ayrshire cattle is correct?", "options": {"A": "It was also known as Dunlop cattle or Cunningham cattle", "B": "It is the largest dairy breed", "C": "It produces the golden-coloured milk due to beta carotene", "D": "It has the highest fat % among exotic breeds", "E": "It originates from Switzerland"}, "correct": "A", "explanation": "The notes state Ayrshire was also known as Dunlop cattle or Cunningham cattle, originating in Scotland.", "difficulty": "H"}, {"id": 47, "question": "Karan Fries is a crossbreed of Holstein-Friesian and which Indian breed?", "options": {"A": "Gir", "B": "Tharparkar", "C": "Kankrej", "D": "Sahiwal", "E": "Red Sindhi"}, "correct": "B", "explanation": "The notes describe Karan Fries as a crossbreed of Tharparkar and Holstein-Friesian.", "difficulty": "M"}, {"id": 48, "question": "Which exotic cattle breed is described in the notes as the smallest of the dairy types of cattle?", "options": {"A": "Ayrshire", "B": "Brown Swiss", "C": "Jersey", "D": "Guernsey", "E": "Holstein Friesian"}, "correct": "C", "explanation": "The notes describe Jersey as the smallest of the dairy types of cattle, originating from Jersey Island, U.K.", "difficulty": "M"}, {"id": 49, "question": "Karan Swiss is a crossbred developed at NDRI, Karnal by crossing Brown Swiss with which Indian breed?", "options": {"A": "Hariana", "B": "Tharparkar", "C": "Gir", "D": "Sahiwal", "E": "Red Sindhi"}, "correct": "D", "explanation": "The notes state Karan Swiss is an excellent crossbred obtained by crossing Brown Swiss with Sahiwal cattle at NDRI, Karnal.", "difficulty": "M"}, {"id": 50, "question": "Which of the following is listed as a notable advantage of the Guernsey breed for dairy farmers, according to the notes?", "options": {"A": "Immunity to all common cattle diseases", "B": "Fastest maturity of any dairy breed", "C": "Highest fat percentage among all breeds", "D": "Ability to survive without concentrate feed", "E": "Low incidence of calving difficulty and longevity"}, "correct": "E", "explanation": "The notes list high efficiency of milk production, low incidence of calving difficulty, and longevity as notable Guernsey advantages.", "difficulty": "H"}, {"id": 51, "question": "Ayrshire cattle produce butterfat of approximately what percentage, per the notes \u2014 comparatively lower than other dairy breeds?", "options": {"A": "4%", "B": "5%", "C": "5.5%", "D": "4.5%", "E": "3%"}, "correct": "A", "explanation": "The notes state Ayrshire cattle do not produce as much milk or butterfat (only 4%) as some other dairy breeds.", "difficulty": "M"}, {"id": 52, "question": "Guernsey milk has a distinctive golden colour due to a high content of which pigment?", "options": {"A": "Lycopene", "B": "Beta carotene", "C": "Xanthophyll", "D": "Melanin", "E": "Chlorophyll"}, "correct": "B", "explanation": "The notes attribute Guernsey milk's golden colour to an exceptionally high content of beta carotene.", "difficulty": "M"}]}, {"topic": "5. Buffalo Breeds", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 53, "question": "Which buffalo breed is nicknamed the 'mini elephant' due to its heavy, loose body?", "options": {"A": "Mehsana", "B": "Toda", "C": "Jaffarabadi (Zaffrabadi)", "D": "Murrah", "E": "Nagpuri"}, "correct": "C", "explanation": "The table describes Zaffrabadi/Jaffarabadi as heavy and loose-bodied, known as a 'mini elephant'.", "difficulty": "H"}, {"id": 54, "question": "Nili Ravi buffalo are found in the Sutlej valley of which district of Punjab?", "options": {"A": "Rohtak", "B": "Nabha", "C": "Patiala", "D": "Ferozpur", "E": "Hisar"}, "correct": "D", "explanation": "The notes state Nili Ravi is found in the Sutlej valley in Ferozpur district of Punjab, and in the Sahiwal district of Pakistan.", "difficulty": "M"}, {"id": 55, "question": "The Surti buffalo is characterized by which distinctive feature?", "options": {"A": "Sword-shaped horns", "B": "Crescent-shaped horns", "C": "Wall eyes", "D": "Wedge-shaped body with copper colour", "E": "Sickle-shaped horns and two white collars"}, "correct": "E", "explanation": "The notes describe Surti's horns as sickle-shaped and note the peculiarity of two white collars around the jaw and brisket.", "difficulty": "M"}, {"id": 56, "question": "According to the age at first calving and inter-calving period data, Murrah buffalo has an age at first calving of:", "options": {"A": "45\u201350 months", "B": "36\u201342 m A": "Malabari", "B": "Jhakrana", "C": "Marwari", "D": "Osmanabadi", "E": "Beetal"}, "correct": "E", "explanation": "The table describes Beetal as resembling Jamunapari, a good dairy breed, with presence of a beard in males.", "difficulty": "M"}, {"id": 76, "question": "Barbari goats are prolific breeders that typically kid how often?", "options": {"A": "Twice, at an interval of 12 to 15 months", "B": "Once in a lifetime", "C": "Three times a year", "D": "Once every 6 months", "E": "Once every 24 months"}, "correct": "A", "explanation": "The notes describe Barbari as a prolific breeder that kids twice at an interval of 12 to 15 months.", "difficulty": "M"}, {"id": 77, "question": "What is the average lactation milk yield of the Beetal goat breed, per the notes?", "options": {"A": "1000 kg", "B": "150 kg", "C": "50 kg", "D": "280 kg", "E": "500 kg"}, "correct": "B", "explanation": "The notes state Beetal's average lactation yield is 150 kg, with a maximum recorded yield of 591.5 kg in a 177-day lactation.", "difficulty": "H"}, {"id": 78, "question": "Black Bengal goats are especially prized for which product due to high demand in shoemaking?", "options": {"A": "Milk", "B": "Wool", "C": "Skin", "D": "Manure", "E": "Meat only"}, "correct": "C", "explanation": "The notes state Black Bengal's skin is in great demand for high-class shoemaking, besides being excellent for meat.", "difficulty": "M"}, {"id": 79, "question": "Barbari goats, popular as 'city goats' suited to stall feeding, typically give birth to how many kids per parturition?", "options": {"A": "Three to four kids", "B": "Single kid only", "C": "No twinning observed", "D": "Twins (two kids)", "E": "One or two kids only rarely"}, "correct": "D", "explanation": "The notes note Barbari usually gives birth to twins (two kids) in one parturition and are prolific breeders.", "difficulty": "M"}]}, {"topic": "7. Sheep Breeds", "part": "Part I: Animal Husbandry and Poultry", "questions": [{"id": 80, "question": "Jaisal
