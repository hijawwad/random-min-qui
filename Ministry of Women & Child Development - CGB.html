<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABARD Grade A Practice Quiz — MoWCD Schemes</title>
<style>
  :root{
    --navy: #16324f;
    --navy-deep: #0d2136;
    --gold: #b8860b;
    --gold-light: #d9a441;
    --bg: #f3f5f8;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5c6b7a;
    --line: #dde3ea;
    --green: #1b7a4a;
    --green-bg: #e6f5ec;
    --red: #b23b2e;
    --red-bg: #fbeae7;
    --amber: #a9720f;
    --amber-bg: #fbf1de;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(20,30,45,0.08), 0 6px 20px rgba(20,30,45,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height:100vh;
    line-height:1.5;
  }
  .app{
    max-width: 920px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  header.topbar{
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color: #fff;
    padding: 18px 22px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    flex-wrap:wrap;
  }
  header.topbar .brand{
    display:flex; flex-direction:column; gap:2px;
  }
  header.topbar .brand .kicker{
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color: var(--gold-light); font-weight:600;
  }
  header.topbar .brand h1{
    margin:0; font-size:19px; font-weight:700; letter-spacing:0.2px;
  }
  header.topbar .brand .sub{
    font-size:12.5px; color:#c7d3de;
  }
  .pill-btn{
    background: rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    transition: background .15s ease;
    white-space:nowrap;
  }
  .pill-btn:hover{ background: rgba(255,255,255,0.2); }

  .card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin-bottom: 18px;
    border: 1px solid var(--line);
  }

  /* ---------- HOME ---------- */
  .home-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 680px){ .home-grid{ grid-template-columns: 1fr; } }
  .mode-card{
    cursor:pointer;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 20px;
    background: var(--card);
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .mode-card:hover{
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--gold-light);
  }
  .mode-card .icon{
    width:40px;height:40px;border-radius:10px;
    background: var(--navy);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:19px; margin-bottom:12px;
  }
  .mode-card h3{ margin:0 0 6px; font-size:16.5px; color: var(--navy); }
  .mode-card p{ margin:0; font-size:13.5px; color: var(--muted); }

  .section-title{
    font-size:13px; text-transform:uppercase; letter-spacing:1px; color: var(--muted); font-weight:700; margin: 26px 0 12px;
  }

  .stat-row{
    display:flex; gap:14px; flex-wrap:wrap; margin-top:14px;
  }
  .stat-chip{
    background: var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    font-size:12.5px;
    color: var(--muted);
  }
  .stat-chip b{ color: var(--navy); font-size:14px; }

  /* ---------- SETUP (order toggle) ---------- */
  .toggle-row{
    display:flex; gap:10px; margin: 14px 0 4px;
  }
  .toggle-opt{
    flex:1;
    text-align:center;
    padding: 12px 10px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    color: var(--muted);
    background: var(--bg);
  }
  .toggle-opt.active{
    border-color: var(--navy);
    background: var(--navy);
    color:#fff;
  }
  .big-btn{
    display:inline-block;
    background: var(--navy);
    color:#fff;
    border:none;
    padding: 13px 26px;
    border-radius: 8px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:16px;
  }
  .big-btn:hover{ background: var(--navy-deep); }
  .ghost-btn{
    display:inline-block;
    background: transparent;
    color: var(--navy);
    border:1.5px solid var(--navy);
    padding: 11px 22px;
    border-radius: 8px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:16px;
    margin-left:10px;
  }
  .ghost-btn:hover{ background: rgba(22,50,79,0.06); }

  /* ---------- SECTION GRID ---------- */
  .sec-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
    margin-top: 8px;
  }
  @media (max-width: 620px){ .sec-grid{ grid-template-columns: 1fr; } }
  .sec-tile{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding: 12px 14px;
    cursor:pointer;
    background: var(--bg);
    transition: border-color .12s ease, background .12s ease;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .sec-tile:hover{ border-color: var(--gold-light); background:#fff; }
  .sec-tile .name{ font-size:13.5px; font-weight:600; color: var(--navy); }
  .sec-tile .count{
    font-size:11.5px;
    background: var(--navy);
    color:#fff;
    padding:3px 9px;
    border-radius: 999px;
    white-space:nowrap;
  }

  /* ---------- QUIZ ---------- */
  .quiz-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:10px; flex-wrap:wrap;
  }
  .progress-wrap{
    flex:1; min-width:180px;
  }
  .progress-track{
    height:8px; background: var(--line); border-radius:999px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
    transition: width .25s ease;
  }
  .progress-label{ font-size:11.5px; color:var(--muted); margin-top:5px; }
  .score-chip{
    background: var(--navy); color:#fff; font-size:13px; font-weight:700;
    padding:8px 14px; border-radius:8px; white-space:nowrap;
  }
  .meta-line{
    display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;
  }
  .tag{
    font-size:11px; padding:4px 10px; border-radius:999px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
  }
  .tag.section{ background:#eef2f7; color: var(--navy); }
  .tag.Easy{ background:#e6f5ec; color:var(--green); }
  .tag.Moderate{ background:#fbf1de; color:var(--amber); }
  .tag.Hard{ background:#fbeae7; color:var(--red); }

  .qtext{
    font-size:16.5px; font-weight:600; color: var(--ink); margin: 6px 0 18px; white-space:pre-line;
  }
  .options{
    display:flex; flex-direction:column; gap:10px;
  }
  .opt{
    display:flex; align-items:flex-start; gap:12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding: 12px 14px;
    cursor:pointer;
    background:#fff;
    font-size:14.5px;
    transition: border-color .12s ease, background .12s ease;
  }
  .opt:hover{ border-color: var(--gold-light); background:#fffaf1; }
  .opt .letter{
    flex:0 0 auto;
    width:26px;height:26px;border-radius:50%;
    background: var(--bg); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:700; color:var(--muted);
  }
  .opt.correct{
    border-color: var(--green); background: var(--green-bg);
  }
  .opt.correct .letter{ background: var(--green); border-color: var(--green); color:#fff; }
  .opt.wrong{
    border-color: var(--red); background: var(--red-bg);
  }
  .opt.wrong .letter{ background: var(--red); border-color: var(--red); color:#fff; }
  .opt.disabled{ cursor:default; }
  .opt.disabled:hover{ background:#fff; border-color: var(--line); }
  .opt.correct.disabled:hover{ background: var(--green-bg); border-color: var(--green); }
  .opt.wrong.disabled:hover{ background: var(--red-bg); border-color: var(--red); }

  .explain{
    margin-top:16px;
    padding: 12px 14px;
    border-radius:8px;
    font-size:13.5px;
    display:none;
    line-height:1.55;
  }
  .explain.show{ display:block; }
  .explain.ok{ background: var(--green-bg); color:#1a5c39; border:1px solid #b9e2c9; }
  .explain.bad{ background: var(--red-bg); color:#8f2e23; border:1px solid #f1c3bc; }
  .explain.skip{ background: var(--amber-bg); color:#7a5308; border:1px solid #ecd9ab; }
  .explain b{ display:block; margin-bottom:3px; }

  .quiz-actions{
    display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; flex-wrap:wrap;
  }
  .skip-btn{
    background:transparent; border:1.5px solid var(--line); color: var(--muted);
    padding: 10px 18px; border-radius:8px; font-size:13.5px; cursor:pointer; font-weight:600;
  }
  .skip-btn:hover{ border-color:var(--red); color:var(--red); }
  .next-btn{
    background: var(--navy); color:#fff; border:none; padding: 11px 24px;
    border-radius:8px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .next-btn:hover{ background: var(--navy-deep); }
  .exit-link{
    font-size:12.5px; color: var(--muted); cursor:pointer; text-decoration:underline;
  }

  /* ---------- RESULTS ---------- */
  .score-hero{
    text-align:center; padding: 10px 0 6px;
  }
  .score-hero .big-num{
    font-size:48px; font-weight:800; color: var(--navy); line-height:1;
  }
  .score-hero .big-num span{ font-size:22px; color:var(--muted); font-weight:600; }
  .score-hero .pct{ font-size:15px; color: var(--muted); margin-top:6px; }

  .breakdown{
    display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-top:22px;
  }
  @media (max-width:560px){ .breakdown{ grid-template-columns:1fr; } }
  .bd-card{
    border:1.5px solid var(--line); border-radius:8px; padding:14px; text-align:center;
  }
  .bd-card .lbl{ font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; color:var(--muted); margin-bottom:6px;}
  .bd-card .val{ font-size:20px; font-weight:800; color:var(--navy); }
  .bd-card .sub{ font-size:12px; color:var(--muted); margin-top:2px; }

  .stat-strip{
    display:flex; justify-content:space-between; gap:10px; margin-top:20px; flex-wrap:wrap;
  }
  .stat-strip .item{ flex:1; min-width:100px; text-align:center; border-right:1px solid var(--line); }
  .stat-strip .item:last-child{ border-right:none; }
  .stat-strip .item .n{ font-size:20px; font-weight:800; }
  .stat-strip .item .l{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  .n.correct-c{ color: var(--green); }
  .n.wrong-c{ color: var(--red); }
  .n.skip-c{ color: var(--amber); }

  .review-item{
    border:1.5px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px;
  }
  .review-item .rq{ font-weight:600; font-size:14.5px; margin-bottom:8px; white-space:pre-line;}
  .review-item .ra-row{ font-size:13px; margin:3px 0; }
  .review-item .ra-row.your-wrong{ color: var(--red); }
  .review-item .ra-row.your-skip{ color: var(--amber); }
  .review-item .ra-row.correct-ans{ color: var(--green); font-weight:600; }
  .review-item .rexp{ font-size:12.5px; color:var(--muted); margin-top:6px; border-top:1px dashed var(--line); padding-top:6px;}
  .badge-sec{ display:inline-block; font-size:10.5px; background:#eef2f7; color:var(--navy); padding:2px 8px; border-radius:999px; margin-bottom:6px; font-weight:700;}

  .end-actions{
    display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;
  }

  .empty-note{ color:var(--muted); font-size:13.5px; text-align:center; padding: 30px 0;}

  footer.foot{
    text-align:center; font-size:11.5px; color:var(--muted); margin-top:26px;
  }
</style>

<script>
// ============================================================
// NABARD Grade A Practice Quiz — MoWCD Schemes
// Self-contained vanilla JS quiz engine
// ============================================================
(function(){
  "use strict";

  var ALL_Q = JSON.parse(document.getElementById('quiz-data').textContent);
  var LETTERS = ["A","B","C","D","E"];

  // ---------- Derived data ----------
  var SECTIONS = [];
  (function buildSections(){
    var seen = {};
    ALL_Q.forEach(function(q){
      if(!seen[q.section]){ seen[q.section] = 0; SECTIONS.push(q.section); }
      seen[q.section]++;
    });
    SECTIONS._counts = seen;
  })();

  function sectionCount(name){
    var c = 0;
    for(var i=0;i<ALL_Q.length;i++){ if(ALL_Q[i].section === name) c++; }
    return c;
  }

  // ---------- App State ----------
  var state = {
    screen: 'home',           // home | setup | sectiongrid | quiz | results
    mode: null,                // 'full' | 'section'
    order: 'pdf',               // 'pdf' | 'shuffled'
    activeSection: null,
    queue: [],                  // array of question objects for current run
    idx: 0,
    answers: {},                 // qid -> {status:'correct'|'wrong'|'skipped', chosen:index|null}
    lastRunConfig: null          // to support Retry Same Set
  };

  var root = document.getElementById('app');

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  // ---------- Render dispatcher ----------
  function render(){
    if(state.screen === 'home') return renderHome();
    if(state.screen === 'fullsetup') return renderFullSetup();
    if(state.screen === 'sectiongrid') return renderSectionGrid();
    if(state.screen === 'quiz') return renderQuiz();
    if(state.screen === 'results') return renderResults();
  }

  function header(subtitle){
    return (
      '<header class="topbar">' +
        '<div class="brand">' +
          '<div class="kicker">NABARD Grade A &middot; Practice Series</div>' +
          '<h1>Ministry of Women &amp; Child Development — Schemes Quiz</h1>' +
          '<div class="sub">' + subtitle + '</div>' +
        '</div>' +
        (state.screen !== 'home' ? '<button class="pill-btn" onclick="QuizApp.goHome()">&larr; Menu</button>' : '') +
      '</header>'
    );
  }

  // ---------- HOME ----------
  function renderHome(){
    var totalQ = ALL_Q.length;
    var html = header(totalQ + ' questions &middot; based on the MoWCD Schemes compendium (CGB Mentors)');

    html += '<div class="card">';
    html += '<div class="home-grid">';
    html += '<div class="mode-card" onclick="QuizApp.toFullSetup()">' +
              '<div class="icon">&#9776;</div>' +
              '<h3>Full Practice Test</h3>' +
              '<p>Attempt all ' + totalQ + ' questions in one sitting. Choose PDF order or shuffled order before you start.</p>' +
            '</div>';
    html += '<div class="mode-card" onclick="QuizApp.toSectionGrid()">' +
              '<div class="icon">&#9638;</div>' +
              '<h3>Section-wise Revision</h3>' +
              '<p>Pick one scheme or Act at a time and drill just that topic — great for targeted revision.</p>' +
            '</div>';
    html += '</div>';

    html += '<div class="stat-row">' +
      '<div class="stat-chip"><b>' + totalQ + '</b> total questions</div>' +
      '<div class="stat-chip"><b>' + SECTIONS.length + '</b> topics covered</div>' +
      '<div class="stat-chip"><b>5</b> options per question (A&ndash;E)</div>' +
      '</div>';
    html += '</div>';

    root.innerHTML = html;
  }

  // ---------- FULL TEST SETUP ----------
  function renderFullSetup(){
    var html = header('Full Practice Test setup');
    html += '<div class="card">';
    html += '<h3 style="margin-top:0;color:var(--navy);">Choose question order</h3>';
    html += '<div class="toggle-row">' +
      '<div class="toggle-opt ' + (state.order==='pdf'?'active':'') + '" onclick="QuizApp.setOrder(\'pdf\')">PDF Order<br><span style="font-weight:400;font-size:11.5px;">Follows document section order</span></div>' +
      '<div class="toggle-opt ' + (state.order==='shuffled'?'active':'') + '" onclick="QuizApp.setOrder(\'shuffled\')">Shuffled<br><span style="font-weight:400;font-size:11.5px;">Random order each attempt</span></div>' +
      '</div>';
    html += '<button class="big-btn" onclick="QuizApp.startFull()">Start Full Test (' + ALL_Q.length + ' Qs)</button>';
    html += '<button class="ghost-btn" onclick="QuizApp.goHome()">Cancel</button>';
    html += '</div>';
    root.innerHTML = html;
  }

  // ---------- SECTION GRID ----------
  function renderSectionGrid(){
    var html = header('Section-wise revision &mdash; pick a topic');
    html += '<div class="card">';
    html += '<div class="sec-grid">';
    SECTIONS.forEach(function(sec){
      html += '<div class="sec-tile" onclick="QuizApp.startSection(' + JSON.stringify(sec).replace(/"/g,'&quot;') + ')">' +
                '<span class="name">' + escapeHtml(sec) + '</span>' +
                '<span class="count">' + sectionCount(sec) + ' Qs</span>' +
              '</div>';
    });
    html += '</div></div>';
    root.innerHTML = html;
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---------- QUIZ RUN ----------
  function beginRun(queue, config){
    state.queue = queue;
    state.idx = 0;
    state.answers = {};
    state.screen = 'quiz';
    state.lastRunConfig = config;
    render();
  }

  function renderQuiz(){
    var total = state.queue.length;
    if(total === 0){
      root.innerHTML = header('') + '<div class="card"><p class="empty-note">No questions found for this selection.</p><button class="big-btn" onclick="QuizApp.goHome()">Back to Menu</button></div>';
      return;
    }
    var q = state.queue[state.idx];
    var answered = state.answers[q.id];
    var answeredCount = Object.keys(state.answers).length;
    var correctCount = 0;
    Object.keys(state.answers).forEach(function(k){ if(state.answers[k].status==='correct') correctCount++; });

    var pct = Math.round(((state.idx) / total) * 100);

    var html = header(escapeHtml(state.mode==='full' ? 'Full Practice Test' : ('Section: ' + q.section)));

    html += '<div class="quiz-topbar">';
    html += '<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
            '<div class="progress-label">Question ' + (state.idx+1) + ' of ' + total + '</div></div>';
    html += '<div class="score-chip">Score: ' + correctCount + ' / ' + answeredCount + '</div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="meta-line"><span class="tag section">' + escapeHtml(q.section) + '</span><span class="tag ' + q.difficulty + '">' + q.difficulty + '</span></div>';
    html += '<div class="qtext">' + escapeHtml(q.question) + '</div>';

    html += '<div class="options">';
    q.options.forEach(function(opt, i){
      var cls = 'opt';
      var disabled = !!answered;
      if(answered){
        cls += ' disabled';
        if(i === q.correct) cls += ' correct';
        else if(answered.chosen === i) cls += ' wrong';
      }
      html += '<div class="' + cls + '" ' + (disabled ? '' : 'onclick="QuizApp.selectOption(' + i + ')"') + '>' +
                '<span class="letter">' + LETTERS[i] + '</span>' +
                '<span>' + escapeHtml(opt) + '</span>' +
              '</div>';
    });
    html += '</div>';

    if(answered){
      var expCls = answered.status === 'correct' ? 'ok' : (answered.status === 'skipped' ? 'skip' : 'bad');
      var label = answered.status === 'correct' ? 'Correct!' : (answered.status === 'skipped' ? 'Skipped' : 'Not quite.');
      html += '<div class="explain show ' + expCls + '"><b>' + label + '</b>' + escapeHtml(q.exp) + '</div>';
    }

    html += '<div class="quiz-actions">';
    if(!answered){
      html += '<button class="skip-btn" onclick="QuizApp.skipQuestion()">Skip &rarr;</button>';
      html += '<span></span>';
    } else {
      html += '<span class="exit-link" onclick="QuizApp.goHome()">Exit to menu</span>';
      html += '<button class="next-btn" onclick="QuizApp.nextQuestion()">' + (state.idx === total-1 ? 'Finish' : 'Next Question') + ' &rarr;</button>';
    }
    html += '</div>';

    html += '</div>';
    root.innerHTML = html;
  }

  // ---------- RESULTS ----------
  function renderResults(){
    var total = state.queue.length;
    var correct=0, wrong=0, skipped=0;
    var byDiff = { Easy:{c:0,t:0}, Moderate:{c:0,t:0}, Hard:{c:0,t:0} };

    state.queue.forEach(function(q){
      byDiff[q.difficulty].t++;
      var a = state.answers[q.id];
      if(!a){ return; } // shouldn't happen, all should be answered/skipped
      if(a.status === 'correct'){ correct++; byDiff[q.difficulty].c++; }
      else if(a.status === 'wrong'){ wrong++; }
      else if(a.status === 'skipped'){ skipped++; }
    });

    var scorePct = total>0 ? Math.round((correct/total)*100) : 0;

    var html = header('Results summary');
    html += '<div class="card">';
    html += '<div class="score-hero">';
    html += '<div class="big-num">' + correct + '<span> / ' + total + '</span></div>';
    html += '<div class="pct">' + scorePct + '% accuracy overall</div>';
    html += '</div>';

    html += '<div class="stat-strip">' +
      '<div class="item"><div class="n correct-c">' + correct + '</div><div class="l">Correct</div></div>' +
      '<div class="item"><div class="n wrong-c">' + wrong + '</div><div class="l">Wrong</div></div>' +
      '<div class="item"><div class="n skip-c">' + skipped + '</div><div class="l">Skipped</div></div>' +
      '</div>';

    html += '<div class="section-title">Accuracy by difficulty</div>';
    html += '<div class="breakdown">';
    ['Easy','Moderate','Hard'].forEach(function(d){
      var b = byDiff[d];
      var p = b.t>0 ? Math.round((b.c/b.t)*100) : 0;
      html += '<div class="bd-card"><div class="lbl">' + d + '</div><div class="val">' + p + '%</div><div class="sub">' + b.c + ' / ' + b.t + ' correct</div></div>';
    });
    html += '</div>';

    html += '<div class="end-actions">' +
      '<button class="big-btn" onclick="QuizApp.retrySame()">Retry Same Set</button>' +
      '<button class="ghost-btn" onclick="QuizApp.goHome()">Back to Menu</button>' +
      '</div>';
    html += '</div>';

    // Review list: missed + skipped
    var reviewItems = [];
    state.queue.forEach(function(q){
      var a = state.answers[q.id];
      if(a && (a.status === 'wrong' || a.status === 'skipped')){
        reviewItems.push({q:q, a:a});
      }
    });

    html += '<div class="card">';
    html += '<div class="section-title">Review &mdash; missed &amp; skipped (' + reviewItems.length + ')</div>';
    if(reviewItems.length === 0){
      html += '<p class="empty-note">Nothing missed or skipped — clean sweep!</p>';
    } else {
      reviewItems.forEach(function(item){
        var q = item.q, a = item.a;
        html += '<div class="review-item">';
        html += '<span class="badge-sec">' + escapeHtml(q.section) + ' &middot; ' + q.difficulty + '</span>';
        html += '<div class="rq">' + escapeHtml(q.question) + '</div>';
        if(a.status === 'wrong'){
          html += '<div class="ra-row your-wrong">Your answer: ' + LETTERS[a.chosen] + '. ' + escapeHtml(q.options[a.chosen]) + '</div>';
        } else {
          html += '<div class="ra-row your-skip">You skipped this question</div>';
        }
        html += '<div class="ra-row correct-ans">Correct answer: ' + LETTERS[q.correct] + '. ' + escapeHtml(q.options[q.correct]) + '</div>';
        html += '<div class="rexp">' + escapeHtml(q.exp) + '</div>';
        html += '</div>';
      });
    }
    html += '</div>';

    html += '<footer class="foot">Offline practice tool &middot; content sourced from the attached MoWCD schemes compendium</footer>';

    root.innerHTML = html;
  }

  // ============================================================
  // Public API (bound to window.QuizApp, called from inline handlers)
  // ============================================================
  var QuizApp = {
    goHome: function(){
      state.screen = 'home';
      render();
    },
    toFullSetup: function(){
      state.screen = 'fullsetup';
      render();
    },
    setOrder: function(o){
      state.order = o;
      render();
    },
    startFull: function(){
      var q = state.order === 'shuffled' ? shuffle(ALL_Q) : ALL_Q.slice();
      state.mode = 'full';
      state.activeSection = null;
      beginRun(q, {type:'full', order: state.order});
    },
    toSectionGrid: function(){
      state.screen = 'sectiongrid';
      render();
    },
    startSection: function(sec){
      var q = ALL_Q.filter(function(x){ return x.section === sec; });
      state.mode = 'section';
      state.activeSection = sec;
      beginRun(q, {type:'section', section: sec});
    },
    selectOption: function(i){
      var q = state.queue[state.idx];
      if(state.answers[q.id]) return; // already answered
      var status = (i === q.correct) ? 'correct' : 'wrong';
      state.answers[q.id] = { status: status, chosen: i };
      render();
    },
    skipQuestion: function(){
      var q = state.queue[state.idx];
      if(state.answers[q.id]) return;
      state.answers[q.id] = { status: 'skipped', chosen: null };
      render();
    },
    nextQuestion: function(){
      if(state.idx < state.queue.length - 1){
        state.idx++;
        render();
      } else {
        state.screen = 'results';
        render();
      }
    },
    retrySame: function(){
      var cfg = state.lastRunConfig;
      if(!cfg) { QuizApp.goHome(); return; }
      var q;
      if(cfg.type === 'full'){
        q = cfg.order === 'shuffled' ? shuffle(ALL_Q) : ALL_Q.slice();
      } else {
        q = ALL_Q.filter(function(x){ return x.section === cfg.section; });
      }
      beginRun(q, cfg);
    }
  };

  window.QuizApp = QuizApp;

  // ---------- init ----------
  render();

})();

</script>
</body>
</html>
