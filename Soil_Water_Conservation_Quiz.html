Productivity & C:N Ratio", "difficulty": "Moderate", "type": "scenario", "passage": null, "question": "A farmer incorporates crop residue with a C:N ratio of 15:1 into the soil. Based on the text's C:N ratio scenarios, what is the expected outcome for nitrogen availability to the crop?", "options": ["Immobilization and mineralization occur equally", "The C:N ratio has no effect on nitrogen availability", "Nitrogen leaches out completely regardless of C:N ratio", "Mineralization dominates, converting organic N to inorganic form, making it available to plants", "Nitrogen becomes immobilized and unavailable to the crop"], "correct": 3, "explanation": "Since 15:1 is below the 30:1 threshold (a 'Low C:N ratio' scenario), mineralization dominates \u2014 organic nitrogen converts to inorganic form and becomes available to plants.", "id": "q109"}, {"topic": "Plant Nutrient Essentiality & Mobility", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Out of more than 90 elements found in plants, how many elements are known to be essential, further classified into macro- and micro-nutrients?", "options": ["16", "12", "13", "20", "17"], "correct": 4, "explanation": "17 elements are known to be essential, classified into macro-nutrients and micro-nutrients based on relative abundance in plants.", "id": "q110"}, {"topic": "Plant Nutrient Essentiality & Mobility", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Arnon and Stout (1939) and Arnon (1952) proposed criteria of essentiality of mineral nutrients:\n1. Deficiency of the element results in failure to complete the life cycle.\n2. Deficiency can be corrected only by supplying that particular element.\n3. The element must be directly involved in plant nutrition/metabolism, not merely correcting other soil conditions.\n4. Every essential element must be required in equal concentration across all plant species.\nWhich of the statements given above are correct?", "options": ["1, 2 and 3", "Only 3 and 4", "Only 1 and 4", "1, 2, 3 and 4", "2, 3 and 4"], "correct": 0, "explanation": "Statement 4 is not among Arnon's criteria \u2014 essentiality criteria concern function, not equal required concentration across species. Statements 1, 2 and 3 are the correct Arnon/Stout criteria.", "id": "q111"}, {"topic": "Plant Nutrient Essentiality & Mobility", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Primary and Secondary nutrients are together known by which collective term?", "options": ["Micro-nutrients", "Macro-nutrients or Major nutrients", "Essential minerals", "Beneficial elements", "Trace elements"], "correct": 1, "explanation": "Primary and Secondary nutrients together are known as Macro-nutrients or Major nutrients.", "id": "q112"}, {"topic": "Plant Nutrient Essentiality & Mobility", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on nutrient mobility in plants:\n1. N, P and K are highly mobile nutrients.\n2. Zinc is moderately mobile.\n3. S, Fe, Mn, Cu, Mo and Cl are less mobile.\n4. Calcium and Boron are highly mobile, moving freely to growing points.\nWhich of the statements given above are correct?", "options": ["Only 1 and 4", "1, 2, 3 and 4", "1, 2 and 3", "2, 3 and 4", "Only 4"], "correct": 2, "explanation": "Statement 4 is incorrect: Calcium and Boron are IMMOBILE in plants, not highly mobile. Statements 1, 2 and 3 correctly classify nutrient mobility.", "id": "q113"}, {"topic": "Plant Nutrient Essentiality & Mobility", "difficulty": "Hard", "type": "scenario", "passage": null, "question": "A farmer notices deficiency symptoms appearing specifically on the terminal buds of a crop, rather than on old or new leaves. Based on nutrient mobility principles, which nutrients are most likely deficient?", "options": ["Zinc alone", "Sulphur and Iron", "Potassium and Magnesium", "Calcium and Boron", "Nitrogen and Phosphorus"], "correct": 3, "explanation": "Since Calcium and Boron are immobile in plants, their deficiency symptoms appear specifically on terminal buds, unlike mobile nutrients which show symptoms on older leaves.", "id": "q114"}, {"topic": "Plant Nutrient Essentiality & Mobility", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "According to the text, deficiency symptoms of less mobile elements such as S, Fe, Mn and Cu typically appear on:", "options": ["Roots only", "Stems only", "Middle leaves only", "Old leaves only", "New leaves"], "correct": 4, "explanation": "Deficiency symptoms of less mobile elements (S, Fe, Mn, Cu) appear on new leaves, as they cannot move from older tissue to compensate.", "id": "q115"}, {"topic": "Plant Nutrient Essentiality & Mobility", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "This law, proposed by Justus von Liebig in 1862, states that yield is proportional to the amount of the most limiting nutrient, whichever nutrient it may be. This is called the ________.", "options": ["Law of the Minimum", "Law of Mass Action", "Liebig's Law of Maximum Growth", "Law of Diminishing Returns", "Law of Nutrient Balance"], "correct": 0, "explanation": "Justus von Liebig's Law of the Minimum (1862) states yield is proportional to the amount of the most limiting nutrient.", "id": "q116"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which nutrient's deficiency is characterised by uniform yellowing of older leaves including the veins, cereal crops showing 'V'-shaped pale yellowing at lower leaf tips, and causes 'buttoning' in cauliflower?", "options": ["Calcium", "Nitrogen", "Phosphorus", "Potassium", "Magnesium"], "correct": 1, "explanation": "Nitrogen deficiency causes uniform yellowing of older leaves (including veins), V-shaped yellowing at lower leaf tips in cereals, and buttoning in cauliflower.", "id": "q117"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which nutrient's deficiency causes plants to have small, dark green leaves with a purple tinge, bronzy appearance on the underside, and 'Sickle leaf disease'?", "options": ["Potassium", "Zinc", "Phosphorus", "Nitrogen", "Sulphur"], "correct": 2, "explanation": "Phosphorus deficiency causes stunted growth, purple-coloured older leaves, bronzy underside, and 'Sickle leaf disease'.", "id": "q118"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "'Scorch' \u2014 where the edges of older leaves look burned \u2014 along with yellowing extending from leaf tip/margin to the leaf base, is a characteristic deficiency symptom of which nutrient?", "options": ["Copper", "Iron", "Boron", "Potassium", "Magnesium"], "correct": 3, "explanation": "Potassium deficiency causes yellowing from the tip/margin to the leaf base with necrotic dead spots \u2014 a symptom known as 'scorch'.", "id": "q119"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on specific plant disorders caused by nutrient deficiencies:\n1. Calcium deficiency causes 'Blossom end rot' in Tomato and Ber.\n2. Magnesium deficiency causes 'Sand drawn disease' in tobacco.\n3. Boron deficiency causes 'Whiptail disease' in cauliflower.\n4. Zinc deficiency causes 'White bud of maize'.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 3 and 4", "1, 2, 3 and 4", "Only 3 and 4", "1, 2 and 4"], "correct": 4, "explanation": "Statement 3 is incorrect: 'Whiptail disease and browning in cauliflower' is caused by Molybdenum deficiency, not Boron (Boron deficiency causes 'internal necrosis' in Aonla/mango and 'hen and chicken disorder' in grape). Statements 1, 2 and 4 are correct.", "id": "q120"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Interveinal chlorosis on older leaves \u2014 yellowing between veins while veins remain green \u2014 with leaves detaching easily and causing 'sand drawn disease' in tobacco, is a deficiency symptom of:", "options": ["Magnesium", "Sulphur", "Nitrogen", "Iron", "Phosphorus"], "correct": 0, "explanation": "Magnesium deficiency causes interveinal chlorosis (yellowing between veins, veins remain green), easy leaf detachment, and 'sand drawn disease' in tobacco.", "id": "q121"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on Boron deficiency:\n1. Chlorosis starts from the base of the terminal bud leaf and extends to the tip, forming a 'whip-like structure'.\n2. It causes 'Internal necrosis in Aonla and mango'.\n3. It causes 'Hen and chicken disorder' in grape and heart rot in sugar beet.\n4. Excess boron causes chlorosis on midribs of upper leaves with dead spots throughout.\nWhich of the statements given above are correct?", "options": ["1, 2, 3 and 4", "1, 2 and 3", "1, 3 and 4", "2, 3 and 4", "Only 4"], "correct": 1, "explanation": "Statement 4 is incorrect \u2014 it describes Zinc deficiency symptoms, not excess boron (excess boron causes leaf tips/margins turning brown and dying). Statements 1, 2 and 3 correctly describe boron deficiency.", "id": "q122"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Interveinal chlorosis in which veins remain conspicuously green while other leaf portions turn yellow/white, causing 'Leaf bleaching in sugarcane' and 'Ivory white of paddy', is a deficiency symptom of:", "options": ["Zinc", "Manganese", "Iron", "Molybdenum", "Copper"], "correct": 2, "explanation": "Iron deficiency causes interveinal chlorosis with veins remaining conspicuously green, leading to 'leaf bleaching in sugarcane' and 'ivory white of paddy'.", "id": "q123"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which micronutrient deficiency causes plants to appear bushy due to reduced internodal elongation, and causes 'White bud of maize', 'Khaira disease of rice' and 'Little leaf of cotton and apple'?", "options": ["Manganese", "Molybdenum", "Iron", "Zinc", "Copper"], "correct": 3, "explanation": "Zinc deficiency causes bushy appearance from reduced internodal elongation, 'White bud of maize', 'Khaira disease of rice', and 'Little leaf' in cotton/apple.", "id": "q124"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Which nutrient's deficiency is characterised by translucent spots of irregular shape between leaf veins, impregnated with resinous gum, and causes 'Whiptail disease and browning in cauliflower'?", "options": ["Copper", "Manganese", "Zinc", "Boron", "Molybdenum"], "correct": 4, "explanation": "Molybdenum deficiency causes translucent interveinal spots impregnated with resinous gum, and 'whiptail disease and browning in cauliflower'.", "id": "q125"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "'Marsh disease in pea' and interveinal yellowing of young leaves (without tending towards whiteness, veins remaining green) is a deficiency symptom of which nutrient?", "options": ["Manganese", "Zinc", "Chlorine", "Iron", "Molybdenum"], "correct": 0, "explanation": "Manganese deficiency causes interveinal yellowing of young leaves (veins remain green, not white) and 'marsh disease in pea'.", "id": "q126"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which nutrient, when deficient, causes leaves and veins to become yellow tending towards whiteness, with marginal leaf burning, and causes 'Die back and Little leaf disease in citrus'?", "options": ["Boron", "Copper", "Iron", "Zinc", "Manganese"], "correct": 1, "explanation": "Copper deficiency causes yellowing tending towards whiteness with marginal leaf burning, and 'die back and little leaf disease in citrus'.", "id": "q127"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements about plant nutrient functions:\n1. Phosphorus is a key component of ATP and acts as the plant's 'energy currency'.\n2. Potassium's most essential function is stomata regulation and osmotic/ionic balance.\n3. Molybdenum is a component of nitrate reductase and nitrogenase, essential for nitrogen fixation in pulses.\n4. Boron is responsible for the characteristic taste of cauliflower.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 3 and 4", "1, 2, 3 and 4", "1, 2 and 3", "Only 3 and 4"], "correct": 2, "explanation": "All four statements accurately describe nutrient functions given in the text \u2014 phosphorus/ATP, potassium/stomata, molybdenum/nitrogenase, and boron/cauliflower taste.", "id": "q128"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which macronutrient functions as a component of chlorophyll and a cofactor for many enzymatic reactions, with its deficiency causing interveinal chlorosis on older leaves?", "options": ["Nitrogen", "Sulphur", "Calcium", "Magnesium", "Potassium"], "correct": 3, "explanation": "Magnesium is a component of chlorophyll and cofactor for enzymatic reactions; its deficiency causes interveinal chlorosis (leaves yellow between green veins).", "id": "q129"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "'Downward cupping of leaves in tobacco and tea' is a deficiency symptom associated with which nutrient?", "options": ["Chlorine", "Boron", "Phosphorus", "Nitrogen", "Sulphur"], "correct": 4, "explanation": "Sulphur deficiency causes yellowing of leaves (paler than interveinal portion) and 'downward cupping of leaves' in tobacco and tea.", "id": "q130"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Nickel deficiency is most important as a component of which plant enzyme, which metabolizes urea nitrogen into usable ammonia?", "options": ["Urease", "Nitrate reductase", "Nitrogenase", "Carbonic anhydrase", "Cytochrome oxidase"], "correct": 0, "explanation": "Nickel is a component of urease, the enzyme that metabolizes urea nitrogen into usable ammonia within the plant.", "id": "q131"}, {"topic": "Nutrient Functions & Deficiency Symptoms", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on important physiological terms related to nutrient deficiency:\n1. Chlorosis is abnormal yellowing of leaves/plant parts, caused by deficiency of elements such as Mn, K, Zn, Fe, Mg, S and N.\n2. Mottled surface refers to a surface marked with coloured spots due to anthocyanin development, from deficiency of N, Mg, P, S.\n3. Necrosis refers to patches of dead tissue caused by deficiency of Mg, K, Zn, Ca and Mo.\nWhich of the statements given above are correct?", "options": ["Only 3", "1, 2 and 3", "1 and 2", "2 and 3", "Only 1"], "correct": 1, "explanation": "All three statements correctly define Chlorosis, Mottled surface, and Necrosis as given in the text.", "id": "q132"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements comparing Manures and Fertilizers:\n1. Manures are of plant or animal origin and organic in nature; fertilizers are chemically synthesized and inorganic.\n2. Manures supply nutrients slowly, while fertilizers may or may not be readily available.\n3. Manures improve the physical condition of soil, while fertilizers generally do not.\n4. Manures have a more concentrated nutrient content than fertilizers.\nWhich of the statements given above are correct?", "options": ["1, 2, 3 and 4", "1, 3 and 4", "1, 2 and 3", "2, 3 and 4", "Only 3 and 4"], "correct": 2, "explanation": "Statement 4 is incorrect: manures are LESS concentrated in nutrients compared to fertilizers, not more. Statements 1, 2 and 3 are correct.", "id": "q133"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "Green undecomposed plant material used as manure, obtained either by growing green manure crops in-situ (e.g., sunnhemp) or collecting green leaves ex-situ from wastelands/forests (e.g., neem), is called ________.", "options": ["Bulky organic manure only", "Vermicompost", "Biofertilizer", "Green manure", "Concentrated organic manure"], "correct": 3, "explanation": "Green manure is undecomposed green plant material, obtained via in-situ growing (e.g., sunnhemp) or ex-situ collection (e.g., neem).", "id": "q134"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which of the following is described as the accumulated excrement of birds and bats, highly effective as a manure due to its exceptionally high nitrogen, phosphate and potassium content?", "options": ["Bone meal", "Fish manure", "Oil cake", "Blood meal", "Guano"], "correct": 4, "explanation": "Guano is the accumulated excrement of birds and bats, highly effective due to its high N, P and K content.", "id": "q135"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on oil cakes as manures:\n1. Oil cakes are the remaining solid portion after oil is extracted from oilseeds.\n2. Edible oil cakes, such as groundnut and coconut cake, can be safely fed to livestock.\n3. Non-edible oil cakes, such as castor and neem cake, are not fit for livestock feeding.\n4. Only edible oil cakes can be used as manure; non-edible cakes cannot be used as manure.\nWhich of the statements given above are correct?", "options": ["1, 2 and 3", "Only 3 and 4", "1, 2, 3 and 4", "2, 3 and 4", "1, 3 and 4"], "correct": 0, "explanation": "Statement 4 is incorrect: both edible and non-edible oil cakes can be used as manures \u2014 the edible/non-edible distinction only concerns livestock feeding suitability. Statements 1, 2 and 3 are correct.", "id": "q136"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Fertilizers that supply only one primary plant nutrient \u2014 nitrogen, phosphorus or potassium \u2014 such as Urea or potassium chloride, are called:", "options": ["Mixed fertilizers", "Straight fertilizers", "Complex fertilizers", "Complete fertilizers", "Ternary fertilizers"], "correct": 1, "explanation": "Straight fertilizers supply only one primary nutrient, e.g., Urea, ammonium sulphate, potassium chloride.", "id": "q137"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on fertilizer classification by number of nutrients:\n1. Complex fertilizers contain two or three primary nutrients, of which two are in chemical combination, and are usually granular.\n2. Mixed fertilizers are physical mixtures of straight fertilizers, made mechanically or manually.\n3. Complete fertilizers contain all three major nutrients (N, P, K), e.g., IFFCO.\n4. High analysis fertilizers contain less than 25% of primary nutrients.\nWhich of the statements given above are correct?", "options": ["1, 3 and 4", "Only 3 and 4", "1, 2 and 3", "1, 2, 3 and 4", "2, 3 and 4"], "correct": 2, "explanation": "Statement 4 is incorrect \u2014 high analysis fertilizers contain MORE than 25% of primary nutrients (e.g., Urea 46%); it is LOW analysis fertilizers that contain less than 25% (e.g., SSP 16%). Statements 1, 2 and 3 are correct.", "id": "q138"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Urea, the only organic nitrogen fertilizer and the cheapest, contains what percentage of nitrogen, and Anhydrous ammonia, the most concentrated nitrogenous fertilizer, contains what percentage?", "options": ["26%; 34%", "16%; 81%", "20.6%; 46%", "46%; 81%", "33%; 46%"], "correct": 3, "explanation": "Urea contains 46.0% N (cheapest, only organic N fertilizer); Anhydrous ammonia contains 81.0% N (most concentrated).", "id": "q139"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which nitrogenous fertilizer is described as the oldest, best suited for top-dressing rice, contains 24.5% sulphur besides 20.6% nitrogen, and is also suitable for tea, groundnut and sugarcane?", "options": ["Sodium nitrate", "Urea", "Ammonium chloride", "Calcium ammonium nitrate", "Ammonium sulphate"], "correct": 4, "explanation": "Ammonium sulphate (20.6% N) is the oldest nitrogenous fertilizer, contains 24.5% sulphur, and is best for top-dressing rice, also suitable for tea, groundnut, sugarcane.", "id": "q140"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Which nitrogenous fertilizer, containing 33-34% N, is described as a fire hazardous, explosive and highly hygroscopic fertilizer?", "options": ["Ammonium nitrate", "Urea", "Calcium ammonium nitrate", "Calcium cyanamide", "Anhydrous ammonia"], "correct": 0, "explanation": "Ammonium nitrate (33-34% N) is a fire-hazardous, explosive and highly hygroscopic fertilizer.", "id": "q141"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Neem coated urea increases nitrogen use efficiency mainly due to which property?", "options": ["Its acidic nature", "Slow release property", "Higher nitrogen percentage than plain urea", "Reduced hygroscopicity to zero", "Increased solubility in water"], "correct": 1, "explanation": "Neem coated urea's slow-release property increases nitrogen use efficiency compared to plain urea.", "id": "q142"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Hard", "type": "figure", "passage": null, "question": "DAP (Di-ammonium phosphate), a complex fertilizer, provides what approximate percentage of nitrogen and phosphorus (P2O5) respectively?", "options": ["11% N, 48% P2O5", "20% N, 40% P2O5", "18% N, 46% P2O5", "26% N, 34% P2O5", "16% N, 18% P2O5"], "correct": 2, "explanation": "DAP provides 18% N and 46% P2O5.", "id": "q143"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which potassic fertilizer is also known as 'salt petre' or 'nitre', containing 44% K2O, and is an excellent source of both potassium and nitrogen, mainly used for fruit trees, tobacco and vegetables?", "options": ["Murate of Potash (MOP)", "Superphosphate", "Sulphate of Potash", "Potassium nitrate", "Potassium chloride"], "correct": 3, "explanation": "Potassium nitrate (44% K2O), also called salt petre or nitre, is an excellent source of K and N, used for fruit trees, tobacco and vegetables.", "id": "q144"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Which potassic fertilizer is made for acidic and heavy soils but is unsuitable for alkaline soils, providing 60% K2O?", "options": ["Bone meal", "Rock phosphate", "Sulphate of potash", "Potassium nitrate", "Murate of Potash (MOP)/KCl"], "correct": 4, "explanation": "Murate of Potash (MOP)/KCl provides 60% K2O and is made for acidic and heavy soils, not suitable for alkaline soils.", "id": "q145"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Biosuper, a form of organic fertilizer mostly found in Australia, is a combination of rock phosphate, sulphur and which bacteria?", "options": ["Thiobacillus (sulphur-oxidizing bacteria)", "Azotobacter", "Rhizobium", "Azospirillum", "Bacillus megaterium"], "correct": 0, "explanation": "Biosuper combines rock phosphate, sulphur and sulphur-oxidizing bacteria (Thiobacillus), mostly found in Australia.", "id": "q146"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "The fertilizer grade 12-6-6 has what fertilizer ratio (N:P2O5:K2O)?", "options": ["4:2:1", "2:1:1", "1:1:1", "3:1:1", "1:2:2"], "correct": 1, "explanation": "The fertilizer ratio refers to the ratio of N, P2O5 and K2O percentages; grade 12-6-6 gives a ratio of 2:1:1.", "id": "q147"}, {"topic": "Manures & Fertilizers Classification", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Materials like dolomite and limestone added to fertilizer mixtures to counteract the acidity of nitrogenous fertilizers are termed:", "options": ["Chelating agents", "Conditioners", "Neutralizers of Residual Acidity", "Fillers", "Suppliers of Plant Nutrients"], "correct": 2, "explanation": "Neutralizers of Residual Acidity (e.g., dolomite, limestone) counteract acidity of nitrogenous fertilizers.", "id": "q148"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Spreading fertilizers uniformly all over the field, suitable for crops with dense stand and for insoluble phosphatic fertilizers, is called:", "options": ["Placement", "Band placement", "Pellet application", "Broadcasting", "Fertigation"], "correct": 3, "explanation": "Broadcasting refers to spreading fertilizers uniformly over the field, suitable for dense-stand crops and insoluble phosphatics like rock phosphate.", "id": "q149"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on disadvantages of broadcasting fertilizers:\n1. Nutrients cannot be fully utilized by plant roots as they move laterally over long distances.\n2. Weed growth is stimulated all over the field.\n3. Nutrients are fixed in the soil as they contact a large soil mass.\n4. It reduces the loss of nitrogen by leaching more effectively than placement.\nWhich of the statements given above are correct?", "options": ["1, 2, 3 and 4", "2, 3 and 4", "Only 3 and 4", "1, 3 and 4", "1, 2 and 3"], "correct": 4, "explanation": "Statement 4 is incorrect: it is PLACEMENT (not broadcasting) that reduces nitrogen loss by leaching; this is listed as an advantage of placement, not broadcasting. Statements 1, 2 and 3 are disadvantages of broadcasting.", "id": "q150"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Placing fertilizer at the bottom of the plough furrow in a continuous band during ploughing, suitable for soils with a heavy clay pan below the plough sole, is called:", "options": ["Plough sole placement", "Deep placement", "Side dressing", "Drilling", "Localized placement"], "correct": 0, "explanation": "Plough sole placement places fertilizer at the bottom of the furrow during ploughing, suitable for soils with a clay pan below the plough sole.", "id": "q151"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Placement of ammoniacal nitrogenous fertilizer in the reduction zone of paddy soil, ensuring the ammoniacal nitrogen remains available and preventing runoff loss, is called:", "options": ["Pellet application", "Deep placement", "Plough sole placement", "Row placement", "Hill placement"], "correct": 1, "explanation": "Deep placement places ammoniacal nitrogenous fertilizers in the reduction zone, particularly in paddy fields, preventing nutrient loss via runoff.", "id": "q152"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Applying fertilizer at sowing time via a seed-cum-fertilizer drill, placing seed and fertilizer in the same row but at different depths, is called:", "options": ["Broadcasting", "Side dressing", "Drilling", "Foliar application", "Hill placement"], "correct": 2, "explanation": "Drilling applies fertilizer via a seed-cum-fertilizer drill at sowing time, placing seed and fertilizer at different depths in the same row.", "id": "q153"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Hard", "type": "figure", "passage": null, "question": "Pellet application places nitrogenous fertilizer pellets at what depth between rows of paddy crop, mixed with soil in what ratio?", "options": ["1-3 cm deep; 1:15 ratio", "5-10 cm deep; 1:20 ratio", "10-15 cm deep; 1:10 ratio", "2.5-5 cm deep; 1:10 ratio", "1-2 cm deep; 1:5 ratio"], "correct": 3, "explanation": "Pellet application places pellets 2.5 to 5 cm deep between paddy rows, with fertilizer mixed with soil in a 1:10 ratio.", "id": "q154"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "Spraying fertilizer solutions containing one or more nutrients directly on the foliage of growing plants, particularly effective for minor nutrients like iron, copper, boron, zinc and manganese, is called ________.", "options": ["Band placement", "Deep placement", "Fertigation", "Starter solution", "Foliar application"], "correct": 4, "explanation": "Foliar application sprays fertilizer solutions on foliage, effective for minor nutrients like Fe, Cu, B, Zn, Mn.", "id": "q155"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "The application of water-soluble fertilizers through irrigation water, generally used for nitrogenous fertilizers, is called:", "options": ["Fertigation", "Starter solution", "Aerial application", "Drilling", "Foliar application"], "correct": 0, "explanation": "Fertigation is the application of water-soluble fertilizers through irrigation water, typically nitrogenous fertilizers.", "id": "q156"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Hard", "type": "figure", "passage": null, "question": "Anhydrous ammonia, when injected into soil, must be placed in narrow furrows at what depth and covered immediately to prevent loss?", "options": ["20-25 cm", "12-15 cm", "5-8 cm", "2-5 cm", "30-35 cm"], "correct": 1, "explanation": "Anhydrous ammonia must be placed in narrow furrows at a depth of 12-15 cm and covered immediately to prevent loss of ammonia.", "id": "q157"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Starter solutions, applied to young plants at transplanting (particularly for vegetables), use N:P2O5:K2O in what ratios?", "options": ["1:1:2 and 2:2:1", "1:1:1 and 2:1:1", "1:2:1 and 1:1:2", "2:2:1 and 1:1:1", "3:1:1 and 1:1:3"], "correct": 2, "explanation": "Starter solutions use N:P2O5:K2O ratios of 1:2:1 and 1:1:2 for young plants, particularly vegetables, at transplanting.", "id": "q158"}, {"topic": "Methods of Fertilizer Application", "difficulty": "Moderate", "type": "scenario", "passage": null, "question": "A farmer wants to apply fertilizer in an area where ground application is impracticable \u2014 such as hilly terrain, forest land, or sugarcane fields \u2014 with fertilizer solutions applied by aircraft. Which method is this?", "options": ["Fertigation", "Broadcasting", "Foliar application", "Aerial application", "Injection into soil"], "correct": 3, "explanation": "Aerial application uses aircraft to apply fertilizer solutions in areas where ground application is impracticable, such as hilly or forested terrain.", "id": "q159"}, {"topic": "Biofertilizers", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "________ are preparations containing living or latent cells of efficient microorganism strains that help crop plants take up nutrients through interactions in the rhizosphere, applied via seed or soil.", "options": ["Conditioners", "Complex fertilizers", "Manures", "Straight fertilizers", "Biofertilizers"], "correct": 4, "explanation": "Biofertilizers are preparations of living/latent microorganism cells that help nutrient uptake through rhizosphere interactions.", "id": "q160"}, {"topic": "Biofertilizers", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on nitrogen-fixing biofertilizers:\n1. Azotobacter and Clostridium are examples of free-living nitrogen fixers.\n2. Rhizobium and Frankia are examples of symbiotic nitrogen fixers.\n3. Azospirillum is an example of associative symbiotic nitrogen fixation.\n4. Bacillus megaterium is a nitrogen-fixing biofertilizer.\nWhich of the statements given above are correct?", "options": ["1, 2 and 3", "2, 3 and 4", "1, 3 and 4", "Only 3 and 4", "1, 2, 3 and 4"], "correct": 0, "explanation": "Statement 4 is incorrect: Bacillus megaterium var. phosphaticum is a Phosphate Solubilizing biofertilizer, not nitrogen-fixing. Statements 1, 2 and 3 correctly classify N-fixing biofertilizers.", "id": "q161"}, {"topic": "Biofertilizers", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which biofertilizer is described as 'the most efficient' in terms of quantity of nitrogen fixed, colonizing legume roots and fixing atmospheric nitrogen symbiotically, with its inoculant first made in the USA?", "options": ["Azotobacter", "Rhizobium", "Azolla", "Cyanobacteria", "Azospirillum"], "correct": 1, "explanation": "Rhizobium is the most efficient biofertilizer by quantity of nitrogen fixed, colonizing legume roots symbiotically; its inoculant was first made in the USA.", "id": "q162"}, {"topic": "Biofertilizers", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Which biofertilizer produces abundant slime that helps in soil aggregation, with numbers in Indian soils rarely exceeding 10^5/g soil due to lack of organic matter?", "options": ["Azospirillum", "Azolla", "Azotobacter", "Cyanobacteria", "Rhizobium"], "correct": 2, "explanation": "Azotobacter produces abundant slime aiding soil aggregation; its numbers in Indian soils rarely exceed 10^5/g soil due to low organic matter and antagonistic microorganisms.", "id": "q163"}, {"topic": "Biofertilizers", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Azolla, a free-floating water fern used as a biofertilizer for wetland rice in association with the nitrogen-fixing blue-green alga Anabaena azollae, is known to contribute how much nitrogen per hectare per rice crop?", "options": ["70-90 kg N/ha", "100-120 kg N/ha", "20-30 kg N/ha", "40-60 kg N/ha", "10-20 kg N/ha"], "correct": 3, "explanation": "Azolla contributes 40-60 kg N/ha per rice crop, fixing nitrogen in association with Anabaena azollae.", "id": "q164"}, {"topic": "Biofertilizers", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which group of biofertilizers, including species of Pseudomonas, Bacillus, Penicillium and Aspergillus, secrete organic acids to lower pH and dissolve bound phosphates in soil?", "options": ["Nitrogen fixing biofertilizers", "Silicate solubilizing bacteria", "Plant Growth Promoting Rhizobacteria", "Arbuscular Mycorrhiza", "Phosphate solubilizing microorganisms (PSM)"], "correct": 4, "explanation": "Phosphate Solubilizing Microorganisms (PSM), such as Pseudomonas, Bacillus, Penicillium, Aspergillus, secrete organic acids to dissolve bound soil phosphates.", "id": "q165"}, {"topic": "Biofertilizers", "difficulty": "Hard", "type": "definitional", "passage": null, "question": "Intracellular obligate fungal endosymbionts that mediate transfer of phosphorus, and also zinc and sulphur, from soil to root cortex cells, are known as ________.", "options": ["AM (Arbuscular Mycorrhiza) fungi", "Rhizobium", "Silicate solubilizing bacteria", "PGPR", "Cyanobacteria"], "correct": 0, "explanation": "AM (Arbuscular Mycorrhiza) fungi are intracellular obligate fungal endosymbionts mediating transfer of P, Zn and S from soil to root cortex cells.", "id": "q166"}, {"topic": "Biofertilizers", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "The group of bacteria that colonize roots or rhizosphere soil and are beneficial to crops is collectively referred to by which abbreviation?", "options": ["SSB", "PGPR", "AM", "PSM", "N2F"], "correct": 1, "explanation": "Plant Growth Promoting Rhizobacteria (PGPR) colonize roots/rhizosphere soil and benefit crops, e.g., Pseudomonas fluorescens.", "id": "q167"}, {"topic": "Vermicompost", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Worm castings from vermicomposting contain approximately how much more available nitrogen and available potash, respectively, compared to good topsoil?", "options": ["2 times nitrogen, 4 times potash", "3 times nitrogen, 5 times potash", "5 times nitrogen, 7 times potash", "7 times nitrogen, 3 times potash", "10 times nitrogen, 10 times potash"], "correct": 2, "explanation": "Worm castings contain 5 times the available nitrogen, 7 times the available potash, and 1.5 times more calcium than good topsoil.", "id": "q168"}, {"topic": "Vermicompost", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Worm castings can hold close to how many times their own weight in water, and what is the recommended rate of vermicompost application?", "options": ["5 times; 5-10%", "12 times; 25-30%", "6 times; 20-25%", "9 times; 15-20%", "3 times; 10-15%"], "correct": 3, "explanation": "Worm castings can hold close to nine times their weight in water; the recommended application rate is 15-20%.", "id": "q169"}, {"topic": "Vermicompost", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on the phases of Vermicomposting:\n1. Phase 1 involves collection of wastes, shredding, and mechanical separation of metal, glass and ceramics.\n2. Phase 2 pre-digests organic waste for twenty days with cattle dung slurry, and wet dung should not be used.\n3. Phase 3 involves preparing an earthworm bed, requiring a concrete base rather than loose soil.\n4. Phase 5 involves collection of earthworms via the trapping method using cow dung balls.\nWhich of the statements given above are correct?", "options": ["1, 2, 3 and 4", "2, 3 and 4", "1, 3 and 4", "Only 3 and 4", "1, 2 and 3"], "correct": 4, "explanation": "Statement 4 is incorrect: harvesting earthworms via the cow-dung-ball trapping method is described under section 32.10 (Harvesting earthworm), not Phase 5 (which is about storing the finished vermicompost). Statements 1, 2 and 3 correctly describe Phases 1-3.", "id": "q170"}, {"topic": "Vermicompost", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which earthworm species is preferred over the other two for vermicompost production, because it produces vermicompost faster and generates more young ones during the composting period?", "options": ["African earthworm (Eudrilus eugeniae)", "Tiger worm", "Composting worm (Perionyx excavatus)", "Common earthworm (Lumbricus terrestris)", "Red worm (Eisenia foetida)"], "correct": 0, "explanation": "The African earthworm (Eudrilus eugeniae) is preferred for producing vermicompost faster with more young ones during composting, compared to Red worm and composting worm.", "id": "q171"}, {"topic": "Vermicompost", "difficulty": "Hard", "type": "figure", "passage": null, "question": "For a vermicompost bed measuring 1 metre length, 1 metre breadth and 0.5 metre height, how much worm (by weight and approximate number) is required?", "options": ["0.5 kg (500 nos.)", "1 kg (1000 nos.)", "1.5 kg (1500 nos.)", "3 kg (3000 nos.)", "2 kg (2000 nos.)"], "correct": 1, "explanation": "For a 1m x 1m x 0.5m bed, 1 kg of worm (approximately 1000 numbers) is required.", "id": "q172"}, {"topic": "Vermicompost", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "What moisture level should be maintained throughout the vermicomposting process, and what percentage of cattle dung should be mixed with predigested waste by weight or volume?", "options": ["70% moisture; 40% cattle dung", "50% moisture; 20% cattle dung", "60% moisture; 30% cattle dung", "60% moisture; 50% cattle dung", "40% moisture; 25% cattle dung"], "correct": 2, "explanation": "60% moisture should be maintained throughout, with predigested waste mixed with 30% cattle dung by weight or volume.", "id": "q173"}, {"topic": "Vermicompost", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on the nutritive value of vermicompost:\n1. Organic carbon content ranges from 9.5% to 17.98%.\n2. Nitrogen content ranges from 0.5% to 1.50%.\n3. Nutrient content is always uniform regardless of the waste material used.\n4. Zinc content ranges from 5.70 to 11.50 mg/kg.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 3 and 4", "1, 2, 3 and 4", "1, 2 and 4", "Only 3 and 4"], "correct": 3, "explanation": "Statement 3 is incorrect: nutrient content in vermicompost VARIES depending on the waste material used \u2014 heterogeneous waste gives a wider nutrient range, homogeneous waste gives fewer nutrients. Statements 1, 2 and 4 are correct.", "id": "q174"}, {"topic": "Vermicompost", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Compost worms are subject to a disease known as 'sour crop', which is caused by:", "options": ["Bacterial infection from cattle manure", "Viral infection", "Overfeeding with fruit waste", "Fungal contamination of bedding", "Environmental conditions"], "correct": 4, "explanation": "Compost worms are subject to a disease known as 'sour crop', caused by environmental conditions (they are not otherwise subject to microorganism-caused diseases).", "id": "q175"}, {"topic": "Vermicompost", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Under ideal conditions, compost worms can consume in excess of their body weight each day, but the general rule-of-thumb feeding rate is what fraction of their body weight per day?", "options": ["1/2 of body weight", "Twice their body weight", "1/10 of body weight", "1/4 of body weight", "3/4 of body weight"], "correct": 0, "explanation": "The general rule-of-thumb for feeding compost worms is 1/2 of their body weight per day, though they can consume more under ideal conditions.", "id": "q176"}, {"topic": "Watershed Management", "difficulty": "Easy", "type": "definitional", "passage": null, "question": "________ is an area of land that feeds all the water running under it and draining off from a single outlet into a water body, its boundary determined by surrounding ridge tops.", "options": ["Aquifer", "Watershed", "Regolith basin", "Catchment reservoir", "Drainage delta"], "correct": 1, "explanation": "A watershed is an area of land draining to a single outlet into a water body, bounded by surrounding ridge tops.", "id": "q177"}, {"topic": "Watershed Management", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on the classification of watersheds by size:\n1. A Macro watershed is greater than 50,000 hectares.\n2. A Sub-watershed ranges from 10,000 to 50,000 hectares.\n3. A Milli-watershed ranges from 1,000 to 10,000 hectares.\n4. A Micro watershed ranges from 100 to 1,000 hectares, and a Mini watershed from 1 to 100 hectares.\nWhich of the statements given above are correct?", "options": ["Only 3 and 4", "2, 3 and 4", "1, 2, 3 and 4", "1, 2 and 3", "1, 3 and 4"], "correct": 2, "explanation": "All four statements correctly describe the five watershed size classifications: Macro (>50,000 ha), Sub (10,000-50,000 ha), Milli (1,000-10,000 ha), Micro (100-1,000 ha), and Mini (1-100 ha).", "id": "q178"}, {"topic": "Watershed Management", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which of the following is the process by which water on the ground surface enters the soil, typically measured in millimetres or inches per hour?", "options": ["Recharge", "Surface runoff", "Percolation", "Infiltration", "Evapotranspiration"], "correct": 3, "explanation": "Infiltration is the process by which water on the ground surface enters the soil, measured in mm/hour or in/hour.", "id": "q179"}, {"topic": "Watershed Management", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on objectives of watershed management:\n1. To control damaging runoff and degradation, conserving soil and water.\n2. To increase infiltration of rainwater and enhance groundwater recharge.\n3. To moderate flood peaks at downstream areas.\n4. To maximize surface runoff for quicker disposal of excess rainwater.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 2, 3 and 4", "Only 3 and 4", "1, 3 and 4", "1, 2 and 3"], "correct": 4, "explanation": "Statement 4 is incorrect: watershed management objectives aim to CONTROL damaging runoff, not maximize it \u2014 increasing infiltration and reducing harmful runoff is the goal. Statements 1, 2 and 3 are correct objectives.", "id": "q180"}, {"topic": "Watershed Management", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which of the following is classified under 'Watershed characters' as a factor affecting watershed management, as opposed to climatic characteristics or land use pattern?", "options": ["Size, shape, topography, soils and relief", "Precipitation amount and intensity", "Water resource capabilities", "Vegetative cover and density", "Social status of inhabitants"], "correct": 0, "explanation": "Watershed characters include size, shape, topography, soils and relief \u2014 distinct from climatic characteristics (precipitation) and land use pattern (vegetative cover).", "id": "q181"}, {"topic": "Rainwater Harvesting & Groundwater Recharge", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which structure is a small dam built across a river primarily to control the upstream water level, rather than to create storage as large dams do?", "options": ["Percolation pond", "Weir", "Check dam", "Recharge shaft", "Farm pond"], "correct": 1, "explanation": "A weir is a small dam built across a river to control the upstream water level, not to create storage like large dams.", "id": "q182"}, {"topic": "Rainwater Harvesting & Groundwater Recharge", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "A small dam constructed across a drainage ditch, swale or channel to lower flow velocity and reduce erosion, recommended for drainage areas of 2 acres or less, is called a:", "options": ["Percolation pond", "Recharge well", "Check dam", "Weir", "Recharge pit"], "correct": 2, "explanation": "A check dam lowers flow velocity in a drainage channel to reduce erosion, recommended for drainage areas of 2 acres or less.", "id": "q183"}, {"topic": "Rainwater Harvesting & Groundwater Recharge", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on groundwater recharge structures:\n1. Recharge pits are constructed 1 to 2 m wide and up to 3 m deep, backfilled with boulders, gravels and coarse sand.\n2. Recharge wells are generally 100 to 300 mm in diameter, used for recharging deeper aquifers.\n3. Recharge shafts are used for recharging shallow aquifers below clayey surfaces, and are 0.5 to 3 m in diameter and 10 to 15 m deep.\n4. Trenches are used when a permeable stratum is available at great depth, typically over 50 m.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 2, 3 and 4", "Only 3 and 4", "1, 2 and 3", "1, 3 and 4"], "correct": 3, "explanation": "Statement 4 is incorrect: trenches are used when a permeable stratum is available at SHALLOW depth, not great depth (typically 0.5-1 m wide, 1-1.5 m deep, 10-20 m long). Statements 1, 2 and 3 are correct.", "id": "q184"}, {"topic": "Rainwater Harvesting & Groundwater Recharge", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Lateral shafts with bore wells, used for recharging both upper and deeper aquifers, are constructed to what approximate width and length?", "options": ["0.5-1 m wide, 5-10 m long", "1-2 m wide, 5-15 m long", "3-5 m wide, 20-40 m long", "2-3 m wide, 30-50 m long", "1.5-2 m wide, 10-30 m long"], "correct": 4, "explanation": "Lateral shafts with bore wells are 1.5-2 m wide and 10-30 m long, backfilled with boulders, gravels and coarse sand.", "id": "q185"}, {"topic": "Rainwater Harvesting & Groundwater Recharge", "difficulty": "Hard", "type": "figure", "passage": null, "question": "Estimated additional groundwater recharge from a 100 sq. m. rooftop area (via artificial recharge) is approximately how many litres?", "options": ["55,000 litres", "75,000 litres", "15,000 litres", "100,000 litres", "35,000 litres"], "correct": 0, "explanation": "Estimated additional recharge from a 100 sq. m. rooftop area is approximately 55,000 litres.", "id": "q186"}, {"topic": "Rainwater Harvesting & Groundwater Recharge", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on benefits of Artificial Recharge:\n1. It improves infiltration and reduces runoff.\n2. It improves groundwater levels, yields and quality.\n3. It is only effective in coastal regions and has no role inland.\nWhich of the statements given above are correct?", "options": ["Only 3", "1 and 2", "2 and 3", "1, 2 and 3", "Only 1"], "correct": 1, "explanation": "Statement 3 is incorrect and unsupported by the text \u2014 artificial recharge benefits (improved infiltration, groundwater levels/yields/quality) are general, not limited to coastal regions. Statements 1 and 2 are correct.", "id": "q187"}, {"topic": "Rainwater Harvesting & Groundwater Recharge", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "The 'Spreading technique' of groundwater recharge, used when permeable strata start from the top, involves spreading water in streams/nalas using which structures?", "options": ["Recharge shafts exclusively", "Deep tube wells exclusively", "Check dams, nala bunds, cement plugs, gabion structures or percolation ponds", "Hand pumps only", "Recharge wells only"], "correct": 2, "explanation": "The spreading technique uses check dams, nala bunds, cement plugs, gabion structures, or a percolation pond to spread water when permeable strata start from the top.", "id": "q188"}]</script>
<script>
(function(){
  "use strict";
  var ALL_Q = JSON.parse(document.getElementById('quiz-data').textContent);
  var LETTERS = ['A','B','C','D','E'];

  // Build topic list preserving PDF (authoring) order of first appearance
  var TOPICS = [];
  ALL_Q.forEach(function(q){
    if (TOPICS.indexOf(q.topic) === -1) TOPICS.push(q.topic);
  });

  var state = {
    screen: 'home',
    mode: null,          // 'full' | 'section' | 'sprint'
    order: 'pdf',         // 'pdf' | 'shuffled'
    sectionTopic: null,
    queue: [],            // array of question objects for this session
    idx: 0,
    answers: {},           // qid -> {chosen: idx|null, skipped: bool, correct: bool}
    locked: false
  };

  var app = document.getElementById('app');

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Renders text with literal \n as line breaks, escaping HTML first.
  function renderMultiline(s){
    return escapeHtml(s).replace(/\n/g, '<br>');
  }

  function render(){
    if (state.screen === 'home') return renderHome();
    if (state.screen === 'full-setup') return renderFullSetup();
    if (state.screen === 'section-picker') return renderSectionPicker();
    if (state.screen === 'quiz') return renderQuiz();
    if (state.screen === 'end') return renderEnd();
  }

  function brandBar(){
    return '<div class="brand">' +
      '<div class="brand-title">Soil &amp; Water Conservation<small>NABARD Grade A — ARD Practice Series</small></div>' +
      '<div class="brand-mark">edutap</div>' +
      '</div>';
  }

  function renderHome(){
    var sprintCount = ALL_Q.filter(function(q){ return q.type === 'statement' || q.type === 'scenario'; }).length;
    app.innerHTML =
      brandBar() +
      '<div class="hero">' +
        '<h1>Practice Quiz</h1>' +
        '<p>' + ALL_Q.length + ' questions drawn directly from the chapter, styled on real ARD mock-test papers. Pick a mode to begin.</p>' +
      '</div>' +
      '<div class="mode-list">' +
        modeCard('full', '📘', 'Full Practice Test', 'Every question in the chapter, in PDF order or shuffled.', ALL_Q.length + ' questions', '#c8a24a') +
        modeCard('section', '🗂', 'Section-wise Revision', 'Drill one topic at a time — pick from ' + TOPICS.length + ' sections.', TOPICS.length + ' sections', '#7fa7c8') +
        modeCard('sprint', '⚡', 'Statement &amp; Scenario Sprint', 'Only the numbered-statement and applied-scenario questions — the hardest format.', sprintCount + ' questions', '#c88f4a') +
      '</div>';

    document.querySelectorAll('.mode-card').forEach(function(el){
      el.addEventListener('click', function(){
        var mode = el.getAttribute('data-mode');
        if (mode === 'full'){ state.screen = 'full-setup'; render(); }
        else if (mode === 'section'){ state.screen = 'section-picker'; render(); }
        else if (mode === 'sprint'){ startSession('sprint'); }
      });
    });
  }

  function modeCard(mode, icon, name, desc, count, color){
    return '<button class="mode-card" data-mode="' + mode + '" style="--mode-color:' + color + '">' +
      '<div class="mode-icon">' + icon + '</div>' +
      '<div class="mode-copy"><div class="mode-name">' + name + '</div><div class="mode-desc">' + desc + '</div></div>' +
      '<div class="mode-count">' + count + '</div>' +
      '</button>';
  }

  function renderFullSetup(){
    app.innerHTML =
      brandBar() +
      '<a class="back-link" id="backHome">&larr; Back to menu</a>' +
      '<div class="hero"><h1>Full Practice Test</h1>' +
      '<p>All ' + ALL_Q.length + ' questions from the chapter. Choose the order you want to attempt them in.</p></div>' +
      '<div class="order-toggle">' +
        '<button class="toggle-btn ' + (state.order === 'pdf' ? 'active' : '') + '" id="ordPdf">PDF Order</button>' +
        '<button class="toggle-btn ' + (state.order === 'shuffled' ? 'active' : '') + '" id="ordShuf">Shuffled</button>' +
      '</div>' +
      '<button class="start-btn" id="startFull">Start Test</button>';

    document.getElementById('backHome').addEventListener('click', function(){ state.screen='home'; render(); });
    document.getElementById('ordPdf').addEventListener('click', function(){ state.order='pdf'; render(); });
    document.getElementById('ordShuf').addEventListener('click', function(){ state.order='shuffled'; render(); });
    document.getElementById('startFull').addEventListener('click', function(){ startSession('full'); });
  }

  function renderSectionPicker(){
    var cards = TOPICS.map(function(t){
      var count = ALL_Q.filter(function(q){ return q.topic === t; }).length;
      return '<button class="topic-card" data-topic="' + escapeHtml(t) + '">' +
        '<div class="topic-name">' + escapeHtml(t) + '</div>' +
        '<div class="topic-count">' + count + ' questions</div>' +
        '</button>';
    }).join('');

    app.innerHTML =
      brandBar() +
      '<a class="back-link" id="backHome">&larr; Back to menu</a>' +
      '<div class="hero"><h1>Section-wise Revision</h1>' +
      '<p>Pick a topic to drill just those questions.</p></div>' +
      '<div class="topic-grid">' + cards + '</div>';

    document.getElementById('backHome').addEventListener('click', function(){ state.screen='home'; render(); });
    document.querySelectorAll('.topic-card').forEach(function(el){
      el.addEventListener('click', function(){
        state.sectionTopic = el.getAttribute('data-topic');
        startSession('section');
      });
    });
  }

  function startSession(mode){
    state.mode = mode;
    var pool;
    if (mode === 'full'){
      pool = ALL_Q.slice();
      if (state.order === 'shuffled') pool = shuffle(pool);
    } else if (mode === 'section'){
      pool = ALL_Q.filter(function(q){ return q.topic === state.sectionTopic; });
    } else if (mode === 'sprint'){
      pool = shuffle(ALL_Q.filter(function(q){ return q.type === 'statement' || q.type === 'scenario'; }));
    }
    state.queue = pool;
    state.idx = 0;
    state.answers = {};
    state.locked = false;
    state.screen = 'quiz';
    render();
  }

  function currentQ(){ return state.queue[state.idx]; }

  function renderQuiz(){
    var total = state.queue.length;
    if (total === 0){
      app.innerHTML = brandBar() + '<a class="back-link" id="backHome">&larr; Back to menu</a><div class="empty-note">No questions in this set.</div>';
      document.getElementById('backHome').addEventListener('click', function(){ state.screen='home'; render(); });
      return;
    }
    var q = currentQ();
    var answered = state.answers[q.id];
    var score = Object.keys(state.answers).filter(function(k){ return state.answers[k].correct; }).length;
    var pct = Math.round(((state.idx) / total) * 100);

    var passageHtml = '';
    if (q.type === 'statement' || q.type === 'scenario' || q.type === 'definitional'){
      // The instruction / passage text is embedded in the question string for
      // fill-in-blank / statement-block questions; render it as an instruction box
      // when it's long or multi-line, matching real exam passage styling.
      if (q.question.indexOf('\n') !== -1 || q.question.length > 140){
        passageHtml = '<div class="instruction-box"><div class="instruction-label">Instruction</div>' + renderMultiline(q.question) + '</div>';
      }
    }
    var questionLine = passageHtml ?
      (q.type === 'statement' ? 'Which of the statements given above are correct?' :
       q.type === 'scenario' ? 'Based on the passage above, choose the correct answer.' :
       'Which of the following correctly fills the blank above?') :
      escapeHtml(q.question);

    var optsHtml = q.options.map(function(opt, i){
      return '<div class="opt" data-idx="' + i + '">' +
        '<div class="opt-letter">' + LETTERS[i] + '</div>' +
        '<div class="opt-text">' + escapeHtml(opt) + '</div>' +
        '</div>';
    }).join('');

    app.innerHTML =
      '<div class="quiz-topbar">' +
        '<div class="quiz-meta"><span>Question ' + (state.idx + 1) + ' of ' + total + '</span><span class="score">Score: ' + score + '</span></div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div class="qcard">' +
        '<div class="qtags"><span class="tag diff-' + q.difficulty + '">' + q.difficulty + '</span><span class="tag">' + escapeHtml(q.topic) + '</span></div>' +
        passageHtml +
        '<div class="qtext">' + (passageHtml ? questionLine : escapeHtml(q.question)) + '</div>' +
        '<div class="options" id="optsWrap">' + optsHtml + '</div>' +
        '<div class="explain" id="explainBox"></div>' +
        '<div class="qactions">' +
          '<button class="skip-btn" id="skipBtn">Skip</button>' +
          '<button class="next-btn" id="nextBtn">' + (state.idx === total - 1 ? 'Finish' : 'Next') + '</button>' +
        '</div>' +
      '</div>';

    if (answered){
      lockOptions(q, answered.chosen);
    } else {
      document.querySelectorAll('.opt').forEach(function(el){
        el.addEventListener('click', function(){
          if (state.locked) return;
          var idx = parseInt(el.getAttribute('data-idx'), 10);
          submitAnswer(q, idx, false);
        });
      });
    }

    document.getElementById('skipBtn').addEventListener('click', function(){
      if (state.answers[q.id]) return;
      submitAnswer(q, null, true);
    });
    document.getElementById('nextBtn').addEventListener('click', goNext);

    if (answered) {
      document.getElementById('skipBtn').style.display = 'none';
      document.getElementById('nextBtn').classList.add('show');
    }
  }

  function submitAnswer(q, chosenIdx, skipped){
    state.locked = true;
    var correct = !skipped && chosenIdx === q.correct;
    state.answers[q.id] = { chosen: chosenIdx, skipped: skipped, correct: correct };
    lockOptions(q, chosenIdx);
    document.getElementById('skipBtn').style.display = 'none';
    document.getElementById('nextBtn').classList.add('show');
    // update score display live
    var score = Object.keys(state.answers).filter(function(k){ return state.answers[k].correct; }).length;
    var scoreEl = document.querySelector('.quiz-meta .score');
    if (scoreEl) scoreEl.textContent = 'Score: ' + score;
  }

  function lockOptions(q, chosenIdx){
    state.locked = true;
    document.querySelectorAll('.opt').forEach(function(el){
      var idx = parseInt(el.getAttribute('data-idx'), 10);
      el.classList.add('locked');
      if (idx === q.correct) el.classList.add('correct');
      else if (idx === chosenIdx) el.classList.add('incorrect');
      else el.classList.add('dim');
    });
    var box = document.getElementById('explainBox');
    var letter = LETTERS[q.correct];
    box.innerHTML = '<b>Correct answer: ' + letter + '.</b> ' + escapeHtml(q.explanation);
    box.classList.add('show');
  }

  function goNext(){
    state.locked = false;
    if (state.idx < state.queue.length - 1){
      state.idx++;
      render();
      window.scrollTo({top:0, behavior:'instant'});
    } else {
      state.screen = 'end';
      render();
      window.scrollTo({top:0, behavior:'instant'});
    }
  }

  function renderEnd(){
    var total = state.queue.length;
    var correctCount = 0, skippedCount = 0, wrongCount = 0;
    var byDiff = { Easy: {c:0,t:0}, Moderate: {c:0,t:0}, Hard: {c:0,t:0} };
    var missedItems = [];

    state.queue.forEach(function(q){
      var a = state.answers[q.id];
      if (!a) return; // shouldn't happen
      byDiff[q.difficulty].t++;
      if (a.correct){ correctCount++; byDiff[q.difficulty].c++; }
      else if (a.skipped){ skippedCount++; missedItems.push({q:q, a:a, status:'skipped'}); }
      else { wrongCount++; missedItems.push({q:q, a:a, status:'missed'}); }
    });

    var pctScore = total ? Math.round((correctCount / total) * 100) : 0;

    var breakdownHtml = ['Easy','Moderate','Hard'].map(function(d){
      var b = byDiff[d];
      var pct = b.t ? Math.round((b.c / b.t) * 100) : 0;
      return '<div class="breakdown-item"><div class="breakdown-pct">' + (b.t ? pct + '%' : '—') + '</div>' +
        '<div class="breakdown-label">' + d + (b.t ? ' (' + b.c + '/' + b.t + ')' : ' (0)') + '</div></div>';
    }).join('');

    var reviewHtml = '';
    if (missedItems.length){
      reviewHtml = '<div class="review-section"><h2>Review — Missed &amp; Skipped (' + missedItems.length + ')</h2>' +
        missedItems.map(function(item){
          var q = item.q, a = item.a;
          var yourRow = a.skipped ? '' :
            '<div class="review-row wrong">Your answer: ' + LETTERS[a.chosen] + '. ' + escapeHtml(q.options[a.chosen]) + '</div>';
          return '<div class="review-item">' +
            '<span class="review-status status-' + item.status + '">' + (item.status === 'skipped' ? 'SKIPPED' : 'MISSED') + '</span>' +
            '<div class="review-q">' + escapeHtml(q.question.length > 220 ? q.question.slice(0,220) + '…' : q.question) + '</div>' +
            yourRow +
            '<div class="review-row right">Correct answer: ' + LETTERS[q.correct] + '. ' + escapeHtml(q.options[q.correct]) + '</div>' +
            '<div class="review-explain">' + escapeHtml(q.explanation) + '</div>' +
            '</div>';
        }).join('');
      reviewHtml += '</div>';
    }

    app.innerHTML =
      brandBar() +
      '<div class="result-hero">' +
        '<div class="result-score">' + correctCount + '<span> / ' + total + '</span></div>' +
        '<div class="result-sub">' + pctScore + '% correct · ' + wrongCount + ' missed · ' + skippedCount + ' skipped</div>' +
      '</div>' +
      '<div class="breakdown">' + breakdownHtml + '</div>' +
      reviewHtml +
      '<div class="end-actions">' +
        '<button class="btn-retry" id="retryBtn">Retry Same Set</button>' +
        '<button class="btn-menu" id="menuBtn">Back to Menu</button>' +
      '</div>';

    document.getElementById('retryBtn').addEventListener('click', function(){
      state.idx = 0;
      state.answers = {};
      state.locked = false;
      if (state.mode === 'full' && state.order === 'shuffled') state.queue = shuffle(ALL_Q.slice());
      if (state.mode === 'sprint') state.queue = shuffle(state.queue.slice());
      state.screen = 'quiz';
      render();
      window.scrollTo({top:0, behavior:'instant'});
    });
    document.getElementById('menuBtn').addEventListener('click', function(){
      state.screen = 'home';
      render();
      window.scrollTo({top:0, behavior:'instant'});
    });
  }

  render();
})();

</script>
</body>
</html>
