<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil &amp; Water Conservation — NABARD Grade A Practice</title>
<style>
  :root{
    --bg: #11141a;
    --bg-raised: #171b22;
    --surface: #1c212a;
    --surface-2: #242a35;
    --border: #2c3340;
    --text: #e9e6dd;
    --text-dim: #9aa2b1;
    --text-faint: #6b7383;
    --gold: #c8a24a;
    --gold-dim: #8f7538;
    --correct: #5aa572;
    --correct-bg: #1c2b22;
    --incorrect: #d1715f;
    --incorrect-bg: #2c1e1c;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.5;
  }
  ::selection{ background: var(--gold-dim); color: #fff; }

  .app{
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 18px 80px;
    min-height: 100vh;
  }

  /* ---------- Header / brand ---------- */
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom: 18px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  .brand-title{
    font-family: var(--serif);
    font-size: 20px;
    letter-spacing: 0.2px;
    color: var(--text);
  }
  .brand-title small{
    display:block;
    font-family: var(--sans);
    font-size: 11.5px;
    color: var(--text-faint);
    margin-top: 3px;
    font-weight: 500;
  }
  .brand-mark{
    font-family: var(--serif);
    font-style: italic;
    color: var(--gold);
    font-size: 13px;
  }

  /* ---------- Home screen ---------- */
  .hero{
    margin-bottom: 28px;
  }
  .hero h1{
    font-family: var(--serif);
    font-size: 27px;
    font-weight: 400;
    margin: 0 0 8px;
    color: var(--text);
  }
  .hero p{
    color: var(--text-dim);
    font-size: 14.5px;
    max-width: 54ch;
    margin: 0;
  }

  .mode-list{
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .mode-card{
    display:flex;
    align-items:center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--mode-color, var(--gold));
    border-radius: 6px;
    padding: 18px 18px;
    cursor: pointer;
    text-align:left;
    width:100%;
    color: var(--text);
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
    font-family: var(--sans);
  }
  .mode-card:hover{ background: var(--surface-2); }
  .mode-card:active{ transform: scale(0.997); }
  .mode-icon{
    font-family: var(--serif);
    font-size: 22px;
    color: var(--mode-color, var(--gold));
    width: 34px;
    text-align:center;
    flex: none;
  }
  .mode-copy{ flex:1; min-width:0; }
  .mode-name{ font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .mode-desc{ font-size: 13px; color: var(--text-dim); }
  .mode-count{
    font-size: 12px;
    color: var(--text-faint);
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }

  .order-toggle{
    display:flex;
    gap:8px;
    margin: 16px 0 4px;
  }
  .toggle-btn{
    flex:1;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 13.5px;
    cursor:pointer;
    font-family: var(--sans);
  }
  .toggle-btn.active{
    border-color: var(--gold-dim);
    background: var(--surface-2);
    color: var(--gold);
    font-weight: 600;
  }
  .start-btn{
    display:block;
    width:100%;
    margin-top: 14px;
    padding: 13px 16px;
    background: var(--gold);
    color: #171006;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--sans);
  }
  .start-btn:hover{ filter: brightness(1.06); }
  .back-link{
    display:inline-block;
    margin-bottom: 16px;
    color: var(--text-dim);
    font-size: 13.5px;
    cursor: pointer;
    text-decoration: none;
  }
  .back-link:hover{ color: var(--text); }

  /* ---------- Section grid ---------- */
  .topic-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 480px){ .topic-grid{ grid-template-columns: 1fr; } }
  .topic-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 14px;
    cursor: pointer;
    text-align:left;
    color: var(--text);
    font-family: var(--sans);
    transition: background .15s ease;
  }
  .topic-card:hover{ background: var(--surface-2); border-color: var(--gold-dim); }
  .topic-name{ font-size: 13.5px; font-weight: 600; margin-bottom: 6px; line-height:1.3; }
  .topic-count{ font-size: 12px; color: var(--text-faint); }

  /* ---------- Quiz top bar ---------- */
  .quiz-topbar{
    position: sticky;
    top: 0;
    background: var(--bg);
    padding-top: 4px;
    padding-bottom: 12px;
    z-index: 10;
    margin-bottom: 8px;
  }
  .quiz-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .quiz-meta .score{ color: var(--gold); font-weight:600; }
  .progress-track{
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    background: var(--gold);
    border-radius: 3px;
    transition: width .25s ease;
  }

  /* ---------- Question card ---------- */
  .qcard{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 20px 18px;
    margin-bottom: 16px;
  }
  .qtags{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .tag{
    font-size: 10.5px;
    letter-spacing: 0.3px;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-faint);
  }
  .tag.diff-Easy{ color: #7fb99a; border-color: #2c4436; }
  .tag.diff-Moderate{ color: #c8a24a; border-color: #4a3e22; }
  .tag.diff-Hard{ color: #d1715f; border-color: #4a2b26; }

  .instruction-box{
    background: var(--bg-raised);
    border-left: 3px solid var(--gold-dim);
    padding: 12px 14px;
    border-radius: 4px;
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 14px;
    white-space: pre-wrap;
  }
  .instruction-label{
    font-family: var(--sans);
    font-size: 10.5px;
    text-transform: none;
    color: var(--gold);
    letter-spacing: 0.3px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .qtext{
    font-size: 15.5px;
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .options{ display:flex; flex-direction:column; gap:9px; }
  .opt{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    transition: border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(.locked){ border-color: var(--gold-dim); }
  .opt-letter{
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--text-faint);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-dim);
  }
  .opt-text{ flex:1; padding-top: 1px; }
  .opt.correct{ background: var(--correct-bg); border-color: var(--correct); }
  .opt.correct .opt-letter{ background: var(--correct); border-color: var(--correct); color: #0d1b12; }
  .opt.incorrect{ background: var(--incorrect-bg); border-color: var(--incorrect); }
  .opt.incorrect .opt-letter{ background: var(--incorrect); border-color: var(--incorrect); color: #2a0f0b; }
  .opt.locked{ cursor: default; }
  .opt.dim{ opacity: 0.55; }

  .explain{
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--bg-raised);
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    display:none;
  }
  .explain.show{ display:block; }
  .explain b{ color: var(--text); }

  .qactions{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 4px;
  }
  .skip-btn{
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .skip-btn:hover{ border-color: var(--text-faint); color: var(--text); }
  .next-btn{
    background: var(--gold);
    color: #171006;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--sans);
    display:none;
  }
  .next-btn.show{ display:inline-block; }

  /* ---------- End screen ---------- */
  .result-hero{
    text-align:center;
    padding: 20px 0 10px;
  }
  .result-score{
    font-family: var(--serif);
    font-size: 52px;
    color: var(--gold);
    line-height:1;
  }
  .result-score span{ font-size: 22px; color: var(--text-faint); }
  .result-sub{ color: var(--text-dim); font-size: 14px; margin-top: 8px; }

  .breakdown{
    display:flex;
    gap: 10px;
    margin: 22px 0;
  }
  .breakdown-item{
    flex:1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 10px;
    text-align:center;
  }
  .breakdown-pct{ font-size: 20px; font-weight:700; color: var(--text); }
  .breakdown-label{ font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  .review-section h2{
    font-family: var(--serif);
    font-weight:400;
    font-size: 18px;
    margin: 26px 0 12px;
    color: var(--text);
  }
  .review-item{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .review-q{ font-size: 13.5px; font-weight:600; margin-bottom: 8px; }
  .review-row{ font-size: 12.5px; margin-bottom: 3px; }
  .review-row.wrong{ color: var(--incorrect); }
  .review-row.right{ color: var(--correct); }
  .review-explain{ font-size: 12.5px; color: var(--text-dim); margin-top: 6px; }
  .review-status{
    display:inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    margin-bottom: 8px;
    font-weight:700;
    letter-spacing: 0.3px;
  }
  .status-missed{ background: var(--incorrect-bg); color: var(--incorrect); }
  .status-skipped{ background: var(--surface-2); color: var(--text-faint); }

  .end-actions{
    display:flex;
    gap: 10px;
    margin-top: 26px;
  }
  .end-actions button{
    flex:1;
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight:600;
    cursor:pointer;
    font-family: var(--sans);
  }
  .btn-retry{ background: var(--gold); color:#171006; border:none; }
  .btn-menu{ background: var(--surface); color: var(--text); border: 1px solid var(--border); }

  .empty-note{ color: var(--text-dim); font-size: 13.5px; text-align:center; padding: 30px 0; }

  @media (max-width: 480px){
    .hero h1{ font-size: 23px; }
    .result-score{ font-size: 42px; }
    .breakdown{ flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script id="quiz-data" type="application/json">[{"topic": "Soil Basics & Terminology", "difficulty": "Easy", "type": "definitional", "passage": null, "question": "________ is one of the three major natural resources, alongside air and water, forming at the surface of land and often called the \"skin of the earth\".", "options": ["Soil", "Parent material", "Humus", "Pedon", "Regolith"], "correct": 0, "explanation": "Soil is described in the text as the 'skin of the earth', one of the three major natural resources alongside air and water.", "id": "q1"}, {"topic": "Soil Basics & Terminology", "difficulty": "Easy", "type": "recall", "passage": null, "question": "The term 'Soil' is derived from which Latin word, meaning 'floor'?", "options": ["Regio", "Solum", "Pedum", "Terra", "Humus"], "correct": 1, "explanation": "Soil comes from the Latin word 'Solum', meaning floor.", "id": "q2"}, {"topic": "Soil Basics & Terminology", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Read the following statements about Soil Science and its disciplines:\n1. Soil fertility deals with the nutrient supplying properties of soil.\n2. Soil pedology deals with the genesis, survey and classification of soil.\n3. Soil conservation deals only with the chemical constituents of soil.\n4. Soil microbiology deals with micro-organisms, their population and role in transformations.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "Only 3", "1, 2 and 4", "1, 2, 3 and 4", "Only 1 and 3"], "correct": 2, "explanation": "Statement 3 is incorrect \u2014 soil conservation deals with protection against erosion and chemical deterioration (nutrient loss), not merely chemical constituents (that is soil chemistry). Statements 1, 2 and 4 correctly describe soil fertility, pedology and microbiology respectively.", "id": "q3"}, {"topic": "Soil Basics & Terminology", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "There are two main branches of soil science based on the approach used to study soil. One treats soil as a natural body, a weathered and synthesized product in nature, while the other treats soil as a medium for plant growth. The first of these two is called ________.", "options": ["Mineralogy", "Geomorphology", "Edaphology", "Pedology", "Agronomy"], "correct": 3, "explanation": "Pedology treats soil as a natural body; Edaphology treats soil as a medium for plant growth.", "id": "q4"}, {"topic": "Soil Basics & Terminology", "difficulty": "Easy", "type": "recall", "passage": null, "question": "Who is commonly regarded as the 'father of Soil Science'?", "options": ["Hans Jenny", "Mohr and van Baren", "Arnon and Stout", "Justus von Liebig", "Vasily Dokuchaev"], "correct": 4, "explanation": "Vasily Vasil'evich Dokuchaev, a Russian scientist, is commonly regarded as the father of Soil Science.", "id": "q5"}, {"topic": "Soil Basics & Terminology", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "A ________ is the smallest volume that can be called 'a soil' \u2014 a real, natural soil volume just large enough to show all the soil horizons present and their relationships.", "options": ["Pedon", "Regolith", "Horizon", "Solum", "Polypedon"], "correct": 0, "explanation": "A pedon is the smallest volume that can be called 'a soil'.", "id": "q6"}, {"topic": "Soil Basics & Terminology", "difficulty": "Hard", "type": "definitional", "passage": null, "question": "A contiguous group of similar such smallest soil volumes, bounded on all sides by 'not soil' or by units of unlike character, forming a real physical soil body with a minimum area of more than 1 sq. km, is termed a ________.", "options": ["Solum", "Polypedon", "Regolith", "Pedon", "Horizon"], "correct": 1, "explanation": "A polypedon is a contiguous group of similar pedons, with a minimum area of more than 1 sq. km and an unspecified maximum area.", "id": "q7"}, {"topic": "Soil Basics & Terminology", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "On a volume basis, what is the approximate composition of soil in terms of mineral matter, organic matter, soil water and soil air respectively?", "options": ["40%, 10%, 25%, 25%", "50%, 5%, 22.5%, 22.5%", "45%, 5%, 25%, 25%", "50%, 10%, 20%, 20%", "45%, 10%, 20%, 25%"], "correct": 2, "explanation": "Composition of soil on a volume basis: Mineral Matter 45%, Organic Matter 5%, Soil Water 25%, Soil Air 25%.", "id": "q8"}, {"topic": "Soil Basics & Terminology", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which of the following is the amount of soil moisture held in soil after excess water has drained away, usually 2\u20133 days after rain or irrigation, and is regarded as the upper limit of available water?", "options": ["Permanent Wilting Point", "Ultimate Wilting Point", "Saturation", "Field Capacity", "Maximum Allowable Depletion"], "correct": 3, "explanation": "Field Capacity (FC) is the amount of water a soil can hold against drainage by gravity, usually attained 2\u20133 days after rain/irrigation; it is the upper limit of available water.", "id": "q9"}, {"topic": "Soil Basics & Terminology", "difficulty": "Hard", "type": "figure", "passage": null, "question": "The soil moisture tension at the Permanent Wilting Point is about how many bars, while the Ultimate Wilting Point corresponds to a surface tension of about how many bars?", "options": ["20 bars; 50 bars", "15 bars; 100 bars", "10 bars; 30 bars", "5 bars; 15 bars", "15 bars; 60 bars"], "correct": 4, "explanation": "The soil moisture tension at Permanent Wilting Point is about 15 bars, and at the Ultimate Wilting Point the surface tension is about \u221260 bars.", "id": "q10"}, {"topic": "Soil Basics & Terminology", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Clay-containing soils generally have the highest available water capacity mainly because of which characteristic?", "options": ["Greater number of pores", "Lowest cation exchange capacity", "Highest bulk density", "Highest sand fraction", "Lowest organic matter content"], "correct": 0, "explanation": "Clay soils have the highest available water capacity owing to a greater number of pores, e.g., clayey loams.", "id": "q11"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "________ is the mobilization and translocation of constituents such as clay, Fe2O3, Al2O3, SiO2, humus and CaCO3 from one point of the soil body to another, and literally means 'washing out'; the horizon formed by this process is called the eluvial or A2/E horizon.", "options": ["Calcification", "Eluviation", "Leaching", "Humification", "Illuviation"], "correct": 1, "explanation": "Eluviation means washing out \u2014 the mobilization and translocation of constituents to another point in the soil, forming the eluvial (A2/E) horizon.", "id": "q12"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Regarding the following passage: \"________ is the mobilization and translocation of constituents such as clay, Fe2O3, Al2O3, SiO2, humus and CaCO3 from one point of the soil body to another, and literally means 'washing out'; the horizon formed by this process is called the eluvial or A2/E horizon.\" Which of the following is/are true according to the passage?", "options": ["None of the above", "It forms the B-horizon", "The horizon formed is called the eluvial horizon", "The process is also known as illuviation", "It increases bulk density directly"], "correct": 2, "explanation": "The passage explicitly states the horizon formed by eluviation is the eluvial (A2 or E) horizon; illuviation and B-horizon formation are the deposition process, not eluviation.", "id": "q13"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Easy", "type": "recall", "passage": null, "question": "The horizons formed by the process of deposition of translocated soil materials in the lower layer are termed:", "options": ["R horizons", "C horizons", "O horizons", "Illuvial (B) horizons", "Eluvial horizons"], "correct": 3, "explanation": "Illuviation deposits materials removed from the eluvial horizon into the lower layer, forming illuvial (B) horizons.", "id": "q14"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Easy", "type": "recall", "passage": null, "question": "In the soil horizon sequence, which layer represents unconsolidated parent material, and which represents bedrock?", "options": ["A is parent material, B is bedrock", "O is parent material, A is bedrock", "B is parent material, C is bedrock", "E is parent material, C is bedrock", "C is parent material, R is bedrock"], "correct": 4, "explanation": "C is parent material and R is bedrock in the standard soil horizon sequence (O, A, E, B, C, R).", "id": "q15"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Pedogenesis (soil formation) involves two consecutive stages: weathering of rock into regolith, and then formation of true soil from regolith. Which soil forming factor is primarily responsible for the second stage?", "options": ["Action of soil forming factors", "Gravity", "Physical weathering alone", "Erosion only", "Chemical weathering alone"], "correct": 0, "explanation": "The first stage is accomplished by weathering; the second stage is associated with the action of soil forming factors.", "id": "q16"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on weathering:\n1. Physical weathering changes the chemical composition of rock while breaking it into smaller pieces.\n2. Freeze-thaw weathering occurs because water expands when it freezes, widening cracks.\n3. Chemical weathering occurs when rocks are broken down by a chemical change, and depends on rock type.\n4. Biological weathering occurs when rocks are worn away by living organisms such as plant roots and bacteria.\nWhich of the statements given above are correct?", "options": ["1, 3 and 4", "2, 3 and 4", "Only 2 and 4", "1, 2, 3 and 4", "1, 2 and 3"], "correct": 1, "explanation": "Statement 1 is incorrect: in physical weathering, the chemical composition of the rock remains the same \u2014 only the physical size changes. Statements 2, 3 and 4 accurately describe freeze-thaw, chemical and biological weathering.", "id": "q17"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Splash erosion, the first stage of the water-erosion process, can throw soil particles as high as ________ above the ground and move them up to ________ from the point of impact.", "options": ["100 cm; 2 metres", "20 cm; 0.5 metres", "60 cm; 1.5 metres", "30 cm; 1 metre", "50 cm; 1 metre"], "correct": 2, "explanation": "Splash erosion can throw particles as high as 60 cm above the ground and move them up to 1.5 metres from the point of impact.", "id": "q18"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which stage of water erosion is characterised by shallow drainage lines less than 30 cm deep, developing when surface water concentrates in depressions?", "options": ["Stream bank erosion", "Splash erosion", "Gully erosion", "Rill erosion", "Sheet erosion"], "correct": 3, "explanation": "Rill erosion involves shallow drainage lines less than 30 cm deep, common in bare or overgrazed agricultural land.", "id": "q19"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Gully erosion is characterised by open, unstable channels cut to what minimum depth into the ground?", "options": ["10 cm", "20 cm", "50 cm", "100 cm", "30 cm"], "correct": 4, "explanation": "Gully erosion consists of open, unstable channels cut more than 30 cm deep into the ground \u2014 deeper than rill erosion.", "id": "q20"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on wind erosion types:\n1. Saltation involves soil particles of 0.1\u20130.5 mm diameter moving up in a vertical direction under stormy wind.\n2. Suspension involves fine particles less than 0.1 mm diameter being kicked up and taken to distant places.\n3. Surface creep involves large particles of 0.5\u20132 mm diameter creeping along the soil surface.\n4. Overgrazing and deforestation are biotic agents of soil erosion.\nWhich of the statements given above are correct?", "options": ["1, 2, 3 and 4", "1, 2 and 3 only", "Only 1 and 4", "Only 3 and 4", "2, 3 and 4 only"], "correct": 0, "explanation": "All four statements correctly describe the wind erosion mechanisms (saltation, suspension, surface creep) and biotic erosion agents as given in the text.", "id": "q21"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "________ is the process of formation of humic substances, decomposed organic matter that has reached maturity from plant remains; it can also be referred to as mineralization in this context.", "options": ["Illuviation", "Humification", "Gleization", "Calcification", "Eluviation"], "correct": 1, "explanation": "Humification is the process of formation of humic substances (mature organic matter) from decomposed plant remains.", "id": "q22"}, {"topic": "Soil Profile, Weathering & Erosion", "difficulty": "Easy", "type": "recall", "passage": null, "question": "What is 'Regolith'?", "options": ["A type of soil horizon rich in humus", "A synonym for topsoil", "Unconsolidated residues of weathered rock above solid rock", "The parent rock before any weathering", "Bedrock exposed at the surface"], "correct": 2, "explanation": "Regolith refers to unconsolidated residues of weathering rock on the earth's surface, above the solid rocks.", "id": "q23"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "________ is defined as the ploughing of a field across the slope during hot summer, using specialized tools, with the primary objective of opening the soil crust along with deep ploughing to disinfect the soil with the help of the sun's rays.", "options": ["Strip cropping", "Ridging", "Contour farming", "Summer ploughing", "Chisel ploughing"], "correct": 3, "explanation": "Summer ploughing opens the soil crust and disinfects the soil via sun exposure, and is best performed with pre-monsoon showers in May.", "id": "q24"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements about Summer Ploughing:\n1. At best, two summer ploughings are done before the onset of monsoon, at an interval of 15\u201320 days.\n2. Off-season tillage decreases the water content of soils and increases runoff.\n3. A third ploughing may be done with a harrow or cultivator to pulverize soil before sowing.\n4. Deep summer ploughing reduces pest and weed infestation.\nWhich of the statements given above are correct?", "options": ["1, 2, 3 and 4", "1, 2 and 3", "2, 3 and 4", "Only 2", "1, 3 and 4"], "correct": 4, "explanation": "Statement 2 is incorrect: off-season tillage actually increases water content of soils and reduces (not increases) runoff. Statements 1, 3 and 4 are correctly described in the text.", "id": "q25"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Contour farming \u2014 ploughing, planting and weeding across the slope rather than up and down \u2014 is recommended for lands with a slope range of:", "options": ["2 to 7%", "1 to 2%", "15 to 30%", "0 to 1%", "7 to 15%"], "correct": 0, "explanation": "Contour farming is recommended for lands with a slope range of 2 to 7%.", "id": "q26"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Vegetative barriers \u2014 grass or shrub strips planted across the slope \u2014 are recommended when the slope of the land is less than 1%, and can be planted at what spacing according to sloppiness?", "options": ["100 metres", "30\u201350 metres", "60\u201380 metres", "10\u201320 metres", "5\u201310 metres"], "correct": 1, "explanation": "Vegetative barriers could be planted at 30\u201350 metre distance according to sloppiness, and yield good benefits in dryland soils.", "id": "q27"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Easy", "type": "recall", "passage": null, "question": "Growing two or more crops simultaneously on the same land in a definite row pattern, such as maize and black gram in a 1:2 ratio, is called:", "options": ["Strip cropping", "Mulching", "Intercropping", "Crop rotation", "Mixed farming"], "correct": 2, "explanation": "Intercropping is growing two or more crops simultaneously on the same land in a definite row pattern, e.g., maize + black gram in 1:2 ratio.", "id": "q28"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on forms of strip cropping:\n1. Contour Strip Cropping alternates a soil-exposing crop with a soil-protecting crop in strips across the slope on contour.\n2. Wind Strip Cropping plants tall and low-growing crops in strips laid out along the direction of the prevailing wind.\n3. Permanent/Temporary Buffer Strip Cropping is established to take care of critical, steep or highly eroded slopes.\nWhich of the statements given above are correct?", "options": ["2 and 3", "1, 2 and 3", "Only 2", "1 and 3", "Only 1"], "correct": 3, "explanation": "Statement 2 is incorrect: Wind Strip Cropping lays strips right across (perpendicular to) the direction of the prevailing wind, not along it. Statements 1 and 3 are correct.", "id": "q29"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Easy", "type": "definitional", "passage": null, "question": "A material placed on the soil surface to maintain moisture, reduce weed growth, mitigate soil erosion, and improve soil conditions \u2014 which can be organic (grass clippings, straw, bark chips) or inorganic (stones, brick chips, plastic) \u2014 is called ________.", "options": ["Manure", "Vermicompost", "Biofertilizer", "Compost", "Mulch"], "correct": 4, "explanation": "Mulch is placed on the soil surface for moisture retention, weed suppression, and erosion mitigation; it may be organic or inorganic.", "id": "q30"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which tillage implement is primarily used to loosen and aerate soils while leaving crop residue on top, achieving deep tillage with limited soil disruption?", "options": ["Chisel plough", "Rotavator", "Mould board plough", "Cultivator", "Disc harrow"], "correct": 0, "explanation": "The chisel plough loosens and aerates soil with limited disruption, leaving crop residue on top.", "id": "q31"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "Alternative systems to crop production on drylands not suitable for crop cultivation \u2014 including range/pasture management, tree farming, ley farming, dryland horticulture and agro-forestry \u2014 are collectively termed ________.", "options": ["Broad Bed and Furrow (BBF)", "Alternate Land Use Pattern (ALUP)", "Basin listing", "Contour bunding", "Compartmental bunding"], "correct": 1, "explanation": "Alternate Land Use Pattern (ALUP) covers systems alternative to crop production on unsuitable drylands, e.g., afforestation and horticulture development.", "id": "q32"}, {"topic": "Soil Conservation: Agronomic Measures", "difficulty": "Easy", "type": "recall", "passage": null, "question": "Ridges and furrows, one of the in-situ soil and water conservation methods for black and red soils, can increase crop yields by up to what percentage?", "options": ["5%", "10%", "15%", "25%", "40%"], "correct": 2, "explanation": "Ridges and furrows (like summer ploughing, BBF, random tie ridging, compartmental bunding) can increase crop yields by up to 15% in black and red soils.", "id": "q33"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Hard", "type": "definitional", "passage": null, "question": "In this soil and water conservation system, a broad bed of 90 cm and a furrow of 45 cm are prepared, with crop sown at a row spacing of 30 cm, before the onset of monsoon in deep black soils where tillage is not possible during the rainy season. This is called ________.", "options": ["Basin listing", "Contour trenching", "Contour bunding", "Broad Bed and Furrow (BBF) system", "Compartmental bunding"], "correct": 3, "explanation": "The BBF system uses a 90 cm broad bed, 45 cm furrow, and 30 cm row spacing, formed before monsoon onset in deep black soils.", "id": "q34"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on bunding options for soil and water conservation:\n1. Contour bunds are recommended for light soils with rainfall under 600 mm and slope above 1.5%.\n2. Graded bunds are adopted for all soils with rainfall above 600 mm and slope of 1.5%.\n3. Bench terraces are used for deep soils with rainfall above 1000 mm and slope of 6.0%, and can be extended for slopes up to 30%.\n4. Graded border strips apply to deep Alfisol/red soils with rainfall above 800 mm and slope above 1.5%.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4 only", "1 and 3 only", "1, 2 and 4 only", "Only 4", "1, 2, 3 and 4"], "correct": 4, "explanation": "All four statements accurately reflect the bunding-option table: contour bund (light soil, <600mm, >1.5%), graded bund (all soils, >600mm, 1.5%), bench terraces (deep soil, >1000mm, 6.0%, usable 6\u201330% slope), and graded border strip (deep Alfisol, >800mm, >1.5%).", "id": "q35"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Contour bunding, used to intercept runoff via embankments, can be adopted in light and medium textured soils up to what slope?", "options": ["6% slope", "4% slope", "10% slope", "15% slope", "2% slope"], "correct": 0, "explanation": "Contour bunding can be laid up to 6% slopes and helps retain moisture in the field.", "id": "q36"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Hard", "type": "figure", "passage": null, "question": "Contour trenches, dimensioned 2 x 1 x 1 m\u00b3 and formed at 5 to 10 feet vertical distance, are suitable where the slope of the land exceeds:", "options": ["20%", "33.33%", "15%", "25%", "50%"], "correct": 1, "explanation": "Contour trenches are suitable where the slope of the land is greater than 33.33%.", "id": "q37"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Contour stonewalls, recommended where it is difficult to construct bench terraces, are constructed for slopes in which range?", "options": ["Less than 5%", "30% to 50%", "More than 15% to less than 30%", "5% to 15%", "More than 50%"], "correct": 2, "explanation": "Contour stone walls are constructed where the slope is greater than 15% but less than 30%, and are suitable for shallow and gravelly soils.", "id": "q38"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Hard", "type": "figure", "passage": null, "question": "In compartmental bunding, the entire field is divided into small compartments with dimensions of:", "options": ["10 x 10 m\u00b2", "5 x 5 m\u00b2", "12 x 8 m\u00b2", "8 x 5 m\u00b2", "6 x 4 m\u00b2"], "correct": 3, "explanation": "Compartmental bunding divides land into small compartments with dimensions of 8 x 5 m\u00b2, suitable for lesser rainfall areas with slope under 1%.", "id": "q39"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Percolation ponds, formed to store rainwater runoff and allow it to percolate into the ground, are effective up to what distance on the downstream side, and require a minimum depth of how much to reduce evaporation?", "options": ["750 m; 1 m depth", "1500 m; 2 m depth", "2000 m; 2.5 m depth", "500 m; 1 m depth", "1000 m; 1.5 m depth"], "correct": 4, "explanation": "Percolation ponds are effective up to 1000 metres on the downstream side, with a minimum depth of 1.5 m preferred to reduce evaporation losses.", "id": "q40"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "A micro-catchment of size 5 x 5 m, receiving 20 mm of rainfall, will yield approximately how many litres of water?", "options": ["500 litres", "2000 litres", "250 litres", "100 litres", "1000 litres"], "correct": 0, "explanation": "A 5 x 5 m micro-catchment with 20 mm rainfall yields approximately 500 litres of water.", "id": "q41"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "This technique uses enhanced contours to collect and direct water on sloping land without the need for terracing, directing water into dammed ponds for drip-fed gravity irrigation; it also reduces soil erosion and flooding. This is called ________.", "options": ["Percolation pond design", "Keyline design", "Contour trenching", "Basin listing", "Compartmental bunding"], "correct": 1, "explanation": "Keyline design uses enhanced contours to collect and direct water without terracing, reducing erosion and flooding while gathering nutrients.", "id": "q42"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Easy", "type": "figure", "passage": null, "question": "Windbreaks and shelterbelts, comprising rows of trees/shrubs planted across the wind direction, can reduce wind speed on the leeward side by up to:", "options": ["10-20%", "40-50%", "60-80%", "90-95%", "20-30%"], "correct": 2, "explanation": "Windbreaks and shelterbelts reduce wind speed by up to 60-80% on the leeward side.", "id": "q43"}, {"topic": "Soil Conservation: Engineering Measures", "difficulty": "Moderate", "type": "scenario", "passage": null, "question": "A farmer has deep, ill-drained black soils and wants to grow a crop during the rainy season when tillage is not feasible. Which of the following engineering soil-and-water-conservation measures is BEST suited to their situation?", "options": ["Keyline design", "Contour stonewalls", "Bench terracing", "Broad Bed and Furrow (BBF) system", "Windbreaks and shelterbelts"], "correct": 3, "explanation": "BBF is specifically designed for deep black soils with ill-drained conditions during the rainy season, allowing dry sowing before monsoon via broad beds and furrows.", "id": "q44"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Soils form from the interplay of five main factors. Which of the following is NOT one of them?", "options": ["Time", "Parent material", "Organisms", "Climate", "Fertilizer application"], "correct": 4, "explanation": "The five main soil forming factors are Parent material, Time, Climate, Topography and Relief, and Organisms \u2014 fertilizer application is not one of the natural soil forming factors.", "id": "q45"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Dokuchaiev (1889) established that soils develop as a result of soil forming factors expressed by the equation S = f(P, C, O). What do P, C and O stand for?", "options": ["Parent material, Climate, Organisms", "Profile, Climate, Ontogeny", "Precipitation, Climate, Organic matter", "Pedon, Chroma, Origin", "Parent material, Conservation, Oxidation"], "correct": 0, "explanation": "Dokuchaiev's equation S = f(P, C, O) stands for Parent material, Climate, and Organisms.", "id": "q46"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements about Jenny's (1941) soil-forming factor equation S = f(C, O, R, P, T, ...):\n1. The passive factors comprise parent material, relief and time.\n2. The active factors consist of climate and biosphere.\n3. 'R' in the equation stands for rainfall.\n4. The equation includes additional unspecified factors, denoted by an ellipsis.\nWhich of the statements given above are correct?", "options": ["Only 1 and 4", "1, 2 and 4", "2, 3 and 4", "1, 2, 3 and 4", "1, 2 and 3"], "correct": 1, "explanation": "Statement 3 is incorrect: 'R' stands for Relief or topography, not rainfall. Statements 1, 2 and 4 are correct as per Jenny's formulation.", "id": "q47"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Hard", "type": "recall", "passage": null, "question": "According to the five stages of soil development by Mohr and van Baren, which stage is characterised by decomposition reaching its final stage, with only the most weathering-resistant minerals surviving?", "options": ["Juvenile stage", "Virile stage", "Senile stage", "Initial stage", "Final stage"], "correct": 2, "explanation": "In the Senile stage, decomposition arrives at a final stage, and only the most weathering-resistant minerals have survived (distinct from the 'Final' stage where parent material is completely weathered).", "id": "q48"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on basic processes taking place in the soil:\n1. Additions include rain adding water and humans adding fertilizer.\n2. Losses include organic matter decomposing into carbon dioxide and nutrients leaching into groundwater.\n3. Transformations include weathering of hard rock into soft clay.\n4. Translocations refer only to the addition of new material into the soil, not movement within it.\nWhich of the statements given above are correct?", "options": ["Only 1 and 4", "1, 2, 3 and 4", "Only 2 and 4", "1, 2 and 3", "2, 3 and 4"], "correct": 3, "explanation": "Statement 4 is incorrect: translocation refers to movement of soil constituents within the profile or between horizons, not addition of new material (that is an 'addition'). Statements 1, 2 and 3 are correct.", "id": "q49"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Hard", "type": "definitional", "passage": null, "question": "This soil-formation process occurs when evapotranspiration exceeds precipitation, causing upward movement of dissolved alkaline salts, with the net result being deposition of translocated cations in the B horizon, sometimes forming a hard layer called caliche. This process is ________.", "options": ["Laterization", "Gleization", "Salinization", "Podzolization", "Calcification"], "correct": 4, "explanation": "Calcification occurs when evapotranspiration exceeds precipitation, depositing calcium carbonate-rich cations in the B horizon, sometimes forming caliche.", "id": "q50"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Which soil-forming process is described as the removal of soluble base cations and sesquioxides from the A horizon, creating a white-to-grey sub-layer composed of silica sand?", "options": ["Podzolization", "Calcification", "Gleization", "Salinization", "Laterization"], "correct": 0, "explanation": "Podzolization removes soluble base cations and sesquioxides (Al and Fe compounds) from the A horizon, forming a white-to-grey silica-rich sub-layer.", "id": "q51"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "The Russian-origin term 'glei' refers to blue, grey or green clay. The corresponding soil-forming process, resulting from poor drainage and waterlogged (oxygen-lacking) conditions, is called ________.", "options": ["Desalinization", "Gleization", "Podzolization", "Decalcification", "Solonization"], "correct": 1, "explanation": "Gleization develops a glei (gley) horizon in the lower soil profile due to poor drainage and waterlogging, producing bluish-to-greyish mottled colours.", "id": "q52"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on pedoturbation (mixing of soil):\n1. Faunal pedoturbation is mixing by animals such as ants, earthworms and moles.\n2. Floral pedoturbation is mixing by plants, as in tree tipping that forms pits and mounds.\n3. Argillic pedoturbation is caused by churning from swell-shrink clays, as observed in deep Black Cotton Soils.\nWhich of the statements given above are correct?", "options": ["Only 1", "2 and 3", "1, 2 and 3", "Only 3", "1 and 2"], "correct": 2, "explanation": "All three statements correctly describe the types of pedoturbation given in the text.", "id": "q53"}, {"topic": "Factors & Scientists of Soil Formation", "difficulty": "Easy", "type": "recall", "passage": null, "question": "The text describes Laterization as being the exact opposite of which other soil-forming process?", "options": ["Salinization", "Gleization", "Desalinization", "Podzolization", "Calcification"], "correct": 3, "explanation": "Laterization removes silica while concentrating sesquioxides, and the text describes it as the opposite process to Podzolization, which removes sesquioxides instead.", "id": "q54"}, {"topic": "Types of Rocks", "difficulty": "Easy", "type": "recall", "passage": null, "question": "There are three types of rocks, formed as rocks go through the Rock Cycle. Which of the following is NOT one of them?", "options": ["None \u2014 all three listed are types of rocks", "Igneous", "Metamorphic", "Sedimentary", "Alluvial"], "correct": 4, "explanation": "The three types of rocks are Igneous, Sedimentary and Metamorphic. 'Alluvial' refers to a type of soil deposit, not a rock type.", "id": "q55"}, {"topic": "Types of Rocks", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "This type of rock forms when magma (a hot liquid of melted minerals) cools and forms crystals, either underground (slow cooling) or above ground (fast cooling). This is ________ rock.", "options": ["Igneous", "Sedimentary", "Alluvial", "Metamorphic", "Regolithic"], "correct": 0, "explanation": "Igneous rock forms when magma cools and crystallizes, either underground or above ground.", "id": "q56"}, {"topic": "Types of Rocks", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "When rock pieces (sediments) broken down by wind and water are deposited in layers and later cemented together by substances like SiO2, Fe2O3 or lime, the resulting rock is:", "options": ["Igneous rock", "Sedimentary rock", "Metamorphic rock", "Regolith", "Laterite"], "correct": 1, "explanation": "Sedimentary rock forms when sediments are cemented together over time by substances such as SiO2, Fe2O3 or lime.", "id": "q57"}, {"topic": "Types of Rocks", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on Metamorphic Rocks:\n1. They are formed from igneous and sedimentary rocks under the influence of heat, pressure, and chemically active liquids and gases.\n2. Change due to water is called hydro-metamorphosis.\n3. Change due to pressure is called dynamo-metamorphosis.\nWhich of the statements given above are correct?", "options": ["1 and 2", "2 and 3", "1, 2 and 3", "Only 3", "Only 1"], "correct": 2, "explanation": "All three statements accurately describe metamorphic rock formation and its sub-processes (hydro- and dynamo-metamorphosis).", "id": "q58"}, {"topic": "Important Properties of Soil", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Sand, silt and clay particles are classified based on their size. Which of these three is the LEAST reactive, and which is the MOST reactive/active?", "options": ["Sand least reactive; silt most active", "Clay least reactive; silt most active", "Silt least reactive; clay most active", "Sand least reactive; clay most active", "Clay least reactive; sand most active"], "correct": 3, "explanation": "Sand is the least reactive, followed by silt, with clay being the most active among the three particle types.", "id": "q59"}, {"topic": "Important Properties of Soil", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements comparing sand, silt and clay properties:\n1. Sand has low water-holding capacity but good aeration.\n2. Clay has high water-holding capacity but poor aeration and very slow drainage.\n3. Silt has better ability to store plant nutrients than sand.\n4. Clay is more suitable for tillage after rain than sand.\nWhich of the statements given above are correct?", "options": ["Only 1 and 2", "1, 2, 3 and 4", "1, 3 and 4", "Only 2 and 4", "1, 2 and 3"], "correct": 4, "explanation": "Statement 4 is incorrect \u2014 clay has 'poor' suitability for tillage after rain while sand has 'good' suitability (per the properties table). Statements 1, 2 and 3 are correct.", "id": "q60"}, {"topic": "Important Properties of Soil", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Sandy soils are typically comprised of approximately what percentage of sand and clay by volume?", "options": ["80-100% sand, 0-10% clay", "25-50% sand, 30-50% clay", "0-45% sand, 50-100% clay", "60-80% sand, 20-30% clay", "50-70% sand, 10-20% clay"], "correct": 0, "explanation": "Sandy soils comprise approximately 80-100% sand and 0-10% clay by volume.", "id": "q61"}, {"topic": "Important Properties of Soil", "difficulty": "Hard", "type": "figure", "passage": null, "question": "Loam soils are typically comprised of approximately what proportions of sand, silt and clay by volume respectively?", "options": ["10-30% sand, 50-70% silt, 20-30% clay", "25-50% sand, 30-50% silt, 10-30% clay", "50-70% sand, 20-30% silt, 10-20% clay", "80-100% sand, 0-10% silt, 0-10% clay", "0-45% sand, 0-45% silt, 50-100% clay"], "correct": 1, "explanation": "Loam soils comprise approximately 25-50% sand, 30-50% silt and 10-30% clay by volume.", "id": "q62"}, {"topic": "Important Properties of Soil", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Soil structure \u2014 the arrangement of primary particles and their aggregates into defined patterns \u2014 is denoted in order of which three characteristics (abbreviated GCT)?", "options": ["Granule, Crumb, Type", "Genesis, Class, Texture", "Grade, Class, Type", "Genesis, Colour, Texture", "Grade, Colour, Tilth"], "correct": 2, "explanation": "Soil structure is denoted in order of Grade, Class and Type (GCT).", "id": "q63"}, {"topic": "Important Properties of Soil", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Which of the four principal types of soil structure consists of vertically oriented pillar-like aggregates, up to 15 cm in diameter, occurring in the B horizon of clayey soils in arid/semi-arid regions, called 'columnar' when their tops are rounded?", "options": ["Platy", "Blocky", "Granular", "Prismatic", "Spheroidal"], "correct": 3, "explanation": "Prismatic structure consists of vertically oriented aggregates/pillars up to 15 cm in diameter; when rounded at the top they are called columnar.", "id": "q64"}, {"topic": "Important Properties of Soil", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which soil structure type consists of rounded aggregates not more than 2 cm in diameter, often found loose in the 'A' horizon, and when especially porous is called 'crumb'?", "options": ["Columnar", "Platy", "Blocky", "Prismatic", "Spheroidal"], "correct": 4, "explanation": "Spheroidal structure consists of rounded aggregates (granules) up to 2 cm in diameter in the A horizon; especially porous ones are called 'crumb', favourable for plant growth.", "id": "q65"}, {"topic": "Important Properties of Soil", "difficulty": "Hard", "type": "figure", "passage": null, "question": "According to the bulk density and pore space table, which textural class has a bulk density of 1.1 g/cc and pore space of 58%?", "options": ["Clay", "Silt loam", "Loam", "Sandy soil", "Silty clay loam"], "correct": 0, "explanation": "Clay has a bulk density of 1.1 g/cc and pore space of 58%, the lowest bulk density and highest pore space among the classes listed (Sandy 1.6/40%, Loam 1.4/47%, Silt loam 1.3/50%, Clay 1.1/58%).", "id": "q66"}, {"topic": "Important Properties of Soil", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "The presence of organic matter and tillage operations generally have what effect on bulk density?", "options": ["Organic matter increases it, tillage decreases it", "Both decrease bulk density", "Organic matter decreases it, tillage increases it", "Both increase bulk density", "Neither has any effect"], "correct": 1, "explanation": "The text notes that the presence of organic matter decreases bulk density, and tillage operations too cause a decrease in bulk density.", "id": "q67"}, {"topic": "Important Properties of Soil", "difficulty": "Hard", "type": "figure", "passage": null, "question": "The average value for particle density is about 2.66 g/cm\u00b3. Approximately what is the relationship between bulk density and particle density?", "options": ["There is no consistent relationship", "They are always numerically equal", "Bulk density is roughly half of particle density", "Bulk density is roughly one-third of particle density", "Bulk density is roughly double particle density"], "correct": 2, "explanation": "Generally, bulk density is approximately half of particle density.", "id": "q68"}, {"topic": "Important Properties of Soil", "difficulty": "Easy", "type": "recall", "passage": null, "question": "According to the text, soil colour is due to three main pigments. Red colouring comes from which source?", "options": ["Organic matter", "Calcium carbonate", "Silicates and salt", "Iron and aluminium oxides", "Manganese alone"], "correct": 3, "explanation": "The three main soil pigments are: black (organic matter), red (iron and aluminium oxides), and white (silicates and salt).", "id": "q69"}, {"topic": "Important Properties of Soil", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "The most widely used method for determining soil colours is comparison with colour chips in which system, which expresses colour in terms of hue, value and chroma?", "options": ["RGB colour model", "CIE colour system", "Pantone matching system", "CMYK model", "Munsell soil colour chart"], "correct": 4, "explanation": "The Munsell soil colour system expresses colour in terms of hue, value (lightness/darkness) and chroma (intensity).", "id": "q70"}, {"topic": "Important Properties of Soil", "difficulty": "Hard", "type": "definitional", "passage": null, "question": "This property of soil is its capacity to exchange cations between soil particles and the soil solution, determined by the negative electric charge on particle surfaces, and is commonly expressed in milliequivalents (meq) per 100 g. It is called ________.", "options": ["Cation Exchange Capacity (CEC)", "Pore Space", "Particle Density", "Base Saturation", "Bulk Density"], "correct": 0, "explanation": "Cation Exchange Capacity (CEC) is the soil's capacity to exchange cations, expressed in meq/100g or cmol(+)/kg.", "id": "q71"}, {"topic": "Important Properties of Soil", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Which of the five most abundant exchangeable cations in soil (Ca++, Mg++, K+, Na+, Al+++) are NOT plant nutrients and, in excess, can compete with desired nutrients?", "options": ["Potassium and Sodium", "Aluminium and Sodium", "Calcium and Sodium", "Calcium and Magnesium", "Aluminium and Magnesium"], "correct": 1, "explanation": "Aluminium and Sodium are not plant nutrients among the five most abundant exchangeable cations, and their excess competes with desired nutrients, lowering fertility.", "id": "q72"}, {"topic": "Important Properties of Soil", "difficulty": "Hard", "type": "figure", "passage": null, "question": "Soil CEC could be expected to increase by up to what percentage if the pH was changed from 4.0 to 6.5, and nearly what factor if pH increased from 4.0 to 8.0?", "options": ["50%; nearly triple", "100%; nearly double", "50%; nearly double", "25%; nearly triple", "75%; nearly double"], "correct": 2, "explanation": "CEC could increase up to 50% if pH changes from 4.0 to 6.5, and nearly double if pH increases from 4.0 to 8.0.", "id": "q73"}, {"topic": "Important Properties of Soil", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on implications of CEC:\n1. High CEC soils generally have greater water holding capacity than low CEC soils.\n2. Low CEC soils are more prone to potassium and magnesium deficiencies.\n3. Sandy (low CEC) soils benefit from a single large one-time addition of potassium rather than smaller frequent doses.\n4. The lower the CEC, the faster soil pH decreases over time.\nWhich of the statements given above are correct?", "options": ["1, 3 and 4", "1, 2, 3 and 4", "Only 1 and 4", "1, 2 and 4", "Only 2 and 3"], "correct": 3, "explanation": "Statement 3 is incorrect: for low-CEC sandy soils, more frequent additions of smaller amounts of potassium are better, since a large one-time addition leads to large leaching losses. Statements 1, 2 and 4 are correct.", "id": "q74"}, {"topic": "Important Properties of Soil", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Total pore space is highest in which soil type, ranging 50-60%, compared to 20-30% in sandy soils?", "options": ["Peaty soils", "Sandy soils", "Loamy soils", "Silty soils", "Clay soils"], "correct": 4, "explanation": "Clay soils have the highest total pore space (50-60%), compared to 30-50% in loamy soils and 20-30% in sandy soils.", "id": "q75"}, {"topic": "Important Properties of Soil", "difficulty": "Easy", "type": "definitional", "passage": null, "question": "pH, defined as the negative logarithm of hydrogen ion activity, indicates a soil's:", "options": ["Acidity or alkalinity", "Water holding capacity", "Cation exchange capacity", "Particle density", "Bulk density"], "correct": 0, "explanation": "Soil pH indicates its acidity or alkalinity, influencing nutrient availability, physical condition and plant growth.", "id": "q76"}, {"topic": "Soil Types of India", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "The Indian Council of Agricultural Research (ICAR) set up an All India Soil Survey Committee in which year, dividing Indian soils into eight major groups?", "options": ["1950", "1953", "1972", "1961", "1947"], "correct": 1, "explanation": "ICAR set up the All India Soil Survey Committee in 1953, dividing Indian soils into eight major groups.", "id": "q77"}, {"topic": "Soil Types of India", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on Alluvial soils of India:\n1. They are the most abundant soil in India, covering about 43% of the area.\n2. They are formed mainly from the Vertisol soil order.\n3. Khaddar refers to newly formed, more sandy alluvium, while Bhangar refers to older, more clayey alluvium.\n4. They are rich in potash and lime but lack phosphorus.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 2, 3 and 4", "1, 3 and 4", "Only 1 and 4", "1, 2 and 3"], "correct": 2, "explanation": "Statement 2 is incorrect: Alluvial soils are formed mainly from the Entisol soil order, not Vertisol (Vertisol forms black soils). Statements 1, 3 and 4 are correct.", "id": "q78"}, {"topic": "Soil Types of India", "difficulty": "Hard", "type": "figure", "passage": null, "question": "Alluvial soils cover approximately how much area in India, and Black soils cover approximately how much area?", "options": ["100 mha; 40 mha", "150 mha; 45 mha", "120 mha; 60 mha", "143 mha; 55 mha", "130 mha; 50 mha"], "correct": 3, "explanation": "Alluvial soils cover about 143 million hectares (the largest area, in UP) and Black soils cover about 55 million hectares (mainly Maharashtra and MP).", "id": "q79"}, {"topic": "Soil Types of India", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Black soils, also called Regur or black cotton soil in Maharashtra where they are derived from the Deccan trap, are rich in which type of clay mineral?", "options": ["Vermiculite", "Kaolinite", "Chlorite", "Illite", "Montmorillonite (2:1 clay)"], "correct": 4, "explanation": "Black soils are rich in montmorillonite clay (2:1) minerals, formed mainly from the Vertisol soil order.", "id": "q80"}, {"topic": "Soil Types of India", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements comparing Black soils and Red soils of India:\n1. Black soil is called 'late soil' because of its lower permeability, moistening sufficiently only later in the season.\n2. Red soil is called 'early soil' because light, frequent rains allow earlier sowing than in other soils.\n3. Red soils are formed mainly from the Alfisol soil order and are rich in kaolinite clay minerals.\n4. Black soils occupy the largest area in Tamil Nadu followed by Karnataka.\nWhich of the statements given above are correct?", "options": ["1, 2 and 3", "2, 3 and 4", "1, 2, 3 and 4", "Only 1 and 4", "Only 3 and 4"], "correct": 0, "explanation": "Statement 4 is incorrect \u2014 it describes Red soil (largest area in Tamil Nadu, followed by Karnataka & Goa), not Black soil (mainly Maharashtra & MP). Statements 1, 2 and 3 are correct.", "id": "q81"}, {"topic": "Soil Types of India", "difficulty": "Moderate", "type": "figure", "passage": null, "question": "Red soils occupy about how much area in India, and are formed mainly from which soil order?", "options": ["25 mha; Oxisol", "15 mha; Alfisol", "40 mha; Ultisol", "55 mha; Vertisol", "10 mha; Mollisol"], "correct": 1, "explanation": "Red soils occupy about 15 mha and are formed mainly from the Alfisol soil order (largest area in Tamil Nadu, followed by Karnataka & Goa).", "id": "q82"}, {"topic": "Soil Types of India", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Laterite soil derives its name from the Latin word 'Later', meaning brick, and is formed mainly from which soil orders?", "options": ["Entisol and Vertisol", "Histosol and Spodosol", "Ultisol and Oxisol", "Alfisol and Mollisol", "Aridisol and Gelisol"], "correct": 2, "explanation": "Laterite soils are formed mainly from the Ultisol and Oxisol soil orders, under heavy rainfall and high temperature conditions with maximum leaching.", "id": "q83"}, {"topic": "Soil Types of India", "difficulty": "Moderate", "type": "scenario", "passage": null, "question": "A soil scientist observes a soil sample that becomes soft when wet and hardens considerably when dried, occupies about 25 mha in India, and shows red colouration due to iron oxide. Which soil type is this?", "options": ["Arid and Desert soil", "Saline and Alkaline soil", "Alluvial soil", "Laterite soil", "Black soil"], "correct": 3, "explanation": "Laterite soils (named from Latin 'Later' = brick) become soft when wet and hard when dried; they occupy about 25 mha and are red due to iron oxide.", "id": "q84"}, {"topic": "Soil Types of India", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements about Arid and Desert soils of India:\n1. They are deposited mainly by wind activities and have high salt content.\n2. They are rich in Kankar (impure calcium carbonate), which restricts water infiltration.\n3. They are found mainly in Kerala, coastal Orissa and Tamil Nadu.\n4. They lack moisture and humus.\nWhich of the statements given above are correct?", "options": ["1, 3 and 4", "2, 3 and 4", "1, 2, 3 and 4", "Only 3 and 4", "1, 2 and 4"], "correct": 4, "explanation": "Statement 3 is incorrect \u2014 it describes Peaty and Marshy soils' location, not Arid and Desert soils (found in western Rajasthan, north Gujarat and southern Punjab). Statements 1, 2 and 4 are correct.", "id": "q85"}, {"topic": "Soil Types of India", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which soil type of India is described as being rich in iron and organic matter, lacking potash and phosphorus, useful for jute and rice cultivation, and found in Kerala, coastal Orissa, Tamil Nadu and Sunderban areas of West Bengal?", "options": ["Peaty and Marshy soils", "Saline and Alkaline soils", "Laterite soils", "Forest and Mountain soils", "Arid and Desert soils"], "correct": 0, "explanation": "Peaty and Marshy soils are found in Kerala, coastal Orissa, Tamil Nadu and Sunderban (West Bengal), useful for jute and rice.", "id": "q86"}, {"topic": "USDA Soil Taxonomy \u2014 Soil Orders", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "The USDA Soil Taxonomy classification system was developed by the United States Department of Agriculture along with which other organisation?", "options": ["International Soil Reference Centre", "National Cooperative Soil Survey", "World Soil Survey Council", "Food and Agriculture Organization", "Global Soil Partnership"], "correct": 1, "explanation": "USDA Soil Taxonomy was developed by the USDA and the National Cooperative Soil Survey.", "id": "q87"}, {"topic": "USDA Soil Taxonomy \u2014 Soil Orders", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "This soil order shows a moderate degree of soil development, is young with very few diagnostic features, and derives its name from the Latin 'inceptum' meaning beginning. This order is ________.", "options": ["Vertisols", "Aridisols", "Inceptisols", "Mollisols", "Entisols"], "correct": 2, "explanation": "Inceptisols show moderate development, are young soils with few diagnostic features; the name derives from Latin 'inceptum' (beginning).", "id": "q88"}, {"topic": "USDA Soil Taxonomy \u2014 Soil Orders", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on USDA soil orders:\n1. Vertisols are clay-rich soils that develop cracks when dried and swell when saturated, and give rise to black soils.\n2. Oxisols and Ultisols both give rise to laterite soils and are highly weathered with low natural fertility.\n3. Alfisols are relatively young, less acidic and weathered than Ultisols, and give rise to India's red soils.\n4. Mollisols are acidic soils with low fertility, forming under conifer litter.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 3 and 4", "1, 2, 3 and 4", "1, 2 and 3", "Only 2 and 4"], "correct": 3, "explanation": "Statement 4 is incorrect: it describes Spodosols (acidic, low fertility, formed under conifer needle litter), not Mollisols (which are highly fertile, rich in calcium/magnesium). Statements 1, 2 and 3 are correct.", "id": "q89"}, {"topic": "USDA Soil Taxonomy \u2014 Soil Orders", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which soil order is called 'Organic soil', contains more than 20% organic matter, and derives its name from the Greek word 'histos' meaning tissue?", "options": ["Spodosols", "Andisols", "Mollisols", "Gelisols", "Histosols"], "correct": 4, "explanation": "Histosols contain more than 20% organic matter, occur in extremely wet/underwater areas, and derive from Greek 'histos' (tissue).", "id": "q90"}, {"topic": "USDA Soil Taxonomy \u2014 Soil Orders", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which soil order represents permanently frozen soils found in the Arctic and Antarctic, deriving its name from Latin 'gelare', meaning to freeze?", "options": ["Gelisols", "Histosols", "Aridisols", "Spodosols", "Andisols"], "correct": 0, "explanation": "Gelisols are permanently frozen soils found in polar regions and extremely high elevations; the name derives from Latin 'gelare' (to freeze).", "id": "q91"}, {"topic": "USDA Soil Taxonomy \u2014 Soil Orders", "difficulty": "Hard", "type": "recall", "passage": null, "question": "Which soil order forms from weathering of volcanic materials such as ash, is very productive and fertile, and derives its name from the Japanese word 'ando' meaning black soil?", "options": ["Inceptisols", "Andisols/Endisols", "Oxisols", "Vertisols", "Mollisols"], "correct": 1, "explanation": "Andisols/Endisols form from volcanic ash weathering, are very productive, and derive from the Japanese 'ando' (black soil).", "id": "q92"}, {"topic": "USDA Soil Taxonomy \u2014 Soil Orders", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Desert soils of arid regions, deriving their order name from the Latin 'aridus' meaning dry, belong to which USDA soil order?", "options": ["Histosols", "Entisols", "Aridisols", "Gelisols", "Ultisols"], "correct": 2, "explanation": "Aridisols are desert soils of arid regions, named from the Latin 'aridus' (dry).", "id": "q93"}, {"topic": "Problematic Soils", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "EC (Electrical Conductivity) and ESP (Exchangeable Sodium Percentage) are used to characterise Saline, Alkali and Saline-Alkali soils. What does ESP measure?", "options": ["The percentage of calcium ions in the soil solution", "The percentage of organic matter in the soil", "The percentage of exchangeable potassium", "The percentage of sodium cation as a percentage of total CEC", "The electrical conductivity of the soil in dS/m"], "correct": 3, "explanation": "ESP is the percentage of the sodium cation as a percentage of the total CEC.", "id": "q94"}, {"topic": "Problematic Soils", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements about Saline, Alkali and Saline-Alkali soils:\n1. In Saline soils, sodium ions are present in soluble form, so they conduct electricity better than Alkali soils.\n2. In Alkali soils, sodium ions are attached to negatively charged clay/organic matter sites and are also known as sodic soils.\n3. Saline-Alkali soils conduct electricity worse than Alkali soils because sodium is entirely in complex form.\n4. All three soil types have a pH greater than 7.\nWhich of the statements given above are correct?", "options": ["1, 2, 3 and 4", "1, 3 and 4", "2, 3 and 4", "Only 2 and 3", "1, 2 and 4"], "correct": 4, "explanation": "Statement 3 is incorrect: Saline-Alkali soils conduct electricity BETTER than Alkali soils because of the presence of soluble sodium ions. Statements 1, 2 and 4 are correct.", "id": "q95"}, {"topic": "Problematic Soils", "difficulty": "Hard", "type": "figure", "passage": null, "question": "Regarding pH ranges of problematic soils: Saline soils have a pH range of greater than 7 but less than what threshold, while Alkaline soils have a pH above what threshold?", "options": ["8.5; above 8.5", "9.0; above 9.0", "7.5; above 7.5", "8.0; above 8.0", "7.5; above 9.0"], "correct": 0, "explanation": "Saline soils have pH greater than 7 but less than 8.5; Alkaline soils have pH greater than 8.5.", "id": "q96"}, {"topic": "Problematic Soils", "difficulty": "Moderate", "type": "statement", "passage": null, "question": "Consider the following statements on reasons for soil acidity:\n1. Rainfall exceeding 100 cm with high relative humidity leaches Ca and Mg, decreasing base saturation.\n2. Continuous application of acid-forming fertilizers like ammonium sulphate results in depletion of Ca via CEC.\n3. Humus decomposition releases large amounts of acids, lowering pH.\n4. Rocks with low silica content, when combined with water, increase soil acidity.\nWhich of the statements given above are correct?", "options": ["2, 3 and 4", "1, 2 and 3", "1, 3 and 4", "Only 3 and 4", "1, 2, 3 and 4"], "correct": 1, "explanation": "Statement 4 is incorrect: rocks with LARGE amounts of silica (SiO2), not low silica, are considered acidic and increase acidity when combined with water. Statements 1, 2 and 3 are correct.", "id": "q97"}, {"topic": "Problematic Soils", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which chemical amendment is described as 'by far the most commonly used' for reclaiming alkali/sodic soils?", "options": ["Ferrous Sulphate (FeSO4)", "Sulphuric acid", "Gypsum", "Pyrites", "Elemental Sulphur"], "correct": 2, "explanation": "Gypsum, a direct calcium supplier, is by far the most commonly used chemical amendment for reclaiming alkali/sodic soils.", "id": "q98"}, {"topic": "Problematic Soils", "difficulty": "Hard", "type": "scenario", "passage": null, "question": "A field has calcareous sodic soil (already containing precipitated CaCO3) that requires chemical amelioration. Why would calcium carbonate NOT be a suitable amendment here, even though it is a 'direct Ca supplier'?", "options": ["It leaches too quickly from the soil", "It increases soil pH excessively", "It is too expensive compared to gypsum", "It is insoluble and of no use in soils that already have precipitated CaCO3", "It only works in acidic soils, not alkali soils"], "correct": 3, "explanation": "Calcium carbonate is insoluble and of no use in calcareous sodic soils (already having precipitated CaCO3), but can be used in non-calcareous sodic soils.", "id": "q99"}, {"topic": "Problematic Soils", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Saline soils are known by different regional names in India. Which term is used in Uttar Pradesh?", "options": ["Khar", "Khajar", "Usar", "Thar", "Reh"], "correct": 4, "explanation": "Saline soils are called 'Reh' in Uttar Pradesh, 'Thar' in Punjab, 'Khajar' in Gujarat, and 'Khar' in Maharashtra.", "id": "q100"}, {"topic": "Problematic Soils", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which crop is preferred for cultivation in alkali/sodic soils because it can grow under submergence, tolerate a fair extent of ESP, and influence microbial processes?", "options": ["Rice", "Barley", "Cotton", "Wheat", "Sugarcane"], "correct": 0, "explanation": "Rice is the preferred crop in alkali/sodic soil because it can grow under submergence and tolerate a fair extent of ESP.", "id": "q101"}, {"topic": "Problematic Soils", "difficulty": "Hard", "type": "statement", "passage": null, "question": "Consider the following statements on physical amelioration methods for alkali/sodic soils:\n1. Deep ploughing breaks the hard pan developed at the subsurface, improving water movement and aeration.\n2. Sand filling reduces the heaviness of soil and increases capillary movement of water.\n3. Physical amelioration methods directly remove sodium from the exchange complex.\n4. Profile inversion improves physical soil condition similarly to deep ploughing.\nWhich of the statements given above are correct?", "options": ["Only 1 and 3", "1, 2 and 4", "1, 2, 3 and 4", "Only 3", "2, 3 and 4"], "correct": 1, "explanation": "Statement 3 is incorrect: physical methods do NOT actually remove sodium from the exchange complex \u2014 they only improve physical soil condition (infiltration, aeration). Statements 1, 2 and 4 are correct.", "id": "q102"}, {"topic": "Problematic Soils", "difficulty": "Easy", "type": "figure", "passage": null, "question": "At what approximate pH level are citrus fruits and blueberries best suited for cultivation among acidic soils, per the acidic-soil crop suitability chart?", "options": ["5.5", "5.0", "4.5", "6.5", "6.0"], "correct": 2, "explanation": "At pH 4.5, citrus and blueberries are the suitable crops; the range progresses up to alfalfa and sugar beet at pH 6.5.", "id": "q103"}, {"topic": "Soil Fertility, Productivity & C:N Ratio", "difficulty": "Easy", "type": "definitional", "passage": null, "question": "________ is the ability of soil to supply essential plant nutrients during the growth period of plants, without toxic concentration of any nutrient.", "options": ["Soil Texture", "Soil Productivity", "Cation Exchange Capacity", "Soil Fertility", "Soil Structure"], "correct": 3, "explanation": "Soil Fertility is the capacity of soil to supply nutrients available to crops, without toxic concentrations.", "id": "q104"}, {"topic": "Soil Fertility, Productivity & C:N Ratio", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Which statement best captures the relationship between soil fertility and soil productivity, per the text?", "options": ["Fertility and productivity are always identical", "Fertility is a subset of texture, unrelated to productivity", "Productivity depends only on climate, not fertility", "All fertile soils are productive, but not all productive soils are fertile", "All productive soils are fertile, but all fertile soils may not be productive"], "correct": 4, "explanation": "The text states: all the productive soils are fertile, but all the fertile soils may not be productive.", "id": "q105"}, {"topic": "Soil Fertility, Productivity & C:N Ratio", "difficulty": "Moderate", "type": "definitional", "passage": null, "question": "This is the decomposition (oxidation) of chemical compounds in organic matter, releasing nutrients in soluble inorganic forms available to plants, increasing nutrient bioavailability. This process is ________.", "options": ["Mineralization", "Eluviation", "Immobilization", "Humification", "Leaching"], "correct": 0, "explanation": "Mineralization is the decomposition/oxidation of organic compounds, releasing nutrients in soluble inorganic forms available to plants.", "id": "q106"}, {"topic": "Soil Fertility, Productivity & C:N Ratio", "difficulty": "Moderate", "type": "recall", "passage": null, "question": "Immobilization is the conversion of inorganic compounds to organic compounds by micro-organisms or plants, preventing plant access to nutrients. It is the opposite of which process?", "options": ["Eluviation", "Mineralization", "Leaching", "Humification", "Calcification"], "correct": 1, "explanation": "Immobilization is explicitly stated to be the opposite of mineralization.", "id": "q107"}, {"topic": "Soil Fertility, Productivity & C:N Ratio", "difficulty": "Hard", "type": "figure", "passage": null, "question": "The required C:N ratio for organic matter decomposition is stated as 30:1. If the parts of carbon per part of nitrogen exceed this threshold, which process dominates and what nutrient becomes deficient near the plant roots?", "options": ["Immobilization; carbon becomes deficient", "Mineralization; phosphorus becomes deficient", "Immobilization; nitrogen becomes deficient", "Mineralization; nitrogen becomes deficient", "Calcification; nitrogen becomes deficient"], "correct": 2, "explanation": "With a high C:N ratio (>30:1), micro-organisms use soil nitrogen for decomposition, causing immobilization and nitrogen deficiency in the plants' immediate environment.", "id": "q108"}, {"topic": "Soil Fertility,
