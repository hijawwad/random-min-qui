ission?", "options": ["Quantum Computing", "Quantum Communication", "Quantum Sensing and Metrology", "Quantum Materials and Devices", "Quantum Encryption Standards"], "answer": 4, "explanation": "The four areas are Quantum Computing, Quantum Communication, Quantum Sensing and Metrology, and Quantum Materials and Devices. 'Quantum Encryption Standards' is not one of the four named areas.", "id": "q82"}, {"topic": "PM Rashtriya Bal Puraskar", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the Pradhan Mantri Rashtriya Bal Puraskar.", "options": ["It honours children aged 5 to 18 and around 25 awards are conferred across six fields including Bravery, Social Service and Science and Technology.", "It honours children aged 10 to 25 and 50 awards are conferred annually.", "The award can be conferred posthumously without exception.", "The awards committee is chaired by the Prime Minister.", "Children can only be nominated by government institutions, not by self-nomination."], "answer": 0, "explanation": "The award honours children aged 5-18 across six fields (Bravery, Social Service, Environment, Sports, Art and Culture, Science and Technology), with around 25 awards conferred. It is generally not conferred posthumously (though exceptions may be made); the committee is chaired by the Secretary, MWCD (final approval by the Union Minister); and self-nomination is explicitly allowed.", "id": "q83"}, {"topic": "ASPIRE/MSME", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the ASPIRE Scheme and India's MSME ecosystem (January 2026 data).", "options": ["MSMEs contribute about 31.1% to GDP, 35.4% to manufacturing output, and 48.58% to exports, employing over 38.9 crore people.", "The ASPIRE Scheme was launched in 2015 by the Ministry of Rural Development.", "MSMEs are the largest source of employment in India, ahead of agriculture.", "CGTMSE's guarantee coverage ceiling was reduced from ₹10 crore to ₹5 crore to improve credit discipline.", "Udyam Registration and Udyam Assist Platform registrations crossed 8.7 crore as on June 2020."], "answer": 0, "explanation": "As of January 2026, MSMEs contribute 31.1% to GDP, 35.4% to manufacturing output, 48.58% to exports, and employ over 38.9 crore people. ASPIRE was launched by the Ministry of MSME (not Rural Development); MSMEs are the SECOND-largest employer after agriculture; the CGTMSE ceiling was ENHANCED from ₹5 crore to ₹10 crore; and the 8.7 crore Udyam registrations figure is as of June 2026, not 2020.", "id": "q84"}, {"topic": "ASPIRE/MSME", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding MSME credit and formalisation schemes, consider the statements:\n1. CGTMSE completed 25 years of operation, approving 29.03 lakh guarantees worth ₹3.77 lakh crore (1 Jan-30 Nov 2025).\n2. Under PM Vishwakarma, the original four-year target of 30 lakh beneficiary registrations was achieved within just two years.\n3. PMEGP has supported over 10.84 lakh micro-enterprises with ₹29,623 crore in margin money subsidies since inception.\n4. The Self-Reliant India (SRI) Fund assisted 761 MSMEs with investment worth ₹2,851 crore as of May 2025.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "All are correct"], "answer": 0, "explanation": "The SRI Fund figures (761 MSMEs, ₹2,851 crore) are dated 'as of May 2026', not May 2025, making statement 4 incorrect on the date. Statements 1, 2 and 3 are accurate.", "id": "q85"}, {"topic": "ASPIRE/MSME", "difficulty": "moderate", "type": "acronym", "q": "Under the MSME Champions Scheme, what does the 'ZED' certification framework stand for?", "options": ["Zero Defect Zero Effect", "Zero Emission Development", "Zonal Enterprise Development", "Zero Downtime Enterprise Delivery", "Zero Effluent Discharge"], "answer": 0, "explanation": "ZED stands for Zero Defect Zero Effect, a certification framework promoting quality manufacturing with minimal environmental impact under MSME Sustainable.", "id": "q86"}, {"topic": "ASPIRE/MSME", "difficulty": "moderate", "type": "notamong", "q": "Under the MSME Champions Scheme's three pillars, which of the following is NOT one of them?", "options": ["MSME Innovative", "MSME Sustainable (ZED)", "MSME Competitive (LEAN)", "MSME Digital (SAMARTH)", "None — all three named pillars are genuine"], "answer": 3, "explanation": "The three pillars of the MSME Champions Scheme are MSME Innovative, MSME Sustainable (ZED) and MSME Competitive (LEAN). 'MSME Digital (SAMARTH)' is not one of them — it is fabricated.", "id": "q87"}, {"topic": "ASPIRE/MSME", "difficulty": "moderate", "type": "figure", "q": "SFURTI (Scheme of Fund for Regeneration of Traditional Industries) has approved how many clusters nationally, benefiting how many traditional artisans, as of June 2026?", "options": ["513 clusters approved, benefiting 3.03 lakh artisans (376 functional)", "376 clusters approved, benefiting 5 lakh artisans (513 functional)", "250 clusters approved, benefiting 1 lakh artisans", "513 clusters approved, benefiting 11,810 artisans", "100 clusters approved, benefiting 3.03 lakh artisans"], "answer": 0, "explanation": "SFURTI has approved 513 clusters nationally, benefiting 3.03 lakh traditional artisans, with 376 currently functional as of June 2026 (11,810 artisans were benefited specifically by the 18 new clusters that became operational in 2023-24 alone).", "id": "q88"}, {"topic": "Space Odyssey", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's Chandrayaan programme.", "options": ["Chandrayaan-3 made India the first country to achieve a soft landing near the Moon's south pole, and the fourth nation overall to soft-land on the Moon.", "Chandrayaan-1, launched in 2008, achieved the first soft landing near the Moon's south pole.", "Chandrayaan-4, planned for 2027, will only orbit the Moon without any sample return.", "India was the third nation to successfully soft-land on the lunar surface.", "Chandrayaan-5/LUPEX is a solo ISRO mission with no international collaboration."], "answer": 0, "explanation": "Chandrayaan-3 achieved the historic south-pole soft landing, making India the first nation to do so and the fourth nation overall (after the US, Russia, and China) to soft-land on the Moon. Chandrayaan-1 (2008) was an orbiter mission; Chandrayaan-4 (2027) aims to land, collect samples, AND return them to Earth; and Chandrayaan-5/LUPEX is a collaboration between ISRO and Japan's JAXA.", "id": "q89"}, {"topic": "Space Odyssey", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding India's interplanetary and human spaceflight milestones, consider the statements:\n1. The Mars Orbiter Mission (Mangalyaan) entered Martian orbit on 24 September 2014, making India the first country to reach Mars on its maiden attempt.\n2. ISRO became the fourth space agency to place a spacecraft in Mars orbit, after NASA, Roscosmos and ESA.\n3. Aditya-L1, India's first solar mission launched in 2023, was placed in a halo orbit near the Sun-Earth L1 point, about 1.5 million km from Earth.\n4. India's Space Docking Experiment (SPADEX) in January 2025 made India the third nation to demonstrate autonomous docking in space.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "SPADEX made India the FOURTH nation (after the US, Russia and China) — not the third — to demonstrate autonomous docking/undocking, making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q90"}, {"topic": "Space Odyssey", "difficulty": "moderate", "type": "figure", "q": "The Gaganyaan mission, approved in January 2019, aims to send how many Indian astronauts into what orbit for how long?", "options": ["Up to three astronauts into a 400-km orbit for up to three days", "Up to two astronauts into a 500-km orbit for up to five days", "Up to four astronauts into a 300-km orbit for one day", "Up to three astronauts into a 600-km orbit for a week", "Up to one astronaut into a 400-km orbit for ten days"], "answer": 0, "explanation": "Gaganyaan aims to send up to three Indian astronauts into a 400-km orbit for up to three days before returning them safely to Earth.", "id": "q91"}, {"topic": "Space Odyssey", "difficulty": "moderate", "type": "notamong", "q": "Regarding India's liberalised FDI policy for the space sector (February 2024), which of the following is NOT an accurate FDI cap described in the source?", "options": ["Up to 74% FDI under automatic route for satellite manufacturing/operations and satellite data products", "Up to 49% FDI for launch vehicles, related systems and spaceports", "100% FDI under automatic route for manufacturing satellite/ground-segment components and subsystems", "Up to 26% FDI for ground/user segment services", "Up to 100% FDI allowed in selected space activities overall"], "answer": 3, "explanation": "Ground/user segment services fall under the 74% automatic-route cap (grouped with satellite manufacturing/operations and data products), not a separate 26% cap. The other statements accurately reflect the policy.", "id": "q92"}, {"topic": "Space Odyssey", "difficulty": "moderate", "type": "acronym", "q": "What does 'NISAR', the mission launched on 30 July 2025 aboard GSLV-F16, stand for?", "options": ["NASA-ISRO Synthetic Aperture Radar", "National Indian Space Application Radar", "NASA-ISRO Space and Atmospheric Research", "National Institute for Space and Aerial Reconnaissance", "NASA-ISRO Satellite for Advanced Remote-sensing"], "answer": 0, "explanation": "NISAR stands for NASA-ISRO Synthetic Aperture Radar, a joint ISRO-NASA mission to monitor changes in land, glaciers, forests and oceans.", "id": "q93"}, {"topic": "Space Odyssey", "difficulty": "hard", "type": "figure", "q": "Regarding India's expanding launch infrastructure, which pairing of facts is correct?", "options": ["India's second spaceport is coming up at Kulasekarapattinam, Tamil Nadu; the Third Launch Pad at Sriharikota was approved in January 2025 at a cost of ₹3,984.86 crore", "India's second spaceport is at Sriharikota; the Third Launch Pad is planned for Kulasekarapattinam", "India's second spaceport is at Kulasekarapattinam; the Third Launch Pad was approved in 2023 at ₹2,000 crore", "India's second spaceport is at Chennai; the SSLV Complex foundation was laid in 2022", "India's second spaceport is at Kulasekarapattinam; the SSLV Complex targets 50 launches annually"], "answer": 0, "explanation": "India's second spaceport is coming up at Kulasekarapattinam, Tamil Nadu. The Third Launch Pad at Sriharikota, approved in January 2025 at a cost of ₹3,984.86 crore, will support next-generation launch vehicles and human spaceflight missions. The SSLV Complex (foundation laid 28 February 2024) targets 20-25 orbital launches annually, not 50.", "id": "q94"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the VB-G RAM G Act, 2025 wage notification.", "options": ["A ₹300 interim base wage rate ensures no notified wage under the programme falls below ₹300/day, effective 1 July 2026.", "The national average notified wage decreased from ₹327.4 to ₹298.8 per day under the new Act.", "Sikkim's High Altitude Gram Panchayats have the highest notified wage rate in the country at ₹409 per day.", "The national launch of the VB-G RAM G Act was held in Chandauli district, Uttar Pradesh, on July 2, 2026.", "Workers in Kerala receive the highest percentage wage increase of nearly 24.5%."], "answer": 0, "explanation": "The revised wage rates, effective 1 July 2026, introduced a ₹300 interim base wage. The national average wage actually INCREASED from ₹298.8 (under MGNREGA) to ₹327.4 (under VB-G RAM G); Sikkim's high-altitude Gram Panchayats have the highest rate at ₹450 (not ₹409, which is Haryana's rate); the national launch was held at Mukkavaripalli Village, Andhra Pradesh (not Chandauli, UP); and Arunachal Pradesh and Nagaland (not Kerala) recorded the highest percentage increase of nearly 24.5%.", "id": "q95"}, {"topic": "Current Affairs (June 2026)", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the SDG National Indicator Framework (NIF) Progress Report 2026, released on the 20th Statistics Day (29 June 2026), consider the statements:\n1. The NIF 2026 consists of 277 national SDG indicators covering all 17 SDGs.\n2. The Maternal Mortality Ratio (MMR) declined to 87 during 2022-24.\n3. The unemployment rate declined from 6.1% in 2017-18 to 3.1% in 2025.\n4. The proportion of population covered by social protection systems decreased from 65.3% in 2016 to 22.0% in 2026.\nWhich of the statements given above is/are incorrect?", "options": ["4 only", "1 and 4 only", "2 only", "3 and 4 only", "None — all correct"], "answer": 0, "explanation": "The social protection coverage trend is reversed in statement 4: it INCREASED from 22.0% in 2016 to 65.3% in 2026, not the other way round. Statements 1, 2 and 3 are accurate.", "id": "q96"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the National Investment and Infrastructure Fund (NIIF) after the Cabinet's additional approval.", "options": ["The Cabinet approved an additional ₹30,000 crore commitment, taking Government of India's total NIIF commitment to ₹60,000 crore.", "NIIF is 100% owned and funded by the Government of India.", "NIIF's first infrastructure fund, with a corpus of ₹30,000 crore, is India's largest domestic infrastructure fund.", "NIIF has returned close to ₹40,000 crore to investors through portfolio exits.", "NIIF Infrastructure Fund II has a target corpus of ₹60,000 crore."], "answer": 0, "explanation": "The additional ₹30,000 crore commitment brought GoI's total NIIF commitment to ₹60,000 crore. GoI is only a 49% shareholder in NIIF (not 100%); NIIF's first infrastructure fund has a corpus of ₹16,000 crore (not ₹30,000 crore — that figure is NIIF Infrastructure Fund II's target corpus); and NIIF has returned close to ₹12,000 crore (not ₹40,000 crore) to investors.", "id": "q97"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "acronym", "q": "In the context of new maternal-newborn health programmes launched in June 2026, what does 'SSBSK' stand for?", "options": ["Samagra Shishu Bal Swasthya Karyakram", "Suraksha Shishu Bal Sanrakshan Karyakram", "Samagra Suraksha Bal Swasthya Kendra", "Samagra Shishu Bima Swasthya Karyakram", "Suraksha Shishu Bhavishya Sampann Karyakram"], "answer": 0, "explanation": "SSBSK stands for Samagra Shishu Bal Swasthya Karyakram, a unified programme consolidating Home-Based Newborn Care (HBNC) and Home-Based Care for Young Child (HBYC) into a single framework for children from birth to 36 months.", "id": "q98"}, {"topic": "Current Affairs (June 2026)", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the SUMAN Roadmap 2030 launched by the Health Ministry, consider the statements:\n1. It is anchored in the RMNCHA+N framework and envisions reducing MMR to below 70 per 100,000 live births by 2030.\n2. The Roadmap introduces focused interventions across 130 districts in 13 high-focus States.\n3. It emphasises AI-enabled labour rooms and wider deployment of Non-Pneumatic Anti-Shock Garments (NASG).\n4. SUMAN stands for 'Suraksha Matru Abhiyaan Nidhi'.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "All are correct"], "answer": 0, "explanation": "SUMAN actually stands for 'Surakshit Matritva Aashwasan', not 'Suraksha Matru Abhiyaan Nidhi', making statement 4 incorrect. Statements 1, 2 and 3 correctly describe the Roadmap.", "id": "q99"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the Unified Health Interface (UHI) launched alongside Aarogya Setu 2.0.", "options": ["UHI operates through open protocols on the ABDM Gateway and is built on four principles: Interoperability, Fair discoverability, Verification, and Open Protocols.", "UHI is a standalone mobile app unrelated to the Ayushman Bharat Digital Mission.", "Currently, 10 services are live on UHI, including telemedicine consultations.", "UHI was developed and is maintained by the Indian Council of Medical Research (ICMR).", "UHI uses only the Health Facility Registry, without linking ABHA or the Healthcare Professionals Registry."], "answer": 0, "explanation": "UHI operates through open protocols on the ABDM core Gateway and is built on four principles: Interoperability, Fair discoverability, Verification, and Open Protocols. It is developed and maintained by the National Health Authority (not ICMR); only 4 services are currently live (Blood Bank Discovery, PMJAY Empaneled Hospital Search, Jan Aushadhi Kendra Discovery, and Ambulance Discovery and Booking); and it uses ABHA, HPR AND HFR together as building blocks.", "id": "q100"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "notamong", "q": "Among the digital health initiatives launched alongside Aarogya Setu 2.0 in June 2026, which of the following was NOT one of the named initiatives?", "options": ["Ayushman Sarathi (WhatsApp chatbot)", "National Health Claims Exchange (NHCX)", "e-Sushrut Clinic", "Common LOINC Codes for India (CLCI)", "National Digital Immunisation Ledger (NDIL)"], "answer": 4, "explanation": "The named initiatives include Aarogya Setu 2.0, the enhanced Ayushman App, Ayushman Sarathi, NHCX, UHI, e-Sushrut Clinic, Drug Registry and CLCI. 'National Digital Immunisation Ledger (NDIL)' is not among them — it is fabricated (U-WIN is the actual immunisation-tracking platform named elsewhere).", "id": "q101"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the India-UK CETA and the Double Contribution Convention (DCC).", "options": ["CETA and the DCC enter into force on 15 July 2026, with CETA providing zero-duty access on ~99% of India's exports to the UK.", "CETA eliminates dual social security contributions for Indian professionals staying in the UK for any duration.", "CETA expands services exports across 200 sub-sectors including IT/ITES.", "The DCC benefits fewer than 10,000 Indian professionals.", "CETA came into force in December 2025, immediately after signing."], "answer": 0, "explanation": "CETA and the DCC enter into force on 15 July 2026, with zero-duty access on ~99% of India's exports to the UK. The DCC eliminates dual contributions specifically for stays of up to 5 years (not any duration); CETA expands services exports across 137 sub-sectors (not 200); and the DCC benefits more than 75,000 Indian professionals and 900 companies.", "id": "q102"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "figure", "q": "The India-Oman Comprehensive Economic Partnership Agreement (CEPA), which entered into force on 1 June 2026, provides what percentage of duty-free access to Indian exports?", "options": ["99.38%", "94.81%", "77.79%", "90.5%", "85%"], "answer": 0, "explanation": "With 99.38% of India's exports receiving duty-free access under the India-Oman CEPA, India became only the second nation after the United States to secure a comprehensive bilateral trade pact with Oman.", "id": "q103"}, {"topic": "Current Affairs (June 2026)", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the revised All-India Index of Industrial Production (IIP) with base year 2022-23, consider the statements:\n1. The item basket expanded to 1,042 products mapped to 463 item groups, compared to 839 items mapped to 407 item groups in the 2011-12 series.\n2. Manufacturing carries the highest sectoral weightage at 76.062%, followed by Mining & Quarrying at 11.053%.\n3. The IIP growth rate for April 2026 was recorded at 4.9 percent compared to April 2025.\n4. The new series added Kerosene and Sewing Machines as new item groups while deleting CCTV cameras and vaccines.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "Statement 4 reverses reality: Kerosene, fluorescent tubes/CFLs and sewing machines were DELETED, while items like CCTV cameras, stents and vaccines were ADDED. Statements 1, 2 and 3 are correct.", "id": "q104"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "acronym", "q": "What does 'BHARATI', the APEDA export-enablement programme whose first cohort concluded in June 2026, stand for?", "options": ["Bharat's Hub for Agritech, Resilience, Advancement and Incubation for Export Innovation", "Bharat Agricultural Research and Trade Innovation", "Bharat Hub for Advanced Rural Technology and Innovation", "Bharat Agri-food Regulatory Assessment and Trade Initiative", "Bharat Hub for Agri-Business Rural Transformation and Investment"], "answer": 0, "explanation": "BHARATI stands for Bharat's Hub for Agritech, Resilience, Advancement and Incubation for Export Innovation; its first cohort of 100 startups from 22 States and 2 UTs concluded with participation at Gulfood 2026 in Dubai.", "id": "q105"}, {"topic": "Current Affairs (June 2026)", "difficulty": "easy", "type": "figure", "q": "India's tourism sector was ranked 8th among the world's top tourism economies, contributing how much to the national economy, per the WTTC-referenced backgrounder?", "options": ["US $231.6 billion", "US $150 billion", "US $300 billion", "US $180.6 billion", "US $100 billion"], "answer": 0, "explanation": "India, ranked 8th among the world's top tourism economies, contributes US $231.6 billion to the national economy, with WTTC projecting India to rise to 4th place globally over the next decade.", "id": "q106"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the National Panchayat Awards (NPA) 2025.", "options": ["NPA 2025 honoured 42 Panchayats, of which 22 were women-led, with incentives ranging from ₹50 lakh to ₹5 crore.", "NPA 2025 honoured 100 Panchayats under a single award category.", "The Deen Dayal Upadhyay Panchayat Satat Vikas Puraskar was awarded to only 8 Gram Panchayats.", "The awards framework has remained unchanged since its inception and was never aligned with SDG localisation themes.", "Incentives under the Incentivization of Panchayats scheme are capped at ₹10 lakh per awardee."], "answer": 0, "explanation": "NPA 2025 honoured 42 Panchayats (22 women-led), with incentives from ₹50 lakh to ₹5 crore under the Incentivization of Panchayats scheme. The DDUPSVP was awarded to 34 Gram Panchayats (the NDSPSVP went to 8 Panchayats); and the awards framework was revamped in 2023, aligned with the nine themes of SDG localisation.", "id": "q107"}, {"topic": "Current Affairs (June 2026)", "difficulty": "moderate", "type": "figure", "q": "NITI Aayog's 'Trade Watch Quarterly' (8th edition, for Q4 FY2025-26) reported India's total merchandise and services trade reaching what value, with what year-on-year growth?", "options": ["$1.84 trillion, growing 5.4% y-o-y", "$2.5 trillion, growing 8% y-o-y", "$1.2 trillion, growing 3% y-o-y", "$1.84 trillion, growing 10% y-o-y", "$900 billion, growing 5.4% y-o-y"], "answer": 0, "explanation": "India's total merchandise and services trade reached $1.84 trillion during April-March FY2025-26, expanding by 5.4% year-on-year.", "id": "q108"}, {"topic": "Schemes in News", "difficulty": "easy", "type": "figure", "q": "As per the 'Schemes in News' roundup, Bharatmala Pariyojana (approved October 2017) envisages development of how many kilometres of National Highway corridors, at what estimated outlay?", "options": ["34,800 km at an estimated outlay of ₹5.35 lakh crore", "22,590 km at an estimated outlay of ₹2 lakh crore", "50,000 km at an estimated outlay of ₹10 lakh crore", "34,800 km at an estimated outlay of ₹3 lakh crore", "20,000 km at an estimated outlay of ₹5.35 lakh crore"], "answer": 0, "explanation": "Bharatmala Pariyojana, approved in October 2017, envisages 34,800 km of National Highway corridors at an estimated outlay of ₹5.35 lakh crore (of which 22,590 km had been completed as of 31 March 2026).", "id": "q109"}, {"topic": "Schemes in News", "difficulty": "moderate", "type": "figure", "q": "For FY 2026-27, how much has the Government of India earmarked for the construction of rural roads under PMGSY and related connectivity initiatives, covering how many kilometres?", "options": ["₹18,907 crore for 26,474 km", "₹19,000 crore for 4.11 lakh km", "₹10,000 crore for 15,000 km", "₹28,840 crore for 26,474 km", "₹18,907 crore for 50,000 km"], "answer": 0, "explanation": "₹18,907 crore has been earmarked during FY 2026-27 for construction of 26,474 km of rural roads under PMGSY and related initiatives.", "id": "q110"}, {"topic": "Schemes in News", "difficulty": "moderate", "type": "notamong", "q": "Which of the following agricultural schemes was NOT among those launched together in West Bengal as listed in the 'Schemes in News' section (PMFBY, AgriStack, National Mission on Natural Farming, and PMDDKY)?", "options": ["PM Fasal Bima Yojana (PMFBY)", "AgriStack (Digital Agriculture Mission)", "National Mission on Natural Farming", "PM Dhan-Dhaanya Krishi Yojana (PMDDKY)", "National Food Security and Nutrition Mission (NFSNM)"], "answer": 4, "explanation": "The four schemes launched together in West Bengal, per the source, were PMFBY, AgriStack, National Mission on Natural Farming, and PMDDKY. The National Food Security and Nutrition Mission is a separate mission mentioned elsewhere in the agriculture backgrounder, not part of this West Bengal launch list.", "id": "q111"}, {"topic": "Schemes in News", "difficulty": "hard", "type": "intersection", "q": "Consider the following schemes/programmes mentioned across the June 2026 PIB compilation:\n1. PM-JANMAN\n2. Dharti Aaba Janjatiya Gram Utkarsh Abhiyan (PM-JUGA)\n3. PM-AJAY\n4. EMRS\n5. PMGSY-IV\n6. SBM-Gramin\nWhich of the above are explicitly listed together under the 'Schemes in News' roundup as schemes with a COMBINED outlay exceeding ₹1 lakh crore and a threefold increase in the Ministry's annual budget (from ₹4,295 crore to ~₹13,000 crore)?", "options": ["1 and 2 only", "1, 2 and 3", "3 and 4 only", "2, 3 and 4", "1, 2, 3 and 4"], "answer": 0, "explanation": "The 'Schemes in News' section specifically pairs 'PM-JANMAN and DAJGUA [PM-JUGA]' as having a combined outlay exceeding ₹1 lakh crore and a threefold budget increase for the Ministry (Tribal Affairs) from ₹4,295 crore to approximately ₹13,000 crore. PM-AJAY, EMRS, PMGSY-IV and SBM-Gramin are listed separately in the roundup without this specific combined-outlay claim.", "id": "q112"}, {"topic": "Ethanol/Energy", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's Ethanol Blending Programme.", "options": ["Launched in 2003, it culminated in the rollout of 20% ethanol blending (E20) from 2023 onwards, saving over ₹1.4 lakh crore in forex.", "The programme was launched in 2014 and achieved E20 blending by 2018.", "Brazil's standard petrol blend is E10, lower than India's E20.", "The programme has saved India over ₹5 lakh crore in foreign exchange to date.", "India achieved E20 blending without any phased implementation."], "answer": 0, "explanation": "The Ethanol Blending Programme, launched in 2003, reached E20 blending from 2023 onward and has saved India over ₹1.4 lakh crore in forex via reduced crude imports. Brazil's standard blend, E27, is actually higher than India's E20; and the programme was implemented in a phased manner over two decades, not launched in 2014.", "id": "q113"}, {"topic": "Index of Eight Core Industries", "difficulty": "moderate", "type": "notamong", "q": "Which of the following is NOT one of the Eight Core Industries (base year 2011-12=100) tracked by the Office of the Economic Adviser?", "options": ["Refinery Products", "Electricity", "Steel", "Cement", "Renewable Energy"], "answer": 4, "explanation": "The eight core industries are Refinery Products, Electricity, Steel, Coal, Crude Oil, Natural Gas, Cement, and Fertilizers. 'Renewable Energy' is not a separately tracked core industry in this index.", "id": "q114"}, {"topic": "Index of Eight Core Industries", "difficulty": "moderate", "type": "figure", "q": "Among the Eight Core Industries, which carries the highest weightage in the Index of Industrial Production, and what is that weightage?", "options": ["Refinery Products at 28.04%", "Electricity at 19.85%", "Steel at 17.92%", "Coal at 10.33%", "Cement at 5.37%"], "answer": 0, "explanation": "Refinery Products carries the highest weightage among the eight core industries at 28.04%, followed by Electricity (19.85%) and Steel (17.92%). Together, the eight industries constitute 40.27% of the IIP.", "id": "q115"}, {"topic": "Beti Bachao Beti Padhao", "difficulty": "moderate", "type": "figure", "q": "As per HMIS data cited in the June 2026 update, the Sex Ratio at Birth (SRB) at the national level improved from what figure in 2014-15 to what figure in 2024-25?", "options": ["918 to 929", "896 to 918", "943 to 1,020", "900 to 950", "920 to 940"], "answer": 0, "explanation": "The Sex Ratio at Birth improved from 918 in 2014-15 to 929 in 2024-25, per HMIS data (896 to 918 for 2015-17 to 2022-24 is a different NIF-cited figure for a slightly different period).", "id": "q116"}, {"topic": "WPI/PPI Base Year", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the revision of the Wholesale Price Index (WPI) base year from 2011-12 to 2022-23, consider the statements:\n1. The revised series was approved on 25.05.2026 and was to be released on 15.06.2026.\n2. The total number of items in the WPI basket increased from 697 to 957.\n3. Crude Petroleum and Natural Gas has been shifted from 'Fuel and Power' to 'Primary Articles' in the new series.\n4. The old WPI series will continue to be released for five years alongside PPI before being discontinued.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 4 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "All are correct"], "answer": 0, "explanation": "The shift in statement 3 is reversed: Crude Petroleum and Natural Gas moved FROM 'Primary Articles' TO 'Fuel and Power' in the new series, not the other way round. Statements 1, 2 and 4 are correct.", "id": "q117"}, {"topic": "PMRC Scheme", "difficulty": "moderate", "type": "notamong", "q": "Among the seven Lead Institutions identified for the Prime Minister Research Chair (PMRC) Scheme 2026, which of the following is NOT one of them?", "options": ["IIT Delhi", "IIT Bombay", "IISc Bengaluru", "IIT Roorkee", "IIT (ISM) Dhanbad"], "answer": 3, "explanation": "The seven Lead Institutions are IIT Delhi, IIT Bombay, IIT Madras, IIT Kanpur, IIT Hyderabad, IIT (ISM) Dhanbad, and IISc Bengaluru. IIT Roorkee is not among the seven named Lead Institutions.", "id": "q118"}, {"topic": "PMRC Scheme", "difficulty": "hard", "type": "figure", "q": "The PMRC Scheme 2026 connects global Indian talent with research across how many thematic areas of national priority, and who chairs the Empowered Committee overseeing selection?", "options": ["13 thematic areas; chaired by the Principal Scientific Advisor to the Government of India", "10 thematic areas; chaired by the Cabinet Secretary", "13 thematic areas; chaired by the Minister of Education", "15 thematic areas; chaired by the Principal Scientific Advisor", "13 thematic areas; chaired by the NITI Aayog Vice-Chairman"], "answer": 0, "explanation": "The PMRC Scheme covers 13 thematic areas of national priority, with selection overseen by an Empowered Committee chaired by the Principal Scientific Advisor to the Government of India.", "id": "q119"}, {"topic": "ATF Price Stabilisation", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the Cabinet-approved ATF price stabilisation support.", "options": ["The Cabinet approved up to ₹10,000 crore as an interest-free advance to OMCs, with support in force for thirty-six months.", "The support scheme provides direct cash subsidies to airline passengers.", "ATF accounts for nearly 10% of an airline's operating cost under normal conditions.", "The scheme is permanent with no recovery or true-up mechanism.", "The scheme excludes international operations of Indian carriers."], "answer": 0, "explanation": "The Cabinet approved up to ₹10,000 crore as an interest-free advance to Oil Marketing Companies, with the support mechanism in force for thirty-six months (extendable). ATF accounts for nearly 40% of an airline's operating cost (up to 60% during volatility); there IS a recovery/true-up mechanism; and the scheme covers both domestic AND international operations.", "id": "q120"}, {"topic": "Aviation/NCRPB", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the Cabinet-approved scheme for replacement of old trucks/buses in Delhi-NCR, consider the statements:\n1. The total financial outlay is ₹9,585 crore, including ₹5,041 crore from the Central Government.\n2. The scheme will benefit approximately 2.07 lakh owners, comprising 1.91 lakh trucks and 16,329 buses.\n3. The Centre offers a 5% interest subvention on loans for five years and monthly fuel vouchers up to ₹4,800.\n4. In Delhi, buses purchased under the scheme must be diesel-only, per stricter local emission norms.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "In Delhi, buses purchased under the scheme must be BS-VI CNG or electric only — not diesel-only — making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q121"}, {"topic": "Digital India", "difficulty": "moderate", "type": "combo", "q": "Instruction: Regarding technology-enabled public services under Digital India (June 2026 figures), consider the statements:\n1. GeM recorded a cumulative GMV of over ₹18.4 lakh crore, enabling over 11 lakh MSMEs to access government markets.\n2. ONDC expanded to over 20 crore buyers, 5 lakh sellers, and presence in 1,000 cities by June 2026.\n3. POSHAN Tracker connects 13.35 lakh Anganwadi Centres, catering to over 8.9 crore beneficiaries.\n4. PM GatiShakti's Network Planning Group had evaluated 352 projects worth ₹16.10 lakh crore as of February 2026, with all 352 already sanctioned.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "Of the 352 projects evaluated, only 201 were sanctioned and 167 were under implementation as of February 2026 — not all 352 sanctioned — making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q122"}, {"topic": "Digital India", "difficulty": "moderate", "type": "figure", "q": "MY Bharat (Mera Yuva Bharat), launched on 31 October 2023, set a Guinness World Record for which achievement?", "options": ["Most Users to Take an Online Quiz in One Week, with 390,812 verified participants", "Largest online voting drive in history", "Most volunteers registered on a single platform in one day", "Fastest growing youth mobile app in the world", "Most languages supported by a single government app"], "answer": 0, "explanation": "MY Bharat set a Guinness World Record for 'Most Users to Take an Online Quiz in One Week,' with 390,812 verified participants, showcasing the strength of India's DPI.", "id": "q123"}, {"topic": "Digital India", "difficulty": "hard", "type": "notamong", "q": "Which of the following is NOT one of the flagship initiatives explicitly named under 'Technology-Enabled Public Services for Social Welfare' in the Digital India backgrounder?", "options": ["UMANG", "Goods and Services Tax Network (GSTN)", "POSHAN Tracker", "PM GatiShakti", "National Career Employment Ledger (NCEL)"], "answer": 4, "explanation": "The initiatives named are UMANG, GSTN, POSHAN Tracker, PM GatiShakti, MY Bharat and AgriStack. 'National Career Employment Ledger (NCEL)' is not among them — it is fabricated (National Career Service, NCS, is the actual related platform mentioned elsewhere).", "id": "q124"}, {"topic": "AgriStack", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about AgriStack, developed under the Digital Agriculture Mission.", "options": ["AgriStack is a farmer-centric DPI powering services like e-NAM and Kisan e-Mitra, with over 9.20 crore Farmer IDs generated as of March 2026.", "AgriStack was launched in 2015 and focuses exclusively on crop insurance claims processing.", "As of March 2026, AgriStack had generated only 50 lakh Farmer IDs.", "AgriStack replaced the Kisan Credit Card scheme entirely.", "AgriStack is managed solely by state governments with no central component."], "answer": 0, "explanation": "AgriStack, developed under the Digital Agriculture Mission, powers services such as e-NAM and Kisan e-Mitra, with over 9.20 crore Farmer IDs generated as of March 2026.", "id": "q125"}, {"topic": "Startup Ecosystem", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding India's startup ecosystem (FY 2025-26 data cited in the Digital India section), consider the statements:\n1. Over 55,200 entities were certified by DPIIT in FY 2025-26 alone, the highest single-year addition since inception.\n2. Direct employment generated by recognised startups reached 23.36 lakh, a 36.1% year-on-year surge.\n3. Nearly 48% of all recognised startups feature at least one woman director or partner.\n4. India's Global Innovation Index ranking improved from 38 in 2015 to 81 in 2025.\nWhich of the statements given above is/are incorrect?", "options": ["4 only", "1 and 4 only", "2 only", "3 and 4 only", "None — all correct"], "answer": 0, "explanation": "The GII ranking trend is reversed in statement 4: it improved FROM 81 in 2015 TO 38 in 2025, not the other way around. Statements 1, 2 and 3 are accurate.", "id": "q126"}, {"topic": "Middle Class", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the World Bank's income classification and India's middle class, per the 'Middle Class Journey' backgrounder.", "options": ["For FY26, the World Bank classifies lower-middle income as $1,136–$4,495 GNI per capita.", "India's middle class expanded at 6.3% annually only between 2015 and 2020.", "By 2036, India's middle class and affluent consumers are projected to account for 70% of all spending, down from 80% in 2026.", "The global middle-class population contracted from 3.5 billion to 1.8 billion between 2009 and 2017.", "The World Economic Forum expects 93% of urban consumer growth to occur within the top five Indian cities."], "answer": 0, "explanation": "The FY26 World Bank classification places lower-middle income at $1,136-$4,495 GNI per capita. India's middle class expanded at 6.3% annually between 1995 and 2021 (not just 2015-2020); by 2036 middle class/affluent spending is projected to RISE to 93% (from 80% in 2026), not fall to 70%; the global middle class EXPANDED from 1.8 billion to 3.5 billion (not the reverse); and 93% of urban consumer growth is expected OUTSIDE the top five cities, not within them.", "id": "q127"}, {"topic": "Middle Class", "difficulty": "moderate", "type": "figure", "q": "According to the World Economic Forum, by 2035 what share of key generations (baby boomers, Gen X, millennials, Gen Z) is projected to spend $45 or more daily?", "options": ["20%+", "10%", "50%+", "5%", "35%"], "answer": 0, "explanation": "By 2035, 20%+ of key generations are projected to spend $45 or more daily, according to the WEF's analysis cited in the backgrounder.", "id": "q128"}, {"topic": "Bharat 6G/GII", "difficulty": "moderate", "type": "acronym", "q": "What does 'B6GA', formed in 2023 as an industry-led, government-facilitated initiative, stand for?", "options": ["Bharat 6G Alliance", "Bharat 6G Association", "Broadband 6G Alliance", "Bharat 6-Generation Alliance", "Bureau for 6G Advancement"], "answer": 0, "explanation": "B6GA stands for the Bharat 6G Alliance, formed in 2023, bringing together telecom service providers, academia, research institutions and standards organisations.", "id": "q129"}, {"topic": "Ayushman Bharat (Women)", "difficulty": "hard", "type": "figure", "q": "As per the Women-Led Development backgrounder, what share of Ayushman cards created under AB-PMJAY (as of February 2026) belong to women, and what is the corresponding absolute figure?", "options": ["Nearly 49%, or 21 crore", "Nearly 60%, or 26 crore", "Nearly 40%, or 17 crore", "Nearly 55%, or 24 crore", "Nearly 45%, or 19 crore"], "answer": 0, "explanation": "As of February 2026, over 43.52 crore Ayushman cards were created under AB-PMJAY, with women accounting for nearly 49% (about 21 crore) of these.", "id": "q130"}, {"topic": "Mission Indradhanush", "difficulty": "moderate", "type": "combo", "q": "Instruction: Regarding Mission Indradhanush and the U-WIN platform (as of relevant 2026 dates), consider the statements:\n1. Mission Indradhanush was launched in December 2014, targeting unvaccinated and partially vaccinated populations.\n2. As of March 18, 2026, over 11.87 crore children and 3.96 crore pregnant women had registered on U-WIN.\n3. 5.46 crore children and 1.32 crore pregnant women have been vaccinated through the mission.\n4. As of 17 February 2026, 8.73 crore women have been screened for breast cancer under the mission.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "The 8.73 crore women screening figure relates to CERVICAL cancer screening, not breast cancer, making statement 4 incorrect. Statements 1, 2 and 3 accurately reflect Mission Indradhanush's progress.", "id": "q131"}, {"topic": "eShram/PM Vishwakarma", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the eShram Portal and PM Vishwakarma scheme.", "options": ["eShram registrations grew from 14.40 crore (Dec 2021) to 31.64 crore (May 2026); PM Vishwakarma has registered over 30 lakh artisans as of May 2026.", "eShram registrations declined between 2021 and 2026.", "PM Vishwakarma covers artisans in only 5 traditional trades.", "Under PM Vishwakarma, no credit support has been extended to registered artisans.", "eShram registrations reached 31.64 crore by 2021, before the portal's actual launch."], "answer": 0, "explanation": "eShram registrations rose from 14.40 crore (Dec 2021) to 31.64 crore (May 2026); PM Vishwakarma registered over 30 lakh artisans as of May 2026 across 18 traditional trades, with over ₹5,133 crore in credit support sanctioned to 5.98 lakh beneficiaries.", "id": "q132"}, {"topic": "Social Security Schemes", "difficulty": "hard", "type": "intersection", "q": "Consider the following social security schemes discussed in the 'Empowering the Poor' backgrounder:\n1. National Pension System (NPS)\n2. Atal Pension Yojana (APY)\n3. Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)\n4. Pradhan Mantri Suraksha Bima Yojana (PMSBY)\n5. Pradhan Mantri Shram Yogi Maan-dhan (PM-SYM)\nWhich of the above were launched in the year 2015 (as opposed to 2019)?", "options": ["2, 3 and 4 only", "1, 2 and 3 only", "2 and 5 only", "1, 2, 3 and 4", "3, 4 and 5 only"], "answer": 0, "explanation": "APY, PMJJBY and PMSBY were all launched in 2015. PM-SYM was launched in 2019. NPS predates 2015 (it is a retirement scheme without a specific 2015/2019 launch year given in this passage), so it is excluded from this specific year-based grouping.", "id": "q133"}, {"topic": "PM-KISAN/PMMY", "difficulty": "moderate", "type": "figure", "q": "By 2026, Pradhan Mantri Mudra Yojana (PMMY) cumulative loan accounts expanded to over how many, with what share of loans sanctioned to women entrepreneurs?", "options": ["57 crore accounts; 66% of loans to women entrepreneurs", "40 crore accounts; 50% to women", "57 crore accounts; 49% to women", "70 crore accounts; 66% to women", "50 crore accounts; 40% to women"], "answer": 0, "explanation": "PMMY cumulative loan accounts expanded to over 57 crore by 2026, with 66% of loans (38.29 crore accounts, ₹16.88 lakh crore) disbursed to women entrepreneurs; separately, about 49% of loans were sanctioned to SC/ST/OBC entrepreneurs.", "id": "q134"}, {"topic": "Amrit Bharat/BharatNet", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about Amrit Bharat trains and BharatNet as of May 2026.", "options": ["60 Amrit Bharat train services were operational; BharatNet had expanded broadband to 2.19 lakh Gram Panchayats.", "100 Amrit Bharat trains were operational; BharatNet covered only 50,000 Gram Panchayats.", "BharatNet was launched in 2019, four years after Amrit Bharat trains began.", "Amrit Bharat trains are exclusively freight trains with no passenger service.", "BharatNet initiative connects only urban municipalities, not Gram Panchayats."], "answer": 0, "explanation": "As of May 2026, 60 Amrit Bharat train services were operational, and BharatNet (initiated in 2015) had expanded broadband to 2.19 lakh Gram Panchayats.", "id": "q135"}, {"topic": "Startup India (EoDB)", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding business entry reforms under Ease of Doing Business, consider the statements:\n1. In 2016, only 502 startups were recognised, creating 308 direct jobs; by March 2026, over 2.23 lakh startups had been recognised.\n2. SPICe+ Form's integrated web form offers 11 services from 3 Central Government ministries/departments and consolidates 10 essential procedures.\n3. MSME registrations on the Udyam Portal increased from 10.02 thousand in October 2020 to over 858 thousand by 5 June 2026.\n4. The Occupational Safety, Health and Working Conditions Code, 2020 replaced 20 Central Labour laws with a single legislation.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "All are correct"], "answer": 0, "explanation": "The OSH Code, 2020 replaced 13 Central Labour laws (not 20), making statement 4 incorrect. Statements 1, 2 and 3 correctly state the startup, SPICe+, and Udyam figures.", "id": "q136"}, {"topic": "Startup India (EoDB)", "difficulty": "moderate", "type": "figure", "q": "Under the Occupational Safety, Health and Working Conditions Code, 2020, the factory-licence employee threshold was raised from 10 to what figure for factories operating with power, and from 20 to what figure without power?", "options": ["20 (with power) and 40 (without power)", "15 (with power) and 30 (without power)", "25 (with power) and 50 (without power)", "20 (with power) and 30 (without power)", "10 (with power) and 20 (without power), unchanged"], "answer": 0, "explanation": "Under the OSH Code, the factory-licence threshold rose from 10 to 20 employees (with power) and from 20 to 40 employees (without power).", "id": "q137"}, {"topic": "E-Way Bill/GST Compliance", "difficulty": "moderate", "type": "figure", "q": "The number of E-Way Bills generated increased from 15.74 crore (July 2018-March 2019) to how many during FY 2025-2026?", "options": ["188.27 crore", "100 crore", "150 crore", "220 crore", "95 crore"], "answer": 0, "explanation": "E-Way Bills generated increased from 15.74 crore (July 2018-March 2019) to 188.27 crore during FY 2025-2026, reflecting logistics digitisation.", "id": "q138"}, {"topic": "Trade/Exports (EoDB)", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding India's cross-border trade efficiency initiatives, consider the statements:\n1. Under the Districts as Export Hubs initiative, Draft District Export Action Plans have been prepared for 590 districts, of which 249 have been formally notified.\n2. The Export Promotion Mission, approved in November 2025, is implemented through two sub-schemes: Niryat Protsahan and Niryat Disha.\n3. The Trade Connect e-Platform has over 20 lakh registered users with more than 35 lakh certificates of origin issued as on 5 June 2026.\n4. eCoO 2.0 uses multiple Importer Exporter Codes per user for enhanced security.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "eCoO 2.0 actually enables multi-user access UNDER A SINGLE Importer Exporter Code (not multiple IECs per user), making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q139"}, {"topic": "UPI/Digital Payments", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about UPI's growth as described in the Ease of Doing Business and Digital India backgrounders.", "options": ["UPI transactions grew from about 2 crore in FY2016-17 to over 24,162 crore in FY2025-26, and now powers 81% of India's digital payments.", "UPI connects only 100 banks on a single platform.", "UPI transaction value in FY2025-26 was approximately ₹29.53 lakh crore for the entire year.", "UPI is used by close to 100 million individuals and 540 million merchants.", "The IMF has yet to formally acknowledge UPI's scale."], "answer": 0, "explanation": "UPI transactions surged from about 2 crore (FY2016-17) to over 24,162 crore (FY2025-26), and UPI now powers 81% of India's digital payments. It connects 713 banks (not 100); its FY2025-26 transaction value was about ₹314 lakh crore (₹29.53 lakh crore was cited for a single month, March 2026); usage figures are 540.27 million individuals and 100 million merchants (reversed in the distractor); and the IMF HAS acknowledged UPI as the world's largest real-time payment system by volume.", "id": "q140"}, {"topic": "UPI/Digital Payments", "difficulty": "easy", "type": "acronym", "q": "What does 'BHIM', the Government-backed UPI app developed by NPCI, stand for?", "options": ["Bharat Interface for Money", "Bharat Instant Money", "Banking Integrated Mobile Interface", "Bharat Interbank Money", "Bharat Instant Mobile Interface"], "answer": 0, "explanation": "BHIM stands for Bharat Interface for Money, the Government-backed UPI app developed by the National Payments Corporation of India (NPCI).", "id": "q141"}, {"topic": "National Career Service/PMKVY", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's direct employment interventions.", "options": ["The National Career Service Portal, launched in July 2015, functions as India's digital employment marketplace.", "ABRY was operational from October 2014 to March 2018, covering the initial COVID-19 period.", "Pradhan Mantri Viksit Bharat Rozgar Yojana was announced in August 2025 with a ₹50,000 crore outlay.", "The Agnipath Scheme recruits youth aged 21 to 25 as Agniveers.", "Make in India was launched on 25th September 2015."], "answer": 0, "explanation": "NCS Portal was launched in July 2015. ABRY was operational from October 2020 to March 2024 (during COVID-19, not from 2014); PM Viksit Bharat Rozgar Yojana was announced with a ₹1 lakh crore outlay (not ₹50,000 crore); Agnipath recruits youth aged 17.5 to 21 (not 21-25); and Make in India was launched on 25th September 2014 (not 2015).", "id": "q142"}, {"topic": "Middle Class/PLI", "difficulty": "moderate", "type": "figure", "q": "The Production Linked Incentive (PLI) Scheme, launched in March 2020, is currently implemented across how many key sectors?", "options": ["14 sectors", "10 sectors", "27 sectors", "20 sectors", "8 sectors"], "answer": 0, "explanation": "The PLI Scheme, launched in March 2020, is implemented across 14 key sectors (distinct from Make in India 2.0's broader coverage of 27 sectors).", "id": "q143"}, {"topic": "Namami Gange/Rivers", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the Namami Gange Programme and Project Dolphin.", "options": ["Namami Gange was launched in June 2014 with an initial outlay of ₹20,000 crore, extended under Phase-II till March 2026 with an additional ₹22,500 crore.", "Project Dolphin, launched on 15 August 2021, focuses solely on the Irrawaddy Dolphin.", "Namami Gange was launched in 2019 with a ₹10,000 crore outlay.", "Project Dolphin proposes a 500-km Dolphin Conservation Zone in the Ganga River.", "The Gangetic and Indus Dolphins were merged into a single species classification under Project Dolphin."], "answer": 0, "explanation": "Namami Gange launched June 2014 with ₹20,000 crore, extended under Phase-II (to March 2026) with an additional ₹22,500 crore. Project Dolphin was launched on 15 August 2020 (not 2021) and covers Gangetic, Indus AND Irrawaddy dolphins; it proposes a 200-km (not 500-km) Dolphin Conservation Zone in the Chambal River; and it recognised the Gangetic and Indus Dolphins as DISTINCT species, not merged.", "id": "q144"}, {"topic": "National Coastal Mission", "difficulty": "moderate", "type": "figure", "q": "India's Blue Flag beach certification count grew from 8 beaches in 2020 to how many by 2025-26, spread across how many coastal States and UTs?", "options": ["18 beaches, across seven States and four UTs", "25 beaches, across ten States", "12 beaches, across five States", "15 beaches, across six States and two UTs", "10 beaches, across four States"], "answer": 0, "explanation": "India's Blue Flag certified beaches grew from 8 (2020) to 18 (2025-26), spread across seven coastal States and four Union Territories.", "id": "q145"}, {"topic": "National Marine Turtle Plan", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the National Marine Turtle Action Plan.", "options": ["Launched in 2021, it led to around 7,979 turtle hatchlings being safely released with a 96.7% hatching success rate.", "Launched in 2015, it focuses exclusively on Olive Ridley turtles in Odisha.", "The Plan reported a hatching success rate of below 50%.", "It was launched in 2018 as part of Project Tiger.", "It released over 50,000 turtle hatchlings in its first year."], "answer": 0, "explanation": "The National Marine Turtle Action Plan, launched in 2021, released around 7,979 turtle hatchlings with an impressive 96.7% hatching success rate.", "id": "q146"}, {"topic": "Youth/BIMSTEC", "difficulty": "moderate", "type": "figure", "q": "The 1st BIMSTEC Youth Summit was held in which city and month, with how many delegates from how many member nations?", "options": ["Ahmedabad, February 2025; 70 delegates from 7 member nations", "New Delhi, January 2024; 100 delegates from 8 nations", "Ahmedabad, March 2026; 50 delegates from 7 nations", "Mumbai, February 2025; 70 delegates from 6 nations", "Ahmedabad, February 2025; 100 delegates from 7 nations"], "answer": 0, "explanation": "The 1st BIMSTEC Youth Summit was held in Ahmedabad in February 2025, with 70 delegates from 7 member nations, themed 'Youth as a Bridge for Intra-BIMSTEC Exchange'.", "id": "q147"}, {"topic": "Aspirational Districts", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's Aspirational Districts and Blocks Programmes.", "options": ["The Aspirational Districts Programme, launched in 2018, targeted 112 underdeveloped districts; the Aspirational Blocks Programme (2023) reached 500 blocks across 329 districts.", "The Aspirational Districts Programme targeted 500 districts starting in 2015.", "The Aspirational Blocks Programme preceded the Aspirational Districts Programme by five years.", "Both programmes focus solely on digital literacy, excluding health and education.", "The Aspirational Blocks Programme covers 112 blocks across 18 districts."], "answer": 0, "explanation": "The Aspirational Districts Programme (2018) targeted 112 districts; it deepened in 2023 with the Aspirational Blocks Programme reaching 500 blocks across 329 districts, both covering health, nutrition, education, agriculture and financial inclusion.", "id": "q148"}, {"topic": "Tiger/Elephant/Lion Conservation", "difficulty": "hard", "type": "intersection", "q": "Consider the following wildlife conservation initiatives:\n1. Project Tiger\n2. Project Elephant\n3. Project Lion\n4. Project Cheetah\n5. National Conservation Strategy for the Indian One-Horned Rhinoceros\nWhich of the above are described in the backgrounder as recording a population increase of MORE THAN 65% over their respective reference periods (Tiger: 2014-2022; Lion: 2015-2025)?", "options": ["1 and 3 only", "1, 2 and 3", "3 and 4 only", "2 and 5 only", "1, 3 and 4"], "answer": 0, "explanation": "Tiger population rose from 2,226 (2014) to 3,682 (2022), a rise of about 65%+, and Asiatic lion numbers rose from 523 (2015) to 891 (2025), a rise of over 70%. Elephant and Rhino figures are given as absolute counts/estimates without a comparable stated percentage growth, and Cheetah is a reintroduction programme (population reaching 53 from zero via translocation), not a percentage-growth conservation recovery in the same sense.", "id": "q149"}, {"topic": "India AI Mission", "difficulty": "moderate", "type": "figure", "q": "How many Large Language Models and Small Language Models are being supported under the AI Foundation Model pillar of the IndiaAI Mission?", "options": ["15", "10", "25", "5", "20"], "answer": 0, "explanation": "Under the AI Foundation Model pillar, 15 Large Language Models and Small Language Models are being supported across speech, text and vision modalities.", "id": "q150"}, {"topic": "Health Transformation", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding India's overall health system strengthening over the past 12 years (Health Transformation backgrounder), consider the statements:\n1. Over 44 crore families have been insured and over 1.86 lakh primary care centres operationalised.\n2. Generic medicines are available at rates 50-90% below market price through over 18,000 Jan Aushadhi Kendras.\n3. Medical colleges in India have more than doubled, with 12 new AIIMS functional since 2014.\n4. About half of hospitalised patients pay below ₹2,500 for their care, per a 2025 NSO survey of 1.39 lakh households.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "The NSO survey found about half of hospitalised patients pay below Rs. 1,100 (not ₹2,500), making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q151"}, {"topic": "AMRIT Pharmacies/Diagnostics", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding affordable healthcare access initiatives, consider the statements:\n1. AMRIT Pharmacies, launched in 2015, provide medicines at discounts ranging from 50% to 90%.\n2. The Free Essential Diagnostics Initiative was launched in 2015 under the National Health Mission.\n3. Andhra Pradesh was the first state to implement the Free Diagnostics Initiative, in 2016.\n4. The Pradhan Mantri National Dialysis Programme was rolled out in 2018.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "All are correct"], "answer": 0, "explanation": "The Pradhan Mantri National Dialysis Programme was rolled out in 2016 (not 2018), making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q152"}, {"topic": "e-NAM/Mega Food Park", "difficulty": "moderate", "type": "combo", "q": "Instruction: Regarding agricultural market integration schemes, consider the statements:\n1. As of March 2026, 1,656 mandis have been integrated under e-NAM, with over 1.80 crore farmers.\n2. The number of Mega Food Parks increased from 2 in 2014 to 41 in 2025, including 24 operational and 17 under implementation.\n3. The Food Processing sector accounts for 12.83 percent of organized manufacturing employment per ASI 2023.\n4. The Agriculture Infrastructure Fund, launched in 2015-16, has sanctioned loans worth ₹1.68 lakh crore for 84,202 projects.\nWhich of the statements given above is/are incorrect?", "options": ["4 only", "1 and 4 only", "2 only", "3 and 4 only", "None — all correct"], "answer": 0, "explanation": "The Agriculture Infrastructure Fund was launched in 2020-21 (not 2015-16), and the correct figures are loans worth ₹84,202 crore sanctioned for 1.68 lakh projects (statement 4 swaps the loan-amount and project-count figures). Statements 1, 2 and 3 are correct.", "id": "q153"}, {"topic": "National Beekeeping/Exports", "difficulty": "moderate", "type": "combo", "q": "Instruction: Regarding India's agricultural exports and emerging livelihoods (2024-25 figures), consider the statements:\n1. The value of agricultural exports increased to USD 51.1 billion in 2024-25, a growth of nearly 37 percent.\n2. Processed food exports' share of agricultural exports rose to 20.4 percent in 2024-25, a nearly 49 percent rise.\n3. Seafood exports increased to around USD 7.52 billion in 2024-25, growing about 106 percent.\n4. The National Beekeeping and Honey Mission, launched in 2018, has pushed honey production to 0.152 million tonnes.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "The National Beekeeping and Honey Mission was launched in 2020 (not 2018), making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q154"}, {"topic": "Startup India Funding", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding India's startup funding architecture, consider the statements:\n1. Pradhan Mantri MUDRA Yojana (PMMY), launched in 2015, provides collateral-free loans up to ₹20 lakh.\n2. The Startup India Seed Fund Scheme, operational since April 2021, has an approved corpus of ₹945 crore across 215+ incubators.\n3. Fund of Funds for Startups (FFS), launched in 2016, is managed by SIDBI with a corpus of ₹10,000 crore.\n4. The Startup India Investor Connect Portal was launched in March 2021, two years before the Seed Fund Scheme.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "The Startup India Investor Connect Portal was launched in March 2023 (not March 2021), i.e., after the Seed Fund Scheme (April 2021), not before it — making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q155"}, {"topic": "Skilling (Youth)", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the NAVYA programme and PMKVY women's participation, consider the statements:\n1. NAVYA focuses on girls aged 16-18 years under PMKVY 4.0, introducing digital marketing, cybersecurity and AI-enabled services.\n2. NAVYA was launched in 2025 and targets training 3,850 girls across 27 Aspirational and North-Eastern districts in 19 states.\n3. Nearly 45% of PMKVY beneficiaries overall have been women.\n4. Under PMKVY, PMKVY 1.0 trained over 1.10 crore candidates, more than PMKVY 2.0's 19 lakh candidates.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "All are correct"], "answer": 0, "explanation": "The figures in statement 4 are swapped: PMKVY 1.0 trained over 19 lakh candidates, while PMKVY 2.0 trained over 1.10 crore candidates — not the reverse. Statements 1, 2 and 3 are accurate.", "id": "q156"}, {"topic": "DAY-NRLM/Lakhpati Didi", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding DAY-NRLM and the Lakhpati Didi initiative, consider the statements:\n1. DAY-NRLM covers 7,627 blocks nationwide and has developed 1.51 crore community cadre members.\n2. SHGs under DAY-NRLM have accessed over ₹12.18 lakh crore in bank credit, supported by 50,548+ trained Bank Sakhis.\n3. The Lakhpati Didi initiative covers 34 States/UTs, 757 districts, and is supported by a network of 93.85 lakh SHGs with 10.07 crore members.\n4. The Government's target under Lakhpati Didi is to create 3 crore Lakhpati Didis.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "The Government's target under Lakhpati Didi is 6 crore (not 3 crore) Lakhpati Didis, making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q157"}, {"topic": "Stand-Up India/PM SVANidhi", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding credit access schemes for women and street vendors, consider the statements:\n1. PM SVANidhi provides loans of up to ₹15,000 in the first tranche, rising to ₹25,000 and ₹50,000 for timely repayment, with a 7% interest subsidy.\n2. Over the last six years, PM SVANidhi sanctioned over 1.15 crore loans, benefiting nearly 74.9 lakh vendors, with women at 46% of beneficiaries.\n3. Stand-Up India (operational until March 2025) supported over 2.05 lakh women entrepreneurs with loans from ₹10 lakh to ₹1 crore.\n4. Under Stand-Up India, sanctioned amounts to women rose from over ₹44 crore in 2018 to nearly ₹12 crore in 2024.\nWhich of the statements given above is/are incorrect?", "options": ["4 only", "1 and 4 only", "2 only", "3 and 4 only", "None — all correct"], "answer": 0, "explanation": "The trend in statement 4 is reversed: sanctioned amounts to women ROSE from over ₹12 crore in 2018 to nearly ₹44 crore in 2024, not the other way round. Statements 1, 2 and 3 are correct.", "id": "q158"}, {"topic": "Composite Schemes Comparison", "difficulty": "hard", "type": "intersection", "q": "Consider the following digital/financial platforms discussed across the June 2026 PIB compilation:\n1. Jan Samarth Portal\n2. AgriStack\n3. Skill India Digital Hub (SIDH)\n4. UMANG\n5. DigiLocker\n6. Kisan Sarathi\nWhich of the above are explicitly described as being integrated with DigiLocker as one of their key national digital system integrations?", "options": ["3 only", "1 and 3", "2 and 6", "4 and 5", "1, 3 and 6"], "answer": 0, "explanation": "The source explicitly states that the Skill India Digital Hub (SIDH) has been integrated with key national digital systems including DigiLocker, e-Shram, NCS, UIDAI and PFMS. Jan Samarth, AgriStack, UMANG and Kisan Sarathi are described with their own distinct sets of integrations in the source, not explicitly paired with DigiLocker in the same way.", "id": "q159"}, {"topic": "Composite Schemes Comparison", "difficulty": "hard", "type": "intersection", "q": "Consider the following schemes/programmes for women and girls:\n1. Beti Bachao Beti Padhao (BBBP)\n2. Sukanya Samriddhi Yojana\n3. Vigyan Jyoti Scheme\n4. NAVYA\n5. PM Vishwakarma\nWhich of the above are targeted specifically at school-age girls (as opposed to broader women beneficiary groups)?", "options": ["1, 2, 3 and 4", "1 and 2 only", "3 and 4 only", "2, 3 and 4 only", "All five"], "answer": 0, "explanation": "BBBP addresses the girl child broadly; Sukanya Samriddhi is for girls up to age 10; Vigyan Jyoti targets girls in Classes IX-XII; and NAVYA targets girls aged 16-18. PM Vishwakarma is a general artisan-support scheme not specifically targeted at girls.", "id": "q160"}, {"topic": "GST Compliance", "difficulty": "moderate", "type": "figure", "q": "Effective from April 2019, the GST registration limit for goods suppliers was raised from ₹20 lakh to what figure, and the composition scheme limit from ₹75 lakh to what figure?", "options": ["₹40 lakh registration limit; ₹1.5 crore composition scheme limit", "₹50 lakh registration limit; ₹2 crore composition limit", "₹40 lakh registration limit; ₹1 crore composition limit", "₹30 lakh registration limit; ₹1.5 crore composition limit", "₹40 lakh registration limit; ₹2.5 crore composition limit"], "answer": 0, "explanation": "Effective April 2019, the GST registration limit for goods suppliers rose from ₹20 lakh to ₹40 lakh, and the composition scheme limit rose from ₹75 lakh to ₹1.5 crore (for most states).", "id": "q161"}, {"topic": "Digital Agriculture/Pest Surveillance", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the National Pest Surveillance System.", "options": ["Launched in August 2024, it covers 66 crops and monitors over 432 pest species using digital tools.", "It was launched in 2019 and covers only rice and wheat crops.", "It monitors fewer than 50 pest species nationwide.", "It is implemented exclusively by state agriculture departments without central involvement.", "It replaced the Krishi Vigyan Kendra network entirely."], "answer": 0, "explanation": "The National Pest Surveillance System, launched in August 2024, covers 66 crops and monitors over 432 pest species through digital, real-time monitoring tools.", "id": "q162"}, {"topic": "Namo Drone Didi", "difficulty": "moderate", "type": "figure", "q": "The Namo Drone Didi initiative was approved with what outlay for the period 2023-24 to 2025-26, and how many drones were distributed to SHG 'drone didis' in 2023-24?", "options": ["₹1,261 crore outlay; 1,094 drones distributed in 2023-24", "₹2,000 crore outlay; 5,000 drones distributed", "₹1,261 crore outlay; 15,000 drones distributed immediately", "₹500 crore outlay; 1,094 drones distributed", "₹1,261 crore outlay; 500 drones distributed"], "answer": 0, "explanation": "Namo Drone Didi was approved with an outlay of ₹1,261 crore for 2023-24 to 2025-26 (targeting 15,000 drones total), with 1,094 drones distributed to SHG drone didis in 2023-24 alone.", "id": "q163"}, {"topic": "Krishi Vigyan Kendras", "difficulty": "easy", "type": "figure", "q": "How many Krishi Vigyan Kendras (KVKs), established by ICAR, serve as frontline farmer-training centres across India per the Annadatas backgrounder?", "options": ["731", "500", "1,000", "250", "600"], "answer": 0, "explanation": "There are 731 Krishi Vigyan Kendras (KVKs), established by the Indian Council of Agricultural Research (ICAR), serving as frontline farmer-training centres.", "id": "q164"}, {"topic": "DAPSC/SC Welfare Convergence", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding SC welfare convergence frameworks, consider the statements:\n1. The Development Action Plan for Scheduled Castes (DAPSC) spans 38 Ministries and supports 239 schemes.\n2. PM-AJAY, launched in 2021, focuses on integrated development of Scheduled Caste-majority villages via an Adarsh Gram component.\n3. PM-AJAY covers 47,334 villages across 597 districts in 26 States, reaching over 4 crore SC citizens and over 83 lakh households.\n4. SHREYAS's Top Class Education component supported 8,000 SC students in 2025-26 across premier institutions.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "SHREYAS's Top Class Education component supported 4,156 SC students (not 8,000) in 2025-26, making statement 4 incorrect. Statements 1, 2 and 3 correctly describe DAPSC and PM-AJAY.", "id": "q165"}];
