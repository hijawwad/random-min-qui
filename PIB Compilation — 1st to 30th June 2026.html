<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIB June 2026 — NABARD ESI/GA Practice</title>
<style>
:root{
  --bg:#12151b;
  --panel:#1a1f28;
  --panel-alt:#212734;
  --panel-hover:#262d3c;
  --border:#2c3242;
  --border-soft:#232936;
  --text:#e9e6dd;
  --text-dim:#9aa1b2;
  --text-faint:#6b7284;
  --gold:#c9a24a;
  --gold-dim:#8c7a4a;
  --good:#4f9d6e;
  --good-bg:rgba(79,157,110,.14);
  --bad:#c9614f;
  --bad-bg:rgba(201,97,79,.14);
  --serif: Georgia, 'Times New Roman', Times, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- shared bits ---------- */
.eyebrow{
  font-family:var(--sans);
  font-size:12.5px;
  letter-spacing:.02em;
  color:var(--gold);
  margin:0 0 6px;
}
h1.title{
  font-family:var(--serif);
  font-weight:400;
  font-size:30px;
  line-height:1.25;
  margin:0 0 4px;
  color:var(--text);
}
p.sub{
  color:var(--text-dim);
  font-size:14.5px;
  margin:0 0 28px;
  max-width:60ch;
}
.btn{
  font-family:var(--sans);
  font-size:14px;
  padding:10px 18px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--panel-alt);
  color:var(--text);
  cursor:pointer;
  transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:var(--panel-hover);border-color:var(--gold-dim);}
.btn:disabled{opacity:.4;cursor:default;}
.btn-primary{
  background:var(--gold);
  border-color:var(--gold);
  color:#191510;
  font-weight:600;
}
.btn-primary:hover{background:#d9b25c;border-color:#d9b25c;}
.btn-ghost{background:transparent;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.hidden{display:none !important;}
a.linklike{color:var(--gold);cursor:pointer;text-decoration:none;border-bottom:1px solid var(--gold-dim);}
a.linklike:hover{border-color:var(--gold);}

/* ---------- home screen ---------- */
.mode-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:8px;}
@media(min-width:640px){.mode-grid{grid-template-columns:1fr 1fr 1fr;}}
.mode-card{
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:22px 20px;
  cursor:pointer;
  transition:border-color .15s ease, transform .1s ease;
  display:flex;flex-direction:column;gap:8px;
}
.mode-card:hover{border-color:var(--gold-dim);}
.mode-card .num{font-family:var(--serif);font-size:26px;color:var(--gold);}
.mode-card h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0;color:var(--text);}
.mode-card p{margin:0;color:var(--text-dim);font-size:13.5px;}
.home-footer-note{margin-top:36px;font-size:12.5px;color:var(--text-faint);border-top:1px solid var(--border-soft);padding-top:16px;}

/* ---------- sub-panel (practice test config, section grid) ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:24px;
  margin-top:18px;
}
.toggle-row{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;width:fit-content;margin:14px 0 6px;}
.toggle-opt{padding:9px 18px;font-size:13.5px;cursor:pointer;background:var(--panel-alt);color:var(--text-dim);}
.toggle-opt.active{background:var(--gold);color:#191510;font-weight:600;}
.count-line{color:var(--text-dim);font-size:13px;margin-top:10px;}

.section-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px;max-height:520px;overflow-y:auto;padding-right:4px;}
@media(min-width:600px){.section-grid{grid-template-columns:1fr 1fr;}}
.section-tile{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--panel-alt);border:1px solid var(--border-soft);
  border-radius:var(--radius);padding:12px 14px;cursor:pointer;font-size:13.5px;
}
.section-tile:hover{border-color:var(--gold-dim);background:var(--panel-hover);}
.section-tile .cnt{color:var(--gold);font-size:12px;font-family:var(--serif);}

/* ---------- quiz screen ---------- */
.quiz-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.quiz-meta{font-size:12.5px;color:var(--text-dim);}
.quiz-score{font-size:12.5px;color:var(--gold);}
.progress-track{height:3px;background:var(--border-soft);border-radius:2px;overflow:hidden;margin-bottom:26px;}
.progress-fill{height:100%;background:var(--gold);transition:width .25s ease;}

.diff-badge{
  display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:2px;margin-bottom:14px;
  border:1px solid var(--border);color:var(--text-dim);
}
.diff-badge.easy{color:#7fb894;border-color:#33513f;}
.diff-badge.moderate{color:#cbb15c;border-color:#4a4230;}
.diff-badge.hard{color:#cf7c6c;border-color:#4a332e;}

.passage{
  font-family:var(--serif);
  font-size:15.5px;
  line-height:1.65;
  white-space:pre-wrap;
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-left:3px solid var(--gold-dim);
  padding:18px 20px;
  border-radius:var(--radius);
  margin-bottom:22px;
}

.options{display:flex;flex-direction:column;gap:10px;}
.option{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:14px 16px;
  cursor:pointer;
  font-size:14.5px;
  transition:border-color .12s ease, background .12s ease;
}
.option:hover:not(.locked){border-color:var(--gold-dim);background:var(--panel-alt);}
.option .letter{
  font-family:var(--serif);color:var(--text-faint);font-size:14px;min-width:18px;
}
.option.correct{border-color:var(--good);background:var(--good-bg);}
.option.correct .letter{color:var(--good);}
.option.wrong{border-color:var(--bad);background:var(--bad-bg);}
.option.wrong .letter{color:var(--bad);}
.option.locked{cursor:default;}
.option.dim{opacity:.5;}

.feedback-box{
  margin-top:18px;padding:16px 18px;border-radius:var(--radius);
  background:var(--panel-alt);border:1px solid var(--border-soft);font-size:13.8px;line-height:1.6;color:var(--text-dim);
}
.feedback-box .verdict{font-weight:700;font-family:var(--sans);font-size:13px;margin-bottom:6px;display:block;}
.feedback-box.correct .verdict{color:var(--good);}
.feedback-box.wrong .verdict{color:var(--bad);}
.feedback-box.skipped .verdict{color:var(--gold);}

.quiz-actions{display:flex;justify-content:space-between;margin-top:22px;align-items:center;}

/* ---------- end screen ---------- */
.score-hero{text-align:center;padding:34px 20px;background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);}
.score-hero .big{font-family:var(--serif);font-size:52px;color:var(--gold);line-height:1;}
.score-hero .lbl{color:var(--text-dim);font-size:13.5px;margin-top:8px;}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
.bd-item{background:var(--panel-alt);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px;text-align:center;}
.bd-item .n{font-family:var(--serif);font-size:20px;color:var(--text);}
.bd-item .l{font-size:11.5px;color:var(--text-dim);margin-top:2px;}

.review-list{margin-top:24px;display:flex;flex-direction:column;gap:12px;}
.review-item{background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--bad);border-radius:var(--radius);padding:16px 18px;}
.review-item.skipped-item{border-left-color:var(--gold-dim);}
.review-item .rq{font-family:var(--serif);font-size:14.5px;white-space:pre-wrap;margin-bottom:8px;}
.review-item .ra{font-size:13px;color:var(--good);margin-bottom:6px;}
.review-item .re{font-size:13px;color:var(--text-dim);}
.review-toggle{margin-top:20px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const QUESTIONS = [{"topic": "PM-KISAN", "difficulty": "easy", "type": "figure", "q": "As of the 23rd instalment released in June 2026, what is the annual financial assistance provided to each eligible farmer family under PM-KISAN, and in how many instalments is it paid?", "options": ["₹6,000 annually, in three instalments of ₹2,000", "₹8,000 annually, in four instalments of ₹2,000", "₹6,000 annually, in two instalments of ₹3,000", "₹4,000 annually, in two instalments of ₹2,000", "₹6,000 annually, in three instalments of ₹1,500"], "answer": 0, "explanation": "Each eligible farmer family receives ₹6,000 a year, paid in three equal instalments of ₹2,000 via DBT into Aadhaar-seeded bank accounts.", "id": "q1"}, {"topic": "PM-KISAN", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the PM-KISAN scheme and its 23rd instalment (June 2026).", "options": ["PM-KISAN was launched as a centrally sponsored scheme on February 24, 2019.", "The 23rd instalment of ₹18,880 crore was announced from Bhopal, Madhya Pradesh.", "The Union Budget 2026–27 allocated ₹40,000 crore for the PM-KISAN scheme.", "The Kisan-eMitra chatbot was introduced in September 2021 with support from BHASHINI alone.", "As of December 2025, ₹416.75 lakh crore has been recovered from ineligible beneficiaries."], "answer": 0, "explanation": "PM-KISAN is a centrally sponsored scheme launched on 24 February 2019. The 23rd instalment was announced in Hooghly, West Bengal; the 2026–27 Budget allocated ₹60,000 crore; Kisan-eMitra was introduced in September 2023 with support from EkStep Foundation and BHASHINI; and ₹416.75 crore (not lakh crore) has been recovered from ineligible beneficiaries.", "id": "q2"}, {"topic": "PM-KISAN", "difficulty": "moderate", "type": "combo", "q": "Instruction: Recently, in June 2026, the Prime Minister released the 23rd instalment of PM-KISAN. Consider the following statements:\n1. Over 9.44 crore farmers received financial assistance under this instalment, of which 2.18 crore are women farmers.\n2. Over ₹4.46 lakh crore has been disbursed under the scheme since its 2019 launch.\n3. The Kisan-eMitra chatbot offers 24/7 assistance in 11 major Indian languages.\n4. The PM-KISAN mobile application was launched in 2018, a year before the scheme itself.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1 and 3 only", "2 and 4 only", "All of the above", "1, 2 and 4 only"], "answer": 0, "explanation": "The PM-KISAN mobile app was launched in 2020, after the scheme's 2019 launch, so statement 4 is incorrect. Statements 1, 2 and 3 are correct as per the release.", "id": "q3"}, {"topic": "Heritage", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's heritage conservation schemes under 'Vikas Bhi, Virasat Bhi'.", "options": ["The PRASHAD scheme was launched in January 2015 to develop pilgrimage and heritage tourism destinations.", "Adopt a Heritage was launched in 2015 and revamped in 2020 as Adopt a Heritage 2.0.", "Swadesh Darshan 1.0 sanctioned 76 tourism infrastructure projects worth ₹2,208.31 crore.", "HRIDAY Scheme was implemented in 20 cities and its mission period ended in March 2021.", "The Archaeological Experiential Museum at Vadnagar was established in 2019 at a cost of ₹140.61 crore."], "answer": 0, "explanation": "PRASHAD was launched in January 2015. Adopt a Heritage was launched in September 2017 and revamped in September 2023 (as 2.0); Swadesh Darshan 1.0 sanctioned 76 projects worth ₹5,290.33 crore (the ₹2,208.31 crore figure is for SD 2.0's 53 projects); HRIDAY covered 12 cities and ended 31 March 2019; the Vadnagar museum was established in January 2025 at ₹298 crore (the ₹140.61 crore/2019 figures belong to the National Museum of Indian Cinema).", "id": "q4"}, {"topic": "Heritage", "difficulty": "hard", "type": "combo", "q": "Instruction: As of February 2026, the Ministry of Tourism reported progress on several heritage schemes. Consider the following statements:\n1. Under PRASHAD, 54 projects have been sanctioned across 28 States/UTs with an estimated cost of ₹1,726.74 crore.\n2. Under Swadesh Darshan 2.0, 53 projects have been sanctioned with a total investment of ₹2,208.31 crore.\n3. India currently has 44 UNESCO World Heritage Sites and 15 UNESCO Intangible Cultural Heritage elements.\n4. The Gyan Bharatam initiative for manuscript digitisation was launched in 2020 with an outlay of ₹298 crore.\nWhich of the statements given above are correct?", "options": ["1, 2 and 3 only", "1 and 2 only", "2, 3 and 4 only", "All of the above", "3 and 4 only"], "answer": 0, "explanation": "Statement 4 is wrong: Gyan Bharatam was launched in 2025 with an outlay of ₹482.85 crore (2024–31); ₹298 crore is the cost of the Vadnagar Archaeological Experiential Museum. Statements 1, 2 and 3 match the source.", "id": "q5"}, {"topic": "Heritage", "difficulty": "easy", "type": "acronym", "q": "In the context of India's pilgrimage tourism scheme, what does 'PRASHAD' stand for?", "options": ["Pilgrimage Rejuvenation and Spiritual, Heritage Augmentation Drive", "Pilgrimage Renewal and Sacred Heritage Advancement Development", "Promotion of Religious and Spiritual Heritage Amenities Development", "Pilgrimage Restoration and Spiritual Habitat Augmentation Design", "Protection of Religious Assets and Sacred Heritage Amenities Drive"], "answer": 0, "explanation": "PRASHAD stands for Pilgrimage Rejuvenation and Spiritual, Heritage Augmentation Drive, launched in January 2015.", "id": "q6"}, {"topic": "Heritage", "difficulty": "moderate", "type": "notamong", "q": "Which of the following is NOT one of the intangible heritage recognitions of India mentioned along with Yoga, Kumbh Mela and Deepawali as key UNESCO-listed elements?", "options": ["Durga Puja", "Garba", "Chhau Dance", "Vedic Chanting Tradition", "None of the above — all are genuine listed elements"], "answer": 2, "explanation": "The source text lists Yoga, Kumbh Mela, Deepawali, Durga Puja and Garba as key intangible heritage recognitions. Chhau Dance, while a real UNESCO-listed Indian element in general, is not among those specifically named in this passage — it is the plausible fabricated substitute here.", "id": "q7"}, {"topic": "Youth/Viksit Bharat", "difficulty": "moderate", "type": "stmt", "q": "Which ONE of the following statements about India's youth and skilling ecosystem (as per the 'Empowered Youth, Stronger Nation' backgrounder) is correct?", "options": ["The National Youth Policy (NYP) 2014 defines youth as individuals aged 15–29 years.", "As of March 31, 2026, over 32 crore verified APAAR IDs have been generated for students.", "The Atal Innovation Mission has established over 6,700 Atal Tinkering Labs supporting 10,000 startups.", "PM–SETU was launched in October 2024 at an estimated cost of ₹60,000 crore.", "Skill India Mission (SIM) was launched in 2014 to provide skill, re-skill and up-skill training."], "answer": 0, "explanation": "NYP 2014 defines youth as those aged 15–29. APAAR IDs generated stood at over 15.48 crore (not 32 crore — that figure is ABC student IDs); Atal Tinkering Labs number over 10,000 while Atal Incubation Centres (72) supported 6,700+ startups; PM-SETU was launched in October 2025; Skill India Mission was launched in 2015.", "id": "q8"}, {"topic": "Youth/Viksit Bharat", "difficulty": "hard", "type": "combo", "q": "Instruction: As of June 2026, several skilling schemes under the Skill India Mission report the following progress. Consider the statements:\n1. PMKVY 2.0 (2016–20) trained/oriented over 1.10 crore candidates.\n2. PMKVY 4.0 (2022–26) has trained over 27 lakh candidates across 40 sectors, covering 36 States and 741 districts.\n3. NAPS was launched in August 2016 and the Government contributes 25% of stipend (up to ₹1,500/month) directly to apprentices.\n4. SANKALP was a World Bank-supported initiative launched in 2015 and concluded in March 2022.\nWhich of the statements given above is/are incorrect?", "options": ["4 only", "1 and 4 only", "2 and 3 only", "3 only", "1, 2 and 3 only"], "answer": 0, "explanation": "SANKALP was launched in 2018 (not 2015) and concluded in March 2025 (not 2022), so statement 4 alone is incorrect. Statements 1, 2 and 3 are all accurate.", "id": "q9"}, {"topic": "Youth/Viksit Bharat", "difficulty": "moderate", "type": "acronym", "q": "What does the skilling scheme 'PM–SETU', launched in October 2025 with an outlay of ₹60,000 crore, stand for?", "options": ["Pradhan Mantri Skilling and Employability Transformation through Upgraded ITIs", "Pradhan Mantri Scheme for Employment and Training of Youth", "Pradhan Mantri Skill Enhancement and Training Utilisation", "Pradhan Mantri Sector-wise Employability Transformation Umbrella", "Pradhan Mantri Skills for Emerging Technology Upliftment"], "answer": 0, "explanation": "PM–SETU stands for Pradhan Mantri Skilling and Employability Transformation through Upgraded ITIs, a centrally sponsored scheme to upgrade 1,000 Government ITIs in a hub-and-spoke model.", "id": "q10"}, {"topic": "Youth/Viksit Bharat", "difficulty": "moderate", "type": "combo", "q": "Instruction: The 'SOAR' (Skilling for AI Readiness) programme was discussed in the June 2026 backgrounder. Consider the statements:\n1. SOAR was launched in July 2025 for school students from Classes 6 to 12.\n2. It offers three 15-hour modules: AI to be Aware, AI to Aspire, and AI to Acquire.\n3. SOAR is implemented by the Ministry of Education.\n4. SOAR equips educators to integrate AI concepts into learning.\nWhich of the above statements is/are correct?", "options": ["1, 2 and 4 only", "1, 2, 3 and 4", "2 and 3 only", "1 and 3 only", "3 and 4 only"], "answer": 0, "explanation": "SOAR was launched by the Ministry of Skill Development and Entrepreneurship, not the Ministry of Education, making statement 3 incorrect. Statements 1, 2 and 4 are correct.", "id": "q11"}, {"topic": "Youth/Viksit Bharat", "difficulty": "easy", "type": "figure", "q": "Under the Prime Minister Internship Scheme (PMIS), launched in October 2024, what is the monthly financial assistance and one-time incidental grant provided to interns?", "options": ["₹9,000 monthly assistance and a ₹6,000 one-time incidental grant", "₹10,000 monthly assistance and a ₹5,000 one-time grant", "₹8,000 monthly assistance and a ₹10,000 one-time grant", "₹9,000 monthly assistance and no incidental grant", "₹6,000 monthly assistance and a ₹9,000 one-time grant"], "answer": 0, "explanation": "PMIS provides ₹9,000 monthly financial assistance (Government + Company contribution) plus a one-time incidental grant of ₹6,000.", "id": "q12"}, {"topic": "Youth/Viksit Bharat", "difficulty": "hard", "type": "notamong", "q": "Which of the following is NOT one of the four sectors identified for India's Make in India 2.0 that were named alongside aerospace, electronics, and pharmaceuticals in the backgrounder?", "options": ["Automobiles", "Food processing", "Drones", "Renewable hydrogen equipment", "Textiles"], "answer": 3, "explanation": "The passage names aerospace, electronics, pharmaceuticals, automobiles, food processing, textiles, drones and IT as sectors under Make in India 2.0. 'Renewable hydrogen equipment' is not among the sectors listed.", "id": "q13"}, {"topic": "Youth/Viksit Bharat", "difficulty": "moderate", "type": "stmt", "q": "Which ONE of the following statements about India's startup and funding ecosystem is correct?", "options": ["Startup India was launched on 16th January 2016 and by June 2026 over 2.3 lakh DPIIT-recognised startups exist.", "The Fund of Funds for Startups (FFS) is managed by NABARD with a corpus of ₹10,000 crore.", "The Startup India Seed Fund Scheme has an approved corpus of ₹1,945 crore across 500+ incubators.", "Before 2014, India had 3,500 startups, which grew to 2.3 lakh by 2026.", "Nearly 25 per cent of recognised startups now emerge from Tier-II and Tier-III cities."], "answer": 0, "explanation": "Startup India launched 16 January 2016; over 2.3 lakh DPIIT-recognised startups existed by June 2026. FFS is managed by SIDBI (not NABARD); SISFS corpus is ₹945 crore across 215+ incubators; before 2014 India had only 350 startups; nearly 50% (not 25%) of startups now emerge from Tier-II/III cities.", "id": "q14"}, {"topic": "Youth/Viksit Bharat", "difficulty": "moderate", "type": "figure", "q": "Regarding the Agnipath Scheme and post-service employment for Agniveers, which pairing of reservation figures is correct?", "options": ["10% of Level-1 railway posts and 5% of Level-2-and-above posts are reserved for ex-Agniveers", "5% of Level-1 railway posts and 10% of Level-2-and-above posts are reserved for ex-Agniveers", "15% of CAPF recruitment and 10% of Level-1 railway posts are reserved for ex-Agniveers", "10% of CAPF recruitment and 15% of Level-1 railway posts are reserved for ex-Agniveers", "20% of Level-1 railway posts and no railway reservation for Level-2 posts"], "answer": 0, "explanation": "10% of Level-1 railway posts and 5% of Level-2-and-above posts are reserved for ex-Agniveers; separately, a 10% reservation exists in CAPFs and Assam Rifles.", "id": "q15"}, {"topic": "Antyodaya Schemes", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about PM JANMAN (Pradhan Mantri Janjati Adivasi Nyaya Maha Abhiyan).", "options": ["PM JANMAN was launched in November 2023 and targets 75 PVTG communities across 18 states and 1 UT.", "PM JANMAN targets 100 PVTG communities across 22 states with a budgetary outlay of ₹15,000 crore.", "PM JANMAN is implemented through 11 ministries covering 9 interventions.", "As of April 2026, 500 Van Dhan Vikas Kendras had been operationalised out of a target of 491.", "PM JANMAN was launched in October 2024, converging five earlier minority welfare schemes."], "answer": 0, "explanation": "PM JANMAN, launched November 2023, targets 75 PVTG communities across 18 states and 1 UT, working through 11 interventions implemented by 9 ministries (not 11 ministries/9 interventions reversed), with a total outlay of ₹24,104 crore. As of April 2026, 491 VDVKs were operationalised out of a target of 500. The October 2024 launch converging five schemes describes PM VIKAS, not PM JANMAN.", "id": "q16"}, {"topic": "Antyodaya Schemes", "difficulty": "hard", "type": "combo", "q": "Instruction: As of 2025-26, several tribal and SC welfare schemes report the following. Consider the statements:\n1. Eklavya Model Residential Schools (EMRS) enrol over 1.56 lakh students in 499 schools, with 323 more under construction.\n2. PM-AJAY covers 47,334 villages across 597 districts in 26 States, reaching over 4 crore SC citizens.\n3. The Development Action Plan for Scheduled Castes (DAPSC) spans 38 Ministries and supports 239 schemes.\n4. SHREYAS was launched in February 2021 and reserves 30% of Top Class Education seats for SC boys.\nWhich of the statements given above is/are incorrect?", "options": ["4 only", "1 and 4 only", "2 only", "3 and 4 only", "None — all are correct"], "answer": 0, "explanation": "SHREYAS was launched in February 2019 (not 2021) and reserves 30% of seats for SC girls (not boys), so statement 4 is incorrect. Statements 1, 2 and 3 match the source figures.", "id": "q17"}, {"topic": "Antyodaya Schemes", "difficulty": "moderate", "type": "acronym", "q": "What does 'SHRESHTA', the scheme launched in June 2022 for residential education of SC students in Classes IX–XII, stand for?", "options": ["Scheme for Residential Education for Students in High Schools in Targeted Areas", "Scheme for Rural Education and Skill Training for Hostel Accommodation", "Scheme for Residential and Higher Education Support for Targeted Areas", "Scheme for Rural Students' Holistic Education and Talent Advancement", "Scheme for Residential Empowerment through Scholarships for Targeted Areas"], "answer": 0, "explanation": "SHRESHTA stands for Scheme for Residential Education for Students in High Schools in Targeted Areas, launched in June 2022 with Mode-I (NETS-based private schools) and Mode-II (voluntary-organisation-run residential schools).", "id": "q18"}, {"topic": "Antyodaya Schemes", "difficulty": "moderate", "type": "notamong", "q": "PM VIKAS (Pradhan Mantri Virasat Ka Samvardhan), launched in 2025, converged five existing minority welfare schemes into a single framework. Which of the following was NOT one of these five converged schemes?", "options": ["Seekho Aur Kamao", "USTTAD", "Nai Roshni", "Nai Manzil", "PM DAKSH"], "answer": 4, "explanation": "The five schemes converged into PM VIKAS are Seekho Aur Kamao, USTTAD, Hamari Dharohar, Nai Roshni and Nai Manzil. PM DAKSH is a separate scheme for marginalised communities under the Ministry of Social Justice and Empowerment, not one of the five converged under PM VIKAS.", "id": "q19"}, {"topic": "Antyodaya Schemes", "difficulty": "hard", "type": "figure", "q": "Under PM-DAKSH, which pairing of eligibility income ceilings for beneficiary categories is correct?", "options": ["OBCs: family income up to ₹3 lakh; EBCs: family income up to ₹1 lakh", "OBCs: family income up to ₹1 lakh; EBCs: family income up to ₹3 lakh", "OBCs: family income up to ₹2.5 lakh; EBCs: no income ceiling", "Scheduled Castes: family income up to ₹3 lakh; OBCs: no income ceiling", "OBCs and EBCs both: family income up to ₹2 lakh"], "answer": 0, "explanation": "Under PM-DAKSH, Scheduled Castes and Denotified/Nomadic Tribes have no income ceiling, OBCs are capped at family income up to ₹3 lakh, and EBCs at up to ₹1 lakh.", "id": "q20"}, {"topic": "Infrastructure", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's transport infrastructure programmes (as of 2026).", "options": ["Under the Amrit Bharat Station Scheme (2023), redevelopment was completed at 208 of 1,338 identified stations.", "India has the largest road network in the world at 63.73 lakh km.", "Bharatmala Pariyojana, approved in 2017, has completed 34,800 km of roads till March 2026.", "The UDAN scheme, launched in 2016, connects 665 airports directly, excluding heliports and water aerodromes.", "Sagarmala, launched in 2018, completed 78 projects worth ₹5,356.75 crore by March 2026."], "answer": 0, "explanation": "The Amrit Bharat Station Scheme (2023) completed redevelopment at 208 of 1,338 stations. India has the second-largest (not largest) road network; Bharatmala had completed 22,590 km (not 34,800 km, which is the total planned corridor length) by March 2026; UDAN's 665 routes connect 95 airports, heliports and water aerodromes combined; Sagarmala was launched in 2015, not 2018.", "id": "q21"}, {"topic": "Infrastructure", "difficulty": "hard", "type": "combo", "q": "Instruction: As of June 2026, India's logistics and water infrastructure report the following. Consider the statements:\n1. The PM GatiShakti National Master Plan, launched in October 2021, uses more than 3,202 data layers across 58 Ministries and Departments.\n2. India's rank in the World Bank Logistics Performance Index improved from 54 in 2014 to 38 in 2023.\n3. The Jal Jeevan Mission, launched in 2019, had achieved 81.94% rural tap water coverage by June 2026, up from about 17% at launch.\n4. National Waterways expanded from 5 in 2014 to 111 in 2026, of which all 111 are currently operational.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2 and 3 only", "1 and 4 only", "3 and 4 only"], "answer": 0, "explanation": "Only 32 of the 111 National Waterways were operational as of March 2026 — not all 111 — so statement 4 is incorrect. Statements 1, 2 and 3 are correct as per the source.", "id": "q22"}, {"topic": "Infrastructure", "difficulty": "moderate", "type": "acronym", "q": "In the context of India's industrial infrastructure push, what does the 'BHAVYA' scheme (approved March 2026) stand for?", "options": ["Building Hub for Advanced and Vibrant Yojana for Acceleration", "Bharat Hub for Advanced Vocational Yojana and Access", "Building Hub for Agricultural Value and Yojana Advancement", "Bharat Hub for Aatmanirbhar Vikas Yojana for Aspiring entrepreneurs", "Business Hub for Advanced Village and Yojana Amplification"], "answer": 0, "explanation": "BHAVYA stands for Building Hub for Advanced and Vibrant Yojana for Acceleration, envisaging 100 new plug-and-play industrial parks.", "id": "q23"}, {"topic": "Infrastructure", "difficulty": "easy", "type": "figure", "q": "The Modified UDAN scheme, launched in 2026, was announced with what outlay and target of new destinations?", "options": ["₹28,840 crore, connecting 120 new destinations", "₹18,840 crore, connecting 100 new destinations", "₹28,840 crore, connecting 95 new destinations", "₹38,000 crore, connecting 150 new destinations", "₹20,000 crore, connecting 120 new destinations"], "answer": 0, "explanation": "The Modified UDAN scheme was launched in 2026 with an outlay of ₹28,840 crore, aiming to connect 120 new destinations.", "id": "q24"}, {"topic": "Infrastructure", "difficulty": "moderate", "type": "notamong", "q": "Which of the following is NOT one of the four digital logistics platforms named as supporting the National Logistics Policy in the infrastructure backgrounder?", "options": ["Unified Logistics Interface Platform (ULIP)", "Logistics Data Bank (LDB)", "NETC FASTag", "PRAGATI", "National Trade Facilitation Portal (NTFP)"], "answer": 4, "explanation": "The four platforms named are ULIP (2022), Logistics Data Bank (2016), NETC FASTag (2016), and PRAGATI (2015). 'National Trade Facilitation Portal (NTFP)' is not named among them in this section — it is the fabricated substitute.", "id": "q25"}, {"topic": "PMSMA", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the Pradhan Mantri Surakshit Matritva Abhiyan (PMSMA) as it completes a decade in June 2026.", "options": ["PMSMA was launched on 9 June 2016 and provides free antenatal care on the 9th of every month.", "PMSMA services are provided at private hospitals only, on the 15th of every month.", "India achieved a 43-point reduction in MMR, from 87 to 130, between 2014-16 and 2022-24.", "Under PMSMA, High Risk Pregnancy identification screens for 15 high-risk factors.", "More than 5 crore pregnant women have received antenatal services under PMSMA since launch."], "answer": 0, "explanation": "PMSMA was launched on 9 June 2016 and provides antenatal care on the 9th of every month at designated government facilities. MMR fell from 130 to 87 (not the reverse); HRP screening covers 25 factors (not 15); over 7.50 crore pregnant women had been examined by the decade mark (not 5 crore).", "id": "q26"}, {"topic": "PMSMA", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding PMSMA's decade of operation (as of May 2026 data), consider the statements:\n1. Uttar Pradesh recorded the highest number of pregnant women receiving antenatal care under PMSMA in May 2026, with 1,66,210 women.\n2. Madhya Pradesh ranked second, ahead of Bihar, in pregnant women receiving antenatal care in May 2026.\n3. The Surakshit Matritva Aashwasan (SUMAN) initiative operates through a network of over 99,290 facilities.\n4. Janani Suraksha Yojana (JSY) has benefited more than 11.96 crore women since 2014-15 as of March 2025.\nWhich of the statements given above is/are correct?", "options": ["1, 2, 3 and 4", "1, 3 and 4 only", "2 and 3 only", "1 and 4 only", "1, 2 and 3 only"], "answer": 0, "explanation": "All four statements match the source: UP led antenatal care coverage with 1,66,210 women, followed by Madhya Pradesh (51,331) just ahead of Bihar (51,230); SUMAN's network covers 99,290+ facilities; and JSY benefited over 11.96 crore women since 2014-15 as of March 2025.", "id": "q27"}, {"topic": "Health Transformation", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the Ayushman Bharat scheme's four pillars.", "options": ["AB-PMJAY provides free health insurance up to ₹5 lakh per family per year to about 40% of the population.", "AB-PMJAY was launched in 2016 and provides ₹10 lakh cover per family per year.", "Ayushman Arogya Mandirs offer 8 free services and have recorded a footfall of 540 crore.", "PM-ABHIM was launched on 25 October 2020 with an outlay of ₹64,180 crore for FY2021-26.", "ABDM, launched in September 2021, uses an 18-digit ABHA health identifier."], "answer": 0, "explanation": "AB-PMJAY provides ₹5 lakh cover per family/year to ~40% of the population (~12 crore families). It was launched in 2018, not 2016; AAMs offer 12 free services (not 8); PM-ABHIM was launched on 25 October 2021 (not 2020); ABHA is a 14-digit identifier, not 18-digit.", "id": "q28"}, {"topic": "Health Transformation", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the Ayushman Bharat Vay Vandana scheme extending coverage to senior citizens (as of June 5, 2026), consider the statements:\n1. It extends AB-PMJAY coverage to all senior citizens above 70 years, introduced in October 2024.\n2. 1.20 crore senior citizens were enrolled and availed over 13.84 lakh treatments worth ₹3,000 crore.\n3. A total of 36,218 hospitals were empanelled, comprising 19,659 public and 16,559 private hospitals.\n4. Overall, 44.14 crore Ayushman Cards had been created and 12.03 crore hospitalisations covered under AB-PMJAY.\nWhich of the statements given above is/are correct?", "options": ["1, 2, 3 and 4", "1 and 2 only", "2, 3 and 4 only", "1, 3 and 4 only", "None of the above"], "answer": 0, "explanation": "All four statements are accurate as reported for the Ayushman Bharat Vay Vandana expansion and overall AB-PMJAY progress as of early June 2026.", "id": "q29"}, {"topic": "Health Transformation", "difficulty": "moderate", "type": "acronym", "q": "Under Pillar 3 of Ayushman Bharat, what does 'PM-ABHIM' stand for?", "options": ["Pradhan Mantri Ayushman Bharat Health Infrastructure Mission", "Pradhan Mantri Arogya Bharat Health Insurance Mission", "Pradhan Mantri Ayushman Bharat Hospital Infrastructure Mandate", "Pradhan Mantri Affordable Bharat Health Improvement Mission", "Pradhan Mantri Ayushman Bharat Health Innovation Mission"], "answer": 0, "explanation": "PM-ABHIM stands for Pradhan Mantri Ayushman Bharat Health Infrastructure Mission, launched 25 October 2021 with an outlay of ₹64,180 crore (FY2021-22 to 2025-26).", "id": "q30"}, {"topic": "Health Transformation", "difficulty": "moderate", "type": "notamong", "q": "Which of the following is NOT one of the four focus areas of the National Quantum Mission, approved in April 2023 with an outlay of ₹6,003.65 crore?", "options": ["Quantum Computing", "Quantum Communication", "Quantum Sensing and Metrology", "Quantum Materials and Devices", "Quantum Cryptographic Networking"], "answer": 4, "explanation": "The National Quantum Mission focuses on four areas: Quantum Computing, Quantum Communication, Quantum Sensing and Metrology, and Quantum Materials and Devices. 'Quantum Cryptographic Networking' is not one of the named four areas — it is the fabricated substitute.", "id": "q31"}, {"topic": "Health Transformation", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding communicable disease elimination programmes discussed in India's Health Transformation backgrounder, consider the statements:\n1. Over 3.78 lakh Nik-shay Mitras have supported over 20 lakh TB patients under the National Tuberculosis Elimination Programme.\n2. The National Framework for Malaria Elimination (2016) targets elimination by 2027, refined by a National Strategic Plan (2023-2027).\n3. Pradhan Mantri TB Mukt Bharat Abhiyaan was launched in September 2022 as the community-led component of NTEP.\n4. Malaria mortality is down 78% and TB incidence has fallen over the past 12 years.\nWhich of the statements given above is/are correct?", "options": ["1, 2, 3 and 4", "1 and 3 only", "2 and 4 only", "1, 2 and 4 only", "None of the above"], "answer": 0, "explanation": "All four statements accurately reflect the backgrounder's description of India's TB and malaria elimination efforts.", "id": "q32"}, {"topic": "Health Transformation", "difficulty": "easy", "type": "figure", "q": "Since its November 2019 launch, how many calls has the eSanjeevani national telemedicine service recorded, as per the Health Transformation backgrounder?", "options": ["Over 47 crore calls", "Over 27 crore calls", "Over 15 crore calls", "Over 60 crore calls", "Over 35 crore calls"], "answer": 0, "explanation": "eSanjeevani, launched in November 2019, has recorded over 47 crore calls connecting people to specialists.", "id": "q33"}, {"topic": "Health Transformation", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about Tele-MANAS, India's mental health helpline.", "options": ["Tele-MANAS was launched in October 2022 and is available in 20 languages across all 36 States/UTs.", "Tele-MANAS was launched in October 2019 by ICMR and operates only through a mobile app.", "There are 23 Tele-MANAS Cells and 53 Mentoring Institutes connected to the platform.", "Tele-MANAS mobile app was launched in October 2022, the same year as the helpline.", "Tele-MANAS provides services only in Hindi and English nationwide."], "answer": 0, "explanation": "Tele-MANAS was launched in October 2022, available in 20 languages across all 36 States/UTs. The number of cells/institutes is reversed in option C (it is actually 53 Cells and 23 Mentoring Institutes); the mobile app was launched later, in October 2024; and i-DRONE (not Tele-MANAS) was launched by ICMR.", "id": "q34"}, {"topic": "Ease of Doing Business", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's Ease of Doing Business reforms.", "options": ["India's rank in the World Bank's Doing Business Report improved from 142 in 2014 to 63 in 2019.", "The Udyam Registration Portal was introduced in July 2018 and is linked only with GSTN.", "MCA21 Version 3 was launched in FY 2019-20 and lacks e-adjudication features.", "The National Single Window System, launched in 2020, integrates 32 Central and 20 State Departments.", "PARIVESH 2.0 was launched in August 2020 and reduced EC approval time to 105 days from 64."], "answer": 0, "explanation": "India's Doing Business rank improved from 142 (2014) to 63 (2019). Udyam Registration was introduced in July 2020, linked with CBDT and GSTN; MCA21 V3 launched in FY2021-22 with e-adjudication; NSWS (launched 2021) integrates 32 Central Departments and 34 State Governments; PARIVESH 2.0 launched August 2018, cutting average EC approval time to 64 days from a stipulated 105 days.", "id": "q35"}, {"topic": "Ease of Doing Business", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding India's credit-access and digital-commerce reforms for MSMEs (as reported in 2025-26 data), consider the statements:\n1. Under CGTMSE, ₹9.34 lakh crore worth of cumulative guarantees have been approved as of 31 March 2025.\n2. GeM achieved a cumulative GMV of ₹18.4 lakh crore, including over ₹5 lakh crore in FY 2025-26 alone.\n3. Over ₹3.68 lakh crore has been sanctioned under ECLGS, of which ₹2.43 lakh crore was for MSMEs.\n4. ONDC, introduced in April 2020, is aimed at democratising digital commerce.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2 and 3 only", "1 and 4 only", "3 and 4 only"], "answer": 0, "explanation": "ONDC was introduced in April 2022, not April 2020, making statement 4 incorrect. Statements 1, 2 and 3 correctly state the CGTMSE, GeM and ECLGS figures.", "id": "q36"}, {"topic": "Ease of Doing Business", "difficulty": "moderate", "type": "acronym", "q": "What does 'PARIVESH', the single window hub for environmental clearances launched in August 2018, stand for?", "options": ["Pro-Active and Responsive facilitation by Interactive, Virtuous, and Environmental Single Window Hub", "Portal for Approval, Regulation and Verification of Environmental Sustainability and Habitat", "Planning and Registration for Integrated Verification of Environment, Sustainability and Heritage", "Pro-Active Response for Industrial Verification of Environment and Sustainable Habitat", "Programme for Assessment, Review and Implementation of Vigilant Environmental Standards Hub"], "answer": 0, "explanation": "PARIVESH stands for Pro-Active and Responsive facilitation by Interactive, Virtuous, and Environmental Single Window Hub, streamlining EC, FC, WL and CRZ clearances.", "id": "q37"}, {"topic": "Ease of Doing Business", "difficulty": "moderate", "type": "figure", "q": "By when did the average time for environmental clearance approval under PARIVESH 2.0 reduce to 64 days, against what stipulated timeline?", "options": ["2025-26; against a stipulated 105 days", "2023-24; against a stipulated 90 days", "2025-26; against a stipulated 120 days", "2024-25; against a stipulated 100 days", "2022-23; against a stipulated 105 days"], "answer": 0, "explanation": "The average EC approval time reduced to 64 days in 2025-26, against the stipulated timeline of 105 days.", "id": "q38"}, {"topic": "Ease of Doing Business", "difficulty": "moderate", "type": "notamong", "q": "Which of the following is NOT one of the five measures named as collectively driving inclusion, transparency and efficiency for deepening market connectivity in the EoDB backgrounder?", "options": ["GeM", "ONDC", "PM GatiShakti", "NLP (Marine)", "National Trade Repository (NTR)"], "answer": 4, "explanation": "The backgrounder names GeM, ONDC, PM GatiShakti, NLP (Marine) and LDB 2.0 as the measures collectively driving market connectivity. 'National Trade Repository (NTR)' is not among them — it is fabricated.", "id": "q39"}, {"topic": "Jan Samarth Portal", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the Jan Samarth Portal on its 4th anniversary.", "options": ["Launched on 6 June 2022, it provides a unified gateway for 16 Credit-linked Central Government Schemes.", "Launched on 6 June 2020, it covers only agriculture and housing sectors.", "The portal is available in 12 languages and has onboarded 500 Member Lending Institutions.", "As on 1 June 2026, banks accorded digital approvals worth ₹5,00,000 crore to 49.55 lakh beneficiaries.", "The portal offers 12 loan categories including Credit Guarantee Coverage and Home Loan."], "answer": 0, "explanation": "Jan Samarth Portal, launched 6 June 2022, provides a unified gateway for 16 credit-linked Central Government Schemes. It is available in 8 languages, onboarded 269 Member Lending Institutions, offers 8 loan categories, and by 1 June 2026 had accorded digital approvals worth ₹2,76,493.78 crore (not ₹5,00,000 crore) to 49.55 lakh beneficiaries.", "id": "q40"}, {"topic": "Jan Samarth Portal", "difficulty": "hard", "type": "notamong", "q": "Which of the following is NOT one of the 8 loan categories available on the Jan Samarth Portal?", "options": ["Credit Guarantee Coverage", "E-NWR Financing", "Home Loan", "Agri Loan Kisan Credit Card", "Education Loan"], "answer": 4, "explanation": "The 8 loan categories are Credit Guarantee Coverage, E-NWR Financing, Home Loan, Agri Loan Kisan Credit Card, Renewable Energy, Agri Infrastructure Loan, Business Activity Loan and Livelihood Loan. 'Education Loan' is not among these 8 categories.", "id": "q41"}, {"topic": "Biodiversity", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's biodiversity governance framework.", "options": ["The Biological Diversity Act, 2002 (amended 2023) establishes a three-tier structure: NBA at national level, SBBs/UTBCs at state level, and BMCs at local level.", "The National Biodiversity Authority operates under the Ministry of Agriculture and was set up in 2010.", "NBSAP 2024-2030 predates and is unrelated to the Kunming-Montreal Global Biodiversity Framework.", "The Nagoya Protocol was adopted at COP-15 of the CBD in Montreal in December 2022.", "20 institutions are designated under Section 27 of the BD Act as repositories for biological resources."], "answer": 0, "explanation": "The three-tier structure is NBA (national) → SBBs/UTBCs (state/UT) → BMCs (local). NBA operates under MoEFCC; NBSAP 2024-2030 is explicitly aligned with the KMGBF; the Nagoya Protocol was adopted at COP-10 in Nagoya, Japan (2010) — COP-15/Montreal/2022 is when KMGBF was adopted; and the 20 repository institutions are designated under Section 39 (not Section 27) of the BD Act.", "id": "q42"}, {"topic": "Biodiversity", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding India's wildlife conservation milestones (as of the 2026 backgrounder), consider the statements:\n1. India's tiger population increased from 2,226 in 2014 to 3,682 in the latest estimate, with Tiger Reserves rising from 46 to 58.\n2. Project Cheetah, launched on 17 September 2022, has brought cheetahs from Namibia, South Africa and Botswana, with the population reaching 53.\n3. Asiatic lion numbers increased from 523 in 2015 to 891 in 2025, a rise of over 70 per cent.\n4. India's forest and tree cover stands at about 8.27 lakh sq. km, covering 30.17 per cent of geographical area.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "1, 3 and 4 only"], "answer": 0, "explanation": "India's forest and tree cover covers 25.17% (not 30.17%) of the geographical area, making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q43"}, {"topic": "Biodiversity", "difficulty": "moderate", "type": "acronym", "q": "What does 'KMGBF', the international biodiversity agreement adopted at COP15 in Montreal (December 2022), stand for?", "options": ["Kunming-Montreal Global Biodiversity Framework", "Kunming Ministerial Global Biological Framework", "Kyoto-Montreal Global Biodiversity Fund", "Kunming-Montreal Genetic Biodiversity Framework", "Kunming-Montreal Global Biosafety Framework"], "answer": 0, "explanation": "KMGBF stands for the Kunming-Montreal Global Biodiversity Framework, adopted at COP15 of the CBD by 196 nations to halt and reverse biodiversity loss by 2030.", "id": "q44"}, {"topic": "Biodiversity", "difficulty": "moderate", "type": "figure", "q": "As of May 2026, how much has India's Access and Benefit Sharing (ABS) framework released to beneficiaries since its start, and how many Biodiversity Management Committees have benefited?", "options": ["Nearly ₹145 crore, benefiting around 11,000 BMCs", "Nearly ₹266 crore, benefiting around 11,000 BMCs", "Nearly ₹78 crore, benefiting around 10,500 BMCs", "Nearly ₹145 crore, benefiting around 23,000 BMCs", "Nearly ₹120 crore, benefiting around 11,000 BMCs"], "answer": 0, "explanation": "As of May 2026, nearly ₹145 crore has been released to beneficiaries, benefiting around 11,000 Biodiversity Management Committees (₹266 crore is the cumulative amount realised through the ABS mechanism since 2008, a different figure).", "id": "q45"}, {"topic": "Agriculture (Annadatas)", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's foodgrain and crop production growth (2024-25 figures vs 2014-15).", "options": ["Rice touched a record production of 150.18 Mt in 2024-25, a 42.38% increase over 2014-15.", "Wheat production reached 117.94 Mt in 2024-25, over 50% higher than 2014-15.", "Maize production reached 43.40 Mt, roughly double the 2014-15 figure of 24.17 Mt.", "Oilseeds registered 42.99 Mt production in 2024-25, 76% higher than 2014-15.", "Total foodgrain production reached 357.73 million tonnes in 2023-24."], "answer": 0, "explanation": "Rice hit a record 150.18 Mt, up 42.38% from 2014-15. Wheat rose over 36% (not 50%) to 117.94 Mt; maize rose about 79% (not ~100%) from 24.17 Mt to 43.40 Mt; oilseeds rose 56% (not 76%); and foodgrain production of 357.73 Mt was recorded in 2024-25, not 2023-24.", "id": "q46"}, {"topic": "Agriculture (Annadatas)", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding institutional agricultural credit and insurance schemes (as of relevant 2025-26 data), consider the statements:\n1. Under PMFBY, since 2016-17, 92.46 crore farmer applications have been insured, with claims worth ₹1.96 lakh crore disbursed by 31 December 2025.\n2. The Kisan Credit Card scheme had 7.81 crore Operative KCC Accounts as of September 2025 for FY 2024-25.\n3. MSPs have been fixed at a minimum of 40% above cost of production since 2018-19.\n4. Total MSP procurement value reached ₹26.32 lakh crore from 2014-2026 (up to February 2026), 3.5 times the previous decade.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 4 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "3 and 4 only"], "answer": 0, "explanation": "MSPs have been fixed at a minimum of 50% (not 40%) above cost of production since 2018-19, making statement 3 incorrect. Statements 1, 2 and 4 are accurate.", "id": "q47"}, {"topic": "Agriculture (Annadatas)", "difficulty": "moderate", "type": "figure", "q": "Among Kharif crops, which crop recorded the highest MSP growth of 236 percent since 2014-15, as noted in the Annadatas backgrounder?", "options": ["Ragi", "Bajra", "Maize", "Jowar", "Cotton"], "answer": 0, "explanation": "Ragi recorded the highest MSP growth of 236 percent among Kharif crops since 2014-15.", "id": "q48"}, {"topic": "Agriculture (Annadatas)", "difficulty": "moderate", "type": "notamong", "q": "Which of the following is NOT one of the four strategic components of PMKSY listed under its irrigation value chain?", "options": ["Accelerated Irrigation Benefit Programme (AIBP)", "Har Khet Ko Pani (HKKP)", "Watershed Development", "Per Drop More Crop (PDMC)", "Jal Shakti Abhiyan (JSA)"], "answer": 4, "explanation": "PMKSY's four components are AIBP, Har Khet Ko Pani, Watershed Development and Per Drop More Crop. Jal Shakti Abhiyan is a separate, distinct water-conservation campaign, not a PMKSY component.", "id": "q49"}, {"topic": "Agriculture (Annadatas)", "difficulty": "easy", "type": "acronym", "q": "What does 'PMFBY', India's crop insurance scheme, stand for?", "options": ["Pradhan Mantri Fasal Bima Yojana", "Pradhan Mantri Farmers' Benefit Yojana", "Pradhan Mantri Fasal Beema Yatra", "Pradhan Mantri Farm Bima Yatra", "Pradhan Mantri Fasal Bachao Yojana"], "answer": 0, "explanation": "PMFBY stands for Pradhan Mantri Fasal Bima Yojana, following the principle of 'One Nation, One Crop, One Premium'.", "id": "q50"}, {"topic": "Agriculture (Annadatas)", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding livestock, dairy and fisheries growth (2024-25 vs 2013-14/2014-15), consider the statements:\n1. Milk production increased to 247.87 million tonnes in 2024-25, a growth of over 69.4 percent.\n2. India's per capita milk availability reached 485 grams/day in 2024-25, compared to a global average of 328 grams/day.\n3. Total fish production increased from 9.58 million tonnes in 2013-14 to 19.78 million tonnes in 2024-25.\n4. Egg production increased to 149.11 billion eggs in 2024-25, with India ranking first globally in egg production.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1, 3 and 4 only", "All are incorrect"], "answer": 0, "explanation": "India ranks second (not first) in global egg production and fourth in meat production, making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q51"}, {"topic": "Agriculture (Annadatas)", "difficulty": "moderate", "type": "figure", "q": "The Digital Agriculture Mission had digitised how many Farmer IDs and crop plots as of February 2026?", "options": ["Over 7.63 crore Farmer IDs and about 23.5 crore crop plots", "Over 9.20 crore Farmer IDs and about 15 crore crop plots", "Over 5 crore Farmer IDs and about 30 crore crop plots", "Over 7.63 crore Farmer IDs and about 10 crore crop plots", "Over 3 crore Farmer IDs and about 23.5 crore crop plots"], "answer": 0, "explanation": "As of February 2026, over 7.63 crore Farmer IDs were created and about 23.5 crore crop plots digitised (a related but distinct AgriStack figure of 9.20 crore Farmer IDs is cited elsewhere, as of March 2026, in the Digital India section).", "id": "q52"}, {"topic": "Green Transformation", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's mangrove and coastal conservation efforts.", "options": ["India's mangrove cover increased from 4,628 sq km in 2013 to 4,992 sq km in 2023, a net gain of 363 sq km.", "The MISHTI scheme received an initial outlay of ₹500 crore for mangrove restoration.", "India had 100 Ramsar sites in 2014, which increased to only 26 by 2026.", "Blue Flag certification was first awarded to Indian beaches in 2018, covering ten beaches.", "The National Coastal Mission was extended for 2025-31 with an allocation of ₹1,019.26 crore."], "answer": 0, "explanation": "Mangrove cover rose from 4,628 to 4,992 sq km (net gain 363 sq km). MISHTI's initial outlay was ₹100 crore, not ₹500 crore; India had 26 Ramsar sites in 2014, rising to 100 by 2026 (the statement reverses this); Blue Flag certification began in 2020 with 8 beaches; and the National Coastal Mission extension (2025-31) received ₹767 crore, not ₹1,019.26 crore (which is the Green India Mission's release figure).", "id": "q53"}, {"topic": "Green Transformation", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding India's global climate diplomacy initiatives, consider the statements:\n1. The International Solar Alliance (ISA) was launched jointly by India and France at COP21 in Paris (2015) and now has 112 member countries per the Green Transformation backgrounder.\n2. The Coalition for Disaster Resilient Infrastructure (CDRI) was launched by India in 2019 and granted international organisation status with HQ in New Delhi in 2022.\n3. Mission LiFE was launched at COP27 in Sharm El Sheikh in the presence of the UN Secretary-General.\n4. The International Big Cat Alliance (IBCA) became a treaty-based intergovernmental organization on 23 January 2025, with 26 member countries.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 4 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "2 and 4 only"], "answer": 0, "explanation": "Mission LiFE was launched in 2022 (not at COP27), and was reflected in the COP27 Sharm El Sheikh Implementation Plan afterward — it was not launched there, making statement 3 incorrect. Statements 1, 2 and 4 are correct.", "id": "q54"}, {"topic": "Green Transformation", "difficulty": "moderate", "type": "acronym", "q": "What does 'MISHTI', the mangrove restoration scheme, stand for?", "options": ["Mangrove Initiative for Shoreline Habitats & Tangible Incomes", "Mission for Integrated Shoreline and Tidal Improvement", "Marine Initiative for Sustainable Habitats and Tidal Infrastructure", "Mangrove and Island Sustainable Habitat and Tourism Initiative", "Ministry Initiative for Shoreline Health and Tidal Investment"], "answer": 0, "explanation": "MISHTI stands for Mangrove Initiative for Shoreline Habitats & Tangible Incomes.", "id": "q55"}, {"topic": "Green Transformation", "difficulty": "moderate", "type": "notamong", "q": "India's National Determined Contribution (NDC) achievements, as listed in the backgrounder, include several milestones. Which of the following is NOT one of the achievements explicitly listed?", "options": ["Reducing emissions intensity by more than 36% from 2005 levels, ahead of the 33-35% target", "Achieving 40% non-fossil electricity capacity nine years ahead of the 2030 target", "Creating an additional carbon sink of 2.29 billion tonnes of CO2 equivalent", "Achieving net-zero carbon emissions across the power sector by 2026", "Non-fossil sources accounting for 52.57% of installed power capacity by February 2026"], "answer": 3, "explanation": "The backgrounder lists the emissions-intensity reduction, the early 40% non-fossil capacity target, the 2.29 billion tonnes carbon sink, and the 52.57% non-fossil share as achievements — it does not claim net-zero power-sector emissions by 2026, which is a fabricated claim.", "id": "q56"}, {"topic": "Green Transformation", "difficulty": "hard", "type": "intersection", "q": "Consider the following global/international bodies and initiatives associated with India's environmental diplomacy:\n1. International Solar Alliance (ISA)\n2. Coalition for Disaster Resilient Infrastructure (CDRI)\n3. International Big Cat Alliance (IBCA)\n4. Global Biofuels Alliance (GBA)\n5. One Sun One World One Grid (OSOWOG)\n6. Kunming-Montreal Global Biodiversity Framework (KMGBF)\nWhich of the above are treaty-based intergovernmental organisations (as explicitly described in the source), rather than initiatives/frameworks without that formal status?", "options": ["1, 2 and 3 only", "1, 3 and 5 only", "2, 4 and 6 only", "1, 2, 3 and 4", "All six"], "answer": 0, "explanation": "ISA is described as a 'treaty-based intergovernmental organization'; CDRI was granted 'status of an international organization' in 2022; IBCA 'formally became a treaty-based intergovernmental organization' on 23 January 2025. GBA and OSOWOG are alliances/initiatives, and KMGBF is an international framework/agreement — none of these three are described as treaty-based intergovernmental organisations in the source.", "id": "q57"}, {"topic": "Green Transformation", "difficulty": "moderate", "type": "figure", "q": "How many cheetahs has India brought in under Project Cheetah since its September 2022 launch, and from which countries, per the Green Transformation backgrounder?", "options": ["29 cheetahs — 8 from Namibia, 12 from South Africa, 9 from Botswana", "29 cheetahs — 12 from Namibia, 8 from South Africa, 9 from Botswana", "20 cheetahs — 8 from Namibia, 12 from South Africa", "29 cheetahs — all from Namibia in a single batch", "35 cheetahs — 8 from Namibia, 12 from South Africa, 15 from Botswana"], "answer": 0, "explanation": "29 cheetahs have been brought in: 8 from Namibia (September 2022), 12 from South Africa (February 2023), and 9 from Botswana (February 2026), taking the cheetah population to 53.", "id": "q58"}, {"topic": "Women-Led Development", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about Beti Bachao Beti Padhao (BBBP).", "options": ["BBBP was launched on 22 January 2015 and is a joint initiative of MWCD, MoHFW and Ministry of Education.", "BBBP was launched in 2018 solely by the Ministry of Women and Child Development.", "Under BBBP, the Sex Ratio at Birth improved from 929 in 2014-15 to 918 in 2024-25.", "BBBP focuses only on enforcement of the PCPNDT Act, without any awareness component.", "Girls' secondary enrolment declined from 80.2% to 75.51% between 2014-15 and 2024-25."], "answer": 0, "explanation": "BBBP, launched 22 January 2015, is a joint initiative of MWCD, MoHFW and Ministry of Education. Sex Ratio at Birth improved from 918 (2014-15) to 929 (2024-25) — the statement reverses this; BBBP integrates PCPNDT Act enforcement WITH mass awareness efforts; and girls' secondary enrolment rose from 75.51% to 80.2% (not declined).", "id": "q59"}, {"topic": "Women-Led Development", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding maternity and child benefit schemes (as of April 2026 data), consider the statements:\n1. Under PMMVY, women receive ₹5,000 for the first living child and ₹6,000 for a second child (girl child only).\n2. Since PMMVY's inception, 4.92 crore beneficiaries have been enrolled and 4.28 crore paid, as on 30 April 2026.\n3. JSSK beneficiaries in FY 2024-25 included 1.99 crore pregnant women and 16.85 lakh sick infants.\n4. The Sukanya Samriddhi Yojana, launched in 2015, offers a fixed 7% annual interest with no tax benefits.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 4 only", "All are correct"], "answer": 0, "explanation": "Sukanya Samriddhi Yojana offers 8.2% annual interest (not 7%) WITH tax-free returns under Section 80C, making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q60"}, {"topic": "Women-Led Development", "difficulty": "moderate", "type": "notamong", "q": "Under Mission Shakti's 'Sambal' vertical (safety-focused), which of the following is NOT one of the key components listed?", "options": ["One Stop Centres (OSCs)", "Women Helpline (181)", "Nari Adalat", "Shakti Sadan", "Mahila Suraksha Kendra"], "answer": 4, "explanation": "Sambal's key components listed are One Stop Centres, Women Helpline (181) and Nari Adalat. Shakti Sadan actually falls under the Samarthya vertical, but among these five options, 'Mahila Suraksha Kendra' is the fabricated item not named anywhere in the source.", "id": "q61"}, {"topic": "Women-Led Development", "difficulty": "hard", "type": "intersection", "q": "Consider the following schemes discussed in the Women-Led Development backgrounder:\n1. PM SVANidhi\n2. Stand-Up India\n3. NaMo Drone Didi Yojana\n4. Lakhpati Didi\n5. Pradhan Mantri Mudra Yojana (PMMY)\nWhich of the above schemes explicitly report a specific percentage share of women/female beneficiaries in the source (e.g., 46% women beneficiaries)?", "options": ["1 and 5 only", "1, 2 and 5 only", "2, 3 and 4 only", "1, 3 and 5 only", "All five"], "answer": 0, "explanation": "PM SVANidhi reports women account for 46% of beneficiaries; PMMY reports 66% of loans (38.29 crore accounts) disbursed to women entrepreneurs. Stand-Up India, NaMo Drone Didi and Lakhpati Didi report absolute beneficiary/target numbers for women but not comparable percentage splits in this passage.", "id": "q62"}, {"topic": "Women-Led Development", "difficulty": "moderate", "type": "figure", "q": "The Nari Shakti Vandan Adhiniyam, 2023 provides what percentage of reservation for women in the Lok Sabha and State Legislative Assemblies?", "options": ["33%", "25%", "50%", "30%", "40%"], "answer": 0, "explanation": "The Nari Shakti Vandan Adhiniyam, 2023 provides 33% reservation for women in the Lok Sabha and State Legislative Assemblies.", "id": "q63"}, {"topic": "Poverty Alleviation Decade", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's poverty alleviation and welfare achievements over the past decade.", "options": ["Nearly 25 crore people escaped multidimensional poverty, which declined to 11.28% in 2022-23.", "Rural sanitation coverage rose from 39% in 2014 to 75% today, still short of universal coverage.", "Ayushman Bharat issued 33.93 crore health cards as of the poverty alleviation review.", "PMGKAY ensured free foodgrains for over 50 crore beneficiaries.", "Female primary school dropout rates rose from 0.3% to 4.6% between 2013-14 and 2024-25."], "answer": 0, "explanation": "Nearly 25 crore people escaped multidimensional poverty, which fell to 11.28% in 2022-23. Rural sanitation reached universal coverage (not just 75%); Ayushman Bharat issued 43.93 crore (not 33.93 crore) health cards; PMGKAY covered over 81 crore (not 50 crore) beneficiaries; and female dropout rates FELL from 4.6% to 0.3% (the statement reverses the trend).", "id": "q64"}, {"topic": "Poverty Alleviation Decade", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding housing and electrification schemes (as of May 2026 data), consider the statements:\n1. Under PMAY-Gramin, 3.91 crore houses have been sanctioned and 3.03 crore completed as of May 2026.\n2. Around 96% of houses under PMAY-U 2.0 are registered in the name of a woman.\n3. The Saubhagya scheme, launched in 2017, achieved 100% village electrification by 2025 and electrified nearly 2.86 crore households.\n4. Average daily rural electricity supply increased from 22.6 hours in FY2014 to 12.5 hours in FY2025.\nWhich of the statements given above is/are incorrect?", "options": ["4 only", "1 and 4 only", "2 only", "3 and 4 only", "None — all correct"], "answer": 0, "explanation": "The trend in statement 4 is reversed: average daily rural electricity supply rose from 12.5 hours in FY2014 to 22.6 hours in FY2025. Statements 1, 2 and 3 are accurate.", "id": "q65"}, {"topic": "Poverty Alleviation Decade", "difficulty": "moderate", "type": "acronym", "q": "What does 'ODF++' signify under the Swachh Bharat Abhiyan-Urban framework?", "options": ["An area where all toilets are functional and maintained, with faecal sludge and sewage safely treated rather than discharged untreated", "An area that has achieved open-defecation-free status only, with no waste management component", "An area with effective solid waste management but no requirement for functional toilets", "An area certified for having recycled 100% of plastic waste", "An area that has eliminated single-use plastics entirely"], "answer": 0, "explanation": "ODF++ means all toilets in an area are functional and maintained, and faecal sludge/sewage is safely treated instead of being discharged directly into drains or water bodies — building on ODF (no open defecation) and ODF+ (solid/liquid waste management).", "id": "q66"}, {"topic": "Poverty Alleviation Decade", "difficulty": "hard", "type": "figure", "q": "As per the poverty alleviation backgrounder, how did Women's participation in Self-Help Groups (SHGs) under DAY-NRLM change, and what is the current number of SHGs?", "options": ["From 2.37 crore to 10 crore women, with SHGs rising to 91.75 lakh", "From 5 crore to 10 crore women, with SHGs rising to 50 lakh", "From 2.37 crore to 7 crore women, with SHGs rising to 91.75 lakh", "From 1 crore to 10 crore women, with SHGs rising to 1 crore", "From 2.37 crore to 8.5 crore women, with SHGs at 80 lakh"], "answer": 0, "explanation": "Women's SHG participation rose from 2.37 crore to 10 crore, with the number of SHGs rising to 91.75 lakh.", "id": "q67"}, {"topic": "Digital India", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the Digital India Programme, which completes 11 years on 1 July 2026.", "options": ["Digital India was launched on 1 July 2015 and rests on nine pillars including Broadband Highways and e-Governance.", "Digital India was launched on 1 July 2014 and rests on seven pillars.", "UPI handles nearly 30% of worldwide real-time payment transaction volume.", "The digital economy contributes nearly 25-30% of India's GDP currently.", "Broadband Internet subscribers stood at 50 crore at the end of March 2026."], "answer": 0, "explanation": "Digital India launched 1 July 2015 with nine pillars. UPI handles nearly 49% (not 30%) of global real-time transaction volume; the digital economy contributes nearly 12-14% (not 25-30%) of GDP; and broadband subscribers reached 106.58 crore (not 50 crore) by March 2026.", "id": "q68"}, {"topic": "Digital India", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the JAM Trinity's progress by 2026, consider the statements:\n1. Jan Dhan bank accounts increased from 14.72 crore in March 2015 to 57.78 crore by February 2026.\n2. Aadhaar enrolments increased from 0.42 crore in 2010-11 to over 144 crore by March 2026.\n3. As of June 2026, Direct Benefit Transfers worth over ₹51 lakh crore have been transferred to 176 crore citizens.\n4. Ranjna Sonawane, a tribal woman from Tembhali village in Maharashtra, became the first Aadhaar holder.\nWhich of the statements given above is/are correct?", "options": ["1, 2, 3 and 4", "1, 2 and 3 only", "2, 3 and 4 only", "1 and 4 only", "None of the above"], "answer": 0, "explanation": "All four statements accurately reflect the JAM Trinity milestones described in the Digital India backgrounder.", "id": "q69"}, {"topic": "Digital India", "difficulty": "moderate", "type": "notamong", "q": "Which of the following is NOT one of the Nine Pillars of Digital India explicitly listed in the backgrounder?", "options": ["Broadband Highways", "e-Kranti: Electronic Delivery of Services", "Information for All", "Electronics Manufacturing", "Cybersecurity and Data Protection"], "answer": 4, "explanation": "The nine pillars listed are: Broadband Highways, Universal Access to Mobile Connectivity, Public Internet Access Programme, e-Governance, e-Kranti, Information for All, Electronics Manufacturing, IT for Jobs, and Early Harvest Programmes. 'Cybersecurity and Data Protection' is not one of the nine named pillars.", "id": "q70"}, {"topic": "Digital India", "difficulty": "moderate", "type": "figure", "q": "UMANG, the single digital gateway for government services, expanded from how many services in 2017 to how many by June 2026?", "options": ["166 services to 2,572 services", "100 services to 2,000 services", "166 services to 1,500 services", "500 services to 2,572 services", "166 services to 3,000 services"], "answer": 0, "explanation": "UMANG expanded from 166 services in 2017 to 2,572 services by June 2026, with transactions growing from 3.9 crore to 796.69 crore.", "id": "q71"}, {"topic": "Digital India", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the IndiaAI Mission, consider the statements:\n1. It was approved with an outlay of over ₹10,300 crore (cited as ₹10,372 crore in another part of the same document).\n2. Its shared compute facility has established over 45,000 GPUs.\n3. Under the AI Foundation Model pillar, 15 Large Language Models and Small Language Models are supported.\n4. India hosted the IndiaAI Impact Summit in February 2026, becoming the first Global South country to host a global AI summit.\nWhich of the statements given above is/are correct?", "options": ["1, 2, 3 and 4", "1, 2 and 3 only", "2, 3 and 4 only", "1 and 4 only", "None of the above"], "answer": 0, "explanation": "All four statements are accurate; the source itself gives IndiaAI Mission's outlay as both 'over ₹10,300 crore' and 'over ₹10,372 crore' in different sections, both of which round to the same approved allocation.", "id": "q72"}, {"topic": "Digital India", "difficulty": "moderate", "type": "acronym", "q": "What does 'MY Bharat' (Mera Yuva Bharat), launched on 31 October 2023, primarily function as?", "options": ["India's largest Digital Public Infrastructure (DPI) for youth, connecting them to volunteering, internships, jobs and skilling opportunities", "A digital wallet exclusively for storing academic certificates", "A government job portal limited to Central Government recruitment", "A tourism promotion platform for young travellers", "A mobile banking app for rural youth"], "answer": 0, "explanation": "MY Bharat is India's largest DPI for youth, launched 31 October 2023, connecting young citizens to volunteering, experiential learning, internships, jobs and skill development opportunities. It also set a Guinness World Record for 'Most Users to Take an Online Quiz in One Week'.", "id": "q73"}, {"topic": "Digital India", "difficulty": "easy", "type": "figure", "q": "India's Global Innovation Index (GII) ranking improved from which position in 2015 to which position in 2025?", "options": ["81st to 38th", "91st to 48th", "81st to 25th", "100th to 50th", "81st to 42nd"], "answer": 0, "explanation": "India's Global Innovation Index ranking improved from 81st in 2015 to 38th in 2025.", "id": "q74"}, {"topic": "DIKSHA", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the DIKSHA platform.", "options": ["DIKSHA was launched in 2017 by NCERT in collaboration with CIET, and supports 135 languages including 128 Indian and 7 foreign languages.", "DIKSHA was launched in 2020 exclusively for teacher training, not for students.", "DIKSHA supports only 22 scheduled Indian languages with no foreign language content.", "The highest number of registered DIKSHA users are in Maharashtra with 26.80 lakh users.", "DIKSHA does not provide any accessibility features for differently-abled learners."], "answer": 0, "explanation": "DIKSHA was launched in 2017, spearheaded by NCERT with CIET, and supports 135 languages (128 Indian + 7 foreign). It serves both students and teachers (via NISHTHA); it includes DAISY, text-to-speech and ISL video accessibility features; and Uttar Pradesh (not Maharashtra) has the highest registered users at 26.80 lakh.", "id": "q75"}, {"topic": "GST (9 Years)", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about GST reforms as GST completes nine years since its 1 July 2017 launch.", "options": ["GST subsumed 17 different taxes and 13 cesses into a common framework.", "GST taxpayers increased from 1.65 crore in 2017 to 66.5 lakh in May 2026.", "The Next-Gen GST reforms (GST 2.0) simplified the structure to a three-slab system of 5%, 12% and 18%.", "GSTN is a fully (100%) Central Government owned company.", "IGST rates are generally half of CGST/SGST rates."], "answer": 0, "explanation": "GST subsumed 17 taxes and 13 cesses. Taxpayer growth is the reverse of stated — from 66.5 lakh (2017) to 1.65 crore (May 2026); GST 2.0 simplified to a TWO-slab structure (5% and 18%, plus a 40% special rate for luxury/sin goods); GSTN is 50% Centre : 50% State owned; and IGST rates are generally 2x (not half of) CGST/SGST rates.", "id": "q76"}, {"topic": "GST (9 Years)", "difficulty": "hard", "type": "combo", "q": "Instruction: Regarding the Next-Generation GST Reforms 2025 (effective 22 September 2025), consider the statements:\n1. GST was simplified to a two-slab structure of 5% and 18%.\n2. A 40% rate was introduced on luxury and sin goods including tobacco, aerated drinks and private aircrafts.\n3. Life-saving drugs and medicines were reduced from 12% to Nil or 5%.\n4. Two-wheelers, small cars, TVs, ACs and cement were cut from 18% to 12%.\nWhich of the statements given above is/are correct?", "options": ["1, 2 and 3 only", "1, 2, 3 and 4", "2, 3 and 4 only", "1 and 3 only", "All are correct"], "answer": 0, "explanation": "Two-wheelers, small cars, TVs, ACs and cement were cut from 28% to 18% (not from 18% to 12%), making statement 4 incorrect. Statements 1, 2 and 3 are accurate.", "id": "q77"}, {"topic": "Kisan Sarathi", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about the Kisan Sarathi platform.", "options": ["Launched in July 2021, it is a joint initiative of MeitY and the Ministry of Agriculture, powered by the Interactive Information Dissemination System (IIDS).", "Launched in July 2018, it is run solely by the Ministry of Agriculture without any technology partner.", "As of June 2026, Kisan Sarathi connects farmers with only 100 KVKs and no ICAR institutes.", "Kisan Sarathi offers live interaction in only 2 regional languages.", "As of June 25, 2026, all 610 schemes on the portal are central government schemes."], "answer": 0, "explanation": "Kisan Sarathi, launched July 2021, is a joint initiative of MeitY and the Ministry of Agriculture and Farmers Welfare, powered by IIDS. It connects farmers with 730+ KVKs, 100+ ICAR institutes and 65+ agricultural universities; offers live interaction in 13 regional languages; and of the 610 schemes on the portal (as of 25 June 2026), only 102 are central government schemes — the rest are state/UT schemes.", "id": "q78"}, {"topic": "Kisan Sarathi", "difficulty": "hard", "type": "figure", "q": "As of 25 June 2026, what is Kisan Sarathi's reach in terms of states/UTs, districts and villages, and its registered farmer base?", "options": ["36 States/UTs, 768 districts, 6.63 lakh villages; 2.95 crore registered farmers", "28 States/UTs, 500 districts, 4 lakh villages; 1.5 crore registered farmers", "36 States/UTs, 600 districts, 6.63 lakh villages; 3.5 crore registered farmers", "36 States/UTs, 768 districts, 3 lakh villages; 2.95 crore registered farmers", "30 States/UTs, 768 districts, 6.63 lakh villages; 2 crore registered farmers"], "answer": 0, "explanation": "As of 25 June 2026, Kisan Sarathi is available in 36 States/UTs, across 768 districts and 6.63 lakh villages, with 2.95 crore registered farmers (56.16 lakh of them women).", "id": "q79"}, {"topic": "Tech Ecosystem", "difficulty": "moderate", "type": "stmt", "q": "Pick the ONE CORRECT statement about India's emerging technology missions.", "options": ["The National Supercomputing Mission, launched in 2015 with an outlay of ₹4,500 crore, has deployed 38 supercomputers with 47 petaflops of combined computing power.", "The Semicon India Programme was launched in December 2019 with an outlay of ₹1,00,000 crore.", "The National Quantum Mission was approved in 2021 with an outlay of ₹10,300 crore.", "The National Blockchain Framework was initiated by NITI Aayog in 2018 with an outlay of ₹100 crore.", "India Semiconductor Mission (ISM) 2.0 was announced with an initial outlay of ₹10,000 crore for FY2026-27."], "answer": 0, "explanation": "NSM (2015, ₹4,500 crore) has deployed 38 supercomputers totaling 47 petaflops. Semicon India was launched in December 2021 with ₹76,000 crore; the National Quantum Mission was approved in April 2023 with ₹6,003.65 crore; the National Blockchain Framework was initiated by MeitY (not NITI Aayog) in 2021 with ₹64.76 crore; and ISM 2.0's initial FY2026-27 outlay was ₹1,000 crore, not ₹10,000 crore.", "id": "q80"}, {"topic": "Tech Ecosystem", "difficulty": "moderate", "type": "acronym", "q": "What does 'C2S', the semiconductor talent-pipeline programme launched by MeitY in 2022, stand for?", "options": ["Chips to Start-up", "Centre to Semiconductor", "Compute to Silicon", "Core to System", "Circuit to Silicon"], "answer": 0, "explanation": "C2S stands for Chips to Start-up, launched by MeitY in 2022 with an outlay of ₹250 crore over five years.", "id": "q81"}, {"topic": "Tech Ecosystem", "difficulty": "hard", "type": "notamong", "q": "Which of the following is NOT one of the four key focus areas of the National Quantum M
