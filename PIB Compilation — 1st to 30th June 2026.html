  set: [],            // active question objects for this run
  setLabel: '',
  order: 'pdf',        // 'pdf' | 'shuffled'
  idx: 0,
  score: 0,
  answers: [],         // {qid, status: 'correct'|'wrong'|'skipped', chosen}
  locked: false,
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function topicCounts(){
  const m = {};
  QUESTIONS.forEach(q=>{ m[q.topic]=(m[q.topic]||0)+1; });
  return m;
}

/* ================= render router ================= */
function render(){
  const app = document.getElementById('app');
  if(state.screen==='home') app.innerHTML = renderHome();
  else if(state.screen==='practice-config') app.innerHTML = renderPracticeConfig();
  else if(state.screen==='section-grid') app.innerHTML = renderSectionGrid();
  else if(state.screen==='quiz') app.innerHTML = renderQuiz();
  else if(state.screen==='end') app.innerHTML = renderEnd();
  attachHandlers();
  window.scrollTo(0,0);
}

/* ================= HOME ================= */
function renderHome(){
  return `
    <p class="eyebrow">PIB Compilation — 1st to 30th June 2026</p>
    <h1 class="title">ESI / GA Practice Quiz</h1>
    <p class="sub">A NABARD Grade A style mock, drawn directly from the June 2026 PIB compilation — schemes, reports, international bodies and current affairs. Choose how you'd like to practice.</p>

    <div class="mode-grid">
      <div class="mode-card" data-action="go-practice">
        <div class="num">01</div>
        <h3>Full Practice Test</h3>
        <p>All ${QUESTIONS.length} questions, in document order or shuffled. The complete mock.</p>
      </div>
      <div class="mode-card" data-action="go-sections">
        <div class="num">02</div>
        <h3>Section-wise Revision</h3>
        <p>Drill a single topic at a time — heritage, health, agriculture, space, and more.</p>
      </div>
      <div class="mode-card" data-action="go-schemes">
        <div class="num">03</div>
        <h3>Schemes-Only Sprint</h3>
        <p>Just the scheme and organisation questions — numbered-statement, not-among and acronym types.</p>
      </div>
    </div>

    <p class="home-footer-note">${QUESTIONS.length} questions across ${Object.keys(topicCounts()).length} topics. Works fully offline.</p>
  `;
}

/* ================= PRACTICE CONFIG ================= */
function renderPracticeConfig(){
  return `
    <p class="eyebrow"><a class="linklike" data-action="go-home">&larr; Back to menu</a></p>
    <h1 class="title">Full Practice Test</h1>
    <p class="sub">Work through all ${QUESTIONS.length} questions.</p>

    <div class="panel">
      <div class="eyebrow" style="margin-bottom:2px;">Question order</div>
      <div class="toggle-row">
        <div class="toggle-opt ${state.order==='pdf'?'active':''}" data-action="set-order" data-order="pdf">PDF Order</div>
        <div class="toggle-opt ${state.order==='shuffled'?'active':''}" data-action="set-order" data-order="shuffled">Shuffled</div>
      </div>
      <p class="count-line">${QUESTIONS.length} questions total.</p>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="start-practice">Start Test</button>
      </div>
    </div>
  `;
}

/* ================= SECTION GRID ================= */
function renderSectionGrid(){
  const counts = topicCounts();
  const topics = Object.keys(counts).sort();
  const tiles = topics.map(t=>`
    <div class="section-tile" data-action="start-section" data-topic="${escapeAttr(t)}">
      <span>${escapeHtml(t)}</span>
      <span class="cnt">${counts[t]}</span>
    </div>
  `).join('');
  return `
    <p class="eyebrow"><a class="linklike" data-action="go-home">&larr; Back to menu</a></p>
    <h1 class="title">Section-wise Revision</h1>
    <p class="sub">Tap a topic to practice just those questions.</p>
    <div class="section-grid">${tiles}</div>
  `;
}

/* ================= QUIZ ================= */
function renderQuiz(){
  const total = state.set.length;
  const q = state.set[state.idx];
  const answered = state.answers[state.idx];
  const pct = Math.round(((state.idx)/total)*100);

  const optionsHtml = q.options.map((opt,i)=>{
    let cls = 'option';
    if(answered){
      cls += ' locked';
      if(i===q.answer) cls += ' correct';
      else if(answered.chosen===i) cls += ' wrong';
      else cls += ' dim';
    }
    return `<div class="${cls}" data-action="${answered?'':'choose'}" data-i="${i}">
      <span class="letter">${String.fromCharCode(65+i)}</span>
      <span>${escapeHtml(opt)}</span>
    </div>`;
  }).join('');

  let feedback = '';
  if(answered){
    let boxClass = answered.status;
    let verdict = answered.status==='correct' ? 'Correct.' : (answered.status==='wrong' ? 'Not quite.' : 'Skipped.');
    feedback = `<div class="feedback-box ${boxClass}">
      <span class="verdict">${verdict}</span>
      ${escapeHtml(q.explanation)}
    </div>`;
  }

  return `
    <div class="quiz-top">
      <span class="quiz-meta">${escapeHtml(state.setLabel)} — Question ${state.idx+1} of ${total}</span>
      <span class="quiz-score">Score: ${state.score}/${state.idx + (answered?1:0)}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

    <div class="diff-badge ${q.difficulty}">${capitalize(q.difficulty)}</div>
    <div class="passage">${escapeHtml(q.q)}</div>

    <div class="options">${optionsHtml}</div>

    ${feedback}

    <div class="quiz-actions">
      <button class="btn btn-ghost" data-action="skip" ${answered?'disabled':''}>Skip</button>
      <button class="btn btn-primary" data-action="next" ${answered?'':'disabled'}>${state.idx+1===total ? 'Finish' : 'Next'}</button>
    </div>
  `;
}

/* ================= END SCREEN ================= */
function renderEnd(){
  const total = state.set.length;
  const correct = state.answers.filter(a=>a.status==='correct').length;
  const wrong = state.answers.filter(a=>a.status==='wrong').length;
  const skipped = state.answers.filter(a=>a.status==='skipped').length;

  const byDiff = {easy:{c:0,t:0},moderate:{c:0,t:0},hard:{c:0,t:0}};
  state.set.forEach((q,i)=>{
    const d = q.difficulty;
    if(!byDiff[d]) byDiff[d]={c:0,t:0};
    byDiff[d].t++;
    if(state.answers[i] && state.answers[i].status==='correct') byDiff[d].c++;
  });

  const pct = total? Math.round((correct/total)*100) : 0;

  const missed = state.set.map((q,i)=>({q,a:state.answers[i]}))
    .filter(x=>x.a && x.a.status!=='correct');

  const reviewHtml = missed.map(({q,a})=>{
    const isSkip = a.status==='skipped';
    return `<div class="review-item ${isSkip?'skipped-item':''}">
      <div class="rq">${escapeHtml(q.q)}</div>
      <div class="ra">Correct answer: ${String.fromCharCode(65+q.answer)}. ${escapeHtml(q.options[q.answer])}</div>
      <div class="re">${escapeHtml(q.explanation)}</div>
    </div>`;
  }).join('');

  return `
    <p class="eyebrow">${escapeHtml(state.setLabel)} — complete</p>
    <div class="score-hero">
      <div class="big">${correct} / ${total}</div>
      <div class="lbl">${pct}% correct &nbsp;·&nbsp; ${wrong} missed &nbsp;·&nbsp; ${skipped} skipped</div>
    </div>

    <div class="breakdown">
      ${['easy','moderate','hard'].map(d=>{
        const b = byDiff[d] || {c:0,t:0};
        return `<div class="bd-item"><div class="n">${b.t? b.c+'/'+b.t : '—'}</div><div class="l">${capitalize(d)}</div></div>`;
      }).join('')}
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" data-action="retry-set">Retry Same Set</button>
      <button class="btn" data-action="go-home">Back to Menu</button>
    </div>

    ${missed.length ? `<h3 style="font-family:var(--serif);font-weight:400;margin-top:34px;">Review — missed &amp; skipped (${missed.length})</h3>
    <div class="review-list">${reviewHtml}</div>` : ''}
  `;
}

/* ================= handlers ================= */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = (e)=>{
      const action = el.getAttribute('data-action');
      handleAction(action, el);
    };
  });
}

function handleAction(action, el){
  if(action==='go-home'){ state.screen='home'; render(); return; }
  if(action==='go-practice'){ state.screen='practice-config'; render(); return; }
  if(action==='go-sections'){ state.screen='section-grid'; render(); return; }
  if(action==='go-schemes'){ startSchemesSprint(); return; }
  if(action==='set-order'){ state.order = el.getAttribute('data-order'); render(); return; }
  if(action==='start-practice'){ startPractice(); return; }
  if(action==='start-section'){ startSection(el.getAttribute('data-topic')); return; }
  if(action==='choose'){ chooseOption(parseInt(el.getAttribute('data-i'),10)); return; }
  if(action==='skip'){ skipQuestion(); return; }
  if(action==='next'){ nextQuestion(); return; }
  if(action==='retry-set'){ retrySet(); return; }
}

function startPractice(){
  let set = QUESTIONS.slice();
  if(state.order==='shuffled') set = shuffle(set);
  beginRun(set, 'Full Practice Test' + (state.order==='shuffled' ? ' (Shuffled)' : ' (PDF Order)'));
}

function startSection(topic){
  const set = QUESTIONS.filter(q=>q.topic===topic);
  beginRun(set, topic);
}

function startSchemesSprint(){
  const set = QUESTIONS.filter(q=> q.type==='combo' || q.type==='notamong' || q.type==='acronym');
  beginRun(shuffle(set), 'Schemes-Only Sprint');
}

function beginRun(set, label){
  state.set = set;
  state.setLabel = label;
  state.idx = 0;
  state.score = 0;
  state.answers = new Array(set.length).fill(null);
  state.screen = 'quiz';
  render();
}

function retrySet(){
  state.idx = 0;
  state.score = 0;
  state.answers = new Array(state.set.length).fill(null);
  state.screen = 'quiz';
  render();
}

function chooseOption(i){
  if(state.answers[state.idx]) return;
  const q = state.set[state.idx];
  const correct = (i===q.answer);
  state.answers[state.idx] = {chosen:i, status: correct?'correct':'wrong'};
  if(correct) state.score++;
  render();
}

function skipQuestion(){
  if(state.answers[state.idx]) return;
  state.answers[state.idx] = {chosen:null, status:'skipped'};
  render();
}

function nextQuestion(){
  if(!state.answers[state.idx]) return;
  if(state.idx+1 >= state.set.length){
    state.screen = 'end';
    render();
  } else {
    state.idx++;
    render();
  }
}

/* ================= utils ================= */
function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .split(String.fromCharCode(10)).join('<br>');
}
function escapeAttr(s){
  return String(s).replace(/"/g,'&quot;');
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

render();
</script>
</body>
</html>
